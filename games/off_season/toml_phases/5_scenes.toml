# =============================================================================
# Off Season — 5_scenes
#
# TENANT-SCOPED. Four ladders, four people, FOUR DIFFERENT METER SHAPES. This is
# the file that dies with a character; the room they stand in is in 3_activities
# and survives them.
#
# ⚠️ RUNG CANVASES ARE TRIGGERLESS and reached by node link from a hub
#    (`nodeId = "<canvas>.<node>"`). A triggerless link-target inherits its
#    location and repeatability from whatever links to it, so its prose still
#    counts to the room. Two NPC-bound canvases at the same location in the same
#    window would collide (engine.md §19) — this is how you get depth without
#    the collision, and without widening the room's list.
#
# ⚠️ EVERY RUNG IS BRAKED, and with TWO levers, not one (the-meters.md M4):
#    a `costs` entry the engine enforces by refusing the choice, AND a
#    `<npc>_rung_today` flag cleared in [engine.daily_tick]. Measured failure:
#    a game shipped three correctly-gated tiers with no brake on any of them and
#    moved a meter 4 -> 16 in twelve clicks of one free choice, topping out all
#    three tiers inside two in-game days, and scored 22/24.
#
# ⚠️ NOT `max_triggers_per_day` — that is read off the TRIGGER (v2.py:11017) and
#    a triggerless rung has none. It does nothing here. M5.
#
# ⚠️ THE HUB OPENER IS ONE CONSTANT PARAGRAPH. Do not tier it into bands per
#    meter — an arc whose base node rewrites itself per stat band reads as N
#    different scenes instead of one escalating hub. What moves on re-entry is
#    the CHOICE LIST and the presence line, not the identity sentence.
# =============================================================================


# ═════════════════════════════════════════════════════════════════════════════
# TAM — THE SPINE. `ease` (access) -> `want` (willingness), warmed by arousal.
# The rich two-meter model, spent on the one arc that carries the game.
#
# His surface is the game's most re-entered, so it is where the crudest writing
# lives (the-want.md §6). The measured failure inverted exactly this: 95% of one
# game's explicit prose sealed in a room with no exits, and all nine of its
# repeatable loops scoring zero.
# ═════════════════════════════════════════════════════════════════════════════

[[canvases]]
id          = "hub_tam_flat"
name        = "Tam"
description = "Standing hub @the_chip_shop_flat, 08:00-15:00, gated by his schedule row via requires_npc. Repeatable. The ease rungs are always open and band at 4 / 8 / 12 / 20; the want rungs need tam_saw_you; the act loop needs want >= 22; and the locked door sits inside the act menu at want >= 90."

# ⚠️ GATED ON THE MEETING, and it carried NO CONDITION AT ALL until 2026-08-22 --
#    the portrait was live on turn one and the hub's own first paragraph was
#    standing in for an introduction. the-first-hour.md F5: a hub sits behind a
#    meeting. One flag per character (F8), set by canvas_meet_{who} and read by
#    nothing else.
[canvases.trigger]
location      = "the_chip_shop_flat"
requires_npc  = "npc_tam"
npc           = "npc_tam"
is_repeatable = true
priority      = 6
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "met_tam", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "Tam"
blocks = [
  { type = "image", props = { file = "portraits/tam.jpg", description = "A nineteen year old man lying on top of the covers in a hot small flat in daylight.", search_queries = ["young man lying on bed shirtless daylight small room", "teenager on bed small flat window light"] } },
  { type = "paragraph", content = "He is on top of the covers with the extractor going through the wall. Nights finish at six, he is in bed by seven, and he does not properly sleep until about noon." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tam" }, content = "You can come in, you know. You do this thing where you stand on the top step." },
]

[canvases.nodes.exit_block]
type = "choices"

# ⚠️ THE DAY-CAP FLAG IS SET HERE, ON THE CHOICE — never on the rung's exit.
#    A choice runs its flagEffects BEFORE advanceTime (v2.py:12648-12733); a node
#    exit runs them AFTER it (v2.py:13085-13088), and advanceTime rolls the day
#    inside itself (v2.py:5411-5414), which is where [engine.daily_tick] clears
#    the flag. An exit-set cap on a rung that crosses midnight therefore lands on
#    the NEW day and locks it out. the-meters.md M5.
[[canvases.nodes.exit_block.choices]]
text        = "Stay past the tea."
targetType  = "node"
nodeId      = "rung_tam_tea.base"
costs       = [ { trait = "energy", value = 6 } ]
flagEffects = [ { targetType = "player", flag = "tam_rung_today", op = "set" } ]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tam_rung_today", operator = "is_false" },
] }

[[canvases.nodes.exit_block.choices]]
text        = "Ask him about his dad."
targetType  = "node"
nodeId      = "talk_tam_dad.base"
costs       = [ { trait = "energy", value = 3 } ]
flagEffects = [ { targetType = "player", flag = "tam_talk_today", op = "set" } ]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tam_talk_today", operator = "is_false" },
] }

[[canvases.nodes.exit_block.choices]]
