  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_roan", trait_key = "bond", operator = "gte", value = 18 },
      { type = "trait", subject = "npc", npc_id = "npc_roan", trait_key = "bond", operator = "lt",  value = 32 },
    ] } }, blocks = [
    { type = "paragraph", content = "He waits at the shelter now instead of the rail. It is out of the wind and it is in view of eleven back windows." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_roan" }, content = "I've stopped minding who sees. It took me a while to work out how to say that." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_roan", trait_key = "bond", operator = "gte", value = 32 },
    ] } }, blocks = [
    { type = "paragraph", content = "He does not set off when you get to him. He stands with his hands out of his pockets and waits to be told what the morning is." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_roan" }, content = "You say. I've got nowhere to be and I've had nowhere to be for two years." },
  ] },
