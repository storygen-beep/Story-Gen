# ── 5 · HER COUNTER, MONDAY 19:00-20:30. THE ANCHOR'S SECOND PERSON.
#
# ⚠️ THIS CANVAS NARRATES NO PAYMENT AND CARRIES NO MONEY EFFECT, and the rule
#    is not a style note. the-economy.md R3: if [settings.rent] is doing the
#    charging, do NOT also author a canvas that narrates the payment -- write
#    the scene beside it, the evening after or the ask before. A shipped game
#    wrote the hand-over next to a working [settings.rent] and created a free,
#    repeatable relation faucet that gate 16 could not see.
#
#    Verified rather than assumed: rent_state.is_due is set at MIDNIGHT on the
#    due day (v2.py:5464) and the RentDay page intercepts on the next Location_
#    or Navigation passage (v2.py:15258). So the ninety has already changed
#    hands on Monday MORNING, hours before this row puts him here. This is the
#    evening after -- he does not leave, and the building's hours start being
#    his. That is the `hold` arc with no money moving at all.
[[canvases]]
id          = "hub_ewan_counter"
name        = "Ewan"
description = "Standing hub @the_arcade, windowed to his Monday 19:00-20:30 row. hold, with the stool itself banded at 32. THE EVENING AFTER THE MONEY, never the transaction -- no cost, no money effect, no hand-over (the-economy.md R3). The anchor's second person surface."

