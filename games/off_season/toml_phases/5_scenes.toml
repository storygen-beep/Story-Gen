# ── 6 · THE BACK ROOM AT NIGHT, 22:00-08:00. THE GAP BATCH 2 OPENED.
#
# Her day hub was windowed to 12:00-15:00 in repair batch 2 so it would stop
# saying she was awake and talking during the ten hours she is asleep -- and
# that batch recorded the cost honestly: her night row then had no surface at
# all. the-surfaces.md R1, one canvas per (who x when), says the answer is a
# SECOND canvas rather than a wider window. This is it.
#
# ⚠️ AT want >= 18 SHE IS NOT ASLEEP AND DOES NOT PRETEND TO BE. That is the
#    game's own existing move (walkin_chip_wakes: "He was not asleep and does
#    not pretend he was") and it is the honest version of this beat -- the arc
#    is that she has noticed Marnie cannot stop looking, not that Marnie is
#    looking at someone who does not know.
