blocks = [
  { type = "image", props = { file = "portraits/roan.jpg", description = "A man in his mid thirties walking a windy seaside promenade in winter.", search_queries = ["man walking seafront promenade winter coat grey", "man mid thirties walking empty seaside front"] } },
  { type = "paragraph", content = "He walks the length of it and back every morning with his hands in his pockets and no reason to. You can see him from the change booth doing it, and he knows you can." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_roan" }, content = "Two hundred and eighty steps that way. I counted. Don't tell anyone I counted." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_roan", trait_key = "bond", operator = "lt", value = 18 },
    ] } }, blocks = [
