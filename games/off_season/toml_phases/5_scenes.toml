targetType  = "node"
nodeId      = "rung_tam_nothing.base"
costs       = [ { trait = "energy", value = 8 } ]
flagEffects = [ { targetType = "player", flag = "tam_rung_today", op = "set" } ]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key = "tam_saw_you",     operator = "is_true" },
  { type = "flag",  subject = "player", flag_key = "tam_rung_today",  operator = "is_false" },
  { type = "trait", subject = "npc", npc_id = "npc_tam", trait_key = "ease", operator = "gte", value = 20 },
