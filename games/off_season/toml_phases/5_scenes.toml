# ⚠️ RUNG CANVASES ARE TRIGGERLESS and reached by node link from a hub
#    (`nodeId = "<canvas>.<node>"`). A triggerless link-target inherits its
#    location and repeatability from whatever links to it, so its prose still
#    counts to the room. Two NPC-bound canvases at the same location in the same
#    window would collide (engine.md §19) — this is how you get depth without
#    the collision, and without widening the room's list.
