# ═════════════════════════════════════════════════════════════════════════════
# THE ROOMS THAT HAD NOBODY IN THEM — REVIEW_1 P1/P2. NEW 2026-08-22.
#
# Six [[npcs.schedules]] rows put a character in a room and NOTHING in that room
# was clickable. Three locations -- the_front, harbour_end, terrace_row -- had
# zero clickable content of any kind, and the anchor had no surface for EITHER
# of the two people the board declares in it.
#
# ⚠️ IT IS WORSE THAN AN EMPTY ROOM, because the nav card advertises them.
#    getNpcsPresentAtLocation (v2.py:19350, :19374) renders a portrait badge for
#    every scheduled NPC regardless of whether anything there is clickable, and
#    the generator's own comment says the two "intentionally differ ... for
#    hub-less occupancy rooms". The player saw Ewan's face on the Harbour End
#    card, paid the 15-minute walk, and arrived at a coin-flip ambient.
#
# Nothing below is invented. v2_state.json board.locations[].serves already named
# the person for five of the six; the build never delivered them.
#
# ⚠️ EVERY ONE IS GATED ON met_<npc>. `every hub is met first` fails a character
#    if ANY of their hubs is ungated (_fh_cast_met clause (b)), so a second hub
#    with no condition would undo batch 3 for that character.
#
# ⚠️ EVERY RUNG SHARES THAT CHARACTER'S EXISTING <npc>_rung_today, set ON THE
#    CHOICE (batch 1). One interaction with a person per day across ALL their
#    surfaces -- going to Ewan at the slip at seven spends the same day as going
#    to the yard at noon. That is the pacing, not an oversight.
# ═════════════════════════════════════════════════════════════════════════════

# ── 1 · THE PROMENADE. The root location, and it had never had one clickable
#        thing on it. He walks its length 09:00-11:00 every day "because there is
#        nothing else to do with a morning", and she crosses the front to get
#        anywhere at all.
