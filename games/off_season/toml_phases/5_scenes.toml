#    three tiers inside two in-game days, and scored 22/24.
#
# ⚠️ NOT `max_triggers_per_day` — that is read off the TRIGGER (v2.py:11017) and
#    a triggerless rung has none. It does nothing here. M5.
#
# ⚠️ THE HUB OPENER IS ONE CONSTANT PARAGRAPH. Do not tier it into bands per
#    meter — an arc whose base node rewrites itself per stat band reads as N
#    different scenes instead of one escalating hub. What moves on re-entry is
#    the CHOICE LIST and the presence line, not the identity sentence.
# =============================================================================


