# =============================================================================
# Off Season — 3_activities
#
# ROOM-SCOPED STANDING SURFACES. Everything in this file belongs to the ROOM and
# survives a cast rotation: the meter, the counter, the turnaround, the pan on
# the hob, the mattress in the let. Content that belongs to a PERSON lives in
# 5_scenes.toml and dies with them. That split is what makes the rotating slot
# cost one [[npcs]] block instead of a rewrite (the-board.md §2) — so nothing in
# here ever says "Nessa". The room says "the lodger".
#
# ⚠️ A ROOM'S LIST IS NEEDS + WORK + PEOPLE, AND NOTHING ELSE (the-surfaces.md
#    R2). Not objects. The previous rule declared the things in the room and
#    hung a choice off each one, and it shipped a kitchen with a six-choice
#    browse screen on top of four activities covering the same things. A body
#    needs about five things; a room contains fifty nouns. The airer and the
#    burn on the table belong INSIDE a beat, read in context, not scanned in a
#    menu. Field median for things-to-do-at-a-place: 3.
#
# ⚠️ engine.md §19 — one repeatable canvas per location + NPC + time window. The
#    three counter bands at the arcade are all UNBOUND, so their windows must
#    not overlap: 08:00-13:00 / 13:00-19:00 / 21:00-01:00.
#
# ⚠️ THE CRUDE REGISTER LIVES HERE, not in the one-shots — these are the
#    surfaces the player re-enters fifty times. An explicit beat stays on the
#    body for its whole length; the interiority gets its OWN beat afterwards.
#
# ⚠️ ONE ASSET, ONE BLOCK — no pool_dir is reused across two media blocks.
#
# ⚠️ EVERY `money` EFFECT CARRIES clamp = false (engine.md §21). Clamped, money
#    caps at 100 and the $90 Monday draw becomes unpayable, and every gate
#    stays green the whole way down.
# =============================================================================


# ═════════════════════════════════════════════════════════════════════════════
# YOUR FLAT — the body. Sleep, the meter, and the only door she can shut.
# NEEDS SERVED: energy, warmth.
# ═════════════════════════════════════════════════════════════════════════════

# ── NEED: energy ─────────────────────────────────────────────────────────────
[[canvases]]
id          = "act_flat_sleep"
name        = "Sleep"
description = "NEED (energy) @the_flat, repeatable, evenings and nights. Restores energy, capped at 100. Cold sleep and warm sleep are two [group] bands on warmth — a read-out of a RECOVERABLE state, which is the one banding the opener is allowed (lanes.md:154-160), not an arc tier."

# ⚠️ NO `slept_today` FLAG. This canvas is LOCATED, so `max_triggers_per_day` is
#    read off its trigger (v2.py:11017) and is a real cap — `markCanvasTriggered`
#    stamps the day key BEFORE advanceTime runs (v2.py:4290), so it is immune to
#    the midnight problem. The flag that used to sit here was set on the exit,
#    AFTER advanceTime had already rolled the day and [engine.daily_tick] had
#    cleared it, so a 21:00 sleep landed at 06:00 with the flag set on the NEW
#    day: from night two onward Sleep was never offered before midnight again.
#    The window is end-EXCLUSIVE too (v2.py:3790-3810), so 21:00-06:00 closes at
#    06:00 on its own. the-meters.md M5.
# ⚠️ show_when_blocked: a windowed activity that simply VANISHES from the room's
#    list reads as a broken game rather than a timetable. Opt in and it renders as
#    a dimmed line carrying this message instead (v2.py:5091-5099 pushes it when
#    isCanvasValid fails -- which includes the SCHEDULE, not just cooldowns; drawn
#    at v2.py:5140). the-clock.md C5 / the-surfaces.md R2. ZERO games in this repo
#    had ever used it before 2026-08-22.
[canvases.trigger]
location             = "the_flat"
is_repeatable        = true
max_triggers_per_day = 1
priority             = 3
is_active            = true
show_when_blocked = true
cooldown_message  = "after nine at night"

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "21:00"
end_time   = "06:00"

[[canvases.nodes]]
id   = "base"
name = "Sleep"
blocks = [
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "warmth", operator = "gte", value = 30 },
    ] } }, blocks = [
    { type = "paragraph", content = "The heater has been on and the room is holding it. You get in in a T-shirt and the sheets are not cold at the foot, and you are asleep inside ten minutes." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "warmth", operator = "lt", value = 30 },
    ] } }, blocks = [
    { type = "paragraph", content = "Nothing in the coin box. You go to bed in a sweater and your socks and the coat over the top of the quilt, and you lie there a long time listening to the sea before it takes." },
  ] },
]
exit_block = { type = "location", text = "Sleep until morning.", config = { destinationType = "specific", locationId = "the_flat", time_progression_minutes = 540, effects = [
  { targetType = "player", trait = "energy", op = "add", value = 85, cap = 100 },
] } }

