[[canvases.nodes]]
id   = "base"
name = "In out of the wind"
blocks = [
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_roan", trait_key = "bond", operator = "lt", value = 12 },
    ] } }, blocks = [
    { type = "paragraph", content = "He comes in off the front with his collar up and stands just inside the door where the warm is, and does not come any further down the floor." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_roan" }, content = "I'm not stopping. I'm just stood here till my hands work." },
    { type = "paragraph", content = "He is stood there twenty minutes. Neither of you says anything else and it is not uncomfortable, and then he goes." },
