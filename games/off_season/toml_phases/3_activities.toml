# ⚠️ PATTERN B — every rule below carries exclusive_group, so the five share ONE
#    dice roll partitioned into cumulative buckets (v2.py:5361-5379) and the
#    chances add to 0.55, leaving the morning itself on screen 45% of the time.
#    Pattern A (no group) would roll five SEPARATE dice (v2.py:5382-5391) and the
#    activity would render 45% x ... = 24% of the time -- the room's own work
#    pushed off its own screen by its texture. the-surfaces.md R3.
#
# ⚠️ A claimed bucket whose target or conditions fail falls through to the HOST,
#    not to the next bucket (v2.py:5374-5377). So a gated branch quietly gives its
#    share back to the morning while its gate is shut, which is why the gated one
#    is last and the ungated ones carry the weight.
[[canvases.trigger.substitutions]]
target_canvas_id = "walkin_arcade_counter"
chance           = 0.15
exclusive_group  = "arcade_morning"
conditions = { version = "1.0", logic = "AND", items = [
