[[canvases]]
id          = "walkin_arcade_kesh"
name        = "The name over the door"
description = "Substitution-only walk-in @the_arcade (afternoon and evening buckets). Somebody reads the sign out loud. the-map.md R4 — the anchor never once said what kind of business it was, and this is the room telling the player whose name is on it without a first-visit canvas doing all the work."

