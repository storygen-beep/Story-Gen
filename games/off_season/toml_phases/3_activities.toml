[[canvases.nodes]]
id   = "base"
name = "The end pusher"
blocks = [
  { type = "paragraph", content = "The end pusher goes over on a payout and sticks, the way it has stuck since October, and the noise it makes doing it is the loudest thing in the building." },
  { type = "paragraph", content = "You get the key off the hook and open the front of it and put your arm in to the shoulder. The shelf has gone over on itself. Coins to the elbow, warm from the motor, and a bus ticket somebody has posted in the slot." },
  { type = "paragraph", content = "You set the shelf straight, shut the front, and it runs clean for about a week. It is always about a week." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "A new coin mechanism is twenty-five and I have done this with my arm instead for four months." },
