  { type = "paragraph", content = "The man Nessa calls the dog man comes in without a dog, the way he does, and stands at the change machine going through his coat pockets for a long time before he finds anything." },
  { type = "dialog", props = { speaker = "npc" }, content = "Two pound. Can you do two pound in tens." },
  { type = "paragraph", content = "You do two pound in tens. He plays the crane, which never pays, and he knows it never pays, and he stands there for forty minutes doing it anyway with his coat still buttoned." },
  { type = "dialog", props = { speaker = "npc" }, content = "Cold out." },
  { type = "dialog", props = { speaker = "player" }, content = "It is." },
  { type = "paragraph", content = "That is the whole of it. He goes when the tens go, and he will be back on Thursday, and neither of you has ever asked the other anything." },
