[[canvases.nodes]]
id   = "base"
name = "The damp over the door"
blocks = [
  { type = "paragraph", content = "The patch over the door has come on again overnight and there is a line of it down the wall now, and the carpet under it has gone dark in a shape about the size of a coat." },
  { type = "paragraph", content = "You put the bucket where the bucket goes. You stand on the chair and press the plaster with two fingers and it gives, which is worse than if it had not." },
  { type = "paragraph", content = "The wind is off the water and the door does not seal, so you do the whole of it with your sleeves wet to the elbow and the front door open behind you." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Four winters. Every year I have told myself I will get somebody up on that roof in the summer, and every summer I am behind the counter fourteen hours a day." },
