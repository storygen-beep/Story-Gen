[[canvases.nodes]]
id   = "base"
name = "The name over the door"
blocks = [
  { type = "paragraph", content = "Two of them off the front, in for the warm, and one of them stands in the doorway and reads the sign backwards through the glass while the other one goes down the pushers." },
  { type = "dialog", props = { speaker = "unknown" }, content = "Kesh. Is that a name or is that a word?" },
  { type = "dialog", props = { speaker = "player" }, content = "It's a name." },
  { type = "dialog", props = { speaker = "unknown" }, content = "Whose?" },
  { type = "paragraph", content = "You tell her it is yours. She looks at the eight-foot letters and then at the woman behind the counter in a cardigan with a bucket by the door, and she is not unkind about it, which is somehow worse than if she had been." },
  { type = "dialog", props = { speaker = "unknown" }, content = "That must be something. Having your name up like that." },
  { type = "dialog", props = { speaker = "player" }, content = "It was my husband's idea." },
  { type = "paragraph", content = "They lose four between them and go back out into it, and the sign stays lit over an empty front for another three hours because the switch for it is outside and you are not going out there twice." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Nobody has asked me that in about nine years. I have had the answer ready the whole time." },
]
exit_block = { type = "location", text = "Get back to the counter.", config = { destinationType = "specific", locationId = "the_arcade", time_progression_minutes = 20 } }



[[canvases]]
