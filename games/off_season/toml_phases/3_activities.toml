[[canvases.nodes]]
id   = "base"
name = "He comes in for the book"
blocks = [
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_ewan", trait_key = "hold", operator = "lt", value = 18 },
    ] } }, blocks = [
    { type = "paragraph", content = "He comes in off the front in his overalls with his hands still black, does not come round the counter, and reads the book upside down where it lies." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ewan" }, content = "That's Tuesday's. Where's Monday's." },
    { type = "paragraph", content = "You turn the page for him. He looks at it for as long as it takes and then says nothing about it at all, which is his way of saying the thing." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_ewan", trait_key = "hold", operator = "gte", value = 18 },
      { type = "trait", subject = "npc", npc_id = "npc_ewan", trait_key = "hold", operator = "lt",  value = 32 },
    ] } }, blocks = [
    { type = "paragraph", content = "He comes round the counter now. He turns the book round to face him, gets the pen out of your hand without asking for it, and writes the week's figure in his own hand under yours." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ewan" }, content = "You've been carrying the Sunday over. Don't carry it over, it makes the month look like something it isn't." },
    { type = "dialog", props = { speaker = "player" }, content = "It's my book." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ewan" }, content = "It is. I'm the one who has to read it." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_ewan", trait_key = "hold", operator = "gte", value = 32 },
    ] } }, blocks = [
    { type = "paragraph", content = "He does not ask for the book. He takes it off the shelf under the till, where he put it, and does the whole week stood at your shoulder with his arm along the counter behind you." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ewan" }, content = "Leave the Thursday. I'll do the Thursday." },
    { type = "thought_bubble", props = { speaker = "player" }, content = "He knows where the book lives because he put it there. I did not put it there and I could not tell you the week that stopped being a thing I noticed." },
  ] },
]
exit_block = { type = "location", text = "Let him get back to the yard.", config = { destinationType = "specific", locationId = "the_arcade", time_progression_minutes = 25, effects = [
