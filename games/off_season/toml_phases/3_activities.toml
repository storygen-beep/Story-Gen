] } }


[[canvases]]
id          = "walkin_arcade_damp"
name        = "The damp over the door"
description = "Substitution-only walk-in @the_arcade (morning bucket). The building failing, quietly, in a way that costs her warmth — the need is declared and this is a route to spending it."

[canvases.trigger]
location             = "the_arcade"
