# =============================================================================
# Off Season — 3_activities
#
# ROOM-SCOPED STANDING SURFACES. Everything in this file belongs to the ROOM and
# survives a cast rotation: the meter, the counter, the turnaround, the pan on
# the hob, the mattress in the let. Content that belongs to a PERSON lives in
# 5_scenes.toml and dies with them. That split is what makes the rotating slot
# cost one [[npcs]] block instead of a rewrite (the-board.md §2) — so nothing in
# here ever says "Nessa". The room says "the lodger".
#
# ⚠️ A ROOM'S LIST IS NEEDS + WORK + PEOPLE, AND NOTHING ELSE (the-surfaces.md
#    R2). Not objects. The previous rule declared the things in the room and
#    hung a choice off each one, and it shipped a kitchen with a six-choice
#    browse screen on top of four activities covering the same things. A body
#    needs about five things; a room contains fifty nouns. The airer and the
#    burn on the table belong INSIDE a beat, read in context, not scanned in a
#    menu. Field median for things-to-do-at-a-place: 3.
#
# ⚠️ engine.md §19 — one repeatable canvas per location + NPC + time window. The
#    three counter bands at the arcade are all UNBOUND, so their windows must
#    not overlap: 08:00-13:00 / 13:00-19:00 / 21:00-01:00.
#
# ⚠️ THE CRUDE REGISTER LIVES HERE, not in the one-shots — these are the
#    surfaces the player re-enters fifty times. An explicit beat stays on the
#    body for its whole length; the interiority gets its OWN beat afterwards.
#
# ⚠️ ONE ASSET, ONE BLOCK — no pool_dir is reused across two media blocks.
#
# ⚠️ EVERY `money` EFFECT CARRIES clamp = false (engine.md §21). Clamped, money
#    caps at 100 and the GBP 90 Monday draw becomes unpayable, and every gate
#    stays green the whole way down.
# =============================================================================


