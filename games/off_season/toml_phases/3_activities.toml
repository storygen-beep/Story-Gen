# ═════════════════════════════════════════════════════════════════════════════
# THE SOLO SURFACE — a NODE-ROUTED LOOP, not a cascade (the-surfaces.md R3b).
#
# A repeatable explicit surface is a loop: the passage SWAPS, so the clip
# changes with the act. A cascade appends, so the clip pins at beat 0 and by
# the time the player reaches the act they are reading it under a picture of
# the setup. This is the single-act shape — one act node, a self-loop, a gated
# finish — which is the cheapest loop that is still a loop.
#
# ⚠️ Loop state is HIDDEN NUMERIC TRAITS, never flags: a flag set inside a
#    triggerless canvas has no located setter and hard-fails the build (§16).
# ⚠️ RESET ON ENTRY AND ON EXIT. Forget either and the next run starts mid-climb.
# ⚠️ GATED ON `warmth gte 30`, written in the POSITIVE form. `warmth lt 30` on a
#    hidden rung would read to gate 10 as a meter that closes more than it opens
#    (gates.py:1990). This is the door the warmth need shuts.
#
# WALK-IN: she is alone here and Tam is scheduled in this flat on Wednesday and
# Saturday evenings. That pairing is a JOIN of the board, not a judgement, and
# gate 30 computes it.
# ═════════════════════════════════════════════════════════════════════════════

