# ═════════════════════════════════════════════════════════════════════════════
# THE THREE STREETS — deliberately COLD, and deliberately RANDOM-ONLY.
#
# Cold: the reference game had no sexual content in 8 of its 25 locations. The
# floor is 60% of locations carrying heat, not 100%, and seven of ten here do.
#
# Random-only, and this is a MECHANICAL consequence worth writing down: gate 30
# qualifies a room when it has a repeatable, location-bound, non-random, non-NPC
# canvas AND a scheduled body. Every location in this game has a scheduled body.
# So putting a solo activity on a street would owe that street a walk-in — and
# a walk-in on a promenade is a worse scene than the four the board already
# earned. `trigger_mode = "random"` is excluded from that join (gates.py
# _walkin_join), so a street full of events owes nothing and still moves.
#
# This is R6 mechanism 4 — an event that replaces the whole screen. Measured
# across five v2 games: 0 · 0 · 0 · 8 · 14 random canvases. It is the cheapest
# of the four mechanisms to author and the one everybody drops.
