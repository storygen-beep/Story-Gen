      { type = "trait", subject = "npc", npc_id = "npc_roan", trait_key = "bond", operator = "lt",  value = 32 },
    ] } }, blocks = [
    { type = "paragraph", content = "He comes down the floor and leans on the end of the counter with both elbows, which is where he stood when this was somebody else's arcade and the pair of you were fifteen and twenty." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_roan" }, content = "The crane's still got that bear in it. That's the same bear." },
    { type = "dialog", props = { speaker = "player" }, content = "It is not the same bear." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_roan" }, content = "It's the same bear and you know it's the same bear." },
