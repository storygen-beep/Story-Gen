# =============================================================================
# Off Season — 2_one_shots
#
# The opening funnel plus the five milestones. A MILESTONE FIRES ONCE AND THEN
# OPENS STANDING CONTENT (gate 7): every one below sets a flag that a standing
# surface in 3_activities or 5_scenes reads. A milestone whose only flag is its
# own once-guard is not a milestone and owes nothing.
#
# ⚠️ engine.md §16 — a flag read by a trigger or a choice must be SET FROM A
#    LOCATED CANVAS or the build hard-fails. Every canvas here declares a
#    trigger.location, so the whole chain resolves.
#
# FIRST EXPLICIT BEAT EARLY, and it is hers. the-release.md § first release:
# the strongest-retained game in the comparison set is explicit on night one,
# two clicks from free roam. Here the first explicit surface is the same scene
# that teaches `warmth` — she puts three in the meter, gets warm for the
# first time in a fortnight, and takes her clothes off in her own flat because
# for once she can. The need and the heat are the same mechanic.
# =============================================================================


# ═════════════════════════════════════════════════════════════════════════════
# THE OPENING — a COLD OPEN, and the shape is a declared choice.
#
# the-first-hour.md F1: the field runs TWO opening shapes and nothing between
# them. A cold open names NOBODY at ~150 words and the cast arrives later as
# content (corpo-life 64, degrees-of-lewdity 193, the-company 126). A staged
# open spends 700-2,600 putting people on screen one at a time, each described
# and SPEAKING. The defect is the middle.
#
# ⚠️ THIS CANVAS WAS THE MIDDLE. It ran 277 words and named SIX people -- Ewan,
#    Tam, "your sister's girl", "your brother", "your mother", "his father" --
#    with none of them on screen, none speaking, and TWO of the six not in the
#    game at all. 46 words per named character against the field's ~229.
#
#    The cast did not get cut; it got MOVED to where a person can be met:
#      the building and the pitch  -> canvas_first_arcade, the anchor's first visit
#      the four of them            -> canvas_meet_* , one each, on screen, speaking
#    What stays here is her situation and the pressure, which is all a cold
#    open carries.
#
# ⚠️ NO CAPSTONE CANVAS (F2). The boot/capstone split exists for an opening that
#    has to carry more than a boot can. canvas_first_arcade IS the capstone and
#    it sits at the NEXT location, which is better: it introduces the room the
#    player is standing in rather than one they have left.
#
# ⚠️ THE HANDOVER IS ARITHMETIC, NOT VIBE (F3). 07:00 + 3 (node->node default,
#    v2.py:13200) + 30 (this exit) = 07:33 at the arcade, where the first-visit
#    canvas auto-fires and spends 30 more -> 08:03, inside work_arcade_morning's
#    08:00-13:00 window. The old funnel landed at 07:36 in a room that opened at
#    08:00 and the player's first free act was pressing a wait button.
#
# ⚠️ Ewan is not named here and the rent does not need him to be: advanceDay()
#    arms the demand when the day rolls TO due_day (engine.md 26) and the game
#    starts ON Monday, so the first charge is a week out. There is a full week
#    to meet him at the yard before he appears at the counter.
#
# SETS season_shut, which arms [settings.rent].
# ═════════════════════════════════════════════════════════════════════════════
[[canvases]]
id          = "canvas_opening"
name        = "Off Season"
description = "Opening. Monday 07:00, the flat. A COLD OPEN (the-first-hour.md F1): ~150 words, NO character named, no cast load. Establishes her, the building with her name on it, the ninety a week due tonight, and the fact that everyone she is related to is inside four hundred yards. Two nodes. SETS season_shut, which arms the Monday draw."

[canvases.trigger]
location      = "the_flat"
is_repeatable = false
priority      = 12
is_active     = true

[[canvases.nodes]]
id   = "the_window"
name = "Monday, seven"
blocks = [
  { type = "image", props = { file = "scenes/flat_morning.jpg", description = "A woman in her late thirties sitting on the edge of a bed in a small cold flat, grey sea light at the window.", search_queries = ["woman sitting edge of bed small flat cold morning window", "middle aged woman bedsit window grey winter light"] } },
  { type = "paragraph", content = "You wake at seven with your breath going up in front of you. The window has run all night and the sill is wet. Out past it the sea is the same colour as the sky and nothing is moving on the front." },
  { type = "paragraph", content = "The meter on the wall says nothing, because there is nothing in it. There has been nothing in it since Thursday, and you have kept your coat on indoors for four days rather than spend the three." },
]
exit_block = { type = "choices", choices = [
  { text = "Get up.", targetType = "node", nodeId = "the_change_bag" },
] }

[[canvases.nodes]]
id   = "the_change_bag"
name = "The change bag"
blocks = [
  { type = "paragraph", content = "Twenty-two in the change bag, most of it in tens and twenties. Ninety comes out of it tonight, because it is Monday, because it is always Monday." },
  { type = "paragraph", content = "Under the window, eight foot of it across the front of your own building: KESH AMUSEMENTS. Your name since you were seventeen, and everyone you are related to lives inside four hundred yards of it." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Nothing opens again until April. Ten weeks of this, and then a season, and then this again." },
]
exit_block = { type = "location", text = "Get the shutter up.", config = { destinationType = "specific", locationId = "the_arcade", time_progression_minutes = 30, flagEffects = [
  { targetType = "player", flag = "season_shut", op = "set" },
] } }


# ═════════════════════════════════════════════════════════════════════════════
# THE ANCHOR'S FIRST VISIT — the-first-hour.md F9, and it does three jobs.
#
# 1. IT SAYS WHAT THE PLACE IS. `amusement arcade`, `slot machine`, `coin
#    pusher`, `change booth` appeared NOWHERE in player-visible prose before
#    this canvas -- only in image_search_queries and in image `description`,
#    which renders as the alt attribute (v2.py:13750) and, with no media on
#    disk, not at all. A human read the built game and asked "what is arcade??"
#    and the game had no answer anywhere in it. The field names the kind of
#    thing in the plainest word it has, immediately: "a suburban town called
#    Onegaron", "Chase-Bank, one of the most prestigious banks in New York
#    city".
#
# 2. IT CATCHES WHAT THE OPENING PUT DOWN. The building and the ninety came out
#    of canvas_opening when that became a cold open; they land here, in the room
#    they are about, and the person who collects is named by ROLE (F7) because
#    the player has not met him yet.
#
# 3. IT CLOSES THE DEAD HALF-HOUR (F3). The funnel lands at 07:33 and
#    work_arcade_morning does not open until 08:00. This canvas is what is live
#    in between -- a non-repeatable, unscheduled, non-random canvas auto-fires
#    on entry (selectAutoFireCanvasForLocation, v2.py:4453) -- and its exit
#    spends 30 minutes, so the player comes out of it at 08:03 with the counter
#    open. The introduction does the waiting.
#
# ⚠️ IT SETS `shutter_up`, AND THE COUNTER READS IT. The three arcade work bands
#    used to gate on `season_shut` -- a flag set UPSTAIRS IN HER FLAT -- so the
#    counter was workable in a building whose shutter was still down. Threading
#    it through here makes the funnel a real chain (flat -> arcade -> the counter
#    opens) and it is the truer rule besides: you cannot work a counter in a
#    shuttered arcade. `work_lets_turnaround` keeps `season_shut`, because the
#    holiday lets are not behind this shutter -- the SEASON being shut is what
#    makes turnarounds her winter work.
#
#    Found by gate 7 (`milestones open something`), which failed this canvas the
#    moment it was written: a one-shot that sets no flag opens nothing and owes
#    an explanation. The gate was right. Widening it to excuse "first visits"
#    was measured first and REJECTED -- a blanket "sets nothing" exemption would
#    have excused 10 canvases across four games, including six mid-arc capstones
#    in the_inheritance and three in vesper that it is correctly catching.
#
# ⚠️ NO SCHEDULE, deliberately. It has to be live at whatever minute the funnel
#    hands over, and it is about the room rather than about a person, so there
#    is no presence to match. The four canvas_meet_* below are the opposite case
#    and every one of them carries a window.
# ═════════════════════════════════════════════════════════════════════════════
[[canvases]]
id          = "canvas_first_arcade"
name        = "Under the letters"
description = "FIRST VISIT @the_arcade, the declared anchor. One-shot, no schedule, priority 11 so it beats anything else valid on entry. Says what an amusement arcade IS in plain words, carries the ninety and the folder across from the cold open, and spends 30 minutes so the funnel's 07:33 handover comes out at 08:03 inside the morning window."

[canvases.trigger]
location      = "the_arcade"
is_repeatable = false
priority      = 11
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "season_shut", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "Under the letters"
blocks = [
  { type = "image", props = { file = "scenes/arcade_shutter_up.jpg", description = "The inside of a small seaside amusement arcade in the morning with the shutter half up and most machines dark.", search_queries = ["amusement arcade interior shutter up morning empty", "seaside penny arcade slot machines dim daylight"] } },
  { type = "paragraph", content = "The shutter goes up and the smell comes out before the light goes in. Carpet, warm dust, and the inside of forty machines that have been off since October." },
  { type = "paragraph", content = "This is an amusement arcade. Slot machines down both walls. Four coin pushers in the middle, glass wiped every morning whether anybody has touched them or not. Two driving cabinets. A crane with nothing in it worth the money." },
  { type = "paragraph", content = "Half of it is off at the wall to save the electric. The carpet is the colour of a bruise and a man who is not here chose it. The change booth has a hatch you have to stoop to, and from behind it you can see the whole length of the front." },
  { type = "paragraph", content = "The pitch on this building is ninety a week, and it does not go to a landlord. It goes to the one who took the folder off you the month your husband went inside. He was right to take it. You have not signed anything about your own building since." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Forty machines with my name over them, and I do not get to say which ones are on." },
]
exit_block = { type = "location", text = "Open up.", config = { destinationType = "specific", locationId = "the_arcade", time_progression_minutes = 30, flagEffects = [
  { targetType = "player", flag = "shutter_up", op = "set" },
] } }


# ═════════════════════════════════════════════════════════════════════════════
# THE FOUR MEETINGS — the-first-hour.md F5-F8. NEW 2026-08-22.
#
# ⚠️ THE FORBIDDEN SHAPE THIS REPLACES: a repeatable `npc =` hub whose base node
#    IS the introduction. All four hubs here carried NO CONDITION AT ALL, so
#    every portrait was live on turn one and the game had no meeting state.
#    16 of 25 field games carry per-character meeting state; degrees-of-lewdity
#    keeps a first-time flag on 24 of its 27 registered NPCs.
#
# The shape, from the worked example the_inheritance/canvas_meet_audrey (128
# words, one node, four dialog blocks):
#
#   the meeting   is_repeatable = false · high priority · location-bound
#                 · a SCHEDULE matching where the character actually is
#                 · sets ONE flag on its exit choice
#   the hub       is_repeatable = true · npc = set · gated on that flag
#                 · a DIFFERENT name
#
# ⚠️ THE SCHEDULE IS NOT DECORATION. `requires_npc` does NOT gate the auto-fire
#    path: getStoryCanvasRedirect -> selectAutoFireCanvasForLocation ->
#    isCanvasValid (v2.py:4573) checks schedules, conditions and repeatability
#    and never reads requiresNpc. Without a window, canvas_meet_ewan introduces
#    him in an empty boat yard at ten at night -- which is exactly what
#    vesper/cap_renner_hired does. Keep requires_npc as well: it is free and it
#    is correct on the two paths that DO read it (v2.py:5259, :5332).
#
# ⚠️ FOUR FLAGS, NOT ONE (F8). seventh_day gated two hubs on `rota_running`,
#    steam two on `doors_open`, back_home four on `arrival_done` -- one flag
#    opening a whole cast is the cold-spawn hub with a coat on, and gate 34's
#    flag_owners half fails it.
#
# ⚠️ NO WAVES, and that is a call rather than an oversight. F8 prefers staggered
#    entrances. This game's premise is that all four live inside four hundred
#    yards and she is related to every one of them; gating them by day would be
#    an invented lock on the one thing the world is about.
#
# ⚠️ THE NODE NAME IS THE ROLE, and the hub's is the name (F7). Relationship
#    label first -- it is what the player can hold; the name is what they will
#    need later.
# ═════════════════════════════════════════════════════════════════════════════

