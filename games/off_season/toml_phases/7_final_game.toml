  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_nessa", trait_key = "want", operator = "gte", value = 24 },
    ] } }, blocks = [
    { type = "paragraph", content = "She turns over when the board goes and pulls the quilt down off her shoulder instead of up, and leaves it down, and waits." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_nessa" }, content = "You can put the light on. You never put the light on." },
  ] },
]

