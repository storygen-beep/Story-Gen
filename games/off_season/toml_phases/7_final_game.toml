[[canvases.nodes]]
id   = "base"
name = "He stays"
blocks = [
  { type = "paragraph", content = "He does not go. He gets the jammed cabinet open with a screwdriver off your shelf and lies half inside it with his boots on the carpet, and talks to you out of the back of a machine for an hour." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ewan" }, content = "The one at the end wants scrapping, not fixing. You know that." },
