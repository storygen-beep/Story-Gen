# ═════════════════════════════════════════════════════════════════════════════
# THE HOLIDAY LETS — WORK 2, and the richest TRIGGERED ground in the game:
# alone, on a key, in a room that is not hers, on a schedule other people know.
#
# The need gate here is written POSITIVELY — `hunger gte 25` on the rung that IS
# offered, never `hunger lt 25` on a rung that is hidden (gates.py:1990).
# ═════════════════════════════════════════════════════════════════════════════

[[canvases]]
id          = "work_lets_turnaround"
name        = "Clean a flat for the agency"
description = "WORK @the_lets, repeatable, 09:00-17:00. Priced at 20 energy + 150 minutes and day-capped with turnaround_done_today, so it is one a day, not a printer (the-economy.md R5: a gate in FRONT of a printer only delays the printer). Gated hunger >= 25 — this is the door the hunger need shuts. Walk-in router: whoever the agency has sent."

# ⚠️ show_when_blocked: a windowed activity that simply VANISHES from the room's
#    list reads as a broken game rather than a timetable. Opt in and it renders as
#    a dimmed line carrying this message instead (v2.py:5091-5099 pushes it when
#    isCanvasValid fails -- which includes the SCHEDULE, not just cooldowns; drawn
#    at v2.py:5140). the-clock.md C5 / the-surfaces.md R2. ZERO games in this repo
#    had ever used it before 2026-08-22.
[canvases.trigger]
location      = "the_lets"
is_repeatable = true
priority      = 5
is_active     = true
show_when_blocked = true
cooldown_message  = "the agency's key, nine till five"
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "season_shut", operator = "is_true" },
]}

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "09:00"
end_time   = "17:00"

[[canvases.trigger.substitutions]]
# PATTERN B, four buckets, 0.56 total (v2.py:5361-5379). The presence-gated bucket
# keeps its own condition and simply gives its share back to the turnaround on the
# days nobody is up here — a claimed slot that fails falls through to the HOST, not
# to the next bucket (v2.py:5374-5377).
target_canvas_id = "walkin_lets_number_four"
chance           = 0.22
exclusive_group  = "lets_turn"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_lets", operator = "is_present" },
] }

[[canvases.trigger.substitutions]]
