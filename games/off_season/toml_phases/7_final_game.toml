blocks = [
  { type = "image", props = { file = "portraits/nessa.jpg", description = "A young woman asleep on a mattress behind a curtain in a dim back room.", search_queries = ["young woman asleep on mattress dim room curtain", "girl sleeping bare room single bulb night"] } },
  { type = "paragraph", content = "The curtain is half across and the arcade hums through the plaster all night whether anybody is in it or not. She sleeps on her front with one arm off the mattress." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_nessa" }, content = "I know you're stood there. You do it every night." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_nessa", trait_key = "want", operator = "lt", value = 24 },
    ] } }, blocks = [
    { type = "paragraph", content = "She does not turn over. The arm off the mattress stays where it is and her breathing does not change while you stand there." },
