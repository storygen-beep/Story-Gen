# ⚠️ The day-cap flag is set HERE, on the choice, not on the rung's exit — a
#    choice runs its flagEffects BEFORE advanceTime (v2.py:12648-12733), an exit
#    runs them after (v2.py:13085-13088). the-meters.md M5.
#
# ⚠️ 6 energy, not 8, and the rung's exit takes 6 rather than 8 to match. The two
#    counter bands share ONE take a day, so they compete: at 8+8 the morning paid
#    21 for 16 energy over 150 minutes and the afternoon 29 for 20 over 180 —
#    worse on BOTH rates, which made the morning band a button nobody should ever
#    press. At 6+6 the morning is 1.75 money per energy against the afternoon's
#    1.45 and still slower per minute. Short on energy, work the morning; short
#    on hours, work the afternoon. A dead February morning paying less is the
#    fiction; it now costs less too.
