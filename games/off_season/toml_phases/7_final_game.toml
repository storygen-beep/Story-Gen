# Six [[npcs.schedules]] rows put a character in a room and NOTHING in that room
# was clickable. Three locations -- the_front, harbour_end, terrace_row -- had
# zero clickable content of any kind, and the anchor had no surface for EITHER
# of the two people the board declares in it.
#
# ⚠️ IT IS WORSE THAN AN EMPTY ROOM, because the nav card advertises them.
#    getNpcsPresentAtLocation (v2.py:19350, :19374) renders a portrait badge for
#    every scheduled NPC regardless of whether anything there is clickable, and
