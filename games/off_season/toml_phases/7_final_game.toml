id          = "hub_nessa_asleep"
name        = "Nessa"
description = "Standing hub @the_back_room, windowed to her 22:00-08:00 row. The night half of a character whose day hub is a separate canvas (the-surfaces.md R1). Quiet at low want; the opener bands at 24, and at want >= 18 she is awake and lets you know it."

