description          = "Where the promenade gives up and turns into concrete, trailers and a slip going down into brown water. Diesel, rope, a chandlery that opens when it feels like it. The one part of Ellinbay with a reason to be awake in February, which is why your eldest ended up down here and not in the arcade."
