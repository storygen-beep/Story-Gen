  { type = "paragraph", content = "Six flats, one key on a fob with a wooden tag, and a list stuck to the fridge in number one with your name at the top of it. Strip, run the taps, vacuum, out." },
  { type = "dialog", props = { speaker = "unknown" }, content = "Marnie, love — leave four till Wednesday, they're shifting the mattress." },
  { type = "paragraph", content = "Nobody has slept in any of them since September. The beds still smell of whoever did." },
