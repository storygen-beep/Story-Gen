name        = "Past nine"
description = "Triggerless rung off hub_ewan_counter, gated hold >= 25. +6 hold, day-capped, 8 energy and 90 minutes. The building's HOURS start being his -- the same shape as the lease and the books, one notch further in. Still no money."

[[canvases.nodes]]
id   = "base"
name = "Past nine"
blocks = [
  { type = "paragraph", content = "Nine goes past and you do not go to the wall, because he has not stood up. The front is black and the machines are the only light in four hundred yards and he is sat in the middle of it with his coat off now." },
  { type = "dialog", props = { speaker = "player" }, content = "I shut at nine." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ewan" }, content = "You shut when the last one leaves. That's what shutting is." },
  { type = "paragraph", content = "You stand behind the counter in your own building at twenty to eleven waiting for your son to decide the night is over, and you know exactly what that is, and you do it anyway." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "He has the lease, the books, and now the hours. There is the flat and there is me and that is the whole list of what is left." },
]
exit_block = { type = "location", text = "Turn them off when he stands up.", config = { destinationType = "specific", locationId = "the_arcade", time_progression_minutes = 90, effects = [
