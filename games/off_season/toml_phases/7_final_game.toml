  { type = "paragraph", content = "Down the inside stair the arcade is black and the machines are off at the wall. Behind the PRIVATE door your sister's girl is asleep on a mattress and owes you forty." },
  { type = "paragraph", content = "Harbour End: Ewan, under a hull, from eight. Terrace Row: Tam over the fryers, sleeping off nights. Eleven doors along, your mother's house, and your brother in it with a holdall and no story about Bristol." },
