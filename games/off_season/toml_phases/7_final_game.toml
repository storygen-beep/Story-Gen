# ── HOME BASE. Sleep, warmth, the wardrobe, and the only door she can shut. ──
[[locations]]
id                   = "the_flat"
name                 = "Your Flat"
description          = "Up the inside stair from the arcade floor. Two rings, a kettle, an immersion with a coin meter screwed to the wall beside it, and a window over a sea that nobody comes to look at until April. It is yours in the sense that nobody else sleeps here. It is not yours in any of the other senses."
image                = "locations/the_flat.jpg"
image_search_queries = ["small cold flat above shop kitchen window sea", "bedsit two ring hob kettle worn interior night"]
entry_from           = "the_arcade"
navigation_order     = []

# ── WORK 2. Alone, on a key, in a room that is not hers, on a schedule. ──────
[[locations]]
id                   = "the_lets"
name                 = "The Holiday Lets"
description          = "Six flats over the shut shops at the Terrace end, let by the week from Easter and empty the rest of the year. You do the winter turnarounds on the agency's key — strip the beds, run the taps so the traps don't dry, hoover a carpet nobody has walked on since September. Other people's rooms, other people's things in the drawers, and the agency's list on the fridge with your name at the top of it."
image                = "locations/the_lets.jpg"
image_search_queries = ["empty holiday flat stripped bed cleaning winter", "vacant seaside apartment bare mattress hoover"]
entry_from           = "the_front"
