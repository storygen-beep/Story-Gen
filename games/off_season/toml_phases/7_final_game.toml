# ═════════════════════════════════════════════════════════════════════════════
# THE ARCADE — THE ANCHOR. 9,000 of 33,300 declared words = 27% (floor 25%).
#
# WORK is one job with three HOUR BANDS, not three jobs. Only one is ever live,
# so the room's list stays needs + work + people — three or four entries — and
# the depth goes into the rungs behind it rather than across the menu. This is
# how a place gets deep without becoming a catalogue (the-surfaces.md R2).
#
# ⚠️ engine.md §19 — all three are UNBOUND (no npc), so the windows must not
#    overlap: 08:00-13:00 · 13:00-19:00 · 21:00-01:00.
# ═════════════════════════════════════════════════════════════════════════════

# ── WORK, band 1: mornings. The empty half of the season. ───────────────────
[[canvases]]
id          = "work_arcade_morning"
name        = "Open up and work the counter"
description = "WORK @the_arcade, 08:00-13:00, repeatable. The morning band: shutter, floats, the machines that are still on at the wall. ONE take a day across both counter bands — counter_done_today is set on the CHOICE (never the rung's exit) and cleared in [engine.daily_tick]. Priced at 6 energy + 150 minutes for 21, against the afternoon's 10 + 180 for 29: cheaper per energy, slower per minute, so the two bands are a trade rather than a strict ranking."

# ⚠️ show_when_blocked: a windowed activity that simply VANISHES from the room's
#    list reads as a broken game rather than a timetable. Opt in and it renders as
#    a dimmed line carrying this message instead (v2.py:5091-5099 pushes it when
#    isCanvasValid fails -- which includes the SCHEDULE, not just cooldowns; drawn
#    at v2.py:5140). the-clock.md C5 / the-surfaces.md R2. ZERO games in this repo
#    had ever used it before 2026-08-22.
[canvases.trigger]
location      = "the_arcade"
is_repeatable = true
priority      = 5
is_active     = true
show_when_blocked = true
cooldown_message  = "mornings, eight till one"
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "shutter_up", operator = "is_true" },
]}

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "08:00"
end_time   = "13:00"

# ⚠️ PATTERN B — every rule below carries exclusive_group, so the five share ONE
#    dice roll partitioned into cumulative buckets (v2.py:5361-5379) and the
#    chances add to 0.55, leaving the morning itself on screen 45% of the time.
#    Pattern A (no group) would roll five SEPARATE dice (v2.py:5382-5391) and the
#    activity would render 45% x ... = 24% of the time -- the room's own work
#    pushed off its own screen by its texture. the-surfaces.md R3.
#
# ⚠️ A claimed bucket whose target or conditions fail falls through to the HOST,
#    not to the next bucket (v2.py:5374-5377). So a gated branch quietly gives its
#    share back to the morning while its gate is shut, which is why the gated one
#    is last and the ungated ones carry the weight.
[[canvases.trigger.substitutions]]
target_canvas_id = "walkin_arcade_counter"
chance           = 0.15
exclusive_group  = "arcade_morning"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "shutter_up", operator = "is_true" },
] }

