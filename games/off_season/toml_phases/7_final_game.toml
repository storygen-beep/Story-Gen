  { type = "paragraph", content = "The shutter goes up at eight and the light comes in four feet and stops. Sixteen machines on at the wall out of forty. The rest you turned off in October and have not turned back on." },
  { type = "paragraph", content = "Nobody comes in before eleven in February. Some days nobody comes in at all." },
