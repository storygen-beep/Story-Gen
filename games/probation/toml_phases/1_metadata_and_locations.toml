# =============================================================================
# Probation — 1_metadata_and_locations   (TEST BUILD — see 0_systems_spec)
# [player], [[locations]], [[npcs]] and their schedules share this file so the
# nested tables do not re-parent themselves.
# =============================================================================

[player]
id           = "player"
name         = "Cass"
customizable = true
player_description = "Cass Ridley, 24. A box on your left ankle, a room over a laundry, and a Tuesday at two every week."

[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "What does the file call you?"
default = "Cass"

[player.core_traits]
radius        = 0
hours         = 0
vouch         = 0
clean         = 100
battery       = 100
review_days   = 0
rest          = 100
food          = 100
wash          = 100
money         = 20
arousal       = 0
sheet         = 0
tobin_stage   = 0
delgado_stage = 0
marty_stage   = 0
rae_stage     = 0

[player.trait_decay]
rest = 20
food = 25
wash = 15

# ── the map: one street, and everything hangs off it ────────────────────────
[[locations]]
id                   = "bowen_street"
name                 = "Bowen Street"
description          = "The street on the east side of the river. Your building, Marty's shop, the county office, and at the bottom the bridge, with a painted line down the middle. Everyone on this street can see your ankle."
image                = "locations/bowen_street.jpg"
image_search_queries = ["run down city street shops daytime", "east side street laundromat pawn shop"]
navigation_order     = ["the_stairwell", "martys", "the_county_office", "the_bridge"]

[[locations]]
id                   = "the_stairwell"
name                 = "The Stairwell"
description          = "The ground floor of your building. The stairs go up to your room and the other door goes through to the laundry. Everyone who uses the machines at three in the morning walks past your stairs."
image                = "locations/the_stairwell.jpg"
image_search_queries = ["apartment building stairwell night", "narrow stairs ground floor old building"]
entry_from           = "bowen_street"
navigation_order     = ["her_room", "the_laundry"]

[[locations]]
id                   = "her_room"
name                 = "Your Room"
description          = "One room at the top of the stairs. A bed, a shower, a kettle, and the dock for the box on the floor by the socket. The box calls this home."
image                = "locations/her_room.jpg"
image_search_queries = ["small rented room single bed kettle", "cheap studio room bed window night"]
entry_from           = "the_stairwell"

[[locations]]
id                   = "the_laundry"
name                 = "The Laundry"
description          = "Rae's laundromat, directly under your floor. The only lit room on the street after midnight. The street door stays propped open all night."
image                = "locations/the_laundry.jpg"
image_search_queries = ["laundromat at night fluorescent lights", "empty laundromat dryers night"]
entry_from           = "the_stairwell"

[[locations]]
id                   = "martys"
name                 = "Marty's"
description          = "Hardware on the left, pawn on the right, and the counter in the middle where Marty signs your hours. One of two places in the zone that will sign a probation sheet."
image                = "locations/martys.jpg"
image_search_queries = ["small hardware pawn shop interior counter", "old hardware store aisles counter"]
entry_from           = "bowen_street"

[[locations]]
id                   = "the_county_office"
name                 = "The County Office"
description          = "Plastic chairs, a front desk, Tobin's bench with the box chargers at the end of the hall, and Delgado's office. Tuesdays at two, whatever else is happening."
image                = "locations/the_county_office.jpg"
image_search_queries = ["government office waiting room plastic chairs", "probation office hallway desk"]
entry_from           = "bowen_street"
entry_conditions     = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "wash", operator = "gte", value = 40 },
] }
blocked_message      = "Not like this. Delgado writes down how you smell. Shower first."

[[locations]]
id                   = "the_bridge"
name                 = "The Bridge"
description          = "The edge of the zone. A white line is painted across the middle, and the far side is thirty seconds away."
image                = "locations/the_bridge.jpg"
image_search_queries = ["city bridge walkway river night", "pedestrian bridge painted line"]
entry_from           = "bowen_street"
costs                = { time = 10 }
entry_conditions     = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "radius", operator = "gte", value = 30 },
  { type = "trait", subject = "player", trait_key = "battery", operator = "gte", value = 20 },
] }
blocked_message      = "The box starts to tick before you reach the rail. Not until the first review. Not under twenty on the battery."

