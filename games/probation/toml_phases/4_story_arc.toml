    { type = "group", blocks = [
      { type = "paragraph", content = "A woman with a baby on her hip buys a bag of nails. She sees the band when you step round the counter. She doesn't look away, and she doesn't look scared. \"My husband had one of those,\" she says. \"Eleven months. It gets lighter.\" You don't know what to say, so you say thank you." },
