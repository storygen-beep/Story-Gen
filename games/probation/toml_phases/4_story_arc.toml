      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "He was right. It makes us a pawn shop. It also paid for his headstone." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He says it flat, but he's holding a hinge so hard his knuckles go white." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "What's the worst thing anybody ever tried to pawn?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Gold teeth. In his mouth. He wanted a loan against them, kid." },
      { type = "dialog", props = { speaker = "player" }, content = "What did you do?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Lent him twenty and told him to keep smiling. He paid it back with interest. People do, when you don't make them beg." },
    ] },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "People think a pawn shop is sad. It's not sad. It's a bank for people banks won't talk to. Half the town has had a watch on that tray." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "The guitar in the case? Nine years. He comes in every spring and plays it for ten minutes and pays the interest. Never takes it home. I don't ask." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "You know why I sign sheets? County pays me a little for it. Not much. But mostly because somebody signed one for me once." },
  ] },
  { type = "thought_bubble", props = { speaker = "player" }, content = "He's never going to tell you what he did. You like him more for it." },
