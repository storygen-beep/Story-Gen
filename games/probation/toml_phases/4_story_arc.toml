    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Don't you get sick of people's sad stories?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "I get sick of the lies. Sad I can do. It's the man who says his mother died when she's sitting in the car outside." },
      { type = "dialog", props = { speaker = "player" }, content = "How do you know she's in the car?" },
