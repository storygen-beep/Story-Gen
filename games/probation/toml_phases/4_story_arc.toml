# =============================================================================
# Probation — 4_story_arc: MARTY'S (the anchor, 8,000 words planned)
# Work (three jobs, each a node with pooled outcomes), Marty's hub and talk
# topics, the pawn-side curtain (being seen by Marty — heat without sex),
# the Thursday stocktake after step 3, the walk-in and a random customer.
# Repeatable screens make no claim about the past (register.md, the truth rule).
# =============================================================================

# ── WORK ────────────────────────────────────────────────────────────────────
[[canvases]]
id          = "work_martys"
name        = "Work at Marty's"
description = "The counter, the books, the van, the back shelf, and the dock behind the counter."
[canvases.trigger]
location      = "martys"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "met_marty", operator = "is_true" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5]
start_time = "08:00"
end_time   = "19:00"

[[canvases.trigger.substitutions]]
target_canvas_id = "walkin_martys_customer"
chance           = 0.3
conditions       = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "martys", npc_id = "npc_marty", operator = "is_present" },
] }

[[canvases.nodes]]
id   = "base"
name = "The counter"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:marty_base
    { type = "group", blocks = [
      { type = "paragraph", content = "The door sticks, so you shoulder it open. Marty is in the back with the radio on and a lawnmower in pieces on the bench. He shouts hello without looking up. You put your bag under the counter and hook the stool out with your foot." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "That you, kid? Float's in the drawer. Count it before you trust it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He hands you his money and tells you not to trust it. You like him for that." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Marty is at the counter when you come in, with a loupe in his eye and a customer's watch in his hand. He's losing an argument about a Timex. He looks up, sees the band first, and then your face. Then he goes red, because you caught the order." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Kid. Take the counter. I'm getting beat by a man with a Timex." },
      { type = "paragraph", content = "You take the counter. Marty loses the argument, but only by two dollars, and he looks pleased about it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The shop is empty except for Marty. He's up a stepladder hanging new key blanks on the board, and the ladder wobbles. You hold it without asking. His work boots are level with your face, and he goes very quiet up there." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "You don't have to hold it, kid." },
      { type = "dialog", props = { speaker = "player" }, content = "You weigh more than the ladder, Marty. I'm holding it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A man is waiting at the counter when you come in, tapping a pawn ticket on the glass. Marty is nowhere. You drop your bag, find the ticket in the drawer, and take the man's twelve dollars. He gets his radio back. Marty comes out of the back wiping his hands." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Did you write it in the book?" },
      { type = "dialog", props = { speaker = "player" }, content = "Page and line." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He checks the book anyway. You watch him check it, and you're not even offended." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Marty is eating a sandwich over the counter, so the crumbs land on the invoices. He pushes half of it at you when you come in. You say you ate. You didn't, and he knows it, because he keeps pushing." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Eat it or I throw it out. Your choice, kid." },
      { type = "paragraph", content = "You eat it. It's ham with far too much mustard, but you eat every bite." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The lights are on, but nobody is behind the counter. The till is locked. The back door is open onto the alley, and Marty is out there on the phone with his back to the shop. He says Donna, and then he says he's fine. He doesn't sound fine." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Not your business. You unlock the till with the key under the mat and start your shift." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Marty is at the counter with a cardboard box of pawned tools. It's somebody's whole garage. He's tagging them, and his handwriting is terrible. You take the pen off him without asking, and he lets you." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Tools come in a box like that when somebody left." },
      { type = "dialog", props = { speaker = "player" }, content = "Or when somebody got sent away." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "You tag every wrench neat, because somebody loved these once. That could have been your box." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The shop smells of burnt coffee, because Marty left the pot on in the back. You turn it off. He comes out drying his hands and looks at the band, then at your legs. He takes too long on the legs, and you both know it." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Pot was fine." },
      { type = "dialog", props = { speaker = "player" }, content = "Pot was on fire, Marty." },
      { type = "paragraph", content = "He laughs, but he goes back in without looking at you, and that tells you more than the laugh." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Marty is behind the counter with the pawn book open and his reading glasses pushed up on his head. He's looking for them. You point. He finds them and pretends he knew." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "The drill man's coming in for his drill. Thirty, kid. Not a dollar less, whatever he tells you." },
      { type = "dialog", props = { speaker = "player" }, content = "What's he going to tell me?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "That he's my cousin. He's not my cousin." },
    ] },
    { type = "paragraph", content = "Nobody's at the counter. There's a note taped to the till in Marty's block capitals: BACK IN TEN. DON'T SELL THE GUITAR. You don't know which guitar, because there are three. You stand guard over all of them until Marty comes back with two coffees and hands you one." },
    { type = "paragraph", content = "Hardware on the left, pawn on the right, and you in the middle with the till. The bell over the door is broken, so you learn to watch the glass instead. Marty is in the back doing something loud to a lawnmower." },
    { type = "paragraph", content = "The shop smells of oil and old brass. There's a guitar in the pawn case with a tag on its neck, a wedding ring on a velvet tray, and a drill that three men have tried to sell back. You stand behind the counter, and the band sits under the counter where nobody can see it." },
    { type = "paragraph", content = "Keys, hinges, a rack of pawned coats, a box of screws nobody has sorted since the nineties. Marty says the screws are your problem now. He says it like a gift, and it sort of is." },
    { type = "paragraph", content = "A slow morning. Two men come in for washers and leave with washers. A woman sells her husband's watch and doesn't haggle, and you feel sick about it, but you ring it up anyway." },
    { type = "paragraph", content = "The radio in the back plays a ball game nobody is listening to. Marty comes out, reads the till roll over your shoulder, and goes back in without a word. You decide that means it balances." },
    { type = "paragraph", content = "It's the kind of shop that sells the same hammer twice. People pawn their tools in winter and buy them back in spring, and Marty knows every one of them by name. He doesn't know yours yet. He's learning it." },
  ] },
  { type = "paragraph", content = "Pick a job, or eat, or go." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "past_hands", operator = "is_true" },
  ] } }, blocks = [
    { type = "paragraph", content = "A man leans on the counter to argue about a price. He looks at your face, looks at your hands, and pays it. Marty sees it happen from the back and laughs out loud." },
  ] },
  { type = "paragraph", content = "The till drawer sticks, so you hit it with the heel of your hand, the way Marty showed you." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "marty_stage", operator = "gte", value = 3 },
  ] } }, blocks = [
    { type = "paragraph", content = "Marty keeps finding reasons to walk behind the counter. There's room to pass. He doesn't take it, so his hip brushes yours, and he says sorry, kid, and doesn't move." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "marty_stage", operator = "lt", value = 3 },
  ] } }, blocks = [
    { type = "paragraph", content = "Marty stays on his side of the counter. He looks at the band, then your legs, then the till. He thinks you don't notice the order, but you do." },
  ] },
]
