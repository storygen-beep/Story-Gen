hidden = true
[[traits.labels]]
key = "delgado_stage"
hidden = true
[[traits.labels]]
key = "marty_stage"
hidden = true
[[traits.labels]]
key = "rae_stage"
hidden = true

# ── overnight ───────────────────────────────────────────────────────────────
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "shift_today", op = "unset" },
  { targetType = "player", flag = "shelf_today", op = "unset" },
  { targetType = "player", flag = "sit_today",   op = "unset" },
  { targetType = "player", flag = "talk_today",  op = "unset" },
]
traitEffects = [
  { targetType = "player", trait = "review_days", op = "add", value = 1 },
]

# ── guidance ────────────────────────────────────────────────────────────────
[[quest_cards]]
group    = "the_box"
priority = 20
text     = "The box on your ankle holds eighteen hours. The dock is in your room and it takes ninety minutes. Under twenty, you cannot leave the zone."
tip      = "Your room: dock the box."
when     = [ { type = "flag", subject = "player", flag = "met_delgado", op = "is_true" } ]
goals    = [ { type = "trait", subject = "player", trait = "battery", op = "gte", value = 20, label = "Keep the box above twenty" } ]

[[quest_cards]]
group    = "the_review"
priority = 19
text     = "Thirty days clean and the zone reaches the bridge. Sixty, no curfew. Ninety, Delgado takes it off himself."
tip      = "The county office, the first Tuesday after day 30, at two."
when     = [ { type = "flag", subject = "player", flag = "met_delgado", op = "is_true" },
             { type = "flag", subject = "player", flag = "review_1_passed", op = "is_false" } ]
goals    = [ { type = "trait", subject = "player", trait = "review_days", op = "gte", value = 30, label = "Reach day 30" },
             { type = "trait", subject = "player", trait = "clean", op = "gte", value = 60, label = "Keep your record at sixty or better" },
             { type = "flag", subject = "player", flag = "review_1_passed", op = "is_true", label = "Pass the first review" } ]

[[quest_cards]]
group    = "the_dot"
priority = 18
text     = "Your log puts you at the yards across the river, ten past two on a Saturday. You were asleep upstairs."
tip      = "Tobin knows how boxes drift. Tuesdays, twelve to one."
when     = [ { type = "flag", subject = "player", flag = "dot_read", op = "is_true" } ]
goals    = [ { type = "flag", subject = "player", flag = "boxes_get_helped", op = "is_true", label = "Find out how a box gets helped" } ]

[[quest_cards]]
npc_id       = "npc_tobin"
priority     = 19
text         = "Tobin checks the box on Tuesdays. He left his thumb on your ankle."
tip          = "The County Office, Tue 12:00–13:00"
when         = [ { type = "trait", subject = "player", trait = "tobin_stage", op = "eq", value = 0 } ]
goals        = [ { type = "trait", subject = "player", trait = "tobin_stage", op = "gte", value = 1, label = "Let Tobin check the box — The County Office, Tue 12:00–13:00" } ]
ready_canvas = "tobin_01_fault"

