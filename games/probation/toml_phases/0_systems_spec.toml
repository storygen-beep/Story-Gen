when         = [ { type = "trait", subject = "player", trait = "tobin_stage", op = "eq", value = 1 } ]
goals        = [ { type = "trait", subject = "player", trait = "tobin_stage", op = "gte", value = 2, label = "Ask Tobin who helps them — The County Office, Tue 12:00–13:00" } ]
ready_canvas = "tobin_02_drift"

[[quest_cards]]
npc_id       = "npc_tobin"
