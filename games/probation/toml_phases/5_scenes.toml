nodeId     = "base"

[[canvases.nodes]]
id   = "talk_slip"
name = "If you slip"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:delgado_talk_slip
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "What counts as a slip?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Out after eight. A dead battery. A dot outside the zone. A Tuesday you're not in that chair." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "One is a conversation. A bad record buys you Thursdays as well. Past that, it goes in a letter to Judge Hollis, and I don't write those letters for fun." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He isn't threatening you. He's reading you the price list." },
    ] },
