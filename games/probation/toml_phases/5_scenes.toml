[[canvases.nodes]]
id   = "talk_boxes"
name = "The boxes"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:tobin_talk_boxes
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "How does it know where I am?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Satellites for where. A tower for when. It writes down a dot every sixty seconds, and I read the dots." },
      { type = "dialog", props = { speaker = "player" }, content = "Can you change a dot?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Anybody can change a dot. Changing it so nobody asks is the job. That's not free, Ridley." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "The strap's got a wire in it. Cut it and the box screams to the county before you reach the end of the block." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He says it like he's watched somebody try." },
      { type = "dialog", props = { speaker = "player" }, content = "So it can't be fooled." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "I didn't say that. I said don't cut the strap. Everything else is a conversation, but you're not paying for one." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Tobin turns a box over and shows you the back. A little port, a screw, a sticker with a number." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "The number's the box. Not you. The county thinks those are the same thing, but they're not." },
      { type = "dialog", props = { speaker = "player" }, content = "Meaning what?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Meaning the box is only as honest as whoever plugged it in last. Me, Ridley. Mostly me." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Boxes drift. Tall buildings, the river, a bad tower. A dot jumps a block and jumps back." },
      { type = "dialog", props = { speaker = "player" }, content = "And then what?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Then somebody decides if it drifted or if you walked. That somebody sits at this bench. Deciding is work, Ridley, and I don't work for free." },
      { type = "paragraph", content = "He leans back until his chair creaks. His eyes go to your ankle, then come back up to your face, so you know exactly what he means by work." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Eighteen hours of battery if you're good to it. Ninety minutes on the dock. Under twenty, it beeps, and then it tells on you." },
      { type = "dialog", props = { speaker = "player" }, content = "Tells who?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Delgado's screen, then Delgado's mouth. Unless the message gets lost. Messages get lost, Ridley. For the right people." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "The right people. He means people who pay him, and he wants you to hear it." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "What if it's wrong about me?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Then it's wrong about you all the way to Judge Hollis's desk, unless somebody at this bench says it isn't." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Somebody at this bench. There's only one chair here, and he's sitting in it." },
      { type = "paragraph", content = "He smiles at you, bored and patient, like a man who knows you'll come back with money he doesn't want." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "GPS, a clock, a strap sensor, a battery. It pings a tower every sixty seconds. If the strap opens, it screams. If the battery dies, it screams. That's it, Ridley. It's a phone that hates you." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "And he's the one who knows where it's stupid." },
    ] },
  ] },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Back."
targetType = "node"
nodeId     = "base"

[[canvases.nodes]]
id   = "talk_yards"
name = "The yards"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:tobin_talk_yards
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "You said boxes get helped. Who helped mine to the yards?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Your box is older than your case, Ridley. It's been on other ankles. It went places before it went to you." },
      { type = "dialog", props = { speaker = "player" }, content = "Whose ankles?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "That's the part with a price on it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Tobin pulls up a list of serial numbers and turns the laptop so you can't see it." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "The county reissues. A band comes off, I wipe it, I charge it, it goes on the next leg. Yours came off somebody's." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Somebody who went to the yards at night. You want the name so badly your hands shake." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Don't look at the screen like that, Ridley. Looking's free. Reading isn't." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "I was asleep. I was in my bed. How is my dot across the river?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Maybe your dot isn't only yours. Wipes aren't perfect. Numbers get copied. People who know that use it." },
      { type = "dialog", props = { speaker = "player" }, content = "Which people?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Not the ones in the plastic chairs, Ridley. Go home. Dock it. Be asleep where the box can see you." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "The yards are where you go when you want nobody to see you. Freight, no lights, a fence with holes in it." },
      { type = "dialog", props = { speaker = "player" }, content = "So why would anybody want the county to see a dot there?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "They don't. They want the county to see your number there, but not their face. Different thing." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Somebody is wearing your number in the dark. Maybe he knows who, and you hate how much he likes that you don't." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Tobin rubs the band on your ankle with his thumb, right over the scratches." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "See these? You didn't put them there, Ridley. Somebody wore this box before you, and they weren't careful with it." },
      { type = "dialog", props = { speaker = "player" }, content = "Tell me who." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "No. Tell me what you'd give to know, and I'll think about it. Not today." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Was it a girl? The one before me?" },
      { type = "paragraph", content = "Tobin stops typing. It's the first time he's looked surprised, but it only lasts a second." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Boxes don't have girls, Ridley. They have numbers. Ask me the right way and I'll tell you whose." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He almost answered. You saw it on his face, and it scares you more than the yards." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Who was at the yards wearing my number?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Boxes get reissued, Ridley. Yours had a life before your ankle. That's all you get for nothing." },
    ] },
  ] },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Back."
targetType = "node"
nodeId     = "base"

