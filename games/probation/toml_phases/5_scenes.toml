[[canvases.nodes]]
id   = "base"
name = "The check-in"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:delgado_hub
    { type = "group", blocks = [
      { type = "paragraph", content = "Delgado has the log printed out, and he reads it aloud with his finger under each line. Addresses. Times. The word home, over and over." },
      { type = "paragraph", content = "He doesn't speed up for the dull lines, and he doesn't slow down for the bad ones. You sit on your hands so you don't fidget." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He reads your life like a shopping list. You hate how calm he is." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Delgado's office has one window and a folder with your name on it. He opens the folder, clicks his pen, and starts reading the log out loud." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Stop me if I get any of it wrong, Ms. Ridley." },
      { type = "paragraph", content = "You listen to your own days in his voice. You feel caught, even on the lines where there is nothing to catch." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The clock on Delgado's wall is loud. He reads the log over it, flat and even, while the box on your ankle blinks along like it's proud of itself." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Every place you went, said out loud by a man who writes it all down." },
      { type = "paragraph", content = "He turns a page. He reads that one too, every line, because that is the job." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Delgado puts on his reading glasses and reads the log out loud, one line at a time, the way a judge would." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Where you slept, where you worked, where you stood. It's all here, Ms. Ridley. I only say it back to you." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He isn't cruel about it. That makes it worse, because you can't even be angry at him." },
      { type = "paragraph", content = "You're angry anyway, and scared under it, but you keep your face blank." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Delgado reads the log with his door open. Anybody in the hall could hear where your box has been. He doesn't lower his voice, but he doesn't raise it either." },
      { type = "paragraph", content = "When a line needs a question, he makes a small mark in the margin. When it doesn't, he doesn't praise you. He moves to the next line." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "No gold star. Only the next line." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Delgado reads the log with his pen resting on each line, and he doesn't move it on until you look up." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "If a line is a question, I ask it here, Ms. Ridley. Better me than the judge." },
      { type = "paragraph", content = "He waits after each line. He doesn't fill the quiet, so you do, or you let it sit there with him." },
    ] },
    { type = "paragraph", content = "Delgado reads the log aloud. Home, Marty's, home." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "sheet", operator = "gte", value = 1 },
  ] } }, blocks = [
    { type = "paragraph", content = "Marty's sheet is in the folder, signed. Delgado reads the hours, but he doesn't comment on them." },
  ] },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Ms. Ridley. Anything I should hear from you before I hear it from the box?" },
]
