[[canvases.nodes]]
id   = "talk_review"
name = "The review"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:delgado_talk_review
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "What do you actually need for the review?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Three things. The box on and charged. The hours sheet, signed every Friday. And a log I can read to the judge without stopping." },
      { type = "dialog", props = { speaker = "player" }, content = "And if you stop?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Then you explain, and I write down what you say. An explanation is worth something, Ms. Ridley. It isn't worth as much as a clean line." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "A review isn't a test you study for. It's thirty days I've watched. You can't cram for it at the end." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He means you can't fake it on the last day. You'd have to fake it the whole way." },
      { type = "dialog", props = { speaker = "player" }, content = "So what do I do?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Home by eight. In that chair on time. Work your hours. Boring passes reviews, Ms. Ridley." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "What do I get if I pass?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Thirty days, the zone reaches the bridge. Sixty, no curfew. Ninety, the band comes off your leg." },
      { type = "dialog", props = { speaker = "player" }, content = "And you sign it, just like that?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "I sign it when I can read every line out loud and believe it. Not because I like you, Ms. Ridley. I don't have to like you to sign." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "What if the sheet's short?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Then it's short, and I read it short. A short sheet is a question. A missing sheet is an answer, Ms. Ridley." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He says it calmly, but it lands like a slap." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Do people pass? People like me?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Some do. They're not better people, Ms. Ridley. They're more boring. They go home at eight when they'd rather not." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Boring. You were never any good at boring. You want to be, because the alternative is Judge Hollis." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_delgado" }, content = "Thirty days, then I read every line of the log and I sign it or I don't. A clean record, a full sheet, no dots I can't explain. It isn't complicated, Ms. Ridley. It's only hard." },
    ] },
  ] },
]
