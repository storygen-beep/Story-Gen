[[canvases.nodes]]
id   = "base"
name = "Tobin"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:tobin_hub
    { type = "group", blocks = [
      { type = "paragraph", content = "Tobin has six boxes open on the bench, each one on its own charger. He pops the back off one with a screwdriver, but his eyes go to your ankle first." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Ridley. Put your foot up. I want to see the strap." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He doesn't need to see the strap. He wants to see your leg." },
      { type = "paragraph", content = "You put your foot on the spare chair anyway, because he is the man who knows the box." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The bench smells of hot plastic. Tobin is testing a strap sensor with a paperclip, and a box on the charger shrieks until he thumbs it quiet." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "They all scream, Ridley. Yours too. Sit." },
      { type = "paragraph", content = "You sit. He looks at the band, then up your leg, slow, like he's reading it. He doesn't pretend otherwise, and your face goes hot." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He wants you. He isn't even hiding it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Tobin is on the phone about a firmware update. He is bored out of his skull, but he points you at the chair with his pen." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Two minutes. Don't touch anything with a light on it." },
      { type = "paragraph", content = "He hangs up and rolls his chair over until his knee is next to yours. He taps the box on your ankle with the pen, once, like a doorbell." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Close enough to smell his coffee. Close enough that you notice you don't mind." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The frosted door is shut. Down the hall the clerk is typing. Tobin sits with his boots on the bench and a box in his lap, and he looks at you over it." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "You walk in here like you own it, Ridley. Nobody with a band walks like that." },
      { type = "dialog", props = { speaker = "player" }, content = "Maybe I'm not like them." },
      { type = "paragraph", content = "He grins, but his eyes drop to your ankle and stay there. You feel his look on your skin, and you like it more than you should." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Tobin swaps a battery with quick, bored fingers. He can do it without looking, so he looks at you." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Battery's the weak spot on every one of these. Keep yours docked, Ridley. I don't want you screaming at me." },
      { type = "dialog", props = { speaker = "player" }, content = "It's docked. It's fine." },
      { type = "paragraph", content = "He nods, but he isn't listening. His eyes go down your body to the band and back up to your mouth, and he doesn't hurry." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A laptop, a tangle of chargers, a mug that says COUNTY. Tobin has a dead box in pieces on a towel, and he's putting it back together because nobody else can." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Everything in this building breaks, Ridley. I fix it, so they leave me alone." },
      { type = "paragraph", content = "He holds out his hand for your foot like it's part of the job. It isn't, and you both know it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Your heart is going too fast. You're embarrassed, but you don't pull your foot back." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Tobin takes a box off the charger like he's unwrapping it." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_tobin" }, content = "Ridley. Want me to look at it?" },
    ] },
  ] },
]
