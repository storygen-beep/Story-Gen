# Tobin's and Delgado's hubs and talk topics, the Tuesday bench (repeatable,
# explicit), the Thursday check-in, and a random event.
# `# POOL:<key>` marks a slot the prose writers fill.
# =============================================================================

[[canvases]]
id          = "hub_tobin"
