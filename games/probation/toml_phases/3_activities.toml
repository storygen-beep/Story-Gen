      { type = "paragraph", content = "The bridge is two lanes and a narrow footpath on each side. Halfway across, somebody painted a white line from rail to rail. On your side of the paint you're a woman going for a walk. On the other side you're a violation. A few steps before the line, the box starts to tick against your ankle bone." },
