[[canvases.nodes]]
id   = "washed"
name = "Washed"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:laundry_washed
    { type = "group", blocks = [
      { type = "paragraph", content = "Everything you own fits in one washer with room to spare. Jeans, work shirts, underwear, socks. You feed in two dollars and sit on the bench to watch it spin." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "That's my whole life going round. It doesn't even fill the drum." },
      { type = "paragraph", content = "When it stops, you pull it out warm and damp. It smells like soap instead of like the county." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The washer thumps on the spin, so you put your foot against it to stop it walking across the floor. The band on your ankle knocks the metal. The light blinks green, steady, the whole hour." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Even my laundry gets supervised. At least the box likes it down here." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You sort by colour on the bench, but there isn't much colour to sort. Black, grey, one red top you bought before court. You wash it all together because you can't afford two loads." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "If the red runs, I'll be pink for a year. I don't care. I want it clean." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "An hour on the bench is a long time with nothing to hold. You read the NO DYES sign until the letters stop being words. You read the warning label on the washer. You watch your own underwear go past the glass. You feel stupid for watching it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Twenty-four years old, and this is the most interesting thing in my day." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The machine shakes so hard on the last spin that the coins on its lid rattle. You hold the lid down with both hands until it quits. For a minute it's the only thing in the world you're in charge of." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Stay on the floor. Don't make me chase you." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "When the cycle ends, you fold it all on the table. It makes one neat stack. It's a small stack. You carry it against your chest so nothing drops. But a sock falls on the first stair, so you go back down for it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "One sock. I'm not leaving one sock in the lost and found for strangers to look at." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You sit on the bench with your knees up and your chin on them. The washer fills, churns, drains. You count the spins because counting is free." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "An hour of nobody wanting anything from me. That's worth two dollars." },
      { type = "paragraph", content = "But the box blinks green on your ankle every few seconds, so it isn't quite nobody." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A tenant comes down while your wash is going, looks at the full row, and sighs. You shift your basket off the bench so she can sit. She doesn't. She puts her load in the machine next to yours and goes back up." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Everyone in this building is tired. I'm the only one with a reason written down at the county." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The drum stops with your jeans plastered to the glass. You drag everything into a dryer and feed it quarters. The heat comes up through the metal when you lean on it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Warm clothes. That's the whole reward. But it's a good one, and nobody can take it off me." },
    ] },
    { type = "paragraph", content = "Everything you own goes round in one machine. You sit on the bench and watch it, because there's nothing else you own to watch." },
  ] },
]
