[[canvases.nodes]]
id   = "talk_girl"
name = "The girl before"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:rae_talk_girl
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "The girl who had my room. What was she like?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Quiet. Polite. She came in off the street when I was sitting on the stairs with my coffee. She said good morning like it was a normal time to say it." },
      { type = "paragraph", content = "Rae stops there, like that's the whole answer." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Coming in when Rae's on the stairs. So she was out all night. With a box on." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Did she ever say where she went?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "I don't ask my tenants where they go, sweetheart. I didn't ask her, and I don't ask you. She left her key on this counter. That's how I knew she was done." },
      { type = "paragraph", content = "Rae folds a towel in three instead of in half. Her hands are busy, but her eyes aren't." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "That's a no. It's also not an answer." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Her box was newer than yours. Shinier. That's all I noticed, because it's all she let anybody notice." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "A newer box. They reissue boxes. I don't know whose mine was before it was mine." },
      { type = "paragraph", content = "Rae goes back to her sheets, but she watches you look down at your ankle." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Was she in trouble?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Everybody with a band is in trouble, sweetheart. She tipped me for the towels. Nobody tips me." },
      { type = "paragraph", content = "Rae goes back to folding. She closes the subject, but she closes it kindly." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She's protecting her. Or she's protecting me from her." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "She sat on that dryer by the stairs. Right there." },
      { type = "paragraph", content = "Rae says it without looking at you. Then she looks at you." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "That's the dryer with my towel on it. I don't know if that's a comfort or a warning." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Don't make that face, sweetheart. I told you one thing. One thing is plenty." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Did she leave anything behind?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "A hairbrush and a phone charger. I threw the brush out. The charger's in the drawer if yours dies." },
      { type = "paragraph", content = "Rae nods at the drawer under the counter. Then she shuts her mouth the way she'd shut the drawer." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "A phone charger. So she had a phone. So somebody called her." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "She was about your age, sweetheart. Maybe a bit younger." },
      { type = "dialog", props = { speaker = "player" }, content = "And?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "And that's all I'm saying." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Rae doesn't lie to me. She stops talking instead, and that's worse." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "How long did she stay?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Long enough to pay four months. Not long enough for me to learn how she took her tea." },
      { type = "paragraph", content = "Rae turns away to the dryers, but her shoulders are stiff." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Four months. Then nothing. Then me." },
