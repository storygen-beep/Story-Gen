[[canvases.nodes]]
id   = "docked"
name = "Docked"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:room_docked
    { type = "group", blocks = [
      { type = "paragraph", content = "You sit on the floor by the socket and plug in. The cable is so short your knee ends up against the wall, but the light goes red, which means it's working." },
      { type = "paragraph", content = "You count the minutes for a while. Then you quit, because counting to ninety is its own punishment." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "You're charging your own leash. Somebody should put that on a poster." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You plug the cable into the box and sit down on the floor, because the cable doesn't reach the bed. Your left leg sticks out toward the socket like it's on a leash." },
      { type = "paragraph", content = "The light goes red, then amber. You have ninety minutes and nowhere to put them." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Ninety minutes on a floor buys eighteen hours of six blocks. Some bargain." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You sit with your back against the bed frame and your foot by the wall. The box hums very quietly, the way a fridge does." },
      { type = "paragraph", content = "You read the label on a noodle packet. You try to nap sitting up. You try not to look at the light." },
      { type = "paragraph", content = "When it turns green, the box is full and your leg is asleep. You stand up on pins and needles and swear at it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Docking is the one time the box feels like a pet. You feed it, you sit with it, you watch its little light change." },
      { type = "paragraph", content = "But a pet doesn't report you. This thing tells the county where your body is every sixty seconds, and right now it's telling them you're home." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Does anyone read that line? Home, home, home. You'd fall asleep reading it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You plug in and stretch out on the floorboards with your foot propped by the socket. Ninety minutes is long enough to think about everything you don't want to think about." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "So think about something else. Think about food. Think about a bath with no band in it." },
      { type = "paragraph", content = "The light turns green before you've decided anything. You unplug the cable. The box is full, eighteen hours of leash." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The short cable means you sit close to the wall, knees up, foot turned out. It's an ugly way to sit. You're glad nobody can see it." },
      { type = "paragraph", content = "You pick at the seam of the band while it charges. It doesn't give, but your hands want a job, so you keep picking." },
      { type = "paragraph", content = "Ninety minutes later the light is green and the box is full. You're exactly where you were, but with a charged ankle." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You lie flat on your back with one leg up the wall, the cable just reaching. It's almost comfortable. The ceiling looks different from down here." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "This is what a full battery costs. An hour and a half of lying flat for a machine." },
      { type = "paragraph", content = "When the light goes green, you roll onto your side and unplug it. The box feels heavier full, even though it isn't." },
    ] },
    { type = "paragraph", content = "You sit on the floor with your foot by the socket for an hour and a half, because the cable is that short. The box goes from red to green and says nothing about it." },
  ] },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Get up."
targetType = "location"
locationId = "her_room"

[[canvases.nodes]]
id   = "slept"
name = "Slept"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:room_slept
    { type = "group", blocks = [
      { type = "paragraph", content = "You lie down with the band on top of the sheet, where you can feel it. You don't mean to fall asleep yet. Then you do." },
      { type = "paragraph", content = "Eight hours go by in what feels like one. You wake rested, with a crease from the pillow on your cheek and the box blinking green by your foot." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Home the whole time. The log will say so, in sixty-second pieces." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You sleep curled up tight, knees to your chest. The band presses against your other ankle. It's cold for the first minute. Then it's the same temperature as you." },
      { type = "paragraph", content = "You wake up after eight hours straight. You feel good, and that surprises you. Your body got what it needed, but your ankle has a red mark to show for it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You sleep on your right side so the band doesn't dig in. Somewhere in the eight hours you roll over anyway. You wake with a red ring pressed into your ankle bone." },
      { type = "paragraph", content = "The box blinks green. It knows exactly how long you slept, and where. Right here, every minute." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "It watched you sleep. That's a sentence you never thought you'd mean." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You dream about nothing you can hold on to. Stairs, maybe. A door that won't shut." },
      { type = "paragraph", content = "You wake with the sheet twisted around your legs and your left foot hanging off the bed. The band is cold where it stuck out in the air." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Eight hours, done. Your body feels like yours, right down to the ankle. Then it stops being yours." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You fall asleep fast, because the bed is warm and there's nothing to stay up for." },
      { type = "paragraph", content = "When you wake, the first thing you do is check the box. Green. Home. The second thing you do is get annoyed that the box came first." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Not even awake yet, and you're reporting in." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You sleep hard, face in the pillow, one arm hanging off the bed. The band taps the frame when your foot moves. You stop hearing it after a minute." },
      { type = "paragraph", content = "Eight hours later you surface all at once. You're rested and hungry, and the box is a little lower on battery than when you lay down." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "It worked the whole shift. You didn't." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You lie awake for a while thinking about the log. Every sixty seconds, a dot on a map. You're a dot in a bed." },
      { type = "paragraph", content = "Then you're asleep, and the dots keep coming without you. When you wake up, there are four hundred and eighty of them, all in the same place." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Four hundred and eighty dots of you doing nothing wrong. Somebody should frame that." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You sleep with the sheet kicked off your left foot, because the band gets hot under the covers. You wake once to flip the pillow. You wake once more when a car door slams on Bowen Street." },
      { type = "paragraph", content = "Then eight hours are gone and you're up, rested but stiff. The box blinks green at you like it stayed awake the whole time. It did." },
    ] },
    { type = "paragraph", content = "You sleep with the band pressing into the mattress. When you wake up, the box has logged every minute of it." },
  ] },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Get up."
targetType = "location"
locationId = "her_room"

[[canvases.nodes]]
id   = "showered"
name = "Showered"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:room_showered
    { type = "group", blocks = [
      { type = "paragraph", content = "You let the water hit your face and hold your breath under it. For a few seconds you can't hear anything, not the pipes, not the box." },
      { type = "paragraph", content = "Then you breathe and it all comes back. The band is heavy with water. It doesn't come off, so you soap your leg around it and rinse the foam out of the gap." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Clean everywhere except one inch of ankle. That inch belongs to the county." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You turn the water as hot as it goes and stand there until your skin goes red. It feels good. It feels like something you chose." },
      { type = "paragraph", content = "The band sits black and dull in all that steam. You rub a thumb over the light, and it keeps blinking green." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The shower is a tub with a curtain and a head that coughs before it commits. You step in with the band on, because the band doesn't come off." },
      { type = "paragraph", content = "Hot water on your shoulders is the best thing the rent pays for. You scrub around the band with your thumb until the skin goes pink." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Waterproof, they said. It had better be, because you're not standing on one leg for twenty minutes." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You stand under the water until it runs lukewarm. The band gets slick. Water beads on the little light, but it blinks green through all of it." },
      { type = "paragraph", content = "You wash your hair, your face, your body. You don't hurry, because for twenty minutes nobody needs anything from you." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Twenty minutes of nobody. Best deal in the zone." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Naked in the tub, you look down at yourself. Wet skin, soap, and a black plastic band on your ankle. It's the only thing on you, and you can't take it off." },
      { type = "paragraph", content = "It makes you feel more naked, not less. Like somebody put a tag on you and walked away." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "The box knows you're home. It doesn't know you're in the shower. Small mercies." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The pressure is bad, so you turn slowly under it to get all of you wet. Your left foot goes last." },
      { type = "paragraph", content = "You scrub the skin around the band hard. Sweat gets trapped under it, and it itches. When you get out, you dry the band with a corner of the towel like it's a baby. Then you feel stupid for doing it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Soap in your eyes, water up your nose, and the band knocking the side of the tub when you shift your weight. It's not a relaxing shower. It's a clean one." },
      { type = "paragraph", content = "You step out, drip on the floor and check the light. Green. The box doesn't care that you're dripping, but you check it anyway." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Of course it's fine. It was made for people like you. Waterproof, tamper-proof, you-proof." },
    ] },
    { type = "paragraph", content = "You shower with your left foot up on the edge of the tub, because the band is waterproof and you don't believe it." },
  ] },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Get dressed."
targetType = "location"
locationId = "her_room"

[[canvases.nodes]]
id   = "noodles"
name = "Noodles"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:room_noodles
    { type = "group", blocks = [
      { type = "paragraph", content = "Three dollars goes into a bowl. The kettle clicks off, the water goes in, and the packet asks for three minutes, but you only make it two." },
      { type = "paragraph", content = "The noodles are half hard. You eat them anyway, hunched over the bowl, burning your tongue." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Patience is for people with somewhere to be." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You eat standing up, because there's no table. The fork scrapes the bottom of the bowl, and that's your meal, three dollars flat." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Cheap, hot and yours. The county doesn't log what you eat." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You fill the kettle, drop the brick of noodles in the bowl and tear the flavor packet open with your teeth. Three dollars, fifteen minutes, done." },
      { type = "paragraph", content = "You eat with the fork straight out of the bowl, cross-legged on the bed. It's salty and too hot, but it fills the hole." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Food is food. Nobody in this zone is handing you better." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The kettle takes forever, then boils all at once. You pour it over the noodles and put a plate on top to steam them, because you don't own a lid." },
      { type = "paragraph", content = "They taste like salt and cardboard. You eat every one and drink the broth, because three dollars is three dollars." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You stand by the kettle with your arms crossed and wait for the click. Three dollars of noodles, the cheapest thing that counts as a meal." },
      { type = "paragraph", content = "You eat fast, standing up, blowing on each forkful. The box blinks green on your ankle. You're full. Neither of you says a word about it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You eat sitting on the floor with your back against the bed, the bowl hot on your knees." },
      { type = "paragraph", content = "Three dollars buys you fifteen minutes of something warm. You try to make it last, but it doesn't last." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Next time, an egg. If there's ever a next time with an egg in it." },
    ] },
    { type = "paragraph", content = "Kettle, packet, fork. You eat them standing at the window, so you can see the street, because the street is the only thing in the zone that moves." },
  ] },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Done."
targetType = "location"
locationId = "her_room"

[[canvases.nodes]]
id   = "mirror"
name = "The mirror"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:room_mirror
    { type = "group", blocks = [
      { type = "paragraph", content = "You turn sideways in the mirror. You look at your body the way a stranger would. Hips, the curve of your back, the long line of your leg down to the black band." },
      { type = "dialog", props = { speaker = "player" }, content = "Not bad for a dot on a map." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "If somebody on Bowen Street looked at you like that, you'd want to know. You'd want to see their face while they did it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You try a smile in the mirror. It comes out crooked, because the crack runs right across it." },
      { type = "dialog", props = { speaker = "player" }, content = "Hi. I'm @player. I'm on probation. I'm very well behaved." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "You're not. You're well behaved because a box is watching. Take the box away and you don't know what you'd do." },
      { type = "paragraph", content = "You look down at the band, then back up at your own eyes. The light on the band blinks. You don't." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You lean your forehead on the cool glass and close your eyes. Being out is supposed to feel like winning. Mostly it feels like waiting." },
      { type = "dialog", props = { speaker = "player" }, content = "Waiting for what, though?" },
      { type = "thought_bubble", props = { speaker = "player" }, content = "For something to happen. For somebody to look at you like you're more than paperwork. For a reason to break a rule, and a reason not to." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You check your face for the county. Then you check it for yourself, which is harder, because you have to be honest." },
      { type = "dialog", props = { speaker = "player" }, content = "You're scared. Say it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Scared of the box. Scared of the white line on the bridge. Scared of how badly you want to see what's past it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You stand in front of the cracked mirror on the back of the door. The crack runs across one corner, so your reflection has a line through it." },
      { type = "dialog", props = { speaker = "player" }, content = "Look at you. Out." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Out is six blocks and a curfew. But it's out, and you're not giving it back." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You put your left foot up on the bed so the mirror can see the band. Black, plain, one little green light. From across the room it could almost be jewelry." },
      { type = "dialog", props = { speaker = "player" }, content = "It isn't jewelry." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Anyone who looks at your legs sees the band first. Then they see your legs. You can't decide which one bothers you more." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You lean close to the glass until your breath fogs it. Tired eyes. A face that looks older than twenty-four, but not by much." },
      { type = "dialog", props = { speaker = "player" }, content = "Somebody's watching you. Every sixty seconds." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "The worst part is that you want someone to watch. A person, not a box. Someone who looks and actually sees you, not a dot." },
