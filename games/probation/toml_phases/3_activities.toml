[[canvases.nodes]]
id   = "talk_building"
name = "The building"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:rae_talk_building
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "How old is this building?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Older than me, and I'm old. My husband bought it when nobody wanted Bowen Street. He was stubborn like that." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Was. The word sits on the counter between us, and neither of us picks it up." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "The boiler's older than you, sweetheart. It knocks in the mornings, and it quits if you let it. I don't let it." },
      { type = "paragraph", content = "She taps the wall behind the counter where the pipes run up toward your room." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "My radiator is warm because Rae goes down to the basement and kicks something. Nobody at the county knows that." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Who else lives here?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "A cook, two brothers who fight about a car, the man who pays in quarters, a lady on the top floor who was here before me. And you, sweetheart. You're the only one who comes down to see me." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She says it like a joke, but she means it." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Did your husband run the laundry too?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "He hated the laundry. He bought the building for the flats. The machines were my idea, and they're the only thing on this street that ever made money." },
      { type = "paragraph", content = "She says it proudly, but she folds the next towel very carefully." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He was. She is. That's all she's giving me." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "I don't raise the rent. My husband said a building is only worth what the people in it can pay. He was soft that way." },
      { type = "paragraph", content = "She shrugs, but she's smiling at the ceiling where the pipes run." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Nobody on Bowen Street is soft. Except a man she only talks about in the past." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Do you own the whole building?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Every brick, sweetheart. Paid off. My husband said a paid building is the only friend that doesn't lie." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Said. She keeps her husband in the past tense, and she keeps him there on purpose." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Roof leaks over the top flat when the rain comes from the east. Boiler knocks. The ninth stair creaks. You'll learn them all, sweetheart." },
      { type = "paragraph", content = "She says it fondly, like she's listing a man's bad habits." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She loves this building. It's the only thing she talks about like that." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Do the tenants give you trouble?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "The brothers upstairs, sometimes. I bang on the pipe with a spoon and they stop. Everybody in this building knows my spoon." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "I want to hear the spoon. But I don't want it aimed at me." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "People ask why I don't sell. My husband said you don't sell the roof over other people's heads. He was a stubborn man." },
      { type = "paragraph", content = "She wipes the counter, but it's already clean." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Was. I let the word go past me, because she wants me to." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "My husband bought it the year the steel works shut. Everyone said he was mad. He was, a bit. It's paid off now, so he was right." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She says was. You don't ask." },
    ] },
  ] },
]
