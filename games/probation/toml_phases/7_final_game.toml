    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Do you own the whole building?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Every brick, sweetheart. Paid off. My husband said a paid building is the only friend that doesn't lie." },
