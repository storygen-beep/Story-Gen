      { type = "paragraph", content = "It ticks back. For twenty minutes you argue with a box on your ankle. You lose. But you don't care, because it's one argument you get to walk away from." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A man with a bag on his shoulder walks past you and over the line. He glances at your toes on the paint. Then he looks at the band, and he gets it. \"Hard luck,\" he says. He keeps going. You watch his back get smaller on the far half for most of the twenty minutes." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Hard luck. Like you tripped and landed on a court date." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Twenty minutes is twenty dots on the log. Every one of them says the bridge, the bridge, the bridge. You picture Delgado reading them out loud in that calm voice. It makes you angry, so you stand there longer, with your toes on the line and the box ticking." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Let him read it. Let him wonder what you wanted." },
    ] },
    { type = "paragraph", content = "You stand on the line with both feet together and your hands on the rail. The box ticks. The river goes under you. You want to scream at the far side, but you don't, because screaming at a bridge is how people end up in reports. So you grip the rail until your hands hurt instead." },
    { type = "group", blocks = [
      { type = "paragraph", content = "You stand at the line and pick one thing on the far side to look at: a rusted sign on the rail. You stare at it for twenty minutes. You can read every word on it, but you can't touch it, and that makes you want to cry for a stupid second. You don't. You just stand there with the box ticking." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "A sign. You're crying over a sign. Get a grip, Ridley." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You stand with your toes on the line and your eyes shut, and you pretend. Twenty minutes of pretending the tick is a clock on a train. Then a car horn goes, and your eyes open, and you're on the bridge. Your feet haven't moved, but you're angry at them anyway." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Good feet. Obedient feet. You hate them." },
    ] },
    { type = "paragraph", content = "You stand with your toes on the white paint. The river goes under you. On the far side a bar has its door open, and you can hear music, and you can't go." },
  ] },
]
