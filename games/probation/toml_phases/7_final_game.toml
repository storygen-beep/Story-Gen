id   = "shelf"
name = "The back shelf"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:marty_shelf
    { type = "paragraph", content = "The back shelf has a tin of beans, a can opener that works if you lean on it, and a fork in a mug. You eat the beans cold out of the tin. Marty walks past and pretends not to see you. But when you look up, there's a second tin on the shelf." },
    { type = "group", blocks = [
      { type = "paragraph", content = "There's half a loaf and a block of cheese in foil with KID written on it in marker. You make two thick sandwiches. You eat one and put the other in your bag, because later is when you run out." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He wrote your name on the cheese. Well. His name for you." },
    ] },
    { type = "paragraph", content = "Marty's back shelf is mostly paint, but the bottom row is food. Crackers, a jar of pickles, a bag of soft oranges. You eat two oranges over the sink, and the juice runs down your wrist. You wipe it off before anybody sees." },
    { type = "paragraph", content = "There's a microwave meal in the little fridge behind the shelf. The lid says Donna in a woman's handwriting. You put it back. You eat crackers instead, and you're hungry after, but it's the right kind of hungry." },
    { type = "group", blocks = [
      { type = "paragraph", content = "A bag of apples and a jar of instant coffee. You eat an apple standing in the doorway to the back, where you can see the counter. Marty comes past, takes the core off you and bins it like that's his job." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Take two, kid. They're going soft." },
    ] },
    { type = "paragraph", content = "Crackers, a jar of peanut butter, and a sandwich Marty says he bought by mistake. It's still in the wrapper with the price on, so you eat it." },
    { type = "paragraph", content = "Marty keeps soup cans on the back shelf and a kettle that works if you hold the switch. You eat standing up, because sitting down means you'll stay sitting down." },
    { type = "paragraph", content = "There's an apple, a pack of cookies, and a note in Marty's handwriting that says EAT. You eat. The note goes in your pocket, and you don't know why." },
  ] },
]
