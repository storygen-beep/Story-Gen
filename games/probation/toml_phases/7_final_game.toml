[[canvases.nodes]]
id   = "base"
name = "Rae"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:rae_hub
    { type = "group", blocks = [
      { type = "paragraph", content = "Rae is at the back counter with a stack of sheets. She looks up when you come in, and her eyes stay on you a second too long. But she doesn't ask where you've been." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Kettle's on in the back, sweetheart. Help yourself." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She never asks. I can't tell if that's kindness or if she knows already." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The clean towel sits folded on the dryer by the stairs. Rae sees you notice it." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "That's yours if you want it. Nobody else touches it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She put it there for me. She wants me to want it." },
      { type = "paragraph", content = "You leave it where it is. But you know exactly where it is, and so does she." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Sit down before you fall down, sweetheart. You look like the county's been chewing on you." },
      { type = "dialog", props = { speaker = "player" }, content = "Something like that." },
      { type = "paragraph", content = "Rae pushes a stool over with her foot. She doesn't ask what the county wanted. She folds a pillowcase and watches your hands instead of your face." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Rae is on the stool behind the counter with her glasses down her nose. She's doing the building's books in a paper ledger." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "The man in 2B pays me in quarters, sweetheart. A whole jar of them. I count them in front of him so he knows I'm counting." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She's telling me like it's a secret. She wants company more than she wants help." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Rae watches you over a basket of whites. She looks at the band on your ankle, then up at you, and she smiles like the band isn't there." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "You eat today, sweetheart?" },
      { type = "dialog", props = { speaker = "player" }, content = "Sort of." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "That's a no. There's bread in the back." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Rae is folding a man's work shirt. It's too big for anybody in the building. She folds it slowly and puts it on the shelf behind her, not in anybody's basket." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Her husband's, maybe. I'm not going to ask." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Don't look at me like that, sweetheart. It's a shirt." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The machines are loud, so Rae doesn't try to talk over them. She looks at you instead. It's a long look, and it isn't about your ankle." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Rae wants something from me. I don't know what, and she's not going to tell me." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Go on, sweetheart. I'm not going anywhere." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "There she is." },
      { type = "paragraph", content = "Rae says it like she was waiting for you, but she doesn't stop folding. The towel on the dryer by the stairs is square and white." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Every other towel in this building is grey. That one is white because it's for me." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Rae is emptying quarters from the machines into a coffee can. She stacks them in fives on the counter and doesn't look up." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "You can watch me or you can help me, sweetheart. I like both." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She likes being watched. So do I, maybe. That's the part nobody at the county wants to hear." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "You're up, sweetheart. Good. I like a face in here." },
      { type = "paragraph", content = "Rae says it without stopping. She's pairing socks from the lost and found into pairs that don't match. She hands you one pair." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "They're not even the same colour. She wants me to laugh, so I do." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Rae is leaning on the counter with her chin in her hand, watching you come in. She doesn't pretend she was doing anything else." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "I was hoping it was you, sweetheart." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Nobody hopes it's me. I don't know what to do with my hands." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Rae has the towel from the dryer by the stairs in her hands. She folds it, unfolds it, folds it. When she sees you, she puts it back, square on the dryer." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Nearly forgot, sweetheart." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She didn't nearly forget anything. She wanted me to watch her put it there." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Need anything, Rae?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "A new boiler and ten years back, sweetheart. Sit down. I'll settle for the company." },
      { type = "paragraph", content = "She pats the stool by the counter. Her hand stays on the seat until you come over, then she takes it back." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Rae is on her knees behind washer seven with a wrench. She looks up at you from the floor and blows the hair out of her face." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Hand me that rag, sweetheart. No, the blue one." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She's on the floor fixing a washer in her apron. I like her more than I planned to." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Rae watches you cross to the machines. You can feel it on your back, then lower. When you turn round, she's folding, but she's smiling." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Just looking, sweetheart. I'm allowed to look." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She is. It's her building. I don't mind as much as I thought I would." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Rae folds at the back counter. She knows when you come down the stairs, and she doesn't say so." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Sweetheart. Sit if you're sitting." },
    ] },
  ] },
]
