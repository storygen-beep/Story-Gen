[[canvases.nodes]]
id   = "counter_shift"
name = "The counter"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:marty_counter
    { type = "paragraph", content = "Four hours at the till. You sell sandpaper, a garden hose, and two keys that come out wrong, so you cut them over. A man tries to pawn a chainsaw with no chain. You say no, but you say it nice, and he buys a chain from you instead. Marty watches the whole thing from the back door with his arms folded." },
    { type = "group", blocks = [
      { type = "paragraph", content = "A woman comes in to buy back her mother's ring. She's short by nine dollars. You look at the ticket, then at her, then at Marty in the back. He shakes his head once, so you tell her no. She cries in front of the glass case. You hand her a tissue from under the till, because it's all you've got." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Nine dollars. You want to pay it yourself, but it's his rule and his shop." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The till won't balance at the end. It's four dollars over, and over is worse than under, because over means you shorted somebody. You go through every slip twice. Marty comes out and finds it in two minutes. You rang up a hammer as a hatchet." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Hatchet's four more than a hammer. Easy mistake." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "It's not an easy mistake. It's a stupid one, but he said easy, so you breathe." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A man in a suit pawns a laptop and wants two hundred for it. You offer ninety. He calls you a name and asks for the owner. Marty comes out, reads the ticket, and says ninety is generous. The man takes ninety and leaves angry." },
      { type = "dialog", props = { speaker = "player" }, content = "You could have gone a hundred." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "I could have. But you said ninety, kid, so ninety's the price." },
    ] },
    { type = "paragraph", content = "Nobody comes in for an hour, so you sort the screw box. Wood screws, machine screws, the ones nobody can name. Then a plumber buys forty dollars of fittings in five minutes, and you find every one without asking. You feel stupid proud about that. By the end your hands are grey with metal dust, and Marty is at the counter doing the drawer." },
    { type = "paragraph", content = "A girl about your age comes in with a guitar case. She wants bus money. You write the ticket and count out sixty. She sees the band when you bend for the drawer. She doesn't say anything, but she looks at you like she's glad somebody else got caught. When she's gone, Marty comes out and looks at the guitar for a long time." },
    { type = "group", blocks = [
      { type = "paragraph", content = "Two men argue at your counter about a box of nails. It's the last box. You tell them there's more in the back, which is a lie, and you sell them half a box each. They leave friends. Marty is leaning in the back doorway, grinning at you." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "There's no more nails in the back." },
      { type = "dialog", props = { speaker = "player" }, content = "There's half a box each, Marty. Everybody's happy." },
    ] },
    { type = "paragraph", content = "It's a long four hours. Your feet ache, and your ankle aches worse under the band. You sell a toilet seat, a ladder and a pawned camera. Your count comes out right on the first try. You hold the drawer slip up so Marty can see it, and you're grinning like an idiot." },
    { type = "group", blocks = [
      { type = "paragraph", content = "A boy from down the street comes in to buy batteries with a jar of coins. You count every coin on the counter while a man in line sighs at you. It comes to a dollar short. You put a dollar of your own in the drawer. When you look up, Marty is at the end of the counter, and he saw it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He's not going to say anything. But you can tell by his face he'll think about it all night." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A man brings in a box of records to pawn. You don't know records, so you go slow. You look up two of them in Marty's price book, and they're worth more than the man is asking. You tell him so. He looks at you like you're crazy, but he takes the extra." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "You just cost me fifteen bucks, kid." },
      { type = "dialog", props = { speaker = "player" }, content = "I just got you a customer who comes back." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Four hours and one shoplifter. A teenager puts a tape measure in his hoodie, and you see it in the security mirror. You don't shout. You walk round the counter, hold out your hand, and wait. He gives it back. You know that trick, and he can tell you know it." },
      { type = "paragraph", content = "Marty saw it from the back. He doesn't say a word, but at the end of the shift he brings you a soda from the fridge." },
    ] },
    { type = "paragraph", content = "Four hours of washers, fuses and one angry man with a broken saw. You sell him a new saw, and he thanks you like it was your idea. At the end Marty counts your drawer and tells you it's right to the cent. You didn't know how much you wanted to hear that." },
    { type = "paragraph", content = "A kid comes in to pawn a games console that is very obviously his brother's. You tell him no. He calls you a name, and you tell him you've been called worse by better, and Marty laughs so hard in the back he has to put the lawnmower down." },
    { type = "paragraph", content = "It rains, so the shop fills with men who don't want to go home. They talk about the ball game, the price of copper, and whose wife left. You sell them nothing, but you stand there anyway, and they tip their caps when they leave." },
    { type = "paragraph", content = "A woman buys a padlock, then comes back for a second one. She doesn't say why and you don't ask. You know what two locks on one door means. You give her the good ones for the price of the cheap ones." },
    { type = "paragraph", content = "Slow, then busy, then slow. You learn where the fuses are without looking. By the end of the shift your feet hurt, your back hurts, and there's forty-five dollars in your pocket that nobody gave you out of pity." },
  ] },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Good shift, kid. Go eat something." },
]
