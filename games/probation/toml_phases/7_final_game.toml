    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "People ask why I don't sell. My husband said you don't sell the roof over other people's heads. He was a stubborn man." },
      { type = "paragraph", content = "She wipes the counter, but it's already clean." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Was. I let the word go past me, because she wants me to." },
