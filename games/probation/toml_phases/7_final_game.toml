      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Long enough to pay four months. Not long enough for me to learn how she took her tea." },
      { type = "paragraph", content = "Rae turns away to the dryers, but her shoulders are stiff." },
