id   = "counter_dock"
name = "Plugged in"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:marty_dock
    { type = "group", blocks = [
      { type = "paragraph", content = "You plug in and sit on the stool with your heel up on the low shelf. The cable runs from the socket up the inside of your calf to the box. Marty comes over for a receipt pad and stops. He follows the cable all the way up. His eyes pass the box and keep going." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "You'll trip on that, kid." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "You won't, and he knows you won't. He wanted a reason to keep looking." },
    ] },
    { type = "paragraph", content = "An hour at the counter on a short leash. The cable won't reach the far end, so you serve everybody from one spot and make them come to you. They come. Marty brings you coffee so you don't have to unplug. He sets it down, looks at the cable where it runs up your leg, then looks hard at the ceiling." },
    { type = "group", blocks = [
      { type = "paragraph", content = "A customer wants a key cut, and the machine is at the end of the counter. You can't reach it plugged in. Marty cuts it for you and brings it back. The cable is between your foot and his boots, so he steps over it carefully, like it's something of yours he shouldn't touch." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Tell me when it beeps. I'll take the till." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The dock sits under the till, so you sit sideways to reach it, and the cable runs over your knee. Marty leans on the counter across from you with the crossword. He isn't doing it. He's looking at the red light on your ankle, then at your knee, then at the pen in his hand." },
      { type = "dialog", props = { speaker = "player" }, content = "Seven down is shackle, Marty." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "I know what seven down is, kid." },
    ] },
    { type = "paragraph", content = "You sit on the stool with your foot on the shelf under the counter and the cable up your leg. Customers can't see it, but Marty can, and he looks every time he walks past." },
    { type = "paragraph", content = "An hour on the dock behind the counter. You serve customers with the box charging under the till, and nobody knows. The light goes from red to green while you sell a man a hinge." },
  ] },
]
