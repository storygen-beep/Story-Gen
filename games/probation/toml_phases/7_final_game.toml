id   = "night_sit"
name = "The night sit"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:laundry_sit
    { type = "group", blocks = [
      { type = "paragraph", content = "Three hours on the bench, and the machines do most of the work. A man from the second floor brings in his work shirts. A woman washes one sleeping bag and leaves. You fold two baskets nobody came back for and label them with masking tape." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Thirty. Don't argue, sweetheart. You earned it sitting put, and sitting put is the hard part." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Thirty dollars to sit in the one room where the box blinks green. Best job I've got." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The lights go out in the second hour. Dryer six and the ceiling share a fuse, and dryer six is hungry. You find the fuse box behind the soap shelf by feel. A spare is taped inside its door with a note in Rae's handwriting: FOR WHEN SIX DOES IT." },
      { type = "paragraph", content = "You swap it. The lights come back, and somebody on the bench claps." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Thirty, sweetheart. I'm not charging you for the dark." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A drunk wanders in off Bowen Street to get warm. He tries to climb into dryer two. You tell him no, but he's twice your size, so you tell him nicely. He sits on the bench and sings to the machines until he falls asleep." },
      { type = "paragraph", content = "When the three hours are up, he's snoring. Rae steps round his boots to count thirty into your hand." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "He's harmless, sweetheart. Leave him. I'll wake him with coffee." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A man in a hi-vis jacket does his wash and doesn't take his eyes off you. He asks what the band is. You tell him it's a fitness tracker. He laughs, because nobody believes that, but he stays on the bench until his dryer stops." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He liked it. The band, I mean. Some men like knowing a girl can't leave." },
      { type = "paragraph", content = "Rae pays you at the end, thirty in fives, and says nothing about him. But she saw." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Nobody comes in for the first hour, so you fold. Rae's clean sheets, a tenant's towels, a whole basket of baby vests so small they fit in your palm. Corner to corner, halve it, halve it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Folding is easy. Nothing I fold can report me to anybody." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Neat. Neater than me, sweetheart. Here's your thirty." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Two women from the third floor fight over dryer five. One says she was first. The other says she put a quarter in. You settle it by giving the second one a quarter from your own pocket. They both call you a saint, but they leave without speaking to each other." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Thirty for you, and your quarter back. Don't pay my tenants out of your own pocket, sweetheart. That's my job." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Number eleven floods. Soapy water runs across the floor toward the drain, but the drain is slow. You mop for twenty minutes with a mop that is mostly handle, until the tiles show through." },
      { type = "paragraph", content = "Rae comes out, sees the floor, and laughs." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Eleven does that when it's full. I should've warned you. Thirty, sweetheart, and a dry pair of socks if you want them." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A couple come in to wash their sheets together. They make out against dryer four while it spins and forget you're on the bench. You stare at the NO DYES sign until they leave." },
      { type = "paragraph", content = "At the end Rae counts thirty into your palm and nods at dryer four." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "I charge them for the dryer, sweetheart, not for the show." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Somebody's dryer finishes and nobody comes for it. You fold a stranger's things: work trousers, three plain shirts, a dress with its tag on. You leave the pile on the bench with a note that says FOLDED BY THE NIGHT GIRL." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "The night girl. I like that, sweetheart. Thirty for the night girl." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A kid in a hoodie tries the coin slot on the change machine with a bent spoon. You stand up. You don't say anything, you stand. He looks at your face, then at the band on your ankle, and he leaves." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "The band scared him off. Good. It can earn its keep." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Thirty, sweetheart. I saw that. Nicely done." },
    ] },
    { type = "paragraph", content = "Three hours on the bench with the machines. You change a fuse, stop a man from putting dye in number four, and fold a stranger's shirts because they were there. Rae pays you in cash from her apron and doesn't count it in front of you." },
  ] },
]
