[[canvases.nodes]]
id   = "van_shift"
name = "The van"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:marty_van
    { type = "group", blocks = [
      { type = "paragraph", content = "A chest freezer to the lot behind the shut bakery, for a man who's turning it into a workshop. He helps you carry. He sees the band and asks how far it lets you go. You tell him six blocks and half a bridge." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Six blocks. You drove a stolen car across two counties once, and nobody put a band on the car." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Ten tins of paint to the county office for the stairwell. A clerk signs for them without looking up. You drive back past the bus shelter and slow down, because a bus is pulling in. The sign on its front names a town across the river." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "You could park the van and get on. You'd get as far as the bridge before the box starts ticking." },
    ] },
    { type = "paragraph", content = "The last drop is two streets from the river. The box starts to tick at the corner, fast and small, like a watch with a bad heart. You leave the lawnmower at the curb instead of in the garage. The man shouts. You shout sorry out of the window and turn the van round before the tick turns into anything worse." },
    { type = "group", blocks = [
      { type = "paragraph", content = "The van is Marty's, and it smells like him, oil and coffee and the cigarettes he says he quit. There's a photo of a woman in scrubs taped to the dash. You don't ask. You make four deliveries inside the zone, and you keep your eyes off her." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She smiles at the windshield all day. You wonder if she knows he's got a girl with a band driving it." },
    ] },
    { type = "paragraph", content = "A crate of hinges for a man building a porch on the fourth block. You reverse the van into his drive in one go, and he claps. You don't know where to look when a man claps for you. You say thanks, but you say it to the steering wheel." },
    { type = "paragraph", content = "The brakes pull left. You tell Marty's van about it out loud at every stop. You make five drops on Bowen Street, all short, all inside the lines. The box doesn't make a sound. That's the point, but it feels like a leash with the slack taken out." },
    { type = "group", blocks = [
      { type = "paragraph", content = "A new mattress for the building next to yours, third floor, no lift. The man who ordered it watches you drag it up the stairs alone. He asks if Marty pays extra for stairs. You say Marty pays you in sandwiches. He laughs, but he tips you five dollars, and you take it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Five dollars for stairs. You'd have hauled it for free, but you're not telling him that." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Two bags of cement for the bus shelter, where the county is fixing the bench. The foreman looks at the band before he looks at the cement. He asks if you can lift. You lift both bags out of the van at once, one on each shoulder, and put them down at his feet." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "He can look at the band all he likes. He's the one who needed help with the bags." },
    ] },
    { type = "paragraph", content = "Three deliveries, all inside the zone. The van pulls left and the brakes squeal, but you drive it like it owes you money. On the last run the box starts to tick near the river, so you turn back two streets early." },
    { type = "paragraph", content = "A water heater to a woman on the fourth floor. She watches you carry it up the stairs and asks if you're the new girl at Marty's. You say yes. She looks at your ankle and says she'll tell her sister, and you don't know if that's good." },
    { type = "paragraph", content = "You drive with the window down. For forty minutes nobody is watching you except the box, and the box can't see your face. You sing. Badly. It's the best part of the week, and it's work." },
    { type = "paragraph", content = "The van runs the edge of the zone like a fence. You can see the bridge from the last stop, the white line on it, and the far side behind it. You park there longer than the delivery takes, but you don't cross." },
  ] },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Van's in one piece. So are you. That's a good day around here." },
]
