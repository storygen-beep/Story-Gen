    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Do the tenants give you trouble?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "The brothers upstairs, sometimes. I bang on the pipe with a spoon and they stop. Everybody in this building knows my spoon." },
