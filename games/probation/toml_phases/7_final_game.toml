  { type = "paragraph", content = "Marty counts the hundred and twenty twice, then plugs a second dock into the socket under the counter. It's the same model as the one in your room, and it's ugly, and it's yours." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Now you don't have to run home on a Thursday. Don't make me regret it, kid." },
