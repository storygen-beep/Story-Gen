[[canvases.nodes]]
id   = "base"
name = "Headlights"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:bridge_car
    { type = "paragraph", content = "A car stops on the far half of the bridge, just past the line. The driver gets out, leans on the rail and lights a cigarette. He looks at you across the paint. \"Coming?\" he calls. You shake your head. He shrugs, flicks the cigarette into the river and drives off." },
    { type = "paragraph", content = "A car parks on the far half with its engine running. Nobody gets out. You stand on your side of the line and it sits on its side, and neither of you moves. After a minute it pulls away. You realise your hands are shaking, but you don't know why." },
    { type = "group", blocks = [
      { type = "paragraph", content = "A white county car rolls slowly over the far half. The driver looks at your ankle, then at the line, then at you. He doesn't stop. But he doesn't speed up either, until he's past." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Was that for you? It feels like it's for you. No. Stop it." },
    ] },
    { type = "paragraph", content = "A car on the far half honks twice. A woman in the passenger seat waves at you. You wave back before you know why. Then the car goes round the bend. You're left at a painted line, waving at nobody." },
    { type = "paragraph", content = "A car stops on the far half, and a man leans out of the driver's window. \"Need a lift?\" He means it kindly. You point at your ankle. He looks, says \"Ah,\" and drives on, but slower, like he's sorry." },
    { type = "paragraph", content = "A car on the far half has its music up so loud you can feel it in the rail. It stops, the doors open, and two women get out to take a photo of the river. They're laughing. Neither one looks at the line. You want to be them so badly your chest hurts, but you only watch." },
    { type = "paragraph", content = "A car slows on the far half of the bridge. The window comes down. Nobody says anything. Then it goes on, and you realise you were holding your breath." },
  ] },
]
