    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Roof leaks over the top flat when the rain comes from the east. Boiler knocks. The ninth stair creaks. You'll learn them all, sweetheart." },
      { type = "paragraph", content = "She says it fondly, like she's listing a man's bad habits." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She loves this building. It's the only thing she talks about like that." },
