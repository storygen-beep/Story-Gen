[[canvases.nodes]]
id   = "books_shift"
name = "The books"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:marty_books
    { type = "group", blocks = [
      { type = "paragraph", content = "The ledger lives in a drawer under the till. You open it on the counter and pick up Marty's pencil. Your handwriting fills the column, small and neat, each number square in its box. It's the same hand that wrote eleven checks. It looks exactly as honest." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Nobody could tell the difference. That's the part that scares you." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Pawn interest is a column nobody adds up. You add it up. Marty is owed three hundred and ten dollars by people who come in and look sorry. You write the total and underline it. You could round one man's number down, and nobody would ever know you did it for him." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "You don't round it. You want to, but that's how it starts." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Marty's signature is on every invoice. It's a big slanted M and a line. You look at it for too long. Your hand knows how to make it, and you can feel the shape in your wrist." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Don't. He's the man who signs your sheet." },
      { type = "paragraph", content = "You close the invoice book and do the sums instead." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The supplier bill doesn't match the delivery note. Twelve boxes of hinges charged, ten on the shelf. You count the shelf twice, then write a note in the margin. Marty comes out and reads it over your shoulder. He's close enough that you can smell the oil on his hands." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Twelve. The crooks." },
      { type = "dialog", props = { speaker = "player" }, content = "Ten. I'll call them, if you want." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Four hours of columns. Your pencil goes blunt twice, so you sharpen it with Marty's box knife. The pawn tickets, the sales slips and the bank slips all agree by the end. You sit back and look at the page. Anybody could audit it, and there's not one lie on it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "A clean page that pays fifty dollars. Honest work is slower, but nobody comes looking for it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A customer's check is on the spike by the till. You unclip it and look at it properly. The signature wobbles and the date is wrong. It's a bad job, so you know it's not a forgery. It's an old man with shaky hands." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "You'd have done it cleaner. You hate that you thought that." },
      { type = "paragraph", content = "You enter it in the book and put it back on the spike." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Marty keeps the cash book in two handwritings. Both are his. One is careful and one is angry. You copy the angry pages into the careful book. Halfway down one page there's a pawn ticket with no name on it. It's for a man's watch, and it's dated before you were born." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "You don't ask. You copy it in neat and move on, but you think about that watch the whole shift." },
    ] },
    { type = "paragraph", content = "Marty's ledger is a shoebox of receipts and a book with coffee rings on every page. You sort it in two hours, and then you find the thing he's been losing. It's forty dollars a month, and it goes to a man who hasn't bought anything since spring." },
    { type = "paragraph", content = "You balance the pawn tickets against the shelf. Two items are missing and one is sold twice. You fix it in pencil, because Marty trusts pencil and doesn't trust you with a pen yet." },
    { type = "paragraph", content = "Neat columns, the same handwriting that got you eleven counts. You notice how easy it would be to move a number, so you don't. Not yet, and not here. But you notice." },
    { type = "paragraph", content = "The books are a mess, so you make them not a mess. Marty stands behind you and reads over your shoulder, and he breathes through his mouth, and he doesn't say anything for a long time." },
  ] },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marty" }, content = "Nobody's made that book make sense in ten years. Don't let it go to your head." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "It already has. It's nice to be good at something that doesn't get you arrested." },
]
