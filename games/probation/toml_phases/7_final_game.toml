# ═════════════════════════════════════════════════════════════════ HER ROOM ══
[[canvases]]
id          = "room_life"
name        = "Your room"
description = "The dock, the bed, the shower, the kettle, the mirror."
[canvases.trigger]
location      = "her_room"
is_repeatable = true
priority      = 5
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Your room"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:room_base
    { type = "group", blocks = [
      { type = "paragraph", content = "You open the window a crack and lean on the sill. Bowen Street sits down there, six blocks of it, with the bridge at the bottom." },
      { type = "paragraph", content = "You could walk the whole zone in fifteen minutes. A day is a lot longer than fifteen minutes, but that's all the street you get." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "So you stay up here. At least up here the walls are yours." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You lie on the floor for a change, flat on your back with your arms out. The boards are hard. It's the one spot in the room the bed doesn't cover." },
      { type = "paragraph", content = "The box rests on its side against the boards, its green light blinking up at the ceiling." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Look at you. A grown woman lying on a floor because she's run out of places to be." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You pace. Door to window is five steps. Window to shower is three. You walk the loop until you hate the numbers." },
      { type = "paragraph", content = "The band taps your ankle bone with each step, a small hard tap. It isn't loud, but you notice it." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "You're allowed to be restless. The court order says nothing about restless." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The box blinks green on your ankle. Green means home. Home is one room over a laundry, with a bed, a shower, a kettle and a dock by the socket." },
      { type = "paragraph", content = "It isn't much, but the door locks from the inside. The county has a key to your ankle. It doesn't have one to this door." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Six blocks and one room. You've had worse, but you've never been counted like this." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You drop onto the bed and it sags in the middle. The mattress is so thin you can feel the slats, so you roll onto your side." },
      { type = "paragraph", content = "From here you can see everything you own. It takes about four seconds." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Four seconds of stuff. You could pack all of it in a pillowcase, if anyone let you leave." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The dock sits by the socket like a little black dog. The cable is short, so wherever the dock lives, you live for ninety minutes at a stretch." },
      { type = "paragraph", content = "You glance down at the box. It blinks green, because you're where you're supposed to be. You hate how good that feels." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "It's a light. It's a stupid little light, but you want it to like you." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You stand in the middle of the room and turn in a slow circle. Bed, shower, kettle, mirror, door. The window looks down on Bowen Street." },
      { type = "paragraph", content = "Everything you can reach from here sits inside the zone. The bridge is at the bottom of the street, but you can't see the white line from up here." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Good. If you could see it, you'd stand at this window and stare at it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You sit on the edge of the bed and pull your left foot into your lap. The band is snug and black and warm from your skin." },
      { type = "paragraph", content = "There's no clasp. There's only a seam and one tiny screw that needs a tool you don't own. You twist the band a quarter inch so it stops rubbing the bone. It rubs the bone somewhere else." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Somebody at the county owns that tool. Somebody gets paid to own it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "It's quiet up here. You're alone, so you can say anything out loud and nobody writes it down." },
      { type = "paragraph", content = "The box only logs where you are. It doesn't care what you think, but it sits so close to your skin that it feels like it does." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "So say it. You're bored out of your mind. You're a little scared. Mostly you want something to happen." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You lie on the bed with your arms behind your head and look at the ceiling. There's a water stain up there shaped like nothing in particular." },
      { type = "paragraph", content = "The laundry is under the floor. The roof is over the ceiling. Around all of it, a computer somewhere draws a line six blocks wide." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "You're twenty-four. You should be out somewhere, but you're in here being a dot on a map." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "You check the lock on the door. Then you check it once more, because checking is free." },
      { type = "paragraph", content = "The mirror on the back of the door shows you half your face and the crack across the corner. The box blinks green at your ankle. Home. Logged. Fine." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Fine is the word for it. It isn't good, but fine beats a courtroom." },
    ] },
    { type = "paragraph", content = "The dock blinks by the socket. The bed takes up half the room and the shower takes up the rest, but it's yours, and the door locks from the inside." },
  ] },
]
