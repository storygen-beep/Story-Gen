[[canvases.nodes]]
id   = "base"
name = "The laundry"
blocks = [
  { type = "block_pool", blocks = [
    # POOL:laundry_base
    { type = "group", blocks = [
      { type = "paragraph", content = "The laundry sits right under your room. Twelve washers, eight dryers, one long bench bolted to the floor. The box on your ankle blinks green down here, because the county counts it as home. You can come down the stairs at any hour. The log says you never left." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "It's the only room in the zone where I'm not watching the clock." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Number nine eats quarters. Somebody taped a card over its slot that says USE TEN, in thick black marker. The change machine by the door takes fives but not twenties. You count what's in your pocket before you count anything else, because two dollars is real money on what you earn." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Two dollars. That's a sandwich at the shelter end of the street. I pick clean clothes." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "There's a lost and found basket on top of dryer eight. One sock, a kid's mitten, and a black lace bra nobody came back for. You look at the bra longer than you mean to. It's nicer than anything you own, and it's your size." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Somebody in this building has money for lace. It isn't me. But I could take it, and nobody would know." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A corkboard by the door holds the building's notices. Rent due on the first. Quiet after eleven. A card for a man who fixes phones, but the number is torn off. Under it, in Rae's handwriting: THE MACHINES ARE NOT A BED." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "I've sat on worse than a dryer. I'm not going to tell Rae that." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Somebody has left a paperback face down on the bench, swollen from the steam. You pick it up. It's a romance with a shirtless man on the cover, and the corner of page ninety is folded down." },
      { type = "paragraph", content = "You read the page standing up. It's filthy, and your face goes hot. You put it back the way you found it, but you remember the page number." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Page ninety. I'm coming back for page ninety." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "Down here the band on your ankle is just a black band. Nobody looks at it, because half the people who wash here have something of their own to hide. You catch yourself in the glass door of a dryer: tired face, messy hair, the box." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "In the glass I look like somebody who's allowed to be here. I am. Six blocks of allowed." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A price list is screwed to the wall above the washers. WASH $2. SOAP, ASK RAE. You like that it says ask Rae. It means one person runs this place and knows where the soap is, even when the stool behind the back counter is empty." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "On Bowen Street everything is signed by somebody. Delgado signs my log. Rae signs the soap." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The folding table has a burn mark shaped like an iron. You put your hand flat on it, because it's warm from the dryers. From the bench you can see the street through the glass door: the bus shelter, the county office, the dark front of the bakery." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Most of my zone fits in one window. That's how small it is. But it's mine, so I sit and look at it." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The bench faces the machines, so whoever sits there faces the drums. There's a plastic chair by the back counter with a cushion on it, and nobody sits in that one. It's Rae's. Even the drunks know." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Everybody on this street has a chair they don't sit in. Mine is on the far side of the bridge." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "The soap dispenser on the wall is empty, but a box of powder sits under it with a scoop and a jar for coins. You look at the jar for a second, because there are bills in it, and nobody is watching you." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Nobody down here asks what I did. I'm not giving them a reason. I put a quarter in." },
    ] },
    { type = "group", blocks = [
      { type = "paragraph", content = "A washer finishes down the row and plays three flat beeps. Nobody comes for it. You lift the lid and find a man's work shirts, wet and tangled, with a name sewn into each collar." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "Somebody's mother sewed his name in. Nobody sews my name in anything. The county put it on a band." },
    ] },
    { type = "paragraph", content = "Twelve washers, eight dryers, a bench, and a sign that says NO DYES in Rae's handwriting. The street door stays propped open with a brick. It smells like hot cotton and bleach." },
  ] },
]
