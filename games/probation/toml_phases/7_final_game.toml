    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Her box was newer than yours. Shinier. That's all I noticed, because it's all she let anybody notice." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "A newer box. They reissue boxes. I don't know whose mine was before it was mine." },
      { type = "paragraph", content = "Rae goes back to her sheets, but she watches you look down at your ankle." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "player" }, content = "Was she in trouble?" },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Everybody with a band is in trouble, sweetheart. She tipped me for the towels. Nobody tips me." },
      { type = "paragraph", content = "Rae goes back to folding. She closes the subject, but she closes it kindly." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "She's protecting her. Or she's protecting me from her." },
    ] },
    { type = "group", blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "She sat on that dryer by the stairs. Right there." },
      { type = "paragraph", content = "Rae says it without looking at you. Then she looks at you." },
      { type = "thought_bubble", props = { speaker = "player" }, content = "That's the dryer with my towel on it. I don't know if that's a comfort or a warning." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Don't make that face, sweetheart. I told you one thing. One thing is plenty." },
