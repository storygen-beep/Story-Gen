# =============================================================================
# Probation — 0_systems_spec
# TEST BUILD for the author-game-v2 skill test (2026-09-29). Built from
# games/probation/proposals/, which LO has NOT yet placed or signed. Not a release.
#
#   HER TIERS      radius · hours · vouch     (who_climbs = player)
#   COUNTERWEIGHT  clean — her record. Falls; review 1 needs 60.
#   THE BOX        battery — spent, not decayed; zone exits need 20+.
#   NEEDS          rest · food · wash — each shuts a door
#   THE DAY COUNT  review_days — +1 a night; the reviews read it.
# =============================================================================

schema_version = "1.0"

[project]
id              = "probation"
title           = "Probation"
description     = "Cass Ridley, 24, walks out of the county office with a box on her ankle that logs a point every sixty seconds. Thirty days clean and the zone reaches the bridge. Somebody has already made the box lie."
starting_canvas = "delgado_01_intake"
quests_engine   = "v2"
version         = "0.1"

# OPENING.md proposal: 12:40 so Tobin (Tue 09-13) fits the band inside his own hours.
# SP1 as signed says 15:00 — open question to LO.
[time]
starting_hour = 12
starting_day  = "Tuesday"
starting_week = 1

[settings]
narration_person = "second"
clothing_enabled = false

[theme]
mode = "dark"

# ── what the player reads ───────────────────────────────────────────────────
[[sidebar_items]]
type  = "trait_status_text"
trait = "battery"
label = "The box"
bands = [
  { min = 0,  max = 4,   text = "It is beeping" },
  { min = 5,  max = 19,  text = "It will start beeping tonight" },
  { min = 20, max = 49,  text = "Getting low" },
  { min = 50, max = 89,  text = "Fine" },
  { min = 90, text = "Full" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "clean"
label = "Your record"
bands = [
  { min = 0,  max = 39, text = "Delgado wants Thursdays too" },
  { min = 40, max = 59, text = "A review would not go your way" },
  { min = 60, max = 89, text = "Clean enough to sign" },
  { min = 90, text = "Nothing on it" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "rest"
bands = [
  { min = 0,  max = 24, text = "Too tired for a shift" },
  { min = 25, text = "Awake enough" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "food"
bands = [
  { min = 0,  max = 29, text = "Too hungry to work" },
  { min = 30, text = "Fed" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "wash"
bands = [
  { min = 0,  max = 39, text = "Not fit for the county office" },
  { min = 40, text = "Clean" },
]

[[sidebar_items]]
type       = "trait_bar"
trait      = "money"
label      = "Money"
max        = 400
hide_value = false

