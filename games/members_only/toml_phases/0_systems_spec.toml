# ── the guidance page ────────────────────────────────────────────────────────
# One card per tier and a chain per person. Every track stops at the build's edge with a
# plain marker, never "Arc complete" (engine.md §23).
[[quest_cards]]
text     = "Dana stopped writing in May. Somebody on this cliff knows why."
tip      = "Work your shift at the Bar. Kessler waits in the Library after close."
priority = 10
when     = [ { flag = "opening_done", subject = "player", op = "is_true" },
             { trait = "kessler_stage", subject = "player", op = "lt", value = 1 } ]
goals    = [ { flag = "first_shift_done", subject = "player", op = "is_true", label = "Work your first shift at the Bar (18:00–22:00)" },
             { trait = "kessler_stage", subject = "player", op = "gte", value = 1, label = "Find Kessler in the Library after close (22:00–23:00)" } ]

[[quest_cards]]
text     = "Dana's pages lead to Julian's safe. The members' book is in there."
tip      = "Keep reading for Kessler. Page four says where the book is."
priority = 10
when     = [ { trait = "kessler_stage", subject = "player", op = "gte", value = 1 } ]
goals    = [ { trait = "kessler_stage", subject = "player", op = "gte", value = 4, label = "Hear Dana's pages, one to four, in the Library" } ]

[[quest_cards]]
text     = "Being looked at. The better the dress, the better the table."
tip      = "Work the floor. Swim after 22:00. A dress of your own is in the shop in town."
priority = 5
when     = [ { flag = "opening_done", subject = "player", op = "is_true" },
             { trait = "shown", subject = "player", op = "lt", value = 5 } ]
goals    = [ { trait = "shown", subject = "player", op = "gte", value = 5, label = "Be seen: shifts, the pool, the path" } ]

# The paid climb (the-arc.md A15): Noor raises it, the note, room six. Then the Upstairs card.
[[quest_cards]]
text     = "Noor knows how the girls here really make their money."
tip      = "The Dressing Room, 17:15 to 18:00, Tuesday to Saturday, after your first shift."
priority = 5
when     = [ { flag = "first_shift_done", subject = "player", op = "is_true" },
             { flag = "heard_about_upstairs", subject = "player", op = "is_false" } ]
goals    = [ { flag = "heard_about_upstairs", subject = "player", op = "is_true", label = "Talk to Noor in the Dressing Room before your shift (17:15–18:00)" } ]

[[quest_cards]]
text     = "Somebody on the bar floor wants you upstairs."
tip      = "Work the Bar, 18:00 to 22:00, Tuesday to Saturday. Table six is watching."
priority = 5
when     = [ { flag = "heard_about_upstairs", subject = "player", op = "is_true" },
             { flag = "took_the_note", subject = "player", op = "is_false" } ]
goals    = [ { flag = "took_the_note", subject = "player", op = "is_true", label = "Get the note from table six at the Bar (18:00–22:00)" } ]

[[quest_cards]]
text     = "Room six. Any night. $100."
tip      = "Upstairs, 18:00 to midnight, Tuesday to Saturday. Be done up and rested."
priority = 5
when     = [ { flag = "took_the_note", subject = "player", op = "is_true" },
             { flag = "first_visit_done", subject = "player", op = "is_false" } ]
goals    = [ { flag = "first_visit_done", subject = "player", op = "is_true", label = "Go to room six Upstairs (18:00–midnight)" } ]

[[quest_cards]]
text     = "Upstairs. When a member asks for you, you go up. One visit a night."
tip      = "Upstairs, 18:00 to midnight, Tuesday to Saturday. Be done up and rested."
priority = 5
when     = [ { flag = "first_visit_done", subject = "player", op = "is_true" },
             { trait = "favour", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "favour", subject = "player", op = "gte", value = 15, label = "Be asked for by name Upstairs" } ]

[[quest_cards]]
text     = "Where staff don't go. The service stairs are behind Ade's bar."
tip      = "Ade knows how Dana got upstairs. Ask him on his day off."
priority = 5
when     = [ { flag = "opening_done", subject = "player", op = "is_true" },
             { trait = "nerve", subject = "player", op = "lt", value = 10 } ]
goals    = [ { trait = "nerve", subject = "player", op = "gte", value = 10, label = "Take the service stairs after close (22:00–23:00)" } ]

# Kessler
[[quest_cards]]
npc_id   = "kessler"
text     = "Kessler has Dana's diary, and he wants you to read it to him."
priority = 1
when     = [ { flag = "opening_done", subject = "player", op = "is_true" },
             { trait = "kessler_stage", subject = "player", op = "eq", value = 0 } ]
goals    = [ { trait = "kessler_stage", subject = "player", op = "gte", value = 1, label = "Kessler: the Library after close, Tue–Sat (22:00–23:00)" } ]

[[quest_cards]]
npc_id   = "kessler"
text     = "Page two. He wants you in the red one, the one she wore."
priority = 2
when     = [ { trait = "kessler_stage", subject = "player", op = "eq", value = 1 } ]
goals    = [ { flag = "has_red_dress", subject = "player", op = "is_true", label = "Get Dana's red dress from her locker (ask Noor)" },
             { trait = "kessler_stage", subject = "player", op = "gte", value = 2, label = "Page two: the Library, Thursday (22:00–23:00)" } ]

[[quest_cards]]
npc_id   = "kessler"
text     = "Page three. He wants you closer."
priority = 3
when     = [ { trait = "kessler_stage", subject = "player", op = "eq", value = 2 } ]
goals    = [ { trait = "shown", subject = "player", op = "gte", value = 5, label = "Be seen more: shifts, the pool, the path" },
             { trait = "kessler_stage", subject = "player", op = "gte", value = 3, label = "Page three: the Library, Tue–Sat (22:00–23:00)" } ]

[[quest_cards]]
npc_id   = "kessler"
text     = "Page four. He'll ask what you want for it."
priority = 4
when     = [ { trait = "kessler_stage", subject = "player", op = "eq", value = 3 } ]
goals    = [ { trait = "favour", subject = "player", op = "gte", value = 5, label = "Go upstairs with a member" },
             { trait = "ade_stage", subject = "player", op = "gte", value = 2, label = "Hear what Ade knows, at the Docks on Monday" },
             { trait = "kessler_stage", subject = "player", op = "gte", value = 4, label = "Page four: the Library, Tue–Sat (22:00–23:00)" } ]

[[quest_cards]]
npc_id   = "kessler"
text     = "Page five is in his room upstairs. His door opens at 23:00."
priority = 5
when     = [ { trait = "kessler_stage", subject = "player", op = "eq", value = 4 } ]
goals    = [ { trait = "nerve", subject = "player", op = "gte", value = 10, label = "Take the service stairs after close" },
             { trait = "favour", subject = "player", op = "gte", value = 15, label = "Be asked for by name Upstairs" },
             { trait = "kessler_stage", subject = "player", op = "gte", value = 5, label = "Go into Kessler's room, Upstairs (23:00–midnight)" } ]

[[quest_cards]]
npc_id        = "kessler"
text          = "Page five waits in his room."
priority      = 6
when          = [ { trait = "kessler_stage", subject = "player", op = "gte", value = 5 } ]
terminal      = true
terminal_text = "End of this release. Page five comes next."

# Ade
[[quest_cards]]
npc_id   = "ade"
text     = "Ade pours your drink before you ask. He knew Dana."
priority = 1
when     = [ { flag = "opening_done", subject = "player", op = "is_true" },
