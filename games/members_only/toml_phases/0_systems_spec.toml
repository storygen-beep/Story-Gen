[[quest_cards]]
npc_id   = "ade"
text     = "He'll tell you the rest on his day off."
priority = 2
when     = [ { trait = "ade_stage", subject = "player", op = "eq", value = 1 } ]
goals    = [ { trait = "ade_stage", subject = "player", op = "gte", value = 2, label = "Ade: the Docks, Monday (11:00–14:00)" } ]

[[quest_cards]]
npc_id        = "ade"
text          = "Dana used the service stairs behind his bar."
priority      = 3
when          = [ { trait = "ade_stage", subject = "player", op = "gte", value = 2 } ]
terminal      = true
terminal_text = "End of this release for Ade."

# Noor
[[quest_cards]]
npc_id   = "noor"
text     = "Noor has the key to Dana's locker. Her price is dressing you."
priority = 1
when     = [ { flag = "opening_done", subject = "player", op = "is_true" },
             { trait = "noor_stage", subject = "player", op = "eq", value = 0 } ]
goals    = [ { trait = "noor_stage", subject = "player", op = "gte", value = 1, label = "Noor: the Dressing Room before your shift (17:15–18:00)" } ]

[[quest_cards]]
npc_id   = "noor"
text     = "Saturday is Noor's night at the pool."
priority = 2
when     = [ { trait = "noor_stage", subject = "player", op = "eq", value = 1 } ]
goals    = [ { trait = "kessler_stage", subject = "player", op = "gte", value = 1, label = "Hear page one from Kessler first" },
             { trait = "noor_stage", subject = "player", op = "gte", value = 2, label = "Noor: the Terrace, Saturday after close (22:00–midnight)" } ]

[[quest_cards]]
npc_id        = "noor"
text          = "Next Saturday, she wants a member."
priority      = 3
when          = [ { trait = "noor_stage", subject = "player", op = "gte", value = 2 } ]
terminal      = true
terminal_text = "End of this release for Noor."

# Julian
[[quest_cards]]
npc_id   = "julian"
text     = "Julian holds Dana's tab: $300 every Sunday, taken when Sunday starts."
tip      = "Keep $300 by Saturday night. Miss it twice and he keeps you off the floor."
priority = 1
when     = [ { flag = "opening_done", subject = "player", op = "is_true" } ]
goals    = [ { trait = "money", subject = "player", op = "gte", value = 300, label = "Have $300 by Sunday" } ]

[[quest_cards]]
npc_id        = "julian"
text          = "Julian's own story starts in a later release."
priority      = 2
when          = [ { trait = "kessler_stage", subject = "player", op = "gte", value = 5 } ]
terminal      = true
terminal_text = "End of this release for Julian."
