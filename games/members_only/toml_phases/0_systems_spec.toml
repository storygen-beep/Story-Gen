# Members Only — systems spec. Built from the signed sheets (sheets/, DECISIONS.md).

[project]
id              = "members_only"
title           = "Members Only"
description     = "Your sister Dana worked at a private members' club on the cliff above a harbor town, and eight months ago she stopped answering. You take her old job to find out why. The club starts working on you the same way it worked on her."
starting_canvas = "opening"
version         = "0.1"
release_date    = "2026-09-29"
quests_engine   = "v2"

[settings]
narration_person  = "second"
clothing_enabled  = true
wardrobe_location = "dressing_room"
shop_location     = "town"

[settings.rent]
enabled          = true
amount           = 300
due_day          = "Sunday"
collector_npc    = "julian"
grace_periods    = 1
start_after_flag = "first_shift_done"
eviction_mode    = "flag_set"
eviction_flag    = "tab_missed"
currency_symbol  = "$"

[settings.rent.text]
title                  = "Dana's tab"
scene                  = "Julian is waiting with the book open. It's Sunday, and Sunday is his."
greeting               = "Dana's tab, Miss. Three hundred. You know how this works."
paid_scene             = "He counts it twice, slowly, and writes your name under hers."
paid_response          = "Good. She was never this punctual."
paid_closing           = "He closes the book. You're his for another week."
cant_pay               = "You don't have it, and he can see that before you open your purse."
warning_scene          = "He writes something in the margin. It isn't your name."
warning_response       = "Next Sunday, Miss. All of it. Or you don't work my floor."
warning_closing        = "He doesn't look up when you leave."
eviction_scene_soft    = "He closes the book on your fingers, gently, and keeps his hand there."
eviction_response_soft = "No floor for you this week. Upstairs still pays. Find the money."
eviction_closing_soft  = "The door shuts behind you, and the whole staff corridor heard it."

[time]
starting_hour = 17
starting_day  = "Tuesday"
starting_week = 1

# Dana's tab rises in the morning, not at the Sunday count: [settings.rent] takes one fixed
# amount (v2.py:3378). Page two and page four each switch on $15 a day. DECISIONS #1.
[engine.daily_tick]
traitEffects = [
  { targetType = "player", trait = "money", op = "add", value = -15, clamp = false, conditions = { version = "1.0", logic = "AND", items = [ { type = "flag", subject = "player", flag_key = "tab_raised_1", operator = "is_true" }, { type = "trait", subject = "player", trait_key = "money", operator = "gte", value = 15 } ] } },
  { targetType = "player", trait = "money", op = "add", value = -15, clamp = false, conditions = { version = "1.0", logic = "AND", items = [ { type = "flag", subject = "player", flag_key = "tab_raised_2", operator = "is_true" }, { type = "trait", subject = "player", trait_key = "money", operator = "gte", value = 15 } ] } },
]

[ui.cast_page]
title = "The Linden"
intro = "The people on the cliff who knew Dana, and what each of them wants from you."

[ui.cheat_page]
title = "Shortcuts"
intro = "Free for everyone. Skip the waiting, keep the story."

[[ui.cheat_page.grants]]
id    = "money"
label = "Money (+$100)"
trait = "money"
value = 100
clamp = false
free  = true

[[ui.cheat_page.grants]]
id    = "skip_day"
label = "Skip to morning"
kind  = "next_day"
wake  = "09:00"
free  = true

[player_portrait]
enabled       = true
default_image = "images/her_default.jpg"

