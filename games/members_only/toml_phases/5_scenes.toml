[[canvases.nodes]]
id   = "talk"
name = "Julian"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Table six is spending tonight, Miss. Be where they can see you." },
    { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "You're doing well. She did well too, for a while." },
    { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "The members like a girl who laughs. Laugh more." },
    { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Table two wants the girl in the black dress. That's you, Miss, whether you like it or not." },
    { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Don't count your tips on the floor. Count them in the dressing room, where I can't see how little it is." },
    { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Laurent is in tonight. Be charming. He was very fond of your sister, but he's fonder of new faces." },
  ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "kessler_stage", operator = "gte", value = 3 } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Kessler's table is yours from tonight, Miss. He asked. He doesn't usually ask." } ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "energy", operator = "lt", value = 20 } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "You look dead on your feet, Miss. Go home. I won't have you yawning at a member." } ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [ { type = "flag", subject = "player", flag_key = "tab_missed", operator = "is_true" } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "You owe me Sunday's money. Not tonight, Miss. Not until it's paid." } ] },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Every word out of him is a bill. You just don't know yet what it's for." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Back to the tables"
targetType = "location"
locationId = "bar_floor"

