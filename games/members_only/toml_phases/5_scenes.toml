[[canvases.nodes]]
id   = "check"
name = "Julian checks you over"
blocks = [
  { type = "paragraph", content = "Julian looks you over from your hair to your shoes, the way he looks at every girl walking in." },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "look", operator = "lt", value = 40 } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Not like that, Miss. Dressing room. Now." } ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "clothing_item", item_id = "danas_red_dress", operator = "equipped" } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Red. She wore it on Thursdays. Go on." } ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "clothing_item", item_id = "noors_short_dress", operator = "equipped" } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Noor's work. The members will thank her. Go." } ] },
  { type = "group", blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Good. Smile at the members, Miss. That's the job." } ] },
  { type = "thought_bubble", props = { speaker = "player" }, content = "He never once looks at your face." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Go past him"
targetType = "location"
locationId = "club"

