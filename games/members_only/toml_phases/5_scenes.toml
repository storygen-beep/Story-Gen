[[canvases.nodes]]
id   = "count"
name = "The Sunday count"
blocks = [
  { type = "paragraph", content = "Julian has the account book open and a cup of black coffee going cold beside it. He doesn't offer you a chair, but he waits until you're standing where he wants you." },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "tab_raised_2", operator = "is_true" } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Kessler's been reading to you, I hear. Then you know about the others she owed. Another fifteen a day, Miss. That's the last of them. I think." } ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "tab_raised_1", operator = "is_true" } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Laurent. She owed him too, and what she owed him, she owes me. Fifteen a day, Miss, on top of Sunday." } ] },
  { type = "group", blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "julian" }, content = "Three hundred, every Sunday. You pay it the way she did, Miss: on time. That's all I ask of you. For now." } ] },
  { type = "thought_bubble", props = { speaker = "player" }, content = "The book on his desk isn't the members' book. That one's somewhere else in this room." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text        = "Pay what you owe from last week ($300)"
targetType  = "location"
locationId  = "julians_office"
show_when_locked = true
locked_text = "You need $300 to clear last week."
conditions  = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tab_missed", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "money", operator = "gte", value = 300 } ] }
effects     = [ { targetType = "player", trait = "money", op = "add", value = -300, clamp = false } ]
flagEffects = [ { targetType = "player", flag = "tab_missed", op = "unset" } ]

[[canvases.nodes.exit_block.choices]]
text       = "Leave him to his book"
targetType = "location"
locationId = "club"

