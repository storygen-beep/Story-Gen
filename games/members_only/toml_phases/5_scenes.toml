[[canvases.nodes]]
id   = "bar"
name = "Ade"
blocks = [
  { type = "paragraph", content = "Ade slides a drink to you before you ask for it." },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "reputation", operator = "gte", value = 15 } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "I've stopped asking where you go after your shift. I don't want to hear it from you too." } ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "reputation", operator = "gte", value = 5 } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "Members at the end of the bar are saying your name. They're saying it the way they said hers." } ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "ade_stage", operator = "gte", value = 1 } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "Drink that, @player. You look like you need it." } ] },
  { type = "group", blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "Drink that, new girl. Julian's not looking." } ] },
  { type = "paragraph", content = "He goes back to polishing glasses, but he keeps one eye on you." },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "ade_refused_1", operator = "is_true" } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "That drink you turned down is still on the shelf with your name on it. When you want it." } ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "Laurent's at table two. Don't let him buy you anything you'd have to drink." },
    { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "Julian waters the whisky for the members who've had enough. Don't tell him I told you." },
    { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "You're good at this. I'm not sure that's a compliment." },
    { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "The man at table four tips well, but he tips better if you let him win at something. Let him win at cards." },
    { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "Don't lean on the bar when Julian's watching. He counts that as resting, and he docks you for it." },
    { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "Laurent asked me your real name tonight. I told him I didn't know it. He didn't believe me, but he let it go." },
  ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "kessler_stage", operator = "gte", value = 1 } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "ade" }, content = "Library, huh. Dana used to come down from there at one too." } ] },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Back to the tables"
targetType = "location"
locationId = "bar_floor"

