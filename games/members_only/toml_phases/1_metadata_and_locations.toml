# Members Only — the player, the places, the people. From BOARD.md and sheets/places, sheets/people.

[player]
id           = "player"
name         = "Mara"
description  = "Dana's little sister. Twenty-four. Nobody here knows your name yet."
customizable = true
# Declared so the service stairs can stay hidden until Ade shows her (hidden_until needs a declared flag).
flag_keys    = ["knows_service_stairs"]

[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "Your first name"
default = "Mara"

[player.core_traits]
shown         = 0
favour        = 0
nerve         = 0
reputation    = 0
energy        = 100
look          = 100
money         = 40
kessler_stage = 0
ade_stage     = 0
noor_stage    = 0

[player.trait_decay]
energy = 10
look   = 20

# ── places ───────────────────────────────────────────────────────────────────
[[locations]]
id                   = "town"
name                 = "Town"
description          = "The harbor town under the cliff: one street of shops running down to the water, and the only clothes shop for miles. Boats come and go all day. Men off the boats look up at the club, then at you."
image                = "locations/town.jpg"
image_search_queries = ["small harbor town street evening", "seaside village shops dusk"]
navigation_order     = ["the_docks", "cliff_path"]

[[locations]]
id                   = "the_docks"
name                 = "Docks"
description          = "Where the boats come in. The members' launch waits at the end of the pier, polished and locked. Dana left from here. You hate how calm the water is."
image                = "locations/the_docks.jpg"
image_search_queries = ["wooden pier boats harbor", "motor launch moored pier"]
entry_from           = "town"
navigation_order     = []

[[locations]]
id                   = "cliff_path"
name                 = "Cliff Path"
description          = "The path that climbs from the town to the club, past the staff house halfway up. It's steep, it's windy, and anyone coming the other way sees exactly what you're wearing."
image                = "locations/cliff_path.jpg"
image_search_queries = ["coastal cliff path evening", "path up a sea cliff"]
entry_from           = "town"
navigation_order     = ["staff_house", "club"]
costs                = { time = 10 }
kind                 = "thoroughfare"

[[locations]]
id                   = "staff_house"
name                 = "Staff House"
description          = "Where the club's girls sleep: two narrow rooms and a kitchen that smells of Noor's cigarettes. Your bed is the one by the window. Nobody books you here."
image                = "locations/staff_house.jpg"
image_search_queries = ["small shared bedroom two beds", "cramped staff room night"]
entry_from           = "cliff_path"
navigation_order     = []

[[locations]]
id                   = "club"
name                 = "Club"
description          = "The Linden's front hall, a private members' club: marble, flowers, and a man at the door who knows every member's name. This is where the members arrive, and where Julian decides if you're fit to be seen."
image                = "locations/club.jpg"
image_search_queries = ["private club entrance hall marble", "luxury members club lobby"]
entry_from           = "cliff_path"
navigation_order     = ["bar_floor", "dressing_room", "pool_terrace", "library", "julians_office", "members_floor"]
costs                = { time = 10 }
kind                 = "thoroughfare"

[[locations]]
id                   = "bar_floor"
name                 = "Bar"
description          = "The club's bar, where you work your shift for tips: low lamps, dark wood, men in good suits who never look at a bill. Ade works behind it. The tables belong to the members, and so, for four hours, do you."
image                = "locations/bar_floor.jpg"
image_search_queries = ["exclusive club bar dim lamps", "luxury bar dark wood night"]
entry_from           = "club"
navigation_order     = ["service_stairs"]
hours                = [ { weekdays = [1, 2, 3, 4, 5], open = "17:00", close = "23:00" } ]
closed_text          = "The bar's dark. Chairs up on the tables, and Ade's not here."

[[locations]]
id                   = "dressing_room"
name                 = "Dressing Room"
description          = "Where the hostesses get ready: a long mirror lined with bulbs, a rail of dresses, a row of lockers. One locker still has Dana's name on a strip of tape."
image                = "locations/dressing_room.jpg"
image_search_queries = ["backstage dressing room mirror bulbs", "dressing room lockers mirror"]
entry_from           = "club"
navigation_order     = []

[[locations]]
id                   = "pool_terrace"
name                 = "Terrace"
description          = "The club's terrace and pool, lit from underneath, with the sea black beyond the stone rail. Members drink out here after dinner. Anyone in the water is the entertainment."
image                = "locations/pool_terrace.jpg"
image_search_queries = ["lit swimming pool terrace night sea", "luxury pool terrace evening"]
entry_from           = "club"
navigation_order     = []
hours                = [ { open = "22:00", close = "24:00" } ]
closed_text          = "The terrace is shut and the pool is dark."

[[locations]]
id                   = "library"
name                 = "Library"
description          = "The members' library: shelves to the ceiling, one lamp lit, the fire low. Kessler's armchair faces the door, so whoever walks in, he sees them first."
image                = "locations/library.jpg"
image_search_queries = ["old library armchair lamp fire", "dark wood library reading lamp"]
entry_from           = "club"
navigation_order     = []
hours                = [ { weekdays = [1, 2, 3, 4, 5], open = "18:00", close = "23:00" } ]
closed_text          = "The library's locked. Kessler's chair sits empty behind the glass."

[[locations]]
id                   = "julians_office"
name                 = "Julian's Office"
description          = "The manager's office, where the money is counted: a desk, a safe, an account book open under a green lamp. Julian counts money the way other men pray. The members' book is somewhere in this room."
image                = "locations/julians_office.jpg"
image_search_queries = ["manager office desk green lamp", "old office safe desk"]
entry_from           = "club"
navigation_order     = []

[locations.door]
description = "Julian's door, at the end of the staff corridor."
no_answer   = "You knock. Nothing."

[[locations.door.options]]
text       = "Knock."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "julians_office", npc_id = "julian", operator = "is_present" } ] }
goes_to    = { type = "canvas", canvas_id = "julian_office" }

[[locations.door.options]]
text             = "Go in while he's out."
show_when_locked = true
locked_text      = "You haven't got the nerve to walk into his office. Not yet."
conditions       = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "julians_office", npc_id = "julian", operator = "is_absent" },
  { type = "trait", subject = "player", trait_key = "nerve", operator = "gte", value = 10 } ] }
goes_to          = { type = "enter" }

[[locations]]
id                   = "members_floor"
name                 = "Upstairs"
description          = "The members' rooms: a long corridor, thick carpet, numbered doors. Behind every one is a member who paid to be alone with somebody. Tonight that somebody might be you."
image                = "locations/members_floor.jpg"
image_search_queries = ["hotel corridor thick carpet numbered doors", "luxury hallway doors dim light"]
entry_from           = "club"
navigation_order     = []
hours                = [ { weekdays = [1, 2, 3, 4, 5], open = "18:00", close = "24:00" } ]
closed_text          = "Upstairs is shut. A rope hangs across the stairs."

[[locations]]
id                   = "service_stairs"
name                 = "Service Stairs"
description          = "A narrow stair behind the STAFF ONLY door at the back of the bar. Nobody sweeps it. It comes out at the far end of the corridor upstairs."
image                = "locations/service_stairs.jpg"
image_search_queries = ["narrow back staircase dim", "service stairwell old building"]
entry_from           = "bar_floor"
# The way up is the climb itself (the service_stairs canvas exits to members_floor);
# navigation_order may only list rooms whose entry_from is this one.
navigation_order     = []
kind                 = "thoroughfare"
hidden_until         = { flag = "knows_service_stairs" }

