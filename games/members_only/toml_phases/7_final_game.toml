targetType  = "location"
locationId  = "club"
flagEffects = [ { targetType = "player", flag = "kessler_walked_out", op = "set" } ]

[[canvases.nodes]]
id   = "standing"
name = "In the light"
blocks = [
  { type = "paragraph", content = "You step into the light of the lamp. He can barely read, but he sits back to look at all of you, from your shoes up. You read. Dana's words come out of your mouth: The manager says I'm a natural. He says the members will fight over me." },
  { type = "dialog", props = { speaker = "npc", npcId = "kessler" }, content = "Slower. Stand in the light. I want to see your mouth when you say her words." },
  { type = "paragraph", content = "Your face burns, but you read slower, because you want the page more than you want your pride. Every time you look up, his eyes are on your lips." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "He isn't listening. He's watching you say it." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Read the last line"
targetType = "node"
nodeId     = "kessler_01_page_one.his_eyes"

[[canvases.nodes]]
id   = "sitting"
name = "Sitting"
blocks = [
  { type = "paragraph", content = "You drop into the chair across from him and start to read, but halfway down the page he lifts one finger." },
  { type = "dialog", props = { speaker = "npc", npcId = "kessler" }, content = "Sitting. Like you're waiting for a bus. That's enough for half a page, girl." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Read the last line you're allowed"
targetType = "node"
