effects    = [ { targetType = "player", trait = "shown", op = "add", value = 1 } ]

[[canvases.nodes.exit_block.choices]]
text       = "Read it sitting down"
targetType = "node"
nodeId     = "kessler_01_page_one.sitting"

[[canvases.nodes.exit_block.choices]]
text       = "\"Give me the page first.\""
targetType = "node"
nodeId     = "kessler_01_page_one.page_first"

[[canvases.nodes.exit_block.choices]]
