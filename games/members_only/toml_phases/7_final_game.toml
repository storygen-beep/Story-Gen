  { type = "paragraph", content = "He laughs, a dry, delighted sound." },
  { type = "dialog", props = { speaker = "npc", npcId = "kessler" }, content = "Then you'll read it alone in your little bed, and I'll have nothing. One paragraph, girl. Out loud." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
