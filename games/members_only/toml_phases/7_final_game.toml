[[canvases.nodes]]
id   = "arrive"
name = "The library"
blocks = [
  { type = "paragraph", content = "The library is dark except for one lamp. Kessler sits under it with a page on his knee, holding it an inch from his nose." },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "kessler_walked_out", operator = "is_true" } ] }, blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "kessler" }, content = "You walked out on me, girl. Don't do it tonight." } ] },
  { type = "group", blocks = [ { type = "dialog", props = { speaker = "npc", npcId = "kessler" }, content = "You're the new one. Dana's sister. Come here, girl." } ] },
  { type = "dialog", props = { speaker = "player" }, content = "How do you know who I am?" },
  { type = "dialog", props = { speaker = "npc", npcId = "kessler" }, content = "Everybody knows. Julian can't stop smiling. Her handwriting. Her first week. You want it? Then read it to me. Standing. In the light. Slowly." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Of course you want it. It's the only reason you're standing in this room." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Read it all, standing where he says"
targetType = "node"
