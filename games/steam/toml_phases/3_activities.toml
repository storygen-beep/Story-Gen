    ] },
    { advance_text = "Watch her get it.", blocks = [
        { type = "paragraph", content = "It takes about forty minutes for the weight to come right, which is faster than you managed, and you tell her so because nobody told you." },
    ] },
    { advance_text = "Set the other terms.", blocks = [
        { type = "paragraph", content = "Then you tell her the rest of it: what is on the board, what is under the black line, what she is never expected to do, and that she says no at the door and you back her." },
        { type = "thought_bubble", content = "Somebody had that conversation with Del in nineteen eighty-nine. She has never once said who, or how it went." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Let her do the next one.", config = { destinationType = "specific", locationId = "the_scrub_room", time_progression_minutes = 60, effects = [
  { targetType = "player", trait = "service", op = "add", value = 2, clamp = true },
  { targetType = "npc", npcId = "npc_del", trait = "relation", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_changing_lost_property"
name        = "Lost property"
description = "Triggerless rung off hub_changing_room. Ungated. A drawer with thirty years of other people's things in it. 20 min."

[[canvases.nodes]]
id   = "base"
name = "The drawer"
blocks = [
  { type = "paragraph", content = "Lost property is a drawer under the bench and it has not been emptied since about nineteen ninety-four." },
  { type = "cascade", props = { beats = [
    { advance_text = "Go through it.", blocks = [
        { type = "paragraph", content = "Eleven single earrings. Four watches. A wedding ring. Two sets of car keys for cars that have certainly been scrapped. A swimming costume." },
    ] },
    { advance_text = "Look at the ring.", blocks = [
        { type = "paragraph", content = "The ring has been in there long enough to have gone dull. Somebody took it off to get in the water and did not come back for it, and that is the whole story and there is no other version." },
    ] },
    { advance_text = "Put it all back.", blocks = [
        { type = "paragraph", content = "You put it all back, including the costume, which its owner has now not collected for four months and is not going to." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Shut the drawer.", config = { destinationType = "specific", locationId = "the_changing_room", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_boiler_two_hours"
name        = "Two hours' sleep"
description = "Triggerless rung off hub_boiler_day, HOUSE under 35. Before the new valve, the shift is a man sleeping in ninety-minute pieces for sixteen years. Retires itself when the valve is paid for. +3 his relation, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Ninety minutes at a time"
blocks = [
  { type = "paragraph", content = "The valve does not hold, so the needle drops about every two hours, so he sleeps in ninety-minute pieces and has done since two thousand and nine." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask how he stands it.", blocks = [
        { type = "paragraph", content = "He does not understand the question at first. Then he says you get used to it, which is what people say when the alternative was never offered." },
    ] },
    { advance_text = "Do the arithmetic.", blocks = [
        { type = "paragraph", content = "Sixteen years. Nine or ten wakings a night. He has not had a full night's sleep since before you left this valley." },
    ] },
    { advance_text = "Say you'll get the valve.", blocks = [
        { type = "paragraph", content = "You tell him the valve is next. He says nothing at all, and turns the wheel a quarter, and watches the needle come back up." },
        { type = "thought_bubble", content = "Two hundred dollars. It has been two hundred dollars the entire time." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go up.", config = { destinationType = "specific", locationId = "the_boiler", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_ivo", trait = "relation", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_pool_close_the_room"
name        = "Close the pool room"
description = "Triggerless rung off the evening hub. Ungated. Turning a hundred and thirty-four year old room off for the night, which it never actually is. +1 service, -2 energy, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Lamps down"
blocks = [
  { type = "paragraph", content = "You cannot turn a spring off. Closing the pool room means the lamps, the skimmer, the towel baskets and the door, and the water carries on all night at forty-four degrees for nobody." },
  { type = "cascade", props = { beats = [
    { advance_text = "Do the round.", blocks = [
        { type = "paragraph", content = "Baskets in. Skimmer on the hook. Lamps down one at a time from the far end, which takes about ninety seconds and which you do in the same order every night." },
    ] },
    { advance_text = "Stand in the doorway.", blocks = [
        { type = "paragraph", content = "One lamp over the steps, steam on the surface, green tile, and nine feet by twenty of black glass over the top of it." },
    ] },
    { advance_text = "Leave it going.", blocks = [
        { type = "paragraph", content = "Two hundred litres a minute, all night, whether anybody is in it or not, the way it has been since eighteen ninety-one." },
        { type = "thought_bubble", content = "Three hours until you can get back in it. You are counting again." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go and count the till.", config = { destinationType = "specific", locationId = "the_pool", time_progression_minutes = 25, effects = [
  { targetType = "player", trait = "service", op = "add", value = 1, clamp = true },
  { targetType = "player", trait = "energy", op = "add", value = -2, clamp = true },
] } }


# ── Long-form fill: fewer surfaces, more beats each. ──────────────────────

[[canvases]]
id          = "rung_pool_whole_day"
name        = "A whole day on the floor"
description = "Triggerless rung off the women's-hours hub. Ungated. Eight until six in one surface — the shape of an ordinary working day, which is what the TRIGGERED layer hangs off. +3 service, +25 money (clamp FALSE), -20 energy, 600 min."

[[canvases.nodes]]
id   = "base"
name = "Eight till six"
blocks = [
  { type = "paragraph", content = "Some days you do not leave the floor. You open at eight and the next time you are still it is six and the towels are in the basket." },
  { type = "cascade", props = { beats = [
    { advance_text = "Eight.", blocks = [
        { type = "paragraph", content = "Doors back. Four waiting, three of them the same three. Tokens out, float in the till, first tray of tea on at five past." },
    ] },
    { advance_text = "Nine.", blocks = [
        { type = "paragraph", content = "Eleven in the water. The skimmer along the far wall because the first hour always puts something in it. Two lockers jam and you do them with both thumbs." },
    ] },
    { advance_text = "Ten.", blocks = [
        { type = "paragraph", content = "The hot end is full and arguing about the road. You do three backs on the slab and come back with your forearms going." },
    ] },
    { advance_text = "Eleven.", blocks = [
        { type = "paragraph", content = "Del takes the slab. You take the floor. Towels, tea, tiles, and the long slow pull of the skimmer at the hot end where the water is thirty-nine degrees." },
    ] },
    { advance_text = "One.", blocks = [
        { type = "paragraph", content = "It goes mixed. The room reorganises itself without a word — men down the cool end, everyone in their half, everyone watching the middle." },
    ] },
    { advance_text = "Half three.", blocks = [
        { type = "paragraph", content = "The lull. Twenty minutes on the edge with your feet in and nothing in your hands, which is the only stillness in the day and you have started needing it." },
    ] },
    { advance_text = "Four.", blocks = [
        { type = "paragraph", content = "The yard. Eight through the trough in ten minutes and the changing room sounds like a bus station. Two of them want the slab and one of them is hurt." },
    ] },
    { advance_text = "Six.", blocks = [
        { type = "paragraph", content = "Lamps down from the far end. Forty-one wet towels. Thirty-eight dollars in the till and both of your arms are finished to the elbow." },
        { type = "thought_bubble", content = "Thirty-eight dollars. The draw is a hundred and thirty-five and it is Wednesday." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Cash up and get in the water.", config = { destinationType = "specific", locationId = "the_pool", time_progression_minutes = 600, effects = [
  { targetType = "player", trait = "service", op = "add", value = 3, clamp = true },
  { targetType = "player", trait = "money", op = "add", value = 25, clamp = false },
  { targetType = "player", trait = "energy", op = "add", value = -20, clamp = true },
] } }


[[canvases]]
id          = "rung_pool_body_year"
name        = "What the year did to you"
description = "Triggerless rung off the after-close hub. Ungated, banded on STEAM. Five months of physical work, catalogued on her own body in her own water. Explicit at the top band. +5 arousal, 30 min."

[[canvases.nodes]]
id   = "base"
name = "Five months"
blocks = [
  { type = "paragraph", content = "You float on your back in the middle at one in the morning and take an inventory, which you do about once a month and have never once admitted to anybody." },
  { type = "cascade", props = { beats = [
    { advance_text = "Hands.", blocks = [
        { type = "paragraph", content = "A callus across both palms and hard skin at the base of both thumbs. In March your hands were soft as a child's and you typed for a living." },
    ] },
    { advance_text = "Arms.", blocks = [
        { type = "paragraph", content = "Forearms a different shape entirely. There is a line of muscle from the elbow that appeared in July and that you catch in the mirror and do not recognise." },
    ] },
    { advance_text = "Shoulders.", blocks = [
        { type = "paragraph", content = "Your shoulders have come up and back off years of a desk. You stand differently. June said so in August, approvingly, in front of four people." },
    ] },
    { advance_text = "Feet.", blocks = [
        { type = "paragraph", content = "Your feet hurt every night for eleven weeks and then stopped, permanently, in the second week of June, and have not hurt since." },
    ] },
    { advance_text = "The rest.", blocks = [
        { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
          { type = "trait", subject = "player", trait_key = "steam", operator = "gte", value = 35 },
        ] } }, blocks = [
          { type = "paragraph", content = "No line anywhere. Nothing on you is any paler than anything else, because you have not worn clothes in daylight since April and the skylight is nine feet by twenty." },
          { type = "paragraph", content = "Your tits are the same. Your belly is flatter and harder. Your nipples go up the second you come out of the water and stay up, all day, in a building at thirty degrees." },
        ] },
        { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
          { type = "trait", subject = "player", trait_key = "steam", operator = "lt", value = 35 },
        ] } }, blocks = [
          { type = "paragraph", content = "Everything below the line where the robe sits is exactly as it was in March, which is a fact you notice every month and do not examine." },
        ] },
    ] },
    { advance_text = "Get out.", blocks = [
        { type = "thought_bubble", content = "Five months. You could not have described your own arms in March. You would not have been asked to." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go up.", config = { destinationType = "specific", locationId = "the_pool", time_progression_minutes = 30, effects = [
  { targetType = "player", trait = "arousal", op = "add", value = 5, clamp = true },
] } }


[[canvases]]
id          = "rung_attic_whole_night"
name        = "A night in the flat"
description = "Triggerless rung off hub_attic_night. Ungated. The other half of the ordinary day: what one in the morning to seven actually consists of. +40 energy, 360 min."

[[canvases.nodes]]
id   = "base"
name = "One till seven"
blocks = [
  { type = "paragraph", content = "The building shuts at six and you are not upstairs until one, which is a thing nobody who has not run a building understands." },
  { type = "cascade", props = { beats = [
    { advance_text = "Six to eight.", blocks = [
        { type = "paragraph", content = "Lockers, lamps, machine on, till counted, book written up. Two loads of towels which take an hour each and which the machine does whether or not you are watching it." },
    ] },
    { advance_text = "Eight to ten.", blocks = [
        { type = "paragraph", content = "Eat standing up in the changing room because there is no kitchen in the flat worth the name. Merchant's bread, merchant's cheese, and the coffee that June has correctly described as a war crime." },
    ] },
    { advance_text = "Ten to midnight.", blocks = [
        { type = "paragraph", content = "The jobs the room has to be empty for. Grout, lamp glass, the skimmer basket, the four lockers that jam. Down the eleven steps to write the pressure in the book." },
    ] },
    { advance_text = "Midnight.", blocks = [
        { type = "paragraph", content = "Bolt the front. Chain across. The building goes from a place with people in it to a hot empty box with one woman in it, in about four seconds." },
    ] },
    { advance_text = "Midnight to one.", blocks = [
        { type = "paragraph", content = "The water. Every night, without exception, for five months. It is the hour the whole rest of it is arranged around and you would give up the flat before you gave it up." },
    ] },
    { advance_text = "One.", blocks = [
        { type = "paragraph", content = "Up the stairs with wet hair. The pipes in the wall are warm. The bed is high and old and the mattress is the best thing you own." },
    ] },
    { advance_text = "Seven.", blocks = [
        { type = "paragraph", content = "You wake at ten to without an alarm, every day, which you never once did in two years at a desk." },
        { type = "thought_bubble", content = "Six hours. It is not enough and it has been enough since June." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get up and open.", config = { destinationType = "specific", locationId = "the_attic_flat", time_progression_minutes = 360, effects = [
  { targetType = "player", trait = "energy", op = "add", value = 40, clamp = true },
] } }


[[canvases]]
id          = "rung_street_the_valley"
name        = "The valley"
description = "Triggerless rung off hub_spring_street. Ungated. Where this town actually is, why it is dying, and why one building on it is not. 35 min."

[[canvases.nodes]]
id   = "base"
name = "One road in"
blocks = [
  { type = "paragraph", content = "Hollis Springs is nine hundred and forty people, one road in, one road up to the wellhead, and a bus at half nine." },
  { type = "cascade", props = { beats = [
    { advance_text = "The mill.", blocks = [
        { type = "paragraph", content = "The mill shut in eighty-eight and took four hundred jobs, and the town has spent thirty-seven years being about six hundred people smaller every decade." },
    ] },
    { advance_text = "The spa trade.", blocks = [
        { type = "paragraph", content = "Four hotels, ninety rooms between them, all built between eighteen ninety and nineteen twelve on the strength of a hole in the ground." },
    ] },
    { advance_text = "What killed it.", blocks = [
        { type = "paragraph", content = "Not the water. The road. When the county stopped resurfacing the top section, a two-hour drive became a three-hour drive, and a weekend in a spa town became somewhere else's weekend." },
    ] },
    { advance_text = "What's left.", blocks = [
        { type = "paragraph", content = "A garage, a merchant, a chapel, a hotel with eleven rooms, and one bathhouse with the spring actually running through it." },
    ] },
    { advance_text = "Walk it.", blocks = [
        { type = "paragraph", content = "It takes eleven minutes to walk the whole town. You have done it about four times since March, all of them at night." },
        { type = "thought_bubble", content = "Nine hundred and forty people, and forty-one of them come through your door every week." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Back to the Marlow.", config = { destinationType = "specific", locationId = "spring_street", time_progression_minutes = 35 } }


[[canvases]]
id          = "rung_let_the_arrangement"
name        = "What the let actually is"
description = "Triggerless rung off hub_lodgers_room. Ungated. Room-scoped and rotation-proof: the arrangement itself, stated plainly, which is the thing that outlives every tenant. 25 min."

[[canvases.nodes]]
id   = "base"
name = "The terms, in full"
blocks = [
  { type = "paragraph", content = "Strip it back and the let is four things, and none of them have changed since your grandmother wrote them." },
  { type = "cascade", props = { beats = [
    { advance_text = "One.", blocks = [
        { type = "paragraph", content = "A warm room in a cold valley, thirty degrees off a pipe, for thirty-five dollars a month, which is under half what it is worth." },
    ] },
    { advance_text = "Two.", blocks = [
        { type = "paragraph", content = "No door to the street. Everybody who lives here comes and goes through the lobby, past the desk, past the board, past the woman who owns it." },
    ] },
    { advance_text = "Three.", blocks = [
        { type = "paragraph", content = "A key on a hook behind that desk, which never has to be mentioned and which every tenant walks past on the day they move in." },
    ] },
    { advance_text = "Four.", blocks = [
        { type = "paragraph", content = "Use of the baths. Which on the old card meant the public hours, and on the card in the window now does not." },
    ] },
    { advance_text = "Add it up.", blocks = [
        { type = "paragraph", content = "Everybody who takes this room has left somewhere and needs it warm and cheap, and the terms get set in the first fortnight by whoever is standing in the lobby when they arrive." },
        { type = "thought_bubble", content = "That is not a thing your grandmother wrote down. It is a thing the room does, and it will do it to the next one as well." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Back to the desk.", config = { destinationType = "specific", locationId = "the_lodgers_room", time_progression_minutes = 25 } }


# ── Long-form fill, round two: the working rooms. ─────────────────────────

[[canvases]]
id          = "rung_scrub_whole_afternoon"
name        = "An afternoon on the slab"
description = "Triggerless rung off hub_scrub_room. Ungated. Eleven bodies between eleven and four, which is what the service tier is when you stop looking at any single rung of it. +3 service, +22 money (clamp FALSE), -14 energy, 300 min."

[[canvases.nodes]]
id   = "base"
name = "Eleven till four"
blocks = [
  { type = "paragraph", content = "The slab runs eleven till four and turns round every twenty minutes if nobody wants the feet doing." },
  { type = "cascade", props = { beats = [
    { advance_text = "The first.", blocks = [
        { type = "paragraph", content = "A woman of about seventy who comes on a Tuesday and a Friday and who has the same shoulder every time, and who talks for ten minutes and then stops." },
    ] },
    { advance_text = "The second and third.", blocks = [
        { type = "paragraph", content = "Two off the road contract, one after the other, both of them wrecked in the lower back from sitting in a machine for nine hours." },
    ] },
    { advance_text = "The fourth.", blocks = [
        { type = "paragraph", content = "A man who wants the oil and asks for it by the name on the board, quietly, with his eyes somewhere else. Four dollars. You do it and you hose the slab after." },
    ] },
    { advance_text = "The fifth.", blocks = [
        { type = "paragraph", content = "Somebody's daughter, nineteen, first time on a slab, who laughs the entire way through it out of sheer nerves and then books for a fortnight." },
    ] },
    { advance_text = "Half two.", blocks = [
        { type = "paragraph", content = "Your forearms go at about half two, every day, and then come back at three, which Del says happens for the first two years and then stops." },
    ] },
    { advance_text = "The rest.", blocks = [
        { type = "paragraph", content = "Four more. Two backs, one whole body, and one man who wants the private hour and is told the room is booked, because it is." },
    ] },
    { advance_text = "Four o'clock.", blocks = [
        { type = "paragraph", content = "Eleven bodies. Twenty-two dollars on the board and six in tips, and your hands smell of grit soap through two washes." },
        { type = "thought_bubble", content = "Eleven backs. You can remember all eleven and not one face, which Del says happens for the rest of your life." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Hose it down.", config = { destinationType = "specific", locationId = "the_scrub_room", time_progression_minutes = 300, effects = [
  { targetType = "player", trait = "service", op = "add", value = 3, clamp = true },
  { targetType = "player", trait = "money", op = "add", value = 22, clamp = false },
  { targetType = "player", trait = "energy", op = "add", value = -14, clamp = true },
] } }


[[canvases]]
id          = "rung_changing_whole_room"
name        = "The room, all day"
description = "Triggerless rung off hub_changing_room. Ungated, banded on STEAM at the end. Forty people through one room, and the only surface in the game that shows the whole traffic of the building. +2 service, -6 energy, 240 min."

[[canvases.nodes]]
id   = "base"
name = "Forty through"
blocks = [
  { type = "paragraph", content = "Everybody who comes into this building passes through this room twice, with their clothes off in between." },
  { type = "cascade", props = { beats = [
    { advance_text = "Eight.", blocks = [
        { type = "paragraph", content = "The first four are the same four. Lockers eleven, fourteen, nineteen and two. They have used those lockers for years and would notice if they were in someone else's." },
    ] },
    { advance_text = "Ten.", blocks = [
        { type = "paragraph", content = "The ten o'clock crowd, eleven of them, all women, all talking, none of them covering anything, half of them getting undressed while still finishing a sentence started on the pavement." },
    ] },
    { advance_text = "Noon.", blocks = [
        { type = "paragraph", content = "The quiet hour, which is when the linen gets done. You fold on the low bench with the machine going through the wall and the room empty except for whoever is slow." },
    ] },
    { advance_text = "Four.", blocks = [
        { type = "paragraph", content = "The yard. Eight men in a room the width of a corridor and one attendant with a towel stack, sideways past the fourth one, every single time." },
    ] },
    { advance_text = "Half five.", blocks = [
        { type = "paragraph", content = "The last of them dressing slowly, and somebody's grandmother needing her cardigan doing, and a boy of about seven refusing to put socks on." },
    ] },
    { advance_text = "Six.", blocks = [
        { type = "paragraph", content = "Forty-one wet towels. Nine lockers still shut on nothing. A pair of socks under the bench that will be there next week." },
    ] },
    { advance_text = "Yourself, last.", blocks = [
        { type = "paragraph", content = "And then the room is empty and it is your turn, and you get changed on the bench in a room that has had forty people's clothes off in it today and now has yours." },
        { type = "thought_bubble", content = "There is a hook on the end with her name on a strip of tape. You have never taken the tape off." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Put the last load on.", config = { destinationType = "specific", locationId = "the_changing_room", time_progression_minutes = 240, effects = [
  { targetType = "player", trait = "service", op = "add", value = 2, clamp = true },
  { targetType = "player", trait = "energy", op = "add", value = -6, clamp = true },
] } }


[[canvases]]
id          = "rung_boiler_the_machine"
name        = "How the building actually works"
description = "Triggerless rung off hub_boiler_day. Ungated. The whole plant explained end to end, which is the thing that makes the HOUSE tier legible as engineering rather than as shopping. +1 house, 40 min."

[[canvases.nodes]]
id   = "base"
name = "Source to drain"
blocks = [
  { type = "paragraph", content = "He explains it once, properly, because you asked twice and he does not repeat himself for people who have only asked once." },
  { type = "cascade", props = { beats = [
    { advance_text = "The source.", blocks = [
        { type = "paragraph", content = "Two hundred litres a minute out of the rock at forty-four degrees into a stone catchment cut in eighteen ninety-one. Nothing in that sentence requires any electricity." },
    ] },
    { advance_text = "The feed.", blocks = [
        { type = "paragraph", content = "From the catchment through the four-inch main into the mixing valve, which is where the whole building's temperature is decided by one bronze casting from before the war." },
    ] },
    { advance_text = "The boiler.", blocks = [
        { type = "paragraph", content = "The boiler does not heat the pool. It never has. It heats the scrub room, the changing room and the flat, and everybody in this town gets that wrong including the county." },
    ] },
    { advance_text = "The pool.", blocks = [
        { type = "paragraph", content = "In at the shallow end, out at the deep, twice through the day, and the whole volume turns over in about eleven hours without a pump doing any of the work." },
    ] },
    { advance_text = "The plunge.", blocks = [
        { type = "paragraph", content = "The plunge is the only part that needs a pump, because cold water does not come out of a mountain and has to be pushed up from the town main." },
    ] },
    { advance_text = "The drain.", blocks = [
        { type = "paragraph", content = "Out through a channel under the scrub room floor, into the culvert, and back into the river four hundred yards down at about thirty degrees, which is why that stretch does not freeze." },
    ] },
    { advance_text = "Say it back.", blocks = [
        { type = "paragraph", content = "You say it back to him in the right order and he corrects you once, at the mixing valve, and then nods at the gauge board rather than at you." },
        { type = "thought_bubble", content = "That is the building. There is no version of owning it that does not run through him." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go up.", config = { destinationType = "specific", locationId = "the_boiler", time_progression_minutes = 40, effects = [
  { targetType = "player", trait = "house", op = "add", value = 1, clamp = true },
] } }


[[canvases]]
id          = "rung_desk_a_week"
name        = "A week, on one page"
description = "Triggerless rung off hub_front_desk. Ungated, banded on HOUSE. Monday to Sunday with the Friday draw in the middle of it — the shape the whole economy actually has. 35 min."

[[canvases.nodes]]
id   = "base"
name = "Monday to Sunday"
blocks = [
  { type = "paragraph", content = "The week has a shape and the shape is Friday. Everything before it is accumulation and everything after it is starting again from nearly nothing." },
  { type = "cascade", props = { beats = [
    { advance_text = "Monday.", blocks = [
        { type = "paragraph", content = "Thirty on the door if it is dry. The quietest day and the one where the jobs get done, and Del does the slab alone all morning." },
    ] },
    { advance_text = "Tuesday.", blocks = [
        { type = "paragraph", content = "Women's day. Forty-five on the door, six on the slab, and June in the hot end from ten until one deciding what the town thinks." },
    ] },
    { advance_text = "Wednesday.", blocks = [
        { type = "paragraph", content = "The lull day. Thirty-eight, and the afternoon hour where nobody comes and the front door has been known to get locked for sixty minutes." },
    ] },
    { advance_text = "Thursday.", blocks = [
        { type = "paragraph", content = "The yard twice and the clerk once. Fifty on the door and whatever else Thursday turns out to be." },
    ] },
    { advance_text = "Friday.", blocks = [
        { type = "paragraph", content = "Forty on the door and a hundred and thirty-five out of the till at six o'clock into a book with your aunt's name at the top of the page." },
    ] },
    { advance_text = "Saturday.", blocks = [
        { type = "paragraph", content = "The big day. Sixty on the door, forty-one bodies in a building graded for twenty-eight, and the queue for the slab out into the lobby." },
    ] },
    { advance_text = "Sunday.", blocks = [
        { type = "paragraph", content = "Four people until half twelve and then eighteen in six minutes, all of them in their good clothes." },
    ] },
    { advance_text = "Add it up.", blocks = [
        { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
          { type = "trait", subject = "player", trait_key = "house", operator = "lt", value = 35 },
        ] } }, blocks = [
          { type = "paragraph", content = "About two hundred and sixty on the door. A hundred and thirty-five to Casper, ninety a month to the electric, twenty-five a week on stock, and Del." },
          { type = "paragraph", content = "It does not close. It has never closed. That is the whole of what the second column is for." },
        ] },
        { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
          { type = "trait", subject = "player", trait_key = "house", operator = "gte", value = 35 },
        ] } }, blocks = [
          { type = "paragraph", content = "About three hundred and twenty on the door and two hundred and forty in the second column, against a hundred and thirty-five, the electric, the stock and two wages." },
          { type = "paragraph", content = "It closes with sixty or seventy left, most weeks, which goes into whatever the building needs next." },
        ] },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Shut the book.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 35 } }


# ── Two more sinks, and the last of the flat, the let room and the street. ──

[[canvases]]
id          = "rung_boiler_mixing_valve"
name        = "The mixing valve"
description = "Triggerless rung, MONEY 320 + HOUSE 40. The bronze casting the whole building's temperature runs through, and the most expensive single thing in v0.1. -320 money (clamp FALSE), +10 house, 300 min."

[[canvases.nodes]]
id   = "base"
name = "One bronze casting"
blocks = [
  { type = "paragraph", content = "Everything in this building goes through one mixing valve made before the war, and the seat in it has been ground four times by four different men with the wrong tool." },
  { type = "cascade", props = { beats = [
    { advance_text = "Get the price.", blocks = [
        { type = "paragraph", content = "Three hundred and twenty from the foundry that has been making them since eighteen ninety, in a crate, with straw in it, eleven weeks' wait." },
    ] },
    { advance_text = "Order it.", blocks = [
        { type = "paragraph", content = "It is more than the pump and the valve and the skylight put together. Ivo says the word yes with an amount of feeling you have not heard out of him before or since." },
    ] },
    { advance_text = "Shut the building.", blocks = [
        { type = "paragraph", content = "It is a two-day job and the Marlow closes for both, which costs another eighty in takings and which the town is told about three weeks in advance." },
    ] },
    { advance_text = "Watch him fit it.", blocks = [
        { type = "paragraph", content = "He works from six in the morning to eleven at night, twice, and you hold the lamp for about nine hours in total and learn what a union is." },
    ] },
    { advance_text = "Bring it up.", blocks = [
        { type = "paragraph", content = "The line comes back on the Thursday morning. Forty-four at the outlet, dead steady, no hand on it, and the needle does not move all day." },
    ] },
    { advance_text = "Open on Friday.", blocks = [
        { type = "paragraph", content = "The water is a degree and a half hotter than it has been in living memory and three separate regulars say so before ten o'clock." },
        { type = "thought_bubble", content = "June says it is the best it has been since the sixties. She has said that four times this year. This time she means it about the temperature." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go up and open.", config = { destinationType = "specific", locationId = "the_boiler", time_progression_minutes = 300, effects = [
  { targetType = "player", trait = "money", op = "add", value = -320, clamp = false },
  { targetType = "player", trait = "house", op = "add", value = 10, clamp = true },
] } }


[[canvases]]
id          = "rung_desk_pay_extra"
name        = "Overpay the note"
description = "Triggerless rung, MONEY 200. The only way the principal ever moves, and the only thing in the game that shortens the eleven years. -200 money (clamp FALSE), +4 his relation, 20 min."

[[canvases.nodes]]
id   = "base"
name = "Two hundred"
blocks = [
  { type = "paragraph", content = "A hundred and thirty-five keeps the note exactly where it is. Anything above that comes off the principal, and the principal has not moved since nineteen eighty-nine." },
  { type = "cascade", props = { beats = [
    { advance_text = "Put two hundred on the desk.", blocks = [
        { type = "paragraph", content = "You count out two hundred on a Friday and tell him what the extra sixty-five is for, which is the first time in thirty-one years that sentence has been said in this lobby." },
    ] },
    { advance_text = "Watch him work it out.", blocks = [
        { type = "paragraph", content = "He writes it in and then sits with the book open, doing arithmetic he has plainly never had to do, because his father's book has no column for a payment that reduces anything." },
    ] },
    { advance_text = "Let him say it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_casper" }, content = "At this rate it's about eleven years." },
        { type = "paragraph", content = "Eleven years, from a document everybody involved had privately treated as permanent." },
    ] },
    { advance_text = "Say nothing.", blocks = [
        { type = "paragraph", content = "Neither of you says the obvious thing, which is what happens to Friday evenings in eleven years' time." },
        { type = "thought_bubble", content = "He has come every Friday for five months. Two of those months he had no legal need to come in person at all." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "See him out.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 20, effects = [
  { targetType = "player", trait = "money", op = "add", value = -200, clamp = false },
  { targetType = "npc", npcId = "npc_casper", trait = "relation", op = "add", value = 4, clamp = true },
] } }


[[canvases]]
id          = "rung_attic_march"
name        = "March"
description = "Triggerless rung off hub_attic_night. Ungated. How she got here — the funeral, the will, the keys, and the first night in a building she did not know how to run. 40 min."

[[canvases.nodes]]
id   = "base"
name = "Five months ago"
blocks = [
  { type = "paragraph", content = "You came in on the half nine bus on the eleventh of March with two bags and a set of keys posted to you by a solicitor in the county town." },
  { type = "cascade", props = { beats = [
    { advance_text = "The funeral.", blocks = [
        { type = "paragraph", content = "Forty people at the chapel and about sixty at the Marlow afterwards, which Del opened and ran on her own because nobody had thought to ask who would." },
    ] },
    { advance_text = "The will.", blocks = [
        { type = "paragraph", content = "Two pages. The building, the contents, the trade, and the note on it, to her sister's daughter, who she had seen four times in eleven years." },
    ] },
    { advance_text = "The first night.", blocks = [
        { type = "paragraph", content = "You slept in her bed because there was nowhere else, with your own clothes in a bag on the chair, and you did not get in the water for eleven days." },
    ] },
    { advance_text = "The first morning.", blocks = [
        { type = "paragraph", content = "Del was at the desk at seven having swept the lobby, run the skimmer, checked the gauge and put the float in the till, and said we open at eight, and did not say anything else." },
    ] },
    { advance_text = "The first week.", blocks = [
        { type = "paragraph", content = "You got the till wrong twice, put grit soap on dry skin once, and cried in the linen store on the Thursday with the machine going, and nobody in this building has ever mentioned it." },
    ] },
    { advance_text = "Now.", blocks = [
        { type = "paragraph", content = "Five months. You can run the room, work the slab, read the gauges, and tell within about four dollars what the till has in it before you open it." },
        { type = "thought_bubble", content = "You came for a week to sort out an estate. The bus back goes at half nine, six days a week, and you have never once been going." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Put the light out.", config = { destinationType = "specific", locationId = "the_attic_flat", time_progression_minutes = 40 } }


[[canvases]]
id          = "rung_street_the_card"
name        = "The card in the window"
description = "Triggerless rung off hub_spring_street. Ungated, banded on STEAM. Room-adjacent but street-scoped: the advertisement for the let, and the sentence on it that changes what the room is. 20 min."

[[canvases.nodes]]
id   = "base"
name = "Six lines on a card"
blocks = [
  { type = "paragraph", content = "The corkboard in the merchant's window has the Marlow's card on it every autumn since nineteen ninety-one, between a hay advert and somebody selling a trailer." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "steam", operator = "lt", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "ROOM TO LET. THE MARLOW BATHS, SPRING STREET. WARM ROOM, USE OF THE BATHS. NO COOKING. NO VISITORS AFTER ELEVEN. 35 A MONTH, FIRST OF THE MONTH." },
    { type = "paragraph", content = "It is your aunt's wording and your handwriting, which is the arrangement you have with most things in this building at the moment." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "steam", operator = "gte", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "ROOM TO LET. THE MARLOW BATHS, SPRING STREET. WARM ROOM. USE OF THE BATHS, ALL HOURS. 35 A MONTH, FIRST OF THE MONTH." },
    { type = "paragraph", content = "Two lines shorter. The cooking one you kept. The eleven o'clock one you took out and the all hours you put in, and both of those are decisions anybody in this valley can read off a corkboard." },
    { type = "thought_bubble", content = "The old card is in the drawer behind the desk. You have not thrown it out and you are not going to." },
  ] },
]
exit_block = { type = "location", text = "Come away from the window.", config = { destinationType = "specific", locationId = "spring_street", time_progression_minutes = 20 } }


# ── The last of the fill: the four thinnest rooms. ────────────────────────

[[canvases]]
id          = "rung_let_thirty_one_lets"
name        = "Thirty-one lets"
description = "Triggerless rung off hub_lodgers_room. Ungated. Room-scoped. The book of names, and what a room does to the people who pass through it. 35 min."

[[canvases.nodes]]
id   = "base"
name = "The book of names"
blocks = [
  { type = "paragraph", content = "There is a hardback in the desk drawer with thirty-one names in it, one per let, going back to nineteen ninety-one. Name, month in, month out. Nothing else." },
  { type = "cascade", props = { beats = [
    { advance_text = "Read it through.", blocks = [
        { type = "paragraph", content = "Most of them stayed a season. Four stayed two. One stayed eleven months and the month-out column for her is blank, with a line drawn through it in a different pen." },
    ] },
    { advance_text = "Count the trades.", blocks = [
        { type = "paragraph", content = "Road contract, road contract, mill, nurse, road contract. Whatever work has come into this valley for thirty years has slept in that room for a season and gone." },
    ] },
    { advance_text = "Find the pattern.", blocks = [
        { type = "paragraph", content = "Twenty-two of the thirty-one arrived between September and November. The card goes in the window in autumn and the room fills in nine days, every single year." },
    ] },
    { advance_text = "Look at the handwriting.", blocks = [
        { type = "paragraph", content = "Your grandmother's for the first two. Perrine's for twenty-eight. Yours for one, at the bottom, in a book that will outlast whoever is in it now." },
    ] },
    { advance_text = "Put it back.", blocks = [
        { type = "paragraph", content = "The drawer also has the old card in it, and a spare key on a hook above it, and thirty-one years of somebody else's handwriting." },
        { type = "thought_bubble", content = "Twenty-eight lets and not one line about any of them. She wrote down more about a feed valve." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Shut the drawer.", config = { destinationType = "specific", locationId = "the_lodgers_room", time_progression_minutes = 35 } }


[[canvases]]
id          = "rung_let_the_next_one"
name        = "The next one"
description = "Triggerless rung off hub_lodgers_room. Ungated. Room-scoped, and the clearest statement of the rotation the game is built on. 30 min."

[[canvases.nodes]]
id   = "base"
name = "Nine days in autumn"
blocks = [
  { type = "paragraph", content = "The season ends and the room empties and the card goes back in the merchant's window, and within nine days there is somebody else on that mattress." },
  { type = "cascade", props = { beats = [
    { advance_text = "Strip the bed.", blocks = [
        { type = "paragraph", content = "Sheets off, mattress turned, frame wiped, the one glass on the shelf washed and put back upside down the way it was when you found it in March." },
    ] },
    { advance_text = "Look at the wall.", blocks = [
        { type = "paragraph", content = "Four marks at four heights on the doorframe. There will be a fifth. There will be a sixth, and a tenth, and the mattress will still be dished on the left." },
    ] },
    { advance_text = "Put the card up.", blocks = [
        { type = "paragraph", content = "WARM ROOM. USE OF THE BATHS, ALL HOURS. 35 A MONTH. Six lines on a corkboard between a hay advert and somebody selling a trailer." },
    ] },
    { advance_text = "Wait nine days.", blocks = [
        { type = "paragraph", content = "Somebody will ring. They always ring. They will have left somewhere and will not want to say where, and they will ask about the heat and the noise and whether the street door opens." },
    ] },
    { advance_text = "Set the terms.", blocks = [
        { type = "paragraph", content = "And then the terms get set in the first fortnight, by whoever is standing in the lobby when they arrive, the way they have been set thirty-one times in this building." },
        { type = "thought_bubble", content = "This time whoever is standing in the lobby is you, and you wrote the card." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Leave the door open.", config = { destinationType = "specific", locationId = "the_lodgers_room", time_progression_minutes = 30 } }


[[canvases]]
id          = "rung_street_frontage"
name        = "Stand across the road and look at it"
description = "Triggerless rung off hub_spring_street. Ungated, banded on HOUSE. The building from outside, which is the only place the player ever sees the whole thing at once. 25 min."

[[canvases.nodes]]
id   = "base"
name = "From the garage side"
blocks = [
  { type = "paragraph", content = "From the garage side of the road you can see the whole frontage: three storeys, the arched doorway, and the name in gold across the top with a hundred and thirty-four years on it." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "house", operator = "lt", value = 20 },
  ] } }, blocks = [
    { type = "paragraph", content = "The paint is off in sheets. Two of the upstairs windows are boarded and have been since before you were born. The gold has gone green at the edges." },
    { type = "paragraph", content = "It looks exactly like the three shut hotels. That is the thing you cannot unsee once you have stood here." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "house", operator = "gte", value = 20 },
    { type = "trait", subject = "player", trait_key = "house", operator = "lt",  value = 45 },
  ] } }, blocks = [
    { type = "paragraph", content = "Deep green, two coats, gold gone over by hand. The best-looking building on the street, which on this street is not the achievement it sounds, and which took a hundred and fifty dollars and two closed afternoons." },
    { type = "paragraph", content = "The upstairs windows are still boarded." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "house", operator = "gte", value = 45 },
  ] } }, blocks = [
    { type = "paragraph", content = "Green, gold, glass. Steam going up out of the skylight vents at either end of the roof, visible from the top of the street, which it has not been since the seventies." },
    { type = "paragraph", content = "Somebody stopped their car last week to photograph it. The upstairs windows are still boarded, and everybody who looks at this building looks at those two windows." },
    { type = "thought_bubble", content = "Four rooms up there and a bath in each of them. And a chain on the third step, and a key in a tin, and a woman of fifty-six who is waiting to be asked properly." },
  ] },
]
exit_block = { type = "location", text = "Cross back over.", config = { destinationType = "specific", locationId = "spring_street", time_progression_minutes = 25 } }


[[canvases]]
id          = "rung_street_who_you_are_now"
name        = "What the street calls you"
description = "Triggerless rung off hub_spring_street. Ungated, banded on PROPRIETY. Five months of a town working out what to do with a woman. 30 min."

[[canvases.nodes]]
id   = "base"
name = "Perrine's niece"
blocks = [
  { type = "paragraph", content = "In March you were Perrine's niece and nothing else, and that is what four hundred households in this valley called you for about eleven weeks." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "propriety", operator = "gte", value = 50 },
  ] } }, blocks = [
    { type = "paragraph", content = "Now it is the woman at the Marlow, mostly, or Iris to about thirty of them, and Miss Marlow to a town clerk in daylight." },
    { type = "paragraph", content = "That is the ordinary arc of arriving somewhere and staying. It took your aunt about the same length of time in nineteen eighty-nine." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "propriety", operator = "lt", value = 50 },
  ] } }, blocks = [
    { type = "paragraph", content = "Now there are two versions. To the forty who come, you are the woman at the Marlow and the water is the best it has been in years." },
    { type = "paragraph", content = "To the rest there is a second sentence that goes after your name, and you have never heard it said, and you know precisely what it is because this valley has had that sentence ready since about nineteen twenty." },
    { type = "paragraph", content = "Neither version is a rumour. Both of them are simply true, and the town is holding both without any apparent difficulty." },
    { type = "thought_bubble", content = "*What they mind is being made to say they know.* June was not warning you. She was telling you the terms." },
  ] },
]
exit_block = { type = "location", text = "Go and open.", config = { destinationType = "specific", locationId = "spring_street", time_progression_minutes = 30 } }


[[canvases]]
id          = "rung_changing_the_hook"
name        = "The hook with her name on it"
description = "Triggerless rung off hub_changing_room. Ungated, banded on STEAM. One strip of yellowed tape, and five months of not taking it off. 20 min."

[[canvases.nodes]]
id   = "base"
name = "A strip of tape"
blocks = [
  { type = "paragraph", content = "There is a hook on the end of the bench with a strip of tape on it and PERRINE in biro, gone yellow, put there by somebody who is not her." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "steam", operator = "lt", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "She never used it. She changed in the office with the door shut for thirty-one years and the hook stayed empty, and Del labelled it anyway in about nineteen ninety." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "steam", operator = "gte", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "You use it every day. Town clothes on the hook with her name on it at eight in the morning and off it again at one the next morning, and in between you are not wearing anything at all." },
    { type = "paragraph", content = "You could put a new strip of tape on it in about four seconds. There is tape in the desk. You have thought about it twice a week since June." },
    { type = "thought_bubble", content = "Not yet. You are not entirely sure what you are waiting for and you have stopped pretending you do not know." },
  ] },
]
exit_block = { type = "location", text = "Hang your things up.", config = { destinationType = "specific", locationId = "the_changing_room", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_attic_what_you_kept"
name        = "The box you kept"
description = "Triggerless rung off hub_attic_night. Ungated. One box out of four, and what a person keeps of somebody they saw four times in eleven years. 30 min."

[[canvases.nodes]]
id   = "base"
name = "One box of four"
blocks = [
  { type = "paragraph", content = "Two boxes went to the chapel hall in August. One went in the bin. You kept one and it is under the bed." },
  { type = "cascade", props = { beats = [
    { advance_text = "Open it.", blocks = [
        { type = "paragraph", content = "The deeds. The second ledger. Nine photographs of the pool room between nineteen twenty-six and about nineteen eighty. The logbook page from eighty-nine with UPSTAIRS LINE CLOSED OFF TODAY on it." },
    ] },
    { advance_text = "Look at the photographs.", blocks = [
        { type = "paragraph", content = "The attendants in the nineteen twenty-six one are in wraps, four of them, standing at the hot end. One of them is your great-grandmother and she is about twenty-five." },
    ] },
    { advance_text = "Find the letter.", blocks = [
        { type = "paragraph", content = "And a letter, unsent, in Perrine's handwriting, dated the year after she put the black line on the board. Two paragraphs to her sister that stop mid-sentence." },
    ] },
    { advance_text = "Read what there is.", blocks = [
        { type = "paragraph", content = "It says she has done the right thing and that the trade is down forty per cent and that she does not regret it, in a sentence that has been written over twice." },
        { type = "paragraph", content = "It stops at the start of the third paragraph, and the third paragraph begins with the word Mother." },
    ] },
    { advance_text = "Put it back.", blocks = [
        { type = "thought_bubble", content = "She kept it thirty-one years without sending it and without throwing it out. So did the wrap in the locker. So did the key." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Push it back under the bed.", config = { destinationType = "specific", locationId = "the_attic_flat", time_progression_minutes = 30 } }


# ── Closing the fill. ─────────────────────────────────────────────────────

[[canvases]]
id          = "rung_pool_the_regulars"
name        = "The forty"
description = "Triggerless rung off the mixed hub. Ungated. The trade as forty specific people rather than a number in a ledger. 35 min."

[[canvases.nodes]]
id   = "base"
name = "Forty-one of them"
blocks = [
  { type = "paragraph", content = "You could write them all down and you have never needed to, because they arrive in the same order on the same days and always have." },
  { type = "cascade", props = { beats = [
    { advance_text = "The eight o'clock four.", blocks = [
        { type = "paragraph", content = "Lockers eleven, fourteen, nineteen and two. Two widowers, a woman who works nights at the hotel, and a man nobody has ever heard speak." },
    ] },
    { advance_text = "The ten o'clock.", blocks = [
        { type = "paragraph", content = "Eleven women, average age about seventy, of whom June is the youngest by four years and the loudest by a distance nobody is measuring." },
    ] },
    { advance_text = "The yard.", blocks = [
        { type = "paragraph", content = "Eight, twice a week, in at ten to four with the dust still on them and out by six, and two dollars each and six of them tip." },
    ] },
    { advance_text = "The Thursday ones.", blocks = [
        { type = "paragraph", content = "A clerk in the far corner with his glasses folded on the tile. And now nineteen others, on their own, mostly not from the valley, who come on a Wednesday or a Thursday afternoon." },
    ] },
    { advance_text = "The Saturday families.", blocks = [
        { type = "paragraph", content = "Nine or ten of them with children, who are the loudest thing that ever happens in this building and who are the reason the plunge had to be fixed." },
    ] },
    { advance_text = "Count it up.", blocks = [
        { type = "paragraph", content = "Forty-one regulars in a town of nine hundred and forty, which is one in twenty-three people, every week, without fail, for a hundred and thirty-four years." },
        { type = "thought_bubble", content = "Perrine had sixty in two thousand and four and ninety in ninety-six. That number is the only thing in the ledger she ever underlined." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get the tray.", config = { destinationType = "specific", locationId = "the_pool", time_progression_minutes = 35 } }


[[canvases]]
id          = "rung_scrub_what_the_room_is"
name        = "What this room is for"
description = "Triggerless rung off hub_scrub_room. Ungated, banded on SERVICE. The scrub room's own history, and the four lines under the black stripe, from the inside. 30 min."

[[canvases.nodes]]
id   = "base"
name = "One slab, a hundred years"
blocks = [
  { type = "paragraph", content = "The room was built for two slabs and a bench in eighteen ninety-eight, and it has done exactly one job since: hands on people who have paid to have hands on them." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "service", operator = "lt", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "Bath, steam, scrub. Three of the nine lines, and the three that everybody in the valley would say out loud." },
    { type = "paragraph", content = "Del has done about ninety thousand of them and can tell you which vertebra a man drives with." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "service", operator = "gte", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "Oil, two-hand, the private hour, and the fourth one nobody ever wrote down properly. All four happened in this room, on this slab, for sixty years, for money, and the town ran perfectly well throughout." },
    { type = "paragraph", content = "The door has no lock and never has. Perrine took it off herself in eighty-nine, which is either the most honest thing she ever did or the most calculated, and Del will not be drawn on which." },
    { type = "thought_bubble", content = "A room where the door does not lock and the price is on a board. That is not a secret. It never was." },
  ] },
]
exit_block = { type = "location", text = "Get the next one in.", config = { destinationType = "specific", locationId = "the_scrub_room", time_progression_minutes = 30 } }


