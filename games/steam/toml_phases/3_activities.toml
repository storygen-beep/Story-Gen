        { type = "paragraph", content = "There are nine remarks in sixty-four years. Three are about the valve. One says PUMP GONE and is dated February. One, in nineteen eighty-nine, in your aunt's handwriting, says UPSTAIRS LINE CLOSED OFF TODAY." },
        { type = "thought_bubble", content = "That is the only line in this building's own records that says what happened in eighty-nine, and it is about plumbing." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Hang it back up.", config = { destinationType = "specific", locationId = "the_boiler", time_progression_minutes = 25 } }


