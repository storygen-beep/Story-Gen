    { type = "trait", subject = "player", trait_key = "propriety", operator = "gte", value = 50 },
  ] } }, blocks = [
    { type = "paragraph", content = "It is mostly the same forty people. The mill shift at four, the Tuesday women, two men who come every single day and have done since the seventies and have never once spoken to each other." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "propriety", operator = "lt", value = 50 },
  ] } }, blocks = [
    { type = "paragraph", content = "It is not the same forty people any more. Four of the old names have stopped coming and eleven new ones have started, and the new ones come further, and pay without looking at the board, and ask what else the house does." },
    { type = "paragraph", content = "You have started keeping a second column in the ledger that Perrine did not keep." },
  ] },
  { type = "paragraph", content = "By six the till has about forty dollars in it and your feet have gone. The Friday draw is a hundred and thirty-five." },
]
exit_block = { type = "location", text = "Cash up.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 300, effects = [
  { targetType = "player", trait = "money", op = "add", value = 40, clamp = false },
  { targetType = "player", trait = "energy", op = "add", value = -25, clamp = true },
] } }


[[canvases]]
id          = "rung_desk_till"
name        = "Count the till"
description = "Triggerless rung off hub_front_desk. Ungated. The arithmetic of the note, banded on HOUSE so the room reports the state of the business back to the player in plain numbers. No effects except time — this is the game telling you where you are. 20 min."

[[canvases.nodes]]
id   = "base"
name = "The book"
blocks = [
  { type = "paragraph", content = "Perrine's ledger is a hardback with a cloth spine and her writing in it up to the ninth of March, and then yours, which does not look like hers at all." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "house", operator = "lt", value = 15 },
  ] } }, blocks = [
    { type = "paragraph", content = "Forty a day on a good day. Thirty on a Monday. The draw is a hundred and thirty-five and the electric is ninety a month and Del is owed since March, and those three numbers do not fit inside the first one." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "house", operator = "gte", value = 15 },
    { type = "trait", subject = "player", trait_key = "house", operator = "lt",  value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "The plunge brought people back. Not many — eleven a week — but eleven a week is twenty-two dollars and twenty-two dollars a week is the difference between the draw hurting and the draw being survivable." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "house", operator = "gte", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "The book balances for the first time since you inherited it. Not by much, and not because the door improved — because the second column did." },
    { type = "thought_bubble", content = "Perrine kept one column for thirty years. It is the only thing in this building she did that you have already stopped doing." },
  ] },
]
exit_block = { type = "location", text = "Shut the book.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_desk_stock"
name        = "Stock the soap and linen"
description = "Triggerless rung, MONEY 25. The small recurring sink on the trade side, matching the boiler's parts order on the plant side. -25 money (clamp FALSE), +1 service, 45 min."

[[canvases.nodes]]
id   = "base"
name = "Grit soap and forty towels"
blocks = [
  { type = "paragraph", content = "Grit soap comes in a paper sack from the same works in the next county that has supplied this building since nineteen thirty-one. Towels wear out. Both of those facts cost twenty-five dollars roughly every week and neither of them is optional." },
  { type = "paragraph", content = "Perrine's order book has a standing line in it. You have not changed the quantities and you are beginning to think the quantities were set for a busier house than the one she died running." },
]
exit_block = { type = "location", text = "Put it through.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 45, effects = [
  { targetType = "player", trait = "money", op = "add", value = -25, clamp = false },
  { targetType = "player", trait = "service", op = "add", value = 1, clamp = true },
] } }


[[canvases]]
id          = "rung_desk_fee"
name        = "Settle the occupancy fee"
description = "Triggerless rung, MONEY 75. The town's sink, and the one that connects the economy to Warren: the grade is a piece of paper that has to be paid for annually and signed by a man who sits in your pool on Thursdays. -75 money (clamp FALSE), +3 propriety, 60 min."

[[canvases.nodes]]
id   = "base"
name = "The grade"
blocks = [
  { type = "paragraph", content = "Seventy-five dollars to the town, annually, for a certificate that says the Marlow may hold twenty-eight bodies. It is renewed at the counter on a Monday morning with a queue behind you." },
  { type = "cascade", props = { beats = [
    { advance_text = "Pay it at the counter.", blocks = [
        { type = "paragraph", content = "Warren takes the money, stamps the form twice, writes the number twenty-eight in the box, and calls you Miss Marlow in front of four people." },
        { type = "paragraph", content = "He was in your pool on Thursday. He is the only person in this room who knows that, apart from you." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Take the certificate back.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 60, effects = [
  { targetType = "player", trait = "money", op = "add", value = -75, clamp = false },
  { targetType = "player", trait = "propriety", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_desk_board"
name        = "Put a line back on the board"
description = "Triggerless rung, SERVICE 35. The board is the game's own progress bar and this is the click that writes on it — an ascent tier made into a physical object the player walks past every day. +2 service, -2 propriety, 30 min."

[[canvases.nodes]]
id   = "base"
name = "In pencil, under the gold"
blocks = [
  { type = "paragraph", content = "The board is enamel over wood, painted in nineteen twenty-six, and the four crossed-out lines were done with a brush and black paint in one afternoon in nineteen eighty-nine by a woman who had just buried a marriage." },
  { type = "cascade", props = { beats = [
    { advance_text = "Write it in pencil.", blocks = [
        { type = "paragraph", content = "You do not repaint it. You write the line back underneath in pencil, in your own handwriting, small, where a person has to be standing at the desk to read it." },
    ] },
    { advance_text = "Price it.", blocks = [
        { type = "paragraph", content = "Then you put a price beside it, which is the part that makes it real, because a thing with a price is a service and a thing without one is a rumour." },
    ] },
    { advance_text = "Wait for somebody to read it.", blocks = [
        { type = "paragraph", content = "It takes about two hours. A man from the four o'clock reads the board while he is counting out his two dollars, stops, reads it again, and pays for the bath without saying anything at all." },
        { type = "paragraph", content = "He is back on Thursday and he does not ask for the bath." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get back to the floor.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 30, effects = [
  { targetType = "player", trait = "service", op = "add", value = 2, clamp = true },
  { targetType = "player", trait = "propriety", op = "add", value = -2, clamp = true },
] } }


