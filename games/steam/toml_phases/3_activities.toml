[[canvases]]
id          = "rung_boiler_blanket"
name        = "Put the blanket back"
description = "Triggerless rung off the dead-hours hub. Ungated. Forty words of nothing happening, and it is the rung that makes the cot mean something later. +2 his relation, 10 min."

[[canvases.nodes]]
id   = "base"
name = "The blanket"
blocks = [
  { type = "paragraph", content = "You put the blanket back over him. He does not wake. He has slept in this room since two thousand and nine and he sleeps like a man who has learned to do it in ninety-minute pieces between valve checks." },
  { type = "paragraph", content = "The room is thirty degrees and smells of hot iron and the wet stone the spring comes through. You stand there for a minute longer than the blanket required." },
]
