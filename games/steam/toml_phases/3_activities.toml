  { targetType = "player", trait = "energy", op = "add", value = -3, clamp = true },
] } }


[[canvases]]
id          = "rung_let_terms"
name        = "Set the terms"
description = "Triggerless rung off hub_lodgers_room. Ungated, and the room's most load-bearing surface: WHAT THE ARRANGEMENT IS. Banded on STEAM, because what the let includes changes as the house does. Rotation-proof — the terms outlive the tenant. +3 money weekly is handled by the tenant's own rung; this sets the frame. 20 min."

[[canvases.nodes]]
id   = "base"
name = "What the let includes"
blocks = [
  { type = "paragraph", content = "The card in the window of the merchant's says: room, use of the baths, no cooking, no visitors after eleven, paid on the first. Perrine wrote it in nineteen ninety-one and it has been in that window every autumn since." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "steam", operator = "lt", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "You keep the terms as they are. Use of the baths means the public hours, the same as anybody paying two dollars, and the lodger uses them like anybody else." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "steam", operator = "gte", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "You rewrite the card. Use of the baths, all hours, including after close — which is the sentence that changes what this room is, because it means whoever takes it is in the building with you at one in the morning with the doors bolted." },
    { type = "paragraph", content = "You do not put no visitors after eleven back on it either." },
    { type = "thought_bubble", content = "Perrine's handwriting is still on the old card. You keep it in the drawer rather than throw it out." },
  ] },
]
exit_block = { type = "location", text = "Put the card in the window.", config = { destinationType = "specific", locationId = "the_lodgers_room", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_let_asleep"
name        = "The room in the afternoon"
description = "Triggerless rung, STEAM 15. The room with its tenant asleep in it at two in the afternoon — role-scoped, so it survives every rotation. Explicit, cycling pool, t4. +1 steam, +5 arousal, 20 min."

[[canvases.nodes]]
id   = "base"
name = "Two in the afternoon"
blocks = [
  { type = "video", props = { pool_dir = "sex/lodgers_room_asleep_t4", pool = 4, description = "A person asleep half-uncovered on a bed in a hot bare room with a fan going.", search_queries = ["person asleep bed hot room fan sheet", "sleeping figure bare rented room afternoon light"] } },
  { type = "paragraph", content = "The lodger sleeps through the afternoon with the fan going and the door not quite shut, because the door does not sit in its frame properly and never has, and the room runs at thirty degrees off the pipe behind the wall." },
  { type = "cascade", props = { beats = [
    { advance_text = "Stand in the doorway.", blocks = [
        { type = "paragraph", content = "Nobody sleeps covered in this building. The sheet is down round one leg and the whole naked length of your lodger is on that mattress in the flat afternoon light with the fan turning." },
    ] },
    { advance_text = "Don't leave.", blocks = [
        { type = "paragraph", content = "You are the landlord and you have a legitimate reason to be at this door about once a week, and you have used it four times this month, and you are aware of the ratio." },
    ] },
    { advance_text = "Go.", blocks = [
        { type = "paragraph", content = "You pull the door to as far as it goes, which is not far, and go back out to the lobby with your face hot." },
        { type = "thought_bubble", content = "Perrine let this room for thirty years and hung the key on a hook behind the desk. It is still on that hook." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Back to the desk.", config = { destinationType = "specific", locationId = "the_lodgers_room", time_progression_minutes = 20, effects = [
  { targetType = "player", trait = "steam", op = "add", value = 1, clamp = true },
  { targetType = "player", trait = "arousal", op = "add", value = 5, clamp = true },
] } }


