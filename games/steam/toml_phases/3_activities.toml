[[canvases]]
id          = "rung_let_turnover"
name        = "Turn the room over"
description = "Triggerless rung off hub_lodgers_room. Ungated. The room as a SLOT, made legible: same mattress, four tenants, marks on the doorframe at four different heights. Room-scoped — no tenant is named. +1 service, -3 energy, 45 min."

[[canvases.nodes]]
id   = "base"
name = "The same mattress"
blocks = [
  { type = "paragraph", content = "Strip it, turn the mattress, wipe the frame, wash the one glass on the shelf. It takes forty minutes and Perrine did it four times a year for thirty years." },
  { type = "cascade", props = { beats = [
    { advance_text = "Turn the mattress.", blocks = [
        { type = "paragraph", content = "The mattress is dished on the left-hand side because every single person who has slept in this room has slept on the side away from the door. You turn it end for end, which does nothing, and put it back." },
    ] },
    { advance_text = "Look at the doorframe.", blocks = [
        { type = "paragraph", content = "There are four marks on the doorframe at four different heights where four different people hung four different things off the same nail, and one of them wrote a date beside it in pencil in nineteen ninety-four." },
    ] },
    { advance_text = "Make the bed.", blocks = [
        { type = "paragraph", content = "You make it up with the good linen because the good linen is what gets the room let by the second week of the season, and the terms of a let are always set in the first fortnight by whoever happens to be standing here when they arrive." },
        { type = "thought_bubble", content = "Whoever is in it now will be gone by spring, and someone else will be in it, and the mattress will still be dished on the left." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Shut the door on it.", config = { destinationType = "specific", locationId = "the_lodgers_room", time_progression_minutes = 45, effects = [
