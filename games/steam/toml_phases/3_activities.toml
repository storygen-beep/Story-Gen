[[canvases]]
id          = "rung_boiler_shift"
name        = "Take the two o'clock"
description = "Triggerless rung, HOUSE < 35 — it retires itself once the new valve holds, which is the correct way for a chore to end. She works his shift so he gets one uninterrupted night. +5 his relation, -6 energy, 120 min."

[[canvases.nodes]]
id   = "base"
name = "His shift"
blocks = [
  { type = "paragraph", content = "The valve needs a hand on it every two hours and the hand has been his for sixteen years. Tonight it is yours: quarter turn open at the sound of the pressure dropping, hold it, quarter turn back when the needle comes up." },
  { type = "cascade", props = { beats = [
    { advance_text = "Sit up with it.", blocks = [
        { type = "paragraph", content = "You sit on the steps with the logbook on your knees and wait for a needle to move. It takes forty minutes. When it goes, it goes fast, and you get your hand on the wheel about four seconds later than he would have." },
    ] },
    { advance_text = "Do it again at four.", blocks = [
        { type = "paragraph", content = "And again at four. In between there is nothing to do but sit in a hot room and listen to a building work, and you understand for the first time why a man would stop going home." },
    ] },
    { advance_text = "Hand it back.", blocks = [
        { type = "paragraph", content = "At five he wakes on his own, the way he has woken on his own for sixteen years, and finds the log written up in your handwriting for three entries." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_ivo" }, content = "You wrote the pressure in the temperature column." },
        { type = "paragraph", content = "Which is, from Ivo, a very long speech, and he stands there holding the book with his thumb on your handwriting for slightly too long." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go up and open at eight.", config = { destinationType = "specific", locationId = "the_boiler", time_progression_minutes = 120, effects = [
  { targetType = "npc", npcId = "npc_ivo", trait = "relation", op = "add", value = 5, clamp = true },
  { targetType = "player", trait = "energy", op = "add", value = -6, clamp = true },
] } }


