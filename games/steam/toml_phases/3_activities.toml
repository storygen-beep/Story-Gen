    { type = "trait", subject = "player", trait_key = "service", operator = "gte", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "Bath. Steam. Scrub. Oil, back in gold because you paid a signwriter eleven dollars to do it properly. And two lines in pencil underneath, small, where you have to be at the counter to read them." },
