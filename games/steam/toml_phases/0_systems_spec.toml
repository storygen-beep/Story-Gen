# =============================================================================
# Steam — 0_systems_spec
# Built with author-game-v2. Want + board: games/steam/v2_state.json
#
# METERS, THREE LAYERS (references/the-board.md §3):
#   1  RATCHETING TIERS  steam · service · house   — rungs at 15/35/55
#   2  VOLATILE STATE    arousal · energy · money
#   3  PER-CHARACTER     relation · lust           — on each [[npcs]] block
#   +  COUNTERWEIGHT     propriety — starts at 70, buys nothing, is what she spends
#
# ⚠️ THE TOP BAND IS UNBOUNDED AT v0.1 (min = 55, no max). Gate 8 judges the top
#    band's MIN (gates.py:612), so v0.1 owes an authored gate at 55 on each tier
#    and promises nothing above it. Each release adds a band and the content
#    behind it — the honest-wall rule, references/the-release.md.
# =============================================================================

schema_version = "1.0"

[project]
id              = "steam"
title           = "Steam"
description     = "Her aunt left her the Marlow Baths and the note on it. She has eleven months, one attendant who has not been paid since March, and a building where the whole town arrives with its clothes off."
starting_canvas = "canvas_opening"
quests_engine   = "v2"
version         = "0.1"

[time]
starting_hour = 7          # she opens the doors for the first time
starting_day  = "Monday"   # four days before the first Friday draw
starting_week = 1

[settings]
narration_person  = "second"        # IMMUTABLE once v0.1 ships
clothing_enabled  = true
wardrobe_location = "the_changing_room"   # Perrine's locker is here, not upstairs

# ─── The note — the ENGINE under everything ──────────────────────────────────
# Perrine borrowed from Casper's father, so the obligation has a FACE and the
# face is a cast member with a grievance (the-economy.md R3).
#
# ⚠️ WEEKLY, NOT MONTHLY. `rent_due_day` is validated against weekday names only
#    (template_import.py:4786, VALID_DAYS) — there is no monthly period in the
#    engine. So the note is drawn weekly: 135 on Fridays against a door take of
#    roughly 40 a day. Four good days covers it; a bad week does not.
#
# ⚠️ eviction_mode = "flag_set", NOT the default "game_end". The product never
#    ends, so missing the draw sets `note_called` and the terms change — Casper
#    stops taking money and starts pricing the building.
[settings.rent]
enabled          = true
amount           = 135
due_day          = "Friday"
collector_npc    = "npc_casper"
grace_periods    = 1
start_after_flag = "doors_open"
eviction_mode    = "flag_set"
eviction_flag    = "note_called"

[settings.rent.text]
title            = "Friday"
scene            = "He comes in at six with his coat still on, like a man who does not plan to be here long enough to take it off. His father's book is under his arm. He puts it on the desk and opens it to the page with your aunt's name at the top."
greeting         = "Right. Friday."
paid_scene       = "You count it onto the desk. He counts it again in front of you, slowly, wetting his thumb on each note, and then writes the figure into his father's book in handwriting that is trying to be his father's handwriting."
paid_response    = "That's the week, then. Friday."
paid_closing     = "On his way out he looks up the stairs — the ones going to the floor Perrine kept shut — and then the door does the thing it does, and you are alone in your own lobby again."
cant_pay         = "You haven't got it."
warning_scene    = "You tell him you are short. He does not get angry. He puts the pen down and looks around the lobby instead, at the tilework and the desk and the water stain on the ceiling, and you can hear him pricing all of it."
warning_response = "One week. I'm family, Iris. I'm also the note."
warning_closing  = "He leaves the book open on the desk when he goes, turned round to face you, so you can read what your aunt owed his father going back nine years."
eviction_scene_soft    = "The second Friday he does not open the book at all. He takes his coat off, finally, and hangs it on the hook by the door like a man who lives here, and sits down on the bench where the bathers sit to dry off."
eviction_response_soft = "We're past the money. Let's talk about what this place is worth to you."
eviction_closing_soft  = "He does not say what he means and he does not have to. He stays until you turn the lights off, and on his way out he tells you which room he would have fixed first."

[theme]
mode = "dark"


# ─── The ascent tiers ────────────────────────────────────────────────────────
# Three kinds of going-further, so a player who does not want one can still
# climb another. Rungs at 15/35/55, the ladder measured off the reference game.
# Band text is UI VOICE (references/the-voice.md): it names a state plainly and
# never performs — the register lives in the paragraph after the click.

[[sidebar_items]]
type  = "trait_status_text"
trait = "steam"
bands = [
  { min = 0,  max = 14, text = "Robed at all times" },
  { min = 15, max = 34, text = "Working in the house shift" },
  { min = 35, max = 54, text = "Down to the wrap" },
  { min = 55, text = "On the tiles with nothing on" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "service"
bands = [
  { min = 0,  max = 14, text = "Towels and tea" },
  { min = 15, max = 34, text = "Scrubbing backs" },
  { min = 35, max = 54, text = "Oil, on request" },
  { min = 55, text = "Taking private bookings" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "house"
bands = [
  { min = 0,  max = 14, text = "Three rooms open" },
  { min = 15, max = 34, text = "The plunge running again" },
  { min = 35, max = 54, text = "The boiler floor sound" },
  { min = 55, text = "Everything downstairs, and the stairs still shut" },
]

# The counterweight. Falls as she climbs. Buys nothing by design — it is the
# price, not a currency, so it has no gates and owes no content.
[[sidebar_items]]
type  = "trait_status_text"
trait = "propriety"
bands = [
  { min = 0,  max = 24, text = "The town knows what the Marlow is now" },
  { min = 25, max = 49, text = "People have stopped bringing the kids" },
  { min = 50, max = 74, text = "Perrine's niece, running Perrine's house" },
  { min = 75, max = 100, text = "Above talk" },
]


# ─── Trait labels ────────────────────────────────────────────────────────────
[[traits.labels]]
key   = "energy"
label = "Rested"

[[traits.labels]]
key   = "money"
label = "Cash"

# Internals — never surfaced to the player.
[[traits.labels]]
key    = "arousal"
hidden = true

[[traits.labels]]
key    = "takings_today"
hidden = true

[[traits.labels]]
key    = "tenant_slot"
hidden = true


# =============================================================================
# GUIDANCE — [[quest_cards]] (engine.md §23; the-voice.md R2/R3/R5)
#
# ⚠️ NO `version = "1.0"` ON A QUEST CARD. Quest conditions use a separate
#    evaluator with no fail-open (checkQuestsCondition, v2.py:14878).
#
# Tier 1 = the ascent ladders (no npc_id). A v2 game has no mission, so the top
# of the page IS the tiers. Stepped bands, gte + lt, exactly one live at a time.
# Every goal label names a PLACE and a VERB — the number is already in the
# sidebar; what the player cannot see is which click moves it (R3).
#
# The >=55 card on each tier is the HONEST WALL: no goal bullet, reads forward.
# Never dangle an objective this build cannot flip.
# =============================================================================

# ── STEAM ────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 10
text     = "Perrine worked the floor in a robe with the belt done up, and so do you, and the regulars have noticed that too."
tip      = "Work the pool in the house shift instead of the robe — the changing room, before opening."
when     = [ { trait = "steam", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "steam", subject = "player", op = "gte", value = 15, label = "Open up in the house shift — the changing room" } ]

[[quest_cards]]
priority = 10
text     = "The shift is thin and it goes transparent at the hem the moment you kneel by the pool, which everybody has now established."
tip      = "Stop covering when the water gets on it — work the pool wet, women's hours."
when     = [ { trait = "steam", subject = "player", op = "gte", value = 15 },
             { trait = "steam", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "steam", subject = "player", op = "gte", value = 35, label = "Work the pool wet and don't cover — women's hours" } ]

[[quest_cards]]
priority = 10
text     = "Down to a wrap, like the attendants in the photographs behind the desk, none of whom look like they were cold."
tip      = "Take the wrap into the scrub room and work a man on the slab in it."
when     = [ { trait = "steam", subject = "player", op = "gte", value = 35 },
             { trait = "steam", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "steam", subject = "player", op = "gte", value = 55, label = "Work the slab in the wrap — the scrub room" } ]

[[quest_cards]]
priority = 10
text     = "You work the house with nothing on and nobody comments, which is its own kind of arrival. Further than this is the members' floor, and those stairs are still shut."
when     = [ { trait = "steam", subject = "player", op = "gte", value = 55 } ]

# ── SERVICE ──────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 11
text     = "Towels, tea, and the till. Perrine's board behind the desk lists nine things the house used to do and you can do two of them."
tip      = "Del works the slab from eleven. Ask her to teach you the scrub."
when     = [ { trait = "service", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "service", subject = "player", op = "gte", value = 15, label = "Learn the scrub off Del — the scrub room, midday" } ]

[[quest_cards]]
priority = 11
text     = "You can scrub a back well enough that they book you and not the slab, which Del has noticed and has not said anything about."
tip      = "Work the slab through the afternoon and take the ones who ask for you."
when     = [ { trait = "service", subject = "player", op = "gte", value = 15 },
             { trait = "service", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "service", subject = "player", op = "gte", value = 35, label = "Take the regulars who ask for you — the scrub room" } ]

[[quest_cards]]
priority = 11
text     = "Oil is on the board and the board is thirty years old, so nobody has to be told what it meant when Perrine's girls did it."
tip      = "Offer the oil in the scrub room. Ivo after his shift, Warren on a Thursday."
when     = [ { trait = "service", subject = "player", op = "gte", value = 35 },
             { trait = "service", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "service", subject = "player", op = "gte", value = 55, label = "Work a man in oil — the scrub room" } ]

[[quest_cards]]
priority = 11
text     = "Everything on Perrine's board is yours to offer. What is not on the board yet is the private list, and that needs a room upstairs to keep it in."
when     = [ { trait = "service", subject = "player", op = "gte", value = 55 } ]

# ── HOUSE ────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 12
text     = "Three rooms open, and the plunge has been dry since the pump went in February. A bathhouse with one temperature is half a bathhouse."
tip      = "Money fixes rooms. Take the door, take the tips, and buy the pump off Ivo."
when     = [ { trait = "house", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 15, label = "Buy the pump off Ivo — the boiler, nights" } ]

[[quest_cards]]
priority = 12
text     = "The plunge runs. The boiler floor is another matter: Ivo keeps the heat up by hand every night because the feed valve is thirty years past it."
tip      = "Work the door and the slab for the money, then put it into the valve."
when     = [ { trait = "house", subject = "player", op = "gte", value = 15 },
             { trait = "house", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 35, label = "Pay for the feed valve — the boiler, nights" } ]

[[quest_cards]]
priority = 12
text     = "The heat holds itself now, which means the house runs whether or not you are standing in it, and that is the first hour you have owned since March."
tip      = "Put the rest into the downstairs rooms — the tiles, the linen, the second slab."
when     = [ { trait = "house", subject = "player", op = "gte", value = 35 },
             { trait = "house", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 55, label = "Finish the downstairs rooms — the front desk" } ]

[[quest_cards]]
priority = 12
text     = "Every room on this floor is open and working. The stairs off the lobby are not, and Perrine kept that key somewhere. The members' floor opens in a future update."
when     = [ { trait = "house", subject = "player", op = "gte", value = 55 } ]


# ── The characters. One live rung each, plus a card that still matches after
#    it retires — a chain that ends in silence deletes the whole section from
#    the page and the sidebar next-row (the-voice.md R5, gate 15).
# ─────────────────────────────────────────────────────────────────────────────

[[quest_cards]]
priority = 20
npc_id   = "npc_del"
text     = "She has run this floor since before you could swim and she has not been paid since March. She is waiting to see whether you are Perrine's niece or just the woman who inherited."
tip      = "She is on the slab from eleven. Work beside her, and pay her what she is owed."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_del", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_del", op = "gte", value = 40, label = "Work the slab beside her — the scrub room, midday" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_del"
text     = "She calls it your house now, out loud, in front of bathers. Whatever is left between you is not about the building. Her arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_del", op = "gte", value = 40 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_ivo"
text     = "He keeps the heat up by hand every night and sleeps on a cot beside it. He has never once asked you for anything, which is not the same as not wanting."
tip      = "Go down to the boiler after twenty hundred. He is there until two."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_ivo", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_ivo", op = "gte", value = 40, label = "Sit out the stoke with him — the boiler, nights" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_ivo"
text     = "He leaves the basement door open now. There is a cot down there and both of you know how many hours a night you are awake at the same time. His arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_ivo", op = "gte", value = 40 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_warren"
text     = "The clerk holds your occupancy grade and comes on Thursdays when the pool is empty. In daylight he calls you Miss Marlow."
tip      = "Thursday evening, the pool, the corner with his back to the door."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_warren", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_warren", op = "gte", value = 40, label = "Sit in the water with him — the pool, Thursday evening" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_warren"
text     = "He has stopped pretending it is an inspection and started arriving early. What he signs and what he wants are the same document now. His arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_warren", op = "gte", value = 40 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_june"
text     = "Forty years of Tuesdays. What she says in the pool on Tuesday is what the town believes by Thursday, and she has not decided about you yet."
tip      = "Tuesday morning, the hot pool. Sit with her and let her talk."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_june", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_june", op = "gte", value = 40, label = "Sit out her Tuesday with her — the pool, mornings" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_june"
text     = "She vouches for you in the pool where people can hear it, and she is frank with you about things she is frank with nobody else about. Her arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_june", op = "gte", value = 40 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_casper"
text     = "Your cousin expected this building and got the note on it instead, so every Friday he stands in your lobby with his father's book and reads out what you owe."
tip      = "Friday evening at the desk. Have the money, or find out what else he will take."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_casper", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_casper", op = "gte", value = 40, label = "Meet him on Friday with the week's take — the front desk" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_casper"
text     = "He uses the place on Saturdays like a man with a stake in it, and he has stopped calling it his father's note. His arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_casper", op = "gte", value = 40 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_nell"
text     = "She took the let room for the season, pays on time, sleeps through the day and swims at two in the morning. She never met your aunt and has no idea who you are supposed to be."
tip      = "The pool, after one in the morning. She is the only person here at that hour."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_nell", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_nell", op = "gte", value = 40, label = "Swim with her after one — the pool, nights" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_nell"
text     = "She waits for you before she gets in now. The season ends and she goes, and both of you have been careful not to say so. Her arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_nell", op = "gte", value = 40 } ]
