[[canvases.nodes]]
id   = "base"
name = "Five o'clock"
blocks = [
  { type = "paragraph", content = "He is up at five to bring the outlet back to temperature before the doors. It takes three hours and it has to be done by hand because the mixing valve is a hundred and thirty years old." },
  { type = "cascade", props = { beats = [
    { advance_text = "Come down with coffee.", blocks = [
        { type = "paragraph", content = "You bring two cups down the eleven steps. He takes his without comment and puts it on the bench where it goes cold, every morning, without fail." },
    ] },
    { advance_text = "Watch the needle.", blocks = [
        { type = "paragraph", content = "Thirty-nine at five. Forty-one by six. Forty-four at ten to eight, which is where it wants to be when the first of them gets in." },
    ] },
    { advance_text = "Sit on the third step.", blocks = [
        { type = "paragraph", content = "You sit on the third step with the towel on it that you did not put there and watch a man bring a building up to temperature." },
        { type = "paragraph", content = "Nobody upstairs has ever seen this happen. Perrine came down twice in fifteen years." },
    ] },
  ] } },
