[[canvases]]
id          = "rung_warren_counter"
name        = "Two dollars"
description = "Triggerless rung off hub_warren_desk. Ungated. The gap, in its purest form: whatever happened in the water, this is a man paying two dollars at a counter. Banded on his lust. +2 his relation, 10 min."

[[canvases.nodes]]
id   = "base"
name = "The counter"
blocks = [
  { type = "paragraph", content = "He puts two dollars on the counter, not in your hand, and takes the token off the hook and puts it in the bowl himself." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "npc", npc_id = "npc_warren", trait_key = "lust", operator = "lt", value = 25 },
  ] } }, blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "Thank you, Miss Marlow. Same time next week." },
    { type = "paragraph", content = "And that is the whole of it, and he is out of the door and up the street, and the till has two dollars more in it." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "npc", npc_id = "npc_warren", trait_key = "lust", operator = "gte", value = 25 },
  ] } }, blocks = [
    { type = "paragraph", content = "He puts the two dollars down with his hair still wet and his collar dark at the back, forty minutes after having his mouth on you in the far corner of the hot end." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "Thank you, Miss Marlow." },
    { type = "paragraph", content = "The same four words, in the same voice, with the same small nod. He has never once slipped. It is the most disciplined thing you have ever watched a person do." },
    { type = "thought_bubble", content = "That is not shame. You worked that out in September. That is the whole thing working exactly as he wants it to." },
