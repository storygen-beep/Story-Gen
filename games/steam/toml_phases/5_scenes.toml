[[canvases]]
id          = "rung_warren_file"
name        = "The Marlow's file"
description = "Triggerless rung, his relation 15. He has held the building's paperwork since Perrine's day and knows things about it she never told anybody. +4 his relation, +2 house, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Since eighty-six"
blocks = [
  { type = "paragraph", content = "He has had the Marlow's file since nineteen eighty-six. Every grade, every complaint, every application, and one letter from the county in nineteen ninety-two that he mentions twice before you ask about it." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask about ninety-two.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "Somebody complained about what went on upstairs. Anonymously, which in a town this size means we all knew who." },
    ] },
    { advance_text = "Ask what happened.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "Nothing. It was three years after she'd already shut it. She wrote back saying so and my predecessor filed it and that was the end of it." },
        { type = "paragraph", content = "He straightens the two dollars on the counter so the edges line up." },
    ] },
    { advance_text = "Ask what it would take now.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "A complaint in writing, from somebody prepared to put a name on it, about something specific. In eleven years I have had none of those about this building." },
        { type = "paragraph", content = "Then he says goodnight, and the door does the thing it does, and you stand at the counter for a while with two dollars in your hand." },
        { type = "thought_bubble", content = "*From somebody prepared to put a name on it.* He was answering the question you did not ask." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Lock up.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 25, effects = [
