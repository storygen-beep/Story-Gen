[[canvases]]
id          = "rung_del_years"
name        = "Thirty-one years"
description = "Triggerless rung, her relation 20. Why a woman stays in one building for thirty-one years, answered without a single sentimental word. +4 her relation, 30 min."

[[canvases.nodes]]
id   = "base"
name = "Since eighty-nine"
blocks = [
  { type = "paragraph", content = "You ask how she ended up here. She folds three towels before she answers, which is her equivalent of clearing her throat." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "Mill shut in eighty-eight. Your grandmother had a card in the merchant's window in the January." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask about her grandmother.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "Hard woman. Fair, mind. She had that board full and she worked the floor herself till she was sixty-one." },
        { type = "paragraph", content = "Full board. She says it without any weight on it at all, which is how you know she means all nine lines." },
    ] },
    { advance_text = "Ask why she stayed.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "Where was I going? And it's warm, and it's the same forty people, and once you're any good at this there's about four buildings in the country where it's worth anything." },
    ] },
    { advance_text = "Ask about her husband.", blocks = [
        { type = "paragraph", content = "She looks at you for a second to see whether you are asking properly or being polite." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "Died two thousand and six. I did four days a week before that and six after, and your aunt never once asked me why." },
        { type = "paragraph", content = "Then she picks the basket up and puts it on the bench between you, which ends it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Carry on folding.", config = { destinationType = "specific", locationId = "the_changing_room", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_del", trait = "relation", op = "add", value = 4, clamp = true },
] } }


[[canvases]]
id          = "rung_del_plan"
name        = "What she'd do with it"
description = "Triggerless rung, her relation 35. The woman who has run this floor for thirty-one years, asked what she would do if it were hers. This is the game's own roadmap, spoken by the person best placed to write it. +5 her relation, +2 house, 35 min."

[[canvases.nodes]]
id   = "base"
name = "If it were yours"
blocks = [
  { type = "paragraph", content = "You ask her what she would do with the place if it were hers. Nobody has asked her that in thirty-one years, and it takes her a moment to work out that you mean it." },
  { type = "cascade", props = { beats = [
    { advance_text = "Wait.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "Second slab. Two of us working, one room. That's forty dollars a day you're leaving on the floor." },
    ] },
    { advance_text = "And after that.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "Price it properly. Open the upstairs. Put the four lines back and charge what they're worth, not what they were worth when the mill was going." },
    ] },
    { advance_text = "Ask her about upstairs.", blocks = [
        { type = "paragraph", content = "She stops folding." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "There's four rooms up there and a bath in each of them. Your grandmother's list was fourteen names long and every one of them paid a year in advance." },
        { type = "paragraph", content = "The stairs go up from the lobby. The chain has been on the third step since nineteen eighty-nine, and Del has walked past it four thousand times." },
        { type = "thought_bubble", content = "She has thought about this. She has thought about this for years and nobody ever asked her." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Finish the count.", config = { destinationType = "specific", locationId = "the_changing_room", time_progression_minutes = 35, effects = [
  { targetType = "npc", npcId = "npc_del", trait = "relation", op = "add", value = 5, clamp = true },
