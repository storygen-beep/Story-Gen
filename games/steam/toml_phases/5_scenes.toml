[[canvases]]
id          = "rung_casper_scrub"
name        = "The scrub he asked for"
description = "Triggerless rung off hub_casper_pool, SERVICE 15. He said it in front of a full pool as a joke and neither of you treated it as one. Explicit-adjacent, and the last rung before his loop. +5 his lust, +4 money (clamp FALSE), 45 min."

[[canvases.nodes]]
id   = "base"
name = "Half twelve"
blocks = [
  { type = "paragraph", content = "He said half twelve in front of eleven people and you wrote it in the book, which made it a booking rather than a remark." },
  { type = "cascade", props = { beats = [
    { advance_text = "Put him on the slab.", blocks = [
        { type = "paragraph", content = "Face down, forehead on his folded arms, on the same marble your grandmother worked. He has not been in this room since he was about nine." },
    ] },
    { advance_text = "Work him.", blocks = [
        { type = "paragraph", content = "Grit soap and long pulls from the base of the spine out over the hip. He is a builder's shape and his back is a mess and he says so, into his arms, in a voice that is doing a lot of work." },
    ] },
    { advance_text = "Keep going.", blocks = [
        { type = "paragraph", content = "You do the backs of his thighs. He is hard against the marble and both of you know it and neither of you mentions it, because that is what this room is and it is the first time he has understood that." },
    ] },
    { advance_text = "Hose him down.", blocks = [
        { type = "paragraph", content = "He pays two dollars for the bath and two for the scrub at the desk, and puts a five in the bowl for the lockers, which is not a thing anybody does." },
