    { advance_text = "Get through.", blocks = [
        { type = "paragraph", content = "You go down the middle sideways with the stack held over your head, past bare backs and bare arses and a man stepping out of his trousers who has to grab the bench." },
    ] },
    { advance_text = "Work in it.", blocks = [
        { type = "paragraph", content = "Somebody's elbow. Somebody's hip. Your tits against a shoulder blade on the way past and nobody remarking on any of it, because in here that is simply what a Saturday is." },
    ] },
    { advance_text = "Get the lockers open.", blocks = [
