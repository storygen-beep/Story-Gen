    { type = "paragraph", content = "He puts the two dollars down with his hair still wet and his collar dark at the back, forty minutes after having his mouth on you in the far corner of the hot end." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "Thank you, Miss Marlow." },
    { type = "paragraph", content = "The same four words, in the same voice, with the same small nod. He has never once slipped. It is the most disciplined thing you have ever watched a person do." },
    { type = "thought_bubble", content = "That is not shame. You worked that out in September. That is the whole thing working exactly as he wants it to." },
  ] },
]
exit_block = { type = "location", text = "Put it in the till.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 10, effects = [
  { targetType = "npc", npcId = "npc_warren", trait = "relation", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_warren_file"
name        = "The Marlow's file"
description = "Triggerless rung, his relation 15. He has held the building's paperwork since Perrine's day and knows things about it she never told anybody. +4 his relation, +2 house, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Since eighty-six"
blocks = [
  { type = "paragraph", content = "He has had the Marlow's file since nineteen eighty-six. Every grade, every complaint, every application, and one letter from the county in nineteen ninety-two that he mentions twice before you ask about it." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask about ninety-two.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "Somebody complained about what went on upstairs. Anonymously, which in a town this size means we all knew who." },
    ] },
    { advance_text = "Ask what happened.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "Nothing. It was three years after she'd already shut it. She wrote back saying so and my predecessor filed it and that was the end of it." },
        { type = "paragraph", content = "He straightens the two dollars on the counter so the edges line up." },
    ] },
    { advance_text = "Ask what it would take now.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "A complaint in writing, from somebody prepared to put a name on it, about something specific. In eleven years I have had none of those about this building." },
        { type = "paragraph", content = "Then he says goodnight, and the door does the thing it does, and you stand at the counter for a while with two dollars in your hand." },
        { type = "thought_bubble", content = "*From somebody prepared to put a name on it.* He was answering the question you did not ask." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Lock up.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_warren", trait = "relation", op = "add", value = 4, clamp = true },
  { targetType = "player", trait = "house", op = "add", value = 2, clamp = true },
] } }


# ── Ivo at dawn, Casper's Saturday scrub, June in winter, Nell in the water. ─

[[canvases]]
id          = "rung_ivo_dawn"
name        = "The dawn stoke"
description = "Triggerless rung off hub_ivo_boiler, reached in his 05:00-08:00 window. Ungated. Two people awake in a building nobody else is in yet. +3 his relation, +2 energy, 40 min."

[[canvases.nodes]]
id   = "base"
name = "Five o'clock"
blocks = [
  { type = "paragraph", content = "He is up at five to bring the outlet back to temperature before the doors. It takes three hours and it has to be done by hand because the mixing valve is a hundred and thirty years old." },
  { type = "cascade", props = { beats = [
    { advance_text = "Come down with coffee.", blocks = [
        { type = "paragraph", content = "You bring two cups down the eleven steps. He takes his without comment and puts it on the bench where it goes cold, every morning, without fail." },
    ] },
    { advance_text = "Watch the needle.", blocks = [
        { type = "paragraph", content = "Thirty-nine at five. Forty-one by six. Forty-four at ten to eight, which is where it wants to be when the first of them gets in." },
    ] },
    { advance_text = "Sit on the third step.", blocks = [
        { type = "paragraph", content = "You sit on the third step with the towel on it that you did not put there and watch a man bring a building up to temperature." },
        { type = "paragraph", content = "Nobody upstairs has ever seen this happen. Perrine came down twice in fifteen years." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go up and open.", config = { destinationType = "specific", locationId = "the_boiler", time_progression_minutes = 40, effects = [
  { targetType = "npc", npcId = "npc_ivo", trait = "relation", op = "add", value = 3, clamp = true },
  { targetType = "player", trait = "energy", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_casper_scrub"
name        = "The scrub he asked for"
description = "Triggerless rung off hub_casper_pool, SERVICE 15. He said it in front of a full pool as a joke and neither of you treated it as one. Explicit-adjacent, and the last rung before his loop. +5 his lust, +4 money (clamp FALSE), 45 min."

[[canvases.nodes]]
id   = "base"
name = "Half twelve"
blocks = [
  { type = "paragraph", content = "He said half twelve in front of eleven people and you wrote it in the book, which made it a booking rather than a remark." },
  { type = "cascade", props = { beats = [
    { advance_text = "Put him on the slab.", blocks = [
        { type = "paragraph", content = "Face down, forehead on his folded arms, on the same marble your grandmother worked. He has not been in this room since he was about nine." },
    ] },
    { advance_text = "Work him.", blocks = [
        { type = "paragraph", content = "Grit soap and long pulls from the base of the spine out over the hip. He is a builder's shape and his back is a mess and he says so, into his arms, in a voice that is doing a lot of work." },
    ] },
    { advance_text = "Keep going.", blocks = [
        { type = "paragraph", content = "You do the backs of his thighs. He is hard against the marble and both of you know it and neither of you mentions it, because that is what this room is and it is the first time he has understood that." },
    ] },
    { advance_text = "Hose him down.", blocks = [
        { type = "paragraph", content = "He pays two dollars for the bath and two for the scrub at the desk, and puts a five in the bowl for the lockers, which is not a thing anybody does." },
        { type = "thought_bubble", content = "Four dollars. Off a man who takes a hundred and thirty-five off you on Friday." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Turn the room round.", config = { destinationType = "specific", locationId = "the_pool", time_progression_minutes = 45, effects = [
  { targetType = "npc", npcId = "npc_casper", trait = "lust", op = "add", value = 5, clamp = true },
  { targetType = "player", trait = "money", op = "add", value = 4, clamp = false },
] } }


[[canvases]]
id          = "rung_june_winter"
name        = "June, on the winter"
description = "Triggerless rung off hub_june_pool, her relation 25. What the water is actually for, in a valley where the road shuts. +4 her relation, 30 min."

[[canvases.nodes]]
id   = "base"
name = "Forty years of Tuesdays"
blocks = [
  { type = "paragraph", content = "You ask her whether she has ever missed one. She thinks about it properly, which takes a while, because forty years is two thousand Tuesdays." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_june" }, content = "Four. Two when I had the girls. One when my mother went. And the February the road shut and I couldn't get down the hill." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask about the February.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_june" }, content = "Nineteen eighty-four. Worst week this valley's had. Everything shut except this, and I was stuck at the top with two kids and no coal." },
    ] },
    { advance_text = "Ask what she did.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_june" }, content = "Walked down on the Thursday. Two miles on the ice with the pair of them. Your grandmother had the door open and forty people in here and she never charged one of us that week." },
    ] },
    { advance_text = "Let that land.", blocks = [
        { type = "paragraph", content = "She says it to the skylight, as always, and then does the sideways look." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_june" }, content = "So when people in this town start telling me what the Marlow's turning into, I remind them whose door was open in eighty-four. Usually shuts them up." },
        { type = "thought_bubble", content = "She has been fighting on your behalf in rooms you are not in. She has never once mentioned it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get her a towel.", config = { destinationType = "specific", locationId = "the_pool", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_june", trait = "relation", op = "add", value = 4, clamp = true },
] } }


[[canvases]]
id          = "rung_nell_talk"
name        = "In the water with Nell"
description = "Triggerless rung off hub_nell_pool, her relation 20. Two people who both left somewhere, in a pool at two in the morning, not asking each other about it. +3 her relation, 30 min."

[[canvases.nodes]]
id   = "base"
name = "Two in the morning"
blocks = [
  { type = "paragraph", content = "She hangs off the lip at the deep end and you sit on the edge with your feet in, which is the arrangement most nights when neither of you can be bothered to swim." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask about the swimming.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_nell" }, content = "County squad till I was seventeen. Six mornings a week from the age of nine. Then I stopped, on a Tuesday, and never got in a pool again till March." },
    ] },
    { advance_text = "Ask what happened on the Tuesday.", blocks = [
        { type = "paragraph", content = "She goes under, comes up, wipes her face, and answers a completely different question about the merchant's coffee." },
        { type = "paragraph", content = "You let her. You have your own version of that Tuesday and you would not answer it either." },
    ] },
    { advance_text = "Stay a while.", blocks = [
        { type = "paragraph", content = "So you sit in the dark in a tiled room with a woman who will be gone by spring and talk about absolutely nothing for forty minutes." },
        { type = "thought_bubble", content = "The card said end of the season. You have started thinking about the card." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Leave her to her lengths.", config = { destinationType = "specific", locationId = "the_pool", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_nell", trait = "relation", op = "add", value = 3, clamp = true },
] } }


# ── One more long surface per character, in the room their schedule puts them. ─

[[canvases]]
id          = "rung_del_the_key"
name        = "Ask Del where the key is"
description = "Triggerless rung off hub_del_scrub, her relation 45 + HOUSE 35. The padlock on the third step has a key and one living person knows where it is. Pays out the release's main locked door as a WANT rather than opening it. +4 her relation, +3 house, 30 min."

[[canvases.nodes]]
id   = "base"
name = "The third step"
blocks = [
  { type = "paragraph", content = "You ask her, straight out, in the scrub room, with the door open and the hose running." },
  { type = "cascade", props = { beats = [
    { advance_text = "Wait.", blocks = [
        { type = "paragraph", content = "She turns the tap off. That is not a small thing — she has never once stopped working for a conversation in five months." },
    ] },
    { advance_text = "Let her answer.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "I know where it is. I've known since eighty-nine. She gave it me to hold the day she put the chain on, and I've not had it out of the tin since." },
    ] },
    { advance_text = "Ask why she kept it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "Because she asked me to, and because she never asked for it back, which is two different things and I've had thirty-one years to think about both of them." },
    ] },
    { advance_text = "Ask for it.", blocks = [
        { type = "paragraph", content = "She looks at you for a long moment with her sleeves rolled to the shoulder and her hands wet." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "Not yet. When you know what you're opening it for, ask me again, and I'll go and get the tin." },
    ] },
    { advance_text = "Accept that.", blocks = [
        { type = "paragraph", content = "It is not a refusal and both of you know it. It is a woman of fifty-six declining to hand a building's history to somebody who has not decided what she wants with it." },
        { type = "thought_bubble", content = "*When you know what you're opening it for.* She has thought about this for thirty-one years and she has just made it your question." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Turn the tap back on.", config = { destinationType = "specific", locationId = "the_scrub_room", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_del", trait = "relation", op = "add", value = 4, clamp = true },
  { targetType = "player", trait = "house", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_ivo_room_in_town"
name        = "The room in town"
description = "Triggerless rung off hub_ivo_boiler, his relation 30. He has a room he pays for and has not slept in since two thousand and nine. +5 his relation, 30 min."

[[canvases.nodes]]
id   = "base"
name = "Eleven dollars a month"
blocks = [
  { type = "paragraph", content = "There is a room above the garage that he pays eleven dollars a month for and that he has not slept in since two thousand and nine." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask why he keeps it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_ivo" }, content = "Address. You need one." },
    ] },
    { advance_text = "Ask about the valve.", blocks = [
        { type = "paragraph", content = "You point out that the valve holds now and he could sleep eight hours in a bed in a room with a window." },
        { type = "paragraph", content = "He turns the logbook round to face him and writes the pressure in it, which is what he does instead of answering." },
    ] },
    { advance_text = "Wait him out.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_ivo" }, content = "Sixteen years I've listened to this building at night. I'd not sleep in a quiet room." },
    ] },
    { advance_text = "Ask what he'd do with it.", blocks = [
        { type = "paragraph", content = "You ask what he would do if the Marlow went. He does not answer that one at all, and the silence goes on long enough that you understand it was the wrong question and also that it was the right one." },
        { type = "thought_bubble", content = "A cot, a boiler, and eleven dollars a month for an address. That is the whole of what this building pays a man who could shut it down." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Leave it.", config = { destinationType = "specific", locationId = "the_boiler", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_ivo", trait = "relation", op = "add", value = 5, clamp = true },
] } }


[[canvases]]
id          = "rung_june_the_town"
name        = "June, on the town"
description = "Triggerless rung off hub_june_pool, her relation 40. The clearest statement in the game of what Hollis Springs will and will not tolerate, from the only person entitled to make it. +3 her relation, +3 propriety, 35 min."

[[canvases.nodes]]
id   = "base"
name = "What it'll stand"
blocks = [
  { type = "paragraph", content = "You ask her, in the hot end on a Tuesday, how far this town will actually let you go." },
  { type = "cascade", props = { beats = [
    { advance_text = "Let her think.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_june" }, content = "Further than you'd credit, and not as far as you'll want." },
    ] },
    { advance_text = "Ask what the rule is.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_june" }, content = "Nobody minds what happens in here. What they mind is being made to say they know. That's the whole rule and it's been the rule since before the war." },
    ] },
    { advance_text = "Ask about the chapel.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_june" }, content = "Half the chapel's been in this water this month and four of them on that slab. They'll sing on Sunday and be back Tuesday and not one of them thinks they're a hypocrite, because they're not." },
    ] },
    { advance_text = "Ask what would break it.", blocks = [
        { type = "paragraph", content = "She goes quiet, which she does not do." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_june" }, content = "Somebody's daughter. Somebody's husband where the wife has to hear it. Or you putting it on the board in gold where a stranger can read it off the wall." },
        { type = "paragraph", content = "You have it on the board in pencil, under the gold, where you have to be standing at the desk to see it. She knows that. She was telling you that you got it right." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get her a towel.", config = { destinationType = "specific", locationId = "the_pool", time_progression_minutes = 35, effects = [
  { targetType = "npc", npcId = "npc_june", trait = "relation", op = "add", value = 3, clamp = true },
  { targetType = "player", trait = "propriety", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_warren_the_councillor"
name        = "The councillor"
description = "Triggerless rung off hub_warren_desk, his relation 30. The other half of his power: he sits on the committee that could shut the building, and he has been quietly managing it for eleven years. +4 his relation, +3 house, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Eleven years of managing it"
blocks = [
  { type = "paragraph", content = "It comes out at the counter on a Thursday, sideways, while he is counting two dollars out of a leather purse." },
  { type = "cascade", props = { beats = [
    { advance_text = "Let him get to it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "There's a committee. Licensing, public health, the road. It meets four times a year and I write the papers for it." },
    ] },
    { advance_text = "Ask what he writes.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "For eleven years I've written that the Marlow is compliant, well run and of significant local value. Which is true. It also happens to end the discussion before it starts." },
    ] },
    { advance_text = "Ask what would change it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "A named complaint. Or somebody on that committee deciding to be interested. There's one who would like to be, and he lives forty minutes away, and he has never once been in the building." },
    ] },
    { advance_text = "Ask why he's telling you.", blocks = [
        { type = "paragraph", content = "He puts the purse away and squares the two dollars up on the counter with one finger." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_warren" }, content = "Because you should know what you're standing on, Miss Marlow. And because I would rather you heard it from me at a counter than in a letter." },
        { type = "thought_bubble", content = "Eleven years of papers. He was protecting Perrine's building before he ever wanted anything in it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Lock up behind him.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_warren", trait = "relation", op = "add", value = 4, clamp = true },
  { targetType = "player", trait = "house", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_casper_what_he_wants"
name        = "What Casper actually wants"
description = "Triggerless rung off hub_casper_desk, his relation 40. Five months of Fridays, said out loud in a lobby. The reversal, named. +5 his relation, 30 min."

[[canvases.nodes]]
id   = "base"
name = "Friday, late"
blocks = [
  { type = "paragraph", content = "It is twenty to seven and he has not opened the book, and he has been standing at the counter for eleven minutes talking about the road." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask him.", blocks = [
        { type = "paragraph", content = "So you ask what he actually wants, because it is a Friday in a lobby and there is nobody else in the building." },
    ] },
    { advance_text = "Let him try.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_casper" }, content = "I wanted the building. Everybody knows that. My dad told me it'd come to us since I was nine." },
    ] },
    { advance_text = "Wait.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_casper" }, content = "And then it didn't, and I've had five months of coming in here on a Friday to take money off you, and the thing nobody warned me about is that I look forward to it." },
    ] },
    { advance_text = "Don't help him.", blocks = [
        { type = "paragraph", content = "You let that sit in the lobby for a second, under a board with seven lines crossed out and one line in pencil." },
    ] },
    { advance_text = "Let him finish.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_casper" }, content = "I don't want the building. I want to be in it. That's the whole of it and I've made a proper mess of saying it." },
        { type = "thought_bubble", content = "He has come every Friday for five months. Two of those months, he had no legal need to come in person at all." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Tell him it's Friday.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_casper", trait = "relation", op = "add", value = 5, clamp = true },
] } }


[[canvases]]
id          = "rung_nell_season"
name        = "The end of the season"
description = "Triggerless rung off hub_nell_room, her relation 45. The rotating slot's whole point, said between two people who both know the date. Pays into the release's second locked door. +3 her relation, 30 min."

[[canvases.nodes]]
id   = "base"
name = "The date on the card"
blocks = [
  { type = "paragraph", content = "The let runs to the end of the season, which is a date, and both of you know what it is, and neither of you has said it in this room." },
  { type = "cascade", props = { beats = [
    { advance_text = "Say the date.", blocks = [
        { type = "paragraph", content = "So you say it. She is lying on her front with the sheet across the backs of her thighs and she does not move for a second." },
    ] },
    { advance_text = "Let her answer.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_nell" }, content = "I know when it is. I've known since I paid the first thirty-five." },
    ] },
    { advance_text = "Ask what she's doing after.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_nell" }, content = "Somewhere with a coast, probably. That was the plan in March and it's still technically the plan." },
        { type = "paragraph", content = "Technically. She puts a lot of work into that word and then looks at you to see whether it landed." },
    ] },
    { advance_text = "Don't ask her to stay.", blocks = [
        { type = "paragraph", content = "You do not ask her to stay. You are not sure whether that is restraint or cowardice and you have gone round it four times this week without getting an answer." },
    ] },
    { advance_text = "Leave it there.", blocks = [
        { type = "paragraph", content = "She turns over and asks whether the water is up to temperature yet, which is her way of ending a conversation, and you tell her forty-four and dead steady." },
        { type = "thought_bubble", content = "Everybody who takes that room has left somewhere. Nobody who takes it has ever stayed." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go and open up.", config = { destinationType = "specific", locationId = "the_lodgers_room", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_nell", trait = "relation", op = "add", value = 3, clamp = true },
] } }

