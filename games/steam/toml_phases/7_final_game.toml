        { type = "paragraph", content = "It comes back clean. It has come back clean every year since eighteen ninety-one because eleven thousand years underground is a very effective filter." },
        { type = "paragraph", content = "The certificate goes in the frame beside the occupancy grade, which is the only frame in the building." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Pin it up.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 120, effects = [
  { targetType = "player", trait = "money", op = "add", value = -85, clamp = false },
  { targetType = "player", trait = "propriety", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_changing_lockers_repair"
name        = "Re-hang the lockers"
description = "Triggerless rung, MONEY 140. Nineteen of the forty lockers do not shut, which is a small thing that everybody in the building touches twice a day. -140 money (clamp FALSE), +6 house, 180 min."

[[canvases.nodes]]
id   = "base"
name = "Nineteen of forty"
blocks = [
  { type = "paragraph", content = "There are forty lockers. Nineteen of them do not shut properly and four have no door at all, and every single person who comes in here touches one twice." },
  { type = "cascade", props = { beats = [
    { advance_text = "Get the timber.", blocks = [
        { type = "paragraph", content = "A hundred and forty for hinges, timber, and brass numbers to match the ones from nineteen twenty-six, which the merchant can still get because a works in the next county still makes them." },
    ] },
    { advance_text = "Do it over two closures.", blocks = [
        { type = "paragraph", content = "Two Wednesdays, closed both afternoons. Ivo does the hanging, you do the numbers, Del supervises from a bench with her arms folded and is right about everything." },
    ] },
    { advance_text = "Open on Thursday.", blocks = [
        { type = "paragraph", content = "Forty lockers that shut. It is the least interesting thing you have spent money on and three separate people mention it in the first week." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Sweep the sawdust out.", config = { destinationType = "specific", locationId = "the_changing_room", time_progression_minutes = 180, effects = [
  { targetType = "player", trait = "money", op = "add", value = -140, clamp = false },
  { targetType = "player", trait = "house", op = "add", value = 6, clamp = true },
] } }


[[canvases]]
id          = "rung_desk_advert"
name        = "Advertise"
description = "Triggerless rung, MONEY 60. Six lines in the county paper, which Perrine never once bought. -60 money (clamp FALSE), 60 min."

[[canvases.nodes]]
id   = "base"
name = "Six lines"
blocks = [
  { type = "paragraph", content = "Sixty dollars buys six lines in the county paper for four weeks. Perrine never bought one in thirty-one years, on the grounds that everybody already knew." },
  { type = "cascade", props = { beats = [
    { advance_text = "Write it.", blocks = [
        { type = "paragraph", content = "THE MARLOW BATHS, HOLLIS SPRINGS. NATURAL HOT SPRING SINCE 1891. BATHS, STEAM, SCRUB. OPEN EIGHT TILL SIX." },
        { type = "paragraph", content = "You read it back and take out the exclamation mark you did not put in, and then you put the Tuesday women's hours on the end because they are the thing that actually brings people." },
    ] },
    { advance_text = "Run it.", blocks = [
        { type = "paragraph", content = "Four weeks. It brings eleven people, two of whom come back, one of whom drives ninety minutes and does not want a bath." },
        { type = "thought_bubble", content = "Everybody already knew. That was true when the trade was forty people and it is the reason the trade is forty people." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Post the copy.", config = { destinationType = "specific", locationId = "the_front_desk", time_progression_minutes = 60, effects = [
  { targetType = "player", trait = "money", op = "add", value = -60, clamp = false },
] } }


[[canvases]]
id          = "rung_pool_sunday"
name        = "Sunday"
description = "Triggerless rung off the women's-hours hub. Ungated. The one day the chapel takes the town and the building has four people in it. +3 energy, 60 min."

[[canvases.nodes]]
id   = "base"
name = "Chapel morning"
blocks = [
  { type = "paragraph", content = "Sunday morning the chapel takes most of the street until half twelve. There are four people in the water and three of them are asleep." },
  { type = "cascade", props = { beats = [
    { advance_text = "Do the slow jobs.", blocks = [
        { type = "paragraph", content = "Sunday is for the jobs that need quiet. The grout behind the steps. The lamp glass. The skimmer basket that has needed replacing since June." },
    ] },
    { advance_text = "Get in for an hour.", blocks = [
        { type = "paragraph", content = "Then you get in with the four of them and nobody says anything for the best part of an hour, and one of them snores, and June is not in on a Sunday because June is in the choir." },
    ] },
    { advance_text = "Half twelve.", blocks = [
        { type = "paragraph", content = "At half twelve it goes from four to eighteen in about six minutes, all of them in their good clothes, and the changing room sounds like a school." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get the towels out.", config = { destinationType = "specific", locationId = "the_pool", time_progression_minutes = 60, effects = [
  { targetType = "player", trait = "energy", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_pool_teach_del_way"
name        = "Do the round Del's way"
description = "Triggerless rung off the evening hub, Del's relation 20. Thirty-one years of route, learned by walking it. +2 service, +2 her relation, -3 energy, 40 min."

[[canvases.nodes]]
id   = "base"
name = "The route"
blocks = [
  { type = "paragraph", content = "There is a route round this room and Del has walked it since nineteen eighty-nine. It is not the shortest. It is the one where you never carry an empty tray." },
  { type = "cascade", props = { beats = [
    { advance_text = "Learn it.", blocks = [
        { type = "paragraph", content = "Towels out on the way down the long side. Empties back up the short. Skimmer parked at the hot end so you pick it up when you are already there and not before." },
    ] },
    { advance_text = "Walk it properly.", blocks = [
        { type = "paragraph", content = "Done right it saves about forty minutes a day. Done wrong you do sixteen thousand extra steps and blame your feet on the trade." },
    ] },
    { advance_text = "Get it right.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "There. That's it. That's the whole of it, and it took your aunt four years." },
        { type = "thought_bubble", content = "Four years. She has never once said how long it took you." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Finish the round.", config = { destinationType = "specific", locationId = "the_pool", time_progression_minutes = 40, effects = [
  { targetType = "player", trait = "service", op = "add", value = 2, clamp = true },
  { targetType = "npc", npcId = "npc_del", trait = "relation", op = "add", value = 2, clamp = true },
  { targetType = "player", trait = "energy", op = "add", value = -3, clamp = true },
] } }


# ── Filling to budget: the let room, the flat, the street. ──────────────────

[[canvases]]
id          = "rung_let_interview"
name        = "Show the room"
description = "Triggerless rung off hub_lodgers_room. Ungated. Room-scoped: the nine days in autumn when the card is in the window and strangers come to look at a room in your building. This is where the NEXT tenant arrives from. 40 min."

[[canvases.nodes]]
id   = "base"
name = "Nine days in autumn"
blocks = [
  { type = "paragraph", content = "The card goes up in the first week of autumn and the room is gone inside nine days. In between, people come and look at it." },
  { type = "cascade", props = { beats = [
    { advance_text = "Show the first one.", blocks = [
        { type = "paragraph", content = "A man in his fifties working the road contract. He asks about the noise, the heat, and whether the door to the street opens. It does not. He takes the card number and does not ring." },
    ] },
    { advance_text = "Show the second.", blocks = [
        { type = "paragraph", content = "A woman with a van who wants it for two months and is straightforward about why, which is that she has left somewhere and does not want to say where." },
        { type = "paragraph", content = "Everybody who takes this room has left somewhere. That is not a coincidence, it is what a cheap warm room in a dead-end valley is for." },
    ] },
    { advance_text = "Say the terms.", blocks = [
        { type = "paragraph", content = "Thirty-five a month, first of the month, use of the baths. You say the last part and watch what their face does with it, every time, because it is the part that decides who takes this room." },
    ] },
    { advance_text = "Let them think about it.", blocks = [
        { type = "thought_bubble", content = "Perrine let it thirty-one times. She wrote the names in a book and the book does not say one word about any of them." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Take them back through.", config = { destinationType = "specific", locationId = "the_lodgers_room", time_progression_minutes = 40 } }


[[canvases]]
id          = "rung_let_window"
name        = "The painted-shut door"
description = "Triggerless rung off hub_lodgers_room. Ungated. Room-scoped. A door to the street that has not opened in forty years, and what it means that the only way out of this room is through the lobby. 20 min."

[[canvases.nodes]]
id   = "base"
name = "Painted shut"
blocks = [
  { type = "paragraph", content = "The let room has its own door onto Spring Street. It has been painted shut since about nineteen eighty and there are four coats of green over the hinges." },
  { type = "cascade", props = { beats = [
    { advance_text = "Try it.", blocks = [
        { type = "paragraph", content = "It does not move. It would take a chisel, a morning, and a new lock, and it has been on the list since your grandmother's day." },
    ] },
    { advance_text = "Work out what it means.", blocks = [
        { type = "paragraph", content = "It means everybody who lives in this room comes and goes through your lobby. Past the desk, past the board, past you." },
        { type = "paragraph", content = "At four in the morning, in a towel, past the door of a woman who is usually awake." },
    ] },
    { advance_text = "Leave it painted.", blocks = [
        { type = "paragraph", content = "You could open it for about eighty dollars and half a day of Ivo's time." },
        { type = "thought_bubble", content = "It has been on the list since your grandmother's day. Three women have now left it painted shut." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Back to the lobby.", config = { destinationType = "specific", locationId = "the_lodgers_room", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_attic_accounts"
name        = "Do the month"
description = "Triggerless rung off hub_attic_night. Ungated. The whole business on one page at one in the morning, banded on HOUSE. This is the game telling the player, in plain numbers, whether any of it is working. 45 min."

[[canvases.nodes]]
id   = "base"
name = "One page"
blocks = [
  { type = "paragraph", content = "Once a month you put the ledger, the note, the electric and the merchant's account on the table upstairs and do the whole thing on one page." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "house", operator = "lt", value = 15 },
  ] } }, blocks = [
    { type = "paragraph", content = "In: about eleven hundred. Out: five hundred and forty on the note, ninety electric, a hundred on stock, forty on parts, and Del owed since March." },
    { type = "paragraph", content = "It does not close. It has not closed once since you inherited it and it did not close for Perrine either, which is what the second ledger was for." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "house", operator = "gte", value = 15 },
    { type = "trait", subject = "player", trait_key = "house", operator = "lt",  value = 40 },
  ] } }, blocks = [
    { type = "paragraph", content = "In: about eighteen hundred, and four hundred of that is the second column." },
    { type = "paragraph", content = "It closes. Not by much. It closes, and there is enough left at the end of it to buy one thing that the building needs, which is the first time that has been true." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "house", operator = "gte", value = 40 },
  ] } }, blocks = [
    { type = "paragraph", content = "In: two thousand six hundred, and eleven hundred of it is the second column, which is now the larger half." },
    { type = "paragraph", content = "The note is being overpaid. Del is on a wage. Ivo is on sixty. The building has a certificate for sixty bodies and a skylight you can see through." },
    { type = "thought_bubble", content = "Two thousand six hundred a month, and the part that pays for all of it is the part her aunt put a black line under." },
  ] },
]
exit_block = { type = "location", text = "Put the pen down.", config = { destinationType = "specific", locationId = "the_attic_flat", time_progression_minutes = 45 } }


[[canvases]]
id          = "rung_attic_call"
name        = "Ring somebody"
description = "Triggerless rung off hub_attic_night. Ungated. The city, on a phone, at eleven at night — the life she left, checked on and then not rung again. 25 min."

[[canvases.nodes]]
id   = "base"
name = "The city"
blocks = [
  { type = "paragraph", content = "There is one telephone in the building and it is behind the desk, so ringing anybody at eleven at night means going down two flights in the dark and standing in a cold lobby." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ring her anyway.", blocks = [
        { type = "paragraph", content = "Your friend from the old job. She is pleased. She asks how the sale is going, because she has assumed since March that you are selling." },
    ] },
    { advance_text = "Explain it.", blocks = [
        { type = "paragraph", content = "You start explaining and get about two sentences in — the spring, the trade, the grade, Del — before you can hear that it is not landing." },
        { type = "paragraph", content = "She says it sounds like a lot. She says it in the voice people use for somebody's ex." },
    ] },
    { advance_text = "Let it go.", blocks = [
        { type = "paragraph", content = "You talk about her instead for twenty minutes, which is easier, and say you will ring in a fortnight." },
        { type = "paragraph", content = "You do not ring in a fortnight. Neither does she." },
        { type = "thought_bubble", content = "Nothing about that is anybody's fault. There is just no version of this that goes down a telephone." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go back up.", config = { destinationType = "specific", locationId = "the_attic_flat", time_progression_minutes = 25 } }


[[canvases]]
id          = "rung_street_winter"
name        = "The road in winter"
description = "Triggerless rung off hub_spring_street. Ungated. What a dead-end valley is like when the weather comes in, and why a building full of hot water is the only thing on the street that still works. +2 energy, 35 min."

[[canvases.nodes]]
id   = "base"
name = "When it comes in"
blocks = [
  { type = "paragraph", content = "When the weather comes in off the top the road to the county town shuts, sometimes for a day, twice a year for three." },
  { type = "cascade", props = { beats = [
    { advance_text = "Watch it come.", blocks = [
        { type = "paragraph", content = "The garage does the gritting and the garage cannot grit the top section, so the town simply stops, and everybody knows it is coming about four hours before it does." },
    ] },
    { advance_text = "Open anyway.", blocks = [
        { type = "paragraph", content = "You open. You always open. The spring does not care about the road and the building is thirty degrees whatever the sky is doing." },
    ] },
    { advance_text = "Watch them come in.", blocks = [
        { type = "paragraph", content = "It is the busiest the Marlow ever gets. Nobody can go anywhere, everything else is shut, and there is one building on Spring Street with hot water in it." },
        { type = "paragraph", content = "Fifty-one people through the door on the worst day last winter, according to a note in Perrine's ledger in February." },
        { type = "thought_bubble", content = "Fifty-one, on a grade of twenty-eight. She never once mentioned that to Warren either." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get the door.", config = { destinationType = "specific", locationId = "spring_street", time_progression_minutes = 35, effects = [
  { targetType = "player", trait = "energy", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_street_shut_hotels"
name        = "The three shut hotels"
description = "Triggerless rung off hub_spring_street. Ungated. Three empty buildings on one street, and the exact reason the Marlow is worth having a note on. 30 min."

[[canvases.nodes]]
id   = "base"
name = "Three of four"
blocks = [
  { type = "paragraph", content = "The Vale shut in ninety-eight. The Spa Hotel in two thousand and four. The big one at the top, which had ninety rooms and a ballroom, in two thousand and eleven." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look in the windows.", blocks = [
        { type = "paragraph", content = "The Spa still has tables in the dining room with cloths on them. Somebody put the chairs up on the day it shut and nobody has been in since." },
    ] },
    { advance_text = "Work out why.", blocks = [
        { type = "paragraph", content = "None of them had the spring. They all had baths plumbed off the town main and a boiler, which is a hotel with a bathroom, which anywhere can be." },
        { type = "paragraph", content = "The Marlow is the only building on this street with the water actually coming through it." },
    ] },
    { advance_text = "Go back down.", blocks = [
        { type = "thought_bubble", content = "That is what Casper's father lent sixty-one thousand dollars against. Not the trade. The hole in the ground." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Down to the door.", config = { destinationType = "specific", locationId = "spring_street", time_progression_minutes = 30 } }


# ── Scrub room, changing room, boiler: the last of the budget. ─────────────

[[canvases]]
id          = "rung_scrub_close"
name        = "Close the slab down"
description = "Triggerless rung off hub_scrub_room. Ungated. The end of a day spent with your hands on people. +1 service, -3 energy, 30 min."

[[canvases.nodes]]
id   = "base"
name = "Six o'clock"
blocks = [
  { type = "paragraph", content = "Hose the slab, scrub the dish out with the stiff brush, empty the grit bucket, hang the mitts over the pipe so they are dry by eight." },
  { type = "cascade", props = { beats = [
    { advance_text = "Do the slab.", blocks = [
        { type = "paragraph", content = "The marble goes from grey to white when it is wet and back to grey as it dries, over about twenty minutes, in a room with nobody in it." },
    ] },
    { advance_text = "Look at your hands.", blocks = [
        { type = "paragraph", content = "There is a callus across both palms and the skin at the base of your thumbs has gone hard. Del's hands look like a bricklayer's and she is fifty-six and they do not hurt her." },
    ] },
    { advance_text = "Hang the mitts.", blocks = [
        { type = "paragraph", content = "Eleven people on the slab today. You can remember all eleven backs and none of the faces, which Del says is normal and which she says happens for the rest of your life." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Turn the light off.", config = { destinationType = "specific", locationId = "the_scrub_room", time_progression_minutes = 30, effects = [
  { targetType = "player", trait = "service", op = "add", value = 1, clamp = true },
  { targetType = "player", trait = "energy", op = "add", value = -3, clamp = true },
] } }


[[canvases]]
id          = "rung_scrub_hurt"
name        = "Somebody who is hurt"
description = "Triggerless rung off hub_scrub_room, SERVICE 15. The half of this trade that is not erotic at all and is the reason the building has lasted a hundred years. +2 service, +2 propriety, 45 min."

[[canvases.nodes]]
id   = "base"
name = "The yard"
blocks = [
  { type = "paragraph", content = "A man off the yard with a shoulder he cannot lift past his ear and a doctor's appointment in eleven days." },
  { type = "cascade", props = { beats = [
    { advance_text = "Get him on the slab.", blocks = [
        { type = "paragraph", content = "Heat first, twenty minutes in the hot end, because nothing works on a cold shoulder. Then the slab, face down, and you go in slowly and find where it actually is rather than where he says it is." },
    ] },
    { advance_text = "Work it.", blocks = [
        { type = "paragraph", content = "It is not the shoulder. It is a knot the size of a walnut under the shoulder blade, and getting it to let go takes fifteen minutes and hurts him considerably." },
    ] },
    { advance_text = "Finish.", blocks = [
        { type = "paragraph", content = "He gets off the slab and lifts his arm over his head, twice, and then does not say anything for a moment." },
        { type = "paragraph", content = "He gives you four dollars for a two-dollar scrub and comes back every Thursday for a month." },
        { type = "thought_bubble", content = "That is what Del meant. They come in for the water and back for the hands, and it has nothing to do with anything under the black line." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Next one.", config = { destinationType = "specific", locationId = "the_scrub_room", time_progression_minutes = 45, effects = [
  { targetType = "player", trait = "service", op = "add", value = 2, clamp = true },
  { targetType = "player", trait = "propriety", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_changing_men_side"
name        = "The men's side, empty"
description = "Triggerless rung off hub_changing_room. Ungated. Same room, different half, and the fact that the Marlow has never actually had two changing rooms is a hundred-year-old fudge everybody has agreed not to look at. 20 min."

[[canvases.nodes]]
id   = "base"
name = "One room, two ends"
blocks = [
  { type = "paragraph", content = "There is no men's changing room. There is one room with a bench down the middle and a hundred years of everybody agreeing which end is which." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look at the fudge.", blocks = [
        { type = "paragraph", content = "Lockers one to twenty on the left, twenty-one to forty on the right, and no door, no screen, and no rule written anywhere." },
    ] },
    { advance_text = "Think about the hours.", blocks = [
        { type = "paragraph", content = "It works because the hours do the separating. Women until one, mixed after. In a hundred years nobody has ever had to enforce it, which is either remarkable or says something about how small this valley is." },
    ] },
    { advance_text = "Sweep it out.", blocks = [
        { type = "paragraph", content = "You sweep both ends of a room that is officially two rooms and has never been." },
        { type = "thought_bubble", content = "Warren's file has it down as two changing facilities. He wrote that himself in nineteen eighty-six and has never asked to see them." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Put the broom back.", config = { destinationType = "specific", locationId = "the_changing_room", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_changing_saturday"
name        = "Saturday in the changing room"
description = "Triggerless rung off hub_changing_room, STEAM 15. Forty-one people through one room in two hours. Explicit, cycling pool, t4. +1 steam, +5 arousal, -4 energy, 45 min."

[[canvases.nodes]]
id   = "base"
name = "The crush"
blocks = [
  { type = "video", props = { pool_dir = "sex/changing_saturday_crush_t4", pool = 4, description = "A crowded old changing room with people undressing between wooden lockers.", search_queries = ["crowded bath house changing room people undressing", "busy locker room bench towels steam"] } },
