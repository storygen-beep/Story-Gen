# =============================================================================
# Steam — 0_systems_spec
# Built with author-game-v2. Want + board: games/steam/v2_state.json
#
# METERS, THREE LAYERS (references/the-board.md §3):
#   1  RATCHETING TIERS  steam · service · house   — rungs at 15/35/55
#   2  VOLATILE STATE    arousal · energy · money
#   3  PER-CHARACTER     relation · lust           — on each [[npcs]] block
#   +  COUNTERWEIGHT     propriety — starts at 70, buys nothing, is what she spends
#
# ⚠️ THE TOP BAND IS UNBOUNDED AT v0.1 (min = 55, no max). Gate 8 judges the top
#    band's MIN (gates.py:612), so v0.1 owes an authored gate at 55 on each tier
#    and promises nothing above it. Each release adds a band and the content
#    behind it — the honest-wall rule, references/the-release.md.
# =============================================================================

schema_version = "1.0"

[project]
id              = "steam"
title           = "Steam"
description     = "Her aunt left her the Marlow Baths and the note on it. She has eleven months, one attendant who has not been paid since March, and a building where the whole town arrives with its clothes off."
starting_canvas = "canvas_opening"
quests_engine   = "v2"
version         = "0.1"

[time]
starting_hour = 7          # she opens the doors for the first time
starting_day  = "Monday"   # four days before the first Friday draw
starting_week = 1

[settings]
narration_person  = "second"        # IMMUTABLE once v0.1 ships
clothing_enabled  = true
wardrobe_location = "the_changing_room"   # Perrine's locker is here, not upstairs

# ─── The note — the ENGINE under everything ──────────────────────────────────
# Perrine borrowed from Casper's father, so the obligation has a FACE and the
# face is a cast member with a grievance (the-economy.md R3).
#
# ⚠️ WEEKLY, NOT MONTHLY. `rent_due_day` is validated against weekday names only
#    (template_import.py:4786, VALID_DAYS) — there is no monthly period in the
#    engine. So the note is drawn weekly: 135 on Fridays against a door take of
#    roughly 40 a day. Four good days covers it; a bad week does not.
#
# ⚠️ eviction_mode = "flag_set", NOT the default "game_end". The product never
#    ends, so missing the draw sets `note_called` and the terms change — Casper
#    stops taking money and starts pricing the building.
[settings.rent]
enabled          = true
amount           = 135
due_day          = "Friday"
collector_npc    = "npc_casper"
grace_periods    = 1
start_after_flag = "doors_open"
eviction_mode    = "flag_set"
eviction_flag    = "note_called"

[settings.rent.text]
title            = "Friday"
scene            = "He comes in at six with his coat still on, like a man who does not plan to be here long enough to take it off. His father's book is under his arm. He puts it on the desk and opens it to the page with your aunt's name at the top."
greeting         = "Right. Friday."
paid_scene       = "You count it onto the desk. He counts it again in front of you, slowly, wetting his thumb on each note, and then writes the figure into his father's book in handwriting that is trying to be his father's handwriting."
paid_response    = "That's the week, then. Friday."
paid_closing     = "On his way out he looks up the stairs — the ones going to the floor Perrine kept shut — and then the door does the thing it does, and you are alone in your own lobby again."
cant_pay         = "You haven't got it."
warning_scene    = "You tell him you are short. He does not get angry. He puts the pen down and looks around the lobby instead, at the tilework and the desk and the water stain on the ceiling, and you can hear him pricing all of it."
warning_response = "One week. I'm family, Iris. I'm also the note."
warning_closing  = "He leaves the book open on the desk when he goes, turned round to face you, so you can read what your aunt owed his father going back nine years."
eviction_scene_soft    = "The second Friday he does not open the book at all. He takes his coat off, finally, and hangs it on the hook by the door like a man who lives here, and sits down on the bench where the bathers sit to dry off."
eviction_response_soft = "We're past the money. Let's talk about what this place is worth to you."
eviction_closing_soft  = "He does not say what he means and he does not have to. He stays until you turn the lights off, and on his way out he tells you which room he would have fixed first."

[theme]
mode = "dark"


# ─── The ascent tiers ────────────────────────────────────────────────────────
# Three kinds of going-further, so a player who does not want one can still
# climb another. Rungs at 15/35/55, the ladder measured off the reference game.
# Band text is UI VOICE (references/the-voice.md): it names a state plainly and
# never performs — the register lives in the paragraph after the click.

[[sidebar_items]]
type  = "trait_status_text"
trait = "steam"
bands = [
  { min = 0,  max = 14, text = "Robed at all times" },
  { min = 15, max = 34, text = "Working in the house shift" },
  { min = 35, max = 54, text = "Down to the wrap" },
  { min = 55, text = "On the tiles with nothing on" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "service"
bands = [
  { min = 0,  max = 14, text = "Towels and tea" },
  { min = 15, max = 34, text = "Scrubbing backs" },
  { min = 35, max = 54, text = "Oil, on request" },
  { min = 55, text = "Taking private bookings" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "house"
bands = [
  { min = 0,  max = 14, text = "Three rooms open" },
  { min = 15, max = 34, text = "The plunge running again" },
  { min = 35, max = 54, text = "The boiler floor sound" },
  { min = 55, text = "Everything downstairs, and the stairs still shut" },
]

# The counterweight. Falls as she climbs. Buys nothing by design — it is the
# price, not a currency, so it has no gates and owes no content.
[[sidebar_items]]
type  = "trait_status_text"
trait = "propriety"
bands = [
  { min = 0,  max = 24, text = "The town knows what the Marlow is now" },
  { min = 25, max = 49, text = "People have stopped bringing the kids" },
  { min = 50, max = 74, text = "Perrine's niece, running Perrine's house" },
  { min = 75, max = 100, text = "Above talk" },
]


# ─── Trait labels ────────────────────────────────────────────────────────────
[[traits.labels]]
key   = "energy"
label = "Rested"

[[traits.labels]]
key   = "money"
label = "Cash"

# Internals — never surfaced to the player.
[[traits.labels]]
key    = "arousal"
hidden = true

[[traits.labels]]
key    = "takings_today"
hidden = true

[[traits.labels]]
key    = "tenant_slot"
hidden = true


# =============================================================================
# GUIDANCE — [[quest_cards]] (engine.md §23; the-voice.md R2/R3/R5)
#
# ⚠️ NO `version = "1.0"` ON A QUEST CARD. Quest conditions use a separate
#    evaluator with no fail-open (checkQuestsCondition, v2.py:14878).
#
# Tier 1 = the ascent ladders (no npc_id). A v2 game has no mission, so the top
# of the page IS the tiers. Stepped bands, gte + lt, exactly one live at a time.
# Every goal label names a PLACE and a VERB — the number is already in the
# sidebar; what the player cannot see is which click moves it (R3).
#
# The >=55 card on each tier is the HONEST WALL: no goal bullet, reads forward.
# Never dangle an objective this build cannot flip.
# =============================================================================

# ── STEAM ────────────────────────────────────────────────────────────────────
