        { type = "paragraph", content = "You take forty out of the week's take and write the order on the back of the same packet, and Ivo says thank you in the flat way of a man who has been asking for it since before you owned the building." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Back up.", config = { destinationType = "specific", locationId = "the_boiler", time_progression_minutes = 20, effects = [
  { targetType = "player", trait = "money", op = "add", value = -40, clamp = false },
  { targetType = "player", trait = "house", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_boiler_pump"
name        = "Buy the pump"
description = "Triggerless rung, MONEY 120 + HOUSE < 15. The first real HOUSE purchase: the cold plunge comes back, which opens the jet rung at the pool. A milestone that opens standing content (gate 7) by moving a TRAIT rather than setting a flag. -120 money (clamp FALSE), +15 house, 60 min."

[[canvases.nodes]]
id   = "base"
name = "The pump"
blocks = [
  { type = "paragraph", content = "A hundred and twenty dollars, reconditioned, from a man in the next valley who takes them out of dairies. Ivo has been talking about this pump since March in the way other men talk about a horse." },
  { type = "cascade", props = { beats = [
    { advance_text = "Pay for it.", blocks = [
        { type = "paragraph", content = "You count it out on the bench beside the cot. It is four private scrubs, or fifteen door-days, or most of a Friday draw, and you have thought about it for eleven days." },
    ] },
    { advance_text = "Watch him fit it.", blocks = [
        { type = "paragraph", content = "It takes him five hours and two of them are spent on one union that has not been turned since the sixties. You hold the lamp. He does not talk while he works, which you have come to understand is not the same as not wanting you there." },
    ] },
    { advance_text = "Open the line.", blocks = [
        { type = "paragraph", content = "The plunge fills at eleven degrees straight off the mountain and the cold room has water in it for the first time since February. He puts his hand in it up to the wrist and leaves it there, and then takes it out and looks at you, and that is Ivo delighted." },
        { type = "thought_bubble", content = "The return line to the pool is on the same pump. He mentioned that twice. He mentioned it twice." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go up and look at it.", config = { destinationType = "specific", locationId = "the_boiler", time_progression_minutes = 60, effects = [
  { targetType = "player", trait = "money", op = "add", value = -120, clamp = false },
  { targetType = "player", trait = "house", op = "add", value = 15, clamp = true },
] } }


[[canvases]]
id          = "rung_boiler_valve"
name        = "Pay for the feed valve"
description = "Triggerless rung, MONEY 200 + HOUSE 15-34. The second HOUSE purchase and the one that changes a person's life rather than a room's: the valve holds, so Ivo is off the two-hourly. -200 money (clamp FALSE), +20 house, +6 his relation, 90 min."

[[canvases.nodes]]
id   = "base"
name = "The valve"
blocks = [
  { type = "paragraph", content = "Two hundred dollars for a cast bronze feed valve with a seat that has not been ground by four generations of men with the wrong tool. It is the single most boring object you have ever paid for." },
  { type = "cascade", props = { beats = [
    { advance_text = "Order it.", blocks = [
        { type = "paragraph", content = "It comes on a Wednesday in a wooden crate with straw in it, which is how you learn that the foundry has been making them since eighteen ninety and sees no reason to change the packaging." },
    ] },
    { advance_text = "Let him fit it.", blocks = [
        { type = "paragraph", content = "He drains the line and works from ten at night until four in the morning with the whole building cold, because that is the only window where the Marlow can be off, and you sit on the steps with a flask and hand him things." },
    ] },
    { advance_text = "Bring it back up.", blocks = [
        { type = "paragraph", content = "The line comes back at half four and holds at pressure for eleven hours without a hand on it. It has not done that since the war." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_ivo" }, content = "So now I sleep." },
        { type = "paragraph", content = "He says it looking at the gauge, not at you, and neither of you points out that he has a room in town he has not slept in since two thousand and nine." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go up as it gets light.", config = { destinationType = "specific", locationId = "the_boiler", time_progression_minutes = 90, effects = [
  { targetType = "player", trait = "money", op = "add", value = -200, clamp = false },
  { targetType = "player", trait = "house", op = "add", value = 20, clamp = true },
  { targetType = "npc", npcId = "npc_ivo", trait = "relation", op = "add", value = 6, clamp = true },
] } }


