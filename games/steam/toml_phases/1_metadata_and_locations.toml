# ── the man whose job is respectability ──────────────────────────────────────
[[npcs]]
id          = "npc_warren"
name        = "Warren"
description = "Town clerk. He assesses the occupancy grade that decides how many bodies you are allowed in the water, and he has held the Marlow's file since Perrine's day. He comes on Thursday evenings when the pool is empty, and in daylight he calls you Miss Marlow."
portrait    = "warren.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["The clerk", "A regular", "Asking", "Compromised"]

[[npcs.schedules]]
location   = "the_pool"
weekdays   = [3]
start_time = "18:00"
end_time   = "20:00"
activity   = "in the far corner of the pool with his back to the door"

[[npcs.schedules]]
location   = "the_front_desk"
weekdays   = [3]
start_time = "20:00"
end_time   = "20:45"
activity   = "settling up at the desk and taking his time over it"


# ── the town's permission ────────────────────────────────────────────────────
[[npcs]]
id          = "npc_june"
name        = "June"
description = "Sixty-eight, and she has been in this water every Tuesday since she was twenty-eight. What June says in the pool on a Tuesday is what Hollis Springs believes by Thursday. She is entirely frank about bodies, hers included, and she has not decided about you yet."
portrait    = "june.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["Tuesday regular", "Frank with her", "Sponsor", "Accomplice"]

[[npcs.schedules]]
location   = "the_pool"
weekdays   = [1]
start_time = "10:00"
end_time   = "13:00"
activity   = "in the hot end, where she has sat every Tuesday for forty years"

[[npcs.schedules]]
location   = "the_changing_room"
weekdays   = [1]
start_time = "13:00"
end_time   = "13:45"
activity   = "getting dressed slowly and talking the whole time"


# ── the note, with a face ────────────────────────────────────────────────────
[[npcs]]
id          = "npc_casper"
name        = "Casper"
description = "Your cousin, thirty-eight, four streets over. His father lent Perrine the money and the paper came to him, so the building went to you and the note on it went to him. He watched you learn to swim in this pool. On Fridays he reads out what you owe."
portrait    = "casper.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["The cousin", "Leaning", "Trading", "In"]

[[npcs.schedules]]
location   = "the_front_desk"
weekdays   = [4]
start_time = "17:00"
end_time   = "19:00"
activity   = "at the desk with his father's book, waiting for the week's take"

[[npcs.schedules]]
location   = "the_pool"
weekdays   = [5]
start_time = "11:00"
end_time   = "13:00"
activity   = "using the place on a Saturday like a man with a stake in it"


# ── THE ROTATING SLOT'S CURRENT TENANT ───────────────────────────────────────
# Tenant-scoped content dies with her, by design: her ladder, her register, her
# props all live in 5_scenes.toml. The ROOM — the mattress, the fan, the terms —
# is room-scoped in 3_activities.toml and survives the rotation.
[[npcs]]
id          = "npc_nell"
name        = "Nell"
description = "Twenty-three, took the let room for the season, pays on the first without being asked, and does not appear to have a job. She sleeps through the afternoon with the fan on and swims lengths at two in the morning. She never met Perrine, which makes her the only person in Hollis Springs with no opinion about who you are supposed to be."
portrait    = "nell.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["The lodger", "Company", "Close", "Yours"]

[[npcs.schedules]]
location   = "the_lodgers_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "11:00"
end_time   = "17:00"
activity   = "asleep with the fan on and the door not quite shut"

# ✅ Wraps midnight in ONE row. The after-close hours are hers.
[[npcs.schedules]]
