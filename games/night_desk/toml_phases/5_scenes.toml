# =============================================================================
# Night Desk — 5_scenes · THE TWO LADDERS
#
# Four portrait hubs, one per person per location where that person is reachable.
# ONE CANVAS PER NPC PER LOCATION (renderNpcPortraits, v2.py:5114 / :4919) — the
# highest-priority one wins and the rest are invisible, so the rungs are NODES
# INSIDE the hub, not canvases of their own. There is no targetType = "canvas"
# in any shipped game and there is none here.
#
#   hub_del_desk        the_desk        rung 2 · rung 30
#   hub_del_office      the_office      rung 6 · rung 12 · rung 20 · refusal r25
#   hub_marek_corridor  the_corridor    rung 2 · rung 6 · rung 12 · refusal r15
#   hub_marek_bathroom  the_bathroom    rung 20
#
# ⚠️ TWO GATES ON EVERY RUNG: her corruption AND his relation. She has to be
#    willing and he has to be willing to want it. The relation column is the whole
#    difference between the two men — Del needs 85 at the top rung, Marek 50.
#    Same nine corruption rungs, half the trust.
#
# ⚠️ THE CORRUPTION BANDS ARE EXCLUSIVE — gte X and lt Y — so exactly one rung is
#    live at a time, which is what the person sheets mean by "showing 1 at a
#    time". Each hub then carries ONE visible locked door with a reason on it.
#
# ⚠️ SHE SPEAKS THREE WAYS and in 0.0.1 that is a block_pool, i.e. ROTATION, not
#    identity. The sheets specify a meek/bratty/neutral personality check — the
#    reference game's own mandatory rule — and this game has no personality axis
#    to hang it on. The three lines are written and they cycle. Logged in
#    BUILD_VS_SHEET.md as the largest single sheet-to-build divergence.
#
# ⚠️ THE SIX EXPLICIT BEATS ARE COPIED VERBATIM from the scene sheets. Each was
#    verified against gates.py:286 — three counted words apiece — and re-writing
#    them here would throw that verification away. `hard` and `wet` are NOT on
#    that list; three beats that leaned on them scored 0, 0 and 1 and were
#    rewritten on the sheets before this file was written.
# =============================================================================

