# =============================================================================
# Night Desk — 3_activities · SOLO SURFACES
#
# Twenty repeatable, manual canvases with no npcId — renderSoloActivities
# (v2.py:5242). Counts per room, against a field median of 3:
#
#   the_desk       5    ANCHOR, above the median on purpose
#   the_corridor   4
#   the_lot        3
#   the_kitchen    3
#   the_bathroom   3
#   the_office     2    below the median on purpose — this room is Del
#   room_6         0    locked all release; the door is the content
#
# ⚠️ DAY CAPS ARE A FLAG ON THE CHOICE, NOT A PROPERTY OF THE CANVAS. The pattern
#    is `<x>_today is_false` in conditions + flagEffects setting it + the
#    [engine.daily_tick] in phase 0 clearing it. Without the tick a capped choice
#    is once per SAVE. Capped here: the monitor, the audit, listening at a door,
#    smoking, washing.
#
# ⚠️ `Watch the monitor` HAD TO BE CAPPED. It is free, safe, needs nothing and is
#    the corruption on-ramp — exactly what a player clicks twenty times. Grinding
#    is the genre's second-largest complaint after lostness.
#
# ⚠️ money AND rooms_full CARRY clamp = false EVERY TIME THEY ARE WRITTEN.
# =============================================================================

