# =============================================================================
# Night Desk — 3_activities · SOLO SURFACES
#
# Twenty repeatable, manual canvases with no npcId — renderSoloActivities
# (v2.py:5242). Counts per room, against a field median of 3:
#
#   the_desk       5    ANCHOR, above the median on purpose
#   the_corridor   4
#   the_lot        3
#   the_kitchen    3
#   the_bathroom   3
#   the_office     2    below the median on purpose — this room is Del
#   room_6         0    locked all release; the door is the content
#
# ⚠️ DAY CAPS ARE A FLAG ON THE CHOICE, NOT A PROPERTY OF THE CANVAS. The pattern
#    is `<x>_today is_false` in conditions + flagEffects setting it + the
#    [engine.daily_tick] in phase 0 clearing it. Without the tick a capped choice
#    is once per SAVE. Capped here: the monitor, the audit, listening at a door,
#    smoking, washing.
#
# ⚠️ `Watch the monitor` HAD TO BE CAPPED. It is free, safe, needs nothing and is
#    the corruption on-ramp — exactly what a player clicks twenty times. Grinding
#    is the genre's second-largest complaint after lostness.
#
# ⚠️ money AND rooms_full CARRY clamp = false EVERY TIME THEY ARE WRITTEN.
# =============================================================================

# ═══════════════════ THE DESK — the anchor, five things ══════════════════════

[[canvases]]
id          = "act_desk_checkin"
name        = "Take the check-in"
description = "The money and the exhibitionism surface at once. Available while cars are on the road and the motel is not full."

[canvases.trigger]
location      = "the_desk"
is_repeatable = true
is_active     = true
priority      = 5
# ⚠️ ON THE TRIGGER, not on the choices — the brake has to be on the way IN or the
#    rung is farmable however well its exits are priced (`_is_free`, gates.py:2913).
costs         = [ { trait = "energy", value = 3 } ]

[[canvases.nodes]]
id   = "base"
name = "Somebody at the counter"
blocks = [
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "exhibitionism", operator = "gte", value = 12 },
  ] } }, blocks = [
    { type = "paragraph", content = "You come round the side of the counter to hand the key over, which you did not used to do. He takes it and his eyes do the thing they all do, down and back, and you let it happen and write the plate on the card." },
  ] },
  { type = "group", blocks = [
    { type = "paragraph", content = "You keep the counter between you and slide the key across it. Cash, a plate number on a card, a tag off a hook. He looks at you the way men look at a girl behind glass at midnight." },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

# ⚠️ The exhibitionism-30 version is a DOOR, not a variant. A meter that only ever
#    changes the words is not an ascent tier — it has to open something.
[[canvases.nodes.exit_block.choices]]
text                     = "Come out from behind the counter to hand it over."
targetType               = "location"
locationId               = "the_desk"
time_progression_minutes = 20
costs = [ { trait = "energy", value = 3 } ]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "exhibitionism", operator = "gte", value = 30 },
  { type = "trait", subject = "player", trait_key = "hygiene", operator = "gte", value = 25 },
  { type = "trait", subject = "player", trait_key = "rooms_full", operator = "lt", value = 12 },
] }
show_when_locked = true
locked_text      = "The counter is between you for a reason and you are not ready to move it."
effects = [
  { targetType = "player", trait = "rooms_full",    op = "add", value = 1, clamp = false },
  { targetType = "player", trait = "exhibitionism", op = "add", value = 1 },
]

[[canvases.nodes.exit_block.choices]]
text                     = "Hang the tag."
targetType               = "location"
locationId               = "the_desk"
time_progression_minutes = 20
costs = [ { trait = "energy", value = 3 } ]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "rooms_full", operator = "lt", value = 12 },
  { type = "trait", subject = "player", trait_key = "energy", operator = "gte", value = 25 },
] }
show_when_locked = true
locked_text      = "Twelve rooms and twelve of them have somebody in them. There is nothing left to sell tonight."
# ⚠️ NO MONEY HERE. Decision 11: the pay rides on OCCUPANCY at midnight, not on
#    the act of checking somebody in. A check-in fills a room; the drawer is
#    counted at the audit, which is after midnight and is day-capped. Writing the
#    $6 here made the desk a money printer with no cap — `no free uncapped income`
#    caught it, and the fix is the design the sheets already described.
effects = [
  { targetType = "player", trait = "rooms_full", op = "add", value = 1, clamp = false },
  { targetType = "player", trait = "energy",     op = "add", value = -2 },
]

