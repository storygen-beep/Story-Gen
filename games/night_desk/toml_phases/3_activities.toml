# ─── THE BUS — the objective, standing in the lot, locked all release ────────
# ⚠️ THIS IS THE ONLY THING IN THE GAME THAT READS `money` AS A GATE, and it is
#    the one the whole economy points at. $400 against a best night of $72 and an
#    $80 weekly deduction: the arithmetic is the game. It is also the release's
#    largest visible locked door — the number is on the screen from night one.
#
# ⚠️ The bus stops Tuesdays and Fridays at 06:10, twenty minutes after her shift
#    ends. Stated in the boot's second screen and enforced here, so the promise
#    the opening makes is a thing the world actually keeps.
[[canvases]]
id          = "act_lot_bus"
name        = "Wait at the crossroads for the six-ten"
description = "The objective. $400 for a seat as far as the coast. Gated on money and on the two mornings the bus runs — the only money condition in the game, and the only sink."

[canvases.trigger]
location      = "the_lot"
is_repeatable = true
is_active     = true
priority      = 4

[[canvases.nodes]]
id   = "base"
name = "Four hundred dollars"
blocks = [
  { type = "paragraph", content = "The crossroads is a twenty-minute walk and the bus is there at ten past six on a Tuesday and a Friday. Four hundred dollars gets you as far as the coast. You have counted what is in the lining of your bag more times than there are dollars in it." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Walk out to the crossroads and get on it."
targetType               = "location"
locationId               = "the_lot"
time_progression_minutes = 40
