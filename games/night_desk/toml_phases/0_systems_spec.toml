# =============================================================================
# Night Desk — 0_systems_spec
# Built with author-game-v2 from games/night_desk/sheets/. The sheets are the
# spec; this file is the translation. Where the two disagree, the disagreement
# is recorded in iterations/001/BUILD_VS_SHEET.md — that comparison is the
# point of this game existing.
#
#   PLAYER ASCENT   exhibitionism (what she will let be seen)
#                   corruption    (what she will do)
#                   corruption is what OPENS exhibitionism — decision 7
#   CAST            relation + corruption on both men. Same nine rungs, wildly
#                   different relation gates: Del needs 85 at the top, Marek 50
#   NEEDS           energy · hunger · hygiene — decision 14, three that each
#                   shut a real door
#   MONEY           $6 per occupied room at midnight. $80/week back to Del.
#                   $400 is the bus out. She has $60.
#
# ⚠️ EVERY METER IS 0-100 — decision 5, Block A, LOCKED FOREVER. Nine rungs at
#    2 · 6 · 12 · 20 · 30 · 45 · 60 · 78 · 95. The scale is the engine's own
#    clamp (v2.py:5928-5930) and the field's modal ceiling.
#
# ⚠️ NO [settings.rent]. Decision 13 replaced an invented rent bill with the
#    night audit she already runs. RentDay hardcodes "— Rent Day" (v2.py:16598)
#    and "Rent is $X" (v2.py:16610); using it would make the game lie on the one
#    page that charges her. The $80 is a weekly effect on the audit.
# =============================================================================

schema_version = "1.0"

[project]
id              = "night_desk"
title           = "Night Desk"
description     = "Twelve rooms on a state highway, forty minutes from anywhere. You work the desk from ten at night, you sleep in room twelve, and eighty dollars a week comes back out of your pay for it. A seat on the bus out is four hundred. You have sixty."
starting_canvas = "canvas_first_night"
quests_engine   = "v2"
version         = "0.0.1"

# She starts at 21:50 on the first night — screen 2 of the walk in
# sheets/OPENING.md. The boot's own exits carry the clock to 22:00.
[time]
starting_hour = 21
starting_day  = "Monday"
starting_week = 1

[settings]
narration_person = "second"     # Block A decision 1 — IMMUTABLE once 0.0.1 ships

[theme]
mode = "dark"


# ─── The two she climbs ──────────────────────────────────────────────────────
# Read as words, never as numbers. The sidebar is how the player READS a meter;
# the rung gates live with the content.

[[sidebar_items]]
type  = "trait_status_text"
trait = "exhibitionism"
# ⚠️ THE TOP BAND STOPS AT THE HIGHEST AUTHORED GATE, not at 100. A band that
#    promises something at 60 in a release whose highest exhibitionism gate is 40
#    tells the player there is a rung there and there is not.
bands = [
  { min = 0,  max = 11, text = "Counter between you" },
  { min = 12, max = 29, text = "You come round the side of it" },
  { min = 30, max = 39, text = "You stopped checking the door" },
  { min = 40, text = "Wherever the light is" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "corruption"
bands = [
  { min = 0,  max = 11, text = "Three weeks and nothing has happened" },
  { min = 12, max = 29, text = "You let things take longer than they need to" },
  { min = 30, max = 44, text = "You have stopped calling it an accident" },
  { min = 45, text = "You know exactly what you are doing" },
]

# ─── The body — three needs, each of which SHUTS something ───────────────────
# decision 14. energy shuts the long jobs, hunger shuts steadiness, hygiene
# shuts every exhibitionism rung in the game — which is what makes the shared
# bathroom compulsory rather than optional.

[[sidebar_items]]
type  = "trait_status_text"
trait = "energy"
bands = [
  { min = 0,  max = 24, text = "Cannot do the audit tonight" },
  { min = 25, text = "Good for the night" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "hunger"
bands = [
  { min = 0,  max = 24, text = "Shaky — the drawer will not balance like this" },
  { min = 25, text = "Fed enough" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "hygiene"
bands = [
  { min = 0,  max = 24, text = "Not in front of anybody" },
  { min = 25, text = "Clean enough to be seen" },
]

[[sidebar_items]]
type  = "trait_bar"
trait = "money"
label = "Money"
max   = 400
hide_value = false

# ─── Suppress the auto Traits dump for every banded key ──────────────────────
# ⚠️ engine.md §30. The sidebar prints TWO things about a trait from two places
#    that do not know about each other: the auto dump (a bare number) and whatever
#    [[sidebar_items]] you authored. Band a key without hiding it and the player
#    reads "Nothing under it" and `corruption 55` stacked on each other.
#    `hide_value` on the sidebar item does NOT do this — only [[traits.labels]].
#    money is deliberately absent: it is a quantity and the number IS the read.
[[traits.labels]]
key    = "exhibitionism"
hidden = true

[[traits.labels]]
key    = "corruption"
hidden = true

[[traits.labels]]
key    = "energy"
hidden = true

[[traits.labels]]
key    = "hunger"
hidden = true

[[traits.labels]]
key    = "hygiene"
hidden = true

# Never shown at all — loop bookkeeping, not a read.
[[traits.labels]]
key    = "rooms_full"
hidden = true


# ─── DAY ROLLOVER — [engine.daily_tick] (engine.md §28) ──────────────────────
# ⚠️ THE DAY-CAP MECHANISM. A choice carries a `<x>_today is_false` condition and
#    sets the flag in flagEffects; this clears it at rollover. Without it every
#    capped choice is once per SAVE, not once per night.
#
# `Watch the monitor` and `Run the audit` are both day-capped on the desk sheet,
# and the monitor is the one that mattered: it is the corruption on-ramp, free
# and safe, and it is exactly the thing a player clicks twenty times. Grinding is
# the genre's second-largest complaint after lostness.
#
# The two conversation rungs and the two refusals are capped WEEKLY, not daily —
# their flags are not cleared here. They clear on the week boundary via their own
# `days_since` conditions.
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "monitor_today",   op = "unset" },
  { targetType = "player", flag = "audit_today",     op = "unset" },
  { targetType = "player", flag = "listened_today",  op = "unset" },
  { targetType = "player", flag = "smoked_today",    op = "unset" },
  { targetType = "player", flag = "washed_today",    op = "unset" },
  { targetType = "player", flag = "recorder_today",  op = "unset" },
  { targetType = "player", flag = "mirror_today",    op = "unset" },
  { targetType = "player", flag = "del_rung_today",  op = "unset" },
  { targetType = "player", flag = "marek_rung_today", op = "unset" },
]


# ═════════════════════════════════════════════════════════════════════════════
# GUIDANCE — [[quest_cards]], the sidebar's next-row
# ═════════════════════════════════════════════════════════════════════════════
# ⚠️ quests_engine = "v2" lights up a sidebar entry and a page; WITHOUT CARDS it
#    renders a heading and nothing. Lostness is the genre's dominant complaint at
#    a 4.7% median share of player comments, against grind's 0.9%.
#
# ⚠️ A STEPPED LADDER — cards sit on EXCLUSIVE trait bands, so exactly one story
#    card is live per tier at a time. The trap this avoids: a card whose goal is
#    met with no `ready_canvas` renders a met goal pointing nowhere.
#
# ⚠️ QUEST-CARD CONDITIONS USE `trait`, CANVAS CONDITIONS USE `trait_key`. Same
#    word "condition", two parsers, two key names (template_import.py:1361 for the
#    quest side). Writing `trait_key` in a quest card is a hard validation failure
#    with a message that does not name the right key — "condition item must set
#    either `flag` or `trait`". Cost one build.
#
# Two story tiers (corruption, exhibitionism) plus one card per character, which
# is what `guidance exists` checks: every declared ascent tier needs a story-tier
# card and every person in the game needs one of their own.

# ─── corruption — the spine ──────────────────────────────────────────────────
[[quest_cards]]
group      = "corruption"
priority   = 10
text       = "Three weeks and nothing has happened. The monitor cycles four cameras all night and nobody has ever told you not to watch it."
ready_text = "You have started watching the monitor for what is on it."
tip        = "Watch the monitor at the desk. It is free, it is the job, and it is once a night."
when       = [ { type = "trait", subject = "player", trait = "corruption", op = "lt", value = 12 } ]
goals      = [ { type = "trait", subject = "player", trait = "corruption", op = "gte", value = 12, label = "Corruption 12 — start watching the monitor for what is on it" } ]
ready_canvas = "act_desk_monitor"

[[quest_cards]]
group      = "corruption"
priority   = 9
text       = "The monitor is what is happening now. There is a recorder in the office that keeps thirty days, and it is not luck, it is a decision."
ready_text = "You know what the recorder keeps and you have looked at it."
tip        = "The office is open when Del is up. Corruption 30 to touch the recorder."
when       = [ { type = "trait", subject = "player", trait = "corruption", op = "gte", value = 12 },
               { type = "trait", subject = "player", trait = "corruption", op = "lt",  value = 30 } ]
goals      = [ { type = "trait", subject = "player", trait = "corruption", op = "gte", value = 30, label = "Corruption 30 — the recorder in the office" } ]
ready_canvas = "act_office_recorder"

[[quest_cards]]
group      = "corruption"
priority   = 8
text       = "Corruption is what opens exhibitionism, and both of them are what open him. Neither man asks for anything you have not already decided about."
tip        = "Everything above corruption 45 is locked in 0.0.1. The doors say why."
when       = [ { type = "trait", subject = "player", trait = "corruption", op = "gte", value = 30 } ]
goals      = [ { type = "trait", subject = "player", trait = "corruption", op = "gte", value = 45, label = "Corruption 45 — as far as 0.0.1 goes" } ]
ready_canvas = "hub_del_desk"
terminal      = true
terminal_text = "That is as far as 0.0.1 goes. Everything above it is on the ladder, visible and locked."

# ─── exhibitionism — what she will let be seen ───────────────────────────────
[[quest_cards]]
group      = "exhibitionism"
priority   = 7
text       = "You keep the counter between you and whoever is on the other side of it, the way you have for three weeks."
ready_text = "You come round the side of the counter now."
tip        = "Exhibitionism climbs where somebody can see you: the counter, the lot, the shared bathroom. Corruption is what unlocks the reach."
when       = [ { type = "trait", subject = "player", trait = "exhibitionism", op = "lt", value = 12 } ]
goals      = [ { type = "trait", subject = "player", trait = "exhibitionism", op = "gte", value = 12, label = "Exhibitionism 12 — come round the side of the counter" } ]
ready_canvas = "act_desk_checkin"

[[quest_cards]]
group      = "exhibitionism"
priority   = 6
text       = "Out in the lot the audience is the highway, which does not know your name. It is the cheapest place to take a rung."
ready_text = "You smoke against the wall under the sign now, where the road can see you."
tip        = "Exhibitionism 30 changes where you stand to smoke, and what you do at the mirror."
when       = [ { type = "trait", subject = "player", trait = "exhibitionism", op = "gte", value = 12 },
               { type = "trait", subject = "player", trait = "exhibitionism", op = "lt",  value = 30 } ]
goals      = [ { type = "trait", subject = "player", trait = "exhibitionism", op = "gte", value = 30, label = "Exhibitionism 30 — where the road can see you" } ]
ready_canvas = "act_lot_smoke"

# ─── Del ─────────────────────────────────────────────────────────────────────
[[quest_cards]]
npc_id     = "npc_del"
priority   = 5
when       = [ { type = "trait", subject = "npc", npc_id = "npc_del", trait = "relation", op = "lt", value = 40 } ]
text       = "He owns the building, the money and forty years on you, and all three make him careful. He is at the desk about two nights a week and in the office on the same two."
ready_text = "He does not stop where he used to stop."
tip        = "Del's relation is the bottleneck, never your corruption. Tuesday and Friday, 22:00 to 02:00 — and again at half three when the week has been thin."
goals      = [ { type = "trait", subject = "npc", npc_id = "npc_del", trait = "relation", op = "gte", value = 40, label = "Del's relation 40 — he stops where he does not usually stop" } ]
ready_canvas = "hub_del_desk"

# ⚠️ A LADDER MUST NOT END IN SILENCE. Past the last authored rung the sidebar
#    row goes blank and the player reads that as the character being finished.
[[quest_cards]]
npc_id        = "npc_del"
priority      = 4
text          = "He lets you stand at the monitor with him now, and he still has not decided what you are."
tip           = "Rung 45 and everything above it is on his ladder, visible and locked. 0.0.1 stops here."
when          = [ { type = "trait", subject = "npc", npc_id = "npc_del", trait = "relation", op = "gte", value = 40 } ]
terminal      = true
terminal_text = "Del goes no further in 0.0.1. The locked rungs on his sheet say what each one is waiting for."

# ─── Marek ───────────────────────────────────────────────────────────────────
[[quest_cards]]
npc_id     = "npc_marek"
priority   = 5
when       = [ { type = "trait", subject = "npc", npc_id = "npc_marek", trait = "relation", op = "lt", value = 15 } ]
text       = "Room six, eleven weeks, cash on Fridays. He has nothing to protect, which is why he is reachable at half the trust Del needs."
ready_text = "He has stopped pretending the bathroom is a coincidence."
tip        = "The corridor at twenty past midnight, and the bathroom either side of it. He shares it because six is the cheap half."
goals      = [ { type = "trait", subject = "npc", npc_id = "npc_marek", trait = "relation", op = "gte", value = 15, label = "Marek's relation 15 — he says it out loud" } ]
ready_canvas = "hub_marek_corridor"

[[quest_cards]]
npc_id        = "npc_marek"
priority      = 4
text          = "He has stopped pretending, and he has still not asked, and neither have you."
tip           = "Rung 30 and above is on his ladder, visible and locked. 0.0.1 stops here."
when          = [ { type = "trait", subject = "npc", npc_id = "npc_marek", trait = "relation", op = "gte", value = 15 } ]
terminal      = true
terminal_text = "Marek goes no further in 0.0.1. He is on the ladder at 30, 45, 60, 78 and 95 and every one of them says why not yet."
