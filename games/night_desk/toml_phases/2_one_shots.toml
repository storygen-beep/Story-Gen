# =============================================================================
# Night Desk — 2_one_shots · THE OPENING
#
# Twelve screens from the age gate to the first quiet hour, ~830 words. Two of
# the twelve are the engine's and are not in this file:
#
#   screen 0   Start                 title card + age gate      engine.md §12
#   screen 1   CustomizeCharacters   her name, one field        v2.py:1065/9251
#
# The ten below are ours, in four one-shot canvases held in order BY FLAG, not by
# schedule. All four auto-fire at the desk through selectAutoFireCanvasForLocation,
# which takes the highest-priority valid NON-REPEATABLE canvas and skips every
# repeatable one (v2.py:4453-4471).
#
#   canvas_first_night      2 nodes   sets booted
#   canvas_the_shift_begins 2 nodes   needs booted           sets shift_started
#   del_handover            3 nodes   needs shift_started    sets met_del
#   first_checkin           3 nodes   needs met_del          sets first_checkin_done
#
# ⚠️ AN AUTO-FIRE CANVAS REPLACES THE LOCATION SCREEN (getStoryCanvasRedirect,
#    v2.py:5091). The desk's own screen does not render until first_checkin_done
#    is set, and that is correct — the funnel IS the first hour.
#
# ⚠️ THE OPENING REFUSES NOTHING. No locked door, no failed check, no charge
#    before 06:00 — the-first-hour.md F4b, measured at 12 of 14 top-thirty
#    openings containing zero spoken refusals. The $80 is ARMED here and fires on
#    Friday. The one real choice, in first_checkin, colours and gates nothing.
#
# Prose is copied from sheets/OPENING.md unchanged. It was reviewed there.
# =============================================================================

# ─── BOOT — small, and it does not carry the cast ────────────────────────────
[[canvases]]
id          = "canvas_first_night"
name        = "The first night alone"
description = "The starting canvas. Two screens: who she is, and what she is saving for. Hands over to the desk at 21:55 and sets booted."

[canvases.trigger]
location      = "the_desk"
is_repeatable = false
priority      = 100
is_active     = true

[[canvases.nodes]]
id   = "the_deal"
name = "Three weeks"
blocks = [
  { type = "paragraph", content = "You are nineteen and you have been at the Wayside three weeks. You came with what fitted in a car, and two weeks ago you sold the car. Twelve rooms on a state highway, forty minutes from anywhere in either direction. Del owns it, sleeps in the back office, and takes eighty dollars a week out of your pay for room twelve." },
  { type = "paragraph", content = "Tonight is the first night they have left you on the desk alone." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Count what you have."
targetType               = "node"
nodeId                   = "the_bus"
time_progression_minutes = 2

[[canvases.nodes]]
id   = "the_bus"
name = "Four hundred dollars"
blocks = [
  { type = "paragraph", content = "There is a bus that stops at the crossroads on Tuesdays and Fridays at ten past six in the morning, twenty minutes after your shift ends. A seat on it as far as the coast is four hundred dollars." },
  { type = "paragraph", content = "You have sixty, folded flat in the lining of your bag, and you count it more often than you need to." },
]

# ⚠️ The handover is also where the opening sets its flags. A location exit's
#    config carries locationId, the clock, flagEffects and effects.
[canvases.nodes.exit_block]
type = "location"
text = "Go down to the desk."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_desk"
time_progression_minutes = 3
flagEffects = [
  { targetType = "player", flag = "booted", op = "set" },
]


# ─── CAPSTONE — the second one-shot, where prose is allowed to spend ─────────
# the-first-hour.md F2. v1 split boot and capstone; v2 collapsed them into one
# canvas that then carried everything, and v2's openings run more than double
# v1's as a result (median 402 against 184). Two canvases here.
[[canvases]]
id          = "canvas_the_shift_begins"
name        = "Night Desk"
description = "The capstone. Screen 4 names the game and lists every live system; screen 5 closes the frame that breaks and hands her the room at 22:00."

[canvases.trigger]
location      = "the_desk"
is_repeatable = false
priority      = 90
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "booted", operator = "is_true" },
] }

# ⚠️ DELIBERATELY DENSER THAN THE GAME'S NORMAL BEAT. This screen is seen once,
#    which is the same argument that lets a one-time capstone spend prose. A list
#    beats a paragraph here and nowhere else in the game. The `heading` block is
#    what makes the frame-break legal: the game says its own name, says the piece,
#    and closes the frame again on the next screen.
[[canvases.nodes]]
id   = "the_game"
name = "The game names itself"
blocks = [
  { type = "heading", content = "Night Desk" },
  { type = "paragraph", content = "**What you earn.** Six dollars for every room with someone in it at midnight. Twelve rooms, so a full night is seventy-two, and a full night has not happened since June. Eighty a week goes back to Del for your own." },
  { type = "paragraph", content = "**What you climb.** *Exhibitionism* — what you will let be seen. *Corruption* — what you will do. Neither of them starts anywhere. The second one is what opens the first." },
  { type = "paragraph", content = "**What your body needs.** You get tired, you get hungry, and you get dirty. There is one bathroom for rooms one to six and the staff, in the back hall behind the desk, and it does not lock from the inside." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Clock on."
targetType               = "node"
nodeId                   = "first_minutes"
time_progression_minutes = 3

[[canvases.nodes]]
id   = "first_minutes"
name = "Twenty-two hundred"
blocks = [
  { type = "paragraph", content = "The office door is shut and there is light under it. Out past the glass the lot holds four cars and the road holds nothing at all, and it will hold nothing at all for most of the next eight hours." },
  { type = "paragraph", content = "Two fluorescent tubes over the register. One of them ticks. Twelve keys on twelve hooks, four of them missing, which means four rooms are honest tonight. The monitor cycles four cameras at eight seconds each — corridor, lot, ice machine, the back hall — and comes round to the corridor again." },
  { type = "paragraph", content = "Twenty-two hundred. You have eight hours." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Start the shift."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_desk"
time_progression_minutes = 2
flagEffects = [
  { targetType = "player", flag = "shift_started", op = "set" },
]


# ─── DEL'S MEETING — his own scene, not a mention in the boot ────────────────
# ⚠️ NO requires_npc, AND THAT IS THE POINT. Del is at the desk about one night in
#    three ordinarily — Tuesday and Friday in the schedule — and the game starts
#    on a Monday. An introduction gated on his schedule would miss most players on
#    night one. requires_npc does not gate an auto-fire in any case
#    (the-first-hour.md F4); this canvas carries its own place in the flag chain
#    and is exempt from the schedule that governs him afterwards.
#
# ⚠️ ROLE BEFORE NAME. He is "the man who owns the place" for all three screens
#    and `del` afterwards — the flag this canvas sets is what switches it.
#
# It also ARMS three systems by saying them out loud: the monitor stays on, the
# ice machine is dead, and the books run between two and four. All three were
# going to appear as buttons she had never heard of.
[[canvases]]
id          = "del_handover"
name        = "He hands over"
description = "Del's introduction. Three screens: he comes out, the keys and the ice machine and the monitor, then the books at two. Sets met_del."

[canvases.trigger]
location      = "the_desk"
is_repeatable = false
priority      = 80
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "shift_started", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "he_comes_out"
name = "The man who owns the place"
blocks = [
  { type = "paragraph", content = "The office door opens and the man who owns the place comes out with his shirt untucked and a mug he does not offer to share. He is fifty-eight and he has the walk of a man who has already decided how the night goes." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "You're on your own tonight, $player.name." },
  { type = "paragraph", content = "It is not a question, so you do not answer it." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Wait for the rest of it."
targetType               = "node"
nodeId                   = "the_keys"
time_progression_minutes = 3

[[canvases.nodes]]
id   = "the_keys"
name = "Twelve keys and a dead machine"
blocks = [
  { type = "paragraph", content = "He puts twelve keys on the counter and pushes them across in a heap rather than hanging them." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "Ice machine's out. It's been out. Don't call anybody about it, and if they ask, tell them it's out." },
  { type = "paragraph", content = "He taps the monitor with one knuckle, twice, and the picture does not change." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "That stays on. I don't care if it bothers you." },
  { type = "dialog", props = { speaker = "player" }, content = "It doesn't bother me." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "It bothered the last one. Two weeks in she had a coat over it." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Ask what else."
targetType               = "node"
nodeId                   = "the_books"
time_progression_minutes = 3

[[canvases.nodes]]
id   = "the_books"
name = "Between two and four"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "Books get done between two and four. Drawer balances before I'm up, and I'm up at six." },
  { type = "paragraph", content = "He looks at you for slightly too long, the way you look at a thing you are not sure you should have bought." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_del" }, content = "You've been here three weeks, $player.name. You know where everything is." },
  { type = "paragraph", content = "Then he goes back into the office and shuts the door, and the light under it goes off about a minute later." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Get on with it."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_desk"
time_progression_minutes = 4
flagEffects = [
  { targetType = "player", flag = "met_del", op = "set" },
]


# ─── THE JOB, DONE ONCE — the funnel's last piece ────────────────────────────
# ⚠️ THIS IS THE ONE PIECE OF THE FUNNEL DOCTRINE DID NOT ASK FOR. F1-F10 specify
#    a boot, a capstone, a meeting per character and a handover; this is none of
#    them. KEPT ON LO'S CALL, 2026-08-31. The argument: the field's largest
#    openings are funnels the player ACTS inside — Course of Temptation's runs 78
#    passages with seven conditionals and not one refusal — and ours have been
#    narration plus a name box.
#
# The choice colours and refuses nothing, which is what makes it legal here.
[[canvases]]
id          = "first_checkin"
name        = "The first check-in"
description = "The funnel's last three screens. A car arrives, she works the counter once with the training wheels on, and the money lands. Sets first_checkin_done and the desk screen finally renders."

[canvases.trigger]
location      = "the_desk"
is_repeatable = false
priority      = 70
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "met_del", operator = "is_true" },
  { type = "time_of_day", start_time = "22:30", end_time = "23:30" },
] }

[[canvases.nodes]]
id   = "headlights"
name = "Twenty to eleven"
blocks = [
  { type = "paragraph", content = "Headlights come off the road at twenty to eleven and swing across the glass, and a station wagon stops badly across two spaces. A man gets out and stands looking at the sign for longer than the sign is worth, then comes in with his wallet already open." },
  { type = "dialog", props = { speaker = "npc" }, content = "You got a room?" },
  { type = "dialog", props = { speaker = "player" }, content = "Thirty-eight, cash, and I need the plate off the car." },
  { type = "dialog", props = { speaker = "npc" }, content = "It's a hire. The plate's on the paperwork, if you want me to go back out for it." },
]

# The first real choice in the game. BOTH WORK. Neither refuses.
[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Give him four. It's furthest from the road."
targetType               = "node"
nodeId                   = "the_key"
time_progression_minutes = 5

[[canvases.nodes.exit_block.choices]]
text                     = "Give him nine. It's closest to the light."
targetType               = "node"
nodeId                   = "the_key"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "the_key"
name = "Thirty-eight dollars"
blocks = [
  { type = "paragraph", content = "Thirty-eight dollars, cash, and he counts it twice because he does not trust himself. You write the plate on the card the way Del showed you three weeks ago, and you hang the tag on the hook and take the key off it." },
  { type = "paragraph", content = "He is looking at you, and it is not rude, and it is not nothing either. It is the look of a man working out whether the girl behind the counter is part of what he is paying for." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Hand him the key."
targetType               = "node"
nodeId                   = "the_first_six"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "the_first_six"
name = "Thirteen more of these"
blocks = [
  { type = "paragraph", content = "He says thanks in a way that is mostly a nod, and goes back out, and the station wagon takes two tries to get into the space it is already in." },
  { type = "paragraph", content = "Five rooms with someone in them now. At midnight that is thirty dollars, and thirty dollars is a night. Four hundred is thirteen more of these." },
  { type = "paragraph", content = "The tube over the register ticks. The road does nothing." },
]

# ⚠️ rooms_full carries clamp = false like money — it is a count of twelve rooms,
#    not a 0-100 meter, and the default clamp would silently be fine here but the
#    habit is what keeps money correct.
[canvases.nodes.exit_block]
type = "location"
text = "Back to the desk."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_desk"
time_progression_minutes = 15
effects = [
  { targetType = "player", trait = "rooms_full", op = "add", value = 1, clamp = false },
]
flagEffects = [
  { targetType = "player", flag = "first_checkin_done", op = "set" },
]


# ─── MAREK'S MEETING — where he actually is, not where she is ────────────────
# ⚠️ NOT PART OF THE FUNNEL and not at the desk. He is met only if she walks the
#    corridor after midnight, which is the point: the desk is where the game hands
#    her over, and he is the reason to leave it.
#
# ⚠️ IT CARRIES ITS OWN SCHEDULE WINDOW OR IT PLAYS TO AN EMPTY HALL.
#    `requires_npc` does NOT gate an auto-fire (the-first-hour.md F4) — the
#    time_of_day condition below is what puts him in the room, and it matches his
#    00:20-01:30 corridor row in phase 1 exactly. If those two ever drift apart,
#    this scene introduces a man who is not there.
#
# Role before name: he is "the man out of six" until this fires, `marek` after.
[[canvases]]
id          = "marek_meeting"
name        = "The man out of six"
description = "Marek's introduction, in the corridor, on his own ice run. One screen. Sets met_marek and opens his hub."

[canvases.trigger]
location      = "the_corridor"
is_repeatable = false
priority      = 60
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "met_del", operator = "is_true" },
  { type = "time_of_day", start_time = "00:20", end_time = "01:30" },
] }

[[canvases.nodes]]
id   = "base"
name = "Twenty past, with a bucket"
blocks = [
  { type = "paragraph", content = "There is a man at the far end of the hall with an ice bucket, in front of a machine that has not made ice since before you started. He is in the shirt he sleeps in. He is not in a hurry about any of it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marek" }, content = "It does the noise. That's about all it does." },
  { type = "paragraph", content = "Six. Eleven weeks, cash on a Friday, and he leaves the key at the desk every morning like a man who expects to be asked for it back. He has said he is leaving eleven times and he has unpacked." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marek" }, content = "You're on nights now, then. On your own." },
  { type = "dialog", props = { speaker = "player" }, content = "$player.name. If we're doing names." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marek" }, content = "Marek. Six. I'd say for another week but you'd have heard that before." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Say goodnight and get back to the desk."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_corridor"
time_progression_minutes = 10
flagEffects = [
  { targetType = "player", flag = "met_marek", op = "set" },
]
effects = [
  { targetType = "npc", npcId = "npc_marek", trait = "relation", op = "add", value = 2, cap = 10 },
]
