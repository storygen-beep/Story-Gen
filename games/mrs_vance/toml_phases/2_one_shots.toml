# =============================================================================
# Mrs. Vance — 2_one_shots  ·  THE FIRST HOUR
#
# references/the-first-hour.md. This is the half v2 shipped without: counting
# non-repeatable canvases that fire at a character's location, four v1 games run
# 24 / 13 / 7 / 0 and all six v2 games run ZERO.
#
# F1 · ONE SHAPE. This is a STAGED open and it stages exactly ONE person: Dorn.
#      He is on screen, he is described, he speaks, and he says what he wants.
#      Nobody else is named in the opening — the other five arrive through their
#      own meetings below. The defect F1 names is the middle: a cold open
#      carrying a staged open's payload, six people named and none on screen.
# F2 · BOOT AND CAPSTONE ARE TWO CANVASES. v1 split them and v2 collapsed both
#      into one, which is why v2's openings run more than double v1's. The boot
#      starts the chain; the capstone spends the prose.
# F3 · HAND OVER INTO AN OPEN DOOR. 06:00 + 5 + 5 + 5 + 45 = 07:00 at the
#      office, where `first_office` auto-fires and Cade's 06:30-09:00 row has him
#      standing in it. A random ambient is not a door and a substitution_only
#      walk-in is not a door.
# F4 · EVERY LIVE SYSTEM GETS ONE BEAT. The drawer (money), the book, the week
#      (his four nights), and both needs are all armed in the capstone.
# F4b· THE OPENING REFUSES NOTHING. Twelve of fourteen field openings contain no
#      spoken refusal at all. It hands over a bill; it does not enforce one —
#      `start_after_flag = "drawer_key"` is set HERE, so the first Friday is the
#      first charge.
# F5 · EVERY HUB SITS BEHIND A MEETING, and the meeting carries a `schedules`
#      window matching that character's OWN hours. `requires_npc` does NOT gate
#      the auto-fire path (v2.py:4573) — it is kept because it is free and
#      correct on the two paths that read it, but the schedule is what works.
# F6 · A MEETING IS SMALL AND SOMEBODY SPEAKS. Field median 101 words, 64% with
#      dialogue. A meeting with no `dialog` block is a description, not an
#      introduction.
# F7 · ROLE BEFORE NAME. Every meeting below opens on what he is to her.
#      the_season/meet_emmett opened "Emmett is on the belt…" and no line in the
#      canvas ever said he was her brother.
# F8 · ONE FLAG PER CHARACTER. `arrival_done` opening four hubs is the cold-spawn
#      hub in a coat, and three of six v2 games shipped exactly that.
# F9 · THE ANCHOR INTRODUCES ITSELF.
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# THE BOOT.  Small. It does not carry the cast.
# ─────────────────────────────────────────────────────────────────────────────
[[canvases]]
id       = "open_boot"
name     = "Five to six"

[canvases.trigger]
priority      = 100
location      = "your_room"
is_repeatable = false

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "paragraph", content = "The alarm is his and it goes at five to six whether he is going anywhere or not. You are awake before it because you have been awake since four, working out what you are going to be doing all day in a house where nothing has been given to you to do." },
  { type = "paragraph", content = "Eleven weeks. There is a wardrobe in this room with another woman's coat hangers in it and nobody has ever said what happened to what was on them." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "You are twenty-seven years old and you own two bags and a wedding ring you did not pay for." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Get up before he does."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "your_room"
time_progression_minutes = 5
flagEffects = [
  { targetType = "player", flag = "opening_started", op = "set" },
]


# ─────────────────────────────────────────────────────────────────────────────
# THE CAPSTONE.  Where the prose spends. One person, on screen, speaking.
#
# The flag gate is what guarantees order — both auto-fire through
# selectAutoFireCanvasForLocation, which takes the highest-priority valid
# NON-repeatable canvas and skips every repeatable (v2.py:4453-4471). No
# schedule needed.
# ─────────────────────────────────────────────────────────────────────────────
[[canvases]]
id       = "open_dorn_leaves"
name     = "What he leaves you"

[canvases.trigger]
priority      = 90
location      = "your_room"
is_repeatable = false
requires_npc  = "npc_dorn"
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_started", operator = "is_true" },
] }

# Matches npc_dorn's own Monday 05:00-06:45 row. G38.
[[canvases.trigger.schedules]]
weekdays   = [0]
start_time = "05:00"
end_time   = "06:45"

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "image", props = { file = "scenes/dorn_leaving_t1.jpg", description = "A man in his fifties dressed to drive, standing in a bedroom doorway with a bag.", search_queries = ["older trucker man dressed leaving bedroom doorway morning", "man fifties work jacket bag doorway dim bedroom"] } },
  { type = "paragraph", content = "Your husband is fifty-four and he dresses to drive the way other men dress for church. Boots first, then the belt, then the jacket off the back of the door, in that order, every time. He does not put the light on for it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_dorn" }, content = "Back Friday. Late." },
  { type = "paragraph", content = "He sits on the end of the bed to do the boots and the mattress goes down on your side and you slide two inches toward him and neither of you says anything about it." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Ask him what you are supposed to do all day."
targetType               = "node"
nodeId                   = "open_dorn_leaves.the_book"
time_progression_minutes = 5

[[canvases.nodes.exit_block.choices]]
text                     = "Say nothing and let him get to it."
targetType               = "node"
nodeId                   = "open_dorn_leaves.the_book"
time_progression_minutes = 5


[[canvases.nodes]]
id = "the_book"
name = "The book"
blocks = [
  { type = "paragraph", content = "He goes downstairs and you follow him and he does not turn round to check that you have. In the kitchen he takes a hardback ledger off the top of the water heater, where it has been sitting getting warm, and puts it on the table in front of you." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_dorn" }, content = "Every job that comes in, every job that goes out, what it made. In the book. In your handwriting, so I know it's yours." },
  { type = "paragraph", content = "Then a key, flat and brass and worn shiny on one edge. He puts it down beside the book and pushes it the last inch with one finger." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_dorn" }, content = "Cash drawer, under the till side. You hold it. You don't spend out of it. Friday, Cade counts what's in it against what's in the book, and the two of them agree or you and me have a conversation." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "So you are to write down every number this place makes and you are not on the account it goes into." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Ask what happens if it does not agree."
targetType               = "node"
nodeId                   = "open_dorn_leaves.the_week"
time_progression_minutes = 5

[[canvases.nodes.exit_block.choices]]
text                     = "Pick the key up."
targetType               = "node"
nodeId                   = "open_dorn_leaves.the_week"
time_progression_minutes = 5


[[canvases.nodes]]
id = "the_week"
name = "The week"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_dorn" }, content = "It agrees." },
  { type = "paragraph", content = "He puts his hand flat on the back of your head for a second on the way past, the way you would settle a dog, and goes out the back door into the yard. The cab starts, and it is loud enough in this kitchen that the cups move." },
  { type = "paragraph", content = "You watch him swing it out through the gate. Monday. He is back Friday, late, and that is four nights, and between here and Friday there are three of his sons and his brother on this property and not one other woman on it." },
  { type = "paragraph", content = "The pole light goes off on its timer while you are standing there. It is getting light anyway. Down at the shop the roller door is already up, which means somebody has been awake longer than you have." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Eleven weeks and nobody has told you what you are. The paper says three years. The book says go and do the books." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Take the book down to the office."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_office"
time_progression_minutes = 45
flagEffects = [
  { targetType = "player", flag = "opening_done", op = "set" },
  { targetType = "player", flag = "drawer_key",   op = "set" },
]


# ─────────────────────────────────────────────────────────────────────────────
# F9 · THE ANCHOR INTRODUCES ITSELF.
#
# The measured failure: a game budgeted its anchor at 27% of the whole word
# count, gave first-visit canvases to five OTHER rooms, and never once said what
# kind of business the anchor was. Its description opened "and under them forty
# machines" — forty machines of WHAT — and the first thing a human reader asked
# was what the place is.
# ─────────────────────────────────────────────────────────────────────────────
[[canvases]]
id       = "first_office"
name     = "The front of the shop"

[canvases.trigger]
priority      = 80
location      = "the_office"
is_repeatable = false
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "image", props = { file = "scenes/first_office_t1.jpg", description = "The front counter of a truck repair shop office, job sheets on a spike, a hatch through to the workshop.", search_queries = ["truck repair shop front office counter job sheets", "diesel garage reception desk paperwork window to workshop"] } },
  { type = "paragraph", content = "Vance Diesel fixes trucks. Not cars — trucks, the eighteen-wheel kind, four bays and a pit and a wrecker that goes out at two in the morning when somebody puts a rig in a ditch. Drivers come to this counter with a fault and a schedule and they are all, always, in a hurry." },
  { type = "paragraph", content = "The counter is at the front and the desk is at the back and there is a gate in the counter you have to lift to get between them. The book goes on the desk. The drawer is under the till side, where he said." },
  { type = "paragraph", content = "There is a window through to the shop floor, wired glass, about waist height to chest. From in here you can see four men working. From in there they can see the desk." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "You will be sitting in the one room on this property that everybody has to walk through." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Put the book on the desk."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_office"
time_progression_minutes = 5
flagEffects = [
  { targetType = "player", flag = "office_seen", op = "set" },
]


# =============================================================================
# THE MEETINGS.  One per character, one flag each, each on a window that matches
# that character's own schedule row.
#
# ⚠️ A non-repeatable canvas renders NO PORTRAIT —
#    selectNpcPortraitCanvasesForLocation skips `if (!c.isRepeatable) continue`
#    (v2.py:4482-4487) — so a meeting cannot leak onto the location screen as a
#    face, and the hub cannot appear before the meeting has fired.
# =============================================================================

