[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "image", props = { file = "scenes/first_back_row_t1.jpg", description = "A row of parked sleeper-cab lorries at the dark end of a yard, angled into six spaces behind a hedge.", search_queries = ["truck stop overnight parking sleeper cabs dark row", "lorries parked overnight behind hedge yard night"] } },
  { type = "paragraph", content = "Six spaces, angled off the end of the yard, and they are not the yard's. Drivers who cannot make the next leg pull in and sleep in the bed behind the seats. Nobody books in and nobody pays." },
  { type = "paragraph", content = "Your husband lets them because a man who has slept in your row buys his diesel off your pumps. Somebody walks it before the lights go off, counts the cabs, and writes the number in the book you keep." },
  { type = "paragraph", content = "The pole light stops at the skip. Past that it is hedge, and the road behind the hedge, and not one window in the house that looks this way. It is the last place on the property anybody looks." },
  { type = "dialog", props = { speaker = "unknown" }, content = "You lost, love?" },
  { type = "dialog", props = { speaker = "unknown" }, content = "Vance's, is it? Tell him the water is still off in the washroom. Been off a fortnight." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Six men asleep forty yards from the back step, and not one of them knows your name or has any reason to learn it." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Count the cabs."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_back_row"
time_progression_minutes = 5
flagEffects = [ { targetType = "player", flag = "back_row_seen", op = "set" } ]


