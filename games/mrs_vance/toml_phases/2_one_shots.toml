blocks = [
  { type = "image", props = { file = "scenes/first_bar_t1.jpg", description = "A dim rural roadside bar, unused pool table, a row of stools along the back where working men sit.", search_queries = ["dim small town roadside bar pool table stools", "rural american bar interior afternoon working men at counter"] } },
  { type = "paragraph", content = "The bar on the corner opposite the bank, and it is where the yard drinks. Twenty minutes of county road from your own gate, which sounds like distance right up until you count who is standing in it." },
  { type = "paragraph", content = "Everybody in here either works for your husband or sells to him. There is no version of this room in which what you do in it does not get back across those twenty minutes before you do." },
  { type = "dialog", props = { speaker = "unknown" }, content = "You'll be the wife, then." },
  { type = "paragraph", content = "The man behind the bar says it without looking up from the glass he is doing, and it is not a question, and nobody in the room turns round because nobody in the room needed telling." },
  { type = "dialog", props = { speaker = "unknown" }, content = "What'll it be. It goes on the yard's tab either way." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "The first place you have stood in since the wedding that is not his, and it is still his." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Find the end of the bar."

