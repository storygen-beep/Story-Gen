[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "paragraph", content = "Your husband's eldest son is already at the desk when you get there with the book, and he does not get out of the chair. He is twenty-nine, which makes him two years older than his father's wife, and he was the only person at the wedding who did not pretend that was ordinary." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "He gave you the book, then." },
  { type = "paragraph", content = "He holds his hand out for it. You give it to him. He opens it at the first page, which is blank, looks at the blank page for about as long as it takes to read one, and gives it back." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "Right. Job sheets are on the spike, they come off the spike when they're paid, and what's in the drawer Friday has to be what's in the book. I'm not going to explain it twice, so ask me now." },
  { type = "paragraph", content = "Then he does get up, and he stands to one side of the chair rather than moving away from it, so that sitting down means going past him." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "Mrs. Vance." },
]

