# ═════════════════════════════════════════════════════════════════════════════
# FIRST VISITS — the nine locations that had none.  (REVIEW.md M1 + M2)
#
# A description renders under the room title on EVERY visit, so it is wallpaper.
# the-first-hour.md F9 wants the moment of arriving: the first time she walks in,
# the game says what kind of place this is and what happens here. After that the
# name is enough.
#
# MECHANISM — no engine work.  A non-repeatable canvas bound to a location
# auto-fires on first entry and never again: selectAutoFireCanvasForLocation
# skips isRepeatable / random / substitution_only and takes the highest-priority
# valid candidate, and it is consulted BEFORE checkRandomEncounters, so an
# arrival wins over an ambient on that entry (v2.py:4923 region).
#
# ⚠️ THREE CONSTRAINTS, each from a check that currently passes.
#    1. No cast member is NAMED in any of these. Every one of the nine is
#       reachable before at least one meeting can fire, and `lint · named before
#       met` reads 0 today. Roles only — the-first-hour.md F7, role before name.
#    2. No NUMBERED hour. `lint · the clock in the prose` is already the worst
#       number on the board at 16.5 per 10k, 21x the field. Bare "night" and
#       "morning" are safe; the lint needs a numeral or a spelled-out hour
#       (gates.py:3042-3072).
#    3. priority = 80, matching first_office. 100 and 90 are the opening at
