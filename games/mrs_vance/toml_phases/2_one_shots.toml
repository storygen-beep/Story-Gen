  { type = "paragraph", content = "He goes downstairs and you follow him and he does not turn round to check that you have. In the kitchen he takes a hardback ledger off the top of the water heater, where it has been sitting getting warm, and puts it on the table in front of you." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_dorn" }, content = "Every job that comes in, every job that goes out, what it made. In the book. In your handwriting, so I know it's yours." },
