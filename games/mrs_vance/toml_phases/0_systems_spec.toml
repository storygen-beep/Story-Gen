[[quest_cards]]
priority = 30
npc_id   = "npc_sherrod"
text     = "Dorn's brother, fifty-one, and he lives up the stairs over the office. He knew about the wedding before you did and he has never once said what he thinks that is worth."
tip      = "He is in the office after the shop shuts and he is in no hurry. Ask him something about the family."
when     = [ { flag = "met_sherrod", subject = "player", op = "is_true" },
