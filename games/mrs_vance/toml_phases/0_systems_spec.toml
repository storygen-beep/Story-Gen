# =============================================================================
# Mrs. Vance — 0_systems_spec
# Built with author-game-v2. Want + board: games/mrs_vance/WANT.md, v2_state.json
#
# WHO CLIMBS: "cast".  the-meters.md W1, declared before a meter was named.
#   No player ascent bar. `board.ascent_tiers = []`. The ladders are the men,
#   and they live on the [[npcs]] blocks as `subject = "npc"` meters.
#
# METERS
#   CAST        ONE willingness word for the whole cast — `want`, same scale on
#               everyone. W6 as rewritten 2026-08-24: nine of thirteen field
#               games give every person exactly one meter and it is the same
#               word every time; differentiation is per-site modifiers and per
#               person subject matter, NOT a private vocabulary per man.
#               off_season shipped four shapes for four people under the old
#               reading and this game deliberately does not.
#               `trust` (access — what he lets her into) is the RICH second
#               meter and it is on TWO people only: Cade and Booth, the arcs
#               that carry the game.
#   COLOUR      `standing` — how much of the Vance name is actually hers. A
#               W5b audience meter: it RISES and it rarely refuses. Do NOT
#               apply W5's shuts-a-door test to it — W5 owns the meter that
#               closes.
#               ⚠️ CORRECTED 2026-08-27. This block used to read "the field
#               reads reputation at 644 sites and refuses at 2% of them." That
#               644 is three games (DoL 610, zaras 23, course-of-temptation 11)
#               and 95% of it is DoL alone; the source flags the third as
#               instrument-blind. Re-measured across 13 field games that carry
#               a reputation meter (Player_Legibility_Study_20260825 §44):
#                 1,944 references · ~10% of branch arms carry a link
#                 MEDIAN 41% of reads change something mechanical
#                 median 31 passages carry a read · median 9 rungs
#               "Rarely refuses" survives. "Therefore it does nothing but swap
#               a line" does NOT — that was DoL's habit read as the field's
#               law. Three consequential uses the old number hid: reputation
#               DELIVERS PEOPLE (patriarch: a knock at 5, 9, 14), MODIFIES A
#               ROLL (destroyer: `_roll + $Respect`), and SCALES A RATE
#               (corpo-life: relationship gain per band). See REVIEW.md S1b.
#   THROTTLE    `arousal` — gates the FINISH link on the act loops and nothing
#               else, reset to 0 at climax (W2). Five v2 games raised it 232
#               times and read it 4, because none of them built a loop for it
#               to gate. This one builds the loop.
#   NEEDS       energy · clean — each shuts a named door (M8-M10).
#   CURRENCY    money. clamp = false on EVERY effect that writes it (§21).
#   NO COUNTERWEIGHT. One field game in 25 ships one that gates anything.
#
# ⚠️ NO RUNG STARTS AT 15. All 16 declared tiers across five v2 games put their
#    lowest rung at exactly 15 because templates/board.toml shipped that band
#    table — fifteen clicks in which nothing the player does changes anything.
#    Field runs 8-17 rungs on a player meter and a MEDIAN OF 3 on a per-person
#    one, lowest at ~5 (W4). Every ladder here opens at 4-8.
# =============================================================================

schema_version = "1.0"

[project]
id              = "mrs_vance"
title           = "Mrs. Vance"
description     = "Eleven weeks married to the man who owns the yard, and he hauls four nights out of seven. His three sons and his brother are all still here, and every one of them has to call you by a title you did not earn."
starting_canvas = "open_boot"
quests_engine   = "v2"
version         = "0.1"

[time]
starting_hour = 6
starting_day  = "Monday"
starting_week = 1

[settings]
narration_person  = "second"

# ⚠️ CLOTHING IS OFF ON PURPOSE. With `clothing_enabled = true` the generator
#    emits [[Change Clothes->WardrobePage]] on the wardrobe location
#    UNCONDITIONALLY (v2.py:9601-9602) — no item check — so off_season 0.1
#    shipped a live link at the top of her own home leading to a page rendered
#    from an empty catalog. And a declared wardrobe must be READ somewhere or
#    the `wardrobe is read` gate fails: 102 garments across ten of our games
#    against 47 reads between them. Arm it in the release that authors both the
#    catalog and the beat that teaches it (the-first-hour.md F4).
clothing_enabled  = false

[theme]
mode = "dark"


# =============================================================================
# THE FRIDAY DRAWER COUNT — the engine under the whole game
#
# She keeps the books and is not on the account. The yard's cash sits in a
# drawer she is responsible for, and every Friday Cade counts the drawer
# against the book she wrote. That is the reversal made arithmetic: she can see
# every number and touch none of them, and the shortfall is hers.
#
# ⚠️ THE ENGINE CHARGES THIS. Do NOT author a canvas that narrates the payment
#    (engine.md §26). A shipped game wrote the hand-over scene beside a working
#    [settings.rent] and the authored canvas carried no cost and no money
#    effect — a free, repeatable, unlimited relation faucet, and the free one
#    was the one with the writing in it. What IS authored here is the Thursday
#    night before and the ask. Never the transaction.
#
# ⚠️ eviction_mode = "flag_set", NOT the default "game_end". The product never
#    ends. Short on Friday past the grace week and Cade covers it — which sets
#    `cade_covered`, which is a DEBT to Cade and opens his ladder. The failure
#    branch is an escalation, not a loss.
#
# ⚠️ It arms at 00:00 on due_day (v2.py:5453-5464), not at the hour Cade's
#    schedule row puts him in the office. start_after_flag keeps the first
#    session pressure-free (the-first-hour.md F4b: the opening states the
#    price and enforces nothing).
#
# ⚠️ currency_symbol must equal board.economy.symbol. Left out it defaults to
#    "$" (v2.py:1190) and the rent card contradicts every button. It reaches
#    four of the sixteen sites the engine prints money at (§33); RentDay_Short
#    — the screen she meets when she CANNOT pay — hardcodes "$" and never reads
#    this key. It agrees with us by luck, not by wiring. House default, and no
#    real-world currency named anywhere in the prose.
# =============================================================================
[settings.rent]
enabled          = true
amount           = 260
currency_symbol  = "$"
due_day          = "Friday"
collector_npc    = "npc_cade"
grace_periods    = 1
start_after_flag = "drawer_key"
eviction_mode    = "flag_set"
eviction_flag    = "cade_covered"

[settings.rent.text]
title            = "Friday"
scene            = "He does it at the desk, not the counter, so he is sitting in the chair you have been sitting in all week. The book goes on his left and the drawer goes on his right and he does not open either one until you are standing where he can see you."
greeting         = "Two sixty. Let's see the week."
paid_scene       = "You count it out and he stacks it in fifties without looking at his hands, reading down your column while he does it. Your handwriting is the only thing in the room that is yours."
paid_response    = "That's the week. You write neat."
paid_closing     = "He squares the book on the desk facing you and stands up out of the chair, and it is not a thing he gives back so much as a thing he is finished with for now."
cant_pay         = "You have not got the two sixty."
warning_scene    = "You tell him it is short. He does not raise his voice and he does not look up. He goes back four days in your own column and lets his finger sit under the line where it went wrong, so you can read it yourself, and he waits until you have."
warning_response = "One week. I'm not going to tell him, and you're going to want to understand what that is."
warning_closing  = "He leaves the drawer open on the desk when he goes. Not the book — the drawer."
eviction_scene_soft    = "The second Friday he brings his own money, which he has never done, and puts it in the drawer before he counts it, so the count comes out right. Then he sits down and takes his time about squaring the book."
eviction_response_soft = "Now it balances. So we're past what you owe the yard, and onto what you owe me."
eviction_closing_soft  = "He puts the drawer key back on the desk in front of you instead of taking it, which is worse, and he knows it is worse."


# =============================================================================
# SIDEBAR
#
# ⚠️ EVERY BANDED KEY IS `hidden = true` IN [[traits.labels]] BELOW. The sidebar
#    prints a trait twice — once from the auto Traits dump, once from the item
#    you wrote — and the two do not know about each other (§30, gate 27).
# ⚠️ NO `max` ON A TOP BAND: a value landing outside every band renders NOTHING
#    and the card vanishes, which reads as a missing HUD element.
# =============================================================================

# The audience meter. Identity, so `trait_status_text` and a word, never a
# number — the player thinks in a word (M7). It rises and it colours.
[[sidebar_items]]
type  = "trait_status_text"
trait = "standing"
bands = [
  { min = 0,  max = 14, text = "The new wife" },
  { min = 15, max = 39, text = "Mrs. Vance, to your face" },
  { min = 40, max = 69, text = "They ask for you now" },
  { min = 70, text = "You are the one they come to" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "energy"
bands = [
  { min = 0,  max = 19, text = "Done in" },
  { min = 20, max = 44, text = "Getting through it" },
  { min = 45, text = "Up for it" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "clean"
bands = [
  { min = 0,  max = 24, text = "Diesel to the elbow" },
  { min = 25, max = 39, text = "Grease under the nails" },
  { min = 40, text = "Clean enough for the counter" },
]

# The throttle. Banded and value-hidden (M7, transient mood): the band, never
# the volatile figure.
[[sidebar_items]]
type       = "trait_bar"
trait      = "arousal"
hide_value = true
bands = [
  { min = 0,  max = 29,  text = "—" },
  { min = 30, max = 64,  text = "Aware of it" },
  { min = 65, max = 100, text = "Not going to be able to leave it" },
]

# Countable resource: the exact figure, NO bands (M7). You do not band a thing
# the player is counting against a Friday.
#
# ⚠️ `label` and `max` both belong on the ITEM. A trait_bar reads
#    `_item.label || _tbKey` (v2.py:16215) and never consults [[traits.labels]],
#    which is condition text only (v2.py:6781). And `_traitMax` defaults to 100
#    (v2.py:16214), so an uncapped counter renders as a fraction of a ceiling
#    that does not exist. max = 260 is [settings.rent] amount, so the bar reads
#    as how much of Friday she has.
[[sidebar_items]]
type       = "trait_bar"
trait      = "money"
label      = "The drawer"
max        = 260
hide_value = false

# The rail. `quest_next` renders the same renderQuestsGoalBlock the page does,
# so the three surfaces cannot drift (§23). Without it the only always-visible
# strings are band texts, which name a STATE and never a step — a player who
# does not open the Quests page has no place, no verb and no person anywhere in
# the persistent chrome.
[[sidebar_items]]
type = "quest_next"
max  = 3


# ─── Trait labels ────────────────────────────────────────────────────────────
# money is deliberately NOT hidden: `hidden` drives two surfaces (v2.py:1220-1226)
# and hiding the only unhidden player trait empties both the sidebar Traits box
# and the Stats page. A redundant row beats two empty boxes — off_season tested
# this both ways on 2026-08-22.
[[traits.labels]]
key   = "money"
label = "The drawer"

[[traits.labels]]
key    = "standing"
hidden = true

[[traits.labels]]
key    = "energy"
hidden = true

[[traits.labels]]
key    = "clean"
hidden = true

[[traits.labels]]
key    = "arousal"
hidden = true

# Loop state — hidden numeric traits, never flags. A flag set inside a
# triggerless canvas has no located setter and HARD-FAILS the build (§16).
# These are stage COUNTERS, set to distinct integers and read eq/gte/lt — the
# field's commonest gate shape at 53% equality against our 4.5%, and the one
# our v2 games build least (the-surfaces.md R5d).
[[traits.labels]]
key    = "loop_stage"
hidden = true

[[traits.labels]]
key    = "loop_act"
hidden = true

# ⚠️ Hiding also keeps gate 10 honest. Its anti-narrowing test walks EVERY
#    player trait and calls a key whose `lt` reads outnumber its `gte` reads a
#    descent — which is what a loop counter read with `lt` looks like. Excluding
#    hidden keys is deliberate in gates.py, because a hidden trait is not a
#    meter the player can be lied to by.


# =============================================================================
# DAY ROLLOVER — [engine.daily_tick] (§28)
#
# ⚠️ The only clean way to day-cap a TRIGGERLESS rung, and nearly every rung in
#    a v2 game is triggerless: `max_triggers_per_day` is read off the TRIGGER
#    (v2.py:11017), so a hub choice has none.
# ⚠️ The flag is SET ON THE CHOICE, never on a rung's exit. A choice runs
#    flagEffects BEFORE advanceTime; a node exit runs advanceTime FIRST
#    (v2.py:12648-12733 vs :13085-13088), and advanceTime is where the day rolls
#    and this hook clears. An exit-set cap on a rung that crosses midnight
#    starts the new day already capped — off_season's sleep rung ran 21:00→06:00
#    and was never offered before midnight again from night two.
# ⚠️ Two of the three parts validates and throttles nothing. Every flag cleared
#    here is SET somewhere; gate `a day-cap closes` exists because off_season
#    shipped four caps with the read and the clear and no set.
# ⚠️ THE CAP IS PER PERSON AND THE HUBS ARE PER ROOM. Cade has three hubs and
#    one `cade_rung_today`; spending it in the office empties the shop floor and
#    the bar for the day, which is intended — but every one of those screens
#    keeps a free door (R7, gate 37).
# =============================================================================
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "washed_today",       op = "unset" },
  { targetType = "player", flag = "seen_today",         op = "unset" },
  { targetType = "player", flag = "counter_done_today",  op = "unset" },
  { targetType = "player", flag = "books_done_today",    op = "unset" },
  { targetType = "player", flag = "parts_run_today",     op = "unset" },
  { targetType = "player", flag = "trailer_done_today",  op = "unset" },
  { targetType = "player", flag = "walkround_today",     op = "unset" },
  { targetType = "player", flag = "cade_rung_today",     op = "unset" },
  { targetType = "player", flag = "booth_rung_today",    op = "unset" },
  { targetType = "player", flag = "isaac_rung_today",    op = "unset" },
  { targetType = "player", flag = "sherrod_rung_today",  op = "unset" },
  { targetType = "player", flag = "tobin_rung_today",    op = "unset" },
  { targetType = "player", flag = "dorn_rung_today",     op = "unset" },
]


# =============================================================================
# THE CAST PAGE — [ui.cast_page] (§34)
#
# Presence of the block is the entire opt-in; every line on a card already
# exists elsewhere and is read at runtime. WHO IS LISTED IS THE QUEST CARDS'
# DECISION — a character appears exactly when pickQuestsCard returns a card, the
# same gate QuestsPage makes. Every card below carries that character's meeting
# flag, so the page fills in as she meets people (the-first-hour.md F8).
# =============================================================================
[ui.cast_page]
title        = "The Vances"
button_label = "The Vances"
button_icon  = "👥"
intro        = "Four of them are his. One of them is yours."


# =============================================================================
# GUIDANCE — [[quest_cards]] (§23; the-voice.md R2/R3/R5)
#
# ⚠️ NO `version = "1.0"` ON A QUEST CARD. Quest conditions use a separate
#    evaluator with no fail-open (v2.py:14878).
# ⚠️ EVERY card in a character's ladder carries that character's meeting flag in
#    `when`. A gap means the character reappears at the band whose card you
#    missed — and the_season gated every hub correctly and still introduced all
#    five people on the Quests page on click one.
# ⚠️ A `when` item sets `flag` OR `trait`, never both (template_import.py:5285).
# ⚠️ `terminal` is not computed from progress, AND A METER IS THE WRONG THING TO
#    GATE IT ON. v0.1 shipped every ladder as two cards with the terminal one
#    gated `gte` on a meter, and the badge landed AT the door on two characters
#    and BEFORE it on three — Tobin's ✓ arrived 40 points of climbing early, and
#    Cade's and Booth's were gated on a different meter from the one the door
#    reads. Every ladder here is now THREE states and the last one is a FLAG the
#    loop sets on its way out:
#       climb  -> `<meter> lt DOOR`, goals the door           -> 🎯 progress
#       ready  -> `<meter> gte DOOR` + `<x>_loop_played` is_false,
#                 NO goals, `ready_canvas` on the HUB          -> 🔓 Ready 📍 🕒
#       done   -> `<x>_loop_played` is_true, terminal          -> ✓
# ⚠️ `ready_canvas` MUST name a canvas that HAS A LOCATION. lookupCanvasBySlug
#    (v2.py:15371) walks help_data.locationCanvases, keyed by location UUID, so
#    a triggerless canvas is not in it — `ready_canvas = "loop_cade"` resolves to
#    null and Frame 2 returns "", rendering NOTHING. Point it at the hub.
# ⚠️ A goal threshold no canvas condition anywhere reads is a number the player
#    climbs to for nothing. v0.1 shipped three (isaac 66, sherrod 62, tobin 30);
#    they were invisible only because the terminal frame outranked the bullets.
# ⚠️ terminal_text: engine.md caps it at ONE CARD PER GAME, and that cap is
#    scoped to an arc that is genuinely CLOSED, where the default "Arc complete"
#    is true. NOTHING here is closed — every track stops at a build boundary — so
#    every track carries the same plain marker, which is what the-release.md:109
#    asks for ("a plain marker at the top of EACH track").
#
# This game declares NO ascent tiers, so there are no tier cards. The page is
# the six people plus the story goals, which is what a roster game's guidance
# page IS.
#
# Every goal label names a PLACE, a VERB and a WINDOW where the rung is
# schedule-gated (R3). "Prove yourself to Cade" fails: no place, no action.
# =============================================================================

# ── STORY GOALS — never gated on a meeting, or the page reads "No active
#    quests." on turn one (F8).
[[quest_cards]]
priority = 90
text     = "You signed a paper that says nothing here is yours for three years. Until then the money runs through the drawer, the truck runs through Cade, and the room you sleep in is his father's room."
tip      = "The drawer is counted every Friday and the number has to be two sixty. Work the counter and the bay, and keep the book straight."
when     = [ { flag = "opening_started", subject = "player", op = "is_true" } ]
goals    = [ { trait = "money", subject = "player", op = "gte", value = 260, label = "Have the two sixty in the drawer by Friday — the office" } ]

[[quest_cards]]
priority = 89
text     = "He is on the road Monday to Thursday. The week has exactly one shape and it is which nights his truck is in the lot."
tip      = "Nothing much happens while he is here. Everything happens while he is not."
when     = [ { flag = "opening_started", subject = "player", op = "is_true" } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 15, label = "Get them saying your name instead of asking for a man — the office counter" } ]

# ── CADE — the spine. trust (access), then want (willingness), then played. ──
[[quest_cards]]
priority = 30
npc_id   = "npc_cade"
text     = "He runs the yard and he is two years older than you, and he was the only one at the wedding who did not pretend it was ordinary. He signs what you write down. He decides what you are allowed to touch."
tip      = "He is at the office desk first thing and last thing. Do the books where he has to lean over you to read them."
when     = [ { flag = "met_cade", subject = "player", op = "is_true" },
             { trait = "trust", subject = "npc", npc_id = "npc_cade", op = "lt", value = 26 } ]
goals    = [ { trait = "trust", subject = "npc", npc_id = "npc_cade", op = "gte", value = 26, label = "Do the books at his desk — the office, early or after six" } ]

[[quest_cards]]
priority = 31
npc_id   = "npc_cade"
text     = "He has stopped counting the drawer in front of you and started counting it beside you. What he has not done is say one word about the arrangement, and the not saying is the loudest thing in the room."
tip      = "Stay in the office after he shuts the roller door. He does not ask you to and he does not tell you to go."
when     = [ { flag = "met_cade", subject = "player", op = "is_true" },
             { trait = "trust", subject = "npc", npc_id = "npc_cade", op = "gte", value = 26 },
             { trait = "want", subject = "npc", npc_id = "npc_cade", op = "lt", value = 42 } ]
goals    = [ { trait = "want", subject = "npc", npc_id = "npc_cade", op = "gte", value = 42, label = "Stay after the roller door goes down — the office, after six" } ]

[[quest_cards]]
priority = 32
npc_id   = "npc_cade"
text     = "He does not send you home when the door goes down any more. He counts, and he waits for you to finish your column, and the waiting has stopped being about the book."
tip      = "Stay in the office after six and take the whole eleven minutes."
when     = [ { flag = "met_cade", subject = "player", op = "is_true" },
             { trait = "want", subject = "npc", npc_id = "npc_cade", op = "gte", value = 42 },
             { flag = "cade_loop_played", subject = "player", op = "is_false" } ]
ready_canvas = "hub_cade_office"

[[quest_cards]]
priority = 33
npc_id   = "npc_cade"
text     = "It is a standing arrangement now and neither of you has named it. He counts up on his own most nights and does not mind which nights you are there for."
tip      = "The office after six, as often as you want it."
when     = [ { flag = "met_cade", subject = "player", op = "is_true" },
             { flag = "cade_loop_played", subject = "player", op = "is_true" } ]
terminal = true
terminal_text = "As far as this build goes"

# ── BOOTH — the taboo. trust (what he lets her see), then want, then played. ─
[[quest_cards]]
priority = 30
npc_id   = "npc_booth"
text     = "Nineteen, and the only one in the house who says the title like he means it. He has no idea what you are and he has decided you are his father's wife, which is the one answer nobody else here accepts."
tip      = "He is in the kitchen after four and he does not leave when you come in. Be in the room and let it get long."
when     = [ { flag = "met_booth", subject = "player", op = "is_true" },
             { trait = "trust", subject = "npc", npc_id = "npc_booth", op = "lt", value = 30 } ]
goals    = [ { trait = "trust", subject = "npc", npc_id = "npc_booth", op = "gte", value = 30, label = "Stay in the kitchen with him — afternoons, after four" } ]

[[quest_cards]]
priority = 31
npc_id   = "npc_booth"
text     = "He has started using your name and correcting himself back to the title, every time, out loud. He is doing it on purpose now and neither of you has said so."
tip      = "His door is on the latch after ten. Knock on it about something that could have waited."
when     = [ { flag = "met_booth", subject = "player", op = "is_true" },
             { trait = "trust", subject = "npc", npc_id = "npc_booth", op = "gte", value = 30 },
             { trait = "want", subject = "npc", npc_id = "npc_booth", op = "lt", value = 50 } ]
goals    = [ { trait = "want", subject = "npc", npc_id = "npc_booth", op = "gte", value = 50, label = "Knock on his door about nothing — his room, after ten" } ]

[[quest_cards]]
priority = 32
npc_id   = "npc_booth"
text     = "He leaves the door on the latch and he leaves the television down, and he has stopped saying sorry when you come in. He is still calling you Mrs. Vance and he is still doing it on purpose."
tip      = "Knock after ten. He will not ask you to stay and he will not ask you to go."
when     = [ { flag = "met_booth", subject = "player", op = "is_true" },
             { trait = "want", subject = "npc", npc_id = "npc_booth", op = "gte", value = 50 },
             { flag = "booth_loop_played", subject = "player", op = "is_false" } ]
ready_canvas = "hub_booth_room"

[[quest_cards]]
priority = 33
npc_id   = "npc_booth"
text     = "The latch stays off now. He has not once used your name where anyone else could hear it, and he has not once used the title when nobody can."
tip      = "His room, after ten, whenever you want it."
when     = [ { flag = "met_booth", subject = "player", op = "is_true" },
             { flag = "booth_loop_played", subject = "player", op = "is_true" } ]
terminal = true
terminal_text = "As far as this build goes"

# ── ISAAC — the watcher. one meter, then played. ────────────────────────────
[[quest_cards]]
priority = 30
npc_id   = "npc_isaac"
text     = "Twenty-four, and he has not said forty words to you. He watches, and he does not stop watching when you catch him at it, and that was the first thing about this place you liked."
tip      = "He hoses out trailers in the bay midday. There is no door on the bay."
when     = [ { flag = "met_isaac", subject = "player", op = "is_true" },
             { trait = "want", subject = "npc", npc_id = "npc_isaac", op = "lt", value = 38 } ]
goals    = [ { trait = "want", subject = "npc", npc_id = "npc_isaac", op = "gte", value = 38, label = "Get clean in the bay while he is working it — midday" } ]

[[quest_cards]]
