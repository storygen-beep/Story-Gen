priority = 30
npc_id   = "npc_tobin"
text     = "Your brother. You got him the job and he took it, and he is the only person on this property who knew you before there was a title to say. He has not called you Mrs. Vance once."
tip      = "He walks the back row last thing at night, on his own, checking the parked trucks."
