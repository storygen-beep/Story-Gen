# =============================================================================
# Mrs. Vance — 1_metadata_and_locations
#
# ⚠️ [player], [[locations]], [[npcs]] and [[npcs.schedules]] MUST share this
#    one file. TOML scoping re-parents nested tables across a file boundary, and
#    [[npcs.schedules]] binds to the [[npcs]] block ABOVE it — inserting a
#    character between an existing one and its schedules silently re-parents.
#
# THE MAP — archetype `nested_zones` (the-map.md R0, board.map.archetype).
# The exterior is the GROUND and it is a ROOT: `the_yard` carries no entry_from.
# Gate 28 reads that field and fails a leaf. The measured failure was a game
# whose outside hung off the kitchen — you stepped out of a kitchen straight
# into a row of shops. Here the world contains the house, not the reverse.
#
#   THE YARD   (root · gravel between the house and the shop · the county road)
#   ├── Office              ANCHOR
#   │   └── Sherrod's Room      (up the outside stairs)
#   ├── Shop Floor
#   │   ├── Bunk Room           (over the shop)
#   │   └── Wash Bay
#   ├── Kitchen                 (the back door of the house opens into it)
#   │   ├── Your Room
#   │   ├── Bathroom
#   │   └── Booth's Room
#   ├── Back Row            (+5 min · the far end)
#   └── Kerr Crossing       (+20 min · clean >= 35 to take the truck)
#       ├── Bank
#       └── Bar
#
# ⚠️ TRAVEL FRICTION SITS ON THE BRIDGES, never on every room. With free instant
#    travel a schedule grid is a lookup table; charge twenty minutes each way
#    and being in two places stops being free, which is the entire point of
#    having authored a schedule at all (§22).
#
# ANCHOR = the_office, budgeted at 4,500 of 16,000 = 28% (floor 25%, gate 1).
# It is re-enterable at every hour. The measured failure was an anchor at 29%
# sealed in a room with no exits, and the anchor's SHARE falls as the world
# fills — budget it against the finished total, not the current one.
#
# Location names are UI (the-voice.md R1): bare plain noun for a public place,
# possessive for a private one, and every one of them ran through
# `gates.py --words` before it was written. Nothing here is The Box Room.
# =============================================================================

[player]
id           = "player"
name         = "Rilla"
description  = "Twenty-seven, and eleven weeks married to a man who owns a diesel yard and is on the road four nights out of seven. She signed a paper before the wedding that says nothing here is hers for three years."
customizable = false

[player.core_traits]
# NO ASCENT TIER. who_climbs = "cast" — the six ladders live on the [[npcs]]
# blocks below as `subject = "npc"` meters. board.ascent_tiers = [].

# The audience meter (W5b). Rises. Read constantly, refuses almost nothing.
standing  = 0

# The throttle (W2) — gates the FINISH link on the act loops and nothing else.
arousal   = 0

# ⚠️ THE BODY STARTS BELOW ITS OWN GATES. A meter whose starting value already
#    clears its own threshold is free in zero clicks (gate 26). `clean` gates the
#    counter at 40 and the truck at 35; she opens the game at 30, so the first
#    Monday is a real choice between getting clean and getting on with it.
energy    = 55
clean     = 30

# ⚠️ money is a QUANTITY, not a 0-100 meter. EVERY effect that writes it carries
#    `clamp = false` (§21). Clamped it caps at 100, the 260 Friday count becomes
#    unpayable, and the eviction branch is the only reachable outcome — with the
#    TOML valid, the validator quiet, the build green and the scoreboard clean
#    the whole way down.
money     = 18

# Loop state — hidden numeric traits, never flags (§16). Stage COUNTERS, set to
# distinct integers and read eq/gte/lt: the field's commonest gate shape and the
# one our v2 games build least (the-surfaces.md R5d).
loop_stage = 0
loop_act   = 0

# ⚠️ Decay is a POSITIVE MAGNITUDE — the validator rejects a negative (§11).
[player.trait_decay]
energy = 22
clean  = 18


# =============================================================================
# LOCATIONS — 14, derived from needs + work + people inside the chosen shape,
# not picked. Budgets are declared in v2_state.json board.locations[].fill, in
# round numbers, BEFORE the prose.
# =============================================================================

# ── THE GROUND. Root: no entry_from. ─────────────────────────────────────────
[[locations]]
id                   = "the_yard"
name                 = "Yard"
description          = "Gravel from the back step of the house to the roller door of the shop, wide enough to turn a rig on and graded so the water runs off toward the road. A pole light on a timer, a skip, a stack of split tires nobody has moved in a year. The county road goes past the gate and everything on this property opens onto this."
image                = "locations/the_yard.jpg"
image_search_queries = ["truck repair yard gravel lot night pole light", "rural diesel shop yard parked semi trucks dusk"]
navigation_order     = ["the_office", "the_shop_floor", "the_kitchen", "the_back_row", "kerr_crossing"]

# ── ANCHOR. The one room both worlds touch. ─────────────────────────────────
[[locations]]
id                   = "the_office"
name                 = "Office"
description          = "A counter at the front for drivers and a desk at the back for the book, with a gate in the counter you have to lift to get between them. Job sheets on a spike, a filing cabinet with the third drawer locked, and the cash drawer under the till side that you are responsible for and cannot spend out of. There is a window onto the shop floor so whoever is in here can be seen from in there, and the other way round."
image                = "locations/the_office.jpg"
image_search_queries = ["truck repair shop front office counter paperwork", "small garage office desk ledger cash drawer"]
navigation_order     = ["sherrods_room"]
entry_from           = "the_yard"

[[locations]]
id                   = "the_shop_floor"
name                 = "Shop Floor"
description          = "Four bays, three of them with something over a pit, and a parts wall that runs the whole back. It is loud from eight and it smells of diesel and hot metal and the orange soap by the sink. Everybody who works here is in here at some point in the day, which makes it the one room on the property where nobody is ever alone."
image                = "locations/the_shop_floor.jpg"
image_search_queries = ["heavy truck repair shop interior bays lift", "diesel mechanic garage parts wall workshop"]
navigation_order     = ["the_bunk_room", "the_wash_bay"]
entry_from           = "the_yard"

[[locations]]
id                   = "the_wash_bay"
name                 = "Wash Bay"
description          = "Concrete, a floor drain in the middle, and a hose on a reel that will strip paint if you get the trigger wrong. It is the last bay on the end and it has no door — just the opening onto the yard, and the window onto the shop floor at the other side, and a curtain track with no curtain on it."
image                = "locations/the_wash_bay.jpg"
image_search_queries = ["truck wash bay concrete hose reel drain", "commercial vehicle wash bay interior wet floor"]
navigation_order     = []
entry_from           = "the_shop_floor"

[[locations]]
id                   = "the_bunk_room"
name                 = "Bunk Room"
description          = "Up the inside stairs over the shop. Two beds, a plywood partition that stops short of the ceiling, a window looking down onto the yard, and a radio that stays on whether anybody is listening or not. The floor is the shop's ceiling, so you can hear the compressor cut in through it."
image                = "locations/the_bunk_room.jpg"
image_search_queries = ["bunk room above garage two beds bare", "worker sleeping quarters shop loft plywood"]
navigation_order     = []
entry_from           = "the_shop_floor"

[[locations]]
id                   = "the_back_row"
name                 = "Back Row"
description          = "Past the skip and the split tires, where the trucks park overnight — six spaces, angled, most of them with a bed behind the seats and a man asleep in it or nobody at all. The pole light does not reach this far and the road is on the other side of a hedge. It is the last place on the property anybody looks."
image                = "locations/the_back_row.jpg"
image_search_queries = ["parked semi trucks row night dark lot", "truck stop overnight parking dark cab lights"]
navigation_order     = []
entry_from           = "the_yard"
costs                = { time = 5 }

[[locations]]
id                   = "sherrods_room"
name                 = "Sherrod's Room"
description          = "Up the outside stairs on the gable end of the office, one room and a sink. He has been in it longer than you have been a Vance and there is nothing in it that says he expects to leave."
image                = "locations/sherrods_room.jpg"
image_search_queries = ["single room above garage stairs sparse bed", "small rented room over workshop window"]
navigation_order     = []
entry_from           = "the_office"

# ── THE HOUSE. Its back door opens onto the yard. ───────────────────────────
[[locations]]
id                   = "the_kitchen"
name                 = "Kitchen"
description          = "The back door off the yard opens straight into it, so everybody who comes in comes in here first and most of them do not take their boots off. A table for six, a water heater on the wall that has to be switched on twenty minutes before anybody wants anything, and a window over the sink that looks at the shop."
image                = "locations/the_kitchen.jpg"
image_search_queries = ["farmhouse kitchen worn table back door boots", "rural working kitchen table window over sink"]
navigation_order     = ["your_room", "the_bathroom", "booths_room"]
entry_from           = "the_yard"

[[locations]]
id                   = "your_room"
name                 = "Your Room"
description          = "His and yours, and it was his before it was yours — the wardrobe is full of a dead woman's coat hangers and nobody has ever said what happened to what was on them. The bed faces the window and the window faces the yard, so you can see whose truck is in it without getting up."
image                = "locations/your_room.jpg"
image_search_queries = ["farmhouse bedroom window over yard plain", "rural bedroom old wardrobe morning light"]
navigation_order     = []
entry_from           = "the_kitchen"

[[locations]]
id                   = "the_bathroom"
name                 = "Bathroom"
description          = "One of them, for five adults, at the end of the landing. The bolt does not sit in its keeper any more and everybody in the house knows it and everybody in the house knocks anyway, most of the time."
image                = "locations/the_bathroom.jpg"
image_search_queries = ["old small bathroom tub tiles worn", "plain rural bathroom door bolt"]
navigation_order     = []
entry_from           = "the_kitchen"

[[locations]]
id                   = "booths_room"
name                 = "Booth's Room"
description          = "The smallest one, over the kitchen, warm because the water heater backs onto its wall. A television on a chair, a wardrobe door that does not shut, and a nineteen-year-old in it who has no reason to get up in the morning and knows it."
image                = "locations/booths_room.jpg"
image_search_queries = ["teenage boy bedroom small messy television", "small upstairs bedroom cluttered chair"]
navigation_order     = []
entry_from           = "the_kitchen"

# ── DOWN THE ROAD. The bridge, and the only ground nobody here owns. ────────
#
# ⚠️ entry_conditions carry `version = "1.0"` or they FAIL OPEN and the door
#    silently unlocks (§2, §22). This is one of the two doors `clean` shuts —
#    declared in board.needs[], gate 29.
[[locations]]
id                   = "kerr_crossing"
name                 = "Kerr Crossing"
description          = "Twenty minutes of county road and then four ways, a light that flashes amber after ten, two pumps and a canopy. There is a bank on one corner and a bar on the other and about forty people who do not work for your husband."
image                = "locations/kerr_crossing.jpg"
image_search_queries = ["rural crossroads gas station canopy dusk", "small town four way stop amber light night"]
navigation_order     = ["the_bank", "the_bar"]
entry_from           = "the_yard"
costs                = { time = 20 }
entry_conditions     = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "clean", operator = "gte", value = 35 },
] }
blocked_message      = "Not like this. It is twenty minutes in a truck with the windows up and then a lit forecourt with people on it."

[[locations]]
id                   = "the_bank"
name                 = "Bank"
description          = "One counter, two chairs and a woman called Dee who has known the Vance account since before you were on the paperwork, which you are not."
image                = "locations/the_bank.jpg"
image_search_queries = ["small town bank branch interior counter", "rural bank teller window quiet"]
navigation_order     = []
entry_from           = "kerr_crossing"

[[locations]]
id                   = "the_bar"
name                 = "Bar"
description          = "Dark at four in the afternoon, a pool table nobody uses, and a row of stools where men who have finished sit until they have to go home. The yard drinks here, so it is not as far from the yard as the twenty minutes make it sound."
image                = "locations/the_bar.jpg"
image_search_queries = ["small rural bar dim interior stools", "roadhouse dive bar pool table dark"]
navigation_order     = []
entry_from           = "kerr_crossing"


# =============================================================================
# THE CAST — six, and every one of them owns a different corner of the world
# and a place and an hour where he is the only one in it (the-surfaces.md R8).
#
# ⚠️ THE SCHEDULE IS WHERE R8 GETS TAKEN BACK. the_season passed the writing
#    half — every man had his own subject — and then put all four of them in the
#    camp 19:00-00:30 every night, so none of them ever got to be a particular
#    man. Bucket every row by (location, start, end) and read the ones with more
#    than one name in them. Here the Shop Floor is DELIBERATELY the crowded room
#    and everybody else has somewhere that is theirs:
#      Cade      Office 06:30-09:00, and the Bar Friday/Saturday
#      Isaac     Wash Bay 11:00-14:00
#      Tobin     Back Row 22:00-00:30
#      Booth     Kitchen 16:00-19:00, his own room after ten
#      Sherrod   Office 20:30-23:00, his room after
#      Dorn      Kitchen weekend evenings — and gone Monday to Thursday
#
# ⚠️ AN OVERNIGHT WINDOW IS ONE ROW ONLY IF IT COVERS EVERY WEEKDAY. The wrap
#    works (isCurrentTimeSlot, v2.py:3784) but the WEEKDAY check runs first and
#    against TODAY (v2.py:3446). So `[4,5] 21:00-00:30` puts Cade in the bar on
#    Friday night and DELETES him at midnight, because Saturday is not Friday.
#    Day-specific overnight windows are split into two rows below; the all-days
#    ones (Isaac, Tobin, Booth, Sherrod) are correctly one row each.
#
# ⚠️ `description` is popped before $npcs ships (v2.py:1031) — it is an author
#    note the player never sees. `relationship` is the ONLY NPC string that
#    survives to runtime, and it is what the cast page prints. `tags` is capped
#    at four and a fifth is REJECTED at import: four words are a character
#    sketch, six are a stat block.
#
# ⚠️ ONE willingness word — `want` — on all six, same scale (W6). `trust` is on
#    Cade and Booth only: the rich model is reserved for the one or two arcs
#    that carry the game, and gold-plating every character dilutes the core and
#    triples the authoring.
# =============================================================================

