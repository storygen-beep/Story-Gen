# The anchor gets budgeted against the FINISHED total, not the current one — a
# ratio gate cannot be satisfied by working elsewhere, and the measured case
# watched a front room fall 53% -> 35% without one word being removed from it.
[[canvases]]
id   = "amb_office_wrecker"
name = "The wrecker goes out"

[canvases.trigger]
location             = "the_office"
priority             = 3
is_repeatable        = true
trigger_mode         = "random"
max_triggers_per_day = 1
chance               = 0.26

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "paragraph", content = "The phone goes in the small hours, and it goes in the office. It comes through the wall into your room." },
  { type = "paragraph", content = "You are down the stairs and across the yard in a coat and boots before you have decided to be. The office is cold and the desk lamp is the only thing on." },
  { type = "dialog", props = { speaker = "unknown" }, content = "Vance Diesel?" },
  { type = "dialog", props = { speaker = "player" }, content = "Go on." },
  { type = "dialog", props = { speaker = "unknown" }, content = "There's a rig off the road at the Kerr junction. Rear axle's in the ditch. He's out of hours and he's on the phone crying." },
  { type = "paragraph", content = "You write the plate down, and the junction, and the time, and you are still writing when the door goes behind you." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "Who is it." },
  { type = "paragraph", content = "He is dressed. He has come from somewhere that is not a bed and he does not say where and you do not ask." },
  { type = "dialog", props = { speaker = "player" }, content = "Kerr junction. Rear axle. He's out of hours." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "Plate?" },
  { type = "paragraph", content = "You turn the book round so it faces him, the way he turns it round to face you on a Friday. He reads it upside down anyway and goes for the wrecker keys." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "Log it as a callout. Two hours minimum, whatever it takes." },
  { type = "dialog", props = { speaker = "player" }, content = "I know what a callout is." },
  { type = "paragraph", content = "He stops in the doorway with the keys in his hand. It is the first thing you have said to him that he has had to stand still for." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "You do." },
  { type = "paragraph", content = "The wrecker starts outside and the whole office goes yellow and then dark again as it swings out through the gate. You are on your own in it at twenty past two with the book open." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Nobody rang Dorn. It is his yard and his phone and his name on the door, and the call came in and neither of you thought about it." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Wait up for the wrecker to come back. (2h)"
targetType               = "location"
locationId               = "the_office"
time_progression_minutes = 120
costs                    = [ { trait = "energy", value = 12 } ]
effects = [
  { targetType = "npc", npcId = "npc_cade", trait = "trust", op = "add", value = 5, cap = 100 },
  { targetType = "player", trait = "standing", op = "add", value = 4, cap = 100 },
]

[[canvases.nodes.exit_block.choices]]
text                     = "Go back to bed."
targetType               = "location"
locationId               = "your_room"
time_progression_minutes = 15


[[canvases]]
id   = "amb_bunk_radio"
name = "The radio through the floor"

[canvases.trigger]
location             = "the_bunk_room"
priority             = 3
requires_npc  = "npc_isaac"
is_repeatable        = true
trigger_mode         = "random"
max_triggers_per_day = 1
chance               = 0.26

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "paragraph", content = "The radio has been on in this room since before you were a Vance and nobody knows what station it is." },
  { type = "dialog", props = { speaker = "player" }, content = "Does that ever go off?" },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_isaac" }, content = "No." },
  { type = "paragraph", content = "He is on his bed with one arm behind his head and he has not looked over since you came up the stairs." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_isaac" }, content = "It was on when I moved in." },
  { type = "dialog", props = { speaker = "player" }, content = "That was six years ago." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_isaac" }, content = "Yeah." },
  { type = "paragraph", content = "The compressor cuts in under the floorboards and the whole room takes it. He waits for it to stop before he says the next thing, the way he always does." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_isaac" }, content = "You can turn it off if you want." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Turn it off and see what he does."
targetType               = "location"
locationId               = "the_bunk_room"
time_progression_minutes = 20
effects = [
  { targetType = "npc", npcId = "npc_isaac", trait = "want", op = "add", value = 3, cap = 100 },
  { targetType = "player", trait = "arousal", op = "add", value = 6, cap = 100 },
]

[[canvases.nodes.exit_block.choices]]
text                     = "Leave it on."
targetType               = "location"
locationId               = "the_bunk_room"
time_progression_minutes = 15
