name = "The phone at half four"

# Dorn is on the telephone from a lay-by, so he must NOT be here; Cade is fetched
# from bay two at the end of the scene, so he must be on the shop floor. Two NPCs
# and one of them by absence — `requires_npc` binds exactly one and has no absence
# form, so this is the npc_at_location case (engine.md:561, §20).
