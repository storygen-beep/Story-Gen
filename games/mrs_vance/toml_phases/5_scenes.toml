[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "dialog", props = { speaker = "unknown" }, content = "You'll be Dorn's, then." },
  { type = "paragraph", content = "Dee has been on that counter twenty years. She says it kindly." },
  { type = "dialog", props = { speaker = "player" }, content = "I keep the books for the yard." },
  { type = "dialog", props = { speaker = "unknown" }, content = "That's lovely. And you're not on the account." },
  { type = "dialog", props = { speaker = "player" }, content = "No." },
  { type = "dialog", props = { speaker = "unknown" }, content = "No. Well. Three years goes quicker than you'd think, love." },
  { type = "paragraph", content = "She knows about the paper. Everybody at this crossroads knows about the paper." },
  # Four rungs on `standing`, and they are ONE if/elseif chain -- adjacent [group]
  # blocks merge, so highest-first and every middle arm carries its ceiling or the
  # arm above it never fires. This is `WANT.md` §3's "the bank clerk's tone": the
  # facts of the account never move, only how Dee says them. At the bottom she is
  # kind to a woman who will not be here long; at the top she breaks a small rule
  # for a woman she expects to be signing.
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "standing", operator = "gte", value = 70 }, ] }, blocks = [ { type = "paragraph", content = "Dee turns the screen a few degrees so you can see the figure, which she is not supposed to do, and she says your name with no husband in front of it, and the woman behind you does not lean in." } ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "standing", operator = "gte", value = 40 }, { type = "trait", subject = "player", trait_key = "standing", operator = "lt",  value = 70 }, ] }, blocks = [ { type = "paragraph", content = "Dee asks what the yard needs this month before she asks anything about Dorn, and she waits with her hand off the keyboard for you to answer it, which is not the order she used to do it in." } ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "standing", operator = "gte", value = 15 }, { type = "trait", subject = "player", trait_key = "standing", operator = "lt",  value = 40 }, ] }, blocks = [ { type = "paragraph", content = "Dee says Mrs. Vance when she greets you and love when she finishes, both inside two minutes, and does not appear to notice she has done both, and she writes the yard's number on the slip without asking you for it." } ] },
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "standing", operator = "lt", value = 15 }, ] }, blocks = [ { type = "paragraph", content = "Dee writes Dorn's name on the slip before you have said which account, and she does it kindly, the way you are kind to somebody at a counter who will not be here long." } ] },
]

