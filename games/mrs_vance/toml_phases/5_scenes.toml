# ⚠️ EVERY ONE DECLARES A `location`. setup.getCanvasById builds its lookup ONLY
#    from help_data.locationCanvases (v2.py:3177-3191), populated only for
#    canvases carrying trigger.location. A triggerless substitution target
#    SILENTLY NEVER FIRES — no error, no red build.
# ⚠️ `substitution_only = true` keeps them OUT of the room's list (v2.py:4523).
# ⚠️ THE BRANCH IS THIN. Vesper's is 2.3 KB; DoL's are 458-473 bytes. The target
#    is a tier band of one or two paragraphs plus a media pool — the same 35-40
#    words per beat as everything else, not a scene. Writing a full encounter
#    every time is how this rule dies.
