[[canvases]]
id   = "amb_sherrod_owed"
name = "Everybody is owed something"

[canvases.trigger]
location             = "sherrods_room"
priority             = 3
requires_npc  = "npc_sherrod"
is_repeatable        = true
trigger_mode         = "random"
max_triggers_per_day = 1
chance               = 0.28

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_sherrod" }, content = "Cade's owed the yard. He'll get it and he knows he'll get it, so he's patient." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_sherrod" }, content = "Isaac's owed nothing and doesn't want anything, which makes him the only free man on this property." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_sherrod" }, content = "Booth's owed a start. Nobody's giving him one." },
  { type = "dialog", props = { speaker = "player" }, content = "And you." },
  { type = "paragraph", content = "He turns the lamp down a quarter, which he has not done before, and the yard through the window gets brighter for it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_sherrod" }, content = "Nineteen years and a room over an office, girl. You work it out." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
