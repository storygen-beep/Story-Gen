# =============================================================================
# Mrs. Vance — 5_scenes  ·  HUBS · TALK · WALK-INS · THE TRAVERSAL LAYER
#
# R1 · ONE CANVAS PER (WHO IT IS AIMED AT x WHEN). Work never goes inside a
#      character's hub. The 23-choice failure had a hub binding NO NPC at all and
#      not one of its choices had a person as the object of the verb.
# S4 · THE TALK SCREEN IS A CONTENT KIND, NOT A GARNISH — 15,774 of the field's
#      54,630 screens, 29%. Ours: vesper 26%, and every v2 game at 0-5%. It is
#      the cheapest content there is and it is where a character becomes someone
#      the player is attached to, which outscored praise for the porn itself
#      across ~11,000 comments.
# S3 · SOMEBODY SPEAKS. Field median 2.93:1 narration to dialogue; every v2 game
#      sits beyond the worst dialogue-bearing game in the corpus, and
#      the_allowance ships 216 spoken words in the whole game.
#      ⚠️ ONE TERM OF ADDRESS PER PERSON and nobody else uses it. Cade says
#      "Mrs. Vance", Booth says "Mrs. V" once he cracks, Sherrod says "girl",
#      Isaac says nothing at all, Tobin says "Rilla". the_season shipped 56 NPC
#      lines and only one character ever addressed the protagonist.
# R6 · THE SCREEN MOVES ON RE-ENTRY — BUT THE OPENER DOES NOT. Six visits to the
#      reference game's cafe render a byte-identical identity sentence. The
#      variation is `block_pool` inside the beat (mechanism 5), a presence line
#      per NPC, the choice list itself, and a random event replacing the screen.
#      Tiering a hub opener per stat band is a known failure — it reads as N
#      different scenes instead of one escalating hub.
# =============================================================================


# ═════════════════════════════════════════════════════════════════════════════
