name     = "Sleep"

[canvases.trigger]
priority      = 20
location             = "your_room"
is_repeatable        = true
max_triggers_per_day = 1
show_when_blocked = true
cooldown_message  = "from nine at night, once a night"

[[canvases.trigger.schedules]]
