# ── S1b · `standing` DELIVERS PEOPLE.  The nameless walk-ins -- the driver, the
#    watcher at the glass, the man down the shop, the light in the cab -- are the
#    audience, and `standing` is the audience meter. The named men run on trust and
#    want and are untouched here. Below `standing` 40 the title is not holding
#    ("The new wife" / "Mrs. Vance, to your face") and the strangers come more often.
