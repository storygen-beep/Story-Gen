# ══════════════════════════════════════════════════════════════════
# Phase: 3_activities.toml
# ══════════════════════════════════════════════════════════════════

# =============================================================================
# Mrs. Vance — 3_activities  ·  THE STANDING SURFACES
#
# R2 · A ROOM'S LIST IS NEEDS + WORK + PEOPLE, and nothing else. A body needs
#      about five things and a room contains fifty nouns: needs are a CLOSED
#      list, objects are an open one, so the count sizes itself. The previous
#      rule — declare the objects and hang a choice off each — shipped a kitchen
#      offering five buttons, three of which had a free duplicate inside the
#      first. People are hubs and they live in 5_scenes.
# R3 · THE WALK-IN. Where walk-ins come from is a JOIN, not a judgement: cross
#      the solo activities at a location against the [[npcs.schedules]] rows at
#      that same location. She hoses off in the bay 11:00-14:00 and Isaac is in
#      the bay 11:00-14:00 — someone can walk in on her. Nobody decides that; it
#      is already true in the board.
#      ⚠️ EVERY substitution target declares a `location`. getCanvasById builds
#      its lookup ONLY from help_data.locationCanvases (v2.py:3177-3191), which
#      is populated only for canvases carrying trigger.location. Point a
#      substitution at a triggerless rung and it SILENTLY NEVER FIRES.
#      ⚠️ Pattern B (`exclusive_group`) — ONE roll split into cumulative
#      buckets, so the odds you wrote are the odds that run (v2.py:5361-5379).
#      Pattern A compounds. And Pattern B falls through to the HOST, never to
#      the next bucket, so a gated bucket gives its share back to the room.
# R7 · EVERY SCREEN KEEPS ONE DOOR. A choice whose conditions fail renders
#      NOTHING (v2.py:12806), and a COST-BEARING choice counts as conditional
#      too (v2.py:12827-12836) — so a screen whose only affordance costs $2 is
#      exactly as empty at $0 as a spent hub is. Every screen below has one
#      choice with neither `conditions` nor `costs`.
# M5 · A DAY-CAP FLAG GOES ON THE CHOICE, never on a rung's exit. A choice runs
#      flagEffects BEFORE advanceTime; an exit runs advanceTime FIRST, and
#      advanceTime is where the day rolls and the tick clears. off_season's
#      sleep rung ran 21:00->06:00 with the flag on the exit and was never
#      offered before midnight again from night two.
#      ⚠️ A LOCATED canvas needs no flag: max_triggers_per_day is read off the
#      trigger and markCanvasTriggered stamps the day key BEFORE advanceTime.
# C4 · A LABEL THAT SPENDS THE CLOCK SAYS HOW MUCH, in one form, and the stated
#      duration is the real spend. C3 · a label may never name a CLOCK TIME —
#      the engine has no absolute-time advance at all (v2.py, 0 hits).
# C5 · IF A THING HAS HOURS, PUBLISH THEM. `show_when_blocked` +
#      `cooldown_message` keep a closed activity as a dimmed line carrying the
#      author's words instead of dropping it (v2.py:11055, :5143). One game in
#      the repo uses it. Lostness, not grind, is this genre's disease.
# =============================================================================


