# ═════════════════════════════════════════════════════════════════════════════
# THE HUBS — one per (person x place). EVERY ONE SITS BEHIND A MEETING.
#
# ⚠️ THE FORBIDDEN SHAPE is a repeatable canvas with `npc =` set whose base node
#    IS the introduction. All six v2 games shipped it for their entire cast.
#    A hub with NO conditions at all puts that character's portrait on a location
#    screen from turn one however well the FIRST hub is gated.
# ⚠️ ONE FLAG PER CHARACTER (F8). `arrival_done` opening four hubs is the
#    cold-spawn hub in a coat, and three of six v2 games shipped exactly that.
#    A later hub gated on something DOWNSTREAM of the meeting is correct work.
# ⚠️ THE OPENER IS CONSTANT. Variation is `block_pool` inside the beat, and the
#    choice list. Tiering a hub opener per stat band reads as N different scenes
#    rather than one escalating hub.
# ⚠️ THE OBJECT TEST — a hub choice has a PERSON as the object of the verb.
#    "Count the till" is work and work is its own surface at that location.
# ⚠️ THE CAP IS PER PERSON AND THE HUBS ARE PER ROOM. `cade_rung_today` is shared
#    across all of Cade's hubs on purpose — spending it in the office empties the
#    bar for the night. Every one of those screens therefore keeps a choice free
#    of BOTH conditions and costs (R7, gate 37), or a spent day renders nothing
#    at all and the player cannot tell it from a broken build.
# ═════════════════════════════════════════════════════════════════════════════

