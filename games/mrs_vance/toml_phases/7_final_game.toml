[[canvases]]
id   = "talk_sherrod"
name = "Sherrod, talking"

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_sherrod" }, content = "This was two bays and a tow truck when I came. Everything in here older than fifteen years, I can tell you where it came from and what we didn't pay for it." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_sherrod" }, content = "The first one, she did the book as well. Sat in that chair. He's not a man who has many ideas, girl, he just has the one twice." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_sherrod" }, content = "Nine months back he asked me what I thought. I told him what I thought. I've not been asked since and I've not offered." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_sherrod" }, content = "Everybody on this yard is owed something by somebody. It's the only thing holds it together. You'll work out where you sit in that." },
  ] },
  { type = "paragraph", content = "He does not move the lamp back. He tells you the whole thing looking at you rather than at the drawer he has open, and he is in no hurry to stop." },
]

[canvases.nodes.exit_block]
