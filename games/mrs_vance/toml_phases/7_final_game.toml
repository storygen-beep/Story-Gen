# THE SECOND PASS — dispatch depth, and the rooms that were still thin.
#
# `lint · dispatch depth` measures how many different things one activity can
# turn into: three to five outcomes per host is the shape, ONE is a coin flip.
# Measured across this repo, every host in three of seven dispatching games
# could produce exactly one outcome, so the roll only ever decided whether the
# branch or the room rendered.
