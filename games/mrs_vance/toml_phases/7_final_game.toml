# THE ROOM EVENTS — mechanism 4 again, and this time carrying the speech.
#
# S3 · Field median is 2.93 : 1 narration to dialogue and TEN of 27 games sit at
#      or under 2 : 1. Every v2 game sits beyond the worst dialogue-bearing game
#      in the corpus; the_allowance ships 216 spoken words in its entire run and
#      seventh_day 410. The instrument that retired v1's dialogue rule counted
