# Phase: 6_dev_shortcuts.toml
# ══════════════════════════════════════════════════════════════════

# =============================================================================
# Mrs. Vance — 6_dev_shortcuts
#
# ONE dev screen with one choice per sex loop. Each choice arms the state that
# loop needs and jumps straight into its entry node, so R1's block_pools can be
# exercised without playing an arc up to them.
#
# HOW THE ENGINE TREATS THIS (read, not assumed):
#   · a canvas is a DEV SHORTCUT iff its trigger conditions contain
#     `dev_mode_enabled is_true`. That condition is a MARKER, not a gate
#     (v2.py:8472-8490 strips them from a shipped build).
#   · `dev_mode_enabled` is set at StoryInit ONLY in `--dev` builds
#     (v2.py:1074-1077). No canvas sets it and none should.
#   · the sidebar `<<devJumps>>` widget reaches dev canvases by direct
#     Engine.play, so this is one click from anywhere.
#   · the flag-chain validator and the quest-hint index both skip dev canvases.
#   · this whole FILE is dropped by `merge_toml_phases.py --no-dev`
#     (`DEV_PHASE`, merge_toml_phases.py:62) — it cannot reach a release build.
#
# ⚠️ seventh_day's copy of this header says gates.py has NO dev-canvas handling
#    and therefore brakes every choice with a 1-energy cost and a daily cap.
#    THAT IS NO LONGER TRUE: `_is_dev()` exists at gates.py:2509 and is consulted
#    in six places, so a dev screen is already excluded from the economy, act-menu
#    and decision-count checks. No artificial braking here. Verified by running
#    the scoreboard before and after this file existed — 40/40 either way.
#
# ⚠️ SIX choices, not more. Gate 20 counts decisions on a repeatable
#    location-bound canvas and its backstop is 8.
#
# ⚠️ The loops are TRIGGERLESS — reached by `targetType = "node"` from a hub rung
#    (hub_cade_office's "Lock the office from the inside." is the shape copied
#    here). They are not bound to a location, so jumping in needs no presence,
#    no schedule and no hour.
#
# WHAT EACH CHOICE SETS, and why:
#   arousal = 55   the finish rung needs 60 and the act rungs add 14-18, so one
#                  act click opens the finisher. Leaving it at 0 would make
#                  testing a finisher a five-click errand.
#   loop_stage/act = 0   a clean entry every time; act_desk needs loop_stage 2.
#   want / trust   set past every rung gate in that character's ladder.
#   met_*          keeps the cast page and quest cards coherent with the jump.
# =============================================================================

[[canvases]]
id          = "dev_loops"
name        = "[DEV] Jump into a sex loop"
description = "Dev-only. Arms the state each loop needs and drops straight into its entry node, for testing the block_pool variants (REVIEW.md R1)."

[canvases.trigger]
# ⚠️ `the_bank`, not `the_yard`, and it MUST have a location.
#    Dropping the location entirely was tried first: a triggerless canvas that
#    nothing references by node is never emitted at all (the generator only
#    generates triggerless canvases pulled in by the closure pass), so the jump
#    vanished from the build. It needs one.
#    the_bank is the only location with a solo-ish canvas that has ZERO scheduled
#    characters (the others are the_bathroom and kerr_crossing) — and `the walk-in
#    floor` fails a room that has a solo activity AND scheduled characters and no
#    walk-in, so putting a dev screen in the yard failed that room for it.
location             = "the_bank"
is_repeatable        = true
max_triggers_per_day = 1
priority             = 1
is_active            = true
conditions           = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "dev_mode_enabled", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "[DEV] Jump into a sex loop"
blocks = [
  { type = "paragraph", content = "[DEV] Each choice sets arousal to 55, zeroes loop_stage and loop_act, pushes that character's meters past every rung gate, and jumps to the loop's entry node. Click an act rung repeatedly to see its block_pool cycle; the finisher opens after one act click." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "[DEV] Cade — the office, three acts and a three-band finisher"
targetType = "node"
nodeId     = "loop_cade.entry"
costs      = [ { trait = "energy", value = 1 } ]
effects = [
  { targetType = "player", trait = "arousal",    op = "set", value = 55 },
  { targetType = "player", trait = "loop_stage", op = "set", value = 0 },
  { targetType = "player", trait = "loop_act",   op = "set", value = 0 },
  { targetType = "npc", npcId = "npc_cade", trait = "want",  op = "set", value = 60 },
  { targetType = "npc", npcId = "npc_cade", trait = "trust", op = "set", value = 40 },
]
flagEffects = [ { targetType = "player", flag = "met_cade", op = "set" } ]

