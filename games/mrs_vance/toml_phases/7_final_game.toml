# =============================================================================
# THE CAST — six, and every one of them owns a different corner of the world
# and a place and an hour where he is the only one in it (the-surfaces.md R8).
#
# ⚠️ THE SCHEDULE IS WHERE R8 GETS TAKEN BACK. the_season passed the writing
#    half — every man had his own subject — and then put all four of them in the
#    camp 19:00-00:30 every night, so none of them ever got to be a particular
#    man. Bucket every row by (location, start, end) and read the ones with more
#    than one name in them. Here the Shop Floor is DELIBERATELY the crowded room
#    and everybody else has somewhere that is theirs:
#      Cade      Office 06:30-09:00, and the Bar Friday/Saturday
#      Isaac     Wash Bay 11:00-14:00
#      Tobin     Back Row 22:00-00:30
#      Booth     Kitchen 16:00-19:00, his own room after ten
#      Sherrod   Office 20:30-23:00, his room after
#      Dorn      Kitchen weekend evenings — and gone Monday to Thursday
#
# ⚠️ AN OVERNIGHT WINDOW IS ONE ROW ONLY IF IT COVERS EVERY WEEKDAY. The wrap
#    works (isCurrentTimeSlot, v2.py:3784) but the WEEKDAY check runs first and
#    against TODAY (v2.py:3446). So `[4,5] 21:00-00:30` puts Cade in the bar on
#    Friday night and DELETES him at midnight, because Saturday is not Friday.
#    Day-specific overnight windows are split into two rows below; the all-days
#    ones (Isaac, Tobin, Booth, Sherrod) are correctly one row each.
#
# ⚠️ `description` is popped before $npcs ships (v2.py:1031) — it is an author
#    note the player never sees. `relationship` is the ONLY NPC string that
#    survives to runtime, and it is what the cast page prints. `tags` is capped
#    at four and a fifth is REJECTED at import: four words are a character
#    sketch, six are a stat block.
#
# ⚠️ ONE willingness word — `want` — on all six, same scale (W6). `trust` is on
#    Cade and Booth only: the rich model is reserved for the one or two arcs
#    that carry the game, and gold-plating every character dilutes the core and
#    triples the authoring.
# =============================================================================


[[locations.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_bar", operator = "is_present" },
] }
text = "Dark in the afternoon, a pool table nobody uses, and men on the stools who finished at the yard and have not gone home. Every one of them either works for your husband or sells to him. Whatever you do at this end of the bar is back at the yard before you are."

[[npcs]]
id           = "npc_cade"
name         = "Cade"
relationship = "Your husband's eldest, 29. He runs the yard, he signs what you write down, and he is two years older than you."
description  = "AUTHOR NOTE. Never pretended the marriage was ordinary — he is the only one who said something at the wedding and what he said was arithmetic. His subject is what a job is worth and who owes what; his offscreen people are the drivers on account and his father on the phone. He does not raise his voice, ever. His ceiling is the highest in the game and he opens crude."
portrait     = "cade.jpg"
tags         = ["The book", "What it's worth", "Never louder", "Black coffee"]
core_traits  = { want = 0, trust = 0 }
arc_stages   = ["Signs you in", "Hands you the keys", "Shuts the door", "Stops asking"]

[[npcs.schedules]]
location   = "the_office"
weekdays   = [0, 1, 2, 3, 4]
start_time = "06:30"
end_time   = "09:00"
activity   = "at the desk with the job sheets, before anybody else is up"

