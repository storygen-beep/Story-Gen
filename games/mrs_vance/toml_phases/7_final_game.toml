# THE TRAVERSAL LAYER — R6 mechanism 4, the one games actually drop.
#
# `trigger_mode = "random"` is the only one of the four mechanisms that can
# replace the WHOLE SCREEN, it is the cheapest to author, and the engine cools
# it per location so it cannot spam (v2.py:5190). Measured: vesper (v1) ships 14
# and back_home, steam and seventh_day ship ZERO between them.
