# Phase: 4_story_arc.toml
# ══════════════════════════════════════════════════════════════════

# =============================================================================
# Mrs. Vance — 4_story_arc  ·  TALK SCREENS AND THE ACT LOOPS
#
# ── THE TALK SCREENS ────────────────────────────────────────────────────────
# S4. 15,774 of the field's 54,630 screens are these: 55 words, two-thirds
# spoken, one picture, one way out. Nearly a third of everything the genre
# ships, and the cheapest content there is — no media hunt, no ladder, no state.
# vesper runs 26% and every v2 game runs 0-5%. What it is FOR is the person, not
# the plot, and attachment to a character outscored praise for the porn itself
# across ~11,000 player comments.
# ⚠️ They grant NO meter. A free repeatable that raises `want` is an uncapped
#    faucet on the thing every gate in the game reads (gate 26, the-economy R6).
#    The ladder rungs are priced and day-capped; the talk is free and is content.
# ⚠️ ONE TERM OF ADDRESS PER PERSON: Cade "Mrs. Vance" · Sherrod "girl" ·
#    Tobin "Rilla" · Booth the title until he cracks · Isaac nothing at all.
#    Measured at roughly every sixth to twentieth line in two field games, with
#    no overlap anywhere in either cast. Cheapest device in the whole study.
#
# ── THE ACT LOOPS ───────────────────────────────────────────────────────────
# R3b. A REPEATABLE EXPLICIT SURFACE IS A NODE-ROUTED LOOP. A one-time scene is
# a cascade. The difference is not style: a cascade APPENDS, so the clip at the
# node lead is the clip for beat 0 and by the beat that is the act the player is
# reading the payoff under a picture of the setup. Node routing SWAPS the
# passage, so every act is its own screen with its own pool.
#
# Six parts, all present in every loop below:
#   ENTRY      on the hub, gated, and it resets every loop trait on the way in
#   ACT NODE   per rung, its own media pool
#   SELF-LOOP  stay on this act, raise the hidden meter
#   SWITCH     change act, set loop_act, BOTH directions
#   FINISH     gated on arousal, elects which finish, routes to the finisher
#   FINISHER   [group] bands per finish, then resets every loop trait
#
# ⚠️ RESET ON ENTRY AND ON EXIT. Forget either and the next run starts mid-climb.
# ⚠️ LOOP STATE IS HIDDEN NUMERIC TRAITS, NEVER FLAGS. A flag set inside a
#    triggerless canvas has no located setter and HARD-FAILS the build (§16).
# ⚠️ AN ACT MENU IS TWO OPTIONS WIDE. Measured across 2,292 act menus in
#    nineteen shipped sandboxes: median 2, p75 3, and a SPAN of 1 — the options
#    sit one step apart, `touch` beside `oral`, never `talk` beside `sex`. And
#    the SINGLE-ACT LOOP is the shape the field mostly ships: of 61 arc hubs, 47
#    run one to four intensities and only 14 run five or more. Cade gets the
#    pose ladder because he carries the game; the other four are single-act.
# ⚠️ THE LABEL NAMES THE ACT. A loop whose exits say "Continue" has thrown away
#    the only readable thing about it. The field ships them bare and crude at
#    the character's ceiling.
# ⚠️ EVERY ACT NODE CARRIES 3+ WORDS FROM THE FROZEN LIST, and the game-wide
#    percentage cannot see the screen the player is on: 10 of one game's 21 act
#    and finish beats were under 3 while the whole-game floor read a comfortable
#    pass, and one finisher scored ZERO on 127 words — three paragraphs of a man
#    coming, not one of which named a body part.
# ⚠️ AN EXPLICIT BEAT STAYS ON THE BODY FOR ITS WHOLE LENGTH. Read the last
#    sentence: if it is about what the moment MEANS rather than what is
#    HAPPENING, the beat has pivoted and it scores 0-1. Interiority gets its own
#    beat, AFTER. This defect shipped three increments running, authored each
#    time by someone who had just written the rule against it.
# ⚠️ S1 · THE CLIP RIDES THE BEAT. Every act node has its own pool.
# =============================================================================


# ═════════════════════════════════════════════════════════════════════════════
# TALK
# ═════════════════════════════════════════════════════════════════════════════

[[canvases]]
id   = "talk_cade"
name = "Cade, talking"

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "He was on his own eleven years. Then he wasn't. That's the whole of what I know about it, Mrs. Vance, and I'd stop there if I were you." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "I don't care what you are to him. I care that the drawer is right on Friday. Those are two separate things and I'd like them kept that way." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "You want to know what a job is worth, look at what the man will wait for. Everything else on that sheet is decoration." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_cade" }, content = "No, I didn't object. Objecting to my father is a thing you do once, and you want to be sure it's worth the once." },
  ] },
  { type = "paragraph", content = "He says it all in the same voice he uses for a delivery time, and then goes back down the column, and the conversation is over because he has decided it is." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Let him have the last word."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_office"
time_progression_minutes = 5


[[canvases]]
id   = "talk_booth"
name = "Booth, talking"

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_booth" }, content = "Rennick says there's work at the crossing. He says a lot of things. — Sorry, Mrs. Vance, you didn't ask about Rennick." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_booth" }, content = "Nobody's said I can't work in the shop. Nobody's said I can either. That's kind of how it goes here, if you haven't noticed yet." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_booth" }, content = "I put the water on. It's an hour, so. If you were going to. That's all." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_booth" }, content = "You're not what I thought you'd be. I don't mean that bad. I mean I'd made up a whole — no. Forget it." },
  ] },
  { type = "paragraph", content = "He goes red from the collar up while he is still talking and keeps going anyway, which is the bravest thing anybody in this house does all week." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Let him off the hook."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_kitchen"
time_progression_minutes = 5


