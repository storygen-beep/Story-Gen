    { type = "dialog", props = { speaker = "npc", npcId = "npc_isaac" }, content = "Hub seal. Not the bearing." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_isaac" }, content = "Rain by four." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_isaac" }, content = "He was all right. Before. That's all I'd say." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_isaac" }, content = "You don't have to talk in here. Nobody does." },
  ] },
  { type = "paragraph", content = "Then nothing, for long enough that a normal person would fill it, and he does not fill it, and he does not look away either." },
