  { type = "image", props = { file = "angela.jpg", description = "Angela — long dark hair, warm smile, confident" } },
  { type = "paragraph", content = "Now it's just the two of you, under one roof. She makes coffee every morning. You hear her moving through the apartment at night. The arrangement is simple — rent, shared spaces, separate lives. But the apartment is small, and some distances are hard to keep." }
