name = "The Accidental Glimpse"
chapter = "chapter_act1"
journal_entry = "I didn't mean to look. The door was cracked, the steam, the sound of water — and then I saw her. Just for a moment. But a moment was enough. I can't stop thinking about it."
linked_canvas = "accidental_glimpse"
linked_flag = "peek_unlocked"
npc = "npc_angela"
is_milestone = false
