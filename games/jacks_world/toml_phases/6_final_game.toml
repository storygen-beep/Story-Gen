name = "Somewhere Else"
chapter = "chapter_act3"
journal_entry = "She asked me to take her somewhere. Somewhere nobody knows us. Three hundred dollars and a hotel room downtown. She said 'when you're ready, I'll be ready.' I've never wanted to earn money so badly."
linked_canvas = "event_date_proposal"
linked_flag = "date_proposed"
