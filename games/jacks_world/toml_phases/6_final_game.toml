id = "house_rules"
name = "House Rules"
chapter = "chapter_act1"
journal_entry = "She handed me a sponge and a bottle of cleaning spray. 'You're not a guest. If you're living here, you help out.' No apology, no softening. Her house, her terms. Fair enough."
