schema_version = "0.2"
starting_canvas = "jack_arrives"

# ═══════════════════════════════════════════════════════════════
# PROJECT METADATA
# ═══════════════════════════════════════════════════════════════

[project]
id = "jacks_world"
title = "Jack's World"
description = """
Jack moves into his step-mom Angela's apartment. What starts as a practical \
living arrangement becomes something neither of them expected. Over 30 days, \
daily routines — shared breakfasts, evening movies, accidental encounters — \
build into a genuine connection. Every intimate moment is earned through \
presence, small kindnesses, and emotional vulnerability. The forbidden element \
adds tension but doesn't define the relationship. Love is the driver, not lust.
"""

[time]
enabled = true
starting_hour = 6
starting_day = "Monday"
starting_week = 1

[settings]

[settings.rent]
enabled = true
amount = 200
due_day = "Monday"
collector_npc = "npc_angela"
grace_periods = 1
start_after_flag = "first_rent_paid"

[settings.rent.text]
title = "Monday Morning"
scene = "Angela is waiting in the kitchen, arms crossed. The rent envelope sits on the counter between you."
greeting = "It's that time of the week, Jack."
cant_pay = "Tell her you're short"
paid_scene = "You count out the bills and slide them across. She takes the money without counting."
paid_response = "Thank you."
paid_closing = "She tucks the money in the drawer and goes back to making coffee. Another week earned."
warning_scene = "You tell her you don't have it. Something shifts in her face — not anger. Disappointment."
warning_response = "Next week, Jack. Please."
warning_closing = "She walks to her room. The apartment feels colder."
eviction_scene = "Angela doesn't sit down. She's already packed a box with your things by the door."
eviction_response = "I can't keep doing this. You need to go."
eviction_closing = "The door closes behind you. The apartment that almost felt like home is someone else's again."

