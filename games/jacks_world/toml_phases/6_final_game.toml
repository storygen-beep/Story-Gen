# ═══════════════════════════════════════════════════════════════
# NPC: ANGELA
# ═══════════════════════════════════════════════════════════════
# Role: Step-mom. Primary NPC. Love interest.
# Physical: Long straight dark hair, fair skin, full-figured, natural curves.
#   Off-the-shoulder tops, delicate necklace. Warm but measured smile.
# Personality: Warm but guarded. Independent. Direct. Maternal instinct
#   blended with unexpected attraction.
# Speech: Calm, measured, slightly playful. Short sentences when emotional.
# Psychology: Wants to be seen as a person, not a role. Lonely in a way
#   she won't admit. She's the adult but she initiates at key moments.
# ═══════════════════════════════════════════════════════════════

[[npcs]]
id = "npc_angela"
name = "Angela"
description = "Jack's step-mom. Warm, attractive, lives alone in her apartment. The relationship with Jack is new — they're getting to know each other. She opens her home before she opens herself. Independent, direct, with a measured warmth that she gives when she means it."
portrait = "angela.jpg"
core_traits = { love = 0, trust = 0 }
flag_keys = []
# NPC schedules are auto-detected from canvas trigger data during game generation

[[npcs]]
id = "npc_maria"
name = "Maria"
description = "The cafe owner. A no-nonsense woman who runs the neighborhood cafe. She knows Angela and respects her."
portrait = ""
core_traits = {}
flag_keys = []
