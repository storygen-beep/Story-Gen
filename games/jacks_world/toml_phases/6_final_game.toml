id = "first_peek"
name = "Returning to Watch"
chapter = "chapter_act1"
journal_entry = "I went back to the bathroom door. This time it wasn't an accident. I knew what I was doing. I watched her through the steam and told myself it was the last time. It wasn't."
linked_canvas = "event_first_peek"
linked_flag = "first_peek_complete"
npc = "npc_angela"
is_milestone = false
group = "early_bonding"

[[story_arc.nodes]]
id = "first_movie"
name = "Movie Night"
chapter = "chapter_act1"
journal_entry = "We watched a movie together. She sat close. Our legs touched. Neither of us moved."
linked_canvas = "event_first_movie"
linked_flag = "first_movie_complete"
npc = "npc_angela"
is_milestone = false
