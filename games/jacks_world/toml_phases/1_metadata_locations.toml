# ═══════════════════════════════════════════════════════════════
# PHASE 1: METADATA, PLAYER & LOCATIONS
# ═══════════════════════════════════════════════════════════════
# Source: Book Phases 1 (Foundation), 3 (Character Design), 4 (World Design)
# Game: Jack's World
# ═══════════════════════════════════════════════════════════════

schema_version = "0.2"
starting_canvas = "jack_arrives"

# ═══════════════════════════════════════════════════════════════
# PROJECT METADATA
# ═══════════════════════════════════════════════════════════════

[project]
id = "jacks_world"
title = "Jack's World"
description = """
Jack moves into his step-mom Angela's apartment. What starts as a practical \
living arrangement becomes something neither of them expected. Over 30 days, \
daily routines — shared breakfasts, evening movies, accidental encounters — \
build into a genuine connection. Every intimate moment is earned through \
presence, small kindnesses, and emotional vulnerability. The forbidden element \
adds tension but doesn't define the relationship. Love is the driver, not lust.
"""

[time]
enabled = true
starting_hour = 8
starting_day = "Monday"
starting_week = 1

# ═══════════════════════════════════════════════════════════════
# PLAYER
# ═══════════════════════════════════════════════════════════════

[player]
id = "player"
name = "Jack"
description = "Young man, early 20s. Moving into his step-mom's apartment while he gets on his feet. Works shifts at a neighborhood cafe. Practical, uncertain, but open to connection."
portrait = "player.jpg"
core_traits = { money = 50 }
flag_keys = [
  "game_started",
  "jack_arrived_complete",
  "bills_discovered",
  "job_started",
  "first_rent_paid",
  "rent_last_paid",
  "routine_noticed",
  "late_night_talk",
  "massage_offered",
  "towel_encounter_complete",
  "bedroom_encounter_complete",
  "bedroom_moment_complete",
  "date_night_complete",
  "kiss_unlocked",
  "groping_unlocked",
  "makeout_unlocked",
  "oral_unlocked",
  "manual_unlocked",
  "sex_unlocked"
]

