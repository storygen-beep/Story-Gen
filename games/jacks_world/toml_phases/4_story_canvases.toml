[[canvases]]
id = "jack_arrives"
name = "Jack Arrives"
description = "Day 1 — Jack moves into Angela's apartment. Tutorial scene."

# NO [canvases.trigger] — this is the starting canvas, plays automatically.

# ─────────────────────────────────────────────────────────────
# NODE 0: INTRO
# Brief premise — who you are, who Angela is, why you're here.
# ─────────────────────────────────────────────────────────────
[[canvases.nodes]]
id = "intro"
name = "Jack's World"
blocks = [
  { type = "paragraph", content = "You're Jack. Early twenties. No degree, no steady job, no place of your own. Your father's second marriage fell apart two years ago, but his ex-wife — Angela — stayed in touch. When you needed somewhere to stay, she was the one who picked up the phone." },
  { type = "image", props = { file = "player.jpg", description = "Jack — early twenties, uncertain but open" } },
  { type = "paragraph", content = "Angela. Your step-mom. Mid-thirties, living alone in a two-bedroom apartment. Long dark hair, warm eyes, a quiet confidence. She offered you the guest room without hesitation." },
  { type = "image", props = { file = "angela.jpg", description = "Angela — long dark hair, warm smile, confident" } },
  { type = "paragraph", content = "Now it's just the two of you, under one roof. She makes coffee every morning. You hear her moving through the apartment at night. The arrangement is simple — rent, shared spaces, separate lives. But the apartment is small, and some distances are hard to keep." }
]
exit_block = { type = "choices", choices = [
  { text = "Continue", targetType = "node", nodeId = "jack_arrives.arrival" }
] }

# ─────────────────────────────────────────────────────────────
# NODE 1: PLAYER IDENTITY
# Jack stands at the door. The premise is set.
# ─────────────────────────────────────────────────────────────
[[canvases.nodes]]
id = "arrival"
name = "At the Door"
blocks = [
  { type = "paragraph", content = "You stand at the door with your suitcase. The hallway smells like someone else's life — her laundry detergent, a candle she left burning. You knock, even though she said to just come in." },
  { type = "paragraph", content = "This is temporary. That's what you tell yourself. A few months, save some money, figure things out. She offered, you accepted. Simple." },
  { type = "paragraph", content = "Your father married her. The marriage didn't last, but Angela offered to let you stay at her apartment while you get on your feet. You met a few times during the marriage — holidays, a dinner or two. Polite. Nothing more." },
  { type = "paragraph", content = "Now you're moving into her home." },
  { type = "video", props = { file = "angela_white/clips/[PornhubFans 480p] NewSensations - Angela White XXX BIg Tits Rubdown/clip_001.mp4", description = "Angela opens the door in a robe — Jack steps inside carrying his suitcase. She smiles, watches him walk past. Welcome home." } }
]
exit_block = { type = "choices", choices = [
  { text = "Step inside", targetType = "node", nodeId = "jack_arrives.meeting" }
] }

# ─────────────────────────────────────────────────────────────
# NODE 2: ANGELA INTRODUCTION
# First proper look at Angela. Physical description, chemistry.
# ─────────────────────────────────────────────────────────────
[[canvases.nodes]]
id = "meeting"
name = "Meeting Angela"
blocks = [
  { type = "paragraph", content = "She opens the door and you see her properly for the first time outside of a holiday dinner. Long dark hair, straight, falling past her shoulders. Fair skin. Full-figured — curves she doesn't hide but doesn't advertise. She's wearing a light satin robe, loosely tied. A delicate necklace. Bare feet on the hardwood floor — she's comfortable in her own home." },
  { type = "paragraph", content = "She's taller than you remembered. She smiles — warm but measured, like she's calibrating how much warmth is appropriate." },
  { type = "dialog", content = "Jack. Come in. Let me show you around.", props = { speaker = "npc", npcId = "npc_angela" } },
  { type = "paragraph", content = "She steps aside. No hug — that would be too much for two people who are almost strangers. Her hand touches your shoulder as you pass through the doorway. Brief. Intentional or accidental? You can't tell." },
  { type = "video", props = { file = "angela_white/clips/[PornhubFans 480p] NewSensations - Angela White XXX BIg Tits Rubdown/clip_002.mp4", description = "Angela at the door, smiling warmly, turning the handle — welcoming him in" } },
  { type = "paragraph", content = "She walks ahead of you through the apartment. You notice the way she carries herself — confident, unhurried. She looks back over her shoulder to make sure you're following. The look lasts half a second longer than it needs to." },
  { type = "video", props = { file = "angela_white/clips/[PornhubFans 480p] NewSensations - Angela White XXX BIg Tits Rubdown/clip_003.mp4", description = "Jack setting up in the room — unpacking, getting settled into her space" } }
]
exit_block = { type = "choices", choices = [
  { text = "Follow her", targetType = "node", nodeId = "jack_arrives.situation" }
] }

# ─────────────────────────────────────────────────────────────
# NODE 3: THE SITUATION
# Stakes, the guest room, rent discussion, "Welcome home, Jack."
# ─────────────────────────────────────────────────────────────
[[canvases.nodes]]
id = "situation"
name = "Welcome Home"
blocks = [
  { type = "paragraph", content = "She shows you the guest room. It's small but clean. She's put fresh sheets on the bed. A towel folded on the pillow. She thought about your arrival." },
  { type = "dialog", content = "Bathroom's down the hall. Kitchen — you saw it. Help yourself to anything.", props = { speaker = "npc", npcId = "npc_angela" } },
  { type = "paragraph", content = "She pauses at the door." },
  { type = "dialog", content = "Rent is two hundred a week. I know that sounds like a lot, but...", props = { speaker = "npc", npcId = "npc_angela" } },
  { type = "dialog", content = "It's fine. I'll pick up shifts at the cafe.", props = { speaker = "player" } },
  { type = "paragraph", content = "She nods. A moment passes where neither of you moves." },
  { type = "dialog", content = "Well. Welcome home, Jack.", props = { speaker = "npc", npcId = "npc_angela" } },
  { type = "paragraph", content = "She closes the door. You sit on the bed. Home." },
  { type = "paragraph", content = "'Welcome home, Jack.' Spoken by a woman who's been living alone, to a young man who's just moved in. Just the two of them. For as long as it takes." }
]
exit_block = { type = "location", text = "Settle in", config = { destinationType = "specific", locationId = "loc_hallway", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_angela", trait = "love", op = "add", value = 3 }], flagEffects = [{ targetType = "player", flag = "game_started" }, { targetType = "player", flag = "jack_arrived_complete" }] } }


