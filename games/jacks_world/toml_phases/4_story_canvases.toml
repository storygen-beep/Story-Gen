end_time = "22:00"

# NODE 1: THE KITCHEN COUNTER
[[canvases.nodes]]
id = "discovery"
name = "The Kitchen Counter"
blocks = [
  { type = "paragraph", content = "You come home to find Angela at the kitchen counter. Laptop open, papers spread out. She doesn't hear you come in." },
  { type = "paragraph", content = "You see enough before she notices — overdue notices, a spreadsheet of expenses with red numbers. Bills. A lot of them." },
  { type = "paragraph", content = "She closes the laptop quickly." },
  { type = "dialog", content = "Just bills. Nothing exciting.", props = { speaker = "npc", npcId = "npc_angela" } },
  { type = "paragraph", content = "Her voice is light but her eyes aren't. You realize — she's been covering everything alone since the divorce. Your father left her the apartment, but not much else." }
]
exit_block = { type = "choices", choices = [
  { text = "I want to help with rent", targetType = "node", nodeId = "angelas_struggle.offer_rent" },
  { text = "That's a lot to handle alone", targetType = "node", nodeId = "angelas_struggle.offer_empathy" }
] }

# NODE 2A: THE OFFER — RENT
[[canvases.nodes]]
id = "offer_rent"
name = "The Offer"
blocks = [
  { type = "dialog", content = "Angela — I want to help. With rent. Seriously.", props = { speaker = "player" } },
  { type = "paragraph", content = "She shakes her head." },
  { type = "dialog", content = "You just got here, Jack. Get settled first.", props = { speaker = "npc", npcId = "npc_angela" } },
  { type = "paragraph", content = "But her face says something different. Relief she won't name. Gratitude she doesn't know how to show." },
  { type = "paragraph", content = "She goes back to the papers. But something between you has changed. She let you see something real." }
]
exit_block = { type = "location", text = "Give her space", config = { destinationType = "trigger", time_progression_minutes = 30, effects = [{ targetType = "npc", npcId = "npc_angela", trait = "trust", op = "add", value = 3 }], flagEffects = [{ targetType = "player", flag = "bills_discovered" }] } }

# NODE 2B: THE OFFER — EMPATHY
[[canvases.nodes]]
id = "offer_empathy"
name = "The Empathy"
blocks = [
  { type = "dialog", content = "That's a lot to handle alone.", props = { speaker = "player" } },
  { type = "paragraph", content = "She's quiet for a moment. Then:" },
  { type = "dialog", content = "It is.", props = { speaker = "npc", npcId = "npc_angela" } },
  { type = "paragraph", content = "Two words. The first time she's admitted it to anyone. She doesn't cry. She doesn't need to. The admission itself is the vulnerability." },
  { type = "paragraph", content = "She closes the laptop. Pours a second glass of wine — for you. You sit with her at the counter and neither of you says anything for a while. It's enough." }
]
exit_block = { type = "location", text = "Sit with her", config = { destinationType = "trigger", time_progression_minutes = 45, effects = [{ targetType = "npc", npcId = "npc_angela", trait = "trust", op = "add", value = 3 }, { targetType = "npc", npcId = "npc_angela", trait = "love", op = "add", value = 1 }], flagEffects = [{ targetType = "player", flag = "bills_discovered" }] } }

