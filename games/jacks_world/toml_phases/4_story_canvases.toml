# ARC 1: THE BILLS — Angela's financial struggle revealed
# ─────────────────────────────────────────────────────────────
# Location: loc_kitchen | Schedule: 19:00–22:00 | NPC: npc_angela
# Trigger: trust >= 4, love >= 5
