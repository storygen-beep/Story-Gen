  { type = "dialog", content = "I got a job. The cafe on the corner.", props = { speaker = "player" } },
  { type = "paragraph", content = "She pauses mid-cooking. Sets the spoon down. Turns to face you." },
  { type = "dialog", content = "You didn't have to do that.", props = { speaker = "npc", npcId = "npc_angela" } },
  { type = "dialog", content = "I wanted to.", props = { speaker = "player" } },
  { type = "paragraph", content = "Silence. Not awkward — full. She goes back to cooking, but she's smiling. The kind of smile that means something landed." }
]
exit_block = { type = "location", text = "Help with dinner", config = { destinationType = "trigger", time_progression_minutes = 45, effects = [{ targetType = "npc", npcId = "npc_angela", trait = "trust", op = "add", value = 2 }, { targetType = "npc", npcId = "npc_angela", trait = "love", op = "add", value = 1 }], flagEffects = [{ targetType = "player", flag = "job_started" }] } }

