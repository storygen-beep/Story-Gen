id = "angelas_struggle"
name = "The Bills"
description = "Jack discovers Angela has been struggling financially since the divorce."

[canvases.trigger]
location = "loc_kitchen"
npc = "npc_angela"
is_active = true
is_repeatable = false
priority = 10
[canvases.trigger.conditions]
