blocks = [
  { type = "paragraph", content = "The cafe is small — six tables, a long counter, the smell of ground coffee and fresh bread. A woman behind the counter watches you walk in." },
  { type = "dialog", content = "What can I get you?", props = { speaker = "npc", npcId = "npc_angela" } },
  { type = "dialog", content = "Actually — I'm looking for work. Anything available?", props = { speaker = "player" } },
  { type = "paragraph", content = "She sizes you up. Not unkindly." },
  { type = "dialog", content = "You Angela's...?", props = { speaker = "npc", npcId = "npc_angela" } },
  { type = "dialog", content = "Her stepson. I'm staying with her.", props = { speaker = "player" } },
  { type = "paragraph", content = "A nod. Something passes across her face — respect, maybe. Or recognition." },
