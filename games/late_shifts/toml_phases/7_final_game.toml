# is set. phone_active is set at the diner hire (2_one_shots, take-the-apron
# exit) alongside hired_at_diner — Maya's cut-off phone reconnects once she has
# income coming in. Before hire: no phone. After hire: phone, threads dispatch
# as arc flags fire.
#
# CONDITION VOCABULARY (source-verified vs triggerConditionsSatisfied @ v2.py:3308):
#   phone conversation/topic triggers support: flag, trait, days_since_flag, pass,
#   item, stage, quest, corruption_level, clothing_*, worn_*, modifier.
#   They do NOT support day / time / location / random. The Vince rent reminders
#   below therefore use flag + days_since_flag, NOT a day-of-week condition.

[phone]
enabled       = true
purchase_flag = "phone_active"

[[phone.apps]]
id    = "messages"
type  = "chat"
label = "Messages"

# ══════════════════════════════════════════════════════════════════════════════
# CONVERSATIONS (NPC threads). Each triggers on a REAL arc flag verified present
# in the LS TOML, so threads actually dispatch (no dead-flag triggers). Threads
# are one-shot per id (engine marks triggered_conversations). Branching via
# after_round + after_choice. Reply effects use targetType/npcId/trait/op/value
# (TLS-proven shape). NPC trait sets: Hank = relation+arousal+corruption,
# Ben = relation+arousal, Cole = relation only, Vince = relation only.
# ══════════════════════════════════════════════════════════════════════════════

# ─── Cole (peer/dating) ──────────────────────────────────────────────────────
[[phone.conversations]]
id     = "cole_opener"
app    = "messages"
npc    = "npc_cole"
notify = "@cole texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "cole_noticed", operator = "is_true" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "hey — cole, from the back of the house. got your number off the schedule sheet, hope that's not a felony"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "you handled that 2am rush better than people who've been here a year. just wanted to say it"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "Not weird. Glad you texted.", effects = [{ targetType = "npc", npcId = "npc_cole", trait = "relation", op = "add", value = 3 }] },
  { text = "A little weird. But okay.", effects = [{ targetType = "npc", npcId = "npc_cole", trait = "relation", op = "add", value = 1 }] },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "good. i'll take it"
after_round = 1
after_choice = 0
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "fair. i'll earn the not-weird"
after_round = 1
after_choice = 1

[[phone.conversations]]
id     = "cole_after_date"
app    = "messages"
npc    = "npc_cole"
notify = "@cole texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "cole_date_done", operator = "is_true" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "tonight was good. like actually good. tell me i didn't make that up"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "You didn't.", effects = [{ targetType = "npc", npcId = "npc_cole", trait = "relation", op = "add", value = 3 }] },
  { text = "Let's not rush it.", effects = [{ targetType = "npc", npcId = "npc_cole", trait = "relation", op = "add", value = 1 }] },
]

[[phone.conversations]]
id     = "cole_morning"
app    = "messages"
npc    = "npc_cole"
notify = "@cole texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "cole_first_night_done", operator = "is_true" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "woke up and you were already gone. drinking this coffee alone feels like a crime"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "Next time I'll stay for the coffee.", effects = [{ targetType = "npc", npcId = "npc_cole", trait = "relation", op = "add", value = 4 }] },
  { text = "I had an early shift.", effects = [{ targetType = "npc", npcId = "npc_cole", trait = "relation", op = "add", value = 1 }] },
]

# ─── Hank (cook/owner, possessive escalation) ────────────────────────────────
[[phone.conversations]]
id     = "hank_jacket"
app    = "messages"
npc    = "npc_hank"
notify = "Hank texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
