weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "14:00"
end_time   = "20:00"
activity   = "off-shift personal time"

# Cole at his apartment 07:00–14:00 — the post-shift "gray morning" window. REQUIRED for
# cole_apartment_hub (a portrait hub): renderNpcPortraits is presence-gated on getNpcLocation,
# so the hub is only clickable when Cole is schedule-present here. Maya, coming off the same
