# ── Town hub ──────────────────────────────────────────────────────────────────

[[locations]]
id               = "loc_main_street"
name             = "Main Street"
description      = "One long street through the middle of town. The diner is midblock. The convenience store is at the far end. There's a park past the library."
# NON-container standing hub (NOT is_container): renders child nav via navigation_order
# AND hosts canvases here (activity_walk_home + scene_cole_post_shift_walk fire here).
navigation_order = [
  "loc_diner_front",
  "loc_convenience_store",
  "loc_thrift_store",
  "loc_town_park",
  "loc_cole_apartment",
]
# Coverage gate (clothing system): can't walk into town half-dressed. A dress
# satisfies top+bottom. Home interiors are intentionally ungated.
# RTS-faithful: CONDITIONAL — the cover-up rule only applies BELOW the Slutty band.
# The rule carries a `conditions` gate (corruption < 50); checkLocationClothing only
# enforces a rule whose conditions are satisfied. At corruption 50+ the condition
# fails, no rule matches, and she walks out underdressed without shame (RTS Bedroom
# getCorruptionLevel parallel). Single non-empty rule — validator requires slots.
clothing_rules = [
  { slots_required = ["top", "bottom"], message = "She can't head out half-dressed — better go back and put something on.", conditions = { version = "1.0", items = [
      { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 50 },
    ] } },
]
# loc_building_front is the home cluster's exterior root (top-level, no entry_from —
# parallel to loc_main_street). Bridge home <-> town = activity_walk_to_town / walk_home (phase 3).

