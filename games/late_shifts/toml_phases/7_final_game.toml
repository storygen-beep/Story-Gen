# QUEST CARDS
# ═════════════════════════════════════════════════════════════════════════════
# Quest card conditions use FLAT shape: { flag = "x", op = "is_true/is_false" }
# or { trait = "x", subject = "player/npc", npc_id = "x", op = "gte/lt", value = N }
# NOT the same as trigger predicate syntax.

# ─── Hank quest chain ────────────────────────────────────────────────────────

# H-M0: Pre-hire (points at canvas_hank_hire)
[[quest_cards]]
text         = "The diner two blocks down is hiring nights. I walked past the sign twice before I did anything about it."
ready_text   = "He's at the register."
tip          = "Walk in. Ask."
npc_id       = "npc_hank"
ready_canvas = "canvas_hank_hire"
when = [
  { flag = "hired_at_diner", op = "is_false" },
]

# H-M1: Hired, pre-slow-night-talk (points at scene_hank_slow_night_talk)
[[quest_cards]]
text         = "I work for him. He hired me in five minutes and hasn't said anything personal since."
ready_text   = "Something's going to give one of these nights."
tip          = "He stays late. Show up at the counter when it's quiet."
npc_id       = "npc_hank"
ready_canvas = "scene_hank_slow_night_talk"
when = [
  { flag = "hired_at_diner",  op = "is_true"  },
  { flag = "hank_opened_up",  op = "is_false" },
]
goals = [
  { trait = "corruption", subject = "player", op = "gte", value = 5, label = "Corruption" },
]

# H-M2: Post-opened-up, pre-first-contact
[[quest_cards]]
text         = "He told me something about Mel. One thing. I keep thinking about the way he said it."
ready_text   = "Something's going to happen in that kitchen."
tip          = "He's in there during the prep window. Be there."
npc_id       = "npc_hank"
ready_canvas = "scene_hank_first_contact_kitchen"
when = [
  { flag = "hank_opened_up",    op = "is_true"  },
  { flag = "hank_first_contact", op = "is_false" },
]
goals = [
  { trait = "corruption", subject = "player", op = "gte", value = 15, label = "Corruption" },
]

# H-M3: Post-first-contact, pre-after-close
[[quest_cards]]
text         = "His hand was on my waist for maybe three seconds. He didn't look sorry about it."
ready_text   = "He's going to lock up one of these nights and tell me to stay."
tip          = "Be on the floor late. Past 1am."
npc_id       = "npc_hank"
ready_canvas = "scene_hank_after_close"
when = [
  { flag = "hank_first_contact",   op = "is_true"  },
  { flag = "hank_after_close_done", op = "is_false" },
]
goals = [
  { trait = "corruption", subject = "player", op = "gte", value = 25, label = "Corruption" },
]

# H-M4: Post-after-close, pre-office-first
[[quest_cards]]
text         = "I was on my knees in his office. He said 'good girl' and meant it."
ready_text   = "Next time he won't stop there."
tip          = "Go to the office when the diner's empty."
npc_id       = "npc_hank"
ready_canvas = "scene_hank_office_first"
when = [
  { flag = "hank_after_close_done",  op = "is_true"  },
  { flag = "hank_office_first_done", op = "is_false" },
]
goals = [
  { trait = "corruption", subject = "player", op = "gte", value = 35, label = "Corruption" },
]

# H-M5: Post-office-first, pre-declaration
[[quest_cards]]
text         = "He fucked me over his desk and came inside me and went back to his paperwork."
ready_text   = "He's going to name what this is."
tip          = "The office. Late. When he's done with the books."
npc_id       = "npc_hank"
ready_canvas = "scene_hank_declaration"
when = [
  { flag = "hank_office_first_done", op = "is_true"  },
  { flag = "hank_cracked",           op = "is_false" },
]
goals = [
  { trait = "corruption", subject = "player", op = "gte", value = 50, label = "Corruption" },
]

# H-M6: Terminal
[[quest_cards]]
text         = "He said: you work here. You stay here. That's how it goes. I said okay. I meant it."
npc_id       = "npc_hank"
priority     = 1
terminal     = true
when = [
  { flag = "hank_cracked", op = "is_true" },
]

# ─── Ben quest chain ─────────────────────────────────────────────────────────

# B-M0: Pre-stage1 (no ready_canvas — mechanic card, stat-driven)
# unlocks at ben_stage1 = true (either dual-path capstone)
[[quest_cards]]
# unlocks: ben_kitchen_hub + ben_living_room_hub Stage 1 content
text = "He moved my boxes in without asking questions. We've been living around each other for weeks."
tip  = "He's here evenings. We share a kitchen."
npc_id = "npc_ben"
when = [
  { flag = "ben_stage1", op = "is_false" },
]
goals = [
  { trait = "corruption", subject = "player", op = "gte", value = 5, label = "Corruption" },
]

# B-M1: Post-stage1, pre-charged-moment
