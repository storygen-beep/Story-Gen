name = "Rosa — first shift"
blocks = [
  { type = "image", props = { file = "scenes/canvas_rosa_onboarding.jpg" } },
  { type = "paragraph", content = "The woman behind the counter was already moving when Maya came through the door with the apron." },
  { type = "cascade", props = { beats = [
    { advance_text = "Follow her.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_rosa" }, content = "Rosa. I run the floor on evenings. You take over at ten." },
        { type = "paragraph", content = "She didn't slow down for the introduction. She was already at Table 4, wiping a surface that was already clean." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_rosa" }, content = "Table 4 is your best tipper. Table 9 never tips. Don't argue with 9." },
    ] },
    { advance_text = "Keep up.", blocks = [
        { type = "paragraph", content = "Two hours. Rosa covered the coffee cadence (counter first, then booths, every twenty minutes on the late stretch), the ice machine (temperamental after midnight, hit the panel on the right side), the regular who came in at 12:30 every night and always wanted the same thing and never looked at the menu. She showed her without stopping moving." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_rosa" }, content = "Hank's here most nights until one, one-thirty. He'll tell you if something's wrong. Otherwise — don't go back to the office." },
    ] },
    { advance_text = "\"Is he always here that late?\"", blocks = [
        { type = "paragraph", content = "Rosa looked at her once." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_rosa" }, content = "Since Mel died, yeah. He doesn't sleep right. You'll get used to it." },
        { type = "thought_bubble", props = { speaker = "npc_rosa" }, content = "She'll be fine. She keeps up." },
        { type = "paragraph", content = "She handed Maya a notepad and a pen. The first table was already looking." },
    ] },
  ] } },
]

