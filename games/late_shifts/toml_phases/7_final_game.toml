# ── Cole ──────────────────────────────────────────────────────────────────────

[[npcs]]
id          = "npc_cole"
name        = "Cole"
description = "27. Lean, tattoo-studio ink up both forearms, hair cropped short. Works the grill without much commentary. Watches things. Has drawings pinned everywhere in his apartment."
portrait    = "cole.jpg"
core_traits = { relation = 0 }
flag_keys   = []
arc_stages  = [
  "Coworkers",   # Stage 0 — neutral co-presence
  "Noticed",     # Stage 1 — cole_noticed; first real conversation
  "Dating",      # Stage 2 — cole_walk_done; post-shift walks + first date
  "Intimate",    # Stage 3 — cole_date_done; the apartment
  "Ongoing",     # Stage 4 — cole_first_night_done; explicit routine
]
# Customizable NPC: player can rename Cole + pick the relationship label at game start.
# REQUIRES both `relationship` (default) AND `relationship_options` (default must be in it) —
# the importer hard-fails otherwise. All player-visible Cole prose uses @cole / @cole.rel so
# the rename/relabel propagates. Structural labels the token can't reach (location names,
# the sidebar relation bar) are genericized — see doctrine/14 §4.
customizable          = true
relationship          = "coworker"
relationship_options  = ["coworker", "neighbor", "old flame"]

[npcs.trait_decay]
relation = 0.5

# Cole schedules — 3 entries.
# 21:00–07:00 at diner_back = same shift as Maya (prime Cole interaction window).
# 14:00–20:00 at town_park = visible to Maya pre-shift if she's out in the afternoon.

