# ─── Vince (landlord / rent collector) — phone ↔ rent tie-in ─────────────────
# vince_rent_intro: fires right after hire (flag hired_at_diner). Sets the rent
# expectation in his voice. Mirrors the [settings.rent.text] register (flat).
[[phone.conversations]]
id     = "vince_rent_intro"
app    = "messages"
npc    = "npc_vince"
notify = "Unknown number."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "hired_at_diner", operator = "is_true" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "Vince. Building super. You've got my number now — use it before I have to use the spare key."
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "Rent's a hundred and twenty-five. Every Friday. We'll get along fine as long as that's true."
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "Understood.", effects = [{ targetType = "npc", npcId = "npc_vince", trait = "relation", op = "add", value = 1 }] },
  { text = "You always this warm?", effects = [{ targetType = "npc", npcId = "npc_vince", trait = "relation", op = "add", value = -1 }] },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "Warm doesn't keep the lights on. Friday."
after_round = 1
after_choice = 1

# vince_due_soon: ~4 days after hire (days_since_flag) — lands near the first
# rent Friday. days_since_flag reads flags_meta.set_day for hired_at_diner.
[[phone.conversations]]
id     = "vince_due_soon"
app    = "messages"
npc    = "npc_vince"
notify = "Vince texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "days_since_flag", subject = "player", flag_key = "hired_at_diner", operator = "gte", value = 4 },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "Friday's close. You know the number. I don't like knocking twice."
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "I'll have it.", effects = [{ targetType = "npc", npcId = "npc_vince", trait = "relation", op = "add", value = 1 }] },
  { text = "Working on it.", effects = [] },
]

# vince_evicted: fires on the flag_set eviction (rent_evicted) — the leverage
# hook that matches [settings.rent.text].eviction_*_soft.
[[phone.conversations]]
id     = "vince_evicted"
app    = "messages"
npc    = "npc_vince"
notify = "Vince texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "rent_evicted", operator = "is_true" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "Money's one way to keep a roof over your head. You've run out of that way."
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "Come see me. We'll talk about what else works."
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "What else?", effects = [{ targetType = "npc", npcId = "npc_vince", trait = "relation", op = "add", value = 1 }] },
  { text = "I'll get the money.", effects = [{ targetType = "npc", npcId = "npc_vince", trait = "relation", op = "add", value = 1 }] },
]

# ══════════════════════════════════════════════════════════════════════════════
# DAILY SMALL-TALK — 1/NPC/day (legacy per-NPC cooldown, no `cooldown` field),
# arc-flag gated, small relational effects. Side-channel chatter, not capstones.
# ══════════════════════════════════════════════════════════════════════════════
[[phone.daily_topics]]
id             = "cole_smalltalk"
npc            = "npc_cole"
player_message = "slow shift?"
npc_response   = "slower without you on the floor, honestly"
effects        = [{ targetType = "npc", npcId = "npc_cole", trait = "relation", op = "add", value = 1 }]
conditions     = { version = "1.0", items = [{ type = "flag", subject = "player", flag_key = "cole_noticed", operator = "is_true" }] }

[[phone.daily_topics]]
id             = "hank_smalltalk"
npc            = "npc_hank"
player_message = "still there?"
npc_response   = "Always am."
effects        = [{ targetType = "npc", npcId = "npc_hank", trait = "relation", op = "add", value = 1 }]
conditions     = { version = "1.0", items = [{ type = "flag", subject = "player", flag_key = "hank_opened_up", operator = "is_true" }] }

[[phone.daily_topics]]
id             = "ben_smalltalk"
npc            = "npc_ben"
player_message = "you up?"
npc_response   = "for you, apparently."
effects        = [{ targetType = "npc", npcId = "npc_ben", trait = "relation", op = "add", value = 1 }]
conditions     = { version = "1.0", items = [{ type = "flag", subject = "player", flag_key = "ben_first_move_done", operator = "is_true" }] }

