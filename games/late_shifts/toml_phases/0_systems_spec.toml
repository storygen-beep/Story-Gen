# ── Per-NPC state: NOT surfaced in sidebar ───────────────────────────────────
# Per TLS gold-standard: NPC progression (arousal / relation / stage) is surfaced
# on the Quests page (V2 quest cards), NOT duplicated in the sidebar. The engine's
# sidebar trait_bar resolves `trait` against player.core_traits regardless of any
# npc_id field, so npc-scoped sidebar bars would mis-render the player's stat.
# The Doc 64 npc_location radar PRD (per-NPC location + arc-shaped stat visibility)
# is the eventual home for this; until it ships, NPC state lives on the Quests page.
#
# Pam (antagonist): awareness intentionally hidden regardless — dramatic
# confrontation surprise depends on the player NOT seeing the accumulator climb.

# End of phase 0. Reply "next" to receive phase 1.

# ─── Hidden traits (2026-05-30) ───────────────────────────────────────────────
# Internal stage/pregnancy/awareness traits MUST live in core_traits (the engine
# reads + writes them there), but the engine's playerTraits widget + Stats page
# dump EVERY core_traits key. A [[traits.labels]] entry with hidden=true suppresses
# the trait from ALL player-facing dumps (dev AND non-dev) via a runtime <<continue>>.
# These are hide-only entries (no label needed). Name-keyed, not namespaced — a
# hidden key hides for the player AND any NPC with a core_trait of that name (here
# `awareness` belongs only to Pam, so that is exactly the intent).

[[traits.labels]]
key = "hank_stage"
hidden = true

[[traits.labels]]
key = "ben_stage"
hidden = true

[[traits.labels]]
key = "cole_stage"
hidden = true

[[traits.labels]]
key = "rosa_stage"
hidden = true

[[traits.labels]]
key = "pregnancy"
hidden = true

[[traits.labels]]
key = "awareness"
hidden = true
