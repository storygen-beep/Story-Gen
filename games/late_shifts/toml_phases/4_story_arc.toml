    ] },
    { advance_text = "Look at the board.", blocks = [
        { type = "paragraph", content = "He picked up the coffee, drank what was left cold, and set it back." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_hank" }, content = "You should get home." },
        { type = "thought_bubble", props = { speaker = "npc_hank" }, content = "First time I've said that out loud." },
