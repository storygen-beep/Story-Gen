[[canvases.nodes]]
id   = "base"
name = "Late — just the two of us"
blocks = [
  { type = "image", props = { file = "scenes/hank_slow_night_talk.jpg" } },
  { type = "paragraph", content = "The last booth cleared out at 1:40. Hank is at the counter with a coffee he stopped drinking twenty minutes ago. The diner is otherwise empty." },
  { type = "cascade", props = { beats = [
    { advance_text = "Sit at the counter.", blocks = [
        { type = "paragraph", content = "She takes the stool two down from him. He doesn't say anything. The coffee machine ticks as it cools. Somewhere outside a truck engine brakes on the main road and then fades." },
    ] },
    { advance_text = "Wait.", blocks = [
        { type = "paragraph", content = "He was looking at the specials board. Still in Mel's handwriting — rounded letters, a habit of underlining prices. He'd repainted the board twice since she died and had someone trace her original writing each time. He hadn't told anyone that." },
