# ─── Locations ────────────────────────────────────────────────────────────────

# ── Home hub ──────────────────────────────────────────────────────────────────

# ── Home: 4-layer geography ───────────────────────────────────────────────────
# rooms → loc_mayas_apartment (PRIVATE unit: Maya + Ben + laundry)
#       → loc_building_hallway (SHARED corridor: neighbors, stairwell-ready)
#       → loc_building_front   (exterior steps; walk-bridge to town)
#       → [activity_walk_to_town] → loc_main_street
# Standing hubs (NOT is_container — containers swallow attached canvases). "Leave X"
# follows X.entry_from; child nav = locations whose entry_from points here.

[[locations]]
id               = "loc_mayas_apartment"
name             = "Maya's Apartment"
description      = "The small two-bedroom she shares with Ben. Thin carpet, one overhead light in the entry, the rooms opening off a short interior hall. It's not much, but the door locks and it's theirs."
entry_from       = "loc_building_hallway"
navigation_order = [
  "loc_mayas_room",
  "loc_bens_room",
  "loc_shared_kitchen",
  "loc_living_room",
  "loc_bathroom",
  "loc_laundry_room",
]

[[locations]]
id          = "loc_mayas_room"
name        = "Maya's Room"
description = "A second bedroom. Boxes she hasn't unpacked. The window looks out at the parking lot. Ben put the lamp in here."
image       = "locations/mayas_room.jpg"
entry_from  = "loc_mayas_apartment"

[[locations]]
id          = "loc_bens_room"
name        = "Ben's Room"
description = "His room. Sparse — a bed, a nightstand, the book he's reading. Work boots by the door. Smells like soap and sawdust."
image       = "locations/bens_room.jpg"
entry_from  = "loc_mayas_apartment"
# No entry_conditions — Ben's room is always accessible (door may be closed but navigable).
# Lane 1 hub only activates when arc conditions are met — the location itself stays open.

[[locations]]
id          = "loc_shared_kitchen"
name        = "Kitchen"
description = "Small galley kitchen. One window above the sink. Ben's coffee mug is always in the same spot. She knows which burner runs hot."
image       = "locations/kitchen.jpg"
entry_from  = "loc_mayas_apartment"

[[locations]]
id          = "loc_living_room"
name        = "Living Room"
description = "A couch, a coffee table, a TV they mostly don't watch. Ben's book is on the side table. The light in the evening is good."
image       = "locations/living_room.jpg"
entry_from  = "loc_mayas_apartment"

[[locations]]
id          = "loc_bathroom"
name        = "Bathroom"
description = "Shared. One hook on the back of the door. The shower takes a minute to get hot."
image       = "locations/bathroom.jpg"
entry_from  = "loc_mayas_apartment"

[[locations]]
id          = "loc_laundry_room"
name        = "Laundry Nook"
description = "A closet off the kitchen with a stacked washer-dryer the last tenant left behind. Detergent on the shelf, Ben's work shirts usually in the basket. Cramped, but it beats the basement machines."
image       = "locations/laundry_room.jpg"
entry_from  = "loc_mayas_apartment"

[[locations]]
id          = "loc_building_front"
name        = "Building Front"
description = "The steps outside the building. A few parking spots, a bank of dented mailboxes by the door. You can see the diner sign two blocks down from here. Pam sits out on the bottom step some evenings."
image       = "locations/building_front.jpg"
# Exterior root of the home cluster (NO entry_from — parallel to loc_main_street).
# Reached from town via activity_walk_to_town; go UP into the building via the hallway.
navigation_order = ["loc_building_hallway"]
# Bridge to town hub: activity_walk_to_town (here → loc_main_street). Pam's evening surface.

[[locations]]
id          = "loc_building_hallway"
name        = "Building Hallway"
description = "The shared corridor of the building — scuffed tile, a row of mailboxes, a stairwell at the end that goes up to the other floors. Pam's door is across from Maya's. Sound carries between units here."
image       = "locations/building_hallway.jpg"
entry_from  = "loc_building_front"
navigation_order = ["loc_mayas_apartment"]
# Minimal pass-through (no canvases). Shared building space — neighbors (Pam) appear
# here, never inside Maya's private apartment. Stairwell + more floors extend off here
# later: add loc_building_stairwell (entry_from = here) → loc_building_hallway_2, etc.

# ── Town hub ──────────────────────────────────────────────────────────────────

[[locations]]
id               = "loc_main_street"
name             = "Main Street"
description      = "One long street through the middle of town. The diner is midblock. The convenience store is at the far end. There's a park past the library."
# NON-container standing hub (NOT is_container): renders child nav via navigation_order
# AND hosts canvases here (activity_walk_home + scene_cole_post_shift_walk fire here).
navigation_order = [
  "loc_diner_front",
  "loc_convenience_store",
  "loc_thrift_store",
  "loc_town_park",
  "loc_cole_apartment",
]
# Coverage gate (clothing system): can't walk into town half-dressed. A dress
# satisfies top+bottom. Home interiors are intentionally ungated.
# RTS-faithful: CONDITIONAL — the cover-up rule only applies BELOW the Slutty band.
# The rule carries a `conditions` gate (corruption < 50); checkLocationClothing only
# enforces a rule whose conditions are satisfied. At corruption 50+ the condition
# fails, no rule matches, and she walks out underdressed without shame (RTS Bedroom
# getCorruptionLevel parallel). Single non-empty rule — validator requires slots.
clothing_rules = [
  { slots_required = ["top", "bottom"], message = "She can't head out half-dressed — better go back and put something on.", conditions = { version = "1.0", items = [
      { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 50 },
    ] } },
]
# loc_building_front is the home cluster's exterior root (top-level, no entry_from —
# parallel to loc_main_street). Bridge home <-> town = activity_walk_to_town / walk_home (phase 3).

[[locations]]
id          = "loc_diner_front"
name        = "Mel's — Dining Floor"
description = "Counter + six booths. The neon sign in the window reads MEL'S in red. Hank's photo of Mel is above the register — he's never moved it. Rosa runs the floor on evening shift; Maya takes over at ten."
image       = "locations/diner_front.jpg"
entry_from  = "loc_main_street"
navigation_order = ["loc_diner_back", "loc_diner_office"]

[[locations]]
id          = "loc_diner_back"
name        = "Mel's — Kitchen"
description = "The grill, the prep line, the dish station. Cole's side. Steam and the smell of grease and coffee mixed together. Narrow enough that two people passing each other have to turn sideways."
image       = "locations/diner_back.jpg"
entry_from  = "loc_diner_front"
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "hired_at_diner", operator = "is_true" },
] }
blocked_message = "I don't work here yet. I shouldn't be back there."

[[locations]]
id          = "loc_diner_office"
name        = "Mel's — Back Office"
description = "Hank's office. A desk, a lamp, a filing cabinet, a cot against one wall. The door has a bolt lock on the inside. The photo of Mel is in here too — a different one, from before the diner."
image       = "locations/diner_office.jpg"
entry_from  = "loc_diner_front"
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "hank_first_contact", operator = "is_true" },
] }
blocked_message = "He hasn't invited me back there yet."

[[locations]]
id          = "loc_town_park"
name        = "Town Park"
description = "A couple of benches, some old trees, a walking path nobody really uses. Quiet during the day. Cole is here sometimes in the late afternoon between sleep and shift."
image       = "locations/town_park.jpg"
entry_from  = "loc_main_street"

[[locations]]
id          = "loc_cole_apartment"
name        = "The Apartment Across Town"   # genericized: location names aren't @-token processed (doctrine/14 §4)
description = "A studio two blocks from the diner. Drawings pinned to the walls — real ones, careful ones. Smells like coffee and something chemical. Clean in the way a person is clean when neatness doesn't occur to them but mess does."
image       = "locations/cole_apartment.jpg"
entry_from  = "loc_main_street"
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "cole_date_done", operator = "is_true" },
] }
blocked_message = "I don't know where he lives yet."

[[locations]]
id          = "loc_convenience_store"
name        = "Convenience Store"
description = "Open until midnight. Bright fluorescent light. The girl at the register knows everyone's name. Good for energy drinks and nothing else."
image       = "locations/convenience_store.jpg"
