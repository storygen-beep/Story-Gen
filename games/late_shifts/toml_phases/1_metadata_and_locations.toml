# ── Pam Dockery ───────────────────────────────────────────────────────────────

[[npcs]]
id          = "npc_pam"
name        = "Pam"
description = "56. Retired bookkeeper. Has lived in this building for twelve years and seen everything. Polite in a way that means she's paying attention. Was friendly with Ben before Maya arrived."
portrait    = "pam.jpg"
core_traits = { relation = 5, awareness = 0 }
# awareness: silent accumulator 0–100. Hidden from sidebar per antagonist doctrine.
# relation = 5 baseline: she's been polite-friendly with Ben; slight positive start.
flag_keys   = []
arc_stages  = []      # Antagonist — no arc stages; uses awareness bands instead

[npcs.trait_decay]
# Awareness does NOT decay — one-way climb per antagonist doctrine.
# Relation minimal decay.
relation = 0.2

# Pam schedules — building-presence windows. Pam is a NEIGHBOR (different unit), so
# she only appears in SHARED building space, never inside Maya's private apartment.
# Daytime: the shared building hallway (mailboxes/corridor). Evening: the front steps,
# where ALL her canvases (ambients + confrontation) fire as Maya heads to her 22:00 shift.

[[npcs.schedules]]
location   = "loc_building_hallway"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "06:00"
end_time   = "11:00"
activity   = "laundry, mail, hallway errands"

[[npcs.schedules]]
location   = "loc_building_front"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "17:00"
end_time   = "22:00"
activity   = "evening — sitting out front"

# ── Vince ─────────────────────────────────────────────────────────────────────
# Landlord / building super. Rent collector — see [settings.rent] in
# 0_systems_spec.toml (collector_npc = "npc_vince"). Not an arc NPC in this slice:
# a functional collector with NO physical [[npcs.schedules]] — D72-R6 corollary: a
# schedule row is a promise of a Lane 1 hub, and Vince has none. He is met via the
# weekly RentDay engine intercept on Friday + his phone threads, not standing presence.

[[npcs]]
id          = "npc_vince"
name        = "Vince"
description = "51. Thick through the middle, forearms like a man who still fixes his own boilers. Gray stubble, a ring of keys on his belt that announces him before he knocks. Owns this building and three others across town; addresses every tenant by unit number until they've given him a reason to use their name."
portrait    = "vince.jpg"
core_traits = { relation = 0 }
flag_keys   = []
arc_stages  = []      # Functional collector — no arc ladder in this slice.

[npcs.trait_decay]
