# ─────────────────────────────────────────────────────────────────────────────
# 11. activity_work_shift — Full shift economic mechanic (Pattern C)
# ─────────────────────────────────────────────────────────────────────────────
# Maya works a full 8-hour shift. Money earns unconditionally via Pattern C
# pre_substitution_effects — fires regardless of whether Hank appears.
# A mild Hank sub (T0+) is wired here for the early-shift chance encounter.
# The specific work tasks (restock, prep, walk-in, storage) are separate
# shorter dispatchers with higher sub chances for escalation beats.
# This canvas is the player's primary economic action (once per night).

[[canvases]]
id          = "activity_work_shift"
name        = "Work the shift"
description = "Maya full-shift economic dispatcher. Pattern C: money +45 unconditional via pre_substitution_effects. Hank brief-encounter sub at T0+. 8h shift. Requires hired_at_diner."

[canvases.trigger]
location      = "loc_diner_front"
is_repeatable = true
priority      = 3
is_active     = true
max_triggers_per_day = 1
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key  = "hired_at_diner",    operator = "is_true"  },
  { type = "flag",  subject = "player", flag_key  = "shift_worked_today", operator = "is_false" },
] }

# Pattern C: income fires unconditionally before the sub check.
# Shape = TemplateChoiceEffect: { targetType, trait, op, value } — no `type` field.
[[canvases.trigger.pre_substitution_effects]]
targetType = "player"
trait      = "money"
op         = "add"
value      = 45

[[canvases.trigger.pre_substitution_effects]]
targetType = "player"
trait      = "energy"
op         = "add"
value      = -20

# Mild Hank sub during shift (he patrols the floor). Low chance; T0+.
# The richer escalation subs live on the specific-task dispatchers above.
[[canvases.trigger.substitutions]]
target_canvas_id = "scene_hank_passes_during_restock"
chance           = 0.15
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "hired_at_diner", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4]
start_time = "22:00"
end_time   = "07:00"

[[canvases.nodes]]
id   = "base"
name = "Work the shift"
blocks = [
  { type = "image", props = { file = "activities/work_shift.jpg" } },
  { type = "paragraph", content = "She works the floor. Takes orders, runs food, refills coffees without being asked. The diner quiet at 3am except for the regular at Table 6 and a trucker at the counter who wants pie. She finds the rhythm of it." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Shift's done. Go home."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_diner_front"
time_progression_minutes = 480
effects = [
  { targetType = "player", trait = "hygiene", op = "add", value = -10 },
]
flagEffects = [
  { targetType = "player", flag = "shift_worked_today", op = "set" },
]
# Note: money and energy already applied via pre_substitution_effects above (Pattern C).
# Do NOT re-apply them here — that would double-count.

