# Phase 3/7 — 3_activities.toml
# Late Shifts — Maya-solo activity dispatchers + Lane 3 substitution rules
# Save this file as: games/late_shifts/toml_phases/3_activities.toml
#
# Contents: all Maya-solo activity canvases at apartment + diner locations.
# Each dispatcher carries [[canvases.trigger.substitutions]] rules wiring
# NPC walk-in targets (authored in phase 5) onto activity-attempt rolls.
#
# Dispatcher pattern selection (per doctrine/02 §4.7 + §5.4a):
#   Pattern A (sequential first-match) — default; used for all activities here
#     because each has at most one NPC sub target per activity.
#   Pattern C (pre_substitution_effects) — used for activity_work_shift to
#     guarantee income fires on both solo and substituted paths.
#
# Lane budget check:
#   Hank (family/ambient): 5–7 Lane 3 subs → 4 diner-work dispatchers below
#   Ben (slow-burn family): 2–3 Lane 3 subs → 4 apartment dispatchers below
#   Cole (peer/dating): Lane 3 = 0 — NO Cole subs on any dispatcher
#   Rosa (service): Lane 3 = 0 — NO Rosa subs
#   Pam (antagonist): Lane 3 = 0 own — Pam fires as Lane 2 ambient (phase 5)
#
# Prose register: RTS-flat (solo activities — not capstones)
# Sub target canvas IDs reference phase 5 canvases (resolved at build time by slug).

# ═════════════════════════════════════════════════════════════════════════════
# APARTMENT DISPATCHERS
# ═════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# 1. activity_make_tea — Kitchen solo, Ben sub at Stage 2+
# ─────────────────────────────────────────────────────────────────────────────

[[canvases]]
id          = "activity_make_tea"
name        = "Make a cup of tea"
description = "Maya-solo dispatcher. Kitchen. Sub: scene_ben_walks_in_kitchen at Stage 2+ (ben_stage1 + corr 15+)."

[canvases.trigger]
location      = "loc_shared_kitchen"
is_repeatable = true
priority      = 3
is_active     = true

[[canvases.trigger.substitutions]]
target_canvas_id = "scene_ben_walks_in_kitchen"
chance           = 0.30
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player",   flag_key  = "ben_stage1",  operator = "is_true" },
  { type = "trait", subject = "player",   trait_key = "corruption",  operator = "gte", value = 15 },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "07:00"
end_time   = "22:00"

[[canvases.nodes]]
id   = "base"
name = "Make a cup of tea"
blocks = [
  { type = "image", props = { file = "activities/make_tea.jpg" } },
  { type = "paragraph", content = "She fills the kettle from the tap. Sets it on the burner. Drops a bag in the mug while the water comes up. The kitchen quiet around her. The kettle clicks when it's hot. She pours." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Take the mug."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_shared_kitchen"
time_progression_minutes = 10
effects = [
  { targetType = "player", trait = "energy", op = "add", value = 3 },
]

