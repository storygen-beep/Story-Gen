# =============================================================================
# Orientation — 1_metadata_and_locations
#
# THE MAP — two_hub, rooted on the avenue.
#
#     the_avenue ──┬── her_room  (home base)
#      (ROOT,      ├── the_kitchen
#       exterior)  ├── the_bathroom
#                  ├── the_back_bedroom
#                  ├── wes_room
#                  └── the_quad ──┬── the_pledge_house   ANCHOR
#                    40 min, $2   ├── halloran_office
#                                 └── the_counter
#
# ⚠️ CORRECTED AT BUILD. The board declared TWO roots joined by a travel canvas
#    (the-map.md R3). The engine cannot express it: template_import.py:4287
#    hard-fails a navigation_order entry whose entry_from is not that location, and
#    gate 11 builds adjacency from entry_from + navigation_order ONLY — a
#    canvas-only crossing would strand the_quad and its three children. The bridge
#    is the travel COST on the_quad, which is the-map.md's own mechanism. two_hub
#    is untouched: it is "two strong hubs joined by a commute" and says nothing
#    about roots. Logged in v2_state.json decisions.
#
# ⚠️ navigation_order is FORWARD-ONLY: the children of this location, never the way
#    back. The return link is implicit from entry_from.
#
# ⚠️ TRAVEL COST SITS ON THE BRIDGE, NOT ON EVERY ROOM. Only the_quad carries one.
#    A premise that says "forty minutes away" while arriving costs nothing has
#    written a fact the player never experiences.
#
# ⚠️ THERE IS NO [[needs]] TABLE. The importer reads no such key. The needs are
#    [player.core_traits] + [player.trait_decay] plus the conditions that read them,
#    and they are DECLARED in v2_state.json where gate 29 reads them.
# =============================================================================

[player]
id           = "player"
name         = "Josie"
customizable = true
player_description = "You have been in this house four hours. Nobody in it has a read on you yet."

# ⚠️ ONE player field. The other two the design calls "fields" live on the NPCs as
#    relationship_options, which is the axis the field actually uses — the player
#    names the household and the kinship inside it.
#    `id = "name"` is the one id the generator maps to $player.name; any other id
#    writes $player.<id>. Read in prose as @player.
#
# ⚠️ Declaring this repoints the age gate at CustomizeCharacters (v2.py:1065,
#    v2.py:9251). Its headings and button are HARD-CODED — the only text we own is
#    player_description above. Seven of fifteen built games ship the default there,
#    in a product voice, as the second thing a player reads.
[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "What does the house call you?"
default = "Josie"

# ⚠️ SECTION form, not an inline table — a multi-line core_traits = { … } is a TOML
#    parse error.
[player.core_traits]
# The three she climbs. Rungs at 5/15/30/50/70/90 and 10/25/45/65/85.
nerve      = 0
appetite   = 0
reputation = 0

# The counterweight. Starts FULL and falls — above 60 Ray will not move.
home_face  = 100

# The body. Three, each shutting a real door.
rest       = 100
clean      = 100
fed        = 100

# ⚠️ QUANTITIES, NOT 0-100 METERS. Every effect that writes either carries
#    clamp = false, or the default clamp caps them at 100 and both the $120 dues
#    and the 200-follower door become unreachable. Valid TOML, green build, dead game.
money      = 45
followers  = 0

# ─── The clock on the body — [player.trait_decay] ────────────────────────────
# ⚠️ Decay is a POSITIVE MAGNITUDE. The validator rejects a negative.
[player.trait_decay]
rest  = 12
clean = 15
fed   = 20


