# ═════════════════════════════════════════════════════════════════════════════
# THE WARDROBE — [[clothing]]
# ═════════════════════════════════════════════════════════════════════════════
# ⚠️ `exposure` is a 0/1/2 scalar and worn_exposure takes the MAX across the outfit
#    AND treats an empty core slot as bare. It is the only one of the four worn
#    predicates that reads an empty slot, which is what makes it the right one for a
#    rung. beauty and corruption cannot tell naked from plainly dressed.
#
# ⚠️ A GARMENT IS A RUNG. Simone's step 5 asks her to do nothing at all — it asks her
#    to WEAR something, and the arc will not pass until she does. And clothing also
#    moves the FLOOR of the ambient roll: same scenes, twice as much world.
#
# ⚠️ WHAT MONEY BUYS OPENS A DOOR. The dress is bought and READ — money buys the KEY
#    to a rung, never a meter point.

[[clothing]]
id      = "plain_bra"
name    = "Plain bra"
slot    = "bra"
image   = "clothing/plain_bra.jpg"
initial = true
beauty  = 1
corruption = 0
exposure = 0

