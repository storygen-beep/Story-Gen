[[locations]]
id                   = "the_avenue"
name                 = "Avenue"
description          = "Four houses, a shelter at the stop, and Ray's car in the drive with one wheel up on the kerb. The bus into campus is forty minutes and it goes when it goes. This is the street the house is on and everything on this side hangs off it."
image                = "locations/the_avenue.jpg"
image_search_queries = ["suburban street bus stop shelter morning", "residential avenue parked car bus stop"]
navigation_order     = ["her_room", "the_kitchen", "the_bathroom", "the_back_bedroom", "wes_room", "the_quad"]

[[locations]]
id                   = "her_room"
name                 = "Your Room"
description          = "It was an office until Sunday. The shelves are still up and there is a bracket on the wall where a monitor arm used to be. Your bed is under them and your second case is not unpacked. You sleep here and you dress here."
image                = "locations/her_room.jpg"
image_search_queries = ["small bedroom converted office shelves single bed", "teen girl bedroom moving boxes shelves"]
entry_from           = "the_avenue"

[[locations]]
id                   = "the_kitchen"
name                 = "Kitchen"
description          = "Where this house eats and where it argues. Your mother is in it until nine on the nights she works and Ray is in it from ten, and those two facts do not overlap. There is food, and after ten there is nobody else."
image                = "locations/the_kitchen.jpg"
image_search_queries = ["family kitchen night overhead light table", "suburban kitchen dark evening table two chairs"]
entry_from           = "the_avenue"

[[locations]]
id                   = "the_bathroom"
name                 = "Bathroom"
description          = "One bathroom, four people, and a bolt that works. This is where you wash and it is where you decide about the bolt, and @wes is behind that door every morning before seven."
image                = "locations/the_bathroom.jpg"
image_search_queries = ["small family bathroom shower door mirror", "narrow bathroom sink mirror morning light"]
entry_from           = "the_avenue"

[[locations]]
id                   = "the_back_bedroom"
name                 = "Ray's Room"
description          = "The room at the back of the house where your mother and @ray sleep, and where he is on his own from one in the morning on the nights she works. You have walked past this door every day since you got here."
image                = "locations/the_back_bedroom.jpg"
image_search_queries = ["dark bedroom doorway hallway night", "master bedroom door ajar dark corridor"]
entry_from           = "the_avenue"

[[locations]]
id                   = "wes_room"
name                 = "Wes's Room"
description          = "@wes never moved out. He is a junior and he still sleeps twelve feet from the bathroom, and the door is usually open, which is a fact about him rather than about the door."
image                = "locations/wes_room.jpg"
image_search_queries = ["college guy bedroom messy desk laptop", "young man bedroom open door bed desk"]
entry_from           = "the_avenue"

# ─── THE BRIDGE ──────────────────────────────────────────────────────────────
# ⚠️ The commute, priced. Forty minutes and two dollars, every crossing. This is
#    the ONLY location in the game carrying a travel cost, and it is what makes
#    being in two places stop being free — which is the entire point of having
#    authored a schedule grid. The other way across is a ride from @wes or @ray:
#    fifteen minutes, no fare, and you have to ask.
[[locations]]
id                   = "the_quad"
name                 = "Quad"
description          = "Open ground with the lecture buildings on three sides and the row of houses along the east edge. The eight o'clock is in the hall behind you and two hundred people go to it. This is where campus starts and where you can see the rest of the row from."
image                = "locations/the_quad.jpg"
image_search_queries = ["college campus quad students walking daytime", "university green lawn buildings students"]
entry_from           = "the_avenue"
costs                = { time = 40, money = 2 }
navigation_order     = ["the_pledge_house", "halloran_office", "the_counter"]

[[locations]]
id                   = "the_pledge_house"
name                 = "Pledge House"
description          = "Third house along the row. Twelve girls live in it, Simone runs it, and there is a book on the table inside the door that everybody signs and nobody reads. Downstairs is where you get taken in. Upstairs on a Thursday is what you get taken in for."
image                = "locations/the_pledge_house.jpg"
image_search_queries = ["sorority house exterior porch evening", "college house party living room night"]
entry_from           = "the_quad"

[[locations]]
id                   = "halloran_office"
name                 = "Halloran's Office"
description          = "Third floor, at the end, and the department empties at five. He holds office hours here for whoever turns up, which is how you get a grade changed and how you get a key. The last hour is the only hour anybody is up here."
image                = "locations/halloran_office.jpg"
image_search_queries = ["university professor office bookshelves desk", "academic office door corridor evening"]
entry_from           = "the_quad"

[[locations]]
id                   = "the_counter"
name                 = "Counter"
description          = "The coffee counter on the ground floor of the union building. This is where your money comes from — six shifts a week if you can take them — and there is a stockroom behind it with a door that closes."
image                = "locations/the_counter.jpg"
image_search_queries = ["campus coffee counter cafe interior students", "small cafe service counter espresso machine"]
entry_from           = "the_quad"


# ═════════════════════════════════════════════════════════════════════════════
# THE CAST — five, and each owns a different corner of the world
# ═════════════════════════════════════════════════════════════════════════════
# ⚠️ ORDERING TRAP: [[npcs.schedules]] binds to the [[npcs]] block ABOVE it.
#    Inserting a new character between an existing one and its schedules silently
#    re-parents them.
#
# ⚠️ 0 = MONDAY, 6 = Sunday (v2.py:3906, SHORT = ["Mon"…"Sun"]). An empty or
#    seven-long list means every day.
#
# ⚠️ A DAY-SPECIFIC OVERNIGHT WINDOW NEEDS TWO ROWS. The weekday check runs FIRST
#    and against TODAY (v2.py:3596), then the time check (v2.py:3597).
#    isCurrentTimeSlot handles the midnight wrap fine — but a day-specific row puts
#    the character on site and DELETES them at midnight, because todayIndex has
#    moved on. An ALL-DAYS row would legitimately be one. Two characters here are
#    split for exactly this reason: @ray's kitchen and Simone's party window.
#
# ⚠️ ONE WILLINGNESS WORD FOR THE WHOLE CAST — `relation`, same scale on everyone.
#    People are differentiated by what modifies it, never by different vocabularies.
#    The rich pair (+ lust) goes to @ray and Simone ONLY: the two arcs that carry
#    the game. Field median is 3 rungs per person; the 8-17 figure is the PLAYER's
#    ascent meter and does not transfer to the cast.

# ─── @ray — the house, the money, the car ────────────────────────────────────
# ⚠️ customizable = true ALSO renders a name textbox (v2.py:9294), unconditionally.
#    So he is player-renameable and EVERY line of prose about him uses @ray.
[[npcs]]
id           = "npc_ray"
name         = "Ray"
# ⚠️ `relationship` ON A CUSTOMIZABLE NPC IS THE DEFAULT SELECTED OPTION, NOT PROSE.
#    It must be a member of relationship_options or the importer hard-fails:
#    "default relationship '<x>' not in relationship_options". Prose belongs in
#    description. Cost one build.
relationship = "stepfather"
role         = "@ray.rel"   # F10 — the label under the name. The PLAYER'S pick from
                            # relationship_options below: stepfather / mom's husband /
                            # father / uncle. Never hard-code it for a renameable NPC.
description  = "Your mother married him in June and the house came with him. Forty-six. Owns the house, pays the tuition, and has not once said so out loud. He was on his own in it for a long time before your mother and he has not finished being surprised that anyone is in the kitchen at night."
portrait     = "ray.jpg"
customizable = true
relationship_options = ["stepfather", "mom's husband", "father", "uncle"]
core_traits  = { relation = 0, lust = 0 }
flag_keys    = ["met_ray"]
arc_stages   = ["The man who owns it", "Up when you are up", "Owing him", "Not pretending"]

[[npcs.schedules]]
location   = "the_avenue"
weekdays   = [0, 1, 2, 3, 4]
start_time = "08:00"
end_time   = "08:30"
activity   = "putting the case in the car and not in a hurry about it"

[[npcs.schedules]]
location   = "the_avenue"
weekdays   = [0, 1, 2, 3, 4]
start_time = "18:00"
end_time   = "18:30"
activity   = "back, sitting in the car for a minute before he comes in"

# The kitchen window — Sun-Thu, because Dee is on nights those days. SPLIT IN TWO.
[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [6, 0, 1, 2, 3]
start_time = "22:00"
end_time   = "23:59"
activity   = "up on his own with the radio down low"

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4]
start_time = "00:00"
end_time   = "01:00"
activity   = "still up, and not going to bed while you are down here"

# ─── Dee — the shift, the rules, the reason it costs ─────────────────────────
[[npcs]]
id           = "npc_dee"
name         = "Dee"
relationship = "Your mother."
role         = "mother"   # F10 — the label under the name in every dialogue box
description  = "Forty-three, agency nights at the county hospital, ten to six. She married the house and she is grateful for it in a way she says out loud too often. She is the reason every hour you spend in that kitchen after ten costs something."
portrait      = "dee.jpg"
core_traits  = { relation = 0 }
flag_keys    = ["met_dee"]
arc_stages   = ["Your mother", "Asking properly"]

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [6, 0, 1, 2, 3]
start_time = "17:00"
end_time   = "21:00"
activity   = "eating standing up with her keys already in her hand"

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [4, 5]
start_time = "09:00"
end_time   = "13:00"
activity   = "home, awake, and in the middle of everything"

# ─── @wes — the ride, the bathroom, the campus he already knows ──────────────
[[npcs]]
id           = "npc_wes"
name         = "Wes"
relationship = "stepbrother"
role         = "@wes.rel"   # F10 — stepbrother / half-brother / brother / cousin,
                            # whichever the player chose.
description  = "The son of the man your mother married, a junior at the college you start tomorrow. Twenty, never moved out, and already inside every room you are trying to get into. He is the only person who sees both halves of your life and he has not decided what to do with that yet."
portrait     = "wes.jpg"
customizable = true
relationship_options = ["stepbrother", "half-brother", "brother", "cousin"]
core_traits  = { relation = 0 }
flag_keys    = ["met_wes"]
arc_stages   = ["His house", "The ride", "The door open"]

# ⚠️ 06:40-07:10 and 07:15-07:50 DO NOT OVERLAP. An earlier draft had the bathroom
#    at 07:00-08:00 against an avenue row at 07:10-07:45 — thirty-five minutes in
#    two rooms. Caught by reading the person sheet against the opening sheet, which
#    is the only place a cross-room conflict is visible.
