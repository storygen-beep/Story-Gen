# =============================================================================
# Orientation — 1_metadata_and_locations
#
# THE MAP — nested_zones, rooted on the avenue.
#
#     the_avenue ──┬── the_hall ──┬── her_room  (home base)
#      (ROOT,      │              ├── the_kitchen
#       exterior)  │              ├── the_bathroom
#                  │              ├── the_back_bedroom
#                  │              └── wes_room
#                  └── the_quad ──┬── the_row ── the_pledge_house   ANCHOR
#                    40 min, $2   ├── halloran_office
#                                 └── the_counter
#
# ⚠️ RESTRUCTURED 2026-09-02. This was two_hub with all five house rooms hanging
#    off the STREET and the pledge house hanging off a lawn — the-map.md R3's own
#    inverted-map failure ("the home contains a bit of world"), and R5's ("three
#    uses of the same word is a place": the prose said landing 7x, stairs 6x,
#    corridor 3x, and the map had none of them). the_hall and the_row are those
#    words made into ground. Measured shape before: the avenue carried 2 things to
#    do against 6 ways out; the field median for a place is 3 things and 1 way out
#    (the-surfaces.md:151-156).
#
#    The archetype is now nested_zones — the-map.md:38's "default to beat", and a
#    literal description of this premise ("a town or campus PLUS a home"). Still
#    ONE root: depth is free (template_import.py validates existence, cycles and
#    child-membership only), two roots are not. Logged in v2_state.json decisions.
#
# ⚠️ navigation_order is FORWARD-ONLY: the children of this location, never the way
#    back. The return link is implicit from entry_from.
#
# ⚠️ TRAVEL COST SITS ON THE BRIDGE, NOT ON EVERY ROOM. Only the_quad carries one.
#    A premise that says "forty minutes away" while arriving costs nothing has
#    written a fact the player never experiences.
#
# ⚠️ THERE IS NO [[needs]] TABLE. The importer reads no such key. The needs are
#    [player.core_traits] + [player.trait_decay] plus the conditions that read them,
#    and they are DECLARED in v2_state.json where gate 29 reads them.
# =============================================================================

[player]
id           = "player"
name         = "Josie"
customizable = true
player_description = "You have been in this house four hours. Nobody in it has a read on you yet."

# ⚠️ ONE player field. The other two the design calls "fields" live on the NPCs as
#    relationship_options, which is the axis the field actually uses — the player
#    names the household and the kinship inside it.
#    `id = "name"` is the one id the generator maps to $player.name; any other id
#    writes $player.<id>. Read in prose as @player.
#
# ⚠️ Declaring this repoints the age gate at CustomizeCharacters (v2.py:1065,
#    v2.py:9251). Its headings and button are HARD-CODED — the only text we own is
#    player_description above. Seven of fifteen built games ship the default there,
#    in a product voice, as the second thing a player reads.
[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "What does the house call you?"
default = "Josie"

# ⚠️ SECTION form, not an inline table — a multi-line core_traits = { … } is a TOML
#    parse error.
[player.core_traits]
# The three she climbs. Rungs at 5/15/30/50/70/90 and 10/25/45/65/85.
nerve      = 0
appetite   = 0
reputation = 0

# The counterweight. Starts FULL and falls — above 60 Ray will not move.
home_face  = 100

# The body. Three, each shutting a real door.
rest       = 100
clean      = 100
fed        = 100

# ⚠️ QUANTITIES, NOT 0-100 METERS. Every effect that writes either carries
#    clamp = false, or the default clamp caps them at 100 and both the $120 dues
#    and the 200-follower door become unreachable. Valid TOML, green build, dead game.
money      = 45
followers  = 0

# ─── The clock on the body — [player.trait_decay] ────────────────────────────
# ⚠️ Decay is a POSITIVE MAGNITUDE. The validator rejects a negative.
[player.trait_decay]
rest  = 12
clean = 15
fed   = 20


# ═════════════════════════════════════════════════════════════════════════════
# THE MAP
# ═════════════════════════════════════════════════════════════════════════════

[[locations]]
id                   = "the_avenue"
name                 = "Avenue"
description          = "Four houses, a shelter at the stop, and Ray's car in the drive with one wheel up on the kerb. The bus into campus is forty minutes and it goes when it goes. This is the street the house is on, and the house is the one with the light on over the door."
image                = "locations/the_avenue.jpg"
image_search_queries = ["suburban street bus stop shelter morning", "residential avenue parked car bus stop"]
navigation_order     = ["the_hall", "the_quad"]

# ═══ THE HALL ═══ the-map.md R5. The prose named this room seven times before the
# map contained it: "a landing that carries", "@wes is twelve feet that way",
# "the landing light is on a timer". Every room of the house now hangs off it
# instead of off the street.
#
# ⚠️ NOT is_container. A container SWALLOWS any canvas attached to it
#    (engine.md:770-772) and would leave this permanently in gate 1's "declared
#    locations with nothing placed" list — and unwarmable, which fails gate 5.
#
# ⚠️ NO [[npcs.schedules]] ROW HERE, DELIBERATELY. `the walk-in floor` (gate 30)
#    qualifies any location holding BOTH a solo repeatable canvas AND a scheduled
#    body, and then owes it a substitution rule. This room reports on the rooms
#    NEXT to it, which does not qualify it.
[[locations]]
id                   = "the_hall"
name                 = "Hall"
description          = "The front door, the stairs, and the kitchen through the arch. Four doors off the landing at the top and one bathroom among them, and it carries every sound the house makes. You pass through this six times a day and it is where you find out who is in."
image                = "locations/the_hall.jpg"
image_search_queries = ["house hallway stairs front door interior", "narrow hall staircase landing evening light"]
entry_from           = "the_avenue"
navigation_order     = ["her_room", "the_kitchen", "the_bathroom", "the_back_bedroom", "wes_room"]

# R6c — a hall is shared circulation and gets NO door. Occupancy is prose inside
# the room, not a threshold in front of it.
#
# The variants are the house reporting itself. `npc_at_location` is cross-room
# (v2.py:4368-4387), so a condition evaluated HERE can ask about the bathroom.
# The destination cards already carry a portrait badge for whoever is scheduled
# in that room right now (v2.py:20338) — this is the sentence that goes with it.
[[locations.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_bathroom", npc_id = "npc_wes", operator = "is_present" },
] }
text = "The water is going in the bathroom and the door is shut, which between ten to seven and ten past is @wes and is not negotiable. The stairs are cold. Your mother's coat is gone off the hook."

[[locations.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_kitchen", npc_id = "npc_ray", operator = "is_present" },
  { type = "npc_at_location", location_id = "the_kitchen", npc_id = "npc_dee", operator = "is_absent" },
] }
text = "The kitchen light is on through the arch and the radio is down so low it is only a shape. One person makes that much noise and it is not your mother, because her car went at half nine."

[[locations.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_kitchen", npc_id = "npc_dee", operator = "is_present" },
] }
text = "Your mother is in the kitchen with her keys already down somewhere she will not find them. The hall smells like the coat she wears to work. Four doors upstairs and all of them shut."

[[locations.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "wes_room", npc_id = "npc_wes", operator = "is_present" },
] }
text = "The landing light has gone off on its timer and there is a line under @wes's door with something playing behind it. The rest of the house is dark all the way down to the front door."

[[locations]]
id                   = "her_room"
name                 = "Your Room"
description          = "It was an office until Sunday. The shelves are still up and there is a bracket on the wall where a monitor arm used to be. Your bed is under them and your second case is not unpacked. You sleep here and you dress here."
image                = "locations/her_room.jpg"
image_search_queries = ["small bedroom converted office shelves single bed", "teen girl bedroom moving boxes shelves"]
entry_from           = "the_hall"

[[locations]]
id                   = "the_kitchen"
name                 = "Kitchen"
description          = "Where this house eats and where it argues. Your mother is in it until nine on the nights she works and Ray is in it from ten, and those two facts do not overlap. There is food, and after ten there is nobody else."
image                = "locations/the_kitchen.jpg"
image_search_queries = ["family kitchen night overhead light table", "suburban kitchen dark evening table two chairs"]
entry_from           = "the_hall"

[[locations]]
id                   = "the_bathroom"
name                 = "Bathroom"
description          = "One bathroom, four people, and a bolt that works. This is where you wash and it is where you decide about the bolt, and @wes is behind that door every morning before seven."
image                = "locations/the_bathroom.jpg"
image_search_queries = ["small family bathroom shower door mirror", "narrow bathroom sink mirror morning light"]
entry_from           = "the_hall"

[[locations]]
id                   = "the_back_bedroom"
name                 = "Ray's Room"
description          = "The room at the back of the house where your mother and @ray sleep, and where he is on his own from one in the morning on the nights she works. You have walked past this door every day since you got here."
image                = "locations/the_back_bedroom.jpg"
image_search_queries = ["dark bedroom doorway hallway night", "master bedroom door ajar dark corridor"]
entry_from           = "the_hall"

# ═══ THE DOOR ═══ the-map.md R6. This room belongs to a person and she is the visitor,
# which is the whole test — not that somebody is sometimes in it. It is one of two doors
# in the game, and `the_bathroom` deliberately has none (R6c: a shared room takes
# occupancy-gated rows, not a threshold).
[locations.door]
description = "The door at the back of the house. Your mother is on until six and has been since August, and from one in the morning there is one person behind it."
# R6 — the field's refusal runs a median of 8 words and is allowed to be the same line
# every time. The value of the screen is its structure.
no_answer   = "You listen at it. The house is asleep and so is he."

[[locations.door.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_back_bedroom", npc_id = "npc_ray", operator = "is_present" },
] }
text = "The door at the back of the house, and the strip of light under it says he has not gone to sleep either. Your mother has four hours left of her shift."

[[locations.door.options]]
text       = "Knock."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_back_bedroom", npc_id = "npc_ray", operator = "is_present" },
] }
goes_to    = { type = "canvas", canvas_id = "ray_knock" }

# The top of the house track, and what the Want sells. `appetite` is raised elsewhere,
# so this is a real handle rather than the machinery narrating its own progress bar.
[[locations.door.options]]
text             = "Go in without knocking."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "appetite", operator = "gte", value = 70 },
  { type = "flag",  subject = "player", flag_key = "ray_open", operator = "is_true" },
] }
show_when_locked = true
locked_text      = "You have got as far as the handle twice. It is not the door that is not ready — you know exactly what you would be asking for and you cannot say it yet."
goes_to          = { type = "enter" }

# Nobody home. R6c's other half: the empty room is content, and the field builds it —
# 260 trespass labels across 15 of 27 games.
[[locations.door.options]]
text       = "Try the handle."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_back_bedroom", operator = "is_absent" },
] }
goes_to    = { type = "enter" }

[[locations]]
id                   = "wes_room"
name                 = "Wes's Room"
description          = "@wes never moved out. He is a junior and he still sleeps twelve feet from the bathroom, and the door is usually open, which is a fact about him rather than about the door."
image                = "locations/wes_room.jpg"
image_search_queries = ["college guy bedroom messy desk laptop", "young man bedroom open door bed desk"]
entry_from           = "the_hall"

# ═══ THE OPEN DOOR ═══ the-map.md R6, and the ONE place this game departs from the
# field on purpose. `become-someone` offers only *Knock* and entering is what knocking
# earns; here both are live, because @wes's door being open is a fact about HIM — the
# location's own description says so — and knocking on it anyway is a different beat
# from walking in. LO's call, 2026-09-02, and R6 records it as a departure.
[locations.door]
description = "His door, and it is open, which is the whole of what there is to say about it. The landing light is on a timer and it has gone off."
no_answer   = "He is not in. The desk lamp is off and the chair is pushed under."

[[locations.door.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "wes_room", npc_id = "npc_wes", operator = "is_present" },
] }
text = "His door is open the way it always is. One headphone is off and he has heard you on the landing, and he is going to let you decide what that means."

[[locations.door.options]]
text       = "Knock on the frame anyway."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "wes_room", npc_id = "npc_wes", operator = "is_present" },
] }
goes_to    = { type = "canvas", canvas_id = "wes_knock" }

[[locations.door.options]]
text       = "Go in."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "wes_room", npc_id = "npc_wes", operator = "is_present" },
] }
goes_to    = { type = "enter" }

[[locations.door.options]]
text       = "Have a look while he is out."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "wes_room", operator = "is_absent" },
] }
goes_to    = { type = "enter" }

# ─── THE BRIDGE ──────────────────────────────────────────────────────────────
# ⚠️ The commute, priced. Forty minutes and two dollars, every crossing. This is
#    the ONLY location in the game carrying a travel cost, and it is what makes
#    being in two places stop being free — which is the entire point of having
#    authored a schedule grid. The other way across is a ride from @wes or @ray:
#    fifteen minutes, no fare, and you have to ask.
[[locations]]
id                   = "the_quad"
name                 = "Quad"
description          = "Open ground with the lecture buildings on three sides and the row of houses along the east edge. The eight o'clock is in the theatre behind you and two hundred people go to it. This is where campus starts, and the row runs off it."
image                = "locations/the_quad.jpg"
image_search_queries = ["college campus quad students walking daytime", "university green lawn buildings students"]
entry_from           = "the_avenue"
costs                = { time = 40, money = 2 }
navigation_order     = ["the_row", "halloran_office", "the_counter"]

# ═══ THE ROW ═══ This was `act_quad_row`: a canvas whose only content was its own
# locked_text, whose unlocked choice returned the player to the quad after thirty
# minutes with no effect, no flag and no destination. `gates.py` printed it as a
# lint every build — "costs 30m and leaves nothing behind" — and it shipped anyway.
# The row is a street in this game's own prose (17 sites, a sidebar band, an item
# called row_dress). It is ground now.
#
# ⚠️ R4 NAMING RISK, ACCEPTED IN THE OPEN. the-map.md:180-183 killed "The Parade"
#    for being a word a player cannot resolve off a button. "Row" is the same class.
#    It survives because the game teaches it before this card exists — the meeting
#    with Simone, the dress on the rail, the sidebar band — and because R4:189-191
#    puts the load on the DESCRIPTION when the button cannot carry it. Hence the
#    first clause below says eight houses.
#
# ⚠️ NOT gated. The seven she cannot get into are prose that BANDS on reputation,
#    not seven stub locations and not a locked door onto an empty street. 0.1 ends
#    on Ray's door (appetite 70) and Simone's landing, both of which have content
#    behind them. Logged in DECISIONS.md A5 and the gate table.
[[locations]]
id                   = "the_row"
name                 = "The Row"
description          = "Eight houses along the east edge of the quad, porches all facing the same way, and you have been inside one of them. The other seven have their own books by their own doors and their own Fridays. Nobody stops you walking down it."
image                = "locations/the_row.jpg"
image_search_queries = ["sorority row houses street daytime", "college fraternity row houses porches"]
entry_from           = "the_quad"
navigation_order     = ["the_pledge_house"]

# The street reporting how far she has got. This is where "Cross to the row"'s
# locked_text went — it was the only real writing in that canvas.
[[locations.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "reputation", operator = "gte", value = 85 },
] }
text = "Eight houses and you have been inside one. Two of the others have said your name to you on the path this week without being told it first, which is how it starts, and there is a Friday coming that you have not been asked to yet."

[[locations.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "reputation", operator = "gte", value = 45 },
] }
text = "Eight houses and you have been inside one. You can walk down it and nobody stops you, and nobody opens a door either. They have heard of you now. Heard of is not the same as asked."

[[locations.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "reputation", operator = "gte", value = 25 },
] }
text = "Eight houses and you have been inside one. The rest have their own books by their own doors. You know two names off this street and neither of them knows yours yet."

[[locations]]
id                   = "the_pledge_house"
name                 = "Pledge House"
description          = "Third house along the row. Twelve girls live in it, Simone runs it, and there is a book on the table inside the door that everybody signs and nobody reads. Downstairs is where you get taken in. Upstairs on a Thursday is what you get taken in for."
image                = "locations/the_pledge_house.jpg"
image_search_queries = ["sorority house exterior porch evening", "college house party living room night"]
entry_from           = "the_row"

[[locations]]
id                   = "halloran_office"
name                 = "Halloran's Office"
description          = "Third floor, at the end, and the department empties at five. He holds office hours here for whoever turns up, which is how you get a grade changed and how you get a key. The last hour is the only hour anybody is up here."
image                = "locations/halloran_office.jpg"
image_search_queries = ["university professor office bookshelves desk", "academic office door corridor evening"]
entry_from           = "the_quad"

[[locations]]
id                   = "the_counter"
name                 = "Counter"
description          = "The coffee counter on the ground floor of the union building. This is where your money comes from — six shifts a week if you can take them — and there is a stockroom behind it with a door that closes."
image                = "locations/the_counter.jpg"
image_search_queries = ["campus coffee counter cafe interior students", "small cafe service counter espresso machine"]
entry_from           = "the_quad"


# ═════════════════════════════════════════════════════════════════════════════
# THE CAST — five, and each owns a different corner of the world
# ═════════════════════════════════════════════════════════════════════════════
# ⚠️ ORDERING TRAP: [[npcs.schedules]] binds to the [[npcs]] block ABOVE it.
#    Inserting a new character between an existing one and its schedules silently
#    re-parents them.
#
# ⚠️ 0 = MONDAY, 6 = Sunday (v2.py:3906, SHORT = ["Mon"…"Sun"]). An empty or
#    seven-long list means every day.
#
# ⚠️ A DAY-SPECIFIC OVERNIGHT WINDOW NEEDS TWO ROWS. The weekday check runs FIRST
#    and against TODAY (v2.py:3596), then the time check (v2.py:3597).
#    isCurrentTimeSlot handles the midnight wrap fine — but a day-specific row puts
#    the character on site and DELETES them at midnight, because todayIndex has
#    moved on. An ALL-DAYS row would legitimately be one. Two characters here are
#    split for exactly this reason: @ray's kitchen and Simone's party window.
#
# ⚠️ ONE WILLINGNESS WORD FOR THE WHOLE CAST — `relation`, same scale on everyone.
#    People are differentiated by what modifies it, never by different vocabularies.
#    The rich pair (+ lust) goes to @ray and Simone ONLY: the two arcs that carry
#    the game. Field median is 3 rungs per person; the 8-17 figure is the PLAYER's
#    ascent meter and does not transfer to the cast.

# ─── @ray — the house, the money, the car ────────────────────────────────────
# ⚠️ customizable = true ALSO renders a name textbox (v2.py:9294), unconditionally.
#    So he is player-renameable and EVERY line of prose about him uses @ray.
[[npcs]]
id           = "npc_ray"
name         = "Ray"
# ⚠️ `relationship` ON A CUSTOMIZABLE NPC IS THE DEFAULT SELECTED OPTION, NOT PROSE.
#    It must be a member of relationship_options or the importer hard-fails:
#    "default relationship '<x>' not in relationship_options". Prose belongs in
#    description. Cost one build.
relationship = "stepfather"
role         = "@ray.rel"   # F10 — the label under the name. The PLAYER'S pick from
                            # relationship_options below: stepfather / mom's husband /
                            # father / uncle. Never hard-code it for a renameable NPC.
description  = "Your mother married him in June and the house came with him. Forty-six. Owns the house, pays the tuition, and has not once said so out loud. He was on his own in it for a long time before your mother and he has not finished being surprised that anyone is in the kitchen at night."
portrait     = "ray.jpg"
customizable = true
relationship_options = ["stepfather", "mom's husband", "father", "uncle"]
core_traits  = { relation = 0, lust = 0 }
flag_keys    = ["met_ray"]
arc_stages   = ["The man who owns it", "Up when you are up", "Owing him", "Not pretending"]

[[npcs.schedules]]
location   = "the_avenue"
weekdays   = [0, 1, 2, 3, 4]
start_time = "08:00"
end_time   = "08:30"
activity   = "putting the case in the car and not in a hurry about it"

[[npcs.schedules]]
location   = "the_avenue"
weekdays   = [0, 1, 2, 3, 4]
start_time = "18:00"
end_time   = "18:30"
activity   = "back, sitting in the car for a minute before he comes in"

# The kitchen window — Sun-Thu, because Dee is on nights those days. SPLIT IN TWO.
[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [6, 0, 1, 2, 3]
start_time = "22:00"
end_time   = "23:59"
activity   = "up on his own with the radio down low"

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4]
start_time = "00:00"
end_time   = "01:00"
activity   = "still up, and not going to bed while you are down here"

# ⚠️ THE ROW THE SHEET DECLARED AND THE BUILD LOST. ray.md's grid carries
#    `the_back_bedroom 01:00-06:00 — asleep, home only` and nothing ever emitted it, so
#    the room he sleeps in had NOBODY scheduled in it while its own description says he
#    is there from one in the morning. Found by `lint · a door opens onto something`
#    (the-map.md R6): a knock nobody can answer. All days, so it is ONE row — the
#    weekday-first trap only splits a DAY-SPECIFIC overnight window.
[[npcs.schedules]]
location   = "the_back_bedroom"
start_time = "01:00"
end_time   = "06:00"
activity   = "asleep, or not"

# ─── Dee — the shift, the rules, the reason it costs ─────────────────────────
[[npcs]]
id           = "npc_dee"
name         = "Dee"
relationship = "Your mother."
role         = "mother"   # F10 — the label under the name in every dialogue box
description  = "Forty-three, agency nights at the county hospital, ten to six. She married the house and she is grateful for it in a way she says out loud too often. She is the reason every hour you spend in that kitchen after ten costs something."
portrait      = "dee.jpg"
core_traits  = { relation = 0 }
flag_keys    = ["met_dee"]
arc_stages   = ["Your mother", "Asking properly"]

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [6, 0, 1, 2, 3]
start_time = "17:00"
end_time   = "21:00"
activity   = "eating standing up with her keys already in her hand"

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [4, 5]
start_time = "09:00"
end_time   = "13:00"
activity   = "home, awake, and in the middle of everything"

# ─── @wes — the ride, the bathroom, the campus he already knows ──────────────
[[npcs]]
id           = "npc_wes"
name         = "Wes"
relationship = "stepbrother"
role         = "@wes.rel"   # F10 — stepbrother / half-brother / brother / cousin,
                            # whichever the player chose.
description  = "The son of the man your mother married, a junior at the college you start tomorrow. Twenty, never moved out, and already inside every room you are trying to get into. He is the only person who sees both halves of your life and he has not decided what to do with that yet."
portrait     = "wes.jpg"
customizable = true
relationship_options = ["stepbrother", "half-brother", "brother", "cousin"]
core_traits  = { relation = 0 }
flag_keys    = ["met_wes"]
arc_stages   = ["His house", "The ride", "The door open"]

# ⚠️ 06:40-07:10 and 07:15-07:50 DO NOT OVERLAP. An earlier draft had the bathroom
#    at 07:00-08:00 against an avenue row at 07:10-07:45 — thirty-five minutes in
#    two rooms. Caught by reading the person sheet against the opening sheet, which
#    is the only place a cross-room conflict is visible.
[[npcs.schedules]]
location   = "the_bathroom"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "06:40"
end_time   = "07:10"
activity   = "in there with the door not quite shut"

[[npcs.schedules]]
location   = "the_avenue"
weekdays   = [0, 1, 2, 3, 4]
start_time = "07:15"
end_time   = "07:50"
activity   = "car running, one arm on the roof, not waiting long"

[[npcs.schedules]]
location   = "wes_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "23:00"
activity   = "door open, headphones half off"

# ─── Simone — the ladder, the girls, the party, THE DUES ─────────────────────
[[npcs]]
id           = "npc_simone"
name         = "Simone"
relationship = "The senior who runs the pledge house."
role         = "runs the pledge house"   # F10 — the label under the name in every dialogue box
description  = "Twenty-two, final year, and she runs that house the way somebody runs a business they intend to leave in good order. She decides who you get to be on this campus and she will tell you so to your face. She is also the one who counts your money on a Friday."
portrait     = "simone.jpg"
core_traits  = { relation = 0, lust = 0 }
flag_keys    = ["met_simone"]
arc_stages   = ["The book by the door", "One of the twelve", "One of the four", "Hers"]

[[npcs.schedules]]
location   = "the_pledge_house"
weekdays   = [0, 1, 2, 3, 4]
start_time = "16:00"
end_time   = "19:00"
activity   = "in the office with the book, and on Friday with the tin as well"

# The party window — Thu/Fri/Sat. SPLIT IN TWO for the same reason as @ray's.
[[npcs.schedules]]
location   = "the_pledge_house"
weekdays   = [3, 4, 5]
start_time = "21:00"
end_time   = "23:59"
activity   = "downstairs, deciding who goes up"

[[npcs.schedules]]
location   = "the_pledge_house"
weekdays   = [4, 5, 6]
start_time = "00:00"
end_time   = "02:00"
activity   = "still up, and past caring who sees"

# ─── Halloran — grades, the department, office hours ─────────────────────────
[[npcs]]
id           = "npc_halloran"
name         = "Halloran"
relationship = "He teaches the eight o'clock."
role         = "professor"   # F10 — the label answers WHO HE IS. It read "the eight
                             # o'clock" for an hour: that is a timeslot, not a person.
description  = "Fifties, tenured, and bored in a way he has stopped hiding. Two hundred people take his eight o'clock and he holds office hours for whoever turns up, which is almost nobody. He is the only man here whose approval is worth anything on paper."
portrait     = "halloran.jpg"
core_traits  = { relation = 0 }
flag_keys    = ["met_halloran"]
arc_stages   = ["The man at the front", "Office hours", "After five"]

[[npcs.schedules]]
location   = "the_quad"
weekdays   = [0, 2, 4]
start_time = "08:00"
end_time   = "09:30"
activity   = "coming across from the car park with the roll under his arm"

[[npcs.schedules]]
location   = "halloran_office"
weekdays   = [0, 2, 4]
start_time = "16:00"
end_time   = "18:00"
activity   = "door open, marking, and the corridor going quiet around him"


# ═════════════════════════════════════════════════════════════════════════════
# THE WARDROBE — [[clothing]]
# ═════════════════════════════════════════════════════════════════════════════
# ⚠️ `exposure` is a 0/1/2 scalar and worn_exposure takes the MAX across the outfit
#    AND treats an empty core slot as bare. It is the only one of the four worn
#    predicates that reads an empty slot, which is what makes it the right one for a
#    rung. beauty and corruption cannot tell naked from plainly dressed.
#
# ⚠️ A GARMENT IS A RUNG. Simone's step 5 asks her to do nothing at all — it asks her
#    to WEAR something, and the arc will not pass until she does. And clothing also
#    moves the FLOOR of the ambient roll: same scenes, twice as much world.
#
# ⚠️ WHAT MONEY BUYS OPENS A DOOR. The dress is bought and READ — money buys the KEY
#    to a rung, never a meter point.

[[clothing]]
id      = "plain_bra"
name    = "Plain bra"
slot    = "bra"
image   = "clothing/plain_bra.jpg"
initial = true
beauty  = 1
corruption = 0
exposure = 0

