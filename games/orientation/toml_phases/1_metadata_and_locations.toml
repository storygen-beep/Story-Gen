start_time = "07:15"
end_time   = "07:50"
activity   = "car running, one arm on the roof, not waiting long"

[[npcs.schedules]]
location   = "wes_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "23:00"
activity   = "door open, headphones half off"

# ─── Simone — the ladder, the girls, the party, THE DUES ─────────────────────
[[npcs]]
id           = "npc_simone"
name         = "Simone"
relationship = "The senior who runs the pledge house."
role         = "runs the pledge house"   # F10 — the label under the name in every dialogue box
description  = "Twenty-two, final year, and she runs that house the way somebody runs a business they intend to leave in good order. She decides who you get to be on this campus and she will tell you so to your face. She is also the one who counts your money on a Friday."
portrait     = "simone.jpg"
core_traits  = { relation = 0, lust = 0 }
flag_keys    = ["met_simone"]
arc_stages   = ["The book by the door", "One of the twelve", "One of the four", "Hers"]

[[npcs.schedules]]
location   = "the_pledge_house"
weekdays   = [0, 1, 2, 3, 4]
start_time = "16:00"
end_time   = "19:00"
activity   = "in the office with the book, and on Friday with the tin as well"

# The party window — Thu/Fri/Sat. SPLIT IN TWO for the same reason as @ray's.
[[npcs.schedules]]
location   = "the_pledge_house"
weekdays   = [3, 4, 5]
start_time = "21:00"
end_time   = "23:59"
activity   = "downstairs, deciding who goes up"

[[npcs.schedules]]
location   = "the_pledge_house"
weekdays   = [4, 5, 6]
start_time = "00:00"
end_time   = "02:00"
activity   = "still up, and past caring who sees"

# ─── Halloran — grades, the department, office hours ─────────────────────────
[[npcs]]
id           = "npc_halloran"
name         = "Halloran"
relationship = "He teaches the eight o'clock."
role         = "professor"   # F10 — the label answers WHO HE IS. It read "the eight
                             # o'clock" for an hour: that is a timeslot, not a person.
description  = "Fifties, tenured, and bored in a way he has stopped hiding. Two hundred people take his eight o'clock and he holds office hours for whoever turns up, which is almost nobody. He is the only man here whose approval is worth anything on paper."
portrait     = "halloran.jpg"
core_traits  = { relation = 0 }
flag_keys    = ["met_halloran"]
arc_stages   = ["The man at the front", "Office hours", "After five"]

[[npcs.schedules]]
location   = "the_quad"
weekdays   = [0, 2, 4]
start_time = "08:00"
end_time   = "09:30"
