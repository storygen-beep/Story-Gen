[[canvases.nodes]]
id   = "base"
name = "Downstairs"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "You sit on the arm of the sofa downstairs for an hour and nobody sends you anywhere. Two of the twelve learn your name and use it wrong and then right. Nothing else happens and you go home warmer than you came." },
    { type = "paragraph", content = "You sit downstairs while four of them do somebody's hair for something that is not tonight. Nobody explains what it is for. You hand up a clip when it is asked for and that is your whole contribution." },
    { type = "paragraph", content = "You sit downstairs and the television is on with the sound off and three of them are on their phones. It is the least anybody has wanted from you in a week and you stay an hour longer than you meant to." },
    { type = "paragraph", content = "You sit downstairs and Simone goes through twice without stopping, and on the second one she says your name to somebody else in a sentence you do not catch the rest of. An hour goes." },
    { type = "paragraph", content = "You sit downstairs while somebody's brother fixes the door on the cupboard under the stairs, badly, and four people give him advice. Nobody asks you for anything. You are better for having sat down." },
  ] },
]

