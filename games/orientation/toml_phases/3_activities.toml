# =============================================================================
# Orientation — 3_activities · THE ROOM LISTS
#
# ⚠️ R2c — EVERY ROW IS A SYSTEM SURFACING IN THIS ROOM. The systems list came
#    first (sheets/SYSTEMS.md, 19 keys) and nothing here is invented from the
#    fiction. night_desk was built to R2 alone and its rooms came out as a night
#    porter's duties — walk the property, fix the sign, hit the ice machine —
#    correctly derived, with nothing to want in them, because six meters and no
#    clothing/items/phone could not give six rooms a list.
#
# Rows per room, against a FIELD MEDIAN OF 3:
#
#   the_pledge_house   6   ANCHOR — six systems live here
#   the_quad           3   (was 4; `act_quad_row` deleted — it went nowhere)
#   the_kitchen        3   (+2 hubs)
#   her_room           4
#   the_bathroom       2   (+1 hub)
#   the_counter        3
#   the_avenue         3
#   the_hall           1   the house reports itself; carries the reputation-free rest
#   the_row            1   carries the reputation tier's only gate site
#   the_back_bedroom   1   the door IS the content
#   wes_room           1   (+1 hub)
#
# ⚠️ THE CAP OF 8 IS A BACKSTOP, NOT A SIZE. A game built after the cap existed put
#    19 of its 30 screens at exactly 8 and shipped the same 213 choices as the
#    23-choices-on-one-desk game the cap was written to fail.
#
# ⚠️ DAY CAPS ARE A FLAG ON THE CHOICE, NOT A PROPERTY OF THE CANVAS, and never on
#    a node exit — see the note in phase 0.
#
# ⚠️ money AND followers CARRY clamp = false EVERY TIME THEY ARE WRITTEN.
# =============================================================================

# ═══════════════════ THE HALL — who is in, and the one bathroom ══════════════

# The hall's own row. The location's description_variants already report WHO is
# behind which door; this is the surface where standing there is an action.
#
# ⚠️ THIS CANVAS IS LOAD-BEARING FOR GATE 5. `traversal heat` counts a location as
#    hot when a REPEATABLE canvas there carries media whose pool_dir matches
#    _t[45] (gates.py:4987, floor 60%). Adding the hall and the row without this
#    takes the game 7/10 = 70% -> 7/12 = 58% and fails. With it: 8/12 = 67%.
#
# ⚠️ IT PAYS A NEED, NOT AN ASCENT TIER. The measured lesson from the corpus
#    (zaras-school-life's park bench): the QUIET outcome restores energy and the
#    LOUD one moves the climbing meter. Paying reputation for standing still is
#    what turned `act_quad_wall` into a day-locked, capped dead button.
[[canvases]]
id          = "act_hall_landing"
name        = "Wait on the landing"
description = "The hall's act row. Four doors and one bathroom, and the wait is the content. Pays rest — a need, never a tier."

[canvases.trigger]
location      = "the_hall"
is_repeatable = true
is_active     = true
priority      = 3

[[canvases.nodes]]
id   = "base"
name = "Four doors and one bathroom"
blocks = [
  { type = "video", props = { pool_dir = "traffic/hall_landing_t4", pool = 4, description = "young woman waiting on a landing outside a bathroom, someone passing in a towel", search_queries = ["amateur hallway towel after shower home", "girl waiting outside bathroom door apartment real"] } },
  # ⚠️ THE CONDITIONAL ARM IS NOT DECORATION. `lint · screen shape` counts a location
  #    as never-moving unless one of R6's four mechanisms is on a CANVAS there — the
  #    location's own description_variants do not count (gates.py:1165-1177 reads
  #    `mech` off canvases). Without this group the hall shipped as the game's only
  #    "renders identically on every visit" room.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "npc_at_location", location_id = "the_bathroom", npc_id = "npc_wes", operator = "is_present" },
  ] } }, blocks = [
    { type = "paragraph", content = "You sit on the third stair up with your things on your knees. The extractor is going and he is taking his time about it. Twenty minutes and the door goes and it is @wes, towel, steam off him, and he says morning and nothing else." },
  ] },
  { type = "group", blocks = [
    { type = "block_pool", blocks = [
      { type = "paragraph", content = "You wait on the landing where the carpet stops. The house does its noises — the boiler, a car outside, the fridge going on downstairs. Nobody comes out of anywhere. You are better for having sat down." },
      { type = "paragraph", content = "You stand at the top with your hand on the rail. There is a strip of light under the back bedroom and the radio going under it, and it stops when the stair creaks, and then it starts again." },
      { type = "paragraph", content = "You wait by the airing cupboard where it is warm. Your mother's coat is off the hook, which means the shift, which means the kitchen is empty until ten and then it is not." },
      { type = "paragraph", content = "You sit on the third stair with the front door in front of you and nobody uses it for twenty minutes. Four doors up and all of them shut. This house is very good at having nobody in it." },
    ] },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Wait it out. (20m)"
targetType               = "location"
locationId               = "the_hall"
time_progression_minutes = 20
effects = [
  { targetType = "player", trait = "rest", op = "add", value = 4 },
]

[[canvases.nodes.exit_block.choices]]
text                     = "Go on up. (2m)"
targetType               = "location"
locationId               = "the_hall"
time_progression_minutes = 2

