# ═══════════════════ RAY'S ROOM — behind the door ════════════════════════════
# `act_back_bedroom_door` used to live here: one row named "Go in", INSIDE a room the
# player was already standing in, whose only choice ("Knock.") was locked behind
# appetite 70 + ray_open and, when it opened, ran advanceTime(20) and nothing else. The
# room delivered 31 words against a declared 3,000.
#
# The door is a real threshold now — `[locations.door]` in phase 1, the-map.md R6 — so
# what lives here is what is BEHIND it, and which surface she gets is decided by whether
# he is in the room rather than by a menu.

# ─── He is out. The empty room is content (R6c) ──────────────────────────────
[[canvases]]
id          = "act_bedroom_search"
name        = "Go through their things"
description = "The trespass. Gated on the room being empty, which is most of the day — and it feeds `appetite` somewhere that is not him."

[canvases.trigger]
location      = "the_back_bedroom"
is_repeatable = true
is_active     = true
priority      = 3
costs         = [ { trait = "rest", value = 4 } ]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_back_bedroom", operator = "is_absent" },
] }

# ⚠️ THE WALK-IN. She does solo work here and somebody sleeps here, so somebody can
#    come in on her — the-surfaces.md R3, and the gate counts trigger.substitutions on
#    the SOLO activity, never a standalone random canvas.
#    His window opens at 01:00. Hers closes at 01:00. The overlap is the whole point.
[[canvases.trigger.substitutions]]
target_canvas_id = "walkin_bedroom_ray"
chance           = 0.3
conditions       = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_kitchen", npc_id = "npc_ray", operator = "is_present" },
] }

[[canvases.nodes]]
id   = "base"
name = "Their room, with nobody in it"
blocks = [
  { type = "paragraph", content = "The bed is made on his side and not on hers, which tells you which of them got up last. The room smells of him and of the spray your mother uses and the two do not go together." },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The top drawer is socks and a watch that has stopped. The second is hers. The third is his and you go through it with two fingers, moving nothing, and there is nothing in it but paperwork about the car." },
    { type = "paragraph", content = "There is a shirt over the back of the chair that he wore on Thursday. You pick it up to move it and you do not move it, and you stand there holding it for longer than moving it would have taken." },
    { type = "paragraph", content = "Under his side of the bed there is a shoebox with the lid on properly. You get as far as the lid. You put it back exactly square, which is how you know you are coming back to open it." },
    { type = "paragraph", content = "Their bathroom door is open and his razor is on the cistern and there is a towel on the floor. You hang the towel up. It takes four seconds and it is the most married thing you have ever done." },
    { type = "paragraph", content = "Her side of the wardrobe is tunics and one dress. His side is four shirts and a suit bag. There is a foot of empty rail between them that neither of them has ever used." },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Put it back square and get out."
targetType               = "location"
locationId               = "the_hall"
time_progression_minutes = 10
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "searched_today", operator = "is_false" },
] }
flagEffects = [ { targetType = "player", flag = "searched_today", op = "set" } ]
effects = [
  { targetType = "player", trait = "appetite", op = "add", value = 2, cap = 90 },
  { targetType = "player", trait = "home_face", op = "add", value = -2 },
]

[[canvases.nodes.exit_block.choices]]
