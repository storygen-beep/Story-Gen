# ═══════════════════ THE ROW — what reputation actually buys ═════════════════

# ⚠️ THIS CANVAS CARRIES THE REPUTATION TIER. Deleting `act_quad_row` removed the
#    game's ONLY `reputation >= 85` site, and gate `ascent tiers expand the world`
#    immediately went red with reputation at 0 expand / 0 contract — a declared
#    tier that gates nothing. A meter the player climbs has to BUY something.
#
#    The difference from the canvas this replaces: `act_quad_row` was a screen
#    whose reward branch returned you to the quad with no effect, no flag and no
#    destination. Here the street already exists and is walkable at any
#    reputation; what 85 buys is being SPOKEN TO on it, and that sets a flag the
#    0.2 arc reads. The wall being visible is not the reward — being known is.
[[canvases]]
id          = "act_row_walk"
name        = "Walk the row (30m)"
description = "The reputation tier's only gate site. Open at any level; what 85 buys is somebody using your name first."

[canvases.trigger]
location      = "the_row"
is_repeatable = true
is_active     = true
priority      = 4

[[canvases.nodes]]
id   = "base"
name = "Eight porches"
blocks = [
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "reputation", operator = "gte", value = 85 },
  ] } }, blocks = [
    { type = "paragraph", content = "You go the length of it slowly. Two porches have people on them and both of them stop talking as you come level and start again after, and the second one uses your name in the sentence, and they are not being quiet about it." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "reputation", operator = "gte", value = 45 },
  ] } }, blocks = [
    { type = "paragraph", content = "You go the length of it and back. Somebody on the third porch lifts a hand at you without stopping what she is saying, which is more than last week, and a car goes past slowly enough that you notice." },
  ] },
  { type = "group", blocks = [
    { type = "paragraph", content = "You go the length of it and nobody looks up. Eight porches, four with people on them, and the conversation does not change shape when you pass. You come back out onto the quad the way you went in." },
