# ══════════════════════════════════════════════════════════════════
# Phase: 2_one_shots.toml
# ══════════════════════════════════════════════════════════════════

# =============================================================================
# Orientation — 2_one_shots · THE OPENING, and the two meetings that are not in it
#
# Seven screens from the age gate to the first open door. Two of the seven are the
# engine's and are not in this file:
#
#   screen 0   Start                 title card + age gate
#   screen 1   CustomizeCharacters   her name + what @ray and @wes are to her
#
# The five below are ours, one canvas, five nodes, in order. STAGED OPEN — three
# people enter one at a time, each described, each SPEAKING, each stating what
# they want. Committed to; not a cold open, and not the middle, which is the defect.
#
# ⚠️ THE OPENING REFUSES NOTHING. No locked row, no greyed choice, nothing gated in
#    screens 2-6. The first refusal the player meets is on day one and it carries
#    its reason. The dues are ARMED here and not charged until income exists.
#
# ⚠️ THE CLOCK. 19:00 Sunday + 15 + 20 + 15 + 10 = 20:00, then the handover carries
#    680 minutes to 07:20 MONDAY. Monday because Halloran teaches [0,2,4] — handing
#    over on a Tuesday would be a first day of college with no class.
#
# Prose is from sheets/OPENING.md. It was reviewed there.
# =============================================================================

[[canvases]]
id          = "canvas_arrival_night"
name        = "The night you got here"
description = "The starting canvas. Five screens: @ray on the step, Dee going out the door, @wes in the doorway, the question he asks, and the alarm. Hands over to the avenue at 07:20 Monday."

[canvases.trigger]
location      = "the_avenue"
is_repeatable = false
priority      = 100
is_active     = true

# ─── screen 2 — @ray ─────────────────────────────────────────────────────────
[[canvases.nodes]]
id   = "base"
name = "The man on the step"
blocks = [
  { type = "paragraph", content = "The car is still ticking. Two cases, and one of them has the handle that does not come up any more. Your mother married @ray in June and you have seen this house twice, both times in daylight, both times for about an hour." },
  { type = "paragraph", content = "He comes down off the step and takes the heavy one before you have asked. He is bigger than you remember and he does not make anything of it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ray" }, content = "Right. Your room is the one that was the office. I got the shelves down off one wall and then I ran out of Sunday." },
  { type = "paragraph", content = "He waits, holding your case, until you say something back. That is the thing about him you will not work out for another month: he wants this to go well, and he has put the cost of it on you." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Let him take the heavy one."
targetType               = "node"
nodeId                   = "kitchen"
time_progression_minutes = 15

# ─── screen 3 — Dee ──────────────────────────────────────────────────────────
[[canvases.nodes]]
id   = "kitchen"
name = "Your mother, going out the door"
blocks = [
  { type = "paragraph", content = "The kitchen smells of somebody else's cooking. Your mother is in scrubs with her keys already in her hand, because agency nights start at ten and she has been on them since August." },
