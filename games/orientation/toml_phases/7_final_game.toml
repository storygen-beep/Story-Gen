[[canvases.nodes]]
id   = "base"
name = "One headphone off"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_wes" }, content = "Halloran fails about forty people a year and it is always the same forty, the ones who never come to office hours. He is not cruel about it. He just genuinely does not notice you exist unless you go up there." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_wes" }, content = "The row is eight houses and they all pretend they are different from each other. They are not. My second year I was in and out of four of them and it is the same room with a different carpet every time." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_wes" }, content = "I could have moved out. Dad offered, twice, and the second time he had actually worked out the money for it. I said no both times and I have never once said why, and he has never once asked." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_wes" }, content = "The bus is forty minutes because it goes all the way round the industrial estate for two people who get on at the far end. Everybody knows. Nobody has ever done anything about it." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_wes" }, content = "You are going to get asked to that house. I am not telling you not to go. I am telling you that Simone decides who goes upstairs and that she has never once got it wrong about somebody, and that is the part people find out too late." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_wes" }, content = "The counter is the worst job on campus and it is also the only one that will take you in your first term, so everybody does a year of it and then never talks about it again." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_wes" }, content = "It was quiet here for four years. I am not saying that as a complaint. I am saying I had got used to a house where nothing happened and then in June there were two more people in it, and one of them is on nights, so really there is one." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_wes" }, content = "I will drive you in. I am going anyway and it is fifteen minutes against forty and two dollars, so do not make it a thing. Just be out there at quarter past because I am not waiting." },
  ] },
]

[canvases.nodes.exit_block]
