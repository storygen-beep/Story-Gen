[[canvases.nodes]]
id   = "base"
name = "Marking"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_halloran" }, content = "Two hundred and eleven registered and I see about ninety in the room. I have stopped minding. What I mind is being asked in April why they failed, as though April were the first opportunity anyone had to mention it." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_halloran" }, content = "Office hours are a legal fiction, Miss. Four until six, twice a week, thirty years, and I could name every student who has ever used them properly on two hands. You are on the second hand now." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_halloran" }, content = "The department has eleven staff and nine of them are trying to be somewhere else. I stopped trying in about 2009 and it has been the most productive stretch of my life, which is not the lesson anybody wants from me." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_halloran" }, content = "A grade is a piece of information about one afternoon. That is all it has ever been. The trouble is that everybody upstairs has agreed to pretend otherwise, and I have to sign the form." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_halloran" }, content = "The floor empties at five past five. You can hear it go. Somebody in the eighties put a door closer on every door on this corridor and they all fire within a minute of each other, and then it is just me." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_halloran" }, content = "I read every one of the long essays and I read about a third of the short ones, and if you tell anybody I said that I will deny it and you will not be able to prove it, because the marks come out the same either way." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_halloran" }, content = "There was a version of this job where I went to conferences. I do not miss it. I miss having something to say at the end of the week that was not a number in a spreadsheet, which is a different complaint entirely." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_halloran" }, content = "The lab runs until seven and nobody books it after five, so it is effectively mine, and I have been handing out the key to whoever seemed likely to use it for about a decade. Nobody has ever queried it. Nobody queries anything, Miss. That is the actual finding." },
  ] },
]

[canvases.nodes.exit_block]
