# ══════════════════════════════════════════════════════════════════
# Phase: 4_story_arc.toml
# ══════════════════════════════════════════════════════════════════

# =============================================================================
# Orientation — 4_story_arc · THE TWO ARCS
#
# ⚠️ A1 — an arc is a numbered ladder of ONE-TIME steps, each gated on the flag the
#    step before it set, and the LAST step turns the act into something she can
#    simply do. The repeatable surface is the REWARD for finishing the arc, not the
#    starting position.
#
#    Measured across twelve built games and 1,396 canvases: THIS REPO HAS ZERO ARCS.
#    No character anywhere in it has a second thing that happens. Every hub and act
#    loop here is authored in its converted state on day one. These are the first.
#
# ⚠️ A2 — THE FIRST THIRD HAS NO SEX IN IT. It buys the player two things and
#    nothing else: WHEN this person is alone, and WHAT they are vulnerable about.
#    Information the player earns is a rung; information the game narrates is
#    exposition.
#
# ⚠️ A3b — the refusals here are PARKED, not counted: free, reversible, and the game
#    PRINTS THE PLACE AND THE HOUR to come back to. The counted-and-closed shape is
#    for when the closing is itself content, and neither of these is that. The one
#    thing neither shape does is stay silent about which it is.
#
# ⚠️ A4 — each step grants the meter that opens the step after it, CAPPED at the
#    next threshold, so replaying at the bottom walks her up and then stops feeding.
#
# ⚠️ EVERY STEP CARRIES trigger.schedules MATCHING THAT CHARACTER'S OWN HOURS.
#    requires_npc does NOT gate the auto-fire path — a step without a matching
