# ⚠️ THE ROW THE SHEET DECLARED AND THE BUILD LOST. ray.md's grid carries
#    `the_back_bedroom 01:00-06:00 — asleep, home only` and nothing ever emitted it, so
#    the room he sleeps in had NOBODY scheduled in it while its own description says he
#    is there from one in the morning. Found by `lint · a door opens onto something`
