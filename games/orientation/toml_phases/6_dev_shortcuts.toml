[[canvases.nodes]]
id   = "base"
name = "Keys in her hand"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_dee" }, content = "Agency means they ring at four and tell you where, and you go, and if you say no twice they stop ringing. That is the whole arrangement and I signed it knowing, @player." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_dee" }, content = "Eight years I did days and I was tired all of the time. Two years of nights and I am tired in a different shape, and the difference is that nobody talks to you on nights, which turns out to be the part I can stand." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_dee" }, content = "I met him at a wedding neither of us wanted to be at and we spent the entire thing outside by the cars. Four months later he asked me and I said yes in about a second, and I have not once been sorry, and I am aware of how that sounds." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_dee" }, content = "You will not remember the flat and I hope you do not. Two rooms over a shop and the boiler that went every February. This house has a spare room, @player. I did not know people had spare rooms." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_dee" }, content = "@wes has been nothing but decent and I keep waiting for the other thing, because a boy that age does not usually take a stranger moving into his house like that, and he has, and I do not understand it and I have stopped poking at it." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_dee" }, content = "Tuition is done. That is the thing I want you to hear properly, because you have been carrying it around like a bill. It is done, it is paid, and the only thing you owe anybody in this house is that you turn up to the eight o'clock." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_dee" }, content = "I am on until Christmas and then I do not know. They will ask. They always ask, and I always say yes, and one of these days I am going to say no and I will not know what to do with the evening." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_dee" }, content = "Be good to him. I know I keep saying it. It is not a warning, @player, it is the only way I know how to say that I am frightened of how much better this is than the last one." },
  ] },
]

[canvases.nodes.exit_block]
