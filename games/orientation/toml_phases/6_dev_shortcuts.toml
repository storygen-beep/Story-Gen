# =============================================================================
# Orientation — 6_dev_shortcuts · EMPTY BY DESIGN
#
# This phase held the five talk surfaces (@ray, Simone, @wes, Halloran, Dee)
# until 2026-09-02. They are gone from here and they are not deleted: each pool
# is now a `talk` node inside that character's own hub in 5_scenes.toml.
#
# Two reasons, and the second one is the sharper of the pair.
#
# 1. THE FACE. A canvas gets a portrait from `[canvases.trigger] npc`, never
#    from `requires_npc` (v2.py:4714 vs :4746). All five carried only
#    `requires_npc`, so all five rendered in the SOLO list — the lane that holds
#    Sleep, Shower and Eat — with no portrait and no name attached. Nothing down
#    there is a person, so the button text was the only identity the row had,
#    and two of the five said "him". `bound to a person, no face` had been
#    printing all five by name on every scoreboard run.
#
#    They could not simply be given `npc`: the portrait lane renders ONE canvas
#    per character, highest priority (v2.py:4735). Each hub already sits at
#    priority 6 and would have swallowed its own talk screen. A second surface
#    for the same person in the same room has to be a BRANCH of the first.
#
# 2. THIS FILE IS DROPPED FROM A RELEASE. `merge_toml_phases.py --no-dev`
#    excludes 6_dev_shortcuts.toml by name (DEV_PHASE, :62). Forty exchanges of
#    dialogue — the whole of this game's answer to a 10.7:1 narration ratio —
#    were parked in the one phase a release merge throws away, and nothing in
#    the pipeline would have said a word about it.
#
# The register note that lived here is still true and now lives beside the pools
# themselves: one subject per person that nobody else in the cast owns, and ONE
# term of address each — @ray says "love", Simone uses her surname, @wes uses
# nothing at all, Halloran says "Miss", Dee says @player's first name.
#
# Real dev shortcuts belong in this file. There are none today.
# =============================================================================
