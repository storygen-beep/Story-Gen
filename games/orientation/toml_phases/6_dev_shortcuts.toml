[[canvases.nodes]]
id   = "base"
name = "Across the counter"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ray" }, content = "This house was my father's and his father put the extension on it, badly, which is why the back bedroom is cold. Three generations and not one of us could hold a level straight." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ray" }, content = "I do not mind paying for it. I mind being thanked for it, and your mother thanks me about four times a week, and I cannot work out how to tell her to stop without it sounding like something else." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ray" }, content = "The car does eleven miles to a gallon on that run and I have been saying I will change it for two years. I will not change it. I know what I am like." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ray" }, content = "@wes was fifteen when his mother went and he did not say anything for about a year, and then one day he asked me for driving lessons, and that was him telling me he was all right. That is how this family does it, love." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ray" }, content = "There is a tin on top of the fridge and there has been a tin on top of the fridge since I was nine years old. You do not have to ask. I would rather you took it than went short." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ray" }, content = "Twenty-two years at the same yard and they made me foreman by outliving everybody. That is the whole story. There is no better version of it I have been saving." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ray" }, content = "I sat in that car in the drive for twenty minutes last night and I could not have told you why. It is a good house. It has been a quiet house for a long time and now it is not, and I am still getting used to that being a good thing." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ray" }, content = "College is four years and then you will go, and that is what it is for, and I would rather you went from here than from wherever you would have gone from otherwise. That is all I will say about it." },
  ] },
]

[canvases.nodes.exit_block]
