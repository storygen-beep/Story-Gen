# =============================================================================
# Orientation — 6_dev_shortcuts · TALK SURFACES
#
# ⚠️ register.md S4 — THE TALK SCREEN IS A CONTENT KIND, NOT A GARNISH, and S3:
#    the game is not all narration. Field median is 2.93:1 narration to dialogue
#    and ten of 27 games run at or under 2:1. Ours opened at 10.7:1.
#
# One per character. Each is a `block_pool` of exchanges on the subject THAT
# PERSON OWNS (R8) — nobody else in this cast talks about these things:
#
#   @ray       the house, the money, the car
#   Simone     the ladder, the girls, the party, the dues
#   @wes       the ride, the bathroom, the campus he already knows
#   Halloran   grades, the department, office hours
#   Dee        the shift, the rules, the reason it costs
#
# ⚠️ ONE TERM OF ADDRESS PER PERSON AND NOBODY ELSE USES IT. @ray says "love",
#    Simone uses her surname, @wes uses nothing at all, Halloran says "Miss",
#    Dee says her first name. That is four characters told apart in one word each.
#
# (This is phase 6 because the merge orders it after 5_scenes and before the
#  phone. It carries no dev jumps — the file name is the pipeline's, not the
#  content's.)
# =============================================================================

