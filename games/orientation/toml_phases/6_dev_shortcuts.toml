[[canvases.nodes]]
id   = "base"
name = "Across the desk"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_simone" }, content = "Twelve names and fourteen beds, Marsh. The other seven houses on this row know that number and two of them have already offered to take our overflow, which is a thing you offer when you know there is not any." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_simone" }, content = "The dues are not for the house. The dues are so that everybody in it has handed something over, because a girl who has paid for a thing behaves differently in it. You will see it in yourself in about a month." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_simone" }, content = "I do not run this the way it was run when I got here. When I got here there was a woman upstairs who decided things by who she liked. I decide things by who turns up, which everybody says is fairer and nobody actually prefers." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_simone" }, content = "Thursday is the one that counts. Friday is the one people come to and Saturday is the one people remember, and Thursday is the one where it gets decided who is at the other two." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_simone" }, content = "You want to know what I get out of it. Everybody asks eventually and most of them wait longer than you have. I get a house that runs, and one year of being the person who decides, and then I graduate and I am nobody again." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_simone" }, content = "There are girls in here who will be your friends for thirty years and girls who will not remember your name in June, and you cannot tell which is which yet and neither can I, and anybody who says they can is selling something." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_simone" }, content = "You live at home. I know you live at home. It is not held against you and it is not nothing either, because the girls upstairs at two in the morning are the ones who did not have to be anywhere at six." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_simone" }, content = "I have watched about forty girls come through that door and the ones who last are not the ones who want it most. They are the ones who work out fastest what it actually costs. You are quick, Marsh. I will give you that for free and it is the last thing I give you for free." },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

