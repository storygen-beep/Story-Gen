# =============================================================================
# Forty Miles — 5_scenes
# The bound character hubs. Every one carries BOTH `requires_npc` (so it only
# renders when the schedule actually puts them there) and `npc` (so it renders
# in the portrait bucket rather than the solo bucket). Gate 6 counts the `npc`
# binding; the schedule rows live in 1_metadata_and_locations.toml.
#
# ⚠️ R1 (the-surfaces.md) — SOLO WORK NEVER GOES IN A CHARACTER'S HUB. Every
#    choice in this file has a PERSON as the object of its verb. Counting the
#    till, mopping the block and working the cages are all in 3_activities.toml
#    where they belong.
#
# ⚠️ THE TENANT SECTION AT THE BOTTOM DIES AT THE FIRST ROTATION. Everything
#    above it is permanent cast. Nothing room-scoped may leak downward — the bay
#    itself, the bunk, the curtain, the two-knock rule and the terms-setting are
#    all in 3_activities.toml and survive every swap.
# =============================================================================


