    ] },
    { advance_text = "After.", blocks = [
        { type = "paragraph", content = "He says thank you. Not sorry. You tell him that is worse and he laughs, properly, in a cab in bay nine at half three in the morning." },
        { type = "thought_bubble", content = "Nothing was priced. The agency pays him on the twenty-eighth and moves him on at the end of the month and neither of them has said that out loud." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get down off the step.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 45, effects = [
  { targetType = "npc", npcId = "npc_tam", trait = "relation", op = "add", value = 5, clamp = true },
  { targetType = "player", trait = "arousal", op = "add", value = 12, clamp = true },
] } }


