# =============================================================================
# Forty Miles — 0_systems_spec
# Built with author-game-v2. Want + board: games/forty_miles/v2_state.json
#
# THE PREMISE, IN ONE LINE: at 22:00 the day manager goes home and Robyn is the
# site — the only authority for forty miles. At 06:00 she hands it back and is
# the girl on nights who owes the owner six thousand pounds. The charge is a
# REVERSAL ON A CLOCK, so every meter here buys HOURS, not rank.
#
# METERS, THREE LAYERS (references/the-board.md §3):
#   1  RATCHETING TIERS  nights · seen · trade    — rungs at 15/35/55
#   2  VOLATILE STATE    arousal · stress · energy · money
#   3  PER-CHARACTER     relation · lust          — on each [[npcs]] block
#   +  COUNTERWEIGHT     count — starts at 100, falls when the book stops
#                        balancing, and can be bought back out of her own money
#
# ⚠️ THE TOP BAND IS UNBOUNDED AT v0.1 (min = 55, no max). Gate 8 judges the top
#    band's MIN (gates.py:692-695), so a band at 75 would oblige an authored gate
#    at 75 in this build. It does not exist yet, so it is not promised yet. The
#    75 rung is logged as a promise in v2_state.json and arrives with the content
#    behind it — the honest-wall rule, references/the-release.md.
#
# ⚠️ `count` deliberately carries NO gte/gt/eq gate anywhere in the game. Gate 8
#    only collects tops from those operators (gates.py:680), so a counterweight
#    gated exclusively on lt/lte is skipped rather than made to buy its ceiling.
#    It is the price she pays, not a currency — it owes no content.
#
# ⚠️ EVERY TRAIT EFFECT USES op = "add" (with a NEGATIVE value to take something
#    away). `op = "subtract"` is NOT an engine operation — applyTraitEffect
#    accepts "add" and "set" and silently returns on anything else
#    (v2.py:5742-5751). v0.1 shipped 35 subtract effects and every one of them
#    did nothing: `count` never moved off 100 for the whole game, no activity
#    ever cost energy, and Nunn's short-week penalty never applied. Fixed in
#    0.1.1; references/engine.md §21.
# =============================================================================

schema_version = "1.0"

[project]
id              = "forty_miles"
title           = "Forty Miles"
description     = "Kelbrook Services, ten at night to six in the morning, and nothing open either way for forty miles. She is the only person on site. The man who owns it paid off her debt and has never once mentioned it."
starting_canvas = "canvas_opening"
quests_engine   = "v2"
version         = "0.1.2"

[time]
starting_hour = 22          # Bev has just gone. The first handover is the opening.
starting_day  = "Monday"    # four nights before the first settle-up
starting_week = 1

[settings]
narration_person  = "second"      # IMMUTABLE once v0.1 ships
clothing_enabled  = true
wardrobe_location = "her_static"  # everything she owns is in the caravan

# ─── The settle-up — the ENGINE under everything ─────────────────────────────
# Nunn paid six thousand pounds to make a problem of hers go away and has never
# said what the problem was worth to him. He takes two hundred a week back plus
# forty-five for the caravan, against roughly three hundred and fifty earned in
# cash. That leaves about a hundred, and a bad night on the till comes out of it.
# A date, a face, and a number a single bad night halves (the-economy.md R3).
#
# ⚠️ WEEKLY ONLY. `due_day` is validated against weekday names
#    (template_import.py:4786, VALID_DAYS) — the engine has no monthly period.
#
# ⚠️ eviction_mode = "flag_set", NOT the default "game_end". The product never
#    ends. Missing the draw does not evict her; it sets `terms_changed`, and what
#    he takes instead stops being money.
#
# ⚠️ THIS IS THE ONLY PLACE THE 245 MOVES, and it is the ENGINE that moves it.
#    `advanceDay()` arms `rent_state.is_due` on the rollover into due_day
#    (v2.py:5453-5464); the next `Location_*` entry is intercepted into RentDay
#    (v2.py:15247-15259); paying runs `$player.core_traits.money -= _rent`
#    (v2.py:15925). Verified live at 300 -> 55. So the draw lands in the small
#    hours of Friday, mid-shift, NOT at 18:00 when Nunn's schedule row puts him on
#    the forecourt — the scene text below is written for the hour it actually
#    fires. And no authored canvas may narrate handing the money over: v0.1 shipped
#    one that did, charging nothing and granting relation on every click.
[settings.rent]
enabled          = true
amount           = 245
due_day          = "Friday"
collector_npc    = "npc_nunn"
grace_periods    = 1
start_after_flag = "first_shift_done"
eviction_mode    = "flag_set"
eviction_flag    = "terms_changed"
currency_symbol  = "£"        # the pages hardcoded "$" before this key existed

[settings.rent.text]
title            = "Friday"
scene            = "Friday starts at midnight and he does not wait for six. The car is on the forecourt with the engine running and the window down four inches, and you go out to it, because that is how this has worked since the first week."
greeting         = "Friday, then."
paid_scene       = "You count it into his hand through the window. He does not count it again. He folds it once, puts it in the inside pocket, and writes a figure in the notebook he keeps on the passenger seat, and you stand in the cold watching a man do sums about you."
paid_response    = "Two hundred. Forty-five for the van. You're all right."
paid_closing     = "He puts the window up before he pulls off, and the canopy lights buzz back into the quiet, and it is yours again for eight hours."
cant_pay         = "You haven't got it."
warning_scene    = "You tell him you are short. He turns the engine off, which he has never done, and the forecourt goes very quiet. He looks past you at the shop — the lit glass, the empty aisles, the one till — for long enough that you understand he is not looking at the shop."
warning_response = "One week. I'm not going to be funny about it."
warning_closing  = "He starts the car again. He does not say the number he is short by, and you work out later that he never has, not once, not since March."
eviction_scene_soft    = "The second Friday he parks in the disabled bay by the door and comes in. He has never come in on a Friday. He looks at the till roll, and the shower-block key on your belt, and the notebook stays in the car."
eviction_response_soft = "Let's stop doing it in money."
eviction_closing_soft  = "He does not say what the other way is. He buys a coffee he does not drink, puts the exact change on the counter, and leaves it there when he goes."

[theme]
mode = "dark"


# ─── The next step, on every screen ──────────────────────────────────────────
# The band strings below say where she IS. This says what to do about it — the
# same 🎯/◯ goal block the Quests page renders, from the same cards, so the two
# can never drift. v0.1 shipped with the bands and nothing else in the rail: four
# descriptions of a state, no place, no verb, no person, and a player who never
# opened the Quests page had no direction at all.
[[sidebar_items]]
type = "quest_next"
max  = 3          # one live card per ascent tier


# ─── The ascent tiers ────────────────────────────────────────────────────────
# Three kinds of going-further, so a player who does not want one can still
# climb another. Band text is UI VOICE (references/the-voice.md R1): it names a
# state plainly and never performs. The register lives after the click.

# NIGHTS — how much of the site is hers between 22:00 and 06:00.
[[sidebar_items]]
type  = "trait_status_text"
trait = "nights"
bands = [
  { min = 0,  max = 14, text = "Counter only, hatch down at midnight" },
  { min = 15, max = 34, text = "The hatch stays up" },
  { min = 35, max = 54, text = "The showers and the park are hers" },
  { min = 55, text = "The whole site, all night" },
]

# SEEN — a lit glass box on a black road, cameras inside, a park of men outside.
[[sidebar_items]]
type  = "trait_status_text"
trait = "seen"
bands = [
  { min = 0,  max = 14, text = "Fleece zipped, back to the window" },
  { min = 15, max = 34, text = "Working in what she sleeps in" },
  { min = 35, max = 54, text = "Serving the hatch with nothing under it" },
  { min = 55, text = "Lit up, and the park knows" },
]

# TRADE — what she will sell that is not on the shelves.
[[sidebar_items]]
type  = "trait_status_text"
trait = "trade"
bands = [
  { min = 0,  max = 14, text = "Everything goes through the till" },
  { min = 15, max = 34, text = "Tokens off the book" },
  { min = 35, max = 54, text = "A second price list" },
  { min = 55, text = "Two economies out of one shop" },
]

# The counterweight. Starts clean and buys nothing by design. It falls whenever
# the roll and the drawer stop saying the same thing, and the only way back up is
# covering the shortfall out of her own money — two rungs do that, and they are
# the only positive writes to it in the game.
# Gated on lt/lte ONLY — see the header note on gate 8.
[[sidebar_items]]
type  = "trait_status_text"
trait = "count"
bands = [
  { min = 0,  max = 24, text = "The book is a work of fiction" },
  { min = 25, max = 49, text = "He knows, and he has not said" },
  { min = 50, max = 74, text = "Short, and getting shorter" },
  { min = 75, max = 100, text = "Balances to the penny" },
]


# ─── Trait labels ────────────────────────────────────────────────────────────
[[traits.labels]]
key   = "energy"
label = "Slept"

[[traits.labels]]
key   = "money"
label = "Cash"

# Internals — never surfaced to the player.
[[traits.labels]]
key    = "arousal"
hidden = true

[[traits.labels]]
key    = "stress"
hidden = true

[[traits.labels]]
key    = "takings_tonight"
hidden = true

[[traits.labels]]
key    = "bay_slot"
hidden = true


# =============================================================================
# GUIDANCE — [[quest_cards]] (engine.md §23; the-voice.md R2/R3/R5)
#
# ⚠️ NO `version = "1.0"` ON A QUEST CARD. Quest conditions use a separate
#    evaluator with NO fail-open (checkQuestsCondition, v2.py:14878).
#
# ⚠️ `terminal = true` ON THE LAST CARD OF EVERY ARC. A goal-less NON-terminal
#    card draws no frame and reads as an objective with nothing ticked
#    (engine.md §23). Exactly ONE card in the game sets `terminal_text` — the
#    build-boundary badge — and that is the NIGHTS wall, because nights is the
#    tier the locked door hangs off.
#
# Tier 1 = the ascent ladders (no npc_id). A v2 game has no mission, so the top
# of the page IS the tiers. Stepped bands, gte + lt, exactly one live at a time.
# Every goal label names a PLACE and a VERB, and a WINDOW where it is schedule-
# gated — the number is already in the sidebar; what the player cannot see is
# which click moves it (R3).
# =============================================================================

# ── NIGHTS ───────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 10
text     = "Bev's rule, handed over like a key: hatch down at midnight, serve through the drawer, and do not go out onto the apron on your own. It is a good rule. It also means that for six of your eight hours this place runs itself and you are furniture."
tip      = "Leave the hatch up after midnight and serve whoever comes to it."
when     = [ { trait = "nights", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "nights", subject = "player", op = "gte", value = 15, label = "Keep the hatch up past midnight — the shop" } ]

[[quest_cards]]
priority = 10
text     = "The hatch stays up all night now and the drivers have worked out they can talk to you instead of a drawer. The shower block is still a key on your belt you use twice a shift, at a run, with the shop stood empty behind you."
tip      = "Stop rushing it. Work the shower block properly in the dead hours."
when     = [ { trait = "nights", subject = "player", op = "gte", value = 15 },
             { trait = "nights", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "nights", subject = "player", op = "gte", value = 35, label = "Take the block at three in the morning — the showers" } ]

[[quest_cards]]
priority = 10
text     = "The block is yours and the lit end of the park is yours. Past the last lamp there are nine bays that the cameras do not cover, and everybody parked down there knows it better than you do."
tip      = "Walk the dark end after one, on your own, and stop turning back at the lamp."
when     = [ { trait = "nights", subject = "player", op = "gte", value = 35 },
             { trait = "nights", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "nights", subject = "player", op = "gte", value = 55, label = "Walk past the last lamp — the lorry park, after 01:00" } ]

[[quest_cards]]
priority        = 10
terminal        = true
terminal_text   = "The site is hers, ten till six"
text            = "Every hour between ten and six is yours and nobody on this plot is confused about that any more. What is not yours is the padlocked room behind the cold store, and the six hours after Bev arrives. Both open in a future update."
when            = [ { trait = "nights", subject = "player", op = "gte", value = 55 } ]

# ── SEEN ─────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 11
text     = "The shop is a lit glass box on a black road and you have spent a fortnight standing in it with your back to the window. There are four cameras inside and none outside, which tells you what the cameras are for."
tip      = "Serve the night hatch in what you sleep in instead of getting dressed for it."
when     = [ { trait = "seen", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "seen", subject = "player", op = "gte", value = 15, label = "Answer the hatch in what you slept in — the forecourt" } ]

[[quest_cards]]
priority = 11
text     = "You stopped getting dressed to cross forty feet of apron and nobody died. The canopy lights are the brightest thing for forty miles and under them you are the only thing to look at."
tip      = "Take the apron in the open, under the canopy, instead of along the wall."
when     = [ { trait = "seen", subject = "player", op = "gte", value = 15 },
             { trait = "seen", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "seen", subject = "player", op = "gte", value = 35, label = "Cross under the canopy, not the wall — the forecourt" } ]

[[quest_cards]]
priority = 11
text     = "Nine cabs and every one of them has a windscreen. They talk to each other on channel nineteen and you have started being able to tell, from how the park goes quiet, when you are what is being talked about."
tip      = "Walk the rows after one and let them have the whole walk."
when     = [ { trait = "seen", subject = "player", op = "gte", value = 35 },
             { trait = "seen", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "seen", subject = "player", op = "gte", value = 55, label = "Let them watch the whole walk — the lorry park, after 01:00" } ]

[[quest_cards]]
priority = 11
terminal = true
text     = "Men book this stop. Not the fuel, not the food — the stop, this one, on this road, on the nights you are on. What that is worth in money is the other ladder. Continues in a future update."
when     = [ { trait = "seen", subject = "player", op = "gte", value = 55 } ]

# ── TRADE ────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 12
text     = "Everything goes through the till because Nunn reads the roll on a Friday. A shower is four pounds fifty and the token machine has been broken since before you started, so you hand them out by hand, and by hand is not a thing a till roll can see."
tip      = "Sell a token off the book and put nothing through."
when     = [ { trait = "trade", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "trade", subject = "player", op = "gte", value = 15, label = "Sell a token off the book — the shop, nights" } ]

[[quest_cards]]
priority = 12
text     = "Tokens are the small one. What men on a fifteen-hour break actually want is somewhere to sit that is not a cab, something hot that is not a garage pie, and a plug socket, and you own all three between ten and six."
tip      = "Put a price on the back table and the microwave after two."
when     = [ { trait = "trade", subject = "player", op = "gte", value = 15 },
             { trait = "trade", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "trade", subject = "player", op = "gte", value = 35, label = "Price the back table and the microwave — the shop, after 02:00" } ]

[[quest_cards]]
priority = 12
text     = "There is a second price list now and it lives in your head. The most valuable thing on this site is not on either list: it is the eleven feet of stock-room corridor that no camera covers, and you are the only person who knows the exact length of it."
tip      = "Put a number on the blind spot."
when     = [ { trait = "trade", subject = "player", op = "gte", value = 35 },
             { trait = "trade", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "trade", subject = "player", op = "gte", value = 55, label = "Put a price on the blind spot — the stock room" } ]

[[quest_cards]]
priority = 12
terminal = true
text     = "Two economies run out of this shop and only one of them balances. The padlocked room is the other one's warehouse and you have not been in it yet. Continues in a future update."
when     = [ { trait = "trade", subject = "player", op = "gte", value = 55 } ]


# ── The characters. One live rung each, plus a terminal card that still matches
#    after it retires — a chain ending in silence deletes the whole section from
#    the guidance page AND the sidebar next-row (the-voice.md R5, gate 15).
# ─────────────────────────────────────────────────────────────────────────────

[[quest_cards]]
priority = 20
npc_id   = "npc_bev"
text     = "Fifteen minutes at quarter to ten, every weeknight, and she has done this handover with four people before you. She tells you the rules and she does not tell you which ones she keeps."
tip      = "Be behind the counter before she is. Take the handover properly."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_bev", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_bev", op = "gte", value = 40, label = "Take the handover properly — the shop, 21:45" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_bev"
terminal = true
text     = "She tells you what the day shift is actually like now, which is not what she told you in the first week. Whatever she has been running on days, you are the second person who knows. Her arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_bev", op = "gte", value = 40 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_nunn"
text     = "He paid six thousand pounds for a problem of yours and has never once said what the problem was worth to him. The two hundred and forty-five goes at the Friday rollover, whatever you are doing. Friday evening he is back under the canopy with the engine running, owed nothing, which is the only time he is just a man in a car."
tip      = "Have the two hundred and forty-five before Friday. Then go out to him on the Friday evening, when nothing is owed, and find out what else is on the table."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_nunn", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_nunn", op = "gte", value = 40, label = "Go out to the car with nothing owed — the forecourt, Friday 18:00" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_nunn"
terminal = true
text     = "He turns the engine off now when he pulls in. The notebook stays on the passenger seat and the number in it stopped being the point some weeks ago. His arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_nunn", op = "gte", value = 40 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_ossie"
text     = "He runs the tyre bay and sleeps in the back of it, forty feet from your caravan, on the same money as you. He is the only man on this site with nothing over you at all."
tip      = "His light is on Friday and Saturday nights. Take the kettle over."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_ossie", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_ossie", op = "gte", value = 40, label = "Sit out a callout with him — the tyre bay, Fri/Sat nights" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_ossie"
terminal = true
text     = "He leaves the roller door up a foot when he turns in, which is not for the air. Neither of you has said a single direct thing and both of you are counting the same hours. His arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_ossie", op = "gte", value = 40 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_hal"
text     = "Tuesdays, fridge trailer, bay four, in at eleven and gone by six. He buys a tea and a paper at one in the morning and says about nine words, and he has been doing it for a year without ever asking you for anything."
tip      = "One in the morning, Tuesday. Do not fill the twenty minutes with talk."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_hal", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_hal", op = "gte", value = 40, label = "Take his twenty minutes — the shop, Tuesday 01:00" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_hal"
terminal = true
text     = "He comes in at half twelve now instead of one, and the extra half hour is not something either of you is going to mention. He still has not asked you for anything. His arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_hal", op = "gte", value = 40 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_denny"
text     = "Thursdays and Sundays, tipper work, and he knows every cab in the park by the sound of it. What Denny decides about you on a Thursday is on channel nineteen by Sunday and up and down this road by the week after."
tip      = "Work his crowd. What he says about you is the ladder, not what he does."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_denny", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_denny", op = "gte", value = 40, label = "Work his crowd — the lorry park, Thu/Sun nights" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_denny"
terminal = true
text     = "He talks about you on the radio in the third person while you are stood there, and it has stopped being something that happens to you and started being something you use. His arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_denny", op = "gte", value = 40 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_tam"
text     = "Bay nine, agency, first month on the book. He is sleeping in the cab because the digs money has not come through and he would rather you did not work that out."
tip      = "Bay nine, after midnight. Knock on the door rather than the window."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_tam", op = "lt", value = 40 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_tam", op = "gte", value = 40, label = "Knock on bay nine — the lorry park, after midnight" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_tam"
terminal = true
text     = "He waits up for you now, which he would deny. The agency moves him on at the end of the month and neither of you has raised it. His arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_tam", op = "gte", value = 40 } ]
