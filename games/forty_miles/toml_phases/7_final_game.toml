# =============================================================================
# Forty Miles — 3_activities
# The standing surfaces. Everything the player returns to, forever.
#
# ⚠️ R2b (the-surfaces.md) — THE RULE NO GATE CAN CATCH. Each hub's opener names
#    the things in the room, and every choice hangs off one of them. Write the
#    paragraph first, then attach. A choice with nothing to attach to means the
#    prose is missing an object or the choice belongs on another surface.
#
# ⚠️ 8 CHOICES MAX on any repeatable location-bound canvas (gate 20). the_shop is
#    the anchor and would have grown a twenty-item menu; it is split by WHO the
#    content is aimed at and WHEN instead — four counter windows, three bound
#    NPC hubs. Solo work never goes in a character's hub (R1).
#
# ⚠️ ONE ASSET, ONE BLOCK. No `pool_dir` is reused across two blocks anywhere in
#    this file — a review dedupes by file and would return one verdict for two
#    different beats.
#
# RUNGS ARE TRIGGERLESS canvases reached by `nodeId = "rung_x.base"` from a hub.
# They carry no [canvases.trigger] at all.
# =============================================================================


