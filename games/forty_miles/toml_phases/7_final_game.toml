    ] },
    { advance_text = "Ask why it works.", blocks = [
        { type = "paragraph", content = "Because wastage is expected. A stop like this bins twenty to forty pounds a week of food and head office has a number for that and the number is a range." },
    ] },
    { advance_text = "Ask what the rule is.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Inside the range, every week, never the same figure twice. The day you take a number that stands out is the day somebody looks at eleven years of them." },
    ] },
    { advance_text = "Understand what she is doing.", blocks = [
        { type = "paragraph", content = "She is not cutting you in. There is nothing to cut you into. She is telling you how to do the thing you were already doing so that it does not end with both of them looked at." },
    ] },
    { advance_text = "Say thank you.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Eleven years of a woman being careful, handed over at quarter to ten like a float and a set of keys." },
    ] },
  ] } },
]
