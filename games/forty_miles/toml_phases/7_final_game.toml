    ] },
    { advance_text = "Push on the other half.", blocks = [
        { type = "paragraph", content = "You point out that it also means what the park thinks of you is whatever he decides it thinks, and that he has not offered to stop doing that." },
    ] },
    { advance_text = "Watch him take it seriously.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_denny" }, content = "Aye. That's true, that. I'd not thought of it as a thing I was doing to you." },
    ] },
    { advance_text = "Leave it there.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "He is the reason nine men are polite to you and he is also the reason you cannot tell whether they would have been." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Head back across.", config = { destinationType = "specific", locationId = "the_lorry_park", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_denny", trait = "relation", op = "add", value = 4, clamp = true },
  { targetType = "player", trait = "seen", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_denny_bang_on_my_door"
name        = "Bang on my door"
description = "Triggerless rung off Denny's shop hub. Ungated. He says it every visit. One night she has to. +4 relation with npc_denny, -2 stress, 30 min."

[[canvases.nodes]]
id   = "base"
name = "Bay six"
blocks = [
  { type = "paragraph", content = "He says it on the way out every single time and you have said yeah, right, thanks every single time, and neither of you has ever meant it as a plan." },
  { type = "cascade", props = { beats = [
    { advance_text = "The night it is not nothing.", blocks = [
        { type = "paragraph", content = "Two of them, a car, half two, and one of them is round the end of the counter and is not moving when you ask him to and his mate has locked the door on the snib." },
    ] },
    { advance_text = "Get to the side door.", blocks = [
        { type = "paragraph", content = "You go out the side and across the apron in a vest at half two in February and you are at bay six in about eleven seconds." },
    ] },
    { advance_text = "Bang on it.", blocks = [
        { type = "paragraph", content = "It takes two goes. Then a light, and a curtain, and a man in a T-shirt getting down off a cab into wet gravel in bare feet without asking a single question." },
    ] },
    { advance_text = "Watch it end.", blocks = [
        { type = "paragraph", content = "It ends without anybody touching anybody. Denny gets between them and the door and says four sentences and they go, and their plate is on the fuel camera anyway." },
    ] },
    { advance_text = "After.", blocks = [
        { type = "paragraph", content = "He makes you a tea in your own shop with your own machine and does not ask if you are all right, which is the correct decision." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "He said it every week for eleven weeks so that it would already be true on the night it had to be." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Take the snib off.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_denny", trait = "relation", op = "add", value = 4, clamp = true },
  { targetType = "player", trait = "stress", op = "add", value = -2, clamp = true },
] } }


[[canvases]]
id          = "rung_tam_the_twenty_eighth"
name        = "The twenty-eighth"
description = "TENANT-SCOPED. Triggerless rung off Tam's hub, gated relation >= 20. The day the money lands, and what he does with it. +4 relation with npc_tam, 25 min."

[[canvases.nodes]]
id   = "base"
name = "It lands"
blocks = [
  { type = "paragraph", content = "Four weeks in arrears, up on the twenty-eighth, and on the twenty-eighth it actually lands, which by then neither of you was sure about." },
  { type = "cascade", props = { beats = [
    { advance_text = "Hear about it before he tells you.", blocks = [
        { type = "paragraph", content = "He is in the shop at midnight buying an actual meal instead of the yellow-sticker stuff, and he is buying it with a card, and he is grinning at a pasty." },
    ] },
    { advance_text = "Ask what he is doing with it.", blocks = [
        { type = "paragraph", content = "Digs in Kelbrook from the first, a proper bed, nine miles away. He has it all worked out and has clearly had it worked out for three weeks." },
    ] },
    { advance_text = "Ask about the bay.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_tam" }, content = "I'll still be parking here. It's the run. I'll just not be, you know. Living in it." },
    ] },
    { advance_text = "Say the right thing.", blocks = [
        { type = "paragraph", content = "You tell him the twelve pounds a week stops on the first, then, and he says he will pay it anyway, and you tell him not to be daft, and he pays it anyway." },
    ] },
    { advance_text = "After.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "The agency moves him on at the end of the month regardless. Neither of them has said that out loud and both of them have known it for a fortnight." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Ring the pasty through.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_tam", trait = "relation", op = "add", value = 4, clamp = true },
] } }


[[canvases]]
id          = "rung_bev_the_first_night"
name        = "What she did not say"
description = "Triggerless rung off Bev's hub. Ungated. The three rules, revisited, and which of them Bev keeps. +3 relation with npc_bev, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Three rules"
blocks = [
  { type = "paragraph", content = "Hatch down at midnight. Serve through the drawer. Do not go out on the apron on your own. She said them in that order on the first night and has never repeated them." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask which ones she kept.", blocks = [
        { type = "paragraph", content = "She does not pretend to misunderstand. She says she did days for nine years before nights ever came up and that she has done about eleven night shifts in her life." },
    ] },
    { advance_text = "Push on that.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "I've never worked a full night on this site on my own. Not once. I gave you three rules for a job I've not done." },
    ] },
    { advance_text = "Ask where they came from.", blocks = [
        { type = "paragraph", content = "From the woman before the woman before you, who wrote them on the back of a delivery note in about twenty-fourteen, and Bev has been handing them over ever since." },
    ] },
    { advance_text = "Ask if they are any good.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "The hatch one's rubbish. The apron one isn't. I'd not have told you which if you'd asked me week one." },
    ] },
    { advance_text = "Ask what the apron rule is actually for.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Nine of them in a dark field and one of you. Half have already said out loud what they'd do to your cunt. Those aren't the ones. It's the quiet ones." },
    ] },
    { advance_text = "Understand the handover.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Eleven years of passing on somebody else's rules for a shift she has never worked, and being honest about it the day she was asked." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Take the keys.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_bev", trait = "relation", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_bev_the_forty_a_week"
name        = "Twenty-three thousand"
description = "Triggerless rung off Bev's hub, gated relation >= 40. What eleven years of forty pounds a week was actually for. +4 relation with npc_bev, 25 min."

[[canvases.nodes]]
id   = "base"
name = "What it was for"
blocks = [
  { type = "paragraph", content = "You do the arithmetic out loud one night. Forty a week, eleven years, twenty-three thousand pounds, give or take, out of a wastage sheet." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask what she did with it.", blocks = [
        { type = "paragraph", content = "You are expecting a holiday, or a car, or nothing in particular. She tells you and it takes about nine words and it is none of those." },
    ] },
    { advance_text = "Hear it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Our lad's course. Three years of it and the digs in Leeds. He's a physio now." },
    ] },
    { advance_text = "Do the sum again.", blocks = [
        { type = "paragraph", content = "Three years of a course and accommodation in Leeds is not far off twenty-three thousand pounds, and it did not come out of a wage that has never gone above what you are on." },
    ] },
    { advance_text = "Ask if she has stopped.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "He finished in twenty-two. No, I've not stopped. I've not worked out how to and I've not tried that hard." },
    ] },
    { advance_text = "Let it sit.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Eleven years, forty a week, inside a range head office already expected, so that a lad from a village with one shop could do three years in Leeds." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Let her go home.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_bev", trait = "relation", op = "add", value = 4, clamp = true },
] } }


[[canvases]]
id          = "rung_hal_the_last_tuesday"
name        = "A Tuesday he does not come"
description = "Triggerless rung off Hal's hub. Ungated. One week the fridge trailer is not on bay four, and there is no way to find out why. +2 stress, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Bay four is empty"
blocks = [
  { type = "paragraph", content = "Bay four is empty at eleven. It is empty at midnight. At quarter to one nobody comes in for a tea and a paper." },
  { type = "cascade", props = { beats = [
    { advance_text = "Wait anyway.", blocks = [
        { type = "paragraph", content = "You put the paper on the second table at half twelve the way you have for months. It sits there. At two you put it back on the rack." },
    ] },
    { advance_text = "Work out what you know.", blocks = [
        { type = "paragraph", content = "You do not know his surname. You do not know the firm. You know a bay number, a trailer type, a night, and that he has four years to retirement." },
    ] },
    { advance_text = "Work out what you can do.", blocks = [
        { type = "paragraph", content = "Nothing. There is no way to check on a man you have spent a year with for twenty minutes a week. There is not one thing you could put into a phone." },
    ] },
    { advance_text = "Get through the shift.", blocks = [
        { type = "paragraph", content = "The rest of the night is the same night it always is. The road does something every eleven minutes. The block gets run at three." },
    ] },
    { advance_text = "The week after.", blocks = [
        { type = "paragraph", content = "He is on bay four at eleven the following Tuesday. Tyre blowout on the A1 and a night in a hotel in Wetherby, which he mentions in about six words." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "Six words, a week late, and you had spent seven days with no way on earth to ask." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Take him his tea.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 25, effects = [
  { targetType = "player", trait = "stress", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_denny_the_new_ones"
name        = "Vouching"
description = "Triggerless rung off Denny's shop hub. Ungated. What he does when a new firm starts using the stop. +3 relation with npc_denny, +2 seen, 25 min."

[[canvases.nodes]]
id   = "base"
name = "A new firm"
blocks = [
  { type = "paragraph", content = "A haulier out of Warrington starts putting three a week through here in February. New plates, new faces, none of them on the channel." },
  { type = "cascade", props = { beats = [
    { advance_text = "Watch what he does.", blocks = [
        { type = "paragraph", content = "He gets to them in the park before they get to the shop. Not a warning and not a welcome. Just a bloke stood by a cab telling somebody how the stop works." },
    ] },
    { advance_text = "Ask what he tells them.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_denny" }, content = "Shop's open all night, block's proper, she'll sort you out, and don't be a prick about it." },
    ] },
    { advance_text = "Notice the fourth clause.", blocks = [
        { type = "paragraph", content = "The first three are information. The fourth one is the whole job and it is four words long and it is said by a man leaning on somebody else's wing mirror." },
    ] },
    { advance_text = "Ask if it works.", blocks = [
        { type = "paragraph", content = "Eleven weeks and three a week out of Warrington and not one of them has been a problem, which is either the four words or luck, and there is no way to tell which." },
    ] },
    { advance_text = "After.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Everything good about this park might be him and might be the men in it, and you are never going to find out which, and that is its own kind of debt." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Bag his stuff up.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_denny", trait = "relation", op = "add", value = 3, clamp = true },
  { targetType = "player", trait = "seen", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_nunn_the_eleventh_name"
name        = "The one that never will"
description = "Triggerless rung off Nunn's hub, gated relation >= 40. Six crossed through, four going, and one that is never getting off the notebook. +4 relation with npc_nunn, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Never"
blocks = [
  { type = "paragraph", content = "He said it through a window with the engine running. Six done, four going, one that never will. You go back to it a month later on a Friday." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask who it is.", blocks = [
        { type = "paragraph", content = "He turns the engine off, which by now you know is the whole answer arriving before any of the words do." },
    ] },
    { advance_text = "Wait.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_nunn" }, content = "First name in it. Fella who had the tyre bay before Ossie. Nineteen ninety-eight." },
    ] },
    { advance_text = "Ask what happened.", blocks = [
        { type = "paragraph", content = "He does not say. He says the man is dead and that the figure is still written in and that he has copied it forward into three notebooks since, in his own handwriting, at the top of the first page." },
    ] },
    { advance_text = "Ask why he keeps it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_nunn" }, content = "Because it's owed. Doesn't stop being owed because there's nobody to pay it." },
    ] },
    { advance_text = "Understand the book.", blocks = [
        { type = "paragraph", content = "It is not a ledger of people who owe him. It is a ledger of what he is owed and what he owes, and the first line has been on the wrong side of it for twenty-eight years." },
    ] },
    { advance_text = "Step back from the car.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Six thousand pounds and a rubber band, and the first name in the book is somebody he has been carrying since before you were born." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go back in.", config = { destinationType = "specific", locationId = "the_forecourt", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_nunn", trait = "relation", op = "add", value = 4, clamp = true },
] } }


[[canvases]]
id          = "rung_ossie_the_two_shirts"
name        = "The two that never get worn"
description = "Triggerless rung off Ossie's hub, gated relation >= 20. Four years of ironing two shirts for something that has not come up. +3 relation with npc_ossie, 20 min."

[[canvases.nodes]]
id   = "base"
name = "Plain blue and a check"
blocks = [
  { type = "paragraph", content = "You ask about the two on the rail with four inches of clear conduit either side of them. He does not deflect it, which by now is not surprising." },
  { type = "cascade", props = { beats = [
    { advance_text = "Let him answer.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_ossie" }, content = "You've got to have something that isn't work. Even if there's nowhere to wear it. Especially then." },
    ] },
    { advance_text = "Ask when they last went on.", blocks = [
        { type = "paragraph", content = "A funeral in twenty-twenty-three and a hospital appointment before that. Two occasions in four years and he has ironed them roughly every fortnight for the whole period." },
    ] },
    { advance_text = "Ask why he irons them.", blocks = [
        { type = "paragraph", content = "He says because otherwise in two years they would be a pair of creased shirts in a shed, and then there would be nothing on this plot that was not work." },
    ] },
    { advance_text = "Say the honest thing.", blocks = [
        { type = "paragraph", content = "You tell him you have a shoebox and two bags and a mirror at the wrong height, and that you understand the shirts completely, and that it is the saddest thing you have heard all year." },
    ] },
    { advance_text = "Let him laugh.", blocks = [
        { type = "paragraph", content = "He does. Then he says that the alternative is not having them, and that he has thought about that version of it, and that he prefers this one." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Finish the tea.", config = { destinationType = "specific", locationId = "the_tyre_bay", time_progression_minutes = 20, effects = [
  { targetType = "npc", npcId = "npc_ossie", trait = "relation", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_tam_what_he_leaves"
name        = "What he leaves on the post"
description = "TENANT-SCOPED. Triggerless rung off Tam's hub. Ungated. The last morning, and the one thing on the fence post anybody has ever come back for. +3 relation with npc_tam, 20 min."

[[canvases.nodes]]
id   = "base"
name = "The last morning"
blocks = [
  { type = "paragraph", content = "He goes on the thirty-first at about half five, which is the same as every other morning, because there is no ceremony available at half five." },
  { type = "cascade", props = { beats = [
    { advance_text = "Do the coffee run.", blocks = [
        { type = "paragraph", content = "The chipped cup, four minutes across the gravel, handed up through a gap. He says the thing about not having any money on him and both of you let it go past." },
    ] },
    { advance_text = "Watch the walkround.", blocks = [
        { type = "paragraph", content = "Eleven minutes. Not ninety seconds. Somewhere in a month he started doing the whole thing properly and neither of you has ever mentioned that either." },
    ] },
    { advance_text = "Watch him go.", blocks = [
        { type = "paragraph", content = "Air up, lights, off the gravel in a long slow curve. The bay is a dry rectangle and an oil shadow and about forty cable ties' worth of nothing." },
    ] },
    { advance_text = "Check the post.", blocks = [
        { type = "paragraph", content = "There is a work glove on it that was not there last night. One of a pair. Left hand. Nobody has ever taken anything off that post and nobody has ever left anything deliberately." },
    ] },
    { advance_text = "Leave it there.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Three gloves, a hi-vis, a hat, and now a left hand that was put there on purpose by somebody who knew you would be the one to find it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Finish the sweep.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 20, effects = [
  { targetType = "npc", npcId = "npc_tam", trait = "relation", op = "add", value = 3, clamp = true },
] } }

