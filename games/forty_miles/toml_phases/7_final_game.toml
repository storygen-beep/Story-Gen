    ] },
    { advance_text = "Ask the obvious question.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "No. He didn't put a camera on the apron after it either. I've asked him twice." },
    ] },
    { advance_text = "Ask if it will happen to you.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "You're harder than she was and you've got the key. Doesn't matter. Nine men and one lit box. Every one of them has had a think about your tits by now. That's the job, love." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Let her get off.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 25, effects = [
