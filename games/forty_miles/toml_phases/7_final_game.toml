# layer 2 — volatile state
arousal = 0
stress  = 0
energy  = 100
money   = 30     # ⚠️ engine.md §21 — EVERY money effect carries clamp = false.
                 #    Clamped, money caps at 100, the 245 Friday draw is
                 #    unpayable, and the build stays green the whole way down.
# internals
takings_tonight = 0
bay_slot        = 1

# Decay is a POSITIVE MAGNITUDE — the validator rejects negatives.
[player.trait_decay]
energy = 9


