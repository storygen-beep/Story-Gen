# ── TRADE ────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 12
text     = "Everything goes through the till because Nunn reads the roll on a Friday. A shower is four pounds fifty and the token machine has been broken since before you started, so you hand them out by hand, and by hand is not a thing a till roll can see."
