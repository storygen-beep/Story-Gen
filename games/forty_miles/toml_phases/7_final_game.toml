[[canvases]]
id          = "rung_showers_deep_sit"
name        = "The warm end"
description = "Triggerless rung off the deep-night block hub. Ungated. Twenty minutes in a warm empty tiled room at three in the morning, which is the best twenty minutes of the shift and is not about sex at all. +3 energy, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Three in the morning"
blocks = [
  { type = "paragraph", content = "The pipe runs behind the wall at the far end of the bench and that end is warm. The room is at about twenty-four degrees from the last shower and it holds it for an hour." },
  { type = "cascade", props = { beats = [
    { advance_text = "Sit down.", blocks = [
        { type = "paragraph", content = "Warm slats, wet floor, the extractor going, and the door locked behind you. It is the warmest place on this plot and it is the only one nobody can walk into." },
    ] },
    { advance_text = "Do nothing.", blocks = [
        { type = "paragraph", content = "Not sleep. Not think, particularly. Twenty minutes of sitting in a warm brick box while the shop stands open and lit two hundred feet away with nobody in it." },
    ] },
    { advance_text = "Listen for the shop bell.", blocks = [
        { type = "paragraph", content = "You cannot hear it from in here. That was true on the first night too, and on the first night it was the reason you never sat down." },
    ] },
    { advance_text = "Get up at ten to four.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Twenty minutes off a shift nobody is measuring, in a room you hold the key to, and it took eleven weeks to work out you were allowed." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Lock up and go back.", config = { destinationType = "specific", locationId = "the_showers", time_progression_minutes = 25, effects = [
  { targetType = "player", trait = "energy", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_shop_first_hour"
name        = "The first hour"
description = "Triggerless rung off the dawn hub. Ungated. Six till seven, when she is still on the premises and no longer running them. 25 min."

[[canvases.nodes]]
id   = "base"
name = "After the handover"
blocks = [
  { type = "paragraph", content = "The handover takes fifteen minutes and then there is nothing. The van is a four-minute walk and you are not tired until eight." },
  { type = "cascade", props = { beats = [
    { advance_text = "Stay for a coffee.", blocks = [
        { type = "paragraph", content = "You buy one, at full price, from the machine you ran through at half ten last night, and sit at table four while the shop fills up with people going to work." },
    ] },
    { advance_text = "Watch it become somebody else's.", blocks = [
        { type = "paragraph", content = "Bev does the float. The hot counter goes out properly. A rep comes in about the drinks fridge. None of it needs you and all of it is happening in your room." },
    ] },
    { advance_text = "Notice what you are doing.", blocks = [
        { type = "paragraph", content = "You have stayed for a coffee eleven mornings running. There is a bed four minutes away and you are sat in a plastic chair watching somebody else run a shop." },
    ] },
    { advance_text = "Go before it gets embarrassing.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "It is not the shop. It is that at six in the morning the caravan is a cold box and this is a room with people in it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Walk back to the van.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 25 } }


[[canvases]]
id          = "rung_shop_regulars_list"
name        = "The regulars"
description = "Triggerless rung off the daylight hub. Ungated. Eleven weeks of nights, written down as who comes when. +2 seen, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Who comes when"
blocks = [
  { type = "paragraph", content = "You have started keeping it in your head and then on the back of a till roll, which is a thing you would struggle to explain if anybody found it." },
  { type = "cascade", props = { beats = [
    { advance_text = "Go through the list.", blocks = [
        { type = "paragraph", content = "Hal, Tuesdays, quarter to one. Denny, Thursday and Sunday, midnight. Two taxis on a weekend. The fridge man who does Aberdeen every fortnight." },
    ] },
    { advance_text = "Count the new ones.", blocks = [
        { type = "paragraph", content = "Four names on it in week one. Nineteen now. Not one of them was told to come back and not one of them was on any list Bev handed over." },
    ] },
    { advance_text = "Look at the pattern.", blocks = [
        { type = "paragraph", content = "They are not spread across the week. They are stacked on the nights you are on, which you noticed a fortnight ago and have not written down anywhere." },
    ] },
    { advance_text = "Put the roll in your pocket.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Nineteen names on the back of a till roll. A customer book for a business that does not exist, and you are the whole of it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get some sleep.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 25, effects = [
  { targetType = "player", trait = "seen", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_shop_quiet_saturday"
name        = "A quiet Saturday"
description = "Triggerless rung off the weekend hub. Ungated. Some weekends nothing comes at all, and that is worse than the busy ones. +2 stress, 45 min."

[[canvases.nodes]]
id   = "base"
name = "Nothing at all"
blocks = [
  { type = "paragraph", content = "Some Saturdays the Kelbrook road does not send anything. The rush does not come. The taxis do not come. By half twelve you have served four people all night." },
  { type = "cascade", props = { beats = [
    { advance_text = "Wait for it to start.", blocks = [
        { type = "paragraph", content = "It does not start. You keep checking the clock against what it usually is, which makes the clock go slower, which you know and cannot stop doing." },
    ] },
    { advance_text = "Do jobs that do not need doing.", blocks = [
        { type = "paragraph", content = "The gantry gets faced twice. The window tables get wiped four times. You reorganise the phone cables by connector type, which takes nineteen minutes." },
    ] },
    { advance_text = "Look at the park.", blocks = [
        { type = "paragraph", content = "Six cabs, all curtained, all asleep by eleven because it is a weekend break. Nobody out there wants anything until Monday." },
    ] },
    { advance_text = "Get to four.", blocks = [
        { type = "paragraph", content = "Six hours, four customers, and eleven pounds forty in the drawer. The busy nights are exhausting. The empty ones are the ones that get at you." },
    ] },
    { advance_text = "After.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "You are paid seventy pounds either way. Only one of the two versions makes the seventy pounds feel like a wage." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Put the kettle on.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 45, effects = [
  { targetType = "player", trait = "stress", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_showers_first_of_the_morning"
name        = "The first of the morning"
description = "Triggerless rung off the deep-night hub. Ungated. Four o'clock, the first knock on the shop door for the block, and the ninety seconds before she unlocks it. +2 nights, 20 min."

[[canvases.nodes]]
id   = "base"
name = "Ten past four"
blocks = [
  { type = "paragraph", content = "The first one is always about ten past four and it is always somebody with a long day starting. He comes to the shop door rather than the hatch, because the block needs a person." },
  { type = "cascade", props = { beats = [
    { advance_text = "Take the token off the shelf.", blocks = [
        { type = "paragraph", content = "Four pounds fifty, or the tub, depending on the night and on him. You put your coat on over the vest for the walk across, or you do not." },
    ] },
    { advance_text = "Walk him over.", blocks = [
        { type = "paragraph", content = "Forty feet of apron with him half a step behind you. Nobody talks on that walk. It is four in the morning and there is nothing either of you wants to say." },
    ] },
    { advance_text = "Unlock it.", blocks = [
        { type = "paragraph", content = "Key, lights, and the extractor is already going because it never stops. He says cheers, love, and goes in, and you walk back on your own." },
    ] },
    { advance_text = "Think about the ninety seconds.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "There is a version of that walk where you do not have the key. In that version he stands at the shop door in the dark and you are behind glass." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Back across.", config = { destinationType = "specific", locationId = "the_showers", time_progression_minutes = 20, effects = [
  { targetType = "player", trait = "nights", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_showers_who_gets_it_free"
name        = "Who gets it free"
description = "Triggerless rung off the corridor hub, gated trade >= 15. The token tub as a decision rather than a price list. +2 trade, -2 count, 20 min."

[[canvases.nodes]]
id   = "base"
name = "The tub"
blocks = [
  { type = "paragraph", content = "There is an ice-cream tub of shower tokens under the counter and the till button next to it, and which of those two things gets used is entirely up to you." },
  { type = "cascade", props = { beats = [
    { advance_text = "Work out the rules you have made.", blocks = [
        { type = "paragraph", content = "Agency lads sleeping in cabs get the tub. Owner-drivers get the till. Anybody who has been rude to you gets the till and the full four fifty." },
    ] },
    { advance_text = "Notice nobody set them.", blocks = [
        { type = "paragraph", content = "Bev did not tell you any of that. There is no policy. There is a broken token machine and a woman on nights deciding who has had a hard enough week." },
    ] },
    { advance_text = "Use it tonight.", blocks = [
        { type = "paragraph", content = "One out of the tub for bay nine. One through the till at four fifty for the man who leaned on the counter and asked if you got lonely." },
    ] },
    { advance_text = "Put the tub back.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Four pounds fifty either way to the company. The difference is entirely yours and none of it is on any roll." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Back to the counter.", config = { destinationType = "specific", locationId = "the_showers", time_progression_minutes = 20, effects = [
  { targetType = "player", trait = "trade", op = "add", value = 2, clamp = true },
  { targetType = "player", trait = "count", op = "add", value = -2, clamp = true },
] } }


[[canvases]]
id          = "rung_tyre_the_rope"
name        = "The rope across the pit"
description = "Triggerless rung off the tyre-bay hub. Ungated. It appeared about a week after she said something, and neither of them has mentioned it. +3 relation with npc_ossie, 15 min."

[[canvases.nodes]]
id   = "base"
name = "It was not there before"
blocks = [
  { type = "paragraph", content = "There is a length of blue rope across the shop end of the pit now, tied off to two eye bolts that were not in the wall a fortnight ago." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look at the bolts.", blocks = [
        { type = "paragraph", content = "Drilled, plugged, countersunk, level. He did it properly, which took longer than putting a rope up, which is the part that means something." },
    ] },
    { advance_text = "Don't mention it.", blocks = [
        { type = "paragraph", content = "You said one sentence about who would find him. A week later there are two eye bolts in a wall and neither of you is going to bring it up." },
    ] },
    { advance_text = "Look at which end.", blocks = [
        { type = "paragraph", content = "The shop end. The end you come in at. Not the end he works from. He put the rope where somebody walking in from the apron would meet it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Step over it.", config = { destinationType = "specific", locationId = "the_tyre_bay", time_progression_minutes = 15, effects = [
  { targetType = "npc", npcId = "npc_ossie", trait = "relation", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_tyre_night_callout"
name        = "The phone goes"
description = "Triggerless rung off the tyre-bay hub. Ungated. Two in the morning, a number on a screen, and eleven miles of wet carriageway. +2 relation with npc_ossie, 20 min."

[[canvases.nodes]]
id   = "base"
name = "Eleven miles"
blocks = [
  { type = "paragraph", content = "The phone goes at ten past two. He looks at it for two rings before he answers it, which he does every time, and which is not hesitation." },
  { type = "cascade", props = { beats = [
    { advance_text = "Listen to his half.", blocks = [
        { type = "paragraph", content = "Junction, direction, axle, size. Four questions, in the same order, and then a number of minutes that is always accurate to about three." },
    ] },
    { advance_text = "Watch him load.", blocks = [
        { type = "paragraph", content = "Bottle jack, bar, gun, the right size off the rack, a lamp, and the hi-vis off the hook. Ninety seconds and he has not walked past anything twice." },
    ] },
    { advance_text = "Watch him go.", blocks = [
        { type = "paragraph", content = "The van goes out under the canopy and left onto the road, and the compressor goes off at the isolator, and the plot has one person on it again." },
    ] },
    { advance_text = "Notice the silence.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Ninety minutes of the compressor not running. That is the sound of being the only person for forty miles, and it took eleven weeks to learn to hear it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go back to the shop.", config = { destinationType = "specific", locationId = "the_tyre_bay", time_progression_minutes = 20, effects = [
  { targetType = "npc", npcId = "npc_ossie", trait = "relation", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_static_two_bags_again"
name        = "Eleven minutes"
description = "Triggerless rung off the evening hub. Ungated. How long it would take to leave, worked out again, the way it gets worked out about once a fortnight. +2 stress, 20 min."

[[canvases.nodes]]
id   = "base"
name = "How long it would take"
blocks = [
  { type = "paragraph", content = "Two bags, a coat, the phone off the side, and the key on the hook by the door. Eleven minutes, and about four of those are the bedding." },
  { type = "cascade", props = { beats = [
    { advance_text = "Do the timing again.", blocks = [
        { type = "paragraph", content = "You have actually timed it, once, in week three, which is a thing you have not told anybody and would not enjoy explaining." },
    ] },
    { advance_text = "Do the money.", blocks = [
        { type = "paragraph", content = "That is the part that does not work. Six thousand less what has been paid, and a man with a notebook, and no address at the other end." },
    ] },
    { advance_text = "Do it anyway.", blocks = [
        { type = "paragraph", content = "Eleven minutes to pack and thirty weeks to be able to. Those two numbers have not moved toward each other since the day she got here." },
    ] },
    { advance_text = "Put the bags back.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "The packing is not a plan. It is a thing you do so that leaving stays a fact about the world rather than a thing you used to be able to do." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get the jumper on.", config = { destinationType = "specific", locationId = "her_static", time_progression_minutes = 20, effects = [
  { targetType = "player", trait = "stress", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_static_gravel_sound"
name        = "Footsteps on the gravel"
description = "Triggerless rung off the evening hub. Ungated. Living in a thin box on loose gravel, and what that does to how you sleep. +2 stress, 15 min."

[[canvases.nodes]]
id   = "base"
name = "Nobody crosses it quietly"
blocks = [
  { type = "paragraph", content = "The gravel is the same gravel as the lorry park and it runs right up to the steps of the van. Nothing crosses it without being heard." },
  { type = "cascade", props = { beats = [
    { advance_text = "Learn the ones that are fine.", blocks = [
        { type = "paragraph", content = "Ossie, going to the bay, twice a night. The gas man on a Thursday. A dog from the farm on the other side of the hedge, which took a fortnight to identify." },
    ] },
    { advance_text = "Notice you have learned them.", blocks = [
        { type = "paragraph", content = "You can tell all three apart asleep, at eleven in the morning, through eleven millimetres of board, and you did not decide to be able to do that." },
    ] },
    { advance_text = "Think about the fourth kind.", blocks = [
        { type = "paragraph", content = "Twice in eleven weeks it has been none of them. Both times it was nothing. Both times you were sat up with the light off for about twenty minutes." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go to work.", config = { destinationType = "specific", locationId = "her_static", time_progression_minutes = 15, effects = [
  { targetType = "player", trait = "stress", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_stock_the_hasp"
name        = "The hasp"
description = "Triggerless rung off the dawn stock hub. Ungated. Somebody drilled it in themselves, at an angle, and that is the most informative object in the building. 20 min."

[[canvases.nodes]]
id   = "base"
name = "Countersunk, at an angle"
blocks = [
  { type = "paragraph", content = "The hasp is a galvanised plate with four screws through it into the frame, and the frame is softwood, and the screws went in at about eight degrees off square." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look at the angle.", blocks = [
        { type = "paragraph", content = "Somebody drilled it standing where you are standing, without a proper light, holding the plate with one hand. It is a two-person job done by one." },
    ] },
    { advance_text = "Look at the screws.", blocks = [
        { type = "paragraph", content = "Countersunk and driven flush, so nothing catches a hand or a sleeve, which nobody in a hurry does. He was rushing and he was still careful." },
    ] },
    { advance_text = "Look at what is not there.", blocks = [
        { type = "paragraph", content = "No paint round it. No filler. No attempt to make it look like it came with the building. Whoever did it did not mind it being obvious, only that it was shut." },
    ] },
    { advance_text = "Leave it.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "A careful man in a hurry, on his own, with a drill, in the one part of his own building nothing watches." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Do the restock.", config = { destinationType = "specific", locationId = "the_stock_room", time_progression_minutes = 20 } }


# ═════════════════════════════════════════════════════════════════════════════
