[[canvases]]
id          = "rung_bay9_walkround"
name        = "The walkround"
description = "Triggerless rung off the dawn bay hub. ROOM-SCOPED. Eleven minutes of a legally required check, done properly or not, by whoever is in the bay. 20 min."

[[canvases.nodes]]
id   = "base"
name = "Eleven minutes"
blocks = [
  { type = "paragraph", content = "Lights, tyres, load security, couplings, lines. It is a legal check with a form and it takes about eleven minutes if it is done properly." },
  { type = "cascade", props = { beats = [
    { advance_text = "Time it.", blocks = [
        { type = "paragraph", content = "You have timed four of them without meaning to. Two elevens, one four, and one that was ninety seconds and consisted of walking to the back and coming back." },
    ] },
    { advance_text = "Work out who does which.", blocks = [
        { type = "paragraph", content = "The elevens are the owner-drivers and the men near retirement. The ninety seconds are the agency lads on their third week of nights." },
    ] },
    { advance_text = "Watch the tyres bit.", blocks = [
        { type = "paragraph", content = "Everybody kicks them, which does nothing, and about half of them then actually look at the inner sidewalls with a torch, which does everything." },
    ] },
    { advance_text = "Notice what you know.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Eleven weeks ago you could not have told a coupling from a mudflap. You can now tell a tired man from a careless one at forty feet in the dark." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Let him get on.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_bay9_dawn_coffee"
name        = "One for the road"
description = "Triggerless rung off the dawn bay hub. ROOM-SCOPED SINK, £1, priced on the choice. The last thing this stop does for whoever has been in the bay. 20 min."

[[canvases.nodes]]
id   = "base"
name = "In the chipped one"
blocks = [
  { type = "paragraph", content = "The machine takes ninety seconds. The walk is four minutes. It arrives at bay nine at exactly the temperature a person can drink standing up in February." },
  { type = "cascade", props = { beats = [
    { advance_text = "Take it out.", blocks = [
        { type = "paragraph", content = "He is halfway through the walkround with a torch in his teeth. He takes it, says the same thing they all say about not having any money on him, and drinks it in four goes." },
    ] },
    { advance_text = "Take the cup back.", blocks = [
        { type = "paragraph", content = "The chipped one. It comes back. The proper ones never come back and you stopped taking them out in the second week." },
    ] },
    { advance_text = "Watch him get in.", blocks = [
        { type = "paragraph", content = "Air up, lights on, and the bay is empty at twenty to five with a dry rectangle where the trailer was, and the frost has not got to it yet." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Walk back.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_bay9_left_behind"
name        = "What gets left"
description = "Triggerless rung off the dawn bay hub. ROOM-SCOPED. Four rotations of things found on the gravel of one bay. 15 min."

[[canvases.nodes]]
id   = "base"
name = "On the gravel"
blocks = [
  { type = "paragraph", content = "There is a short list of things that get left on the gravel of bay nine and it has been more or less the same list for four occupants." },
  { type = "cascade", props = { beats = [
    { advance_text = "Go through it.", blocks = [
        { type = "paragraph", content = "Blue roll. A bottle. Cable ties. Once a whole toolbag, which came back for at eleven the same morning by a man who had driven ninety miles." },
    ] },
    { advance_text = "Notice the one that is always there.", blocks = [
        { type = "paragraph", content = "Cable ties. Every occupant. Four for four. Nobody has ever left this bay without dropping at least one cable tie on the gravel." },
    ] },
    { advance_text = "Put it on the post.", blocks = [
        { type = "paragraph", content = "The bottle goes in the bag and the cable ties go in your pocket, which is where they have gone for eleven weeks and there are now about forty of them in the caravan." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Carry on the sweep.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 15 } }


