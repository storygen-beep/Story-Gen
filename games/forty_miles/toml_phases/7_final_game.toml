[[canvases]]
id          = "rung_bev_handover"
name        = "The handover"
description = "Triggerless rung off Bev's hub. Ungated — the guidance card points here. Doing the fifteen minutes properly instead of nodding through it. +4 relation with npc_bev, 20 min."

[[canvases.nodes]]
id   = "base"
name = "Two-twenty float"
blocks = [
  { type = "paragraph", content = "The proper way is to count it in front of her rather than after she has gone. It takes four minutes and it is the difference between being handed a shop and being handed a set of keys." },
  { type = "cascade", props = { beats = [
    { advance_text = "Count it in front of her.", blocks = [
        { type = "paragraph", content = "Twenties, tens, the pound bag, the fifty-pence tube. She watches you do it without saying anything and does not correct you when you get to the same number she got to." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Right." },
    ] },
    { advance_text = "Go through the day with her.", blocks = [
        { type = "paragraph", content = "What went, what did not, who was in, what the pumps did. She gives it to you in about ninety seconds in an order that has clearly been the same order for eleven years." },
    ] },
    { advance_text = "Ask what she means by watch that one.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Blue Scania, bay six. Fine till he's had a drink. After that you'll hear what he did to some girl in Carlisle and how wet she was for it. Serve him and don't laugh." },
    ] },
    { advance_text = "Take the note.", blocks = [
        { type = "paragraph", content = "She is not warning you off him. She is telling you which of the nine will say it out loud. Knowing that is stock control." },
    ] },
    { advance_text = "Let her go.", blocks = [
        { type = "paragraph", content = "She gets to the door and stops with her hand on it, the way she does, and then does not say whatever it was and goes out to the car instead." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Watch her pull out.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 20, effects = [
  { targetType = "npc", npcId = "npc_bev", trait = "relation", op = "add", value = 4, clamp = true },
] } }


[[canvases]]
id          = "rung_bev_last_one"
name        = "The last one"
description = "Triggerless rung off Bev's hub. Ungated. Four people before Robyn and two lasted a fortnight — the rotating-slot logic applied to her own job, which is the quietest threat in the game. +3 relation with npc_bev, 20 min."

[[canvases.nodes]]
id   = "base"
name = "Four before you"
blocks = [
  { type = "paragraph", content = "You ask who was on nights before you. She does the thing where she puts her bag back down on the chair, which means the answer is longer than the question was." },
  { type = "cascade", props = { beats = [
    { advance_text = "Let her tell it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Four. Two of them a fortnight. One did eight months and one did nearly two years." },
    ] },
    { advance_text = "Ask what happened to the two-year one.", blocks = [
        { type = "paragraph", content = "She says he went to a distribution centre in Warrington on nearly double, which is the answer, and then she does not pick her bag up, which is not." },
    ] },
    { advance_text = "Ask about the fortnight ones.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "One couldn't do the quiet. The other one got herself in a mess with the park and Gerry sorted it, and I'm not going into what sorted means." },
    ] },
    { advance_text = "Ask what mess.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Two of them had her in the stock room and half the park knew by Thursday. She'd done nothing wrong. It's just that once they've all pictured it, they don't stop." },
    ] },
    { advance_text = "Don't push it.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Yourself. The other one was a her, and Bev said Gerry sorted it in exactly the voice she uses for the bins." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Let her get off.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 20, effects = [
  { targetType = "npc", npcId = "npc_bev", trait = "relation", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_bev_gerry"
name        = "Ask her about Gerry"
description = "Triggerless rung off Bev's hub, gated relation >= 20. The obligation seen from the day shift. Bev knows about the six thousand and has never mentioned knowing. +4 relation with npc_bev, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Two hundred a week"
blocks = [
  { type = "paragraph", content = "You ask her, on a Thursday, whether Gerry does the Friday thing with everybody. She looks at you for a second longer than the question needs." },
  { type = "cascade", props = { beats = [
    { advance_text = "Wait her out.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "He does the van rent with whoever's in the van. The other thing he does with you." },
    ] },
    { advance_text = "Ask how she knows about the other thing.", blocks = [
        { type = "paragraph", content = "She says the till roll and the wage envelope come out of the same safe and she has counted both of them twice a week for eleven years, and she can do arithmetic." },
    ] },
    { advance_text = "Ask what he gets out of it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Six grand at two hundred a week is thirty weeks. He's not short of six grand, love. He's short of somebody who can't leave for thirty weeks." },
    ] },
    { advance_text = "Ask if he wants anything else.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "He's not asked you for anything and he won't. That's the whole trick of him. He'd rather you got there on your own. On your knees on his forecourt, calling it your idea." },
    ] },
    { advance_text = "Sit with that.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Thirty weeks. Not one of the four before you lasted thirty weeks except the one who went to Warrington." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Let her go home.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_bev", trait = "relation", op = "add", value = 4, clamp = true },
] } }


[[canvases]]
id          = "rung_bev_days"
name        = "What she does on days"
description = "Triggerless rung off Bev's hub, gated relation >= 40. Her arc's top rung: the day shift has its own second economy and Robyn becomes the second person who knows. +5 relation with npc_bev, +3 trade, 30 min."

[[canvases.nodes]]
id   = "base"
name = "The day shift"
blocks = [
  { type = "paragraph", content = "You tell her the roll has been coming up eight or nine light some nights. You say it flat, the way you would say the pumps needed doing. She does not react at all for about four seconds." },
  { type = "cascade", props = { beats = [
    { advance_text = "Let her decide.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Eight or nine. On a night." },
    ] },
    { advance_text = "Say yes.", blocks = [
        { type = "paragraph", content = "She puts her bag on the chair and sits down on it, which she has never once done at quarter to ten, and tells you that the day shift does it on the wastage sheet instead, and has done since about two thousand and nine." },
    ] },
    { advance_text = "Ask how much.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Forty a week. Every week. Eleven years. Do that one in your head." },
    ] },
    { advance_text = "Do it in your head.", blocks = [
        { type = "paragraph", content = "Twenty-three thousand pounds, give or take, out of a shop on a road, forty pounds at a time, by a woman who has never taken a sick day and drives a car that starts." },
    ] },
    { advance_text = "Ask why she is telling you.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Because you're doing it wrong. Eight or nine is a number somebody notices. Forty on a wastage sheet is a number that was always going to be there." },
    ] },
  ] } },
]
# TIER 3 of her declared ceiling hangs off HERE rather than off a ninth hub choice —
# the hub is already at eight and gate 20 is a hard cap. The branch inherits the
# relation >= 40 gate from the hub choice that reaches this rung.
[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Take the lesson."
targetType = "location"
locationId = "the_shop"
time_progression_minutes = 30
effects = [
  { targetType = "npc", npcId = "npc_bev", trait = "relation", op = "add", value = 5, clamp = true },
  { targetType = "player", trait = "trade", op = "add", value = 3, clamp = true },
]

[[canvases.nodes.exit_block.choices]]
text       = "She has still not picked her bag up."
targetType = "node"
nodeId     = "rung_bev_days.stock_room"

[[canvases.nodes]]
id   = "stock_room"
name = "Eleven feet"
blocks = [
  { type = "paragraph", content = "She does not pick her bag up. She walks to the stock-room door instead and holds it open. The shop is empty behind you both and it is four minutes past ten." },
  { type = "cascade", props = { beats = [
    { advance_text = "Follow her in.", blocks = [
        { type = "paragraph", content = "The cold store hums. She puts her back to the roll cages, in the eleven feet where nothing in this building can see. She watches you come the last two steps." },
    ] },
    { advance_text = "Let her say it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Eleven years of this room on my own. Get your hand up my skirt and don't be careful about it." },
    ] },
    { advance_text = "Do it.", blocks = [
        { type = "paragraph", content = "Tights down to her knees and two fingers in her cunt. Standing, her back against a cage that shifts every time she moves. She is wet before you are properly in. Her thumb finds your wrist and pushes it harder." },
    ] },
    { advance_text = "Keep going.", blocks = [
        { type = "paragraph", content = "Your thumb on her clit. She puts her hand over yours to show you how. She does not close her eyes once. She holds the cage with one hand and your wrist with the other, and comes with her mouth shut." },
    ] },
    { advance_text = "Let her get her breath.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bev" }, content = "Right." },
        { type = "paragraph", content = "She pulls the tights up, straightens the skirt, and puts the clipboard back on its hook on the way out. Four minutes past ten has become eleven minutes past." },
    ] },
    { advance_text = "Watch her go.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Eleven years of that room twice a day and she has never once been late out of it. Tonight she was seven minutes late." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Take the shop.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 15, effects = [
  { targetType = "npc", npcId = "npc_bev", trait = "relation", op = "add", value = 5, clamp = true },
  { targetType = "player", trait = "trade", op = "add", value = 3, clamp = true },
  { targetType = "player", trait = "arousal", op = "add", value = 12, clamp = true },
] } }


