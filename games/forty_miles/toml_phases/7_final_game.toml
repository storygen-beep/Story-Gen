blocks = [
  { type = "video", props = { pool_dir = "sex/bay9_dawn_t4", pool = 3, description = "A lorry cab at dawn with sidelights on and a driver doing a walkround.", search_queries = ["lorry cab dawn sidelights driver walkround", "truck early morning first light checks"] } },
  { type = "paragraph", content = "The last bay before the lamp gives out, at ten past four, with the sidelights on and the air building. Everything on this bay happens in the same order every morning." },
  { type = "paragraph", content = "The bay-nine one is always last off. Nobody in bay nine has ever had a tight start, because a tight start would have got them a better bay." },
]

