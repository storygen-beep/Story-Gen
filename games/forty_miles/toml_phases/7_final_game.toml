[[canvases]]
id          = "rung_forecourt_the_road"
name        = "Something every eleven minutes"
description = "Triggerless rung off the dawn forecourt hub. Ungated. The road, counted, which is a thing you end up doing on nights. 20 min."

[[canvases.nodes]]
id   = "base"
name = "Counted"
blocks = [
  { type = "paragraph", content = "You counted it properly once, on a Wednesday, between one and two. Six vehicles in the hour. That is one every ten minutes and it feels like one every forty." },
  { type = "cascade", props = { beats = [
    { advance_text = "Do it again on a Friday.", blocks = [
        { type = "paragraph", content = "Twenty-two. Between one and two. The same hour, the same stretch of road, and nearly four times as many, which is the entire difference between the two jobs." },
    ] },
    { advance_text = "Watch one go past.", blocks = [
        { type = "paragraph", content = "Headlights come up from the junction, the engine note arrives about two seconds after the light does, and then it is past and the note falls away for a long time." },
    ] },
    { advance_text = "Work out what you are doing.", blocks = [
        { type = "paragraph", content = "Standing on a forecourt at half one in the morning counting cars. Nobody asked for the number. There is nowhere to put the number." },
    ] },
    { advance_text = "Go in.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Six an hour. Every one of them a person going somewhere, at speed, past a lit box with you in it, without slowing down." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Back inside.", config = { destinationType = "specific", locationId = "the_forecourt", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_forecourt_the_junction"
name        = "The junction"
description = "Triggerless rung off the dawn forecourt hub. Ungated. Two hundred yards up, and the only way onto this plot. 15 min."

[[canvases.nodes]]
id   = "base"
name = "Two hundred yards"
blocks = [
  { type = "paragraph", content = "The site has one way in, off the junction two hundred yards up. Anything that comes here slows there first, and you can see the brake lights from the counter." },
  { type = "cascade", props = { beats = [
    { advance_text = "Watch for the slow-down.", blocks = [
        { type = "paragraph", content = "Brake lights at the junction means somebody is coming in. It gives you about eleven seconds, which is enough time to put a fleece on, or not." },
    ] },
    { advance_text = "Count how often it happens.", blocks = [
        { type = "paragraph", content = "About one in nine. Everything else goes straight past. You have got very good at telling from the way the lights move whether it is going to be one." },
    ] },
    { advance_text = "Think about the eleven seconds.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Eleven seconds of warning, six times a night. That is the whole security system and you built it yourself out of watching brake lights." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Back to the counter.", config = { destinationType = "specific", locationId = "the_forecourt", time_progression_minutes = 15 } }


[[canvases]]
id          = "rung_tyre_the_four_shirts"
name        = "Four shirts on a rail"
description = "Triggerless rung off the day tyre hub. Ungated. Two work, two not, all four ironed, in a shed. +2 relation with npc_ossie, 15 min."

[[canvases.nodes]]
id   = "base"
name = "Two and two"
blocks = [
  { type = "paragraph", content = "The rail is a length of electrical conduit between two brackets and there are four shirts on it on wire hangers." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look at the two work ones.", blocks = [
        { type = "paragraph", content = "Heavy cotton, oil in the weave that will not come out, cuffs gone at one edge. Working shirts, worn, washed, and ironed." },
    ] },
    { advance_text = "Look at the other two.", blocks = [
        { type = "paragraph", content = "Not work. A plain blue and a check. Ironed, on hangers, with about four inches of clear rail either side of them so they do not touch the work ones." },
    ] },
    { advance_text = "Work out when they get worn.", blocks = [
        { type = "paragraph", content = "You have been on this plot eleven weeks and you have never once seen either of them on him. Not once. They hang there and they get ironed." },
    ] },
    { advance_text = "Say nothing about it.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Two shirts kept ready, four years, in a shed, for something that has not come up." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Come back out.", config = { destinationType = "specific", locationId = "the_tyre_bay", time_progression_minutes = 15, effects = [
  { targetType = "npc", npcId = "npc_ossie", trait = "relation", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_stock_the_range"
name        = "Inside the range"
description = "Triggerless rung off the dawn stock hub, gated trade >= 35. Bev's rule applied: never the same figure twice, always inside a number head office already expects. +3 trade, -3 count, +6 money (clamp = false), 25 min."

[[canvases.nodes]]
id   = "base"
name = "Never the same twice"
blocks = [
  { type = "paragraph", content = "The wastage sheet is a grid on a clipboard by the hot counter. Item, quantity, reason, initial. Nobody has ever checked it against the bin." },
  { type = "cascade", props = { beats = [
    { advance_text = "Work out the range.", blocks = [
        { type = "paragraph", content = "Twenty to forty pounds a week is what a stop like this bins and what head office expects. Anything inside that is weather. Anything outside it is a question." },
    ] },
    { advance_text = "Pick tonight's number.", blocks = [
        { type = "paragraph", content = "Six pounds. Two sandwiches and a pasty, written in with a reason, initialled. Last week it was four and the week before it was nine." },
    ] },
    { advance_text = "Do the bin properly.", blocks = [
        { type = "paragraph", content = "The stock goes in the bag and the bag goes in the bin, because the one thing that would undo eleven years of this is a full bin that does not match a sheet." },
    ] },
    { advance_text = "Sign it.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Eight pounds off a till roll is a number somebody notices. Six pounds on a wastage sheet was always going to be there." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Hang the clipboard up.", config = { destinationType = "specific", locationId = "the_stock_room", time_progression_minutes = 25, effects = [
  { targetType = "player", trait = "trade", op = "add", value = 3, clamp = true },
  { targetType = "player", trait = "count", op = "add", value = -3, clamp = true },
  { targetType = "player", trait = "money", op = "add", value = 6, clamp = false },
] } }


[[canvases]]
id          = "rung_showers_the_drain_again"
name        = "What the drain says"
description = "Triggerless rung off the deep-night hub. Ungated. Nine men a night through one drain, read like a till roll. 25 min."

[[canvases.nodes]]
id   = "base"
name = "Reading it"
blocks = [
  { type = "paragraph", content = "The trap comes out with a screwdriver and everything that went down that floor in a week is in it. You have done this often enough to have opinions about it." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look at what is in it.", blocks = [
        { type = "paragraph", content = "Hair, mostly, and grit, and the grit is the interesting half. It comes off boots and it tells you what sites they have been on." },
    ] },
    { advance_text = "Look at the grit.", blocks = [
        { type = "paragraph", content = "Quarry dust one week and brick dust the next and, once, a fortnight of something white and fine that turned out to be plasterboard." },
    ] },
    { advance_text = "Work out what that means.", blocks = [
        { type = "paragraph", content = "It means the same firms come round on the same cycles, and it means the tipper work moved from a quarry to a demolition job in about the second week of February." },
    ] },
    { advance_text = "Check it against the park.", blocks = [
        { type = "paragraph", content = "Denny's Thursdays went from four in the morning to half two in the same fortnight. The drain knew about the job change before he mentioned it." },
    ] },
    { advance_text = "Put the trap back.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Nobody has ever thanked anybody for this and it is the most detailed record anybody on this site keeps of anything." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Bleach it and go.", config = { destinationType = "specific", locationId = "the_showers", time_progression_minutes = 25 } }


[[canvases]]
id          = "rung_showers_the_quiet_hour"
name        = "The hour it is nobody's"
description = "Triggerless rung off the deep-night hub. Ungated. Between the last one and the first one, the block belongs to a building rather than to anybody. 20 min."

[[canvases.nodes]]
id   = "base"
name = "Half one to four"
blocks = [
  { type = "paragraph", content = "There are about two and a half hours in the middle of the night when nobody on this plot wants the shower block, and that is the only time it is not a facility." },
  { type = "cascade", props = { beats = [
    { advance_text = "Stand in the corridor.", blocks = [
        { type = "paragraph", content = "Four doors, a bench, a drain, and a strip light. With nobody in it and nobody coming, it is a brick shed with plumbing in it and nothing else." },
    ] },
    { advance_text = "Turn the lights off.", blocks = [
        { type = "paragraph", content = "The extractor keeps going. In the dark, with the fan running, it stops being a room you clean and becomes a room that exists whether or not anybody is in it." },
    ] },
    { advance_text = "Stand there in the dark.", blocks = [
        { type = "paragraph", content = "Warm, wet, loud with a fan, and completely black. It is the only place on this plot you cannot see the shop from, or the canopy, or the road." },
    ] },
    { advance_text = "Put the light back on.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Two and a half hours a night when the most contested building on this site is not wanted by anybody. It is the only thing on the plot that gets a rest." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Lock up.", config = { destinationType = "specific", locationId = "the_showers", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_park_the_lamps"
name        = "Two lamps"
description = "Triggerless rung off the park hub. Ungated. Why there are two and not four, which is the whole geography of the NIGHTS ladder in one fact. 20 min."

[[canvases.nodes]]
id   = "base"
name = "Why two"
blocks = [
  { type = "paragraph", content = "There are two sodium lamps on this park and there are columns for four. Two of the columns have no heads on them and never have in the time anybody here remembers." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look at the empty columns.", blocks = [
        { type = "paragraph", content = "They are the same columns. Same base, same bolts, same cable duct coming up out of the ground and stopping. Somebody built for four and fitted two." },
    ] },
    { advance_text = "Ask Ossie.", blocks = [
        { type = "paragraph", content = "He says they were all four working when he started and two went in the same winter and never got replaced, and that it was raised, and that it was priced." },
    ] },
    { advance_text = "Ask what it was priced at.", blocks = [
        { type = "paragraph", content = "Eleven hundred pounds for the pair, fitted, four years ago. He remembers the number because he was stood there when it was said out loud." },
    ] },
    { advance_text = "Do the arithmetic.", blocks = [
        { type = "paragraph", content = "Eleven hundred pounds against six thousand paid out for one woman's problem and a month's wages to another one who had already quit." },
    ] },
    { advance_text = "Look at the dark end again.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "The nine bays past the last lamp are not a design. They are eleven hundred pounds nobody spent, and everything that happens down there happens in the gap." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Walk back up.", config = { destinationType = "specific", locationId = "the_lorry_park", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_denny_the_sister"
name        = "Six years in a hospital car park"
description = "Triggerless rung off Denny's park hub, gated relation >= 40. The one thing he said once and never repeated. +4 relation with npc_denny, 25 min."

[[canvases.nodes]]
id   = "base"
name = "He mentioned it once"
blocks = [
  { type = "paragraph", content = "He said it once, in the middle of something else, and moved straight past it, and you have thought about it every week since." },
  { type = "cascade", props = { beats = [
    { advance_text = "Bring it back up.", blocks = [
        { type = "paragraph", content = "He does not pretend not to remember saying it, which you had half expected. He just goes quiet and leans on the cab and lets you ask." },
    ] },
    { advance_text = "Ask what happened.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_denny" }, content = "Nothing happened. Six years of nothing happening and her ringing me on the way to the car every single shift." },
    ] },
    { advance_text = "Understand the phone calls.", blocks = [
        { type = "paragraph", content = "Every shift. Four hundred yards from a door to a car, for six years, on the phone to her brother, because that was the arrangement they came to and neither of them ever renegotiated it." },
    ] },
    { advance_text = "Ask if she still does it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_denny" }, content = "She's on days now. Has been since twenty-nineteen. I still get a ring on a Thursday about nowt." },
    ] },
    { advance_text = "Let it go.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "That is where the radio comes from. Not chivalry and not ownership. Six years of a phone call about nothing, on a Thursday." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Walk back across.", config = { destinationType = "specific", locationId = "the_lorry_park", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_denny", trait = "relation", op = "add", value = 4, clamp = true },
] } }


[[canvases]]
id          = "rung_denny_the_eleven_pounds"
name        = "Eleven pounds forty"
description = "Triggerless rung off Denny's shop hub, gated relation >= 20. He buys the same eleven pounds of tat every visit, and one night she works out why. +3 relation with npc_denny, 20 min."

[[canvases.nodes]]
id   = "base"
name = "The same list"
blocks = [
  { type = "paragraph", content = "Two energy drinks, Percy Pigs, a phone cable, a tractor magazine, a pasty. Eleven pounds forty. It has been the same list for eleven weeks." },
  { type = "cascade", props = { beats = [
    { advance_text = "Point out he has four cables.", blocks = [
        { type = "paragraph", content = "You tell him you have sold him four of the same cable. He says he knows. He says it without any embarrassment at all, which is the tell." },
    ] },
    { advance_text = "Work it out.", blocks = [
        { type = "paragraph", content = "A shop on a road like this lives or dies on till take. Eleven pounds forty twice a week is about twelve hundred a year off one man who does not need a phone cable." },
    ] },
    { advance_text = "Say it out loud.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_denny" }, content = "If this shop shuts, the nearest one's twenty-two mile. Where do you think I'd get a pasty at midnight then." },
    ] },
    { advance_text = "Take the money.", blocks = [
        { type = "paragraph", content = "You ring the fifth cable through. He puts it in the door pocket of the cab with the other four and says the same thing about bay six on his way out." },
    ] },
    { advance_text = "After.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Twelve hundred pounds a year of deliberate waste, so that a building stays open, so that there is somewhere to stop." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Bag it up.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 20, effects = [
  { targetType = "npc", npcId = "npc_denny", trait = "relation", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_hal_the_second_table"
name        = "Why the second table"
description = "Triggerless rung off Hal's hub, gated relation >= 20. Nobody marked it and everybody leaves it, and there is a reason he picked it. +3 relation with npc_hal, 20 min."

[[canvases.nodes]]
id   = "base"
name = "Second from the door"
blocks = [
  { type = "paragraph", content = "There are four tables and he has sat at the second one from the door every Tuesday for a year, and everybody else leaves it, and nobody has ever said anything about it." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask him.", blocks = [
        { type = "paragraph", content = "He folds the paper, which by now you know means an actual answer is coming, and looks at the other three tables as though he has never assessed them before." },
    ] },
    { advance_text = "Let him answer.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_hal" }, content = "You can see the till from it and you're not sat between anybody and the door." },
    ] },
    { advance_text = "Check it.", blocks = [
        { type = "paragraph", content = "He is right. From table two you can see the counter, the door, and the aisle, and you are not blocking anybody's way out, and table four cannot see the door at all." },
    ] },
    { advance_text = "Ask if that is deliberate.", blocks = [
        { type = "paragraph", content = "He says forty years of transport cafes and you sit where you can see the till, and that he has never thought about it as a decision, and then sits quietly with having just described one." },
    ] },
    { advance_text = "Leave him to the paper.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "A year of the same chair, chosen for a reason he could not have told you until she asked, in a shop where she picked her own corner for reasons she could." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get back behind the counter.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 20, effects = [
  { targetType = "npc", npcId = "npc_hal", trait = "relation", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_ossie_the_calendar_answer"
name        = "The calendar"
description = "Triggerless rung off Ossie's hub, gated relation >= 40. Four years of a dead calendar kept on the right month, explained. +4 relation with npc_ossie, 25 min."

[[canvases.nodes]]
id   = "base"
name = "March"
blocks = [
  { type = "paragraph", content = "You decided not to ask about it weeks ago. You ask about it anyway, on a Saturday night, over a kettle, because at some point not asking became its own kind of statement." },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask why he turns it.", blocks = [
        { type = "paragraph", content = "He looks at it for a while. It has a photograph of a truck on a mountain road and it is turned to March and it is four years out of date." },
    ] },
    { advance_text = "Let him get there.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_ossie" }, content = "It was up when I moved in the bay. I turned it that first month because it was wrong. Then I'd turned it once, so." },
    ] },
    { advance_text = "Ask what happens if he stops.", blocks = [
        { type = "paragraph", content = "He says nothing happens if he stops. He says that is the point, and that four years of nothing happening is exactly what it is a record of, and that he knows how it sounds." },
    ] },
    { advance_text = "Don't make it sad.", blocks = [
        { type = "paragraph", content = "You tell him you have a shoebox with a key to a door four hundred miles away in it and you go through it once a fortnight, and he laughs, and neither of you says anything else about it." },
    ] },
    { advance_text = "Turn it to April.", blocks = [
        { type = "paragraph", content = "You do it, in front of him, and he lets you, and it is the single most alarming thing either of you has done to the other in eleven weeks." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Finish the tea.", config = { destinationType = "specific", locationId = "the_tyre_bay", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_ossie", trait = "relation", op = "add", value = 4, clamp = true },
] } }


[[canvases]]
id          = "rung_tam_the_end_of_the_month"
name        = "The end of the month"
description = "TENANT-SCOPED. Triggerless rung off Tam's hub, gated relation >= 40. The rotation, from inside it. The one beat in the game that is explicitly about the slot being a slot. +3 relation with npc_tam, +2 stress, 25 min."

[[canvases.nodes]]
id   = "base"
name = "The agency moves him on"
blocks = [
  { type = "paragraph", content = "It comes through on a Tuesday. A different run, out of a depot ninety miles south, starting the first of next month." },
  { type = "cascade", props = { beats = [
    { advance_text = "Let him tell you.", blocks = [
        { type = "paragraph", content = "He tells you at the hatch, at half eleven, through the drawer, which is the wrong place for it and is obviously the place he could manage it." },
    ] },
    { advance_text = "Don't make it a thing.", blocks = [
        { type = "paragraph", content = "He is watching to see whether you make it a thing. You do not. You say that is a better run and it is, and it pays more and it does." },
    ] },
    { advance_text = "Ask about the digs.", blocks = [
        { type = "paragraph", content = "He signed for a room in Kelbrook from the first and he is now not going to be within ninety miles of Kelbrook, and he paid a month up front out of the money that landed on the twenty-eighth." },
    ] },
    { advance_text = "Say the true thing.", blocks = [
        { type = "paragraph", content = "You tell him bay nine will have somebody in it by the middle of the month and that you will do the same twelve pounds a week with him and it will be exactly as good a deal." },
    ] },
    { advance_text = "Watch him take that.", blocks = [
        { type = "paragraph", content = "He says he knows. Then he says that he had worked out that it would be somebody else and had not worked out that it would be the same arrangement." },
    ] },
    { advance_text = "After.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Four occupants. The mattress, the mark on the glass at four heights, and the terms set in the first fortnight by whoever is standing on the gravel." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Shut the drawer.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_tam", trait = "relation", op = "add", value = 3, clamp = true },
  { targetType = "player", trait = "stress", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_bay9_the_curtain"
name        = "The curtain"
description = "Triggerless rung off the dawn bay hub. ROOM-SCOPED. A sheet of fabric on a wire, and the only privacy anybody in this park has. 20 min."

[[canvases.nodes]]
id   = "base"
name = "On a wire"
blocks = [
  { type = "paragraph", content = "It runs on a wire behind the seats and it is the only door on the sleeping half of a lorry cab. It does not lock because it is a curtain." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look at how it is used.", blocks = [
        { type = "paragraph", content = "Shut means asleep. Half across means awake and not wanting to be spoken to. Open at two in the morning means somebody has decided they are not sleeping tonight." },
    ] },
    { advance_text = "Look at this one.", blocks = [
        { type = "paragraph", content = "It has a repair in it. Somebody has stitched a tear along the bottom edge with the wrong colour thread, in a straight line, by hand, in a cab." },
    ] },
    { advance_text = "Work out how old the repair is.", blocks = [
        { type = "paragraph", content = "The thread is faded and the fabric round it is not, so it has been there years. It predates every occupant you have met and probably predates Ossie." },
    ] },
    { advance_text = "Think about what it does.", blocks = [
        { type = "paragraph", content = "Nine cabs in this park and every one of them has one. It is what separates a man asleep from a car park, and it is a sheet on a wire, and everybody treats it as a wall." },
    ] },
    { advance_text = "Pull it across.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Everybody on this site agrees to treat a curtain as a wall. It is the only rule out here that has never once been tested." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get down.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_bay9_the_locker"
name        = "The locker over the bed"
description = "Triggerless rung off the dawn bay hub. ROOM-SCOPED. Everything a man keeps in a cab lives in one locker, and what is in it is the same four things every time. 20 min."

[[canvases.nodes]]
id   = "base"
name = "Four things"
blocks = [
  { type = "paragraph", content = "There is a locker over the bunk, about the size of an overhead bin on a plane, and it is the whole of the storage that is not the footwell." },
  { type = "cascade", props = { beats = [
    { advance_text = "Work out the four.", blocks = [
        { type = "paragraph", content = "A bag of clothes. A washbag. Something to eat off, which is usually a bowl and a spoon. And paperwork, which is always in a plastic wallet and is never tidy." },
    ] },
    { advance_text = "Notice what is not in it.", blocks = [
        { type = "paragraph", content = "Nothing decorative. Four occupants and not one photograph, not one thing stuck to anything, not one object whose only job is to be looked at." },
    ] },
    { advance_text = "Compare it to the caravan.", blocks = [
        { type = "paragraph", content = "Two bags under a bed, a shoebox, and a mirror screwed to a door at the wrong height by somebody who is not you." },
    ] },
    { advance_text = "Shut it.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Everybody on this plot lives out of the smallest container that will hold it, and every one of them would tell you it is temporary." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get down off the step.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_bay9_the_hour_before"
name        = "The hour before he wakes"
description = "Triggerless rung off the dawn bay hub. ROOM-SCOPED. Three till four, when the bay has a sleeping man in it and she is outside it. EXPLICIT. +2 seen, +8 arousal, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Three till four"
blocks = [
  { type = "video", props = { pool_dir = "sex/bay9_hour_before_t5", pool = 4, description = "A woman standing alone beside a lorry cab at night with the curtain drawn and a heater running.", search_queries = ["woman standing beside lorry cab night curtain drawn", "figure next to truck at night dark parking heater"] } },
  { type = "paragraph", content = "The curtain is shut and the night heater is going and whoever is in there has about an hour left. You come out on the sweep and end up stood at the wheel arch." },
  { type = "cascade", props = { beats = [
    { advance_text = "Stand there.", blocks = [
        { type = "paragraph", content = "Four feet from a man asleep, in the dark, on gravel, with a fan running at exactly the pitch of a knuckle on glass. He has no idea anybody is out here." },
    ] },
    { advance_text = "Let it get to you.", blocks = [
        { type = "paragraph", content = "Your nipples are up in the cold under the vest and your cunt is wet and neither of those has anything to do with the man specifically. It is the four feet." },
    ] },
    { advance_text = "Do it against the wheel arch.", blocks = [
        { type = "paragraph", content = "Hand down the front of the leggings, two fingers into your cunt, back against cold steel, working your clit four feet from somebody who is not going to wake up." },
    ] },
    { advance_text = "Keep listening to the heater.", blocks = [
        { type = "paragraph", content = "If the fan cuts he will hear the gravel. Your cunt tightens on your own fingers every time the note changes and you do not stop either time it does." },
    ] },
    { advance_text = "Finish out there.", blocks = [
        { type = "paragraph", content = "You come stood up against a wheel arch with your tits out of the vest in February, cunt clenching, teeth in your sleeve, and the fan covers all of it." },
    ] },
    { advance_text = "After.", blocks = [
        { type = "paragraph", content = "You do the rest of the sweep. At ten past four the sidelights come on and he starts the walkround." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "He will buy a coffee at half four and say the thing about not having any money on him." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Carry on the sweep.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 25, effects = [
  { targetType = "player", trait = "seen", op = "add", value = 2, clamp = true },
  { targetType = "player", trait = "arousal", op = "add", value = 8, clamp = true },
] } }


[[canvases]]
id          = "rung_bay9_the_next_one"
name        = "The next one"
description = "Triggerless rung off the dawn bay hub. ROOM-SCOPED — the slot at its most legible, written so it survives every rotation and reads correctly on the fifth occupant as well as the first. +2 trade, 20 min."

[[canvases.nodes]]
id   = "base"
name = "By the middle of the month"
blocks = [
  { type = "paragraph", content = "Bay nine is never empty for long. It is the worst bay on the plot and the worst bay on the plot is still free overnight parking on a road with nothing on it." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look at the empty bay.", blocks = [
        { type = "paragraph", content = "A dry rectangle, an oil shadow, two scoured lines where a fridge unit stood, and about forty cable ties' worth of nothing in the gravel." },
    ] },
    { advance_text = "Work out how long.", blocks = [
        { type = "paragraph", content = "Longest it has been empty is nine days. Shortest is one. The average is about four and you know that because you have been counting, which you did not decide to start doing." },
    ] },
    { advance_text = "Think about the fortnight.", blocks = [
        { type = "paragraph", content = "The terms get set in the first fortnight and they get set by whoever is stood on the gravel when the new one arrives. There is nobody else on this site at that hour." },
    ] },
    { advance_text = "Work out what stays.", blocks = [
        { type = "paragraph", content = "The mattress. The mark on the glass, at a new height. The two-knock rule, which the heater enforces regardless of who is behind the curtain. Twelve pounds a week." },
    ] },
    { advance_text = "Go back in.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Four of them so far and you have been better at it every time, and you have stopped pretending that is only a good thing." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Back to the counter.", config = { destinationType = "specific", locationId = "bay_9", time_progression_minutes = 20, effects = [
  { targetType = "player", trait = "trade", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_stock_the_fourteen_days"
name        = "Fourteen days"
description = "Triggerless rung off the stock hub, gated trade >= 15. The retention window used deliberately rather than noticed. +2 trade, -2 count, 20 min."

[[canvases.nodes]]
id   = "base"
name = "Then it writes over itself"
blocks = [
  { type = "paragraph", content = "Four cameras at that quality on a drive that size is about a fortnight, and then it starts again at the beginning and the beginning is gone." },
  { type = "cascade", props = { beats = [
    { advance_text = "Work out what that buys.", blocks = [
        { type = "paragraph", content = "Anything anybody wants to look at has to be asked for inside fourteen days. Nobody has ever asked for anything in eleven weeks." },
    ] },
    { advance_text = "Work out what it costs.", blocks = [
        { type = "paragraph", content = "It also means that if something happened out on that apron, there is a fortnight to say so and after that there is no picture of it anywhere." },
    ] },
    { advance_text = "Hold both of those.", blocks = [
        { type = "paragraph", content = "The same fourteen days protects a woman taking eight pounds off a till roll and erases whatever happened to a woman crossing forty feet of unlit ground." },
    ] },
    { advance_text = "Check the clock again.", blocks = [
        { type = "paragraph", content = "Two days out. It has been two days out since before you started and every timestamp on that drive is wrong by the same amount and nobody has ever noticed." },
    ] },
    { advance_text = "Leave it running.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "One grey box, one green light, and it is doing both of those jobs badly at the same time." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get on with the stock.", config = { destinationType = "specific", locationId = "the_stock_room", time_progression_minutes = 20, effects = [
  { targetType = "player", trait = "trade", op = "add", value = 2, clamp = true },
  { targetType = "player", trait = "count", op = "add", value = -2, clamp = true },
] } }


[[canvases]]
id          = "rung_stock_what_is_in_there"
name        = "What is in there"
description = "Triggerless rung off the stock hub. Ungated and deliberately repeatable: she guesses, every week, and v0.1 never tells her. Keeps the locked door a WANT rather than a puzzle. 15 min."

[[canvases.nodes]]
id   = "base"
name = "Guessing"
blocks = [
  { type = "paragraph", content = "It is a room about the size of the cold store, behind a softwood door, with a black combination padlock on a hasp somebody drilled in themselves." },
  { type = "cascade", props = { beats = [
    { advance_text = "Guess stock.", blocks = [
        { type = "paragraph", content = "It is not stock. Stock is out here in cages under a camera and on a count that happens on the first Tuesday, and nothing about stock needs a lock of a man's own." },
    ] },
    { advance_text = "Guess paperwork.", blocks = [
        { type = "paragraph", content = "It is not paperwork either. Paperwork lives in a hardback notebook with a rubber band round it on the passenger seat of a car, and he handed you that without blinking." },
    ] },
    { advance_text = "Listen at it.", blocks = [
        { type = "paragraph", content = "Nothing. The cold store hums nine feet away and covers everything. You have stood with your ear on that door four times and heard exactly nothing on all four." },
    ] },
    { advance_text = "Look at the floor under it.", blocks = [
        { type = "paragraph", content = "There is a wear line on the concrete in front of it in a quarter circle, the shape a door makes over years of being opened. Somebody opens it. Not often, and not never." },
    ] },
    { advance_text = "Give up for tonight.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Whatever is behind it, he drove four screws in at eight degrees off square, on his own, in the one part of his own building nothing watches." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Face the cages up.", config = { destinationType = "specific", locationId = "the_stock_room", time_progression_minutes = 15 } }


[[canvases]]
id          = "rung_tyre_the_isolator"
name        = "The isolator"
description = "Triggerless rung off the tyre-bay hub. Ungated. One switch, and what it means when it is off. +2 stress, 15 min."

[[canvases.nodes]]
id   = "base"
name = "One switch"
blocks = [
  { type = "paragraph", content = "There is a red isolator on the wall by the roller door that kills the compressor. He hits it on the way out to a callout and puts it back on when he gets in." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look at it.", blocks = [
        { type = "paragraph", content = "Off is down. From the caravan you cannot see the switch, but you can hear the difference within about eleven minutes, which is how long the receiver takes to want topping up." },
    ] },
    { advance_text = "Think about the silence.", blocks = [
        { type = "paragraph", content = "When it is off there is no compressor, no shirts on a rail, no rope across a pit, and no foot of light under a roller door. There is a shop and a road." },
    ] },
    { advance_text = "Count the hours.", blocks = [
        { type = "paragraph", content = "Two or three callouts a week, ninety minutes each. Call it four hours where there is genuinely nobody on this plot but her, and the isolator is how she knows." },
    ] },
    { advance_text = "Leave it.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Eleven weeks ago the compressor was a noise. Now it is the only instrument on this site that tells you whether you are alone." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Head back.", config = { destinationType = "specific", locationId = "the_tyre_bay", time_progression_minutes = 15, effects = [
  { targetType = "player", trait = "stress", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_showers_the_far_end"
name        = "The far end of the floor"
description = "Triggerless rung off the deep-night hub. Ungated. An inch of standing water that will not go, and eleven weeks of trying. 20 min."

[[canvases.nodes]]
id   = "base"
name = "It never goes"
blocks = [
  { type = "paragraph", content = "The floor is laid to fall toward the middle and at the far end it does not. There is an inch of standing water down there every night and there always has been." },
  { type = "cascade", props = { beats = [
    { advance_text = "Mop it toward the drain.", blocks = [
        { type = "paragraph", content = "It goes. It takes about four minutes and it goes, and by the time nine men have been through in the morning it is back exactly where it was." },
    ] },
    { advance_text = "Work out why.", blocks = [
        { type = "paragraph", content = "The screed is wrong. It was laid wrong when the block was built and no amount of anything anybody does with a mop at three in the morning is going to change the fall of a concrete floor." },
    ] },
    { advance_text = "Do it anyway.", blocks = [
        { type = "paragraph", content = "Every night. Four minutes, on a floor that will be wrong again by six, in a building nobody inspects, for men who will never know it was done." },
    ] },
    { advance_text = "Stand the mop up.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "There is a version of this job where you stop doing the far end. You have thought about it, you have not done it, and you are not entirely sure why." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Lock up.", config = { destinationType = "specific", locationId = "the_showers", time_progression_minutes = 20 } }


[[canvases]]
id          = "rung_showers_the_hot_water"
name        = "Where the hot water comes from"
description = "Triggerless rung off the corridor hub. Ungated. A tank in a cupboard, and the one utility on this site that is genuinely unlimited. 15 min."

[[canvases.nodes]]
id   = "base"
name = "A tank in a cupboard"
blocks = [
  { type = "paragraph", content = "There is a cupboard at the end of the corridor with a three-hundred-litre cylinder in it and an immersion on a timer that has been overridden to permanently on." },
  { type = "cascade", props = { beats = [
    { advance_text = "Open the cupboard.", blocks = [
        { type = "paragraph", content = "It is hot in there. The cylinder is lagged and the lagging is going at one seam and somebody has taped it, badly, with the wrong tape, years ago." },
    ] },
    { advance_text = "Look at the timer.", blocks = [
        { type = "paragraph", content = "The dial is set and then bypassed with a bridging wire across two terminals. It has been like that long enough for the wire to have gone dull." },
    ] },
    { advance_text = "Work out what that costs.", blocks = [
        { type = "paragraph", content = "A three-hundred-litre immersion running permanently is real money on somebody's electric, and it is on Gerry's meter, and nobody has ever mentioned it." },
    ] },
    { advance_text = "Compare it to the caravan.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Unlimited hot water forty feet away on his meter, and a phone-box shower on your gas bottle, and you pay forty-five a week to stand the van on his gravel." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Shut the cupboard.", config = { destinationType = "specific", locationId = "the_showers", time_progression_minutes = 15 } }


[[canvases]]
id          = "rung_shop_the_laminated_card"
name        = "The laminated card"
description = "Triggerless rung off the daylight hub. Ungated. Everything head office has ever said to this building, in one A5 rectangle on the back of a door. 25 min."

[[canvases.nodes]]
id   = "base"
name = "On the back of the door"
blocks = [
  { type = "paragraph", content = "There is one card. It covers wastage, cash handling, lone working and the assembly point, and it is signed by a regional manager whose name means nothing to anybody here." },
  { type = "cascade", props = { beats = [
    { advance_text = "Read the lone working line.", blocks = [
        { type = "paragraph", content = "It says colleagues working alone should follow the site lone working procedure. There is no site lone working procedure. There is a card telling you to follow one." },
    ] },
    { advance_text = "Read the cash line.", blocks = [
        { type = "paragraph", content = "Four sentences, extremely specific, with a maximum drawer figure and a drop procedure and a named safe. Somebody thought hard about that paragraph." },
    ] },
    { advance_text = "Compare the two.", blocks = [
        { type = "paragraph", content = "The money paragraph has a number in it, a procedure and a container. The one about a woman on her own for eight hours has a reference to a document that does not exist." },
    ] },
    { advance_text = "Read the assembly point.", blocks = [
        { type = "paragraph", content = "In the event of fire, assemble at the far end of the lorry park. Past the last lamp. In the dark. That is the designated place of safety on this site." },
    ] },
    { advance_text = "Put it back on its hook.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "The safest place on this plot according to head office is the exact patch of gravel that nothing on the site can see." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Get on with it.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 25 } }


[[canvases]]
id          = "rung_shop_eleven_weeks"
name        = "Eleven weeks"
description = "Triggerless rung off the dawn hub. Ungated. The count, done honestly, at the end of a shift. +2 stress, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Counting it up"
blocks = [
  { type = "paragraph", content = "Eleven weeks on Friday. Fifty-five nights. Three hundred and eighty-five hours in a lit box on a black road with nobody else on the plot." },
  { type = "cascade", props = { beats = [
    { advance_text = "Do the money.", blocks = [
        { type = "paragraph", content = "Two thousand two hundred paid to Nunn. Six thousand less two thousand two hundred is three thousand eight hundred, which is nineteen more weeks at the stated rate." },
    ] },
    { advance_text = "Do the other money.", blocks = [
        { type = "paragraph", content = "And then a number that is not on any roll or in any notebook, out of tokens and back tables and a wastage sheet, which is not small any more and is not written anywhere." },
    ] },
    { advance_text = "Do the rest of it.", blocks = [
        { type = "paragraph", content = "Nineteen names on the back of a till roll. A block she holds the only key to. Eleven feet of corridor. A park that says it is worth stopping at now." },
    ] },
    { advance_text = "Notice which list is longer.", blocks = [
        { type = "paragraph", content = "The second one. By a distance. Eleven weeks ago the whole of this was a job that came with a caravan and a debt she had not asked anybody to pay." },
    ] },
    { advance_text = "Get ready for the handover.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Nineteen weeks to go on a number that has not moved, and about four hours until it is somebody else's shop again." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Tear the roll off.", config = { destinationType = "specific", locationId = "the_shop", time_progression_minutes = 25, effects = [
  { targetType = "player", trait = "stress", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
