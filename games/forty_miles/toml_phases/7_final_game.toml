# =============================================================================
# Forty Miles — 0_systems_spec
# Built with author-game-v2. Want + board: games/forty_miles/v2_state.json
#
# THE PREMISE, IN ONE LINE: at 22:00 the day manager goes home and Robyn is the
# site — the only authority for forty miles. At 06:00 she hands it back and is
# the girl on nights who owes the owner six thousand pounds. The charge is a
# REVERSAL ON A CLOCK, so every meter here buys HOURS, not rank.
#
# METERS, THREE LAYERS (references/the-board.md §3):
#   1  RATCHETING TIERS  nights · seen · trade    — rungs at 15/35/55
#   2  VOLATILE STATE    arousal · stress · energy · money
#   3  PER-CHARACTER     relation · lust          — on each [[npcs]] block
#   +  COUNTERWEIGHT     count — starts at 100, falls when the book stops
#                        balancing, and can be bought back out of her own money
#
# ⚠️ THE TOP BAND IS UNBOUNDED AT v0.1 (min = 55, no max). Gate 8 judges the top
#    band's MIN (gates.py:692-695), so a band at 75 would oblige an authored gate
#    at 75 in this build. It does not exist yet, so it is not promised yet. The
#    75 rung is logged as a promise in v2_state.json and arrives with the content
#    behind it — the honest-wall rule, references/the-release.md.
#
# ⚠️ `count` deliberately carries NO gte/gt/eq gate anywhere in the game. Gate 8
#    only collects tops from those operators (gates.py:680), so a counterweight
#    gated exclusively on lt/lte is skipped rather than made to buy its ceiling.
#    It is the price she pays, not a currency — it owes no content.
#
# ⚠️ EVERY TRAIT EFFECT USES op = "add" (with a NEGATIVE value to take something
#    away). `op = "subtract"` is NOT an engine operation — applyTraitEffect
#    accepts "add" and "set" and silently returns on anything else
#    (v2.py:5742-5751). v0.1 shipped 35 subtract effects and every one of them
#    did nothing: `count` never moved off 100 for the whole game, no activity
#    ever cost energy, and Nunn's short-week penalty never applied. Fixed in
#    0.1.1; references/engine.md §21.
# =============================================================================

schema_version = "1.0"

[project]
id              = "forty_miles"
title           = "Forty Miles"
description     = "Kelbrook Services, ten at night to six in the morning, and nothing open either way for forty miles. She is the only person on site. The man who owns it paid off her debt and has never once mentioned it."
starting_canvas = "canvas_opening"
quests_engine   = "v2"
version         = "0.1.1"

[time]
starting_hour = 22          # Bev has just gone. The first handover is the opening.
starting_day  = "Monday"    # four nights before the first settle-up
starting_week = 1

[settings]
narration_person  = "second"      # IMMUTABLE once v0.1 ships
clothing_enabled  = true
wardrobe_location = "her_static"  # everything she owns is in the caravan

# ─── The settle-up — the ENGINE under everything ─────────────────────────────
# Nunn paid six thousand pounds to make a problem of hers go away and has never
# said what the problem was worth to him. He takes two hundred a week back plus
# forty-five for the caravan, against roughly three hundred and fifty earned in
# cash. That leaves about a hundred, and a bad night on the till comes out of it.
# A date, a face, and a number a single bad night halves (the-economy.md R3).
#
# ⚠️ WEEKLY ONLY. `due_day` is validated against weekday names
#    (template_import.py:4786, VALID_DAYS) — the engine has no monthly period.
#
# ⚠️ eviction_mode = "flag_set", NOT the default "game_end". The product never
#    ends. Missing the draw does not evict her; it sets `terms_changed`, and what
#    he takes instead stops being money.
#
# ⚠️ THIS IS THE ONLY PLACE THE 245 MOVES, and it is the ENGINE that moves it.
#    `advanceDay()` arms `rent_state.is_due` on the rollover into due_day
#    (v2.py:5453-5464); the next `Location_*` entry is intercepted into RentDay
#    (v2.py:15247-15259); paying runs `$player.core_traits.money -= _rent`
#    (v2.py:15925). Verified live at 300 -> 55. So the draw lands in the small
#    hours of Friday, mid-shift, NOT at 18:00 when Nunn's schedule row puts him on
#    the forecourt — the scene text below is written for the hour it actually
#    fires. And no authored canvas may narrate handing the money over: v0.1 shipped
#    one that did, charging nothing and granting relation on every click.
[settings.rent]
enabled          = true
amount           = 245
due_day          = "Friday"
collector_npc    = "npc_nunn"
grace_periods    = 1
start_after_flag = "first_shift_done"
eviction_mode    = "flag_set"
eviction_flag    = "terms_changed"
currency_symbol  = "£"        # the pages hardcoded "$" before this key existed

[settings.rent.text]
title            = "Friday"
scene            = "Friday starts at midnight and he does not wait for six. The car is on the forecourt with the engine running and the window down four inches, and you go out to it, because that is how this has worked since the first week."
greeting         = "Friday, then."
paid_scene       = "You count it into his hand through the window. He does not count it again. He folds it once, puts it in the inside pocket, and writes a figure in the notebook he keeps on the passenger seat, and you stand in the cold watching a man do sums about you."
paid_response    = "Two hundred. Forty-five for the van. You're all right."
paid_closing     = "He puts the window up before he pulls off, and the canopy lights buzz back into the quiet, and it is yours again for eight hours."
cant_pay         = "You haven't got it."
warning_scene    = "You tell him you are short. He turns the engine off, which he has never done, and the forecourt goes very quiet. He looks past you at the shop — the lit glass, the empty aisles, the one till — for long enough that you understand he is not looking at the shop."
warning_response = "One week. I'm not going to be funny about it."
warning_closing  = "He starts the car again. He does not say the number he is short by, and you work out later that he never has, not once, not since March."
eviction_scene_soft    = "The second Friday he parks in the disabled bay by the door and comes in. He has never come in on a Friday. He looks at the till roll, and the shower-block key on your belt, and the notebook stays in the car."
eviction_response_soft = "Let's stop doing it in money."
eviction_closing_soft  = "He does not say what the other way is. He buys a coffee he does not drink, puts the exact change on the counter, and leaves it there when he goes."

[theme]
mode = "dark"


# ─── The next step, on every screen ──────────────────────────────────────────
# The band strings below say where she IS. This says what to do about it — the
# same 🎯/◯ goal block the Quests page renders, from the same cards, so the two
# can never drift. v0.1 shipped with the bands and nothing else in the rail: four
# descriptions of a state, no place, no verb, no person, and a player who never
# opened the Quests page had no direction at all.
[[sidebar_items]]
type = "quest_next"
max  = 3          # one live card per ascent tier


# ─── The ascent tiers ────────────────────────────────────────────────────────
# Three kinds of going-further, so a player who does not want one can still
# climb another. Band text is UI VOICE (references/the-voice.md R1): it names a
# state plainly and never performs. The register lives after the click.

# NIGHTS — how much of the site is hers between 22:00 and 06:00.
[[sidebar_items]]
type  = "trait_status_text"
trait = "nights"
bands = [
  { min = 0,  max = 14, text = "Counter only, hatch down at midnight" },
  { min = 15, max = 34, text = "The hatch stays up" },
  { min = 35, max = 54, text = "The showers and the park are hers" },
  { min = 55, text = "The whole site, all night" },
]

# SEEN — a lit glass box on a black road, cameras inside, a park of men outside.
[[sidebar_items]]
type  = "trait_status_text"
trait = "seen"
bands = [
  { min = 0,  max = 14, text = "Fleece zipped, back to the window" },
  { min = 15, max = 34, text = "Working in what she sleeps in" },
  { min = 35, max = 54, text = "Serving the hatch with nothing under it" },
  { min = 55, text = "Lit up, and the park knows" },
]

# TRADE — what she will sell that is not on the shelves.
[[sidebar_items]]
type  = "trait_status_text"
trait = "trade"
bands = [
  { min = 0,  max = 14, text = "Everything goes through the till" },
  { min = 15, max = 34, text = "Tokens off the book" },
  { min = 35, max = 54, text = "A second price list" },
  { min = 55, text = "Two economies out of one shop" },
]

# The counterweight. Starts clean and buys nothing by design. It falls whenever
# the roll and the drawer stop saying the same thing, and the only way back up is
# covering the shortfall out of her own money — two rungs do that, and they are
# the only positive writes to it in the game.
# Gated on lt/lte ONLY — see the header note on gate 8.
[[sidebar_items]]
type  = "trait_status_text"
trait = "count"
bands = [
  { min = 0,  max = 24, text = "The book is a work of fiction" },
  { min = 25, max = 49, text = "He knows, and he has not said" },
  { min = 50, max = 74, text = "Short, and getting shorter" },
  { min = 75, max = 100, text = "Balances to the penny" },
]


# ─── Trait labels ────────────────────────────────────────────────────────────
[[traits.labels]]
