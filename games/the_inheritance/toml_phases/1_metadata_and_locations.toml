# Phase 1/7 — 1_metadata_and_locations.toml
# The Inheritance — player + all NPCs (with schedules) + the day-one map.
# Scaffold (Step-7 entry). Locked locations that ship WITH their unlock beat (hotel back office →
# hotel_money_control; private floor → private_floor_open) are NOT here yet — they arrive whole with
# their beats. This file is the open, cold-start-reachable map + every NPC declared with a schedule.
#
# IMPORTANT: all [[npcs]] + [[npcs.schedules]] + [[npcs.core_traits]] live in THIS single file.

# ─── Player ───────────────────────────────────────────────────────────────────

[player]
id          = "player"
name        = "Catherine"
description = "The estranged eldest daughter, home for the first time in years. Eleanor's child from before Richard — no blood tie to the stepfather, half-sister to the two younger ones. Written off when her mother chose the new family and let them push her out — the first mistake they made."
portrait    = "catherine.jpg"
customizable = true

[player.core_traits]
# Always-on
corruption = 0
arousal    = 0
energy     = 100
hygiene    = 100
money      = 50          # broke — home with three bags and a contested will

# The public-display register (clothing-driven; raised by being-seen acts)
exhibitionism = 0

# Per-NPC stage traits (player namespace — the gateway/apex cross-reads use these; hidden in 0)
audrey_stage   = 0       # 0 = cold .. up through devoted/gateway (set at her first night)
grayson_stage  = 0       # 0 = obstacle .. bought_out (set at his surrender)
richard_stage  = 0       # 0 = grieving .. fully yours (set at his first night)
margaret_stage = 0       # 0 = at war .. communal slave (the frontier)

# ─── Player customization (auto-rendered before the first canvas; @player tokens) ──
[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "Your name"
default = "Catherine"

[[player.customization_fields]]
id      = "body_type"
type    = "select"
label   = "Build"
default = "average"
options = ["petite", "average", "curvy", "athletic", "thick"]

[[player.customization_fields]]
id            = "look"
type          = "image_select"
label         = "Look"
default       = "composed"
sets_portrait = true
options = [
  { id = "composed", image = "players/catherine_composed.jpg", label = "Composed" },
  { id = "sharp",    image = "players/catherine_sharp.jpg",    label = "Sharp" },
  { id = "weary",    image = "players/catherine_weary.jpg",    label = "Weary" },
]

# ─── NPCs ─────────────────────────────────────────────────────────────────────
# Arc shapes (design book Step 3/4):
#   npc_audrey   — family/ambient (entry + gateway) → arousal + corruption + relation
#   npc_grayson  — antagonist→owned (femdom)        → arousal + corruption(submission) + relation
#   npc_richard  — slow-burn family (warm)          → arousal + corruption(trust) + relation
#   npc_margaret — antagonist (broken, not seduced) → relation + scheming(hidden); NO arousal/corruption
#   npc_lorna    — service (LIGHT ally)             → relation only
#   npc_danny    — prop (Audrey's payoff)           → relation baseline
#   npc_halloway — structural (the will/foreclosure)→ relation baseline

# ── Audrey ──────────────────────────────────────────────────────────────────
[[npcs]]
id          = "npc_audrey"
name        = "Audrey"
description = "Your baby half-sister, in college, fees unpaid and terrified of losing her place. Soft, eager, the only one in this house who never stopped looking up to you. She has a boy at school she's hopeless over."
