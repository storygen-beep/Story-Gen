[[locations]]
id         = "loc_audrey_room"
name       = "Audrey's Room"
description = "Your half-sister's. The homework, behind a door that isn't quite shut."
image       = "locations/audrey_room.jpg"
image_search_queries = ["college girl bedroom desk books cozy", "young womans bedroom study desk"]
entry_from = "loc_residence"

[[locations]]
id         = "loc_grayson_room"
name       = "Grayson's Room"
description = "Your half-brother's. Where the owned Grayson lives."
image       = "locations/grayson_room.jpg"
image_search_queries = ["young mans messy bedroom masculine", "cluttered guys bedroom"]
