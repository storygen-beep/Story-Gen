[[locations]]
id         = "loc_richard_room"
name       = "Richard's Room"
description = "The widower in private, as distinct from the Study."
image       = "locations/richard_room.jpg"
image_search_queries = ["older mans sparse tidy bedroom sober", "minimal mans bedroom neat"]
entry_from = "loc_residence"

[[locations]]
id         = "loc_margaret_room"
name       = "Margaret's Room"
