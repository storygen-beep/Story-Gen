# ═════════════════════════════════════════════════════════════════════════════
# beat_0011 — Key-item economy ([[items]] = consumable/durable inventory).
# The gap_1 items, finally authored into TOML. Sold at canvas_adult_shop (3_activities),
# granted via choice item_effects (action="add"), owned-checked via the `item` condition.
#   • dildo    — gates Audrey's toy rung (aud_lesson_toy + its practice). Durable.
#   • strap_on — gates Audrey's strap rungs (blowjob / first night / anal). Durable.
#   • drug     — gates Margaret's breaking (marg_setup, later). Buyable ahead, by design.
# addItem REQUIRES the item declared here (items_map) or it silently no-ops.
# ═════════════════════════════════════════════════════════════════════════════
[[items]]
id        = "dildo"
name      = "Toy"
icon      = "items/dildo.jpg"
max_stack = 1

