name = "Sleep"
blocks = [
  { type = "image", props = { file = "activities/sleep.jpg", description = "A dim childhood bedroom with the curtain drawn against the dark, the bed turned down for the night.", search_queries = ["dark bedroom bed night curtain", "dim room bed lamp off"] } },
  { type = "paragraph", content = "You draw the curtain and lie down in the room you grew up in. The hotel's quiet. Tomorrow there's the floor to work and the family to handle. You go under." },
]

