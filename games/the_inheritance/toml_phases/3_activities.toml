# The intoxicant (beat_0024) — Margaret's breaking gates on owning it. Locked-visible.
[[canvases.nodes.exit_block.choices]]
text          = "Buy the intoxicant. ($200)"
targetType    = "location"
locationId    = "loc_adult_shop"
time_progression_minutes = 20
show_when_locked = true
conditions = { version = "1.0", items = [
  { type = "trait", subject = "player", trait_key = "money", operator = "gte", value = 200 },
