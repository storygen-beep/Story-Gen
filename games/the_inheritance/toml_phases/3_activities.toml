# (item toy lt 1) so it can't double-buy (max_stack=1). The strap/intoxicant/gift
# fold in with THEIR consumer beats. Open-access shop (loc_adult_shop).
# ══════════════════════════════════════════════════════════════════════════════
[[canvases]]
id          = "shop_adult"
name        = "The shop off the square"
description = "Player economy. The adult shop (open access). Buy the toy ($60) — grants the toy item (itemEffects add), gated money>=60 + not-already-owned (item toy lt 1). aud_lesson_toy gates on owning it. Strap/intoxicant/gift attach with their consumer beats."

[canvases.trigger]
location      = "loc_adult_shop"
is_repeatable = true
priority      = 3
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "The shop off the square"
blocks = [
  { type = "image", props = { file = "activities/shop_adult.jpg", description = "the interior of a discreet adult shop, shelves of toys, a bored clerk behind the counter", search_queries = ["discreet adult shop interior shelves", "sex shop counter dim interior"] } },
  { type = "paragraph", content = "The place off the square with the blacked-out windows. Nobody in there knows your family, which is the whole point. You take your time down the shelves." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text          = "Buy the toy. ($60)"
targetType    = "location"
locationId    = "loc_adult_shop"
time_progression_minutes = 20
show_when_locked = true
conditions = { version = "1.0", items = [
  { type = "trait", subject = "player", trait_key = "money", operator = "gte", value = 60 },
  { type = "item",  item_id = "toy", operator = "lt", value = 1 },
] }
itemEffects = [ { item_id = "toy", action = "add", quantity = 1 } ]
effects = [ { targetType = "player", trait = "money", op = "add", value = -60 } ]

# The strap (beat_0016) — Grayson's pegging rung gates on owning it. Locked-visible.
[[canvases.nodes.exit_block.choices]]
text          = "Buy the strap. ($120)"
