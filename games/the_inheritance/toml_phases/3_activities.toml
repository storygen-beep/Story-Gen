# Solo feeders (porn TV/phone, mirror, masturbate), floor work, etc. are beats authored next.

# ─── activity_sleep — the day-advance router (without it, daytime windows are unreachable) ──
# Player's old room. Available evening through late night. +energy, advances ~8h.

[[canvases]]
id          = "activity_sleep"
name        = "Sleep"
description = "Solo. Your old room. No NPC sub. Energy +80, time +480 (8h). The day-advance router."

[canvases.trigger]
location      = "loc_player_room"
is_repeatable = true
priority      = 3
is_active     = true

[[canvases.trigger.schedules]]
