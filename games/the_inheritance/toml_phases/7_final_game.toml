# ─── Locations (the day-one map — standing hubs are NOT is_container) ───────────

# ═════════════════════════════════════════════════════════════════════════════
# ONE BUILDING (Model B, turn 56). The "estate" and the "hotel" were two parallel
# trees; they're now ONE building — a hotel — with the family living on the residence
# floor above the public floor. Fiction: Eleanor built the boutique hotel and raised
# the family in the residence above it (so Catherine grew up here — "the room you grew
# up in" still holds). loc_estate is RETIRED; loc_residence is the family-floor hub.
# Leaf-room IDs are UNCHANGED, so every beat reference + every NPC schedule still resolves.
#
# WORLD ROOT (turn 70). loc_town is now the map root (no entry_from); the hotel BUILDING
# sits INSIDE the town (loc_hotel.entry_from = loc_town), a peer of the bank/boutique/
# adult-shop/outings. The one-building fiction is untouched — the family still lives in
# the residence ABOVE the public hotel floor; we only reframed the world so the building
# is in the town, not the town hanging off the building (Doctrine 10 §4 geographic layering).
# ═════════════════════════════════════════════════════════════════════════════

# ── The Hotel (the building — the start/home; sits INSIDE the town; the public floor) ─
[[locations]]
id               = "loc_hotel"
name             = "The Hotel — Lobby"
description      = "Eleanor's boutique hotel, faded and bleeding money. A handsome lobby that needs the light fixed, a register no one's minding, MEL— no, ELEANOR'S in brass over the desk. The public floor you'll work and remake; the family lives in the residence up the stairs behind the desk."
image            = "locations/hotel_lobby.jpg"
image_search_queries = ["grand boutique hotel lobby", "faded old hotel reception desk"]
entry_from       = "loc_town"
navigation_order = ["loc_hotel_bar", "loc_hotel_dining", "loc_grand_stair", "loc_hotel_back_office"]

[[locations]]
id          = "loc_hotel_bar"
name        = "The Bar"
description = "A dim, good-bones bar off the lobby. Lorna's domain — she's behind it most hours, pouring for the handful of regulars and watching everything. Where the after-dark version of this place starts."
image       = "locations/hotel_bar.jpg"
image_search_queries = ["dim cozy hotel bar interior", "moody vintage cocktail bar"]
entry_from  = "loc_hotel"

# DEFERRED SHELL (audit f11 follow-up, turn 75). The hotel's dining room — present + LOCKED from
# game start, gated on `hotel_dining_reopened`, which NOTHING sets yet. This is intentional:
# LO wants it placed now, opened in a future authoring pass ("for now keep it locked").
# OFF-PATTERN vs the back office / private floor (which "arrive whole" with their setter, see
# line 4): it builds green because location entry_conditions flags are NOT setter-checked by the
# flag-chain validator, but it leaves a dangling read BY DESIGN. ⚠️ THE FUTURE UNLOCK PASS OWNS:
# a setter beat (reopen / buy back the dining room) AND interior content (activities / an NPC)
# shipped TOGETHER — or it becomes a dead room (audit f9) the instant the flag flips.
[[locations]]
id          = "loc_hotel_dining"
name        = "The Dining Room"
description = "The hotel's dining room off the lobby — white cloths gone grey under dust sheets, a long mirror, chairs stacked on the tables. It hasn't served a plate since the staff were let go. One of the rooms that comes back to life when this place does."
image       = "locations/hotel_dining.jpg"
image_search_queries = ["faded grand hotel dining room dust sheets", "empty shuttered old restaurant chairs on tables"]
entry_from  = "loc_hotel"
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "hotel_dining_reopened", operator = "is_true" },
] }
blocked_message = "Not yet. The dining room's been dark since the staff went — it stays shut until I can afford to light it again."

# ── The Grand Stair (the vertical spine — climbs from the lobby to the upstairs floors) ──
# Non-container standing hub (renders its own passage). The lobby routes UP through here;
# guest rooms / residence / private floor hang off it (entry_from=loc_grand_stair). The
# private floor's "own discreet lift" is carried in this description (no separate hub).
[[locations]]
id          = "loc_grand_stair"
name        = "The Grand Stair"
description = "The wide staircase that climbs out of the lobby behind the desk — a worn runner, a banister three generations have smoothed, a landing window going gold at dusk. The let rooms branch off one flight up; the residence sits above them; and folded into the corner, the old brass service lift, the only discreet way up to the top floor."
image       = "locations/grand_stair.jpg"
image_search_queries = ["grand old hotel staircase wood", "vintage stairwell banister landing window"]
entry_from  = "loc_hotel"
navigation_order = ["loc_hotel_guest_rooms", "loc_residence", "loc_hotel_private_floor"]

[[locations]]
id          = "loc_hotel_guest_rooms"
name        = "The Guest Rooms"
description = "The upstairs floor of let rooms — most of them empty these days. Quiet corridors, doors that lock, a housekeeping cart no one pushes. Where a comped 'favor' has somewhere to happen."
image       = "locations/hotel_guest_rooms.jpg"
image_search_queries = ["empty hotel corridor doors", "quiet hotel hallway guest rooms"]
entry_from  = "loc_grand_stair"

# Locked until you take the books in hand (beat_0007 — canvas_take_books sets the flag).
[[locations]]
id          = "loc_hotel_back_office"
name        = "The Back Office"
description = "The cramped office behind the desk — a safe that doesn't lock right, a filing cabinet of the hotel's whole sorry story, the ledgers Eleanor kept by hand. Whoever sits at this desk decides who in this family gets paid. Now it's you."
image       = "locations/hotel_back_office.jpg"
image_search_queries = ["cramped office back room desk", "old filing cabinet safe office"]
entry_from  = "loc_hotel"
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "hotel_money_control", operator = "is_true" },
] }
blocked_message = "Not yet. Until I hold the books, the desk isn't mine to sit at."

