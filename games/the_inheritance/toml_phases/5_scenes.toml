# Phase 5/7 — 5_scenes.toml
# The Inheritance — NPC scenes (intros, hubs, arc rungs, capstones). Second person,
# RTS-flat, dialogue-carried (Rule 4). Built one arc at a time from the blueprint.

# ══════════════════════════════════════════════════════════════════════════════
# beat_0008 — LORNA (the on-ramp / ally / mirror). Service, LIGHT, NOT a target.
# Built FIRST of the cast: the income ladder's transactional rungs + Grayson's flip
# gate on her flags (lorna_favor_idea / lorna_books / grayson_debt_known). Her intro
# is a dramatized auto-fire first-contact (npc-intro); her hub is repeatable + tiered
# (she teaches the trade). She is never bedded, never gold-plated.
# ══════════════════════════════════════════════════════════════════════════════

# ── Meet Lorna — the dramatized first-contact (auto-fire once at the bar) ──────
[[canvases]]
id          = "canvas_meet_lorna"
name        = "The bartender"
description = "Lorna's npc-intro. Auto-fires once at the Bar. She sizes you up, tells you how bad it really is, and offers to teach you the other way a room like this makes money. Sets lorna_opened_up (opens her hub)."

[canvases.trigger]
location      = "loc_hotel_bar"
is_repeatable = false
priority      = 10
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "lorna_opened_up", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "The bartender"
blocks = [
  { type = "image", props = { file = "scenes/lorna_meet.jpg", description = "a worldly older bartender behind a hotel bar, drying a glass, watching", search_queries = ["experienced woman bartender behind bar", "older bartender drying glass dim bar"] } },
  { type = "paragraph", content = "The bar's the one part of the hotel that still looks like itself. Lorna's behind it, drying a glass she's already dried, watching you cross the lobby like she's been waiting years for it." },
  { type = "cascade", props = { beats = [
    { advance_text = "Go over.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "Catherine. God — you've got her face when you're angry. Anyone ever tell you that?" },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "Sit. I'll tell you what nobody upstairs will. This place is three bad months from gone, and your aunt's already deciding which walls to sell." },
    ] },
    { advance_text = "\"And you're telling me why?\"", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "And you're telling me why?" },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "Because I've watched this room make money the honest way and the other way. The honest way's dead. You look like someone who'd rather hear the other." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "\"Tell me the other way.\""
targetType = "location"
locationId = "loc_hotel_bar"
flagEffects = [ { targetType = "player", flag = "lorna_opened_up", op = "set" } ]

# ── Lorna's hub — repeatable, tiered (she teaches the trade). Multi-node. ──────
