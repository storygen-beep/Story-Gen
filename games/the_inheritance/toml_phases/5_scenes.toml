# Phase 5/7 — 5_scenes.toml
# The Inheritance — scenes + quest cards. Scaffold: the spine quest card only.
# NPC hubs / ambients / capstones + their milestone quest cards are beats authored next.

# ─── Spine quest card (Story Goals — the central control-economy pressure) ──────
# Mechanic-mode (no ready_canvas): crossing the money milestone IS the early goal.
# Active until the frontier (margaret_slave). Names the concrete next action (legibility).

[[quest_cards]]
text       = "The hotel is drowning in debt and the will is contested. Halloway holds a foreclosure over all of it — and Margaret is circling. Take this place in hand before they sell it out from under you."
ready_text = "The house is starting to answer to you."
tip        = "Work the hotel floor for money (the bar + the lobby, day and evening). Take the books in hand when you can."
priority   = 10
when = [
  { flag = "margaret_slave", op = "is_false" },
]
goals = [
  { trait = "money", subject = "player", op = "gte", value = 500, label = "Money" },
]

# ═════════════════════════════════════════════════════════════════════════════
# beat_0004 — MEET LORNA (on-ramp) + the lobby reactive ambient
# ═════════════════════════════════════════════════════════════════════════════

# ── canvas_meet_lorna — the on-ramp (ungated, corr 0, day 1) ─────────────────────
# Fires at the bar when Lorna's present. She sizes up the broke prodigal and PLANTS
# the first dirty idea (sets lorna_idea_favors — acting on it = the favor scene, gated
# on corruption later). Sets lorna_met. One genuine ally; relation, no lewd.
[[canvases]]
id          = "canvas_meet_lorna"
name        = "The bartender"
description = "beat_0004. On-ramp. loc_hotel_bar, requires Lorna present, lorna_met is_false. She sizes you up + plants the first dirty idea. Sets lorna_met + lorna_idea_favors, relation +10. Ungated (corr 0)."

[canvases.trigger]
location      = "loc_hotel_bar"
requires_npc  = "npc_lorna"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "lorna_met", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "meet"
name = "The bartender"
blocks = [
  { type = "image", props = { file = "scenes/canvas_meet_lorna.jpg", description = "The hotel bar off the lobby, a sharp older woman bartender behind the counter sizing up a younger woman who's just walked in.", search_queries = ["hotel bar older woman bartender", "dim bar female bartender counter"] } },
  { type = "paragraph", content = "The bar off the lobby is the only room in the hotel that still looks like it's making money, and the woman behind it looks like she's the reason. Fifties, sharp-eyed, a rag over one shoulder and a read on you before you've crossed the room. Lorna. She's poured here longer than Eleanor owned the place and she's seen every kind of person walk in broke." },
  { type = "paragraph", content = "She slides you a drink you didn't order and doesn't charge you for it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "Eleanor's girl. Come back to save the place, or sell it?" },
  { type = "cascade", props = { beats = [
    { advance_text = "Save it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "Mm. Honey, a hotel like this doesn't get saved on room rates. Not in this town. You want to know what a place with rooms and a bar and nobody asking questions can really make after dark — you come find me. I've got ideas older than you are." },
        { type = "thought_bubble", props = { speaker = "npc_lorna" }, content = "She's got the look. Hungry and out of options. That's the kind that says yes eventually." },
    ] },
  ] } },
  { type = "paragraph", content = "She lets it sit there between you, the idea, like a tip she's leaving you instead of the other way around. You file it away. Not yet. But you file it." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Take the drink."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "loc_hotel_bar"
time_progression_minutes = 20
flagEffects = [
  { targetType = "player", flag = "lorna_met",         op = "set" },
  { targetType = "player", flag = "lorna_idea_favors", op = "set" },
]
effects = [
  { targetType = "npc", npcId = "npc_lorna", trait = "relation", op = "add", value = 10 },
]

# ── scene_lobby_eyes — light Lane-2 reactive ambient (civil register, early) ──────
# Fires on the lobby floor once she carries herself bolder (exhibitionism ≥ 5, raised by
# the mirror). Civil: stares, a comment, a brush-by. +arousal 1 (the thrill feeds the loop).
# Reads worn_corruption later when the clothing catalog lands (beat); for now exhibition-gated.
[[canvases]]
id          = "scene_lobby_eyes"
name        = "Eyes on the floor"
description = "beat_0004 (worn_corruption-retrofit beat_0005). Lane-2 reactive ambient @ loc_hotel. Gated worn_corruption>=10 (reads what she WEARS, per reactive-world doctrine). Civil — stares/comment/brush-by. +arousal 1. Repeatable flavor; no NPC."

[canvases.trigger]
location      = "loc_hotel"
trigger_mode  = "random"
chance        = 0.25
is_repeatable = true
max_triggers_per_day = 1
