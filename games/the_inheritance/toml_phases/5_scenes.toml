# node_charge — the comfort turns warm (repeatable; opens after "Back to life")
[[canvases.nodes]]
id   = "node_charge"
name = "The undercurrent"
blocks = [
  { type = "paragraph", content = "It changed the night he didn't let go of your hand when the talking stopped. Now sitting with him has an undercurrent, and you both pretend it doesn't — and the pretending is its own kind of touching." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_richard" }, content = "I shouldn't— you're half my age, and I'm your mother's— God. Tell me to stop. Please tell me to stop, because I don't seem able to." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_richard" }, content = "…you're not telling me to stop. Catherine. Oh, I've missed this. I've missed being a person so much it frightens me." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_richard" }, content = "Just— don't tell me this is pity. I couldn't bear it if this was only you being kind. Tell me it isn't only kind." },
  { type = "paragraph", content = "You don't tell him to stop. You lean in and let it warm, and tell yourself it's the arc — the trust, the plan — and you're mostly right. Mostly. You don't look at the part that isn't." },
]

