[[canvases.nodes]]
id   = "base"
name = "Ours"
blocks = [
  { type = "image", props = { file = "scenes/lorna_partnership.jpg", description = "a veteran bartender pouring two drinks and sliding one across to the owner's side of the counter, a pact", search_queries = ["bartender pouring two drinks sliding one across counter", "two women toasting quietly at a bar late night"] } },
  { type = "paragraph", content = "Lorna pours two without asking and slides one to your side of the counter — which she has never once done, in all the nights you stood here learning the trade off her." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "So it's yours. All of it, on paper — Richard's name signed off, Margaret sat in a corner of it. I've worked this bar through four owners. Watched every one of them get eaten by this family." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "You ate them instead. I'm too old to be impressed by people, and you impressed me. So here's the last lesson: stop learning. You're done. You run it, I run the room, and the floor's ours. Not yours-that-I-work. Ours. If you want that." },
  { type = "dialog", props = { speaker = "player" }, content = "I want that." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "Good girl. Then it's done — first thing that's felt like a win in this building since before your mother got sick." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
