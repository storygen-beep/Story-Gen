# node_pursue — he throws himself at the hotel to deserve you (opens after "First night")
[[canvases.nodes]]
id   = "node_pursue"
name = "Deserving you"
blocks = [
  { type = "paragraph", content = "He's a different man on the floor now — up early, on the phones, chasing suppliers he'd let lapse — because every improvement is a thing to show you, and every thing to show you is a reason to keep you close." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_richard" }, content = "I got the linen contract back. The good one. I wanted to tell you first. It felt— it felt important to tell you first." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_richard" }, content = "The place is coming back. I'm coming back. You did that. Whatever you want from me, the answer's already yes. I just want to be where you are." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_richard" }, content = "Tell me what else to fix. Anything. Give me a list. I like having a list again. I like having a reason to get up in the morning." },
  { type = "paragraph", content = "The failing hotel revives on the back of a widower's want, and he thinks he does it for you both. You reward the effort with more of yourself — a man working this hard to deserve you is about to sign anything you set in front of him." },
]

