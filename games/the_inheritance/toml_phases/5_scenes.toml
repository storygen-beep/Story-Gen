  { type = "paragraph", content = "You let her find out the way she likes to deliver things — over tea, pleasantly. You sit across from her and lay the pieces on the table one at a time." },
  { type = "dialog", props = { speaker = "player" }, content = "Richard signed the hotel and the will-control to me. In his own hand. Grayson renounced his claim. Halloway has the papers, and the papers are airtight." },
