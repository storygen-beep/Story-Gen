# node_confide — he tells you the worst of it (non-lewd trust)
[[canvases.nodes]]
id   = "node_confide"
name = "The second cup"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_richard" }, content = "I keep setting two cups out. Every morning. Twenty-nine years — your hand just does it. Then I stand there looking at the second cup like an idiot." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_richard" }, content = "You're the only one who sits with me. Audrey tries, bless her, but she's frightened of it. Grayson's… Grayson. You just sit. You don't need me to be all right. God, it helps." },
  { type = "paragraph", content = "He hands you the worst of it because you're safe — and you are, you want nothing a grieving man would notice. You take the weight, and feel the warmth of being trusted, and don't look too hard at how much you like it." },
  { type = "paragraph", content = "That way's a door you're not ready to open. So you leave it shut. You stay anyway." },
]

