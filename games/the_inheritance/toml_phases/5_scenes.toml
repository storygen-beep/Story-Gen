id          = "hub_lorna"
name        = "Lorna"
description = "Lorna's repeatable hub (Bar, evenings). Base talk (relation feeder) + routed unlock nodes she SPEAKS: the books (-> lorna_books), the comp-a-room idea (-> lorna_favor_idea), Grayson's gambling (-> grayson_debt_known, after the books). Tiered locked-visible."

[canvases.trigger]
location      = "loc_hotel_bar"
is_repeatable = true
priority      = 4
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "lorna_opened_up", operator = "is_true" },
] }

# base — talk + the routed unlocks
[[canvases.nodes]]
id   = "base"
name = "Lorna"
blocks = [
  { type = "paragraph", content = "Lorna's where she always is, a rag over one shoulder, the till open. She tips her chin at the stool like it's yours now." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Have a word."
targetType = "location"
locationId = "loc_hotel_bar"
