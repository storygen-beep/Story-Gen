show_when_locked = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "lorna_books", operator = "is_false" },
] }

[[canvases.nodes.exit_block.choices]]
text          = "\"How does a room like this really turn a profit?\""
targetType    = "node"
nodeId        = "hub_lorna.node_favor"
show_when_locked = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "lorna_favor_idea", operator = "is_false" },
] }

[[canvases.nodes.exit_block.choices]]
text          = "\"What do you know about Grayson?\""
targetType    = "node"
nodeId        = "hub_lorna.node_debt"
show_when_locked = true
