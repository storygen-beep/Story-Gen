# ══════════════════════════════════════════════════════════════════════════════
# beat_0010 — AUDREY: the on-ramp (the cast proper begins). Entry target + GATEWAY,
# family/ambient DENSE. All UNGATED Act-1 work (D1 — no gate on the entry target).
# Staged in HER ROOM, evenings (she's offscreen at college daytime; requires_npc
# gates presence). Four canvases:
#   canvas_meet_audrey — the npc-intro (warm re-contact; she's the one warm thing in
#                        a cold house, no idea what you are). -> aud_opened_up.
#   aud_hub            — repeatable base hub: talk (relation feeder) + the tuition PAY
#                        choice (locked-visible, gated aud_tuition_known + money>=800
#                        -> audrey_tuition_paid). Lesson rungs attach here in beat_0012.
#   aud_tuition        — one-shot confession: the tuition panic ($800 she doesn't have,
#                        nowhere else to go). -> aud_tuition_known (opens the pay choice).
#   aud_fix_everything — CAPSTONE 1 "You fix everything" (once-only, non-lewd trust
#                        peak). Pulled forward from the plan's nominal beat_0013 because
#                        aud_trust GATES the first lesson (beat_0012) — setting it after
#                        would invert the dependency (same principle as the income rungs).
#                        -> aud_trust (the door to the lessons).
# Register: cold sapphic — SHE's warm/eager (calls you "Cath", never crude), YOU're
# cold; the horror is the player's alone. Second person, dialogue-carried.
# ══════════════════════════════════════════════════════════════════════════════

# ── Meet Audrey — the npc-intro (auto-fire once, her room, evenings) ───────────
[[canvases]]
id          = "canvas_meet_audrey"
name        = "Your sister"
description = "Audrey's npc-intro. Auto-fires once in her room (evenings, requires_npc). The warm re-contact: she's glad you're back, no idea what you are; the crack in you is that you let it be true. Sets aud_opened_up (opens her hub)."

[canvases.trigger]
location      = "loc_audrey_room"
requires_npc  = "npc_audrey"
is_repeatable = false
priority      = 10
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "aud_opened_up", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "Your sister"
blocks = [
  { type = "image", props = { file = "scenes/meet_audrey.jpg", description = "a young woman cross-legged on a bed with a textbook, looking up bright and glad", search_queries = ["young woman studying on bed looks up smiling", "college girl cross-legged bed textbook bedroom"] } },
  { type = "paragraph", content = "Audrey's cross-legged on her bed with a textbook open to a page she's not reading. She's the only warm thing in this house — and the only one who looks up glad it's you." },
  { type = "cascade", props = { beats = [
    { advance_text = "She sees you.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_audrey" }, content = "Cath! God, you're actually here. I kept being sure they'd scare you off before I even got to see you." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_audrey" }, content = "Sit with me? Everyone in this house talks to me like I'm a piece of the furniture." },
    ] },
    { advance_text = "\"I'm not going anywhere.\"", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "I'm not going anywhere." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_audrey" }, content = "Good. It's — it's been a lot, since Mum. You're the only one who ever actually helped me with anything." },
    ] },
    { advance_text = "Let her believe it.", blocks = [
        { type = "paragraph", content = "She has no idea what you are. She thinks the cavalry came home. You let her — it's the truest thing anyone's put in front of you since you walked through the door." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Stay a while."
targetType = "location"
locationId = "loc_audrey_room"
flagEffects = [ { targetType = "player", flag = "aud_opened_up", op = "set" } ]

