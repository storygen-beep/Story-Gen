        { type = "thought_bubble", props = { speaker = "npc_margaret" }, content = "When. When did she — Richard? Grayson? Both of them, under my nose, while I watched her hands and never her eyes. Oh, you clever, clever little animal. I taught Eleanor's girl too well." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "There it is — the moment she knows. I could leave her like this, beaten and breathing, a deposed queen rattling around the house. But I didn't come home to win. I came home to take everything. And she's the last thing." },
    ] },
  ] } },
