# ── Quest card — Audrey's tuition (mechanic-mode; the earn-and-pay tracker) ───────
# beat_0010. Active from the promise until it's paid. Goal = the $500. Points at aud_tuition_pay.
# Retires when audrey_tuition_paid is set (the next card, below, opens the lessons via aud_teachme).
[[quest_cards]]
text         = "Audrey came to you in tears over a withdrawal notice, and you promised her it was handled — before you had a dollar to handle it with. Now you have to make that true. Earn the five hundred, take it to her room, and become the one person who keeps her promises. She's counting the days whether she says so or not."
ready_text   = "You've got the $500. Find Audrey in her room and pay it off."
tip          = "Earn $500 — work the hotel floor (and the harder lines, if you've the nerve). Then bring it to Audrey's room: weekday evenings, or any time on the weekend."
priority     = 8
npc_id       = "npc_audrey"
ready_canvas = "aud_tuition_pay"
when = [
  { flag = "audrey_tuition_promised", op = "is_true"  },
  { flag = "audrey_tuition_paid",     op = "is_false" },
]
goals = [
  { trait = "money", subject = "player", op = "gte", value = 500, label = "Money" },
]

