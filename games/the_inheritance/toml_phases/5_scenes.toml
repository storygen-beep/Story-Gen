  { type = "flag", subject = "player", flag_key = "lorna_books", operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "grayson_debt_known", operator = "is_false" },
] }

# node_books — she shows you where the money went (-> lorna_books, opens the purse)
[[canvases.nodes]]
id   = "node_books"
name = "The real books"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "You want the real books, not the ones Halloway reads out. Fine. Come round the back — I keep the truth in a shoebox, because your mother did too." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "Richard hasn't looked at these since the funeral. Somebody takes them in hand, they run this place. Might as well be the one who'll actually do it." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Take the shoebox."
targetType = "location"
locationId = "loc_hotel_bar"
flagEffects = [ { targetType = "player", flag = "lorna_books", op = "set" } ]

# node_favor — the comp-a-room idea (-> lorna_favor_idea, opens the favour rung)
[[canvases.nodes]]
id   = "node_favor"
name = "The other way"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "Simplest thing in the world, honey. A guest likes you. You comp him the room — it's empty anyway — and he pays it back the way men pay things back when they think it was their idea." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "One favour makes more than a week of carrying trays. You decide how far a favour goes. I just point out the door." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "\"Point at the door.\""
targetType = "location"
locationId = "loc_hotel_bar"
flagEffects = [ { targetType = "player", flag = "lorna_favor_idea", op = "set" } ]

# node_debt — Grayson's gambling (-> grayson_debt_known, the knife)
[[canvases.nodes]]
id   = "node_debt"
name = "What Lorna knows"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "Where the money went? Half of it went up your brother's nose and the other half onto tables he can't cover. He owes men who don't send letters." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "When the purse is yours, so's his allowance. A man that soft, that scared — you'll find he'll do a great deal to keep the wrong people off his back." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "File that away."
targetType = "location"
locationId = "loc_hotel_bar"
flagEffects = [ { targetType = "player", flag = "grayson_debt_known", op = "set" } ]

# ══════════════════════════════════════════════════════════════════════════════
# beat_0009 — the LORNA-UNLOCKED income rungs (the deferred tail of the beat_0006/07
# ladder — built NOW that Lorna's flags exist). Three canvases:
#   p_take_purse  — the HINGE ⭐ (one-shot): you take the books in hand -> SETS
#                   hotel_in_hand (the keystone Richard's "keys" + Grayson's "deal"
#                   both read), retires the spine quest card. At the BAR (the back
#                   office is locked until richard_signed, so it can't live there yet;
#                   node_books already put Lorna's shoebox behind the bar). Gated
#                   lorna_books + a money floor (you can cover a week of staff).
#   p_floor_favor — the transactional earn (repeatable): comp a guest a room for a
#                   "favour" — the first line crossed. Guest rooms. Gated corr>=Lewd
#                   + lorna_favor_idea. Once/day (favor_done_today). ~$150.
#   lorna_mirror  — the MIRROR (recurring Lane-2 random ambient, VOYEURISTIC ONLY):
#                   catch Lorna with a customer, she winks, doesn't stop, nothing
#                   changes — and that is the lesson. Never pulls the player in.
# Second person, RTS-flat, dialogue-carried where Lorna's present (Rule 4).
# ══════════════════════════════════════════════════════════════════════════════

# ── p_take_purse ⭐ — the hinge (auto-fire one-shot, Bar) -> hotel_in_hand ──────
[[canvases]]
id          = "p_take_purse"
name        = "The real books"
description = "THE HINGE. Auto-fires once at the Bar when lorna_books is set AND you can cover a week of staff (money>=500). Lorna lays out the real books; you stop asking Richard and start deciding. SETS hotel_in_hand -> retires the spine card, gates Richard's keys + Grayson's deal."

[canvases.trigger]
location      = "loc_hotel_bar"
is_repeatable = false
priority      = 8
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag",  subject = "player", flag_key  = "lorna_books",   operator = "is_true"  },
  { type = "trait", subject = "player", trait_key = "money",         operator = "gte", value = 500 },
  { type = "flag",  subject = "player", flag_key  = "hotel_in_hand", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "The real books"
blocks = [
  { type = "image", props = { file = "scenes/take_purse.jpg", description = "a woman going through a shoebox of receipts and a ledger on a bar top after close, one lamp on", search_queries = ["woman going through receipts ledger at bar night", "shoebox of papers accounts dim bar counter"] } },
  { type = "paragraph", content = "Lorna sets a shoebox on the bar between you — receipts, a payroll book, a bank letter still sealed. The real books. The ones Halloway didn't read out." },
  { type = "cascade", props = { beats = [
    { advance_text = "Open it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "That's what's owed, what's coming in, what's going out. Richard hasn't touched this since the funeral. Somebody runs a place by doing this — not by being left it in a will." },
    ] },
    { advance_text = "Go down the columns.", blocks = [
        { type = "paragraph", content = "It isn't dead. It's neglected — a hand on the payroll, a call to the bank, and the place turns. You've spent a week asking Richard for a foothold you could have just reached out and taken." },
    ] },
    { advance_text = "Take it.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "I'll stop asking him, then." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "There it is. Your mother's exact face, right before she fired somebody. Go on, owner." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "choices"

# Flag on the CHOICE's flagEffects (GAP-6: a location-type exit's effects.flagEffects
# is invisible to the flag-chain validator). hotel_in_hand is the keystone.
[[canvases.nodes.exit_block.choices]]
text       = "Take the books in hand."
targetType = "location"
locationId = "loc_hotel_bar"
flagEffects = [ { targetType = "player", flag = "hotel_in_hand", op = "set" } ]

