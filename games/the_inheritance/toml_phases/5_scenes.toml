  { type = "image", props = { file = "scenes/marg_amb_vanity.jpg", description = "an elegant older woman at a vanity with her hair down and her back to the door, caught for a second unguarded, then composed", search_queries = ["older woman at vanity hair down back to door dim", "refined woman dressing table unguarded mirror"] } },
  { type = "paragraph", content = "Her door's ajar, which it never is. She's at the vanity, back to you, hair down — the patrician armour laid out on the glass like something she puts on. For one second you see her age. Then she catches you in the mirror." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_margaret" }, content = "Knocking is a courtesy the well-raised extend. But your mother raised you, so." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_margaret" }, content = "You've caught me untidy. Don't make it mean anything. A woman is allowed one room in which she isn't performing — even a woman you've decided to beat. Now go, dear. The door was never an invitation." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Leave her the one room."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_margaret_room"
time_progression_minutes = 5

