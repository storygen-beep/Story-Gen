[[canvases.nodes]]
id   = "base"
name = "Eyes on the floor"
blocks = [
  { type = "image", props = { file = "scenes/scene_lobby_eyes.jpg", description = "A hotel lobby floor where a well-dressed woman crosses and men at the desk turn to watch her pass.", search_queries = ["hotel lobby woman men watching", "elegant woman lobby men looking"] } },
  { type = "cascade", props = { id = "lobby_eyes", beats = [
    { blocks = [
      { type = "paragraph", content = "You're dressing for the floor now, and it shows. A man at the desk gives you a slow look and doesn't bother hiding it. Someone brushes past closer than they need to. None of it costs you anything — still polite, still deniable — and you don't mind being looked at." },
    ] },
    { advance_text = "Don't pull away.", conditions = { version = "1.0", items = [ { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 25 } ] }, blocks = [
      { type = "paragraph", content = "A hand finds you in the crowd — your hip, the small of your back, lower — and you let it stay a beat too long before you move on. Nobody says a word. They don't have to." },
    ], effects = [
      { targetType = "player", trait = "arousal", op = "add", value = 2 },
      { targetType = "player", trait = "exhibitionism", op = "add", value = 1 },
    ] },
    { advance_text = "Let him follow you.", conditions = { version = "1.0", items = [ { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 50 } ] }, blocks = [
      { type = "video", props = { file = "scenes/lobby_eyes_backhall.webm", description = "Catherine lets a guest take her against the wall in the hotel back hallway for the price of a room.", search_queries = ["hotel hallway quick sex stranger", "woman against wall hallway sex"] } },
      { type = "paragraph", content = "One of them follows you toward the back hall and you let him, and you take it against the wall where the desk can't see — quick, paid, the price of a room pressed into your hand after. You straighten your dress and walk back out onto the floor." },
    ], effects = [
      { targetType = "player", trait = "corruption", op = "add", value = 1 },
      { targetType = "player", trait = "money", op = "add", value = 60 },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "location"
text = "Let them look."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "loc_hotel"
time_progression_minutes = 10
effects = [
  { targetType = "player", trait = "arousal", op = "add", value = 1 },
]

# ═════════════════════════════════════════════════════════════════════════════
# beat_0007 — TAKE THE BOOKS (Lorna sets hotel_money_control; unlocks the back office)
# ═════════════════════════════════════════════════════════════════════════════

# ── canvas_take_books — Lorna's lesson; the control-economy lever ────────────────
# Fires at the bar when Lorna's present, you've met her, and you're far enough in (Lewd).
# Sets hotel_money_control (the Grayson flip + the back office). One-shot.
[[canvases]]
id          = "canvas_take_books"
name        = "The books"
description = "beat_0007. loc_hotel_bar, requires Lorna, gate lorna_met + corruption>=25 + hotel_money_control is_false. Lorna teaches you to seize the hotel's finances. Sets hotel_money_control, relation +10. Unlocks loc_hotel_back_office."

[canvases.trigger]
location      = "loc_hotel_bar"
requires_npc  = "npc_lorna"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag",  subject = "player", flag_key  = "lorna_met",           operator = "is_true"  },
  { type = "trait", subject = "player", trait_key = "corruption",          operator = "gte", value = 25 },
  { type = "flag",  subject = "player", flag_key  = "hotel_money_control", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "take"
name = "The books"
blocks = [
  { type = "image", props = { file = "scenes/canvas_take_books.jpg", description = "A back office behind the hotel desk where the bartender lays open account ledgers across the desk for a younger woman.", search_queries = ["office desk ledgers two women", "back office accounts books desk"] } },
  { type = "paragraph", content = "Lorna watches you come off the floor with the night's take and decides you're ready for the part that matters. She takes you behind the desk, to the office Eleanor kept by hand, and lays the ledgers open like a hand of cards." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "You've been earning the small money, honey. That's fine. But the real lever isn't what you make — it's what you control. Richard signs and forgets. Grayson spends what he hasn't got. You take the books — the accounts, the allowances, who gets paid and when — and this whole family is suddenly asking you for things." },
  { type = "cascade", props = { beats = [
    { advance_text = "Take them.", blocks = [
        { type = "paragraph", content = "You sign where she points and close the accounts she tells you to close. It takes an afternoon and a calm voice on the phone and the willingness to let a few people find out the hard way. By dusk the hotel's money runs through you — and so, you realize, does everyone who needs it." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "Grayson's allowance was the first thing I cut. He doesn't know yet. He will." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "location"
text = "Sit at the desk."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "loc_hotel_back_office"
time_progression_minutes = 90
flagEffects = [
  { targetType = "player", flag = "hotel_money_control", op = "set" },
]
effects = [
  { targetType = "npc", npcId = "npc_lorna", trait = "relation", op = "add", value = 10 },
]

# ── Quest card — take the books (capstone-mode, Lorna section) ───────────────────
[[quest_cards]]
text         = "Lorna keeps saying it: room rates won't save this place, but the books might. Whoever holds the hotel's money holds the family."
ready_text   = "Lorna will show you how to take the books in hand."
tip          = "Find Lorna at the hotel bar, afternoon to late. Be far enough in to do what it takes."
npc_id       = "npc_lorna"
ready_canvas = "canvas_take_books"
when = [
  { flag = "lorna_met",           op = "is_true"  },
  { flag = "hotel_money_control", op = "is_false" },
]
goals = [
  { trait = "corruption", subject = "player", op = "gte", value = 25, label = "Corruption" },
]

# ─── Quest card — the back-rooms reno (capstone-mode; appears once you hold the books) ──
# beat_0008. Points at canvas_upgrade_back_rooms. Names BOTH locks plainly — the cash for the
# refit AND being far enough in to work them — so saving toward it is informed, never a trap.
# Active from hotel_money_control until upgrade_back_rooms is set.
[[quest_cards]]
text         = "The hotel's money runs through you now. The real profit isn't in the rooms that go through the books — it's in the ones that don't. A discreet refit of the back rooms turns a quiet corner of the place into the kind of money the floor takes all night to make."
ready_text   = "You've got the cash and the nerve. Go to the back office and sign off on the refit."
tip          = "Save $1,500 for the refit — and be far enough in to actually work them (corruption ≥ 50). Sign off in the hotel back office."
ready_canvas = "canvas_upgrade_back_rooms"
when = [
  { flag = "hotel_money_control", op = "is_true"  },
  { flag = "upgrade_back_rooms",  op = "is_false" },
]
goals = [
  { trait = "money",      subject = "player", op = "gte", value = 1500, label = "Money" },
  { trait = "corruption", subject = "player", op = "gte", value = 50,   label = "Corruption" },
]

# ═════════════════════════════════════════════════════════════════════════════
# beat_0010 — AUDREY ENTRY (the first family conquest; opens the densest arc)
# ═════════════════════════════════════════════════════════════════════════════
# Three non-lewd one-shots + a quest in HER ROOM (placed there, not the building root — Audrey is
# scheduled only in loc_audrey_room / loc_college, so a requires_npc canvas at the lobby/residence
# root would be dead presence). All require_npc=npc_audrey (her home windows: weekday eves, weekends).
#   • aud_tuition_ask — UNGATED entry (D1). You find her crying over a withdrawal notice. You're
#     broke ($50), so you PROMISE to handle it — no money, no line crossed, no relief yet. Sets
#     audrey_tuition_promised, relation +5. (The discovery; the payoff is EARNED later.)
#   • quest "Audrey's tuition" (mechanic-mode, goal money gte 500) + aud_tuition_pay — the
#     visible-locked $500 pay button @ loc_audrey_room. Earn it on the floor, bring it to her room;
#     paying deducts $500 + sets audrey_tuition_paid + relation +15 (the gratitude payoff). The
#     grind doubles as the player-corruption on-ramp for the lesson doors (corr 25/25/50).
#   • aud_teachme — gated audrey_tuition_paid. She asks how to make Danny want her; you offer to
#     teach. The redirect begins — still no line crossed (that's beat_0011's first lesson). Sets
#     audrey_lessons_begin, relation +10.
# npc_audrey.corruption (readiness) stays 0 — built by PRACTICE, not trust. Danny is named, not
# present (he appears at aud_danny_bf, mid-ladder).

# ── aud_tuition_ask — "You'll handle it" (ungated entry; the PROMISE, not the payment) ─
[[canvases]]
id          = "aud_tuition_ask"
name        = "You'll handle it"
description = "beat_0010. Audrey entry (C, ungated). loc_audrey_room, requires npc_audrey, audrey_tuition_promised is_false. Find her in tears over a withdrawal notice; you're broke ($50) so you PROMISE to handle it — no money, no line crossed, no relief yet. Sets audrey_tuition_promised, relation +5. The payment/relief is EARNED later (quest + aud_tuition_pay)."

[canvases.trigger]
location      = "loc_audrey_room"
requires_npc  = "npc_audrey"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "audrey_tuition_promised", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "ask"
name = "You'll handle it"
blocks = [
  { type = "image", props = { file = "scenes/aud_tuition_ask.jpg", description = "A young woman sits cross-legged on her childhood bed crying over a crumpled letter, an older woman in the doorway.", search_queries = ["bedroom woman crying bed letter", "girl upset bed holding paper"] } },
  { type = "paragraph", content = "You find Audrey cross-legged on her childhood bed with a letter she's already crumpled and smoothed flat too many times. A final notice from the bursar — the fees, the date, the word withdrawn. She's been crying the quiet way, the way that doesn't want to be heard down the hall, and when she sees you in the doorway her face does the thing it's always done with you: it lets go, because you're here, and you've always been the one who makes the bad thing stop." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_audrey" }, content = "They're going to throw me out, @player. Mom always handled it and now there's no one and I didn't know who else — I'm sorry, I shouldn't have, you just got home —" },
  { type = "cascade", props = { beats = [
    { advance_text = "Take the letter.", blocks = [
        { type = "paragraph", content = "You take the letter out of her hands and read the number, and the number is a wall. You came home with fifty dollars, three bags, and a will the rest of them are still fighting you over — you couldn't clear this today if you sold the bags. So you don't lie and tell her it's nothing. You tell her the one thing that costs you nothing tonight and buys you everything: that you'll handle it. You'll find the money. She is not getting thrown out of anywhere while you're in this house. And you watch her decide, the way she's decided about you her whole life, that a promise from you is already as good as the cash in hand." },
        { type = "thought_bubble", props = { speaker = "npc_audrey" }, content = "She said she'd handle it, so it's handled. It was always going to be okay the second she came home — she fixes things. That's just what she does." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "I don't have it. But she'll spend every day until I do learning that I'm the one who keeps her safe — and a girl who owes you her whole year is worth a great deal more than a paid bill." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "location"
text = "Promise her you'll handle it."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_audrey_room"
time_progression_minutes = 30
flagEffects = [
  { targetType = "player", flag = "audrey_tuition_promised", op = "set" },
]
effects = [
  { targetType = "npc", npcId = "npc_audrey", trait = "relation", op = "add", value = 5 },
]

# ── aud_tuition_pay — the $500 you promised (visible-locked pay button + the payoff) ──
# beat_0010. The promise comes due. Repeatable @ loc_audrey_room (the locked button is the recurring
# carrot while you earn) — gate audrey_tuition_promised is_true + audrey_tuition_paid is_false. The
# "Pay her tuition — $500" choice is condition-gated (money gte 500) + show_when_locked, so it shows
# GREYED with its reason until you can afford it; costs deducts the $500 on click; the paid node
# carries the relief/gratitude prose (moved from the old instant-fix) + sets audrey_tuition_paid
# (which opens aud_teachme). is_repeatable=true so the button persists across visits while you earn.
[[canvases]]
id          = "aud_tuition_pay"
name        = "What you promised"
description = "beat_0010. Audrey (repeatable until paid). loc_audrey_room, requires npc_audrey, gate audrey_tuition_promised is_true + audrey_tuition_paid is_false. Visible-locked $500 pay button (conditions money gte 500 + show_when_locked + costs money 500). Paying routes to paid node -> sets audrey_tuition_paid + relation +15. Opens aud_teachme."

[canvases.trigger]
location      = "loc_audrey_room"
requires_npc  = "npc_audrey"
is_repeatable = true
priority      = 8
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "audrey_tuition_promised", operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "audrey_tuition_paid",      operator = "is_false" },
] }

[[canvases.nodes]]
id   = "ask_again"
name = "What you promised"
blocks = [
  { type = "image", props = { file = "scenes/aud_tuition_wait.jpg", description = "A young woman sits on her childhood bed with the withdrawal notice still pinned over her desk, looking up hopefully at an older woman in the doorway.", search_queries = ["bedroom woman bed hopeful", "girl bedroom looking up doorway"] } },
  { type = "paragraph", content = "The withdrawal notice is still pinned over her desk, the date closer every time you pass. She doesn't ask again — she just watches you come in and reads your face for the answer before you say a word." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text             = "Pay her tuition — $500"
show_when_locked = true
locked_text      = "Pay her tuition — $500  (you don't have it yet — earn it on the floor)"
conditions = { version = "1.0", items = [
  { type = "trait", subject = "player", trait_key = "money", operator = "gte", value = 500 },
] }
costs      = [{ trait = "money", value = 500 }]
targetType = "node"
nodeId     = "aud_tuition_pay.paid"
time_progression_minutes = 30

[[canvases.nodes.exit_block.choices]]
text       = "Not yet — tell her you're working on it."
targetType = "location"
locationId = "loc_audrey_room"
time_progression_minutes = 5

# ── paid node — the relief (the gratitude payoff, moved here from the old instant-fix) ──
[[canvases.nodes]]
id   = "paid"
name = "Handled"
blocks = [
  { type = "image", props = { file = "scenes/aud_tuition_paid.jpg", description = "A young woman goes loose with relief in the doorway of her room, half-collapsing toward the older woman who just told her it's done.", search_queries = ["woman relief embrace doorway", "girl relieved happy hug"] } },
  { type = "paragraph", content = "You tell her it's done — bursar paid, her name back on the rolls. You leave out what the floor cost you, or how you earned it, or whose hands. The fear goes out of her and she's across the room and into you before she's decided to move." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_audrey" }, content = "You actually — you really did it. I didn't doubt you, I swear I didn't, I just — thank you, @player. I don't know what I'd have done. I don't know what I'd do without you." },
  { type = "cascade", props = { beats = [
    { advance_text = "Let her hold on.", blocks = [
        { type = "paragraph", content = "You let her hold on, one hand at the back of her head. By the time she lets go she's not just grateful — she's yours, and she knows it all the way down." },
        { type = "thought_bubble", props = { speaker = "npc_audrey" }, content = "She kept her word. Of course she did. Whatever she ever asks me for, the answer is already yes — I owe her everything now, and I want to." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "Five hundred dollars and a hard week earning it, and I own her gratitude outright. The cheapest leash I'll ever buy. Now we begin the rest." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "location"
text = "Tell her it's nothing — she'd do the same for you."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_audrey_room"
time_progression_minutes = 30
flagEffects = [
  { targetType = "player", flag = "audrey_tuition_paid", op = "set" },
]
effects = [
  { targetType = "npc", npcId = "npc_audrey", trait = "relation", op = "add", value = 15 },
