# Phase 0/7 — 0_systems_spec.toml
# The Inheritance — system spec: project + time + settings + portrait + daily tick + sidebar.
# Scaffold (Step-7 entry, beat_0001). Block SHAPES mirror games/late_shifts/toml_phases/0_systems_spec.toml;
# the CONTENT is this game's (design_book.md, rev 20). Rent is OFF by design (no fail-state).

schema_version = "1.0"

[project]
id          = "the_inheritance"
title       = "The Inheritance"
description = "You left years ago, written off. Your mother's death drags you home to the failing family hotel for the reading of the will — where your aunt already stands behind the front desk giving your mother's staff their orders. Take the hotel in hand, and take every person under its roof, until the family that underestimated you answers to you."
quests_engine   = "v2"
starting_canvas = "canvas_opening_lobby"   # the real cold open (beat_0003)

[time]
starting_hour = 9         # the will reading is this morning; you arrive in the lobby
starting_day  = "Monday"
starting_week = 1

# ─── Register — SECOND person (register.person, immutable) ─────────────────────
# Every paragraph / thought_bubble is "you"; dialog blocks exempt. The engine labels
# the player's own dialog "You:" to match (narration_person). See rts-flat-prose.md Rule 1.
[settings]
narration_person  = "second"
clothing_enabled  = true
wardrobe_location = "loc_player_room"     # Your Old Room — the wardrobe rack
shop_location     = "loc_clothing_shop"   # The Boutique

[settings.clothing_requirements]
body_coverage   = true
always_required = []

# NOTE — [phone] is ON by design (household chat, photo-sale, leverage-on-a-screen) but its
# CONTENT is a later beat (the cross-cutting phone/sidebar beat). The [phone] table + threads
# are authored there, not in the scaffold (an empty phone table risks a broken build).

# ─── State-reactive player portrait (undress × outfit × corruption LEVEL × pregnancy) ─
[player_portrait]
enabled          = true
default_image    = "portraits/pc_dressed.jpg"       # her, dressed, the asset-self face
naked_image      = "portraits/pc_naked.jpg"
topless_image    = "portraits/pc_topless.jpg"
bottomless_image = "portraits/pc_bottomless.jpg"
underwear_image  = "portraits/pc_underwear.jpg"
pregnancy_suffix = "Preg"                            # pc_dressed.jpg -> pc_dressedPreg.jpg (dressed images only)
pregnancy_trait  = "pregnant"                        # WHICH trait gates the suffix (>0 -> Preg). Without this the suffix never fires (v2.py:1528 gates on cfg.pregnancy_trait). Set by ric_cap_child (=1) / gray_cap_child (=2).

# Outfit rule (pre-ship fix-pass) — the "bold" look, the reactive dial turned up. Fires
# when a worn item carries type="bold" (the three bold dresses in 1_metadata). The undress
# overrides above still win when undressed; this shows the bold-dressed face otherwise.
[[player_portrait.outfits]]
image = "portraits/pc_bold.jpg"
when  = { worn_type = "bold" }

# ─── Engine daily tick — resets daily-cap flags + one-way arousal drift ────────
# Body-state: energy decays passively (restored by sleep). Arousal drifts up (RTS-faithful,
# no decay; resets to 0 at climax, author-emitted). Family-NPC arousal drifts up (cap low).
# NEVER decay corruption / relation / any *_stage. Daily-cap flag unsets are extended as
# beats introduce them (unset of an unset flag is harmless).
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "photos_sold_today",  op = "unset" },
  { targetType = "player", flag = "bathed_today",       op = "unset" },
  { targetType = "player", flag = "ate_today",          op = "unset" },
  { targetType = "player", flag = "preened_today",      op = "unset" },
  { targetType = "player", flag = "favor_done_today",   op = "unset" },
  { targetType = "player", flag = "escort_done_today",  op = "unset" },  # p_floor_escort daily cap
  { targetType = "player", flag = "private_done_today", op = "unset" },  # p_floor_private daily cap
]
traitEffects = [
  { targetType = "player", trait = "energy",  op = "add", value = -5 },
  { targetType = "player", trait = "arousal", op = "add", value = 1, cap = 10 },
  { targetType = "npc", npcId = "npc_audrey",  trait = "arousal", op = "add", value = 1, cap = 3 },
  { targetType = "npc", npcId = "npc_grayson", trait = "arousal", op = "add", value = 1, cap = 3 },
  { targetType = "npc", npcId = "npc_richard", trait = "arousal", op = "add", value = 1, cap = 3 },
  # Item 6 — the house earns while you sleep, scaled by hotel_level. eq 2 / gte 3 are mutually
  # exclusive on purpose: daily_tick items don't short-circuit (a failed gate just `continue`s),
  # so gating +100 on gte 2 would double-pay a level-3 house. Ticks only on a midnight-crossing
  # sleep (rides the same nightly cycle as the arousal/energy drift above).
  { targetType = "player", trait = "money", op = "add", value = 100, conditions = { version = "1.0", items = [ { type = "trait", subject = "player", trait_key = "hotel_level", operator = "eq",  value = 2 } ] } },
  { targetType = "player", trait = "money", op = "add", value = 300, conditions = { version = "1.0", items = [ { type = "trait", subject = "player", trait_key = "hotel_level", operator = "gte", value = 3 } ] } },
]

# ─── Sidebar items — the live HUD ─────────────────────────────────────────────
# Corruption (the door, banded) + exhibitionism (the ratchet) + arousal (throttle) + energy
# + money. Player portrait auto-surfaces (top). NPC state lives on the Quests page, NOT the
# sidebar. HIDDEN meters (margaret leverage, every *_stage, pregnant) suppressed below.

[[sidebar_items]]
type  = "trait_words"
trait = "corruption"
label = "Corruption"
bands = [
  { min = 0,  max = 24,  text = "Pure",   icon = "✨" },
  { min = 25, max = 49,  text = "Lewd",   icon = "💋" },
  { min = 50, max = 74,  text = "Slutty", icon = "🔥" },
  { min = 75, max = 100, text = "Whore",  icon = "💦" },
]

[[sidebar_items]]
type  = "trait_bar"
trait = "exhibitionism"
label = "Exhibitionism"
max   = 100
bands = [
  { min = 0,  max = 24,  text = "Covered"   },
  { min = 25, max = 49,  text = "Daring"    },
  { min = 50, max = 74,  text = "Bold"      },
  { min = 75, max = 100, text = "Shameless" },
]

[[sidebar_items]]
type  = "trait_bar"
trait = "arousal"
label = "Arousal"
max   = 10
bands = [
  { min = 0, max = 2,  text = "Cold"    },
  { min = 3, max = 5,  text = "Warm"    },
  { min = 6, max = 8,  text = "Hot"     },
  { min = 9, max = 10, text = "Burning" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "energy"
bands = [
  { min = 0,  max = 24,  text = "Exhausted", icon = "🪫" },
  { min = 25, max = 49,  text = "Tired",     icon = "💤" },
  { min = 50, max = 74,  text = "Fine",      icon = "🟢" },
  { min = 75, max = 100, text = "Rested",    icon = "🔋" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "money"
bands = [
  { min = 0,    max = 99,   text = "Nothing",     icon = "💸" },
  { min = 100,  max = 499,  text = "Scraping",    icon = "😬" },
  { min = 500,  max = 1999, text = "Getting by",  icon = "💵" },
  { min = 2000, max = 99999, text = "Money",      icon = "✅" },
]

# ─── NPC panels (beat_0028) — each NPC's row: relationship + where they are + the
# named NEXT step (pulled from the quest card, parity-matched). Margaret is
# WAR-framed: no relationship meter (she's destroyed, not seduced) -- only where
# she is + the war-state next. HIDDEN meters (margaret leverage, every *_stage,
# pregnant) never surface -- suppressed by [[traits.labels]] hidden=true below.
[[sidebar_items]]
type   = "npc_panel"
npc_id = "npc_audrey"
label  = "Audrey"
rows   = ["location", "next"]

[[sidebar_items]]
type   = "npc_panel"
npc_id = "npc_grayson"
label  = "Grayson"
rows   = ["location", "next"]

[[sidebar_items]]
type   = "npc_panel"
npc_id = "npc_richard"
label  = "Richard"
rows   = ["location", "next"]

[[sidebar_items]]
type   = "npc_panel"
npc_id = "npc_margaret"
label  = "Margaret"
rows   = ["location", "next"]

[[sidebar_items]]
type   = "npc_panel"
npc_id = "npc_lorna"
label  = "Lorna"
rows   = ["location", "next"]

# ─── Hidden traits — internal odometers/counters the player must NEVER see ─────
# margaret's leverage (the war — finding out is the scene), every *_stage cross-wire trait,
# and the pregnancy flag. hidden=true suppresses from ALL player-facing dumps (dev + non-dev).
[[traits.labels]]
key = "leverage"
hidden = true

[[traits.labels]]
key = "audrey_stage"
hidden = true

[[traits.labels]]
key = "grayson_stage"
hidden = true

[[traits.labels]]
key = "richard_stage"
hidden = true

[[traits.labels]]
key = "pregnant"
hidden = true

# Item 6 — the house dial (the display/economy mirror of the hotel_in_hand / private_floor_open /
# margaret_broken spine). Never shown: the hubs + income read it, the player reads the house.
[[traits.labels]]
key = "hotel_level"
hidden = true
