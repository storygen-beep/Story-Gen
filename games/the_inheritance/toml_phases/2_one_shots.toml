# Phase 2/7 — 2_one_shots.toml
# The Inheritance — the boot Start canvas + the spine quest card (scaffold).
# canvas_boot is a STRUCTURAL placeholder: it drops the player into the lobby so the
# game opens green. beat_0003 (the opening funnel) authors the real cold open (Margaret
# behind the desk) and repoints [project].starting_canvas to it.

# ─── The opening cold open (beat_0003) — the game's first frame ────────────────
# starting_canvas points HERE (repointed from canvas_boot in phase 0). Fires once on
# game start at the lobby: Margaret behind your mother's desk, the whole game in one
# frame. Names who you are / who she is / the tie / the hook on the page (cold-start
# rule). Margaret + Lorna each get a voiced line (Rule 4). Second person, RTS-flat.
# Sets opening_done + margaret_opened_up, releases into the lobby with the want named.
[[canvases]]
id          = "canvas_opening_lobby"
name        = "The reading's this morning"
description = "The cold open. Lobby, day 1. Margaret behind the front desk giving your mother's staff their orders — the frame. Sets opening_done + margaret_opened_up. Releases into loc_hotel. Will reading itself = beat_0004."

[canvases.trigger]
location      = "loc_hotel"
is_repeatable = false
priority      = 12
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "opening"
name = "The reading's this morning"
blocks = [
  { type = "image", props = { file = "scenes/opening_lobby.jpg", description = "a faded boutique hotel lobby, a poised older woman behind the front desk directing staff", search_queries = ["elegant older woman behind hotel reception desk", "faded grand hotel lobby front desk"] } },
  { type = "paragraph", content = "Your bags are still in your hand when you see her: Margaret, behind your mother's front desk, telling the staff where the good linen goes. Your aunt. She looks up first." },
  { type = "cascade", props = { beats = [
    { advance_text = "Meet her eye.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_margaret" }, content = "Catherine. We weren't sure you'd come." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_margaret" }, content = "Sit in for the reading, if you like. It won't take long — your mother was very clear." },
    ] },
    { advance_text = "Answer that.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "Clear about what she owed everyone but me." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_margaret" }, content = "Mm. Still that. Sit or don't, dear — it changes nothing." },
    ] },
    { advance_text = "Let it go, for now.", blocks = [
        { type = "paragraph", content = "Your mother wrote you out of this place while she was alive, then died before you could make her take it back. You didn't come to grieve. You came for what's yours." },
    ] },
    { advance_text = "Across the lobby.", blocks = [
        { type = "paragraph", content = "Behind the bar, a woman you half-remember catches your eye. Lorna. She doesn't smile, exactly — but she's glad you're standing there." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_lorna" }, content = "Look who's back. Come see me when you've got a minute — I'll tell you how bad it really is." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "choices"

# Flag set on the CHOICE's flagEffects (the shape the flag-chain validator scans —
# a location-type exit_block.effects.flagEffects is NOT seen by the validator).
[[canvases.nodes.exit_block.choices]]
text       = "Set your bags down."
targetType = "location"
locationId = "loc_hotel"
flagEffects = [
  { targetType = "player", flag = "opening_done", op = "set" },
  { targetType = "player", flag = "margaret_opened_up", op = "set" },
]

# ─── The spine quest card — Story Goals (no npc_id → top of the Quests page) ───
# Mechanic mode (no ready_canvas): the first want, with the next concrete action named
# (place + what). Retires when the hotel is taken in hand (hotel_in_hand).
[[quest_cards]]
text       = "The house is being taken, and not by you. Margaret's behind your mother's desk giving the staff their orders. Get your hands on this place before she owns all of it."
ready_text = "Start where the money is."
tip        = "Take a shift on the floor — the Lobby and the Bar, and talk to Lorna at the bar. First money, first foothold."
priority   = 100
when = [
  { flag = "hotel_in_hand", op = "is_false" },
]

# ─── The will reading (beat_0004) — the wound made concrete ────────────────────
# Auto-fires when you go up to the Drawing Room on day 1 (Margaret invited you to sit
# in). Halloway (prop) reads; the family present; you get a ring + the right to your old
# room (a token insult that is ALSO your legitimate foothold in the house). The drive
# lands. Dialogue-carried. Sets reading_done. Grayson/Richard get name-on-page here;
# their personal hubs open in their own arc beats (this is the group tableau, not an intro).
[[canvases]]
id          = "canvas_will_reading"
name        = "The reading"
description = "One-shot, Drawing Room, day 1. Halloway reads the will; Margaret in your mother's chair; Grayson smirks; Richard hollow at the window. You get a ring + the right to your old room. Sets reading_done."

[canvases.trigger]
location      = "loc_drawing_room"
is_repeatable = false
priority      = 11
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "opening_done",  operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "reading_done",  operator = "is_false" },
] }

[[canvases.nodes]]
id   = "reading"
name = "The reading"
blocks = [
  { type = "image", props = { file = "scenes/will_reading.jpg", description = "a faded drawing room, a family seated for a will reading, a solicitor with a folder, one woman in the good chair", search_queries = ["family gathered for will reading solicitor", "tense family meeting drawing room lawyer folder"] } },
  { type = "paragraph", content = "Your mother's chair, and Margaret in it. Grayson's folded into the couch with his phone. Richard stands at the window like he wandered in by accident. Halloway sets a folder on his knees and waits for you to sit." },
  { type = "cascade", props = { beats = [
    { advance_text = "Sit.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_halloway" }, content = "We can begin. Eleanor's estate — the hotel, the residence, and the accounts — passes to her husband, Richard, to hold and to run." },
    ] },
    { advance_text = "Watch Margaret.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_halloway" }, content = "Provision is made for Audrey and Grayson. Margaret is named to advise in the management." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_margaret" }, content = "Someone has to." },
    ] },
    { advance_text = "And you.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_halloway" }, content = "And to Eleanor's eldest daughter, Catherine — her mother's ring, and the right to her old room for as long as she wants it." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_grayson" }, content = "A ring. Generous, actually." },
    ] },
    { advance_text = "Take the ring.", blocks = [
        { type = "paragraph", content = "You came home knowing they'd written you off. Now you know the exact size of it — a ring, and a bed they can't quite deny you. Fine. You'll take the rest yourself." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Let them file out."
targetType = "location"
locationId = "loc_drawing_room"
flagEffects = [
  { targetType = "player", flag = "reading_done", op = "set" },
]

# ══════════════════════════════════════════════════════════════════════════════
# beat_0027 — the QUESTS PAGE. Story-Goals spine (Act-1 card above retires at
# hotel_in_hand; Act-2 + frontier here) + per-NPC ladders (when-gated milestone
# chains; Audrey stepped-band via goals; Margaret WAR-framed, no seduction bar).
# Every card non-stale (a ready_text even in the terminal state). Cards are terse
# RTS-flat directives (UI text, not narrative canvases).
# ══════════════════════════════════════════════════════════════════════════════

# ── Story-Goals spine: Act-2 (fires on hotel_in_hand; the deferred card) ───────
[[quest_cards]]
text       = "The house answers to you now. But Margaret's still in your mother's chair, Grayson still sneers, and Richard still holds the deed. Take them, one by one, until every soul under this roof answers to you."
ready_text = "Start with the one who needs you most."
tip        = "Audrey needs saving. Richard needs waking. Grayson needs breaking. Margaret needs all of it done first."
priority   = 100
when = [
  { flag = "hotel_in_hand",  op = "is_true"  },
  { flag = "margaret_broken", op = "is_false" },
]

# ── Story-Goals spine: the frontier card (the current peak + the greyed next-hook) ─
[[quest_cards]]
text       = "It's done. The house, the family, all of it — yours, down to the last of them. You've reached the top of this game."
ready_text = "Run your house. And know a rival across the city has already heard your name."
tip        = "The frontier: a livable steady-state. The next hook is waiting."
priority   = 90
when = [
  { flag = "margaret_broken", op = "is_true" },
]

# ── AUDREY — stepped climb (the lessons) ──────────────────────────────────────
[[quest_cards]]
text       = "Your baby sister, broke and terrified of losing her place at college. She looks at you like you hung the moon. That's the ramp."
ready_text = "Pay her tuition. Earn the trust. Then let her ask to be taught."
tip        = "Her room, evenings. The tuition first — $800."
npc_id     = "npc_audrey"
priority   = 50
when = [
  { flag = "aud_opened_up",   op = "is_true"  },
  { flag = "aud_lessons_open", op = "is_false" },
]

[[quest_cards]]
text       = "She asked to be taught — for Danny, she thinks. The lessons ARE the corruption, and she never once sees it. The horror is yours alone."
ready_text = "Take her up the ladder — kiss, toy, going down — and coax the words out of her."
tip        = "Her room, evenings. Each lesson she practices on you."
npc_id     = "npc_audrey"
priority   = 50
when = [
  { flag = "aud_lessons_open", op = "is_true" },
  { trait = "audrey_stage", subject = "player", op = "lt", value = 3 },
]
goals = [
  { trait = "corruption", subject = "npc", npc_id = "npc_audrey", op = "gte", value = 8, label = "Surrender" },
]

[[quest_cards]]
text       = "She's yours completely, and she thinks it's love, and she genuinely wins — she lands the boy. Now she brings him home to share."
ready_text = "Let her have Danny. Then open the gateway — the study group."
tip        = "Her room. She'll want you there. Danny visits the house now."
npc_id     = "npc_audrey"
priority   = 50
when = [
  { trait = "audrey_stage", subject = "player", op = "gte", value = 3 },
  { flag = "group_open", op = "is_false" },
]

[[quest_cards]]
text       = "She shares everyone, cheerfully, and never once minds. The gateway's open — the family threesomes wait only on the men being yours."
ready_text = "Break Richard and Grayson, then bring them to her bed."
tip        = "Her room, once the men are broken."
npc_id     = "npc_audrey"
priority   = 50
when = [
  { flag = "group_open", op = "is_true" },
]

# ── GRAYSON — milestone chain (prey → flipped → bought out) ────────────────────
[[quest_cards]]
text       = "Your half-brother thinks the estate is his and you're beneath him — beneath enough to put his hands on you while you're still nobody. Let him. Bank every liberty."
ready_text = "You can't touch him yet. Get the money, learn his debts, then name the price."
tip        = "Needs the hotel in hand + Lorna's tip on his gambling."
npc_id     = "npc_grayson"
priority   = 45
when = [
  { flag = "grayson_flipped", op = "is_false" },
]

[[quest_cards]]
text       = "He signed himself over rather than face the men he owes. Now he's yours to unmake, rung by rung — and he fights it the whole way down."
ready_text = "Put him to work. Menial, then degrading, then used."
tip        = "The drawing room. The servitude hub. The strap opens the deepest rung."
npc_id     = "npc_grayson"
priority   = 45
when = [
  { flag = "grayson_flipped",    op = "is_true"  },
  { flag = "grayson_bought_out", op = "is_false" },
]

[[quest_cards]]
text       = "Yours for nothing. The man who pawed at you when you were nobody holds your coat while you take the rest of the family, and says thank you."
ready_text = "Nothing left to take. He's furniture now — and he's grateful for it."
tip        = "He feeds the last lock on Margaret."
npc_id     = "npc_grayson"
priority   = 45
when = [
  { flag = "grayson_bought_out", op = "is_true" },
]

# ── RICHARD — milestone chain (warming → wanting → the keys) ───────────────────
[[quest_cards]]
text       = "Your mother's widower, hollowed by grief, holding the deed and forgetting why. Won with trust and lust, never money. He's where your own armor thins."
ready_text = "Sit with him. Get him eating. Let the comfort turn warm."
tip        = "The study. The companionship is ungated — start any time."
npc_id     = "npc_richard"
priority   = 44
when = [
  { trait = "richard_stage", subject = "player", op = "lt", value = 2 },
  { flag = "richard_signed", op = "is_false" },
]

[[quest_cards]]
text       = "He's alive again, and he wants you, and he throws himself at the hotel to deserve you. He'd rather support you than lead. The keys are close."
ready_text = "Take him the whole way. He'll sign the deed over gladly."
tip        = "The study. Needs the hotel already in your hand."
npc_id     = "npc_richard"
priority   = 44
when = [
  { trait = "richard_stage", subject = "player", op = "gte", value = 2 },
  { flag = "richard_signed", op = "is_false" },
]

[[quest_cards]]
text       = "He signed the kingdom over and asked only to stay at your side. Yours, and glad of it. You never lied to him — you just let him be right about everything except you."
ready_text = "At your side. Seal it with a child, if you want the supplanting."
tip        = "The study, Whore-era. Your choice, never a punishment."
npc_id     = "npc_richard"
priority   = 44
when = [
  { flag = "richard_signed", op = "is_true" },
]

# ── MARGARET — WAR-framed (watching → cornered → broken), NO seduction bar ─────
[[quest_cards]]
text       = "Your aunt. The one you don't seduce — you destroy her. She's winning right now, and she knows it, and she watches everything you do and files it. You feel her, and you never see the count."
ready_text = "You can't move on her yet. Take the men her power runs through. She falls only when they do."
tip        = "Untouchable until Richard signs AND Grayson's bought out."
npc_id     = "npc_margaret"
priority   = 43
when = [
  { flag = "margaret_cornered", op = "is_false" },
]

[[quest_cards]]
text       = "The board turned. Her advantage collapsed the moment both men became yours, and she worked it out before you told her. Cornered — defiant, with nothing left to scheme through."
ready_text = "Break her by force. Intoxicate her; the men she commanded take her."
tip        = "The drawing room. Needs the intoxicant + Whore-era."
npc_id     = "npc_margaret"
priority   = 43
when = [
  { flag = "margaret_cornered", op = "is_true"  },
  { flag = "margaret_broken",   op = "is_false" },
]

[[quest_cards]]
text       = "The queen who came to own everyone, owned by all of them. Working the vice-floor she schemed to run, in silence, eyes down when you pass."
ready_text = "It's finished. You won it whole."
tip        = "The total inversion. The game's peak."
npc_id     = "npc_margaret"
priority   = 43
when = [
  { flag = "margaret_broken", op = "is_true" },
]

# ── LORNA — the on-ramp (light) ───────────────────────────────────────────────
[[quest_cards]]
text       = "The bartender who's seen what this place was and what it could be after dark. She'll teach you the other way a room like this makes money."
ready_text = "Go and see her at the bar."
tip        = "The bar. She's been waiting years for you to walk back in."
npc_id     = "npc_lorna"
priority   = 40
when = [
  { flag = "lorna_opened_up", op = "is_false" },
]

[[quest_cards]]
text       = "Your one real ally, and the only person on your side. She hands you the ideas and the knife — the comped favours, the real books, your brother's debts. She's never bedded, never bought."
ready_text = "Keep her close. She's the on-ramp to everything."
tip        = "The bar, evenings. Her hub tiers up as the business grows."
npc_id     = "npc_lorna"
priority   = 40
when = [
  { flag = "lorna_opened_up", op = "is_true" },
]
