# ═══════════════════════════════════════════════════════════════════════════
# Quests Engine V2 — Smoke Test Game
# ═══════════════════════════════════════════════════════════════════════════
#
# Minimal fixture for PRD 48 Layer 2 verification. Four [[quest_cards]]
# covering each of the four frame variants the V2 renderer can produce:
#
#   1. Bullet card (🎯 To advance — corruption climbing toward target)
#   2. Ready card  (🔓 Ready + 📍 + 🕒 — all goals met, ready_canvas set)
#   3. Terminal card (✓ Arc complete — terminal=true)
#   4. Story Goal card (no npc_id, narrative only, no goal block)
#
# Build: cd story_gen_django && python manage.py package_from_toml \
#         --file games/quests_v2_smoke/game.toml \
#         --owner-id <uuid> --output /tmp/quests_v2_smoke
#
# Open the resulting HTML, navigate to the Quests page, confirm all four
# cards render with the expected frames.
# ═══════════════════════════════════════════════════════════════════════════

schema_version = "0.3"

[project]
id = "quests_v2_smoke"
title = "Quests V2 Smoke"
description = "Minimal smoke test for PRD 48 — all four Quests V2 frame variants."
quests_engine = "v2"
starting_canvas = "scene_smoke_intro"

[time]
enabled       = true
starting_hour = 8
starting_day  = "Monday"
starting_week = 1

[player]
id                = "player_p"
name              = "P"
starting_location = "loc_start"

[player.core_traits]
corruption = 18
trust      = 0

# ─── NPC (target of bullet + ready + terminal cards) ─────────────────────
[[npcs]]
id                = "npc_smoke"
name              = "Smoke NPC"
starting_location = "loc_start"

[npcs.core_traits]
trust    = 5
arousal  = 0

[npcs.trait_decay]

# ─── Locations ─────────────────────────────────────────────────────────
[[locations]]
id          = "loc_start"
name        = "Start Room"
description = "Where the player begins."

[[locations]]
id          = "loc_meet"
name        = "Meeting Room"
description = "Where the ready_canvas scene fires."

# ─── Starting canvas (required by build pipeline) ─────────────────────
[[canvases]]
id          = "scene_smoke_intro"
name        = "Smoke intro"
description = "Starting canvas — player lands here."

[[canvases.nodes]]
id   = "base"
name = "Smoke intro"
blocks = [
  { type = "paragraph", content = "Welcome to the Quests V2 smoke test. Open the Quests page to see the four frame variants." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Begin."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_start"
time_progression_minutes = 0

# ─── Canvas referenced by ready_canvas on the Ready card ──────────────
# Minimal scripted canvas — sets the closure flag when played.
[[canvases]]
id          = "scene_smoke_ready_target"
name        = "Smoke ready target"
description = "Target canvas for the Ready card's ready_canvas reference."

[canvases.trigger]
location      = "loc_meet"
is_repeatable = false
priority      = 10
is_active     = true
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4]
start_time = "20:00"
end_time   = "22:30"

[[canvases.nodes]]
id   = "base"
name = "Smoke ready scene"
blocks = [
  { type = "paragraph", content = "The smoke ready scene fires." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Continue."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_start"
time_progression_minutes = 10
flagEffects = [
  { targetType = "player", flag = "smoke_ready_done", op = "set" },
]

# ═══════════════════════════════════════════════════════════════════════
# Quest Cards — the four frame variants
# ═══════════════════════════════════════════════════════════════════════

# ─── Card 1: bullet variant (🎯 To advance + ◯ corruption progress) ──
# Fires when smoke_ready_done is still false. Has a trait goal that's
# unmet (player corruption is 18, target is 25). Should render bullets.
[[quest_cards]]
text         = "Something is climbing. I can feel it."
ready_text   = "Now."
tip          = "Watch the bullet — it should show 18 / 25 live."
npc_id       = "npc_smoke"
when = [
  { flag = "smoke_ready_done", op = "is_false" },
  { trait = "corruption", subject = "player", op = "lt", value = 25 },
]
goals = [
  { trait = "corruption", subject = "player", op = "gte", value = 25, label = "Maya corruption" },
]
ready_canvas = "scene_smoke_ready_target"

# ─── Card 2: ready variant (🔓 Ready + 📍 + 🕒) ──
# Fires once corruption ≥ 25 but flag still false. Goals are vacuously met
# (none defined), ready_canvas is set → engine renders Ready frame.
[[quest_cards]]
text         = "All gates clear. Climb done."
ready_text   = "The moment is here."
tip          = "Should render: 🔓 Ready + 📍 Meeting Room + 🕒 Mon–Fri 20:00–22:30"
npc_id       = "npc_smoke"
priority     = 2
when = [
  { flag = "smoke_ready_done", op = "is_false" },
  { trait = "corruption", subject = "player", op = "gte", value = 25 },
]
ready_canvas = "scene_smoke_ready_target"

# ─── Card 3: terminal variant (✓ Arc complete) ──
# Fires once the closure flag is set. Renders the terminal frame.
[[quest_cards]]
text     = "Done. The line is past."
npc_id   = "npc_smoke"
priority = 3
when = [
  { flag = "smoke_ready_done", op = "is_true" },
]
terminal = true

# ─── Card 4: Story Goal variant (no goal block) ──
# No npc_id → routes to Story Goals top section. No goals, no ready_canvas
# → renders narrative + tip only, no frame.
[[quest_cards]]
text  = "Rent is coming due."
tip   = "Find odd jobs."
group = "rent"
when = [
  { flag = "smoke_rent_paid", op = "is_false" },
]
