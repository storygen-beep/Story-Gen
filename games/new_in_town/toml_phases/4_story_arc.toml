[story_arc]
version = "1.0"

# ============================================================
# CHAPTERS (7)
# ============================================================

[[story_arc.chapters]]
id = "chapter_prologue"
name = "Millfield"
mood = "hopeful"
description = "Emma arrives with two suitcases and a Bible. Jolene takes one look at her and grins. The room is small, the walls are thin, and the whole town already knows her name."
order = 1

[[story_arc.chapters]]
id = "chapter_awakening"
name = "The Awakening"
mood = "tense"
description = "Jolene doesn't touch her — she exposes her. Thin walls, cracked doors, wine, dares. Twelve days of shame dissolving into curiosity into hunger. Emma stops looking away and starts looking."
order = 2

[[story_arc.chapters]]
id = "chapter_first_hunt"
name = "First Blood"
mood = "romantic"
description = "Tom is training wheels. Easy, devoted, pathetically grateful. She learns to lead, to direct, to say 'good boy' and watch a man melt. The power is intoxicating and she wants more."
order = 3

[[story_arc.chapters]]
id = "chapter_proving"
name = "Proving Ground"
mood = "passionate"
description = "Ray won't see her. Then he can't stop seeing her. Mark is hollow and she fills him with fire. Two arcs running parallel — confidence through seduction, manipulation through the forbidden."
order = 4

[[story_arc.chapters]]
id = "chapter_crisis"
name = "What Burns"
mood = "tense"
description = "Karen finds the text. The school buzzes. Reputation bleeds. Ray develops feelings she didn't plan for. The juggling act starts cracking and she has to decide what she's willing to lose."
order = 5

[[story_arc.chapters]]
id = "chapter_endgame"
name = "The Endgame"
mood = "passionate"
description = "Jake kneels. The cocky bartender says 'please.' She controls everything — the bar, the men, the town's perception. The girl with the Bible is gone. The woman in the mirror smiles, and the smile isn't kind."
order = 6

[[story_arc.chapters]]
id = "chapter_mirror"
name = "What She Became"
mood = "neutral"
description = "Four mirrors. Four versions of herself. The cardigan, the dress, the underwear, the eyes that calculate before they care. Whatever she is now, she chose it. Every step."
order = 7

