is_milestone = true
group = "mirror_progression"
journal_entry = "The dress. Makeup I didn't own two weeks ago. My hair is down. Something is different — not the clothes. The eyes. They're not looking for permission anymore. They're measuring. The Bible is on the nightstand. I haven't opened it in a week."

[[story_arc.nodes]]
id = "mirror_40"
name = "Mirror — Day 40"
chapter = "chapter_mirror"
linked_canvas = "mirror_day_40"
linked_flag = "mirror_day_40"
is_milestone = true
group = "mirror_progression"
journal_entry = "I stand in my underwear and I don't flinch. These legs made Ray forget I was 'the schoolteacher.' These lips said 'good boy' to Tom. This body is a weapon I didn't know I carried. I think about three men and feel nothing resembling guilt. The Bible is in the drawer. Face down."

[[story_arc.nodes]]
id = "mirror_60"
name = "Mirror — Day 60"
chapter = "chapter_mirror"
linked_canvas = "mirror_day_60"
linked_flag = "mirror_day_60"
is_milestone = true
group = "mirror_progression"
journal_entry = "I barely recognize myself. Not the clothes. Not the body. The eyes. The way my smile has changed from warm to something sharper. The girl who arrived with a cardigan and a Bible would be horrified. Would cry. Would pray. I look at that ghost and smile. The smile isn't kind. The Bible is gone. I threw it away three weeks ago. I don't remember which day."

# ============================================================
# NODES — Cross-NPC Events
# ============================================================

[[story_arc.nodes]]
id = "friday_collision"
name = "Friday Night Collision"
chapter = "chapter_crisis"
linked_canvas = "friday_collision"
linked_flag = "friday_collision"
is_milestone = false
journal_entry = "Four men. One room. Tom in the corner, off duty. Ray at his stool. Jake behind the counter. And Mark — without Karen — catching my eye across the room. I have to choose who to focus on while the others watch. Three months ago I didn't know how to talk to one man. Now I'm juggling four."

[[story_arc.nodes]]
id = "tom_saw_ray"
name = "Tom Sees Ray"
chapter = "chapter_crisis"
linked_canvas = "tom_saw_ray"
linked_flag = "tom_saw_ray"
is_milestone = true
npc = "npc_tom"
journal_entry = "Tom saw me touch Ray's arm. The body language. His face changed. He sat in a corner booth with a beer he didn't drink. Later: 'Are you and that handyman... is something happening?' I had to choose — lie, redirect, or be honest-ish. None of the options make me a good person. All of them work."

[[story_arc.nodes]]
id = "ray_sees_text"
name = "Ray Sees the Text"
chapter = "chapter_crisis"
linked_canvas = "ray_sees_mark_text"
linked_flag = "ray_sees_mark_text"
is_milestone = false
npc = "npc_ray"
journal_entry = "My phone buzzed. A text from Mark. Ray saw the screen. Five minutes of silence. 'Who's Mark?' 'Nobody.' 'Didn't look like nobody.' I touched his arm. Changed the subject. He let it go. But the seed is planted."

[[story_arc.nodes]]
id = "juggling"
name = "Juggling Detected"
chapter = "chapter_crisis"
linked_canvas = "juggling_detected"
linked_flag = "juggling_detected"
is_milestone = false
group = "crisis_experienced"
journal_entry = "Mrs. Hewitt at the general store: 'You've certainly made a lot of friends in town, haven't you, dear?' The tone said everything the words didn't. The schoolteacher has coffee with the deputy, drinks with the handyman, and the insurance agent's car has been near the bar after hours. The town is small. Patterns are noticed."

# ── Reputation Threshold Events ──

[[story_arc.nodes]]
id = "principal_check_in"
name = "Just Checking In"
chapter = "chapter_crisis"
linked_canvas = "principal_concern_1"
linked_flag = "principal_concern_triggered_60"
is_milestone = false
journal_entry = "Principal Davis stopped by after class. Coffee mug in hand, casual smile that wasn't casual at all. 'Small town, you know. People talk.' His eyes cataloged everything — the dark circles, the missed PTA meeting, the whispers from Mrs. Hewitt. He said he just wanted to check in. But check-ins don't usually feel like warnings."

[[story_arc.nodes]]
id = "principal_monitoring"
name = "Active Monitoring"
chapter = "chapter_crisis"
linked_canvas = "principal_concern_2"
linked_flag = "principal_concern_triggered_45"
is_milestone = false
journal_entry = "This time Principal Davis closed the door. No coffee. No casual lean. 'I need to be direct with you.' Parents have raised concerns. The bar visits. The social life. 'Perception IS reality,' he said. He'll be dropping by unannounced now. The walls are closing in."

[[story_arc.nodes]]
id = "principal_warning"
name = "Formal Warning"
chapter = "chapter_crisis"
linked_canvas = "principal_formal_warning"
linked_flag = "principal_warning_triggered_30"
is_milestone = true
journal_entry = "Mrs. Henderson from the school board was waiting in my classroom. Two chairs pulled up front. 'Multiple complaints about conduct unbecoming of an elementary school teacher.' One more and they review my contract. After they left I sat at my desk staring at the alphabet border on the wall. A, B, C. The kids' drawings taped to the windows. I came here to be a good teacher. When did I stop?"

