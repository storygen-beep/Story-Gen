linked_flag = "jake_second_attempt"
is_milestone = true
npc = "npc_jake"
journal_entry = "He tried the lazy smile. The lean. 'So, you finally loosened up.' I laughed. AT him. Nobody laughs at Jake. He stood behind the bar holding a glass he forgot to dry. For the first time in his adult life, he processed rejection that doesn't sting — it confuses."

[[story_arc.nodes]]
id = "jake_jealousy"
name = "The Jealousy Game"
chapter = "chapter_endgame"
linked_canvas = "jake_jealousy_game"
linked_flag = "jake_jealousy_game"
is_milestone = false
npc = "npc_jake"
journal_entry = "I flirted with other men while he watched. Touched their arms. Whispered close. Glanced at Jake to make sure he saw. The message: you're not the prize. I am. His jaw tightened. His pours got sloppy. Jolene noticed. He lied about it."

[[story_arc.nodes]]
id = "jake_bar"
name = "Pour Me One More"
chapter = "chapter_endgame"
linked_canvas = "jake_bar_sitting"
linked_flag = "jake_bar_sitting"
is_milestone = true
npc = "npc_jake"
journal_entry = "I sat on the bar. Legs crossed. 'Pour me one more.' He poured. I drank slowly. 'You want me so badly it's almost sweet.' He reached for me. I put one finger on his lips. 'Not yet.' Walked upstairs. I could hear him say to nobody: 'What the fuck.'"

[[story_arc.nodes]]
id = "jake_ego"
name = "The Ego Crisis"
chapter = "chapter_endgame"
linked_canvas = "jake_ego_crisis"
linked_flag = "jake_ego_crisis"
is_milestone = false
npc = "npc_jake"
group = "bridge_witnessed"
journal_entry = "'What the fuck do you want from me?' Not a line. Genuine confusion. His ego — the thing he built his entire identity on — is cracking. He's spent his life being the one who pursues. I've inverted everything. He punched the jukebox and went out the back door."

[[story_arc.nodes]]
id = "jake_kiss"
name = "Not Yet"
chapter = "chapter_endgame"
linked_canvas = "jake_not_yet"
linked_flag = "jake_kiss_unlocked"
is_milestone = true
npc = "npc_jake"
group = "multi_arc_active"
journal_entry = "'One kiss. Please.' That word — please — is something Jake has never said to a woman in his life. I stepped forward. One kiss. Brief. My terms. My hand controlling the angle. I pulled away first. 'Good.' He stood there touching his lips like they were someone else's."

[[story_arc.nodes]]
id = "jake_permission"
name = "Permission"
chapter = "chapter_endgame"
linked_canvas = "jake_permission"
linked_flag = "jake_groping_unlocked"
is_milestone = true
npc = "npc_jake"
journal_entry = "'You can touch me. But only where I say.' He reached for my waist. I moved his hands to my hips. He moved them up. I stopped. 'Did I say you could move them?' Something shifted in his eyes. Recognition. He likes being told what to do. The cocky bartender likes surrendering."

[[story_arc.nodes]]
id = "jake_stockroom"
name = "The Stockroom"
chapter = "chapter_endgame"
linked_canvas = "jake_stockroom"
linked_flag = "jake_oral_unlocked"
is_milestone = true
npc = "npc_jake"
journal_entry = "I put him on his knees in the stockroom. Twenty feet from Jolene. Behind a door that doesn't lock. Three months ago I cried after missionary sex with the lights off. Now I'm standing against beer cases with my hand in a man's hair while he worships me. The girl with the Bible would be horrified."

[[story_arc.nodes]]
id = "jake_on_her_terms"
name = "On Her Terms"
chapter = "chapter_endgame"
linked_canvas = "jake_on_her_terms"
linked_flag = "jake_sex_unlocked"
is_milestone = true
npc = "npc_jake"
group = "deep_intimacy"
journal_entry = "My room. My terms. I told him when to arrive, what to wear, where to stand. He complied. I pinned his hands. 'Did I say you could touch?' He arched into it. He discovered — and I saw the moment — that the ego was armor, not identity. 'Please.' The most powerful word in the game from someone who's never said it."

[[story_arc.nodes]]
id = "jake_endgame"
name = "The Surrender"
chapter = "chapter_endgame"
linked_canvas = "jake_endgame_choice"
linked_flag = "jake_endgame_choice"
is_milestone = true
npc = "npc_jake"
journal_entry = "He sat on my bed. Not for sex. 'What do you want me to do?' Not in bed. In life. I built this. I broke him down and rebuilt him. I said 'Stay' or 'I don't need you to do anything. That was the point.' One keeps him. The other proves I never needed him. Both are true."

