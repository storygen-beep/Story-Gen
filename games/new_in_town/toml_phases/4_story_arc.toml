# NODES — Opening
# ============================================================

[[story_arc.nodes]]
id = "arrival"
name = "Arrival in Millfield"
chapter = "chapter_prologue"
linked_canvas = "opening_arrival"
linked_flag = "game_started"
npc = "npc_jolene"
is_milestone = true
journal_entry = "Two suitcases. A backpack with a Bible Mom packed. A town that looks like it fell asleep in 1985. The woman behind the bar took one look at me, grinned, and grabbed my suitcase without asking. 'Room's upstairs. Walls are thin.' I don't know what she means yet."

# ============================================================
# NODES — Phase 1: Jolene's Corruption Arc
# ============================================================

[[story_arc.nodes]]
id = "culture_shock"
name = "Culture Shock"
chapter = "chapter_awakening"
linked_canvas = "jolene_culture_shock"
linked_flag = "school_started"
npc = "npc_jolene"
is_milestone = true
group = "phase1_progression"
journal_entry = "She walks around in her underwear like her body isn't something to be embarrassed about. She swears. She touches men's arms when she laughs. She poured me chili and wine and called me 'hon.' I ate the chili and tried not to stare. I failed."

[[story_arc.nodes]]
id = "thin_walls"
name = "Thin Walls"
chapter = "chapter_awakening"
linked_canvas = "jolene_thin_walls"
linked_flag = "jolene_thin_walls"
npc = "npc_jolene"
is_milestone = true
group = "phase1_progression"
journal_entry = "I should have put in earbuds. I should have prayed. I lay there in the dark and listened to every sound through the wall and I don't have a word for what I felt. Not disgust. Something that scared me more than disgust."

[[story_arc.nodes]]
id = "wine_dinner"
name = "Wine and Honesty"
chapter = "chapter_awakening"
linked_canvas = "jolene_wine_dinner"
linked_flag = "jolene_wine_dinner"
npc = "npc_jolene"
is_milestone = false
journal_entry = "Two glasses of wine and she asked me about sex. I said 'fine.' She looked at me like I'd said the saddest word in the English language. Maybe I did. She talked about desire like it was a natural thing — not a sin. I listened and my glass was empty again and I don't remember drinking it."

[[story_arc.nodes]]
id = "cracked_door"
name = "The Cracked Door"
chapter = "chapter_awakening"
linked_canvas = "jolene_peek_event"
linked_flag = "jolene_peek_event"
npc = "npc_jolene"
is_milestone = true
group = "phase1_progression"
journal_entry = "She left the door cracked on purpose. I know she did. She saw me standing there and she smiled and she didn't stop. I ran to my room and sat on the bed and my heart was hammering and my hands were shaking and I was horrified. And something else. Something I don't have a name for yet."

[[story_arc.nodes]]
id = "exposure_therapy"
name = "Exposure Therapy"
chapter = "chapter_awakening"
linked_canvas = "jolene_exposure_therapy"
linked_flag = "jolene_exposure_therapy"
npc = "npc_jolene"
is_milestone = false
journal_entry = "The vibrator in the bathroom. The laptop left open. She's not being careless — she's teaching me. Not with words. With evidence that desire exists and the world doesn't end when you see it."

[[story_arc.nodes]]
id = "shopping_trip"
name = "The Shopping Trip"
chapter = "chapter_awakening"
linked_canvas = "jolene_shopping_trip"
linked_flag = "jolene_shopping_trip"
npc = "npc_jolene"
is_milestone = true
group = "phase1_progression"
journal_entry = "She bought me a dress. Black. Short. I looked in the dressing room mirror and I didn't look like myself. I looked like someone who might be wanted. The thought hit me in the chest. 'You've got legs, girl. Fucking use them.'"

[[story_arc.nodes]]
id = "self_discovery"
name = "Figure It Out"
chapter = "chapter_awakening"
linked_canvas = "jolene_self_discovery"
linked_flag = "phase_1_complete"
npc = "npc_jolene"
is_milestone = true
group = "phase1_progression"
journal_entry = "She told me to go to my room. Lock the door. Figure it out. And I did. Or I tried. Either way — something opened. Something I was taught to keep shut. Jolene didn't touch me. She didn't have to. She just showed me the door and dared me to walk through it."

[[story_arc.nodes]]
id = "phase_1_close"
name = "There She Is"
chapter = "chapter_awakening"
linked_canvas = "jolene_phase_1_complete"
linked_flag = "phase_1_complete"
npc = "npc_jolene"
is_milestone = true
journal_entry = "I sat at the bar in the dress and ordered wine without hesitating. Ray's arm brushed mine and I didn't flinch. Jake winked and I held his gaze. Tom walked in and his mouth opened. Jolene looked at me and said: 'There she is.' I don't know who 'she' is yet. But I want to find out."

# ============================================================
# NODES — Tom Arc
# ============================================================

[[story_arc.nodes]]
id = "tom_excuse"
name = "The Excuse"
chapter = "chapter_first_hunt"
linked_canvas = "tom_locks_checked"
linked_flag = "tom_locks_checked"
is_milestone = true
npc = "npc_tom"
journal_entry = "Jolene said to tell him I don't feel safe alone at night. He was at my door in thirty seconds. Clean shirt. Smelled like he showered. For a lock check. He inspected every window like he was saving me from a fire. And I watched his hands and thought: this is going to be easy."

[[story_arc.nodes]]
id = "tom_classroom"
name = "Classroom Setup"
chapter = "chapter_first_hunt"
linked_canvas = "tom_classroom_setup"
linked_flag = "tom_classroom_setup"
is_milestone = false
npc = "npc_tom"
journal_entry = "I bent over in front of him to pick up tape. Slowly. His ears turned red. He dropped the banner. He can't form sentences when I stand close. I'm learning — every blush is data, every stammer is proof I have power over this man. The discovery is intoxicating."

[[story_arc.nodes]]
id = "tom_catch"
name = "The Classroom Catch"
chapter = "chapter_first_hunt"
linked_canvas = "tom_classroom_catch"
linked_flag = "tom_kiss_unlocked"
is_milestone = true
npc = "npc_tom"
group = "first_conquest"
journal_entry = "I 'tripped.' He caught me. His hands on my waist. His heartbeat through his shirt. He was frozen — not from fear, from having no framework for what to do when a woman wants him close. So I closed the distance. I kissed him. Or I almost did. Either way — he's mine now."

[[story_arc.nodes]]
id = "tom_confession"
name = "Tom's Confession"
chapter = "chapter_first_hunt"
linked_canvas = "tom_devotion_confession"
linked_flag = "tom_devotion_confession"
is_milestone = false
npc = "npc_tom"
group = "bridge_witnessed"
journal_entry = "He told me about his dad. The heart attack. The badge he inherited. How he never left Millfield because leaving felt like abandoning a ghost. He's me — who I was two weeks ago. Trapped by expectations, never having seen an alternative. I'm about to break him out of that cage. The same way Jolene broke me out of mine."

[[story_arc.nodes]]
id = "tom_movie"
name = "Movie Night"
chapter = "chapter_first_hunt"
linked_canvas = "tom_movie_night"
linked_flag = "tom_groping_unlocked"
is_milestone = true
npc = "npc_tom"
journal_entry = "Gas station flowers. The most heartbreaking thing I've ever seen. He sat rigid while I put his hand on my thigh. I pushed him against the headboard and kissed him and said: 'You're going to learn. And I'm going to teach you.' His face — wrecked, grateful, terrified. This is what power looks like up close."

[[story_arc.nodes]]
id = "tom_good_boy"
name = "Good Boy"
chapter = "chapter_first_hunt"
linked_canvas = "tom_good_boy"
linked_flag = "tom_oral_unlocked"
is_milestone = true
npc = "npc_tom"
journal_entry = "I said 'good boy' without thinking. And the moment I said it, I saw his eyes change. Not embarrassment. Something deeper. He liked being directed. He liked being my student. This isn't about sex anymore. This is about control. And I like it more than the physical part."

[[story_arc.nodes]]
id = "tom_first_time"
name = "First Time"
chapter = "chapter_first_hunt"
linked_canvas = "tom_first_time"
linked_flag = "tom_sex_unlocked"
is_milestone = true
npc = "npc_tom"
group = "deep_intimacy"
journal_entry = "I took his virginity on my terms. On top. His hands pinned. His face — someone rebuilt his entire world. 'I'd do anything for you.' He means it. He's the most honest person in this town and I'm the most dishonest thing that's ever happened to him. Something flickered. Guilt? I pushed it down."

# ============================================================
# NODES — Ray Arc
# ============================================================

[[story_arc.nodes]]
id = "ray_wall"
name = "The Invisible Wall"
chapter = "chapter_proving"
linked_canvas = "ray_invisible_wall"
linked_flag = "ray_invisible_wall"
is_milestone = true
npc = "npc_ray"
journal_entry = "Nothing. Zero reaction. He calls me 'Miss' and nods politely and goes back to his beer. I tried everything that worked on Tom — standing close, touching his arm, laughing. Nothing. I'm wallpaper. Jolene said: 'He's decided you're a category he doesn't touch. Break the drawer.'"

[[story_arc.nodes]]
id = "ray_crack"
name = "First Crack"
chapter = "chapter_proving"
linked_canvas = "ray_first_crack"
linked_flag = "ray_first_crack"
is_milestone = true
npc = "npc_ray"
journal_entry = "I opened the door in a tank top and shorts. No bra. 'Sorry, wasn't expecting you this early.' I was expecting him exactly when he came. He glanced back and caught me looking at his shoulders. Looked away quick. Quicker than a man who felt nothing would need to. First crack."

[[story_arc.nodes]]
id = "ray_truck"
name = "The Truck Conversation"
chapter = "chapter_proving"
linked_canvas = "ray_truck_conversation"
linked_flag = "ray_truck_conversation"
is_milestone = false
npc = "npc_ray"
journal_entry = "He told me about his daughter. The custody fight. The birthday he missed. His eyes were wet. I put my hand on his arm and left it there. He looked at me like he was seeing me for the first time. 'You're not what I expected, Miss.' 'Emma.' '...Emma.' The way he said my name was worth more than anything Tom ever stammered."

[[story_arc.nodes]]
id = "ray_shed"
name = "The Shed"
chapter = "chapter_proving"
linked_canvas = "ray_shed_scene"
linked_flag = "ray_groping_unlocked"
is_milestone = true
npc = "npc_ray"
group = "first_conquest"
journal_entry = "His chest against my back. His arms alongside mine. The saw forgotten. I pressed back into him and felt him respond and neither of us moved. His body admitted what his mind won't. Ray's physical gate fires before the emotional one — that's who he is. Action before acknowledgment."

[[story_arc.nodes]]
id = "ray_staircase"
name = "The Staircase"
chapter = "chapter_proving"
linked_canvas = "ray_staircase_kiss"
linked_flag = "ray_kiss_unlocked"
is_milestone = true
npc = "npc_ray"
group = "multi_arc_active"
journal_entry = "He kissed me. Hard. Not tentative like Tom — Ray has been kissing women for twenty years. But this one cost him something. 'This is a bad idea.' 'I know.' My hand reached for his belt. 'Goodnight, Ray.' I walked upstairs. Didn't look back. He stood there a long time."

[[story_arc.nodes]]
id = "ray_daughter"
name = "The Daughter"
chapter = "chapter_proving"
linked_canvas = "ray_daughter_story"
linked_flag = "ray_daughter_story"
is_milestone = false
npc = "npc_ray"
group = "bridge_witnessed"
journal_entry = "A photo in his wallet. A girl missing a front tooth. He talked about driving to the next town every other weekend and pretending two days is enough. His hands shake when he talks about her. This is the complication I didn't plan for — Ray is becoming a real person to me. Not a conquest. A man."

[[story_arc.nodes]]
id = "ray_truck_oral"
name = "The Truck"
chapter = "chapter_proving"
linked_canvas = "ray_truck_oral"
linked_flag = "ray_oral_unlocked"
is_milestone = true
npc = "npc_ray"
journal_entry = "In the cab of his truck. Dark parking lot. I dropped to my knees between the seat and the dash. 'Jesus, Em—' I didn't let him finish the sentence. For the first time with Ray — he let me lead."

[[story_arc.nodes]]
id = "ray_feelings"
name = "Feelings"
chapter = "chapter_crisis"
linked_canvas = "ray_feelings_emerge"
linked_flag = "ray_feelings_emerge"
is_milestone = true
npc = "npc_ray"
group = "crisis_experienced"
journal_entry = "He's falling for me. Jolene said it plain: 'If you're playing him, decide now — if you break that man, he doesn't come back. He has a kid.' I didn't plan for feelings. Hers or mine. I said either 'I know what I'm doing' or 'I didn't plan for this.' One is a lie. I'm not sure which."

[[story_arc.nodes]]
id = "ray_upstairs"
name = "Upstairs"
chapter = "chapter_proving"
linked_canvas = "ray_upstairs"
linked_flag = "ray_sex_unlocked"
is_milestone = true
npc = "npc_ray"
group = "deep_intimacy"
journal_entry = "Ray knows what he's doing. He took charge. I gasped — actually gasped, unperformative — and for a moment I wasn't in control. Afterward I lay there and realized: I didn't like it. Not the sex — the sex was incredible. I didn't like not being in control. Ray taught me what I actually want. Not good sex. Power."

# ============================================================
# NODES — Mark Arc
# ============================================================

[[story_arc.nodes]]
id = "mark_conference"
name = "First Conference"
chapter = "chapter_proving"
linked_canvas = "mark_first_conference"
linked_flag = "mark_first_conference"
is_milestone = true
npc = "npc_mark"
journal_entry = "Parent-teacher conference. He came alone — Karen has a 'headache.' He lingered. Asked questions unrelated to his kid. Laughed at things that weren't funny. He's starved. Hollow. A man sleepwalking through a life someone else designed. I touched his hand giving him the report card. 'He must get it from you.' He'll think about that sentence for three days."

[[story_arc.nodes]]
id = "mark_volunteer"
name = "The Volunteer"
chapter = "chapter_proving"
linked_canvas = "mark_fundraiser_volunteer"
linked_flag = "mark_fundraiser_volunteer"
is_milestone = false
npc = "npc_mark"
journal_entry = "He invented the fundraiser excuse. We work late in the classroom. He brings coffee. The conversation is personal — his marriage, his job, the sleepwalking. I said: 'That must be lonely.' The word 'lonely' hit him like a brick. Nobody names it for him. I did."

[[story_arc.nodes]]
id = "mark_rain"
name = "The Rain"
chapter = "chapter_proving"
linked_canvas = "mark_rain_umbrella"
linked_flag = "mark_kiss_unlocked"
is_milestone = true
npc = "npc_mark"
group = "multi_arc_active"
journal_entry = "One umbrella. I pressed against him. Shivered. He put his arm around me. We stopped walking. His eyes dropped to my mouth. He almost kissed me. Pulled back. 'I should go.' That night she texted: 'I keep thinking about the rain.' He texted back. The barrier breaks through screens."

[[story_arc.nodes]]
id = "mark_desk"
name = "Under the Desk"
chapter = "chapter_proving"
linked_canvas = "mark_under_desk"
linked_flag = "mark_groping_unlocked"
is_milestone = true
npc = "npc_mark"
journal_entry = "His hand on my thigh under the desk. His thumb moving against my skin — memorizing the texture of the line he's crossing. Footsteps in the hallway. We separate. Professional smiles. 'Same time Thursday?' Every escalation risks my career. The principal's office is down the hall. The danger is the point."

[[story_arc.nodes]]
id = "mark_phone"
name = "The Phone Call"
chapter = "chapter_proving"
linked_canvas = "mark_call_from_bedroom"
linked_flag = "mark_call_from_bedroom"
is_milestone = false
npc = "npc_mark"
group = "bridge_witnessed"
journal_entry = "I called him at 10pm. 'Karen's downstairs.' I listened to him come apart over the phone while his wife was one floor below. The taboo isn't incidental — it's the engine. The closer Karen is, the hotter it burns. Afterward I hung up and looked at the ceiling. No guilt. None. That's new."

[[story_arc.nodes]]
id = "mark_visit"
name = "The First Visit"
chapter = "chapter_proving"
linked_canvas = "mark_first_visit"
linked_flag = "mark_oral_unlocked"
is_milestone = true
npc = "npc_mark"
journal_entry = "'Karen thinks I'm at a meeting.' His hands were shaking. I didn't rush it. Made coffee. Let the tension build — I've learned this from Jolene, from Tom, from Ray. Tension is a tool. You shape it. Then I pushed him down and controlled the pace. His guilt makes him harder. I'm learning guilt the way I learned Tom's devotion — as a lever."

[[story_arc.nodes]]
id = "mark_no_hesitation"
name = "No Hesitation"
chapter = "chapter_proving"
linked_canvas = "mark_no_hesitation"
linked_flag = "mark_sex_unlocked"
is_milestone = true
npc = "npc_mark"
group = "deep_intimacy"
journal_entry = "He came back. No shaking hands. No preamble. He walked in and knew what he was here for. Afterward: 'What did I do. Oh God.' I said either 'You did what you wanted' or 'We both wanted this.' One gives me his guilt. The other gives me his comfort. Both bring him back tomorrow."

[[story_arc.nodes]]
id = "karen_crisis"
name = "Karen"
chapter = "chapter_crisis"
linked_canvas = "karen_crisis"
linked_flag = "karen_school_confrontation"
is_milestone = true
npc = "npc_mark"
group = "crisis_experienced"
journal_entry = "She showed up at my school. Mid-morning. 'We need to talk. Now.' I played it perfectly. Calm. Professional. Slightly hurt. She searched my face for the crack. She didn't find it. Because I'm not guilty. I'm performing. And I'm better at it than she ever expected. My hands are steady. My heart rate is normal. I just lied to a wife about sleeping with her husband and I feel nothing."

[[story_arc.nodes]]
id = "mark_repair"
name = "The Parking Lot"
chapter = "chapter_crisis"
linked_canvas = "mark_crisis_repair"
linked_flag = "mark_crisis_repair_complete"
is_milestone = true
npc = "npc_mark"
journal_entry = "11pm. His car. Third row. He looks wrecked. 'She knows. She doesn't have proof, but she knows.' He looked at me like I was either the devil or the only thing keeping him alive. Maybe both. I chose to pull him deeper or let him go. Either way — he comes back. They always come back."

