[[canvases.nodes]]
id = "n2"
name = "The Questions"
blocks = [
  { type = "paragraph", content = "Two glasses in. Jolene asks with zero preamble:" },
  { type = "dialog", content = "So when's the last time you had sex?", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "Emma chokes on wine." },
  { type = "dialog", content = "I — that's — I don't—", props = { speaker = "player" } },
  { type = "dialog", content = "Because I'm looking at you and I'm seeing a woman who's never been properly fucked. Am I wrong?", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "Silence. Emma's face is on fire." },
  { type = "dialog", content = "One boyfriend. David.", props = { speaker = "player" } },
  { type = "paragraph", content = "She can barely say it." },
  { type = "dialog", content = "Twice. It was... fine.", props = { speaker = "player" } },
  { type = "paragraph", content = "Jolene's expression changes. Not mocking — sad. Knowing. She pours more wine." },
  { type = "dialog", content = "Honey. 'Fine' is the saddest word in the English language when it comes to sex. You deserve better than fine. Everyone does.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "Jolene talks. About her first husband, her second, the men between. About desire being a natural thing, not a sin. About the difference between being touched and being wanted." },
  { type = "paragraph", content = "Emma listens. Her glass is empty again and she doesn't remember drinking it." }
]
exit_block = { type = "location", text = "Continue", config = { destinationType = "trigger", time_progression_minutes = 90, effects = [{ targetType = "player", trait = "corruption", op = "add", value = 1 }, { targetType = "player", trait = "confidence", op = "add", value = 1 }], flagEffects = [{ targetType = "player", flag = "jolene_wine_dinner" }] } }


