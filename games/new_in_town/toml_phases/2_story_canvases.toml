blocks = [
  { type = "paragraph", content = "Her room. Her terms. She tells him when to arrive, what to wear, where to stand." },
  { type = "paragraph", content = "He complies. The cocky bartender follows instructions from a twenty-three-year-old schoolteacher." },
  { type = "paragraph", content = "She's on top. She pins his hands above his head." },
  { type = "dialog", content = "Did I say you could touch?", props = { speaker = "player" } },
  { type = "paragraph", content = "He doesn't fight it. He arches into it. He discovers — and she sees the moment of discovery in his face — that he likes not being in charge. That the ego was armor, not identity. That underneath the bravado is a man who has been waiting his entire life for someone to tell him what to do." },
