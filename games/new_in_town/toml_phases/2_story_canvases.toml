blocks = [
  { type = "paragraph", content = "Emma comes home from school mid-afternoon. The bar is quiet. She goes upstairs. Jolene's door is cracked open — not closed, not wide. Cracked." },
  { type = "paragraph", content = "Sounds. The same sounds from the thin walls, but now — closer. Visible." },
  { type = "paragraph", content = "Emma stops in the hallway. She can see through the crack. Jolene is on her bed with a man. They're not under the covers. Jolene is on top. The man's hands are on her hips. Jolene's back arches, her head thrown back, and the sound she makes is nothing like shame." },
  { type = "paragraph", content = "Jolene opens her eyes. Looks directly at the crack in the door. Sees Emma standing there." },
  { type = "paragraph", content = "She doesn't stop. She doesn't cover herself. She smiles. Holds Emma's gaze for three seconds — an invitation, a dare, a message — and then closes her eyes again." }
]
