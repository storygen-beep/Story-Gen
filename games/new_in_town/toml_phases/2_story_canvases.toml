  { type = "paragraph", content = "She saw. Jolene saw her seeing. And Jolene smiled." },
  { type = "paragraph", content = "At dinner, Jolene acts completely normal. Doesn't mention it. Pours Emma wine without asking. Tells a story about a customer. Normal." },
  { type = "paragraph", content = "But Emma knows: Jolene left that door cracked on purpose." }
]
exit_block = { type = "choices", choices = [
