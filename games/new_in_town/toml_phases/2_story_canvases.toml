blocks = [
  { type = "paragraph", content = "Afternoon. Principal Davis again, but this time he closes the door behind him. No coffee mug. No casual lean on the desk." },
  { type = "paragraph", content = "\"Emma, I need to be direct with you.\"" },
  { type = "paragraph", content = "He sits across from her, hands folded. \"I've been hearing things. About your... social life. The bar visits. Some parents have raised concerns.\"" },
  { type = "paragraph", content = "He pauses, letting it land." },
  { type = "paragraph", content = "\"I hired you because you were exactly what this school needed — young, enthusiastic, a good role model. I still believe that. But I need you to understand: in a town like Millfield, perception IS reality. And right now, the perception isn't great.\"" },
  { type = "paragraph", content = "He stands. \"I'm going to be dropping by your classroom more often. Not because I don't trust you. Because I need to show the school board I'm paying attention.\"" }
]
