[[canvases.nodes]]
id = "n1"
name = "The Text"
blocks = [
  { type = "paragraph", content = "Karen finds a text on Mark's phone. Not explicit — but wrong. Too warm. Too late at night. \"Can't wait to see you\" at 11:47pm, to a contact saved as \"School — Miss E.\"" },
  { type = "paragraph", content = "Karen shows up at the school. Mid-morning. Emma's teaching. The door opens and a woman she's only seen at church is standing there with murder in her eyes." },
  { type = "dialog", content = "We need to talk. Now.", props = { speaker = "npc", npcId = "npc_mark" } }
]
exit_block = { type = "choices", choices = [
  { text = "Continue", targetType = "node", nodeId = "karen_crisis.n2" }
] }

[[canvases.nodes]]
id = "n2"
name = "The Confrontation"
blocks = [
  { type = "paragraph", content = "Hallway. Other teachers walking past. Karen's voice is controlled — barely." },
  { type = "paragraph", content = "\"My husband has been spending a lot of time on this 'fundraiser.' Late nights. Early mornings. Secret phone calls. Would you like to explain what exactly you need from a married man at 11pm?\"" },
  { type = "paragraph", content = "Emma plays it perfectly. Calm. Professional. Slightly hurt." },
  { type = "dialog", content = "Mark has been incredibly helpful with the fundraiser. I'm sorry if the schedule has been difficult for your family. I'll make sure to keep our meetings during school hours from now on.", props = { speaker = "player" } },
  { type = "paragraph", content = "Karen searches her face. Looking for the crack. The guilt. The tell." },
  { type = "paragraph", content = "She doesn't find it. Because Emma isn't guilty. She's performing. And she's better at it than Karen ever expected." },
  { type = "paragraph", content = "Karen backs down. \"See that you do.\"" },
  { type = "paragraph", content = "She walks out. Emma watches her go. Her hands are steady. Her heart rate is normal. She just looked a woman in the eyes and lied about sleeping with her husband, and she feels nothing." }
]
exit_block = { type = "location", text = "Continue", config = { destinationType = "specific", locationId = "loc_school_classroom", time_progression_minutes = 30, effects = [{ targetType = "player", trait = "reputation", op = "add", value = -6 }, { targetType = "npc", npcId = "npc_mark", trait = "guilt", op = "add", value = 8 }, { targetType = "npc", npcId = "npc_mark", trait = "desire", op = "add", value = -3 }], flagEffects = [{ targetType = "player", flag = "karen_finds_text" }, { targetType = "player", flag = "karen_school_confrontation" }, { targetType = "player", flag = "karen_confrontation_complete" }] } }


