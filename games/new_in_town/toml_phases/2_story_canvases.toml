[[canvases.nodes]]
id = "n1"
name = "The Dare"
blocks = [
  { type = "paragraph", content = "Late night. Jolene's room. Wine. The conversation has been circling something for an hour. Jolene asks it directly:" },
  { type = "dialog", content = "When's the last time you touched yourself?", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "Emma is past choking on her wine. She's past blushing. But she still can't answer." },
  { type = "dialog", content = "That's what I thought.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "She stands up. Puts her wine glass down. Looks at Emma with something that isn't teasing — it's compassion." },
  { type = "dialog", content = "Go to your room. Lock the door. Lie down. Close your eyes. And figure it out.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "dialog", content = "I don't — I've never—", props = { speaker = "player" } },
  { type = "dialog", content = "I know you haven't. That's the whole fucking problem, Emma. You don't know what your body does. You don't know what you like. You don't know the first thing about yourself. And until you do, you're going to keep being the girl who had sex twice and called it 'fine.'", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "She puts her hand on Emma's cheek. Gentle. The first time she's touched her with intention." },
  { type = "dialog", content = "You're not broken. You just haven't started yet. Go. Figure it out.", props = { speaker = "npc", npcId = "npc_jolene" } }
]
exit_block = { type = "choices", choices = [
  { text = "Continue", targetType = "node", nodeId = "jolene_self_discovery.n2" }
] }

