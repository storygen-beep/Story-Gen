# ═══════════════════════════════════════════════════════════════
# OPENING SCENE — "Arrival in Millfield"
# ═══════════════════════════════════════════════════════════════

[[canvases]]
id = "opening_arrival"
name = "Arrival in Millfield"
description = "Emma arrives in Millfield with two suitcases and a Bible. She meets Jolene, sees her room, and looks in the mirror for the first time."

# NOTE: No [canvases.trigger] — this is the starting canvas

[[canvases.nodes]]
id = "n1"
name = "Main Street"
blocks = [
  { type = "paragraph", content = "A bus stop on the main road. Two suitcases, a backpack with a Bible her mother packed, and a town that looks like it fell asleep in 1985 and nobody woke it up. Millfield. Population 2,000. One traffic light, one bar, one church steeple pointing at a sky that doesn't care." },
  { type = "paragraph", content = "She stands on the sidewalk and a pickup truck slows down. The driver tips his hat. A woman sweeping a porch across the street stops sweeping and stares. Three seconds in Millfield, and she's already being watched." },
  { type = "image", props = { search_queries = ["Young woman with two suitcases on a small-town main street, rural America, afternoon sun, pickup trucks, storefronts, feeling small"] } }
]
exit_block = { type = "choices", choices = [
  { text = "Find the bar", targetType = "node", nodeId = "opening_arrival.n2" }
] }

[[canvases.nodes]]
id = "n2"
name = "The Dusty Boot"
blocks = [
  { type = "paragraph", content = "The neon sign is half-dead. THE DU TY B OT. Inside smells like spilled beer and cigarette smoke and something cooking in a back kitchen. It's 2pm and three men sit at the bar. They all look up when the door opens." },
  { type = "paragraph", content = "Behind the counter: a woman in a tank top, hair piled up, cigarette tucked behind her ear. She looks at Emma — two suitcases, cardigan buttoned to her throat, wide eyes — and grins." },
  { type = "dialog", content = "You must be the teacher. Christ, you're younger than I thought. I'm Jolene. I own this disaster.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "She comes around the bar and takes one of Emma's suitcases without asking. \"Room's upstairs. Walls are thin. I'll show you.\" She doesn't wait for Emma to answer. She's already walking." },
  { type = "image", props = { search_queries = ["Older woman (42, tank top, confident, cigarette behind ear) behind a dive bar counter, greeting a young woman with suitcases, warm but overwhelming"] } }
]
exit_block = { type = "choices", choices = [
  { text = "Follow her upstairs", targetType = "node", nodeId = "opening_arrival.n3" }
] }

[[canvases.nodes]]
id = "n3"
name = "The Room"
blocks = [
  { type = "paragraph", content = "A single bed. A desk by the window. A bathroom the size of a closet. Through the wall, she can hear the bar below — muffled music, a man laughing." },
  { type = "dialog", content = "Rent's $180 a week. Kitchen's shared — mine is down the hall. You can use the bar bathroom during the day but don't let the customers catch you in your robe. Church is Sunday, school starts Monday, and the whole town already knows your name because I told them.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "She leaves. The door is open. Emma isn't sure if Jolene forgot to close it or just doesn't believe in closed doors." },
  { type = "paragraph", content = "Emma sits on the bed. Unpacks her Bible. Puts it on the nightstand. Looks at herself in the bathroom mirror." },
  { type = "paragraph", content = "Cardigan, long skirt, hair in a ponytail. No makeup. She smiles at herself — nervous but hopeful." },
  { type = "dialog", content = "You can do this.", props = { speaker = "player" } },
  { type = "paragraph", content = "She says it out loud, to the mirror, the way she used to pray before tests. The girl in the mirror looks like she's never been touched. She hasn't. Not really." },
  { type = "image", props = { search_queries = ["Young woman looking at herself in a small bathroom mirror, cardigan, ponytail, hopeful nervous smile, simple room"] } }
]
exit_block = { type = "choices", choices = [
  { text = "Unpack and settle in", targetType = "location", locationId = "loc_bar_emma_room", time_progression_minutes = 180, effects = [{ targetType = "player", trait = "energy", op = "add", value = 10 }], flagEffects = [{ targetType = "player", flag = "game_started" }, { targetType = "player", flag = "jolene_arrival_complete" }, { targetType = "player", flag = "mirror_day_1" }] }
] }


