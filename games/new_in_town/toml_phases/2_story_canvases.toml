[[canvases.nodes]]
id = "n1"
name = "The First Evening"
blocks = [
  { type = "paragraph", content = "Emma comes downstairs for dinner. Jolene is behind the bar in a silk robe over underwear, pouring shots for two men who don't seem to think this is unusual. She pours Emma a Coke without asking." },
  { type = "dialog", content = "Sit. Eat.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "A plate of chili appears. \"Made it myself. It's spicy. You look like you've never eaten anything spicy.\"" },
  { type = "paragraph", content = "Jolene moves through the bar like she owns the air in it. She swears casually — \"that asshole mayor,\" \"this goddamn jukebox.\" She touches men's arms when she laughs. She's loud. She's comfortable. She's everything Emma was taught to find distasteful." },
  { type = "paragraph", content = "Emma eats her chili and tries not to stare." }
]
exit_block = { type = "choices", choices = [
  { text = "Continue", targetType = "node", nodeId = "jolene_culture_shock.n2" }
] }

[[canvases.nodes]]
id = "n2"
name = "Upstairs"
blocks = [
  { type = "paragraph", content = "Later. The bar noise fades to a muffle as Emma climbs the narrow stairs. She changes into her pajamas — long sleeves, buttoned to the collar — and sits on the bed with her Bible open to Proverbs. She's reading the same verse for the third time when a shadow moves in the hallway." },
  { type = "paragraph", content = "Jolene walks past the open door in just underwear and a tank top, wine glass in hand, barefoot on the creaking floor. She's not sneaking. She's not covering up. She glances in, sees Emma, and leans against the doorframe like she lives here. She does live here." },
  { type = "dialog", content = "You need anything? Extra blanket? The hot water takes a minute — bang the pipe twice. And don't use the left burner on the stove, it sticks.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "Emma opens her mouth. Closes it. Her eyes drop for half a second — Jolene's bare shoulders, the lace edge of something — and snap back up. Heat rises in her cheeks." },
  { type = "dialog", content = "I'm — thank you. I'm fine. Thank you.", props = { speaker = "player" } },
  { type = "paragraph", content = "Too many thank yous. Jolene notices the blush. Notices where Emma's eyes went. She doesn't say anything about it. She just takes a slow sip of wine, smiles like she's filing something away, and pushes off the doorframe." },
  { type = "dialog", content = "Night, hon. Leave your door open if you want — gets stuffy up here.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "She pads down the hallway. Emma stares at the empty doorframe for a long time before she remembers to breathe." },
  { type = "paragraph", content = "She closes the door. Sits on the bed. Opens Proverbs again. The words swim. Through the floor, the jukebox plays something slow. A man laughs. Jolene's voice cuts through — loud, warm, profane — and Emma can picture her behind that bar in her robe, touching someone's arm, not caring who sees." },
  { type = "paragraph", content = "She puts the Bible on the nightstand and lies in the dark. The ceiling is water-stained. The sheets smell like fabric softener and cigarette smoke. She replays the evening — the chili, the swearing, the silk robe, the way Jolene moved through a room full of men like she was the most dangerous thing in it." },
  { type = "paragraph", content = "Her mother would call this place ungodly. Her mother would have turned around at the bus stop. Her mother would never have looked where Emma looked." },
  { type = "paragraph", content = "She pulls the blanket to her chin and stares at the ceiling until sleep comes. It takes a long time." }
]
exit_block = { type = "location", text = "Continue", config = { destinationType = "specific", locationId = "loc_bar_jolene_space", time_progression_minutes = 120, effects = [{ targetType = "player", trait = "corruption", op = "add", value = 1 }], flagEffects = [{ targetType = "player", flag = "school_started" }, { targetType = "player", flag = "chores_explained" }] } }


