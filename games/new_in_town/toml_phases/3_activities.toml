# ============================================================
# SECTION F: EMMA'S PRIVATE AWAKENING (Corruption Milestones)
# ============================================================
# 6 repeatable solo activities gated by corruption thresholds.
# Jolene's canvases are the external catalyst — these activities
# are what Emma does with it on her own. Player controls the pacing.

# ---- Activity 1: Restless Thoughts (after Thin Walls, corruption >= 3) ----
[[canvases]]
id = "activity_restless_thoughts"
name = "Lie Awake"
description = "Late night. Emma lies in bed replaying what she heard through the wall."
is_repeatable = true

[canvases.trigger]
location = "loc_bar_emma_room"
is_repeatable = true
max_triggers_per_day = 1
priority = 1

[canvases.trigger.conditions]
version = "1.0"
logic = "AND"
items = [
  { type = "flag", subject = "player", flag_key = "jolene_thin_walls", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 3 }
]

[[canvases.trigger.schedules]]
start_time = "22:00"
end_time = "23:59"
weekdays = []

[[canvases.nodes]]
id = "n1"
name = "Can't Sleep"
blocks = [
  { type = "paragraph", content = "11:30pm. She's been lying here for an hour. The bar closed twenty minutes ago but she can still hear Jolene moving around downstairs — glasses clinking, a chair scraping. Through the wall, silence now. But last night there wasn't silence. Last night there were sounds she can't stop replaying." },
  { type = "paragraph", content = "She rolls onto her back. Stares at the water stain on the ceiling. Her hand rests on her stomach, over the fabric of her pajama top. She doesn't move it lower. Not tonight. But she thinks about it — what it would feel like, what it would mean — and the thinking goes on longer than it should." },
  { type = "paragraph", content = "She pulls the blanket tighter and presses her face into the pillow. Her pulse is doing something it shouldn't be doing. She prays, but the words feel thin, like paper held up to a fire." }
]
exit_block = { type = "location", text = "Continue", config = { destinationType = "specific", locationId = "loc_bar_emma_room", time_progression_minutes = 30, effects = [{ targetType = "player", trait = "corruption", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -5 }] } }

# ---- Activity 2: Phone in the Dark (after Wine and Honesty, corruption >= 7) ----
[[canvases]]
id = "activity_phone_dark"
name = "Late Night Scrolling"
description = "Late night. Emma searches for something on her phone she's never searched before."
is_repeatable = true

[canvases.trigger]
location = "loc_bar_emma_room"
is_repeatable = true
max_triggers_per_day = 1
priority = 1

[canvases.trigger.conditions]
version = "1.0"
logic = "AND"
items = [
  { type = "flag", subject = "player", flag_key = "jolene_wine_dinner", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 7 }
]

[[canvases.trigger.schedules]]
start_time = "22:00"
end_time = "23:59"
weekdays = []

[[canvases.nodes]]
id = "n1"
name = "The Search Bar"
blocks = [
  { type = "paragraph", content = "The room is dark. The phone screen glows blue against the ceiling. She holds it above her face and types something into the search bar — deletes it — types it again. Her thumb hovers over the enter key for five seconds. She hits it." },
  { type = "paragraph", content = "What comes back is not what her mother's internet filter would have allowed. She watches for thirty seconds, heart hammering, then a minute, then she loses track of time entirely. The sounds are tinny through the phone speaker — she panics and shoves in earbuds, checks the door is closed." },
  { type = "paragraph", content = "She watches longer than she planned. Much longer. When she finally closes the tab, her face is burning and her hands are shaking and she clears the history three times because once doesn't feel like enough." },
  { type = "paragraph", content = "She puts the phone face-down on her chest. Stares at the ceiling. Something has shifted — not dramatically, not all at once, but like a door cracked open one more inch." }
]
exit_block = { type = "location", text = "Continue", config = { destinationType = "specific", locationId = "loc_bar_emma_room", time_progression_minutes = 45, effects = [{ targetType = "player", trait = "corruption", op = "add", value = 1 }, { targetType = "player", trait = "confidence", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -5 }] } }

# ---- Activity 3: The Locked Door (after Cracked Door, corruption >= 13) ----
[[canvases]]
id = "activity_locked_door"
name = "Lock the Door"
description = "The bathroom door is locked. The shower is running. Emma is learning."
is_repeatable = true

[canvases.trigger]
location = "loc_bar_emma_room"
is_repeatable = true
max_triggers_per_day = 1
priority = 1

[canvases.trigger.conditions]
version = "1.0"
logic = "AND"
items = [
  { type = "flag", subject = "player", flag_key = "jolene_peek_event", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 13 }
]

[[canvases.trigger.schedules]]
start_time = "09:00"
end_time = "22:00"
weekdays = []

[[canvases.nodes]]
id = "n1"
name = "Behind the Lock"
blocks = [
  { type = "paragraph", content = "She locks the bathroom door. Checks it twice. Turns on the shower — not to get in, just for the sound. The mirror is fogging at the edges." },
  { type = "paragraph", content = "She drops the towel. Looks at herself. Not the way she used to — checking for flaws, comparing herself to magazine covers she wasn't supposed to read. This is different. She's looking the way Jolene looks at herself. Like her body belongs to her. Like it's allowed to feel things." },
  { type = "paragraph", content = "Her hands move slowly. Collarbone. Ribs. The curve of her hip. She watches her own reflection and she's blushing but she doesn't look away. Not this time." },
  { type = "paragraph", content = "Nobody taught her this. Nobody is watching. That's the whole point — she's learning the geography of her own body, and the lesson is private, and the teacher is her own hands, and the classroom is a bathroom the size of a closet with a fogged mirror and a shower running for cover." },
  { type = "paragraph", content = "When she steps out, she towels the steam off the mirror. The woman looking back isn't embarrassed. She's curious. That's new." }
]
exit_block = { type = "location", text = "Continue", config = { destinationType = "specific", locationId = "loc_bar_emma_room", time_progression_minutes = 30, effects = [{ targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "confidence", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -10 }] } }

