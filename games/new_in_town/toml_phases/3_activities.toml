[[canvases.nodes]]
id = "n1"
name = "The Closet"
blocks = [
  { type = "paragraph", content = "The closet has two halves now. The left side is cardigans and long skirts and everything her mother packed. The right side is everything since Jolene. She reaches right." },
  { type = "paragraph", content = "The skirt that stops above the knee. The blouse that shows her collarbone and a little more. The heels she can almost walk in. She puts them on, piece by piece, and stands in front of the mirror." },
  { type = "paragraph", content = "She turns. Looks over her shoulder. Pushes her hair back. Tries a smile — not her nervous one, not her polite one. The one Jolene uses when she knows someone is watching." },
  { type = "paragraph", content = "She takes a photo with her phone. Deletes it. Takes another from a different angle. Keeps this one. Looks at it. The girl from the bus stop — two suitcases, cardigan buttoned to her throat — would not recognize this woman. That's not an accident. That's the point." }
]
exit_block = { type = "location", text = "Continue", config = { destinationType = "specific", locationId = "loc_bar_emma_room", time_progression_minutes = 30, effects = [{ targetType = "player", trait = "corruption", op = "add", value = 1 }, { targetType = "player", trait = "confidence", op = "add", value = 2 }, { targetType = "player", trait = "energy", op = "add", value = -5 }] } }

