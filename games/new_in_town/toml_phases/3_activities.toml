  { type = "flag", subject = "player", flag_key = "phase_1_complete", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 28 }
]

[[canvases.trigger.schedules]]
start_time = "17:00"
end_time = "23:59"
weekdays = []

[[canvases.nodes]]
id = "n1"
name = "Downstairs"
blocks = [
  { type = "paragraph", content = "She wears the new clothes downstairs. Not to school — not yet. To the bar. The skirt, the blouse, the heels she's practiced walking in. Jolene sees her come down the stairs and raises a glass without saying a word." },
  { type = "paragraph", content = "She pours herself a drink — wine, not the Coke Jolene used to pour her — and leans against the bar. For the first time she's not hiding behind it. She's standing in front of it." },
  { type = "paragraph", content = "Ray glances up from his usual seat. His eyes stay a beat too long. Jake, across the room, does the same thing but doesn't try to hide it. Tom walks in and stops in the doorway like he's forgotten where he was going." },
  { type = "paragraph", content = "She doesn't look away. She holds the gaze — one beat, two beats, three — then takes a sip of her wine and turns back to the bar. Calm. Deliberate." },
  { type = "paragraph", content = "She's not performing. She's not flirting. She's testing. Testing what it feels like to choose to be seen, to stand in a room and know that people are looking and to not flinch. To let them look." },
  { type = "paragraph", content = "Jolene leans over. \"There she is,\" she whispers. Emma doesn't answer. She just smiles. The smile has teeth in it now." }
]
exit_block = { type = "location", text = "Continue", config = { destinationType = "specific", locationId = "loc_bar_floor", time_progression_minutes = 60, effects = [{ targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "confidence", op = "add", value = 2 }, { targetType = "player", trait = "energy", op = "add", value = -10 }] } }
