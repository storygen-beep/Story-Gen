# ---- TOM ACTIVITY 1: "Coffee With Tom" ----
[[canvases]]
id = "activity_coffee_tom"
name = "Coffee With Tom"
description = "Afternoon coffee at the diner. Escalates from conversation to under-table tension."
is_repeatable = true

[canvases.trigger]
location = "loc_diner"
is_repeatable = true
npc = "npc_tom"
max_triggers_per_day = 1
priority = 1

[canvases.trigger.conditions]
version = "1.0"
items = [
  { type = "flag", subject = "player", flag_key = "tom_locks_checked", operator = "is_true" }
]

[[canvases.trigger.schedules]]
start_time = "12:00"
end_time = "15:00"
weekdays = [0, 2, 4]

[[canvases.nodes]]
id = "base"
name = "The Diner"
blocks = [
  { type = "paragraph", content = "The diner. Afternoon. Tom is already there — he showed up fifteen minutes early and has been staring at the door. He's in his off-duty clothes: a clean flannel, jeans that fit like he thought about it. He stands up when she arrives, bumps the table, steadies his coffee mug." },
  { type = "dialog", content = "Hey. Hi. You look — how are you?", props = { speaker = "npc", npcId = "npc_tom" } },
  { type = "paragraph", content = "He always asks how she is before he tells her anything about himself. He's the only man in Millfield who does that." }
]
exit_block = { type = "choices", choices = [
  { text = "Ask about his day", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -10 }] },
  { text = "Lean close when talking", targetType = "node", nodeId = "activity_coffee_tom.warm", conditions = { version = "1.0", items = [{ type = "trait", subject = "npc", npc_id = "npc_tom", trait_key = "devotion", operator = "gte", value = 22 }] } },
  { text = "Touch his thigh under the table", targetType = "node", nodeId = "activity_coffee_tom.kiss", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "npc", npc_id = "npc_tom", trait_key = "devotion", operator = "gte", value = 42 }, { type = "flag", subject = "player", flag_key = "tom_kiss_unlocked", operator = "is_true" }] } },
  { text = "Guide his hand between your legs", targetType = "node", nodeId = "activity_coffee_tom.foreplay", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "npc", npc_id = "npc_tom", trait_key = "devotion", operator = "gte", value = 62 }, { type = "flag", subject = "player", flag_key = "tom_groping_unlocked", operator = "is_true" }] } }
] }

[[canvases.nodes]]
id = "warm"
name = "Lean Close"
blocks = [
  { type = "paragraph", content = "She leans across the table. Her hand on his arm. She says something — it doesn't matter what — while her thumb traces circles on the inside of his wrist. His pulse is visible. He loses his train of thought mid-sentence and just looks at her." },
  { type = "paragraph", content = "The waitress refills their coffee and says, \"You two are cute.\" Tom turns the color of ketchup." }
]
exit_block = { type = "choices", choices = [
  { text = "Keep talking", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 2 }, { targetType = "player", trait = "energy", op = "add", value = -10 }] },
  { text = "Smile and pull away", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 1 }, { targetType = "player", trait = "confidence", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -10 }] }
] }

[[canvases.nodes]]
id = "kiss"
name = "Under the Table"
blocks = [
  { type = "paragraph", content = "Under the table, her hand finds his thigh. She squeezes once. He freezes. His fork clatters. She doesn't move her hand. Just lets it rest there, warm, possessive, while they talk about nothing. Her fingers creep higher. His voice goes up half an octave." },
  { type = "dialog", content = "Emma, we're in—", props = { speaker = "npc", npcId = "npc_tom" } },
  { type = "dialog", content = "I know where we are.", props = { speaker = "player" } }
]
exit_block = { type = "choices", choices = [
  { text = "Pull away and smile", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 3 }, { targetType = "player", trait = "corruption", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -10 }] },
  { text = "Whisper 'Later'", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 2 }, { targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "energy", op = "add", value = -10 }] }
] }

[[canvases.nodes]]
id = "foreplay"
name = "His Hand"
blocks = [
  { type = "paragraph", content = "She takes his hand under the table. Guides it to her thigh. Higher. His breathing changes. The waitress is across the room. An older couple in the far booth. His fingers touch the hem of her skirt and he makes a sound that he covers with a cough." },
  { type = "paragraph", content = "She controls his hand — where it goes, how long it stays. She's looking at him the whole time, eating her pie with the other hand like nothing is happening." },
  { type = "dialog", content = "You're doing great, Tom.", props = { speaker = "player" } },
  { type = "paragraph", content = "He nearly dies." }
]
exit_block = { type = "choices", choices = [
  { text = "That's enough for today", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 4 }, { targetType = "player", trait = "reputation", op = "add", value = -1 }, { targetType = "player", trait = "energy", op = "add", value = -10 }] },
  { text = "Let him continue", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 3 }, { targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "reputation", op = "add", value = -2 }, { targetType = "player", trait = "energy", op = "add", value = -10 }] }
] }

# ---- TOM ACTIVITY 2: "Visit Tom" (Emma's Room) ----
[[canvases]]
id = "activity_visit_tom"
name = "Visit Tom"
description = "Tom comes to Emma's room. Escalates from talking to full intimacy."
is_repeatable = true

[canvases.trigger]
location = "loc_bar_emma_room"
is_repeatable = true
npc = "npc_tom"
max_triggers_per_day = 1
priority = 1

[canvases.trigger.conditions]
version = "1.0"
items = [
  { type = "flag", subject = "player", flag_key = "tom_kiss_unlocked", operator = "is_true" }
]

[[canvases.trigger.schedules]]
start_time = "19:00"
end_time = "23:59"
weekdays = []

[[canvases.nodes]]
id = "base"
name = "The Visit"
blocks = [
  { type = "dialog", content = "Come over.", props = { speaker = "player" } },
  { type = "paragraph", content = "He's at her door in twenty minutes, hair freshly combed, smelling like soap. He sits on the edge of her bed and can't figure out what to do with his hands. She puts on music — anything to fill the nervous silence." }
]
exit_block = { type = "choices", choices = [
  { text = "Just talk", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -15 }] },
  { text = "Kiss him", targetType = "node", nodeId = "activity_visit_tom.kiss", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "npc", npc_id = "npc_tom", trait_key = "devotion", operator = "gte", value = 42 }, { type = "flag", subject = "player", flag_key = "tom_kiss_unlocked", operator = "is_true" }] } },
  { text = "Guide his hands", targetType = "node", nodeId = "activity_visit_tom.foreplay", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "npc", npc_id = "npc_tom", trait_key = "devotion", operator = "gte", value = 62 }, { type = "flag", subject = "player", flag_key = "tom_groping_unlocked", operator = "is_true" }] } },
  { text = "Teach him", targetType = "node", nodeId = "activity_visit_tom.intimate", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "npc", npc_id = "npc_tom", trait_key = "devotion", operator = "gte", value = 82 }, { type = "flag", subject = "player", flag_key = "tom_oral_unlocked", operator = "is_true" }] } },
  { text = "Take him to bed", targetType = "node", nodeId = "activity_visit_tom.intense", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "npc", npc_id = "npc_tom", trait_key = "devotion", operator = "gte", value = 82 }, { type = "flag", subject = "player", flag_key = "tom_sex_unlocked", operator = "is_true" }] } }
] }

[[canvases.nodes]]
id = "kiss"
name = "The Kiss"
blocks = [
  { type = "paragraph", content = "She pulls him in by his collar. He still kisses like he's asking permission — soft, careful, his hands hovering near her waist. She grabs his hands and puts them on her hips." },
  { type = "dialog", content = "You can touch me, Tom.", props = { speaker = "player" } },
  { type = "paragraph", content = "He does. Gently. Too gently. She tightens his grip with her hands over his." }
]
exit_block = { type = "choices", choices = [
  { text = "Pull back", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 2 }, { targetType = "player", trait = "energy", op = "add", value = -15 }] },
  { text = "Keep teaching", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 2 }, { targetType = "player", trait = "corruption", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -15 }] }
] }

[[canvases.nodes]]
id = "foreplay"
name = "Guided Touch"
blocks = [
  { type = "paragraph", content = "She puts him on the bed. Straddles him. Takes his hands and places them — here, then here, then here. He follows instructions. He's getting better at this. When she moans — real, not performed — his face lights up like he's solved something." },
  { type = "dialog", content = "There. Just like that.", props = { speaker = "player" } }
]
exit_block = { type = "choices", choices = [
  { text = "That's enough for tonight", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 2 }, { targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "energy", op = "add", value = -15 }] },
  { text = "Don't stop", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 3 }, { targetType = "player", trait = "confidence", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -15 }] }
] }

[[canvases.nodes]]
id = "intimate"
name = "Good Boy"
blocks = [
  { type = "paragraph", content = "She pushes him back on the bed." },
  { type = "dialog", content = "Your turn to practice.", props = { speaker = "player" } },
  { type = "paragraph", content = "She's taught him technique over multiple visits and he's improved. He goes down on her with the earnest focus of a student who wants to pass." },
  { type = "dialog", content = "Slower. Right there. Don't stop.", props = { speaker = "player" } },
  { type = "paragraph", content = "When she finishes, she runs her fingers through his hair." },
  { type = "dialog", content = "Good boy.", props = { speaker = "player" } },
  { type = "paragraph", content = "The words hit him like a drug. Every time." }
]
exit_block = { type = "choices", choices = [
  { text = "Hold him after", targetType = "trigger", time_progression_minutes = 90, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 3 }, { targetType = "player", trait = "confidence", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -15 }] },
  { text = "Tell him what he did right", targetType = "trigger", time_progression_minutes = 90, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 2 }, { targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "energy", op = "add", value = -15 }] }
] }

[[canvases.nodes]]
id = "intense"
name = "On Top"
blocks = [
  { type = "paragraph", content = "She's on top. Always on top with Tom. She controls the pace, controls his hands, controls when he's allowed to finish. He's completely surrendered to her direction. When she pins his wrists, he doesn't resist — he arches into it." },
  { type = "paragraph", content = "Afterward, he lies there looking at her like she invented oxygen. She traces patterns on his chest and thinks about the next man she needs to see this week." }
]
exit_block = { type = "choices", choices = [
  { text = "Stay with him", targetType = "trigger", time_progression_minutes = 90, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 3 }, { targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "energy", op = "add", value = -15 }] },
  { text = "Send him home", targetType = "trigger", time_progression_minutes = 90, effects = [{ targetType = "npc", npcId = "npc_tom", trait = "devotion", op = "add", value = 2 }, { targetType = "player", trait = "confidence", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -15 }] }
] }

# ---- RAY ACTIVITY 1: "Evening at the Bar (Ray Focus)" ----
[[canvases]]
id = "activity_bar_ray"
name = "Drinks with Ray"
description = "Drinking with Ray at the bar. Escalates from quiet companionship to parking lot encounters."
is_repeatable = true

[canvases.trigger]
location = "loc_bar_floor"
is_repeatable = true
npc = "npc_ray"
max_triggers_per_day = 1
priority = 1

[canvases.trigger.conditions]
version = "1.0"
items = [
  { type = "flag", subject = "player", flag_key = "phase_1_complete", operator = "is_true" }
]

[[canvases.trigger.schedules]]
start_time = "17:00"
end_time = "22:00"
weekdays = []

[[canvases.nodes]]
id = "base"
name = "The Bar"
blocks = [
  { type = "paragraph", content = "The bar at evening. Ray is at his usual stool — end of the bar, back against the wall, clear sightline to the door. A beer in front of him, half-finished. He doesn't look up when she walks in. She sits two stools down. Orders whiskey. The silence between them is comfortable in a way conversation with Tom never is." }
]
exit_block = { type = "choices", choices = [
  { text = "Sit near him, drink quietly", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_ray", trait = "interest", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -15 }, { targetType = "player", trait = "money", op = "add", value = -5, clamp = false }] },
  { text = "Ask about his work, touch his forearm", targetType = "node", nodeId = "activity_bar_ray.warm", conditions = { version = "1.0", items = [{ type = "trait", subject = "player", trait_key = "confidence", operator = "gte", value = 20 }] } },
  { text = "Whisper something about last time", targetType = "node", nodeId = "activity_bar_ray.kiss", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "player", trait_key = "confidence", operator = "gte", value = 40 }, { type = "flag", subject = "player", flag_key = "ray_kiss_unlocked", operator = "is_true" }] } },
  { text = "Follow him to his truck in the parking lot", targetType = "node", nodeId = "activity_bar_ray.foreplay", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 50 }, { type = "flag", subject = "player", flag_key = "ray_groping_unlocked", operator = "is_true" }] } }
] }

[[canvases.nodes]]
id = "warm"
name = "The Touch"
blocks = [
  { type = "paragraph", content = "She puts her hand on his forearm. Leaves it there. He looks at her hand. Then at her. His jaw tightens — not rejection. Control. He's controlling the response she can see. But underneath her palm, his pulse is faster than his face lets on." },
  { type = "paragraph", content = "He covers her hand with his for two seconds. Then removes it. Drinks his beer. But those two seconds — she felt his callouses, his warmth, the grip that held back." }
]
exit_block = { type = "choices", choices = [
  { text = "Stay and drink", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_ray", trait = "interest", op = "add", value = 2 }, { targetType = "player", trait = "confidence", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -15 }, { targetType = "player", trait = "money", op = "add", value = -5, clamp = false }] },
  { text = "Leave him wanting", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_ray", trait = "interest", op = "add", value = 1 }, { targetType = "player", trait = "confidence", op = "add", value = 2 }, { targetType = "player", trait = "energy", op = "add", value = -15 }, { targetType = "player", trait = "money", op = "add", value = -5, clamp = false }] }
] }

[[canvases.nodes]]
id = "kiss"
name = "The Whisper"
blocks = [
  { type = "paragraph", content = "She leans close. Whispers in his ear — something about the staircase, about his hands, about what she's thinking right now. His grip on his beer tightens. The bartender is ten feet away. Other drinkers around them." },
  { type = "dialog", content = "You can't say that here.", props = { speaker = "npc", npcId = "npc_ray" } },
  { type = "dialog", content = "I just did.", props = { speaker = "player" } }
]
exit_block = { type = "choices", choices = [
  { text = "Walk away smiling", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_ray", trait = "interest", op = "add", value = 3 }, { targetType = "player", trait = "reputation", op = "add", value = -1 }, { targetType = "player", trait = "energy", op = "add", value = -15 }, { targetType = "player", trait = "money", op = "add", value = -5, clamp = false }] },
  { text = "Hold his gaze", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_ray", trait = "interest", op = "add", value = 2 }, { targetType = "player", trait = "corruption", op = "add", value = 1 }, { targetType = "player", trait = "energy", op = "add", value = -15 }, { targetType = "player", trait = "money", op = "add", value = -5, clamp = false }] }
] }

[[canvases.nodes]]
id = "foreplay"
name = "The Parking Lot"
blocks = [
  { type = "paragraph", content = "Bar closing. She follows him to the parking lot. His truck is in the dark corner — always parked furthest from the door, old habit. She leans against the hood. He stands in front of her." },
  { type = "paragraph", content = "He puts his hands on the hood, either side of her. Trapping her. His mouth on her neck. Her back arches against the truck. His hand under her jacket, under her shirt, on the warm skin of her stomach." },
  { type = "dialog", content = "We shouldn't—", props = { speaker = "npc", npcId = "npc_ray" } },
  { type = "dialog", content = "Then stop.", props = { speaker = "player" } },
  { type = "paragraph", content = "He doesn't stop." }
]
exit_block = { type = "choices", choices = [
  { text = "Push him away and go inside", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_ray", trait = "interest", op = "add", value = 4 }, { targetType = "player", trait = "reputation", op = "add", value = -2 }, { targetType = "player", trait = "energy", op = "add", value = -15 }, { targetType = "player", trait = "money", op = "add", value = -5, clamp = false }] },
  { text = "Pull him closer", targetType = "trigger", time_progression_minutes = 60, effects = [{ targetType = "npc", npcId = "npc_ray", trait = "interest", op = "add", value = 3 }, { targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "reputation", op = "add", value = -2 }, { targetType = "player", trait = "energy", op = "add", value = -15 }, { targetType = "player", trait = "money", op = "add", value = -5, clamp = false }] }
] }

