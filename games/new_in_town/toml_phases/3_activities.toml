  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 19 }
]

[[canvases.trigger.schedules]]
start_time = "09:00"
end_time = "22:00"
weekdays = []

[[canvases.nodes]]
id = "n1"
name = "The Drawer"
blocks = [
  { type = "paragraph", content = "The thing from Jolene's bathroom has been in her nightstand drawer for three days, buried under a Bible and a pack of tissues like that makes it less real. She's opened the drawer six times. Closed it five." },
  { type = "paragraph", content = "The sixth time, she takes it out. Holds it. It's heavier than she expected, and warm from being in the drawer, which is somehow worse. She turns it on. The buzzing sound fills the small room and she panics — checks the door is locked, checks it again, listens for Jolene in the hallway." },
  { type = "paragraph", content = "Silence. Just the buzzing and her own breathing." },
  { type = "paragraph", content = "What follows is clumsy and electric and over faster than she expected. She lies there afterward, staring at the ceiling, heart slamming, and she can't decide if she wants to cry or do it again. She does neither. She puts it back in the drawer. Under the Bible." },
  { type = "paragraph", content = "But she doesn't bury it as deep this time." }
]
exit_block = { type = "location", text = "Continue", config = { destinationType = "specific", locationId = "loc_bar_emma_room", time_progression_minutes = 30, effects = [{ targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "energy", op = "add", value = -10 }] } }

