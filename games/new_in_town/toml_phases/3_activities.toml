[[canvases.nodes]]
id = "warm"
name = "Eye Contact"
blocks = [
  { type = "paragraph", content = "He's cutting a board. She stands at the end, holding it steady. Their eyes meet over the sawdust. The saw makes a rhythmic sound. Neither speaks. He finishes the cut. Looks at her. The board is cut but neither of them lets go of their end." },
  { type = "dialog", content = "You're a quick learner.", props = { speaker = "npc", npcId = "npc_ray" } },
  { type = "dialog", content = "I had a good teacher.", props = { speaker = "player" } }
