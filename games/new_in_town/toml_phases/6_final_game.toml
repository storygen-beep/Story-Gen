# ── CITY STREETS ──

[[locations]]
id = "loc_city_streets"
name = "City Streets"
description = "A rough neighborhood in a city that doesn't care you're here. Graffiti on brick walls, bars on convenience store windows, a laundromat that's always open, and people who've learned to mind their own business. The bus dropped Emma off here with one suitcase and an address on a piece of paper. Two blocks east is campus. Two blocks in any other direction is someone else's problem."
image = "images/locations/city_streets.jpg"
image_search_queries = ["rough urban city street, gritty neighborhood, graffiti, convenience stores, afternoon, young woman arriving"]
is_container = false
parent = ""
entry_from = ""
default_entry = ""
navigation_order = ["loc_the_bar", "loc_campus", "loc_mall"]

# ── SHOPPING MALL ──

[[locations]]
id = "loc_mall"
name = "Shopping Mall"
description = "A strip mall at the edge of the neighborhood. Half the storefronts are shuttered with plywood and old FOR LEASE signs. Fluorescent light spills from the few places still open. A clothing shop with bright window displays, a check-cashing place with iron bars, and a nail salon that never opened."
