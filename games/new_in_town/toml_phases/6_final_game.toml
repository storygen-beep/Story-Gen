  { type = "paragraph", content = "A man is behind the counter. Big hands, rolled-up sleeves, counting bottles from a clipboard. He moves with the efficiency of someone who's done this ten thousand times. He doesn't look up." },
  { type = "paragraph", content = "This is Mick. Jolene's husband." },
  { type = "dialog", content = "You're the tenant. Jolene told me.", props = { speaker = "npc", npcId = "npc_mick" } },
  { type = "paragraph", content = "He still doesn't look up. Marks something on the clipboard." },
