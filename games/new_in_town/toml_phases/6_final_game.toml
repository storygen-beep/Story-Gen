[[canvases.nodes]]
id = "n1"
name = "The Ask"
blocks = [
  { type = "paragraph", content = "Emma waits until the bar is quiet — just two regulars and the TV. Jolene is wiping down the counter, cigarette behind her ear. Emma sits on a stool and doesn't order anything." },
  { type = "paragraph", content = "Jolene notices. She always notices." },
  { type = "dialog", content = "You're sitting there like a woman with a question. Ask it.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "Emma takes a breath." },
  { type = "dialog", content = "Do you need help? Behind the bar? I can learn.", props = { speaker = "player" } },
  { type = "paragraph", content = "Jolene stops wiping. Looks at her. Takes in the hoodie, the sneakers, the ponytail, the nervous hands. She doesn't laugh — but something in her expression says she's thinking about it." },
  { type = "image", props = { file = "images/story/asking_jolene_n1.jpg", search_queries = ["Young woman in hoodie sitting at bar counter, asking older woman bartender for a job, quiet dive bar, evening"] } }
]
exit_block = { type = "choices", choices = [
  { text = "Wait for her answer", targetType = "node", nodeId = "asking_jolene.n2" }
] }

[[canvases.nodes]]
id = "n2"
name = "The Answer"
blocks = [
  { type = "dialog", content = "You ever poured a drink in your life?", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "dialog", content = "No.", props = { speaker = "player" } },
  { type = "dialog", content = "You ever worked a crowd? Handled a drunk? Carried four glasses without dropping them?", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "dialog", content = "No.", props = { speaker = "player" } },
  { type = "paragraph", content = "Jolene leans on the bar. Studies her." },
  { type = "dialog", content = "You want to pour drinks for these guys looking like that? Hoodie and sneakers? They're not going to tip a girl who looks like she's doing homework.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "Emma doesn't know what to say to that. Jolene isn't being mean — she's being honest in the way that only Jolene is honest." },
  { type = "dialog", content = "Friday. Be down here at 8. Wear something that isn't a hoodie. I'll show you where everything is. If you don't break anything, you can have weekend shifts.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "She goes back to wiping the counter. The conversation is over." },
  { type = "paragraph", content = "Emma sits there for a moment. She got the job. She thinks. She's not entirely sure what she agreed to." },
  { type = "image", props = { file = "images/story/asking_jolene_n2.jpg", search_queries = ["Older woman bartender leaning on bar counter, studying younger woman, honest expression, quiet bar, mentor moment"] } }
]
exit_block = { type = "location", text = "Go upstairs", config = { destinationType = "specific", locationId = "loc_bar_emma_room", time_progression_minutes = 30, flagEffects = [{ targetType = "player", flag = "asked_jolene" }] } }


