# CANVAS 8: "The Lesson"
# ═══════════════════════════════════════════════════════════════

[[canvases]]
id = "bar_lesson"
name = "The Lesson"
description = "Next shift. Jolene doesn't lecture — she demonstrates. One sentence changes everything: 'They're not tipping the beer. They're tipping you.' Emma tries it. The tips go up. First method learned."

[canvases.trigger]
location = "loc_bar_floor"
is_active = true
is_repeatable = false
priority = 10
npc = "npc_jolene"

[canvases.trigger.conditions]
version = "1.0"
items = [
  { type = "flag", subject = "player", flag_key = "first_shift_done", operator = "is_true" }
]

[[canvases.trigger.schedules]]
weekdays = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time = "23:59"

[[canvases.nodes]]
id = "n1"
name = "The Sentence"
blocks = [
  { type = "paragraph", content = "Next shift. Emma is faster — she knows where the glasses are, she doesn't fumble the tap. But the tips are still thin. Coins. A dollar here. The regulars order from Jolene when they can." },
  { type = "paragraph", content = "During a quiet moment, Jolene leans against the back counter next to her. Lights a cigarette. Watches Emma pour a beer for a man who doesn't look at her." },
  { type = "dialog", content = "You know what your problem is?", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "Emma braces herself." },
  { type = "dialog", content = "You're serving beer. That's not the job. The beer is a prop. They can buy beer at a gas station for half the price. They're here for you. They tip you. Not the bottle. You.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "She takes a drag. Watches a regular signal for another round." },
  { type = "dialog", content = "Smile when you pour. Look at them when you hand it over. Say their name if you know it. Laugh if they're funny. They're not — but laugh anyway. That's the job.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "image", props = { file = "images/story/bar_lesson_n1.jpg", search_queries = ["Older woman bartender leaning against back counter, cigarette, giving advice to younger woman behind bar, quiet moment, dive bar"] } }
]
exit_block = { type = "choices", choices = [
  { text = "Try it", targetType = "node", nodeId = "bar_lesson.n2" }
] }

[[canvases.nodes]]
id = "n2"
name = "The Shift"
blocks = [
  { type = "paragraph", content = "A man holds up his empty glass. Emma takes it." },
  { type = "paragraph", content = "She pours. Slides it across the counter. Looks him in the eye and smiles — not her nervous smile, not the polite one. Something warmer. Something that says I see you." },
  { type = "dialog", content = "Here you go.", props = { speaker = "player" } },
  { type = "paragraph", content = "The man blinks. Looks at her like he's seeing her for the first time. \"Thanks, sweetheart.\" He leaves three dollars on the bar. Last time he left fifty cents." },
  { type = "paragraph", content = "She does it again. And again. She laughs at a joke that isn't funny. She remembers a regular's name — 'Same as last time, Dave?' — and Dave tips her five dollars and tells her she's a natural." },
  { type = "paragraph", content = "She's not a natural. She's performing. And it's working." },
  { type = "paragraph", content = "End of the night. She counts." },
  { type = "paragraph", content = "$45." },
  { type = "paragraph", content = "Jolene sees the pile. Nods once." },
  { type = "dialog", content = "See? They're not tipping the beer.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "Emma puts the money in her pocket. $45. More than double last time. She earned it — but not with her hands. With her smile. With eye contact. With a performance she didn't know she could give." },
  { type = "paragraph", content = "Something shifts. Small, but real. Presentation has value. Attention is currency. She just learned her first method." },
  { type = "image", props = { file = "images/story/bar_lesson_n2.jpg", search_queries = ["Young woman behind bar smiling confidently at customer, sliding drink across counter, warm lighting, growing into the role"] } }
]
exit_block = { type = "location", text = "Go upstairs", config = { destinationType = "specific", locationId = "loc_bar_emma_room", time_progression_minutes = 240, effects = [{ targetType = "player", trait = "money", op = "add", value = 45 }, { targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "confidence", op = "add", value = 2 }], flagEffects = [{ targetType = "player", flag = "bar_lesson_learned" }] } }


