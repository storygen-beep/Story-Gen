[[canvases.nodes]]
id = "n1"
name = "Behind the Bar"
blocks = [
  { type = "paragraph", content = "8pm. Friday. Emma is behind the bar in a t-shirt she found at the bottom of her suitcase — the best she could do for 'not a hoodie.' Jolene hands her an apron." },
  { type = "dialog", content = "Beer taps are labeled. Liquor's on the wall — read the bottles. If someone orders a cocktail, come get me. Don't break the glasses — they cost more than you do tonight.", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "paragraph", content = "The bar fills up. Emma pours beers. Slowly. She fumbles the tap twice, overfills a glass, and spills foam on the counter. A regular holds up his empty glass and waves it at her. She scrambles." },
  { type = "paragraph", content = "A man orders a whiskey sour. She stares at the bottles. Jolene appears behind her, makes it in thirty seconds without looking, slides it across the counter, and is already laughing at something someone said." },
  { type = "image", props = { file = "images/story/first_shift_n1.jpg", search_queries = ["Young woman nervously working behind a dive bar, fumbling with beer tap, busy bar night, apron, overwhelmed"] } }
]
exit_block = { type = "choices", choices = [
  { text = "Survive the night", targetType = "node", nodeId = "first_shift.n2" }
] }

[[canvases.nodes]]
id = "n2"
name = "The Difference"
blocks = [
  { type = "paragraph", content = "She watches Jolene. Not on purpose — she can't help it. Jolene moves through the bar like she owns the air in it. She leans on the counter when a man talks, laughs with her whole body, touches a regular's arm when she hands him a drink. She calls them 'hon' and 'baby' and they eat it up." },
  { type = "paragraph", content = "Same bar. Same customers. Same drinks. But the tip jar on Jolene's side of the bar is full. Emma's side has coins and a crumpled five." },
  { type = "paragraph", content = "Last call. The bar empties. Emma counts her tips on the counter." },
  { type = "paragraph", content = "$18." },
  { type = "paragraph", content = "Jolene counts hers without looking. Folds the bills, stuffs them in her back pocket." },
  { type = "dialog", content = "How'd you do?", props = { speaker = "npc", npcId = "npc_jolene" } },
  { type = "dialog", content = "Eighteen dollars.", props = { speaker = "player" } },
  { type = "paragraph", content = "Jolene doesn't say anything. She doesn't have to. The number says it all." },
  { type = "paragraph", content = "Emma wipes down the bar and tries not to think about the difference. She thinks about the difference." },
  { type = "image", props = { file = "images/story/first_shift_n2.jpg", search_queries = ["Young woman counting small amount of tip money on bar counter, end of night, empty bar, tired, disappointed"] } }
]
exit_block = { type = "location", text = "Go upstairs", config = { destinationType = "specific", locationId = "loc_bar_emma_room", time_progression_minutes = 240, effects = [{ targetType = "player", trait = "money", op = "add", value = 18 }], flagEffects = [{ targetType = "player", flag = "first_shift_done" }] } }


