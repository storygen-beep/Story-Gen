# ═══════════════════════════════════════════════════════════════
# NPCs
# ═══════════════════════════════════════════════════════════════

# ── NPC 1: Jolene — Bar Owner / Landlady ──
[[npcs]]
id = "npc_jolene"
name = "Jolene"
description = "44, co-owns the bar with her husband Mick. Blunt, loud, unapologetic. Smokes behind the counter, pours drinks in a tank top, and says exactly what she thinks. She took one look at Emma dragging a suitcase through the door and saw a version of herself twenty years ago. She's not cruel — but she's not gentle either. She rents the room, sets the rules, and doesn't pretend the world is kind."
portrait = "jolene.jpg"
core_traits = { mentorship = 0 }
flag_keys = []

# ── NPC 2: Mick — Jolene's Husband / Bar Manager ──
[[npcs]]
id = "npc_mick"
name = "Mick"
description = "47, Jolene's husband. Runs the business side of the bar — inventory, money, maintenance. Big hands, quiet efficiency. He's not unfriendly, but he doesn't do small talk or excuses. He's heard every story from every tenant who couldn't make rent and he stopped listening years ago. Practical, direct, and immovable on money. He and Jolene run the bar like a machine — she's the front, he's the engine."
portrait = "mick.jpg"
core_traits = { love = 0, trust = 10, corruption = 0 }
flag_keys = []

# ── NPC 3: Professor Harlan — Literature Professor ──
[[npcs]]
id = "npc_harlan"
name = "Professor Harlan"
description = "Mid-40s, literature professor at Emma's commuter college. Tall, lean, salt-and-pepper stubble, reading glasses he takes off when he wants to make a point. Charismatic in the way only men who've spent decades performing in front of classrooms can be — every sentence lands, every pause is timed. He noticed Emma on her first day and hasn't stopped noticing. His office door is always open. His compliments are always just personal enough to make her wonder. He writes recommendation letters that open doors. He also locks his office door sometimes."
portrait = "professor_harlan.jpg"
core_traits = { love = 0, trust = 0, corruption = 0 }
flag_keys = []

