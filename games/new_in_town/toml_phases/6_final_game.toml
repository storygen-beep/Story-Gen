schema_version = "0.2"
starting_canvas = "opening_arrival"

[settings]
clothing_enabled = true
wardrobe_location = "loc_bar_emma_room"
shop_location = "loc_clothing_shop"

[settings.clothing_requirements]
body_coverage = true
always_required = ["shoes"]

[settings.clothing_requirements.conditional.bra]
until_flag = "learned_seduction"
message = "Emma isn't ready to go braless yet."

[settings.clothing_requirements.conditional.underwear]
until_flag = "discovered_teasing"
message = "Emma isn't bold enough to go without underwear yet."

[settings.rent]
enabled = true
amount = 150
due_day = "Monday"
collector_npc = "npc_mick"
grace_periods = 1

# ═══════════════════════════════════════════════════════════════
# PROJECT METADATA
# ═══════════════════════════════════════════════════════════════

[project]
id = "new_in_town"
title = "New In Town"
description = """
Emma, a 21-year-old from a sheltered background, arrives in a rough city for college. \
She rents a room above a bar owned by Jolene and her husband Mick. She has $500 to her name. \
Rent is $150 a week. She quickly learns that to get what you want here, you have to find methods.
"""

# ═══════════════════════════════════════════════════════════════
# TIME SYSTEM
# ═══════════════════════════════════════════════════════════════

[time]
enabled = true
starting_hour = 14
starting_day = "Monday"
starting_week = 1

