  { type = "dialog", content = "Rent's Monday. Every Monday. I don't chase people. You're late, you get one warning. After that I change the lock. Nothing personal — I've had twelve tenants in five years and I've changed the lock on four of them.", props = { speaker = "npc", npcId = "npc_mick" } },
  { type = "paragraph", content = "He puts down the clipboard. Looks at her for the first time. Not unkind — just assessing. The same look the city gave her at the bus stop." },
  { type = "dialog", content = "You need anything fixed, tell Jolene. You need anything else — figure it out.", props = { speaker = "npc", npcId = "npc_mick" } },
  { type = "paragraph", content = "He goes back to his bottles. Emma drinks her coffee and feels like she just signed a contract she hasn't fully read." },
