  { type = "paragraph", content = "The campus library — they're fully staffed. The woman behind the desk doesn't even take her name." },
  { type = "paragraph", content = "A diner two blocks from campus — they need a dishwasher. Weekends, 6am to noon. $9 an hour. She does the math in her head standing right there at the counter: $108 a week before taxes. Rent is $150." },
  { type = "dialog", content = "Can I think about it?", props = { speaker = "player" } },
  { type = "paragraph", content = "The manager shrugs. \"Spot won't last.\"" },
