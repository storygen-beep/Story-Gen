[[canvases.nodes]]
id = "n1"
name = "The Walk"
blocks = [
  { type = "paragraph", content = "Monday morning. Emma walks to campus. Twenty minutes through city blocks — past the convenience store with bulletproof glass, the laundromat, two guys on a stoop who watch her pass and say nothing." },
  { type = "paragraph", content = "Campus is different. Cleaner. Louder with a different kind of energy — students who look like they've been here forever, groups already formed, inside jokes she doesn't get. Everyone knows where they're going. Emma checks the map on her phone three times in five minutes." },
  { type = "paragraph", content = "Registration is fine. Financial aid covers tuition — that's the one thing that worked. She finds her first classroom. Sits in the back. Takes notes. Feels invisible in a way that's becoming familiar." },
  { type = "image", props = { file = "images/story/campus_day_one_n1.jpg", search_queries = ["Young woman walking through urban college campus, concrete buildings, other students in groups, alone, backpack, first day"] } }
]
exit_block = { type = "choices", choices = [
  { text = "Go to the bookstore", targetType = "node", nodeId = "campus_day_one.n2" }
] }

[[canvases.nodes]]
id = "n2"
name = "The Cost"
blocks = [
  { type = "paragraph", content = "The campus bookstore. She finds her required textbooks — four classes, four books. She stacks them on the counter and the cashier scans them." },
  { type = "paragraph", content = "$380." },
  { type = "paragraph", content = "She stares at the number. She has $200 left after next Monday's rent. $200 minus $380 is a number that doesn't work." },
  { type = "paragraph", content = "She puts two books back. Keeps the ones she can't survive without. $90." },
  { type = "paragraph", content = "The cashier doesn't react. This happens every semester." },
  { type = "paragraph", content = "Walking home, she passes a coffee shop with a HELP WANTED sign in the window. She stops. Reads it. Part-time, minimum wage, experience preferred." },
  { type = "paragraph", content = "She does the math again. Minimum wage, part-time, after taxes — it wouldn't cover rent and books. Not even close." },
  { type = "paragraph", content = "She stares at the sign for a long time. Then she keeps walking." },
  { type = "paragraph", content = "There has to be something better. She just doesn't know what yet." },
  { type = "image", props = { file = "images/story/campus_day_one_n2.jpg", search_queries = ["Young woman in campus bookstore looking at price, holding textbooks, worried expression, deciding what to put back"] } }
]
exit_block = { type = "choices", choices = [
  { text = "Walk home", targetType = "location", locationId = "loc_bar_emma_room", time_progression_minutes = 240, effects = [{ targetType = "player", trait = "money", op = "add", value = -90 }], flagEffects = [{ targetType = "player", flag = "campus_started" }] }
] }


