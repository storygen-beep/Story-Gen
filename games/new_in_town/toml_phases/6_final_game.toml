name = "The Walk Home"
blocks = [
  { type = "paragraph", content = "She walks home. Past the convenience store, past the laundromat, past the stoop where two guys sit and don't say anything." },
  { type = "paragraph", content = "Minimum wage, part-time, no experience. Every job she qualifies for pays less than her rent. The math is simple and it's brutal: the honest route doesn't add up." },
  { type = "paragraph", content = "She turns the corner and there it is — the bar. Her building. Neon sign buzzing in the window. Through the glass she can see Jolene behind the counter, pouring something for a man in a work jacket. The bar is busy. Tips are changing hands. Money is moving." },
  { type = "paragraph", content = "The job is right under her feet. It's been there the whole time." },
