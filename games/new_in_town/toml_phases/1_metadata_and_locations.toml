# ── NPC 1: Jolene — The Catalyst / Landlady ──
[[npcs]]
id = "npc_jolene"
name = "Jolene"
description = "42, owns The Dusty Boot — Millfield's only bar. Divorced twice. Chain-smokes in a silk robe. Walks around in underwear like it's nothing. She treats sex like appetite. She sees Emma and recognizes the girl she was 20 years ago. Her corruption method is exposure: thin walls, open doors, frank conversation, dares, and the refusal to be ashamed. Non-romantic catalyst in Phase 1, mentor and wingwoman in Phase 2."
portrait = "jolene.jpg"
core_traits = { mentorship = 0 }
flag_keys = []

# ── NPC 2: Tom — The Deputy (CORRUPTION driver) ──
[[npcs]]
id = "npc_tom"
name = "Tom"
description = "Town deputy. Earnest, bumbling, painfully wholesome. Tall, fit, objectively attractive, and completely helpless around Emma. He's a virgin who has kissed two girls at church camp. Every stammer, every blush, every dropped coffee cup is proof of her effect on him. The appeal is power over someone who gives it willingly."
portrait = "tom.jpg"
core_traits = { devotion = 0 }
flag_keys = []

# ── NPC 3: Ray — The Handyman (SEDUCTION driver) ──
[[npcs]]
id = "npc_ray"
name = "Ray"
description = "44, local handyman. Weathered, quiet, competent. Strong hands, sun-darkened skin. He doesn't notice Emma — she's 'the schoolteacher,' 'a nice kid.' His resistance isn't moral or emotional — it's perceptual. She literally doesn't exist in his sexual awareness until she forces herself into it. Drinks at the bar every evening."
portrait = "ray.jpg"
core_traits = { interest = 0 }
flag_keys = []

# ── NPC 4: Mark — The Student's Father (FORBIDDEN driver) ──
[[npcs]]
id = "npc_mark"
name = "Mark"
description = "Parent of a student. Handsome, hollow, respectable. The suburban dad who does everything right and feels nothing. Good jaw, pressed shirts. His wife Karen is on the PTA. Getting caught doesn't just hurt Emma — it detonates a family. The taboo is the engine. His guilt must be managed like a throttle."
portrait = "mark.jpg"
core_traits = { desire = 0, guilt = 0 }
flag_keys = []

# ── NPC 5: Jake — The Bartender (DOMINANCE driver) ──
[[npcs]]
id = "npc_jake"
name = "Jake"
description = "Bartender at Jolene's bar. Cocky, tattooed, effortlessly attractive. Lazy smile, lean build, zero depth. He tried his moves on 'old Emma' and got shut down. The game isn't sex — it's submission. Making the cocky guy beg. Power starts at 100 (his) and shifts toward 0 (hers) with every interaction she wins."
portrait = "jake.jpeg"
core_traits = { power = 100 }
flag_keys = []

