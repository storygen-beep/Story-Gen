starting_canvas = "opening_arrival"

# ═══════════════════════════════════════════════════════════════
# PROJECT METADATA
# ═══════════════════════════════════════════════════════════════

[project]
id = "new_in_town"
title = "New In Town"
description = """
Emma, a 23-year-old sheltered schoolteacher, moves to the small town of Millfield. \
Her landlady Jolene — unapologetic, sexually liberated — cracks her open through \
exposure and frank conversation. Once awakened, Emma discovers power over men. \
She targets four: Tom the innocent deputy, Ray the indifferent handyman, Mark the \
forbidden married father, and Jake the cocky bartender. Each requires a different \
strategy. The town watches everything. Reputation is survival. Time and money are \
scarce. Every choice costs something.
"""

