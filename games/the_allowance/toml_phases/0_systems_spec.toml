# =============================================================================
# The Allowance — 0_systems_spec
# Built with author-game-v2. Spec: games/the_allowance/the_want.md
#
# METERS, THREE LAYERS (references/the-board.md §3):
#   1  RATCHETING TIERS  nerve · seen · price · appetite  — rungs at 15/35/55/75
#   2  VOLATILE STATE    arousal · energy · hygiene · money
#   3  PER-CHARACTER     relation · lust — on each [[npcs]] block
#   +  COUNTERWEIGHT     standing — starts 100, buys nothing, is what she pays with
#
# THE SPINE: her father charges board and hands out an allowance, at the same
# table, on the same night. She receives £36 a week from the shop against a £50
# demand. To pay her father she has to ask her father. Every tier is a different
# way of getting out from under that arithmetic.
# =============================================================================

schema_version = "1.0"

[project]
id              = "the_allowance"
title           = "The Allowance"
description     = "She was supposed to leave in September and the money wasn't there. Nineteen, in the room she was eight in, with a father who takes fifty a week off everyone in the house and hands back whatever she can justify out loud, at the kitchen table, in front of her brother and her uncle and her mother."
starting_canvas = "canvas_sunday"
quests_engine   = "v2"

[time]
starting_hour = 18
starting_day  = "Sunday"   # the game opens ninety minutes before the envelope
starting_week = 1

[settings]
narration_person  = "second"        # IMMUTABLE once v0.1 ships
clothing_enabled  = true
wardrobe_location = "her_room"


# ─── Board — the obligation, and the ENGINE charges it ───────────────────────
# the-economy.md R3. £50 on a Sunday against a £36 Saturday shift: structurally
# short by fourteen, every week, forever. That gap is the game.
#
# ⚠️ NO AUTHORED CANVAS NARRATES THE PAYMENT. [settings.rent] takes the money at
#    midnight on due_day. The measured failure was a game that wrote the scene of
#    handing money over and never charged a penny for it, because the prose and
#    the charge were two different systems and only one of them was checked. The
#    authored scenes here sit BESIDE the charge — the ask before, the table after.
#
# ⚠️ eviction_mode = "flag_set", NOT "game_end". A product that never ends must
#    not have a lose-state that stops play. Short means the terms change.
[settings.rent]
enabled          = true
amount           = 50
due_day          = "Sunday"
collector_npc    = "npc_martin"
grace_periods    = 1
start_after_flag = "first_envelope"
eviction_mode    = "flag_set"
eviction_flag    = "board_short"

[settings.rent.text]
title            = "Sunday"
scene            = "He does it at the table with the envelope already out and a biro that does not work, which he tests on the corner of it every single week and is surprised by every single week. Your mother is in her coat for nights. Joss is eating standing up. Gareth is here because Gareth is always here."
greeting         = "Right. Board."
paid_scene       = "You count it out and he counts it again in front of you, and writes the number on the envelope under last week's number, in a column, going down the back of it. There are eleven weeks on that envelope."
paid_response    = "Fifty. Ta, love. That's you square."
paid_closing     = "He puts it in the tin on top of the fridge and the lid goes on and everybody at that table hears the lid go on."
cant_pay         = "You haven't got it."
warning_scene    = "You say you're short. He does not look up straight away. He finishes the number he is writing, which is not your number, and then puts the biro down flat and squares it with the edge of the envelope before he says anything at all."
warning_response = "How short. — Right. Next Sunday, then. Both of them, next Sunday."
warning_closing  = "He says it perfectly kindly. Joss is looking at his plate with an expression you will be thinking about at two in the morning."
eviction_scene_soft    = "The second Sunday he does not get the envelope out. He waits until your mother has gone for the bus and Joss has gone up, and then he puts two mugs of tea down and sits opposite you with his hands round his, and looks at you properly for the first time in about a year."
eviction_response_soft = "We'll stop doing it in money, then. You and me'll work something out."
eviction_closing_soft  = "He does not say what. He does not have to — it sits down at the table with the pair of you, and then he takes the mugs to the sink and rinses them, and that is Sunday."


[theme]
mode = "dark"


# ─── The next step, on every screen ──────────────────────────────────────────
# The band strings say where she IS. This says what to do about it, from the same
# cards as the Quests page, so the two cannot drift (engine.md §23).
[[sidebar_items]]
type = "quest_next"
max  = 4          # one live card per ascent tier


# =============================================================================
# THE ASCENT TIERS — four kinds of going-further, so a player who does not want
# one can still climb another. Rungs at 15/35/55/75 (the-board.md §3).
#
# Band text is UI VOICE (the-voice.md R1): it names a state plainly and never
# performs. The register lives after the click.
#
# ⚠️ The top band's `max` is left OFF — a banded value outside every band renders
#    nothing at all (engine.md §30), and 75 IS the top rung.
# ⚠️ Every one of these keys is `hidden` in [[traits.labels]] below, or the raw
#    number prints underneath the words (engine.md §30, gate 27).
# =============================================================================

# NERVE — how far she'll go with blood.
[[sidebar_items]]
type  = "trait_status_text"
trait = "nerve"
bands = [
  { min = 0,  max = 14, text = "Careful around them" },
  { min = 15, max = 34, text = "Stopped managing it" },
  { min = 35, max = 54, text = "Lets it happen" },
  { min = 55, max = 74, text = "Starts it herself" },
  { min = 75, text = "It's just the arrangement" },
]

# SEEN — how much she lets herself be looked at, in a house with no locks.
[[sidebar_items]]
type  = "trait_status_text"
trait = "seen"
bands = [
  { min = 0,  max = 14, text = "Dressed for the landing" },
  { min = 15, max = 34, text = "Not covering up" },
  { min = 35, max = 54, text = "Not hurrying either" },
  { min = 55, max = 74, text = "Uses the house like she's alone" },
  { min = 75, text = "Wants the walking-in" },
]

# PRICE — what she'll take money for, and how openly.
[[sidebar_items]]
type  = "trait_status_text"
trait = "price"
bands = [
  { min = 0,  max = 14, text = "Asks for what she needs" },
  { min = 15, max = 34, text = "Asks for more than she needs" },
  { min = 35, max = 54, text = "Takes what she'd have refused" },
  { min = 55, max = 74, text = "Says the figure out loud" },
  { min = 75, text = "Sets the number herself" },
]

# APPETITE — what she wants for its own sake, with nothing on the table.
# ⚠️ A RATCHET, not arousal. Arousal is layer-2 weather and moves both ways.
[[sidebar_items]]
type  = "trait_status_text"
trait = "appetite"
bands = [
  { min = 0,  max = 14, text = "Notices she's been waiting" },
  { min = 15, max = 34, text = "Goes looking" },
  { min = 35, max = 54, text = "Asks with no cover story" },
  { min = 55, max = 74, text = "Doesn't wait to be asked" },
  { min = 75, text = "Stops being asked" },
]

# The counterweight. Falls as she asks, itemises and accepts. It buys nothing by
# design — it is the price, not a currency, so it has no gates and owes no
# content, and it is deliberately NOT in board.ascent_tiers.
[[sidebar_items]]
type  = "trait_status_text"
trait = "standing"
bands = [
  { min = 0,  max = 24, text = "Nothing left to keep up" },
  { min = 25, max = 49, text = "Stopped keeping it up" },
  { min = 50, max = 74, text = "Still the one who nearly left" },
  { min = 75, max = 100, text = "The one who's going in September" },
]

# Body-need. Banded, and hidden, same as the rest.
[[sidebar_items]]
type  = "trait_status_text"
trait = "energy"
bands = [
  { min = 0,  max = 24, text = "Running on nothing" },
  { min = 25, max = 59, text = "Tired" },
  { min = 60, max = 100, text = "Alright" },
]

# Countable resource — a bar with the FIGURE showing, and NO bands.
# You never band a thing the player counts (the-meters.md M7). She is budgeting
# against a stated deadline; the number is the whole point.
[[sidebar_items]]
type       = "trait_bar"
trait      = "money"
hide_value = false


# ─── Trait labels ────────────────────────────────────────────────────────────
# ⚠️ Every banded key above MUST appear here with hidden = true, or the auto
