hidden = true


# =============================================================================
# THE DAY ROLLOVER — [engine.daily_tick] (engine.md §28)
#
# ⚠️ THIS IS THE BRAKE THE LAST THREE v2 GAMES SHIPPED WITHOUT. Every rung in
#    this architecture is TRIGGERLESS — a canvas reached by a hub choice — so
#    `max_triggers_per_day` does not apply to it (it is read off the trigger,
#    v2.py:11017). The pair that works is: set a `_today` flag on the rung's exit,
#    gate the hub choice on that flag being false, and clear it here.
#
# ⚠️ FLAGS, NEVER A COUNTER TRAIT. A player trait read only by `lt` reads to gate
#    10 as a meter that closes content, and the author then files a bug against a
#    gate that was right (the-meters.md M5).
# =============================================================================
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "nerve_rung_today",    op = "unset" },
  { targetType = "player", flag = "seen_rung_today",     op = "unset" },
  { targetType = "player", flag = "price_rung_today",    op = "unset" },
  { targetType = "player", flag = "appetite_rung_today", op = "unset" },
  { targetType = "player", flag = "shift_done_today",    op = "unset" },
  { targetType = "player", flag = "asked_today",         op = "unset" },
]


# =============================================================================
# GUIDANCE — [[quest_cards]] (engine.md §23; the-voice.md R2/R3/R5)
#
# ⚠️ NO `version = "1.0"` ON A QUEST CARD. Quest conditions use a separate
#    evaluator with NO fail-open (checkQuestsCondition, v2.py:14878).
#
# ⚠️ `terminal = true` ON THE LAST CARD OF EVERY ARC, or a goal-less card draws
#    no frame and reads as an objective with nothing ticked. Exactly ONE card in
#    the game sets `terminal_text` — the build-boundary badge — and it is nerve,
#    because nerve is the tier the locked door hangs off.
#
# ⚠️ Every goal label names a PLACE and a VERB, and a WINDOW where the thing is
#    schedule-gated (R3). And every label names a choice gated ONE RUNG BELOW its
#    own goal — a card telling you to click a thing that needs the number you are
#    trying to reach is circular, and that shipped once already (engine.md §23).
# =============================================================================

# ── NERVE ────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 10
text     = "Five adults, one bathroom, and a bolt that turns without catching. You have spent nineteen years managing the distance in this house — when you cross the landing, what you cross it in, how long you leave between his door opening and yours."
tip      = "Stop managing it. Cross the landing when your brother is awake, not after."
when     = [ { trait = "nerve", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "nerve", subject = "player", op = "gte", value = 15, label = "Cross the landing without waiting — the landing, afternoons" } ]

[[quest_cards]]
priority = 10
text     = "You stopped timing it and nobody died. Joss is awake from two, your mother is asleep until three, and that hour has started being a room you both happen to be standing in."
tip      = "When it happens, don't move away from it. That is the whole rung."
when     = [ { trait = "nerve", subject = "player", op = "gte", value = 15 },
             { trait = "nerve", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "nerve", subject = "player", op = "gte", value = 35, label = "Don't move away — Joss's room, 14:00-17:00" } ]

[[quest_cards]]
priority = 10
text     = "It happens now and neither of you calls it anything. What has not happened is you being the one who starts it, and the difference between those two is the only thing keeping the word off it."
tip      = "Start it. His room in the afternoon, or the box room after eleven."
when     = [ { trait = "nerve", subject = "player", op = "gte", value = 35 },
             { trait = "nerve", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "nerve", subject = "player", op = "gte", value = 55, label = "Start it yourself — the box room, after 23:00" } ]

[[quest_cards]]
priority      = 10
terminal      = true
terminal_text = "Three of them, and the fourth door still shut"
text          = "Your brother, your uncle, and the man who writes the number on the envelope. What is left is the back bedroom, which is the only door in this house you still knock on, and your mother, who has been in it the whole time. Both open in a future update."
when          = [ { trait = "nerve", subject = "player", op = "gte", value = 55 } ]

# ── SEEN ─────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 11
text     = "You get dressed to walk eleven feet to a bathroom. You have always done it and you have never once thought about why, and this week you have started thinking about why."
tip      = "Come out of the bathroom in the towel instead of dressing in there."
when     = [ { trait = "seen", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "seen", subject = "player", op = "gte", value = 15, label = "Cross in the towel — the bathroom, mornings" } ]

[[quest_cards]]
priority = 11
text     = "The towel stopped being a decision about a week ago. What you still do is hurry — you cross fast, and you close things, and you listen first, and all three of those are work."
tip      = "Stop hurrying. Take the landing at walking pace with the bathroom door open."
when     = [ { trait = "seen", subject = "player", op = "gte", value = 15 },
             { trait = "seen", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "seen", subject = "player", op = "gte", value = 35, label = "Leave the door open and don't hurry — the bathroom" } ]

[[quest_cards]]
priority = 11
text     = "Inside the house you have stopped covering anything. Outside it you are still a girl in a coat at a bus stop, and the parade is four shops and a bench and every single person on it has known you since you were small."
tip      = "Take the parade the way you take the landing. Bench, bus stop, shop front."
when     = [ { trait = "seen", subject = "player", op = "gte", value = 35 },
             { trait = "seen", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "seen", subject = "player", op = "gte", value = 55, label = "Sit on the bench in it — the parade, daytime" } ]

[[quest_cards]]
priority = 11
terminal = true
text     = "There is nothing in this house you close any more and the parade has stopped being outside. What is left is being seen on purpose, by someone chosen, which is a different tier and continues in a future update."
when     = [ { trait = "seen", subject = "player", op = "gte", value = 55 } ]

# ── PRICE ────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 12
text     = "Fifty a week, Sunday, at the table. The shop pays thirty-six. Everybody in this house has watched you do that sum in your head and nobody has ever offered to do it for you."
tip      = "Ask for more than the thing costs. Sunday, at the table, out loud."
when     = [ { trait = "price", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "price", subject = "player", op = "gte", value = 15, label = "Ask for more than you need — the kitchen, Sunday evening" } ]

[[quest_cards]]
priority = 12
text     = "You have started padding the itemised list and he has started not checking, and neither of those is the interesting one. The interesting one is Joss, who does not do lists, and who put a ten on your windowsill in March and has never mentioned it."
tip      = "Take money from somebody who is not your father, and take it in the room."
when     = [ { trait = "price", subject = "player", op = "gte", value = 15 },
             { trait = "price", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "price", subject = "player", op = "gte", value = 35, label = "Take what Joss offers — his room, afternoons" } ]

[[quest_cards]]
priority = 12
text     = "Money has come off three people in this house and not one figure has ever been said out loud. It gets left on sills and folded into your hand and put under the tin, and the silence is doing work for everybody except you."
tip      = "Say the number first, before he does. The box room after eleven."
when     = [ { trait = "price", subject = "player", op = "gte", value = 35 },
             { trait = "price", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "price", subject = "player", op = "gte", value = 55, label = "Say the figure out loud — the box room, after 23:00" } ]

[[quest_cards]]
priority = 12
terminal = true
text     = "You name it and it gets paid, by three of the four of them. The fourth is the envelope itself — the column down the back of it in biro, eleven weeks of it, still in his handwriting. Reversing that is the top of this ladder and it opens in a future update."
when     = [ { trait = "price", subject = "player", op = "gte", value = 55 } ]

# ── APPETITE ─────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 13
text     = "Everything in this house so far has had a reason attached — the money, the room, the sum that does not work. None of it has been because you wanted it, and you have noticed that you have started waiting for the afternoons."
tip      = "Go up in the afternoon with nothing to ask for. Your room, your bed."
when     = [ { trait = "appetite", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "appetite", subject = "player", op = "gte", value = 15, label = "Go up with nothing to ask for — her room, afternoons" } ]

[[quest_cards]]
priority = 13
text     = "You go looking now. You know where everyone is at three in the afternoon without checking, and you did not learn that on purpose, and you cannot un-know it."
tip      = "Listen at the wall instead of waiting for the house to hand you something."
when     = [ { trait = "appetite", subject = "player", op = "gte", value = 15 },
             { trait = "appetite", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "appetite", subject = "player", op = "gte", value = 35, label = "Listen at the wall — her room, after 23:00" } ]

[[quest_cards]]
priority = 13
text     = "There is always a cover story. The bathroom, the washing, the thing you came down for. You have got very good at them and they have started to be the tiring part rather than the useful part."
tip      = "Ask for it with nothing in your hands and no reason to be in the room."
when     = [ { trait = "appetite", subject = "player", op = "gte", value = 35 },
             { trait = "appetite", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "appetite", subject = "player", op = "gte", value = 55, label = "Turn up with no reason — Joss's room, 14:00-17:00" } ]

[[quest_cards]]
priority = 13
terminal = true
text     = "You do not wait to be asked and you have stopped explaining why you are in a room. The top of this one is the house doing it back — coming to you, without being started, whether or not it is a good afternoon for it. That opens in a future update."
when     = [ { trait = "appetite", subject = "player", op = "gte", value = 55 } ]


# =============================================================================
# PER-CHARACTER CARDS — one live at a time per person (pickQuestsCard returns the
# single highest-priority match), each ending in a terminal card so no ladder
# retires into silence (the-voice.md R5, gate 15).
# =============================================================================

[[quest_cards]]
priority = 20
npc_id   = "npc_martin"
text     = "Sunday, six o'clock, the envelope and the biro that does not work. He asks a follow-up question about every line and he asks it kindly, in front of your mother and your brother and his brother, and that is the whole of your relationship with your father this year."
tip      = "Sunday evening at the table. Ask for a line he cannot audit."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_martin", op = "lt", value = 25 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_martin", op = "gte", value = 25, label = "Ask for a line he can't check — the kitchen, Sunday 18:00" } ]

[[quest_cards]]
priority = 21
npc_id   = "npc_martin"
text     = "He has stopped asking the follow-up questions and started leaving the kitchen light on. Half nine to eleven, once your mother has gone for the bus, there is an hour in this house with two people awake in it and one of them writes the numbers."
tip      = "Take the late kitchen. Half nine, after your mother's gone."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_martin", op = "gte", value = 25 },
             { trait = "relation", subject = "npc", npc_id = "npc_martin", op = "lt", value = 50 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_martin", op = "gte", value = 50, label = "Stay down after she's gone — the kitchen, 21:30-23:00" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_martin"
terminal = true
text     = "The column on the back of the envelope stopped being the only ledger in this kitchen some weeks ago. He still writes it. He writes it while you are stood there. His arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_martin", op = "gte", value = 50 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_joss"
text     = "Depot nights, home at six, asleep by seven, up again at two. His door is opposite yours and his window and yours both give onto the flat roof over the kitchen. He noticed before anyone and he has not said so, which for Joss is restraint."
tip      = "Two till five, his room. He is the only one awake."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_joss", op = "lt", value = 25 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_joss", op = "gte", value = 25, label = "Go in while he's awake — his room, 14:00-17:00" } ]

[[quest_cards]]
priority = 21
npc_id   = "npc_joss"
text     = "He says the thing out loud. Not to be cruel — because saying it is cheaper than not saying it, and because he has worked out that you have nowhere to put it. He also puts money on your windowsill and never mentions that either."
tip      = "Take the roof. Out your window, not through the landing."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_joss", op = "gte", value = 25 },
             { trait = "relation", subject = "npc", npc_id = "npc_joss", op = "lt", value = 50 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_joss", op = "gte", value = 50, label = "Out the window onto the roof — her room, afternoons" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_joss"
terminal = true
text     = "He keeps a running total now and says it out loud, and the horrible part is that he is the only person in this house who tells you the number before you have to ask for it. His arc continues in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_joss", op = "gte", value = 50 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_gareth"
text     = "Your uncle, in the box room since the divorce, putting a bit toward things. He is in the house from one in the afternoon until he goes up, he has an opinion on what you should be given, and no standing whatsoever to have one."
tip      = "The box room after eleven. He does not sleep and everybody knows it."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_gareth", op = "lt", value = 25 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_gareth", op = "gte", value = 25, label = "Knock after eleven — the box room, 23:00-01:00" } ]

[[quest_cards]]
priority = 21
npc_id   = "npc_gareth"
text     = "He apologises before, during and after, and he pays before you have said a number, and the two of those together are the most honest transaction in this house. He is also the one who will be gone first."
tip      = "Let him pay. Then say what it is for, in the room, with the door shut."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_gareth", op = "gte", value = 25 },
             { trait = "relation", subject = "npc", npc_id = "npc_gareth", op = "lt", value = 50 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_gareth", op = "gte", value = 50, label = "Name it out loud — the box room, after 23:00" } ]

[[quest_cards]]
priority = 19
npc_id   = "npc_gareth"
terminal = true
text     = "He thanks you. Every time, without fail, and it does not get less bad. The box room takes whichever relative is between things and he will not be in it forever — the next one arrives in a future update."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_gareth", op = "gte", value = 50 } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_denise"
