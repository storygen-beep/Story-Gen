is_repeatable = false
priority      = 11
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "first_envelope",   operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "first_night_done", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "the_bolt"
name = "The bolt"
blocks = [
  { type = "image", props = { file = "scenes/first_night_bolt.jpg", description = "A small dated bathroom door seen from inside with an old sliding bolt at eye height.", search_queries = ["old bathroom door bolt latch interior", "worn bathroom door lock small british house"] } },
  { type = "paragraph", content = "Half eleven. The house has gone down to the fridge and the boiler. You get the bolt across and it goes across easily, which is the thing you have never once thought about." },
  { type = "paragraph", content = "The door has dropped. It sits against the frame rather than in it, so the bolt is across an inch of air. You have known that since you were about fourteen and it has never meant anything before tonight." },
  { type = "cascade", props = { beats = [
    { advance_text = "Try it.", blocks = [
        { type = "paragraph", content = "You put a hand on the handle from the inside and pull. The door opens against the bolt. Not far — an inch, maybe two — and then it stops, and it would keep stopping, and anybody outside would only have to lean." },
