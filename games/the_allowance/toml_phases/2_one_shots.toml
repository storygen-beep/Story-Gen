    { advance_text = "Get in the bath.", blocks = [
        { type = "paragraph", content = "You get in anyway. The water runs too hot and then cold and you stand under it doing the sum again, fourteen a week, and the sum is not the thing you are actually thinking about." },
        { type = "paragraph", content = "You are thinking about the inch." },
    ] },
  ] } },
]
exit_block = { type = "choices", choices = [
