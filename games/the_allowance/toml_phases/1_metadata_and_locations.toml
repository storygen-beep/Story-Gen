# =============================================================================
# The Allowance — 1_metadata_and_locations
#
# ⚠️ [player], [[locations]], [[npcs]] and [[npcs.schedules]] MUST share this one
#    file. TOML scoping re-parents nested tables across a file boundary.
#
# THE HOUSE IS ROOMS, NOT ONE LOCATION. Presence and occupancy are per-location
# in this engine, so room-level co-location — the whole engine of a household
# game — only works if the rooms are locations.
#
# ANCHOR = the_kitchen, budgeted at 3,200 of ~10,700 (30%). This terrace has no
# separate lounge; the kitchen-diner IS the room the house lives in, and it is
# also the room that prices things. That is the premise expressed as a floor plan.
#
# ⚠️ the_back_bedroom ships LOCKED. It is the door this release ends on (gate 9)
#    AND the room the Want owes at nerve 75 (the-map.md R2) — declaring it now
#    costs 300 words and prevents the measured failure where a promised room was
#    never built.
# =============================================================================

[player]
id           = "player"
name         = "Nell"
description  = "Nineteen, in the room she was eight in, with a Saturday job that does not cover her board."
customizable = false      # deferred: needs [[player.customization_fields]]; v0.1 ships fixed

[player.core_traits]
# layer 1 — ratcheting ascent tiers (rungs at 15/35/55/75)
nerve    = 0
seen     = 0
price    = 0
appetite = 0
standing = 100      # counterweight: what she pays with
# layer 2 — volatile state
arousal  = 0
energy   = 100
hygiene  = 100
money    = 14       # short of board on turn one, on purpose

# Decay is a POSITIVE MAGNITUDE — the validator rejects negatives.
[player.trait_decay]
hygiene = 10
energy  = 8


# =============================================================================
# LOCATIONS — 9. Derived, not picked: seven rooms the declared rotas visit, plus
# the exterior the map owes (the-map.md R3), plus the one non-household workplace.
# =============================================================================

# ── ANCHOR ───────────────────────────────────────────────────────────────────
[[locations]]
id                   = "the_kitchen"
name                 = "The Kitchen"
description          = "Kitchen-diner through the back, and the only room downstairs, so it is the room this house lives in. The table has four chairs and a fifth brought in from the garden. There is a kettle that has to be held down, an airer with somebody's washing on it permanently, and his chair at the end nearest the door. The back step is where people go to not be in the room."
image                = "locations/the_kitchen.jpg"
image_search_queries = ["small british kitchen diner table evening", "worn family kitchen table chairs back door"]
navigation_order     = ["the_landing", "the_parade"]

[[locations]]
id                   = "the_landing"
name                 = "The Landing"
description          = "Four doors and the airing cupboard, and eleven feet of carpet between the bathroom and your room. The board outside the bathroom gives you away and always has. From the bannister you can see straight down into the hall and hear the kitchen."
image                = "locations/the_landing.jpg"
image_search_queries = ["narrow upstairs landing four doors carpet", "house upstairs hallway airing cupboard light"]
entry_from           = "the_kitchen"
navigation_order     = ["her_room", "joss_room", "the_bathroom", "the_box_room", "the_back_bedroom"]

[[locations]]
id                   = "her_room"
name                 = "Her Room"
description          = "The room you were eight in, with the same wardrobe and a bed you have had since you were eleven. The sash window gives onto the flat roof over the kitchen, which is how you got in at sixteen and how Joss still does. The door catch does not hold unless you lift the handle."
image                = "locations/her_room.jpg"
image_search_queries = ["small girls bedroom single bed wardrobe daylight", "teenage bedroom sash window terraced house"]
entry_from           = "the_landing"
navigation_order     = []

[[locations]]
id                   = "joss_room"
name                 = "Joss's Room"
description          = "Directly opposite yours across the eleven feet. Blackout stuff taped over the window because he sleeps days, a work bag by the door that smells of the depot, and an ashtray on the sill he is not supposed to have. His window gives onto the same flat roof as yours."
image                = "locations/joss_room.jpg"
image_search_queries = ["young mans bedroom blackout curtains messy", "small bedroom work bag ashtray windowsill"]
entry_from           = "the_landing"
navigation_order     = []

# ── the occupancy engine ─────────────────────────────────────────────────────
[[locations]]
id                   = "the_bathroom"
name                 = "The Bathroom"
description          = "One bathroom, five adults. The bolt turns but the door has dropped, so it sits against the frame rather than in it, and a hand on the handle opens it. The mirror over the sink is the only full-length thing in the house if you stand back far enough. There is an immersion switch by the door and it costs money to leave on."
image                = "locations/the_bathroom.jpg"
image_search_queries = ["small dated british bathroom bath shower mirror", "cramped family bathroom sink mirror steam"]
entry_from           = "the_landing"
navigation_order     = []

# ── the renewable slot — and it renews IN BLOOD ──────────────────────────────
[[locations]]
id                   = "the_box_room"
name                 = "The Box Room"
description          = "Barely a room, and it shares a wall with yours. Whoever in this family is between things ends up in it — there is a single bed against that wall, a sill with somebody's things on it, and a door that catches on the carpet and has to be shoved. Your uncle is in it now. He will not be in it forever."
image                = "locations/the_box_room.jpg"
image_search_queries = ["tiny box room single bed bare walls suitcase", "small spare bedroom cluttered sill daylight"]
entry_from           = "the_landing"
navigation_order     = []

# ── the door this release ends on ────────────────────────────────────────────
# the-map.md R2 + the-release.md "every release ends on an opening". The Want
# sells this room at nerve 75, so it exists NOW, locked, with in-world text.
[[locations]]
id                   = "the_back_bedroom"
name                 = "The Back Bedroom"
description          = "Your parents' room. Your mother is asleep in it from eight in the morning until three in the afternoon with the door shut, and your father is in it from eleven at night. It is the only door in this house you still knock on."
image                = "locations/the_back_bedroom.jpg"
image_search_queries = ["dim double bedroom curtains closed daytime", "parents bedroom small terraced house bed drawers"]
entry_from           = "the_landing"
navigation_order     = []
entry_conditions     = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "nerve", operator = "gte", value = 75 },
] }
blocked_message      = "She is asleep in there until three. You have knocked on this door your whole life and you have never once opened it without being told to."

# ── the exterior ─────────────────────────────────────────────────────────────
[[locations]]
id                   = "the_parade"
name                 = "The Parade"
description          = "Four shops, a bench, and a bus stop with the timetable scratched off. One stop from the house or twenty-five minutes on foot. Everybody on it has known you since you were small, which is the entire difference between being looked at here and being looked at at home."
image                = "locations/the_parade.jpg"
image_search_queries = ["small british shopping parade bench bus stop", "row of shops suburban parade grey afternoon"]
entry_from           = "the_kitchen"
navigation_order     = ["the_shop"]
costs                = { time = 25 }

[[locations]]
id                   = "the_shop"
name                 = "The Shop"
description          = "Col's. A counter, a till with a drawer that sticks, a stockroom you are not really supposed to be in on your own, and a shutter that takes both hands. Saturdays, eight till two, thirty-six pounds in a brown envelope with your name spelled right."
image                = "locations/the_shop.jpg"
image_search_queries = ["small convenience shop counter till interior", "corner shop stockroom shelves fluorescent light"]
entry_from           = "the_parade"
navigation_order     = []


# =============================================================================
# CHARACTERS — 5. Each needs >=1 standing surface and >=1 schedule row (gate 6).
#
# ⚠️ SCHEDULES BIND TO THE [[npcs]] BLOCK ABOVE THEM. Never insert a new
#    character between an existing one and its schedule rows.
# ⚠️ A day-specific overnight window needs TWO rows; an all-days one needs one
#    (the-board.md §2 — the weekday check runs against TODAY before the wrap).
# ⚠️ ENGINE LIMIT: requires_npc is a single string and portraits render one card
#    per NPC. Two interactive family members CANNOT share a scene.
#
# THE GRID — three windows, three different men, one witness:
#   afternoon 14:00-17:00  Denise asleep, Martin out       -> Joss
#   evening   17:00-21:00  the full table                  -> Gareth, and price
#   late      21:30-23:00  Denise gone, Joss gone to depot  -> Martin
# =============================================================================

[[npcs]]
id          = "npc_martin"
name        = "Martin"
description = "Your father, fifty-two. He takes fifty a week off everyone in this house and writes it on the back of an envelope in a column, and he asks a follow-up question about every line you ask for, kindly, in front of everybody. He is not cruel. He is procedural, and nineteen years of it is the only relationship you have with him."
portrait    = "martin.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["The envelope", "Not asking the follow-up", "Leaving the light on", "Not writing it down"]

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "17:00"
end_time   = "21:30"
activity   = "at the table with the radio on"

# The late window — the hour with two people awake in the house.
[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "21:30"
end_time   = "23:00"
activity   = "still down, with the big light off"

[[npcs.schedules]]
location   = "the_bathroom"
weekdays   = [0, 1, 2, 3, 4]
start_time = "06:00"
end_time   = "06:30"
activity   = "in the bathroom before work"


[[npcs]]
id          = "npc_joss"
name        = "Joss"
description = "Your brother, twenty-two. Depot nights, home at six, asleep by seven, up again at two — so he is the only person awake in this house in the afternoons. He noticed before anyone did and he has not said so, which for Joss counts as restraint. He is also the only one who will say a number out loud."
portrait    = "joss.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["Noticed", "Saying it", "Pricing it", "Keeping the total"]

[[npcs.schedules]]
location   = "joss_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "14:00"
end_time   = "17:00"
activity   = "awake and not dressed, door open"

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "17:00"
end_time   = "21:00"
activity   = "eating standing up before his shift"

[[npcs.schedules]]
location   = "the_bathroom"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "06:30"
end_time   = "07:00"
activity   = "in off nights, washing the depot off"


[[npcs]]
id          = "npc_denise"
name        = "Denise"
description = "Your mother, forty-nine. Nights at the care home, in at half six, asleep by eight, up at three. She is in this house every hour of every day and she is the only person in it who could stop any of this. She has come close to asking twice."
portrait    = "denise.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["In her coat", "Asking twice", "Not asking", "—"]

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "06:30"
end_time   = "08:00"
activity   = "in from nights, coat still on, not eating"

# The witness, asleep. This row is what makes the afternoon window exist.
[[npcs.schedules]]
location   = "the_back_bedroom"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "08:00"
end_time   = "15:00"
activity   = "asleep with the door shut and the curtains drawn"

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "15:00"
end_time   = "21:00"
activity   = "up, in the kitchen, getting ready for nights"

[[npcs.schedules]]
location   = "the_bathroom"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "21:00"
end_time   = "21:30"
activity   = "in the bathroom before the bus"


# ── THE RENEWABLE SLOT — and it renews IN BLOOD ──────────────────────────────
# The Vaseys take in whichever relative is between things. Gareth now; a cousin
# next; an aunt after. A new character at an EXISTING location is the measured
# release shape, and doing it with family means the taboo does not reset.
[[npcs]]
id          = "npc_gareth"
name        = "Gareth"
description = "Your uncle, forty-five. Your father's younger brother, in the box room since the divorce, putting a bit toward things. He has an opinion on what you should be given and absolutely no standing to have one. He apologises before, during and after, and he pays before you have said a number."
portrait    = "gareth.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["Putting a bit toward things", "Apologising", "Paying first", "Thanking you"]

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "13:00"
end_time   = "23:00"
activity   = "at the table, in the way, with the paper"

# ✅ Wraps midnight in ONE row because it covers every weekday — setup.isCurrent-
#    TimeSlot handles the wrap (v2.py:3784). A day-specific row would need two.
[[npcs.schedules]]
location   = "the_box_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "23:00"
end_time   = "10:00"
activity   = "in the box room with the light on, not sleeping"


[[npcs]]
id          = "npc_col"
name        = "Col"
description = "Forty-one, and he has had the shop on the parade for eleven years. Not related to you and never going to be. He pays thirty-six pounds for six hours in a brown envelope with your name spelled right, which makes him the only stated price in your entire week."
portrait    = "col.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["The Saturday girl", "Trusted with the till", "Given the key", "—"]

[[npcs.schedules]]
location   = "the_shop"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "08:00"
end_time   = "18:00"
activity   = "behind the counter or shouting from the stockroom"


