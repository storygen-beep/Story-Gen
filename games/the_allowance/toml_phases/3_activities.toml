# =============================================================================
# The Allowance — 3_activities
# STANDING surfaces (the room, or herself) and the TRIGGERED layer.
# Content aimed at a PERSON lives in 5_scenes as a portrait hub, never here
# (the-surfaces.md R1, the object test).
#
# ⚠️ EVERY RUNG THAT GRANTS AN ASCENT TIER CARRIES TWO BRAKES (the-meters.md M4):
#     1. `costs` on the trigger — engine-enforced, an unaffordable rung is not
#        offered (v2.py:4625)
#     2. a `<tier>_rung_today` FLAG set on the exit, gated `is_false` on the
#        canvas, cleared in [engine.daily_tick]
#    A flag, NEVER a counter trait — a player trait read only by `lt` reads to
#    gate 10 as a descent (the-meters.md M5).
#
# ⚠️ ROOM-SCOPED vs TENANT-SCOPED in the box room. Everything in THIS file names
#    the occupant by ROLE — "whoever's in the box room", "your uncle" only where
#    the role is the point. Gareth's own ladder, register and props live in
#    5_scenes and die with him when the slot rotates (the-board.md §2).
#
# ⚠️ EVERY LOCATION CARRIES ONE trigger_mode = "random" EVENT (the-surfaces.md R6
#    mechanism 4). The last two v2 games shipped zero between them.
# =============================================================================


# ═════════════════════════════════════════════════════════════════════════════
# THE KITCHEN — the anchor. The table prices things; the rest of the room is
# where you wait to be priced.
# ═════════════════════════════════════════════════════════════════════════════

[[canvases]]
id          = "activity_the_ask"
name        = "Ask for more than you need"
description = "PRICE rung @the_kitchen, Sunday 17:00-21:00, requires the table. Brakes: costs 10 energy + price_rung_today. +3 price, -4 standing, pays 6-12 money. The spine of the game as a repeatable click — the itemised list, out loud, in front of four people."

[canvases.trigger]
location      = "the_kitchen"
is_repeatable = true
priority      = 5
is_active     = true
costs         = [ { trait = "energy", value = 10 } ]
schedules     = [ { weekdays = [6], start_time = "17:00", end_time = "21:00" } ]
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "first_envelope",    operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "price_rung_today",  operator = "is_false" },
] }

[[canvases.nodes]]
id   = "ask"
name = "The list"
blocks = [
  { type = "paragraph", content = "The envelope is out and the biro still does not work. You have the list in your head and you have padded it — bus fare that is really two fares, tights that you do not need yet, the phone." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "price", operator = "lt", value = 15 },
  ] } }, blocks = [
    { type = "paragraph", content = "Saying it out loud is the whole cost. Four people in a kitchen, and you itemising a fiver, and your uncle looking at the paper he is not reading." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_martin" }, content = "Two fares? Where's the second one to?" },
    { type = "paragraph", content = "You have an answer ready. He accepts it. He writes the number down and the biro drags and he goes over it twice." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "price", operator = "gte", value = 15 },
    { type = "trait", subject = "player", trait_key = "price", operator = "lt",  value = 55 },
  ] } }, blocks = [
    { type = "paragraph", content = "You have got good at this. The trick is one line he can audit and one he cannot, and putting the one he cannot second, when he is already writing." },
    { type = "paragraph", content = "He stopped asking about the phone in about week six. That was the first thing you ever won in this kitchen and nobody but you knows it happened." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_joss" }, content = "Twenty-five. She's on the up." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "price", operator = "gte", value = 55 },
  ] } }, blocks = [
    { type = "paragraph", content = "You say the figure first now. Before the question, before the biro, straight over the top of whatever he was going to open with, and he writes it." },
    { type = "paragraph", content = "He has stopped asking what it is for. That is not generosity and both of you know it — it is that the answer stopped being a thing he wanted said out loud at his own table." },
    { type = "thought_bubble", props = { speaker = "player" }, content = "Eleven weeks of his handwriting on that envelope. Six of them are numbers you chose." },
  ] },
]
exit_block = { type = "location", text = "Take it.", config = { destinationType = "specific", locationId = "the_kitchen", time_progression_minutes = 20, effects = [
  { targetType = "player", trait = "price",    op = "add", value = 3,  clamp = true },
  { targetType = "player", trait = "standing", op = "add", value = -4, clamp = true },
  { targetType = "player", trait = "money",    op = "add", value = 8,  clamp = false },
], flagEffects = [
  { targetType = "player", flag = "price_rung_today", op = "set" },
  { targetType = "player", flag = "asked_today",      op = "set" },
] } }


