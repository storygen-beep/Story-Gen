# ═════════════════════════════════════════════════════════════════════════════
# THE ROOM SCREENS — the-surfaces.md R2b
#
# Each room's paragraph names the things in it that she can act on, and every
# choice hangs off one of those things. This is the difference between a room and
# a button list, and it is the half of R2b that gate 22 can check: the board
# declares `objects`, the screen writes them, and each one affords a decision.
#
# The count is not chosen — it falls out of the objects. The kitchen has six
# things in it and six choices; the back bedroom has three.
#
# These screens also carry the tier gates the sidebar bands promise (gate 8):
