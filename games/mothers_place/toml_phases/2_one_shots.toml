# Phase 2/7 — 2_one_shots.toml
# Mother's Place — fire-once one-shots (boot + capstones added by beats)
# Register: Lane 4 / opening — earned, once-only. Field-name rule: effects use
# targetType/npcId/trait/flag/op; predicates use subject/npc_id/trait_key/flag_key/operator.

# ─────────────────────────────────────────────────────────────────────────────
# CANVAS — Homecoming (the cold open; starting_canvas)
# ─────────────────────────────────────────────────────────────────────────────
# Auto-fires at loc_home on a fresh game (after the customization screen). Names the
# cast + the ties + the premise in prose (opening doctrine). Sets game_started.

[[canvases]]
id          = "canvas_homecoming"
name        = "Homecoming"
description = "Cold open. Cora arrives back at the family house. Establishes the broke return, the absent mother, Roy/Wes/Maddie, and the dawning charge. Sets game_started."

[canvases.trigger]
location      = "loc_home"
is_repeatable = false
priority      = 12
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "game_started", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "intro"
name = "Homecoming"
blocks = [
  { type = "image", props = { file = "scenes/canvas_homecoming.jpg" } },
  { type = "paragraph", content = "The bus drops you at the end of the road and you walk the last quarter mile with everything you own in one duffel. Twenty-five years old and crawling back to the house you grew up in, because the job's gone and the money's gone and there is nowhere else that has to take you in." },
  { type = "paragraph", content = "The house looks smaller. The grass is dead. Your father's truck is in the drive next to a car up on ramps that isn't going anywhere. You stand on the porch a second before you try the door, the way you'd knock at a stranger's." },
  { type = "cascade", props = { beats = [
    { advance_text = "Go inside.", blocks = [
        { type = "paragraph", content = "The TV's on in the living room, blue light and a ballgame nobody's watching. Your father — Roy — is in his chair with a can on the armrest and three more dead beside it. He looks up at you like it takes him a second to place you, and then like it costs him something when he does." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "There she is. Look at you. God." },
    ] },
    { advance_text = "Look at the house.", blocks = [
        { type = "paragraph", content = "From the garage comes the clatter of a wrench thrown down harder than it needs to be — Wes, your older brother, not coming in to say hello. Down the hall a door is shut with the bass thudding behind it, your kid sister Maddie sealed in. And on the wall by the kitchen, the calendar's still turned to a month a year gone — the month your mother packed a bag and didn't come back." },
    ] },
    { advance_text = "Take it in.", blocks = [
        { type = "paragraph", content = "Her chair's still at the head of the table. Her coat's still on the hook. The dishes are a week deep and nobody's been to the store. Three men and a girl coming apart in a house with the woman taken out of the middle of it, and not one of them able to say so." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "They need a woman in this house. And I've got nowhere else to be." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Drop your bags and stay."
targetType = "location"
locationId = "loc_home"
flagEffects = [
  { targetType = "player", flag = "game_started", op = "set" },
]

# End of phase 2. (Capstones added by their beats.)
