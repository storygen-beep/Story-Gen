# Phase 4/7 — 4_story_arc.toml
# Mother's Place — the spine quest card (Story Goals). Per-want + per-NPC cards are
# added at the legibility beat (beat_0030). quests_engine = "v2", so the Quests page
# must never be empty — this is the always-present spine.

# ─────────────────────────────────────────────────────────────────────────────
# SPINE — "Find your place in this house" (mechanic-mode; no npc_id -> Story Goals)
# ─────────────────────────────────────────────────────────────────────────────
# Shows from the start until the frontier is reached. Tracks corruption toward the
# matriarch end-state. tip names the next concrete actions with PLACE + TIME.
[[quest_cards]]
text       = "You came home with nothing. Make yourself useful, find a little money, and figure out what this family needs — and what being the one who gives it to them does to you."
ready_text = "The house is yours now. Run it."
tip        = "Make yourself useful — the Kitchen's a wreck (home, any time). Find work — the Bar in Town pays cash (afternoons & evenings). Walking into town costs you half an hour, so spend your days."
priority   = 100
when = [
  { flag = "frontier_reached", op = "is_false" },
]
goals = [
  { trait = "corruption", subject = "player", op = "gte", value = 50, label = "Corruption" },
]

# End of phase 4.
