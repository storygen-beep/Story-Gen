# Phase 1/7 — 1_metadata_and_locations.toml
# Mother's Place — player + all NPCs (schedules + core_traits) + all locations
# All [[npcs]] / [[npcs.schedules]] / [[npcs.core_traits]] MUST live in this one file.

# ─── Player ───────────────────────────────────────────────────────────────────

[player]
id          = "player"
name        = "Cora"
description = "Mid-twenties. Came home with nothing — job gone, money gone, nowhere else to land. Back in the house she grew up in, the one her mother walked out of a year ago."
portrait    = "cora.jpg"
customizable = true

[player.core_traits]
corruption    = 0
arousal       = 0
energy        = 100
hygiene       = 100
money         = 20      # broke — the household pressure
exhibitionism = 0

# ─── Player customization (start-of-game screen; auto-rendered before the boot) ──
# id="name" writes $player.name (the @player token); others write $player.<id>,
# read in prose via @player.<id>. Family speaks @player; descriptions use @player.build.
[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "Your name"
default = "Cora"

[[player.customization_fields]]
id      = "build"
type    = "select"
label   = "Your build"
default = "average"
options = ["petite", "average", "curvy", "athletic", "thick"]

[[player.customization_fields]]
id            = "look"
type          = "image_select"
label         = "Your look"
default       = "tired"
sets_portrait = true
options = [
  { id = "tired",   image = "players/cora_tired.jpg",   label = "Worn out" },
  { id = "pretty",  image = "players/cora_pretty.jpg",  label = "Pretty" },
  { id = "sharp",   image = "players/cora_sharp.jpg",   label = "Sharp" },
]

# ─── NPCs ─────────────────────────────────────────────────────────────────────
# Roy/Wes/Maddie — family cores: two-meter spine (corruption odometer + arousal
#   throttle); NO relation (family default), NO passive arousal tick (slow-burn earned).
# Vic — corrupting on-ramp/income node (relation, light). Brenda — witness (relation +
#   hidden awareness). Lynn — frontier antagonist (relation; offscreen until Act 2).

# ── Roy (father) ────────────────────────────────────────────────────────────────
[[npcs]]
id          = "npc_roy"
name        = "Roy"
description = "Your father. Fifties, broad and going soft, hands that still know an engine. Since your mother left he runs the shop into the ground by day and drinks the evenings flat. He looks at you doing her chores like something's coming loose behind his eyes."
portrait    = "roy.jpg"
core_traits = { corruption = 0, arousal = 0 }
flag_keys   = []
arc_stages  = [
  "Grieving",       # 0 — drinking through the silence
  "Opened up",      # 1 — roy_grief_shared
  "Wants you",      # 2 — roy_confessed
  "Crossed",        # 3 — roy_kissed
  "Yours",          # 4 — roy_first_done
  "Her place",      # 5 — took_dads_place
]

