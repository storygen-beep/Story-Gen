# ── Lynn (mother — frontier antagonist; OFFSCREEN until Act 2) ──────────────────
# No standing hub: her Act-2 scenes are flag-gated auto-fire capstones at home
# locations (gated lynn_returned), not schedule presence. Offscreen the whole game.
[[npcs]]
id          = "npc_lynn"
name        = "Lynn"
description = "Your mother. A year gone — ran off with a man and a forwarding address she never sent. The shape of her is still in this house: her clothes in the closet, her chair at the table, the woman everyone's waiting for. She has no idea you're becoming her."
portrait    = "lynn.jpg"
core_traits = { relation = 0 }
flag_keys   = []
arc_stages  = []

[[npcs.schedules]]
location = "loc_lynn_away"
weekdays = [0,1,2,3,4,5,6]
start_time = "00:00"
end_time = "00:00"
activity = "gone"

# ─── Locations ────────────────────────────────────────────────────────────────
# Nested-zones, TWO ROOTS (Home + Town) bridged by walk activities (phase 3).
# Standing hubs are NOT is_container (containers swallow attached canvases).
# All 13 reachable; no door-locks (content gated by traits/flags/occupancy).

# ── Home root ────────────────────────────────────────────────────────────────
[[locations]]
id               = "loc_home"
name             = "Home"
description      = "The house you grew up in. It opens off a short front hall — the kitchen one way, the living room ahead, the bedrooms down the back. A year without your mother shows in every room: dishes, dust, the quiet of men who've stopped trying."
navigation_order = [
  "loc_cora_room",
  "loc_kitchen",
  "loc_living_room",
  "loc_master_bedroom",
  "loc_garage",
  "loc_maddie_room",
  "loc_bathroom",
  "loc_backyard",
]
# Root: no entry_from (parallel to loc_town). Bridge = activity_walk_to_town (phase 3).

[[locations]]
id          = "loc_cora_room"
name        = "Your Room"
description = "Your old bedroom, more or less how you left it. A single bed, boxes you haven't unpacked, a mirror on the back of the door. It's yours again, for whatever that's worth."
image       = "locations/cora_room.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_kitchen"
name        = "Kitchen"
description = "Your mother's old kitchen. Nobody's run it right since she left — the fridge half-empty, the good pans put away wrong. It's the first place you can feel yourself filling a hole just by standing in it."
image       = "locations/kitchen.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_living_room"
name        = "Living Room"
description = "A sagging couch, a TV that's always on, a ring of empties around your father's chair. The light goes gold here in the evening and makes the room almost kind."
image       = "locations/living_room.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_master_bedroom"
name        = "Master Bedroom"
description = "Your parents' room. Your father sleeps on one side of the bed like she might still come back to the other. Her clothes are still in the closet. The whole room is holding its breath."
image       = "locations/master_bedroom.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_garage"
name        = "Garage"
description = "Cold concrete, a car up on ramps, a cot and a mini-fridge in the corner. Wes half-lives out here now — far enough from the house to call it his."
image       = "locations/garage.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_maddie_room"
name        = "Maddie's Room"
description = "Fairy lights and laundry on the floor, the bass coming through the door. Eighteen years old and shrinking into the one room that's hers."
image       = "locations/maddie_room.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_bathroom"
name        = "Bathroom"
description = "The one bathroom in the house. Thin door, a lock that's been broken so long nobody mentions it, a fan that doesn't clear the steam. Everyone's schedule runs through this room."
image       = "locations/bathroom.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_backyard"
name        = "Backyard"
description = "A patch of dead grass, two folding chairs, an ashtray on the step. Where the talks happen that can't happen inside."
image       = "locations/backyard.jpg"
entry_from  = "loc_home"

# ── Town root ────────────────────────────────────────────────────────────────
[[locations]]
id               = "loc_town"
name             = "Town"
description      = "The main street — a bar, a corner store, your father's shop, and not much else. Brenda's porch is on the corner, and she's always on it."
navigation_order = [
  "loc_roys_shop",
  "loc_bar",
  "loc_corner_store",
]
# Root: no entry_from. Bridge home = activity_walk_home (phase 3). Brenda's surface.

[[locations]]
id          = "loc_roys_shop"
name        = "Roy's Shop"
description = "Your father's auto shop, two bays and a counter, more empty than not these days. The bell over the door hasn't rung enough lately, and the bills on the desk say so."
image       = "locations/roys_shop.jpg"
entry_from  = "loc_town"

[[locations]]
id          = "loc_bar"
name        = "Bar"
description = "Vic's place. Dim, sticky, busier than it has any right to be — the kind of bar where the tips depend on what the girl behind it is willing to let the regulars see."
image       = "locations/bar.jpg"
entry_from  = "loc_town"

[[locations]]
id          = "loc_corner_store"
name        = "Corner Store"
description = "Groceries, beer, a sad rack of cheap clothes in the back. Where the household money goes and where you put something on your back when you've got a few dollars."
image       = "locations/corner_store.jpg"
entry_from  = "loc_town"

# ── Offscreen "away" labels (no nav card; exempt from presence floor) ──────────
[[locations]]
id          = "loc_maddie_out"
