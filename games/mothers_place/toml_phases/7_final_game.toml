[[locations]]
id          = "loc_cora_room"
name        = "Your Room"
description = "Your old bedroom, more or less how you left it. A single bed, boxes you haven't unpacked, a mirror on the back of the door. It's yours again, for whatever that's worth."
image       = "locations/cora_room.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_kitchen"
name        = "Kitchen"
description = "Your mother's old kitchen. Nobody's run it right since she left — the fridge half-empty, the good pans put away wrong. It's the first place you can feel yourself filling a hole just by standing in it."
image       = "locations/kitchen.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_living_room"
name        = "Living Room"
description = "A sagging couch, a TV that's always on, a ring of empties around your father's chair. The light goes gold here in the evening and makes the room almost kind."
image       = "locations/living_room.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_master_bedroom"
name        = "Master Bedroom"
description = "Your parents' room. Your father sleeps on one side of the bed like she might still come back to the other. Her clothes are still in the closet. The whole room is holding its breath."
