[[locations]]
id               = "loc_home"
name             = "Home"
description      = "The house you grew up in. It opens off a short front hall — the kitchen one way, the living room ahead, the bedrooms down the back. A year without your mother shows in every room: dishes, dust, the quiet of men who've stopped trying."
