entry_from  = "loc_home"

[[locations]]
id          = "loc_garage"
name        = "Garage"
description = "Cold concrete, a car up on ramps, a cot and a mini-fridge in the corner. Wes half-lives out here now — far enough from the house to call it his."
image       = "locations/garage.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_maddie_room"
name        = "Maddie's Room"
description = "Fairy lights and laundry on the floor, the bass coming through the door. Eighteen years old and shrinking into the one room that's hers."
image       = "locations/maddie_room.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_bathroom"
name        = "Bathroom"
description = "The one bathroom in the house. Thin door, a lock that's been broken so long nobody mentions it, a fan that doesn't clear the steam. Everyone's schedule runs through this room."
image       = "locations/bathroom.jpg"
entry_from  = "loc_home"

[[locations]]
id          = "loc_backyard"
name        = "Backyard"
description = "A patch of dead grass, two folding chairs, an ashtray on the step. Where the talks happen that can't happen inside."
image       = "locations/backyard.jpg"
entry_from  = "loc_home"

