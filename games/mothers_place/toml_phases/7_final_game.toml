# ─── Player ───────────────────────────────────────────────────────────────────

[player]
id          = "player"
name        = "Cora"
description = "Mid-twenties. Came home with nothing — job gone, money gone, nowhere else to land. Back in the house she grew up in, the one her mother walked out of a year ago."
portrait    = "cora.jpg"
customizable = true

[player.core_traits]
corruption    = 0
arousal       = 0
energy        = 100
hygiene       = 100
money         = 20      # broke — the household pressure
exhibitionism = 0

# ─── Player customization (start-of-game screen; auto-rendered before the boot) ──
# id="name" writes $player.name (the @player token); others write $player.<id>,
# read in prose via @player.<id>. Family speaks @player; descriptions use @player.build.
[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "Your name"
default = "Cora"

[[player.customization_fields]]
id      = "build"
type    = "select"
label   = "Your build"
default = "average"
options = ["petite", "average", "curvy", "athletic", "thick"]

[[player.customization_fields]]
id            = "look"
type          = "image_select"
label         = "Your look"
default       = "tired"
sets_portrait = true
options = [
  { id = "tired",   image = "players/cora_tired.jpg",   label = "Worn out" },
  { id = "pretty",  image = "players/cora_pretty.jpg",  label = "Pretty" },
  { id = "sharp",   image = "players/cora_sharp.jpg",   label = "Sharp" },
]

