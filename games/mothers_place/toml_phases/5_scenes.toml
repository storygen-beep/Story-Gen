  { type = "dialog", props = { speaker = "npc", npcId = "npc_brenda" }, content = "Settling back in alright, hon? Your daddy must be glad of the company. Lord knows that house has been quiet." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text = "Keep walking."
targetType = "location"
locationId = "loc_town"

# ═════════════════════════════════════════════════════════════════════════════
# BATHROOM — occupied acknowledgment (so it's not blank when someone's showering).
# Gated npc_at_location is_present (any occupant). The per-NPC PEEK (lewd, gated) +
# CAUGHT come in the §5H arc beats (0008/0012/0017); this is the baseline read.
# ═════════════════════════════════════════════════════════════════════════════

[[canvases]]
id          = "ambient_bathroom_occupied"
name        = "Occupied"
description = "Bathroom occupied acknowledgment. is_present (any). Baseline before the gated peeks."
[canvases.trigger]
location      = "loc_bathroom"
is_repeatable = true
priority      = 6
is_active     = true
conditions = { version = "1.0", items = [
  { type = "npc_at_location", location_id = "loc_bathroom", operator = "is_present" },
] }
[[canvases.nodes]]
id = "base"
name = "Occupied"
blocks = [
  { type = "paragraph", content = "The water's running behind the door, the fan rattling, steam curling out through the gap where the latch never catches. Someone's in there. You could wait — or you couldn't help noticing how little that broken door actually closes." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text = "Give them a minute."
targetType = "location"
locationId = "loc_home"

