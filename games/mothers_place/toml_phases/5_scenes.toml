[[canvases]]
id          = "hub_roy_bedroom"
name        = "Roy"
description = "Roy hub — Master Bedroom, night (asleep). Light presence + Lynn's-closet seed."
[canvases.trigger]
location      = "loc_master_bedroom"
npc           = "npc_roy"
requires_npc  = "npc_roy"
is_repeatable = true
priority      = 5
is_active     = true
[[canvases.trigger.schedules]]
weekdays = [0,1,2,3,4,5,6]
start_time = "23:00"
end_time = "06:30"
[[canvases.nodes]]
id = "base"
name = "Roy"
blocks = [
  { type = "paragraph", content = "He's asleep on his half of the bed, dead to the world, one arm thrown across the cold side like it might fill up again if he doesn't look. Her clothes are still in the closet. The whole room waits for a woman who isn't coming back." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text = "Stand there a moment, then go."
