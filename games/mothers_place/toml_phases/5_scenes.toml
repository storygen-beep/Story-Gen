# Phase 5/7 — 5_scenes.toml
# Mother's Place — NPC hubs + ambients. This pass = the COLD-START BASE HUBS for every
# arc NPC at each reachable schedule row (the presence floor), so the nav's "someone's
# here" always has content behind it. Escalation rungs / capstones / loops come in the
# arc beats. Register: RTS-flat; Talk carries the NPC's own voice (Rule 4).
#
# Hub fingerprint: npc + requires_npc BOTH set (portrait), is_repeatable, schedules
# covering the NPC's window there, low priority. Base node renders unconditionally
# (presence floor); the Talk choice is daily-capped (hidden when used), builds warmth.

# ═════════════════════════════════════════════════════════════════════════════
# ROY — hubs at living room (eve), shop (day), master bedroom (night)
# ═════════════════════════════════════════════════════════════════════════════

[[canvases]]
id          = "hub_roy_living"
name        = "Roy"
description = "Roy hub — Living Room, evenings. Presence floor + Talk (warmth)."
[canvases.trigger]
location      = "loc_living_room"
npc           = "npc_roy"
requires_npc  = "npc_roy"
is_repeatable = true
priority      = 5
is_active     = true
[[canvases.trigger.schedules]]
weekdays = [0,1,2,3,4,5,6]
start_time = "17:00"
end_time = "23:00"
[[canvases.nodes]]
id = "base"
name = "Roy"
blocks = [
  { type = "paragraph", content = "Your father's in his chair, the TV throwing light on a face that's given up arguing with it. A can sweats on the armrest. He looks over when you come in — that same beat where it takes him a second, and then it costs him something." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text = "Sit with him a while."
targetType = "location"
locationId = "loc_living_room"
time_progression_minutes = 30
conditions = { version = "1.0", items = [ { type = "flag", subject = "player", flag_key = "talked_to_roy_today", operator = "is_false" } ] }
flagEffects = [ { targetType = "player", flag = "talked_to_roy_today", op = "set" } ]
effects = [ { targetType = "npc", npcId = "npc_roy", trait = "arousal", op = "add", value = 1, cap = 10 } ]
[[canvases.nodes.exit_block.choices]]
text = "Leave him to it."
targetType = "location"
locationId = "loc_home"

