schema_version = "0.2"
starting_canvas = "scene_intro"

[project]
id = "test_customize"
title = "Coffee Shop Test"
description = """A short test game to verify NPC name/relationship customization and @-variable syntax. Player visits a coffee shop and interacts with a customizable NPC."""

# ─── Player ─────────────────────────────────────────────────────────
# Player is CUSTOMIZABLE — name and body type can be set at game start.
# Content uses @player for name and @player.body_type for body type.
[player]
id = "player"
name = "Sam"
description = "You're a regular at the neighborhood coffee shop — the kind who gets their order started before they reach the counter. Late 20s, casual dresser, perpetually running five minutes behind. You tell yourself you come for the coffee. That stopped being true a while ago."
portrait = ""
customizable = true
core_traits = { boldness = 0, energy = 100 }
flag_keys = ["game_started", "intro_complete", "first_date_complete", "bold_path_chosen", "shy_path_chosen", "flirt_unlock"]

[[player.customization_fields]]
id = "name"
type = "text"
label = "Your Name"

[[player.customization_fields]]
id = "body_type"
type = "select"
label = "Body Type"
default = "average"
options = ["petite", "average", "curvy", "athletic", "thick"]

# ─── NPCs ───────────────────────────────────────────────────────────
# npc_alex is CUSTOMIZABLE — player can rename and pick relationship at game start.
# All content uses @alex and @alex.rel instead of hardcoded "Alex" / "coworker".
[[npcs]]
id = "npc_alex"
name = "Alex"
description = "Your coworker behind the counter. Mid 20s, warm smile, paint-stained fingers from a side hobby nobody at work asks about. They remember your order, your name, and the exact joke you told three weeks ago. The kind of person who makes a ten-minute coffee run feel like the best part of your day."
portrait = ""
customizable = true
relationship = "coworker"
relationship_options = ["coworker", "old friend", "neighbor"]
flag_keys = []

[npcs.core_traits]
love = 0
trust = 0

# ─── Locations ──────────────────────────────────────────────────────
[[locations]]
id = "loc_shop"
name = "Coffee Shop"
description = "A cozy corner coffee shop with mismatched furniture and chalkboard menus. Smells like fresh grounds and cinnamon."
image = ""
image_search_queries = ["cozy coffee shop interior"]
navigation_order = ["loc_counter", "loc_back_room"]

[[locations]]
id = "loc_counter"
name = "Counter"
description = "The main counter where orders happen. A glass case of pastries, tip jar with a pun on it."
image = ""
image_search_queries = ["coffee shop counter barista"]
entry_from = "loc_shop"

[[locations]]
id = "loc_back_room"
name = "Back Room"
description = "A quieter nook with a worn leather couch and shelves of used books. Regulars only."
image = ""
image_search_queries = ["coffee shop cozy back room couch"]
entry_from = "loc_shop"

# ─── Sidebar ────────────────────────────────────────────────────────
[[sidebar_items]]
type = "hint"

# ─── Phone System ───────────────────────────────────────────────────
[phone]
enabled = true

[[phone.apps]]
id = "messages"
type = "chat"
label = "Messages"

[[phone.apps]]
id = "instalook"
type = "social_feed"
label = "InstaLook"

[[phone.apps]]
id = "spark"
type = "dating"
label = "Spark"

# Conversation 1: triggers after intro_complete
[[phone.conversations]]
id = "alex_scarf"
app = "messages"
npc = "npc_alex"

[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "intro_complete", operator = "is_true" }
]}

[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "hey you left your scarf at the shop"

[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "I kept it safe for you :)"

[[phone.conversations.blocks]]
type = "reply"
choices = [
  { text = "Thanks! I'll grab it tomorrow", flagEffects = [{ targetType = "player", flag = "scarf_mentioned" }] },
  { text = "Keep it. Gives you a reason to think about me.", effects = [{ targetType = "npc", npcId = "npc_alex", trait = "love", op = "add", value = 3 }] },
]

[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "😊"
after_reply = true

# Conversation 2: triggers after first_date_complete
[[phone.conversations]]
id = "alex_after_date"
app = "messages"
npc = "npc_alex"

[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "first_date_complete", operator = "is_true" }
]}

[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "I had a really good time tonight"

[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "we should do that again sometime"

[[phone.conversations.blocks]]
type = "reply"
choices = [
  { text = "Same here. Tomorrow?", effects = [{ targetType = "npc", npcId = "npc_alex", trait = "love", op = "add", value = 2 }] },
  { text = "Definitely. Goodnight ❤️", effects = [{ targetType = "npc", npcId = "npc_alex", trait = "trust", op = "add", value = 3 }] },
]

# Social feed post — appears after intro
[[phone.posts]]
id = "alex_latte_post"
app = "instalook"
npc = "npc_alex"
image = ""
caption = "New personal best. Three attempts, one perfect rosetta. #latteart #barista"
likes = 47

[phone.posts.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "intro_complete", operator = "is_true" }
]}

# Another post — appears after first date
[[phone.posts]]
id = "alex_sunset_post"
app = "instalook"
npc = "npc_alex"
image = ""
caption = "Good company makes everything better. Not saying who. #goodnight"
likes = 63

[phone.posts.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "first_date_complete", operator = "is_true" }
]}

# Dating profile — appears at game start
[[phone.profiles]]
id = "alex_profile"
app = "spark"
npc = "npc_alex"
photos = []
bio = "Barista by day, painter by night. Looking for someone who appreciates latte art and bad puns. Swipe right if you like coffee and existential conversations at closing time."
age = "24"
interests = ["art", "coffee", "hiking", "bad puns"]

[phone.profiles.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "game_started", operator = "is_true" }
]}

[phone.profiles.match_condition]
conditions = { version = "1.0", items = [
  { type = "trait", subject = "npc", npc_id = "npc_alex", trait_key = "love", operator = "gte", value = 10 }
]}

# ═══════════════════════════════════════════════════════════════════
# CANVAS 1: INTRO (starting canvas, no trigger)
# Uses @alex and @alex.rel in paragraphs and dialog
# ═══════════════════════════════════════════════════════════════════
[[canvases]]
id = "scene_intro"
name = "Morning Coffee"
description = "Your first visit of the day."

# --- Node 1: Arrival ---
[[canvases.nodes]]
id = "arrival"
name = "Arrival"
blocks = [
  { type = "heading", content = "The Coffee Shop" },
  { type = "paragraph", content = "The bell above the door jingles as you walk in. @alex waves from behind the counter. Your @alex.rel always gets here before you." },
  { type = "dialog", content = "The usual?", props = { speaker = "npc", npcId = "npc_alex" } },
  { type = "paragraph", content = "You nod. @alex already has the cup ready — they know your order by heart." },
]
exit_block = { type = "choices", choices = [
  { text = "Sit at the counter and chat with @alex", targetType = "node", nodeId = "scene_intro.counter_chat" },
  { text = "Take your coffee to the back room", targetType = "location", locationId = "loc_back_room", time_progression_minutes = 15, flagEffects = [{ targetType = "player", flag = "game_started" }, { targetType = "player", flag = "intro_complete" }] }
] }

# --- Node 2: Counter Chat ---
[[canvases.nodes]]
id = "counter_chat"
name = "Counter Chat"
blocks = [
  { type = "paragraph", content = "@player leans against the counter. @alex wipes down the espresso machine while they talk." },
  { type = "dialog", content = "So, any plans this weekend?", props = { speaker = "npc", npcId = "npc_alex" } },
  { type = "paragraph", content = "The question feels heavier than it should from your @alex.rel." },
]
exit_block = { type = "location", text = "Finish your coffee", config = { destinationType = "trigger", time_progression_minutes = 20, effects = [
  { targetType = "npc", npcId = "npc_alex", trait = "love", op = "add", value = 3, clamp = true },
  { targetType = "npc", npcId = "npc_alex", trait = "trust", op = "add", value = 2, clamp = true },
], flagEffects = [
  { targetType = "player", flag = "game_started" },
  { targetType = "player", flag = "intro_complete" },
] } }

# ═══════════════════════════════════════════════════════════════════
# CANVAS 2: STORY EVENT — First Date (one-time, priority 10)
# Multiple paths: bold vs shy
# ═══════════════════════════════════════════════════════════════════
[[canvases]]
id = "story_first_date"
name = "After Hours"
description = "The shop is closing. It's just the two of you."

[[canvases.nodes]]
id = "the_moment"
name = "Closing Time"
blocks = [
  { type = "heading", content = "After Hours" },
  { type = "paragraph", content = "@alex flips the sign to CLOSED and turns down the lights. The shop feels different empty — smaller, warmer." },
  { type = "dialog", content = "I saved us the last two pastries. Sit?", props = { speaker = "npc", npcId = "npc_alex" } },
  { type = "paragraph", content = "Your @alex.rel gestures at the back room couch." },
]
exit_block = { type = "choices", choices = [
  { text = "Sit close and flirt", targetType = "node", nodeId = "story_first_date.bold_path" },
  { text = "Keep it casual", targetType = "node", nodeId = "story_first_date.shy_path" },
] }

# --- Bold path ---
[[canvases.nodes]]
id = "bold_path"
name = "Bold Move"
blocks = [
  { type = "paragraph", content = "@player sits close enough that their @player.body_type frame presses against @alex. @alex doesn't move away." },
  { type = "dialog", content = "You know, you're my favorite part of coming here.", props = { speaker = "player" } },
  { type = "paragraph", content = "@alex's cheeks flush. The pastry goes untouched." },
  { type = "dialog", content = "Just the coffee shop?", props = { speaker = "npc", npcId = "npc_alex" } },
]
exit_block = { type = "location", text = "Walk home smiling", config = { destinationType = "trigger", time_progression_minutes = 60, effects = [
  { targetType = "npc", npcId = "npc_alex", trait = "love", op = "add", value = 8, clamp = true },
  { targetType = "npc", npcId = "npc_alex", trait = "trust", op = "add", value = 3, clamp = true },
], flagEffects = [
  { targetType = "player", flag = "first_date_complete" },
  { targetType = "player", flag = "bold_path_chosen" },
  { targetType = "player", flag = "flirt_unlock" },
] } }

# --- Shy path ---
[[canvases.nodes]]
id = "shy_path"
name = "Playing It Safe"
blocks = [
  { type = "paragraph", content = "@player sits across from @alex, leaving a comfortable gap. Safe. The pastry is good." },
  { type = "dialog", content = "These are from the new bakery down the street. Thought you'd like them.", props = { speaker = "npc", npcId = "npc_alex" } },
  { type = "paragraph", content = "The conversation is easy. @alex laughs at your jokes. You wonder if your @alex.rel notices how often you look at their hands." },
]
exit_block = { type = "location", text = "Head home", config = { destinationType = "trigger", time_progression_minutes = 60, effects = [
  { targetType = "npc", npcId = "npc_alex", trait = "love", op = "add", value = 3, clamp = true },
  { targetType = "npc", npcId = "npc_alex", trait = "trust", op = "add", value = 5, clamp = true },
], flagEffects = [
  { targetType = "player", flag = "first_date_complete" },
  { targetType = "player", flag = "shy_path_chosen" },
] } }

[canvases.trigger]
location = "loc_back_room"
npc = "npc_alex"
is_active = true
is_repeatable = false
priority = 10
[[canvases.trigger.schedules]]
start_time = "17:00"
end_time = "21:00"

[canvases.trigger.conditions]
version = "1.0"
[[canvases.trigger.conditions.items]]
type = "flag"
subject = "player"
flag_key = "intro_complete"
operator = "is_true"

# ═══════════════════════════════════════════════════════════════════
# CANVAS 3: ACTIVITY — Morning Coffee (repeatable, gated choices)
# ═══════════════════════════════════════════════════════════════════
[[canvases]]
id = "activity_morning_coffee"
name = "Morning Coffee"
description = "Daily coffee ritual with @alex."

[[canvases.nodes]]
id = "base"
name = "Your Usual"
blocks = [
  { type = "paragraph", content = "You push through the door. @alex already has your cup on the counter, steam curling." },
  { type = "dialog", content = "Right on time.", props = { speaker = "npc", npcId = "npc_alex" } },
]
exit_block = { type = "choices", choices = [
  { text = "Just coffee, thanks", targetType = "node", nodeId = "activity_morning_coffee.casual" },
  { text = "Flirt over the foam", targetType = "node", nodeId = "activity_morning_coffee.flirty", conditions = { version = "1.0", items = [
    { type = "trait", subject = "npc", npc_id = "npc_alex", trait_key = "love", operator = "gte", value = 20 }
  ] } },
  { text = "Compliment @alex's latte art", targetType = "node", nodeId = "activity_morning_coffee.sweet", conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "flirt_unlock", operator = "is_true" },
    { type = "trait", subject = "npc", npc_id = "npc_alex", trait_key = "love", operator = "gte", value = 10 }
  ] } },
] }

# --- Casual sub-node ---
[[canvases.nodes]]
id = "casual"
name = "Quick Coffee"
blocks = [
  { type = "paragraph", content = "You sip your coffee and scroll your phone. @alex hums behind the counter, content." },
]
exit_block = { type = "location", text = "Head out", loop_terminal = true, config = { destinationType = "trigger", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_alex", trait = "trust", op = "add", value = 1, clamp = true },
] } }

# --- Flirty sub-node (gated: love >= 20) ---
[[canvases.nodes]]
id = "flirty"
name = "Foam Hearts"
blocks = [
  { type = "paragraph", content = "@alex drew a heart in your latte foam. You raise an eyebrow." },
  { type = "dialog", content = "New skill I'm practicing. Don't read into it.", props = { speaker = "npc", npcId = "npc_alex" } },
  { type = "paragraph", content = "You both know you're going to read into it." },
]
exit_block = { type = "location", text = "Smile and leave", loop_terminal = true, config = { destinationType = "trigger", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_alex", trait = "love", op = "add", value = 3, clamp = true },
  { targetType = "npc", npcId = "npc_alex", trait = "trust", op = "add", value = 2, clamp = true },
] } }

# --- Sweet sub-node (gated: flirt_unlock + love >= 10) ---
[[canvases.nodes]]
id = "sweet"
name = "Latte Art"
blocks = [
  { type = "paragraph", content = "There's a tiny leaf in your foam today. Detailed, delicate." },
  { type = "dialog", content = "That's beautiful. You should sell prints.", props = { speaker = "player" } },
  { type = "paragraph", content = "@alex ducks their head, pleased. Your @alex.rel has paint-stained fingers and latte art skills. The combination does something to you." },
]
exit_block = { type = "location", text = "Linger a moment, then go", loop_terminal = true, config = { destinationType = "trigger", time_progression_minutes = 30, effects = [
  { targetType = "npc", npcId = "npc_alex", trait = "love", op = "add", value = 2, clamp = true },
  { targetType = "npc", npcId = "npc_alex", trait = "trust", op = "add", value = 3, clamp = true },
] } }

[canvases.trigger]
location = "loc_counter"
npc = "npc_alex"
is_active = true
is_repeatable = true
max_triggers_per_day = 1
priority = 1
costs = [{ trait = "energy", value = 15 }]
[[canvases.trigger.schedules]]
start_time = "07:00"
end_time = "11:00"

[canvases.trigger.conditions]
version = "1.0"
[[canvases.trigger.conditions.items]]
type = "flag"
subject = "player"
flag_key = "intro_complete"
operator = "is_true"

# ═══════════════════════════════════════════════════════════════════
# EMOTION MAPPINGS — uses @alex in descriptions
# ═══════════════════════════════════════════════════════════════════
[story_arc.emotion_mappings.love]
trait_owner = "npc"
default_npc = "npc_alex"

[[story_arc.emotion_mappings.love.ranges]]
min = 0
max = 20
label = "regular"
description = "@alex is friendly — but they're friendly with everyone. You're just another regular. They remember your order, not your birthday."

[[story_arc.emotion_mappings.love.ranges]]
min = 21
max = 50
label = "favorite"
description = "@alex's face lights up when you walk in. Your cup is ready before you reach the counter. They save the good pastries for you."

[[story_arc.emotion_mappings.love.ranges]]
min = 51
max = 100
label = "smitten"
description = "@alex can't stop smiling around you. They write little notes on your cup. Their @alex.rel energy has shifted into something unmistakable."

[story_arc.emotion_mappings.trust]
trait_owner = "npc"
default_npc = "npc_alex"

[[story_arc.emotion_mappings.trust.ranges]]
min = 0
max = 30
label = "surface"
description = "@alex keeps things light — weather, coffee, safe topics. There's a wall up, friendly but firm."

[[story_arc.emotion_mappings.trust.ranges]]
min = 31
max = 70
label = "opening up"
description = "@alex tells you about their art, their real dreams. The things they don't share with just anyone."

[[story_arc.emotion_mappings.trust.ranges]]
min = 71
max = 100
label = "vulnerable"
description = "@alex trusts you with the messy parts. The doubt, the fear, the 3am thoughts. Your @alex.rel lets you see them unfiltered."
