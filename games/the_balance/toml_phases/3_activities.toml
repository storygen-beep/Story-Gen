# =============================================================================
# HER DOOR · the first thing in this game that makes @gil's rule mechanical
#
# the_house.md has said it since the first draft and nothing has ever enforced it:
# "Her door stays open when someone's on the landing. So closing it is already a
# small decision, and it's the same door the stream needs shut."
#
# ⚠️ IT IS THE TELEVISION'S SHAPE, ON PURPOSE. One object, two buttons, and it
# remembers — including the asymmetry that took a build to get right: SHUT returns
# to the node so she stays and reads the new state, OPEN returns to the location so
# the room re-renders and whatever the shut door was hiding comes back.
#
# ⚠️ `door_locked` CLEARS OVERNIGHT. The flag is today's decision.
#
# PARKED 2026-09-19: the `door_noticed` tally — a second "Shut the door." row that
# counted every time she shut it on a full house, read by @gil at dinner. That is a
# ladder, not the base; it is in parked/as_built.toml (dinner) and git at ff91336.
# =============================================================================

[[canvases]]
id   = "her_door"
name = "The door"
description = "The lock on her own door. Sets `door_locked`, which is now the only gate on going live."

[canvases.trigger]
location      = "her_room"
is_repeatable = true
priority      = 6
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "Shut, or not"

# ONE if/elseif chain — adjacent group blocks merge, and exclusive bands are
# exactly what that is for. Order is the priority: shut first, then the two ways
# of being open.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "door_locked", operator = "is_true" },
] } }
blocks = [
  { type = "paragraph", content = "The door is shut and the little button on the handle is in. It took one second and it is the only second of the day that is entirely yours. The room is the same room and it is not the same room." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "stage", helper = "house_empty", operator = "is_true" },
] } }
blocks = [
  { type = "paragraph", content = "Open, onto a landing with nobody on it. You can hear the fridge from here and nothing else. An open door costs you nothing this hour, but there are not many hours in a week like this one." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "Open, because those are his rules, and there is somebody in this house. Not outside it. Somewhere down there, moving about, and the gap between your door and the frame is four inches of his house." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Shut the door."
targetType = "node"
nodeId     = "her_door.base"
time_progression_minutes = 5
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "door_locked", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "door_locked", op = "set" }]


[[canvases.nodes.exit_block.choices]]
text       = "Open it again."
targetType = "location"
locationId = "her_room"
time_progression_minutes = 5
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "door_locked", operator = "is_true" },
] }
