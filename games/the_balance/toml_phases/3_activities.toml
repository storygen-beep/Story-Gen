# ⚠️ THE ACT BEATS STAY ON THE BODY FOR THEIR WHOLE LENGTH. Read each last
# sentence: it is what is HAPPENING, never what it MEANT. The interiority is not
# cut — it is on the payout node, which is the beat after. A beat is a NODE, so
# folding the thought in here would make one beat that pivots.

[[canvases.nodes]]
id   = "rung_top"
name = "Top off"

