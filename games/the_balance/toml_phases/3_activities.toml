# =============================================================================
# The Balance — 3 · the repeatable half
#
# SLICE 2. The shift. The first thing in this game she does more than once.
#
# ⚠️ L3 — A REPEATABLE SCREEN CARRIES NO HISTORY. Every sentence here is
# something happening now. No "used to", no "since", no "three weeks of". What
# reads as depth on visit one is furniture by visit nineteen, and our games run
# to 12.1% history against a field maximum of 5.41%.
#
# ⚠️ THERE IS NO ROSTER ANY MORE. her_week.md, 2026-09-20: the cafe is open seven
# to ten every day, in five shifts of three hours, and every one of them is hers
# from day one. Nothing counts how many she works — "the pay is the only limit
# there is." So one canvas, five schedule windows, and the squeeze moved off the
# roster and onto the wage.
# =============================================================================

# --- THE FLOOR · five shifts a day, three hours each -------------------------

[[canvases]]
id   = "shift_floor"
name = "Work the shift"
description = "The ordinary shift at the floor. Five of them a day, three hours each, every day of the week, $3. She clocks on at the top or it is gone. Body varies on every entry."

[canvases.trigger]
location      = "the_cafe"
is_repeatable = true
max_triggers_per_day = 1
priority      = 5
is_active     = true
costs         = [{ trait = "clean", value = 20 }]
show_when_blocked = true
cooldown_message = "Nothing starts now. He takes you at the top of a shift or not at all."
# PARKED 2026-09-19 (the climbs) — `move_up lt 2` came off this trigger (it handed the
# roster over to shift_counter), and both customer substitutions below it went:
# cust_hand and cust_showing are the customers' ladder. Whole scene in
# parked/climbs/before_the_strip.toml.
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "has_job", operator = "is_true" },
] }

# Five shifts, every day of the week: 07-10 · 10-13 · 13-16 · 16-19 · 19-22.
#
# ⚠️ THESE WINDOWS ARE THE CLOCK-ON, NOT THE SHIFT. her_week.md: "She clocks on at
# the top of the shift or it's gone. Owen is exact about the work; he doesn't take
# her at half two." Twenty minutes wide, because isCurrentTimeSlot is end-EXCLUSIVE
# (v2.py:4100) and the sidebar's wait buttons move in tens (v2.py:17420), so a
# narrower window is unhittable. The shift itself is the 180 on the exit.
#
# ⚠️ AND TWENTY IS WHAT KEEPS THE PAGE TRUE. Out of the twelve o'clock class, the
# quad and both bus legs put her on the strip at about 13:25, so 13:00-13:20 has
# already closed and 16:00 is the only one a class day can reach.
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "07:00"
end_time   = "07:20"

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "10:00"
end_time   = "10:20"

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "13:00"
end_time   = "13:20"

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "16:00"
end_time   = "16:20"

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "19:20"

[[canvases.nodes]]
id   = "base"
name = "The shift"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Three hours of carrying plates to people who are mid-sentence. The window table turns over twice, and your feet go somewhere in the middle of it, so the last hour is the first hour with worse feet." },
  { type = "paragraph", content = "The machine wants its tray emptied twice, but nobody else empties it. Owen watches you do it the first time and not the second. That is how he says a thing is yours now." },
  { type = "paragraph", content = "A slow one. You wipe tables that are already clean, because standing still where he can see you is worse work than working." },
  { type = "paragraph", content = "The lunch lot arrive together and leave together and the floor between the counter and the window ends up with all of it on. You get most of it up before he is out of the office." },
  { type = "paragraph", content = "An hour of nobody, then a coach party, then nobody again. You are still wiping down when the next three hours' worth of people start coming in, but those three hours are not yours." },
]

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "Table six has been waiting. I'm not telling you again, I'm telling you now." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "That one's done properly. Do the next one the same." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "You're quick. Quick isn't tidy. I want both and I'm not choosing." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "Go home. There's another one starts in an hour. Not you — nobody does two." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Clock off."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_cafe"
time_progression_minutes = 180

# ⚠️ $3, AND THE GAME IS UNPAYABLE UNTIL THE TIPS TALK. her_week.md: "A shift pays
# $3. That is the wage, and it is all this page says about money." What a shift
# earns on top of the wage is a conversation LO parked — "keep the tips off, we
# will discuss it separately" — and Friday still wants $150. Do not rebalance this
# number on its own; it is half a design.
[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "cash"
op         = "add"
value      = 3

