# --- THE SHOWER · the only tap `clean` has ----------------------------------
# ⚠️ BEFORE THIS CANVAS `clean` COULD ONLY GO DOWN. It falls 10 a day and 20 a
# shift and nothing raised it, so about a week in she dropped under 40, the tips
# ladder shut, and it never reopened. No gate caught that — it is a hole, not a
# score.
#
# the_house_day.md: one bathroom, shared with Nate and Tasha. Taken 7 to 8 in the
# morning — that is the running shower in the opening — and taken 5 to 10 in the
# evening, which is Tasha before she goes out. So it is free in the middle of the
# day, when class and the middle shift run, and free after ten, when she is only
# home because something ran over. BEING CLEAN IS NEVER FREE.

[[canvases]]
id   = "wash"
name = "Get in the shower"
description = "Restores clean. Only available in the hours the bathroom is actually free, which are the hours she is meant to be somewhere else."

[canvases.trigger]
