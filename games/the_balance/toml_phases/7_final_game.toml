# click. Nothing replaced it, because the cap was never holding anything shut:
#   · `crowd_standing` is read SEVEN times in this game and all seven are the same
#     `gte 10` threshold, so once it is crossed the meter is inert — climbing it
#     further buys nothing.
#   · `npc_paige.relation` is read by no condition anywhere.
#   · The choices cost ten minutes each, and the clock is the thing she is short
#     of. An afternoon spent on this wall is an afternoon gone.
# And the day flag could not have gone on the second choice regardless: its gate
# is an OR, the evaluator takes one flat `items` list with one `logic`
# (v2.py:4037-4039), and there is no nesting — so an AND cap cannot be added
# without deleting the reputation route into it.
