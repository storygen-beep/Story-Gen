# ACTIONS: back out · stay and watch · let herself be seen. Corruption decides what
# is on the menu and she still picks from it. Banded at 15 and 30, which are the
# values this build actually reaches — the sidebar collapses everything over 25
# into one word, so a rung above 30 would be invisible to the player.
#
# ⚠️ A TAKEN RUNG HIDES, IT DOES NOT GREY. `show_when_locked` on a one-time rung
