trait = "exposure"
bands = [
  { min = 0,  max = 19,  text = "nobody has seen her face" },
  { min = 20, max = 39,  text = "a few strangers have" },
  { min = 40, max = 64,  text = "people on campus place her" },
  { min = 65, max = 84,  text = "somebody she knows has seen it" },
  { min = 85, max = 100, text = "she can't be casual anywhere" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "corruption"
# ⚠️ BANDED TO WHAT THE BUILD ACTUALLY REACHES. The design ladder is five steps
# at 5/20/40/65/85 (her_meters.md) and the highest authored corruption gate in
# this build is 30, so the last two words were promising rungs the game does not
# contain. They come back when the content that reaches them does.
bands = [
  { min = 0,  max = 9,   text = "she wouldn't" },
  { min = 10, max = 24,  text = "she might" },
  { min = 25, max = 100, text = "she has, once" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "reputation"
# Same reason as corruption: the highest authored reputation gate is 20, so the
# top three words were describing a person this build cannot produce yet.
bands = [
  { min = 0,  max = 9,   text = "nobody knows her" },
  { min = 10, max = 19,  text = "they know the name" },
  { min = 20, max = 100, text = "she gets spoken to" },
]

