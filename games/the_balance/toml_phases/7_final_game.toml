content = "He nods. Once. Then he's back behind the paper."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "@gil? Is she eating or not?"

[canvases.nodes.exit_block]
