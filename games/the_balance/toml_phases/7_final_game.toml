# --- THE CLASSROOM BETWEEN CLASSES ------------------------------------------
# walking_in.md: in the first build ONE walk-in on strangers is open and it HAS
# to be this one — otherwise every door she walks in on for four weeks is at
# home, and the whole point of the game is that college is what changes her.
#
