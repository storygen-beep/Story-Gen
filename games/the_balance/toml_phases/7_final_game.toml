# =============================================================================
# The Balance — 8 · the phone
#
# ⚠️ FIRST 8_phone.toml IN THIS REPO. No game here has ever had one. The merger
# has always known the filename (merge_toml_phases.py) and it merges LAST.
#
# ⚠️ ONE APP, AND EVERYTHING ON IT IS @cara's. the_cast.md: "she's also the other
# end of the phone: the messages are hers." She is the only person who texts her
# about anything but work.
#
# ⚠️ NO FEED AND NO POSTING BUTTON, on purpose. A social_feed `post_action` rolls
# followers into a trait from a sidebar button that is live in every room — she
# would earn followers on the bus, and the door being shut is the entire weight
# of that scene. Going live stays a canvas in her room.
#
# ⚠️ The `custom` app type is UNUSABLE from TOML: the importer parses only id,
# type, label, icon and post_actions, so `passage` is never read and a custom app
# always falls through to the placeholder renderer. That is why the follower
# count stays in the sidebar and why the stream's block reasons had to be fixed
# inside that canvas instead of on a phone screen.
#
# ⚠️ Reply effects go through Number(eff.value || 0), so a random-range dict is
# NaN here. Fixed numbers only on this file.
# =============================================================================

