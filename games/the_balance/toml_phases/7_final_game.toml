# =============================================================================
# The Balance — 3 · the repeatable half
#
# SLICE 2. The shift. The first thing in this game she does more than once.
#
# ⚠️ L3 — A REPEATABLE SCREEN CARRIES NO HISTORY. Every sentence here is
# something happening now. No "used to", no "since", no "three weeks of". What
# reads as depth on visit one is furniture by visit nineteen, and our games run
# to 12.1% history against a field maximum of 5.41%.
#
# ⚠️ TWO canvases, not one. A condition cannot read the weekday, so a single
# canvas covering both rosters would let her work four days while she is still on
# the floor — and two shifts against a $150 Friday IS the squeeze the first build
# runs on. The roster has to bite.
# =============================================================================

# --- THE FLOOR · two shifts, the worst two -----------------------------------

[[canvases]]
id   = "shift_floor"
name = "Work the shift"
description = "The ordinary shift at the floor. Tuesday and Sunday, twelve to five, $55 with tips. Body varies on every entry. Sometimes a customer asks instead — that is the substitution rules below."

[canvases.trigger]
location      = "the_cafe"
is_repeatable = true
max_triggers_per_day = 1
priority      = 5
is_active     = true
costs         = [{ trait = "clean", value = 20 }]
show_when_blocked = true
cooldown_message = "You are not on the schedule today."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "has_job", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "move_up", operator = "lt", value = 2 },
] }

# Tuesday and Sunday. 0 = Monday, so 1 and 6 — the two nobody wants.
[[canvases.trigger.schedules]]
weekdays   = [1, 6]
start_time = "12:00"
end_time   = "17:00"

# ⚠️ ONLY SOME CUSTOMERS ASK, ONLY WHEN THE ROOM ALLOWS IT — the cafe sheet's own
# two brakes, as a dice roll inside a routine. A matching rule plays its target IN
# PLACE of this canvas, so each target carries the shift's own pay and count: it
# was still a shift, with something in it. Further rung first, so it wins when both
# are open.
[[canvases.trigger.substitutions]]
target_canvas_id = "cust_showing"
chance = 0.3
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "clean", operator = "gte", value = 40 },
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 20 },
  { type = "trait", subject = "player", trait_key = "exposure", operator = "gte", value = 8 },
  { type = "flag", subject = "player", flag_key = "cust_hand_done", operator = "is_true" },
] }

[[canvases.trigger.substitutions]]
target_canvas_id = "cust_hand"
chance = 0.35
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "clean", operator = "gte", value = 40 },
] }

[[canvases.nodes]]
id   = "base"
name = "The shift"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Five hours of carrying plates to people who are mid-sentence. The window table turns over four times. Your feet go at about hour three and the last two are hour three continuing." },
  { type = "paragraph", content = "The machine wants its tray emptied twice, but nobody else empties it. Owen watches you do it the first time and not the second. That is how he says a thing is yours now." },
  { type = "paragraph", content = "A slow one. You wipe tables that are already clean, because standing still where he can see you is worse work than working." },
  { type = "paragraph", content = "The lunch lot arrive together and leave together and the floor between the counter and the window ends up with all of it on. You get most of it up before he is out of the office." },
  { type = "paragraph", content = "Two hours of nobody, then a coach party, then nobody again. The tips are a handful of coins and one note left flat under a saucer, which is the only part worth counting." },
]

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "Table six has been waiting. I'm not telling you again, I'm telling you now." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "That one's done properly. Do the next one the same." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "You're quick. Quick isn't tidy. I want both and I'm not choosing." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "Go home. You're on again Sunday." },
]

