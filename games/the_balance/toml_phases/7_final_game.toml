# ⚠️ THE FLAG GOES ON THE CHOICE, NEVER ON A NODE EXIT — engine.md §28.1. A choice
# runs flagEffects before advanceTime; a node exit runs advanceTime first, and
# advanceTime rolls the day inside itself, so a cap written on an exit that crosses
# midnight locks the rung out of the FOLLOWING day, silently. Measured in off_season.
