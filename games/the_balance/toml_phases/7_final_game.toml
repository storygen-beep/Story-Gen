# --- GOING LIVE, THE OTHER PLACE · exposure's first door --------------------
# her_meters.md, on exposure: "opens places and hours — the door left open, the
# room with people in it." Until this canvas it opened neither. Twenty-two prose
# bands read the meter and two dice rolls read it, and nothing she could choose.
#
# WHY THE TOILET AT WORK AND NOT SOMEWHERE OUTDOORS. the_phone.md names the
# problem this solves in its own words: the house is quietest on weekday
# afternoons, and "those are exactly the hours the cafe wants too, which is the
# collision the design is built on." Her room is unusable during a shift. This is
# the only place she can go live while she is earning, and that is what the
# exposure buys — a door, not a bigger number.
#
# The room has been declared since slice 1 and held ZERO canvases. Its own
# description is the whole brief: "shared with the customers, so the person who
# opens it next could be anybody... a lock that works. It is the only door you can
# shut on yourself that isn't your own bedroom."
#
# ⚠️ SHARES `streamed_today` WITH `stream`. One session a night, wherever she does
# it. the_phone.md pays "on the night", not per room.
#
# ⚠️ NO MEDIA, MATCHING `stream`. That canvas declares none either. Adding a pool
# here and not there would move `traversal heat` on a lie.
#
# ⚠️ DISTINCT `name`. canTriggerActivity keys the daily counter off the canvas
# NAME (v2.py:11914 canvasIdToActivityName), so a second canvas called "Go live"
# would silently share this one's day bucket. Neither carries
# max_triggers_per_day today, but the name has to be right before one does.

[[canvases]]
id   = "stream_toilet"
name = "Go live at work"
description = "The second place she can go live, and the first thing exposure has ever opened. Shorter than the bedroom session, worth the same money, and it costs more of her because anybody could try the handle."

[canvases.trigger]
location      = "the_cafe_toilet"
is_repeatable = true
priority      = 5
is_active     = true
costs         = [{ trait = "clean", value = 15 }]
show_when_blocked = true
cooldown_message = "Not with the floor this busy."
# The phone is the only door into this, same as `stream`.
hidden_from_location = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key  = "opening_done", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "exposure",     operator = "gte", value = 20 },
] }

[[canvases.trigger.schedules]]
