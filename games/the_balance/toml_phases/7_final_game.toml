# =============================================================================
# TRAVEL · the fare is on the road, not on the room
#
# ⚠️ WHY THESE EXIST AT ALL. The bus used to be `costs = { time = 40, cash = 2 }`
# on the_quad and the_strip. A location's entry cost is charged on ANY move into
# it (v2.py:16267) — it cannot tell the difference between arriving from town and
# walking back out of a lecture. So every exit from a campus room re-charged the
# fare, and under $2 it BLOCKED her in a room whose only exit was that one.
#
# ⚠️ SIX CANVASES, NOT THREE. THE WALK IS ITS OWN LINK. They were three canvases
# that each offered "bus or walk" as choices on one screen, and LO killed it:
# "Walk are choice in the get the bus link. That's wrong." He is right — if she
# is walking she is not getting the bus, and a screen called `Get the bus` that
# offers you a way to not get the bus is a menu pretending to be a place. A
# canvas `name` is the link label on the location screen (engine.md §43), so two
# canvases means two links, and the choice is made before she opens either.
#
# ⚠️ CHOICE-LEVEL `costs`, NOT TRIGGER-LEVEL. An unaffordable CHOICE renders as a
# greyed dead span with the shortfall appended — "(Requires 2 Cash (you have 0))"
# (v2.py:13650-13657). A trigger cost would instead give her a live link to a
# blocked screen (v2.py:14035), which is the shape that hid the problem.
#
# ⚠️ THE PRICE IS WRITTEN INTO THE LABEL BY HAND, AS A NUMERAL. Nothing prints a
# cost on an affordable choice (v2.py:13505), and gates.py G21 "a price is on its
# label" greps the label for the literal amount — "Two dollars" FAILS it, "$2"
# passes. And choice costs get NO validation: a typo is dropped silently at parse
# and the bus is free on a green build. Read the built html, never the TOML.
#
# ⚠️ REPEATABLE, so none of these auto-fires (selectAutoFireCanvasForLocation
# skips isRepeatable) — each is a link in the activity list, like sleep or wash.
# No max_triggers_per_day: she travels as often as she likes.
#
# ⚠️ EVERY ONE ENDS ON "Not yet." Without it the only exits all move her, so
# opening the timetable would commit her to a journey.
#
# Numbers are the sheet's, not mine — the_campus.md: "Forty minutes and $2 on the
# bus, or an hour on foot."
# =============================================================================

