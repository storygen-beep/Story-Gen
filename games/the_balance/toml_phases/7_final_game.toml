# TASHA — THE FOURTH ARC
#
# DECISIONS.md:109 names eight climbs including her; :110 lists three written
# ladders and she is not one of them. CARRIED.md:215-218 defines what one is: a
# numbered ladder of one-time steps, each gated on the flag the one before it set,
# whose LAST STEP CONVERTS the act into something she can simply do — and warns
# that across 1,396 canvases in this repo no character has a second thing that
# happens, because every hub gets authored in its converted state on day one.
#
# ⚠️ THE DIRECTION IS HERS, NOT NELL'S. the_cast.md:35 — "Wants an audience, and
# she'll happily make Nell into one." So this is not Nell looking at Tasha's
# expense. It is Tasha performing and Nell made the audience, which is also what
# her ceiling's third axis means: CARRIED.md:191 gives her tier 3 as "full — cunt,
# cum, slut, AND THE WORDS SHE USES ABOUT NELL TO MEN". Nobody else in the cast
# has a public-language dimension.
#
# ⚠️ THE HOUR. 17:00-18:00, hers, before she goes out — the_house_day.md:33 calls
# it "exactly the hour Nell would want it". The bathroom was empty 17:00-22:00:
# `wash` runs 08:00-17:00 and 22:00-23:59, and `tasha_walks_in` rides `wash`, so
# it cannot fire in her own hour either. the_two_doors.md:78 said it outright —
# "the bathroom now has hours on it, and still nothing has ever happened in it".
#
# ⚠️ NO TRIGGER SCHEDULE AND NO max_triggers_per_day. `requires_npc` resolves
# through getNpcLocation, so her schedule row IS this canvas's hours and the two
# cannot drift. A day cap on a canvas carrying an `npc` deletes the person rather
# than spending the act (README §6).
#
# ⚠️ TWO WAYS IN, because the first one is a dice roll. `tasha_walks_in` is a 0.3
# substitution — an arc whose entrance depends on it would strand players who
# never rolled it. The other route is her room: `hub_tasha_room` pays relation,
# and relation 6 is a few afternoons of it. The on-ramp is the bedroom; the stage
# is in here.
#
# ⚠️ NEVER HIDE THE OPTION SHE CANNOT TAKE — walking_in.md:59. Every locked rung
# renders with one line of reason. And walking_in.md:31: WHAT CLIMBS IS HER
# REACTION, NOT HER ACTIONS. Corruption decides what is on the menu; she still
# picks from it. Shape copied from `classroom_door`, which is this game's own
# working example of both rules.
# =============================================================================

