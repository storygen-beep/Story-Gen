# --- FRIDAY · the payment ----------------------------------------------------
# money.md: $2,400 for the semester, $150 every Friday, sixteen weeks and it is
# clear. the_week.md: handed over in the kitchen on Friday evening, and @gil is
# there because he is always there at six.
#
# ⚠️ [settings.rent] IS STILL DELIBERATELY ABSENT and this is why. The engine's
# rent only ARMS a flag on the due weekday (rent_state.is_due, set inside
# advanceDay) — it deducts nothing and it narrates nothing. The payment in this
# game is a scene with a man in it, and two systems both claiming to collect the
# same $150 is how a game ends up telling the player twice.
#
# ⚠️ ALL EVENING, not six o'clock sharp. LO's call. She can only miss it by
# staying out, which is a choice — and putting things off is allowed everywhere
# else in this game.

[[canvases]]
id   = "friday_payment"
name = "Friday"
description = "The $150. Fires in the kitchen any Friday evening. Paying takes it off the debt; not having it puts a Friday on the count. He never explains either."

[canvases.trigger]
