# The whole point of the broken lock. FOUR ROWS, ONE PER PERSON, and exactly one
# can ever be live at a time.
#
# ⚠️ THE REFUSAL IS IN THE PROSE, NOT ON A ROW, AND IT TOOK TWO LIVE RUNS TO GET
# THERE. `show_when_locked` greys a row when its conditions FAIL — so the first
# draft, which gated the greyed row on the lock being INTACT, PASSED those
# conditions and rendered a live link instead of a refusal. Moving the flag onto the
# four per-person rows fixed that and broke the other end: after the lock is broken,
# the three rows for people who are NOT in the room fail their own presence clause
# and grey, so one live "Open it anyway." came with three greyed twins.
#
# A shown-locked row always renders — live or greyed, never absent — so no set of
# conditions gives "greyed while locked, gone once broken". The door's own
# description_variants carry it instead, which is what the field does: a median
# eight-word in-fiction refusal on the threshold, not a UI label.
#
# ⚠️ FOUR CANVASES AND NOT ONE, AND THE REASON IS A GATE. A single walk-in canvas
# carrying all four ladders would author twelve choices on one screen against
# `a place is not a catalogue`'s cap of eight — the same defect the television
# pass shipped and had to unpick. Door options are invisible to that gate; a
# canvas exit_block is not. Splitting by person puts four rows on each screen.
[[locations.door.options]]
text       = "Open it anyway."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_nate", location_id = "the_bathroom", operator = "is_present" },
  { type = "flag", subject = "player", flag_key = "lock_broken", operator = "is_true" },
] }
goes_to    = { type = "canvas", canvas_id = "bath_nate" }

[[locations.door.options]]
text       = "Open it anyway."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_tasha", location_id = "the_bathroom", operator = "is_present" },
  { type = "flag", subject = "player", flag_key = "lock_broken", operator = "is_true" },
] }
goes_to    = { type = "canvas", canvas_id = "bath_tasha" }

[[locations.door.options]]
text       = "Open it anyway."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_bathroom", operator = "is_present" },
  { type = "flag", subject = "player", flag_key = "lock_broken", operator = "is_true" },
] }
goes_to    = { type = "canvas", canvas_id = "bath_gil" }

[[locations.door.options]]
text       = "Open it anyway."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_bathroom", operator = "is_present" },
  { type = "flag", subject = "player", flag_key = "lock_broken", operator = "is_true" },
] }
goes_to    = { type = "canvas", canvas_id = "bath_lynn" }

# ⚠️ `knocked_once` IS THE GATE, AND THAT IS walking_in.md RULE 1 AS A MECHANIC:
# "the first one is written for her… it teaches what this is, and it makes the
# second one mean something." She cannot reach for the screwdriver until the house
# has refused her at that door at least once.
[[locations.door.options]]
text       = "Have a proper look at that lock."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_bathroom", operator = "is_absent" },
  { type = "flag", subject = "player", flag_key = "knocked_once", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "lock_broken", operator = "is_false" },
] }
goes_to    = { type = "canvas", canvas_id = "bath_break" }

