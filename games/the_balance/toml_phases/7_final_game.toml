# =============================================================================
# The Balance — 1 · locations and people
#
# SLICE 1. Eight rooms and two people — the fewest that let her get from her bed
# to Owen. The other twenty-two locations are budgeted in v2_state.json board.locations
# and are not built yet.
#
# ⚠️ [[npcs]] and their [[npcs.schedules]] live in THIS one file. A schedule block
# that drifts below the next [[npcs]] header silently re-attaches to that NPC.
# =============================================================================

# --- the house ---------------------------------------------------------------

[[locations]]
id          = "the_street"
name        = "Your Street"
description = "Parked cars and the same row of houses in both directions. The bus stop is at the corner, four doors down. Everything that isn't this house is on the other side of it."
image       = "locations/the_street.jpg"
image_search_queries = ["quiet suburban residential street row houses morning", "ordinary street bus stop corner overcast"]
navigation_order = ["the_hall", "the_bus_stop", "the_garage"]
# ROOT. No entry_from — the exterior the whole map hangs off (v2_state board.map).

[[locations]]
id          = "the_hall"
name        = "The Landing"
description = "The middle of the house. Four doors and the bathroom open off it, and you can hear which of them has somebody behind it. Your mum's bag is gone from the hook."
image       = "locations/the_hall.jpg"
image_search_queries = ["upstairs landing four doors carpet house interior", "narrow hallway bedroom doors daylight"]
entry_from  = "the_street"
navigation_order = ["her_room", "the_kitchen", "the_bathroom", "the_front_room", "nate_room", "tasha_room", "the_master_bedroom"]

[[locations]]
id          = "her_room"
name        = "Your Room"
description = "Bed against one wall, desk against the other, and the door that's meant to stay open when anyone's on the landing. Your phone is on the books where you left it."
image       = "locations/her_room.jpg"
image_search_queries = ["small teenage girl bedroom desk bed daylight", "cramped bedroom single bed study desk phone"]
entry_from  = "the_hall"

[[locations]]
id          = "the_bathroom"
name        = "The Bathroom"
description = "The shower, the mirror, and a lock that works. It is the only room in this house that is ever properly yours, and it is yours for about as long as nobody else wants it."
image       = "locations/the_bathroom.jpg"
image_search_queries = ["small family bathroom shower mirror sink", "ordinary bathroom interior tiled shower"]
entry_from  = "the_hall"

[[locations]]
id          = "the_kitchen"
name        = "The Kitchen"
description = "The chore list is on the fridge in his handwriting. Bins, laundry, dishes, the car. Five dollars each and he pays for one a day, and he only pays for what's on the list that day."
image       = "locations/the_kitchen.jpg"
image_search_queries = ["ordinary family kitchen table morning light", "kitchen fridge notes table chairs"]
entry_from  = "the_hall"

[[locations]]
id          = "the_front_room"
name        = "The Front Room"
description = "The sofa, the TV, and the window onto the street. It sits between the hall and everywhere, so you cross it to leave and you cross it to come home."
image       = "locations/the_front_room.jpg"
image_search_queries = ["ordinary family living room sofa tv evening", "small front room couch television lamp"]
entry_from  = "the_hall"

[[locations]]
id          = "nate_room"
name        = "@nate's Room"
description = "His door is at the end of the landing and it is not always shut. That is the whole of it. Nothing about this room announces itself."
image       = "locations/nate_room.jpg"
image_search_queries = ["young man bedroom desk monitor dim", "messy student bedroom bed desk night"]
entry_from  = "the_hall"

[[locations]]
id          = "tasha_room"
name        = "Tasha's Room"
description = "Her wardrobe takes one whole wall and her lights are the only ones in this house that were chosen. She gives advice in here whether it was asked for or not."
image       = "locations/tasha_room.jpg"
image_search_queries = ["young woman bedroom wardrobe fairy lights mirror", "girl bedroom clothes rail lights makeup"]
entry_from  = "the_hall"

[[locations]]
id          = "the_master_bedroom"
name        = "The Master Bedroom"
description = "Your mum and @gil's room. Her shift times are on the wall by the door in her own handwriting, and you have read them a hundred times for ordinary reasons."
