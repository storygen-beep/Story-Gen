[[canvases.nodes]]
id   = "base"
name = "On her own for once"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She is on the wall on her own for once, and she moves her bag so there is room, and she means it."

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_paige" }, content = "@player, that colour is really good on you. I mean it, I'd never get away with it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_paige" }, content = "Are you all right? You look like you've been up. You can say if you have." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_paige" }, content = "Don't listen to her about the thing on Tuesday. She's like that with everybody at first." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Every word of it is true and she means all of it, and in about ten minutes she will be stood next to Bree while Bree does the other thing, and she will not say anything then either."

