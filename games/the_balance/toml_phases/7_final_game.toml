# HER DOOR · the only privacy state in the game
#
# ⚠️ THE RULE CAME OFF, 2026-09-23. LO: "Remove the rule for her door open." The
# door is no longer a house rule she is breaking — it is a door she can shut, and
# what it costs is who is in the house while it is shut. The DOOR STAYS: it is the
# same door the stream needs shut, and `door_locked` is the whole gate on going live.
#
# ⚠️ IT IS THE TELEVISION'S SHAPE, ON PURPOSE. One object, two buttons, and it
# remembers — including the asymmetry that took a build to get right: SHUT returns
# to the node so she stays and reads the new state, OPEN returns to the location so
# the room re-renders and whatever the shut door was hiding comes back.
#
# ⚠️ `door_locked` CLEARS OVERNIGHT. The flag is today's decision.
#
# PARKED 2026-09-19: the `door_noticed` tally — a second "Shut the door." row that
# counted every time she shut it on a full house, read by @gil at dinner. That is a
# ladder, not the base; it is in parked/as_built.toml (dinner) and git at ff91336.
# =============================================================================

