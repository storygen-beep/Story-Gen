# =============================================================================
# THE TELEVISION
#
# LO, 2026-09-17: "Sitting on sofa isnt watching tv. Watching tv 5 channels,
# change channel button and tv turn off too." He is right, and `sofa_hour` was
# doing both jobs badly — the set was a noise in the prose and never a thing she
# operated. This is the set. It has state, it remembers, and it is the first
# object in this game the player can leave in a condition.
#
# ⚠️ NO SCHEDULE, ON PURPOSE. It is on the room's screen every hour she is in
# there, including the empty afternoon — which is the point. The house holds
# nobody 08:00-16:00 and until now there was nothing to do in it either. The
# parents are not what makes the television available; they are who might be
# sitting there when she puts it on.
#
# ⚠️ NO max_triggers_per_day EITHER. Flipping channels is not the act. The hour is
# capped by `sofa_today`, which every canvas in this room shares — one hour in
# here a day, and choosing who to spend it with is the decision.
#
# ⚠️ TWO GROUP CHAINS, SEPARATED BY A NON-GROUP BLOCK. Adjacent [group] blocks
# MERGE into one if/elseif chain (CARRIED.md:260-262), which is exactly what each
# chain wants and a disaster if the two fuse: the channel bands would become
# alternatives to the people bands and only one would ever render. The paragraph
# between them is a wall, not decoration.
#
# ⚠️ `eq` COMPARES WITH === AND DOES NOT COERCE (v2.py:4150), so every channel
# band tests a number against a number. `dare_chain` does the same thing already.

[[canvases]]
id   = "watch_tv"
name = "The television"
description = "The set in the front room. Five channels, a button to change them and a button to turn it off, and it remembers what it was left on. What she can leave on depends on who is sitting there."

[canvases.trigger]
location      = "the_front_room"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "The set"

# --- CHAIN A · what is actually on -------------------------------------------
# Five bands, exclusive by construction. The set is off in its own band first,
# because a dark screen is a different sentence from a channel.

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tv_on", operator = "is_false" },
] } }
