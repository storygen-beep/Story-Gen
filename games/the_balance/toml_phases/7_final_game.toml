# ⚠️ ONE IF/ELSEIF CHAIN, ON PURPOSE. Adjacent [group] blocks merge, and the two
# time bands are exclusive by construction. `time_of_day` is NEW TO THIS GAME —
# v2.py:4272-4277, delegating to setup.isCurrentTimeSlot so the wrap behaves
# exactly as an NPC schedule does. It is a window, re-read every time, not a latch.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "time_of_day", start_time = "06:30", end_time = "08:00" },
] } }
