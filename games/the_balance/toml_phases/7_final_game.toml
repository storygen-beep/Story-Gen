# --- DARE TWO · the first one that does not end when it ends -----------------
# THAT GAP IS THE CLIMB. One is a minute. Two is four hours of being looked at,
# and she agrees to all four of them in the two seconds she has to answer.
#
# ⚠️ TWO IS SHUT UNTIL ONE IS DONE. A chain, not a number she can reach some
# other way.
#
# ⚠️ Dare two is the FIRST one about her body, so it is the only one that touches
# exposure and corruption. It is also public, so it is where `reputation` moves
# for the first time in this game.

[[canvases]]
id   = "dare_2_offer"
name = "Jules again"
description = "Dare two. The jacket goes in her bag here and stays there until she goes home — and the rest of that day is delivered by the picking-on system, which reads jacket_off."

[canvases.trigger]
location      = "the_quad"
npc           = "npc_jules"
is_repeatable = true
max_triggers_per_day = 1
priority      = 8
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "dare_chain", operator = "eq", value = 1 },
  { type = "trait", subject = "player", trait_key = "dare_cooldown", operator = "lte", value = 0 },
  { type = "flag", subject = "player", flag_key = "jacket_off", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "The wall by the doors"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She does not say your name across the path this time. She waits until you are close enough that she can say it at a normal volume, which is somehow worse, because it means you are near enough now to be spoken to like that."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_jules" }
content = "Jacket. In the bag. And it stays in the bag until you go home tonight, and we'll know, because we'll see you."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "What is under it is a top you picked this morning for being under a jacket. Bree has already looked. It is eleven in the morning and you are on a campus you cannot leave until five."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Take it off."
targetType = "node"
nodeId     = "dare_2_offer.yes"

[[canvases.nodes.exit_block.choices]]
text       = "Say no."
targetType = "node"
nodeId     = "dare_2_offer.no"

[[canvases.nodes]]
id   = "yes"
name = "In the bag"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You get it off in the middle of the path, roll it, and put it in the bag, and the air on your arms is the first thing that tells you the size of what you just agreed to. Six hours. You had two seconds."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_jules" }
content = "There. That wasn't hard, was it."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She says it without any edge on it at all, and goes back to her phone, and Paige tells you she likes the top, and means it, and that is not better."

[canvases.nodes.exit_block]
type = "location"
text = "Six hours, then."

