    { type = "paragraph", content = "He is at the table with the light off over the cooker, going through a folder of something that is not interesting. The back door is open a crack for the cold." },
    { type = "paragraph", content = "@gil looks up when you come in and then back down. That is the whole greeting and it always has been. The radio says something about the weather on the coast." },
  ] },
]

# ⚠️ THESE TWO MERGE INTO ONE IF/ELSEIF AND THAT IS DELIBERATE. Adjacent [group]
# blocks merge, so only the first matching band renders — and that is what @gil
# does. He notices the chores, the hours and whether Friday got paid, and he says
# ONE of them. The order is the priority: the money first, then the hours. Same
# call `union_cara` makes and for the same reason ("a friend says the most
