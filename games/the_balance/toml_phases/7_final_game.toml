[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "There is a car up on the lift in the near bay. @gil is under it with his arms above his head, doing something that needs both hands and all of his attention. Somebody in the far bay is running an impact gun in bursts." },
  { type = "paragraph", content = "He is at the parts counter with a phone against his shoulder, saying a number twice to somebody who has written it down wrong. He raises two fingers at you without stopping, which means wait." },
  { type = "paragraph", content = "The roller door is up. The cold comes straight in off the strip. @gil is on a stool with a component on the bench in front of him, turning it over, not rushing. Nobody in here has told him what to do in twenty years." },
]

[[canvases.nodes.blocks]]
