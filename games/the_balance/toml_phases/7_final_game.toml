# --- WHERE HE IS WHEN HE IS NOT HERE ------------------------------------------
# ⚠️ offscreen = true IS A BARE TOP-LEVEL KEY on the location, not a sub-table
# (template_import.py:1944). It renders no nav card and never appears in any exit
# list (v2.py:20653-20659), and `world reachable` exempts it (gates.py:5485). The
# only thing it is for is letting a schedule row say where somebody actually went.
#
# ⚠️ IT IS ALSO INVISIBLE TO presence.py, which has no idea the property exists —
# @nate's 18:00 row here needs a hand-written OCCUPANCY_ROWS entry or the run
# reports a DEAD row and exits 1.
#
# ⚠️ A [locations.door] on one of these is a validation error, and so is a `costs`
# block that nobody can ever pay. Keep it bare.
[[locations]]
id          = "the_gym"
name        = "The Gym"
description = "Not a place you have ever been. It is where @nate is between six and seven, and the only thing in his week he does not make a joke out of."
offscreen   = true

# --- getting anywhere --------------------------------------------------------

[[locations]]
id          = "the_bus_stop"
name        = "The Bus Stop"
description = "A pole, a timetable nobody has updated, and a bench somebody has had a go at. The bus into town is two dollars and it takes forty minutes to do what a car does in fifteen."
image       = "locations/the_bus_stop.jpg"
image_search_queries = ["empty bus stop bench suburban street daytime", "bus shelter timetable pole roadside"]
entry_from  = "the_street"
costs       = { time = 5 }
# ⚠️ NO navigation_order ANY MORE. The strip and the campus used to be listed
# here, and the validator hard-fails a navigation_order entry that is not a real
# child ("includes 'the_quad' which is not a destination"). They are reached by
# `catch_the_bus`, an activity on this screen, and that is the whole point.

[[locations]]
id          = "the_strip"
name        = "The Strip"
description = "Downtown, such as it is. A run of shops, half of them open, and the cafe about midway along with its lights on. Forty minutes of your morning to stand here."
image       = "locations/the_strip.jpg"
image_search_queries = ["small town main street shopfronts daytime", "downtown strip shops sidewalk morning"]
navigation_order = ["the_cafe"]
auto_exit   = false
# ⚠️ NO entry_from, AND auto_exit = false. BOTH HALVES OR NEITHER.
#
# THE FARE IS NOT A PROPERTY OF THIS PLACE. It used to be — `costs = { time = 40,
# cash = 2 }` sat here and on the quad, and the engine charges a destination's
# entry cost on ANY move into it (v2.py:16267), including the move back from one
# of its own children. So stepping out of the cafe charged bus fare again and
# burned forty minutes, and under $2 it charged nothing because it BLOCKED her,
# in a room whose only exit was this one. The fare now lives on the choices in
# `catch_the_bus` / `bus_back_strip`, which is where board.map always put it.
#
# Dropping entry_from alone would not be enough: _ordered_navigation builds a
# location's nav grid from its CHILDREN (whoever points entry_from at it), so the
# card would still sit on the bus stop and the bus could be walked around. And
# auto_exit = false alone would not be enough either — it only suppresses the
# automatic "Leave" link. The pattern and the reasoning are vesper's
# (1_metadata_and_locations.toml:1395-1401).

