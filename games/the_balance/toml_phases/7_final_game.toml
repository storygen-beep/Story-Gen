# =============================================================================
# TALK · how she finds out what people say about her
#
# ⚠️ IT COSTS HER A FEW MINUTES. Listening is something she CHOOSES, not something
# that happens at her while she walks past — which is the whole difference
# between this and being picked on, and they are the same sentence from two
# sides: a rumour she catches at the union on Tuesday is what somebody says to
# her face on the quad on Thursday.
#
# ⚠️ THIS IS HOW THE PLAYER FINDS OUT EXPOSURE MOVED. No number, no bar, just two
# people talking who do not know she is behind them. The bands are one if/elseif
# chain and they get SHARPER as she climbs: about other people, then about her,
# then specific enough to frighten her.
#
# ⚠️ HONEST LIMIT, WRITTEN DOWN: talk.md gives this two jobs and only one can land
# yet. "Where people are" points at the row, the gym and her messages, and none of
# those is built, so what ships here is the mirror. The pointing half arrives with
# the row.
# =============================================================================

