[[canvases.nodes]]
id   = "base"
name = "Sat down"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your mum is in the chair in her home clothes, with her hands in her lap and nothing in them. She's sitting down. At an hour she is always on her feet, she is actually sitting down, and she looks like she doesn't know how."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "Don't look at me like that, love. You did my job for me. I'm allowed."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "player" }
content = "I didn't say anything."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "You didn't have to. Sit down, you're making me tired."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Sit down."
targetType = "node"
nodeId     = "talk"
time_progression_minutes = 2

[[canvases.nodes]]
id   = "talk"
name = "Sat with her"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You sit. She lets her head go back against the chair and shuts her eyes, and for a second she looks older than she is. Three nights a week on a ward, and a house full of people who eat, every other hour of it."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "You're a good girl. You know that? I don't say it enough."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "A good girl who owes her husband a hundred and fifty dollars every Friday. Great."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "And @gil. I know he's hard work. But he'd do anything for this family. Anything. You'll see that one day."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your stomach drops. She has no idea. She has no idea what he already did, or what it's costing you, and she's smiling about it with her eyes shut."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "\"Yeah, Mum. I know.\""
targetType = "node"
nodeId     = "know"
time_progression_minutes = 2
flagEffects = [{ targetType = "player", flag = "mum_first_sat_down_seen", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "\"Has he ever told you what he pays for?\""
targetType = "node"
nodeId     = "nearly"
time_progression_minutes = 2
flagEffects = [{ targetType = "player", flag = "mum_first_sat_down_seen", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Say nothing. Let her rest."
targetType = "node"
nodeId     = "quiet"
time_progression_minutes = 2
flagEffects = [{ targetType = "player", flag = "mum_first_sat_down_seen", op = "set" }]

[[canvases.nodes]]
id   = "know"
name = "I know"

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "Good. Good girl."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She pats your hand without opening her eyes. The lie sits in your mouth like a stone. She believes it, because she's too tired not to."

[canvases.nodes.exit_block]
type = "location"
text = "Stay with her."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_front_room"
time_progression_minutes = 26

[[canvases.nodes]]
id   = "nearly"
name = "Nearly"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Her eyes open. For one second she's properly looking at you, and your heart is going so hard you can hear it."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "The bills, love. The house. What do you mean?"

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "One more sentence. That's all it would take. One more sentence and this house explodes."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "player" }
content = "Nothing. Forget it."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She shuts her eyes again. She doesn't ask twice. She never does."

[canvases.nodes.exit_block]
type = "location"
text = "Stay with her."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_front_room"
time_progression_minutes = 26

[[canvases.nodes]]
id   = "quiet"
name = "Quiet"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You don't answer. After a minute her breathing goes slow. She's asleep in the chair with her mouth a little open, and she looks ten years younger."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "Half an hour of her life back. That's all it cost you. Why does it feel like so much?"

[canvases.nodes.exit_block]
type = "location"
text = "Let her sleep."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_front_room"
time_progression_minutes = 26

