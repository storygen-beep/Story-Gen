# --- THE UNION TABLE · the one person who costs her -------------------------
# the_cast.md: everybody else in this game pays her; @cara costs her, an hour at
# a time, which is the one thing she is running out of. And what @cara says out
# loud IS how rest and clean get said without a number on screen — so the bands
# below are gated on those two and nothing else.

[[canvases]]
id   = "union_cara"
name = "Sit with Cara"
description = "An hour that buys nothing the game can count. Her lines read rest and clean, which is how those two get spoken instead of displayed."

# ⚠️ NO max_triggers_per_day, AND THAT IS THE POINT. A cap on the TRIGGER does not
# spend the hour, it deletes Cara: she is scheduled at that table until half two,
# and one click used to remove her portrait from the screen while she was still
# sitting there. The cap now lives on the paying choice as `cara_today`, cleared in
# [engine.daily_tick]. Same throttle, exactly one hour a day, and she stays in the
# room. engine.md §28; process/presence.py is the check.
[canvases.trigger]
location      = "the_union"
npc           = "npc_cara"
is_repeatable = true
priority      = 5
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "The far table"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "She has got the far table and her coat is still on, because she is always cold in here and she has never once mentioned it." },
  { type = "paragraph", content = "She waves the chair out with her foot before you have got across the room. There is already a second tray on the table and it is for you." },
  { type = "paragraph", content = "She is halfway through telling somebody else a story when you sit down, and she starts it again from the beginning for you." },
]

# ⚠️ THESE THREE ARE ONE IF/ELSEIF CHAIN, NOT THREE BLOCKS. Adjacent [group]
# blocks MERGE, so only the first matching band renders — and that is the right
# behaviour here, kept on purpose. A friend says the most pressing thing, not
# three things in a row. The order IS the priority: how wrecked she looks, then
# the bathroom, then where she was on Thursday.
#
# ⚠️ No numbers on screen anywhere. This is rest and clean being SAID.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "rest", operator = "lt", value = 45 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cara" }, content = "You look wrecked. And don't say the bus, because I get the same bus." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "clean", operator = "lt", value = 45 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cara" }, content = "Here. Use mine, it's in my bag. I'm not being off with you, I just know what that house is like for the bathroom." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "attend_3", operator = "lt", value = 40 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cara" }, content = "Where were you Thursday? She went round the table and you weren't in it and I didn't have anything to tell her." },
]

[canvases.nodes.exit_block]
type = "choices"

# ⚠️ THE FLAG GOES ON THE CHOICE, NEVER ON A NODE EXIT — engine.md §28.1. A choice
# runs flagEffects before advanceTime; a node exit runs advanceTime first, and
# advanceTime rolls the day inside itself, so a cap written on an exit that crosses
# midnight locks the rung out of the FOLLOWING day, silently. Measured in off_season.
