# the_cast.md: everybody else in this game pays her; @cara costs her, an hour at
# a time, which is the one thing she is running out of. And what @cara says out
# loud IS how rest and clean get said without a number on screen — so the bands
# below are gated on those two and nothing else.

[[canvases]]
id   = "union_cara"
name = "Sit with Cara"
description = "An hour that buys nothing the game can count. Her lines read rest and clean, which is how those two get spoken instead of displayed."

# ⚠️ NO max_triggers_per_day, AND THAT IS THE POINT. A cap on the TRIGGER does not
# spend the hour, it deletes Cara: she is scheduled at that table until half two,
# and one click used to remove her portrait from the screen while she was still
# sitting there. The cap now lives on the paying choice as `cara_today`, cleared in
# [engine.daily_tick]. Same throttle, exactly one hour a day, and she stays in the
# room. engine.md §28; process/presence.py is the check.
