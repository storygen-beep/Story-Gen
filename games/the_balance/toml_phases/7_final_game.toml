# ⚠️ GATED ON `friday_settled` SINCE 2026-09-23, because there are now TWO places to
# pay him — here and `friday_payment_garage`, which covers the four hours he is in
# the garage on a Friday night. Both set the flag on every exit, paid AND missed,
# and a purse with $300 in it would otherwise have paid the same $150 twice.
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "friday_settled", operator = "is_false" },
] }

# ⚠️ THE WINDOW IS STILL 17:00-21:00 AND HE IS ONLY IN THIS ROOM FOR ONE HOUR OF IT
# — 18:00 to 19:00. That is not a bug in the schedule: the portrait lane checks
# presence after selection (v2.py:5281-5291), so the card simply does not render in
# the hours he is elsewhere. The evening is covered because the garage has the rest
# of it. Narrowing this to 18:00-19:00 would be tidier and would also mean the card
# stops existing the day his kitchen row moves again.
