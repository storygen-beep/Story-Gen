id   = "base"
name = "What needs doing"
[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Three meals and the dishes after each of them, and none of it is anybody's job in the sense of being written down. It is just what the room is like when you walk into it." },
  { type = "paragraph", content = "The pans from the last thing are still on the side and the next thing is due in an hour. That is the kitchen most of the time, and it is the same kitchen whoever is in it." },
  { type = "paragraph", content = "Somebody has to, and there is nobody else in here. Half an hour of it and the room looks like a room again until the next meal." },
]
