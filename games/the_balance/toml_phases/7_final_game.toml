# ⚠️ THE LOCK ACTUALLY WORKS, 2026-09-22 — AND IT HOLDS TWO PEOPLE NOW, 2026-09-23.
# The description has always said the lock works and canvas_opening promises it on the
# first screen — "the bathroom is gone until whoever is in there comes out" — and until
# 2026-09-22 the player could walk in on her mum in the bath and be offered "Get in the
# shower."
#
# ⚠️ THIS USED TO BE A FLAT `logic = "OR"` STATING WHEN THE DOOR WAS OPEN, and the
# comment here said the shape was forced: `present AND (w1 OR w2 OR w3)` cannot be
# written in one flat items list, but its complement can. That was true and it stopped
# being enough the day @gil got a bath row (gil_cards.md, 2026-09-23). A second person
# needs a second `is_absent`, and under OR a second absence OPENS the door for the
# first — at 23:15 her mum is absent, so the OR was satisfied and @gil's door swung.
#
# ⚠️ WHAT FIXED IT: FOUR NAMED GATES AND AN `AND` OF FOUR NEGATIONS. The door is open
# unless somebody is ACTUALLY bathing. Each helper is one person paired with one window
# — NOT one helper per person, because template_import.py:5643 hard-fails `logic = "OR"`
# inside a stage helper and :5634 hard-fails a nested `type = "stage"`, so a helper is
# AND-of-primitives and a disjunction has to be split into one helper per arm. The
# runtime would have nested; the validator is the thing that refuses. Both checked in
# the importer first. The helpers are in 0_systems_spec.toml with the full reasoning.
#
# ⚠️ THE COMPLEMENT WINDOWS ARE GONE, and with them the class of bug where an "open"
# window silently drifts from the bath row it was the inverse of.
#
# ⚠️ HER LAUNDRY HOURS STILL COME THROUGH, for the reason they always did and by a
# better route: `mum_laundry` is a card INSIDE this room, and `lynn_bathing` now asks
# whether she is in a BATH window rather than whether she is in the room at all.
entry_conditions = { version = "1.0", logic = "AND", items = [
  { type = "stage", helper = "lynn_bath_morning", operator = "is_false" },
  { type = "stage", helper = "lynn_bath_ward",    operator = "is_false" },
  { type = "stage", helper = "lynn_bath_sunday",  operator = "is_false" },
  { type = "stage", helper = "gil_bathing",       operator = "is_false" },
] }
# ⚠️ IT NO LONGER NAMES ANYBODY, and the old comment here predicted exactly this: the
# message was "safe to name her only because the gate above is hers alone; the day Nate
# or Tasha lock this door too, it goes back to saying nothing." @gil locks it now.
blocked_message = "The door is shut and the tap is running. Somebody is in there, and the bathroom is gone until they come out."

