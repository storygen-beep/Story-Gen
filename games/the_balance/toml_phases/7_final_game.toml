# =============================================================================
# @GIL AT THE KITCHEN TABLE
#
# LO played the build: "Gil shows in the kitchen but on entering kitchen nothing
# is there." Twelve samples, and his portrait rendered on exactly one day — the
# only thing bound to him in that room was `friday_payment`, which carries a
# Friday schedule. Six nights in seven it cannot fire, so there was no clickable
# @gil. His weekday-morning row, 06:30-08:00, had nothing at all.
#
# ⚠️ A HUB IS THE RIGHT SHAPE FOR HIM SPECIFICALLY, and the cast page says why:
# "He never opens a step. Every step with him is one she opens. There is no move
# he can make on his own, WHICH IS THE WHOLE REASON THE GAME CAN HAVE HIM AT THE
# KITCHEN TABLE." He sits there; she opens everything or nothing happens.
#
# ⚠️ PRIORITY 5 AGAINST friday_payment's 11. The portrait selector takes the
# highest-priority canvas per NPC, so a Friday evening still opens on the money.
# Once that is spent for the day the hub takes the portrait back, which is right:
# she pays him, and he is still sitting there.
#
# ⚠️ THIS IS NOT HIS CRUDE SURFACE AND MUST NOT BECOME ONE. CARRIED.md:203 puts
# his register in THE GARAGE, late. The kitchen is the list, the money, the rules
# and being noticed — same split as Tasha's room against her bathroom.
#
# ⚠️ No max_triggers_per_day and no trigger schedule: `requires_npc` resolves
# through getNpcLocation, so his two rows ARE this canvas's hours and one canvas
# covers the morning table and the evening table without them drifting apart.

[[canvases]]
id   = "hub_gil_kitchen"
name = "Gil"
description = "Portrait hub @ the_kitchen, both his rows. Reads her own state back at her — the list, the count of missed Fridays, the hours she keeps. Talk and state only; the money is friday_payment and the register is the garage."

[canvases.trigger]
