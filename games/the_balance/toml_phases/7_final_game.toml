# --- FRIDAY · the payment ----------------------------------------------------
# money.md: $2,400 for the semester, $150 every Friday, sixteen weeks and it is
# clear. the_week.md: handed over in the kitchen on Friday evening, and @gil is
# there because he is always there at six.
#
# ⚠️ [settings.rent] IS STILL DELIBERATELY ABSENT and this is why. The engine's
