# --- SLEEP · the only thing that turns the week -----------------------------
# ⚠️ WITHOUT THIS FRIDAY IS UNREACHABLE. advanceDay() is what rolls the day name,
# the day counter, the week on a Monday, [player.trait_decay] and the
# [engine.daily_tick] clears — and the only thing that calls it is the clock
# crossing midnight. Before this canvas the sidebar's wait buttons were the sole
# way to get there, and rest decayed with nothing to refill it.
#
# ⚠️ FIXED +540, NOT "until morning". There is no sleep-until-hour key, and the
# fixed number is the design anyway: the_week.md says she can stay up as late as
# she likes and it costs her the next morning. Bed at ten is up at seven. Bed at
# one is up at ten, and the nine o'clock is gone.

[[canvases]]
id   = "sleep"
name = "Sleep"
description = "Nine hours from whenever she lies down. Fills rest. The clock crossing midnight is what fires advanceDay, so this is the week's only engine."

[canvases.trigger]
location      = "her_room"
is_repeatable = true
max_triggers_per_day = 1
priority      = 4
is_active     = true

[[canvases.nodes]]
