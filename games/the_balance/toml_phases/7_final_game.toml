# =============================================================================
# THE BATHROOM · the knock, the lock, and what is behind it
#
# ⚠️ EVERY CANVAS IN THIS BLOCK IS DOOR-ONLY. `hidden_from_location = true` keeps
# them off the room's own activity list while leaving them in the build with a
# resolvable entry passage — the engine's five render selectors skip them and
# nothing else does (v2.py:4793, :4824, :4856, :5346, :5466, all commented
# "door-only — reachable from a launcher, never from this screen"). They need a
# trigger `location` all the same: a canvas with no trigger is pruned before the
# door is built and its option is silently DROPPED (v2.py:12766-12781).
#
# ⚠️ NONE OF THEM CARRIES AN `npc`. A canvas with one renders as a portrait card in
# the room, which is the bucket the two Tasha hubs already own at that hour. These
# are reached from the threshold or not at all.
#
# ⚠️ THE ROWS THEY BACK. presence.py backs a schedule row four ways and a DOOR IS
# NOT ONE OF THEM — it never reads locations[].door. What backs @gil's, @lynn's and
# @tasha's new bathroom rows is that each of them SPEAKS in here: speakers_of()
# walks every dict for props.npcId at any depth, so one line inside a conditional
# band counts.
# =============================================================================

[[canvases]]
id   = "bath_knock"
name = "Knock"
description = "Door-only. The answer through a locked bathroom door, banded by who is behind it. Sets `knocked_once`, which is what makes the lock worth looking at."

[canvases.trigger]
location      = "the_bathroom"
is_repeatable = true
hidden_from_location = true
priority      = 4
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Through the door"

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_bathroom", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "Two knocks. The water does not stop, and nothing happens for long enough that you start to go, and then @gil turns it off. He waits until you have heard it go quiet before he says anything at all." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "Twenty minutes. You knew that when you came up." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "And if it is about Friday, it is Friday either way. Knocking on a door at six does not move Friday." },
  { type = "paragraph", content = "The water goes back on. That is the whole conversation and it is the same one every time, and you are stood on a landing with your hand still up." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_bathroom", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "You knock once, quietly, because it is ten to eight in the morning and your mum has been on her feet since seven the night before." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Two minutes, love. Two minutes and it is yours." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Have you eaten? There is bread. Do not go out on nothing again, I am not asking you, I am telling you." },
  { type = "paragraph", content = "She says it like somebody apologising, in her own house, to her own daughter, for washing. It takes eleven minutes and you do not knock again." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "You knock and @nate does not turn the water off to answer, so whatever he says comes through it half-drowned, and he does not repeat it. He is in there forty-five minutes on a weekday, but the bus does not wait for either of you." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "Use the one downstairs. There isn't one downstairs. That's the joke." },
  { type = "paragraph", content = "He has made it before. He will make it again on a morning when you are actually late, and he knows exactly which mornings those are." },
]

