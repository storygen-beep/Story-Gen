    { type = "paragraph", content = "@gil is at the end of the table with the radio on and the paper folded to the part he wants. He has been up for an hour. He does not ask whether you slept." },
    { type = "paragraph", content = "The kettle has already gone. There is a cup out for you that you did not ask for, and @gil is reading the list on the fridge from where he is sitting, without getting up." },
  ] },
  { type = "paragraph", content = "Twenty minutes until the bus, and he knows that better than you do." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The radio is on low and @gil has the table to himself, with his hands flat on it either side of the mug. He is not waiting for anything, but he is not finished either. He is just where he sits." },
    { type = "paragraph", content = "He is at the table with the light off over the cooker, going through a folder of something that is not interesting. The back door is open a crack for the cold." },
    { type = "paragraph", content = "@gil looks up when you come in and then back down. That is the whole greeting and it always has been. The radio says something about the weather on the coast." },
  ] },
]

# ⚠️ THESE TWO MERGE INTO ONE IF/ELSEIF AND THAT IS DELIBERATE. Adjacent [group]
# blocks merge, so only the first matching band renders — and that is what @gil
# does. He notices the chores, the hours and whether Friday got paid, and he says
# ONE of them. The order is the priority: the money first, then the hours. Same
# call `union_cara` makes and for the same reason ("a friend says the most
# pressing thing, not three things in a row").
# ⚠️ The live walk caught this as a failure before it was understood as a choice.
# If a future pass wants both to show, they need a non-group block between them.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "fridays_missed", operator = "gte", value = 1 },
] } }
blocks = [
