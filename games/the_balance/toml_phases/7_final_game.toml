# =============================================================================
# The Balance — 1 · locations and people
#
# SLICE 1. Eight rooms and two people — the fewest that let her get from her bed
# to Owen. The other twenty-two locations are budgeted in v2_state.json board.locations
# and are not built yet.
#
# ⚠️ [[npcs]] and their [[npcs.schedules]] live in THIS one file. A schedule block
# that drifts below the next [[npcs]] header silently re-attaches to that NPC.
# =============================================================================

# --- the house ---------------------------------------------------------------

