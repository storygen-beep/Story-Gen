[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "The lock turns and the handle goes dead in your hand. It is a cheap one and it holds anyway. Somebody runs a tap on the other side of the wall while you stand the phone on the cistern and tip it up at yourself." },
  { type = "paragraph", content = "You prop the phone against the mirror, which gives them two of you at once, and they will like that more than it deserves. The extractor fan is loud enough to cover a voice and nothing else." },
  { type = "paragraph", content = "Somebody laughs out on the floor, near enough to be at the door. You wait for it to move off, and it does, and you are still in here with your thumb over the button." },
]

