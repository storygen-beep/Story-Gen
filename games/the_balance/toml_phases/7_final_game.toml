# --- THE OTHER TWO ----------------------------------------------------------
# Thin on purpose — the crowd's voice, not two more climbs. But a scheduled
# character with nothing of her own is a name on a timetable, and these two are
# the whole reason the quad reaches the dinner table.

[[canvases]]
id   = "paige_is_nice"
name = "Paige"
description = "She is lovely to your face, every time, and she lets Bree do it anyway. Costs nothing, gives nothing, and is worse than being sneered at."

# ⚠️ NO max_triggers_per_day, AND NO CHOICE FLAG EITHER. She is on that wall from
# ten until two and the trigger cap used to take her off the screen after one
# click. Nothing replaced it, because the cap was never holding anything shut:
#   · `crowd_standing` is read SEVEN times in this game and all seven are the same
#     `gte 10` threshold, so once it is crossed the meter is inert — climbing it
#     further buys nothing.
#   · `npc_paige.relation` is read by no condition anywhere.
#   · The choices cost ten minutes each, and the clock is the thing she is short
#     of. An afternoon spent on this wall is an afternoon gone.
# And the day flag could not have gone on the second choice regardless: its gate
# is an OR, the evaluator takes one flat `items` list with one `logic`
# (v2.py:4037-4039), and there is no nesting — so an AND cap cannot be added
# without deleting the reputation route into it.
[canvases.trigger]
location      = "the_quad"
npc           = "npc_paige"
is_repeatable = true
priority      = 3
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "On her own for once"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She is on the wall on her own for once, and she moves her bag so there is room, and she means it."

# ⚠️ The third line used to be "the thing on Tuesday" and sat in the pool, so it
# could greet a player who had never met Jules. dare_chain rises when she does a
# dare and dare_cooldown when she refuses one, so either means it happened.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "OR", items = [
  { type = "trait", subject = "player", trait_key = "dare_chain", operator = "gte", value = 1 },
  { type = "trait", subject = "player", trait_key = "dare_cooldown", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_paige" }, content = "Don't listen to her about the dare. She's like that with everybody at first." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_paige" }, content = "Are you all right? You look like you've been up. You can say if you have." },
  ] },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_paige" }, content = "@player, that colour is really good on you. I mean it, I'd never get away with it." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_paige" }, content = "Are you all right? You look like you've been up. You can say if you have." },
  ] },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Every word of it is true and she means all of it, and in about ten minutes she will be stood next to Bree while Bree does the other thing, and she will not say anything then either."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Take it at face value."
targetType = "location"
locationId = "the_quad"
time_progression_minutes = 10
show_when_locked = true
locked_text = "You have already been decent at her once today."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "paige_today", operator = "is_false" },
] }
effects     = [{ targetType = "npc", npcId = "npc_paige", trait = "relation", op = "add", value = 2 }]
flagEffects = [{ targetType = "player", flag = "paige_today", op = "set" }]

# ⚠️ TWO CHOICES FOR ONE ACT, AND THE ENGINE LEAVES NO OTHER SHAPE. The day cap
# has to be ANDed onto the standing gate, and `triggerConditionsSatisfied` takes one
# flat `items` list with ONE `logic` (v2.py:4037-4039) — there is no nesting, so
# `flag AND (crowd OR reputation)` cannot be written as a single condition. Folding
# the OR into an AND would delete the reputation route, and that route is authored
# forward: `reputation` starts at 5 and has exactly ONE source in the build
# (`dare_2_offer` +6), so it tops out at 11 and every `gte 20` read is waiting on a
# later release. So: one choice per route, both capped by the same flag. Only the
# crowd_standing one shows when locked, so today the player sees exactly one.
#
# ⚠️ AND THE CAP IS NOT OPTIONAL. Taking it off the trigger without replacing it
# made `gates.py` "the climb is paid for" fail — `crowd_standing` gates content at
# 10 and became reachable with no cost, no cap and 20 minutes of game time.
[[canvases.nodes.exit_block.choices]]
text       = "Say you know what she does after."
targetType = "location"
locationId = "the_quad"
time_progression_minutes = 10
show_when_locked = true
locked_text = "Not to her. Not with nobody behind you."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key  = "paige_today", operator = "is_false" },
  { type = "trait", subject = "player", trait_key = "crowd_standing", operator = "gte", value = 10 },
] }
effects     = [{ targetType = "player", trait = "crowd_standing", op = "add", value = 2 }]
flagEffects = [{ targetType = "player", flag = "paige_today", op = "set" }]

# The reputation route. Hidden, not shown-locked — see above.
[[canvases.nodes.exit_block.choices]]
text       = "Say you know what she does after."
targetType = "location"
locationId = "the_quad"
time_progression_minutes = 10
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key  = "paige_today", operator = "is_false" },
  { type = "trait", subject = "player", trait_key = "reputation", operator = "gte", value = 20 },
] }
effects     = [{ targetType = "player", trait = "crowd_standing", op = "add", value = 2 }]
flagEffects = [{ targetType = "player", flag = "paige_today", op = "set" }]

# Unconditional — the free door on a spent day. Both of Paige's paying choices
