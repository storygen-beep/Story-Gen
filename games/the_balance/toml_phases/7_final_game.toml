[[canvases.nodes]]
id   = "breakfast"
name = "Your mum"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your mum is at the stove in her home clothes with two pans going and the radio on. She's been up since quarter to seven."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "Four people eat this. One person makes it. Every single day."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "Morning, love. Pass me the plates, would you?"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You pass them. She takes them without looking."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "And you're alright for money? You'd tell me."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "No, I wouldn't. Because he paid, and you don't know, and I owe him a hundred and fifty dollars on Friday."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Through the wall, @gil turns a page of his paper."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "player" }
content = "I'm fine, Mum."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "Good girl."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She believes you, because she's too tired not to."

[canvases.nodes.exit_block]
