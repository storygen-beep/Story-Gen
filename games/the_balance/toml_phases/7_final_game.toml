# --- THE SHOP · his work, and she is the new one on that street --------------
# gil_cards.md, LO's call over my recommendation — I argued for keeping the job a
# word and he put it on the map. It hangs off the strip, beside the cafe, so ONE
# bus fare reaches both and no new route, cost or travel canvas exists.
#
# ⚠️ THE SCENE IS NOT THE GARAGE AGAIN. At home she is family standing in his
# space. Here she is a visitor in his working life, in front of men who have known
# him longer than she has — and for once "he never opens a step" reads as ordinary
# rather than as coldness. He is at a bench. He is busy. This is the one place
# where him giving her nothing is not about her.
#
# ⚠️ NOBODY ELSE IN THIS SHOP GETS A NAME, A ROW OR A PORTRAIT. The other mechanics
# are prose — a voice from the far bay, somebody else's legs under a car. The day
# one of them is a person is its own round.
#
# ⚠️ requires_npc ALONE, and the windows fence themselves: he is here 08:00-17:30
# Monday to Friday and the shop does not exist to her at a weekend, because he is
# in the garage at home. No rule says so. His week does.

[[canvases]]
id   = "hub_gil_shop"
name = "Gil"
description = "Portrait hub @ the_shop, his one work row. Where the free ride home is, for anybody standing there before half five."

[canvases.trigger]
