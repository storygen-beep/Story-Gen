[[canvases.nodes]]
id   = "door"
name = "The front door"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "At the front door you check your purse again, like the number might have changed. Ten dollars."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You need a hundred and fifty by Friday. You have no job, no plan, and about an hour before your first class."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Then your phone buzzes. A message on your stream account, from one of your three hundred and eighty followers. Not one of them has ever seen your face."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "\"Good luck on your first day, Nell.\""

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "How do they know my name? How do they know it's today?"

