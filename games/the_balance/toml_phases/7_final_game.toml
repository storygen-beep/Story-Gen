# --- THE CHORES · nine of them, each in its own room at its own hour ---------
# sheets/systems/chores.md. Each chore is done in the room it happens in, in the
# hours it makes sense in, and it takes half an hour.
#
# ⚠️ THEY PAY NOTHING AND THERE IS NO LIST, 2026-09-23. LO: "Remove the Chores and
# payment / And fridge list. Chores are simply available as it is." What went: the
# five dollars, `chore_paid_today`, the dated line on the fridge, the whole
# first-one-a-day pointer, and the hour-instead-of-half-an-hour penalty that a
# missed Friday used to put on every chore. What stayed: the chores themselves,
# their rooms, their windows, and the half hour they cost her.
#
# ⚠️ A CHORE IS NOW ONE CHOICE, NOT THREE. The three variants existed only to
# express paid / paid-while-behind / already-paid. With no money there is one.
#
# ⚠️ NO max_triggers_per_day ON THESE TRIGGERS — it shuts the whole room after the
# first chore of the day, and the kitchen has six. The per-chore `chore_done_*`
# flags are what stop a chore being done twice.
#
# ⚠️ HELPING HER IS A SEPARATE CANVAS, AND THAT IS THE WHOLE POINT OF IT. The first
# build of this put "Do it with her." on the room canvas behind
# `npc_at_location npc_lynn is_present` plus the chore's own window — which offered
# to help her with the laundry WHILE SHE WAS IN THE BATH, because the bathroom
# window is 08:00-22:00 and she is in that room for both. Her hours are per
# weekday, a choice cannot read the weekday, and a trigger schedule can: so each
# `mum_*` canvas below carries HER rows, copied off MUM_ROWS in gen_week.py so the
# two cannot drift.
#
# Generated by games/the_balance/process/gen_week.py. Edit the tables there.

[[canvases]]
id   = "chores_kitchen"
name = "The kitchen"
description = "The six that happen in here. Half an hour each, and they are there whether or not anybody has said anything about them."

[canvases.trigger]
location      = "the_kitchen"
is_repeatable = true
priority      = 4
is_active     = true

# the_house_day.md: "@gil notices things there — the chores, the hours she
# keeps, whether Friday got paid." He is in that room morning and evening.
[[canvases.trigger.substitutions]]
target_canvas_id = "gil_notices"
chance = 0.3
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_kitchen", operator = "is_present" },
] }

