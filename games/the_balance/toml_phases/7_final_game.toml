# =============================================================================
# CAMPUS · FOUR SUBJECTS, NINE TO TWELVE
#
# ⚠️ REST'S DOOR, AT LAST. It has been a declared need since slice 1, filled by
# sleeping and read by NOTHING — the one meter gates.py still called a number the
# player watches move. college.md always said what it was for: "low, she misses
# the nine o'clock, and attendance is the only road to her marks."
#
# ⚠️ FOUR DISTINCT CANVAS NAMES. max_triggers_per_day is counted off the NAME in
# game_state.activity_trigger_history, so two classes sharing one would share a
