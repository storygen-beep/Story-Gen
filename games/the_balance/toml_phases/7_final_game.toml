      { type = "paragraph", content = "She's sat down with her hands empty, and she keeps looking at the door like the next job is going to walk in." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Somebody else did my job this morning. My feet don't know what to do with themselves." },
    ] },
