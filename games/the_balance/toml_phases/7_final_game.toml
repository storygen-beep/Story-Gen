entry_from  = "the_hall"

# The room's own line stops being true the day she breaks the lock.
[[locations.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "lock_broken", operator = "is_true" },
] }
text = "The shower, the mirror, and a lock that turns without catching on anything. It was the only room in this house that was ever properly yours. You are the one who changed that, and you did it on purpose."

# =============================================================================
# THE DOOR · a threshold instead of the room. engine.md §44, the-map.md R6.
#
# ⚠️ R6c SAYS A SHARED ROOM GETS NO DOOR, AND THIS IS A DELIBERATE OVERRULE.
# "A bathroom, a kitchen, a front room — she walks in. Occupancy is a row INSIDE
# the room, not a threshold in front of it… a locked bathroom is a sentence, not a
# screen." Measured across 27 shipped sandboxes. LO was shown it and chose the
# screen, because in THIS house the lock is a thing she can act on and a sentence
# cannot be acted on. `gates.py lint_doors` prints the objection on every run —
# "the_bathroom is scheduled for 4 characters" — and that finding is EXPECTED, is
# advisory, and must not be silenced.
#
# ⚠️ THE TWO-CLICK TAX IS REAL AND IT IS THE PRICE. This is the room she visits
# most, and an empty bathroom is now one extra click, every time, all game.
#
# ⚠️ EVERY `canvas_id` BELOW MUST EXIST AND CARRY A TRIGGER LOCATION. A canvas with
# no trigger is pruned before the door is built and the option is DROPPED with only
# a log warning (v2.py:12766-12781). All four targets live at `the_bathroom` with
# `hidden_from_location = true`, which is the engine's own "door-only" mechanism —
# five render selectors skip them and nothing else does (v2.py:4793 and four twins).
#
# ⚠️ EVERY `conditions` BLOCK CARRIES version = "1.0". Without it the engine fails
# OPEN and the option is never gated at all.
[locations.door]
description = "The door at the top of the stairs. Nobody is behind it and the light is off."
# R6: the field's refusal runs a median of eight words and is allowed to be the
# same line every time. The value of the screen is its structure.
no_answer   = "You stand outside it a minute. There is nothing to be done about a door."

# FIRST MATCH WINS, and `description` above is the <<else>>. Broken-lock variants
# come first so they beat the locked ones for the same person.
[[locations.door.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_bathroom", operator = "is_present" },
  { type = "flag", subject = "player", flag_key = "lock_broken", operator = "is_true" },
] }
text = "The light is on and the fan is going, and the handle turns the whole way. It has turned the whole way since the afternoon you made sure it would. Whoever is in there does not know that yet, or has stopped minding."

[[locations.door.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_bathroom", operator = "is_present" },
] }
text = "The handle does not turn. The water is going hard enough to hear from the stairs and his boots are outside the door with the day still on them. He is in there twenty-five minutes and he locks it every single time."

[[locations.door.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_bathroom", operator = "is_present" },
] }
text = "The handle does not turn, and there is no noise behind it except the water. She has been on a ward for twelve hours and this is the half hour she gets before she sleeps through the middle of the day."

[[locations.door.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_tasha", location_id = "the_bathroom", operator = "is_present" },
] }
text = "The handle does not turn. There is music coming through it and she is singing over the top of the music without getting any of it right. Tasha locks doors the way she does everything, loudly and without meaning much by it."

[[locations.door.description_variants]]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_nate", location_id = "the_bathroom", operator = "is_present" },
] }
text = "The handle does not turn. The fan is on and the water has been running long enough to have gone through the tank, and he is not hurrying, and there is a bus in twenty minutes that you are going to be on and he is not."

