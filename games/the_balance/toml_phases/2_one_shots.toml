[[canvases.nodes]]
id   = "base"
name = "The floor"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your first shift, and it's chaos from the first minute. Trays, tables, a man who sends his eggs back twice. Owen watches every mistake and says nothing. It's worse than yelling."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Then a girl in the same apron grabs your arm by the coffee machine. She's pretty, a little older than you, and she's looking at you like she already knows everything about you."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "unknown" }
content = "Nell, right?"

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_owen" }
content = "Table six. Now."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "I never told anyone in here my name."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She winks, looks you up and down, slow, and goes back to her tables before you can ask."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Go after her."
targetType = "node"
nodeId = "after"
time_progression_minutes = 2

[[canvases.nodes.exit_block.choices]]
text = "Get back to work."
targetType = "node"
nodeId = "end"
time_progression_minutes = 175

[[canvases.nodes]]
id   = "after"
name = "Later"

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "unknown" }
content = "Later, Nell. Table four's waiting, and he's watching you."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She's right. Owen is watching you."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Get back to work."
targetType = "node"
