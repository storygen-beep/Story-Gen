[[canvases.nodes]]
id   = "door"
name = "The front door"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "At the front door you check your purse again, like the number might have changed. Ten dollars."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You need a hundred and fifty by Friday. You have no job, no plan, and about an hour before your first class."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Then your phone buzzes. A message on your stream account, from one of your three hundred and eighty followers. Not one of them has ever seen your face."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "\"Good luck on your first day, Nell.\""

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "How do they know my name? How do they know it's today?"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You need money. Get the job at the cafe on the strip, or go live from your room with the door locked. Class is nine to twelve, Monday to Thursday, and a missed class goes on the sheet. People are in different places at different hours, and what you say changes how they treat you. Rest and Clean drop every day. Sleep fills Rest, and a shower fills Clean."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Skip class. Bus into town for the job. $2, forty minutes."
targetType = "location"
locationId = "the_strip"
time_progression_minutes = 40
costs = [{ trait = "cash", value = 2 }]

[[canvases.nodes.exit_block.choices]]
text = "Bus to campus. $2, forty minutes."
targetType = "location"
locationId = "the_quad"
time_progression_minutes = 40
costs = [{ trait = "cash", value = 2 }]

[[canvases.nodes.exit_block.choices]]
text = "Walk to campus and keep the $2. An hour."
targetType = "location"
locationId = "the_quad"
time_progression_minutes = 60

# --- A2 · ASKING FOR THE JOB -------------------------------------------------
# sheets/systems/the_move_up.md. Step ZERO of the cafe arc — not the cafe.
#
# ⚠️ REPEATABLE on purpose, and rendered as Owen's own link at the location
# (npc inside [canvases.trigger]). She is allowed to walk out without asking —
# the_move_up.md: "She can put it off." A non-repeatable one-shot would burn on
# the walk-out and she could never come back, which stalls the slice on its only
# real choice. The gate is has_job, so it stops offering itself the moment she
# has the job.

[[canvases]]
id   = "canvas_ask_owen"
name = "Ask about the job"
description = "Meeting Owen and taking the job. Repeatable until has_job, because walking out is allowed and the card stays in the window. Sets has_job and met_owen."

[canvases.trigger]
location = "the_cafe"
npc = "npc_owen"
is_repeatable = true
priority = 8
is_active = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "has_job", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "The counter"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The cafe smells like burnt coffee. The man behind the counter watches you all the way across the floor, and he doesn't smile. He owns the place, and he looks like he's already decided what you're worth."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_owen" }
content = "You're not a customer. So you're here about the card."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "player" }
content = "I need the job."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_owen" }
content = "Everybody needs the job. Owen. I own it. Three dollars a shift. Three hours. Five shifts a day. You show up late, you don't work. You screw up, you're gone."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "Three dollars? That's insane."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_owen" }
content = "Take it or leave it. There's a queue of girls who'll take it."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Take the job."
targetType = "node"
nodeId = "hired"
time_progression_minutes = 2
flagEffects = [
  { targetType = "player", flag = "has_job", op = "set" },
  { targetType = "player", flag = "met_owen", op = "set" },
]

[[canvases.nodes.exit_block.choices]]
text = "Ask for more money."
targetType = "node"
nodeId = "more"
time_progression_minutes = 2
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "asked_owen_more", operator = "is_false" },
] }
effects = [
  { targetType = "npc", npcId = "npc_owen", trait = "relation", op = "add", value = 1 },
]
flagEffects = [
  { targetType = "player", flag = "asked_owen_more", op = "set" },
]

[[canvases.nodes.exit_block.choices]]
text = "Walk out."
targetType = "location"
locationId = "the_strip"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "more"
name = "More"

[[canvases.nodes.blocks]]
