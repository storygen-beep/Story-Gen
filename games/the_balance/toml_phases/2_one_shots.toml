[[canvases.nodes]]
id   = "end"
name = "Three dollars"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Three hours later you walk out with three dollars in your pocket and your feet killing you."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You need a hundred and fifty by Friday. The cafe pays three dollars a shift. And a girl you've never met knows your name."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your phone buzzes. A message under your last stream."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "\"See you at work tomorrow, Nell.\""

