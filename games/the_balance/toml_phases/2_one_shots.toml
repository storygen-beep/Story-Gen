[[canvases.nodes]]
id   = "nate"
name = "Quarter to eight"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "In the hall the bathroom door opens, and your @nate.rel, @nate, walks out with his hair still wet and a towel around his neck. He sees you and stops dead."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_nate" }
content = "Oh, great. You're still here."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He's twenty, a senior at your college, and he has hated having you in this house since the day you moved in."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "His eyes drop to your legs, then snap back up to your face. Too late. You saw it. He knows you saw it."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "He hates me. So why does he keep looking?"

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_nate" }
content = "Don't talk to me at college. We're not related."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your face is hot. And the worst part is, for a second there, you liked it."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Smile at him."
targetType = "node"
nodeId = "nate_smile"
time_progression_minutes = 2
effects = [
  { targetType = "npc", npcId = "npc_nate", trait = "arousal", op = "add", value = 1 },
]

[[canvases.nodes.exit_block.choices]]
text = "Ignore him."
targetType = "node"
nodeId = "nate_ignore"
time_progression_minutes = 2

[[canvases.nodes.exit_block.choices]]
text = "\"Stop staring, then.\""
targetType = "node"
