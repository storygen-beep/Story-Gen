# --- A1 · THE OPENING --------------------------------------------------------
# F2: a small boot in her room, then the capstone in the front room. Gil is there
# ALONE 06:45-07:30, which is the only place he can say Friday: her mum is in the
# kitchen 07:00-08:00 on a Monday and does not know he paid (money.md).
# Hidden per-person scores move on the choices and are never printed
# (the-meters.md, "What the player is shown"). See process/NPC_SCORE_FLOOR.md.

[[canvases]]
id   = "canvas_opening"
name = "Opening"
description = "Boot. Her room at seven: who she is, the debt, the ten dollars, the secret, what she wants. Hands over to the front room at ten past and sets came_down."

[canvases.trigger]
location = "her_room"
is_repeatable = false
priority = 12
is_active = true

[[canvases.nodes]]
id   = "wake"
name = "Monday"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your alarm goes off at seven, and you already hate today."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You're eighteen. College starts in two hours. And you owe your @gil.rel a hundred and fifty dollars. This Friday, and every Friday after that, until the whole semester is paid back."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "He paid my tuition. That doesn't make him generous. It makes me his."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You check your purse. Ten dollars. You're broke."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "And your mum has no idea he paid. If she ever finds out, this house explodes."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "What you actually want is simple. Money of your own. And for somebody in this house to finally look at you like a grown woman instead of the kid who moved in."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "I need money. Fast."

[canvases.nodes.exit_block]
type = "location"
text = "Get dressed and go down."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId = "the_front_room"
time_progression_minutes = 10

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag = "came_down"
op = "set"

[[canvases]]
id   = "opening_house"
name = "Monday morning"
description = "Capstone of the opening, one-time. Gil alone in the front room at ten past seven (the money, the job, the first choice), her mum at the stove, Nate out of the shower at quarter to eight, and the front door. Sets opening_done and the three meeting flags on the way to the door."

[canvases.trigger]
location = "the_front_room"
is_repeatable = false
priority = 12
is_active = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "came_down", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0]
start_time = "07:00"
end_time   = "07:30"

[[canvases.nodes]]
id   = "gil"
name = "Ten past seven"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your @gil.rel, @gil, is in his chair in the front room with the paper and the radio on low. He looks you up and down over the top of the page."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_gil" }
content = "You're up early. Dressed like that for college?"

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "Here we go."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "player" }
content = "It's my first day."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_gil" }
content = "There's a job going at the cafe on the strip. Card in the window. You're going to need it."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_gil" }
content = "Friday. A hundred and fifty. I'm not running a charity."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He says it low. Your mum is in the kitchen, right through the wall, and he knows exactly how far his voice carries."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "He'd never say it in front of her. Not once."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_lynn" }
content = "Is that you up, love? Come and eat something before you go!"

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
