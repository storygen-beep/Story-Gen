# --- HIS AFTERNOON, AND IT IS THE BIGGEST EMPTY BLOCK IN THE GAME -------------
# He is a year ahead of her at the same college and the timetable ends at noon —
# class_2 and class_4 both run to 12:00, Monday to Thursday. Until now he vanished
# from 07:45 to 19:00 and so did everybody else, which is why the house held nobody
# at all between eight in the morning and four in the afternoon, seven days a week.
#
# ⚠️ EVERY ONE OF THESE FOUR ROWS HAS A CANVAS BEHIND IT, and that is not optional.
# presence.py backs a row four ways — portrait, covered, substitution, occupancy —
# and a row with none of them is DEAD. `kitchen_nate_lunch`, `garage_nate` and
# `hub_nate_room` exist for these three; the gym is an OCCUPANCY_ROWS entry because
# she cannot follow him there.
[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "12:00"
end_time   = "13:00"
activity   = "standing at the counter eating something out of the packet"

# ⚠️ THE GARAGE'S FIRST OCCUPANT. It has been a declared room with no people and no
# canvases since the game was built, and the house sheet has always promised half
# the chore list lives out there. He does his dad's work because he is asked to and
# because saying no costs more than doing it, which is the same arithmetic she is
# on with the $150.
[[npcs.schedules]]
location   = "the_garage"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "13:00"
end_time   = "15:00"
activity   = "sorting his dad's work out, because he was asked to"

