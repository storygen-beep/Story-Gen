# --- the crowd ---------------------------------------------------------------
# ⚠️ ONE PERSON, BOTH JOBS, and that is what makes this work: Jules is the one
# making her small AND the one who can let her in. Being pushed around and being
# let in are the same channel, so the player cannot take one without the other.

[[npcs]]
id          = "npc_jules"
name        = "Jules"
description = "Twenty-one, and the one everyone else arranges themselves around. She does not giggle and she does not raise her voice. She watches, she decides, and she is usually right, which is what makes arguing with her hard."
portrait    = "jules.jpg"
role        = "runs the crowd"
customizable = false
relationship = "the one everyone watches"
tags        = ["never raises her voice", "decides who is in", "lets Bree do the talking", "usually right"]
core_traits = { relation = 0, corruption = 0, arousal = 0 }
flag_keys   = []
arc_stages  = [
  "The joke",        # 0 — she is what they laugh at
  "Doing it",        # 1 — the first dare
  "Nearly in",       # 2 — the second
]

# ⚠️ THESE TWO ROWS MUST NOT OVERLAP. Schedule rows are walked in declaration
# order, FIRST MATCH WINS — so an overlapping union row is dead and she resolves
# to the quad all afternoon. She gives the dare on the quad before one, and she
# is at the window table after it, which is what "we'll be at the table by the
# window" has to mean for the room to actually contain her.
[[npcs.schedules]]
