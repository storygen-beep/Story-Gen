# --- getting anywhere --------------------------------------------------------

[[locations]]
id          = "the_bus_stop"
name        = "The Bus Stop"
description = "A pole, a timetable nobody has updated, and a bench somebody has had a go at. The bus into town is two dollars and it takes forty minutes to do what a car does in fifteen."
image       = "locations/the_bus_stop.jpg"
image_search_queries = ["empty bus stop bench suburban street daytime", "bus shelter timetable pole roadside"]
entry_from  = "the_street"
navigation_order = ["the_strip", "the_quad"]
costs       = { time = 5 }

[[locations]]
id          = "the_strip"
name        = "The Strip"
description = "Downtown, such as it is. A run of shops, half of them open, and the cafe about midway along with its lights on. Forty minutes of your morning to stand here."
image       = "locations/the_strip.jpg"
image_search_queries = ["small town main street shopfronts daytime", "downtown strip shops sidewalk morning"]
entry_from  = "the_bus_stop"
navigation_order = ["the_cafe"]
costs       = { time = 40, cash = 2 }
# ⚠️ THE BUS. Entry costs are charged moving IN, so the ride out is $2 and forty
# minutes and the ride home is currently free. Asymmetric on purpose in a slice —
# walking (free, an hour) is the other route and is not built yet.

# --- campus ------------------------------------------------------------------
# ⚠️ CAMPUS NEVER GIVES HER MONEY. Every hour here is hours and bus fare going
# out, and that is deliberate: it is what makes the cafe and the phone feel like
# the only two ways out of the Friday payment.

[[locations]]
id          = "the_quad"
name        = "The Quad"
description = "Grass, benches, and the paths everybody cuts across instead of using. Everything on this campus hangs off it, and between classes it is where people find out who you are by looking."
image       = "locations/the_quad.jpg"
image_search_queries = ["university quad students walking grass daytime", "college campus lawn paths students"]
entry_from  = "the_bus_stop"
navigation_order = ["the_lecture_hall", "the_classroom", "the_union"]
costs       = { time = 40, cash = 2 }

[[locations]]
id          = "the_lecture_hall"
name        = "The Lecture Hall"
description = "A hundred people in steep rows and a man at the bottom who has never learned any of their names. Nobody notices whether you came. The sheet does."
image       = "locations/the_lecture_hall.jpg"
image_search_queries = ["university lecture theatre tiered seats students", "large lecture hall students seated"]
entry_from  = "the_quad"

[[locations]]
id          = "the_classroom"
name        = "The Classroom"
description = "A dozen chairs round three tables pushed together. Small enough that not having done the reading is a thing everybody in the room watches happen."
image       = "locations/the_classroom.jpg"
image_search_queries = ["small university seminar room tables students", "classroom tables chairs whiteboard daylight"]
entry_from  = "the_quad"

[[locations]]
id          = "the_union"
name        = "The Union"
description = "The cheapest food on the map and forty tables. You are either at one with somebody or at one on your own, and both of those are visible from the door."
image       = "locations/the_union.jpg"
image_search_queries = ["student union cafeteria tables students eating", "university canteen tables food counter"]
entry_from  = "the_quad"

# --- the cafe ----------------------------------------------------------------

[[locations]]
id          = "the_cafe"
name        = "The Cafe"
description = "Tables, a counter, a window onto the strip. Warm in a way the street isn't. Somebody could sit at one of these tables and look at you for an hour and have paid for the right to."
image       = "locations/the_cafe.jpg"
image_search_queries = ["small independent cafe interior tables counter window", "coffee shop interior daytime empty tables"]
entry_from  = "the_strip"
navigation_order = ["the_back_room", "the_cafe_toilet"]
costs       = { time = 2 }

[[locations]]
id          = "the_cafe_toilet"
name        = "The Toilet"
description = "One room, shared with the customers, so the person who opens it next could be anybody. A mirror over the sink and a lock that works. It is the only door you can shut on yourself that isn't your own bedroom."
image       = "locations/the_cafe_toilet.jpg"
image_search_queries = ["small single cafe restroom mirror sink", "public toilet single room mirror door"]
entry_from  = "the_cafe"

[[locations]]
id          = "the_back_room"
name        = "The Office"
description = "Out the back, past the machine. A desk, a filing cabinet, the schedule on the wall with everyone's hours on it. The door has a lock and it isn't locked."
image       = "locations/the_back_room.jpg"
image_search_queries = ["small cluttered back office desk filing cabinet", "cafe back office schedule wall desk"]
entry_from  = "the_cafe"

