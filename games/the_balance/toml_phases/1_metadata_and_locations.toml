# ⚠️ HE DOES NOT WATCH TELEVISION. LO's call, 2026-09-17: "I say he doesnt watches
# tv. That only parents together." So he is off the sofa for the whole of the
# parents' hour and comes back down the moment they go up. He is not in a room at
