# --- the people --------------------------------------------------------------
# ⚠️ Two. Nate and Tasha are a shower running and a shut door in the opening prose
# and are deliberately NOT declared — an NPC with no surface is a name in a list.

[[npcs]]
id          = "npc_gil"
name        = "Gil"
description = "Your mum's husband of three years, and the reason you are at college at all. He works for himself, out of the van, and the garage is where the job lives when he is not on it. He paid the semester up front and has never once mentioned it. Strict about the house, and he does not drink."
portrait    = "gil.jpg"
role        = "step dad"
relationship = "step dad"
relationship_options = ["step dad", "mum's husband", "dad", "uncle"]
customizable = true
# ⚠️ EXACTLY FOUR — the importer hard-fails at five. "up before everyone" came out
# to make room for the trade, and it is the only one of the five the game already
# says elsewhere: his sleep row's activity is literally "asleep, and up before
# anybody". The other four are load-bearing — DECISIONS.md:93 says a drunk step dad
# would hand her an excuse for everything.
tags        = ["works for himself, out of the van", "runs the house his way", "never mentions what he paid", "does not drink"]
core_traits = { relation = 0, corruption = 0, arousal = 0 }
flag_keys   = []

# ⚠️ customizable = true means the player can rename him, so every authored line
# says @gil and never "Gil".

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4]
start_time = "06:30"
end_time   = "08:00"
activity   = "at the table with the radio on"

# --- HE WORKS FOR HIMSELF, AND THE GARAGE IS THE WORKSHOP ---------------------
# The cast sheet has said "in the garage late" since the first draft and no row in
# this game has ever put him out there. This is that row.
#
# ⚠️ IT IS THE HOUR BEFORE THE KITCHEN, NOT AFTER IT. Everything from 18:00 on is
# load-bearing — the kitchen holds `friday_payment` and `dinner`, 20:30 is the
# television stagger, and 21:00-23:30 upstairs IS one of the two doors. An hour
# taken from any of those would cost a working surface. 17:00-18:00 was empty.
#
# It is also what makes the money make sense. A man who counts five dollars a chore
# handed over two thousand four hundred in cash without mentioning it, and nothing
# in the game has ever said how. He is self-employed, he has had good years, and
# the list on the fridge is in his handwriting because writing jobs down is what he
# does all day.
[[npcs.schedules]]
location   = "the_garage"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "17:00"
end_time   = "18:00"
activity   = "unloading the van, still in his work clothes"

# the_week.md: "@gil is there because he's always there at six." Friday evening is
# when the $150 is handed over, so he has to actually BE in the room.
#
# ⚠️ ENDS AT 20:30, NOT 21:00, since the television. He clears the table and comes
# through for the last half hour of the news. `friday_payment` was shortened to
# match in the same pass — its own comment says a Friday window that outran his
# kitchen hours renders a link to a man who is not in the room.
[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "18:00"
end_time   = "20:30"
activity   = "at the table with the radio on low"

# ⚠️ HALF AN HOUR, AND THE STAGGER IS THE POINT. Her mum is on that sofa from
# 20:00 and he arrives at half past, so 20:00-20:30 is the only window in the game
# where one parent is in a room without the other. What the late channel costs is
# different in those two halves, and that is the whole television.
[[npcs.schedules]]
location   = "the_front_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "20:30"
end_time   = "21:00"
activity   = "in the chair by the window, watching the news"

[[npcs.schedules]]
location   = "the_master_bedroom"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "21:00"
end_time   = "23:30"
activity   = "upstairs, door pushed to"

# ⚠️ ASLEEP IS ITS OWN ROW, NEVER AN EXTENSION OF THE ONE ABOVE. That 21:00-23:30
# row is the master-bedroom door — "door pushed to" is the whole invitation, and
# `master_bedroom` is scheduled 21:00-22:00 inside it. Widening it to cover the
# night would have deleted the door and left a man asleep in its place.
#
# All seven days, so the midnight wrap resolves in ONE row: the time check
# (v2.py:3784) handles endTotal < startTotal, and the weekday check (v2.py:3446)
# runs against TODAY, which only breaks a row whose weekday list is partial. Hands
# over to his 06:30 kitchen row with no gap.
[[npcs.schedules]]
location   = "the_master_bedroom"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "23:30"
end_time   = "06:30"
activity   = "asleep, and up before anybody"

