# ⚠️ SEPARATE FROM THE ROW ABOVE, for the same reason as @gil's. `nate_door` is the
# first walk-in in the game and it hangs off "the door not quite shut" — prose that
# has the lamp on and him looking back at her. Folding asleep into that row would
# have let the one-time walk-in fire at six in the morning against it. `nate_door`
# now carries its own 22:00-23:59 schedule so it stays exactly where it was.
