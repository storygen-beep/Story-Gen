# ⚠️ THE LAST HOUR, AND IT MUST BE DECLARED ABOVE THE CAFE ROW. `getNpcLocation`
# walks declared rows in order and FIRST MATCH WINS (v2.py:3661-3669), so the
# 07:00-22:00 floor row below would swallow this window if it came first.
#
# Without this row `office_closer` — the SECOND KEY, the only writer of
# `owen_standing` — could never render. The portrait grid is filtered on
# `getNpcLocation(slug).location === locationId` (v2.py:5281-5291) and he was only
# ever scheduled on the floor, so the whole cafe ladder stopped after `move_up = 1`:
# no second key, so `move_up_counter` never fired, so the counter never opened.
# Verified live before and after. `process/presence.py` reports the class.
#
# the_move_up.md:40 puts closing at five to ten, and `office_closer`'s own first
# line is "He is at the schedule on the wall with a pen, working out next week" —
# which is this hour, in this room.
[[npcs.schedules]]
