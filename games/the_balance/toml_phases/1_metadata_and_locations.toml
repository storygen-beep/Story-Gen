# --- the crowd ---------------------------------------------------------------
# ⚠️ ONE PERSON, BOTH JOBS, and that is what makes this work: Jules is the one
# making her small AND the one who can let her in. Being pushed around and being
# let in are the same channel, so the player cannot take one without the other.

