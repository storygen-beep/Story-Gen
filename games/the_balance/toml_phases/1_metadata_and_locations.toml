# ⚠️ TWO SLEEP ROWS, AND THE WEEKDAY LIST IS THE MORNING SHE WAKES UP ON — never
# the night she went to bed. Both start at 00:00 or later so neither crosses
# midnight, which is the only shape that is safe for a partial weekday list:
# presence checks the weekday FIRST, against today (v2.py:3446), so a Monday-only
# row running 23:00-07:00 deletes her the moment the clock passes twelve.
#
# Weekday: she is in from 18:00 on Mon/Tue/Wed/Thu/Sun, so the mornings after are
# Tue/Wed/Thu/Fri/Mon. Out at 10:00 — the_cast.md:36 has her "out until four".
[[npcs.schedules]]
location   = "tasha_room"
weekdays   = [0, 1, 2, 3, 4]
start_time = "00:00"
end_time   = "10:00"
activity   = "asleep, music still going"

# Weekend: "gone Friday and Saturday nights" and "out until four" — so Friday night
# lands on Saturday morning and Saturday night on Sunday morning. She comes in at
# four and sleeps through the morning the house is fullest.
[[npcs.schedules]]
location   = "tasha_room"
weekdays   = [5, 6]
start_time = "04:00"
end_time   = "12:00"
activity   = "asleep in what she went out in"

[[npcs]]
id          = "npc_lynn"
name        = "Lynn"
description = "Your mum. She wants you to be fine and she is too tired to check. She does not know who paid for any of it, and everything in this house happens while she is out or asleep."
portrait    = "lynn.jpg"
role        = "mum"
customizable = false
relationship = "your mum"
tags        = ["three nights on the ward", "asleep by ten", "too tired to check", "never asks twice"]
core_traits = { relation = 0 }
flag_keys   = []

# ⚠️ NEVER TOUCHED. She is the price, not a person to be won — standing call,
# re-confirmed by LO. She is here to put a second person in that bedroom, which
# is the entire weight of the door, and for no other reason.
#
# Ward nights are Monday, Wednesday and Friday, so she is HOME Tuesday, Thursday,
# Saturday and Sunday. Those are the nights the master bedroom has two people in it.
[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [1, 3, 5, 6]
start_time = "19:00"
end_time   = "20:00"
activity   = "at the table, still in the coat she travels in"

# ⚠️ THE HOUR SHE HAS NEVER HAD. Straight from the table to the sofa, and for the
# first half of it she is the only one in the room — @gil is still clearing the
# kitchen until half past. This is where her first clickable row in the whole game
# lives, and it is where the late channel costs least, because she does not look
# at it. the_cast.md: "she wants her daughter to be fine and she is too tired to
# check." That line is a mechanic now.
[[npcs.schedules]]
location   = "the_front_room"
weekdays   = [1, 3, 5, 6]
start_time = "20:00"
end_time   = "21:00"
activity   = "on the sofa with her shoes off and a mug going cold"

# ⚠️ STARTS AT 21:00 NOW, NOT 20:00 — she watches an hour first. `master_bedroom`
# is scheduled 21:00-22:00 and is gated on her being in this room, so the two
# doors are untouched: she is back upstairs the minute that scene opens.
[[npcs.schedules]]
location   = "the_master_bedroom"
weekdays   = [1, 3, 5, 6]
start_time = "21:00"
end_time   = "23:59"
activity   = "in bed with the lamp on, off the ward"

# The other half of her four nights at home. Weekday list is the morning she wakes
# up on: Tue night runs into Wed, Thu into Fri, Sat into Sun, Sun into Mon. Starts
# at 00:00 so it never crosses midnight, which is what makes a partial weekday list
# safe here.
#
# ⚠️ This does NOT open `master_bedroom`. That canvas carries its own 21:00-22:00
# schedule, so her being in the room at three in the morning changes nothing a
# player can reach. Checked every npc_at_location in the game before adding it.
[[npcs.schedules]]
location   = "the_master_bedroom"
weekdays   = [0, 2, 4, 6]
start_time = "00:00"
end_time   = "06:30"
activity   = "asleep, the alarm set for a shift she is not on"

# ⚠️ THE ROW the_house_day.md HAS BEEN ASKING FOR SINCE IT WAS WRITTEN. Its own
# hand-off list says "her mum asleep down the hall on a weekday morning is the
# quietest room in the game and nothing happens in it yet", and its weekday table
# says "eight to twelve — nobody, except on ward mornings, when her mum is asleep
# down the hall."
#
# She works the ward Monday, Wednesday and Friday nights, so she comes home and
# sleeps it off on Tuesday, Thursday and Saturday mornings. Those are the only
# hours between 08:00 and 16:00 when anybody at all is in this house — every other
# hour of that window was empty in all nine rooms, seven days a week.
#
# She is still NEVER TOUCHED and still has no clickable row anywhere. What this
# buys is a person in the house who is not watching.
[[npcs.schedules]]
location   = "the_master_bedroom"
weekdays   = [1, 3, 5]
start_time = "08:00"
end_time   = "14:00"
activity   = "asleep with the curtains shut, straight off the ward"

