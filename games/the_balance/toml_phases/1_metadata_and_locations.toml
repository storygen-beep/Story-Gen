# --- the two on campus who want nothing from her -----------------------------
# The crowd — Jules, Bree and Paige — is the NEXT piece. These two are the friend
# and the one she chooses, and neither of them is a climb yet.

[[npcs]]
id          = "npc_cara"
name        = "Cara"
description = "Your friend since the first week, and the only person in this game who wants nothing off you. Everybody else pays you. She costs you — an hour at a time, which is the one thing you are running out of."
