# --- the day rollover --------------------------------------------------------
# ⚠️ THE KEYS ARE flagEffects / traitEffects. `clear_flags` / `set_traits` are
# invented, parse fine, build green, and are silently ignored.

[engine.daily_tick]
flagEffects = [
  # chores.md: "Done today, one per chore… Both reset overnight. Nothing here
  # climbs." Nine chores, nine flags, and they are what stop a chore being done
  # twice in a day — the room canvases carry no max_triggers_per_day, because one
  # would shut the whole kitchen after the first of its six.
  # ⚠️ Her mum's schedule rows READ these (chores.md: if the laundry is done, or
  # the player said "I'll do it", her hour on it drops and she sits down instead),
  # so a flag removed here silently pins her to a chore she has already finished.
  { targetType = "player", flag = "chore_done_breakfast", op = "unset" },
  { targetType = "player", flag = "chore_done_breakfast_dishes", op = "unset" },
  { targetType = "player", flag = "chore_done_lunch", op = "unset" },
  { targetType = "player", flag = "chore_done_lunch_dishes", op = "unset" },
  { targetType = "player", flag = "chore_done_dinner", op = "unset" },
  { targetType = "player", flag = "chore_done_dinner_dishes", op = "unset" },
  { targetType = "player", flag = "chore_done_laundry", op = "unset" },
  { targetType = "player", flag = "chore_done_dusting", op = "unset" },
  { targetType = "player", flag = "chore_done_bins", op = "unset" },
  # PARKED 2026-09-19 (the climbs) — the jacket_off reset went with dare two.
  # Her door is open again by morning, for the same reason the jacket is back on:
  # a house wakes up in its ordinary state. Shutting it is a decision she makes
  # fresh every day, which is the only thing that stops one five-minute click
  # buying every hour of the rest of the game.
  { targetType = "player", flag = "door_locked", op = "unset" },
  { targetType = "player", flag = "streamed_today", op = "unset" },
  # ⚠️ THE HOUR WITH A FRIEND IS CAPPED HERE, NOT ON THE TRIGGER. A
  # max_triggers_per_day on a canvas that carries an `npc` does not spend the act,
  # it deletes the person: Cara sits at that table until half two and Sam until
  # two, and one click used to remove their portraits for the rest of it. The cap
  # moved onto the paying choice. engine.md §28.2 — a flag read `is_false` and
  # cleared but never SET is a cap that never closes, and nothing in the toolchain
  # objects, so these two lines and the setters have to stay in step.
  { targetType = "player", flag = "cara_today", op = "unset" },
  { targetType = "player", flag = "sam_today", op = "unset" },
  # The quad pair. Their caps came OFF the trigger and back on as choice flags —
  # taking them off outright made gates.py "the climb is paid for" fail, because
  # `crowd_standing` gates content at 10 and became free to reach.
  { targetType = "player", flag = "paige_today", op = "unset" },
  # @gil's three, sheets/people/gil_cards.md 2026-09-23. Same rule as Cara and Sam:
  # the cap is a flag on the CHOICE, never max_triggers_per_day on a trigger that
  # carries an `npc` — that removes the person from a room his own timetable still
  # has him in. `gil_today` is sitting down with him (one act a day across the front
  # room AND the kitchen, because two in one morning is a thing and he would notice
  # it was a thing); `gil_garage_today` is the hour out at the car; `friday_settled`
  # is what stops the kitchen and the garage collecting the same $150 twice.
  { targetType = "player", flag = "gil_today", op = "unset" },
  { targetType = "player", flag = "gil_garage_today", op = "unset" },
  { targetType = "player", flag = "friday_settled", op = "unset" },
  # ⚠️ `lift_tomorrow` IS DELIBERATELY NOT HERE. It is set in the garage one evening
  # and spent in the kitchen the NEXT morning, so an overnight clear would make it
  # unspendable. The two morning-lift choices unset it when they fire. An unclaimed
  # lift banks until she takes it — declared, not an oversight.
  # PARKED 2026-09-19 (the climbs) — the bree_today reset: both of its setters were climb
  # choices, and a cap cleared but never set is the defect engine.md §28.2 names.
]
# PARKED 2026-09-19 (the climbs) — `traitEffects`: all three countdowns (nate_landing,
# quiet_week, dare_cooldown) belonged to parked climbs, so the key is gone with them.

# --- IS THE HOUSE EMPTY ------------------------------------------------------
# The first named gate in this game, and it exists because the engine's condition
# logic is ONE FLAT LEVEL. `triggerConditionsSatisfied` reads a single `items` list
# under a single `logic` (v2.py:4133) and does not nest, so "the house is empty OR
# her door is shut" cannot be written as one condition block. A stage helper is the
# documented way round it: the helper holds the AND, and the thing that reads it is
# one item in somebody else's OR. Helpers may hold PRIMITIVES ONLY — one level of
# nesting, never two (v2.py:4427).
#
# ⚠️ SIX ROOMS, NOT SEVEN, AND NOT THE GARAGE.
#   · `the_hall` holds ZERO schedule rows, so a gate on it is true forever. A dead
#     clause in a six-clause AND is invisible — nothing in the toolchain objects —
#     which is exactly the defect class presence.py exists to catch.
#   · `the_garage` is left out on purpose: nobody in it can be heard from her room.
#
# ⚠️ KEPT THROUGH THE 2026-09-19 PARK for one reader: `her_door`'s prose. The six
# rooms get rechecked when sheets/BASE.md round 3 decides who is in the house.
#
# ⚠️ npc_id IS OMITTED ON PURPOSE. With no `npc_id` the condition asks whether the
# room holds ANYBODY (v2.py:4477-4483, setup.getNpcsAtLocation at :3788) rather
# than naming four people per room and going stale the next time somebody's hours
# move. The engine's own formatter renders it as "<Room> must be empty".
[[engine.stage_helpers]]
name        = "house_empty"
description = "Nobody is in any of the six rooms she could be heard from."
conditions  = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", location_id = "the_kitchen",        operator = "is_absent" },
  { type = "npc_at_location", location_id = "the_front_room",     operator = "is_absent" },
  { type = "npc_at_location", location_id = "the_master_bedroom", operator = "is_absent" },
  { type = "npc_at_location", location_id = "the_bathroom",       operator = "is_absent" },
  { type = "npc_at_location", location_id = "nate_room",          operator = "is_absent" },
  { type = "npc_at_location", location_id = "tasha_room",         operator = "is_absent" },
] }

# --- who is in the bath, as four named gates ---------------------------------
# sheets/people/gil_cards.md, 2026-09-23. The bathroom's entry_conditions used to be a
# flat `logic = "OR"` stating when the door was OPEN, because `present AND (w1 OR w2 OR
# w3)` cannot be written in one items list and its complement can. That held for one
# person and broke the day @gil got a bath row: a second person needs a second
# `is_absent`, and under OR a second absence OPENS the door for the first. At 23:15 her
# mum is absent, the OR was satisfied, and his door swung.
#
# ⚠️ THE FIX IS FOUR HELPERS AND AN `AND` OF FOUR NEGATIONS — NOT nesting. The RUNTIME
# would nest: v2.py:4540-4554 calls triggerConditionsSatisfied on the helper's own
# conditions, which dispatches `type = "stage"` again. THE VALIDATOR REFUSES BOTH.
# template_import.py:5634-5641 hard-fails a helper containing a `type = "stage"` item
# ("cycle-free"), and :5643-5655 hard-fails `logic = "OR"` in a helper at all. So a
# helper is AND-of-primitives, always, and a disjunction is expressed by SPLITTING IT
# INTO ONE HELPER PER ARM and negating each at the reader. Checked in the importer
# before it was written, not after the build failed.
#
# ⚠️ WHY HER THREE ARE SEPARATE AND HIS IS ONE. Her bath windows differ by day and
# `time_of_day` cannot read a weekday, so each window is paired with her presence and
# the presence does the day-picking. His is one window, every night, so one helper.
#
# ⚠️ HER WINDOWS, NOT HER PRESENCE. `mum_laundry` is a card inside that room and she is
# in there at 13:30, 15:45 and 09:30 on Sunday. A bare `npc_lynn is_present` would lock
# the door on her own card. These three are her BATHS and nothing else — they come off
# MUM_ROWS in process/gen_week.py and drift from it if that table moves.
#
# ⚠️ A RENAME IS SILENT. v2.py:4544 pushes FALSE for a helper it cannot find and warns
# only in dev mode — so a mistyped name here reads as "nobody is bathing" and the lock
# quietly stops existing.

[[engine.stage_helpers]]
name        = "lynn_bath_morning"
description = "Her mum is in the bath at half eight, washing a ward night off. Tue, Thu, Sat."
conditions  = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_bathroom", operator = "is_present" },
  { type = "time_of_day", start_time = "08:30", end_time = "09:00" },
] }

[[engine.stage_helpers]]
name        = "lynn_bath_ward"
description = "Her mum is in the bath at six, before a ward night. Mon, Wed, Fri."
conditions  = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_bathroom", operator = "is_present" },
  { type = "time_of_day", start_time = "18:00", end_time = "18:30" },
] }

[[engine.stage_helpers]]
name        = "lynn_bath_sunday"
description = "Her mum is in the bath on a Sunday night, the long one."
conditions  = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_bathroom", operator = "is_present" },
  { type = "time_of_day", start_time = "20:30", end_time = "21:30" },
] }

[[engine.stage_helpers]]
name        = "gil_bathing"
description = "Her step dad is in the bathroom at eleven, washing the day off. Every night of the week."
conditions  = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_bathroom", operator = "is_present" },
  { type = "time_of_day", start_time = "23:00", end_time = "23:30" },
] }

# --- guidance ----------------------------------------------------------------
# quests_engine = "v2" turns the sidebar entry and the page ON, so the cards are
# not optional decoration — with none authored it is a nav link to an empty page.

# card_friday and card_the_job RETIRED 2026-09-25 (LO): card_first_friday covers week one
# with goal steps (F1b step 5), and card_debt_running takes over after the first payment.

[[quest_cards]]
id       = "card_first_friday"
group    = "the_debt"
priority = 90
text     = "A hundred and fifty goes back on Friday evening. You started the week with ten dollars and no job."
tip      = "The cafe is on the strip, forty minutes by bus from the stop on your street. Shifts start at seven, ten, one, four and seven."
when     = [
  { flag = "opening_done", op = "is_true" },
  { trait = "debt_left", subject = "player", op = "gte", value = 2400 },
]
goals    = [
  { type = "flag", subject = "player", flag = "has_job", op = "is_true", label = "Get the job at the cafe on the strip" },
  { type = "flag", subject = "player", flag = "first_shift_done", op = "is_true", label = "Work your first shift" },
  { type = "trait", subject = "player", trait = "cash", op = "gte", value = 150, label = "Have $150 by Friday evening" },
]

[[quest_cards]]
id     = "card_who_is_she"
npc_id = "npc_cafe_girl"
text   = "A girl at the cafe called you Nell before you ever told her your name. Nobody on your stream has ever seen your face."
tip    = "She works the cafe floor, seven in the morning until seven at night."
when   = [ { flag = "met_cafe_girl", op = "is_true" } ]

# \u26a0\ufe0f A card condition is `{ flag, op }` or `{ trait, subject, op, value }` and the
# key is `when`, NOT `conditions` — a CANVAS condition uses trait_key + operator.
# Same words, two parsers. And `when` is REQUIRED: validate() refuses a card that
# does not scope itself to a state window, which is how a guidance page stops being
# a wall of every hint at once.

# The job once she has it. Asking for it is now a goal on card_first_friday.

