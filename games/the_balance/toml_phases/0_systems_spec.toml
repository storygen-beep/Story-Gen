# --- the day rollover --------------------------------------------------------
# ⚠️ THE KEYS ARE flagEffects / traitEffects. `clear_flags` / `set_traits` are
# invented, parse fine, build green, and are silently ignored.

[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "chore_paid_today", op = "unset" },
  # the jacket is back on in the morning. Dare two lasts exactly one day.
  { targetType = "player", flag = "jacket_off", op = "unset" },
  { targetType = "player", flag = "streamed_today", op = "unset" },
  # Which band the toilet payout screen shows. Set on the way in, read once on the
  # way out, cleared here. `toilet_far_done` is the PERMANENT twin and must never
  # appear in this block — it is what makes the first time in that room worth three
  # points of exposure and every time after worth one.
  { targetType = "player", flag = "toilet_far", op = "unset" },
  # ⚠️ THE HOUR WITH A FRIEND IS CAPPED HERE, NOT ON THE TRIGGER. A
  # max_triggers_per_day on a canvas that carries an `npc` does not spend the act,
  # it deletes the person: Cara sits at that table until half two and Sam until
  # two, and one click used to remove their portraits for the rest of it. The cap
  # moved onto the paying choice. engine.md §28.2 — a flag read `is_false` and
  # cleared but never SET is a cap that never closes, and nothing in the toolchain
  # objects, so these two lines and the setters have to stay in step.
  { targetType = "player", flag = "cara_today", op = "unset" },
  { targetType = "player", flag = "sam_today", op = "unset" },
  # The two rooms that used to hold nobody. `sofa_today` is shared by ALL FIVE
  # front room canvases — the solo hour, @nate's hub, the television, and both
  # parents' hubs — so it is one hour in that room a day whichever way she spends
  # it, and choosing who to spend it with is the decision.
  #
  # ⚠️ IT IS ALSO WHAT PACES THE TELEVISION'S TWO LADDERS. "Leave it on." carries
  # `sofa_today is_false` and sets it, so `gil_tv` and `lynn_tv` move at most once
  # a day each and the climb cannot be ground out in one evening. It is also what
  # makes those rungs COST something: `gates.py` "the climb is paid for" flagged
  # the first draft, where the corruption came off a five-minute choice with no
  # hour attached.
  #
  # ⚠️ `tv_channel`, `gil_tv`, `lynn_tv` AND `tv_on` ARE DELIBERATELY ABSENT FROM
  # THIS BLOCK. The set remembers what it was left on and the counters are an arc —
  # same rule as `toilet_far_done` above. Clearing any of them overnight would
  # reset the climb every morning and nothing in the toolchain would say a word.
  { targetType = "player", flag = "tasha_today", op = "unset" },
  { targetType = "player", flag = "sofa_today", op = "unset" },
  # The quad pair. Their caps came OFF the trigger and back on as choice flags —
  # taking them off outright made gates.py "the climb is paid for" fail, because
  # `crowd_standing` gates content at 10 and became free to reach.
  { targetType = "player", flag = "paige_today", op = "unset" },
  { targetType = "player", flag = "bree_today", op = "unset" },
  # Tasha's converted surface. Her hour is one hour; the cap is on the choice so
  # she stays in the room she is standing in.
  { targetType = "player", flag = "tasha_bath_today", op = "unset" },
  # @gil at the table. One sit-down a day; the question he will not answer is
  # one-time and is NOT cleared here.
  { targetType = "player", flag = "gil_today", op = "unset" },
]
traitEffects = [
  { targetType = "player", trait = "nate_landing", op = "add", value = -1 },
  { targetType = "player", trait = "quiet_week",   op = "add", value = -1 },
  { targetType = "player", trait = "dare_cooldown", op = "add", value = -1 },
]
# It runs past zero into negatives and that is harmless — every read is `lte 0`.

# --- guidance ----------------------------------------------------------------
# quests_engine = "v2" turns the sidebar entry and the page ON, so the cards are
# not optional decoration — with none authored it is a nav link to an empty page.

[[quest_cards]]
id    = "card_friday"
group = "the_debt"
text = "A hundred and fifty goes back every Friday. The semester was paid up front and your mum doesn't know who paid it."
tip  = "Friday evening, in the kitchen. He's always there at six."
when = [
  { flag = "opening_done", op = "is_true" },
]

# \u26a0\ufe0f A card condition is `{ flag, op }` or `{ trait, subject, op, value }` and the
# key is `when`, NOT `conditions` — a CANVAS condition uses trait_key + operator.
# Same words, two parsers. And `when` is REQUIRED: validate() refuses a card that
# does not scope itself to a state window, which is how a guidance page stops being
# a wall of every hint at once.

# The job, as a two-card group: only the winner in a group renders, so these are one
# line on the page that changes when she gets the job.

[[quest_cards]]
id    = "card_the_job"
group = "the_cafe"
text  = "There's a job going at the cafe. He said it once and he won't say it again."
tip   = "The cafe is downtown, off the strip. The bus is $2 and forty minutes."
when  = [
  { flag = "opening_done", op = "is_true" },
  { flag = "has_job", op = "is_false" },
]

[[quest_cards]]
id    = "card_on_the_floor"
group = "the_cafe"
text  = "Two shifts, Tuesday and Sunday. About $110 on a good week, against a $150 Friday."
tip   = "The hours are Owen's to give. Working them is the only thing that has ever moved him."
when  = [
  { flag = "has_job", op = "is_true" },
]

[[quest_cards]]
id    = "card_debt_running"
group = "the_debt"
text  = "Under two thousand one hundred of it left. Thirteen more Fridays, and then the next semester posts for more."
tip   = "It only moves in the kitchen, on a Friday, in cash."
when  = [
  { trait = "debt_left", subject = "player", op = "lte", value = 2100 },
]

[[quest_cards]]
id    = "card_behind_3"
group = "college"
text  = "You are behind in the nine o'clock class, and that is a room of twelve people."
tip   = "Tuesday and Thursday, nine to ten thirty, in the classroom."
when  = [
  { trait = "attend_3", subject = "player", op = "lte", value = 40 },
]

[[quest_cards]]
id    = "card_behind_4"
group = "college"
text  = "You are behind in the ten thirty class, and that is a room of twelve people."
tip   = "Tuesday and Thursday, ten thirty to twelve, in the classroom."
when  = [
  { trait = "attend_4", subject = "player", op = "lte", value = 40 },
]

[[quest_cards]]
id    = "card_behind_1"
group = "college"
text  = "You are behind in the nine o'clock lecture. Nobody down there has noticed. The sheet has."
tip   = "Monday and Wednesday, nine to ten thirty, in the lecture hall."
when  = [
  { trait = "attend_1", subject = "player", op = "lte", value = 40 },
]

[[quest_cards]]
id    = "card_behind_2"
group = "college"
text  = "You are behind in the ten thirty lecture. Nobody down there has noticed. The sheet has."
tip   = "Monday and Wednesday, ten thirty to twelve, in the lecture hall."
when  = [
  { trait = "attend_2", subject = "player", op = "lte", value = 40 },
]

[[quest_cards]]
id    = "card_classes"
group = "college"
text  = "Four subjects, nine to twelve, each one twice a week. Nobody chases you for missing one."
tip   = "Two in the lecture hall on Monday and Wednesday. Two in the classroom on Tuesday and Thursday."
when  = [
  { flag = "opening_done", op = "is_true" },
]

[[quest_cards]]
id    = "card_dare_1"
group = "the_crowd"
text  = "Jules asks for things on the quad, out loud, in front of people. You answer on the spot."
tip   = "The first one is a minute of your face and nothing else. Saying no shuts no doors."
when  = [
  { trait = "dare_chain", subject = "player", op = "lte", value = 0 },
  { flag = "opening_done", op = "is_true" },
]

[[quest_cards]]
id    = "card_dare_2"
group = "the_crowd"
text  = "The next one is not a minute. It is the rest of the day, and you agree to all of it in two seconds."
tip   = "She asks on the quad, between classes."
when  = [
  { trait = "dare_chain", subject = "player", op = "eq", value = 1 },
]

[[quest_cards]]
id    = "card_quiet"
group = "the_crowd"
text  = "Nobody has started on you this week. Nobody said why and nobody is going to."
tip   = "It runs out. Then it starts again."
when  = [
  { trait = "quiet_week", subject = "player", op = "gte", value = 1 },
]
