# =============================================================================
# The Balance — 0 · systems spec
#
# SLICE 1 — the opening and asking for the job. Not v0.1.
# Every value traces to a sheet or to v2_state.json; nothing was invented here.
#
# ⚠️ NEVER hand-edit 7_final_game.toml — it is the merge output.
# =============================================================================

[project]
id              = "the_balance"
title           = "The Balance"
version         = "0.0.1"
release_date    = "2026-09-15"
starting_canvas = "canvas_opening"
quests_engine   = "v2"

# ⚠️ quests_engine MUST live in [project]. template_import.py:1729 reads it only
# from the project table, and :2615 gates the whole [[quest_cards]] block on it, so
# a copy in [settings] parses, builds green, and DROPS EVERY CARD SILENTLY. Caught
# live here on 2026-09-15 by playtest's guidance check reporting 0 of 2. The same
# mistake is currently shipping in games/vesper_two.

# ⚠️ Save slots namespace off Util.slugify(title), so the title is frozen from
# here — a rename strands every save a player has made.

[settings]
narration_person  = "second"      # per-game, IMMUTABLE. v2_state.json declares it.
clothing_enabled  = false         # no wardrobe is designed yet. Slice only.

# ⚠️ [settings.rent] is deliberately ABSENT even though Friday's $150 looks exactly
# like rent. money.md puts the payment in the kitchen, handed over, as a scene Gil
# is in — an engine demand would narrate it twice. Revisit when Friday is written.

[time]
starting_hour = 7
starting_day  = "Monday"
starting_week = 1

# The clock, computed against OPENING.md's "about seven thirty":
#   07:00 boot renders in her bedroom
#   +3   default node hop (v2.py:13200) -> the landing
#   +27  declared on the landing's choice   -> 07:30 in the kitchen
#   the bus is then 40 minutes and $2, charged as entry costs on the_strip
# ⚠️ current_minute is hard-coded to 0 at init (v2.py:1451), so a half-past start
# cannot be declared — it has to be walked to.

[player]
id           = "player"
name         = "Nell"
description  = "Eighteen, first Monday of term. Your mum married into this house three years ago and it came with a step dad, a step brother and a step sister. You are the only person in it who is going anywhere."
# \u26a0\ufe0f SECOND PERSON. This renders on the character screen, which is the first
# prose in the game, and it shipped once as third person against narration_person.
# It cannot say @gil either \u2014 the player has not named him yet at that point.
customizable = true

# ⚠️ customizable = true with declared fields builds a CustomizeCharacters passage
# and REPOINTS THE AGE GATE AT IT (v2.py:1065, :9251). That is the Want's call, on
# the record: the distinctive axis is the cast, not the player. The headings on
# that screen are hard-coded product voice — if they read badly, that is why.

[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "Her name"
default = "Nell"

# ⚠️ v2.py:9294 emits a name textbox for EVERY customizable NPC unconditionally,
# so Gil and Nate are player-renameable. Every authored line about them must read
# back as @gil / @nate and never a typed name.

[player.core_traits]
exposure       = 5     # ascent tier — starts at 5, not 0 (her_meters.md)
corruption     = 5     # ascent tier
reputation     = 5     # ascent tier
rest           = 100   # a need
clean          = 100   # a need
cash           = 10    # ⚠️ NOT on any sheet. See the note below.
debt_left      = 2400  # money.md — the semester
fridays_missed = 0
# PARKED 2026-09-19 (the climbs) — shifts_worked, move_up, owen_standing: the cafe ladder's
# counters. Declarations in parked/climbs/systems.toml.
home_after_ten = 0     # times she has come through the front door after his rule.
                       # the_house.md: "After that the front door is a thing she
                       # has to come through, and he's up." Read at the dinner
                       # table — he notices the hours she keeps.
# PARKED 2026-09-19 (the climbs) — crowd_standing, dare_chain, dare_cooldown, quiet_week: the
# dares and what they bought. Declarations in parked/climbs/systems.toml.

# ⚠️ ATTENDANCE IS A FALLING METER, AND college.md COUNTS MISSES. That is a
# translation, not a redesign, and here is why: the engine cannot count a miss
# because ABSENCE IS THE ABSENCE OF AN EVENT — nothing fires when she does not
# come, and there is no conditional day-tick to hang it on. So each subject falls
# 8 a day and going to class adds 30. Twice a week is +60 against -56, so showing
# up holds her level and every class she skips sinks that subject on its own.
# The bands land where the sheet put them: under 40 it is noticed, under 20 the
# mark cannot come back on homework alone.
attend_1       = 100   # lecture hall, Monday and Wednesday, nine to ten thirty
attend_2       = 100   # lecture hall, Monday and Wednesday, ten thirty to twelve
attend_3       = 100   # the classroom, Tuesday and Thursday, nine to ten thirty
attend_4       = 100   # the classroom, Tuesday and Thursday, ten thirty to twelve
# PARKED 2026-09-19 (the climbs) — nate_landing, the week @nate's door cost the stream.
# Declaration in parked/climbs/systems.toml.
followers      = 380   # ⚠️ NOT zero. the_phone.md: she has been doing this since
                       # the summer, quietly, to a few hundred people who have
                       # never seen her face. That is why one of them already
                       # knows her name.

# ⚠️ cash = 10 IS A GUESS AND HAS TO GO TO LO. No sheet says what she starts with,
# and SYSTEMS.md's own tail flags it: "nothing yet says what her cash is for beyond
# Friday and the bus." At $0 the bus is unaffordable, so the chore stops being a
# choice and becomes a wall — which is the one thing money.md says chores must not
# be. $10 is five bus rides and nothing else.

[player.trait_decay]
rest  = 20             # ⚠️ POSITIVE magnitudes — the amount to LOSE per day.
clean = 10
attend_1 = 8
attend_2 = 8
attend_3 = 8
attend_4 = 8             # her_meters.md's table says BOTH needs fall every day.
                       # Slice 1 declared rest only, off a stale reading of
                       # CARRIED.md. A shift spends clean on top of this.

# --- the sidebar -------------------------------------------------------------
# All three meters read as WORDS. her_meters.md: a visible number invites farming.
#
# ⚠️ Banded to the FULL five-step ladder (5 · 20 · 40 · 65 · 85), which this slice
# reaches none of. That is deliberate here and WRONG at v0.1 — the skill's rule is
# to band to what the build actually reaches. Re-band before anything ships.

[[sidebar_items]]
