# =============================================================================
# The Balance — 8 · the phone
#
# ⚠️ FIRST 8_phone.toml IN THIS REPO. No game here has ever had one. The merger
# has always known the filename (merge_toml_phases.py) and it merges LAST.
#
# ⚠️ TWO APPS, WHICH IS WHAT the_phone.md ALWAYS SAID: "Two things only: messages,
# and a streaming app." The messages are all @cara's — the_cast.md: "she's also the
# other end of the phone: the messages are hers." She is the only person who texts
# her about anything but work.
#
# ⚠️ STILL NO FEED AND NO POSTING BUTTON, and the reason has not changed. A
# social_feed `post_action` rolls followers into a trait from a sidebar button that
# is live in every room — she would earn followers on the bus, and the door being
# shut is the entire weight of that scene.
#
# What changed is that a BUTTON is not the only thing a phone can hold. Going live
# is a `launcher` app: every option names a canvas, and an option is live only where
# that canvas lives. It pays nothing on this screen. It hands her to the scene, and
# the scene charges the hour, the shower and the exposure exactly as it did when the
# link sat on her bedroom wall.
#
# ⚠️ A CANVAS HAS EXACTLY ONE HOME, so a session in two places is two canvases, not
# one that roams. The trigger location is also the passage the scene returns her to
# (v2.py _get_return_location, resolved at build time). That is why `stream` keeps
# `location = "her_room"` while carrying `hidden_from_location` — it still has a
# room to come back to, it is just no longer offered on that room's screen.
#
# ⚠️ Reply effects go through Number(eff.value || 0), so a random-range dict is
# NaN here. Fixed numbers only on this file.
# =============================================================================

[phone]
enabled       = true
purchase_flag = "opening_done"
# The button appears when the game proper starts, not over the three screens of
# the opening where nobody is named yet.

[[phone.apps]]
id    = "messages"
type  = "chat"
label = "Messages"

# --- the streaming app -------------------------------------------------------
# her_meters.md is the rule this is checked against: "going further means she can
# reach more — more places, more people, more hours. Never a bigger number."
# Exposure's stated job there is "opens places and hours", and before this it
# opened neither — 22 prose bands and two dice rolls, and not one door.
#
# ⚠️ EACH locked_text ANSWERS ONE STATE ONLY: not enough of her is out there yet.
# The other two refusals are written elsewhere on purpose, because one line cannot
# mean three things — that is the trap that put a stale "not yet" on a spent rung
# of Tasha's ladder. "Not here — Your Room." comes from the engine, which knows
# where the canvas lives. "Somebody is always in at this hour." is the canvas's own
# cooldown_message.
#
# ⚠️ AND NO NUMBER IN ANY OF THEM. All three ascent meters are hidden = true in
# [[traits.labels]] so the raw score never renders. A locked row reading
# "Exposure 20+" would be the first number in the game.

[[phone.apps]]
id        = "golive"
type      = "launcher"
label     = "Go Live"
no_answer = "Not from here. Not with this many people about."

# ⚠️ THIS `locked_text` NEVER RENDERED UNTIL 2026-09-17. The launcher reaches for
# it only when the canvas it points at HAS trigger conditions (v2.py:3152-3153),
# and `stream` had none — two schedule rows and nothing else — so every refusal
# fell through to the canvas's `cooldown_message` instead. The door lock gave the
# canvas conditions, which turned this string on for the first time, so it stopped
# being "Not tonight." and started naming the actual reason.
[[phone.apps.options]]
text   = "Your room, door shut."
canvas = "stream"
show_when_locked = true
locked_text = "Not with the door open. It is four inches of his house and anybody on that landing has it."

[[phone.apps.options]]
text   = "The one at work, with the lock."
canvas = "stream_toilet"
show_when_locked = true
locked_text = "Not that. Not somewhere anybody could put a hand on the door."

# --- 1 · she is still talking to you like September -------------------------

[[phone.conversations]]
id     = "cara_hello"
app    = "messages"
npc    = "npc_cara"
notify = "Cara texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "right so I've worked out the bus. you have to get the one BEFORE the one that says it goes there. I have lost forty minutes learning this"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "are you about at lunch or are you doing the thing where you vanish"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "I'm about. Union, usual table.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = 2 }] },
  { text = "Can't today. Sorry.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = -1 }] },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
round = 2
content = "ok well I'll be there anyway so if you change your mind I'm the one with the coat on indoors"

# --- 2 · she is pleased for you and it costs her something -------------------

[[phone.conversations]]
id     = "cara_job"
app    = "messages"
npc    = "npc_cara"
notify = "Cara texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "has_job", operator = "is_true" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "YOU GOT IT. ok I'm made up for you, genuinely"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "when are you actually free now though. like actually. don't do the thing where you say soon"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "Sunday after the shift. I'll come to you.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = 3 }] },
  { text = "Soon.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = -2 }] },
]

# --- 3 · she repeats what the crowd says and never knows it is true ----------
# the_cast.md, in those words. It arrives once her exposure is up enough that
# there is something going round, and she has no idea she is telling her about
# herself.

[[phone.conversations]]
id     = "cara_rumour"
app    = "messages"
npc    = "npc_cara"
notify = "Cara texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "trait", subject = "player", trait_key = "exposure", operator = "gte", value = 20 },
  { type = "trait", subject = "npc", npc_id = "npc_cara", trait_key = "relation", operator = "gte", value = 8 },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "ok don't be weird but there's a thing going round about a girl in our year doing stuff online. like properly"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "and everyone's being SO horrible about it and I keep thinking, she's just broke isn't she. that's all it is"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "Yeah. She's probably just broke.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = 1 }] },
  { text = "Who's saying it?", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = 1 }] },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
round = 2
content = "everyone. that's the thing. nobody's even started it, it's just there"

# --- 4a · WARM · the coffee that actually gets arranged ---------------------

[[phone.conversations]]
id     = "cara_coffee"
app    = "messages"
npc    = "npc_cara"
notify = "Cara texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "days_since_flag", subject = "player", flag_key = "opening_done", operator = "gte", value = 4 },
  { type = "trait", subject = "npc", npc_id = "npc_cara", trait_key = "relation", operator = "gte", value = 14 },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "right. I'm booking you. an actual hour where you're not going anywhere after"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "you've been on that bus more than you've been anywhere else and I'm the only one who's noticed, which is a bit grim when you say it out loud"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "Book me then.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = 3 }] },
  { text = "I've got a shift. I've always got a shift.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = -2 }] },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
round = 2
content = "I know. that's sort of what I'm saying"

# --- 4b · COOL · two lines, and no reply offered ----------------------------
# She never confronts and never judges. She just gets harder to reach.

[[phone.conversations]]
id     = "cara_cool"
app    = "messages"
npc    = "npc_cara"
notify = "Cara texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "days_since_flag", subject = "player", flag_key = "opening_done", operator = "gte", value = 6 },
  { type = "trait", subject = "npc", npc_id = "npc_cara", trait_key = "relation", operator = "lte", value = 6 },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "saw you go past the union today"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "anyway. hope work's ok"

# --- 5 · the last one ------------------------------------------------------

[[phone.conversations]]
id     = "cara_last"
app    = "messages"
npc    = "npc_cara"
notify = "Cara texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "days_since_flag", subject = "player", flag_key = "opening_done", operator = "gte", value = 10 },
  { type = "trait", subject = "npc", npc_id = "npc_cara", trait_key = "relation", operator = "lte", value = 2 },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "happy Thursday"
