[[canvases.trigger.schedules]]
weekdays   = [0, 2, 4]
start_time = "17:00"
end_time   = "19:00"

[[canvases.nodes]]
id   = "base"
name = "Nobody else is going to"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "The fridge has four things in it that would make one thing. Your mum went at half six and nobody has been in here since, and the table is still wearing this morning." },
  { type = "paragraph", content = "There is a pan on the drainer that somebody meant to put away. Two men are coming in hungry in an hour and neither of them has ever once thought about that in advance." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You could do nothing. Nothing is what happens most ward nights. Everybody eats standing up out of whatever they find, but nobody in this house has ever called that a problem."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Make something proper."
targetType = "node"
nodeId     = "cook.made"
flagEffects = [{ targetType = "player", flag = "cooked_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Leave it. Somebody else can."
targetType = "location"
locationId = "the_kitchen"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "made"
name = "An hour of it"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "It takes longer than it should because you keep checking the one thing that does not need checking. The window steams up. The kitchen smells like somebody lives here."

# ⚠️ HE IS IN THIS ROOM FROM 18:30 AND THE WINDOW RUNS TO 19:00, so whether he
# walks in on it is decided by when she started. Starting at five buys her the
# room to herself; starting at six means he watches the end of it.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "@gil comes in on the end of it and stops in the doorway for about a second longer than he needs to, then sits down and puts the radio on low." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "You didn't have to do that." },
  { type = "paragraph", content = "He says it like a correction and eats two plates of it, and that second plate is the only thing in this house that has ever been an apology." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "You get it on the table and go before anybody comes down, because being in here when they find it would be asking, and asking would spoil what it is." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Nobody is going to mention it. You knew that at five o'clock, but you did it anyway. Everything else you have ever done in this house was for five dollars."

[canvases.nodes.exit_block]
type = "location"
text = "Get out of the kitchen."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_kitchen"
time_progression_minutes = 60

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_gil"
trait      = "relation"
op         = "add"
value      = 2

# -----------------------------------------------------------------------------
# TASHA AT THE TABLE
# -----------------------------------------------------------------------------
# ⚠️ SHE HAD NO KITCHEN CARD AT ALL, EVER. She sits at that table [1, 3, 6] and
# the only thing there was `dinner`, which is the room's hour and gives her three
# rotating lines she cannot be answered on.
#
# ⚠️ IT IS NOT A SECOND DINNER. It shares `tasha_today`, which is the flag that
# already means one go at Tasha a day wherever it happens — so taking her side at
# the table SPENDS her bedroom hour. That is the decision, and it is the same
# shape @nate's `nate_today` has had since the afternoon pass.

[[canvases]]
id   = "hub_tasha_kitchen"
name = "Tasha"
description = "Portrait hub @ the_kitchen, 19:00-20:00 on the three nights she eats with them. Shares `tasha_today` with her room and the bathroom, so the table costs the bedroom."

[canvases.trigger]
location      = "the_kitchen"
requires_npc  = "npc_tasha"
npc           = "npc_tasha"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [1, 3, 6]
start_time = "19:00"
end_time   = "20:00"

[[canvases.nodes]]
id   = "base"
name = "Across the table"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Tasha has the seat she always has and she is holding the room the way she holds every room, which works on nobody here and has never once stopped her doing it." },
  { type = "paragraph", content = "She is eating with one elbow on the table and telling a story to three people who are not listening, and she keeps checking whether you are." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The story has got to the part where somebody was supposed to laugh. Her mum is looking at her plate. @gil is looking at the radio. She keeps going and her voice gets a bit smaller."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Back her up."
targetType = "node"
nodeId     = "hub_tasha_kitchen.backed"
show_when_locked = true
locked_text = "You have had your hour with Tasha today, wherever you spent it."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tasha_today", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "tasha_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Let it go quiet."
targetType = "location"
locationId = "the_kitchen"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "backed"
name = "Somebody laughed"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You give her the line she was waiting for and she takes it and runs about a mile with it, and for the rest of that plate there are two people at this table having a dinner."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "npc", npc_id = "npc_tasha", trait_key = "relation", operator = "gte", value = 10 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "See, you get it. Nobody in this house gets it. You're the only one who was ever going to." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Thank you. That's all I wanted. One person. It's not a lot to want off four of you." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Come up after. I've got the thing I was telling you about and I'm not showing it down here." },
  ] },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She kicks you under the table on her way up and does not look back, and the hour you have just spent on her is the hour you were going to spend in her room."

[canvases.nodes.exit_block]
type = "location"
text = "Finish your plate."

