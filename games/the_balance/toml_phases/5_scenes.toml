# --- THE OFFICE · the second key ---------------------------------------------
# the_move_up.md: BOTH keys, every step, and it needs both. Shifts worked is proof
# she can do the job. This is the other one — and there is no move he can make on
# his own, so it is hers to not step back from.

[[canvases]]
id   = "office_closer"
name = "The office"
description = "The second key. He stands closer than he needs to and she chooses whether to step back. Sets owen_standing, without which eight shifts buys nothing."

[canvases.trigger]
location      = "the_back_room"
npc           = "npc_owen"
is_repeatable = true
max_triggers_per_day = 1
priority      = 7
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "has_job", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "shifts_worked", operator = "gte", value = 4 },
  { type = "trait", subject = "player", trait_key = "owen_standing", operator = "lt", value = 1 },
] }

[[canvases.nodes]]
id   = "base"
name = "At the wall"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He is at the schedule on the wall with a pen, working out next week. The office is small and he moves over to give you room at the board, except that he doesn't move, he comes in beside you."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_owen" }
content = "Thursday I've got you down for. Say now if that's no good, because I'm not moving it twice."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "His arm is against your arm. There is a whole wall free on his other side."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Step back."
targetType = "node"
nodeId     = "office_closer.stepped"

[[canvases.nodes.exit_block.choices]]
text       = "Stay where you are."
targetType = "node"
nodeId     = "office_closer.stayed"

[[canvases.nodes]]
id   = "stayed"
name = "You stay"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You read the board with his arm against yours and neither of you mentions it."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_owen" }
content = "Saturday too, if you want the hours. You'd be on with me."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "His hand comes to rest flat on your lower back, where a hand goes to move somebody out of a doorway. You are not in a doorway. He does not move you."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "He is a strict boss before he is anything else, and none of that has gone anywhere. It just has a hand on your back now."

[canvases.nodes.exit_block]
type = "location"
text = "Go back out."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_cafe"
time_progression_minutes = 10

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "owen_standing"
op         = "add"
value      = 1

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "corruption"
op         = "add"
value      = 3

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_owen"
trait      = "relation"
op         = "add"
value      = 2

[[canvases.nodes]]
id   = "stepped"
name = "You step back"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You take half a step and put the width of a person between you, and he carries on reading the board as though that was the arrangement all along. He talks you through Thursday. Nothing in his voice changes and nothing in it is going to."

[canvases.nodes.exit_block]
type = "location"
text = "Go back out."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_cafe"
time_progression_minutes = 10

