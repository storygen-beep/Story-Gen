# =============================================================================
# THE HOUSE IN THE AFTERNOON · four surfaces for four schedule rows
#
# ⚠️ EVERY ONE OF THESE EXISTS BECAUSE A SCHEDULE ROW NEEDS A SURFACE. presence.py
# backs a row four ways — portrait, covered, substitution, occupancy — and a row
# with none of them is DEAD. @nate's new hours (kitchen 12:00, garage 13:00, his
# room 15:00) and @gil's garage hour are the rows; these are the surfaces.
#
# ⚠️ ALL FOUR CARRY AN EXPLICIT SCHEDULE FENCE. A canvas with no schedule is live
# whenever its LOCATION is, so an unfenced `hub_nate_room` would render against a
# man asleep at three in the morning. process/README.md §6 item 16.
#
# ⚠️ NO max_triggers_per_day ON ANY OF THEM. A day cap on a canvas that carries an
# `npc` does not spend the act, it deletes the person — 0_systems_spec.toml:319.
# The caps are flags on the choices: `nate_today` across his three new surfaces,
# and `gil_today` shared with the kitchen and sofa hubs he already has.
# =============================================================================

[[canvases]]
id   = "kitchen_nate"
name = "Nate"
description = "Portrait hub @ the_kitchen. Quarter to eight on college mornings, and noon every day. Shares `nate_today`."

[canvases.trigger]
