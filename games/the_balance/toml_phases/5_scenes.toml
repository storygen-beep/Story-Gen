# ⚠️ THE WALL, AND IT IS ONE LINE RATHER THAN THREE GREYED RUNGS.
# walking_in.md:61 — "She sees that there's something there and that she can't do
# it, ONE LINE, not an empty screen." The first build of this canvas put
