[canvases.nodes.exit_block]
type = "choices"

# ⚠️ EVERY RUNG CARRIES ITS OWN `is_false` AND THAT IS WHAT MAKES IT AN ARC.
# CARRIED.md:215-218 — "a numbered ladder of ONE-TIME steps, each gated on the flag
# the one before it set". Without the self-gate a rung replays forever and the
# ladder is a menu; the first build of this canvas did exactly that and the live
# walk caught it.
#
# ⚠️ RUNG 1 READS RELATION, NOT `tasha_seen`, and that is deliberate.
# `tasha_walks_in` is a 0.3 substitution — an arc whose entrance is a dice roll
# strands anyone who never rolled it. Relation is the reliable road in and the
# walk-in feeds the same number (+1), so it still counts toward getting here.
# `tasha_seen` survives as a prose band above, not as a gate. And it could not
# have been an OR anyway: the evaluator takes one flat items list with one logic
# (v2.py:4037-4039), so `flag is_false AND (A OR B)` is not expressible.
# ⚠️ THE FLAG IS SET HERE, ON THE LOCATED HUB CHOICE, AND IT CANNOT MOVE.
# The flag-chain validator HARD-FAILS a flag that a trigger or a choice reads when
# its only setter is a TRIGGERLESS canvas — "ensure all required flags are set by a
# canvas with location/schedule". `loop_tasha_bath` reads `tasha_open is_true`, so
# a located setter must exist, and the rungs are triggerless by design.
#
# ⚠️ AND THAT LEAVES ONE SCOREBOARD LINE RED ON PURPOSE. gates.py `the climb is
# paid for` calls a route self-limiting only when the TARGET canvas sets the flag
# the choice reads `is_false` (gates.py:3489-3491). A triggerless rung cannot both
# be the located setter the build demands and the target setter the gate looks for,
# so the gate reports `corruption` as a free climb through this hub. IT IS NOT:
# every rung carries its own `is_false` and fires exactly once ever — proved live,
# a spent rung vanishes from the screen. Setting the flag in both places was tried
# and does not work either: the unlock map is first-writer-wins over a canvas list
# in reverse declaration order, so the triggerless rung claims the flag and the
# build fails again. gates.py:403 states the principle — "a check that fails a game
# for obeying the doctrine is a bug in the check". Do not contort this to go green.
[[canvases.nodes.exit_block.choices]]
text       = "Stay while she gets changed."
targetType = "node"
nodeId     = "arc_tasha_01.base"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key = "tasha_shows", operator = "is_false" },
  { type = "trait", subject = "npc", npc_id = "npc_tasha", trait_key = "relation", operator = "gte", value = 6 },
] }
flagEffects = [{ targetType = "player", flag = "tasha_shows", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Do not look away this time."
targetType = "node"
nodeId     = "arc_tasha_02.base"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key = "tasha_shows",   operator = "is_true" },
  { type = "flag",  subject = "player", flag_key = "tasha_watched", operator = "is_false" },
  { type = "trait", subject = "player", trait_key = "corruption",   operator = "gte", value = 15 },
] }
flagEffects = [{ targetType = "player", flag = "tasha_watched", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Put your hand out."
targetType = "node"
nodeId     = "arc_tasha_03.base"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key = "tasha_watched", operator = "is_true" },
  { type = "flag",  subject = "player", flag_key = "tasha_open",    operator = "is_false" },
