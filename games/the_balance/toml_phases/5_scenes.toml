  { type = "paragraph", content = "She says it twice, about two different things, and neither time did she hear which thing it was. Tasha does not mind. Being heard was never the point of it." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
