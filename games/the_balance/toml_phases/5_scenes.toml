# --- THE SCHEDULE ON THE WALL · where nothing happening is visible -----------
# the_move_up.md: his only punishment is holding her where she is, and he never
# announces it. THE SCHEDULE IS HOW HE TALKS. This is also the locked door the
# release ends on.

[[canvases]]
id   = "the_schedule"
name = "The schedule on the wall"
description = "Repeatable read of the board. Shows where she stands without anybody saying it, and carries the closing shift as a visible locked door."

[canvases.trigger]
location      = "the_back_room"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "has_job", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "The board"

# PARKED 2026-09-19 (the climbs) — the board read `move_up`: the counter version ("Four
# marks against your name now") and the locked closing-shift choice are the cafe ladder.
# What a fresh save sees stays, unconditioned. Whole scene in parked/climbs/before_the_strip.toml.
[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Six names down the side and the week across the top. Yours has two marks against it, Tuesday and Sunday, in the same pen as everyone else's. The board is the same board it was last week."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The bottom line of the board is the five-to-ten, one name a night, and it is the only line with a single name on it."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
