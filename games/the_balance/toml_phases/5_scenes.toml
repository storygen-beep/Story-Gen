# --- THE DINNER CALL · the only thing in this game that moves him ------------
# chores.md:76, LO's line: "Dinner on a ward night. If she cooks, there's dinner.
# If she doesn't, there's none, and nobody says anything." That was true and it was
# the problem — half an hour of her time, a meal on the table, and the game did not
# notice.
#
# ⚠️ IT IS THE EXACT MIRROR OF `dinner`. Same room, same hour, the other three
# nights, no `npc` on the trigger because it is a HOUSE scene and not anybody's
# card. Nothing new enters the engine.
#
# ⚠️ WHO IS IN THIS HOUSE AT SEVEN ON A WARD NIGHT: @gil in the garage, @nate on
# the sofa, @tasha in her room, her mum at work. Calling them is her taking three
# people out of three rooms — and every other surface in this game is him ALREADY
# SAT SOMEWHERE. This is the one where she moves him, and it is a plate of food.
#
# ⚠️ NOBODY REFUSES. Refusing is a ladder. And the week varies it for free: Friday
# @tasha is out from six, so Monday and Wednesday it is four at the table and
# Friday it is three.

[[canvases]]
id   = "ward_dinner"
name = "Call them down"
description = "Ward nights, if she cooked in time. The mirror of `dinner` on the three nights her mum is not here to make one. The only surface in the game that moves her step dad out of a room he chose."

[canvases.trigger]
location      = "the_kitchen"
is_repeatable = true
max_triggers_per_day = 1
priority      = 9
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "chore_done_dinner", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 2, 4]
start_time = "19:00"
end_time   = "20:00"

[[canvases.nodes]]
id   = "base"
name = "It is on the table"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "It is on the table. It is going cold, and this house has no way of telling anybody so. Your mum went to work at quarter to seven. Nobody is coming down on their own."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The garage light is on round the side. The television is going in the front room. There is music coming through Tasha's floor. Three rooms, three people. Every one of them would sit down here if somebody went and said so."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Call them down."
targetType = "node"
nodeId     = "ward_dinner.called"
time_progression_minutes = 10

[[canvases.nodes.exit_block.choices]]
text       = "Eat yours and leave the rest out."
targetType = "location"
locationId = "the_kitchen"
time_progression_minutes = 20

[[canvases.nodes]]
id   = "called"
name = "Four chairs, three of them"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Tasha comes first because she was bored. She comes loudly, with opinions about the plates. @nate comes because the television had finished being interesting, not because you asked. He makes sure that is clear by the way he sits down."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "@gil comes last, in from the cold with his hands done to the wrist. He stops in the doorway a second, like he is checking he has the right house. Then he sits in the chair he always sits in, pulls the plate over, and says nothing about any of it."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_gil" }
content = "Didn't know this was happening."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your mum's chair is the empty one. Nobody sits in it. Nobody moves it either. The three of them eat, and argue about nothing, but it goes on twenty minutes longer than it needs to."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "This does not happen on a ward night. It happened because you cooked, then went and got them. Every person at this table knows which of those two was the hard one."

[canvases.nodes.exit_block]
type = "location"
text = "Clear up."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_kitchen"
time_progression_minutes = 20
