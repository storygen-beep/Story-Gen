start_time = "07:45"
end_time   = "08:15"

[[canvases.nodes]]
id   = "base"
name = "Standing at the counter"

# ⚠️ GROUPS, NOT ONE POOL. A `block_pool` cannot be gated (process/README.md §6
# item 4), and this canvas now covers two different hours — midday in his coat, and
# seven at night with nobody cooking. One pool would have put him fresh out of a
# lecture at the dinner table three nights a week.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "time_of_day", start_time = "12:00", end_time = "13:00" },
] } }
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "@nate is against the counter eating something straight out of the packet, still in his coat. He got out of the same building you did and he got here first, and he wants you to know both of those things without saying either." },
    { type = "paragraph", content = "The kitchen smells like toast and he has not washed the pan. He is on his phone with one hand and eating with the other, and he moves about four inches when you need the drawer he is stood in front of." },
  ] },
]

# ⚠️ THE ELSE BAND IS BREAKFAST NOW, NOT THE WARD-NIGHT TABLE. Its two old
# paragraphs went with the 19:00 fence above — `dinner`'s own else band carries
# "Nobody cooked" from this pass, which is where that line belongs.
[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "He is out of the shower and eating over the sink with one arm already in his coat. His hair is wet and he has not looked at anybody, and he leaves the tap running for somebody else to turn off." },
    { type = "paragraph", content = "Quarter to eight. @nate eats standing up at the counter with the bread bag open beside him, working out how few minutes he can spend in this room and still be in it." },
  ] },
]

