# =============================================================================
# THE TWO DOORS AT HOME
#
# ⚠️ These two have NAMES, so each one needs an AFTER. A door with nothing behind
# it the next morning is a campus door standing in a house. @nate's after is the
# week he spends on the landing; @gil's is the Friday table.
#
# ⚠️ BEING CAUGHT AT HOME DOES NOT MOVE EXPOSURE. Exposure is strangers knowing
# things. At home it is one person with a name, and what moves is where she
# stands with him — which is the harder currency, because he is at breakfast.
# =============================================================================

# --- @NATE'S DOOR · the cost comes first ------------------------------------
# the_two_doors.md: the first walk-in in the whole game, and it is WRITTEN FOR
# HER. She opens the door, she sees, she leaves, and NO CHOICE IS OFFERED. It
# teaches what this is so the second one means something.

[[canvases]]
id   = "nate_door"
name = "His door isn't shut"
description = "Walk-in on @nate. No choice by design. He knows every time, and what it buys her first is a worse week: he is on the landing for seven days and her own door cannot stay shut, so the stream is off."

[canvases.trigger]
