# --- FRIDAY · the payment ----------------------------------------------------
# money.md: $2,400 for the semester, $150 every Friday, sixteen weeks and it is
# clear. the_week.md: handed over in the kitchen on Friday evening, and @gil is
# there because he is always there at six.
#
# ⚠️ [settings.rent] IS STILL DELIBERATELY ABSENT and this is why. The engine's
# rent only ARMS a flag on the due weekday (rent_state.is_due, set inside
# advanceDay) — it deducts nothing and it narrates nothing. The payment in this
# game is a scene with a man in it, and two systems both claiming to collect the
# same $150 is how a game ends up telling the player twice.
#
# ⚠️ ALL EVENING, not six o'clock sharp. LO's call. She can only miss it by
# staying out, which is a choice — and putting things off is allowed everywhere
# else in this game.

[[canvases]]
id   = "friday_payment"
name = "Friday"
description = "The $150. Fires in the kitchen any Friday evening. Paying takes it off the debt; not having it puts a Friday on the count. He never explains either."

[canvases.trigger]
location      = "the_kitchen"
npc           = "npc_gil"
is_repeatable = true
max_triggers_per_day = 1
priority      = 11
is_active     = true
# ⚠️ GATED ON `friday_settled` SINCE 2026-09-23, because there are now TWO places to
# pay him — here and `friday_payment_garage`, which covers the four hours he is in
# the garage on a Friday night. Both set the flag on every exit, paid AND missed,
# and a purse with $300 in it would otherwise have paid the same $150 twice.
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "friday_settled", operator = "is_false" },
] }

# ⚠️ THE WINDOW IS STILL 17:00-21:00 AND HE IS ONLY IN THIS ROOM FOR ONE HOUR OF IT
# — 18:00 to 19:00. That is not a bug in the schedule: the portrait lane checks
# presence after selection (v2.py:5281-5291), so the card simply does not render in
# the hours he is elsewhere. The evening is covered because the garage has the rest
# of it. Narrowing this to 18:00-19:00 would be tidier and would also mean the card
# stops existing the day his kitchen row moves again.
[[canvases.trigger.schedules]]
weekdays   = [4]
start_time = "17:00"
end_time   = "21:00"
# ⚠️ ENDS AT NINE because that is when @gil goes up. His schedule now puts him
# in the master bedroom from 21:00, and the portrait lane checks presence — a
# Friday window that outran his hours would render a link to a man who is not in
# the room. Still "all evening" in the sense LO chose: four hours, and she can
# only miss it by staying out.

[[canvases.nodes]]
id   = "base"
name = "Friday"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "@gil is at the table with the radio on low and nothing in front of him. He is not waiting for you in any way you could point at. He is just there, on a Friday, the way he is there on a Friday."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "A hundred and fifty. He has never once said the number out loud, because he has never once had to."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Count it out on the table."
targetType = "node"
nodeId     = "friday_payment.paid"
show_when_locked = true
locked_text = "You haven't got a hundred and fifty."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "cash", operator = "gte", value = 150 },
] }

