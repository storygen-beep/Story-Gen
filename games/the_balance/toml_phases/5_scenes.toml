name = "Six is six"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You take the plate and the saucer and leave the ten sitting on the table, and he watches you do it. He is gone before you come back round with the cloth. The ten is gone with him."

[canvases.nodes.exit_block]
