# Block 2 of sheets/BASE.md for him, the way her_mum_cards.md was for her mum.
# He had ONE portrait canvas in this whole game — `friday_payment`, four hours a
# week — and eight of his twelve rows were dead. These eight cards cover eighteen
# of his nineteen; the nineteenth is dinner, which `dinner` already has.
#
# ⚠️ EVERY CARD HERE IS `requires_npc` PLUS `npc`, AND THAT IS NOT BELT AND BRACES.
# `npc` is what puts his FACE on the card instead of printing the canvas name as a
# solo link (v2.py:4953 drops an npc-carrying canvas out of the solo bucket;
# :5436 picks it up as a portrait). `requires_npc` resolves through getNpcLocation,
# so HIS ROWS ARE THE CANVAS'S HOURS and the two cannot drift apart. A trigger
# schedule is added ONLY where a second card of his shares the room — which is the
# master bedroom, three times over.
#
# ⚠️ NO max_triggers_per_day ON ANY TRIGGER HERE. A day cap on a canvas carrying an
# `npc` does not spend the act, it DELETES THE PERSON — his portrait would vanish
# from a room his own timetable still has him in. Caps go on the CHOICE, as a
# `_today` flag cleared in [engine.daily_tick]; engine.md §28.1.
#
# ⚠️ THE CAST PAGE IS WHY A HUB IS HIS SHAPE, and it is worth quoting in full:
# "He never opens a step. Every step with him is one she opens. There is no move he
# can make on his own, WHICH IS THE WHOLE REASON THE GAME CAN HAVE HIM AT THE
# KITCHEN TABLE." He sits there. She opens everything, or nothing happens.
#
# ⚠️ HIS REGISTER IS NOT HERE AND MUST NOT ARRIVE. CARRIED.md:203 puts it in the
# garage, late, and that is block 5. These are floors.
# =============================================================================

