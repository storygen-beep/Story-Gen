# --- FRIDAY · the payment ----------------------------------------------------
# money.md: $2,400 for the semester, $150 every Friday, sixteen weeks and it is
# clear. the_week.md: handed over in the kitchen on Friday evening, and @gil is
# there because he is always there at six.
#
# ⚠️ [settings.rent] IS STILL DELIBERATELY ABSENT and this is why. The engine's
# rent only ARMS a flag on the due weekday (rent_state.is_due, set inside
# advanceDay) — it deducts nothing and it narrates nothing. The payment in this
# game is a scene with a man in it, and two systems both claiming to collect the
# same $150 is how a game ends up telling the player twice.
#
# ⚠️ ALL EVENING, not six o'clock sharp. LO's call. She can only miss it by
# staying out, which is a choice — and putting things off is allowed everywhere
# else in this game.

[[canvases]]
id   = "friday_payment"
name = "Friday"
description = "The $150. Fires in the kitchen any Friday evening. Paying takes it off the debt; not having it puts a Friday on the count, and the chore list on the fridge reads that count. He never explains either."

[canvases.trigger]
location      = "the_kitchen"
npc           = "npc_gil"
is_repeatable = true
max_triggers_per_day = 1
priority      = 11
is_active     = true

[[canvases.trigger.schedules]]
weekdays   = [4]
start_time = "18:30"
end_time   = "20:30"
# ⚠️ STARTS AND ENDS WITH HIS KITCHEN HOURS, AND BOTH ENDS HAVE MOVED NOW. The row
# was 18:00-21:00; the television took the last half hour and put him on the sofa,
# and the bathroom took the first half hour and put him in the shower. The window
# here has to follow both. It carried a dead 17:00-18:00 hour before this pass —
# that was a real defect, quiet because the portrait lane fails CLOSED. The portrait lane checks presence — a Friday window that
# outran his kitchen hours would render a link to a man who is not in the room,
# which is the bug this comment has existed to prevent since the window was first
# written. Still "all evening" in the sense LO chose: three and a half hours, and
# she can only miss it by staying out.

[[canvases.nodes]]
id   = "base"
name = "Friday"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "@gil is at the table with the radio on low and nothing in front of him. He is not waiting for you in any way you could point at. He is just there, on a Friday, the way he is there on a Friday."

[[canvases.nodes.blocks]]
