content = "It is paid. That is the part that concerns you. A hundred and fifty a week and we are square, and I am not doing the other conversation."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He turns the radio back up one notch and goes back to the folder. The number is on a piece of paper somewhere in this house and he is never going to be the one who says it out loud."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "He did not tell you and he is not angry either. You just spent something to find that out, and the only place it shows is in how the room feels for the rest of the week."

[canvases.nodes.exit_block]
