id   = "cust_hand"
name = "The window table"
description = "Customer step one. The bigger note is the asking; taking it is the answer. Carries the shift payoff plus $10. Moves exposure and corruption. Sets cust_hand_done, which opens step two."

[canvases.trigger]
location          = "the_cafe"
is_repeatable     = true
max_triggers_per_day = 1
substitution_only = true
priority          = 5
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "Under the saucer"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Four hours in, the man at the window table puts a ten under his saucer where you can see it. The bill was six. He doesn't look up when you come over."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "unknown" }
content = "No rush. I'm not going anywhere."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "There is nobody at the next two tables. Owen is out the back with the door shut."

[canvases.nodes.exit_block]
