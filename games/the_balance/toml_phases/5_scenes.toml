[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The door goes and Tasha is at the mirror with her bag open before the steam has even moved. She does not look over and she does not apologise. You are behind a shower screen that is clear from the hip up."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_tasha" }
content = "You've got about four minutes and then I need this light. You can borrow the green top if you're going anywhere in it."

[[canvases.nodes.blocks]]
