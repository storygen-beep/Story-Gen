# the_house_day.md names her exactly like this. She cannot out her, she does not
# know anything, and she is an example rather than a threat — so what this costs
# is nothing, and what it does is make "shared" mean something.

[[canvases]]
id   = "tasha_walks_in"
name = "The lock you didn't turn"
description = "Substitution on the shower. Tasha comes in while she is in there. Restores clean like any wash; costs nothing but the fact of it."

[canvases.trigger]
location          = "the_bathroom"
npc               = "npc_tasha"
is_repeatable     = true
max_triggers_per_day = 1
