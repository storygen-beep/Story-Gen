# The first draft of this canvas authored FIFTEEN — a "Watch it." per ladder rung
# per parent — and `gates.py` "a place is not a catalogue" failed it on the spot:
# the field, measured by playing five games, carries 1-6 things to do on a screen
# with a median of 3. They were mutually exclusive so only one ever RENDERED, and
# the gate counts what is authored, which is the right thing to count: fifteen
# rows is fifteen chances for two conditions to overlap and print the same button
# twice with different effects.
#
# What collapsed them was separating the two acts that were sharing a button.
# WATCHING is one row and always the same: the hour, the rest. LEAVING IT ON in
# front of a parent is a different act, and it is the only one that climbs.

