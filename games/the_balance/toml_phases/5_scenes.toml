end_time   = "13:00"

# ⚠️ THE EVENING WINDOW CAME OFF ON 2026-09-17 AND ITS OWN COMMENT IS WHY. It read
# "The dinner nights are deliberately NOT in this list: `dinner` covers him there,
# and a second Nate surface in the same hour would be two cards for one man." That
# was right, and the ward nights were only ever in here because `dinner` was gated
# on her mum and did not fire on them. `dinner` now runs all seven nights, so the
# exception has nothing left to except. His 19:00 row stays backed: he speaks in
# `dinner`, which presence.py counts as coverage (speakers_of).
#
# --- BREAKFAST, AND IT IS THE HALF HOUR SHE HAS ------------------------------
# He comes straight out of the shower into this. @gil is at the table from half
# six, her mum from half six on her ward days, and the bus is twenty minutes off.
# It is the only window in the game where three of them are awake in this room at
# once, and `nate_today` means spending it on him costs the noon one.
[[canvases.trigger.schedules]]
