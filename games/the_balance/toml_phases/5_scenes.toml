# =============================================================================
# The Balance — 5 · the one-time half
#
# SLICE 2. The two customer steps, the office, and the schedule on the wall.
#
# ⚠️ AN EXPLICIT BEAT STAYS ON THE BODY FOR ITS WHOLE LENGTH. Read each one's
# LAST sentence: if it is about what the moment MEANS rather than what is
# HAPPENING, it has pivoted. The interiority is not cut — it gets its own
# thought_bubble beat AFTER. Splitting costs nothing.
#
# ⚠️ The customers are FACELESS. Strangers with money, never people with names.
# That is the only thing that makes the tips ladder usable at all.
# =============================================================================

# --- CUSTOMER STEP 1 · a hand that doesn't get moved · $10 -------------------
# substitution_only: reachable ONLY as a target of the shift's dice roll. It
# carries the shift's own pay and count, because it WAS the shift.

[[canvases]]
id   = "cust_hand"
name = "The window table"
description = "Customer step one. The bigger note is the asking; taking it is the answer. Carries the shift payoff plus $10. Moves exposure and corruption. Sets cust_hand_done, which opens step two."

[canvases.trigger]
location          = "the_cafe"
is_repeatable     = true
max_triggers_per_day = 1
substitution_only = true
priority          = 5
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "Under the saucer"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Four hours in, the man at the window table puts a ten under his saucer where you can see it. The bill was six. He doesn't look up when you come over."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "unknown" }
content = "No rush. I'm not going anywhere."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "There is nobody at the next two tables. Owen is out the back with the door shut."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Clear the table. Leave the ten."
targetType = "node"
nodeId     = "cust_hand.refused"

[[canvases.nodes.exit_block.choices]]
text       = "Clear the table. Take the ten."
targetType = "node"
nodeId     = "cust_hand.taken"

[[canvases.nodes]]
id   = "taken"
name = "Nine seconds"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You put the plate down. His hand goes flat on the back of your thigh, up under the hem, and stays. You straighten with the tray against your hip. He takes a handful of your ass and tests whether it moves. It doesn't. Two fingers slide along the seam of your panties and press where your cunt is. Twice. Then his hand comes off your ass and he picks his phone up."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Straighten up."
targetType = "node"
nodeId     = "cust_hand.after"

[[canvases.nodes]]
id   = "after"
name = "Ten dollars"

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "Ten dollars is two hours of the list on the fridge. That took nine seconds and all you had to do was not move."

[canvases.nodes.exit_block]
