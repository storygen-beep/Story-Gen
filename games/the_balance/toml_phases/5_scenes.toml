# --- @GIL COMES IN WHILE SHE'S DOING IT -------------------------------------
# One canvas, substitution_only, on the chore. He notices things in that room —
# the chores, the hours she keeps, whether Friday got paid — and he says none of
# it out loud, because he never does.

[[canvases]]
id   = "gil_notices"
name = "He's in the doorway"
description = "Substitution on the chore. @gil comes through while she is working. Pays the chore exactly as normal; what it costs is being watched doing it."

[canvases.trigger]
location          = "the_kitchen"
npc               = "npc_gil"
is_repeatable     = true
max_triggers_per_day = 1
substitution_only = true
priority          = 4
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "Doorway"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He comes through for the radio and stops in the doorway instead, with his cup, watching you do it. Not checking. Just there, for longer than getting a cup takes."

# ⚠️ A LADDER, NOT A POOL, BECAUSE A POOL CANNOT BE GATED. block_pool renders as
# `<<set _bp to random(0,N)>>` and nothing else (v2.py:15088) — no conditions, at
# any depth. "You were in late Tuesday." used to sit in the pool below and could
# fire on the first morning of the game, about a night that had not happened.
# Consecutive groups merge into ONE if/elseif/else chain and a group with no
# conditions becomes the `<<else>>`, so a pool nested inside each branch gives
# both the gate and the variety.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "home_after_ten", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "You were in late again." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "I heard the door go. It was gone eleven." },
  ] },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "The car one's been on there since Monday." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "Your mum's on nights again Thursday." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "That's the wrong bin for that." },
  ] },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Then he takes the cup and goes. You cannot tell whether that was a comment or a sentence. It is never one or the other with him. That is the whole method."

[canvases.nodes.exit_block]
type = "location"
text = "Finish it."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_kitchen"
time_progression_minutes = 30

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "chore_paid_today"
op         = "set"

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "cash"
op         = "add"
value      = 5

