# --- DINNER · the one hour nothing can be avoided ---------------------------
# the_house_day.md. Everyone at one table on the nights her mum is off the ward.
# @gil notices things there — the chores, the hours she keeps, whether Friday got
# paid. @nate can needle her in front of people and it costs him nothing, which
# is the same move Bree makes on the quad. Tasha performs. Her mum is too tired
# to hear any of it.

