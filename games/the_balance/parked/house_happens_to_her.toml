# PARKED 2026-09-19 — 3 scene(s) from 2591a11 "the house starts happening to her".
# Copied verbatim from ff91336, design comments included. NOT merged: parked/ is outside
# toml_phases/. To bring one back, its block's round in sheets/BASE.md decides it first.

# ── from toml_phases/5_scenes.toml
# --- THE TWO CARDS IN THAT BEDROOM -------------------------------------------
# ⚠️ BOTH EXIST BECAUSE `master_bedroom` BECAME A ROLL. presence.py skips random
# canvases, and @lynn's 21:00 row was backed by `master_caught` as a SUBSTITUTION —
# a verdict that needs its host live in those hours. The moment the host went
# random the script stopped seeing it and that row would have reported DEAD.
#
# ⚠️ AND THEY SPLIT BY NIGHT, NOT BY PERSON. Ward nights he is in that room on his
# own, which the_house_day.md has called "the master bedroom door shut on a man on
# his own" since it was written and nothing has ever used. The other four she is in
# there too, and those are the nights the roll can fire.

[[canvases]]
id   = "hub_gil_bed"
name = "Gil"
description = "Portrait hub @ the_master_bedroom, ward nights only. The three nights a week he is upstairs on his own with the door pushed to. Shares `gil_today` with the kitchen, the sofa and the garage."

[canvases.trigger]
location      = "the_master_bedroom"
requires_npc  = "npc_gil"
npc           = "npc_gil"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_master_bedroom", operator = "is_absent" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 2, 4]
start_time = "21:00"
end_time   = "23:30"

[[canvases.nodes]]
id   = "base"
name = "Door pushed to"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "The door is pushed to and the lamp is on behind it, and there is no bed noise and no telly and no phone. @gil is sat up with a folder open on his knees and a pen he is not using, on the third night this week his wife has been at work." },
  { type = "paragraph", content = "He is on top of the covers in a t-shirt with the invoices spread over her side of the bed. On the nights she is on the ward, that half of it is just a flat surface." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Say goodnight properly."
targetType = "node"
nodeId     = "hub_gil_bed.sat"
show_when_locked = true
locked_text = "You have sat with him once today. Twice would be a thing, and he would notice it was a thing."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "gil_today", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "gil_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Leave him to it."
targetType = "location"
locationId = "the_hall"
time_progression_minutes = 2

[[canvases.nodes]]
id   = "sat"
name = "The edge of the bed"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You end up on the corner of the bed with the folder between you. He moves it about four inches so there is room. Nobody in this house has ever made you more welcome than that, but nobody is going to say so."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "saw_them", operator = "is_true" },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "That board outside has gone under somebody twice this week. If you want something at eleven at night you can knock like anybody else." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "Three nights a week for six years. You do not get used to it. You get used to saying you are used to it." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "I was going to do these at the table and your brother had the radio on. A man cannot add up through a radio." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "Go to bed. I am not being funny with you. It is late and one of us has to be up at half six and it is going to be me." },
  ] },
]

[canvases.nodes.exit_block]
type = "location"
text = "Go to bed."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_hall"
time_progression_minutes = 20

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_gil"
trait      = "relation"
op         = "add"
value      = 2

# ── from toml_phases/5_scenes.toml
# ⚠️ SHE IS STILL NEVER TOUCHED, AND THIS CARD DOES NOT CHANGE THAT. DECISIONS.md
# has been amended twice — the television and the bathroom — and both amendments
# hold here. This is a person in a room saying goodnight: no relation climb towards
# her, no body, no rung, and nothing that reads it but this screen.

[[canvases]]
id   = "hub_lynn_bed"
name = "Your mum"
description = "Portrait hub @ the_master_bedroom, the four nights she is off the ward. In bed with the lamp on. Her second clickable row in the game, and it asks nothing of her."

[canvases.trigger]
location      = "the_master_bedroom"
requires_npc  = "npc_lynn"
npc           = "npc_lynn"
is_repeatable = true
priority      = 4
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [1, 3, 5, 6]
start_time = "22:00"
end_time   = "23:59"

[[canvases.nodes]]
id   = "base"
name = "The lamp on her side"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Your mum is propped on one elbow with the lamp on her side and a paperback she has been on the same page of since Tuesday. The shift times are on the wall by the door in her own writing and she does not look at them any more." },
  { type = "paragraph", content = "She has got her reading glasses on, the duvet up under her arms, the radio going very low. She is asleep about four minutes after you get there, whether you are still talking or not." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Sit on the end of the bed a minute."
targetType = "node"
nodeId     = "hub_lynn_bed.sat"
time_progression_minutes = 15

[[canvases.nodes.exit_block.choices]]
text       = "Let her sleep."
targetType = "location"
locationId = "the_hall"
time_progression_minutes = 2

[[canvases.nodes]]
id   = "sat"
name = "She asks the same four things"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You sit on the end of it. She asks whether you have eaten, whether the bus was all right, whether you need anything for college, whether you are happy. In that order, but she is asleep before the answer to the fourth one."

[[canvases.nodes.blocks]]
type = "dialog"
props = { speaker = "npc", npcId = "npc_lynn" }
content = "You would tell me, wouldn't you. If something was going on. You would not do the thing where you sort it out yourself and I find out in about a year."

[[canvases.nodes.blocks]]
type = "thought_bubble"
props = { speaker = "player" }
content = "She is going to be asleep in ninety seconds. That is the only reason this is a question she can afford to ask."

[canvases.nodes.exit_block]
type = "location"
text = "Turn her lamp off."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_hall"
time_progression_minutes = 15

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "rest"
op         = "add"
value      = 10

# ── from toml_phases/5_scenes.toml
# =============================================================================
# THE HOUSE STARTS HAPPENING TO HER · one new roll, two cards behind the others
#
# ⚠️ EVERY ROLL IS FENCED TO ITS PERSON TWICE OVER. `requires_npc` makes the hours
# theirs at the moment she walks in (v2.py:5637-5648) so the two can never drift;
# the schedule fence then cuts out the hours they are ASLEEP in the same room,
# which `requires_npc` on its own would happily roll against.
#
# ⚠️ AND EVERY ROOM WITH A ROLL IN IT KEEPS A CARD. A random canvas is skipped from
# every room list and from presence.py's backing walk, so a room holding only a
# roll renders empty on a miss and reports its schedule row dead. LO's call:
# "if they are present, then they should have the Hub menu canvases."
# =============================================================================

[[canvases]]
id   = "tasha_caught"
name = "Her door is shut"
description = "RANDOM AMBIENT on @tasha's room. @nate leaves his open four inches on purpose; she shut hers and did not hear the landing. Three rungs on corruption 15 and 30."

[canvases.trigger]
location      = "tasha_room"
npc           = "npc_tasha"
requires_npc  = "npc_tasha"
is_repeatable = true
trigger_mode  = "random"
chance        = 0.3
priority      = 8
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

# Her two awake `tasha_room` rows. She is also asleep in here 00:00-10:00 on
# weekdays and 04:00-12:00 at weekends, and those are exactly what this excludes.
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "16:00"
end_time   = "17:00"

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 6]
start_time = "18:00"
end_time   = "23:59"

[[canvases.nodes]]
id   = "base"
name = "She did not hear the board"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The door goes because you pushed it. Tasha is on her back on top of the covers with her skirt shoved up round her waist, two fingers working in her cunt, her other hand over her own mouth. The music is loud enough that she has not heard one thing."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tasha_caught_seen", operator = "is_true" },
] } }
blocks = [
  { type = "paragraph", content = "She has not moved the music down since. She has not put a lock on that door either, and she is a woman who checks her own reflection in the back of a spoon, so neither of those is an accident any more." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "This is the one thing she does not narrate. Every other part of Tasha is out loud and aimed at a room, and she has her hand over her own mouth so that a house of four people will not find out she wants anything." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The hinge is the quiet one. That is the only reason you are still stood in it."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 15 },
] } }
blocks = [
  { type = "paragraph", content = "You pull it to and go, and you are three steps down the landing before you work out that your hands are shaking. She will come down at seven and talk at you about a girl at work and she will never know." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Pull it to and go."
targetType = "location"
locationId = "the_hall"
time_progression_minutes = 2

[[canvases.nodes.exit_block.choices]]
text       = "Stay in the gap."
targetType = "node"
nodeId     = "tasha_caught.watched"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 15 },
  { type = "flag", subject = "player", flag_key = "tasha_caught_watched", operator = "is_false" },
] }

[[canvases.nodes.exit_block.choices]]
text       = "Let her find you there."
targetType = "node"
nodeId     = "tasha_caught.seen"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tasha_caught_watched", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 30 },
  { type = "flag", subject = "player", flag_key = "tasha_caught_seen", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "watched"
name = "With her hand over her mouth"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You stay. Her knees go further apart, her wrist speeds up, and the sound she makes into her own palm is nothing like her speaking voice. Her back comes up off the bed and stays up for a long second. Then she is flat again, breathing."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She lies there with her arm across her eyes. You get the door shut on the quiet hinge and you are on your own landing before she has thought about the room having a door in it."

[canvases.nodes.exit_block]
type = "location"
text = "Your room."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_hall"
time_progression_minutes = 15

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "tasha_caught_watched"
op         = "set"

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "corruption"
op         = "add"
value      = 3

[[canvases.nodes]]
id   = "seen"
name = "Caught wanting something"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You do not go and you do not hide, and halfway through she opens her eyes and you are stood in her doorway looking at her. Her hand comes off her mouth. Her other one does not come out of her, and for about two seconds neither of you does anything at all."

[[canvases.nodes.blocks]]
type = "dialog"
props = { speaker = "npc", npcId = "npc_tasha" }
content = "Don't. Do not do the face. You have seen me in less than this in that bathroom about forty times and you have never once looked at me like that."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She gets her skirt down and sits up on the edge of the bed with her hair everywhere. She is not embarrassed about her body, because she never is. She is embarrassed that you know she wanted something badly enough to be quiet about it."

[[canvases.nodes.blocks]]
type = "dialog"
props = { speaker = "npc", npcId = "npc_tasha" }
content = "Shut the door on your way out. From the outside. And Nell — you knock in this house. You do it for him. You can do it for me."

[canvases.nodes.exit_block]
type = "location"
text = "Out, from the outside."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_hall"
time_progression_minutes = 15

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "tasha_caught_seen"
op         = "set"

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "corruption"
op         = "add"
value      = 5

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_tasha"
trait      = "relation"
op         = "add"
value      = 2
