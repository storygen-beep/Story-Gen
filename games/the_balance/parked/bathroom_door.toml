name = "It pushes in and it does not catch"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The plate goes back on and the paint line still lines up. You push the button in and pull the handle, but it opens, and you do it three more times to be sure, standing in a bathroom on your own in the middle of the afternoon."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Nobody will look at it. It is a door in a house where everybody is tired. They will push the button in the way they always have, but the room only goes on feeling shut to them, and it stopped being shut this afternoon."

[[canvases.nodes.blocks]]
