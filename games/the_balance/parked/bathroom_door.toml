# ── from toml_phases/5_scenes.toml
[[canvases]]
id   = "bath_tasha"
name = "Her half hour"
description = "Door-only walk-in on @tasha's 17:00-17:30 shower. Separate from her arc in `hub_tasha_bath`, which runs on the makeup half and is reached by knocking."

[canvases.trigger]
location      = "the_bathroom"
is_repeatable = true
hidden_from_location = true
priority      = 8
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Over the music"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Tasha has the radio up on the cistern and she is behind glass that is clear from the hip up, soaping her tits with her head back and her mouth open on a word of the song she has got wrong. Tasha in a shower is Tasha anywhere else, only wet."

[[canvases.nodes.blocks]]
type = "dialog"
props = { speaker = "npc", npcId = "npc_tasha" }
content = "— and I would do it AGAIN, I would do it agaaain — Nell, is that you? If that is you, pass me the blue one off the side. If it is one of them, get out."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 15 },
] } }
blocks = [
  { type = "paragraph", content = "You pull it shut again. She did not hear it over the radio and she would not have cared if she had, and that is somehow the part you cannot stand in the doorway with." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Shut it again."
targetType = "location"
locationId = "the_hall"
time_progression_minutes = 2

[[canvases.nodes.exit_block.choices]]
text       = "Stay where you are."
targetType = "node"
nodeId     = "bath_tasha.watched"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 15 },
  { type = "flag", subject = "player", flag_key = "tasha_bath_watched", operator = "is_false" },
] }

[[canvases.nodes.exit_block.choices]]
text       = "Let her catch you at it."
targetType = "node"
nodeId     = "bath_tasha.seen"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 30 },
  { type = "flag", subject = "player", flag_key = "tasha_bath_watched", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "tasha_bath_seen", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "watched"
name = "The whole of it"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You stand inside the door with your back to it. She washes between her legs the way anybody does, quick and ordinary and without a thought in her head about it, and you watch her do it and you know exactly what you are doing."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She turns the water off and reaches for the towel and you are out and on the landing before the glass moves."

[[canvases.nodes.blocks]]
type = "dialog"
props = { speaker = "npc", npcId = "npc_tasha" }
content = "You left that door open, by the way. Do not worry about it. Half this family would not notice if I came down the stairs in nothing."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She says it at dinner, to the table, in the middle of a story about a girl at work. Nobody looks up. She has no idea she has just told you what she thinks happened."

[canvases.nodes.exit_block]
type = "location"
text = "The landing."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_hall"
time_progression_minutes = 15

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "tasha_bath_watched"
op         = "set"

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "corruption"
op         = "add"
value      = 4

[[canvases.nodes]]
id   = "seen"
name = "She does not scream"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You stay until she looks over, and she does, and she sees you standing there watching her wash. She does not cover anything. She pushes the glass back a hand's width and stands there wet with the water still running."

[[canvases.nodes.blocks]]
type = "dialog"
props = { speaker = "npc", npcId = "npc_tasha" }
content = "Well, look at you. Come here and do my back then, if you are going to be in here anyway. No, come ON, the water is going cold and I have got to be out by half past."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "That is the whole of it. No argument, no fuss, nothing held over you. You wash her back and she talks the entire time, and being let in is somehow worse than being caught."

[canvases.nodes.exit_block]
type = "location"
text = "Dry your hands."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_hall"
time_progression_minutes = 25

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "tasha_bath_seen"
op         = "set"

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "corruption"
op         = "add"
value      = 5

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_tasha"
trait      = "relation"
op         = "add"
value      = 3

# ── from toml_phases/5_scenes.toml
# --- AND IT WORKS BOTH WAYS --------------------------------------------------
# ⚠️ substitution_only: reachable ONLY as `wash`'s dice roll, and only once
# `lock_broken` is set. This is the price of the screwdriver, and it is the same
# shape as `tasha_walks_in` deliberately — the difference is that Tasha comes
# through a door Nell forgot to lock, and @nate comes through one that cannot be.

[[canvases]]
id   = "nate_walks_in"
name = "The button that does not hold"
description = "Substitution on the shower, live only once `lock_broken` is set. @nate comes in while she is in there. Restores clean like any wash; what it costs is the thing she did to that handle herself."

[canvases.trigger]
location          = "the_bathroom"
npc               = "npc_nate"
is_repeatable     = true
max_triggers_per_day = 1
substitution_only = true
priority          = 5
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "He does not knock"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The handle goes and @nate is in with the door shut behind him before the steam has moved. He does not look over and he does not apologise. He runs the tap and cleans his hands off in it and takes his time about the drying."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "nate_bath_seen", operator = "is_true" },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "Funny how that stopped catching. Round about the same week you started coming up here at seven." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "You are behind glass. Relax. I have seen worse in a swimming pool." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "Lock it if you want me out. Oh. Right." },
  ] },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He is in here ninety seconds and the glass is clear from the hip up and he looks exactly once, on his way out, and lets you see him do it. You did that. You are the reason that handle turns."

[canvases.nodes.exit_block]
type = "location"
text = "Finish, with the door watched."

