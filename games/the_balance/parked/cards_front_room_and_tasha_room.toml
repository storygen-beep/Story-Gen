  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Do not do the job where they are nice to you. Do the job where they need you and nobody else will do it. Being needed is the whole of it." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She is not wrong and she has never once been wrong, and she says all of it lying back on the bed with one shoe on, like it cost her nothing to work out and it probably did not."

[canvases.nodes.exit_block]
