# ── from toml_phases/5_scenes.toml
# --- THE WALK-IN ON THE SOFA HOUR -------------------------------------------
# `gates.py` "the walk-in floor" went 7/7 to 7/8 the moment `sofa_hour` existed:
# a room where she does a solo thing with somebody scheduled in it has to carry a
# walk-in, or she is alone in a room that contains another person. the-surfaces.md
# R3 — ONE canvas, substitution_only = true, [group] bands on the axis the odds
# ride. Not a scene.
#
# ⚠️ substitution_only means it NEVER renders a portrait and never appears as a
# link. It replaces `sofa_hour` on entry. It also MUST declare a location:
# getCanvasById indexes only location-bound canvases (v2.py:3177), so a triggerless
# substitution target silently never fires.
#
# It restores the hour exactly as the plain sofa would — the walk-in costs her the
# room, not the rest. Same `sofa_today` flag, set on the exit's own config.

[[canvases]]
id   = "nate_sits_down"
name = "He comes in and sits down"
description = "Substitution on the sofa hour. @nate takes the other end while she is already on it. The hour restores exactly as it would have; what it costs is that it stops being her room."

[canvases.trigger]
location          = "the_front_room"
npc               = "npc_nate"
requires_npc      = "npc_nate"
is_repeatable     = true
substitution_only = true
priority          = 4
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "The other end"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "You have been on it twenty minutes when @nate comes through with a plate and stops. He looks at the sofa and he looks at you on it, and then he sits down on the other end anyway." },
  { type = "paragraph", content = "The door goes and it is @nate, and he is in the room before he has seen you. He does not go back out. He takes the far end and puts the TV on something neither of you picked." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "nate_landing", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "You are in here now as well. There is nowhere in this house you are not." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "I am not moving, so do not start." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "You can stay. I am not going to talk to you, but you can stay." },
  ] },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Neither of you gets up for the rest of it. He watches the TV and you watch the window, and the reflection has the pair of you in it at opposite ends of the same sofa, not moving."

[canvases.nodes.exit_block]
type = "location"
text = "Stay the hour anyway."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_front_room"
time_progression_minutes = 60

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "rest"
op         = "add"
value      = 15
clamp      = true

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "sofa_today"
op         = "set"

# ── from toml_phases/5_scenes.toml
# --- THE FRONT ROOM · seven to ten ------------------------------------------
# the_house_day.md:25: "Nate on the sofa with the TV. Tasha upstairs. Gil in the
# garage | the cheap hour that costs nothing but time — and the only one where
# Nate is somewhere she can sit down". And :76, under "What it hands to the steps
# after it": "the sofa hour with Nate is the only place in the house they sit down
# together, AND NOTHING USES IT". That line is what this section closes.
#
# v2_state.json board.needs.rest already declared the surface — "her bed at
# her_room; an hour on the sofa at the_front_room" — and no canvas implemented it,
# so `sleep` was the only thing in the game that restored rest.
#
# ⚠️ TWO CANVASES, ON PURPOSE, because the engine renders them in two different
# buckets. A canvas carrying an `npc` renders ONLY as a portrait and only while
# that person is scheduled in the room; a canvas without one renders as a solo
# activity link (v2.py:5367 skips anything with an npcId). One canvas cannot be
# both, so a room that needs a person AND a thing to do without them needs two.
# They share `sofa_today`: one hour on that sofa a day, whichever way she sits down.
#
# ⚠️ THIS IS NOT NATE'S ARC AND MUST NOT TOUCH IT. His climb is the door at
# nate_room — walks in, backs out, walks in again (CARRIED.md:221-223) — gated on
# `nate_seen is_false`, and the_two_doors.md:70-75 holds the first build to the
# walk-in with no choice offered. The front room is the sit-down: rest, crossing
# him, and being needled in front of the TV. His crude register is his room
# (CARRIED.md:203), never here.

[[canvases]]
id   = "sofa_hour"
name = "An hour on the sofa"
description = "Solo. The rest surface board.needs.rest declared and nothing implemented — sleep was the only fill in the game. Bands on whether @nate is on it."

[canvases.trigger]
location      = "the_front_room"
is_repeatable = true
priority      = 4
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

# ⚠️ THE RULE GOES ON THE HOST, NOT ON THE WALK-IN. gates.py:3272-3283 counts
# substitutions off the host canvas's own trigger and the engine reads them the
# same way, so a rule written on the substitute is invisible to both. `chance` is
# a FLOAT IN [0.0, 1.0] — 45 fails the build with "must be a float in [0.0, 1.0]".
# `nate_sits_down` carries requires_npc, so it cannot fire on an evening he is out.
[[canvases.trigger.substitutions]]
target_canvas_id = "nate_sits_down"
chance           = 0.45

[[canvases.nodes]]
id   = "base"
name = "The sofa"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "The TV is on for whoever is in the room and nobody has chosen it. The sofa takes your weight the way it has taken everybody's, and the window behind it has the street going past in it." },
  { type = "paragraph", content = "You sit down without meaning to stay, but the room does the rest. It is warm, the light is off, and there is nothing in here that anybody wants from you." },
  { type = "paragraph", content = "There is a plate on the arm that is not yours and a blanket over the back that is. This is the room you cross to get anywhere, and sitting down in it feels like getting away with something." },
]

# ⚠️ ONE IF/ELSEIF CHAIN — adjacent [group] blocks merge. He is on the sofa or he
# is not, and the first branch is the one that matters.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_nate", location_id = "the_front_room", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "@nate has the end with the remote and he does not move up. You take the other end. Neither of you says anything about it, but neither of you leaves either. That is the whole hour." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  # ⚠️ This said @gil was out in the garage. He is not: his rows are the kitchen
  # until nine and the master bedroom after it, and this canvas runs 19:00-22:00.
  # the_house_day.md:25 does put him in the garage, but the build did not implement
  # that row and the prose was following the sheet instead of the schedule.
  { type = "paragraph", content = "Nobody else is in here. The house does the noises it does when it is empty, and the radio is still going to itself in the kitchen where @gil is sitting." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Stay the hour."
targetType = "location"
locationId = "the_front_room"
time_progression_minutes = 60
show_when_locked = true
locked_text = "You have had your hour in here today. Any more of it and it stops being rest."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "sofa_today", operator = "is_false" },
] }
effects     = [{ targetType = "player", trait = "rest", op = "add", value = 15, clamp = true }]
flagEffects = [{ targetType = "player", flag = "sofa_today", op = "set" }]

# Unconditional — the free door on a spent day.
[[canvases.nodes.exit_block.choices]]
text       = "Get up."
targetType = "location"
locationId = "the_front_room"
time_progression_minutes = 5
