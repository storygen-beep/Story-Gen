[[canvases.nodes]]
id   = "sat"
name = "The other end"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You take the other end and he does not move his feet, so you sit round them. He does not put his phone down and he does not change what is on, and after about ten minutes he stops pretending to look at either."

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "He watches you in the window rather than turning his head, because the street is dark and the glass has the room in it. You let him. Neither of you has said anything for twenty minutes and the hour goes anyway." },
