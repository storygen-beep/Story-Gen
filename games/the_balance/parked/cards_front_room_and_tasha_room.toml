[[canvases]]
id   = "hub_nate_sofa"
name = "Nate"
description = "Portrait hub @ the_front_room, evenings. He needles her in front of the TV — the_house_day.md:48, the same move Bree makes on the quad. No day cap on the trigger; the sit-down shares `sofa_today` with the solo canvas."

[canvases.trigger]
location      = "the_front_room"
requires_npc  = "npc_nate"
npc           = "npc_nate"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "He has the remote"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "He is along the sofa with his feet up on the arm and the remote on his chest, and he does not look over when you come in. He knows exactly how long you have been stood there." },
  { type = "paragraph", content = "The TV is on something he is not watching. He has his phone in the other hand and he is doing both badly. He shifts a foot when you get near the sofa, but he is not making room." },
  { type = "paragraph", content = "He got in before you and he has taken the whole thing, the way he takes the bathroom and the table. It is not a room he wants, but it is a room he wants you to have to ask for." },
]

# ⚠️ ONE CHAIN. The week he is on the landing first, then what Bree has taken
# home — being_known.md:42, she is in his year, so the quad reaches this sofa —
# then the ordinary version.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "nate_landing", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "You are up and down that landing at all hours. I hear all of it. I am just saying I hear it." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "OR", items = [
  { type = "trait", subject = "player", trait_key = "dare_chain", operator = "gte", value = 1 },
  { type = "trait", subject = "player", trait_key = "dare_cooldown", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "Bree says you are in with them now. She thought it was funny. I said it would not last and she thought that was funny too." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "There is a chair. There has always been a chair. I do not know why we do this every night." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "Did you do the bins. He will ask me and I am not lying for you again, because I did not lie for you the first time." },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Sit at the other end of it anyway."
targetType = "node"
nodeId     = "hub_nate_sofa.sat"
show_when_locked = true
locked_text = "You have had your hour in here today, and a second one would be a point you were making."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "sofa_today", operator = "is_false" },
] }
