# ── from toml_phases/5_scenes.toml
# =============================================================================
# THE TWO ROOMS THAT HELD NOBODY
#
# LO played the 2026-09-16 build, saw Tasha's face on her bedroom door, walked in,
# and found an empty room. The door was not lying: the nav card and the threshold
# read presence from the SCHEDULE alone (setup.getNpcsPresentAtLocation,
# v2.py:5056), while the portrait grid inside the room also wants a selectable
# canvas (renderNpcPortraits, v2.py:5222). Both rooms below had zero canvases of
# any kind, so both people were permanently un-clickable in rooms their own
# timetable put them in.
#
# ⚠️ THESE ARE HUBS, AND A HUB CARRIES NO max_triggers_per_day. A cap on a trigger
# that also carries an `npc` does not spend the act — it deletes the person. The
# cap lives on the paying CHOICE, as a `_today` flag cleared in
# [engine.daily_tick], which is the only shape that works and the only one the
# engine documents (engine.md §28, §28.1). vesper carries 14 NPC surfaces and
# vesper_two 16, and not one of the 30 uses a trigger day-cap. This game used one
# on ten of eleven.
#
# ⚠️ requires_npc IS NEW TO THIS GAME and is the presence gate proper: read at
# v2.py:11877, emitted :11911, enforced in setup._npcPresentForCanvas
# (v2.py:4820-4828) whose catch returns FALSE. No NPC in the room, no hub. It is
# used INSTEAD OF a [[canvases.trigger.schedules]] block, not alongside one —
# vesper_two carries both, which duplicates the person's own timetable and can
# drift from it silently. Here the hub's hours ARE the schedule rows.
#
# ⚠️ Neither room is a crude surface and neither must become one. CARRIED.md:203
# puts Tasha's explicit register in the BATHROOM and Nate's in HIS ROOM. Tasha's
# room is clothes, advice and being noticed; the front room is the sit-down.
#
# The check that catches the next one is process/presence.py.
# =============================================================================

# --- TASHA'S ROOM · four o'clock --------------------------------------------
# the_house_day.md:22, verbatim: "Tasha home, her lights on, her door open |
# clothes, advice she didn't ask for, and somebody who notices what she's wearing".
# the_cast.md:35-38: she wants an audience, she gives clothes and advice that is
# not wrong, and she says no by laughing. She CANNOT out her — she does not know
# anything, and she is an example rather than a threat.
#
# ⚠️ FIRST RUNG ONLY. DECISIONS.md:109 names Tasha as one of eight climbs and :110
# lists three written ladders, none of them hers. process/README.md §6 item 5: the
# pull toward authoring a hub in its finished state on day one is documented
# behaviour, not carelessness. This is the meeting-height version and it is meant
# to look unfinished.
#
# ⚠️ Tasha is NOT renameable (CARRIED.md:265) — she is written as "Tasha".
# @gil and @nate are, and every line about them uses the token.

[[canvases]]
id   = "hub_tasha_room"
name = "Tasha"
description = "Portrait hub @ tasha_room. Her wardrobe, her lights, and the advice she gives whether or not it was asked for. No day cap on the trigger — the cap is `tasha_today`, on the choices."

[canvases.trigger]
location      = "tasha_room"
requires_npc  = "npc_tasha"
npc           = "npc_tasha"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

# ⚠️ HOURS ADDED WITH HER SLEEP ROWS, AND THEY CHANGE NOTHING. Her in-room rows
# were 16:00-17:00 and 18:00-23:59, and this hub had no schedule of its own, so it
# inherited exactly those. She is now also in there 00:00-10:00 on weekdays and
# 04:00-12:00 at weekends — asleep — and every line on this screen is awake
# behaviour: "she looks up before you have knocked". 16:00-23:59 covers both of
# yesterday's windows and nothing else.
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "16:00"
end_time   = "23:59"

[[canvases.nodes]]
id   = "base"
name = "Her lights are on"

# ⚠️ POOLED, because this screen is re-entered every afternoon of the game.
# process/README.md §6 item 4 — a repeatable surface written as one paragraph is a
# defect here, and block_pool has 0 uses across every v2 game.
[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Her door is open because it is always open. She is sat on the floor against the bed with the wardrobe hanging over her, going through a rail of things she has already decided about." },
  { type = "paragraph", content = "The lights are on around the mirror and the big light is off. No other room in this house has had a choice made about it. She looks up before you have knocked." },
  { type = "paragraph", content = "There is a pile on the bed that is going out with her and a pile on the chair that is not. She moves things between them while she talks, but she never stops talking." },
]

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Come in, don't hover. Hovering is a thing you do and I have been meaning to say." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Right, sit. I want to say something and you are not going to like it, and I am going to be right." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "@player. That is the third day in that top. I am not being funny, I am telling you because nobody else will." },
]

# ⚠️ ONE IF/ELSEIF CHAIN — adjacent [group] blocks MERGE (CARRIED.md:260-262), and
# that is the right behaviour here. She says the most pressing thing, not three
# things. The order is the priority: the week he is on the landing, then how late
# she has been, then nothing in particular.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "nate_landing", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "What is wrong with @nate. He has been up and down that landing all week like he is waiting for the post." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "home_after_ten", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "You were in late. I heard the door. I am not @gil, I do not care, I am just saying I heard it." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Everyone at this house acts like going out is a thing you have to earn. It is not. You just go." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "I got these off a girl at work for nothing because I asked. That is the whole thing. People hand you stuff if you ask." },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

# ⚠️ The cap is here, not on the trigger, and BOTH rungs share the flag — one hour
# of Tasha a day. engine.md §28.1: a choice runs flagEffects BEFORE advanceTime,
# so a cap set here survives a midnight roll; set on a node exit it would lock the
# rung out of the following day, silently.
[[canvases.nodes.exit_block.choices]]
text       = "Let her pick something out for you."
targetType = "node"
nodeId     = "hub_tasha_room.lent"
show_when_locked = true
locked_text = "She has done you once today. Twice in a day is a thing she would tell people about."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tasha_today", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "tasha_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Sit down and let her talk."
targetType = "node"
nodeId     = "hub_tasha_room.talk"
show_when_locked = true
locked_text = "You have had the advice. There is only so much of it in one afternoon."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tasha_today", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "tasha_today", op = "set" }]

# Unconditional, and it stays that way — the free door on a spent day.
[[canvases.nodes.exit_block.choices]]
text       = "Leave her to it."
targetType = "node"
nodeId     = "hub_tasha_room.done"

[[canvases.nodes]]
id   = "lent"
name = "Off the rail"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She has you stand where the mirror is and she holds two things against you without asking, and puts one back. What she hands over is better than anything you own and she does not make a thing of it."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_tasha" }
content = "Keep it. I have got three. And do not wear it round the house, that is a waste of it."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "She gave it away in nine seconds and it did not cost her anything to do. That is the part you keep turning over on the way back to your room."

[canvases.nodes.exit_block]
type = "location"
text = "Take it with you."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "tasha_room"
time_progression_minutes = 20

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_tasha"
trait      = "relation"
op         = "add"
value      = 2

# The flag a later release reads — she has been dressed by Tasha once, and the
# campus is where that gets noticed. Nothing reads it yet, on purpose.
[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "tasha_lent"
op         = "set"

[[canvases.nodes]]
id   = "talk"
name = "Advice you did not ask for"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "You say sorry before you ask for anything. Watch yourself do it. Then stop, and see what happens. Nothing happens." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Money is not the problem in this house. Asking is the problem in this house. You have never once asked @gil for anything." },
  # ⚠️ This said "where they need you on a Saturday" and readable.py's check C
  # flagged it: a named day inside a block_pool, which can never be gated, so it
  # can fire on a morning that has no Saturday behind it. The day was decoration —
