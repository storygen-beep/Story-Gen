[[canvases.nodes]]
id   = "paid"
name = "Counted out"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You put it down in front of him and he counts it, because he counts everything. Then it goes in his back pocket and he turns the radio up a notch."

[[canvases.nodes.blocks]]
