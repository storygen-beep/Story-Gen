conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key = "saw_them", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "cash", operator = "gte", value = 75 },
] }

[[canvases.nodes.exit_block.choices]]
text       = "Tell him you haven't got it."
targetType = "node"
