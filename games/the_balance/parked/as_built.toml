# ⚠️ THE OFFICE OWED A WALK-IN THE MOMENT @owen STOOD IN IT. Giving him a 21:00
# row made `the_back_room` a room where she does a solo thing with somebody
# scheduled there, and `gates.py` "the walk-in floor" dropped to 8/9. the-surfaces.md
# R3: one canvas, substitution_only, bands on the axis the odds ride. The rule goes
# on the HOST, and `chance` is a float in [0.0, 1.0].
[[canvases.trigger.substitutions]]
target_canvas_id = "owen_at_the_board"
chance           = 0.4

[[canvases.nodes]]
id   = "base"
name = "The board"

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "move_up", operator = "lt", value = 2 },
] } }
blocks = [
  { type = "paragraph", content = "Six names down the side and the week across the top. Yours has two marks against it, Tuesday and Sunday, in the same pen as everyone else's. The board is the same board it was last week." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "move_up", operator = "gte", value = 2 },
] } }
blocks = [
  { type = "paragraph", content = "Four marks against your name now, and one of them is a Thursday. People want Thursdays. Nobody wrote anything about it and nobody is going to." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The bottom line of the board is the five-to-ten, one name a night, and it is the only line with a single name on it."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Put your name down for a closing shift."
targetType = "node"
nodeId     = "the_schedule.base"
show_when_locked = true
locked_text = "Your name is not on that line and he has not offered."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "move_up", operator = "gte", value = 3 },
] }

[[canvases.nodes.exit_block.choices]]
text       = "Leave it."
targetType = "location"
locationId = "the_back_room"

# ── from toml_phases/5_scenes.toml
# --- TASHA, WITHOUT WARNING -------------------------------------------------
# the_house_day.md names her exactly like this. She cannot out her, she does not
# know anything, and she is an example rather than a threat — so what this costs
# is nothing, and what it does is make "shared" mean something.

[[canvases]]
id   = "tasha_walks_in"
name = "The lock you didn't turn"
description = "Substitution on the shower. Tasha comes in while she is in there. Restores clean like any wash; costs nothing but the fact of it."

[canvases.trigger]
location          = "the_bathroom"
npc               = "npc_tasha"
is_repeatable     = true
max_triggers_per_day = 1
substitution_only = true
priority          = 5
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "Without knocking"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The door goes and Tasha is at the mirror with her bag open before the steam has even moved. She does not look over and she does not apologise. You are behind a shower screen that is clear from the hip up."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_tasha" }
content = "You've got about four minutes and then I need this light. You can borrow the green top if you're going anywhere in it."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She does her eyes in the mirror and talks at your reflection the whole time. It does not occur to her once that any of this is a thing you might mind."

[canvases.nodes.exit_block]
type = "location"
text = "Four minutes, then."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_bathroom"
time_progression_minutes = 30

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "clean"
op         = "set"
value      = 100

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_tasha"
trait      = "relation"
op         = "add"
value      = 1

# ⚠️ STEP ZERO OF HER ARC, AND IT USED TO SET NOTHING. This is the one time the
# walk-in runs the other way — she comes in on Nell. the_two_doors.md:10-12: a
# door with a NAMED person behind it needs an after, or it is a campus door
# standing in a house. `tasha_seen` is that after's first gate.
[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "tasha_seen"
op         = "set"
