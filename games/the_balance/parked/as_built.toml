# REWRITTEN 2026-09-17 — SEVEN NIGHTS, AND HER MUM SPEAKS
# =============================================================================
# ⚠️ IT USED TO FIRE FOUR NIGHTS OUT OF SEVEN. Its trigger carried
# `npc_at_location npc_lynn is_present`, so on Monday, Wednesday and Friday —
# her mum's ward nights — @gil and @nate sat at that table and NOTHING HAPPENED.
# Three of seven evenings in the anchor room of the house had no scene at all.
# LO's call: dinner is the kitchen for whoever is home, and who is home is prose.
#
# ⚠️ TWO REAL DEFECTS WENT OUT WITH IT, AND NEITHER WOULD EVER HAVE FAILED A
# BUILD:
#   · Tasha's `block_pool` was UNGATED. Her kitchen row is [1, 3, 6] and this
#     canvas fired [1, 3, 5, 6], so on a SATURDAY she talked at a table she was
#     not sitting at. Widening to seven nights would have made that four nights
#     out of seven instead of one.
#   · Her mum's closing line was ungated for the same reason and would have had
#     her saying "that is lovely" from the ward.
# Both now sit inside a chain that reads the room.
#
# ⚠️ @nate WAS INSIDE @gil's IF/ELSEIF CHAIN. Four `[group]` blocks ran adjacent,
# and adjacent groups MERGE into one chain (process/README.md §6 item 4), so his
# needling was silenced on any night @gil had a chore, a door or an hour to
# mention — which is every night the game is working. He has his own chain now,
# with a wall paragraph holding the two apart.
#
# ⚠️ HER MUM HAD ZERO LINES IN THE ONE SCENE SHE IS IN. Measured before this
# pass: @gil spoke three times, Tasha three, @nate once, and the woman the whole
# scene was gated on spoke never. the_house_day.md's own hand-off list has said
# "dinner is an hour with four people in it and no lines written for any of them"
# since it was written.

[[canvases]]
id   = "dinner"
name = "Dinner"
description = "Seven, every night. Bands read who is actually at the table, whether she cooked, the chores, Friday, the hours she keeps and the door she opened. Leaving early is noticed."

[canvases.trigger]
location      = "the_kitchen"
is_repeatable = true
max_triggers_per_day = 1
priority      = 7
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "20:00"

[[canvases.nodes]]
id   = "base"
name = "Seven o'clock"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "The radio is on in the corner for the same reason it is always on. Plates go down. The chair you end up in faces the door, and nobody wants that chair and nobody has ever said why." },
  { type = "paragraph", content = "Seven o'clock. Whoever is in this house is in this room, and the ones who are not are not coming. The window has gone black and nobody has drawn the curtain." },
  { type = "paragraph", content = "The table is laid the way it is laid every night. There is a place set that stays empty some nights, because taking it away would mean somebody deciding to." },
]

# --- WHO IS ACTUALLY AT IT -----------------------------------------------------
# ⚠️ ONE CHAIN, THREE EXCLUSIVE BANDS, AND IT IS THE FIRST THING THE SCENE SAYS.
# Tasha is at the table [1, 3, 6] and her mum [1, 3, 5, 6], so the room holds five
# on Tuesday, Thursday and Sunday, four on Saturday, and three on a ward night.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_lynn",  location_id = "the_kitchen", operator = "is_present" },
  { type = "npc_at_location", npc_id = "npc_tasha", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "All of them. Your mum on one side with her cardigan still on, Tasha across from her and already talking, @gil at the end, @nate eating like the room is a queue he is in." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "Four of you. Tasha is out, and the gap she leaves is loud in a way she would be pleased about. Your mum eats with one hand and holds her phone face down with the other." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "Three of you. Your mum is on the ward, so the radio has to do all the talking. @gil eats facing the window. @nate eats facing nothing at all." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Nobody says anything for the first two minutes. It is not a bad two minutes. It is the only part of the hour that wants nothing off anybody."

# --- WHETHER SHE COOKED --------------------------------------------------------
# ⚠️ `cooked_today` IS SET BY BOTH SURFACES AND READ HERE. `cook` on a ward night
# and `cook_with_mum` on the other four both set it, so the table does not care
# which it was — only that the food came off her. It clears in the daily tick.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "cooked_today", operator = "is_true" },
] } }
blocks = [
  { type = "paragraph", content = "What is on the plates went through your hands. Nobody says so. @gil has a second helping and does not remark on that either, and in this house a second helping is the remark." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "Nobody cooked. There is bread, and there is whatever was in the fridge that did not need doing to it, and everybody works around that without naming it." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "@nate eats fast. Eating fast is how he gets to leave early without anybody being able to say he left early."

# ⚠️ ONE IF/ELSEIF CHAIN, ordered by what is most pressing. He says one thing, the
# way he always does, and he never says the whole of it.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "fridays_missed", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "There's more on that list this week. I'd get it done." },
]

# ⚠️ THE DOOR, AND HE COUNTED IT BEFORE HE MENTIONED IT. `door_noticed` goes up
# every time she shuts her door on a house with somebody in it, and it does not
# clear overnight. Three is where he says something, which is how he says
# everything — late, once, and without finishing it.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "door_noticed", operator = "gte", value = 3 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "That door of yours is shut a lot in the afternoons. There's a reason it stays open and I've never had to explain it to anybody else in this house." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "home_after_ten", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "You were coming in at half past eleven. I'm not asking where from. I'm saying I was up." },
]

# ⚠️ THE WALL. Without a non-group block here, @nate's band below joins @gil's
# chain and goes dark on every night @gil has a line — see the header.
[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Then he goes back to his plate. He has said his one thing and there is never a second one, and everybody at this table has learned that about him."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "nate_seen", operator = "is_true" },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "She's been going round the landing at all hours. Hasn't she. Opening doors." },
  { type = "paragraph", content = "He says it to the table, not to you, and then eats. Nobody asks him what he means. He knew nobody would, which is the whole reason he said it." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "@nate has not said a word. He is looking at his plate with the particular effort of somebody who has decided not to, and the deciding is visible from here." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The radio does the weather for a coast none of you has been to. Somebody turns it up. Nobody turns it back down."

# --- TASHA AND HER MUM ---------------------------------------------------------
# ⚠️ FOUR BANDS IN ONE CHAIN, AND IT IS ONE CHAIN ON PURPOSE. Two adjacent chains
# would merge anyway (README §6 item 4), so the combinations are written out
# rather than fought. It also stops a wall paragraph being needed between them.
#
# ⚠️ HER MUM'S FIRST LINES IN THE GAME. She is never touched and there is no
# ladder here. What she says is the sheet's one line made audible — the_cast.md:51,
# "wants her daughter to be fine, and she is too tired to check." Every one of
# these is a question she starts and does not finish.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_tasha", location_id = "the_kitchen", operator = "is_present" },
  { type = "npc_at_location", npc_id = "npc_lynn",  location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "So I said to her, if you're going to do that with your hair you have to commit. And she did not commit." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Right, nobody react, but I think I'm getting the shifts at the bar. Nobody react. Mum. Nobody react." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "@player, tell them what I said about the coat. Tell them. She was there, she'll tell you." },
  ] },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "That's lovely, love." },
  { type = "paragraph", content = "She says it twice, about two different things, and neither time did she hear which thing it was. Tasha does not mind. Being heard was never the point of it." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_tasha", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Nobody in this house asks me anything. I could have been abroad. I could have been married." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "@player, back me up. Tell them what she was wearing. You saw it." },
  ] },
  { type = "paragraph", content = "She performs it at the two of them and the two of them eat. She could stop, but stopping would mean admitting she had noticed, so she keeps going." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Eat something proper. I'm not asking, I'm saying it out loud so I've said it." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Are you sleeping? Don't answer if it's no. I haven't got it in me tonight." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "I was going to ask you something. It's gone. It'll come back at four in the morning and you'll be asleep." },
  ] },
  { type = "paragraph", content = "She asks it the way you ask a thing you have already decided not to hear the answer to. Then she puts her fork down and holds the edge of the table for a second." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "Nobody fills it. Three people eat in a room built for five, and the two empty chairs are further away than the ward is." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Then it is over. Plates go in the sink in the order they always go in, and the radio keeps talking to a room that is emptying out from the far end."

