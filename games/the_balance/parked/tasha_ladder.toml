[[canvases.nodes]]
id   = "not"
name = "Not tonight"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She says fine, in the tone that means fine, and asks you to pass the bag on your way past. It is not held against you. Nothing with her is ever held against you, and that turns out to be the problem."

[canvases.nodes.exit_block]
type = "location"
text = "Out."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_bathroom"
time_progression_minutes = 5

# ── from toml_phases/5_scenes.toml
# --- THE WALK-IN THE OFFICE OWED --------------------------------------------
# Substitution on reading the board. He is in here from nine now, so the room she
# used to have to herself is a room he is standing in. the_move_up.md:62-66 — the
# schedule IS how he talks, and this is him watching her read it.
#
# ⚠️ No `requires_npc` is needed: the host's own hours are all day, and the
# substitution path checks the target's presence itself (v2.py:5606-5623). It is
# declared anyway so the rule cannot fire on an afternoon he is on the floor.

[[canvases]]
id   = "owen_at_the_board"
name = "He is already in here"
description = "Substitution on reading the schedule. @owen is at the board when she comes in for it. Reads move_up, costs nothing, and changes only where she is standing."

[canvases.trigger]
location          = "the_back_room"
npc               = "npc_owen"
requires_npc      = "npc_owen"
is_repeatable     = true
substitution_only = true
priority          = 4
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "Next week"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "He is already at the board with the pen when you come in, and he does not move out of the way. You read next week over his shoulder because there is nowhere else to read it from." },
  { type = "paragraph", content = "The office light is off and the one over the desk is on. He has the pen in his teeth and both hands on the sheet, and he says your name without turning round." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "move_up", operator = "gte", value = 2 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "Four this week. You will notice which four. I did that on purpose and I am not going to say anything else about it." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "Two. I know exactly what you are looking at, and it goes up when it goes up." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He writes a name in the Thursday box and it is not yours. He does it while you are stood there reading it, and he does not hurry, and then he caps the pen."

[canvases.nodes.exit_block]
type = "location"
text = "Out the front."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_back_room"
time_progression_minutes = 10
