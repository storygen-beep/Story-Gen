[[canvases.nodes.exit_block.choices]]
text       = "Stay on the floor a minute."
targetType = "node"
nodeId     = "loop_tasha_bath.after"

[[canvases.nodes]]
id   = "after"
name = "Seven o'clock"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She is back at the mirror in ninety seconds doing the eye she never finished, talking about a bar on the strip and who is going to be in it. You are still sat on the mat with your back against the bath."

[[canvases.nodes.blocks]]
type    = "thought_bubble"
props   = { speaker = "player" }
content = "It costs her nothing. That is not a complaint and it is not a reason to stop, and both of those have been true for about three weeks now."

[canvases.nodes.exit_block]
type = "location"
text = "Get up before she goes out."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
