# --- THE GARAGE, AND SOMEBODY IS FINALLY IN IT -------------------------------
# It has been a declared room with no people and no canvases since the first
# build. These two rows are the first thing that has ever been in it.

[[canvases]]
id   = "garage_nate"
name = "Nate"
description = "Portrait hub @ the_garage, 13:00-15:00. He does his dad's work because saying no costs more than doing it, which is the same arithmetic she is on with the $150. Shares `nate_today`."

[canvases.trigger]
location      = "the_garage"
requires_npc  = "npc_nate"
npc           = "npc_nate"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "13:00"
end_time   = "15:00"

[[canvases.nodes]]
id   = "base"
name = "His dad's work"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "The up-and-over is halfway and @nate is under the strip light with the van's back doors open, putting things back on the wall in the order they are drawn on it. He has been at it long enough to have stopped being annoyed about it." },
  { type = "paragraph", content = "He is on the floor with a box between his knees, counting fittings into it off a list in his dad's handwriting. The radio is on out here too. Nobody in this family can work in a quiet room." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Give him a hand with it."
targetType = "node"
nodeId     = "garage_nate.helped"
show_when_locked = true
locked_text = "You have had one go at being in a room with him today. That is the number this house runs at."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "nate_today", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "nate_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Leave him to it."
targetType = "location"
locationId = "the_garage"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "helped"
name = "The other end of it"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You take the other end of whatever he is lifting and for about forty minutes the two of you work without a word. It is the most straightforward you have ever been with each other. He does not say thanks, but he does not tell you to go either."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "fridays_missed", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "He said your name on Friday and then he did not finish the sentence. That is worse than him finishing it. Ask me how I know." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "He has never once paid me for this. You get five dollars for the bins. I get told I live here." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_nate" }, content = "He was self-employed before he met your mother and he will be doing this when he is seventy. There is no version of him that stops." },
  ] },
]

[canvases.nodes.exit_block]
