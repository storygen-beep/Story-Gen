[[canvases]]
id   = "garage_gil"
name = "Gil"
description = "Portrait hub @ the_garage, 17:00-18:00. Back off the job, unloading. The first room in this game that is HIS, and she is the one standing in it. Shares `gil_today` with the kitchen and sofa hubs."

[canvases.trigger]
location      = "the_garage"
requires_npc  = "npc_gil"
npc           = "npc_gil"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "17:00"
end_time   = "18:00"

[[canvases.nodes]]
id   = "base"
name = "Still in his work clothes"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "@gil has the van open and he is carrying things in off it one at a time, in the order he wants them on the wall. His hands are black to the wrist and he has not been inside the house yet. This is the hour nobody in here has ever seen." },
  { type = "paragraph", content = "He is sat sideways in the van door writing on a pad against his knee, still in the boots. There is a flask on the bumper that has been empty since about eleven. He looks up when your shadow goes across him and then back down." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Stand out here with him a while."
targetType = "node"
nodeId     = "garage_gil.stood"
show_when_locked = true
locked_text = "You have sat with him once today. Twice would be a thing, and he would notice it was a thing."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "gil_today", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "gil_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Go back in."
targetType = "location"
locationId = "the_garage"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "stood"
name = "The wall with the tools on it"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You lean on the bench while he finishes. He does not stop working to talk to you and he does not mind you there, and it takes about ten minutes to work out those are two different things in him."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "fridays_missed", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "I have had a bad payer this month as well. It happens. The difference is I do not stop paying the people underneath me while I wait." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "Everything on that wall is where it is so I can find it in the dark. That is not tidiness. That is a day not costing me an hour." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "I put your brother on this because he is here. I would put you on it if you were ever in at four." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "Twenty-two years I have not had anybody to send an invoice to about it. You do not get a sick day. You get a worse week." },
  ] },
]

[canvases.nodes.exit_block]
type = "location"
text = "Leave him to shut up."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_garage"
time_progression_minutes = 25

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_gil"
trait      = "relation"
op         = "add"
value      = 2

