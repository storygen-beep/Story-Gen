# --- 1 · she is still talking to you like September -------------------------

[[phone.conversations]]
id     = "cara_hello"
app    = "messages"
npc    = "npc_cara"
notify = "Cara texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "right so I've worked out the bus. you have to get the one BEFORE the one that says it goes there. I have lost forty minutes learning this"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "are you about at lunch or are you doing the thing where you vanish"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "I'm about. Union, usual table.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = 2 }] },
  { text = "Can't today. Sorry.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = -1 }] },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
round = 2
content = "ok well I'll be there anyway so if you change your mind I'm the one with the coat on indoors"

# --- 2 · she is pleased for you and it costs her something -------------------

[[phone.conversations]]
id     = "cara_job"
app    = "messages"
npc    = "npc_cara"
notify = "Cara texted you."
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "has_job", operator = "is_true" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "YOU GOT IT. ok I'm made up for you, genuinely"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "when are you actually free now though. like actually. don't do the thing where you say soon"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "Sunday after the shift. I'll come to you.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = 3 }] },
  { text = "Soon.", effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = -2 }] },
]
