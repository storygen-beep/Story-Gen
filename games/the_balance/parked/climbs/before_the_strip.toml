# BEFORE THE STRIP — 2026-09-19. Every base scene and phone message that had a climb cut
# out of it, whole, exactly as it stood at ccf4541 before the cut. The build carries them
# with the climb parts removed; these are the full versions, for putting any part back.
# NOT merged. See parked/README.md, "The climbs".

# ── from toml_phases/2_one_shots.toml

# =============================================================================
# The Balance — 2 · the one-shots
#
# SLICE 1. Two canvases: the opening, and asking for the job.
#
# ⚠️ A CHOICE cannot be a location exit — an exit_block is EITHER `choices` OR
# `location` (validator: "choices[0].targetType invalid"). So the three answers in
# the kitchen route to three nodes, and THOSE nodes carry the way out of the house.
#
# ⚠️ Every line about Gil reads @gil. He is player-renameable (v2.py:9294).
# =============================================================================

# --- A1 · THE OPENING --------------------------------------------------------
# sheets/OPENING.md. Three screens, and the first two name nobody at all.

[[canvases]]
id   = "canvas_opening"
name = "Opening"
# ⚠️ NO ANGLE BRACKETS. The skill's template writes placeholders as <Opening>,
# and this one was copied and never filled in. SugarCube reads <Opening> as an
# HTML tag, hunts for a closing </Opening> and prints an error on every screen of
# this canvas — but ONLY in a --debug build, which is where the canvas name gets
# rendered. It sat here through eight slices because no ordinary build shows it.
description = "Boot. Her room, the landing, the kitchen at seven thirty. Three facts, then @gil's one line about the cafe, then the first free choice — money against time. Sets opening_done."

[canvases.trigger]
location      = "her_room"
is_repeatable = false
priority      = 12
is_active     = true

[[canvases.nodes]]
id   = "wake"
name = "Monday"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You turned eighteen last month. College starts today, across town, in a room you have never stood in."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your @gil.rel paid the semester up front, not you. A hundred and fifty goes back to him on Friday, and on every Friday after that."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your mum doesn't know he paid."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Get up."
targetType = "node"
nodeId     = "canvas_opening.landing"
time_progression_minutes = 3

[[canvases.nodes]]
id   = "landing"
name = "The landing"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The shower is running, so the bathroom is gone until whoever is in there comes out. Of the two doors on the landing, one is shut and one stands open. Your mum's bag is gone from the hook, so she came off the ward and went straight back out."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Downstairs somebody has the radio on low. You could not say which of them it is."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Go down."
targetType = "node"
nodeId     = "canvas_opening.kitchen"
time_progression_minutes = 27
# 07:00 + 3 + 27 = 07:30 in the kitchen, which is the hour OPENING.md names.

[[canvases.nodes]]
id   = "kitchen"
name = "Half seven"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "@gil is at the table with the paper folded to the part he wants. He doesn't look up when you come in."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_gil" }
content = "Job going at the cafe on the strip. Card in the window."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He says it to the paper and not to you. He doesn't mention Friday, because he has already said it once."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Do the bins first. He pays for one a day."
targetType = "node"
nodeId     = "canvas_opening.chore"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "chore_paid_today", operator = "is_false" },
] }

[[canvases.nodes.exit_block.choices]]
text       = "Sit down and eat."
targetType = "node"
nodeId     = "canvas_opening.eat"

[[canvases.nodes.exit_block.choices]]
text       = "Go now. The bus is in twenty minutes."
targetType = "node"
nodeId     = "canvas_opening.leave"

[[canvases.nodes]]
id   = "chore"
name = "The bins"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The bins are round the side and the truck comes at eight. So it is you dragging them to the front, in your college clothes."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Ten minutes, and your hands smell like the bin. He puts five dollars on the table for it without looking up."

[canvases.nodes.exit_block]
type = "location"
text = "Take it and go."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_street"
time_progression_minutes = 30

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "opening_done"
op         = "set"

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "chore_paid_today"
op         = "set"

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "cash"
op         = "add"
value      = 5

[[canvases.nodes]]
id   = "eat"
name = "Breakfast"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You sit down and he pushes the box across without a word. You eat half a bowl while the radio does the weather."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He doesn't ask about college and you don't tell him. That is the nearest thing to a conversation this house does before eight."

[canvases.nodes.exit_block]
type = "location"
text = "Get your bag."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_street"
time_progression_minutes = 20

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "opening_done"
op         = "set"

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_gil"
trait      = "relation"
op         = "add"
value      = 1
# ⚠️ effects say `npcId`; a CONDITION on the same character says `npc_id`.
#
# This was `rest +5` and it pushed rest to 105 — nothing clamps a trait to its
# starting ceiling, caught on a live walk. Eating is not rest anyway. What sitting
# down actually buys is the only thing it can: the_cast.md says @gil never opens a
# step and every one of them is hers to open, and this is the smallest one there is.

[[canvases.nodes]]
id   = "leave"
name = "Out"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You take your bag and pull the door until it catches, because it doesn't unless you do."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Four doors down to the stop, and you get there early for nothing in particular. Early is still better than late."

[canvases.nodes.exit_block]
type = "location"
text = "The street."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_street"
time_progression_minutes = 3

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "opening_done"
op         = "set"

# --- A2 · ASKING FOR THE JOB -------------------------------------------------
# sheets/systems/the_move_up.md. Step ZERO of the cafe arc — not the cafe.
#
# ⚠️ REPEATABLE on purpose, and rendered as Owen's own link at the location
# (npc inside [canvases.trigger]). She is allowed to walk out without asking —
# the_move_up.md: "She can put it off." A non-repeatable one-shot would burn on
# the walk-out and she could never come back, which stalls the slice on its only
# real choice. The gate is has_job, so it stops offering itself the moment she
# has the job.

[[canvases]]
id   = "canvas_ask_owen"
name = "Ask about the job"
description = "Her first meeting with Owen. He never turns her down — the no is in the hours. Taking it sets has_job and move_up = 1: two shifts, the worst two, $110 against a $150 Friday."

[canvases.trigger]
location      = "the_cafe"
npc           = "npc_owen"
is_repeatable = true
priority      = 8
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "has_job", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "The counter"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He is behind the counter with a cloth in his hand and he watches you the whole way across the floor."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_owen" }
content = "You're not a customer."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He says it flat. Not rude. Exact."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Ask about the card in the window."
targetType = "node"
nodeId     = "canvas_ask_owen.hired"

[[canvases.nodes.exit_block.choices]]
text       = "Buy a coffee and go."
targetType = "node"
nodeId     = "canvas_ask_owen.walked_out"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "cash", operator = "gte", value = 2 },
] }
# The one thing money opens in this slice. Walking out is only an option if she can
# afford the coffee she is hiding behind — broke, the only way out is to ask.

[[canvases.nodes]]
id   = "hired"
name = "The hours"

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_owen" }
content = "Nine an hour, tips are yours, five hours a shift. Two to start. Tuesday and Sunday, the two nobody wants."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He says it like a man who has said it before and has never once been argued out of the number."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Take it."
targetType = "node"
nodeId     = "canvas_ask_owen.the_number"
time_progression_minutes = 10

[[canvases.nodes]]
id   = "the_number"
name = "Two lines at the bottom"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He writes your name at the bottom of the schedule in the office, under four people who were already on it."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_owen" }
content = "Tuesday half past six, Sunday seven. Don't be late on the first one."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Two shifts is a hundred and ten on a good week, with tips. Friday is a hundred and fifty."

[canvases.nodes.exit_block]
type = "location"
text = "Back out to the floor."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_cafe"
time_progression_minutes = 5

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "has_job"
op         = "set"

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "move_up"
op         = "set"
value      = 1

[[canvases.nodes]]
id   = "walked_out"
name = "The card is still there"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You buy a coffee you don't want and drink half of it by the window."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The card is still in the glass when you go. It will still be there tomorrow. Probably."

[canvases.nodes.exit_block]
type = "location"
text = "Out."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_cafe"
time_progression_minutes = 15

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "cash"
op         = "add"
value      = -2
# ⚠️ op = "subtract" IS NOT AN ENGINE OP. It parses, validates, builds green
# and does nothing at all (engine.md §21b). A negative `add` is the only way down.

# ── from toml_phases/3_activities.toml

# =============================================================================
# The Balance — 3 · the repeatable half
#
# SLICE 2. The shift. The first thing in this game she does more than once.
#
# ⚠️ L3 — A REPEATABLE SCREEN CARRIES NO HISTORY. Every sentence here is
# something happening now. No "used to", no "since", no "three weeks of". What
# reads as depth on visit one is furniture by visit nineteen, and our games run
# to 12.1% history against a field maximum of 5.41%.
#
# ⚠️ TWO canvases, not one. A condition cannot read the weekday, so a single
# canvas covering both rosters would let her work four days while she is still on
# the floor — and two shifts against a $150 Friday IS the squeeze the first build
# runs on. The roster has to bite.
# =============================================================================

# --- THE FLOOR · two shifts, the worst two -----------------------------------

[[canvases]]
id   = "shift_floor"
name = "Work the shift"
description = "The ordinary shift at the floor. Tuesday and Sunday, twelve to five, $55 with tips. Body varies on every entry. Sometimes a customer asks instead — that is the substitution rules below."

[canvases.trigger]
location      = "the_cafe"
is_repeatable = true
max_triggers_per_day = 1
priority      = 5
is_active     = true
costs         = [{ trait = "clean", value = 20 }]
show_when_blocked = true
cooldown_message = "You are not on the schedule today."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "has_job", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "move_up", operator = "lt", value = 2 },
] }

# Tuesday and Sunday. 0 = Monday, so 1 and 6 — the two nobody wants.
[[canvases.trigger.schedules]]
weekdays   = [1, 6]
start_time = "12:00"
end_time   = "17:00"

# ⚠️ ONLY SOME CUSTOMERS ASK, ONLY WHEN THE ROOM ALLOWS IT — the cafe sheet's own
# two brakes, as a dice roll inside a routine. A matching rule plays its target IN
# PLACE of this canvas, so each target carries the shift's own pay and count: it
# was still a shift, with something in it. Further rung first, so it wins when both
# are open.
[[canvases.trigger.substitutions]]
target_canvas_id = "cust_showing"
chance = 0.3
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "clean", operator = "gte", value = 40 },
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 20 },
  { type = "trait", subject = "player", trait_key = "exposure", operator = "gte", value = 8 },
  { type = "flag", subject = "player", flag_key = "cust_hand_done", operator = "is_true" },
] }

[[canvases.trigger.substitutions]]
target_canvas_id = "cust_hand"
chance = 0.35
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "clean", operator = "gte", value = 40 },
] }

[[canvases.nodes]]
id   = "base"
name = "The shift"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Five hours of carrying plates to people who are mid-sentence. The window table turns over four times. Your feet go at about hour three and the last two are hour three continuing." },
  { type = "paragraph", content = "The machine wants its tray emptied twice, but nobody else empties it. Owen watches you do it the first time and not the second. That is how he says a thing is yours now." },
  { type = "paragraph", content = "A slow one. You wipe tables that are already clean, because standing still where he can see you is worse work than working." },
  { type = "paragraph", content = "The lunch lot arrive together and leave together and the floor between the counter and the window ends up with all of it on. You get most of it up before he is out of the office." },
  { type = "paragraph", content = "Two hours of nobody, then a coach party, then nobody again. The tips are a handful of coins and one note left flat under a saucer, which is the only part worth counting." },
]

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "Table six has been waiting. I'm not telling you again, I'm telling you now." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "That one's done properly. Do the next one the same." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "You're quick. Quick isn't tidy. I want both and I'm not choosing." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_owen" }, content = "Go home. You're on again Sunday." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Clock off."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_cafe"
time_progression_minutes = 300

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "cash"
op         = "add"
value      = 55

[[canvases.nodes.exit_block.config.effects]]
targetType = "player"
trait      = "shifts_worked"
op         = "add"
value      = 1

# --- GOING LIVE · the second way to make Friday -----------------------------
# the_phone.md: she needs to be clean, to be alone, and about an hour. One place
# at the first build — her own room with the door shut, which is the same door
# @gil's rule says stays open when anyone is on the landing.
#
# ⚠️ ALONE USED TO BE A SCHEDULE HERE AND IS NOW A DOOR. Until 2026-09-17 this
# canvas carried two schedule rows — weekdays 12:00-16:00 and 22:00-23:59 — chosen
# because the house happened to be empty in those hours, and the comment that stood
# here admitted it outright: "there is no engine door or privacy state." There is
# one now. `door_locked` is set by `her_door` in her own room, and it is the whole
# gate. The clock has nothing to do with it any more.
#
# ⚠️ WHY THE SCHEDULES HAD TO GO RATHER THAN STAY AS A FLOOR. Schedules are not
# part of `conditions` — a canvas with schedules is dead outside them, full stop,
# so "empty house OR shut door" cannot be expressed with one of each. Keeping them
# would have meant the lock did nothing in the other twenty hours.
#
# ⚠️ AND IT HAD TO BECOME A DOOR THE DAY @nate CAME HOME AT THREE. His new
# 15:00-18:00 row sits inside the old weekday window. The build would not have said
# a word: she would simply have been going live with him down the landing, against
# hours that were picked on the promise nobody was in.
#
# ⚠️ ADDING `conditions` HERE TURNS ON A STRING THAT HAS NEVER RENDERED. The phone
# launcher shows an option's `locked_text` only when its canvas HAS trigger
# conditions (v2.py:3152-3153); with none, it fell through to `cooldown_message`
# instead. 8_phone.toml's "Not tonight." was unreachable for the whole of the first
# build and is live from this pass, so it was rewritten to name the door.

[[canvases]]
id   = "stream"
name = "Go live"
description = "A session in her room, door shut. Pays a rolled amount inside a band that followers lift. Exposure moves by 3 on a first time and 1 on a repeat, which is what stops her grinding it."

[canvases.trigger]
location      = "her_room"
is_repeatable = true
priority      = 5
is_active     = true
costs         = [{ trait = "clean", value = 15 }]
show_when_blocked = true
cooldown_message = "Not with that door open."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "door_locked", operator = "is_true" },
] }
# ⚠️ THE PHONE IS THE ONLY DOOR INTO THIS NOW. the_phone.md always said the app
# was on the phone; the first build put the link on her bedroom wall instead.
# The location stays because it is where the scene RETURNS her — a canvas has
# exactly one home and this is it. `hidden_from_location` takes it off her room's
# activity list without taking away the room.
hidden_from_location = true

[[canvases.nodes]]
id   = "base"
name = "Door shut"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Door shut, phone up against the books at the angle that cuts you off at the mouth. The light from the window is doing most of the work. Forty-one people, then sixty, then it stops climbing and settles." },
  { type = "paragraph", content = "You push the books into a stack and the phone into the stack and check the frame twice. Your chin is out of it. The chat is three people talking to each other. One of them says hello to you by name." },
  { type = "paragraph", content = "It takes four minutes to get the angle right and about nine seconds for the first of them to arrive. Somebody types that they were waiting. You believe them, but it does not make you feel anything." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "nate_landing", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "paragraph", content = "@nate is in and out of his room all week at hours that are not hours, and your door does not stay shut while somebody is on that landing. Not tonight. Not while he is like this." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "clean", operator = "lt", value = 40 },
] } }
blocks = [
  { type = "paragraph", content = "You look at the angle you would be filming at and you know exactly what it would pick up. Not like this. You would want the shower first, but the shower is not free at this hour either." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "streamed_today", operator = "is_true" },
] } }
blocks = [
  { type = "paragraph", content = "You already did one tonight. Going back on an hour later is a different thing from doing it once, and you are not sure yet what that thing is." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Set the phone up."
targetType = "node"
nodeId     = "stream.live"
show_when_locked = true
locked_text = "Not tonight."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "clean", operator = "gte", value = 40 },
  { type = "trait", subject = "player", trait_key = "nate_landing", operator = "lte", value = 0 },
  { type = "flag", subject = "player", flag_key = "streamed_today", operator = "is_false" },
] }

[[canvases.nodes.exit_block.choices]]
text       = "Leave it tonight."
targetType = "location"
locationId = "her_room"
time_progression_minutes = 2

[[canvases.nodes]]
id   = "live"
name = "Forty-one people"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Somebody asks. That is how it always starts — not pushed, asked, and the answer is yours."

# ⚠️ speaker = "unknown" renders as "Stranger" with a silhouette (v2.py:15517).
# That is exactly what the_phone.md wants: nobody watching has a name, and nobody
# she knows is on the other side of it. The chat can speak without being cast.
[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "dialog", props = { speaker = "unknown" }, content = "take the top off. you know why we're here" },
  { type = "dialog", props = { speaker = "unknown" }, content = "you were gone four days. i checked every night" },
  { type = "dialog", props = { speaker = "unknown" }, content = "turn the lamp round, we can't see anything" },
  { type = "dialog", props = { speaker = "unknown" }, content = "do the thing from last time" },
  { type = "dialog", props = { speaker = "unknown" }, content = "how much to see your face" },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Take your top off."
targetType = "node"
nodeId     = "stream.rung_top"

[[canvases.nodes.exit_block.choices]]
text       = "Take everything off."
targetType = "node"
nodeId     = "stream.rung_naked"
show_when_locked = true
locked_text = "Nobody has asked for that yet."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "stream_top_done", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 15 },
] }

[[canvases.nodes.exit_block.choices]]
text       = "Do what they're asking for."
