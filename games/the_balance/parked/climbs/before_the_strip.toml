# --- CAUGHT LISTENING -------------------------------------------------------
# The quad and the union both had her standing there alone with people scheduled
# in the room and nobody ever coming through. These are the two who would.

[[canvases]]
id   = "cara_catches"
name = "She sits down next to you"
description = "Substitution on listening at the union. @cara catches her at it and does not make anything of it, which is worse."

[canvases.trigger]
location          = "the_union"
npc               = "npc_cara"
is_repeatable     = true
max_triggers_per_day = 1
substitution_only = true
priority          = 4
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "Caught"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You are turned a little in your chair towards the next table and you have been for a while, and @cara sits down opposite and follows exactly where you were looking."

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cara" }, content = "They're not talking about anything. They never are. You know that, right?" },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cara" }, content = "You've gone funny about who's saying what. You didn't used to care in September." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cara" }, content = "If somebody's said something you can just tell me. I'm not going to do anything about it, I'd just know." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She does not ask again and she does not look over there once for the rest of the hour, and she moves her tray so you have somewhere to put your elbows."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Tell her nothing and stay anyway."
targetType = "location"
locationId = "the_union"
time_progression_minutes = 20
effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = 1 }]

[[canvases.nodes.exit_block.choices]]
text       = "Say you've got somewhere to be."
targetType = "location"
locationId = "the_quad"
time_progression_minutes = 5
effects = [{ targetType = "npc", npcId = "npc_cara", trait = "relation", op = "add", value = -2 }]

[[canvases]]
id   = "bree_catches"
name = "Bree notices you listening"
description = "Substitution on listening at the quad. Being caught at it is its own small public thing, which is the whole shape of that page."

[canvases.trigger]
location          = "the_quad"
npc               = "npc_bree"
is_repeatable     = true
max_triggers_per_day = 1
substitution_only = true
priority          = 4
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "Caught at it"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You are standing near enough to hear and not near enough to be part of it. It is a position with a look to it, and Bree clocks you in it."

[[canvases.nodes.blocks]]
type    = "dialog"
props   = { speaker = "npc", npcId = "npc_bree" }
content = "You can come over, you know. You don't have to do it from there like a bin man."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Two people laugh. Paige says her name like a mild telling off and does not mean any of it. Jules does not look up from her phone, and the not looking up is the part that lands."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Keep walking."
targetType = "location"
locationId = "the_quad"
time_progression_minutes = 5

[[canvases.nodes.exit_block.choices]]
text       = "Go over."
targetType = "location"
locationId = "the_quad"
time_progression_minutes = 10
show_when_locked = true
locked_text = "Not on an invitation like that one."
conditions = { version = "1.0", logic = "OR", items = [
  { type = "trait", subject = "player", trait_key = "crowd_standing", operator = "gte", value = 10 },
  { type = "trait", subject = "player", trait_key = "reputation", operator = "gte", value = 20 },
] }
effects = [{ targetType = "player", trait = "crowd_standing", op = "add", value = 2 }]

