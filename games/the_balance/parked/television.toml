# PARKED 2026-09-19 — 3 scene(s) from 0e829a1 "the television, and what she can leave on in front of who".
# Copied verbatim from ff91336, design comments included. NOT merged: parked/ is outside
# toml_phases/. To bring one back, its block's round in sheets/BASE.md decides it first.

# ── from toml_phases/5_scenes.toml
# =============================================================================
# THE TWO PARENTS ON THAT SOFA — the television OFF
#
# ⚠️ BOTH ARE GATED ON `tv_on is_false`, AND THAT IS THE DESIGN, NOT A DETAIL.
# With the set on the room offers the television; with it off the room offers the
# person. One room, two things, and the off button is how she moves between them.
# LO's objection is what produced this — "sitting on sofa isnt watching tv."
#
# ⚠️ NO max_triggers_per_day ON EITHER. 0_systems_spec.toml records why: a day cap
# on a canvas carrying an `npc` does not spend the act, it DELETES THE PERSON —
# her mum is in that room for one hour and one click would remove her portrait for
# the rest of it. The caps are flags on the choices.
#
# ⚠️ EACH ONE'S HOURS ARE ITS PARENT'S HOURS. @gil is on that sofa 20:30-21:00 and
# her mum 20:00-21:00, and a hub that outran those would render a card for
# somebody who is not in the room — the bug `friday_payment`'s comment has been
# guarding against since it was written.

[[canvases]]
id   = "hub_gil_sofa"
# ⚠️ NOT "@gil". A canvas `name` is the link label on the room screen and tokens
# are NOT resolved there — `tokens.py` catches it as a leak and the player reads
# the @ sign. This matches `hub_gil_kitchen`, which is the same card in the other
# room.
name = "Gil"
description = "Portrait hub @ the_front_room, 20:30-21:00. The half hour he comes through for the end of the news. Shares `gil_today` with the kitchen hub — one sit-down with him a day, wherever it happens."

[canvases.trigger]
location      = "the_front_room"
requires_npc  = "npc_gil"
npc           = "npc_gil"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "tv_on", operator = "is_false" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "20:30"
end_time   = "21:00"

[[canvases.nodes]]
id   = "base"
name = "The chair by the window"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "@gil is in the chair by the window with the screen dark and the street going past behind him. He has the look of a man who sat down for ten minutes an hour ago. He does not ask what you want." },
  { type = "paragraph", content = "The set is off and he has not put it back on. He is sat forward with his forearms on his knees, working at something in his head, and the room is quiet enough that you can hear the fridge from here." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Sit down with him for a bit."
targetType = "node"
nodeId     = "hub_gil_sofa.sat"
show_when_locked = true
locked_text = "You have sat with him once today. Twice would be a thing, and he would notice it was a thing."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "gil_today", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "gil_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Leave him to it."
targetType = "location"
locationId = "the_front_room"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "sat"
name = "The other end"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You take the end of the sofa. He does not move and he does not look over, and after a while the not-talking stops being awkward and turns into the two of you being in a room. It is the closest this house gets."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "fridays_missed", operator = "gte", value = 1 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "There is a list on that fridge. I am not going to say it twice and I am not going to say it again after tonight." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "You are in late a lot. I am not asking. I am telling you I have noticed." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "Your mother is on nights again Wednesday. Somebody should be in this house at a normal hour." },
  ] },
]

[canvases.nodes.exit_block]
type = "location"
text = "Stay until he goes up."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_front_room"
time_progression_minutes = 30

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_gil"
trait      = "relation"
op         = "add"
value      = 2

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "sofa_today"
op         = "set"

# ── from toml_phases/5_scenes.toml
# -----------------------------------------------------------------------------
# ⚠️ HER MUM'S FIRST CLICKABLE ROW IN THE WHOLE GAME. Before this she was declared,
# given a portrait and two schedule rows, and had ZERO surfaces — a condition on
# `master_bedroom` and one substitution_only canvas, and nothing else. LO asked
# where she was; this is the answer.
#
# ⚠️ SHE IS STILL NEVER TOUCHED. DECISIONS.md carries the crossing LO made on the
# television and what it does not cover. Nothing here is a climb toward her: the
# hour asks for nothing, gives rest, and costs nothing, which is what makes her
# the only person in this house who does not want something. That IS the content.

