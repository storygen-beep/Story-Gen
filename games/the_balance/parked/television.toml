[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "sofa_today", operator = "is_true" },
] } }
blocks = [
  { type = "paragraph", content = "You have had your hour in this room today. You can stand here and change what is on it, but sitting down again would be a different kind of evening." },
]

[canvases.nodes.exit_block]
type = "choices"

# ⚠️ SEVEN DECISIONS AND ONE EXIT, AND THAT CEILING IS THE GATE'S, NOT TASTE.
# The first draft of this canvas authored FIFTEEN — a "Watch it." per ladder rung
# per parent — and `gates.py` "a place is not a catalogue" failed it on the spot:
# the field, measured by playing five games, carries 1-6 things to do on a screen
# with a median of 3. They were mutually exclusive so only one ever RENDERED, and
# the gate counts what is authored, which is the right thing to count: fifteen
# rows is fifteen chances for two conditions to overlap and print the same button
# twice with different effects.
#
# What collapsed them was separating the two acts that were sharing a button.
# WATCHING is one row and always the same: the hour, the rest. LEAVING IT ON in
# front of a parent is a different act, and it is the only one that climbs.

# --- ON ----------------------------------------------------------------------

[[canvases.nodes.exit_block.choices]]
text       = "Put it on."
targetType = "node"
nodeId     = "watch_tv.base"
time_progression_minutes = 5
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tv_on", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "tv_on", op = "set" }]

# --- THE CHANNEL BUTTON ------------------------------------------------------
# ⚠️ TWO ROWS, ONE BUTTON. The engine has `add` and `set` and no modulo, so the
# wrap from five back to one is its own choice on an exclusive condition. Same
# text on both, so the player never sees the seam.
#
# ⚠️ NO HOUR GATE ON CHANNEL FIVE. An earlier draft only put it on the dial after
# eight, which was my invention and not LO's, and it cost two more rows to the
# same button. It is also wrong: the hours she is most likely to reach for it are
# the ones the house is empty, which is 08:00 to 16:00 every day of the week.

[[canvases.nodes.exit_block.choices]]
text       = "Change the channel."
targetType = "node"
nodeId     = "watch_tv.base"
time_progression_minutes = 5
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key  = "tv_on", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "lt", value = 5 },
] }
effects = [{ targetType = "player", trait = "tv_channel", op = "add", value = 1 }]

[[canvases.nodes.exit_block.choices]]
text       = "Change the channel."
targetType = "node"
nodeId     = "watch_tv.base"
time_progression_minutes = 5
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key  = "tv_on", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "gte", value = 5 },
] }
effects = [{ targetType = "player", trait = "tv_channel", op = "set", value = 1 }]

# --- THE HOUR ----------------------------------------------------------------
# One row, whatever is on and whoever is in here. Sitting through it is sitting
# through it; the prose above already says which of those two things it was.
#
# ⚠️ NO show_when_locked. The spent hour is narrated in the block above instead,
# where a sentence can say which of two things is true. `sofa_hour` in this same
# room still carries the greyed line, so the rule is still taught.

[[canvases.nodes.exit_block.choices]]
text       = "Watch it."
targetType = "location"
locationId = "the_front_room"
time_progression_minutes = 60
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tv_on", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "sofa_today", operator = "is_false" },
] }
effects     = [{ targetType = "player", trait = "rest", op = "add", value = 15, clamp = true }]
flagEffects = [{ targetType = "player", flag = "sofa_today", op = "set" }]

# --- NOT REACHING FOR THE REMOTE, WHICH IS THE WHOLE CANVAS ------------------
# ⚠️ THIS IS THE ONLY THING THAT CLIMBS, AND IT COSTS THE HOUR. Both rows carry
# `sofa_today is_false` and set it, so a rung moves at most once a day and the
# ladder cannot be ground out in one evening. Two rungs each, +1 corruption a
# rung, so the LIFETIME yield of this surface is four points — one named step on
# her_meters.md's ladder, and then it is done. A meter that climbs while the world
# stays the same size is decoration, and `gates.py` "the climb is paid for"
# catches it: the first draft moved corruption on a five-minute choice with no
# hour attached and was flagged as free.
#
# ⚠️ `is_absent` ON @gil KEEPS THE TWO ROWS EXCLUSIVE. He is on that sofa
# 20:30-21:00 and her mum 20:00-21:00, so the half hour before he comes through is
# the only window where one parent is in a room without the other. Two rows whose
# conditions can both pass render the SAME BUTTON TWICE with different effects.

[[canvases.nodes.exit_block.choices]]
text       = "Leave it on."
targetType = "location"
locationId = "the_front_room"
time_progression_minutes = 60
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key  = "tv_on", operator = "is_true" },
  { type = "flag",  subject = "player", flag_key  = "sofa_today", operator = "is_false" },
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "gte", value = 5 },
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_front_room", operator = "is_present" },
  { type = "trait", subject = "player", trait_key = "gil_tv", operator = "lte", value = 1 },
] }
effects = [
  { targetType = "player", trait = "rest",       op = "add", value = 15, clamp = true },
  { targetType = "player", trait = "gil_tv",     op = "add", value = 1 },
  { targetType = "player", trait = "corruption", op = "add", value = 1, clamp = true },
]
flagEffects = [{ targetType = "player", flag = "sofa_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Leave it on."
targetType = "location"
locationId = "the_front_room"
time_progression_minutes = 60
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key  = "tv_on", operator = "is_true" },
  { type = "flag",  subject = "player", flag_key  = "sofa_today", operator = "is_false" },
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "gte", value = 5 },
  { type = "npc_at_location", npc_id = "npc_gil",  location_id = "the_front_room", operator = "is_absent" },
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_front_room", operator = "is_present" },
  { type = "trait", subject = "player", trait_key = "lynn_tv", operator = "lte", value = 1 },
] }
effects = [
  { targetType = "player", trait = "rest",       op = "add", value = 15, clamp = true },
  { targetType = "player", trait = "lynn_tv",    op = "add", value = 1 },
  { targetType = "player", trait = "corruption", op = "add", value = 1, clamp = true },
]
flagEffects = [{ targetType = "player", flag = "sofa_today", op = "set" }]

# --- OFF ---------------------------------------------------------------------
# ⚠️ THE OFF BUTTON IS WHAT MAKES THE ROOM TWO ROOMS. Both parents' hubs are gated
# on `tv_on is_false`, so with the set on the room offers the television and with
# it off the room offers the person. That is the whole split, and it is why this
# is not a button for the sake of a button. LO: "Sitting on sofa isnt watching tv."

[[canvases.nodes.exit_block.choices]]
text       = "Turn it off."
targetType = "location"
locationId = "the_front_room"
time_progression_minutes = 5
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tv_on", operator = "is_true" },
] }
flagEffects = [{ targetType = "player", flag = "tv_on", op = "unset" }]

# Unconditional, and an exit rather than a decision. The free door on a spent
# evening — `gates.py` "a spent day still has a door".
[[canvases.nodes.exit_block.choices]]
text       = "Leave it."
targetType = "location"
locationId = "the_front_room"
time_progression_minutes = 5
