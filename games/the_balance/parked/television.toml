id   = "hub_lynn_sofa"
name = "Your mum"
description = "Portrait hub @ the_front_room. Two windows on the four nights she is home — 14:00-18:00 straight out of bed, and 20:00-21:00 after dinner. The one hour in the game that asks nothing of her. Never touched, no ladder."

[canvases.trigger]
location      = "the_front_room"
requires_npc  = "npc_lynn"
npc           = "npc_lynn"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "tv_on", operator = "is_false" },
] }

[[canvases.trigger.schedules]]
weekdays   = [1, 3, 5, 6]
start_time = "20:00"
end_time   = "21:00"

# --- HER AFTERNOON, ADDED 2026-09-17 -----------------------------------------
# ⚠️ FIVE EMPTY HOURS A DAY, THREE DAYS A WEEK. She comes off the ward at quarter
# to eight, sleeps until two, and until this pass the game had her nowhere at all
# from two until seven. She was awake, at home, and not in the house.
#
# ⚠️ NO NEW CANVAS, AND THAT IS THE POINT. `sofa_today` is shared by every surface
# in this room, so sitting with her at three SPENDS the eight o'clock. Choosing
# which of the two is the decision, and a second canvas would have handed her both.
[[canvases.trigger.schedules]]
weekdays   = [1, 3, 5, 6]
start_time = "14:00"
end_time   = "18:00"

[[canvases.nodes]]
id   = "base"
name = "Shoes off"

# ⚠️ GROUPS, NOT ONE POOL, SINCE THE AFTERNOON WINDOW WAS ADDED. A `block_pool`
# cannot be gated (process/README.md §6 item 4), and two o'clock straight out of a
# blacked-out bedroom is not eight o'clock after dinner. One pool would have had
# her in the cardigan she travels in at three in the afternoon.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "time_of_day", start_time = "14:00", end_time = "18:00" },
] } }
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Your mum is on the sofa in the clothes she sleeps in with the afternoon on and the sound down. She has been awake about forty minutes and she has not got anywhere with it yet." },
    { type = "paragraph", content = "She came down at two and she has not moved since. The curtains are still shut upstairs. She looks at you the way people look when they are working out what day it is." },
  ] },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Your mum has her shoes off and her feet up on the arm, and a mug on the floor she has not touched since she put it there. The set is off. She is not asleep, but she is not far from it." },
    { type = "paragraph", content = "She is in the corner of the sofa with the lamp on beside her, still in the cardigan she travels in. She looks up when you come in and she smiles before she has worked out which of you it is." },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Sit with her."
targetType = "node"
nodeId     = "hub_lynn_sofa.sat"
show_when_locked = true
locked_text = "You have had your hour in this room today."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "sofa_today", operator = "is_false" },
] }

[[canvases.nodes.exit_block.choices]]
text       = "Let her sleep."
targetType = "location"
locationId = "the_front_room"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "sat"
name = "An hour that wants nothing"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You sit down next to her and she moves her feet without opening her eyes. She asks how college is and she is asleep before you have finished answering, and the answer you were giving her was not true anyway."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "rest", operator = "lt", value = 40 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "You look like I do. That is not a thing I want to be right about." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Sit down. You do not have to talk, I have had people talking at me since six." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Ten more minutes and I am going up. Stay down here as long as you like." },
  ] },
]

[[canvases.nodes.blocks]]
