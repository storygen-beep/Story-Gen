# ── from toml_phases/5_scenes.toml
# =============================================================================
# THE TELEVISION
#
# LO, 2026-09-17: "Sitting on sofa isnt watching tv. Watching tv 5 channels,
# change channel button and tv turn off too." He is right, and `sofa_hour` was
# doing both jobs badly — the set was a noise in the prose and never a thing she
# operated. This is the set. It has state, it remembers, and it is the first
# object in this game the player can leave in a condition.
#
# ⚠️ NO SCHEDULE, ON PURPOSE. It is on the room's screen every hour she is in
# there, including the empty afternoon — which is the point. The house holds
# nobody 08:00-16:00 and until now there was nothing to do in it either. The
# parents are not what makes the television available; they are who might be
# sitting there when she puts it on.
#
# ⚠️ NO max_triggers_per_day EITHER. Flipping channels is not the act. The hour is
# capped by `sofa_today`, which every canvas in this room shares — one hour in
# here a day, and choosing who to spend it with is the decision.
#
# ⚠️ TWO GROUP CHAINS, SEPARATED BY A NON-GROUP BLOCK. Adjacent [group] blocks
# MERGE into one if/elseif chain (CARRIED.md:260-262), which is exactly what each
# chain wants and a disaster if the two fuse: the channel bands would become
# alternatives to the people bands and only one would ever render. The paragraph
# between them is a wall, not decoration.
#
# ⚠️ `eq` COMPARES WITH === AND DOES NOT COERCE (v2.py:4150), so every channel
# band tests a number against a number. `dare_chain` does the same thing already.

[[canvases]]
id   = "watch_tv"
name = "The television"
description = "The set in the front room. Five channels, a button to change them and a button to turn it off, and it remembers what it was left on. What she can leave on depends on who is sitting there."

[canvases.trigger]
location      = "the_front_room"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "The set"

# --- CHAIN A · what is actually on -------------------------------------------
# Five bands, exclusive by construction. The set is off in its own band first,
# because a dark screen is a different sentence from a channel.

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tv_on", operator = "is_false" },
] } }
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The screen is off and the room is the colour the street lamp makes it. The remote is down the side of the cushion where it always is, warm from whoever had it last." },
    { type = "paragraph", content = "Nothing on. The set gives back the room in grey — the sofa, the doorway, you standing in it with your coat still on." },
  ] },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "eq", value = 1 },
] } }
blocks = [
  { type = "paragraph", content = "The news. It is always the news when @gil has had it last. A man at a desk saying numbers about somewhere else, and it is the sound this house makes when nothing is happening in it." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "eq", value = 2 },
] } }
blocks = [
  { type = "paragraph", content = "The soap. Two people in a kitchen having the row they have been having since before you moved in, and an audience somewhere going at it every time one of them turns round." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "eq", value = 3 },
] } }
blocks = [
  { type = "paragraph", content = "Football, or the talking that comes before football. Men in a row at a table, and a pitch behind them with nobody on it yet. You could put this on and leave the house." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "eq", value = 4 },
] } }
blocks = [
  { type = "paragraph", content = "Music videos with the sound low. A girl a year or two older than you doing something with her hips at a camera that is much too close, and getting paid for it, and everybody watching it in front of their mothers." },
]

# ⚠️ CHANNEL FIVE IS THE ONE THE WHOLE CANVAS IS FOR, and it is written crude
# because that is the register this game ships at (CLAUDE.md, references/
# register.md). The beat stays on the screen for its whole length — the reaction
# is the NEXT chain's job, and folding it in here is the pivot the register file
# names as the recurring defect.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "eq", value = 5 },
] } }
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "A woman on her back with her knees up and a man working into her at a steady pace, and the camera close enough that you can see where he goes in. Her tits move with every stroke. The sound is two bodies and her breathing and nothing else." },
    { type = "paragraph", content = "She is on her knees with his cock in her mouth and both hands flat on his thighs, taking it slow and deep and looking up the whole time. When she pulls off, the string of it hangs between her lip and the head of him before it breaks." },
    { type = "paragraph", content = "A woman riding a man on a sofa not unlike this one, her back to the camera, her ass coming down on him in a rhythm she is setting herself. He has a hand on each cheek and he is not doing any of the work." },
  ] },
]

# --- the wall between the two chains -----------------------------------------
# ⚠️ DO NOT DELETE THIS PARAGRAPH. Two adjacent group chains fuse into one, and
# then only one band in the whole canvas ever renders. It is load-bearing.
[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The room is warm and the window has the street in it."

# --- CHAIN B · who is in here, and what they do about it ---------------------
# ⚠️ @GIL'S RUNG DECIDES WHEN BOTH ARE IN. He is the one who acts, so his bands
# come first and the chain stops at the first match. Her mum's bands only render
# on the half hour before he comes through.

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "eq", value = 5 },
  { type = "flag",  subject = "player", flag_key  = "tv_on", operator = "is_true" },
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_front_room", operator = "is_present" },
  { type = "trait", subject = "player", trait_key = "gil_tv", operator = "lte", value = 0 },
] } }
blocks = [
  { type = "paragraph", content = "@gil does not say anything and he does not reach for the remote. He looks at the screen once, and then at you, and then at the window, and he does not look back at either of them again for the rest of it." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "eq", value = 5 },
  { type = "flag",  subject = "player", flag_key  = "tv_on", operator = "is_true" },
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_front_room", operator = "is_present" },
  { type = "trait", subject = "player", trait_key = "gil_tv", operator = "eq", value = 1 },
] } }
blocks = [
  { type = "paragraph", content = "@gil's eyes keep going to it and coming back. Not for long, and never when he thinks you are looking. The window has the screen in it and he has been watching the window for twenty minutes now." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "eq", value = 5 },
  { type = "flag",  subject = "player", flag_key  = "tv_on", operator = "is_true" },
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_front_room", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "@gil settles back with his arms along the top of the sofa and watches it. Properly, the way he watches the news. Every so often he says nothing in a way that has weight to it, and you are very aware of how much of the sofa is between you." },
]

# Her mum, on the half hour she has to herself. ⚠️ SHE IS NEVER TOUCHED — see
# DECISIONS.md. What climbs is whether she is awake to it, and that is all.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "eq", value = 5 },
  { type = "flag",  subject = "player", flag_key  = "tv_on", operator = "is_true" },
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_front_room", operator = "is_present" },
  { type = "trait", subject = "player", trait_key = "lynn_tv", operator = "lte", value = 0 },
] } }
blocks = [
  { type = "paragraph", content = "Your mum has her eyes shut and the mug going cold against her knee. She does not notice. She has been on a ward since Monday and she would not notice the room on fire." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "tv_channel", operator = "eq", value = 5 },
  { type = "flag",  subject = "player", flag_key  = "tv_on", operator = "is_true" },
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_front_room", operator = "is_present" },
