# @nate is in this room 21:00-22:00 and he is NOT part of the television. LO:
# "he doesnt watches tv". One line so the room does not have a hole in it.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tv_on", operator = "is_true" },
  { type = "npc_at_location", npc_id = "npc_nate", location_id = "the_front_room", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "@nate is on the other end with his phone up and the screen lighting the underside of his face. Whatever is on the television is not something he has an opinion about." },
]

# --- the second wall ---------------------------------------------------------
# ⚠️ LOAD-BEARING, same as the first one. Chain B above it is a merged if/elseif;
# the single group below it must NOT join the end of that chain, or the spent-hour
# line would only ever render on an evening when nobody is in the room.
[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The remote is on the arm of the sofa."

# ⚠️ THE SPENT HOUR IS NARRATED, NOT A GREYED BUTTON. The seven "Watch it." rows
# are exclusive on channel and on who is in the room, so show_when_locked on any
