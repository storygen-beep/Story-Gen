npcId      = "npc_lynn"
trait      = "relation"
op         = "add"
value      = 3

# ── from toml_phases/5_scenes.toml
# =============================================================================
# THE KITCHEN · LO's pass, 2026-09-17
# =============================================================================
# Measured before a line of this was written. The kitchen held ONE card for most
# of the day — `chore`, and `chore` is capped at one a day, so from the moment she
# did it the anchor room of the house was EMPTY every hour nobody happened to be
# standing in it. The room's own description is the list on the fridge and what he
# pays for it: a payroll noticeboard with a cooker in it.
#
# gates.py, same run: rooms carry a median of ONE thing to do, against a field
# median of three. The kitchen is not unusual. It is where it shows worst.
#
# ⚠️ THE SHAPE COPIED HERE IS THE FRONT ROOM'S, because the front room works. It
# has something to do alone (`sofa_hour`), something with an object (`watch_tv`),
# a card for each person in it, and ONE room flag so the hour is one hour whoever
# she spends it with. The kitchen had the work and two of the four people.
#
# ⚠️ NOBODY IN THIS GAME HAD EVER COOKED. The word appears three times in the whole
# corpus and all three are scenery. @nate's own ward-night line said it out loud.
# LO's split: her mum on the ward means she cooks, her mum home means she helps.

# -----------------------------------------------------------------------------
# HER MUM AT BREAKFAST · the one hour she is awake and not wrecked
# -----------------------------------------------------------------------------
# ⚠️ [0, 2, 4] ONLY. She works Monday, Wednesday and Friday NIGHTS, so on those
# mornings she has slept the night before and the day is hers. Tuesday, Thursday
# and Saturday she is coming off a ward at quarter to eight and goes straight to
# bed, and Sunday she has a lie-in nobody wakes her from.
#
# ⚠️ AND IT IS THE TWENTY MINUTES SHE HAS. The game starts at 07:00 and puts her
# in this kitchen at 07:30 with the bus twenty minutes off. Sitting down here is
# the same trade the bathroom row is — an hour of the house against a class.
#
# ⚠️ SHE IS NEVER TOUCHED. Standing call, DECISIONS.md. This is a woman at a table
# with a cup, and `relation` is the only meter on her.

[[canvases]]
id   = "hub_lynn_kitchen"
name = "Your mum"
description = "Portrait hub @ the_kitchen, 06:30-09:00 on her ward days. The only hour in the week she is awake, at home and not exhausted. Shares `lynn_today`. Never touched."

[canvases.trigger]
location      = "the_kitchen"
requires_npc  = "npc_lynn"
npc           = "npc_lynn"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 2, 4]
start_time = "06:30"
end_time   = "09:00"

[[canvases.nodes]]
id   = "base"
name = "Before the ward"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Your mum is up before she has to be, in the cardigan she wears in the house and not the one she travels in. She has a cup she is not drinking and the washing is already going." },
  { type = "paragraph", content = "She is at the sink with her back to the room, doing something that does not need doing yet. Tonight is a ward night and she has the whole day first, so she is spending it on the house." },
]

# ⚠️ WHO ELSE IS IN THE ROOM, AND ALL THREE OF THEM CAN BE. @gil sits here 06:30
# to 08:15 and @nate comes out of the shower into it at 07:45, so a Monday at ten
# to eight is the only minute of the week the table holds three of them.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil",  location_id = "the_kitchen", operator = "is_present" },
  { type = "npc_at_location", npc_id = "npc_nate", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "All three of them are in here and the room is not built for it. @gil has the table and @nate has the sink. Your mum works around both of them, but she never appears to move." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Sit down, both of you. It's not a queue." },
  { type = "paragraph", content = "@gil does not sit down and does not look up. She says it to him every morning she is here and she has never once expected it to work." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "She has the room to herself and she has not put the light on, because the window does enough at this hour and she is careful about things nobody would notice." },
]

# ⚠️ A READ ON HER OWN METER, AND THE FIRST ONE IN THE GAME. Before this pass
# `npc_lynn.relation` was moved in three places and read in NONE — a dead number.
# Fifteen is roughly five hours given to her, which is a lot in a game this short.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "npc", npc_id = "npc_lynn", trait_key = "relation", operator = "gte", value = 15 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "You've been about a lot. I'm not complaining, I'm noticing. I don't do much noticing these days." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Sit down with her."
targetType = "node"
nodeId     = "hub_lynn_kitchen.sat"
show_when_locked = true
locked_text = "You have had your go at your mum today, and there is only one of those."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "lynn_today", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "lynn_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Get the bus."
targetType = "location"
locationId = "the_kitchen"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "sat"
name = "Twenty minutes"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You sit down and she puts a second cup in front of you without being asked. She does not sit down herself, but she stops moving, and she leans on the counter the way she leans on things at work."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "rest", operator = "lt", value = 40 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "You've got my face on. The one I have at four in the morning. What have you been doing that for?" },
  { type = "paragraph", content = "It is the closest anybody in this house has come to asking. She waits about two seconds for an answer, but not three, and then puts the kettle back on to let you off it." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "I've got twelve hours tonight and I'm already tired. Don't grow up into a job like this one." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Your gran used to do this. Stand about in the kitchen at seven with nothing to say and not want you to leave." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Is it alright here? You'd say. You wouldn't, but I'd like to think you'd say." },
  ] },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Then the clock does the thing clocks do in this house and you are twenty minutes down. She tells you to go, and she is still standing there when you look back from the hall."

[canvases.nodes.exit_block]
type = "location"
text = "Go, before the bus does."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_kitchen"
time_progression_minutes = 20

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_lynn"
trait      = "relation"
op         = "add"
value      = 1

# ── from toml_phases/5_scenes.toml
# -----------------------------------------------------------------------------
# TASHA AT THE TABLE
# -----------------------------------------------------------------------------
# ⚠️ SHE HAD NO KITCHEN CARD AT ALL, EVER. She sits at that table [1, 3, 6] and
# the only thing there was `dinner`, which is the room's hour and gives her three
# rotating lines she cannot be answered on.
#
# ⚠️ IT IS NOT A SECOND DINNER. It shares `tasha_today`, which is the flag that
# already means one go at Tasha a day wherever it happens — so taking her side at
# the table SPENDS her bedroom hour. That is the decision, and it is the same
# shape @nate's `nate_today` has had since the afternoon pass.

[[canvases]]
id   = "hub_tasha_kitchen"
name = "Tasha"
description = "Portrait hub @ the_kitchen, 19:00-20:00 on the three nights she eats with them. Shares `tasha_today` with her room and the bathroom, so the table costs the bedroom."

[canvases.trigger]
location      = "the_kitchen"
requires_npc  = "npc_tasha"
npc           = "npc_tasha"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [1, 3, 6]
start_time = "19:00"
end_time   = "20:00"

[[canvases.nodes]]
id   = "base"
name = "Across the table"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Tasha has the seat she always has and she is holding the room the way she holds every room, which works on nobody here and has never once stopped her doing it." },
  { type = "paragraph", content = "She is eating with one elbow on the table and telling a story to three people who are not listening, and she keeps checking whether you are." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The story has got to the part where somebody was supposed to laugh. Her mum is looking at her plate. @gil is looking at the radio. She keeps going and her voice gets a bit smaller."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Back her up."
targetType = "node"
nodeId     = "hub_tasha_kitchen.backed"
show_when_locked = true
locked_text = "You have had your hour with Tasha today, wherever you spent it."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "tasha_today", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "tasha_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Let it go quiet."
targetType = "location"
locationId = "the_kitchen"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "backed"
name = "Somebody laughed"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You give her the line she was waiting for and she takes it and runs about a mile with it, and for the rest of that plate there are two people at this table having a dinner."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "npc", npc_id = "npc_tasha", trait_key = "relation", operator = "gte", value = 10 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "See, you get it. Nobody in this house gets it. You're the only one who was ever going to." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Thank you. That's all I wanted. One person. It's not a lot to want off four of you." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Come up after. I've got the thing I was telling you about and I'm not showing it down here." },
  ] },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She kicks you under the table on her way up and does not look back, and the hour you have just spent on her is the hour you were going to spend in her room."

[canvases.nodes.exit_block]
type = "location"
text = "Finish your plate."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_kitchen"
time_progression_minutes = 30

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_tasha"
trait      = "relation"
op         = "add"
value      = 2

# ── from toml_phases/3_activities.toml
# --- THE KETTLE · the light thing the kitchen never had ---------------------
# ⚠️ THE ROOM HAD ONE CARD. `chore` was it, and `chore` is capped at one a day, so
# from the moment she did it the anchor room of the house rendered EMPTY every
# hour nobody happened to be standing in it. Measured across a full week before
# this: the kitchen showed one card at half four in the afternoon and one at ten
# at night, seven days out of seven.
#
# ⚠️ THIS IS `sofa_hour` FOR THE KITCHEN AND IT IS COPIED ON PURPOSE. The front
# room works because it holds something to do alone, something with an object, and
# a card per person. That is `the-surfaces.md` R2 — a room's list is needs, work
# and people — and the kitchen had the work and half the people.
#
# ⚠️ FIFTEEN MINUTES AND +10 `rest`, ONCE A DAY. `rest` falls 20 a day, `sleep`
# sets it to 100 and the sofa gives 15 to 20, so this cannot be farmed into a
# replacement for either. The flag is on the CHOICE, not the trigger, so the room
# keeps its card after she has had it — a door, in the sense `a spent day still
# has a door` means.
#
# ⚠️ NO HUNGER METER, AND THAT WAS THE CALL. A third need that falls every day
# would make the kitchen compulsory rather than worth going to, which is a chore
# and not content. It moves the meter the game already has.

[[canvases]]
id   = "kettle"
name = "Put the kettle on"
description = "Solo @ the_kitchen, any hour. Fifteen minutes and a little rest, once a day. Bands on who is in the room, which is the point of it — it is an excuse to be in the kitchen when somebody else is."

[canvases.trigger]
location      = "the_kitchen"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "The kettle"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "The kettle is where it always is and there is always about an inch in it. You put more in. It takes two minutes and there is nothing to do with those two minutes." },
  { type = "paragraph", content = "There is a mug on the drainer that is nearly yours. The list on the fridge is in @gil's handwriting. You have read it four hundred times, but you read it again anyway." },
  { type = "paragraph", content = "The bread is out. There is enough of it for one round of something and nobody will notice it has gone, and that is most of what this kitchen is for." },
]

# --- WHO IS STANDING IN IT ----------------------------------------------------
# ⚠️ THESE BANDS ARE THE WHOLE VALUE OF THE CANVAS. A kettle is not content. An
# excuse to be in a room with somebody at half seven in the morning IS, and this
# is the only surface in the kitchen with no clock and no person on its trigger,
# so it is the one that can catch whoever happens to be in here.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "@gil is at the table behind you with the radio going. He does not offer and you do not ask, and the second mug you get down is not a question either." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_lynn", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Make me one while you're stood there. I'll drink half of it and leave the rest, we both know that." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_nate", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "@nate is in the way of the drawer and he knows he is in the way of the drawer. He moves when you are close enough that moving is the smaller thing to do." },
]

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_tasha", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_tasha" }, content = "Do mine. Not that mug, the good one. You know the one, don't pretend you don't know the one." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "There is nobody in here. The house does the noises it does with nothing in it, and the kettle getting loud is the loudest thing that has happened all afternoon." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Stand and drink it."
targetType = "location"
locationId = "the_kitchen"
time_progression_minutes = 15
show_when_locked = true
locked_text = "You have already stood in this kitchen doing nothing today."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "kettle_today", operator = "is_false" },
] }
effects     = [{ targetType = "player", trait = "rest", op = "add", value = 10, clamp = true }]
flagEffects = [{ targetType = "player", flag = "kettle_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Take it with you."
targetType = "location"
locationId = "the_kitchen"
time_progression_minutes = 5
