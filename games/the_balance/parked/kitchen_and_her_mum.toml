show_when_locked = true
locked_text = "You have had your go at your mum today, and there is only one of those."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "lynn_today", operator = "is_false" },
] }
flagEffects = [
  { targetType = "player", flag = "lynn_today",   op = "set" },
  { targetType = "player", flag = "cooked_today", op = "set" },
]

[[canvases.nodes.exit_block.choices]]
text       = "Let her get on."
targetType = "location"
locationId = "the_kitchen"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "helped"
name = "Two of you at it"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "She hands you a knife and a board and tells you what to do with them. She could check on you, but she never once does, and from her that is the entire compliment. The window goes to steam."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "npc", npc_id = "npc_lynn", trait_key = "relation", operator = "gte", value = 10 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "I like this. Don't make a thing of me liking it, I'll stop doing it. But I like this." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Taste that. Not with the spoon you've had in your mouth. Honestly, you're worse than the pair of them." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Four of us and I still cook for six. I've never worked out how to stop doing that." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Your dad couldn't do this either. That's the only nice thing I've got left about him, so I keep it." },
  ] },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The two of you get it on the table by seven and she sits down for the first time since two o'clock. Nobody at that table will say who did what, and she was never going to tell them."

[canvases.nodes.exit_block]
type = "location"
text = "Get it on the table."

[canvases.nodes.exit_block.config]
