# PARKED 2026-09-19 — 6 scene(s) from 19fee19 "the kitchen has three meals and her mum has a week".
# Copied verbatim from ff91336, design comments included. NOT merged: parked/ is outside
# toml_phases/. To bring one back, its block's round in sheets/BASE.md decides it first.

# ── from toml_phases/5_scenes.toml
# -----------------------------------------------------------------------------
# DOING THE HOUSE WITH HER · LO's ask, and the best hour in this pass
# -----------------------------------------------------------------------------
# ⚠️ THESE ARE NOT THE CHORES ON THE FRIDGE. That list is bins, laundry, dishes
# and the car, it is in @gil's handwriting, it pays five dollars and it is HER
# JOB. `chore` is working. This is helping, and nobody is paid for any of it.
#
# ⚠️ IT PAYS NO CASH AND THAT IS A GATE, NOT A PREFERENCE. gates.py reports
# 5 sinks : 9 sources against a field median of 2.2 : 1 — the game already prints
# more money than it takes, and a second earner in the kitchen makes it worse.
#
# ⚠️ AND IT IS THE ONLY LONG STRETCH IN THE GAME WHERE THE TWO OF THEM ARE ALONE
# IN THIS HOUSE. Everywhere else her mum is asleep, at the ward, or at a table
# with three other people. It costs less than it reads: she is at college 09:00 to
# 12:00 Monday to Thursday, so the real overlap is FRIDAY — which has no classes,
# and is the day the $150 is handed over.

[[canvases]]
id   = "chores_with_mum"
name = "Your mum"
description = "Portrait hub @ the_kitchen, 09:00-14:00 on her ward days and Sunday. The only long stretch where the two of them are alone in the house. Shares `lynn_today`. No cash. Never touched."

[canvases.trigger]
location      = "the_kitchen"
requires_npc  = "npc_lynn"
npc           = "npc_lynn"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 2, 4, 6]
start_time = "09:00"
end_time   = "14:00"

[[canvases.nodes]]
id   = "base"
name = "Working through it"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "The ironing board is up in the middle of the kitchen and there is a pile on the table that has been sorted into piles nobody else can see the logic of. She is halfway through and she is not hurrying." },
  { type = "paragraph", content = "The machine is on its second load and the back door is open for the smell of it. Your mum has a tea towel over one shoulder and the radio is on the station she never changes." },
  { type = "paragraph", content = "She is on her knees at the bottom cupboard taking everything out of it. People do that on a day off when they have decided not to sit down and think." },
]

# ⚠️ @nate IS IN THIS ROOM 12:00-13:00 EVERY DAY OF THE WEEK. Her mum's block runs
# 09:00-14:00, so four days a week lunch has two people in it and neither of them
# needed a canvas of their own to be there.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_nate", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Eat that at the table like a person. I'm not asking you to enjoy it, I'm asking you to sit." },
  { type = "paragraph", content = "@nate eats it standing up. She lets him, the way she lets @gil not sit down, and there is a whole marriage in how little she pushes any of it." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "There is nobody else in this house. @gil is out on the job until five and @nate is wherever @nate is, and the two of you have the whole of it for once." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Give her a hand."
targetType = "node"
nodeId     = "chores_with_mum.helped"
show_when_locked = true
locked_text = "You have had your go at your mum today, and there is only one of those."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "lynn_today", operator = "is_false" },
] }
flagEffects = [{ targetType = "player", flag = "lynn_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Leave her to it."
targetType = "location"
locationId = "the_kitchen"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "helped"
name = "An hour of it"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You take the other end of a sheet and the two of you fold it the way she taught you when you were small. She notices you remembering, but she does not say so. She hands you the next one."

[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "npc", npc_id = "npc_lynn", trait_key = "relation", operator = "gte", value = 10 },
] } }
blocks = [
  { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Are you short? You can say if you're short. He does the list because he likes a list, it isn't a test." },
  { type = "paragraph", content = "It is the one question in this house with money in it that nobody has asked you, and it comes from the person who does not know what the semester cost." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Leave the shirts. He does his own and he'd only do them again, and then I'd have to watch him do it." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "Tasha's are the ones with everything inside out. Twenty-two years old. I've stopped saying it." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_lynn" }, content = "You don't have to do this. I'd rather you did, but you don't have to, and those are different." },
  ] },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "An hour goes and neither of you has said anything that would survive being repeated. She is easier to be near than anybody else in this house, and it is the only hour of the week she is in it."

[canvases.nodes.exit_block]
type = "location"
text = "Leave her the last of it."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_kitchen"
time_progression_minutes = 60

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_lynn"
trait      = "relation"
op         = "add"
value      = 2

# ── from toml_phases/5_scenes.toml
# -----------------------------------------------------------------------------
# COOKING IT HERSELF · the three nights her mum is on the ward
# -----------------------------------------------------------------------------
# ⚠️ A SOLO SURFACE IN A ROOM THAT ONLY HAD ONE. `chore` was the whole of it and
# `chore` is capped at one a day. This is the second thing she can do in here
# alone, and it is the first thing in the game she does for the house instead of
# for five dollars.
#
# ⚠️ IT DOES NOT PAY CASH. See `chores_with_mum` above — the money gate is already
# failing at 5 sinks : 9 sources. It pays in @gil, which is where everything else
# about how she lives in this house gets read.
#
# ⚠️ AND SHE CAN SAY NO. `cook` is not obligatory and `dinner`'s else band is the
# consequence: "Nobody cooked. There is bread, and there is whatever was in the
# fridge." That line has been in the game since the television pass as the DEFAULT.
# From today it is something she let happen.

[[canvases]]
id   = "cook"
name = "Make something for the house"
description = "Solo @ the_kitchen, 17:00-19:00 on the three ward nights. Sets `cooked_today`, which `dinner` reads. Pays @gil, never cash."

[canvases.trigger]
location      = "the_kitchen"
is_repeatable = true
priority      = 6
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "cooked_today", operator = "is_false" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 2, 4]
start_time = "17:00"
end_time   = "19:00"

[[canvases.nodes]]
id   = "base"
name = "Nobody else is going to"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "The fridge has four things in it that would make one thing. Your mum went at half six and nobody has been in here since, and the table is still wearing this morning." },
  { type = "paragraph", content = "There is a pan on the drainer that somebody meant to put away. Two men are coming in hungry in an hour and neither of them has ever once thought about that in advance." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You could do nothing. Nothing is what happens most ward nights. Everybody eats standing up out of whatever they find, but nobody in this house has ever called that a problem."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Make something proper."
targetType = "node"
nodeId     = "cook.made"
flagEffects = [{ targetType = "player", flag = "cooked_today", op = "set" }]

[[canvases.nodes.exit_block.choices]]
text       = "Leave it. Somebody else can."
targetType = "location"
locationId = "the_kitchen"
time_progression_minutes = 5

[[canvases.nodes]]
id   = "made"
name = "An hour of it"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "It takes longer than it should because you keep checking the one thing that does not need checking. The window steams up. The kitchen smells like somebody lives here."

# ⚠️ HE IS IN THIS ROOM FROM 18:30 AND THE WINDOW RUNS TO 19:00, so whether he
# walks in on it is decided by when she started. Starting at five buys her the
# room to herself; starting at six means he watches the end of it.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "@gil comes in on the end of it and stops in the doorway for about a second longer than he needs to, then sits down and puts the radio on low." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "You didn't have to do that." },
  { type = "paragraph", content = "He says it like a correction and eats two plates of it, and that second plate is the only thing in this house that has ever been an apology." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "You get it on the table and go before anybody comes down, because being in here when they find it would be asking, and asking would spoil what it is." },
]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Nobody is going to mention it. You knew that at five o'clock, but you did it anyway. Everything else you have ever done in this house was for five dollars."

[canvases.nodes.exit_block]
type = "location"
text = "Get out of the kitchen."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_kitchen"
time_progression_minutes = 60

[[canvases.nodes.exit_block.config.effects]]
targetType = "npc"
npcId      = "npc_gil"
trait      = "relation"
op         = "add"
value      = 2

