[[canvases]]
id   = "cook_with_mum"
name = "Your mum"
description = "Portrait hub @ the_kitchen, 18:00-19:00 on the four nights she is home. Sets `cooked_today`. Shares `lynn_today`. Never touched."

[canvases.trigger]
location      = "the_kitchen"
requires_npc  = "npc_lynn"
npc           = "npc_lynn"
is_repeatable = true
priority      = 6
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [1, 3, 5, 6]
start_time = "18:00"
end_time   = "19:00"

[[canvases.nodes]]
id   = "base"
name = "Six o'clock"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "Everything is out on the counter at once and none of it is in an order. Your mum cooks the way she does a shift, four things going and her hands ahead of her eyes, and the radio is on somebody else's station." },
  { type = "paragraph", content = "She is at the hob with a wooden spoon in one hand and the lid of something in the other, and she has been in this kitchen eleven minutes and remade the whole room." },
]

# ⚠️ @gil COMES DOWN AT HALF SIX AND THIS IS THE FIRST TIME IN THE GAME THE TWO OF
# THEM ARE IN ONE ROOM. His shower is 18:00-18:30, hers is the hob, and nothing
# before this pass ever put the marriage on screen.
[[canvases.nodes.blocks]]
type = "group"
props = { conditions = { version = "1.0", logic = "AND", items = [
  { type = "npc_at_location", npc_id = "npc_gil", location_id = "the_kitchen", operator = "is_present" },
] } }
blocks = [
  { type = "paragraph", content = "@gil comes down washed and sits where he sits, and she puts a hand flat on his shoulder on her way past the table without either of them saying a word about it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_gil" }, content = "Smells like the good one." },
]

[[canvases.nodes.blocks]]
type = "group"
blocks = [
  { type = "paragraph", content = "It is just the two of you in here and it will be for half an hour yet. She is already doing more than one person needs to and she has not asked anybody." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Help her with it."
