# =============================================================================
# Back Home — 1_metadata_and_locations
#
# ⚠️ [player], [[locations]], [[npcs]] and [[npcs.schedules]] MUST share this one
#    file. TOML scoping re-parents nested tables across a file boundary.
#
# THE HOUSE IS ROOMS, NOT ONE LOCATION. Presence and occupancy are per-location
# in this engine, so room-level co-location — the whole engine of a household
# game — only works if the rooms are locations. The landing exists to be the
# VANTAGE the bathroom is peeped from (npc_at_location, v2.py:3480/:4131-4146).
#
# ANCHOR = the_front_room. Evenings are when all three men rotate through it, so
# it carries the most standing content. Gate 1 wants one location holding >=25%
# of location prose — and it must be one the player can reach and re-enter.
# =============================================================================

[player]
id           = "player"
name         = "June"
description  = "Twenty-four, back in her father's house with two bags and no plan."
customizable = false      # deferred: needs [[player.customization_fields]]; v0.1 ships fixed

[player.core_traits]
# layer 1 — ratcheting ascent tiers (rungs at 15/35/55/75)
nerve    = 0
exposure = 0
need     = 0
pride    = 100      # counterweight: what she pays with
# layer 2 — volatile state
arousal  = 0
energy   = 100
hygiene  = 100
money    = 12
# internals
shift_done_today = 0
lodger_slot      = 1

# Decay is a POSITIVE MAGNITUDE — the validator rejects negatives.
[player.trait_decay]
hygiene = 10
energy  = 8


# =============================================================================
# LOCATIONS — 8. One anchor, several satellites, one corridor.
# =============================================================================

# ── ANCHOR ───────────────────────────────────────────────────────────────────
[[locations]]
id                   = "the_front_room"
name                 = "The Front Room"
description          = "The good sofa nobody was allowed on, gone soft in the middle. A telly that stays on whether or not anyone is watching it. This is where the house collects after dark — whoever is home ends up in here, and after eleven it is usually only one of them."
image                = "locations/the_front_room.jpg"
image_search_queries = ["small british living room evening lamp sofa", "cluttered family front room television night"]
navigation_order     = ["the_kitchen", "the_landing", "the_shop"]

[[locations]]
id                   = "the_kitchen"
name                 = "The Kitchen"
description          = "Everyone passes through it and nobody stays. The back door sticks. There is exactly one chair that doesn't wobble and it is not hers."
image                = "locations/the_kitchen.jpg"
image_search_queries = ["small worn british kitchen morning light", "dated family kitchen back door"]
entry_from           = "the_front_room"
navigation_order     = ["the_garage"]

[[locations]]
id                   = "the_garage"
name                 = "The Garage"
description          = "Cold, strip-lit, smelling of oil and old carpet. Her father's, or it was — Dean has moved his weights in. Nothing in here belongs to her and both of them know when she comes out."
image                = "locations/the_garage.jpg"
image_search_queries = ["cluttered home garage workbench strip light", "garage weights bench oil stains"]
entry_from           = "the_kitchen"
navigation_order     = []

# ── the corridor — a legitimate satellite, and the vantage on the bathroom ────
[[locations]]
id                   = "the_landing"
name                 = "The Landing"
description          = "Four doors and a airing cupboard. The boards give you away halfway along. From here you can hear the water running, and see whether the bathroom light is on under the door."
image                = "locations/the_landing.jpg"
image_search_queries = ["narrow upstairs landing doors carpet", "house hallway upstairs light under door"]
entry_from           = "the_front_room"
navigation_order     = ["her_room", "the_bathroom", "the_box_room"]

[[locations]]
id                   = "her_room"
name                 = "Her Room"
description          = "Half of it is hers and half of it is storage — her father's weight bench where the desk used to be, boxes of her mother's things nobody has opened. The door catch broke years ago. Nobody fixed it because nobody needed it fixed."
image                = "locations/her_room.jpg"
image_search_queries = ["small bedroom half storage boxes single bed", "cramped box bedroom clutter daylight"]
entry_from           = "the_landing"
navigation_order     = []

# ── the occupancy engine ─────────────────────────────────────────────────────
[[locations]]
id                   = "the_bathroom"
name                 = "The Bathroom"
description          = "One bathroom, four adults. The lock works but the door does not sit flush, and the extractor is loud enough that you do not hear the landing. Whoever is in here, everyone else is waiting."
image                = "locations/the_bathroom.jpg"
image_search_queries = ["small dated british bathroom shower over bath", "cramped family bathroom steamed mirror"]
entry_from           = "the_landing"
navigation_order     = []

# ── the renewable slot ───────────────────────────────────────────────────────
[[locations]]
id                   = "the_box_room"
name                 = "The Box Room"
description          = "Barely a room. Ray rents it out to cover the shortfall, which is how a stranger came to be living on the other side of her wall. Whoever is in it now will be gone by spring, and someone else will be in it."
image                = "locations/the_box_room.jpg"
image_search_queries = ["tiny rented box room single bed suitcase", "small lodger bedroom bare walls"]
entry_from           = "the_landing"
navigation_order     = []

# ── outside: money, and the world that does not know ─────────────────────────
[[locations]]
id                   = "the_shop"
name                 = "The Shop"
description          = "Six-hour shifts on the till of a convenience place ten minutes' walk away. It pays badly and it is the only money that is hers, which for now is the entire point."
image                = "locations/the_shop.jpg"
image_search_queries = ["small convenience shop interior till night", "corner shop aisles fluorescent"]
entry_from           = "the_front_room"
navigation_order     = []


# =============================================================================
# CHARACTERS — 4. Each needs >=1 standing surface and >=1 schedule row (gate 6).
#
# ⚠️ SCHEDULES BIND TO THE [[npcs]] BLOCK ABOVE THEM. Never insert a new
#    character between an existing one and its schedule rows.
# ⚠️ ENGINE LIMIT: requires_npc is a single string (template_import.py:606) and
#    portraits render one card per NPC (v2.py:4939). Two interactive family
#    members CANNOT share a scene. Every scene is her plus exactly one of them.
#    A second body may be narrated in and flag-gated; it cannot be interactive.
# =============================================================================

[[npcs]]
id          = "npc_ray"
name        = "Ray"
description = "Her stepfather, fifty-two. He was the proud one — her name came up at every family thing for two years. He has been alone in this house since her mother went, and he is careful, which is why an inch off him is worth a mile off anyone else."
portrait    = "ray.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["Proud of her", "Careful", "Not saying it", "Not pretending"]

# Mornings: the contested bathroom, before work.
[[npcs.schedules]]
location   = "the_bathroom"
weekdays   = [0, 1, 2, 3, 4]
start_time = "06:30"
end_time   = "07:00"
activity   = "in the bathroom before work"

# Weekends: the same room, later. Found by live play — a weekday-only bathroom
# left the game's core mechanic dead on Saturday and Sunday.
[[npcs.schedules]]
location   = "the_bathroom"
weekdays   = [5, 6]
start_time = "09:30"
end_time   = "10:15"
activity   = "taking his time in the bathroom, no work to get to"

[[npcs.schedules]]
location   = "the_garage"
weekdays   = [0, 1, 2, 3, 4]
start_time = "18:00"
end_time   = "20:00"
activity   = "out in the garage, not doing much"

[[npcs.schedules]]
location   = "the_front_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "20:00"
end_time   = "23:30"
activity   = "in his chair with the telly on"


[[npcs]]
id          = "npc_dean"
name        = "Dean"
description = "Her stepbrother, twenty-seven. He was the disappointment while she was the success, and he has not stopped enjoying that they are level now. He says the quiet thing out loud and watches to see what she does with it."
portrait    = "dean.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["Enjoying it", "Pushing", "Open about it", "Taking it"]

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "08:00"
end_time   = "09:00"
activity   = "eating standing up at the counter"

[[npcs.schedules]]
location   = "the_garage"
weekdays   = [5, 6]
start_time = "14:00"
end_time   = "17:00"
activity   = "on the weights with the radio on"

# ✅ Wraps midnight in ONE row — setup.isCurrentTimeSlot handles it
#    (generators/v2.py, call sites :3448 :3465 :3612).
[[npcs.schedules]]
location   = "the_front_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "23:00"
end_time   = "01:30"
activity   = "up late with the telly down low"

# Third in the morning queue. Ray 06:30-07:00, Cal 07:00-07:40, Dean 07:40-08:00,
# then straight into his kitchen row at 08:00 — three men through one bathroom in
# ninety minutes, and she needs it too. Added because he had no bathroom row at
# all, which meant he could neither be walked in on nor peeped.
[[npcs.schedules]]
location   = "the_bathroom"
weekdays   = [0, 1, 2, 3, 4]
start_time = "07:40"
end_time   = "08:00"
activity   = "in and out of the bathroom in nine minutes flat"


[[npcs]]
id          = "npc_cal"
name        = "Cal"
description = "Her stepbrother, nineteen. Transparently gone on her since the day she got back and completely unable to hide it. The easy rung — she can find out what she is willing to do on someone who will never once say no."
portrait    = "cal.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["Can't look at her", "Looking", "Asking", "Still asking"]

[[npcs.schedules]]
location   = "the_bathroom"
weekdays   = [0, 1, 2, 3, 4]
start_time = "07:00"
end_time   = "07:40"
activity   = "taking far too long in the bathroom"

[[npcs.schedules]]
location   = "the_bathroom"
weekdays   = [5, 6]
start_time = "11:00"
end_time   = "11:50"
activity   = "in the bathroom for the better part of an hour"

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4]
start_time = "07:40"
end_time   = "08:00"
activity   = "eating cereal too fast, late again"

[[npcs.schedules]]
location   = "the_front_room"
weekdays   = [0, 1, 2, 3, 4]
start_time = "16:00"
end_time   = "19:30"
activity   = "sprawled on the sofa with his phone"


# ── THE RENEWABLE SLOT ───────────────────────────────────────────────────────
# Ray rents the box room to cover the shortfall. A stranger inside the house who
# owes her nothing, is owed nothing, and LEAVES. Refilled every few releases —
# a new character at an EXISTING location, which is the measured release shape.
# He works nights, so he is the one person home while the house is empty.
[[npcs]]
id          = "npc_marek"
name        = "Marek"
description = "The lodger. Thirty-something, works nights on the industrial estate, sleeps badly. He is in the house all day while everyone else is out, he owes this family nothing, and in four months he will be somewhere else."
portrait    = "marek.jpg"
core_traits = { relation = 0, lust = 0 }
flag_keys   = []
arc_stages  = ["The lodger", "Around", "Direct", "Nothing to lose"]

[[npcs.schedules]]
location   = "the_box_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "09:00"
end_time   = "16:00"
activity   = "in the box room with the door half open"

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "16:00"
end_time   = "17:30"
activity   = "making something before his shift"


# =============================================================================
# THE WARDROBE — the `exposure` tier made into something she WEARS
#
# `clothing_enabled` is true and the build already renders a Change Clothes link
# at her_room, but with no catalog it did nothing. This turns the emptiest room
# in the house into the exposure system.
#
# Verified condition types this drives: worn_corruption, worn_type, clothing_slot
# (empty/filled — i.e. "not wearing a bra"), clothing_item (equipped/unequipped/
# owned/not_owned). `worn_corruption` is a MAX aggregate across worn items, NOT a
# sum, so one loaded garment sets the reading on its own.
#
# THREE SOURCES, and the source is the story:
#   what she brought back  — her Bristol life, modest, and increasingly a costume
#   what she sleeps in     — the thing she started coming downstairs in
#   her mother's boxes     — unopened for two years, in her room, her size
# =============================================================================

