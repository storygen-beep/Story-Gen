[[canvases]]
id          = "activity_the_walk"
name        = "The walk down"
description = "Repeatable @the_shop, 07:00-21:00. The twenty minutes each way are the only stretch of the day she is outside the house AND outside the shop — the one part of the map nobody in this game can see her in. Bands on exposure: what she leaves the house in when the house is not watching. Room-scoped, names nobody, deliberately cold."

[canvases.trigger]
location      = "the_shop"
is_repeatable = true
priority      = 2
is_active     = true
schedules     = [ { weekdays = [0, 1, 2, 3, 4, 5, 6], start_time = "07:00", end_time = "21:00" } ]
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "arrival_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "Ten minutes each way"
blocks = [
  { type = "paragraph", content = "Ten minutes down and ten minutes back, past the same six front windows, the bus shelter with the panel out of it, and the school gate you went through for seven years. It is the only part of the day that is not a room with somebody in it." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "exposure", operator = "lt", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "You go down the way you would have gone down at seventeen: coat done up, head down at the corner where the lads sit on the wall, walking at the pace of somebody who has decided not to be looked at and has been deciding it since she was thirteen." },
    { type = "paragraph", content = "Nothing happens. Nothing has ever happened on this road. That is not the point of the coat and it never was — the coat is a habit from a city, worn on a road where everybody's mum knows your mum." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "exposure", operator = "gte", value = 35 },
    { type = "trait", subject = "player", trait_key = "exposure", operator = "lt", value = 60 },
  ] } }, blocks = [
    { type = "paragraph", content = "You have stopped doing the coat up. It is a small thing and it took about six weeks and you noticed it on a Tuesday in the reflection of the butcher's window — that you were walking down a road in your own town with your coat open over a vest, at your own pace, not looking at the floor." },
    { type = "paragraph", content = "Nobody on this road wants anything. That is what makes it possible. The whole twenty minutes is the only stretch of the day where being seen costs nothing at all, and you have started walking the long way back to make it thirty." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "exposure", operator = "gte", value = 60 },
  ] } }, blocks = [
    { type = "paragraph", content = "You leave the house in what you were in. That is the whole change and it happened without a decision — one Thursday you went down to do a shift in what you had been wearing in the kitchen, and the house saw you go out the front door in it, and nobody said anything, and you have done it every shift since." },
    { type = "paragraph", content = "The road does not care. Six front windows, the bus shelter, the school gate. A man in a van looks twice at the lights and that is the sum total of eleven weeks of walking down this road, and you find you have been slightly disappointed by that and then slightly appalled at being disappointed." },
    { type = "paragraph", content = "The interesting part is the ten minutes back. You come up the hill at half six knowing exactly who is in and where — Ray in the garage, Cal on the sofa, Dean's van or not — and by the time you get to the gate you have decided which room you are going into first. You do that every single evening now. You did not used to do it at all." },
    { type = "thought_bubble", content = "Twenty minutes a day where nobody in the world wants anything off you. It should be the best part of it. You spend most of it planning the rest." },
  ] },
]

