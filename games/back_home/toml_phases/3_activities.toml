[[canvases.nodes]]
id   = "base"
name = "Six o'clock"
blocks = [
  { type = "paragraph", content = "The van goes past the front window at about ten to and the back door goes at six, and there is a stretch of about forty seconds in between where you can still get out of this room and be on the landing like a person who was on the landing." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "exposure", operator = "lt", value = 40 },
  ] } }, blocks = [
    { type = "paragraph", content = "You take the forty seconds. You are out and across and behind your own door before his boots are off, and you stand there with your back to it listening to a man walk into his room and not notice one single thing about it." },
    { type = "paragraph", content = "Then you feel ridiculous, because it is a rented box room in your father's house and you have not done anything, and you have just hidden from the lodger in your own home." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "exposure", operator = "gte", value = 40 },
    { type = "trait", subject = "player", trait_key = "exposure", operator = "lt", value = 65 },
  ] } }, blocks = [
    { type = "paragraph", content = "You do not take the forty seconds. You stay sitting on the end of his bed and let him find you there, and the finding takes about a second and a half and produces no reaction whatsoever — he puts his bag down, says all right, and starts getting his boots off with you sat two feet away." },
    { type = "paragraph", content = "That is worse than being caught. Being caught would at least have been an event. Instead you are a thing that is in his room at six o'clock, the way the chair is, and he steps round you to get to the window." },
    { type = "thought_bubble", content = "Nobody in this house asks you to explain being anywhere. You have started to wonder whether that is because you belong here or because nobody is looking." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "exposure", operator = "gte", value = 65 },
  ] } }, blocks = [
    { type = "video", props = { pool_dir = "sex/box_room_six_t5", pool = 4, description = "Explicit — a woman undressed on a single bed in a small room as a man comes in from work, evening.", search_queries = ["woman waiting undressed on bed man comes home amateur", "girl naked on bed man enters room evening pov"] } },
    { type = "paragraph", content = "You are on his bed with nothing on when the back door goes, and you stay exactly where you are, and you listen to a man come up a flight of stairs in work boots knowing precisely what is at the top of them." },
    { type = "paragraph", content = "He does not say anything at all. He shuts the door as far as it shuts, gets his hands under your arse and pulls you down the bed by it, and his mouth is on your cunt before he has got his jacket off — twelve hours on the estate and he goes at it like it is the first thing he has wanted all day. Flat of his tongue, then his lips closed round your clit, then two fingers up into you while he keeps working it. One of his hands comes up and takes your tit and stays there, thumb going over your nipple in the same slow time." },
    { type = "paragraph", content = "You get a fistful of his hair and your heels go up over his shoulders and you do not keep quiet, because the house is empty until seven and both of you know the timetable. You come on his tongue with your thighs shut round his head and your back off a mattress four people have slept on, and he stays down there through the whole of it, and only when you let go of his hair does he get up and start on his boots properly." },
    { type = "thought_bubble", content = "Six o'clock. Every day, a man comes home from a twelve-hour shift and the first thing in his room is you. That is not an arrangement any more, and neither of you has anything to call it." },
  ] },
]

[canvases.nodes.exit_block]
