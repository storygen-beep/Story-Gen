[[canvases.nodes]]
id   = "base"
name = "The landing"
blocks = [
  { type = "paragraph", content = "Four feet wide, five doors, and boards that give away everything. Bathroom at the end, box room on the left, your room and the two of theirs, and the stairs going down into the noise of the telly." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "exposure", operator = "lt", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "You have learned it the way you learn a corridor in the dark. Second board from the bathroom, the one outside the box room, the one at the top of the stairs — three that go, and you can get from your door to the bathroom without touching any of them if you take it wide." },
    { type = "paragraph", content = "You take it wide. You take it wide with the robe on over the towel and you are across it in four seconds, and if a door goes while you are out here you are back behind yours before it has finished opening." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "exposure", operator = "gte", value = 35 },
    { type = "trait", subject = "player", trait_key = "exposure", operator = "lt", value = 60 },
  ] } }, blocks = [
    { type = "paragraph", content = "You have stopped taking it wide. Not as a decision — you noticed a fortnight after it had already happened, standing at the top of the stairs in a towel at half seven in the morning with the bathroom occupied and no particular urge to be anywhere else." },
    { type = "paragraph", content = "It is the only room in this house that belongs to nobody. The front room is Ray's chair, the garage is Ray's, the kitchen is whoever is passing through it. Out here there is no chair to be in and no counter to lean on, so nobody can be more entitled to it than you are." },
    { type = "thought_bubble", content = "That is why you keep ending up out here. It is the one place in the building where you are not a guest." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "exposure", operator = "gte", value = 60 },
  ] } }, blocks = [
    { type = "paragraph", content = "The landing is the busiest room in this house now and you are the reason. There is a bathroom at one end and a box room at the other and five doors in between, and at any hour of the day there is a version of standing out here that puts you in somebody's way." },
    { type = "paragraph", content = "You know all three loose boards and you use them now instead of avoiding them. You stand where the light from under the bathroom door lands. You go to the airing cupboard for a towel you do not need at ten to eight. Nobody has said one word about any of it, and the traffic through this landing has roughly doubled since March, and both of those facts are in the same house at the same time." },
    { type = "thought_bubble", content = "Four feet wide. You have made four feet of hallway the busiest part of a building with four men in it, and you have done it without ever once having to say anything out loud." },
  ] },
]

