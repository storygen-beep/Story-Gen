[[canvases.nodes]]
id   = "base"
name = "Milk and a lottery ticket"
blocks = [
  { type = "paragraph", content = "She comes in on a Tuesday again, and then a Thursday, and by the third time it has stopped being a coincidence and neither of you says so. She buys milk she does not need. There is a Co-op four minutes from her house." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "pride", operator = "gte", value = 70 },
  ] } }, blocks = [
    { type = "paragraph", content = "\"Still on for that drink?\" she says, at the counter, with the milk between you. And you say god, yes, definitely, we should sort something — in the voice, the one that means no, the one everybody in this town can hear from forty feet." },
    { type = "paragraph", content = "She hears it. She is not stupid and never was; she was kind, which people confuse with the same thing. She says brilliant, and to text her, and goes." },
    { type = "paragraph", content = "You do not text her. You do not text her the next week either, and the week after that she starts going to the Co-op." },
    { type = "thought_bubble", content = "You cannot do it. Not because of the shop. Because the first question is going to be how are you, and there is no answer to that which is both true and sayable." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "pride", operator = "lt", value = 70 },
    { type = "trait", subject = "player", trait_key = "pride", operator = "gte", value = 40 },
  ] } }, blocks = [
    { type = "paragraph", content = "\"Still on for that drink?\" she says, and this time you say Thursday, and she looks so surprised that the pair of you end up laughing at her face doing it." },
    { type = "paragraph", content = "So there is a Thursday. Two in the Feathers, which has not changed at all and which is somehow the most disorienting thing about the entire evening, and Hannah Beckett is thirty-one now and has a mortgage and a fiancé called Dom who does something with fleet insurance, and she talks for an hour and a half and it is not boring, and that is the part you were not ready for." },
    { type = "paragraph", content = "Then she asks how you are, and you say fine, and she waits — properly waits, the way somebody does when they have decided in advance not to fill the gap — and you tell her about the job going, and the man going, and the coach, and none of the rest of it." },
    { type = "paragraph", content = "\"You always were the one who got out,\" she says. \"I used to be so jealous of you it made me feel sick.\" She means it warmly. It lands like a brick through a window, and you get another round in so that she cannot see your face while you decide what to do with it." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "pride", operator = "lt", value = 40 },
  ] } }, blocks = [
    { type = "paragraph", content = "It is a standing thing now. Every other Thursday in the Feathers, and she is the only person in your life who is not in that house, and the ratio of that has started to worry you at about four in the morning." },
    { type = "paragraph", content = "You have got very good at the version. It goes: back home for a bit, saving up, Dad's got the room, it is fine actually, easier than you would think. All of that is true and it is the shape of a lie, and you can deliver it now without a gap anywhere in it — which took practice, and which you got the practice for at a till, on this side of this counter, saying it to people who were buying crisps." },
    { type = "paragraph", content = "She tells you about the wedding and the fleet insurance and her mother. You tell her the version. Neither of you ever mentions that she now knows exactly what shifts you work and comes in on them, or that the milk is a formality, or that being pitied by somebody kind is the one thing in this entire year you have not found a way to be crude about." },
    { type = "thought_bubble", content = "There is one person alive who thinks you are basically all right. You are going to keep lying to her for as long as she lets you, and it is the only thing in your life at the moment that costs you nothing and takes nothing off you, and you are aware of what that says." },
  ] },
]

