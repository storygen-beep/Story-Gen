name        = "Take the stock hour"
description = "Repeatable @the_shop, 09:00-18:00, once per day, costs 15 energy, pays 12 cash. The room's declared job is `money that is hers`, and until now there was exactly ONE way to get money in this game. This is a second lever on `need` that is not a man — which is what makes the trades elsewhere a choice rather than the only road. Owner NARRATED, never declared (gate 6). Cold."

[canvases.trigger]
location             = "the_shop"
