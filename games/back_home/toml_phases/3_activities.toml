[[canvases.nodes]]
id   = "base"
name = "The garage"
blocks = [
  { type = "paragraph", content = "Four degrees, a strip light with a flicker in it, and the smell of oil and old carpet. There is a chest freezer that stopped working in 2011 and a radio on a shelf that nobody turns off at the plug, so it hums even when it is not on." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "nerve", operator = "lt", value = 35 },
  ] } }, blocks = [
    { type = "paragraph", content = "You came out for the extension lead and you stay eight minutes, which is seven and a half minutes longer than getting an extension lead takes." },
    { type = "paragraph", content = "It is the only room in this house that has not been redecorated since you were at school. The paint is the paint. The shelf brackets are the brackets. There is a tide-mark of your own height in biro on the door frame, four of them, the last from the summer you were fourteen — and then nothing, because after that year nobody in this family measured anything." },
    { type = "paragraph", content = "You put your back against the frame and check. You have not grown. You did not think you had." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "nerve", operator = "gte", value = 35 },
    { type = "trait", subject = "player", trait_key = "nerve", operator = "lt", value = 60 },
  ] } }, blocks = [
    { type = "paragraph", content = "There is a rectangle on the floor where the bench was. Four pads' worth of clean concrete in a garage that is otherwise uniformly filthy, and it has been there since the fortnight your desk went to the tip." },
    { type = "paragraph", content = "You have worked out the order of it standing here. The bench came out of the garage first, then the desk went, then the bench went up the stairs. Two separate afternoons. Somebody carried a weight bench up a flight of stairs into a bedroom and carried a desk down the same flight, past each other, and there is no version of that sequence anybody in this house could explain out loud." },
    { type = "paragraph", content = "You sit on the freezer with your heels against the door and look at the rectangle for a while. The radio hums. It is the only room in the house where you can think about the last two years without somebody coming through it." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "nerve", operator = "gte", value = 60 },
  ] } }, blocks = [
    { type = "paragraph", content = "You come out here on evenings when he is not out here. That took you a while to notice and longer to admit — that the garage has stopped being where Ray is and started being a room, and that you use it." },
    { type = "paragraph", content = "The kettle gets filled for two whether or not you come out. You have checked, twice, going through the kitchen at twenty past six: two mugs on the side, one bag in each. If you do not come out he drinks one and leaves the other, and the other goes cold on the bench next to every other cup of tea that has ever gone cold on that bench." },
    { type = "paragraph", content = "There is no version of this you can say to anybody. Not to Dean, obviously. Not to Marek, who would say the true thing about it in one sentence and be right. Certainly not to Ray, who fills a kettle for two people and has never once mentioned doing it." },
    { type = "thought_bubble", content = "The rectangle is still on the floor. Nobody is ever going to say what the bench is doing in your bedroom, and at some point this year you stopped wanting them to." },
  ] },
]

[canvases.nodes.exit_block]
type = "location"
text = "Go back in."

