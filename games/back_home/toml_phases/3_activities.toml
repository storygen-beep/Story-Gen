[[canvases.nodes]]
id   = "base"
name = "The stock hour"
blocks = [
  { type = "paragraph", content = "There is an hour in the back most days that does not go on the rota. Date-checking, breaking down the cardboard, getting the fridge stock round the front — an hour, twelve quid, out of the till, and it does not appear anywhere except in the notebook by the kettle." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "need", operator = "lt", value = 40 },
  ] } }, blocks = [
    { type = "paragraph", content = "You take it about twice a week. The stock room is the size of the box room and smells of cardboard and bleach, and for one hour nobody can see you from the shop floor, and you can hear the door go and the fridge hum and nothing else." },
    { type = "paragraph", content = "It is the quietest hour of your week. Twelve pounds for the quietest hour of your week is not a bad rate, whatever the arithmetic in the front room says." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "need", operator = "gte", value = 40 },
    { type = "trait", subject = "player", trait_key = "need", operator = "lt", value = 65 },
  ] } }, blocks = [
    { type = "paragraph", content = "You take it every day it is going. Twelve on top of thirty is forty-two, and forty-two twice a week plus a Saturday is the rent without asking anybody in that house for anything at all — and you have run that calculation enough times now to do it without a pen." },
    { type = "paragraph", content = "The stock room has a strip light and a stool and a kettle and a notebook with your hours in somebody else's handwriting. There is no version of this that is a career and there is no version of it that ends anywhere, and it is the only hour in your week where the money and the work are the same size." },
    { type = "thought_bubble", content = "Twelve quid. It would take you thirty-five stock hours to make what forty minutes in the box room makes, and you keep doing the stock hours, and you do not entirely know why and you are not going to interrogate it in a room full of cardboard." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "need", operator = "gte", value = 65 },
  ] } }, blocks = [
    { type = "paragraph", content = "You still take it. That is the thing you would like somebody to explain to you, standing in a stock room at half four breaking down boxes for twelve pounds when there is a man four streets away who has never once said no to a number." },
    { type = "paragraph", content = "The maths stopped working weeks ago. It is not the rent any more — the rent gets paid other ways now and everybody involved knows it — so what the twelve pounds buys is one hour a day in which you are a person doing a job, and it turns out you will pay quite a lot for that. You are, in fact, paying about forty quid an hour for it, in the only currency this year has left you." },
    { type = "paragraph", content = "You date-check the fridge. You flatten the boxes. You put the twelve in the tin under the bed with the rest of the clean money, which is a smaller and smaller proportion of the tin every week, and you do not count the tin any more because you know what counting it would tell you." },
    { type = "thought_bubble", content = "Nine years, the morning woman. She is not in here hiding from anything and neither, officially, are you." },
  ] },
]

