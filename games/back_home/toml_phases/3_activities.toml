#
# ⚠️ THIS ROOM STAYS COLD, AND THAT IS THE DESIGN.
# The Want: "the shop is the one room where no man wants anything from her, and
# that is its entire function." `has_cycling_pool = false` in the ledger,
# traversal heat passes 7/8 without it, and gate 5 wants 60%. Every beat in
# here scores 0 on the explicit floor on purpose — it is the counterweight, and
# a game with no non-sexual texture is its own failure (references/register.md).
#
# ⚠️ ONE-SCENE CHARACTERS ARE NARRATED, NEVER DECLARED. Declaring Hannah as
# [[npcs]] would immediately fail gate 6 (every declared character needs a
# standing surface and a schedule row). That is why she speaks in QUOTED PROSE
# and not in `dialog` blocks — an earlier draft of canvas_someone_who_knew
