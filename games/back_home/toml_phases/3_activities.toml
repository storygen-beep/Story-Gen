id          = "activity_the_landing"
name        = "Stand on the landing"
description = "Repeatable @the_landing. The vantage as a place rather than a corridor. Bands on exposure — at the bottom she is crossing it as fast as the boards allow, at the top it is the most-used room in the house and she is the reason. Names no NPC. Not explicit; the four peeps carry the room's heat and a fifth would be the same beat again."

