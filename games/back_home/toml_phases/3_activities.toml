description = "Repeatable @the_garage, gated on the room being empty. Room-scoped, names no NPC. Bands on nerve: a cold room she has no business in, then the room she has started coming out to, then the only room in the house that is not anybody's. NOT explicit, on purpose — this is the game's cold texture and the counterweight to five rooms of heat."

