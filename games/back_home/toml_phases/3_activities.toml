    { type = "paragraph", content = "So the next one gets whatever the first fortnight gives him. Ray will put a card in the paper shop window and a stranger will carry a bag up these stairs, and inside two weeks there will be a shape to it, and the person who decides that shape is whoever is standing on the landing when he arrives." },
    { type = "thought_bubble", content = "In the spring somebody else will be sitting on that bed. You have started thinking about what you will say to him — in the future tense, which is the first time you have used the future tense about this house at all." },
  ] },
]

