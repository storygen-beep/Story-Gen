priority             = 3
is_active            = true
max_triggers_per_day = 1
costs                = [ { trait = "energy", value = 15 } ]
schedules            = [ { weekdays = [0, 1, 2, 3, 4, 5, 6], start_time = "09:00", end_time = "18:00" } ]
