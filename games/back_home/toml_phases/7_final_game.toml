blocks = [
  { type = "paragraph", content = "It was the box room when you were nine and it is the box room now, and in between it has been four other things to four other people. Ray started letting it the year after your mother went. Nobody in this family has ever once called it lodging out loud; it is *the room*, and there is *somebody in the room*, and that is the whole vocabulary." },
