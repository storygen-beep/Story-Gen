  ] } }, blocks = [
    { type = "paragraph", content = "\"Still on for that drink?\" she says, at the counter, with the milk between you. And you say god, yes, definitely, we should sort something — in the voice, the one that means no, the one everybody in this town can hear from forty feet." },
