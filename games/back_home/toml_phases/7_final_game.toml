    { type = "paragraph", content = "She tells you about the wedding and the fleet insurance and her mother. You tell her the version. Neither of you ever mentions that she now knows exactly what shifts you work and comes in on them, or that the milk is a formality, or that being pitied by somebody kind is the one thing in this entire year you have not found a way to be crude about." },
