# =============================================================================
# Back Home — 1_metadata_and_locations
#
# ⚠️ [player], [[locations]], [[npcs]] and [[npcs.schedules]] MUST share this one
#    file. TOML scoping re-parents nested tables across a file boundary.
#
# THE HOUSE IS ROOMS, NOT ONE LOCATION. Presence and occupancy are per-location
# in this engine, so room-level co-location — the whole engine of a household
# game — only works if the rooms are locations. The landing exists to be the
# VANTAGE the bathroom is peeped from (npc_at_location, v2.py:3480/:4131-4146).
#
# ANCHOR = the_front_room. Evenings are when all three men rotate through it, so
# it carries the most standing content. Gate 1 wants one location holding >=25%
# of location prose — and it must be one the player can reach and re-enter.
# =============================================================================

[player]
id           = "player"
name         = "June"
description  = "Twenty-four, back in her father's house with two bags and no plan."
customizable = false      # deferred: needs [[player.customization_fields]]; v0.1 ships fixed

[player.core_traits]
# layer 1 — ratcheting ascent tiers (rungs at 15/35/55/75)
nerve    = 0
exposure = 0
need     = 0
pride    = 100      # counterweight: what she pays with
# layer 2 — volatile state
arousal  = 0
energy   = 100
hygiene  = 100
money    = 12
# internals
shift_done_today = 0
lodger_slot      = 1

# Decay is a POSITIVE MAGNITUDE — the validator rejects negatives.
[player.trait_decay]
hygiene = 10
energy  = 8


# =============================================================================
# LOCATIONS — 8. One anchor, several satellites, one corridor.
# =============================================================================

