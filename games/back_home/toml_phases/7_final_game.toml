    { type = "paragraph", content = "Then she asks how you are, and you say fine, and she waits — properly waits, the way somebody does when they have decided in advance not to fill the gap — and you tell her about the job going, and the man going, and the coach, and none of the rest of it." },
    { type = "paragraph", content = "\"You always were the one who got out,\" she says. \"I used to be so jealous of you it made me feel sick.\" She means it warmly. It lands like a brick through a window, and you get another round in so that she cannot see your face while you decide what to do with it." },
