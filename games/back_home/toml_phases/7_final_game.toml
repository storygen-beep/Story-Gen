  ] } }, blocks = [
    { type = "paragraph", content = "You can read the tenants off the wall if you stand close enough. Three sets of marks at headboard height, all slightly different, none of them where the current bed is. A rawlplug at picture height that nobody has hung anything on since. A patch of gloss on the sill where somebody stripped it and stopped." },
    { type = "paragraph", content = "The mattress is the same mattress. That is the thing you keep landing on. Ray has changed the tenant four times and never once changed the mattress, and every one of them has slept on it, and one of them is going to be sleeping on it in the spring." },
    { type = "paragraph", content = "You remember two of them. A man called Phil who was in here the summer you were doing your A-levels and who said good morning to you exactly the same way every single day for nine months. And somebody after him whose name has genuinely gone, who left a kettle on the sill and a burn ring on the sill under it, and who you would not recognise in the street." },
    { type = "paragraph", content = "That is what the room does. Somebody lives eighteen inches from your bed for the better part of a year and then stops, and the house closes over it in about a fortnight, and by the summer the only evidence is a mark on a windowsill." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "need", operator = "gte", value = 35 },
    { type = "trait", subject = "player", trait_key = "need", operator = "lt", value = 60 },
  ] } }, blocks = [
    { type = "paragraph", content = "Two hundred a month, cash, first of the month. You have known that number for weeks now and you cannot stop running it against your own — a hundred and twenty a week, to your father, for a room half this size that used to have your desk in it." },
    { type = "paragraph", content = "The difference is that the man in here is buying a room. Whatever it is you are buying, it is not that, and it has never been itemised, and it goes up." },
    { type = "thought_bubble", content = "There is a version of this house where you are the one in the box room paying two hundred and somebody else has your bedroom. You have thought about it more than once and it does not come out worse." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "need", operator = "gte", value = 60 },
  ] } }, blocks = [
    { type = "paragraph", content = "There is one permanent resident on this landing and it is you. Ray is downstairs, Dean and Cal are the other side of the house, and everybody who has ever slept eighteen inches from your bed through a 1974 partition has been somebody passing through — a name for a few months, then a mattress and a set of marks on the wall." },
