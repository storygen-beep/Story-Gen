    { type = "paragraph", content = "And you have worked out, without ever deciding to, that the terms in here get set in the first fortnight. The current one arrived in October and by the middle of November the pair of you had a whole language — the doorway, the not-sitting-on-the-bed, the book going face-down when the boards go — and none of it was negotiated out loud and all of it is still running." },
