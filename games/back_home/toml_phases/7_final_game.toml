    { type = "paragraph", content = "The interesting part is the ten minutes back. You come up the hill at half six knowing exactly who is in and where — Ray in the garage, Cal on the sofa, Dean's van or not — and by the time you get to the gate you have decided which room you are going into first. You do that every single evening now. You did not used to do it at all." },
