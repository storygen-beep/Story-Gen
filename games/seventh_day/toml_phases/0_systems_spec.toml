# =============================================================================
# The Seventh Day — 0_systems_spec
# Built with author-game-v2. Want + board: games/seventh_day/v2_state.json
#
# METERS, THREE LAYERS (references/the-board.md §3):
#   1  RATCHETING TIERS  cover · alone · standing   — rungs at 15/35/55
#   2  VOLATILE STATE    arousal · stress · energy · money
#   3  PER-CHARACTER     relation · lust            — on each [[npcs]] block
#   +  COUNTERWEIGHT     grace — starts at 70, and is TWO-ENDED
#
# ⚠️ GRACE IS NOT A LOCKOUT. High grace opens the unwatched surfaces (sent out
#    alone, handed the keys, believed when she lies). Low grace opens the
#    supervised ones (correction, the wash house, being walked by Ezra). Both
#    ends buy content — the-board.md §3 and gate 10. A purity counterweight is
#    the usual place a "rising must expand" defect enters a game; this one is
#    built so neither direction closes a door without opening another.
#
# ⚠️ THE TOP BAND IS UNBOUNDED AT v0.1 (min = 55, no max). Gate 8 judges the top
#    band's MIN, so v0.1 owes an authored gate at 55 on each of the three tiers
#    and promises nothing above it. The 75 rung named in the board's first draft
#    is DEFERRED for exactly this reason — a min = 75 top band would owe three
#    more ladders of content on the day it ships. Logged in the ledger.
# =============================================================================

schema_version = "1.0"

[project]
id              = "seventh_day"
title           = "The Seventh Day"
description     = "Fourteen people, sixty acres, and a list of rules on the hall wall that gets read out at breakfast. You are the third daughter. You have never had a room, never held money that was yours, and never been alone with any of them."
starting_canvas = "canvas_opening"
quests_engine   = "v2"
version         = "0.1"

[time]
starting_hour = 5          # the wash-house rota starts before light
starting_day  = "Monday"   # six days before the first reading
starting_week = 1

[settings]
narration_person  = "second"          # IMMUTABLE once v0.1 ships
clothing_enabled  = true
wardrobe_location = "the_girls_room"  # the shared press, which is not hers either

# ─── The tithe — the ENGINE under everything ─────────────────────────────────
# She owns nothing, so the obligation IS the taboo: holding money of her own is
# already a broken rule, and keeping any of it means lying at the reading, which
# costs grace. Money and grace are one loop, not two systems (the-economy.md R3).
#
# ⚠️ engine.md §26 — THE ENGINE TAKES THE MONEY. There is no authored canvas in
#    this game that narrates handing the tin over. A shipped game wrote one, and
#    its written settle-up charged nothing while [settings.rent] charged
#    correctly three passages away — so the player met two collections, and the
#    free one was the one with the writing in it. The prayer-room scenes here sit
#    BESIDE the charge: the ask before it, the aftermath after it.
#
# ⚠️ `due_day` takes weekday NAMES only (template_import.py:4786). The seventh
#    day of a week that starts Monday is Sunday.
#
# ⚠️ start_after_flag — the demand does not arm until she has held a coin. An
#    obligation armed before she can earn is a scripted loss, not a choice.
#
# ⚠️ eviction_mode = "flag_set", NOT the default "game_end". The product never
#    ends. Failing the reading sets `under_correction`, which is the low end of
#    the counterweight — it opens the supervised content instead of stopping the
#    game.
[settings.rent]
enabled          = true
amount           = 20
due_day          = "Sunday"
collector_npc    = "npc_amos"
grace_periods    = 1
start_after_flag = "first_coin"
eviction_mode    = "flag_set"
eviction_flag    = "under_correction"
currency_symbol  = "£"

[settings.rent.text]
title            = "The Reading"
scene            = "He reads the seventh rule last, the way he always does, and then he does not close the book. He puts it face down on the stand and picks the tin up off the shelf behind him, and the room goes quiet in the particular way it goes quiet once a week. He starts at the far end of the bench. By the time the tin reaches you everybody who has already put something in is looking at their hands."
greeting         = "Nothing is yours in this house. That is the whole of it."
paid_scene       = "You put it in. It goes on top of what the others put in and it makes the same sound theirs made, and he does not look down at the tin and he does not look up at you either. He moves on to Job."
paid_response    = "Good girl."
paid_closing     = "The tin goes back on the shelf behind the reading stand where everyone can see it and nobody can reach it. He picks the book up again and finds his place, and the seventh day carries on the way it does."
cant_pay         = "You haven't got it."
warning_scene    = "The tin stops in front of you. You say there was nothing this week. He holds it there a moment longer than he needs to — long enough for Ruth to look up from the end of the bench — and then he sets it down on the arm of the stand and leaves it there for the rest of the reading, open, at your eye level."
warning_response = "Then we will say it was a thin week. Once."
warning_closing  = "Afterwards he does not mention it. Ruth does not mention it either, which is worse, and Ezra walks past the girls' room twice that night instead of once."
eviction_scene_soft    = "The second seventh day he does not bring the tin to you at all. He carries it down the bench, past your knees, and hands it to Job as though you were not sitting there, and then he goes back to the stand and turns a page and reads the seventh rule again from the beginning, slowly, to the room."
eviction_response_soft = "The rule is for the ones who are still inside it."
eviction_closing_soft  = "Nobody says the word. But the rota goes up on Monday with your name against the wash house every day of the week, and Ezra's name against yours, and neither of those things has ever been an accident in this house."

[theme]
mode = "dark"


# ═════════════════════════════════════════════════════════════════════════════
# THE ASCENT TIERS
#
# Three kinds of going-further, so a player who does not want one can still climb
# another. Rungs at 15/35/55, the ladder measured off the reference game.
#
# Band text is UI VOICE (references/the-voice.md R1): it names a state plainly and
# never performs. The register lives in the paragraph after the click, never in
# the rail.
# ═════════════════════════════════════════════════════════════════════════════

[[sidebar_items]]
type  = "trait_status_text"
trait = "cover"
bands = [
  { min = 0,  max = 14, text = "Long dress, hair pinned" },
  { min = 15, max = 34, text = "Apron off, sleeves up" },
  { min = 35, max = 54, text = "Down to the shift" },
  { min = 55, text = "Nothing under it" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "alone"
bands = [
  { min = 0,  max = 14, text = "Never alone with a man" },
  { min = 15, max = 34, text = "Alone, where it can be seen" },
  { min = 35, max = 54, text = "Behind a shut door" },
  { min = 55, text = "Out at night with them" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "standing"
bands = [
  { min = 0,  max = 14, text = "Third daughter" },
  { min = 15, max = 34, text = "Keeper of the kitchen" },
  { min = 35, max = 54, text = "Keeper of the keys" },
  { min = 55, text = "The market run is yours" },
]

# The counterweight. TWO-ENDED — read the header at the top of this file. It has
# gates in both directions on purpose, and it is declared as the counterweight in
# v2_state.json so gate 10 judges the three tiers above and not this one.
[[sidebar_items]]
type  = "trait_status_text"
trait = "grace"
bands = [
  { min = 0,  max = 24, text = "Under correction" },
  { min = 25, max = 49, text = "Watched" },
  { min = 50, max = 74, text = "Trusted with the day" },
  { min = 75, max = 100, text = "Above suspicion" },
]

# ─── The next step in the rail (engine.md §23) ───────────────────────────────
# The band strings above name a STATE. This names a STEP. A player who never
# opens the guidance page otherwise has no place, no verb and no person anywhere
# in the persistent chrome.
[[sidebar_items]]
type = "quest_next"
max  = 3


# ─── Day-rollover hook ───────────────────────────────────────────────────────
# The day-caps. the-economy.md R5 and the climb gate both refuse a rung that can
# be clicked without limit: being behind a tier gate is not a cap, because the
# tier is bought once and the rung repeats forever. Each capped rung sets its
# flag on the HUB CHOICE (engine.md §16 — a flag read by a choice must be set
# from a LOCATED canvas, and a triggerless rung has no location), and this hook
# clears them all at the day rollover.
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "market_run_today",    op = "unset" },
  { targetType = "player", flag = "ate_apart_today",     op = "unset" },
  { targetType = "player", flag = "asked_rota_today",    op = "unset" },
  { targetType = "player", flag = "crossed_shift_today", op = "unset" },
]

# ─── Trait labels ────────────────────────────────────────────────────────────
# ⚠️ THE FOUR TIERS ARE DECLARED HIDDEN. A trait banded with trait_status_text
#    that is not hidden renders BOTH the band word and the raw number — the
#    sidebar says "Down to the shift" and "cover 38" one under the other. Gate 27
#    / engine.md §30. The band is the UI; the number is bookkeeping.
[[traits.labels]]
key    = "cover"
hidden = true

[[traits.labels]]
key    = "alone"
hidden = true

[[traits.labels]]
key    = "standing"
hidden = true

[[traits.labels]]
key    = "grace"
hidden = true

[[traits.labels]]
