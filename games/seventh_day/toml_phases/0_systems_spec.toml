label = "Rested"

[[traits.labels]]
key   = "money"
label = "Kept back"

[[traits.labels]]
key   = "stress"
label = "Nerves"

# Internals — never surfaced to the player.
[[traits.labels]]
key    = "arousal"
hidden = true

[[traits.labels]]
key    = "eggs_today"
hidden = true

[[traits.labels]]
key    = "mending_today"
hidden = true


# ═════════════════════════════════════════════════════════════════════════════
# GUIDANCE — [[quest_cards]] (engine.md §23; the-voice.md R2/R3/R5)
#
# ⚠️ NO `version = "1.0"` ON A QUEST CARD. Quest conditions use a separate
#    evaluator with no fail-open (checkQuestsCondition, v2.py:14878).
#
# Tier cards carry no npc_id. A v2 game has no mission, so the top of the page IS
# the three ladders. Stepped bands, gte + lt, exactly one live at a time.
#
# Every goal label names a PLACE and a VERB, and a WINDOW where the step is
# schedule-gated (R3). The number is already in the sidebar; what the player
# cannot see is which click moves it.
#
# ⚠️ Each card names a click gated ONE TIER BELOW its own goal, never at the value
#    the card is trying to reach. A shipped game made all three cards of one
#    ladder circular that way and nothing in gates.py catches it.
#
# The >=55 card on each tier is the HONEST WALL: no goal bullet, reads forward.
# Every character ladder ends on `terminal = true` or the whole character vanishes
# from the page at the moment they become permanent sandbox content (R5).
# ═════════════════════════════════════════════════════════════════════════════

# ── COVER ────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 10
text     = "The rule is on the wall in the hall and it is the fourth one down: the daughters of this house go covered. Long dress, sleeves to the wrist, hair up before you come down."
tip      = "The wash house is the one place the rules require you undressed. Work the rota there and stop hurrying."
when     = [ { trait = "cover", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "cover", subject = "player", op = "gte", value = 15, label = "Take the wash-house rota and don't rush it — the wash house, mornings" } ]

[[quest_cards]]
priority = 10
text     = "Apron off, sleeves pushed up past the elbow, and the top button undone in the heat of the kitchen — none of it against the letter of anything, and all of it noticed."
tip      = "The copper runs hot and the wash house door does not hold. Wash there in the afternoon, when the yard is working."
when     = [ { trait = "cover", subject = "player", op = "gte", value = 15 },
             { trait = "cover", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "cover", subject = "player", op = "gte", value = 35, label = "Wash with the door unlatched — the wash house, afternoons" } ]

[[quest_cards]]
priority = 10
text     = "Down to the shift, which is what the rule actually permits when you read it properly, and which was never written by anyone who had seen linen wet."
tip      = "Cross the yard in it instead of changing first. Ezra walks the property from ten."
when     = [ { trait = "cover", subject = "player", op = "gte", value = 35 },
             { trait = "cover", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "cover", subject = "player", op = "gte", value = 55, label = "Cross the yard in the shift after dark — the yard, nights" } ]

[[quest_cards]]
priority = 10
text     = "You go about this house in a shift with nothing under it and nobody has read the fourth rule out at breakfast in three weeks. What is further than this is the market run, and that is Warrick's to give."
when     = [ { trait = "cover", subject = "player", op = "gte", value = 55 } ]

# ── ALONE ────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 11
text     = "The sixth rule: no daughter of this house is alone with a man who is not her husband, and no door in this house is shut on two people."
tip      = "The rows are work, and work is not being alone. Take the far end where the hedge is, with whoever is on the rota."
when     = [ { trait = "alone", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "alone", subject = "player", op = "gte", value = 15, label = "Work the top end of the rows with one of them — the vegetable rows, afternoons" } ]

[[quest_cards]]
priority = 11
text     = "Alone with one of them, in the open, where anybody crossing the yard could count you — which is the letter of the rule kept and the whole of it broken."
tip      = "Warrick works the barn all day and the barn is not the yard. Take him something and stay."
when     = [ { trait = "alone", subject = "player", op = "gte", value = 15 },
             { trait = "alone", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "alone", subject = "player", op = "gte", value = 35, label = "Stay in the barn with Warrick after the work is done — the barn, days" } ]

[[quest_cards]]
priority = 11
text     = "Behind a shut door, which is the rule broken in the only way the rule actually meant."
tip      = "Ezra sleeps up the ladder and nobody goes up it by accident. Go up it on purpose."
when     = [ { trait = "alone", subject = "player", op = "gte", value = 35 },
             { trait = "alone", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "alone", subject = "player", op = "gte", value = 55, label = "Go up the ladder to Ezra after lights — the barn loft, nights" } ]

[[quest_cards]]
priority = 11
text     = "You are out at night with them and the hall knows it. The one door on this property that has a bolt on the inside is your parents', and it is bolted from the inside."
when     = [ { trait = "alone", subject = "player", op = "gte", value = 55 } ]

# ── STANDING ─────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 12
text     = "Third daughter. You are on the rota, you are not on the board that makes it, and every coin that passes through your hands is counted into a tin on Sunday."
tip      = "Ruth writes the rota at the long table before six. Be down before she is and have the range lit."
when     = [ { trait = "standing", subject = "player", op = "lt", value = 15 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 15, label = "Get the range lit before Ruth comes down — the long kitchen, before six" } ]

[[quest_cards]]
priority = 12
text     = "Keeper of the kitchen: you set the table, you serve the head of it, and the rota has started asking you who can be spared instead of telling you."
tip      = "The pantry key hangs on a hook in Warrick's room. There is a ledger under it that does not add up."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 15 },
             { trait = "standing", subject = "player", op = "lt",  value = 35 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 35, label = "Take the pantry ledger off the hook and read it — Warrick's room, evenings" } ]

[[quest_cards]]
priority = 12
text     = "Keeper of the keys. The pantry is yours, the ledger is yours, and what goes into the tin on Sunday is a number you now write down before he counts it."
tip      = "The truck leaves the yard for Cowan on market day and Warrick has driven it alone for nine years."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 35 },
             { trait = "standing", subject = "player", op = "lt",  value = 55 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 55, label = "Ride the truck to Cowan with Warrick — the yard, market day" } ]

[[quest_cards]]
priority = 12
text     = "The market run is yours and the gate opens for you without anybody being asked. What is past the gate is a road, and the road is a future update."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 55 } ]


# ═════════════════════════════════════════════════════════════════════════════
# CHARACTER LADDERS
#
# `npc_id` on a card routes it into that character's section
# (template_import.py:1004-1006), and pickQuestsCard returns the SINGLE
# highest-priority match — so a character's cards are a one-live-at-a-time chain.
#
# ⚠️ EVERY LADDER ENDS ON `terminal = true`. Without it the character's whole
#    section disappears from the page at the exact moment their arc closes and
#    they become permanent sandbox content the player can still go and use (R5).
#    A goal-less non-terminal card draws no frame at all and reads as an
#    objective with nothing ticked (engine.md §23).
#
# ⚠️ EXACTLY ONE CARD IN THIS GAME SETS `terminal_text` — it is the badge form of
#    the build-boundary rule, and it is on Ezra, because he is the character the
#    Want's deletion test names.
# ═════════════════════════════════════════════════════════════════════════════

# ── EZRA — the one whose job is to stop her ──────────────────────────────────
[[quest_cards]]
priority = 20
npc_id   = "npc_ezra"
text     = "Your brother walks the property from ten at night until he is satisfied, and he has never once said what he is looking for. He checks the wash house latch. He checks it whether or not anybody is in there."
tip      = "Be in there when he checks it. He will not knock, because knocking would mean admitting he expected somebody."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_ezra", op = "lt", value = 20 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_ezra", op = "gte", value = 20, label = "Be in the wash house when he checks the latch — the wash house, after ten" } ]

[[quest_cards]]
priority = 20
npc_id   = "npc_ezra"
text     = "He caught you and he did not report it, and that is a thing he now has to carry every time he passes you the bread. He walks past the girls' room twice a night instead of once."
tip      = "The ladder to the loft is the only door in this house nobody goes through by accident. Go up it."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_ezra", op = "gte", value = 20 },
             { trait = "relation", subject = "npc", npc_id = "npc_ezra", op = "lt",  value = 45 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_ezra", op = "gte", value = 45, label = "Go up the ladder to him after lights — the barn loft, nights" } ]

[[quest_cards]]
priority = 20
npc_id        = "npc_ezra"
terminal      = true
terminal_text = "As far as he goes in this build — the walk continues in the next release"
text          = "He still walks the property every night at ten. What he is checking for now is whether you are already up there, and both of you have stopped pretending otherwise."
when          = [ { trait = "relation", subject = "npc", npc_id = "npc_ezra", op = "gte", value = 45 } ]

# ── AMOS — every rule is in his voice ────────────────────────────────────────
[[quest_cards]]
priority = 21
npc_id   = "npc_amos"
text     = "Your father reads the rules out at breakfast and again at the reading, and in between he does not speak much. He is at the head of the long table for every meal of your life."
tip      = "He notices who lights the range. Be down before Ruth and be the one who hands him his cup."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_amos", op = "lt", value = 20 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_amos", op = "gte", value = 20, label = "Hand him his cup before anyone is down — the long kitchen, before six" } ]

[[quest_cards]]
priority = 21
npc_id   = "npc_amos"
text     = "He has started reading the fourth rule looking at the book instead of at the room, which is new, and which everybody at that table has noticed except possibly him."
tip      = "The prayer room is empty after the reading and he stays in it. Go back in."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_amos", op = "gte", value = 20 },
             { trait = "relation", subject = "npc", npc_id = "npc_amos", op = "lt",  value = 45 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_amos", op = "gte", value = 45, label = "Go back into the prayer room after the reading — the prayer room, evenings" } ]

[[quest_cards]]
priority = 21
npc_id   = "npc_amos"
terminal = true
text     = "He reads the rules out the same way he always has, in the same voice, to the same fourteen people. Nothing about the reading has changed and everything else has."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_amos", op = "gte", value = 45 } ]

# ── WARRICK — the only one who leaves ────────────────────────────────────────
[[quest_cards]]
priority = 22
npc_id   = "npc_warrick"
text     = "Your uncle runs the barn and drives the truck, and he is the only person on this property who has seen a town in the last month. He talks to you like you are in the world instead of on it."
tip      = "He works the barn all day. Take him something out and then do not go straight back."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_warrick", op = "lt", value = 20 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_warrick", op = "gte", value = 20, label = "Take his dinner out and stay in the barn — the barn, days" } ]

[[quest_cards]]
priority = 22
npc_id   = "npc_warrick"
text     = "He keeps the pantry key on a hook in his room and a ledger under it, and he has started leaving the door open when he knows you are in the kitchen."
tip     = "His room is behind the kitchen. Go in when the house is at the reading."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_warrick", op = "gte", value = 20 },
             { trait = "relation", subject = "npc", npc_id = "npc_warrick", op = "lt",  value = 45 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_warrick", op = "gte", value = 45, label = "Go into his room while the house is at the reading — Warrick's room, evenings" } ]

[[quest_cards]]
priority = 22
npc_id   = "npc_warrick"
terminal = true
text     = "The truck goes to Cowan on market day with two people in it now, and Amos has not asked about it once, which tells you what Warrick told him."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_warrick", op = "gte", value = 45 } ]

# ── SILAS — married in, still outside ────────────────────────────────────────
[[quest_cards]]
priority = 23
npc_id   = "npc_silas"
text     = "Your sister's husband came from another household two years ago and has been on trial ever since. Everyone in this house watches him for signs. You are the one who does not."
tip      = "He works the rows every afternoon and nobody talks to him out there. Take the next row over."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_silas", op = "lt", value = 20 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_silas", op = "gte", value = 20, label = "Work the row next to his and talk to him — the vegetable rows, afternoons" } ]

[[quest_cards]]
priority = 23
npc_id   = "npc_silas"
text     = "He has started coming up the rows to where you are working instead of waiting for you to come down them, which anybody standing in the yard could see and nobody has said."
tip      = "The caravan is across the yard and Miriam is in the kitchen until eight. Go over."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_silas", op = "gte", value = 20 },
             { trait = "relation", subject = "npc", npc_id = "npc_silas", op = "lt",  value = 45 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_silas", op = "gte", value = 45, label = "Go to the caravan while Miriam is in the kitchen — the caravan, evenings" } ]

[[quest_cards]]
priority = 23
npc_id   = "npc_silas"
terminal = true
text     = "He is still on trial with everybody in this house except you, and he has worked out that the two facts are the same fact."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_silas", op = "gte", value = 45 } ]

# ── RUTH — she knows first, and says nothing ─────────────────────────────────
[[quest_cards]]
priority = 24
npc_id   = "npc_ruth"
