# =============================================================================
# The Seventh Day — 2_one_shots
#
# THE OPENING FUNNEL. Linear, one-shot, and it ends by releasing her into the
# yard with the whole map open.
#
# ⚠️ ONE CANVAS, FIVE NODES — not five canvases. engine.md §16: a flag read by a
#    TRIGGER or a CHOICE must be SET from a LOCATED canvas, and a triggerless
#    canvas has no location, so the game has no way to tell the player where to
#    go and earn it. Built as five linked canvases first and the flag-chain
#    validator hard-failed the build on `rota_running`, correctly. The funnel is
#    therefore one canvas with a trigger at the girls' room and the chain runs
#    node to node inside it.
#
# ⚠️ THE FIRST EXPLICIT BEAT IS IN THIS FUNNEL, two clicks from free roam
#    (the-release.md § first release), and it is in the WASH HOUSE — the surface
#    the Want names as carrying the crudest writing in the game. So the game's
#    first explicit beat is at the place the player returns to most, not sealed
#    in an intro they see once.
#
# ⚠️ The funnel teaches the SEVEN RULES, because the rules are this game's
#    renewable content supply. A player who leaves it without knowing what the
#    fourth and sixth rules say cannot read any surface in the game.
#
# ⚠️ MILESTONE (gate 7) — the last node names what it turns on:
#      `rota_running` → every standing surface in 3_activities and 5_scenes
#      `first_coin`   → arms [settings.rent], so the first reading has teeth
#
# ⚠️ Every dialog and thought_bubble carries props.speaker (engine.md §25).
# =============================================================================

[[canvases]]
id          = "canvas_opening"
name        = "The Seventh Day"
description = "Opening. Monday, 05:00, the girls' room. Linear, one canvas, five nodes. Establishes: no room and no door, the seven rules on the hall wall, the rota that decides where her body is at every hour, the wash house and the latch that does not hold, and the first coin she has ever held. SETS rota_running and first_coin."

[canvases.trigger]
location      = "the_girls_room"
is_repeatable = false
priority      = 12
is_active     = true


# ── 1 · before light ─────────────────────────────────────────────────────────
[[canvases.nodes]]
id   = "the_curtain"
name = "Before light"
blocks = [
  { type = "image", props = { file = "scenes/opening_girls_room.jpg", description = "Four iron cots in a bare attic room before dawn, a curtain on a wire down the middle.", search_queries = ["dark dormitory iron beds dawn curtain", "bare attic bedroom cots early morning"] } },
  { type = "paragraph", content = "Five in the morning and the wire above you gives, the way it does, and the curtain slides eight inches down the room. You are awake before it finishes moving. You have been awake since four." },
  { type = "paragraph", content = "Three cots down, Naomi turns over. The window has not shut properly since before you were born. Your name is on the slate for the wash house, which means you are up first and the copper is your problem." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Twenty-one years in this room. You have never once shut a door on yourself in it." },
]
exit_block = { type = "choices", choices = [
  { text = "Get up before the others.", targetType = "node", nodeId = "the_rules" },
] }


# ── 2 · the landing — THE SEVEN RULES ────────────────────────────────────────
[[canvases.nodes]]
id   = "the_rules"
name = "Seven of them on the wall"
blocks = [
  { type = "image", props = { file = "scenes/opening_rules_board.jpg", description = "A framed handwritten list of seven rules on a dim stairway wall.", search_queries = ["framed handwritten list old wall stairway", "hand lettered rules board dark hallway"] } },
  { type = "paragraph", content = "The list is at the turn of the stair where you cannot get past it. Seven of them, in your father's hand, in a frame he made. You could say all seven with your eyes shut and you read them anyway, every morning, because that is what they are for." },
  { type = "cascade", props = { beats = [
    { advance_text = "The fourth.", blocks = [
        { type = "paragraph", content = "FOUR. The daughters of this House go covered. Long dress, sleeve to the wrist, hair up before you come down. It does not say what happens to the rule in a room where the rules require you undressed. Nobody has ever asked." },
    ] },
    { advance_text = "The sixth.", blocks = [
        { type = "paragraph", content = "SIX. No daughter is alone with a man not her husband. No door is shut on two. He wrote that one last and the ink is heavier, which means he thought about it longer." },
    ] },
    { advance_text = "The seventh.", blocks = [
        { type = "paragraph", content = "SEVEN. Nothing is yours. What passes through your hands goes in the tin on the seventh day. There is no rule for what happens if it does not, because until now there has never needed to be." },
    ] },
  ] } },
]
exit_block = { type = "choices", choices = [
  { text = "Down to the kitchen.", targetType = "node", nodeId = "the_rota" },
] }


# ── 3 · the kitchen — Ruth, and the rota ─────────────────────────────────────
[[canvases.nodes]]
id   = "the_rota"
name = "Monday"
blocks = [
  { type = "image", props = { file = "scenes/opening_kitchen_rota.jpg", description = "A woman writing at the end of a long farmhouse table before dawn, one lamp lit.", search_queries = ["woman writing long kitchen table lamp dawn", "farmhouse kitchen early morning single lamp"] } },
  { type = "paragraph", content = "Your mother is at the end of the long table with the lamp pulled over and the week in front of her. Monday. She writes it out fresh every Monday and nobody has ever asked her to explain a line of it." },
  { type = "paragraph", content = "The range is cold. It should not be cold. You get the door open and the kindling in before she has finished the second column. She does not look up, and she does not stop writing either." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ruth" }, content = "Wash house. You, all week." },
  { type = "dialog", props = { speaker = "player" }, content = "All week?" },
