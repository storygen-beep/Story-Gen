[[canvases.nodes]]
id   = "base"
name = "Who else is on it"
blocks = [
  { type = "paragraph", content = "Chalk on slate, screwed to the outside of the door, and it is the only public document on this property apart from the seven rules. Ruth writes it Monday and it does not change." },
  { type = "paragraph", content = "You, every day this week, first. Ruth after you at nine, when the copper is at its hottest and she knows it. Miriam Thursday. The boys Saturday, together, which is a thing nobody has ever remarked on." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Your name in the same square seven times. Hers in the square after yours, seven times." },
  { type = "cascade", props = { beats = [
    { advance_text = "Your column.", blocks = [
        { type = "paragraph", content = "Chalk on slate, screwed to the outside of the door, and it is the only public document on this property apart from the seven on the wall." },
    ] },
    { advance_text = "Hers under yours.", blocks = [
        { type = "paragraph", content = "You first, every day this week. Ruth at nine, every day, when the copper is at its hottest and she has known exactly how hot that is for twenty-six years." },
    ] },
    { advance_text = "The rest of the week.", blocks = [
        { type = "paragraph", content = "Miriam on Thursday. The boys together on Saturday. Nobody against Sunday at all, because on the seventh day this house does not wash." },
    ] },
  ] } },
  { type = "cascade", props = { beats = [
    { advance_text = "Who wrote it.", blocks = [
        { type = "paragraph", content = "Ruth writes the slate on a Monday with the same chalk she writes the rota with, and screws it back on the outside of the door, where anybody crossing the yard reads it without meaning to." },
    ] },
    { advance_text = "Count the hours.", blocks = [
        { type = "paragraph", content = "An hour each and seven of you through it before noon. The copper takes an hour to come up and holds until midnight, which means every name after the third is washing in water somebody else has used." },
    ] },
    { advance_text = "Except the first.", blocks = [
        { type = "paragraph", content = "The first name gets the whole copper and the whole hour and the yard still dark. That is the name in your handwriting-shaped square, seven times, first, every day this week." },
