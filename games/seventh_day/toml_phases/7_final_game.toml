# =============================================================================
# The Seventh Day — 4_story_arc
#
# THE MILESTONE LAYER. v0.1 shipped with exactly ONE one-shot in the whole game
# (the opening funnel), so every tier crossing happened silently: the meter
# passed a number and a rung quietly appeared on a menu. Nothing ever marked it.
#
# HOW A MILESTONE FIRES — there is no special key for it.
# `setup.selectAutoFireCanvasForLocation` (generators/v2.py:4453-4473) picks the
# HIGHEST-PRIORITY NON-REPEATABLE canvas at the location whose conditions pass,
# and the location passage redirects to it (v2.py:9617). So the mechanism is
# just: `is_repeatable = false` + a location + conditions + priority. They are
# considered BEFORE random events, so a milestone always wins over an ambient.
#
# ⚠️ MILESTONES SET FLAGS AND STAGES. THEY DO NOT GRANT METERS. Written that way,
# then violated on the first pass — two of them granted grace and relation, and
# the climb gate immediately counted both as free farmable grantors. Stripped. Two reasons that agree:
#   · gate 7 requires every milestone to name the standing content it turns on,
#     and a flag that gates a rung is exactly that;
#   · the climb gate counts one-shots as farmable regardless of is_repeatable
#     (ENGINE_NOTES.md finding #5), so a tier-granting milestone would amplify a
#     known gate bug. A flag avoids both.
#
# They also ADVANCE ARC STAGES. Every NPC declared four of them and nothing in
# v0.1 could move any, so all six sat on stage 0 forever — the same dead-
# declaration class as the eggs_today counter nothing read. Stages live as
# `<slug>_stage` on player.core_traits (template_import.py:1366-1373).
#
# ⚠️ Only ONE milestone per location, or the lower-priority one never fires.
# =============================================================================


