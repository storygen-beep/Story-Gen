# ── kitchen rungs ────────────────────────────────────────────────────────────

[[canvases]]
id          = "rung_kitchen_range"
name        = "The range"
description = "Triggerless rung, room-scoped. THE STANDING 15 FEEDER — the guidance card for the first standing band names this click. +2 standing, -5 energy, 40 min."

[[canvases.nodes]]
id   = "base"
name = "Lit before she is down"
blocks = [
  { type = "paragraph", content = "Ash out, kindling in, and the flue open two turns until it draws. It takes forty minutes and you have to be up at four to do it, which is why nobody else does." },
  { type = "paragraph", content = "Ruth comes down at five to a range that is already going and a kettle already on. She stops in the doorway for a second before she says anything." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ruth" }, content = "You have been up." },
  { type = "dialog", props = { speaker = "player" }, content = "Somebody has to be." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ruth" }, content = "Yes. It has always been me." },
  { type = "cascade", props = { beats = [
    { advance_text = "Get the ash out first.", blocks = [
        { type = "paragraph", content = "The ash pan is full and it is always full because emptying it is nobody's job. You take it out to the step in your nightdress at ten past four and tip it on the heap. Your breath goes in the dark." },
    ] },
    { advance_text = "Lay it properly.", blocks = [
        { type = "paragraph", content = "Paper, then kindling crossed, then the small split stuff. Flue open two turns. It is not difficult and there is not one other person in this house who can do it, because there has never been a reason for them to learn." },
    ] },
    { advance_text = "Wait for it to draw.", blocks = [
        { type = "paragraph", content = "You sit on the fender with your knees up under the nightdress and wait for the flue to pull. Four minutes. The iron comes up warm against your back and the room goes from black to grey around you." },
    ] },
    { advance_text = "She is in the doorway.", blocks = [
        { type = "paragraph", content = "Ruth stops in the doorway. She has come down at five to a cold range every morning for twenty-six years and this morning she has not. She stands there long enough for it to be a thing that happened." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Put the kettle across.", config = { destinationType = "specific", locationId = "the_long_kitchen", time_progression_minutes = 40, effects = [
  { targetType = "player", trait = "standing", op = "add", value = 2, clamp = true },
  { targetType = "npc", npcId = "npc_ruth", trait = "relation", op = "add", value = 2, clamp = true },
] } }


[[canvases]]
id          = "rung_kitchen_rota"
name        = "The rota board"
description = "Triggerless rung, room-scoped. The player's schedule reference, in fiction — where everybody is this week. This is how the game teaches its own presence grid without a tutorial page. +1 standing, 10 min."

[[canvases.nodes]]
id   = "base"
name = "The week"
blocks = [
  { type = "paragraph", content = "Rows down and days across, in her hand, and nobody has ever asked her to explain a line of it. Wash house: you, all week, first. Rows: Silas, all week, and whoever else she feels like sending up there." },
  { type = "paragraph", content = "Barn: Warrick, and Ezra from one. Kitchen: her, all day, every day, the way it has said for twenty-six years. Saturday has the truck against Warrick's name and nothing against anybody else's." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "One line on this board is the difference between a day with him in it and a day without. She writes it on a Monday and nobody checks." },
  { type = "cascade", props = { beats = [
    { advance_text = "Read down the wash-house column.", blocks = [
        { type = "paragraph", content = "Your name seven times, first every day. Hers under yours at nine, every day. Miriam on Thursday. The boys together on Saturday, which is a thing that has been true your whole life and which nobody has ever said a word about." },
    ] },
    { advance_text = "Read across the barn row.", blocks = [
        { type = "paragraph", content = "Warrick all week. Ezra from one o'clock. Nothing against the loft, because the loft is not a place the board admits exists, and Ezra has slept up that ladder for four years." },
    ] },
    { advance_text = "Look at Saturday.", blocks = [
        { type = "paragraph", content = "The truck, against Warrick's name, and nothing against anybody else's. Nine years of Saturdays in the same handwriting. One line. It would take her four seconds to write a second name under it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Turn away from it.", config = { destinationType = "specific", locationId = "the_long_kitchen", time_progression_minutes = 10, effects = [
  { targetType = "player", trait = "standing", op = "add", value = 1, clamp = true },
] } }


[[canvases]]
