        { type = "dialog", props = { speaker = "npc", npcId = "npc_ruth" }, content = "Because I worked out he was not going to send me out, and I could not think of a single thing I would do about that." },
    ] },
    { advance_text = "And the rota.", blocks = [
        { type = "paragraph", content = "She started writing it the following spring. Twenty-six years of deciding where every body on this property is, every hour, and she has never once put her own name anywhere it was not already." },
    ] },
    { advance_text = "Except nine o'clock.", blocks = [
        { type = "paragraph", content = "Except the wash house at nine, when the copper is hottest, which she wrote for herself the very first Monday and has never taken out. One hour a day, on a board fourteen people read." },
    ] },
    { advance_text = "Afterwards.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "She put your name in that square seven times. She was not giving you the wash house. She was giving you the hour." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Take the pans off her.", config = { destinationType = "specific", locationId = "the_long_kitchen", time_progression_minutes = 30, effects = [
  { targetType = "player", trait = "standing", op = "add", value = 2, clamp = true },
  { targetType = "player", trait = "ruth_stage", op = "set", value = 3, clamp = false },
  { targetType = "npc", npcId = "npc_ruth", trait = "relation", op = "add", value = 4, clamp = true },
] } }

