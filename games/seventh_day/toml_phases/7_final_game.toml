# ═════════════════════════════════════════════════════════════════════════════
# LOCATIONS — 14. One anchor, one exterior root, two declared corridors.
#
# ⚠️ `navigation_order` lists CHILDREN ONLY (engine.md §10). The return link is
#    generated from `entry_from` and renders as "Leave <Location Name>", so a
#    location with navigation_order = [] is a leaf, not a dead end.
#
# ⚠️ Travel cost sits on BRIDGES BETWEEN ZONES, never on every room. Inside the
#    house — kitchen, hall, the four bedrooms, the prayer room, Warrick's room —
#    movement is free. Crossing the yard costs, and the road to Cowan costs 90
#    minutes, which is what makes the market run a privilege instead of a button.
# ═════════════════════════════════════════════════════════════════════════════

# ── THE EXTERIOR, and the root of the graph ──────────────────────────────────
[[locations]]
id                   = "the_yard"
name                 = "The Yard"
description          = "Packed dirt between the house and everything else, with the pump at the middle of it and the track running down to the gate a mile off. Every crossing you make is visible from the kitchen window, the barn door and the top of the rows at once. There is no route between any two parts of this property that does not come through here."
image                = "locations/the_yard.jpg"
image_search_queries = ["old farmyard packed dirt hand pump outbuildings dusk", "farm yard gravel track gate woodpile evening"]
navigation_order     = ["the_long_kitchen", "the_barn", "the_wash_house", "the_caravan", "the_rows", "cowan_market"]

# ── THE ANCHOR ───────────────────────────────────────────────────────────────
[[locations]]
id                   = "the_long_kitchen"
name                 = "The Long Kitchen"
description          = "One table, sixteen feet of it, and a range that goes out if nobody is watching it. The rota board hangs by the pantry door with the week written on it in your mother's hand. Fourteen people eat in this room three times a day and one of them is at the head of it and the rest are in the order they have always been in."
image                = "locations/the_long_kitchen.jpg"
image_search_queries = ["long farmhouse kitchen table wood range old", "rustic communal kitchen long table iron range"]
entry_from           = "the_yard"
navigation_order     = ["the_hall_and_stairs", "the_prayer_room", "warricks_room"]

# ── the house, upstairs ──────────────────────────────────────────────────────
[[locations]]
id                   = "the_hall_and_stairs"
name                 = "The Hall and Landing"
description          = "The rules are framed on the wall at the turn of the stair where you cannot get past them. Seven of them, in the same hand as the rota. Every bedroom door in this house opens onto this landing, and after lights it is the only way any two people in the House get to each other."
image                = "locations/the_hall_and_stairs.jpg"
image_search_queries = ["dark farmhouse hallway staircase landing night", "old house stairs landing bedroom doors dim"]
entry_from           = "the_long_kitchen"
navigation_order     = ["the_girls_room", "the_boys_room", "your_parents_room"]

[[locations]]
id                   = "the_girls_room"
name                 = "The Girls' Room"
description          = "Four cots and a curtain that runs on a wire down the middle of the room, which is what this house means by a door. The press at the end holds everything the four of you own. The window has not shut properly since before you were born, and in January that matters and in July it does not."
image                = "locations/the_girls_room.jpg"
image_search_queries = ["attic dormitory row of iron cots curtain", "shared bedroom simple beds farmhouse window"]
entry_from           = "the_hall_and_stairs"
navigation_order     = []

[[locations]]
id                   = "the_boys_room"
name                 = "The Boys' Room"
description          = "The mirror of yours across the landing, three beds instead of four, and a door with no catch on it — which is the whole of the sixth rule made unnecessary, because a door that will not stay shut cannot be shut on anybody."
image                = "locations/the_boys_room.jpg"
image_search_queries = ["boys shared bedroom simple beds farmhouse", "spare room three iron beds old house"]
entry_from           = "the_hall_and_stairs"
navigation_order     = []

# ⚠️ LOCKED — and the Want sells access to it as the top of ALONE, so the-map.md
#    R2 says it is owed as a real place rather than a line of prose. It renders
#    on the landing with `blocked_message` on the card: a door that is visibly
#    shut, which is what "every release ends on an opening" means.
#    entry_conditions carries version = "1.0" or it FAILS OPEN (engine.md §22).
[[locations]]
id                   = "your_parents_room"
name                 = "Your Parents' Room"
description          = "The only door in this house with a bolt on it, and the bolt is on the inside. A bed, his chair by the window where he reads before the reading, and a box under the bed that Ruth has never once mentioned in twenty-one years."
image                = "locations/your_parents_room.jpg"
image_search_queries = ["old farmhouse master bedroom iron bed chair window", "dim bedroom wooden chair bed box under"]
entry_from           = "the_hall_and_stairs"
navigation_order     = []
entry_conditions     = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "alone", operator = "gte", value = 55 },
] }
blocked_message      = "The bolt is across. It is across every night of your life and you have never once heard it go over."

# ── the house, ground floor ──────────────────────────────────────────────────
[[locations]]
id                   = "the_prayer_room"
name                 = "The Prayer Room"
description          = "A bench, a stand with the book open on it, and a shelf behind the stand with the tin on it where everyone can see the tin and nobody can reach it. There is a switch hanging on a nail by the door that nobody has needed in four years and nobody has taken down either."
image                = "locations/the_prayer_room.jpg"
image_search_queries = ["plain meeting room bench lectern bare walls", "sparse chapel room wooden bench reading stand"]
entry_from           = "the_long_kitchen"
navigation_order     = []

[[locations]]
id                   = "warricks_room"
name                 = "Warrick's Room"
description          = "The room behind the kitchen nobody wanted, because the pantry shelves come through the arch and there is no wall between his bed and the flour. The pantry key hangs on a hook by the arch. Under the hook there is a ledger, and the ledger does not add up, and it has not added up for some years."
image                = "locations/warricks_room.jpg"
image_search_queries = ["small back room bed pantry shelves arch", "larder store room shelves narrow bed dim"]
entry_from           = "the_long_kitchen"
navigation_order     = []

# ── across the yard — THE CRUDEST ROOM IN THE GAME ───────────────────────────
[[locations]]
id                   = "the_wash_house"
name                 = "The Wash House"
description          = "Brick, one window high up, and the copper in the corner that takes an hour to come up and stays hot until midnight. The rota slate is screwed to the outside of the door. The latch is a wooden bar that drops into a slot and the slot has worn wide, so the bar sits in it and does not hold, and everyone in this house knows that and nobody has fixed it."
image                = "locations/the_wash_house.jpg"
image_search_queries = ["old brick wash house copper tub steam interior", "outbuilding laundry room tin bath copper boiler"]
entry_from           = "the_yard"
navigation_order     = []
costs                = { time = 5 }

# ── across the yard — the barn ───────────────────────────────────────────────
[[locations]]
id                   = "the_barn"
name                 = "The Barn"
description          = "The only building on this property with an engine in it. Tack down one wall, feed bins down the other, the truck nose-in at the end with its bonnet up more weeks than not, and a ladder at the back going up into the dark where somebody sleeps."
image                = "locations/the_barn.jpg"
image_search_queries = ["old timber barn interior tack wall feed bins truck", "farm barn interior ladder loft dim light"]
entry_from           = "the_yard"
navigation_order     = ["the_barn_loft"]
costs                = { time = 10 }

[[locations]]
id                   = "the_barn_loft"
name                 = "The Barn Loft"
description          = "Up the ladder, through a hatch, into a space with a mattress on the boards and a coat on a nail and nothing else in it at all. You can see down into the stalls through the gaps between the boards, which means anybody in the stalls can see up."
image                = "locations/the_barn_loft.jpg"
image_search_queries = ["hay loft mattress bare boards lantern", "barn loft dim wooden floor blanket"]
entry_from           = "the_barn"
navigation_order     = []

# ── across the yard — THE ROTATING SLOT ──────────────────────────────────────
# Married-in couples live in it until a room frees up, so the occupant changes
# across releases. Everything authored here is ROOM-scoped and names its occupant
# by ROLE, never by name (the-board.md §2) — a rotation must cost one [[npcs]]
# block and one scene file, not a rewrite of every surface in the room.
[[locations]]
id                   = "the_caravan"
name                 = "The Caravan"
description          = "Up on blocks against the wall, and it has been up on blocks longer than anyone still here can date. Whoever marries into this House lives in it. Everybody says the same thing about that — it is until a room frees up — and nobody says which room, or when, or what would have to happen first."
image                = "locations/the_caravan.jpg"
image_search_queries = ["old caravan on blocks farm yard weeds", "static caravan derelict field evening"]
entry_from           = "the_yard"
navigation_order     = []
costs                = { time = 5 }

# ── up the slope ─────────────────────────────────────────────────────────────
[[locations]]
id                   = "the_rows"
name                 = "The Vegetable Rows"
description          = "Eleven rows running up the slope to the hedge at the top, which is the only place on sixty acres you cannot be seen from the yard. The rota puts two people on the rows most afternoons and never says which two ends they start from."
image                = "locations/the_rows.jpg"
image_search_queries = ["vegetable garden rows crops slope hedge", "farm allotment rows summer afternoon"]
entry_from           = "the_yard"
navigation_order     = []
costs                = { time = 15 }

# ── the outside world ────────────────────────────────────────────────────────
# Ninety minutes each way, which is what makes it a privilege instead of a menu
# item, and gated on STANDING because being sent is the whole point of the tier.
[[locations]]
id                   = "cowan_market"
name                 = "Cowan Market"
description          = "A square, a run of stalls on Saturday, an ironmonger, and a telephone box outside the post office that takes coins you do not have. Everybody here is a person who does not know the seven rules, and there are more of them in this one square than you have met in your life."
image                = "locations/cowan_market.jpg"
image_search_queries = ["small english market town square stalls saturday", "rural market square stalls ironmonger old"]
entry_from           = "the_yard"
navigation_order     = []
costs                = { time = 90, energy = 5 }
entry_conditions     = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "standing", operator = "gte", value = 35 },
] }
blocked_message      = "The truck goes on Saturday with Warrick in it and nobody else. You have never been asked and you have never asked."


# ═════════════════════════════════════════════════════════════════════════════
# THE CAST — six, all housed, all scheduled.
#
# ⚠️ [[npcs.schedules]] binds to the [[npcs]] block ABOVE it. Do not insert a new
