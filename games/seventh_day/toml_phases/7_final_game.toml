[[quest_cards]]
priority = 23
npc_id   = "npc_silas"
terminal = true
text     = "He is still on trial with everybody in this house except you, and he has worked out that the two facts are the same fact."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_silas", op = "gte", value = 45 } ]

# ── RUTH — she knows first, and says nothing ─────────────────────────────────
[[quest_cards]]
priority = 24
npc_id   = "npc_ruth"
text     = "Your mother writes the rota at the long table before six every Monday and nobody has ever asked her to explain a line of it. She is the only person in this house who knows where everyone will be all week."
tip      = "Be down before her with the range lit and she will start talking while she writes."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_ruth", op = "lt", value = 20 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_ruth", op = "gte", value = 20, label = "Be at the table when she writes the rota — the long kitchen, Monday before six" } ]

[[quest_cards]]
priority = 24
npc_id   = "npc_ruth"
text     = "The rota has started putting you where you asked to be without your having asked. She has not mentioned it. She has not mentioned anything."
tip      = "She takes the wash house last on the rota, when the copper is nearly cold. Be in there."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_ruth", op = "gte", value = 20 },
             { trait = "relation", subject = "npc", npc_id = "npc_ruth", op = "lt",  value = 45 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_ruth", op = "gte", value = 45, label = "Be in the wash house when she takes her turn — the wash house, late" } ]

[[quest_cards]]
priority = 24
npc_id   = "npc_ruth"
terminal = true
text     = "She knows. She has known longer than anyone and she writes the rota every Monday, and what she does with that is the thing this house is actually built on."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_ruth", op = "gte", value = 45 } ]

# ── JOB — the one where she moves first ──────────────────────────────────────
[[quest_cards]]
priority = 25
npc_id   = "npc_job"
text     = "Your younger brother is eighteen and has worked out how to be in the yard whenever you cross it. He has not worked out that you can tell."
tip      = "Let him carry something for you and do not thank him for it."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_job", op = "lt", value = 20 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_job", op = "gte", value = 20, label = "Let him carry the water in for you — the yard, mornings" } ]

[[quest_cards]]
priority = 25
npc_id   = "npc_job"
text     = "He looks at you now instead of near you, and he has stopped being able to hide it, and you have stopped helping him hide it."
tip      = "The boys' room door has no catch on it. Go in when the others are at the rows."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_job", op = "gte", value = 20 },
             { trait = "relation", subject = "npc", npc_id = "npc_job", op = "lt",  value = 45 } ]
goals    = [ { trait = "relation", subject = "npc", npc_id = "npc_job", op = "gte", value = 45, label = "Go into the boys' room while the rest are at the rows — the boys' room, afternoons" } ]

[[quest_cards]]
priority = 25
npc_id   = "npc_job"
terminal = true
text     = "He is the one you started, and he knows he is the one you started, and he would do anything you asked in this house including the things you have not asked yet."
when     = [ { trait = "relation", subject = "npc", npc_id = "npc_job", op = "gte", value = 45 } ]

