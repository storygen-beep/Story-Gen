# =============================================================================
# The Seventh Day — 4_story_arc
#
# THE MILESTONE LAYER. v0.1 shipped with exactly ONE one-shot in the whole game
# (the opening funnel), so every tier crossing happened silently: the meter
# passed a number and a rung quietly appeared on a menu. Nothing ever marked it.
#
# HOW A MILESTONE FIRES — there is no special key for it.
# `setup.selectAutoFireCanvasForLocation` (generators/v2.py:4453-4473) picks the
# HIGHEST-PRIORITY NON-REPEATABLE canvas at the location whose conditions pass,
# and the location passage redirects to it (v2.py:9617). So the mechanism is
# just: `is_repeatable = false` + a location + conditions + priority. They are
# considered BEFORE random events, so a milestone always wins over an ambient.
#
# ⚠️ MILESTONES SET FLAGS AND STAGES. THEY DO NOT GRANT METERS. Written that way,
# then violated on the first pass — two of them granted grace and relation, and
# the climb gate immediately counted both as free farmable grantors. Stripped. Two reasons that agree:
#   · gate 7 requires every milestone to name the standing content it turns on,
#     and a flag that gates a rung is exactly that;
#   · the climb gate counts one-shots as farmable regardless of is_repeatable
#     (ENGINE_NOTES.md finding #5), so a tier-granting milestone would amplify a
#     known gate bug. A flag avoids both.
#
# They also ADVANCE ARC STAGES. Every NPC declared four of them and nothing in
# v0.1 could move any, so all six sat on stage 0 forever — the same dead-
# declaration class as the eggs_today counter nothing read. Stages live as
# `<slug>_stage` on player.core_traits (template_import.py:1366-1373).
#
# ⚠️ Only ONE milestone per location, or the lower-priority one never fires.
# =============================================================================


# ── COVER 15 · the shift comes out of the press ─────────────────────────────
[[canvases]]
id          = "milestone_the_shift"
name        = "The garment"
description = "One-shot @the_girls_room, COVER 15. OPENS: `wears_the_shift`, which gates the yard crossings. Advances ruth_stage to 1."

[canvases.trigger]
location      = "the_girls_room"
is_repeatable = false
priority      = 9
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "cover", operator = "gte", value = 15 },
] }

[[canvases.nodes]]
id   = "base"
name = "It is a garment"
blocks = [
  { type = "paragraph", content = "You come up after the copper and the shift is folded on your cot. Not at the bottom of the press under the winter things. On your cot, folded, on top of the blanket." },
  { type = "cascade", props = { beats = [
    { advance_text = "Nobody has said anything.", blocks = [
        { type = "paragraph", content = "Four people share this room and three of them were downstairs. There is one person in this house who goes through that press, and she writes the rota with the same hands." },
    ] },
    { advance_text = "Hold it up.", blocks = [
        { type = "paragraph", content = "Thin linen, worn to nothing, and you can read the window frame through it. The fourth rule says covered and specifies a garment. This is a garment." },
    ] },
    { advance_text = "Put it on.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "She did not tell you to wear it. She put it where you would find it and went back down to the range." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Wear it down.", config = { destinationType = "specific", locationId = "the_girls_room", time_progression_minutes = 15, flagEffects = [
  { targetType = "player", flag = "wears_the_shift", op = "set" },
], effects = [
  { targetType = "player", trait = "ruth_stage", op = "set", value = 1, clamp = false },
] } }


# ── STANDING 35 · the keys ──────────────────────────────────────────────────
[[canvases]]
id          = "milestone_the_keys"
name        = "Keeper of the keys"
description = "One-shot @the_long_kitchen, STANDING 35. OPENS: `keeper_of_keys`, which gates the pantry rungs. Advances warrick_stage to 1."

[canvases.trigger]
location      = "the_long_kitchen"
is_repeatable = false
priority      = 9
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "standing", operator = "gte", value = 35 },
] }

[[canvases.nodes]]
id   = "base"
name = "On the board, in her hand"
blocks = [
  { type = "paragraph", content = "PANTRY, and your name against it, in the same hand as everything else on that board. Nobody announced it. It is simply there on a Monday the way the weather is there." },
  { type = "cascade", props = { beats = [
    { advance_text = "Warrick has already moved it.", blocks = [
        { type = "paragraph", content = "The key is not on the hook in his room. It is on the kitchen table by the rota board, on a length of blue twine, which is not how he has ever carried it." },
    ] },
    { advance_text = "Nine years.", blocks = [
        { type = "paragraph", content = "He has counted that pantry in and out since before Job could read and nobody asked him to hand it over, and he has put it on a table and gone out to the barn." },
    ] },
    { advance_text = "Pick it up.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Nothing is yours. That is the seventh rule. This is a key to a door, on a string, with your name on a board beside it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Put it on your belt.", config = { destinationType = "specific", locationId = "the_long_kitchen", time_progression_minutes = 15, flagEffects = [
  { targetType = "player", flag = "keeper_of_keys", op = "set" },
], effects = [
  { targetType = "player", trait = "warrick_stage", op = "set", value = 1, clamp = false },
] } }


# ── ALONE 35 · the first night not in the girls' room ───────────────────────
[[canvases]]
id          = "milestone_slept_out"
name        = "Not counted"
description = "One-shot @the_barn_loft, ALONE 35. OPENS: `slept_out`, which gates the loft's night rungs. Advances ezra_stage to 1."

[canvases.trigger]
location      = "the_barn_loft"
is_repeatable = false
priority      = 9
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "alone", operator = "gte", value = 35 },
] }

[[canvases.nodes]]
id   = "base"
name = "Nobody counts"
blocks = [
  { type = "paragraph", content = "The curtain in the girls' room gets pulled at half nine whether you are behind it or not, and in twenty-one years nobody has ever once counted the cots." },
  { type = "cascade", props = { beats = [
    { advance_text = "Work out what that means.", blocks = [
        { type = "paragraph", content = "You could be up this ladder every night of the week. The House has no mechanism for noticing. It has seven rules, a rota and a tin, and not one of them counts a bed." },
    ] },
    { advance_text = "The range, though.", blocks = [
        { type = "paragraph", content = "Somebody has to light it at five. If you are up here at five, somebody comes down to a cold range, and that is the one thing in this house that cannot be missed." },
    ] },
    { advance_text = "Afterwards.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Not the rules. Not the rota. A cold range is what would give you away, and you are the one who chose to make that your job." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Down the ladder before five.", config = { destinationType = "specific", locationId = "the_barn_loft", time_progression_minutes = 20, flagEffects = [
  { targetType = "player", flag = "slept_out", op = "set" },
], effects = [
  { targetType = "player", trait = "ezra_stage", op = "set", value = 2, clamp = false },
] } }


# ── GRACE low · the household closes around her ─────────────────────────────
[[canvases]]
id          = "milestone_watched"
name        = "The rota says so"
description = "One-shot @the_prayer_room, GRACE lt 40. OPENS: `household_watching`, which gates the two supervised surfaces. Advances amos_stage to 1. The counterweight's low end arriving as an EVENT rather than as a number going down."

[canvases.trigger]
location      = "the_prayer_room"
is_repeatable = false
priority      = 9
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "grace", operator = "lt", value = 40 },
] }

[[canvases.nodes]]
id   = "base"
name = "Your name against his"
blocks = [
  { type = "paragraph", content = "The new week goes up on a Monday and your name is against the wash house every day of it, which it has been before. What is new is whose name is written beside yours." },
  { type = "cascade", props = { beats = [
    { advance_text = "Read it twice.", blocks = [
        { type = "paragraph", content = "Ezra. Against the same hours. He walks the property at ten and now the board says he walks it with you, which is a thing that has never appeared on that board in twenty-six years." },
    ] },
    { advance_text = "It is not a punishment.", blocks = [
        { type = "paragraph", content = "Nobody says a word about it at breakfast. Your father reads three of the seven and does not read the fourth, which he has read every morning of your life." },
    ] },
    { advance_text = "Understand what it is.", blocks = [
        { type = "paragraph", content = "The House has stopped being able to answer for you, and rather than say so it has written a second name in your square. That is the whole of what this family does instead of speaking." },
    ] },
    { advance_text = "Afterwards.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "There are eleven on that page and he reads seven. One of the four is about a household that can no longer answer for somebody in it." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go and look at the board again.", config = { destinationType = "specific", locationId = "the_prayer_room", time_progression_minutes = 20, flagEffects = [
  { targetType = "player", flag = "household_watching", op = "set" },
], effects = [
  { targetType = "player", trait = "amos_stage", op = "set", value = 1, clamp = false },
] } }


# ── STANDING 55 · the market run is hers ────────────────────────────────────
[[canvases]]
id          = "milestone_the_run"
name        = "Two names against Saturday"
description = "One-shot @cowan_market, STANDING 55. OPENS: `runs_the_market`, which gates the Cowan rungs. Advances silas_stage and job_stage — the two who notice she is gone."

[canvases.trigger]
location      = "cowan_market"
is_repeatable = false
priority      = 9
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "standing", operator = "gte", value = 55 },
] }

[[canvases.nodes]]
id   = "base"
name = "A road, both ways"
blocks = [
  { type = "paragraph", content = "Ninety minutes of tarmac and you have spent forty of them not saying anything, because there is nothing to say about a thing this large while it is still happening." },
  { type = "cascade", props = { beats = [
    { advance_text = "Nobody stopped it.", blocks = [
        { type = "paragraph", content = "Amos watched the truck go down the track with two people in it. He did not put a hand up. Ruth wrote the second name and did not mention writing it." },
    ] },
    { advance_text = "The square.", blocks = [
        { type = "paragraph", content = "More people in it than you have met in your life, and not one of them has heard of the seven rules, and every one of them takes you for somebody who simply came to market." },
    ] },
    { advance_text = "Afterwards.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Six hours where nobody on that property knows where you are. It has never been true before and it is going to be true every Saturday now." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Work the stalls.", config = { destinationType = "specific", locationId = "cowan_market", time_progression_minutes = 20, flagEffects = [
  { targetType = "player", flag = "runs_the_market", op = "set" },
], effects = [
  { targetType = "player", trait = "silas_stage", op = "set", value = 1, clamp = false },
  { targetType = "player", trait = "job_stage", op = "set", value = 1, clamp = false },
] } }


# ── COVER 55 · the House stops reading the fourth rule ──────────────────────
[[canvases]]
id          = "milestone_fourth_rule"
name        = "He does not read the fourth"
description = "One-shot @the_hall_and_stairs, COVER 55. OPENS: `rule_unread`, gating the landing's night rungs. The top of COVER paying out as the RULE ITSELF going quiet — the ascent stated as access, not as a number."

[canvases.trigger]
location      = "the_hall_and_stairs"
is_repeatable = false
priority      = 9
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "cover", operator = "gte", value = 55 },
] }

[[canvases.nodes]]
id   = "base"
name = "Three weeks"
blocks = [
  { type = "paragraph", content = "He reads three of the seven at breakfast. One, two and three, and then he shuts the book, and he has done that every morning for three weeks." },
  { type = "cascade", props = { beats = [
    { advance_text = "Count back.", blocks = [
        { type = "paragraph", content = "It used to be one, two and four. The fourth is the one about the garment. He stopped reading it out and nobody at that table has remarked on it, including you, until now." },
    ] },
    { advance_text = "It is still on the wall.", blocks = [
        { type = "paragraph", content = "Framed, at the turn of the stair, where you cannot get past it. Nobody has taken it down. It is simply not read any more, which in this house is how a thing stops being true." },
    ] },
    { advance_text = "Afterwards.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "He wrote them himself. He made the frame. And he has quietly stopped saying one of them out loud rather than take it off the wall." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go up past it.", config = { destinationType = "specific", locationId = "the_hall_and_stairs", time_progression_minutes = 15, flagEffects = [
  { targetType = "player", flag = "rule_unread", op = "set" },
], effects = [
  { targetType = "player", trait = "amos_stage", op = "set", value = 2, clamp = false },
] } }
