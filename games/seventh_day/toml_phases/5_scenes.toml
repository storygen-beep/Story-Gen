  { targetType = "npc", npcId = "npc_warrick", trait = "relation", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_warrick_column"
name        = "The short column"
description = "Triggerless rung off hub_warrick_barn. She has read the ledger and says so — the moment his nine years of skimming becomes something they share rather than something she holds. +2 standing, +3 his relation, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Nine years short"
blocks = [
  { type = "paragraph", content = "You tell him you have read it. He puts the spanner down on the wing and wipes his hands on the rag for a good deal longer than his hands need." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_warrick" }, content = "How far back did you get?" },
  { type = "dialog", props = { speaker = "player" }, content = "All of it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_warrick" }, content = "Then you know it is not for me." },
  { type = "dialog", props = { speaker = "player" }, content = "Who is it for." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_warrick" }, content = "Whoever gets out. It was going to be Miriam and then she married in instead." },
  { type = "cascade", props = { beats = [
    { advance_text = "Tell him you read it.", blocks = [
        { type = "paragraph", content = "He puts the spanner down on the wing and wipes his hands on the rag for a good deal longer than his hands need wiping." },
    ] },
    { advance_text = "He asks how far back.", blocks = [
        { type = "paragraph", content = "You say all of it. He nods once, like a man having a thing confirmed rather than discovered, and does not ask what you intend to do about it." },
    ] },
    { advance_text = "It is not for him.", blocks = [
        { type = "paragraph", content = "Then he says it is not for him. Nine years of a few pounds a week and not one of them spent on himself, and you look round a barn that proves it." },
    ] },
    { advance_text = "It was for Miriam.", blocks = [
        { type = "paragraph", content = "Whoever gets out, he says. It was going to be Miriam, and then Miriam married in instead, and he has gone on putting it aside for nine years anyway." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Let him pick the spanner back up.", config = { destinationType = "specific", locationId = "the_barn", time_progression_minutes = 25, effects = [
  { targetType = "player", trait = "standing", op = "add", value = 2, clamp = true },
  { targetType = "npc", npcId = "npc_warrick", trait = "relation", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_warrick_saturday"
name        = "Saturday, in the cab"
description = "Triggerless rung off hub_warrick_barn, his relation 20. The route into Cowan that runs through him rather than through the rota. +3 standing, +2 alone, +4 his relation, 30 min."

[[canvases.nodes]]
id   = "base"
name = "Two in the truck"
blocks = [
  { type = "paragraph", content = "He has driven it alone for nine years and nobody has ever asked to come. The truck is not a thing on the board. What is not on the board is not asked about." },
  { type = "dialog", props = { speaker = "player" }, content = "Take me with you." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_warrick" }, content = "Amos will see the two of us go down the track." },
  { type = "dialog", props = { speaker = "player" }, content = "Yes." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_warrick" }, content = "Right. Half seven, and be in it before I am." },
  { type = "cascade", props = { beats = [
    { advance_text = "Say it out loud.", blocks = [
        { type = "paragraph", content = "Nine years alone in that cab and nobody has ever asked to come, because the truck is not a thing on the board and what is not on the board does not get asked about." },
    ] },
    { advance_text = "He names the problem.", blocks = [
        { type = "paragraph", content = "Amos will see the two of you go down the track, he says. It is not an objection. He is telling you the price so that you can say whether you will pay it." },
    ] },
    { advance_text = "Say yes.", blocks = [
        { type = "paragraph", content = "You say yes. He looks at the bonnet for a second and then says half seven, and be in it before he is, which is a whole plan in six words." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Be in it before he is.", config = { destinationType = "specific", locationId = "the_barn", time_progression_minutes = 30, effects = [
  { targetType = "player", trait = "standing", op = "add", value = 3, clamp = true },
  { targetType = "player", trait = "alone", op = "add", value = 2, clamp = true },
  { targetType = "npc", npcId = "npc_warrick", trait = "relation", op = "add", value = 4, clamp = true },
] } }


