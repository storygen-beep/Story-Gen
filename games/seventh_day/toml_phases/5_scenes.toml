  { type = "paragraph", content = "Fourteen people is four hours of cooking a day and she has done all four of them alone since before you were born. You take the second half of it without being asked." },
  { type = "paragraph", content = "She talks while she works, which she does not do when anybody else is in here. About the year the well went. About the winter Warrick came back. Never about herself and never about Amos." },
  { type = "cascade", props = { beats = [
    { advance_text = "Take the second half.", blocks = [
        { type = "paragraph", content = "Four hours a day for fourteen people and she has done all four alone since before you were born. You take the back end of it without being asked and she lets you, which is not nothing." },
    ] },
    { advance_text = "She starts talking.", blocks = [
        { type = "paragraph", content = "She talks while she works and only while she works, and only when it is the two of you. The year the well went. The winter Warrick came back with the truck and no explanation of where it came from." },
    ] },
    { advance_text = "Never about herself.", blocks = [
        { type = "paragraph", content = "Never about herself. Never about Amos. You have worked beside this woman for a hundred hours and you know more about a well that dried up in 1961 than about either of them." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Take the pans off her.", config = { destinationType = "specific", locationId = "the_long_kitchen", time_progression_minutes = 60, effects = [
