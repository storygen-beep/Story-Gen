[[canvases]]
id          = "rung_warrick_dinner"
name        = "His dinner, out to him"
description = "Triggerless rung off hub_warrick_barn, ungated. Entry rung — his first guidance card names it. Alone with a man in a building that is not the yard. +1 alone, +3 his relation, 45 min."

[[canvases.nodes]]
id   = "base"
name = "And then not going back"
blocks = [
  { type = "paragraph", content = "He does not come in for it on a Wednesday. Somebody takes it out, and for nine years the somebody has been whoever was nearest the door. This week it has been you four times." },
  { type = "paragraph", content = "You put the plate on the wing and then you do not go back in. You sit on the upturned bin and he eats standing up and neither of you says anything for a while. Then he starts talking about Cowan." },
  { type = "cascade", props = { beats = [
    { advance_text = "Put it on the wing.", blocks = [
        { type = "paragraph", content = "He does not come in for it on a Wednesday. Somebody takes it out, and for nine years the somebody has been whoever was nearest the door, and this week it has been you four times." },
    ] },
    { advance_text = "Do not go back in.", blocks = [
        { type = "paragraph", content = "You sit down on the upturned bin instead. He eats standing up with the plate on the wing and neither of you says anything for a while, and the not saying is comfortable, which is new." },
    ] },
    { advance_text = "He talks about Cowan.", blocks = [
        { type = "paragraph", content = "The square, the stalls, a man who sells clocks and cannot fix them. He talks about it the way you would talk about a country. It is ninety minutes down a road you have never been on." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Take the plate back when he is done.", config = { destinationType = "specific", locationId = "the_barn", time_progression_minutes = 45, effects = [
