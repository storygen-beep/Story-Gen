[[canvases]]
id          = "rung_silas_house"
name        = "The house he came from"
description = "Triggerless rung off hub_silas_rows. Establishes that there are OTHER households with other rule sets — the fiction's own escape hatch, and the reason the rules read as a choice somebody made. +2 his relation, 25 min."

[[canvases.nodes]]
id   = "base"
name = "Another one of these"
blocks = [
  { type = "paragraph", content = "There are four households like this one within thirty miles and he grew up in the one at Wender's Cross. He has never talked about it here because nobody has asked him a question that was not a test." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_silas" }, content = "Nine rules at ours. Not the same nine." },
  { type = "dialog", props = { speaker = "player" }, content = "Which ones were different?" },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_silas" }, content = "Ours had nothing about the daughters at all. It had four about the sons." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Somebody wrote these. Your father sat down with a pen and decided which seven." },
  { type = "cascade", props = { beats = [
    { advance_text = "Four households.", blocks = [
        { type = "paragraph", content = "There are four like this one within thirty miles and he grew up in the one at Wender's Cross. He has never talked about it here because nobody has asked him a question that was not a test." },
    ] },
    { advance_text = "Nine rules, not seven.", blocks = [
        { type = "paragraph", content = "Not the same nine either. He says it flatly, hoeing, as though it were a fact about soil." },
    ] },
    { advance_text = "Ask which were different.", blocks = [
        { type = "paragraph", content = "Theirs had nothing about the daughters at all, he says. It had four about the sons. He does not seem to think that is remarkable and you have stopped hoeing." },
    ] },
    { advance_text = "Afterwards.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Somebody wrote these. Your father sat down with a pen and chose which seven, and chose that four of them would be about you." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Go back to your row.", config = { destinationType = "specific", locationId = "the_rows", time_progression_minutes = 25, effects = [
  { targetType = "npc", npcId = "npc_silas", trait = "relation", op = "add", value = 2, clamp = true },
] } }


