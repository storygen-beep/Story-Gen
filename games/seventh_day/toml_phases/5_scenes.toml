    ] },
    { advance_text = "By the fourth day.", blocks = [
        { type = "paragraph", content = "He stops working when you talk. Just stops, with the hoe in his hands, and answers, and then starts again — which nobody in this house does, because everybody here talks while working." },
    ] },
    { advance_text = "By the fifth.", blocks = [
        { type = "paragraph", content = "He is up your end before you get there. He has done the bottom of your row as well as his own, which takes an extra half hour and which he does not mention." },
