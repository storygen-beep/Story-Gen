[[canvases]]
id          = "rung_ruth_beside"
name        = "Beside her"
description = "Triggerless rung off hub_ruth_kitchen, ungated. Entry rung. The kitchen work that makes standing mean something, done next to the woman whose job it has always been. +1 standing, +2 her relation, -3 energy, 60 min."

[[canvases.nodes]]
id   = "base"
name = "Twenty-six years of it"
