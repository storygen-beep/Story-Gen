[[canvases]]
id          = "rung_ruth_column"
name        = "Seven times in one column"
description = "Triggerless rung off hub_ruth_kitchen. THE PAYOFF of her deferred lane — she knew before anybody and the rota is how she said so. +1 standing, +3 her relation, 20 min."

[[canvases.nodes]]
id   = "base"
name = "She wrote it on a Monday"
blocks = [
  { type = "paragraph", content = "You put it to her at the table, with the board four feet away and your name on it seven times in one column, in her hand. She does not stop what she is doing." },
  { type = "dialog", props = { speaker = "player" }, content = "You gave me the wash house every day of the week." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ruth" }, content = "I gave you the hour before the house is up." },
  { type = "dialog", props = { speaker = "player" }, content = "Why." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ruth" }, content = "Because I sat in that prayer room for two years before Ezra and nobody gave me an hour anywhere." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "She writes the rota every Monday. She has written it every Monday for twenty-six years, and nobody has ever checked a line of it." },
  { type = "cascade", props = { beats = [
    { advance_text = "She does not stop working.", blocks = [
        { type = "paragraph", content = "She goes on doing what she is doing with her hands the whole way through it. That is how this conversation is possible at all. Neither of you has to look at the other one." },
    ] },
    { advance_text = "Two years before Ezra.", blocks = [
        { type = "paragraph", content = "She sat in that prayer room for two years before Ezra was born, she says, and nobody gave her an hour anywhere. She says it the way you would say the well went dry." },
    ] },
    { advance_text = "And then she stopped.", blocks = [
        { type = "paragraph", content = "You ask what changed. She says she stopped, and puts the pan down, and that is the end of it — but she wrote your name in that square seven times on a Monday and she has never taken it out." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Let her go back to the pans.", config = { destinationType = "specific", locationId = "the_long_kitchen", time_progression_minutes = 20, effects = [
  { targetType = "player", trait = "standing", op = "add", value = 1, clamp = true },
  { targetType = "npc", npcId = "npc_ruth", trait = "relation", op = "add", value = 3, clamp = true },
] } }


[[canvases]]
id          = "rung_ruth_run"
name        = "On the market run"
description = "Triggerless rung off hub_ruth_kitchen, GRACE 55 — the second HIGH-END counterweight gate. A trusted daughter gets written onto the Saturday column; a watched one does not. This is the route into Cowan that does not go through Warrick. +4 standing, +2 grace, 15 min."

[[canvases.nodes]]
id   = "base"
name = "One line on a board"
blocks = [
  { type = "paragraph", content = "Saturday has the truck against Warrick's name and nothing against anybody else's. It has said that every week for nine years because she writes it that way every Monday." },
  { type = "paragraph", content = "You ask her to write your name beside his. She looks at the board for a while and then she picks the chalk up, and that is the whole of it. It is the single largest thing that has ever happened to you." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ruth" }, content = "Nobody will ask about it. That is what the board is for." },
  { type = "cascade", props = { beats = [
    { advance_text = "She picks the chalk up.", blocks = [
        { type = "paragraph", content = "No argument, no questions, no going to Amos about it. She wipes the square with the side of her thumb and writes your name under Warrick's, in her hand, the same as everything else on that board." },
    ] },
    { advance_text = "Nobody will ask.", blocks = [
        { type = "paragraph", content = "That is what the board is for, she says. Nobody has questioned a line of it in twenty-six years, because questioning it would mean saying out loud that somebody decides where everybody is." },
    ] },
    { advance_text = "Look at it.", blocks = [
        { type = "paragraph", content = "Two names against Saturday for the first time in nine years. It took her four seconds. You stand in front of it long enough that she tells you to go and do the range." },
    ] },
  ] } },
]
exit_block = { type = "location", text = "Look at your name next to his.", config = { destinationType = "specific", locationId = "the_long_kitchen", time_progression_minutes = 15, effects = [
  { targetType = "player", trait = "standing", op = "add", value = 4, clamp = true },
  { targetType = "player", trait = "grace", op = "add", value = 2, clamp = true },
  { targetType = "npc", npcId = "npc_ruth", trait = "relation", op = "add", value = 3, clamp = true },
] } }


