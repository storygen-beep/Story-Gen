# =============================================================================
# The Seventh Day — 1_metadata_and_locations
#
# ⚠️ [player], [[locations]], [[npcs]] and [[npcs.schedules]] MUST share this one
#    file. TOML scoping re-parents nested tables across a file boundary, and
#    inserting an [[npcs]] block between an existing NPC and its schedules
#    silently re-attaches them to the wrong character.
#
# THE MAP (references/the-map.md R1 — a place, not a list of rooms):
#
#   THE YARD  (exterior, the root — the pump, the gate, the boots)
#   ├── THE LONG KITCHEN                       ← ANCHOR
#   │   ├── THE HALL AND LANDING
#   │   │   ├── THE GIRLS' ROOM                ← she sleeps here. The wardrobe.
#   │   │   ├── THE BOYS' ROOM
#   │   │   └── YOUR PARENTS' ROOM             ← locked. Top of ALONE.
#   │   ├── THE PRAYER ROOM
#   │   └── WARRICK'S ROOM                     (the pantry through the arch)
#   ├── THE BARN  (10 min)
#   │   └── THE BARN LOFT                      ← Ezra sleeps up the ladder
#   ├── THE WASH HOUSE  (5 min)                ← the crudest room in the game
#   ├── THE CARAVAN  (5 min)                   ← THE ROTATING SLOT
#   ├── THE VEGETABLE ROWS  (15 min)
#   └── COWAN MARKET  (90 min, gated)
#
# You cross the yard to get anywhere that is not the house, and the house is one
# staircase with every bedroom off it. Signed off by LO in the board phase.
#
# ANCHOR = the_long_kitchen. Fourteen people pass through it every hour of the
# day, it is re-enterable at every one of them, and it carries 13,000 of the
# planned 47,000 words = 27.7% (gate 1). The measured failure was an anchor
# sealed in a room with no exits.
#
# Location NAMES are UI (references/the-voice.md R1): they say what is through
# the door. "Your Parents' Room", not "The Front Room".
# =============================================================================


# ═════════════════════════════════════════════════════════════════════════════
# THE PLAYER
# ═════════════════════════════════════════════════════════════════════════════

[player]
id           = "player"
name         = "Thea"
description  = "Twenty-one. Third daughter of the House. You have never had a room, never held money that was yours, and never been alone with a man who was not your father."
customizable = true
portrait     = "players/thea_plain.jpg"

[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "Your name"
default = "Thea"

[[player.customization_fields]]
id      = "build"
type    = "select"
label   = "Your build"
default = "slight"
options = ["slight", "average", "full", "strong"]

[[player.customization_fields]]
id            = "look"
type          = "image_select"
label         = "Your look"
default       = "plain"
sets_portrait = true
options = [
  { id = "plain",  image = "players/thea_plain.jpg",  label = "Plain, the way the house prefers" },
  { id = "pretty", image = "players/thea_pretty.jpg", label = "Pretty, and it has been mentioned" },
  { id = "dark",   image = "players/thea_dark.jpg",   label = "Dark, like your mother" },
]

[player.core_traits]
# layer 1 — ratcheting ascent tiers (rungs at 15/35/55)
cover    = 0
alone    = 0
standing = 0
# the counterweight — TWO-ENDED. Starts high; both directions buy content.
grace    = 70
# layer 2 — volatile state
arousal  = 0
stress   = 10
energy   = 100
# ⚠️ engine.md §21 — EVERY money effect in this game carries clamp = false.
#    Clamped, money caps at 100. She starts at zero because she owns nothing,
#    which is the premise, and the tithe does not arm until `first_coin`.
money    = 0
# internals — capped daily earners, never surfaced (labels are hidden in phase 0)
eggs_today    = 0
mending_today = 0
# ⚠️ ARC STAGES. Each NPC declares four arc_stages, and a stage lives on the
#    PLAYER namespace as `<slug>_stage` (template_import.py:1366-1373) — slug is
#    the npc id without the `npc_` prefix. v0.1 declared 24 arc stages and NONE of
#    these traits, so all six characters sat on stage 0 for the whole game: a dead
#    declaration of exactly the kind that makes a number look unmoved rather than
#    unmovable. Advanced by the milestones in 4_story_arc.toml with op = "set".
amos_stage    = 0
ruth_stage    = 0
ezra_stage    = 0
warrick_stage = 0
silas_stage   = 0
job_stage     = 0

# Decay is a POSITIVE MAGNITUDE — the validator rejects a negative (engine.md §11).
[player.trait_decay]
energy = 10


