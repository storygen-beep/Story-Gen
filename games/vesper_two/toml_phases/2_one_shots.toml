[[canvases]]
id          = "meet_renner"
name        = "The depot owner"
description = "F5 meeting · Renner · opens hub_renner via met_renner."

[canvases.trigger]
location      = "renner_depot"
npc           = "npc_renner"
is_repeatable = false
priority      = 11
is_active     = true

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "09:00"
end_time   = "18:00"

[[canvases.nodes]]
id   = "meet"
name = "The depot owner"
blocks = [
  { type = "paragraph", content = "The yard is half empty and the man running it is hiring hands off the road. He does not look at the one he hires." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_renner" }, content = "Rows four to nine. Twelve for the day. Do not talk to me while I am counting." },
  { type = "paragraph", content = "That is the whole interview." },
  { type = "paragraph", content = "The coveralls come off a hook by the door and they are somebody's old ones. Renner does not say whose and does not watch you put them on, and they are the first thing in this city that is yours." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Take it."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "renner_depot"
wardrobeEffects = [ { action = "add", item_id = "cover_dockhand" } ]
flagEffects = [ { targetType = "player", flag = "met_renner", op = "set" } ]
effects     = [ { targetType = "npc", npcId = "npc_renner", trait = "relation", op = "add", value = 2 } ]

[[canvases]]
id          = "meet_calloway"
name        = "The rogue-hunter"
description = "F5 meeting · Calloway · opens hub_calloway via met_calloway."

[canvases.trigger]
location      = "vance_securities"
npc           = "npc_calloway"
is_repeatable = false
priority      = 11
is_active     = true

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "08:00"
end_time   = "20:00"

[[canvases.nodes]]
id   = "meet"
name = "The rogue-hunter"
blocks = [
  { type = "paragraph", content = "The file room is being audited shut around a man who is mid-sentence with himself. He does not stop when you come in. He redirects." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_calloway" }, content = "Two years. Two years of copies going out and nothing going missing, and they have me down as the crank who cannot count." },
  { type = "paragraph", content = "He explains the whole case to you because you are standing there, and he has been waiting a long time for somebody to be standing there." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Listen to all of it."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "vance_securities"
flagEffects = [ { targetType = "player", flag = "met_calloway", op = "set" } ]
effects     = [ { targetType = "npc", npcId = "npc_calloway", trait = "relation", op = "add", value = 4 } ]

[[canvases]]
id          = "meet_bastien"
name        = "The man who owns the room"
description = "F5 meeting · Bastien · opens hub_bastien via met_bastien."

[canvases.trigger]
location      = "bastien_backroom"
npc           = "npc_bastien"
is_repeatable = false
priority      = 11
is_active     = true

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "20:00"
end_time   = "23:59"

[[canvases.nodes]]
id   = "meet"
name = "The man who owns the room"
blocks = [
  { type = "paragraph", content = "The man behind the bar's own door already knows whose you are. He says so the way you would mention the weather." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Mercer's. Down here on your own feet, which is new. Arms out." },
  { type = "paragraph", content = "He searches you at the door and he is not enjoying it, and he does not pretend to be. He is checking where things are." },
  { type = "paragraph", content = "He owns the bar and the room behind it and does not work either. What he does is sit at a threshold and find out things, and the whole row is careful with him for a reason none of them can name." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Bastien. You will hear it before you need it. Everybody does." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Arms out."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "bastien_backroom"
flagEffects = [ { targetType = "player", flag = "met_bastien", op = "set" } ]
effects     = [ { targetType = "npc", npcId = "npc_bastien", trait = "relation", op = "add", value = 3 } ]

