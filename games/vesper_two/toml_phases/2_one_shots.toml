# =============================================================================
# Vesper: Undertow — 2 · the opening funnel and the seven meetings
#
# Built from sheets/OPENING.md and the `## The meeting` block on each person
# sheet. Every window below matches that character's own [[npcs.schedules]] row
# in phase 1 — check_people.py verifies the two agree.
#
# ⚠️ location / is_repeatable / priority / is_active live under [canvases.trigger],
#    NOT on the [[canvases]] table. A trigger key written one level too high is
#    DROPPED SILENTLY and the TOML still says what the author meant (gate
#    `no canvas key is discarded`, engine.md §42).
# =============================================================================

# --- THE OPENING ------------------------------------------------------------
# COLD OPEN: names NOBODY. Wren's situation and the pressure, no people at all.
# The cast arrives through the seven meetings below, each one earning its name.

[[canvases]]
id          = "open_boot"
name        = "The Reach, ten in the morning"
description = "The opening funnel. Two nodes, two screens, and it hands over at kess_berth 10:33 with the feed line live."

[canvases.trigger]
location      = "underworld_strip"
is_repeatable = false
priority      = 14
is_active     = true

# ── Screen 2 · the boot ──────────────────────────────────────────────────────
# Three things and no fourth: what she is, who holds the leash (never a NAME),
# and the pressure. ~150 words.

[[canvases.nodes]]
id   = "boot"
name = "The Reach, ten in the morning"
blocks = [
  { type = "image", props = { file = "locations/underworld_strip.jpg", description = "A narrow underground market row under a dock road, wet concrete, strip lighting.", search_queries = ["underground market alley wet concrete", "dim industrial market row night"] } },
  { type = "paragraph", content = "You are a Vance Dynamics asset. That is not a job description. It is what you are made of, and it means the company owns the body you are standing in, down to the seam under your ribs and the charge that runs behind it." },
  { type = "paragraph", content = "The charge is going down. It goes down every day, and there is one place under the dock road that will put it back, and the man who owns that place wants ten a night for it." },
  { type = "dialog", props = { speaker = "unknown" }, content = "Ten a night, love, same as it was yesterday. Nobody down here runs a tab." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "You have five." },
]

[canvases.nodes.exit_block]
type = "choices"

# ⚠️ A CHOICE cannot be a location exit — an exit_block is EITHER `choices` OR
# `location` (validator: "choices[0].targetType invalid"). So the three answers
# set their flag and route to one node, and THAT node carries the location exit.
# The F3 sum is unchanged: 10:00 boot -> +3 past -> +30 exit = 10:33.

[[canvases.nodes.exit_block.choices]]
text        = "Hands. Weather. Other people's cargo."
targetType  = "node"
nodeId      = "open_boot.past"
flagEffects = [ { targetType = "player", flag = "past_field", op = "set" } ]

[[canvases.nodes.exit_block.choices]]
text        = "Somebody paid for me before they did."
targetType  = "node"
nodeId      = "open_boot.past"
flagEffects = [ { targetType = "player", flag = "past_house", op = "set" } ]

[[canvases.nodes.exit_block.choices]]
text        = "I have stood on a floor like this."
targetType  = "node"
nodeId      = "open_boot.past"
flagEffects = [ { targetType = "player", flag = "past_floor", op = "set" } ]

# ── Screen 3 · the handover ──────────────────────────────────────────────────

[[canvases.nodes]]
id   = "past"
name = "Down off the row"
blocks = [
  { type = "paragraph", content = "Whatever that was, the company has no file on it and neither do you. The charge is still going down and the berth is still forty paces along the row." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Go and see what ten a night buys."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "kess_berth"
time_progression_minutes = 30

# =============================================================================
# THE SEVEN MEETINGS
#
# F5 · no character's portrait is live before a meeting has fired.
# F8 · ONE FLAG PER CHARACTER — one flag never opens the whole cast.
#
# ⚠️ Each carries trigger.schedules matching that character's OWN hours.
#    `requires_npc` does NOT gate the auto-fire path (v2.py:4559), so without a
#    schedule window the introduction plays to an EMPTY ROOM. Vesper scored 0/18.
#
# ⚠️ `npc` on the trigger renders the portrait AND gates on that character's
#    own schedule. F6: field median 101 words, 64% carrying spoken dialogue.
#    F7: ROLE BEFORE NAME — what he is, then who he is.
# =============================================================================

[[canvases]]
id          = "meet_kess"
name        = "The mechanic"
description = "F5 meeting · Kess · opens hub_kess via met_kess. Fires on the landing screen."

[canvases.trigger]
location      = "kess_berth"
npc           = "npc_kess"
is_repeatable = false
priority      = 11
is_active     = true

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "10:00"
end_time   = "22:00"

[[canvases.nodes]]
id   = "meet"
name = "The mechanic"
blocks = [
  { type = "paragraph", content = "The man at the bench does not look up. He is stripping something decommissioned and he keeps doing it while you stand there, and when he does look it is at the frame rather than the face." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Company steel. Get out." },
  { type = "paragraph", content = "Then he looks again, longer, because nobody under the dock road can afford a frame like the one he is looking at." },
  { type = "paragraph", content = "He is the only synth mechanic under the dock road and the row's opinion is that he is worth the walk. He puts the part down. He does not put the pliers down." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Ten a night for the line. That buys the charge and a few days of me caring what is wrong with you." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Kess. You will hear it off the row anyway and I would rather you heard it right." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Tell him what you need."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "kess_berth"
flagEffects = [ { targetType = "player", flag = "met_kess", op = "set" } ]
effects     = [ { targetType = "npc", npcId = "npc_kess", trait = "relation", op = "add", value = 3 } ]

[[canvases]]
