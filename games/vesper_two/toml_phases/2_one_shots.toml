[[canvases]]
id          = "meet_marsh"
name        = "The fixer"
description = "F5 meeting · Marsh · opens hub_marsh via met_marsh. SUNDAY ONLY — his schedule row is weekdays = [6]."

[canvases.trigger]
location      = "underworld_brothel"
npc           = "npc_marsh"
is_repeatable = false
priority      = 11
is_active     = true

[[canvases.trigger.schedules]]
weekdays   = [6]
start_time = "20:00"
end_time   = "23:59"

[[canvases.nodes]]
id   = "meet"
name = "The fixer"
blocks = [
  { type = "paragraph", content = "He is waiting on the hour he booked and you are not what he booked. He checks the time before he asks about it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marsh" }, content = "The arrangement was for eight. Is the arrangement different now, or is this a mistake I am paying for?" },
  { type = "paragraph", content = "He is a fixer off the dock road, which down here means he knows who owes what and takes a cut of the settling. Two years of the same hour and he has never asked whose body was in it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marsh" }, content = "Marsh. You will not need it, but the desk likes both names on the slate and I have stopped arguing with the desk." },
  { type = "paragraph", content = "One question about the arrangement, and none at all about you." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Tell him the slot can be bought."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "underworld_brothel"
flagEffects = [ { targetType = "player", flag = "met_marsh", op = "set" } ]
