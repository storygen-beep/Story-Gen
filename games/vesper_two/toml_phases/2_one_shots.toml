[[canvases.nodes]]
id   = "meet"
name = "The courier"
blocks = [
  { type = "paragraph", content = "There is a man at the end of the bar with a delivery he is drinking through. He starts talking before you have finished putting the glass down." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_colm" }, content = "You are new. I would remember. I remember everything until about nine." },
  { type = "paragraph", content = "He tells you what is in the crate, who it is for, and which of the two he is annoyed about. None of it was asked for." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Keep his glass full."

[canvases.nodes.exit_block.config]
destinationType = "specific"
