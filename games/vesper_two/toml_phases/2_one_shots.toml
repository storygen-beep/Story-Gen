id          = "meet_mercer"
name        = "The man who used to own you"
description = "F5 meeting · Mercer · opens hub_mercer via met_mercer."

[canvases.trigger]
location      = "penthouse"
npc           = "npc_mercer"
is_repeatable = false
priority      = 11
is_active     = true

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "08:00"
end_time   = "23:00"

[[canvases.nodes]]
id   = "meet"
name = "The man who used to own you"
blocks = [
  { type = "paragraph", content = "He says your name before you have said anything, and he says it the way a man says the name of a good tool he thought he had lost." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "Wren. Look at you. Come in, come in — the floor is quieter than it was." },
  { type = "paragraph", content = "The floor is quieter than it was. The desk is the same desk and the view is the same view and there is nobody in the outer office at all." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Let him be pleased."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "penthouse"
flagEffects = [ { targetType = "player", flag = "met_mercer", op = "set" } ]
