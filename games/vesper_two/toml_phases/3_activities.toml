name = "The sinks"
blocks = [
  { type = "video", props = { pool_dir = "sex/bathroom_after_t4", pool = 4, description = "A woman cleaning herself up at a bar bathroom sink, clothes half open.", search_queries = ["woman bar bathroom sink dishevelled", "club restroom mirror after"] } },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Two sinks, one of them plumbed, and a lock that does not work on a door that opens inward against a bin. Everybody in the Reach knows to knock and about half of them do it." },
    { type = "paragraph", content = "The hand drier was taken off the wall years ago and the two bolt holes are still there with the wires taped back into them. There is a towel on a nail and you do not use the towel." },
    { type = "paragraph", content = "Somebody has written a whole argument on the back of the door in three different hands over what is plainly several years, and the last line in it is a phone number with the last digit worn off." },
