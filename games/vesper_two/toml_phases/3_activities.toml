      { type = "trait", subject = "player", trait_key = "charge", operator = "lt", value = 30 },
    ] } }, blocks = [
    { type = "paragraph", content = "Under thirty your hands stop being reliable first and your face stops being reliable second. You have learned to notice it at the hands, because by the face it is other people noticing." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "You can feel the level the way anybody feels hunger, which is to say not at all until a threshold and then constantly." },
