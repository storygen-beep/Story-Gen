# THE FOUR EMPTY ROOMS. A declared location with nothing placed in it is DEBT,
# not a location — and these four had zero words between them.
# Their budgets are NOT re-declared to match what got delivered: that is the
# exact failure gate 1 was rebuilt to catch.
# =============================================================================

[[canvases]]
id          = "amb_the_street"
name        = "The street"
description = "Traversal @ the_street, the exterior root. Budget 600. Reads `cover` — the ground is where the ascent gets a consequence surface outside anybody's room."

[canvases.trigger]
location      = "the_street"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "The street"
blocks = [
  { type = "paragraph", content = "Ground level runs the length of the city and belongs to nobody. Uphill it goes glass and quiet; along the dock road it goes cargo; underneath it goes to the Reach, and the three of them do not like each other." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "cover", operator = "gte", value = 15 },
    ] } }, blocks = [
    { type = "paragraph", content = "In what you are wearing now nobody looks twice, and that is a thing you had to buy." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "Company grays on the open street get you a second look from everybody who has ever been made redundant, which down here is most people." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Lost, love? Spire's that way. Long way up." },
  ] },
  # ⚠️ THE POOL. block_pool picks a different child on EVERY render (v2.py:14798),
  # and it is documented in four places and used by zero v2 games — v1 used it 46
  # times in one game and the divorce from that corpus lost it. A street she crosses
  # fifty times must not be the same street. Also, structurally, the pool BREAKS THE
  # GROUP RUN: the band above it and the band below it are now two chains, not one.
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "A tram cuts the road in half twice an hour and nobody waits for it to finish. The queue at the crossing is six deep and half of it is company grays walking the other way." },
    { type = "paragraph", content = "Somebody has painted over the ward notice again. Under the paint the old one still schedules the Reach for demolition, dated four years ago, in a hand that has since given up." },
    { type = "paragraph", content = "Two men are arguing about a delivery in the middle of the pavement, and the pavement has arranged itself around them. Neither is going to move first and both of them know it." },
    { type = "paragraph", content = "A woman is selling charge off a cart. Coils, half of them scavenged, none of them rated, and she has a queue anyway. Everything down here runs low by the third day of the week." },
    { type = "paragraph", content = "The rain reaches ground level about a minute after it starts and never entirely leaves. Under the lamps there is a shine on the road that makes the whole street look wetter than it is." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "time_of_day", start_time = "06:00", end_time = "18:00" },
    ] } }, blocks = [
    { type = "paragraph", content = "Daytime the street is cargo and errands, and nobody on it is doing anything they would have to explain. It is the only stretch of the day when being seen costs her nothing." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "time_of_day", start_time = "18:00", end_time = "23:00" },
    ] } }, blocks = [
    { type = "paragraph", content = "The evening road belongs to whoever has finished work and has not gone home. The traffic goes downhill from here, and so does most of what is being carried." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "After eleven the crossing lights keep running for nobody. The men still out are either working or waiting for somebody who is, and they can tell which you are from further off than you would like." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Charge, love? Half what the Spire wants for it. Runs hot but it runs." },
    { type = "dialog", props = { speaker = "unknown" }, content = "You want the crossing, not the stair. Stair's flooded past the fourth step and nobody's coming to pump it." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Tell your people the second yard is still owed for the last lot. They will know what for." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Sorry — thought you were somebody else. You walk like her." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Anything moving tonight? No? Nothing ever is, until it is." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "past_field", operator = "is_true" },
    ] } }, blocks = [
    { type = "paragraph", content = "You have walked worse roads than this one carrying heavier things than yourself, and the walking is the part of the field you kept." },
  ] },
]

