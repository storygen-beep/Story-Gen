  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Ten. I do not haggle and I do not carry anyone. You are welcome to sleep on the row if the maths does not work." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "You came in under thirty again. Do that four nights running and you will not wake up, and I will have to explain a body to the row." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Cuff goes on before you lie down, not after. I have told you that more times than I have told you anything else." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "No, I do not want to know where the ten came from. That is not delicacy. It is that the answer would be work for me." },
  ] },
