  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "You going to be in there all night? There is a queue and half of it is paying customers." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Is that you? Bar wants to know if the room is turning round tonight or not." },
    { type = "dialog", props = { speaker = "unknown" }, content = "There is no lock, love, there has never been a lock. Put the bin against it like everybody else." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Leave the tap running a second, would you. I do not want to hear what I can hear." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "service", operator = "gte", value = 30 },
    ] } }, blocks = [
    { type = "paragraph", content = "The mirror is the only place in the city that gives you the whole picture, and you have got quicker at it — what needs doing, in what order, and how long the room will wait." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "cover", operator = "gte", value = 15 },
    ] } }, blocks = [
    { type = "paragraph", content = "What you have on cost more than this room has taken in a week and it is hanging on the back of a door with no lock. That is most of what the climb has been so far." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "Company grays in a bar mirror under a bare bulb. Whatever the Spire designed them to say about the woman in them, this is not the room they designed them for." },
  ] },
  { type = "paragraph", content = "It is enough to go back out with." },
