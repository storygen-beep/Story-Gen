    { type = "paragraph", content = "It is a cable, a cuff and a regulator he built himself, and it is the only thing in the Reach that will put the charge back into what you are. Everything else in this city takes." },
    { type = "paragraph", content = "Ten a night, every night, whether or not you have earned ten. That is the whole arrangement and he has never once pretended it was anything warmer." },
    { type = "paragraph", content = "He runs it in while you are still standing. One hand flat between your tits to hold you. You are asleep before the coveralls are off your legs." },
