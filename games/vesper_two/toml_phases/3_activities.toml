[[canvases.nodes]]
id   = "cellar"
name = "The cellar"
blocks = [
  { type = "paragraph", content = "The hatch is behind the bar and the stair under it is nine steps of wet stone. It is colder down here by a lot and the walls are the original brick of whatever stood here before the Reach was the Reach." },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Half the kegs are company stock with the facilities stamp still on the collar, which means Bastien is buying off somebody who is buying off somebody. Nobody down here asks and neither do you." },
    { type = "paragraph", content = "There is a door at the back of the cellar that is bricked up to about shoulder height and open above it, and the air that comes through it is moving. It goes somewhere. It has always gone somewhere." },
    { type = "paragraph", content = "Somebody keeps a mattress and a coat behind the last rack. It is not a secret and it is not talked about, and whoever it is has not been down here in a fortnight." },
    { type = "paragraph", content = "The gas bottles are stacked against the wall the way you were taught never to stack gas bottles, and the tape on the regulator is somebody's third repair, not their first." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Do not go past the racks. That is not our wall and what is on the other side of it is not our business." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Bring four up. If you can carry six, bring four, because you will drop the sixth on the stair and I have seen it done." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Cold down there. Cold is why the room upstairs is worth what it is worth in August." },
  ] },
  { type = "paragraph", content = "You bring four up one-handed on the rail, which is the trick, and the hatch drops behind you with a sound the whole room hears." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Back up."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "underworld_bar"
time_progression_minutes = 30

[[canvases.nodes]]
id   = "delivery"
name = "The delivery"
blocks = [
  { type = "paragraph", content = "It comes off a flatbed at the top of the row and gets carried down, because nothing wider than a man gets into the Reach. Six crates on the docket and however many are actually there." },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Two of the six have a facilities stamp on the collar that somebody has gone at with a wire brush and not finished. You sign for six and carry down four and nobody involved says a word about the arithmetic." },
    { type = "paragraph", content = "The driver will not come below the second turn of the stair and never has. He puts them down at the top, takes the docket, and is gone before you have got the first one on your shoulder." },
    { type = "paragraph", content = "One crate is the wrong weight for what is written on it and you notice because you have carried the right ones. You put it at the bottom of the stack and say nothing, which is what everybody down here would have done." },
    { type = "paragraph", content = "It rains the whole hour and the stair runs like a gutter, and by the fourth crate you have worked out the only footing that holds. Nobody has ever told anybody that; you all just learn it." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Sign at the bottom, not the box. The box is for the yard and the yard is not us." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Short again. Third week. Say nothing to him about it, he knows, and knowing is the part he does not like being reminded of." },
    { type = "dialog", props = { speaker = "unknown" }, content = "You carry like somebody who has done a job. Where was that, then? — No. Fine. Forget I asked." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Anything with a seal on it goes straight down the cellar and does not go behind the bar. That is not my rule, that is his." },
  ] },
  { type = "paragraph", content = "An hour of it and your arms are gone and the room has a week of stock in it. Nobody pays you for the delivery. It is simply what the opening turns into on a Tuesday." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Stack it."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "underworld_bar"
time_progression_minutes = 60

[[canvases.nodes]]
id   = "look"
name = "The room"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The back table is the one nobody sits at until after nine and everybody sits at after eleven. In daylight it is a table with a burn on it and one leg packed with a folded beer mat." },
    { type = "paragraph", content = "There is a door beside the cellar hatch that goes up rather than down, and it is the one you have not been through. It has a bolt on the outside and the bolt is worn bright." },
    { type = "paragraph", content = "The stools at the end of the bar are Colm's end. Nobody put a sign on it. It is simply where he has sat for long enough that the leather has gone flat in one place." },
    { type = "paragraph", content = "The optics are mostly refilled from bottles that are not the bottles on the label, and everybody who drinks here knows it and drinks it anyway. The one exception is the shelf Bastien keeps for himself." },
    { type = "paragraph", content = "There is a ledger under the till that is not the ledger the bar runs on. You have seen it out twice, both times in the afternoon, both times with Bastien's hand flat on it." },
  ] },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "In an empty room the boards over the back half sound different, and the different-sounding part is exactly the shape of the room above it. You worked that out standing still on a Tuesday." },
    { type = "paragraph", content = "The bolt on the stair door is on the outside. Whoever put it there was not worried about anybody getting in, and that is a different kind of room from the one the bar describes." },
    { type = "paragraph", content = "Nothing in here is fixed properly and everything in here works. That is the whole Reach in one room, and the Spire has never once managed either half of it." },
  ] },
]

