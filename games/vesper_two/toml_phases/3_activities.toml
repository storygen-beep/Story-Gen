# =============================================================================
# Vesper: Undertow — 3 · activities
#
# The room-level surfaces: NEEDS and WORK. Two of the three things a room's list
# may hold (the-surfaces.md R2). The third is PEOPLE, which is the hubs, phase 5.
#
# Every row here is lifted from a place sheet. Nothing invented at TOML time.
#
# ⚠️ A DAY-CAP FLAG GOES ON THE CHOICE, NEVER ON A NODE EXIT.
#    choice     flagEffects -> costs -> ... -> advanceTime   (v2.py:12648-12733)
#    node exit  advanceTime -> traitEffects -> flagEffects   (v2.py:13085-13088)
#    advanceTime rolls the day inside itself and the tick clears flags there, so
#    a midnight-crossing rung capped on its EXIT is locked out of the FOLLOWING
#    day, silently. off_season shipped exactly that and was green on every
#    instrument. The berth row below crosses midnight; its cap is on the choice.
# =============================================================================

# --- kess_berth · THE OBLIGATION ---------------------------------------------
# The only fill point for `charge`, the only authored money outflow of size, and
# the thing gate 24 compares against board.economy.obligation_amount = 10.

[[canvases]]
id          = "act_feed_line"
name        = "The feed line"
description = "The obligation. 10 coin a night to Kess, and it is the only thing that puts the charge back. Crosses midnight — cap on the CHOICE."

[canvases.trigger]
location      = "kess_berth"
is_repeatable = true
priority      = 4
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "kess_tenant", operator = "is_true" },
] }
substitutions = [
  { target_canvas_id = "walkin_kess_berth", chance = 0.12, exclusive_group = "the_bench", conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "seated", operator = "gte", value = 1 } ] } },
  { target_canvas_id = "walkin_kess_berth", chance = 0.13, exclusive_group = "the_bench", conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "seated", operator = "gte", value = 2 } ] } },
]

