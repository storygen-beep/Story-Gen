[[canvases]]
id          = "amb_the_waterfront"
name        = "The dock road"
description = "Traversal @ the_waterfront. Budget 800. The hour it costs is what makes Renner's 09:00-18:00 window bite."

[canvases.trigger]
location      = "the_waterfront"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "The dock road"
blocks = [
  { type = "paragraph", content = "Cargo one side, water the other, and a row of yards that used to fit out facilities for the company and now fit out whatever comes. Renner's is the third one along and the only one with the lights on past six." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "met_renner", operator = "is_true" },
    ] } }, blocks = [
    { type = "paragraph", content = "The crews on the road know you work the third yard now, and one of them raises a hand without stopping." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "You after work or after somebody? Third yard's hiring, if it is the first one." },
  ] },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The road runs cargo one side and water the other, and the water is the colour of the sky whatever the sky is doing. Somebody's crane has been stopped mid-lift since the morning." },
    { type = "paragraph", content = "Four yards along, a crew is stripping a hull that has plainly been sold twice. They work fast and they do not talk, which on this road means the paperwork is somebody else's problem." },
    { type = "paragraph", content = "The company's old fitting-out sheds start past the third yard and run for half a mile, and every one of them has the same faded logo at the same height. None of them has a light on." },
    { type = "paragraph", content = "A tug goes past close enough to move the boards under your feet. The wash comes up through the gaps and takes the dust off the road for about a minute." },
    { type = "paragraph", content = "Gulls have got into somebody's crate of ration tins and there is a man throwing bolts at them with real feeling. He is not going to win and the gulls have worked that out." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "time_of_day", start_time = "09:00", end_time = "17:00" },
    ] } }, blocks = [
    { type = "paragraph", content = "The road is working. Every yard has its gate up and its crew in, and a woman standing still on it gets asked her business twice before she has decided what it is." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "time_of_day", start_time = "17:00", end_time = "18:00" },
    ] } }, blocks = [
    { type = "paragraph", content = "Five o'clock and the crews come off in a block, all of them going the same way at the same speed. Behind them the third yard still has its lights on, because the man who owns it does not clock out." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "Off hours the road is gates and padlocks and one lit office window at the third yard. Sound carries badly here and footsteps carry perfectly, which is a bad combination for anybody with a reason to be quiet." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Mind the boards past the second gate. One of them went last week and took a man's ankle with it." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Hands wanted at the third yard. He pays end of shift and he pays what he said, which is more than the fourth does." },
    { type = "dialog", props = { speaker = "unknown" }, content = "That is Spire crating. You do not see Spire crating on this road any more, and I have not seen it going that direction ever." },
    { type = "dialog", props = { speaker = "unknown" }, content = "If you are after the man in the third yard, he does not talk before the crew has gone. Come back at six." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Water's up again. Half the low sheds have got it through the floor and the company still owns the pumps." },
  ] },
]

