[[canvases]]
id          = "amb_spire_plaza"
name        = "The plaza"
description = "Traversal @ spire_plaza. Budget 800. THE FIRST DOOR THAT READS HER — and the refusal is a SENTENCE, not a greyed label."

[canvases.trigger]
location      = "spire_plaza"
is_repeatable = true
