time_progression_minutes = 10

[[canvases]]
id          = "act_the_cradle"
name        = "Power down"
description = "The free charge, once a night, for as long as the company is still housing her. THE THING SHE LOSES — the ten a night at the berth only bites because this was free first."

[canvases.trigger]
location             = "wren_room"
is_repeatable        = true
priority             = 4
is_active            = true
max_triggers_per_day = 1

[[canvases.nodes]]
id   = "base"
name = "Power down"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "You strip to nothing and back into the cradle, because it reads better with nothing between the contacts and the skin. They find their points along your spine, cold and familiar. The quiet closes over the top of you like water." },
    { type = "paragraph", content = "Nine hours of nothing that costs nothing. The company pays for the current the way it pays for the linen, without ever mentioning either, and that is what being owned is actually like most of the time." },
    { type = "paragraph", content = "The cradle was fitted before you were, and it is the only thing in the room made for you specifically. You have never decided how to feel about that and you power down before you get anywhere." },
    { type = "paragraph", content = "There is a moment on the way down where the room is still there and you are not tracking it any more, and that moment is the closest thing to rest anybody has ever given you for free." },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
