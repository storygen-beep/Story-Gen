[[canvases.nodes]]
id   = "worked"
name = "The opening"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Chairs down, floor mopped twice because the first pass only moves it, glasses through the machine, bottles up from the cellar in fours. Three hours and the room is a room again by eleven." },
    { type = "paragraph", content = "The optics come off and go in a bucket, the lines get flushed, and the first pint through afterwards is poured away because it is half water and tastes of the pipe. Nobody watches you do any of it." },
    { type = "paragraph", content = "Ice, ashtrays, the two windows that open, the doormat out and beaten against the wall in the alley. It is dull and your hands know it after the first week and your head goes somewhere else for three hours." },
    { type = "paragraph", content = "Somebody has been sick behind the radiator and it is a two-bucket job and there is nobody else to do it. Eight coin. The night pays twenty-five for four hours and takes something else out of you." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Good. You do it properly. Half of them mop round the tables, not under." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Eight, and I know it is eight. Take it up with the man who owns the room, not with me." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Same tomorrow if you want it. It is here every morning whether anybody takes it or not." },
  ] },
]

[canvases.nodes.exit_block]
type = "location"
text = "Done."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "underworld_bar"
time_progression_minutes = 180

[[canvases.nodes]]
id   = "cellar"
name = "The cellar"
blocks = [
  { type = "paragraph", content = "The hatch is behind the bar and the stair under it is nine steps of wet stone. It is colder down here by a lot and the walls are the original brick of whatever stood here before the Reach was the Reach." },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Half the kegs are company stock with the facilities stamp still on the collar, which means Bastien is buying off somebody who is buying off somebody. Nobody down here asks and neither do you." },
    { type = "paragraph", content = "There is a door at the back of the cellar that is bricked up to about shoulder height and open above it, and the air that comes through it is moving. It goes somewhere. It has always gone somewhere." },
    { type = "paragraph", content = "Somebody keeps a mattress and a coat behind the last rack. It is not a secret and it is not talked about, and whoever it is has not been down here in a fortnight." },
    { type = "paragraph", content = "The gas bottles are stacked against the wall the way you were taught never to stack gas bottles, and the tape on the regulator is somebody's third repair, not their first." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Do not go past the racks. That is not our wall and what is on the other side of it is not our business." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Bring four up. If you can carry six, bring four, because you will drop the sixth on the stair and I have seen it done." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Cold down there. Cold is why the room upstairs is worth what it is worth in August." },
  ] },
  { type = "paragraph", content = "You bring four up one-handed on the rail, which is the trick, and the hatch drops behind you with a sound the whole room hears." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Back up."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "underworld_bar"
time_progression_minutes = 30

[[canvases.nodes]]
id   = "delivery"
name = "The delivery"
blocks = [
  { type = "paragraph", content = "It comes off a flatbed at the top of the row and gets carried down, because nothing wider than a man gets into the Reach. Six crates on the docket and however many are actually there." },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Two of the six have a facilities stamp on the collar that somebody has gone at with a wire brush and not finished. You sign for six and carry down four and nobody involved says a word about the arithmetic." },
    { type = "paragraph", content = "The driver will not come below the second turn of the stair and never has. He puts them down at the top, takes the docket, and is gone before you have got the first one on your shoulder." },
    { type = "paragraph", content = "One crate is the wrong weight for what is written on it and you notice because you have carried the right ones. You put it at the bottom of the stack and say nothing, which is what everybody down here would have done." },
    { type = "paragraph", content = "It rains the whole hour and the stair runs like a gutter, and by the fourth crate you have worked out the only footing that holds. Nobody has ever told anybody that; you all just learn it." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Sign at the bottom, not the box. The box is for the yard and the yard is not us." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Short again. Third week. Say nothing to him about it, he knows, and knowing is the part he does not like being reminded of." },
    { type = "dialog", props = { speaker = "unknown" }, content = "You carry like somebody who has done a job. Where was that, then? — No. Fine. Forget I asked." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Anything with a seal on it goes straight down the cellar and does not go behind the bar. That is not my rule, that is his." },
  ] },
  { type = "paragraph", content = "An hour of it and your arms are gone and the room has a week of stock in it. Nobody pays you for the delivery. It is simply what the opening turns into on a Tuesday." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Stack it."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "underworld_bar"
time_progression_minutes = 60

[[canvases.nodes]]
id   = "look"
name = "The room"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The back table is the one nobody sits at until after nine and everybody sits at after eleven. In daylight it is a table with a burn on it and one leg packed with a folded beer mat." },
    { type = "paragraph", content = "There is a door beside the cellar hatch that goes up rather than down, and it is the one you have not been through. It has a bolt on the outside and the bolt is worn bright." },
    { type = "paragraph", content = "The stools at the end of the bar are Colm's end. Nobody put a sign on it. It is simply where he has sat for long enough that the leather has gone flat in one place." },
    { type = "paragraph", content = "The optics are mostly refilled from bottles that are not the bottles on the label, and everybody who drinks here knows it and drinks it anyway. The one exception is the shelf Bastien keeps for himself." },
    { type = "paragraph", content = "There is a ledger under the till that is not the ledger the bar runs on. You have seen it out twice, both times in the afternoon, both times with Bastien's hand flat on it." },
  ] },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "In an empty room the boards over the back half sound different, and the different-sounding part is exactly the shape of the room above it. You worked that out standing still on a Tuesday." },
    { type = "paragraph", content = "The bolt on the stair door is on the outside. Whoever put it there was not worried about anybody getting in, and that is a different kind of room from the one the bar describes." },
    { type = "paragraph", content = "Nothing in here is fixed properly and everything in here works. That is the whole Reach in one room, and the Spire has never once managed either half of it." },
  ] },
]

[canvases.nodes.exit_block]
type = "location"
text = "Enough."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "underworld_bar"

# =============================================================================
# WREN'S ROOM — the thing the original had and this build did not.
#
# In `vesper` her home is three rooms deep in the tower: wren_floor (an asset
# level of numbered doors), wren_room, and the cradle as a fourth location. One
# room and one row inside it carry the same meaning at a fifteenth of the map.
#
# ⚠️ THE CRADLE CARRIES A BRAKE, and it is not decoration. `charge` IS gated at 30
# with `gte`, so it is one of the eight meters `the climb is paid for` prices. A
# free, uncapped cradle makes it freely farmable and turns that gate red — the gate
# three passes were spent earning. max_triggers_per_day = 1 is the brake, and a
# sleep once a night is what this is anyway. The feed line at the berth stays
# day-capped AND priced, so the contrast is intact: free-but-once against
# paid-and-once, and the difference between the two is the whole ignition.
# =============================================================================

[[canvases]]
id          = "amb_wren_room"
name        = "Wren's room"
description = "home_base while the tower still houses her. A room she does not own, on a floor the directory does not list."

[canvases.trigger]
location      = "wren_room"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Wren's room"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "A bed she rarely uses, a cradle in the corner, and nothing on the walls. There is a drawer with three things in it and she could not tell you which of the three she chose." },
    { type = "paragraph", content = "The door has a number and not a name. Every door on this corridor has a number and not a name, there are eleven of them, and she has never found out what is behind nine." },
    { type = "paragraph", content = "It is warm, it is clean, the linen is changed on a Tuesday by somebody she has never seen, and nothing in it is hers in any sense a court would recognise." },
    { type = "paragraph", content = "There is no lock on the inside. There is no lock on the inside of any of them, and it took her a year to notice, because for the first year it did not occur to her to try." },
    { type = "paragraph", content = "From this high the Reach is a dark seam under the dock road with about four lights in it. She has started being able to pick out which four." },
    { type = "paragraph", content = "The corridor smells of the same cleaning product as every corridor in the building, which on the executive floors reads as care and on this one reads as inventory." },
    { type = "paragraph", content = "There is a maintenance panel by the skirting with a seal on it dated the year she was commissioned. Whatever runs behind the wall of this room has not needed a person since before she existed." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Asset housing reminder. Personal effects are limited to the issued drawer. Corridor storage will be cleared without notice." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Linen service, this floor, Tuesday. Occupants need not be present and are asked not to be." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Charging faults are reported through facilities, not through your supervising officer. Facilities operate weekdays." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "service", operator = "gte", value = 8 },
    ] } }, blocks = [
    { type = "paragraph", content = "You come back up smelling of a bar and get into a bed the company launders, and the two facts sit in the same room without touching. That cannot hold, and you know the shape of how it ends." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "Four hundred nights in this room and you could not describe it to somebody. It is a place to be switched off in, and it was built by people who were being kind about it." },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Open the drawer."
targetType = "node"
nodeId     = "amb_wren_room.drawer"

[[canvases.nodes.exit_block.choices]]
text       = "Sit on the bed for a while. (20 min.)"
targetType = "node"
nodeId     = "amb_wren_room.sit"

[[canvases.nodes.exit_block.choices]]
text       = "Back to the lift."
targetType = "node"
nodeId     = "amb_wren_room.out"

[[canvases.nodes]]
id   = "sit"
name = "The bed"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The bed is for sitting on, mostly. Sleeping is what the cradle is for and the bed is what a room has in it, and somebody costed both without noticing the difference." },
    { type = "paragraph", content = "The drawer has a company comb, a spare set of grays, and a photograph of a coastline that came with the room. You have kept the photograph and do not know why, and you have decided not to look into it." },
    { type = "paragraph", content = "Nobody comes to this corridor. In four hundred nights you have heard somebody else's door twice, and both times you stood still until it stopped." },
    { type = "paragraph", content = "Sitting here with the coveralls still on and the Reach on your hands is the only version of this room that has ever felt like yours, and it is going to be the reason you lose it." },
  ] },
]

[canvases.nodes.exit_block]
type = "location"
text = "Enough."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "wren_room"
time_progression_minutes = 20

[[canvases.nodes]]
id   = "drawer"
name = "The drawer"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "A company comb, a spare set of grays folded the way the linen service folds them, and a photograph of a coastline. Three things, and the company issued two of them." },
    { type = "paragraph", content = "The photograph was in the drawer when the room was assigned. It is a coastline with a white building on it and no people, and it is the only image in this building that is not a logo or a floor plan." },
    { type = "paragraph", content = "You have never added a fourth thing. You have thought about it, in the specific way of somebody testing whether they are allowed to, and then not done it, which is its own answer." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "cover", operator = "gte", value = 10 },
    ] } }, blocks = [
    { type = "paragraph", content = "What you wear down the hill now does not fold like the grays do, and it does not go in this drawer. It stays in a rack in a workshop under the dock road, which is where it makes sense." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "Everything you own is in this drawer and it does not fill it, and you have never once thought of that as a problem to solve." },
  ] },
]

[canvases.nodes.exit_block]
type = "location"
text = "Shut it."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "wren_room"
time_progression_minutes = 10

[[canvases.nodes]]
id   = "out"
name = "The corridor"
blocks = [ { type = "paragraph", content = "The corridor is the same in both directions and the lift is at the end you always use." } ]

[canvases.nodes.exit_block]
type = "location"
text = "Down."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
