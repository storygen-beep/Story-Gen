# ══════════════════════════════════════════════════════════════════
# Phase: 5_scenes.toml
# ══════════════════════════════════════════════════════════════════

# =============================================================================
# Vesper: Undertow — 5 · hubs, arcs, standing surfaces, walk-ins
#
# ⚠️ A TRIGGERLESS CANVAS THAT NOTHING LINKS TO IS DELETED FROM THE BUILD,
#    SILENTLY. The seed set is canvases carrying trigger.location; everything
#    else is pulled in by a `targetType = "node"` choice or a substitution
#    target. It costs nothing at compile time, the validator is silent, and
#    every gate stays green over it. `the_route` shipped BOTH act loops
#    unreachable and `commuter` six of seven, each with 46 green gates.
#    Every arc canvas below is linked from its hub in this same file.
#
# ⚠️ The arc ladder lives on the HUB as conditional choices — N one-time steps,
#    each gated on the flag the step before it set. The step canvases are
#    triggerless link targets.
# =============================================================================

# =============================================================================
# KESS — the sourced system. No sex at any rung; his ceiling is the seam.
# arc step 1 IS the meeting (meet_kess, phase 2). Steps 2-6 hang off the hub.
# =============================================================================

[[canvases]]
id          = "hub_kess"
name        = "Kess"
description = "Portrait hub @ kess_berth. Carries the arc ladder as conditional choices. Gated on met_kess — F5, no portrait before the meeting."

[canvases.trigger]
location      = "kess_berth"
requires_npc  = "npc_kess"
npc           = "npc_kess"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "met_kess", operator = "is_true" },
] }
