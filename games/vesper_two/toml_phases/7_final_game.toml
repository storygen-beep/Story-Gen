[[canvases.nodes]]
id   = "ask"
name = "Along the road"
blocks = [
  { type = "paragraph", content = "Asking on the dock road is not a conversation. You walk the length of it and you get half a sentence per yard, and by the far end you have something." },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Third yard took a contract off the company last quarter and nobody can work out what for. There is nothing left up there to service." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Two men came down asking after a woman in company grays. Not police. They had the walk but not the paperwork." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Whatever goes into the low sheds goes in at night and comes out on a flatbed with a sheet over it. Twice a month, and never the same night twice." },
    { type = "dialog", props = { speaker = "unknown" }, content = "You want the man in the third yard sweet, go at six with something cold. He drinks alone in there and he hates that anybody knows." },
    { type = "dialog", props = { speaker = "unknown" }, content = "There is a shutter at the dark end of the Reach with a lock on it worth more than the unit. Ask yourself who pays for that." },
  ] },
  { type = "paragraph", content = "None of it is a favour. Everybody on this road is owed something by somebody and telling you costs them nothing, which is exactly why it gets told." },
]

