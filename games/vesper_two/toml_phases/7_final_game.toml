[[canvases.nodes]]
id   = "base"
name = "Kess"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "He is at the bench with something decommissioned open in front of him and four of its parts laid out on a cloth in the order he took them out. He works in that order going back in." },
    { type = "paragraph", content = "The berth is one room: bench along the long wall, cot under the window that is not a window, and a charger rack he built himself out of something that used to be a lift controller." },
    { type = "paragraph", content = "He has a radio on the shelf tuned permanently to shipping traffic, a tin of parts he will not sell at any price, and a hand-drawn chart of a body on the wall that is not a human one." },
    { type = "paragraph", content = "Nothing in here is clean and everything in here is in an order. You worked out in the first week that touching one thing on that bench is worse than sleeping in his bed uninvited." },
    { type = "paragraph", content = "He is the only man in the Reach who looks at you and sees a schematic rather than a woman, and after four months you have stopped being able to tell whether that is a relief." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Do not sit on the bench. Sit on the cot. The bench is for things that are open." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Your left side runs two degrees warmer than your right and has done since you got here. It is not a fault. It is just interesting." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Whoever built you did the cheap thing in four places and the expensive thing in one, and I would love to know what the one was for." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Ten a night. I have not put it up, before you ask, and I do not intend to unless you make me interested enough to be worth the argument." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "There is a shutter at the dark end of the row. Do not. I mean it in the way I mean the gas bottles." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_kess", trait_key = "relation", operator = "gte", value = 25 },
    ] } }, blocks = [
    { type = "paragraph", content = "He talks to you now the way he talks to the radio: continuously, about the work, expecting nothing back. It took four months and it is the closest thing to being kept that this city has offered." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_kess", trait_key = "relation", operator = "gte", value = 10 },
    ] } }, blocks = [
    { type = "paragraph", content = "He has started leaving the cot made. He has not mentioned doing it and he would deny it means anything, and on the evidence he would be telling the truth as he understands it." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "He rents you a cot and a line and takes ten a night for it, and the rest of what happens in this room happens because he got curious, not because either of you decided on it." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "kess_refusals", operator = "gte", value = 3 },
    ] } }, blocks = [
    { type = "paragraph", content = "He is perfectly civil and he takes the ten and he does not look up, and the tin of parts stays shut. You did that, and he would say so if you asked, and he would not be being unkind." },
    { type = "paragraph", content = "The radio still plays. The cot is still made. Nothing in the room has got worse and every single thing in it has stopped going anywhere, which is a distinction you did not know was available." },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

