# =============================================================================
# Vesper: Undertow — 3 · activities
#
# The room-level surfaces: NEEDS and WORK. Two of the three things a room's list
# may hold (the-surfaces.md R2). The third is PEOPLE, which is the hubs, phase 5.
#
# Every row here is lifted from a place sheet. Nothing invented at TOML time.
#
# ⚠️ A DAY-CAP FLAG GOES ON THE CHOICE, NEVER ON A NODE EXIT.
#    choice     flagEffects -> costs -> ... -> advanceTime   (v2.py:12648-12733)
#    node exit  advanceTime -> traitEffects -> flagEffects   (v2.py:13085-13088)
#    advanceTime rolls the day inside itself and the tick clears flags there, so
#    a midnight-crossing rung capped on its EXIT is locked out of the FOLLOWING
#    day, silently. off_season shipped exactly that and was green on every
#    instrument. The berth row below crosses midnight; its cap is on the choice.
# =============================================================================

# --- kess_berth · THE OBLIGATION ---------------------------------------------
# The only fill point for `charge`, the only authored money outflow of size, and
# the thing gate 24 compares against board.economy.obligation_amount = 10.

[[canvases]]
id          = "act_feed_line"
name        = "The feed line"
description = "The obligation. 10 coin a night to Kess, and it is the only thing that puts the charge back. Crosses midnight — cap on the CHOICE."

[canvases.trigger]
location      = "kess_berth"
is_repeatable = true
priority      = 4
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "kess_tenant", operator = "is_true" },
] }
substitutions = [
  { target_canvas_id = "walkin_kess_berth", chance = 0.12, exclusive_group = "the_bench", conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "seated", operator = "gte", value = 1 } ] } },
  { target_canvas_id = "walkin_kess_berth", chance = 0.13, exclusive_group = "the_bench", conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "seated", operator = "gte", value = 2 } ] } },
]

[[canvases.nodes]]
id   = "base"
name = "The feed line"
blocks = [
  { type = "image", props = { file = "locations/kess_berth.jpg", description = "A cluttered dockside workshop berth with a bench, a cot and cabling.", search_queries = ["dockside workshop bunk cables", "industrial berth workbench dim"] } },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The line runs off his bench and it costs ten a night. Nine hours on the cot with the cuff at the base of your spine and the charge climbing, and you are aware of none of it." },
    { type = "paragraph", content = "It is a cable, a cuff and a regulator he built himself, and it is the only thing in the Reach that will put the charge back into what you are. Everything else in this city takes." },
    { type = "paragraph", content = "Ten a night, every night, whether or not you have earned ten. That is the whole arrangement and he has never once pretended it was anything warmer." },
    { type = "paragraph", content = "He runs it in while you are still standing. One hand flat between your tits to hold you. You are asleep before the coveralls are off your legs." },
    { type = "paragraph", content = "The cot is against the wall the bench backs onto, so what wakes you is him starting work. It is the most reliable thing in your life and he does not know that it is." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Ten. I do not haggle and I do not carry anyone. You are welcome to sleep on the row if the maths does not work." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "You came in under thirty again. Do that four nights running and you will not wake up, and I will have to explain a body to the row." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Cuff goes on before you lie down, not after. I have told you that more times than I have told you anything else." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "No, I do not want to know where the ten came from. That is not delicacy. It is that the answer would be work for me." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "charge", operator = "lt", value = 30 },
    ] } }, blocks = [
    { type = "paragraph", content = "Under thirty your hands stop being reliable first and your face stops being reliable second. You have learned to notice it at the hands, because by the face it is other people noticing." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "You can feel the level the way anybody feels hunger, which is to say not at all until a threshold and then constantly." },
  ] },
]

