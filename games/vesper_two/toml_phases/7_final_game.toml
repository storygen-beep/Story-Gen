id          = "amb_cain_lab"
name        = "The shutter"
description = "@ cain_lab. Budget 300 — the smallest in the game, on purpose. THE DOOR v0.1 CLOSES ON. Gate 9's visible locked door, written as a refusal with a reason."

[canvases.trigger]
location      = "cain_lab"
