[[canvases.nodes]]
id   = "base"
name = "The shutter"
blocks = [
  { type = "paragraph", content = "The unit at the dark end of the row has a shutter that has not moved in the time you have been walking past it, and a lock on the outside that is newer than the building." },
  { type = "paragraph", content = "The company says the man behind it is what you are for. Nobody on the row will say his name out loud, which on the row means something." },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "There is a cable run into the unit from the row's main line, spliced badly and taped, and it is warm. Whatever is behind the shutter has been drawing power the whole time you have lived here." },
    { type = "paragraph", content = "Somebody has chalked a number on the frame and somebody else has scrubbed at it. Under the scrubbing it is still legible, and it is not a unit number." },
    { type = "paragraph", content = "The gap under the shutter is the width of two fingers and the air coming out of it is colder than the row. Something in there is being kept at a temperature." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "drain", operator = "gte", value = 15 },
    ] } }, blocks = [
    { type = "paragraph", content = "You can feel the draw off the cable through your palm now, the way you feel a socket before you find it. That is new, and it started with what Kess put in you." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "Whatever is in there is not for what you currently are, and standing in front of it you can tell exactly how much of you is missing." },
  ] },
]

