# =============================================================================
# E8 · CHUNK A — THE DAY SHIFT.
#
# ⚠️ Nobody was in this room from 08:00 to 19:00. Colm arrives at nineteen and
# Bastien at twenty, so the declared ANCHOR — the room that is supposed to hold
# 30% of the game's prose — was a place she could only visit after dark. DoL's
# school is the anchor because she is THERE, on a schedule, most of the day.
#
# ⚠️ No NPC is the object of any verb here, and that is deliberate: the place
# sheet's own note says rows 1-3 fail the object test and MUST stay work with
# their own surface rather than becoming rungs inside Colm's hub. The 23-choice
# failure the doctrine cites was a hub binding no NPC.
#
# The cap is all three parts on ONE holder: the choice reads `bar_open_today`
# is_false, the same choice sets it, [engine.daily_tick] clears it. A grant and
# its cap on different holders reads as uncapped income (gates.py:3379).
# =============================================================================

[[canvases]]
id          = "act_bar_open"
name        = "The opening"
description = "Day shift @ underworld_bar, 08:00-19:00. Work with no person in it. The anchor's other half — the eleven hours the room was empty."

[canvases.trigger]
location      = "underworld_bar"
is_repeatable = true
priority      = 3
is_active     = true

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "08:00"
end_time   = "19:00"

[[canvases.nodes]]
id   = "base"
name = "The Undertow, daylight"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "In daylight the Undertow is a long room with a sticky floor and forty chairs on forty tables. Nothing about it is designed. It was three rooms once and somebody took two walls out with a hammer." },
    { type = "paragraph", content = "The extractor over the back of the bar has been running all night because nobody turns it off, and the room smells of last night through it — spilled beer gone flat, and the wet ash somebody knocked into a glass." },
    { type = "paragraph", content = "There is a light well at the far end that the building was not built with, and for about two hours in the morning it puts a hard white rectangle on the floor where nobody ever sits." },
    { type = "paragraph", content = "Somebody has left the till drawer open and empty, which is the row's way of saying there is nothing in it. Everybody down here does it. A closed drawer is an invitation." },
    { type = "paragraph", content = "The bar itself is a good one — proper zinc, worn through to the copper at the two places people lean. It is the only thing in the Reach that anybody has ever bothered to look after." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Cellar hatch sticks. Do not put your back into it, put your foot on the frame and lift." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Two crates short on the delivery and the docket says six. I am not arguing with them again this month." },
    { type = "dialog", props = { speaker = "unknown" }, content = "If the ice comes before eleven, it goes in the well. If it comes after, it goes in the sink and we lose half." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Whatever happened at that back table last night, I do not want to know and I do want it mopped." },
    { type = "dialog", props = { speaker = "unknown" }, content = "You are early. Nobody is ever early. Are you after hours or are you after something?" },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "service", operator = "gte", value = 20 },
    ] } }, blocks = [
    { type = "paragraph", content = "The day staff know what you do here at night and none of them says anything about it, which is not the same as not knowing. One of them stopped calling you love about a fortnight ago." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "In the morning nobody in this room knows what you are. It is eleven hours a day of being read as staff, which is a rest, and it is the only stretch of the clock where that is free." },
  ] },
]

