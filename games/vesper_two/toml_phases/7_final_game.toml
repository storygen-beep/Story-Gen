[[canvases.nodes]]
id   = "base"
name = "The plaza"
blocks = [
  { type = "paragraph", content = "Glass on three sides and a desk in the middle of it, and the man behind the desk decides who is staff. He has decided about you before, both ways, and neither time did he look up for longer than it took." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "clean", operator = "gte", value = 40 },
    ] } }, blocks = [
    { type = "paragraph", content = "Today you are presentable enough that the badge is the only question." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "There is a night on you that a lobby can see from ten feet, and he does not say what it is. He does not have to." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Not today. Try the service entrance, or try tomorrow." },
  ] },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The plaza is built so that everybody crossing it can be seen from four floors up. Nobody has ever said that out loud and every person on it walks like they know." },
    { type = "paragraph", content = "A row of contractors is waiting by the planters with their badges out, and none of them sits down. The benches are stone and angled just enough that nobody does." },
    { type = "paragraph", content = "Two audit staff go past with a trolley of boxes, and the boxes are labelled with a floor number and a date. Somebody's whole department, going down in a lift." },
    { type = "paragraph", content = "The fountain has been off since the quarter began and the basin has a hand's depth of coins in it that nobody is allowed to take. There is a cleaner whose whole job is watching it." },
    { type = "paragraph", content = "Glass on three sides means there is nowhere on the plaza to stand out of the wind, and the wind comes off the hill all afternoon. Everybody moves faster than they mean to." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "cover", operator = "gte", value = 15 },
    ] } }, blocks = [
    { type = "paragraph", content = "In this coat the desk reads you as somebody's problem rather than his own, which is the entire trick of it. He looks at the collar and not the face." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "cover", operator = "gte", value = 5 },
    ] } }, blocks = [
    { type = "paragraph", content = "What you have on passes at a glance and does not survive a second one, so the trick is to be through the doors before anybody takes it." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [] } }, blocks = [
    { type = "paragraph", content = "Company issue on a Spire plaza reads as maintenance, and maintenance goes round the side. Everybody here has learned to look past the grays and most of them have stopped noticing they do it." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "unknown" }, content = "Badge, or a name I can call up. One or the other, and I do not much care which." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Deliveries round the side. If it is not a delivery you still want the side." },
    { type = "dialog", props = { speaker = "unknown" }, content = "You were here Tuesday. I do remember faces, whatever they tell you." },
    { type = "dialog", props = { speaker = "unknown" }, content = "Audit's on nine and they have taken the lift out of service twice today. Not my doing." },
    { type = "dialog", props = { speaker = "unknown" }, content = "If you are waiting for somebody, wait outside. Lobby is not a lobby this quarter." },
  ] },
]

