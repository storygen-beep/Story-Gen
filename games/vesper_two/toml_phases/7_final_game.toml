[[canvases.nodes]]
id   = "woke"
name = "Morning"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "When it lets you go it is morning again, the charge full and the hours you spent down there walked back into you. Nothing about the room has moved." },
    { type = "paragraph", content = "You wake at full and it takes about a minute to remember what you did the previous night. There is a version of you that does not bother remembering, and she is easier." },
  ] },
]

[canvases.nodes.exit_block]
type = "location"
text = "Up."

