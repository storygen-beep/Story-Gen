# ⚠️ THE DOOR v0.1 CLOSES ON. entry_conditions + blocked_message put the refusal
# in-world on the greyed nav card (engine.md §22). `drain gte 100` is the top of
# a tier she cannot reach this release — which is the point.

[[locations]]
id               = "cain_lab"
name             = "Cain's Lab"
description      = "Dark behind the shutter, and the company says he is what she is for."
image            = "locations/cain_lab.jpg"
entry_from       = "underworld_strip"
navigation_order = []
entry_conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "drain", operator = "gte", value = 100 },
] }
blocked_message  = "The shutter does not move, and whatever is behind it is not for what she is yet."

# =============================================================================
# THE CAST
#
# ⚠️ [[npcs.schedules]] binds to the [[npcs]] block ABOVE it. Inserting a
#    character between an existing one and its schedules SILENTLY re-parents
#    them. Every block below is written NPC-then-schedule, never regrouped.
#
# ⚠️ An overnight window is ONE row only when weekdays covers all seven days.
#    The weekday check runs first, against TODAY (v2.py:3596). Mercer's stall row
#    is 23:00-08:00 across all seven, so it wraps correctly as one.
# =============================================================================

[[npcs]]
id           = "npc_kess"
name         = "Kess"
role         = "synth mechanic"
description  = "He reads bodies as hardware and hers as an interesting problem. Her landlord, her charge and her repair."
portrait     = "kess.jpg"
core_traits  = { relation = 0 }

[[npcs.schedules]]
location   = "kess_berth"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "10:00"
end_time   = "22:00"
activity   = "at the bench, stripping something decommissioned"

[[npcs]]
id           = "npc_mercer"
name         = "Mercer"
role         = "former owner"
description  = "He owns her and it costs him nothing. He is fond of her the way a man is fond of a good tool."
portrait     = "mercer.jpg"
core_traits  = { relation = 0 }

[[npcs.schedules]]
location   = "penthouse"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "08:00"
end_time   = "23:00"
activity   = "holding a floor his position no longer quite covers"

[[npcs.schedules]]
location   = "mercer_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "23:00"
end_time   = "08:00"
activity   = "running the stall under a flat name"

[[npcs]]
id           = "npc_renner"
name         = "Renner"
role         = "depot owner"
description  = "Cold, mean, and clawing at a gutted business. He ignores her, and then he cannot."
portrait     = "renner.jpg"
core_traits  = { relation = 0, arousal = 0 }

[[npcs.schedules]]
location   = "renner_depot"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "09:00"
end_time   = "18:00"
activity   = "working the yard, not looking up"

[[npcs]]
id           = "npc_calloway"
name         = "Calloway"
role         = "rogue-hunter"
description  = "Disbelieved for two years and starving to be taken seriously. His secret is not a kink."
portrait     = "calloway.jpg"
core_traits  = { relation = 0 }

[[npcs.schedules]]
location   = "vance_securities"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "08:00"
end_time   = "20:00"
activity   = "in the stacks, being audited shut"

[[npcs]]
id           = "npc_bastien"
name         = "Bastien"
role         = "owns the room"
description  = "He caught her once and kept what he found. His lever is curiosity, not desire."
portrait     = "bastien.jpg"
core_traits  = { relation = 0 }

[[npcs.schedules]]
location   = "bastien_backroom"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "20:00"
end_time   = "23:59"
activity   = "behind his own bar, taking numbers"

[[npcs]]
id           = "npc_colm"
name         = "Colm"
role         = "courier"
description  = "Cold and fast and nothing else. Bring him a name and he knows who ran it."
portrait     = "colm.jpg"
core_traits  = { relation = 0 }

[[npcs.schedules]]
location   = "underworld_bar"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "23:59"
activity   = "at the end of the bar, drinking through a delivery"

[[npcs]]
id           = "npc_marsh"
name         = "Marsh"
role         = "dockside fixer"
description  = "He pays, and he does not care whose body is in the slot he booked."
portrait     = "marsh.jpg"
core_traits  = { relation = 0 }

[[npcs.schedules]]
location   = "underworld_brothel"
weekdays   = [6]
start_time = "20:00"
end_time   = "23:59"
activity   = "taking the standing hour he books weeks out"

# =============================================================================
# THE WARDROBE
#
# ⚠️ This is not a new system — `sheets/systems/cover.md:30` names these eight as
# the `cover` ladder's spine, and all eight are on disk at videos/clothing/. What
# was missing is the catalog. `clothing_enabled = true` and
# `wardrobe_location = "kess_berth"` were ALREADY set in 0_systems_spec, so the
# engine has been rendering [[Change Clothes->WardrobePage]] on the berth's screen
# unconditionally (v2.py:9814) into an EMPTY wardrobe. A broken door, not a
# missing one.
#
# ⚠️ Slots come from VALID_CLOTHING_SLOTS (template_import.py:234) and are exactly
# seven: bra · underwear · top · bottom · dress · legwear · shoes.
#
# ⚠️ The wardrobe is NOT a row at the berth. The place sheet's own warning: an
# authored wardrobe canvas beside the engine's link is a SECOND DOOR, and the
# authored one is the one that does not work. Garments are acquired at shop rungs.
#
# ⚠️ A `type` tag with no matching [[player_portrait.outfits]] rule trips a build
# warning, so only the three garments that HAVE a portrait carry one.
# =============================================================================

