# =============================================================================
# Vesper: Undertow — 1 · locations and cast
#
# 14 locations, one root, budgets from board.locations[].fill.
# 7 characters, 8 schedule rows, homes from board.map.homes.
#
# ⚠️ navigation_order lists CHILDREN ONLY. The return link is generated from
#    entry_from and renders as "Leave <Name>" (engine.md §10).
# =============================================================================

# --- THE GROUND -------------------------------------------------------------
# ⚠️ the_street is a ROOT: no entry_from at all. That single absent field is
# gate 28. Vesper shipped TWELVE roots with the three zone grounds unjoined, and
# only 9 of its 35 locations were reachable on foot.

[[locations]]
id               = "the_street"
name             = "The Street"
description      = "Ground level, and the only part of the city that belongs to nobody. The Spire is uphill behind glass, the Waterfront is along the dock road, and the Reach is underneath."
image            = "locations/underworld_strip.jpg"
navigation_order = ["spire_plaza", "the_waterfront", "underworld_strip"]

# --- THE SPIRE --------------------------------------------------------------

[[locations]]
id               = "spire_plaza"
