# ═══════════════════════════════════════════════════════════════════════════════
# NPCs — Frank, Ryan, Jake (deep arcs) + Diana, Marge, Cookie (ambient/peer)
# ═══════════════════════════════════════════════════════════════════════════════
#
# arc_stages on Frank/Ryan/Jake per plan §5 (5 elements each, indices 0–4).
# Diana/Marge/Cookie have no arc_stages — they're not on stage chains in the
# slice (Diana's accumulator is Phase 2+ seed; Marge/Cookie are service).
# Schedules emerge from canvas trigger declarations in 5_hubs_and_scenes.toml
# (setup.getNpcLocation derives presence from canvas-linked schedules per
# the existing engine convention).

# ── Frank ─────────────────────────────────────────────────────────────────────

[[npcs]]
id          = "npc_frank"
name        = "Frank"
description = "Forty-eight. Broad through the shoulders, calloused hands with a web of small framing scars. Salt-and-pepper hair, work boots by the door. Addresses Maya by name — *Maya* — and the name lands like a door closing. Owns the property. The rent and the rules come from him."
portrait    = "frank.jpg"
core_traits = { love = 0, trust = 0, corruption = 0, arousal = 0 }
flag_keys   = []
arc_stages  = ["Suspicious", "Grudging warmth", "Restrict", "Tease", "Cracked"]

[npcs.trait_decay]
love  = 0.5
trust = 0.3
arousal = 1.0

