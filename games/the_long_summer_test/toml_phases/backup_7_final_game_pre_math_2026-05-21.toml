# ── Doc 18 Frank-arc-redesign flag labels (2026-05-04) ──────────────────────
# frank_stage_1) and as setter-targets that Pattern 2 v2.1's State B "Where"
# frame surfaces. Labels are player-voice; render as "◯ <label>" in fallback
