# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 4 — STORY ARC HINTS (TEST SLICE)
# Game: The Long Summer — Test Slice
# ═══════════════════════════════════════════════════════════════════════════════
#
# Per plan §10 — 12 hint templates total: 3 stage-gated per arc NPC × 3 NPCs +
# 1 stall-fallback per NPC. E9 stuck_threshold_days = 7. E10 hint conditions
# use stage_npc/stage_op/stage_value triple per PRD 08 §11.4 schema.
#
# `npc_id` on each template routes the hint into the right NPC section in the
# Quests page. Defaults to `stage_npc` when omitted (per PRD 08 §11.4 routing
# ergonomics). Maya-voice per Book 2B §6.
#
# ─── Authoring model (2026-05-01) ─────────────────────────────────────────────
# Each Quests card = first-person Maya narrative line + optional 💡 tip.
# State changes are conveyed by SWAPPING which template fires, not by adding
# structural UI. The picker rule is:
#
#     (priority desc, condition_items.length desc, file-order asc)
#
# So a crisis variant ("Rent's hanging over me…") declared with `priority = 10`
# and an extra condition like `missing_flag = "first_rent_paid"` automatically
# wins over an ambient baseline ("Frank wants help with the books.") whenever
# rent is unpaid. Most templates leave `priority` unset (default 0).
# Full as-built: 28th_april_TLS_Phase2_Redesign/12_Engine_PRD_09_*.md §2.12

[story_arc]
version = "1.0"

[story_arc.hints]
stuck_threshold_minutes = 30
stuck_threshold_days    = 7
hint_style              = "observation"
stage_stall_message     = "Days are passing. Maya feels herself standing still — maybe one of these arcs needs a fresh approach."


# ── Frank ─────────────────────────────────────────────────────────────────────
# 2026-05-11 RTS-shape conversion: stage triples replaced with trait_checks
# using capstone flags (npc_frank_stage variable + frank_stage_N helpers cut).
# auto_goal = false on each non-terminal hint (helpers it would render
# against are gone). Stage 4 templates keep arc_closure_flag / arc_complete.

# Stage 4 — bedroom unlocked per doc 19 §5. Terminal stage in the slice (no
# Stage 5). 2026-05-10 split: `arc_complete = true` was firing the closure
# badge the moment the player accepted the bedroom invitation in the office,
# BEFORE they actually walked upstairs and played scene_franks_bedroom_evening.
# Now split into two trait-check-mutex templates on `frank_bedroom_first_done`:
#   • Pre-consummation (flag is_false) → `arc_closure_flag` points engine at
#     scene_franks_bedroom_evening (the canvas whose flagEffects set the flag),
#     so goal block renders 🔓 Ready + 📍 Frank's bedroom + 🕒 Mon–Fri 21:00–23:00.
#     ready_text swap fires (engine `_isHintReady` returns true while flag unset).
#   • Post-consummation (flag is_true) → `arc_complete = true` renders ✓ badge.
# Doctrine preserved (`feedback_hint_narrative_no_time_or_location`): location +
# time stay out of narrative copy; the auto-rendered goal block carries them.
[[story_arc.hints.templates]]
text             = "Upstairs now. The office stays for the books."
tip              = "Diana down the hall. Quiet."
ready_text       = "He'll be in his bedroom tonight."
npc_id           = "npc_frank"
auto_goal        = false
arc_closure_flag = "frank_bedroom_first_done"
# 2026-05-17: catch-gate (frank_caught) replaces never-set frank_invited_to_bedroom.
condition = { trait_checks = [
  { type = "flag", subject = "player", flag_key = "frank_caught", operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "frank_bedroom_first_done", operator = "is_false" },
] }

# Post-consummation has priority=1 so if both somehow matched (e.g. authoring
# regression), the ✓ Complete frame wins over the pre-completion guidance.
# Silences the picker-tie linter warning. In normal play the trait_checks
# (is_false vs is_true) make them mutex so only one ever matches.
[[story_arc.hints.templates]]
text         = "He moved the line. The bedroom is the venue now."
tip          = "Diana down the hall. Quiet."
npc_id       = "npc_frank"
auto_goal    = false
arc_complete = true
priority     = 1
# 2026-05-17: catch-gate (frank_caught) replaces never-set frank_invited_to_bedroom.
condition = { trait_checks = [
  { type = "flag", subject = "player", flag_key = "frank_caught", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "frank_bedroom_first_done", operator = "is_true" },
] }

