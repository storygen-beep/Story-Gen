  { type = "image", props = { file = "activities/sleep.jpg", description = "Maya's bedroom at night. Twin bed under a window, the quilt half-pushed back, an oscillating fan on the dresser, a small reading lamp on a sketchbook closed on the desk. The window cracked two inches at the bottom; cicadas through it. Late summer Southern night.", search_queries = [
