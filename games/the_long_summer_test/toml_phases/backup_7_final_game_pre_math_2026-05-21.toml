# ═══════════════════════════════════════════════════════════════════════════════
# §8 — activity_walk_past_jakes_door
# ═══════════════════════════════════════════════════════════════════════════════
# This activity IS the Jake scene cascade. Collapsing scene + activity into one
# canvas because Jake's surface is the doorway, not a separate location. The
# activity's body has stage-gated group blocks for Stage 0/1/2 (and dev-fragment
# 3/4); each stage shows a different paragraph. Counter increments each time.
#
# Stage 1→2 transition: a one-time guard branch fires inside the Stage-1 group
# when peek_count >= 3 AND corruption >= 30. The branch sets jake_peek_draw_revealed
# AND writes npc_jake_stage = 2 directly (per plan §12.1 branch-inside-shell pattern).

[[canvases]]
id          = "activity_walk_past_jakes_door"
name        = "Walk past Jake's door"
description = "Hallway A-band activity. Stage cascade for Jake (0/1/2 natural; 3/4 dev-fragment). Increments jake_peek_count; daily-cooldown via walked_past_jakes_today."

[canvases.trigger]
location      = "loc_hallway"
is_repeatable = true
priority      = 4
is_active     = true
npc           = "npc_jake"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "walked_past_jakes_today", operator = "is_false" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4]
start_time = "13:00"
end_time   = "17:00"

[[canvases.nodes]]
id   = "base"
name = "Hallway — Jake's door"
blocks = [
  { type = "image", props = { file = "scenes/jakes_doorway.jpg", description = "Hallway view of Jake's cracked door, the angle of his face at the desk visible.", search_queries = [
    "hallway view bedroom door cracked young man at desk drawing tablet",
    "art student bedroom door cracked open hallway view drawing tablet",
    "young man at drawing desk through cracked door dim hallway",
    "rural farmhouse hallway view bedroom door cracked young man drawing",
    "young man bedroom drawing through cracked door hallway evening",
  ] } },

  # ─── STAGE 0 — Hostile (default) + first-glance sub-branch ────────────────
  # Audit §2.8 fix: canvas_jake_first_glance folded INTO this Stage 0 group as
  # a flag-gated sub-branch per Doc 01 §"When to use a true one-shot" — first-time
  # beats are branches inside repeatable shells, not separate one-shot canvases.
  # The accompanying exit choices "Pass." (first-glance gated) and "Keep walking."
  # (default gated) are mutually exclusive — only the right one shows depending
  # on whether the player is in the first-glance moment or the default.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_jake_stage", operator = "eq", value = 0 },
    ] }, blocks = [
    # First-glance sub-branch — fires once when beauty crosses 40 and flag still false.
    # The accompanying "Pass." choice (below) sets jake_first_glance_noticed.
    # On next visit, helper jake_stage_1() clears (flag-path) and transition_jake_to_1
    # pre-empts (priority 9 > activity 4).
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "flag",  subject = "player", flag_key  = "jake_first_glance_noticed", operator = "is_false" },
        { type = "trait", subject = "player", trait_key = "beauty",                    operator = "gte",      value = 40 },
      ] }, blocks = [
      { type = "paragraph", content = "Jake's door was cracked. The angle of his face at the desk visible from the hallway, drawing tablet open, the curve of his hand on the stylus. His hand stopped. Not for long. The stylus paused above the screen for the count of a breath, then went back to the line he'd been drawing. He didn't lift his head. He didn't have to." },
    ] } },
    # Default Stage-0 — flag already set OR beauty hasn't crossed 40 yet.
    { type = "group", props = { conditions = { version = "1.0", logic = "OR", items = [
        { type = "flag",  subject = "player", flag_key  = "jake_first_glance_noticed", operator = "is_true" },
        { type = "trait", subject = "player", trait_key = "beauty",                    operator = "lt",       value = 40 },
      ] }, blocks = [
      { type = "paragraph", content = "Jake's door pulled closed when she came down the hall. She heard the latch. She heard the chair scrape — not loud, not staged. He'd been listening for her step. He didn't want to be. He had been anyway." },
    ] } },
  ] } },

  # ─── STAGE 1 — Noticed (hands stop briefly) ───────────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_jake_stage", operator = "eq", value = 1 },
    ] }, blocks = [
    # Stage 1→2 transition — one-time guard branch (peek_count >= 3 AND corruption >= 30)
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "flag",  subject = "player", flag_key  = "jake_peek_draw_revealed", operator = "is_false" },
        { type = "trait", subject = "player", trait_key = "jake_peek_count",          operator = "gte",     value = 3 },
        { type = "trait", subject = "player", trait_key = "corruption",              operator = "gte",     value = 30 },
      ] }, blocks = [
      { type = "paragraph", content = "Jake's door cracked an inch wider when she passed. He didn't pretend not to look this time. The drawing on the screen — his stylus paused over it — was a curve of a shoulder she recognized as her own from the angle of three days ago at the kitchen sink. He saw her see it. His hand went still on the stylus." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_jake" }, content = "I — it's nothing. It's a study." },
    ] } },

    # Default Stage-1 (after the reveal, or before the gate clears)
    { type = "group", props = { conditions = { version = "1.0", logic = "OR", items = [
        { type = "flag", subject = "player", flag_key = "jake_peek_draw_revealed", operator = "is_true" },
        { type = "trait", subject = "player", trait_key = "jake_peek_count",        operator = "lt",       value = 3 },
        { type = "trait", subject = "player", trait_key = "corruption",            operator = "lt",       value = 30 },
      ] }, blocks = [
      { type = "paragraph", content = "Jake's door cracked an inch. The angle of his face at the desk visible — drawing tablet, the curve of his hand on the stylus. His hand stopped. Not for long. The stylus paused for a count of a breath, then went back to the line he'd been drawing." },
    ] } },
  ] } },

  # ─── STAGE 2 — Peek/Draw (door cracked wider, lean possible) ──────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_jake_stage", operator = "eq", value = 2 },
    ] }, blocks = [
    { type = "paragraph", content = "Jake's door open enough she could lean against the frame without having to ask. He didn't look up — he did look up — he did not pretend either way. The drawing on the screen this time was a hand. Her hand, holding a coffee cup at the angle she held one." },
  ] } },

  # ─── STAGE 3 — Tease (DEV FRAGMENT) ───────────────────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_jake_stage", operator = "eq", value = 3 },
    ] }, blocks = [
    { type = "paragraph", content = "Jake's door open. He had stopped pretending the drawings weren't of her. He looked at her when she leaned in the frame and didn't look down. The stylus on the desk." },
  ] } },

  # ─── STAGE 4 — Caught (DEV FRAGMENT) ──────────────────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_jake_stage", operator = "eq", value = 4 },
    ] }, blocks = [
    { type = "paragraph", content = "Jake's door open. He looked up before she'd reached it. He had been waiting for her to come down the hall." },
  ] } },
]

