# ═══════════════════════════════════════════════════════════════════════════════
# Backbone (rent / hygiene / energy) — global hints rendered in "Story Goals"
# ═══════════════════════════════════════════════════════════════════════════════
# E15 (shipped): templates with no `npc_id` are surfaced via setup.getGlobalHints.
# No stage condition → auto-render is a no-op; engine uses legacy " — 🎯 " split.

# E7 (2026-05-16) — 3 slice objective quests per doc 30 §8 E7 / doc 32 §96.
# No npc_id → surfaced in QuestsPage "Story Goals" via setup.getGlobalHints.
# Objective quests (unlike NPC-arc hints) DO carry deadline/amount/names —
# doc 32 §96 is authoritative; the no-time/location-in-narrative rule governs
