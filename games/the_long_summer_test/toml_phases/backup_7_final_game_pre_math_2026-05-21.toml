# TIPS PAGE — game-level mechanics surface (RTS-style Walkthrough page)
# ═══════════════════════════════════════════════════════════════════════════════
[ui.tips_page]
title = "Tips"
content = """
<h3>Time</h3>
<p>Most scenes take 30–60 minutes of in-game time. Sleeping advances to the next morning. Days end at midnight.</p>

<h3>Trust</h3>
<p>NPC trust climbs when you spend time on their stuff and decays roughly <strong>1.0/day</strong> when you ignore them. Whichever number is lower in your sidebar is the bottleneck — work that one.</p>

<h3>Hygiene</h3>
<p>Drops with sweat (work, intimate scenes, exercise). Below 40, the diner manager docks your tips. Shower in the Bathroom; the morning routine handles it free of charge.</p>

<h3>Energy</h3>
<p>Drops with effort. Below 30, activity outcomes shrink — bookkeeping pays less, work earns less. Sleep restores fully; a Nap is faster but costs hygiene.</p>

<h3>Money</h3>
<p>Two steady earners: <strong>Frank's bookkeeping</strong> (weekday afternoons, +$8 + trust) and <strong>diner shifts</strong> with Marge (evenings, larger payouts but tips depend on hygiene). Rent is due Sunday morning — miss it and you're out.</p>

<h3>Corruption &amp; Beauty</h3>
<p>Wardrobe upgrades push corruption up over time. Beauty rises with showers + better outfits. Both gate certain scene branches.</p>

<h3>Reading the Quests page</h3>
<p>Each card is a one-line journal thought. The thought changes as state changes — if Maya's voice shifts on the same arc, you've crossed a threshold worth following up on.</p>
"""


# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 2 — ONE-TIME CANVASES (TEST SLICE)
# Game: The Long Summer — Test Slice
# ═══════════════════════════════════════════════════════════════════════════════
#
# True one-shots in this file (after audit §2.7/§2.8 fixes — count reduced from 4 to 3):
#   - event_test_slice_intro            (game-start; pre-seeds Prologue/arrival flags)
#   - canvas_marge_interview            (first visit to loc_diner_front; sets hired_at_diner)
#   - canvas_first_sunday_morning       (first Sunday morning at loc_kitchen; rent + church)
#
# `canvas_jake_first_glance` was REMOVED 2026-04-30 — folded into
# activity_walk_past_jakes_door's Stage 0 group as a literal flag-gated
# sub-branch + companion "Pass." choice. See 3_activities.toml §8 and
# the audit doc §2.8 for rationale.
#
# The remaining two (canvas_marge_interview, canvas_first_sunday_morning) stay
# as one-shot canvases. Engine-wise they ARE branches: doctrinally, the location
# (loc_diner_front, loc_kitchen) is the "repeatable shell," and a high-priority
# canvas at that location gated on `<flag> == false` is the engine-equivalent
# of a flag-gated `group` block. Same firing semantics; same one-shot guard.
# Doc 01 §"When to use a true one-shot" allows either implementation.
#
# The dev one-shot `event_partner_invitation` lives in 6_dev_shortcuts.toml.

# ─── event_test_slice_intro — starting canvas, pre-seeds Prologue + arrival ──
#
