  { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "You know where the spare room is. She's got mine." },
  { type = "paragraph", content = "He says it to his wife with his hand already finding the back of your neck in front of her, and Diana watches him do it, and nobody in the room pretends that isn't exactly what it is. You go down the hall to his room. Hers, now, is the small one." },
