# ═══════════════════════════════════════════════════════════════════════════════
# DESIGN DISCIPLINE — Slice scope (comment-only; not parsed by the engine)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Per plan §2 — IN SCOPE for this slice:
#   - 3 deep NPCs: Frank, Ryan, Jake — natural Stage 0 → 1 → 2
#   - 2 ambient: Diana (silent diana_awareness accumulator), Marge (employer)
#   - 1 peer: Cookie (diner texture, no arc)
#   - 10 in-game days (Mon Day 1 → Wed Day 10, single calendar week + 3)
#   - One-week rent cycle (Day 7 Sunday — F4 eviction_mode validation)
#   - Hub-and-event architecture for 10 active locations
#   - Income channels 1 (T0 base wage) + 2 (T1 tips, unlocks Day 6) + 5 (Ryan
#     small-ticket Help, unlocks Day 5)
#   - All shipped engine features: E1, E2, E4, E5, E6, E7, E9, E10, E11
#
# Out of scope (deferred / dev-button only):
#   - Stage 3+ for all three NPCs (dev buttons in 6_dev_shortcuts.toml)
#   - Diana's arc (silent accumulator only; gates Phase 2+ in real game)
#   - Marge Thursday key (`first_ambient_tilt`) — week 3 minimum, not reachable
#   - Sub-rep gating beyond rep_road from diner shifts
#   - Phase-2-locked locations (truck stop bar, fairground, stadium, church
#     interior, full college campus)
#
# WHITEBOARD GOALS for the slice (comment-only — derived from Book 2B §1):
#   1. First rent paid — `first_rent_paid` (Day 7 Sunday)
#   2. One NPC arc to Stage 2 (test of natural progression) — any of
#      `npc_frank_stage >= 2`, `npc_ryan_stage >= 2`, `npc_jake_stage >= 2`
#      (Frank reachable via the catch; Ryan only via dev button in 10 days;
#      Jake reachable via the peek/draw revealed branch)
#   3. Hire at diner — `hired_at_diner` (Day 1 evening, branch in hub_diner_front)
#
# Two of Book 2B's five whiteboard goals (`first_ambient_tilt`, `brothers_discover`)
# are unreachable in 10 days per book pacing; one (`money >= 1500 + college_brochure_taken`)
# requires content not in slice scope.

# ═══════════════════════════════════════════════════════════════════════════════
# ENGINE WIRING
# ═══════════════════════════════════════════════════════════════════════════════

# ─── E5: Daily tick — clears all `*_today` flags at day rollover ──────────────
# Per PRD 03 §E5: fires once at every day flip, BEFORE any other day-1 logic.
# Plan §3 mechanism row 6 + row 13 validation depends on this.
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "talked_to_ryan_today",       op = "unset" },
  { targetType = "player", flag = "talked_to_jake_today",       op = "unset" },
  { targetType = "player", flag = "talked_to_diana_morning",    op = "unset" },
  { targetType = "player", flag = "talked_to_diana_evening",    op = "unset" },
  { targetType = "player", flag = "talked_to_marge_today",      op = "unset" },
  { targetType = "player", flag = "talked_to_cookie_today",     op = "unset" },
  { targetType = "player", flag = "helped_diana_today",         op = "unset" },
  { targetType = "player", flag = "walked_past_jakes_today",    op = "unset" },
  { targetType = "player", flag = "watched_ryan_today",         op = "unset" },
  # NOTE: frank_late_night_used intentionally NOT in daily reset — one-time
  # per playthrough for slice scope. See doc 16 §16 (weekly intent for full game).
]


# ─── E4: Stage helpers — named composite gates ────────────────────────────────
# Per PRD 03 §E4: helpers reference primitive condition types (trait, flag,
# days_since_flag, etc.) but NOT other helpers — single-level recursion is
# cycle-free per validate-time check at template_import.py:2532.
#
# IMPORTANT (per plan §12.1) — helpers are gate-check ONLY. They evaluate to a
# boolean via the `type = "stage"` condition operator (v1.py:2718-2735). They do
# NOT auto-write the stage trait. Stage advancement happens via:
#   - "Helper-driven" transitions: a small transition canvas in
#     `4b_stage_transitions.toml` gated on `helper is_true AND <slug>_stage == old`,
#     whose exit `effects` writes `<slug>_stage = new`.
#   - "Branch-inside-shell" transitions: a `group` block inside the host hub/scene,
#     gated on the catch/glance/crack one-time guard, whose exit writes both the
#     guard flag and the stage trait directly.
#
# The helpers below are referenced by both transition canvases (as triggers) and
# by hint condition stage_gates (as content selectors). Tuning a helper threshold
# propagates to every site that references it.

# ── Frank ─────────────────────────────────────────────────────────────────────
# Frank stage helpers (frank_stage_1 / _3 / _4) removed 2026-05-11 — Frank →
# RTS-shape conversion. `npc_frank_stage` master variable deprecated; canvases
# now gate on capstone narrative flags + stat thresholds directly per the
# RTS-pure pattern. No master-stage helpers needed.

# ── Ryan ──────────────────────────────────────────────────────────────────────

[[engine.stage_helpers]]
name = "ryan_stage_1"
description = "Ryan Stage 0→1 gate — trust threshold only. trust ≥ 10 already encodes the intended Day 5-6 cadence (Ryan starts trust=5, +1 per yard help, decay 0.8/day if skipped). Decoupled from group_settled_in 2026-05-17 — that flag was redundant pacing coupling that fused an internal latch with a player-facing quest; see transition_group_settled_in."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "npc",    npc_id = "npc_ryan", trait_key = "trust",            operator = "gte", value = 10 },
] }

[[engine.stage_helpers]]
name = "ryan_stage_2"
description = "Ryan Stage 1→2 gate — partner invitation + corruption + 5 helps. NATURALLY UNREACHABLE in 10-day slice; dev-button only."
dev_only = true  # Pattern 2 v2.2 (2026-05-04): formalizes the prose annotation. Silences flag-setter validator warning for ryan_partner_open (set only by dev_advance_ryan_to_2 shortcut).
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "npc",    npc_id = "npc_ryan", trait_key = "trust",             operator = "gte", value = 40 },
  { type = "trait", subject = "player",                      trait_key = "corruption",        operator = "gte", value = 25 },
  { type = "trait", subject = "player",                      trait_key = "ryan_help_count",   operator = "gte", value = 5 },
  { type = "flag",  subject = "player",                      flag_key  = "ryan_partner_open", operator = "is_true" },
] }

# ── Jake ──────────────────────────────────────────────────────────────────────

# Jake Stage 0→1 has NO helper (2026-05-03 refactor — OR-logic banned in
# stage_helpers per validate()). Multi-path goals are RTS-aligned as
# separate transition canvases. See `transition_jake_to_1_via_beauty`
# and `transition_jake_to_1_via_glance` further down (replacing the
# previous `transition_jake_to_1` watcher).

[[engine.stage_helpers]]
name = "jake_stage_2"
description = "Jake Stage 1→2 gate — peek/draw revealed branch fired (set inside scene_jakes_doorway evening Stage-1 group when peek_count >= 3 AND corruption >= 30). Reachable Day 6–7."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "jake_peek_draw_revealed", operator = "is_true" },
] }


# ═══════════════════════════════════════════════════════════════════════════════
#  PATTERN 2 — label registries (2026-05-03)
# ═══════════════════════════════════════════════════════════════════════════════
# Player-facing labels for trait/flag keys referenced in stage helpers and
# branch-inside-shell canvas triggers. Consumed by setup._labelForTrait /
# setup._labelForFlag (v1.py) when rendering the auto 🎯 goal block on the
# Quests page. Without these, raw snake_case keys leak through.
#
# NPC-subject traits (trust, arousal): label is lowercase singular — the
# renderer auto-prepends NPC display name ("Frank " + "trust" → "Frank trust").
# Player traits / flags: label stands alone in player voice.
#
# Linter (template_import.py:_lint_hint_templates registry coverage scan)
# warns at build time if any helper-referenced gate has no entry here.

# ── Trait labels ──────────────────────────────────────────────────────────────

[[traits.labels]]
key = "trust"
label = "trust"
verb = "reach"

[[traits.labels]]
key = "arousal"
label = "arousal"
verb = "reach"

[[traits.labels]]
key = "corruption"
label = "Corruption"
verb = "reach"

[[traits.labels]]
key = "beauty"
label = "Beauty"
verb = "reach"

# Doc 18 §5 retirement (2026-05-04) — frank_bookkeeping_count, frank_chore_count,
# frank_tease_count labels removed. Counters retired. Their gating roles moved
# to flag_offered + per-NPC stat (npc_frank.corruption) per doc 18 §3 + §5.
# `corruption` label below + auto-prepended NPC name handles "Frank Corruption"
# rendering for the Stage 3 helper's NPC-corruption gate.

[[traits.labels]]
key = "ryan_help_count"
label = "Yard help"
verb = "do"
unit = "session"

# `npc_frank_stage` trait label removed 2026-05-11 — variable deprecated under
# Frank → RTS-shape conversion.

