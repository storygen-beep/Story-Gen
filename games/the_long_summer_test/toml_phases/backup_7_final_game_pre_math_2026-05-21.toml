name = "Living room — you're not the one leaving"
blocks = [
  { type = "paragraph", content = "You say it flat and you don't look at Frank when you say it, because you don't need to anymore. The not-looking is the whole answer. Diana hears it land and turns to him for the denial and he gives her the same silence he's been giving her for weeks, except now it's pointed." },
