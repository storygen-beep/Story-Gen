# ═══════════════════════════════════════════════════════════════════════════════
#
# 11 activities per plan §7.3. All single fixed paragraph + image-block with
# 3–5 search_queries (image rotation is the variety mechanism per Doc 04
# anti-pattern #4 — block_pool prose rotation is in the schema but forbidden by
# the doctrine; doctrine wins for slice authoring).
#
# Density target per Doc 01 checklist: 30–80 words per arc-state. Activities in
# this slice are mostly state-pumps (one arc-state) so one paragraph suffices.
#
# Activities are repeatable canvases at locations. Most have daily-cooldown via
# `<x>_today` flags cleared by [engine.daily_tick]. activity_walk_past_jakes_door
# also serves as the Jake "scene cascade" surface — the activity IS the scene
# (the cascade group blocks live in the activity's body) since Jake's surface
# isn't a separate hub.
#
# ─── INDEX ─────────────────────────────────────────────────────────────────────
#   §1 — activity_sleep                  (loc_mayas_bedroom; 22:00–04:00)
