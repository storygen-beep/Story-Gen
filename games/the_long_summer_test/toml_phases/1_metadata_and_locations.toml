# ═══════════════════════════════════════════════════════════════════════════════
# SIDEBAR ITEMS
# ═══════════════════════════════════════════════════════════════════════════════
#
# Layout per plan §9: 3 stage_label items (E11, NEW for slice) + lifted love-band
# trait_words from TLS for each NPC + player corruption + standard hint/passes/
# inventory + the resolution-locked "stage_label preempts love band" mechanism.
#
# Stagger budget per Book 2B §9: ≤4 items visible at once. Achieved by gating
# love bands on the same flag as their stage_label, so love bands only show
# BEFORE the stage_label reveals (corruption is always-on; calc/love/stage rotate).
#
# Show-when chain:
#   - Frank stage_label visible when first_morning_kitchen_done == true (Day 1 pre-seeded)
#   - Ryan stage_label visible when ryan_help_tier_open == true (Day 5)
#   - Jake stage_label visible when jake_first_glance_noticed == true (Day 2)
#   - Love bands stay visible UNTIL the stage_label takes the slot
#     (gated by `_stage_label_visible == false` per the resolution; in this slice,
#     since stage_label and love band reveal on the same flag, we just hide the
#     love band when its stage_label appears — by gating love band on
#     `<stage_label_flag> == false` in addition to its own reveal.)

