default_entry    = "loc_front_porch"

[[locations]]
id               = "loc_main_street"
name             = "Main Street"
description      = "Three blocks of one-story brick storefronts. Diner at the middle, churches at the ends, stoplight that takes ninety seconds. Half an hour on foot from the property."
image            = "locations/main_street.jpg"
image_search_queries = ["small southern town main street brick storefronts diner stoplight summer", "rural alabama town center single block brick"]
