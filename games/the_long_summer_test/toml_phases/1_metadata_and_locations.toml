  "first_t0_shift_done",
  "group_settled_in",
  "first_sunday_passed",
  "first_rent_paid",
  "attended_church_this_week",

  # Frank chain
  "frank_caught",
  "frank_restrict_declared",
  "frank_cracked",
  "frank_keep_route_romantic",
  "frank_keep_route_arrangement",
  "frank_keep_route_rupture",
  "frank_keep_route_power_inverted",

  # Ryan chain
  "ryan_help_tier_open",
  "ryan_partner_open",
  "ryan_big_deal_closed",
  "ryan_beach_proposal",
  "ryan_keep_route_yes_engaged",
  "ryan_keep_route_not_yet",
  "ryan_keep_route_no_withdrawn",

  # Jake chain
  "jake_first_glance_noticed",
  "jake_peek_draw_revealed",
  "jake_tease_open",
  "jake_caught",
