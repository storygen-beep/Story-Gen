# ── Frank ─────────────────────────────────────────────────────────────────────

[[npcs]]
id          = "npc_frank"
name        = "Frank"
description = "Forty-eight. Broad through the shoulders, calloused hands with a web of small framing scars. Salt-and-pepper hair, work boots by the door. Addresses Maya by name — *Maya* — and the name lands like a door closing. Owns the property. The rent and the rules come from him."
portrait    = "frank.jpg"
core_traits = { love = 0, trust = 10, corruption = 0, arousal = 0 }
flag_keys   = []
arc_stages  = ["Suspicious", "Grudging warmth", "Restrict", "Tease", "Cracked"]

[npcs.trait_decay]
love  = 0.5
trust = 0.3


# ── Ryan ──────────────────────────────────────────────────────────────────────

[[npcs]]
id          = "npc_ryan"
name        = "Ryan"
description = "Twenty-five. Lean shoulders, strong back, tanned to the elbow. Eye contact rare but holds when it lands. Faded t-shirts, jeans with grease at the knee. Talks in fragments. Compliments sideways. Runs the failing shop at the edge of the property."
portrait    = "ryan.jpg"
core_traits = { love = 0, trust = 5, corruption = 0, arousal = 0 }
flag_keys   = []
arc_stages  = ["Stranger", "Helper", "Partner", "Closer", "After Beach"]

[npcs.trait_decay]
love    = 1.0
trust   = 0.8


# ── Jake ──────────────────────────────────────────────────────────────────────

[[npcs]]
id          = "npc_jake"
name        = "Jake"
description = "Twenty-one. Lean, narrower than Ryan. Glasses for drawing. Shaggy brown hair he pushes back with the inside of his wrist. Long sentences when comfortable, clipped when not. Draws. The door's mostly shut; the keyboard goes through the wall after midnight."
portrait    = "jake.jpg"
core_traits = { love = -5, trust = 0, corruption = 5, arousal = 0 }
flag_keys   = []
arc_stages  = ["Hostile", "Noticed", "Peek/Draw", "Tease", "Caught"]

[npcs.trait_decay]
love    = 1.5
trust   = 1.2


# ── Diana ─────────────────────────────────────────────────────────────────────
# No arc_stages. `awareness` accumulates silently across the slice as a Phase 2+
# seed per Doc 02 §"Diana — `diana_stage` (Phase 2+ deferred)". `helped_diana_today`
# (the per-day reset) is the daily-tick flag; the awareness trait is the running total.

[[npcs]]
id          = "npc_diana"
name        = "Diana"
description = "Forty-six. Maya's mother. Holds the kitchen at 6:30 and 5:30. Reads on the porch on Sunday afternoons. The girl she raised against the town she now lives in. Quiet at the table is her loudest line."
portrait    = "diana.jpg"
core_traits = { awareness = 0, trust = 30 }
flag_keys   = []
hidden_from_ui = false


# ── Marge ─────────────────────────────────────────────────────────────────────
# Service NPC. `trust` only — steadiness axis. No arc, no sexual content.

[[npcs]]
id          = "npc_marge"
name        = "Marge"
description = "Diner owner. Late forties, broad and quick. Reads Maya within thirty seconds of the interview. Honest about the work — the wage, the floor, what tier the customer is sitting at. The Thursday key is hers to hand over; that takes weeks Maya doesn't have in the slice."
portrait    = "marge.jpg"
core_traits = { trust = 0 }
flag_keys   = []
hidden_from_ui = false


# ── Cookie ────────────────────────────────────────────────────────────────────
# Peer. Diner cook 17:00–22:00. Female-voice texture during shifts.

[[npcs]]
id          = "npc_cookie"
name        = "Cookie"
description = "Diner cook. Twenty-eight. Late shifts only. Cigarette behind one ear that she doesn't smoke at work. The peer voice in the kitchen — knows every regular, knows the gossip. Unfussed about the tier-3 trade because she tried it twice and walked."
portrait    = "cookie.jpg"
core_traits = { trust = 0 }
flag_keys   = []
hidden_from_ui = false


# ═══════════════════════════════════════════════════════════════════════════════
# LOCATIONS (14 total)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Layout: two top-level containers (loc_property, loc_main_street). Property has
# the house cluster + yard. Main_street has diner_front + church_front. Walking
# between them is via activities (activity_walk_to_town / activity_walk_property)
# defined in 3_activities.toml — not via direct entry_from links.
#
# entry_from / navigation_order rules (per validate() at template_import.py:2046+):
#   - Each child's `entry_from` = its parent in the nav graph (the location
#     you came from to enter here)
#   - `navigation_order` lists locations whose entry_from points HERE — these
#     show up in the auto-nav menu when at this location
#   - To leave a location toward an ancestor, the hub canvas at this location
#     uses an exit_block choice with targetType = "location", locationId = "<parent>"
#   - Containers (is_container = true) require default_entry pointing at a child
#     whose parent matches the container

# ── Containers ────────────────────────────────────────────────────────────────

[[locations]]
id               = "loc_property"
name             = "Frank's Property"
description      = "Two-story farmhouse on five acres outside Millhaven. Front yard, backyard sloping toward the creek. Ryan's shop at the far edge. Diana's garden along the south side."
image            = "locations/property.jpg"
image_search_queries = ["rural southern farmhouse two story front yard porch summer", "small alabama property creek treeline outbuilding shop"]
