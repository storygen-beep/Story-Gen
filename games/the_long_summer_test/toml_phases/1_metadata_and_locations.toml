# ═══════════════════════════════════════════════════════════════════════════════
# SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

# Clothing system (RTS-style closet, 2026-05-21). Wardrobe in Maya's bedroom,
# shop in town. Garments carry beauty/corruption; worn_* predicates route content.
[settings]
clothing_enabled  = true
wardrobe_location = "loc_mayas_bedroom"
shop_location     = "loc_thrift_store"

# Coverage: the real "can't go out half-dressed" friction is the per-location
# clothing_rules on the town hub (loc_main_street_sidewalk). body_coverage here
# is documentation/forward-compat (engine's validateClothing has no call site,
# so it never blocks at home — robe teases stay intact).
[settings.clothing_requirements]
body_coverage   = true
always_required = []

# NOTE: the [[clothing]] garment catalog (~22 items with beauty/corruption) is
# authoritative in 7_final_game.toml's CLOTHING section — kept there (not
# duplicated here) to avoid a 180-line copy that would inevitably drift. This
# mirrors how the Frank Lane-2 ambients already live only in 7_final_game.toml.

[settings.rent]
enabled          = true
amount           = 60
due_day          = "Sunday"
collector_npc    = "npc_frank"
grace_periods    = 2
start_after_flag = "first_sunday_passed"
eviction_mode    = "flag_set"
eviction_flag    = "rent_evicted"


# ═══════════════════════════════════════════════════════════════════════════════
# TIPS PAGE — game-level mechanics surface (RTS-style Walkthrough page)
# ═══════════════════════════════════════════════════════════════════════════════
# Universal mechanics live here, not on per-template hint tips. Sidebar shows
# a "💡 Tips" button when this block is authored; player opens it to see how
# the world actually works. Author writes raw HTML inside `content`.
[ui.tips_page]
title = "Tips"
content = """
<h3>Time</h3>
<p>Most scenes take 30–60 minutes of in-game time. Sleeping advances to the next morning. Days end at midnight.</p>

<h3>Trust</h3>
<p>NPC trust climbs when you spend time on their stuff and decays roughly <strong>1.0/day</strong> when you ignore them. Whichever number is lower in your sidebar is the bottleneck — work that one.</p>

<h3>Hygiene</h3>
<p>Drops with sweat (work, intimate scenes, exercise). Below 40, the diner manager docks your tips. Shower in the Bathroom; the morning routine handles it free of charge.</p>

<h3>Energy</h3>
<p>Drops with effort. Below 30, activity outcomes shrink — bookkeeping pays less, work earns less. Sleep restores fully; a Nap is faster but costs hygiene.</p>

<h3>Money</h3>
<p>Two steady earners: <strong>Frank's bookkeeping</strong> (weekday afternoons, +$8 + trust) and <strong>diner shifts</strong> with Marge (evenings, larger payouts but tips depend on hygiene). Rent is due Sunday morning — miss it and you're out.</p>

<h3>Corruption &amp; Beauty</h3>
<p>Beauty rises when Maya showers and sketches &mdash; it shapes how NPCs first notice her. Corruption climbs as she pushes things further with Frank. Both gate certain scene branches, so keep an eye on the sidebar.</p>

<h3>Reading the Quests page</h3>
<p>Each card is a one-line journal thought. The thought changes as state changes — if Maya's voice shifts on the same arc, you've crossed a threshold worth following up on.</p>
"""

