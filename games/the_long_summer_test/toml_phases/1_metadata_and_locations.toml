# Resolution per plan §9: when both want the slot, hide love band. The
# stage_label reveals on first_morning_kitchen_done (pre-seeded Day 1), so this
# love band would only be relevant pre-slice. Kept here for completeness; gated
# on `first_morning_kitchen_done == false` so it never actually renders in the
# slice (stage_label takes the slot). Effectively dormant.

[[sidebar_items]]
type        = "trait_words"
trait_owner = "npc"
npc_id      = "npc_frank"
trait       = "love"
show_when   = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "first_morning_kitchen_done", operator = "is_false" },
] }
bands = [
  { min = 0,  max = 19,  text = "Diana's girl. Rent due." },
  { min = 20, max = 100, text = "Coffee for two, unasked." },
]


