# CRITICAL: do NOT add npc_<slug>_stage entries here. Decay bypasses
# applyAndNotifyTrait, which is where E9 hooks the advancement log
# (v1.py:4017-4025). Validate() rejects the combination per PRD 08 §11.2.


# ═══════════════════════════════════════════════════════════════════════════════
# NPCs — Frank, Ryan, Jake (deep arcs) + Diana, Marge, Cookie (ambient/peer)
# ═══════════════════════════════════════════════════════════════════════════════
#
# arc_stages on Frank/Ryan/Jake per plan §5 (5 elements each, indices 0–4).
# Diana/Marge/Cookie have no arc_stages — they're not on stage chains in the
# slice (Diana's accumulator is Phase 2+ seed; Marge/Cookie are service).
