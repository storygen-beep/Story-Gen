# ═══════════════════════════════════════════════════════════════════════════════
#  PHASE 1 — METADATA, PLAYER, NPCs, LOCATIONS, SIDEBAR, SETTINGS  (TEST SLICE)
#  Game: The Long Summer — Test Slice
# ═══════════════════════════════════════════════════════════════════════════════
#
# Source: 28th_april_TLS_Phase2_Redesign/10_Test_Slice_10Day_Plan.md §4 (starting
#         state), §5 (NPC stage chains), §7.1 (locations), §9 (sidebar), §11 (rent)
# Sister to: games/the_long_summer/toml_phases_v2/1_metadata_and_locations.toml
#            (the full game's metadata; this slice trims to slice scope)
#
# Engine features wired in this file:
#   F1  trait_words sidebar (lifted from TLS) + new stage_label items (E11)
#   F2  entry_conditions on locations (Frank's office gate)
#   F3  player + npc trait_decay (lifted from TLS; stage traits excluded per E9)
#   F4  rent + eviction_mode = flag_set (Day 7 Sunday validation)
#   E11 stage_label sidebar items (3 entries — Frank/Ryan/Jake)
#
# Stage traits (E11 foundation):
#   - npc_frank_stage / npc_ryan_stage / npc_jake_stage live in
#     [player.core_traits] as integers (max 4 per arc_stages length)
#   - NOT in [player.trait_decay] — validate() rejects (PRD 08 §11.2)
#
# Counter traits (E7 <<inc>> targets):
#   - frank_bookkeeping_count, frank_tease_count, frank_chore_count
#   - ryan_help_count
#   - jake_peek_count
#   - lean_by_desk_count   (dev-only, Stage 3+ verification)
#
# Pre-seeding strategy:
#   The schema treats flag_keys as names only — all flags initialize to FALSE
#   at runtime (v1.py:655). To start with prologue_complete + arrived_at_franks
#   etc. = TRUE, the slice's intro one-shot (event_test_slice_intro in
#   2_one_shots.toml) sets them via flagEffects on its exit_block. The flag
#   names declared below just register them as known to the engine.

# NOTE on top-level keys: when these phase files are concat'd into 7_final_game.toml,
# any bare top-level assignment that appears AFTER a [section] gets nested into that
# section by TOML parser scope rules. So `schema_version` and `starting_canvas` MUST
# live inside [project] (which is unambiguously a top-level table), not as bare
# top-level keys above [project]. The parser at template_import.py:844-847 falls back
# to [project].starting_canvas when not at root level.

# ═══════════════════════════════════════════════════════════════════════════════
# PROJECT
# ═══════════════════════════════════════════════════════════════════════════════

[project]
id              = "the_long_summer_test"
title           = "The Long Summer — Test Slice"
schema_version  = "0.2"
# PRD 48 (2026-05-23) — opt into V2 Quests engine. Replaces V1's
# [story_arc.hints.templates] + auto_goal/arc_closure_flag indirection with
# [[quest_cards]] + author-on-template goals. See doc 48 PRD + bundle commit
# 5c215a2 for engine surface. V1 stays untouched for other games.
quests_engine   = "v2"
starting_canvas = "event_test_slice_intro"
description = """
Engine-validation slice. 10 in-game days. Frank, Ryan, Jake at Stage 0→1→2 \
naturally; Stage 3+ via dev buttons. Maya wakes in her bedroom on Day 1 morning \
of her stay at Frank's place — Prologue + arrival skipped. Built against the \
Phase 2 doctrine in 28th_april_TLS_Phase2_Redesign/01_Repeatable_First_Doctrine.md \
+ /04_Scene_Cascade_Pattern.md. Not a player-facing game; dev shortcuts visible.
"""


[theme]
mode = "dark"


# ═══════════════════════════════════════════════════════════════════════════════
# TIME SYSTEM
# ═══════════════════════════════════════════════════════════════════════════════
#
# Day 1 = Monday. Day 7 = Sunday (rent due). Day 10 = Wednesday next week.
# Starting hour 06:00 — Maya wakes in her bedroom. The intro one-shot routes to
# hub_mayas_bedroom; her first action is to leave the room and start the day.

[time]
enabled        = true
starting_hour  = 6
starting_day   = "Monday"
starting_week  = 1


