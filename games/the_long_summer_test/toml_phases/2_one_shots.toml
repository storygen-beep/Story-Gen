# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 2 — ONE-TIME CANVASES (TEST SLICE)
# Game: The Long Summer — Test Slice
# ═══════════════════════════════════════════════════════════════════════════════
#
# True one-shots in this file (after audit §2.7/§2.8 fixes — count reduced from 4 to 3):
#   - event_test_slice_intro            (game-start; pre-seeds Prologue/arrival flags)
#   - canvas_marge_interview            (first visit to loc_diner_front; sets hired_at_diner)
#   - canvas_first_sunday_morning       (first Sunday morning at loc_kitchen; rent + church)
#
# `canvas_jake_first_glance` was REMOVED 2026-04-30 — folded into
# activity_walk_past_jakes_door's Stage 0 group as a literal flag-gated
# sub-branch + companion "Pass." choice. See 3_activities.toml §8 and
# the audit doc §2.8 for rationale.
#
# The remaining two (canvas_marge_interview, canvas_first_sunday_morning) stay
# as one-shot canvases. Engine-wise they ARE branches: doctrinally, the location
# (loc_diner_front, loc_kitchen) is the "repeatable shell," and a high-priority
# canvas at that location gated on `<flag> == false` is the engine-equivalent
# of a flag-gated `group` block. Same firing semantics; same one-shot guard.
# Doc 01 §"When to use a true one-shot" allows either implementation.
#
# The dev one-shot `event_partner_invitation` lives in 6_dev_shortcuts.toml.

# ─── event_test_slice_intro — starting canvas, pre-seeds Prologue + arrival ──
#
# Per plan §4: "Pre-seed `prologue_complete = true` + `arrived_at_franks = true`
# + `first_morning_kitchen_done = true` (so Frank's love sidebar is already
# revealed)." Schema treats flag_keys as names only; runtime initializes them
# all to FALSE (v1.py:655). The pre-seeding has to happen via flagEffects on
# this canvas's exit_block, which fires once at game start.
#
# 60-word body per plan §4 ("a 60-word 'you wake to the fan, the cicadas, the
# kitchen sounds downstairs' frame that hands the player to hub_mayas_bedroom").
# Density cap: event = 80–250 words per Doc 01 checklist; this one undershoots
# deliberately because all real onboarding lives in hub_mayas_bedroom + the
# scenes — the intro is just the "lights up" moment.

[[canvases]]
id          = "event_test_slice_intro"
name        = "Day 1, 06:00"
description = "Slice intro. Pre-seeds Prologue + arrival flags via exit flagEffects, hands player to loc_mayas_bedroom. Fires once at game start (starting_canvas in 1_metadata)."

[[canvases.nodes]]
id     = "wake"
name   = "Wake"
blocks = [
  { type = "paragraph", content = "She woke before the alarm she had not set. The fan was on. Through the wall, the slow tick of Jake's keyboard. Downstairs, the coffee maker. Somewhere on Route 9 a truck changed gears. The first day of what came next." },
]

[canvases.nodes.exit_block]
type   = "location"
text   = "Sit up."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_mayas_bedroom"
time_progression_minutes = 30

flagEffects = [
  # Pre-Prologue / arrival pre-seeding (per plan §4)
  { targetType = "player", flag = "prologue_at_bed",            op = "set" },
  { targetType = "player", flag = "prologue_saw_them",          op = "set" },
  { targetType = "player", flag = "prologue_crossed_line",      op = "set" },
  { targetType = "player", flag = "prologue_complete",          op = "set" },
  { targetType = "player", flag = "arrived_at_franks",          op = "set" },
  { targetType = "player", flag = "first_morning_kitchen_done", op = "set" },
  # Slice marker
  { targetType = "player", flag = "slice_started",              op = "set" },
  # Dev-mode toggle ON for this build (player slice would set false)
  { targetType = "player", flag = "dev_mode_enabled",           op = "set" },
]


# ─── canvas_marge_interview ──────────────────────────────────────────────────
# First visit to loc_diner_front. Sets `hired_at_diner` + `interview_scheduled`
# (latter not declared in flag_keys — so just `hired_at_diner`). Trigger fires
# once: `hired_at_diner == false`. After this canvas, scene_diner_t0_shift takes
# over as the kitchen's primary canvas during shift hours.

[[canvases]]
id          = "canvas_marge_interview"
name        = "Marge — interview"
description = "First visit to the diner. Marge sizes Maya up in 90 seconds, hires her on the spot. Fires once, gated on `hired_at_diner == false`."

[canvases.trigger]
location      = "loc_diner_front"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "hired_at_diner", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "interview"
name = "Interview"
blocks = [
  { type = "image", props = { file = "scenes/marge_interview.jpg", description = "Marge behind the diner counter, late forties, broad and quick. Apron, pencil behind her ear, the look of a woman who has read the resume of every girl who walks in.", search_queries = [
    "diner owner woman behind counter apron pencil southern",
    "late forties woman diner counter coffee pot apron rural",
    "older diner waitress behind counter southern small town",
    "diner manager woman apron counter rural alabama",
    "woman behind diner counter coffee pot small town summer",
  ] } },

  { type = "paragraph", content = "Marge looked up when the bell over the door went off. She didn't smile — Marge wasn't a smiler at first read. She poured a coffee Maya hadn't asked for and slid it across the counter." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marge" }, content = "You're Diana's girl." },
  { type = "paragraph", content = "Maya nodded. Marge looked her over once — not the up-and-down men did, the up-and-down a woman who had hired forty waitresses did. The shoes. The hands." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_marge" }, content = "Five hours, four-fifty an hour, you keep your tips. Tonight if you want it. Cookie's in the back, she'll show you the float." },
  { type = "paragraph", content = "She didn't wait for an answer. She slid the apron across with the back of her hand and turned to the next customer." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Take the apron."
targetType = "trigger"
time_progression_minutes = 30
effects = [
  { targetType = "npc", npcId = "npc_marge", trait = "trust", op = "add", value = 5 },
  { targetType = "player",                    trait = "energy", op = "add", value = -3 },
]
flagEffects = [
  { targetType = "player", flag = "hired_at_diner", op = "set" },
  { targetType = "player", flag = "talked_to_marge_today", op = "set" },
]


# ─── canvas_first_sunday_morning ─────────────────────────────────────────────
# Day 7. First Sunday morning at the kitchen. Rent prompt + church choice. Fires
# once, gated on Sunday weekday + `first_sunday_passed == false`. Sets
# `first_sunday_passed` (which arms the F4 rent system per [settings.rent]) and
# `first_rent_paid` if Maya pays.

[[canvases]]
id          = "canvas_first_sunday_morning"
name        = "First Sunday — rent and the church"
description = "Day 7. First Sunday morning. Rent due to Frank ($60) + church attendance choice. Fires once on Sunday at the kitchen."

[canvases.trigger]
location      = "loc_kitchen"
is_repeatable = false
priority      = 10
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "first_sunday_passed", operator = "is_false" },
] }
[[canvases.trigger.schedules]]
weekdays   = [6]
start_time = "07:00"
end_time   = "10:00"

[[canvases.nodes]]
id   = "sunday_morning"
name = "Sunday morning"
blocks = [
  { type = "image", props = { file = "scenes/first_sunday_morning.jpg", description = "Frank at the kitchen table on a Sunday morning, sixty dollars cash on the table between them, the church bulletin on the windowsill.", search_queries = [
    "older man kitchen table sunday morning cash on table church bulletin",
    "fifties man rural farmhouse kitchen sunday morning paperwork money",
    "kitchen table sixty dollars sunday morning rural alabama",
    "salt and pepper hair man sunday morning kitchen cash table",
    "rural sunday morning kitchen cash bulletin southern",
  ] } },

  { type = "paragraph", content = "Frank at the table with the same cup he always had. He didn't make a thing of it. He didn't even look up from the paper. The plate beside his cup had three twenties already on it from his side, weighted down with the salt shaker so they wouldn't blow when Diana opened the door." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Sixty. Same as we said." },
  { type = "paragraph", content = "Diana came in from the porch in her good shoes. The Methodist hymnal on top of the church bulletin in her left hand. She didn't say anything. She poured her coffee and stood at the counter waiting." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Pay the sixty. Walk to the service with Diana."
targetType = "trigger"
time_progression_minutes = 180
effects = [
  { targetType = "player", trait = "money",      op = "add", value = -60 },
  { targetType = "player", trait = "rep_church", op = "add", value = 3 },
  { targetType = "npc", npcId = "npc_frank", trait = "trust", op = "add", value = 2 },
  { targetType = "npc", npcId = "npc_diana", trait = "trust", op = "add", value = 2 },
  { targetType = "npc", npcId = "npc_diana", trait = "awareness", op = "add", value = -2, clamp = true },
]
flagEffects = [
  { targetType = "player", flag = "first_sunday_passed",       op = "set" },
  { targetType = "player", flag = "first_rent_paid",           op = "set" },
  { targetType = "player", flag = "attended_church_this_week", op = "set" },
  { targetType = "player", flag = "talked_to_frank_today",     op = "set" },
  { targetType = "player", flag = "talked_to_diana_today",     op = "set" },
]

[[canvases.nodes.exit_block.choices]]
text = "Pay the sixty. Stay home with the sketchbook."
targetType = "trigger"
time_progression_minutes = 60
effects = [
  { targetType = "player", trait = "money",      op = "add", value = -60 },
  { targetType = "npc", npcId = "npc_frank", trait = "trust", op = "add", value = 1 },
  { targetType = "npc", npcId = "npc_diana", trait = "awareness", op = "add", value = 2 },
]
flagEffects = [
  { targetType = "player", flag = "first_sunday_passed",   op = "set" },
  { targetType = "player", flag = "first_rent_paid",       op = "set" },
  { targetType = "player", flag = "talked_to_frank_today", op = "set" },
]


# ─── canvas_jake_first_glance — REMOVED 2026-04-30 (audit §2.8 fix) ──────────
# Folded into activity_walk_past_jakes_door's Stage 0 group as a flag-gated
# sub-branch. Per Doc 01 §"When to use a true one-shot" — first-time beats
# are flag-gated branches inside the repeatable shell (the activity), not
# separate one-shot canvases. The "Pass." choice in the activity (gated on
# the same first-glance conditions) sets jake_first_glance_noticed when picked.
# See 3_activities.toml §8 (activity_walk_past_jakes_door).
