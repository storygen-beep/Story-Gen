# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 6 — DEV SHORTCUTS (TEST SLICE)
# Game: The Long Summer — Test Slice
# ═══════════════════════════════════════════════════════════════════════════════
#
# 9 dev canvases per plan §7.5. All gated on `dev_mode_enabled == true` (set by
# the intro one-shot). Located at loc_mayas_bedroom so the player can access
# them anytime from a known starting hub. Each writes the relevant trait + flag
# state directly so cascade branches at Stage 3+ render.
#
# These get stripped before any player slice — they're for engine validation
# only per the plan's user-locked scope.
#
# Plus event_partner_invitation — the dev-only one-shot per plan §7.4 that
# force-fires Ryan partner_open + sets the Stage 1→2 conditions.

# ═══════════════════════════════════════════════════════════════════════════════
# Frank dev shortcuts
# ═══════════════════════════════════════════════════════════════════════════════

[[canvases]]
id          = "dev_advance_frank_to_3"
name        = "🔧 Dev: Advance Frank to Stage 3"
description = "Sets npc_frank_stage = 3 + frank_restrict_declared + corruption=60 + frank.arousal=30. Verifies Stage 3 cascade in scene_kitchen + scene_franks_office_supervised."

[canvases.trigger]
location      = "loc_mayas_bedroom"
is_repeatable = true
priority      = 1
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key  = "dev_mode_enabled",  operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "npc_frank_stage",   operator = "lt",     value = 3 },
] }

[[canvases.nodes]]
id   = "dev"
name = "Force Frank Stage 3"
blocks = [{ type = "paragraph", content = "[DEV] Frank stage = 3. Catch resolved. Tease cascade open." }]

[canvases.nodes.exit_block]
type = "location"
text = "🔧 Apply"

[canvases.nodes.exit_block.config]
destinationType          = "trigger"
locationId               = "loc_mayas_bedroom"
time_progression_minutes = 0
effects = [
  { targetType = "player",                       trait = "npc_frank_stage", op = "set", value = 3 },
  { targetType = "player",                       trait = "corruption",      op = "set", value = 60 },
  { targetType = "npc",    npcId = "npc_frank", trait = "arousal",         op = "set", value = 30 },
  { targetType = "npc",    npcId = "npc_frank", trait = "trust",           op = "set", value = 30 },
]
flagEffects = [
  { targetType = "player", flag = "frank_caught",            op = "set" },
  { targetType = "player", flag = "frank_restrict_declared", op = "set" },
]


