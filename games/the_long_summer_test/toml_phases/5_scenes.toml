[[canvases.nodes]]
id   = "base"
name = "Living room — Frank walks in"
blocks = [
  { type = "image", props = { file = "scenes/living_room_evening_catch.jpg", description = "Living room at night, lamp on, the porch visible through the front window. The doorway from the hall. The angle of being seen.", search_queries = [
    "rural living room night lamp deep couch porch window doorway",
    "southern farmhouse living room evening lamp light couch dark hallway",
    "interior living room night lamp couch front porch window dim",
    "rural alabama farmhouse interior living room night dim warm",
    "small farmhouse living room night quiet lamp couch coffee table",
  ] } },

  # ─── TIER-3 POLISH 2026-05-03 ────────────────────────────────────────────
  # Per doc 16 §8 + memory entry feedback_tls_scene_body_style.md Tier-3
  # carve-out (stage-flag capstone). Sensory layered (door sound, lamp, book
  # sliding, clock). Frank's voice unchanged from spec. Two real choices
  # below preserved from prior version — only prose is changed. Flag effects
  # untouched (frank_caught, frank_restrict_declared, npc_frank_stage = 2).
  # The clock detail (11:47) is deliberate: Frank said "ten." She's nearly
  # two hours over. Don't lampshade. The "measurement" word is doing work —
  # don't replace.
  { type = "paragraph", content = "She's on the couch when she hears the back door open. Not a slam — Frank doesn't slam. The careful weight of the door fitting back into its frame, the soft click of the latch. She knows the sound now. Has heard it every night for three weeks, after he comes in from the porch." },
  { type = "paragraph", content = "Tonight she didn't expect him this early." },
  { type = "paragraph", content = "The hallway light catches him before she sees his face. He stops in the doorway. Looks at her. Looks at the lamp on the side table — the one she turned on after sundown, the one he doesn't usually find on. Looks at her again." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Late." },
  { type = "paragraph", content = "That's all he says. One word. The air in the room changes shape around it." },
  { type = "paragraph", content = "She sits up. The book she wasn't reading slides off her lap onto the cushion." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Door's supposed to be locked by ten." },
  { type = "paragraph", content = "She opens her mouth to explain — about the hour, about losing track, about the porch light she meant to turn off and forgot. Her voice catches before any of it gets out." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Don't." },
  { type = "paragraph", content = "He doesn't move from the doorway. Doesn't sit. Doesn't ask what she was doing. Just stands there in the hallway light with a look she's never seen on him before — not anger, not exactly. Something tighter. Something with measurement in it. Like he's been thinking about this for longer than tonight." },
  { type = "paragraph", content = "The clock above the kitchen says 11:47." },
]

