# ═══════════════════════════════════════════════════════════════════════════════
# §10 — scene_hallway_frank_pass (PHASE 1 SANDBOX PILOT — random ambient)
# ═══════════════════════════════════════════════════════════════════════════════
# Random ambient encounter on hallway entry, N band 21:30-23:00. Frank passing
# between rooms before bed. Tier-branched by Frank trust: Tier-1 utility at
# trust < 5, Tier-2 vignette at trust 5+, slightly extended at trust 15+.
#
# Per doc 16_Frank_Scene_Library_Design.md §10. Daily cooldown via new flag
# frank_hallway_pass_today (does NOT collide with kitchen scenes' cooldown
# `talked_to_frank_today` — this is ambient, can co-exist with one kitchen
# scene per day).
#
# Sandbox doctrine: ambient scene, NPC presence not strictly required at
# trigger time (Frank passes through fictionally). Engine triggers on location
# + time + chance only.

[[canvases]]
id          = "scene_hallway_frank_pass"
name        = "Hallway — Frank passing"
description = "Random ambient: Frank passes through hallway in N band before bed. Tier-branched by frank.trust (Tier-1 short at <5, Tier-2 at 5+, extended at 15+). Daily cooldown via frank_hallway_pass_today."

[canvases.trigger]
location      = "loc_hallway"
is_repeatable = true
priority      = 4
is_active     = true
chance        = 0.30
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "frank_hallway_pass_today", operator = "is_false" },
  { type = "flag", subject = "player", flag_key = "arrived_at_franks",        operator = "is_true"  },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "21:30"
end_time   = "23:00"

[[canvases.nodes]]
id   = "base"
name = "Hallway — Frank passing"
blocks = [
  { type = "image", props = { file = "scenes/hallway_frank_pass.jpg", description = "Hallway at night, Frank passing through with a coffee mug, the chipped one with a boat painted on it. Soft hallway lamp. Quiet farmhouse interior.", search_queries = [
    "older man walking hallway night coffee mug rural farmhouse warm light",
    "fifties man passing through hallway evening coffee mug interior dim",
    "rural alabama farmhouse hallway night man coffee mug warm lamp",
    "older man hallway evening coffee mug southern home interior",
    "salt and pepper hair man hallway night warm interior dim quiet",
  ] } },

  # ─── Tier 1 — Low trust (< 5). RTS-flat. ──────────────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_frank", trait_key = "trust", operator = "lt", value = 5 },
    ] }, blocks = [
    { type = "paragraph", content = "Frank passes you in the hallway. Coffee mug in his hand. He nods." },
  ] } },

  # ─── Tier 2 — Mid trust (5–14). RTS-flat with brief exchange. ─────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_frank", trait_key = "trust", operator = "gte", value = 5 },
      { type = "trait", subject = "npc", npc_id = "npc_frank", trait_key = "trust", operator = "lt",  value = 15 },
    ] }, blocks = [
    { type = "paragraph", content = "Frank passes you in the hallway. Coffee mug in his hand, the chipped one with the boat on it. He nods." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Lights left on in the living room." },
    { type = "paragraph", content = "You stand there a second." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "I got it." },
    { type = "paragraph", content = "He keeps walking. The kitchen door swings shut behind him." },
  ] } },

  # ─── Tier 2+ — High trust (15+). Slightly extended; not Tier-3 territory. ─
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_frank", trait_key = "trust", operator = "gte", value = 15 },
    ] }, blocks = [
    { type = "paragraph", content = "Frank passes you in the hallway. Coffee mug in his hand, the chipped one with the boat on it." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Lights on in the living room." },
    { type = "paragraph", content = "You start to apologize." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Wasn't asking." },
    { type = "paragraph", content = "He glances at you — quick, unreadable — and keeps walking." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Late tonight. You eat?" },
    { type = "paragraph", content = "The kitchen door swings shut behind him before you answer." },
  ] } },
]

[canvases.nodes.exit_block]
type = "location"
text = "Continue."

[canvases.nodes.exit_block.config]
destinationType          = "trigger"
locationId               = "loc_hallway"
time_progression_minutes = 5
effects = [
  { targetType = "player", trait = "energy", op = "add", value = -1 },
]
flagEffects = [
  { targetType = "player", flag = "frank_hallway_pass_today", op = "set" },
]


