# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 5 — SCENE CANVASES (TEST SLICE)
# Game: The Long Summer — Test Slice
# ═══════════════════════════════════════════════════════════════════════════════
#
# 8 scene canvases per plan §7.2 (revised: split Frank kitchen into 2 per-band
# canvases since `type = "schedule"` condition is NOT handled inside group blocks
# at runtime — only on canvas triggers per v1.py:2126 isScheduleActive). Other
# scenes are single-band so no split.
#
# Each scene = one canvas. Single-node multi-group cascade per Doc 04 §"Cascade
# skeleton". Stage outermost, no time-band overlay (band is selected by which
# canvas fires per the multi-schedule trigger). Stage-3+ branches included as
# small dev fragments so force-advance buttons render correctly.
#
# All scenes:
#   - is_repeatable = true
#   - priority = 6 (above location ambient; below dev shortcuts at priority 8+)
#   - chance = 0.30 (kitchen feels like kitchen most days; per Doc 04 §"Probability gating")
#     except scene_living_room_evening which is deterministic for the catch
#   - Daily-cooldown via `talked_to_<npc>_today` flag (cleared by [engine.daily_tick])
#
# ─── INDEX ─────────────────────────────────────────────────────────────────────
#   §1 — scene_kitchen_with_frank_morning      (M band 06:30–08:30, weekdays)
#   §2 — scene_kitchen_with_frank_dinprep      (DINPREP band 17:00–18:30, weekdays)
#   §3 — scene_kitchen_with_diana              (ambient awareness band variants)
#   §4 — scene_yard_with_ryan                  (A band 08:00–15:00, weekdays)
#   §5 — scene_franks_office_supervised        (post-catch Stage 2 chore-supervision)
#   §6 — scene_living_room_evening             (E/N band, catch one-time guard)
#   §7 — scene_diner_t0_shift                  (DINPREP+E band 17:00–22:00, Mon–Sat)
#   §8 — scene_diner_t1_shift                  (T1 unlock — corruption + rep + beauty gate)


# ═══════════════════════════════════════════════════════════════════════════════
# §1 — scene_kitchen_with_frank_morning
# ═══════════════════════════════════════════════════════════════════════════════
# Frank at the kitchen 06:30–08:30 weekdays. Stage 0/1/2 cascade. Stage 3/4
# fragments included as dev-fragment branches (one paragraph + dialog each)
# so force-advance buttons render correctly per plan §7.2 dev fragment column.

[[canvases]]
id          = "scene_kitchen_with_frank_morning"
name        = "Frank — kitchen, morning"
description = "Morning kitchen surface for Frank. Stages 0/1/2 natural; 3/4 dev-fragment. Trigger gates on Frank's M band schedule + daily cooldown."

[canvases.trigger]
location      = "loc_kitchen"
is_repeatable = true
priority      = 6
is_active     = true
chance        = 0.30
npc           = "npc_frank"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "talked_to_frank_today", operator = "is_false" },
  { type = "flag", subject = "player", flag_key = "arrived_at_franks",     operator = "is_true"  },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4]
start_time = "06:30"
end_time   = "08:30"

[[canvases.nodes]]
id   = "base"
name = "Kitchen — Frank, morning"
blocks = [
  { type = "image", props = { file = "scenes/kitchen_with_frank_morning.jpg", description = "Frank at the kitchen table with the morning paper, coffee mug at his elbow, summer light through the window over the sink.", search_queries = [
    "older man at kitchen table morning paper coffee mug rural farmhouse summer light",
    "fifties man reading newspaper kitchen table butcher block counter",
    "older man morning coffee paper southern rural kitchen window light",
    "salt and pepper hair man kitchen breakfast table paper folded",
    "rural alabama kitchen morning man coffee newspaper",
  ] } },

  # ─── STAGE 0 — Suspicious landlord ─────────────────────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 0 },
    ] }, blocks = [
    { type = "paragraph", content = "Frank had the paper open at the table when she came in. He didn't look up. The kettle was already cool — Diana's pour, an hour ago, before she'd gone out to the garden. Coffee bitter from sitting since five-thirty." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Morning." },
    { type = "paragraph", content = "He folded the corner of the page when she sat. He went back to the page. The clock above the stove was the loudest thing in the kitchen." },
  ] } },

  # ─── STAGE 1 — Grudging warmth (numbers ask) ───────────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 1 },
    ] }, blocks = [
    { type = "paragraph", content = "Frank had the receipts in two stacks at his elbow. He looked up when she came in — actually looked, not the page-turn glance. The kettle was still warm." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "You any good with numbers?" },
    { type = "paragraph", content = "She nodded once. He pushed the smaller stack across to her side of the table. The pen Diana kept in the drawer. The sound of his pencil tapping the column total he'd already done in his head twice." },
  ] } },

  # ─── STAGE 2 — Restrict (post-catch supervised tone) ──────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 2 },
    ] }, blocks = [
    { type = "paragraph", content = "He didn't look up when she came in. He waited until she had the kettle on. The kitchen smelled like the burnt edge of yesterday's coffee. Diana wasn't down yet." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Porch needs sweeping. Before you sit." },
    { type = "paragraph", content = "She set the kettle down. Yes, she said with her body, with the way she crossed the kitchen back to the door. He turned the page of the paper. The sound of his cup against the saucer was the sound the kitchen made on Tuesdays now." },
  ] } },

  # ─── STAGE 3 — Tease under compliance (DEV FRAGMENT) ──────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 3 },
    ] }, blocks = [
    { type = "paragraph", content = "Frank at the table with his coffee cold beside him. He had been watching the door for some time before she came through it. He didn't look down at the paper anymore." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Took your time." },
    { type = "paragraph", content = "She crossed to the kettle. He watched her cross to the kettle. The kitchen was the kitchen and was not the kitchen." },
  ] } },

  # ─── STAGE 4 — Cracked / Keep route (TIER-3 POLISH 2026-05-03) ────────────
  # Per doc 16 §6. Cracked = pretense dropped. Tier-3 carve-out applies.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 4 },
    ] }, blocks = [
    { type = "paragraph", content = "Frank's already at the table when she comes down. The paper's not open this morning. The mug's there but he's not drinking from it. Just sitting with both hands flat on the wood, looking at the doorway she's about to come through." },
    { type = "paragraph", content = "He hears her on the stairs. Doesn't turn." },
    { type = "paragraph", content = "She crosses to the kettle. The kitchen smells like coffee that's been sitting since five. The clock above the stove ticks once, the way it always ticks once before the minute hand jumps." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Maya." },
    { type = "paragraph", content = "Just her name. The way he says it now is not the way he said it the first time, in the doorway, the night of the catch. Then it had measurement in it. This morning it doesn't measure anything. It just lands." },
    { type = "paragraph", content = "She turns from the kettle." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Come sit." },
    { type = "paragraph", content = "Two words. He doesn't add please. He doesn't add the way he used to add a small qualifier, an out, a piece of plausible deniability about whether he was asking or telling. He's not pretending anymore that he doesn't know which one he's doing." },
    { type = "paragraph", content = "She sits across from him. The mug between his hands has gone cold. He pushes it aside without looking at it." },
  ] } },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Pour your coffee."
text_variants = [
  { text = "Pour your coffee. Don't sit yet.", conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "gte", value = 2 },
  ] } },
]
targetType = "trigger"
time_progression_minutes = 30
effects = [
  { targetType = "npc",    npcId = "npc_frank", trait = "trust",   op = "add", value = 1 },
  { targetType = "player",                       trait = "energy",  op = "add", value = -3 },
]
flagEffects = [
  { targetType = "player", flag = "talked_to_frank_today", op = "set" },
]


# ═══════════════════════════════════════════════════════════════════════════════
# §2 — scene_kitchen_with_frank_dinprep
# ═══════════════════════════════════════════════════════════════════════════════
# DINPREP band 17:00–18:30 weekdays. Same stage cascade pattern, different
# surfaces (church-bulletin envelope, onions, dish-gesture). Player sees a
# different paragraph at the same Stage if they visit at this band vs M band
# — that's the doctrinal claim plan §3 row 3 validates.

[[canvases]]
id          = "scene_kitchen_with_frank_dinprep"
name        = "Frank — kitchen, before dinner"
description = "Pre-dinner kitchen surface for Frank. Stages 0/1/2 natural; 3/4 dev-fragment."

[canvases.trigger]
location      = "loc_kitchen"
is_repeatable = true
priority      = 6
is_active     = true
chance        = 0.30
npc           = "npc_frank"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "talked_to_frank_today", operator = "is_false" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4]
start_time = "17:00"
end_time   = "18:30"

[[canvases.nodes]]
id   = "base"
name = "Kitchen — Frank, before dinner"
blocks = [
  { type = "image", props = { file = "scenes/kitchen_with_frank_dinprep.jpg", description = "Frank at the kitchen counter with the church bulletin envelope, evening light, the smell of onions starting on the stove.", search_queries = [
    "older man kitchen counter envelope evening rural farmhouse warm light",
    "fifties man cooking kitchen onions stove southern home dinner prep",
    "older man kitchen evening checkbook envelope warm interior light",
    "rural alabama kitchen evening man at counter receipt paperwork",
    "salt and pepper hair man kitchen dinner preparation southern home",
  ] } },

  # ─── STAGE 0 — Suspicious landlord ────────────────────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 0 },
    ] }, blocks = [
    { type = "paragraph", content = "Frank at the counter with the church-bulletin envelope when she came in. The kitchen smelled like onions. Diana had the pan on. He nodded once at the kettle and went back to the envelope." },
    { type = "paragraph", content = "She knew not to ask what was in the envelope. She knew not to ask what he was writing on the back of it." },
  ] } },

  # ─── STAGE 1 — Grudging warmth (kitchen-shared) ───────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 1 },
    ] }, blocks = [
    { type = "paragraph", content = "Frank was at the counter peeling potatoes when she came in. Diana at the stove. He looked up." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Diana's setting up. Don't get in her way." },
    { type = "paragraph", content = "Diana laughed once at the stove without turning around. Frank's mouth almost did the same thing." },
  ] } },

  # ─── STAGE 2 — Restrict (dish gesture) ────────────────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 2 },
    ] }, blocks = [
    { type = "paragraph", content = "Frank at the counter with the carrots. Diana on a phone call in the back hallway. The tap was running on its own from when Diana had walked away from it." },
    { type = "paragraph", content = "He didn't speak. He gestured at the sink with the tip of the knife, twice. The dishes from breakfast." },
  ] } },

  # ─── STAGE 3 — Tease under compliance (DEV FRAGMENT) ──────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 3 },
    ] }, blocks = [
    { type = "paragraph", content = "He was at the counter with both hands flat on it when she came in. He had been waiting for her to come in. Diana wasn't in the room." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Sit down for a minute." },
  ] } },

  # ─── STAGE 4 — Cracked (DEV FRAGMENT) ─────────────────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 4 },
    ] }, blocks = [
    { type = "paragraph", content = "He had the same look he'd had in the morning. He hadn't put it down. The kitchen was a room he was waiting to leave with her." },
  ] } },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Help with dinner prep."
targetType = "trigger"
time_progression_minutes = 30
effects = [
  { targetType = "npc",    npcId = "npc_frank", trait = "trust",  op = "add", value = 1 },
  { targetType = "npc",    npcId = "npc_diana", trait = "awareness", op = "add", value = 1 },
  { targetType = "player",                       trait = "energy", op = "add", value = -5 },
]
flagEffects = [
  { targetType = "player", flag = "talked_to_frank_today", op = "set" },
  { targetType = "player", flag = "helped_diana_today",    op = "set" },
]


# ═══════════════════════════════════════════════════════════════════════════════
# §3 — scene_kitchen_with_diana
# ═══════════════════════════════════════════════════════════════════════════════
# Ambient Diana scene. No stage gates — Diana doesn't have arc_stages in slice.
# Awareness band variants instead (per Book 2B §5 — diana_awareness 0-24/25-49/
# 50-74/75-100 surfaces only through ambient prose, not sidebar). Single time
# band M (06:00–08:30) since Diana's the kitchen anchor in the morning. Cooldown
# via `talked_to_diana_today` flag.

[[canvases]]
id          = "scene_kitchen_with_diana"
name        = "Diana — kitchen"
description = "Ambient Diana morning scene. Awareness band variants surface Maya's accumulating distance from her mother."

[canvases.trigger]
location      = "loc_kitchen"
is_repeatable = true
priority      = 5
is_active     = true
chance        = 0.40
npc           = "npc_diana"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "talked_to_diana_today", operator = "is_false" },
] }
# Two schedule blocks — OR-applied at runtime per v1.py:2136 (isScheduleActive).
# Audit §2.5 fix: previously only morning band; DINPREP added so Diana ambient
# is present at evening band per plan §8 schedule grid.
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "06:00"
end_time   = "08:30"
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "17:00"
end_time   = "20:30"

[[canvases.nodes]]
id   = "base"
name = "Kitchen — Diana"
blocks = [
  { type = "image", props = { file = "scenes/kitchen_with_diana.jpg", description = "Diana at the kitchen stove or sink, morning light, coffee maker running.", search_queries = [
    "middle aged woman kitchen morning coffee stove southern rural",
    "mother in kitchen breakfast preparation morning light farmhouse",
    "forties woman kitchen sink window morning light coffee",
    "southern mother kitchen stove pancakes morning light family",
    "rural alabama farmhouse kitchen mother morning routine",
  ] } },

  # ─── Awareness band 0–24 — she doesn't look up when Maya comes in late ────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "lte", value = 24 },
    ] }, blocks = [
    { type = "paragraph", content = "Diana at the stove. She didn't turn around when Maya came in. She lifted her coffee, sipped, set it back at the same angle she'd set it down at." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_diana" }, content = "Eggs in the pan. Help yourself." },
  ] } },

  # ─── Awareness band 25–49 — she looks up, smiles, doesn't ask ─────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "gte", value = 25 },
      { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "lte", value = 49 },
    ] }, blocks = [
    { type = "paragraph", content = "Diana at the stove. She looked up when Maya came in and smiled the smile that didn't quite reach. She poured the second cup before Maya sat down." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_diana" }, content = "Eggs are fresh. Sleep alright?" },
  ] } },

  # ─── Awareness band 50–74 — she looks up and doesn't smile ────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "gte", value = 50 },
      { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "lte", value = 74 },
    ] }, blocks = [
    { type = "paragraph", content = "Diana looked up when Maya came in. She didn't smile. She poured the second cup but she didn't slide it across." },
  ] } },

  # ─── Awareness band 75–100 — she doesn't look up at all ───────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "gte", value = 75 },
    ] }, blocks = [
    { type = "paragraph", content = "Diana at the stove. She didn't turn. She didn't pour the second cup. The kitchen was quieter by the time Maya was in it." },
  ] } },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Sit with her a minute."
targetType = "trigger"
time_progression_minutes = 15
effects = [
  { targetType = "npc",    npcId = "npc_diana", trait = "awareness", op = "add", value = -1, clamp = true },
  { targetType = "npc",    npcId = "npc_diana", trait = "trust",     op = "add", value = 1 },
  { targetType = "player",                       trait = "energy",    op = "add", value = -2 },
]
flagEffects = [
  { targetType = "player", flag = "talked_to_diana_today", op = "set" },
]

[[canvases.nodes.exit_block.choices]]
text = "Coffee and out."
targetType = "trigger"
time_progression_minutes = 5
effects = [
  { targetType = "npc",    npcId = "npc_diana", trait = "awareness", op = "add", value = 1 },
  { targetType = "player",                       trait = "energy",    op = "add", value = 2 },
]
flagEffects = [
  { targetType = "player", flag = "talked_to_diana_today", op = "set" },
]


# ═══════════════════════════════════════════════════════════════════════════════
# §4 — scene_yard_with_ryan
# ═══════════════════════════════════════════════════════════════════════════════
# Ryan in the yard 08:00–15:00 weekdays. Stage 0/1 natural; 2/3/4 dev fragment.
# Stage 0 → 1 transition condition (helper ryan_stage_1) is checked by a
# transition canvas in 4b_stage_transitions.toml; this scene just provides the
# Stage-0 and Stage-1 surfaces.
#
# Stage 0 sets `ryan_help_tier_open` flag on the FIRST exit at Stage 0 (one-time
# branch inside the scene per Doc 01). The flag also gates Ryan's love-band
# sidebar reveal.

[[canvases]]
id          = "scene_yard_with_ryan"
name        = "Ryan — yard"
description = "Ryan working in the yard. Stage 0/1 natural; 2/3/4 dev-fragment. First-visit branch sets ryan_help_tier_open."

[canvases.trigger]
location      = "loc_yard"
is_repeatable = true
priority      = 6
is_active     = true
chance        = 0.50
npc           = "npc_ryan"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "talked_to_ryan_today", operator = "is_false" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4]
start_time = "08:00"
end_time   = "15:00"

[[canvases.nodes]]
id   = "base"
name = "Yard — Ryan"
blocks = [
  { type = "image", props = { file = "scenes/yard_with_ryan.jpg", description = "Ryan working with a belt sander or hand tools in the back yard, lean shoulders, faded t-shirt, summer heat.", search_queries = [
    "lean young man working belt sander backyard tarp summer rural",
    "twenty something man woodworking yard project summer faded tshirt",
    "young man yard work tools tarp southern rural alabama summer",
    "lean shoulders man working with tools outdoor summer heat",
    "rural backyard workshop young man hand tools lumber",
  ] } },

  # ─── STAGE 0 — Stranger (first-visit sub-branch + default) ────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_ryan_stage", operator = "eq", value = 0 },
    ] }, blocks = [
    # First-time sub-branch — sets ryan_help_tier_open
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "flag", subject = "player", flag_key = "ryan_help_tier_open", operator = "is_false" },
      ] }, blocks = [
      { type = "paragraph", content = "Ryan with the belt sander on a piece of cedar at the work table. He looked up when her shadow crossed the lumber. He didn't stop. He nodded with his chin." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_ryan" }, content = "Need somethin'?" },
      { type = "paragraph", content = "He set the sander down without turning it off and turned to face her properly. The sander whined down to nothing on the table." },
    ] } },

    # Default Stage-0 (after first visit, before stage advance)
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "flag", subject = "player", flag_key = "ryan_help_tier_open", operator = "is_true" },
      ] }, blocks = [
      { type = "paragraph", content = "Ryan at the work table again. The cedar from yesterday gone, something else under the sander now. He nodded when she came up." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_ryan" }, content = "Hey kid." },
    ] } },
  ] } },

  # ─── STAGE 1 — Helper ─────────────────────────────────────────────────────
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "npc_ryan_stage", operator = "eq", value = 1 },
    ] }, blocks = [
    { type = "paragraph", content = "Ryan looked up before she'd cleared the back porch. He had a customer's truck pulled around — pickup, dented bed, an older man's hat on the dashboard." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_ryan" }, content = "Hey. Get me the smaller adjustable wrench, would ya. The one with the red handle." },
