# §6 — scene_living_room_evening
# ═══════════════════════════════════════════════════════════════════════════════
# The catch. One-time guard branch inside repeatable shell — the doctrinal
# poster child for branch-driven stage transitions. Doc 02 §7.3 says the catch
# fires when Maya does corruption-≥45 solo activity in the living room when
# Frank's home; the branch sets `frank_caught` + `frank_restrict_declared` AND
# writes `npc_frank_stage = 2` directly (per plan §12.1 — branch-inside-shell
# transitions write the trait themselves).
#
# Trigger: deterministic (no chance). E/N band, weekdays. Gates on Frank Stage 1
# AND corruption ≥ 45 AND frank_caught == false. The scene IS the catch — fires
# at most once per playthrough.

[[canvases]]
id          = "scene_living_room_evening"
name        = "Living room — evening"
description = "The catch container. One-time guard branch fires when Maya is in the living room evening at Stage 1 with corruption >= 45 and Frank scheduled home. Sets frank_caught + frank_restrict_declared + advances npc_frank_stage to 2 in same exit."

