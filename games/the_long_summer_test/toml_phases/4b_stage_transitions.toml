# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 4B — STAGE TRANSITION CANVASES (TEST SLICE)
# Game: The Long Summer — Test Slice
# ═══════════════════════════════════════════════════════════════════════════════
#
# Per plan §12.1 — helper-driven transitions need a small canvas that fires
# when the helper clears, writes the integer stage trait, and routes back. The
# helper is the threshold gate (single source); this canvas does the write.
#
# Three natural transitions in the slice:
#   - Frank 0→1: helper frank_stage_1 clears (trust >= 15 + bookkeeping_count >= 3)
#   - Ryan 0→1:  helper ryan_stage_1 clears (trust >= 10 + group_settled_in)
#   - Jake 0→1:  helper jake_stage_1 clears (beauty >= 50 OR jake_first_glance_noticed)
#
# Two "branch-inside-shell" transitions live in their host scenes/activities:
#   - Frank 1→2: scene_living_room_evening (the catch — writes stage in choice effects)
#   - Jake 1→2:  activity_walk_past_jakes_door (the peek/draw revealed branch)
#
# All other Stage 2→3, 3→4 transitions are dev-button only (in 6_dev_shortcuts.toml).
#
# Each transition canvas:
#   - is_repeatable = false (fires once per playthrough)
#   - priority = 9 (above ambient scenes, below catch one-shots at 10)
#   - Trigger gates on `helper is_true AND <slug>_stage == old_value`
#   - Body: one tiny paragraph (the moment of recognition)
#   - Exit effects: write `<slug>_stage = new_value`
#   - Auto-fires on next visit to the canvas's location after gate clears

# ═══════════════════════════════════════════════════════════════════════════════
# Frank 0 → 1 (helper frank_stage_1)
# ═══════════════════════════════════════════════════════════════════════════════
# Located at loc_franks_office (where bookkeeping happens — likeliest place for
# the player to be when the third bookkeeping completes).

[[canvases]]
id          = "transition_frank_to_1"
name        = "Frank — something settles"
description = "Helper-driven Stage 0→1. Fires after trust >= 15 + frank_bookkeeping_count >= 3. Writes npc_frank_stage = 1."

[canvases.trigger]
location      = "loc_franks_office"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "stage", helper = "frank_stage_1", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "npc_frank_stage", operator = "eq", value = 0 },
] }

[[canvases.nodes]]
id   = "moment"
name = "Something settles"
blocks = [
  { type = "paragraph", content = "Frank looked up from the receipts when she set the stack down. He held the look longer than he had any other night. He didn't say anything. He nodded once — small, and not quite at her — and went back to the page." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Out into the hall."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_hallway"
time_progression_minutes = 5
effects = [
  { targetType = "player", trait = "npc_frank_stage", op = "set", value = 1 },
]


# ═══════════════════════════════════════════════════════════════════════════════
# Ryan 0 → 1 (helper ryan_stage_1)
# ═══════════════════════════════════════════════════════════════════════════════
# Located at loc_yard. Fires after trust >= 10 + group_settled_in (which itself
# is set by the slice's progression — see notes below; for the slice we'll set
# group_settled_in via a small auto-fire canvas below that watches the four
# conditions).

[[canvases]]
id          = "transition_ryan_to_1"
name        = "Ryan — kid"
description = "Helper-driven Stage 0→1. Fires after trust >= 10 + group_settled_in. Writes npc_ryan_stage = 1."

[canvases.trigger]
location      = "loc_yard"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "stage", helper = "ryan_stage_1", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "npc_ryan_stage", operator = "eq", value = 0 },
] }

[[canvases.nodes]]
id   = "moment"
name = "Hey, kid"
blocks = [
  { type = "paragraph", content = "Ryan stopped the saw before she'd reached the work table. He pulled the safety glasses up onto his head and looked at her — not the once-over, the once-over-and-decide. He set the board down." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ryan" }, content = "Hey kid. Stick around. I got a guy comin' in." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Stay."

[canvases.nodes.exit_block.config]
destinationType          = "trigger"
locationId               = "loc_yard"
time_progression_minutes = 5
effects = [
  { targetType = "player", trait = "npc_ryan_stage", op = "set", value = 1 },
]


# ═══════════════════════════════════════════════════════════════════════════════
# Jake 0 → 1  — REFACTORED 2026-05-03 (see 7_final_game.toml)
# ═══════════════════════════════════════════════════════════════════════════════
# This phase file's previous `transition_jake_to_1` canvas (helper-driven, OR-
# logic) has been REPLACED by two separate transition canvases in the
# operational source:
#
#   - transition_jake_to_1_via_beauty  (trigger: beauty >= 50, npc_jake_stage == 0,
#                                       jake_first_glance_noticed is_false)
#   - transition_jake_to_1_via_glance  (trigger: jake_first_glance_noticed is_true,
#                                       npc_jake_stage == 0)
#
# The original `jake_stage_1` helper used OR-logic; OR is now banned in
# stage_helpers (validate() rejects it). RTS-aligned pattern is one transition
# canvas per path with inline AND-logic.
#
# Authoritative source: games/the_long_summer_test/toml_phases/7_final_game.toml
# (search for `transition_jake_to_1_via_`). This phase file is NOT updated to
# mirror the refactor — pointer-note pattern only.


# ═══════════════════════════════════════════════════════════════════════════════
# group_settled_in derivation — auto-fires when 3 of 4 conditions met
# ═══════════════════════════════════════════════════════════════════════════════
# Plan §5.2 says group_settled_in flips when player completes ≥3 of:
#   first kitchen (pre-seeded as first_morning_kitchen_done = true)
#   first walk to town (no specific flag — using talked_to_marge_today as proxy)
#   first diner shift (first_t0_shift_done)
#   first yard help (we'll proxy via watched_ryan_today)
#
# Since first_morning_kitchen_done is pre-seeded, only TWO more of the remaining
# three need to fire for group_settled_in to clear. To keep this slice-tractable,
# we author this as an auto-fire canvas at loc_hallway gated on:
#   first_morning_kitchen_done is_true AND
#   first_t0_shift_done        is_true AND
#   watched_ryan_today         is_true
# (3 of 4 conditions, since first_morning_kitchen_done is given)
#
# Once it fires (sets group_settled_in), the Ryan transition canvas above
# can clear its helper and advance Ryan to Stage 1.

[[canvases]]
id          = "transition_group_settled_in"
name        = "Settled in"
description = "Auto-fire when 3 of 4 settling conditions met. Sets group_settled_in flag, which gates ryan_stage_1() helper."

[canvases.trigger]
location      = "loc_hallway"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "first_morning_kitchen_done", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "first_t0_shift_done",        operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "watched_ryan_today",         operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "group_settled_in",           operator = "is_false" },
] }

[[canvases.nodes]]
id   = "settled"
name = "Settled in"
blocks = [
  { type = "paragraph", content = "The hallway was the hallway. The bedroom door was the bedroom door. She'd been here a week and the house had stopped being a house she was visiting. Whatever this was now, she was inside it." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Continue."

[canvases.nodes.exit_block.config]
destinationType          = "trigger"
locationId               = "loc_hallway"
time_progression_minutes = 5

flagEffects = [
  { targetType = "player", flag = "group_settled_in", op = "set" },
]
