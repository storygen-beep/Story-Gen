# ─── E5: Daily tick — clears all `*_today` flags at day rollover ──────────────
# Per PRD 03 §E5: fires once at every day flip, BEFORE any other day-1 logic.
# Plan §3 mechanism row 6 + row 13 validation depends on this.
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "talked_to_frank_today",   op = "unset" },
  { targetType = "player", flag = "talked_to_ryan_today",    op = "unset" },
  { targetType = "player", flag = "talked_to_jake_today",    op = "unset" },
  { targetType = "player", flag = "talked_to_diana_today",   op = "unset" },
  { targetType = "player", flag = "talked_to_marge_today",   op = "unset" },
  { targetType = "player", flag = "talked_to_cookie_today",  op = "unset" },
  { targetType = "player", flag = "helped_diana_today",      op = "unset" },
  { targetType = "player", flag = "did_morning_chore_today", op = "unset" },
  { targetType = "player", flag = "walked_past_jakes_today", op = "unset" },
  { targetType = "player", flag = "watched_ryan_today",      op = "unset" },
]
# doc 40 — daily arousal auto-rise (RTS: both axes climb +1/day, never decay).
# Maya +1 (cap 10); Frank +1 (cap 3). Authoritative copy lives in 7_final_game.toml.
traitEffects = [
  { targetType = "player", trait = "arousal", op = "add", value = 1, cap = 10 },
  { targetType = "npc", npcId = "npc_frank", trait = "arousal", op = "add", value = 1, cap = 3 },
]


# ─── E4: Stage helpers — named composite gates ────────────────────────────────
# Per PRD 03 §E4: helpers reference primitive condition types (trait, flag,
# days_since_flag, etc.) but NOT other helpers — single-level recursion is
# cycle-free per validate-time check at template_import.py:2532.
#
# IMPORTANT (per plan §12.1) — helpers are gate-check ONLY. They evaluate to a
# boolean via the `type = "stage"` condition operator (v1.py:2718-2735). They do
# NOT auto-write the stage trait. Stage advancement happens via:
#   - "Helper-driven" transitions: a small transition canvas in
#     `4b_stage_transitions.toml` gated on `helper is_true AND <slug>_stage == old`,
#     whose exit `effects` writes `<slug>_stage = new`.
#   - "Branch-inside-shell" transitions: a `group` block inside the host hub/scene,
#     gated on the catch/glance/crack one-time guard, whose exit writes both the
#     guard flag and the stage trait directly.
#
# The helpers below are referenced by both transition canvases (as triggers) and
# by hint condition stage_gates (as content selectors). Tuning a helper threshold
# propagates to every site that references it.

# ── Frank ─────────────────────────────────────────────────────────────────────

# REFACTOR 2026-05-04 (doc 18 §3) — frank_stage_1 helper REWRITTEN.
# bookkeeping_count counter retired. Gate now: trust >= 10 + frank_offered_bookkeeping is_true.
# The bookkeeping offer scene (Stage-0→1 branch in scene_kitchen_with_frank_morning,
# new in doc 18 §3) sets the flag when player accepts. Activity is flag-gated.
# Authoritative source: games/the_long_summer_test/toml_phases/7_final_game.toml.
# This phase file uses the pointer-note pattern; not updated for parity.

# REFACTOR 2026-05-04 — frank_stage_2 helper REMOVED.
# The Stage 1→2 helper checked frank_caught + frank_restrict_declared,
# both of which are written by the same effects block as npc_frank_stage = 2
# at scene_living_room_evening (the catch). Post-condition tautology with
# no gate value. Pattern 2 now uses setup._findStageSetterCanvas to surface
# the catch scene's actual trigger conditions (corruption ≥ 45, evening band,
# living room) on the Quests page goal block.
# Authoritative source: games/the_long_summer_test/toml_phases/7_final_game.toml
# (search for `scene_living_room_evening`). This phase file is NOT updated
# to mirror the refactor — pointer-note pattern only.

# REFACTOR 2026-05-04 (doc 18 §5) — frank_stage_3 helper REWRITTEN.
# tease_count + chore_count counters retired. Gate now: corruption >= 50 + restrict +
# Frank.arousal >= 30 + Frank.corruption >= 15 (4-AND, all stat-cumulative, all
# multi-sourced via tease-choice distribution across 6 ambient scenes). Crack moment
# is a branch-inside-shell at scene_franks_office_supervised. Reachable Day 7-9.
# Authoritative source: games/the_long_summer_test/toml_phases/7_final_game.toml.
# This phase file uses the pointer-note pattern; not updated for parity.

# ── Ryan ──────────────────────────────────────────────────────────────────────

[[engine.stage_helpers]]
name = "ryan_stage_1"
description = "Ryan Stage 0→1 gate — group-settled-in + trust threshold. Threshold lowered 15→10 (audit §2.2 fix) so transition fires Day 5-6 instead of Day 12+ at natural cadence (Ryan starts trust=5, +1 per yard help, decay 0.8/day if skipped — trust 15 unreachable in 10 days)."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "npc",    npc_id = "npc_ryan", trait_key = "trust",            operator = "gte", value = 10 },
  { type = "flag",  subject = "player",                      flag_key  = "group_settled_in", operator = "is_true" },
] }

[[engine.stage_helpers]]
name = "ryan_stage_2"
description = "Ryan Stage 1→2 gate — partner invitation + corruption + 5 helps. NATURALLY UNREACHABLE in 10-day slice; dev-button only."
dev_only = true  # Pattern 2 v2.2 (2026-05-04): formalizes the prose annotation. Mirror in 7_final_game.toml.
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "npc",    npc_id = "npc_ryan", trait_key = "trust",             operator = "gte", value = 40 },
  { type = "trait", subject = "player",                      trait_key = "corruption",        operator = "gte", value = 25 },
  { type = "trait", subject = "player",                      trait_key = "ryan_help_count",   operator = "gte", value = 5 },
  { type = "flag",  subject = "player",                      flag_key  = "ryan_partner_open", operator = "is_true" },
] }

# ── Jake ──────────────────────────────────────────────────────────────────────

# REFACTOR 2026-05-03 — jake_stage_1 helper REMOVED.
# OR-logic in stage_helpers is now banned (validate() rejects it). The
# multi-path Stage 0→1 gate is now expressed as two separate transition
# canvases in 7_final_game.toml (the operational source):
#   - transition_jake_to_1_via_beauty  (beauty >= 50)
#   - transition_jake_to_1_via_glance  (jake_first_glance_noticed flag)
# This phase file does NOT need to mirror them; 7_final_game.toml is the
# authoritative source per the existing pointer-note pattern.

[[engine.stage_helpers]]
name = "jake_stage_2"
description = "Jake Stage 1→2 gate — peek/draw revealed branch fired (set inside scene_jakes_doorway evening Stage-1 group when peek_count >= 3 AND corruption >= 30). Reachable Day 6–7."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "jake_peek_draw_revealed", operator = "is_true" },
] }


