# ARCHIVE — Frank's chore activities (removed 2026-05-13)
# ═══════════════════════════════════════════════════════════════════════════════
#
# This file is NOT loaded by the build (package_from_toml takes a single --file
# arg pointing at 7_final_game.toml). It exists only as a recoverable record of
# the two deterministic-repeatable Frank surfaces that were dropped from the
# active game on 2026-05-13.
#
# WHY REMOVED:
# RTS-doctrine review (see chat 2026-05-13) classified Frank's deterministic +
# repeatable + player-initiated interaction surface outside the bedroom hub as
# "just two thin chore activities." Both were undercooked relative to the
# bedroom hub's density:
#   - activity_help_with_chores: 4-block body, 1 Frank line, no choices
#   - activity_morning_chore: Maya sweeps alone; Frank not even on-screen
# Removed wholesale to free the design space for a future deterministic-Frank
# hub redesign rather than ship them as a fig-leaf "yes Frank has Lane-1
# surfaces outside bedroom."
#
# RESURRECTION CHECKLIST (to re-enable both activities, do all of these):
#   1. Re-paste the activity_morning_chore canvas block below into 7_final_game.toml
#      (was at line 1790 under §9 section header).
#   2. Re-paste the activity_help_with_chores canvas block below into 7_final_game.toml
#      (was at line 7681 under §S6 section header).
#   3. Re-paste the chore-offer choice snippet below back into
#      scene_kitchen_with_frank_morning, between the previous choice and the
#      "Brush past him at the coffee maker." choice (was at line 2625).
#   4. Re-add flag declaration `"frank_offered_chores",` to the player flags
#      array in 7_final_game.toml (was at line 400).
#   5. Re-add the [[flags.labels]] block for frank_offered_chores
#      (key = "frank_offered_chores", label = "Frank assigned the chores")
#      (was at line 235).
#   6. Re-add daily_tick unset entries for `did_morning_chore_today` and
#      `helped_with_chores_today` to the daily-reset flagEffects array
#      (were at lines 72 and 77).
#   7. Re-add `{ targetType = "player", flag = "frank_offered_chores", op = "set" },`
#      to flagEffects of dev_advance_frank_to_3 / dev_advance_frank_to_4 /
#      dev_force_catch (were at lines 6389 / 6441 / 6485).
#
# Design-doc references that mention these (kept as historical record, NOT
# updated): 28th_april_TLS_Phase2_Redesign/16_*.md §15, 18_*.md §4, 20_*.md,
# 25_*.md test case.

# ─── activity_morning_chore (verbatim, was 7_final_game.toml:1790–1843) ────────

[[canvases]]
id          = "activity_morning_chore"
name        = "Do the morning chore"
description = "+$5, +1 fitness, -10 energy, -3 hygiene, +1 frank.trust. Available post-catch (Stage 2+) AND after Frank explicitly assigns the chore (frank_offered_chores flag set by Stage-2 kitchen offer beat per doc 18 §4). Daily-cooldown."

[canvases.trigger]
location      = "loc_back_porch"
is_repeatable = true
priority      = 5
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  # 2026-05-11 RTS-shape conversion: dropped npc_frank_stage gate (deprecated).
  # frank_restrict_declared + frank_offered_chores carry the post-catch gating.
  { type = "flag",  subject = "player", flag_key  = "frank_restrict_declared", operator = "is_true" },
  { type = "flag",  subject = "player", flag_key  = "frank_offered_chores",    operator = "is_true" },
  { type = "flag",  subject = "player", flag_key  = "did_morning_chore_today", operator = "is_false" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5]
start_time = "07:00"
end_time   = "10:00"

[[canvases.nodes]]
id   = "base"
name = "Morning chore"
blocks = [
  { type = "image", props = { file = "activities/morning_chore.jpg", description = "Maya sweeping the back porch with a broom, morning light, the yard visible.", search_queries = [
    "young woman sweeping back porch broom morning light rural",
    "porch sweeping summer morning rural farmhouse",
    "young woman chore broom porch southern morning",
    "back porch broom morning light farmhouse summer",
    "young woman sweeping wood porch morning light yard",
  ] } },
  { type = "paragraph", content = "The broom from inside the back door. The boards needed it — Frank wasn't wrong about that. She did the porch and the steps and the patch of yard near the railing. He left a five-dollar bill on the porch railing under a coffee cup when she was done. He didn't say anything." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Take the five."

[canvases.nodes.exit_block.config]
destinationType          = "trigger"
locationId               = "loc_back_porch"
time_progression_minutes = 30
effects = [
  { targetType = "player",                       trait = "money",   op = "add", value = 5 },
  { targetType = "player",                       trait = "fitness", op = "add", value = 1, clamp = true, cap = 80 },
  { targetType = "player",                       trait = "energy",  op = "add", value = -10 },
  { targetType = "player",                       trait = "hygiene", op = "add", value = -3 },
  { targetType = "npc", npcId = "npc_frank",     trait = "trust",   op = "add", value = 1 },
]
flagEffects = [
  { targetType = "player", flag = "did_morning_chore_today", op = "set" },
]


# ─── activity_help_with_chores (verbatim, was 7_final_game.toml:7681–7734) ────

[[canvases]]
id          = "activity_help_with_chores"
name        = "Help with chores"
description = "Voluntary kitchen chores helper. +0.5 frank.trust, +$3. Stages 1+. Daily cooldown via helped_with_chores_today. (Doc 18 §8 retirement: chore_count counter removed.)"

[canvases.trigger]
location      = "loc_kitchen"
is_repeatable = true
priority      = 4
is_active     = true
npc           = "npc_frank"
conditions = { version = "1.0", logic = "AND", items = [
  # 2026-05-11 RTS-shape conversion: dropped npc_frank_stage gte 1 (deprecated).
  # Chores helper now available from Day 1+ — RTS-shape (no stage-locked utility).
  { type = "flag",  subject = "player", flag_key  = "helped_with_chores_today", operator = "is_false" },
  { type = "flag",  subject = "player", flag_key  = "arrived_at_franks",     operator = "is_true"  },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "14:00"
end_time   = "18:30"

[[canvases.nodes]]
id   = "base"
name = "Help with chores"
blocks = [
  { type = "image", props = { file = "activities/help_with_chores.jpg", description = "Maya wiping down the kitchen counter while Frank works at the stove or table. Warm afternoon light. Quiet domestic moment.", search_queries = [
    "young woman wiping kitchen counter older man stove afternoon warm light farmhouse",
    "kitchen chores two people working domestic warm interior afternoon rural",
    "young woman kitchen helping older man cleaning dishes warm afternoon rural",
    "rural alabama kitchen afternoon two people working warm interior light",
    "kitchen chores domestic young woman older man wiping counter southern afternoon",
  ] } },
  { type = "paragraph", content = "You wipe down the counters while Frank rinses the dishes from earlier. Neither of you talks much. The dishrag, the running water, the clink of plates stacking." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Appreciate it." },
  { type = "paragraph", content = "He nods once when you're done." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Hang the rag back up."

[canvases.nodes.exit_block.config]
destinationType          = "trigger"
locationId               = "loc_kitchen"
time_progression_minutes = 30
effects = [
  { targetType = "npc",    npcId = "npc_frank", trait = "trust",  op = "add", value = 1 },
  { targetType = "player",                       trait = "money",  op = "add", value = 3 },
  { targetType = "player",                       trait = "energy", op = "add", value = -3 },
]
flagEffects = [
  { targetType = "player", flag = "helped_with_chores_today", op = "set" },
]


