# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 3 — ACTIVITIES (TEST SLICE)
# Game: The Long Summer — Test Slice
# ═══════════════════════════════════════════════════════════════════════════════
#
# 11 activities per plan §7.3. All single fixed paragraph + image-block with
# 3–5 search_queries (image rotation is the variety mechanism per Doc 04
# anti-pattern #4 — block_pool prose rotation is in the schema but forbidden by
# the doctrine; doctrine wins for slice authoring).
#
# Density target per Doc 01 checklist: 30–80 words per arc-state. Activities in
# this slice are mostly state-pumps (one arc-state) so one paragraph suffices.
#
# Activities are repeatable canvases at locations. Most have daily-cooldown via
# `<x>_today` flags cleared by [engine.daily_tick]. activity_walk_past_jakes_door
# also serves as the Jake "scene cascade" surface — the activity IS the scene
# (the cascade group blocks live in the activity's body) since Jake's surface
# isn't a separate hub.
#
# ─── INDEX ─────────────────────────────────────────────────────────────────────
#   §1 — activity_sleep                  (loc_mayas_bedroom; 22:00–04:00)
#   §2 — activity_shower                 (loc_mayas_bedroom; any time, daily-cooldown via hygiene state)
#   §3 — activity_sketch                 (loc_mayas_bedroom; any time)
#   §4 — activity_eat_from_fridge        (loc_kitchen; any time)
#   §5 — activity_help_diana_kitchen     (loc_kitchen; DINPREP band)
#   §7 — activity_help_ryan_in_yard      (loc_yard; A band, gates Ryan 0→1)
#   §8 — activity_walk_past_jakes_door   (loc_hallway; A band — also the Jake scene cascade)
#   §10 — activity_walk_to_town          (loc_hallway / loc_yard → loc_main_street_sidewalk)
#   §11 — activity_walk_property         (loc_main_street_sidewalk → loc_hallway)


# ═══════════════════════════════════════════════════════════════════════════════
# §1 — activity_sleep
# ═══════════════════════════════════════════════════════════════════════════════
# Resets energy. Day rollover happens during the 480-minute advance, which fires
# [engine.daily_tick] and clears all `*_today` flags automatically. Single-band
# (22:00–04:00 overnight). max_triggers_per_day = 1 prevents same-day re-sleep.

[[canvases]]
id          = "activity_sleep"
name        = "Sleep"
description = "Solo daily activity at loc_mayas_bedroom. Restores energy to 100, advances 8 hours, fires day rollover."

[canvases.trigger]
location      = "loc_mayas_bedroom"
is_repeatable = true
priority      = 4
is_active     = true
max_triggers_per_day = 1
[[canvases.trigger.schedules]]
start_time = "22:00"
end_time   = "04:00"

[[canvases.nodes]]
id   = "base"
name = "Sleep"
blocks = [
  { type = "image", props = { file = "activities/sleep.jpg", description = "Maya's bedroom at night. Twin bed under a window, the quilt half-pushed back, an oscillating fan on the dresser, a small reading lamp on a sketchbook closed on the desk. The window cracked two inches at the bottom; cicadas through it. Late summer Southern night.", search_queries = [
    "young woman small bedroom at night twin bed quilt fan oscillating sketchbook on desk",
    "southern farmhouse guest bedroom night window cracked open cicadas summer reading lamp",
    "rural alabama small bedroom twin bed late night window slightly open warm yellow lamp",
    "young woman bedroom night small lamp window cracked summer fan quilt",
  ] } },
  { type = "paragraph", content = "She turned the lamp off. The fan moved the heat instead of cutting it. Through the wall, the slow tick of Jake's keyboard going quiet. The cicadas through the window-crack. Her hand under the pillow." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Lights off."

[canvases.nodes.exit_block.config]
destinationType          = "trigger"
locationId               = "loc_mayas_bedroom"
time_progression_minutes = 480
effects = [
  { targetType = "player", trait = "energy", op = "set", value = 100 },
]


