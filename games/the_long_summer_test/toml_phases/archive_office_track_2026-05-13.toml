# ─── §S6e — scene_office_frank_diana_call_intercept (RANDOM OVERRIDE) ────────
# Maya walks into office expecting setter; instead overhears Frank on phone with
# Diana about money. ONE-TIME-PER-ARC mutex via frank_diana_call_intercept_used.
# Priority 14 (above setter 11). Chance 0.25. Stage 2+ + frank_restrict_declared.
# Adds Diana-presence tension + +1 calculation (Maya catalogs the moment).

[[canvases]]
id          = "scene_office_frank_diana_call_intercept"
name        = "Frank's office — Diana on the phone"
description = "Random override: Maya pushes the office door open and finds Frank on the phone with Diana about money. He waves her off. ONE-TIME-PER-ARC. Priority 14 beats office setter (11) when chance hits."

[canvases.trigger]
location      = "loc_franks_office"
is_repeatable = true
priority      = 14
is_active     = true
trigger_mode  = "random"
chance        = 0.25
npc           = "npc_frank"
conditions = { version = "1.0", logic = "AND", items = [
  # 2026-05-11 RTS-shape conversion: dropped npc_frank_stage gte 2 (deprecated).
  # frank_restrict_declared carries the post-catch gating.
  { type = "flag",  subject = "player", flag_key  = "frank_restrict_declared",          operator = "is_true"  },
  { type = "flag",  subject = "player", flag_key  = "frank_diana_call_intercept_used",  operator = "is_false" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4]
start_time = "19:00"
end_time   = "21:30"

[[canvases.nodes]]
id   = "base"
name = "Frank's office — Diana on the phone"
# 2026-05-12 L2-1 canvas 6/6 (audit doc 26 / remediation doc 27): converted
# from single-render to single linear cascade per RTS Pattern D doctrine.
# Prose preserved VERBATIM. NO outer-group wrapper (this canvas has no tier
# branches — one-time-per-arc mutex via frank_diana_call_intercept_used).
# P1.6 audit fix (2026-05-12): Frank.love +1 lives on terminal Beat 3 per
# RTS terminal-only doctrine. Was previously on Beat 1 mid-stream; the
# "verbal-share doctrine pattern" framing was TLS-original (per doc 28),
# not RTS-canonical.
blocks = [
  { type = "image", props = { file = "scenes/office_frank_phone_evening.jpg", description = "Frank's office evening. Frank at the desk with a corded phone to his ear, the lamp on, his free hand raised toward the door — wait. Receipts in piles around him.", search_queries = [
    "older man home office desk corded phone evening lamp paper piles raised hand",
    "fifties man at desk corded phone receipts evening office lamp warm interior",
    "salt and pepper hair man home office phone call evening lamp paper desk",
    "rural farmhouse home office man at desk telephone evening lamp paperwork",
    "older man on phone at desk evening lamp office quiet receipts paper",
  ] } },

  { type = "cascade", props = { id = "frank_diana_call_intercept", beats = [
    # Beat 0 — opens. Maya pushes door, Frank at desk on phone, raises hand.
    { blocks = [
      { type = "paragraph", content = "You push the door open. Frank's at the desk with the phone to his ear. He raises a hand without looking — wait." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "I told you I don't know yet." },
    ] },
    # Beat 1 — Pause. He shifts the phone. "Don't bring her name into it."
    # (Love +1 tick previously here moved to terminal Beat 3 per P1.6 audit fix.)
    { advance_text = "Stay in the doorway.", blocks = [
      { type = "paragraph", content = "Pause. Whoever's on the line says something. He shifts the phone." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Don't bring her name into it." },
    ] },
    # Beat 2 — Longer pause. Glances at her, jaw tightens. "Tomorrow."
    { advance_text = "Wait.", blocks = [
      { type = "paragraph", content = "Another pause. Longer. He glances at you in the doorway and the line of his jaw tightens." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Tomorrow." },
    ] },
    # Beat 3 — terminal. Hangs up. Sets receiver slow. "Come back later."
    # P1.6 audit fix (2026-05-12): Frank.love +1 lives here per RTS terminal-only
    # doctrine — fires on cascade-completion click.
    { effects = [
      { targetType = "npc", npcId = "npc_frank", trait = "love", op = "add", value = 1 },
    ], blocks = [
      { type = "paragraph", content = "He hangs up. Doesn't explain. Sets the receiver down with one finger, slow." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_frank" }, content = "Come back later." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "location"
text = "Pull the door closed."

[canvases.nodes.exit_block.config]
destinationType          = "trigger"
locationId               = "loc_hallway"
time_progression_minutes = 5
effects = [
  { targetType = "npc",    npcId = "npc_frank", trait = "trust",       op = "add", value = 1 },
  { targetType = "player",                       trait = "calculation", op = "add", value = 1 },
]
flagEffects = [
  { targetType = "player", flag = "frank_diana_call_intercept_used", op = "set" },
]


