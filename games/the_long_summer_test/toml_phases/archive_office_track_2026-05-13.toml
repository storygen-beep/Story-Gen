# ═══════════════════════════════════════════════════════════════════════════════
# §5c — Frank's office activity menu (parent menu — see doc 24 §3)
# ═══════════════════════════════════════════════════════════════════════════════
# Setter canvas at the office. Renders setter prose + activity menu items
# routing DIRECTLY (cross-canvas nodeId) to the existing triggerless office
# canvases (bookkeeping / talk / supervised / sex). Player picks instead of
# the engine auto-routing to one canvas.
