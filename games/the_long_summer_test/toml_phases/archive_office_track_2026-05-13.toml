#   - activity_bookkeeping_with_frank  (Stage 1+, before supervision intro)
#   - scene_franks_office_supervised   (Stage 2+, after supervision intro)
#   - activity_talk_to_frank
#   - scene_office_after_crack         (Stage 3+, post-crack)
#
# One-shot transitions stay triggered + auto-fire ABOVE this menu's priority:
#   - scene_office_supervision_intro  (one-time Stage 2 setup intro)
#   - scene_office_crack              (one-time Stage 2→3 transition)
#   - transition_frank_to_1           (one-time Stage 0→1 transition)

