# ─── §S2 — activity_talk_to_frank ─────────────────────────────────────────────
# Per-day relationship-builder. Available wherever Frank is. Single shared daily
# cooldown via `talked_to_frank_today` flag — mutex with kitchen morning /
# dinprep / bookkeeping (one Frank-trust source per day, RTS-style discipline).
# Trust gain +1 per use. Per doc 16 §14. Tier-branched dialogue by
# (frank.trust × frank_stage). Stage 0/1 covers Pilot scope. Stage 2+ branch
# included with cooler post-catch tone.

[[canvases]]
id          = "activity_talk_to_frank"
name        = "Talk to Frank"
description = "Per-day relationship-builder. +1 frank.trust on first use per day. Tier-branched dialogue by trust + stage. TRIGGERLESS — reachable only via the office activity menu (scene_franks_office_setter, 'Talk 💬'). Sub-menu canvas. Doctrine: see doc 24 §3."

# NO [canvases.trigger] — sub-menu only. Reachable via cross-canvas nodeId
# from scene_franks_office_setter's "Talk 💬" choice.

[[canvases.nodes]]
id   = "base"
name = "Talk to Frank"
blocks = [
  { type = "image", props = { file = "activities/talk_to_frank.jpg", description = "Frank seated at the kitchen or office table, looking up. Soft warm interior light. Quiet farmhouse moment.", search_queries = [
    "older man kitchen table looking up warm interior light farmhouse",
    "fifties man home conversation table evening warm rural interior",
    "salt and pepper hair man at table looking up southern home warm",
    "rural alabama farmhouse interior man at table evening conversation",
    "older man at home table warm light quiet conversation moment",
  ] } },

  # ─── Tier 1 — Low trust (< 5), pre-catch register. RTS-flat, near non-conversation. ─
  # 2026-05-11 RTS-shape conversion: stage lte 1 → frank_caught is_false (pre-catch).
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc",    npc_id = "npc_frank", trait_key = "trust",         operator = "lt",       value = 5 },
      { type = "flag",  subject = "player",                       flag_key  = "frank_caught", operator = "is_false" },
    ] }, blocks = [
    { type = "paragraph", content = "You catch Frank's eye. He doesn't look away, but he doesn't soften either." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "Need something?" },
    { type = "dialog", props = { speaker = "player", npcId = "npc_frank" }, content = "Just saying hi." },
    { type = "paragraph", content = "He nods. Waits a beat to see if there's more. There isn't." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "Alright." },
    { type = "paragraph", content = "He goes back to whatever he was doing." },
  ] } },

  # ─── Tier 2 — Mid trust (5–14), pre-catch register. Trying-but-not-quite. ──
  # 2026-05-11 RTS-shape conversion: stage lte 1 → frank_caught is_false (pre-catch).
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc",    npc_id = "npc_frank", trait_key = "trust",         operator = "gte",      value = 5  },
      { type = "trait", subject = "npc",    npc_id = "npc_frank", trait_key = "trust",         operator = "lt",       value = 15 },
      { type = "flag",  subject = "player",                       flag_key  = "frank_caught", operator = "is_false" },
    ] }, blocks = [
    { type = "paragraph", content = "Frank looks up when you come into his line of sight." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "How was your day?" },
    { type = "dialog", props = { speaker = "player", npcId = "npc_frank" }, content = "Long. School stuff." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "Mm." },
    { type = "paragraph", content = "He thinks a second. Tries again." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "Eat something. Bread's still good. Soup in the fridge from Tuesday." },
    { type = "dialog", props = { speaker = "player", npcId = "npc_frank" }, content = "Thanks." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "Mm." },
    { type = "paragraph", content = "He's not great at this. But he's trying." },
  ] } },

  # ─── Tier 2+ — High trust (15+), Stage 0/1. Real moment. ──────────────────
  # CANONICAL: First time Frank reveals his late wife. Wife liked peppermint
  # tea, brewed nightly after dinner. Smell still in pantry top. Do NOT repeat
  # this exact memory in other Frank scenes — see doc 16 §14 + §16. Other
  # wife memories should reveal different things.
  # 2026-05-11 RTS-shape conversion: stage lte 1 → frank_caught is_false (pre-catch).
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc",    npc_id = "npc_frank", trait_key = "trust",         operator = "gte",      value = 15 },
      { type = "flag",  subject = "player",                       flag_key  = "frank_caught", operator = "is_false" },
    ] }, blocks = [
    { type = "paragraph", content = "Frank's at the kitchen table with the books open. Looks up when you sit down across from him." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "Tea on the stove. You want some." },
    { type = "dialog", props = { speaker = "player", npcId = "npc_frank" }, content = "Sure." },
    { type = "paragraph", content = "You make the tea. Bring two mugs back. Frank pushes the ledger to the side." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "My wife used to have peppermint. Hated it myself — tastes like medicine. But she'd brew it every night after dinner." },
    { type = "paragraph", content = "He pauses." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "Place still smells like it sometimes. Top of the kitchen pantry. You ever notice?" },
    { type = "dialog", props = { speaker = "player", npcId = "npc_frank" }, content = "I noticed." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "Yeah." },
    { type = "paragraph", content = "He drinks his tea. Doesn't continue." },
  ] } },

  # ─── Tier 2 — Post-catch register. Cooler. ────────────────────────────────
  # 2026-05-11 RTS-shape conversion: stage gte 2 → frank_caught is_true (post-catch).
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "frank_caught", operator = "is_true" },
    ] }, blocks = [
    { type = "paragraph", content = "Frank's at the table. He doesn't look up when you sit." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "Yeah." },
    { type = "dialog", props = { speaker = "player", npcId = "npc_frank" }, content = "Just wanted to talk." },
    { type = "paragraph", content = "He sets the pen down. Looks at you. Looks at the pen." },
    { type = "dialog", props = { speaker = "npc",    npcId = "npc_frank" }, content = "Talking's fine. Door stays open." },
    { type = "paragraph", content = "He picks the pen up again. The conversation, whatever it was going to be, is over." },
  ] } },
]

[canvases.nodes.exit_block]
type = "location"
text = "Excuse yourself."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_franks_office"
time_progression_minutes = 30
effects = [
  { targetType = "npc",    npcId = "npc_frank", trait = "trust",  op = "add", value = 1 },
  { targetType = "player",                       trait = "energy", op = "add", value = -2 },
]
flagEffects = [
]


