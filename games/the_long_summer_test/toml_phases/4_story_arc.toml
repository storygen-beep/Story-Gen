# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 4 — STORY ARC HINTS (TEST SLICE)
# Game: The Long Summer — Test Slice
# ═══════════════════════════════════════════════════════════════════════════════
#
# Per plan §10 — 12 hint templates total: 3 stage-gated per arc NPC × 3 NPCs +
# 1 stall-fallback per NPC. E9 stuck_threshold_days = 7. E10 hint conditions
# use stage_npc/stage_op/stage_value triple per PRD 08 §11.4 schema.
#
# `npc_id` on each template routes the hint into the right NPC section in the
# Quests page. Defaults to `stage_npc` when omitted (per PRD 08 §11.4 routing
# ergonomics). Maya-voice per Book 2B §6.
#
# ─── Authoring model (2026-05-01) ─────────────────────────────────────────────
# Each Quests card = first-person Maya narrative line + optional 💡 tip.
# State changes are conveyed by SWAPPING which template fires, not by adding
# structural UI. The picker rule is:
#
#     (priority desc, condition_items.length desc, file-order asc)
#
# So a crisis variant ("Rent's hanging over me. I can't afford to skip a
# session.") declared with `priority = 10` and an extra condition like
# `missing_flag = "first_rent_paid"` automatically wins over an ambient
# baseline ("Frank wants help with the books.") whenever rent is unpaid.
#
# Most templates leave `priority` unset (default 0) — specificity (number
# of normalized condition_items) handles the tiebreak. Reserve explicit
# `priority` for crisis / time-sensitive overrides.
#
# Frank Stage 0 below ships two templates to demonstrate the pattern.
# Other NPC stages have one template each — add variants as needed.
# Full as-built: 28th_april_TLS_Phase2_Redesign/12_Engine_PRD_09_*.md §2.12

[story_arc]
version = "1.0"

[story_arc.hints]
stuck_threshold_minutes = 30
stuck_threshold_days    = 7
hint_style              = "observation"
stage_stall_message     = "Days are passing. Maya feels herself standing still — maybe one of these arcs needs a fresh approach."

# ═══════════════════════════════════════════════════════════════════════════════
# Frank
# ═══════════════════════════════════════════════════════════════════════════════

# Stage 0 → 1 — baseline. Helper frank_stage_1 = trust ≥ 15 AND
# frank_bookkeeping_count ≥ 3. This is the post-rent voice; the crisis
# variant below overrides it while rent is still unpaid.
[[story_arc.hints.templates]]
text      = "Frank wants help with the books. I could use the money."
npc_id    = "npc_frank"
condition = { stage_npc = "npc_frank", stage_op = "eq", stage_value = 0 }

# Stage 0 → 1 — crisis variant. Fires while rent is unpaid. Picker chooses
# it over the baseline above because of priority = 10 + 2 condition_items
# (stage + missing_flag) vs baseline's 1. Once first_rent_paid flips, this
# stops matching and the baseline takes over — the narrative softens
# automatically.
[[story_arc.hints.templates]]
text      = "Frank's offering bookkeeping work — cash in hand. Rent's hanging over me. I can't afford to skip a session."
npc_id    = "npc_frank"
priority  = 10
condition = { stage_npc = "npc_frank", stage_op = "eq", stage_value = 0, missing_flag = "first_rent_paid" }

# Stage 1 → 2 — branch-inside-shell. The catch fires inside scene_living_room_evening
# when its trigger conditions clear (corruption ≥ 45 + location/time). Engine
# resolves the goal via stage_setter_canvases index → canvas trigger conditions.
[[story_arc.hints.templates]]
text      = "Frank's been watching me different lately. Something's about to shift."
npc_id    = "npc_frank"
condition = { stage_npc = "npc_frank", stage_op = "eq", stage_value = 1 }

# Stage 2 → 3 — helper frank_stage_3 (5 gates). Not reachable in 10-day slice;
# the goal block will show ◯ for unmet gates so the player understands the path
# even if they can't reach it within the slice. Uses dev shortcut for testing.
[[story_arc.hints.templates]]
text      = "Frank's lessons run past their hour. He's making excuses to keep me there."
npc_id    = "npc_frank"
condition = { stage_npc = "npc_frank", stage_op = "eq", stage_value = 2 }


# ═══════════════════════════════════════════════════════════════════════════════
# Ryan
# ═══════════════════════════════════════════════════════════════════════════════
# Stage 0 → 1 — helper ryan_stage_1 = trust ≥ 10 AND group_settled_in.
# group_settled_in flips when 3 of 4 settling conditions met (kitchen pre-seeded
# at game start, so player needs 2 more: diner shift + yard visit).

[[story_arc.hints.templates]]
text      = "Ryan's out in the yard most days. Maybe I should help him."
npc_id    = "npc_ryan"
condition = { stage_npc = "npc_ryan", stage_op = "eq", stage_value = 0 }

[[story_arc.hints.templates]]
text      = "Ryan treats me like family now. The next step is on him."
npc_id    = "npc_ryan"
condition = { stage_npc = "npc_ryan", stage_op = "eq", stage_value = 1 }

[[story_arc.hints.templates]]
text      = "Ryan calls me his partner. He says a big customer's coming."
npc_id    = "npc_ryan"
condition = { stage_npc = "npc_ryan", stage_op = "eq", stage_value = 2 }


# ═══════════════════════════════════════════════════════════════════════════════
# Jake
# ═══════════════════════════════════════════════════════════════════════════════
# Stage 0 → 1 — helper jake_stage_1 is OR-logic (beauty ≥ 50 OR
# jake_first_glance_noticed). Engine renders as "Two paths to advance:".

[[story_arc.hints.templates]]
text      = "Jake stays in his room. Maybe if I look right, he'll notice me."
npc_id    = "npc_jake"
condition = { stage_npc = "npc_jake", stage_op = "eq", stage_value = 0 }

[[story_arc.hints.templates]]
text      = "Jake noticed me last time I walked past. I want to see what happens next."
npc_id    = "npc_jake"
condition = { stage_npc = "npc_jake", stage_op = "eq", stage_value = 1 }

[[story_arc.hints.templates]]
text      = "I caught Jake drawing me. Now I want him to admit it."
npc_id    = "npc_jake"
condition = { stage_npc = "npc_jake", stage_op = "eq", stage_value = 2 }


# ═══════════════════════════════════════════════════════════════════════════════
# Backbone (rent / hygiene / energy) — global hints rendered in "Story Goals"
# ═══════════════════════════════════════════════════════════════════════════════
# E15 (shipped): templates with no `npc_id` are surfaced via setup.getGlobalHints
# and render in a "Story Goals" section above per-NPC sections in QuestsPage.
# These have no stage condition, so auto-render is a no-op — the engine uses
# the legacy " — 🎯 " split path. Authors can still use `tip =` for advice
# that doesn't fit the goal line.

[[story_arc.hints.templates]]
text      = "Rent's due Sunday morning. If I don't have it, I'm out on the street."
condition = { missing_flag = "first_rent_paid" }

[[story_arc.hints.templates]]
text      = "Ugh, I really need a shower."
condition = { missing_trait = "hygiene", gap_gte = 40 }

[[story_arc.hints.templates]]
text      = "I'm wiped. I need to rest before I can think straight."
condition = { missing_trait = "energy", gap_gte = 60 }
