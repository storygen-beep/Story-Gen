# =============================================================================
# Commuter — 0_systems_spec
# Built with author-game-v2. Want + board: games/commuter/WANT.md, v2_state.json
#
# WHO CLIMBS: "both".  the-meters.md W1, declared before a meter was named, and
#   changed from "player" on LO's call at the board phase — the argument for
#   "player" was that no v2 game had ever declared it, which is a novelty
#   argument and not a design one.
#     FLOOR   her three tiers — house / standing / seen. They gate WHETHER the
#             explicit rung exists at all.
#     SPINE   `relation`, per character. It gates how far that person's own
#             ladder has come.
#   Gate 34 wants >=25% of meter-gating on each side. The cut points sit inside
#   the corpus's own empty band (8 roster games at 65%+, 9 ladder games at 13%
#   or less, nothing between); all five earlier v2 games landed at 19-29%
#   because the question was never asked.
#
# METERS
#   TIERS       house · standing · seen. Three DIFFERENT kinds of going further,
#               so a player who does not want one can still climb another.
#   CAST        ONE willingness word for the whole game — `relation`, same scale
#               on all six. W6 as rewritten 2026-08-24: nine of thirteen field
#               games give every person exactly one meter and it is the same
#               word every time. off_season shipped four vocabularies for four
#               people under the old reading; this game deliberately does not.
#               Differentiation is per-site MODIFIERS, and every one is a TRADE
#               — a meter that only opens things is a stat wearing a
#               personality's name.
#   THROTTLE    `arousal` — gates the FINISH link on the act loops and nothing
#               else, reset to 0 at climax (W2). Five v2 games raised it 232
#               times and read it 4, because none of them built a loop for it to
#               gate. This one builds the loop.
#   NEEDS       energy · hunger · hygiene · prep — each shuts a named door
#               (M8-M10). `prep` is the one the premise adds and the one that
#               feeds the taboo economy: the cheapest way out of it is owing
#               somebody.
#   CURRENCY    money. clamp = false on EVERY effect that writes it (§21), or
#               the balance caps at 100 and a 180 demand is unpayable.
#   NO COUNTERWEIGHT. One field game in 25 ships one that gates anything; four
#   of our five shipped one and three gate almost nothing.
#
# ⚠️ NO RUNG STARTS AT 15. All 16 declared tiers across five v2 games put their
#    lowest rung at exactly 15 because templates/board.toml shipped that band
#    table — fifteen clicks in which nothing the player does changes anything.
#    Field runs 8-17 rungs on a player meter and a MEDIAN OF 3 on a per-person
#    one, lowest at ~5 (W4). Every ladder here opens at 5.
#
#      house      5 · 10 · 17 · 25 · 35 · 46 · 58 · 72 · 88
#      standing   5 · 12 · 20 · 30 · 42 · 55 · 70 · 86
#      seen       5 · 11 · 18 · 27 · 38 · 50 · 64 · 80
#      relation   5 · 12 · 22 · 35 · 50 · 68        (per person, all six)
#
# ⚠️ BANDS BELOW ARE THE SIDEBAR'S BUSINESS — how the player READS the meter.
#    They are NOT the rung ladder and neither is derived from the other.
# =============================================================================

schema_version = "1.0"

[project]
id              = "commuter"
title           = "Commuter"
description     = "Nineteen, second year, and living at home because the money went to the payment plan instead of a dorm. The plan is in your name. The gap is made up every week at a kitchen table by a man whose surname you do not have."
starting_canvas = "open_boot"
quests_engine   = "v2"
version         = "0.1"

[time]
starting_hour = 7
starting_day  = "Monday"
starting_week = 1

[settings]
narration_person  = "second"

# ⚠️ CLOTHING IS ON, AND THAT IS A COMMITMENT, NOT A SWITCH. Two costs come with
#    it and both are paid in v0.1 or the flag comes back off:
#    1. The generator emits [[Change Clothes->WardrobePage]] on the wardrobe
#       location UNCONDITIONALLY (v2.py:9601-9602) — no item check — so
#       off_season 0.1 shipped a live link to a page rendered from an empty
#       catalog. The catalog below is non-empty from turn one.
#    2. A declared wardrobe must be READ somewhere or the `wardrobe is read`
#       gate fails: 102 garments across ten of our games against 47 reads
#       between them, and four games read theirs ZERO times.
#    It is on because `seen` is one of the three ascent axes and a `seen` tier
#    with no wardrobe is a number. The read is `worn_exposure` (v2.py:4188,
#    :7999) — NOT worn_beauty or worn_corruption, which are backed by
#    getWornStatMax and SKIP an empty slot (v2.py:1578-1579), so neither can
#    tell naked from plainly dressed. The catalog lives in 1_metadata.
clothing_enabled  = true
wardrobe_location = "her_room"
# The engine ships its own shop: renderShopPage (v2.py:2086) lists every non-initial
# garment with a price > 0, checks affordability, deducts and calls addToWardrobe
# (v2.py:2069-2083). This key is what puts [[Browse Clothes->ShopPage]] on a location
# (v2.py:9770, :9818). Do NOT author a purchase choice for a garment — `itemEffects`
# is a separate inventory system and the importer reads item_id/action, not itemId/op
# (template_import.py:2177-2182), which is why the_allowance's dress purchase grants
# nothing to this day.
shop_location     = "main_street"

[theme]
mode = "dark"


# =============================================================================
# THE SCHOOL PAYMENT — the obligation, and it is NOT rent
#
# Nine of nine earlier v2 games ran a rent-or-debt hook. This is a payment plan
# in her own name, charged by the engine's recurring-demand system with every
# beat of all three pages authored — the mechanism is the engine's, the fiction
# is a bursar's schedule, and [settings.rent.text] is what makes those two the
# same object (engine.md §26).
#
# THE FACE IS RAY. The plan is paid at a window on campus; the money is made up
# at the kitchen table. Putting the collector there makes the weekly reckoning
# the taboo's own scene rather than an errand — R3's "a face" clause, taken
# seriously.
#
# ⚠️ DO NOT AUTHOR A CANVAS THAT NARRATES THE PAYMENT (§26). A shipped game ran
#    this system correctly AND wrote the hand-over scene beside it; the authored
#    canvas carried no cost and no money effect, so it was a free, repeatable,
#    unlimited relation faucet — and the free one was the one with the writing
#    in it. What IS authored here is the ask before it. Never the transaction.
#
# ⚠️ eviction_mode = "flag_set", NOT the default "game_end". The product does
#    not end. Short past the grace week and Ray covers it, which sets
#    `ray_covered` — a DEBT, and the debt is a door. Gate that flag to real
#    content in the same release that can set it: mrs_vance shipped this exact
#    flag set by the engine and read by NOTHING for a month, so the most
#    interesting outcome in its economy opened nothing at all.
#
# ⚠️ It arms at 00:00 on due_day (v2.py:5615), not at the hour Ray's schedule
#    row puts him in the kitchen. start_after_flag keeps the first session
#    pressure-free — the-first-hour.md F4b: the opening states the price and
#    enforces nothing. Twelve of fourteen field openings refuse nothing at all.
#
# ⚠️ currency_symbol must equal board.economy.symbol. Left out it defaults to
#    "$" on the rent pages (v2.py:1190) while every button prints whatever it
#    was typed with; a shipped game wrote one click's price six ways.
# =============================================================================

[settings.rent]
enabled          = true
amount           = 180
currency_symbol  = "$"
due_day          = "Thursday"
collector_npc    = "npc_ray"
grace_periods    = 1
start_after_flag = "first_week_started"
eviction_mode    = "flag_set"
eviction_flag    = "ray_covered"

[settings.rent.text]
title            = "Thursday"
scene            = "He does it before he eats, with his coat still on the back of the chair, because he has worked out that doing it after makes it a conversation. The envelope is already on the table. He does not slide it over until you have sat down."
greeting         = "Hundred and eighty by four o'clock. Did you get the receipt last week?"
paid_scene       = "You count it in front of him because the one time you did not, he asked, and asking was worse. He watches your hands and not your face, which you have decided is a courtesy."
paid_response    = "Take the receipt off the girl. Not the stamp, the printed one."
paid_closing     = "He puts his coat away then, which is how you know it is finished, and the kitchen goes back to being a kitchen."
cant_pay         = "You have not got the hundred and eighty."
warning_scene    = "You tell him it is short. He does not raise his voice and he does not look up from the plan's own letter, which he has kept, and which has your name on it and not his. He reads the line about the second missed instalment out loud so that you have heard it."
warning_response = "One week. I'm not telling your mother, and you should think about what that costs."
warning_closing  = "He leaves the letter on the table facing you when he goes, and he does not take the envelope back."
eviction_scene_soft    = "The second Thursday he has been to the window himself before you are up. The receipt is under the sugar bowl with the printed stamp on it, and he does not mention it, and he waits."
eviction_response_soft = "It's paid. So we're past what you owe the school, and onto what you owe me."
eviction_closing_soft  = "He does not ask you for anything. That is the part you keep turning over, later, upstairs, with the door shut."


# =============================================================================
# SIDEBAR
#
# ⚠️ EVERY BANDED KEY IS `hidden = true` IN [[traits.labels]] BELOW. The sidebar
#    prints a trait twice — once from the auto Traits dump, once from the item
#    you wrote — and the two do not know about each other (§30, gate 27).
# ⚠️ NO `max` ON A TOP BAND: a value landing outside every band renders NOTHING
#    and the card vanishes, which reads as a missing HUD element rather than a
#    wrong number.
# ⚠️ Ceilings are the TOP RUNG (house 88 · standing 86 · seen 80), so the top of
#    each bar is actually bought. Gate 8 fails a bar whose highest authored gate
#    sits below its ceiling — the remaining points would buy nothing and the
#    player is being lied to.
# =============================================================================

# ── the three tiers: identity, so a WORD and never a number (M7) ─────────────
[[sidebar_items]]
type  = "trait_words"
trait = "house"
bands = [
  { min = 0,  max = 16, text = "A guest in it" },
  { min = 17, max = 45, text = "Stops closing the door" },
  { min = 46, max = 71, text = "Goes where she likes" },
  { min = 72, max = 100, text = "Nothing in it is private" },
]

[[sidebar_items]]
type  = "trait_words"
trait = "standing"
bands = [
  { min = 0,  max = 19, text = "One of ninety" },
  { min = 20, max = 41, text = "They know the name" },
  { min = 42, max = 69, text = "Has a key to something" },
  { min = 70, max = 100, text = "She is the one being asked" },
]

[[sidebar_items]]
type  = "trait_words"
trait = "seen"
bands = [
  { min = 0,  max = 17, text = "Covers up" },
  { min = 18, max = 37, text = "Lets a look land" },
  { min = 38, max = 63, text = "Wants it noticed" },
  { min = 64, max = 100, text = "Does it where she'll be caught" },
]

# ── the body: passive banded state (M7) ─────────────────────────────────────
[[sidebar_items]]
type  = "trait_status_text"
trait = "energy"
bands = [
  { min = 0,  max = 19, text = "Running on nothing" },
  { min = 20, max = 49, text = "Tired" },
  { min = 50, max = 79, text = "Alright" },
  { min = 80, text = "Slept" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "hunger"
bands = [
  { min = 0,  max = 24, text = "Empty" },
  { min = 25, max = 54, text = "Could eat" },
  { min = 55, text = "Fed" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "hygiene"
bands = [
  { min = 0,  max = 24, text = "Not going out like this" },
  { min = 25, max = 54, text = "Yesterday's" },
  { min = 55, text = "Clean" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "prep"
bands = [
  { min = 0,  max = 24, text = "Hasn't opened it" },
  { min = 25, max = 54, text = "Skimmed it" },
  { min = 55, text = "Read it twice" },
]

# ── transient mood: band it, hide the volatile figure (M7) ──────────────────
[[sidebar_items]]
type       = "trait_bar"
trait      = "arousal"
hide_value = true
bands = [
  { min = 0,  max = 29, text = "—" },
  { min = 30, max = 64, text = "Warm" },
  { min = 65, max = 100, text = "Close" },
]

# ── countable resource: the exact figure, and NO bands (M7) ─────────────────
[[sidebar_items]]
type       = "trait_bar"
trait      = "money"
hide_value = false


# =============================================================================
# TRAIT LABELS
#
# ⚠️ A trait absent from [[traits.labels]] entirely is NOT hidden; it prints.
#    Every banded key above appears here with hidden = true.
# ⚠️ Hiding also keeps gate 10 honest: its anti-narrowing test walks every
#    player trait and calls a key whose `lt` reads outnumber its `gte` reads a
#    descent — which is exactly what a loop counter read with `lt` looks like.
#    Excluding hidden keys is deliberate in gates.py, because a hidden trait is
#    not a meter the player can be lied to by.
# =============================================================================

[[traits.labels]]
key   = "money"
label = "Money"

[[traits.labels]]
key    = "house"
hidden = true

[[traits.labels]]
key    = "standing"
hidden = true

[[traits.labels]]
key    = "seen"
hidden = true

[[traits.labels]]
key    = "energy"
hidden = true

[[traits.labels]]
key    = "hunger"
hidden = true

[[traits.labels]]
key    = "hygiene"
hidden = true

[[traits.labels]]
key    = "prep"
hidden = true

[[traits.labels]]
key    = "arousal"
hidden = true

# Loop state — hidden numeric traits, NEVER flags. A flag set inside a
# triggerless canvas has no located setter and HARD-FAILS the build (§16).
# These are stage COUNTERS, set to distinct integers and read eq/gte/lt — the
# field's commonest gate shape at 53% equality against our 4.5%, and the one our
# v2 games build least (the-surfaces.md R5d). the_season's wade_loop_stage is
# the worked example that got this right; copy that, not a pile of flags.
[[traits.labels]]
key    = "loop_stage"
hidden = true

[[traits.labels]]
key    = "loop_act"
hidden = true


# =============================================================================
# DAY ROLLOVER — [engine.daily_tick] (§28)
#
# ⚠️ The only clean way to day-cap a TRIGGERLESS rung, and nearly every rung in
#    a v2 game is triggerless: `max_triggers_per_day` is read off the TRIGGER
#    (v2.py:11017), so a hub choice has none.
# ⚠️ THE FLAG IS SET ON THE CHOICE, NEVER ON A RUNG'S EXIT. A choice runs
#    flagEffects BEFORE advanceTime; a node exit runs advanceTime FIRST
#    (v2.py:12648-12733 vs :13085-13088), and advanceTime is where the day rolls
#    and this hook clears. An exit-set cap on a rung crossing midnight starts
#    the new day already capped — off_season's sleep rung ran 21:00→06:00 and
#    was never offered before midnight again from night two. Across the repo 78
#    caps sit on the choice and 40 on an exit, and two games hold 35 of the 40.
# ⚠️ TWO OF THE THREE PARTS VALIDATES AND THROTTLES NOTHING. Every flag cleared
#    here is SET somewhere; the `a day-cap closes` gate exists because a shipped
#    game shipped four caps with the read and the clear and no set.
# ⚠️ THE CAP IS PER PERSON AND THE HUBS ARE PER ROOM. Ray has three hubs and one
#    `ray_rung_today`; spending it in the garage empties the kitchen for the day,
#    which is intended — but every one of those screens keeps a free door
#    (R7, gate 37), or the player cannot tell a spent day from a broken build.
# =============================================================================

[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "washed_today",        op = "unset" },
  { targetType = "player", flag = "read_today",          op = "unset" },
  { targetType = "player", flag = "ate_out_today",       op = "unset" },
  { targetType = "player", flag = "desk_shift_today",    op = "unset" },
  { targetType = "player", flag = "lockup_today",        op = "unset" },
  { targetType = "player", flag = "lab_hour_today",      op = "unset" },
  { targetType = "player", flag = "asked_at_table_today", op = "unset" },
  { targetType = "player", flag = "section_done_today",  op = "unset" },
  { targetType = "player", flag = "ray_rung_today",      op = "unset" },
  { targetType = "player", flag = "gail_rung_today",     op = "unset" },
  { targetType = "player", flag = "cole_rung_today",     op = "unset" },
  { targetType = "player", flag = "doyle_rung_today",    op = "unset" },
  { targetType = "player", flag = "trevor_rung_today",   op = "unset" },
  { targetType = "player", flag = "vic_rung_today",      op = "unset" },
]


[ui.cast_page]
title        = "The House and the Hill"
button_label = "People"
button_icon  = "👥"
intro        = "Three of them share a bathroom with you. Three of them you see because of a timetable."


# =============================================================================
# GUIDANCE — [[quest_cards]] (§23; the-voice.md R2/R3/R5)
#
# A v2 game has no mission and no ending, so the top of this page is not a story
# spine — it is the TIERS themselves. One card per band of each ascent meter, so
# the page always answers "what is the next rung, and what raises it".
#
# ⚠️ NO `version = "1.0"` ON A QUEST CARD. Cards use a separate evaluator
#    (setup.checkQuestsCondition) that does NOT fail open, and it is the only
#    one of the four with no `ne` case — `ne` is rejected at build time on
#    purpose (template_import.py:5502-5509). Canvas conditions are a different
#    path and DO support it.
# ⚠️ A `when` item sets `flag` OR `trait`, never both — the importer rejects an
#    item carrying both (template_import.py:5285).
# ⚠️ `gte X` + `lt Y` on every rung so exactly one matches. An `lt`-only gate is
#    a WINDOW: the card vanishes the moment the meter passes it and the row goes
#    blank. A `gte`-only ladder matches every rung at once and priority order
#    silently decides the game.
# ⚠️ `group` and `npc_id` do not go together — group is ignored on an NPC card
#    with a validator warning (template_import.py:1105). Story-goal cards below
#    use it; character cards do not.
# ⚠️ EVERY card in a character's ladder carries that character's MEETING FLAG in
#    `when`. F5-F8 gate the canvases and say nothing about this surface, and that
#    gap shipped: the_season gated every hub correctly and its Quests page still
#    introduced all five people on click one — names, rooms and hours — before
#    the player had met anybody. Every meeting in that game was spoiled by the
#    page that exists to help.
# ⚠️ Flag names are validated against NOTHING. A typo hides that character's
#    guidance forever and no build error says so. Read each name off the
#    meeting canvas's own flagEffects, not off memory.
# ⚠️ The cast page lists a character exactly when pickQuestsCard returns a card
#    for them (§34), so one flag reveals both surfaces and they cannot fall out
#    of step. A character with no card can never appear on the cast page.
#
# TIP LINES NAME A PLACE, A PERSON WHERE THERE IS ONE, AND A VERB (R3). The
# sidebar already prints the number; what the player cannot see is which
# repeatable click moves it, and in a game where every gate is a meter that is
# the whole of navigation. "Prove yourself to Doyle" fails — no place, no
# clickable action.
# =============================================================================

# ─── house — how much of that house is hers to be seen in ───────────────────

[[quest_cards]]
priority = 90
group    = "house"
text     = "You dress in the bathroom because the bathroom has a lock and your bedroom door has one you have to remember to use. Four people, one landing, and everybody has worked out everybody else's timings without ever agreeing them out loud."
tip      = "Come out of the bathroom without checking the landing first. Sit down at the kitchen table in what you slept in."
when     = [ { trait = "house", subject = "player", op = "gte", value = 0 }, { trait = "house", subject = "player", op = "lt", value = 17 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 17, label = "Stop timing the landing — the hall and the bathroom" } ]

[[quest_cards]]
priority = 90
group    = "house"
text     = "The door stays open while you change now, and nobody has said anything about it, which is its own kind of answer. The hall is eleven feet long and it has started to take a while to cross."
tip      = "Cross the hall in the towel instead of dressing in the bathroom. Stay in the kitchen when Ray comes in off the drive."
when     = [ { trait = "house", subject = "player", op = "gte", value = 17 }, { trait = "house", subject = "player", op = "lt", value = 46 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 46, label = "Stop knocking on the doors in your own house — the hall" } ]

[[quest_cards]]
priority = 90
group    = "house"
text     = "You go into Cole's room without knocking and he does not look up, which means it has been agreed. The only door in the house you still stop outside is the one at the end."
tip      = "Go into the back bedroom while they are both out. Then stop leaving before they get back."
when     = [ { trait = "house", subject = "player", op = "gte", value = 46 }, { trait = "house", subject = "player", op = "lt", value = 72 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 72, label = "Be in the back bedroom when they come up — the back bedroom" } ]

[[quest_cards]]
priority = 90
group    = "house"
text     = "Nothing in this house is private and the arrangement was never spoken about once. Doors stand open, including the one at the end of the landing, and the only person who still thinks about it is you."
tip      = "The back bedroom is a room you walk into now. Keep going back."
when     = [ { trait = "house", subject = "player", op = "gte", value = 72 }, { trait = "house", subject = "player", op = "lt", value = 88 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 88, label = "The top of it — the back bedroom, both of them in it" } ]

# ─── standing — what the college lets her be near, and who is asking whom ───

[[quest_cards]]
priority = 89
group    = "standing"
text     = "You are one of ninety in the 8am section and the buildings lock at nine at night. The desk you work is the only place on this campus where anybody has to deal with you by name."
tip      = "Work the desk. Ask Doyle a question after the section instead of leaving with everyone else."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 0 }, { trait = "standing", subject = "player", op = "lt", value = 20 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 20, label = "Get your name learned — the lecture hall, after the section" } ]

[[quest_cards]]
priority = 89
group    = "standing"
text     = "Doyle knows the name and Vic knows the face. Neither of those is a key, and the difference between knowing you and letting you through a door is the whole of the next stretch."
tip      = "Go to office hours when nobody else does and shut the door behind you. Be on the campus at nine when Vic is doing his round."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 20 }, { trait = "standing", subject = "player", op = "lt", value = 42 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 42, label = "Get a key to something — Doyle's office, the lab" } ]

[[quest_cards]]
priority = 89
group    = "standing"
text     = "There is a building you can be inside after it is locked, because somebody let you in, and the last bus is a thing you catch rather than a thing you are on."
tip      = "Stay on after the lab closes. Let Vic find you on the campus after nine instead of waiting to be found."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 42 }, { trait = "standing", subject = "player", op = "lt", value = 70 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 70, label = "Be the one who gets asked — the service desk" } ]

[[quest_cards]]
priority = 89
group    = "standing"
text     = "The asking runs the other way now. The shift, the favour, the office at six — none of those are things you go and get, and all of them are things that arrive."
tip      = "Take the shifts that come to you. The desk pays differently when the person offering it needs you to say yes."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 70 }, { trait = "standing", subject = "player", op = "lt", value = 86 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 86, label = "The top of it — the service desk, after close" } ]

# ─── seen — who gets to look, and how long she lets them ────────────────────

[[quest_cards]]
priority = 88
group    = "seen"
text     = "You cover up out of habit and you change what you were wearing before you leave the house. Neither of those is a decision yet; both of them are about to become one."
tip      = "Go out in what you already had on. Do not adjust anything on Main Street."
when     = [ { trait = "seen", subject = "player", op = "gte", value = 0 }, { trait = "seen", subject = "player", op = "lt", value = 18 } ]
goals    = [ { trait = "seen", subject = "player", op = "gte", value = 18, label = "Stop covering up — Main Street, the campus" } ]

[[quest_cards]]
priority = 88
group    = "seen"
text     = "A look lands and you do not break it, and the four seconds after that are longer than they have any right to be. What you own is still what you have always owned, which is starting to be the limit."
tip      = "Buy something on Main Street you would not have bought in September, and wear it to the desk."
