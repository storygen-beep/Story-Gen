# =============================================================================
# THE TERMINAL CARDS — what the page says once a ladder has nothing left
#
# ⚠️ A CARD WITH A GOAL IS NOT TERMINAL. `pickQuestsCard` returns the single
#    highest-priority match, so when an arc's last rung is passed and no card
#    matches, that character's whole section VANISHES — heading and all — and
#    the cast page loses them with it (§34). The gate `no chain ends in silence`
#    tests for a card that is `terminal` or carries NEITHER `goals` nor
#    `ready_text` (gates.py:4717); every ladder above ended on a card still
#    chasing a number, so all nine of them failed it.
#
# These are the "you are at the top of this one" cards. No goal, because there
# is nothing left to reach — that is the whole point of the shape. The rung
# below each of them now closes with an `lt`, so exactly one matches.
#
# ⚠️ NOT AN ENDING. `the-release.md`: the product does not close. A terminal
#    card means this LADDER is spent, and the next release adds rungs above it —
#    at which point this card's `when` moves up and it stops being terminal.
# =============================================================================

