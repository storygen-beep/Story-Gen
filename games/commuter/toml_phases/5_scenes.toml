  { targetType = "npc", npcId = "npc_ray", trait = "relation", op = "add", value = 7, cap = 100 },
  { targetType = "player", trait = "seen",    op = "add", value = 3, cap = 100 },
  { targetType = "player", trait = "arousal", op = "add", value = 10, cap = 100 },
