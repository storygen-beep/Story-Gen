# =============================================================================
# Commuter — 5_scenes  ·  THE HUBS, THE TALK SCREENS, THE WALK-INS
#
# WHO CLIMBS = "both". The three player tiers are the FLOOR on the explicit
# content; `relation` is the SPINE of each arc and it lives here. Gate 34 wants
# >=25% of meter-gating on each side, and before this file the cast carried 0%.
#
# F5 · EVERY HUB SITS BEHIND A MEETING. `npc =` is the portrait binding and the
#      met_x flag is what keeps that portrait off the location screen until the
#      introduction has fired. NO hub here carries zero conditions — a
#      cold-spawn hub is what the_inheritance and vesper still ship one of each.
# §19· ONE REPEATABLE CANVAS PER LOCATION + NPC + TIME WINDOW. Checked: every
#      hub below binds a DIFFERENT npc from every other repeatable canvas at its
#      location, and the activities in 3_activities bind none. Two repeatable
#      canvases colliding is a build WARNING, not an error, and the shadowed one
#      is unreachable in play — treat the warning as an error.
# S4 · THE TALK SCREEN IS A CONTENT KIND, NOT A GARNISH. 15,774 of the field's
#      54,630 screens: 55 words, two-thirds spoken, one picture, one way out.
#      vesper runs 26% and every v2 game runs 0-5%. This is also the fix for
#      `somebody speaks`, which regressed 3.9:1 -> 13.5:1 when the ambient layer
#      landed with no speech in it.
# S3 · ONE TERM OF ADDRESS PER PERSON AND NOBODY ELSE USES IT. Roughly every
#      sixth to twentieth line: @ray "kid" · Gail "love" · @cole "trouble" ·
#      Doyle "Miss Reed" · Trevor uses her name and is the only one who does ·
#      Vic "miss". the_season shipped 56 NPC lines and only one character ever
#      addressed the protagonist at all.
# L3 · A REPEATABLE SCREEN CARRIES NO HISTORY. Field max is 5.41% of sentences
#      carrying elapsed time and eight of our nine games are above it. Nothing
#      on a hub says "six years", "since September" or "used to". Backstory is
#      what 2_one_shots is for.
# R3 · THE WALK-IN IS THE LARGEST CONTENT BUCKET IN THE FIELD and the one v2
#      shipped without: 10 substitution rules across 791 canvases in five games.
# =============================================================================


# ═════════════════════════════════════════════════════════════════════════════
# THE HUBS.  Six people, six places, six hours that are theirs.
# ═════════════════════════════════════════════════════════════════════════════

# ── RAY @ the garage, evenings. His hour, and nobody else's.
[[canvases]]
id   = "hub_ray_garage"
name = "@ray"

[canvases.trigger]
location      = "the_garage"
priority      = 6
requires_npc  = "npc_ray"
npc           = "npc_ray"
is_repeatable = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "met_ray", operator = "is_true" },
] }

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "22:00"

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "paragraph", content = "He is in the chair with the door half down and the light on its cable, and he does not get up when you come out." },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "There is a radio on the bench tuned to something with no talking on it. He turns it down when he sees you and does not turn it back up." },
    { type = "paragraph", content = "He has a mug going cold on the arm of the chair and a second one on the bench that he put out before you came." },
    { type = "paragraph", content = "He is doing something to a hinge that does not need doing. He has been doing it for a while." },
    { type = "paragraph", content = "The machine is on its spin and the whole garage is going with it, and he is sitting through it like weather." },
  ] },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ray" }, content = "Shut it behind you, kid, or your mother gets the noise." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Stay out here a bit."
targetType = "node"
nodeId     = "talk_ray.base"

[[canvases.nodes.exit_block.choices]]
text                     = "Sit on the arm of his chair instead of the step. (20m)"
targetType               = "location"
locationId               = "the_garage"
time_progression_minutes = 20
costs                    = [ { trait = "energy", value = 5 } ]
conditions               = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key = "ray_rung_today", operator = "is_false" },
  { type = "trait", subject = "npc", npc_id = "npc_ray", trait_key = "relation", operator = "gte", value = 5 },
] }
flagEffects = [ { targetType = "player", flag = "ray_rung_today", op = "set" } ]
show_when_locked = true
locked_text      = "Not tonight. He has had about as much of you out here as he knows what to do with."
effects = [
  { targetType = "npc", npcId = "npc_ray", trait = "relation", op = "add", value = 5, cap = 100 },
  { targetType = "player", trait = "house", op = "add", value = 2, cap = 100 },
]

[[canvases.nodes.exit_block.choices]]
text                     = "Come out in what you sleep in and stay half an hour. (30m)"
targetType               = "location"
locationId               = "the_garage"
time_progression_minutes = 30
costs                    = [ { trait = "energy", value = 8 } ]
conditions               = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key = "ray_rung_today", operator = "is_false" },
  { type = "trait", subject = "npc", npc_id = "npc_ray", trait_key = "relation", operator = "gte", value = 22 },
  { type = "trait", subject = "player", trait_key = "house", operator = "gte", value = 17 },
] }
flagEffects = [ { targetType = "player", flag = "ray_rung_today", op = "set" } ]
show_when_locked = true
locked_text      = "You would have to walk the whole landing and the length of the drive like that first."
