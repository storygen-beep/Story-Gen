# ═════════════════════════════════════════════════════════════════════════════
# THE WALK-INS
#
# R3. The largest content bucket in the field and the one v2 shipped without:
# 10 substitution rules across 791 canvases in five games, against
# author-game/lanes.md sizing the same mechanism at ~47% of its densest shape.
#
# WHERE THEY COME FROM IS A JOIN, NOT A JUDGEMENT: cross the solo activities at
# a location against the [[npcs.schedules]] rows at that same location. The
# scoreboard computed this set itself. One per qualifying ROOM, never one per
# pair — the raw cross-product is the wall of buttons one layer down.
#
# ⚠️ EVERY TARGET DECLARES A `location`. setup.getCanvasById builds its lookup
#    ONLY from help_data.locationCanvases (v2.py:3177-3191), populated only for
#    canvases carrying trigger.location. Point a substitution at a triggerless
#    rung and it SILENTLY NEVER FIRES — no error, no red build.
