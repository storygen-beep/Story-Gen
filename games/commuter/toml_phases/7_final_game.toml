# =============================================================================
# TRAIT LABELS
#
# ⚠️ A trait absent from [[traits.labels]] entirely is NOT hidden; it prints.
#    Every banded key above appears here with hidden = true.
# ⚠️ Hiding also keeps gate 10 honest: its anti-narrowing test walks every
#    player trait and calls a key whose `lt` reads outnumber its `gte` reads a
#    descent — which is exactly what a loop counter read with `lt` looks like.
#    Excluding hidden keys is deliberate in gates.py, because a hidden trait is
#    not a meter the player can be lied to by.
# =============================================================================

[[traits.labels]]
key   = "money"
label = "Money"

[[traits.labels]]
key    = "house"
hidden = true

[[traits.labels]]
key    = "standing"
hidden = true

[[traits.labels]]
key    = "seen"
hidden = true

[[traits.labels]]
key    = "energy"
hidden = true

[[traits.labels]]
key    = "hunger"
hidden = true

[[traits.labels]]
key    = "hygiene"
hidden = true

[[traits.labels]]
key    = "prep"
hidden = true

[[traits.labels]]
key    = "arousal"
hidden = true

# Loop state — hidden numeric traits, NEVER flags. A flag set inside a
# triggerless canvas has no located setter and HARD-FAILS the build (§16).
# These are stage COUNTERS, set to distinct integers and read eq/gte/lt — the
# field's commonest gate shape at 53% equality against our 4.5%, and the one our
# v2 games build least (the-surfaces.md R5d). the_season's wade_loop_stage is
# the worked example that got this right; copy that, not a pile of flags.
[[traits.labels]]
key    = "loop_stage"
hidden = true

[[traits.labels]]
key    = "loop_act"
hidden = true


# =============================================================================
# DAY ROLLOVER — [engine.daily_tick] (§28)
#
# ⚠️ The only clean way to day-cap a TRIGGERLESS rung, and nearly every rung in
#    a v2 game is triggerless: `max_triggers_per_day` is read off the TRIGGER
#    (v2.py:11017), so a hub choice has none.
# ⚠️ THE FLAG IS SET ON THE CHOICE, NEVER ON A RUNG'S EXIT. A choice runs
#    flagEffects BEFORE advanceTime; a node exit runs advanceTime FIRST
#    (v2.py:12648-12733 vs :13085-13088), and advanceTime is where the day rolls
#    and this hook clears. An exit-set cap on a rung crossing midnight starts
#    the new day already capped — off_season's sleep rung ran 21:00→06:00 and
#    was never offered before midnight again from night two. Across the repo 78
#    caps sit on the choice and 40 on an exit, and two games hold 35 of the 40.
# ⚠️ TWO OF THE THREE PARTS VALIDATES AND THROTTLES NOTHING. Every flag cleared
#    here is SET somewhere; the `a day-cap closes` gate exists because a shipped
#    game shipped four caps with the read and the clear and no set.
# ⚠️ THE CAP IS PER PERSON AND THE HUBS ARE PER ROOM. Ray has three hubs and one
#    `ray_rung_today`; spending it in the garage empties the kitchen for the day,
#    which is intended — but every one of those screens keeps a free door
#    (R7, gate 37), or the player cannot tell a spent day from a broken build.
# =============================================================================

[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "washed_today",        op = "unset" },
  { targetType = "player", flag = "read_today",          op = "unset" },
  { targetType = "player", flag = "ate_out_today",       op = "unset" },
  { targetType = "player", flag = "desk_shift_today",    op = "unset" },
  { targetType = "player", flag = "lockup_today",        op = "unset" },
  { targetType = "player", flag = "lab_hour_today",      op = "unset" },
  { targetType = "player", flag = "asked_at_table_today", op = "unset" },
  { targetType = "player", flag = "section_done_today",  op = "unset" },
  { targetType = "player", flag = "ray_rung_today",      op = "unset" },
  { targetType = "player", flag = "gail_rung_today",     op = "unset" },
  { targetType = "player", flag = "cole_rung_today",     op = "unset" },
  { targetType = "player", flag = "doyle_rung_today",    op = "unset" },
  { targetType = "player", flag = "trevor_rung_today",   op = "unset" },
  { targetType = "player", flag = "vic_rung_today",      op = "unset" },
]


[ui.cast_page]
title        = "The House and the Hill"
