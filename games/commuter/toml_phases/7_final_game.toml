# ═════════════════════════════════════════════════════════════════════════════
# THE TALK SCREENS
#
# S4. The genre's second largest content kind — 15,774 of 54,630 field screens —
# and the cheapest content there is: no media hunt, no ladder, no state. 55
# words, two-thirds spoken, one way out. vesper runs 26% of its canvases as
# these; every v2 game runs 0-5%.
#
# WHAT IT IS FOR: the person, not the plot. Across ~11,000 player comments,
# attachment to a character outscored praise for the porn itself.
#
# Triggerless on purpose — reached by `targetType = "node"` from the hub. Node
# routing resolves to a real passage at BUILD time (§8), so a triggerless target
# is safe here. That is NOT true of a substitution target, which must declare a
# location or it silently never fires. Two mechanisms, two rules.
#
# ⚠️ Every line is in a block_pool. A talk screen is re-entered more than any
#    other screen in the game, and "same gifs every time you do same things every
#    single time" is the top-liked criticism of a field game.
# ═════════════════════════════════════════════════════════════════════════════

