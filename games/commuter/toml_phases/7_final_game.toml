# ═════════════════════════════════════════════════════════════════════════════
# SINKS — and they are SPREAD. A game passed gate 17 at 21 sinks : 20 sources
# while TWELVE of those sinks sat on a single front desk. Presence is not
# placement: pile them at one counter and you have a shop, not an economy.
#
# ⚠️ R1 · MONEY MUST GATE CONTENT, not merely price it. Gate 16 passes on either
#    channel and cannot tell them apart; seven of our ten rent-enabled games have
#    ZERO money conditions and pass on prices alone. The shop ladder below is the
#    condition channel: the dress is on screen from day one and the prose under
#    it changes as she saves toward it.
# ⚠️ GROUPS ORDERED HIGHEST-FIRST. Adjacent [group] blocks compile into ONE
#    exclusive if/elseif chain (v2.py:14637) and first match wins, so a low-first
#    ladder is DEAD below its first rung: the `lt` case matches forever.
# ⚠️ R1b · WHAT MONEY BUYS HAS TO STAY BOUGHT AND BE READ. Across all eight
#    earlier v2 games money bought exactly ONE thing that opened anything, and
#    five of the eight sell nothing at all. The dress is read by worn_exposure.
# ═════════════════════════════════════════════════════════════════════════════

