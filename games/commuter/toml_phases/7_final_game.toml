# =============================================================================
# GUIDANCE — [[quest_cards]] (§23; the-voice.md R2/R3/R5)
#
# A v2 game has no mission and no ending, so the top of this page is not a story
# spine — it is the TIERS themselves. One card per band of each ascent meter, so
# the page always answers "what is the next rung, and what raises it".
#
# ⚠️ NO `version = "1.0"` ON A QUEST CARD. Cards use a separate evaluator
#    (setup.checkQuestsCondition) that does NOT fail open, and it is the only
#    one of the four with no `ne` case — `ne` is rejected at build time on
#    purpose (template_import.py:5502-5509). Canvas conditions are a different
#    path and DO support it.
# ⚠️ A `when` item sets `flag` OR `trait`, never both — the importer rejects an
#    item carrying both (template_import.py:5285).
# ⚠️ `gte X` + `lt Y` on every rung so exactly one matches. An `lt`-only gate is
#    a WINDOW: the card vanishes the moment the meter passes it and the row goes
#    blank. A `gte`-only ladder matches every rung at once and priority order
#    silently decides the game.
# ⚠️ `group` and `npc_id` do not go together — group is ignored on an NPC card
#    with a validator warning (template_import.py:1105). Story-goal cards below
#    use it; character cards do not.
# ⚠️ EVERY card in a character's ladder carries that character's MEETING FLAG in
#    `when`. F5-F8 gate the canvases and say nothing about this surface, and that
#    gap shipped: the_season gated every hub correctly and its Quests page still
#    introduced all five people on click one — names, rooms and hours — before
#    the player had met anybody. Every meeting in that game was spoiled by the
#    page that exists to help.
# ⚠️ Flag names are validated against NOTHING. A typo hides that character's
#    guidance forever and no build error says so. Read each name off the
#    meeting canvas's own flagEffects, not off memory.
# ⚠️ The cast page lists a character exactly when pickQuestsCard returns a card
#    for them (§34), so one flag reveals both surfaces and they cannot fall out
#    of step. A character with no card can never appear on the cast page.
#
# TIP LINES NAME A PLACE, A PERSON WHERE THERE IS ONE, AND A VERB (R3). The
# sidebar already prints the number; what the player cannot see is which
# repeatable click moves it, and in a game where every gate is a meter that is
# the whole of navigation. "Prove yourself to Doyle" fails — no place, no
# clickable action.
# =============================================================================

# ─── house — how much of that house is hers to be seen in ───────────────────

[[quest_cards]]
priority = 90
group    = "house"
text     = "You dress in the bathroom because the bathroom has a lock and your bedroom door has one you have to remember to use. Four people, one landing, and everybody has worked out everybody else's timings without ever agreeing them out loud."
tip      = "Come out of the bathroom without checking the landing first. Sit down at the kitchen table in what you slept in."
when     = [ { trait = "house", subject = "player", op = "gte", value = 0 }, { trait = "house", subject = "player", op = "lt", value = 17 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 17, label = "Stop timing the landing — the hall and the bathroom" } ]

[[quest_cards]]
priority = 90
group    = "house"
text     = "The door stays open while you change now, and nobody has said anything about it, which is its own kind of answer. The hall is eleven feet long and it has started to take a while to cross."
tip      = "Cross the hall in the towel instead of dressing in the bathroom. Stay in the kitchen when Ray comes in off the drive."
when     = [ { trait = "house", subject = "player", op = "gte", value = 17 }, { trait = "house", subject = "player", op = "lt", value = 46 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 46, label = "Stop knocking on the doors in your own house — the hall" } ]

[[quest_cards]]
priority = 90
group    = "house"
text     = "You go into Cole's room without knocking and he does not look up, which means it has been agreed. The only door in the house you still stop outside is the one at the end."
tip      = "Go into the back bedroom while they are both out. Then stop leaving before they get back."
when     = [ { trait = "house", subject = "player", op = "gte", value = 46 }, { trait = "house", subject = "player", op = "lt", value = 72 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 72, label = "Be in the back bedroom when they come up — the back bedroom" } ]

[[quest_cards]]
priority = 90
group    = "house"
text     = "Nothing in this house is private and the arrangement was never spoken about once. Doors stand open, including the one at the end of the landing, and the only person who still thinks about it is you."
tip      = "The back bedroom is a room you walk into now. Keep going back."
when     = [ { trait = "house", subject = "player", op = "gte", value = 72 }, { trait = "house", subject = "player", op = "lt", value = 88 } ]
goals    = [ { trait = "house", subject = "player", op = "gte", value = 88, label = "The top of it — the back bedroom, both of them in it" } ]

# ─── standing — what the college lets her be near, and who is asking whom ───

[[quest_cards]]
priority = 89
group    = "standing"
text     = "You are one of ninety in the 8am section and the buildings lock at nine at night. The desk you work is the only place on this campus where anybody has to deal with you by name."
tip      = "Work the desk. Ask Doyle a question after the section instead of leaving with everyone else."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 0 }, { trait = "standing", subject = "player", op = "lt", value = 20 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 20, label = "Get your name learned — the lecture hall, after the section" } ]

[[quest_cards]]
priority = 89
group    = "standing"
text     = "Doyle knows the name and Vic knows the face. Neither of those is a key, and the difference between knowing you and letting you through a door is the whole of the next stretch."
tip      = "Go to office hours when nobody else does and shut the door behind you. Be on the campus at nine when Vic is doing his round."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 20 }, { trait = "standing", subject = "player", op = "lt", value = 42 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 42, label = "Get a key to something — Doyle's office, the lab" } ]

[[quest_cards]]
priority = 89
group    = "standing"
text     = "There is a building you can be inside after it is locked, because somebody let you in, and the last bus is a thing you catch rather than a thing you are on."
tip      = "Stay on after the lab closes. Let Vic find you on the campus after nine instead of waiting to be found."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 42 }, { trait = "standing", subject = "player", op = "lt", value = 70 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 70, label = "Be the one who gets asked — the service desk" } ]

[[quest_cards]]
priority = 89
group    = "standing"
text     = "The asking runs the other way now. The shift, the favour, the office at six — none of those are things you go and get, and all of them are things that arrive."
tip      = "Take the shifts that come to you. The desk pays differently when the person offering it needs you to say yes."
when     = [ { trait = "standing", subject = "player", op = "gte", value = 70 }, { trait = "standing", subject = "player", op = "lt", value = 86 } ]
goals    = [ { trait = "standing", subject = "player", op = "gte", value = 86, label = "The top of it — the service desk, after close" } ]

# ─── seen — who gets to look, and how long she lets them ────────────────────

[[quest_cards]]
priority = 88
group    = "seen"
text     = "You cover up out of habit and you change what you were wearing before you leave the house. Neither of those is a decision yet; both of them are about to become one."
