# =============================================================================
# Commuter — 0_systems_spec
# Built with author-game-v2. Want + board: games/commuter/WANT.md, v2_state.json
#
# WHO CLIMBS: "both".  the-meters.md W1, declared before a meter was named, and
#   changed from "player" on LO's call at the board phase — the argument for
#   "player" was that no v2 game had ever declared it, which is a novelty
#   argument and not a design one.
#     FLOOR   her three tiers — house / standing / seen. They gate WHETHER the
#             explicit rung exists at all.
#     SPINE   `relation`, per character. It gates how far that person's own
#             ladder has come.
#   Gate 34 wants >=25% of meter-gating on each side. The cut points sit inside
#   the corpus's own empty band (8 roster games at 65%+, 9 ladder games at 13%
#   or less, nothing between); all five earlier v2 games landed at 19-29%
#   because the question was never asked.
#
# METERS
#   TIERS       house · standing · seen. Three DIFFERENT kinds of going further,
#               so a player who does not want one can still climb another.
#   CAST        ONE willingness word for the whole game — `relation`, same scale
#               on all six. W6 as rewritten 2026-08-24: nine of thirteen field
#               games give every person exactly one meter and it is the same
#               word every time. off_season shipped four vocabularies for four
#               people under the old reading; this game deliberately does not.
#               Differentiation is per-site MODIFIERS, and every one is a TRADE
#               — a meter that only opens things is a stat wearing a
#               personality's name.
#   THROTTLE    `arousal` — gates the FINISH link on the act loops and nothing
#               else, reset to 0 at climax (W2). Five v2 games raised it 232
#               times and read it 4, because none of them built a loop for it to
#               gate. This one builds the loop.
#   NEEDS       energy · hunger · hygiene · prep — each shuts a named door
#               (M8-M10). `prep` is the one the premise adds and the one that
#               feeds the taboo economy: the cheapest way out of it is owing
#               somebody.
#   CURRENCY    money. clamp = false on EVERY effect that writes it (§21), or
#               the balance caps at 100 and a 180 demand is unpayable.
#   NO COUNTERWEIGHT. One field game in 25 ships one that gates anything; four
#   of our five shipped one and three gate almost nothing.
#
# ⚠️ NO RUNG STARTS AT 15. All 16 declared tiers across five v2 games put their
#    lowest rung at exactly 15 because templates/board.toml shipped that band
#    table — fifteen clicks in which nothing the player does changes anything.
#    Field runs 8-17 rungs on a player meter and a MEDIAN OF 3 on a per-person
#    one, lowest at ~5 (W4). Every ladder here opens at 5.
#
#      house      5 · 10 · 17 · 25 · 35 · 46 · 58 · 72 · 88
#      standing   5 · 12 · 20 · 30 · 42 · 55 · 70 · 86
#      seen       5 · 11 · 18 · 27 · 38 · 50 · 64 · 80
#      relation   5 · 12 · 22 · 35 · 50 · 68        (per person, all six)
#
# ⚠️ BANDS BELOW ARE THE SIDEBAR'S BUSINESS — how the player READS the meter.
#    They are NOT the rung ladder and neither is derived from the other.
# =============================================================================

schema_version = "1.0"

[project]
id              = "commuter"
title           = "Commuter"
description     = "Nineteen, second year, and living at home because the money went to the payment plan instead of a dorm. The plan is in your name. The gap is made up every week at a kitchen table by a man whose surname you do not have."
starting_canvas = "open_boot"
quests_engine   = "v2"
version         = "0.1"

[time]
starting_hour = 7
starting_day  = "Monday"
starting_week = 1

[settings]
narration_person  = "second"

# ⚠️ CLOTHING IS ON, AND THAT IS A COMMITMENT, NOT A SWITCH. Two costs come with
#    it and both are paid in v0.1 or the flag comes back off:
#    1. The generator emits [[Change Clothes->WardrobePage]] on the wardrobe
#       location UNCONDITIONALLY (v2.py:9601-9602) — no item check — so
#       off_season 0.1 shipped a live link to a page rendered from an empty
#       catalog. The catalog below is non-empty from turn one.
#    2. A declared wardrobe must be READ somewhere or the `wardrobe is read`
#       gate fails: 102 garments across ten of our games against 47 reads
#       between them, and four games read theirs ZERO times.
#    It is on because `seen` is one of the three ascent axes and a `seen` tier
#    with no wardrobe is a number. The read is `worn_exposure` (v2.py:4188,
#    :7999) — NOT worn_beauty or worn_corruption, which are backed by
#    getWornStatMax and SKIP an empty slot (v2.py:1578-1579), so neither can
#    tell naked from plainly dressed. The catalog lives in 1_metadata.
clothing_enabled  = true
wardrobe_location = "her_room"
# The engine ships its own shop: renderShopPage (v2.py:2086) lists every non-initial
# garment with a price > 0, checks affordability, deducts and calls addToWardrobe
# (v2.py:2069-2083). This key is what puts [[Browse Clothes->ShopPage]] on a location
# (v2.py:9770, :9818). Do NOT author a purchase choice for a garment — `itemEffects`
# is a separate inventory system and the importer reads item_id/action, not itemId/op
# (template_import.py:2177-2182), which is why the_allowance's dress purchase grants
# nothing to this day.
shop_location     = "main_street"

[theme]
mode = "dark"


# =============================================================================
# THE SCHOOL PAYMENT — the obligation, and it is NOT rent
#
# Nine of nine earlier v2 games ran a rent-or-debt hook. This is a payment plan
# in her own name, charged by the engine's recurring-demand system with every
# beat of all three pages authored — the mechanism is the engine's, the fiction
# is a bursar's schedule, and [settings.rent.text] is what makes those two the
# same object (engine.md §26).
#
# THE FACE IS RAY. The plan is paid at a window on campus; the money is made up
# at the kitchen table. Putting the collector there makes the weekly reckoning
# the taboo's own scene rather than an errand — R3's "a face" clause, taken
# seriously.
#
# ⚠️ DO NOT AUTHOR A CANVAS THAT NARRATES THE PAYMENT (§26). A shipped game ran
#    this system correctly AND wrote the hand-over scene beside it; the authored
#    canvas carried no cost and no money effect, so it was a free, repeatable,
#    unlimited relation faucet — and the free one was the one with the writing
#    in it. What IS authored here is the ask before it. Never the transaction.
#
# ⚠️ eviction_mode = "flag_set", NOT the default "game_end". The product does
#    not end. Short past the grace week and Ray covers it, which sets
#    `ray_covered` — a DEBT, and the debt is a door. Gate that flag to real
#    content in the same release that can set it: mrs_vance shipped this exact
#    flag set by the engine and read by NOTHING for a month, so the most
#    interesting outcome in its economy opened nothing at all.
#
# ⚠️ It arms at 00:00 on due_day (v2.py:5615), not at the hour Ray's schedule
#    row puts him in the kitchen. start_after_flag keeps the first session
#    pressure-free — the-first-hour.md F4b: the opening states the price and
#    enforces nothing. Twelve of fourteen field openings refuse nothing at all.
#
# ⚠️ currency_symbol must equal board.economy.symbol. Left out it defaults to
#    "$" on the rent pages (v2.py:1190) while every button prints whatever it
#    was typed with; a shipped game wrote one click's price six ways.
# =============================================================================

[settings.rent]
enabled          = true
amount           = 180
currency_symbol  = "$"
due_day          = "Thursday"
collector_npc    = "npc_ray"
grace_periods    = 1
start_after_flag = "first_week_started"
eviction_mode    = "flag_set"
eviction_flag    = "ray_covered"

[settings.rent.text]
title            = "Thursday"
scene            = "He does it before he eats, with his coat still on the back of the chair, because he has worked out that doing it after makes it a conversation. The envelope is already on the table. He does not slide it over until you have sat down."
greeting         = "Hundred and eighty by four o'clock. Did you get the receipt last week?"
paid_scene       = "You count it in front of him because the one time you did not, he asked, and asking was worse. He watches your hands and not your face, which you have decided is a courtesy."
paid_response    = "Take the receipt off the girl. Not the stamp, the printed one."
paid_closing     = "He puts his coat away then, which is how you know it is finished, and the kitchen goes back to being a kitchen."
cant_pay         = "You have not got the hundred and eighty."
warning_scene    = "You tell him it is short. He does not raise his voice and he does not look up from the plan's own letter, which he has kept, and which has your name on it and not his. He reads the line about the second missed instalment out loud so that you have heard it."
warning_response = "One week. I'm not telling your mother, and you should think about what that costs."
warning_closing  = "He leaves the letter on the table facing you when he goes, and he does not take the envelope back."
eviction_scene_soft    = "The second Thursday he has been to the window himself before you are up. The receipt is under the sugar bowl with the printed stamp on it, and he does not mention it, and he waits."
eviction_response_soft = "It's paid. So we're past what you owe the school, and onto what you owe me."
eviction_closing_soft  = "He does not ask you for anything. That is the part you keep turning over, later, upstairs, with the door shut."


# =============================================================================
# SIDEBAR
#
# ⚠️ EVERY BANDED KEY IS `hidden = true` IN [[traits.labels]] BELOW. The sidebar
#    prints a trait twice — once from the auto Traits dump, once from the item
#    you wrote — and the two do not know about each other (§30, gate 27).
# ⚠️ NO `max` ON A TOP BAND: a value landing outside every band renders NOTHING
#    and the card vanishes, which reads as a missing HUD element rather than a
#    wrong number.
# ⚠️ Ceilings are the TOP RUNG (house 88 · standing 86 · seen 80), so the top of
#    each bar is actually bought. Gate 8 fails a bar whose highest authored gate
#    sits below its ceiling — the remaining points would buy nothing and the
#    player is being lied to.
# =============================================================================

