# =============================================================================
# Commuter — 3_activities  ·  THE STANDING SURFACES
#
# R2 · A ROOM'S LIST IS NEEDS + WORK + PEOPLE, and nothing else. A body needs
#      about five things and a room contains fifty nouns: needs are a CLOSED
#      list, objects are an OPEN one, so the count sizes itself. The rule this
#      replaced — declare the objects and hang a choice off each — shipped a
#      kitchen with five buttons, three of which had a free duplicate inside the
#      first. People are hubs and they live in 5_scenes. Field median for
#      things-to-do-at-a-place is THREE; gate 20's cap of 8 is a backstop.
# M8 · EVERY NEED SHUTS A NAMED DOOR, or it is a chore. the_allowance declared a
#      hygiene decay, shipped FOUR ways to wash, and had ZERO conditions reading
#      it — a fully wired loop that meant nothing.
#        energy   -> spent through `costs`; under the band the 8am is gone
#        hunger   -> gates the desk shift and the lab hour
#        hygiene  -> gates the desk shift and the section (she will not go out)
#        prep     -> gates the section rungs; the way through is owing Doyle
# M5 · A DAY-CAP FLAG GOES ON THE CHOICE, never on a rung's exit. A choice runs
#      flagEffects BEFORE advanceTime; an exit runs advanceTime FIRST
#      (v2.py:12648-12733 vs :13085-13088), and advanceTime is where the day
#      rolls and [engine.daily_tick] clears. off_season's sleep rung ran
#      21:00->06:00 with the flag on the exit and was never offered before
#      midnight again from night two.
#      ⚠️ A LOCATED canvas needs no flag: max_triggers_per_day is read off the
#      trigger (v2.py:11017) and markCanvasTriggered stamps the day key BEFORE
#      advanceTime (v2.py:4290), so it is immune.
# R7 · EVERY SCREEN KEEPS ONE DOOR. A choice whose conditions fail renders
#      NOTHING (v2.py:12806), and a COST-BEARING choice counts as conditional
#      too (v2.py:12827-12836) — so a screen whose only affordance costs $3 is
#      as empty at $0 as a spent hub is. Every screen below has one choice with
#      neither `conditions` nor `costs`, written to CLOSE the beat.
# R6 · MECHANISM 5 — `block_pool`. 46 uses in the_long_summer, 14 in
#      under_one_roof, 6 in vesper, and ZERO across every v2 game. Every base
#      node here carries one. "Same gifs every time you do same things every
#      single time" is the top-liked criticism of a field game.
# C4 · A LABEL THAT SPENDS THE CLOCK SAYS HOW MUCH, in one form held across the
#      game, and the stated duration is the real spend. C3 · a label may never
#      name a CLOCK TIME — the engine has no absolute-time advance (0 hits).
# C5 · IF A THING HAS HOURS, PUBLISH THEM. show_when_blocked + cooldown_message
#      at the TOP LEVEL of [canvases.trigger] keep a closed activity as a dimmed
#      line carrying the author's words instead of dropping it silently
#      (v2.py:11055, rendered :5143). Authoring them under trigger.metadata is a
#      DEAD PATH: valid TOML, green build, and showWhenBlocked reaches the HTML
#      zero times. One game in the repo uses this surface at all.
# §21· clamp = false ON EVERY MONEY GRANT, or the balance caps at 100 and the
#      $180 demand is unpayable. A `costs` deduction is hard-clamped 0-100 and
#      CANNOT be unclamped, so above 100 the next priced purchase truncates.
# =============================================================================


