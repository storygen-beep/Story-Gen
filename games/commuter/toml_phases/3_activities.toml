# ═════════════════════════════════════════════════════════════════════════════
# THE WORLD ACTS FIRST — trigger_mode = "random", and the TRAVERSAL LAYER
#
# R6 mechanism 4 is the one games actually drop: an event that replaces the
# whole screen. Measured across the field, `trigger_mode = "random"` canvases —
# vesper 14, forty_miles 8, and back_home / steam / seventh_day ZERO.
#
# This is also gate 5, and the reason it exists: movement between scenes is most
# of the play minutes, so a non-erotic traversal layer wins by sheer occupancy.
# A room that is warm only when she is working at it is a game that is cold most
# of the time she is playing it.
