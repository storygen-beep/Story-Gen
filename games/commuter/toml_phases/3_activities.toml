# ── SLEEP.  Located + max_triggers_per_day, so it needs no flag and cannot hit
#    the midnight trap. energy is a RESTORE, so `cap` is exactly what cap is for
#    (§29): it bounds the VALUE, never the rate.
[[canvases]]
id       = "act_sleep"
name     = "Sleep"

[canvases.trigger]
priority             = 20
location             = "her_room"
is_repeatable        = true
max_triggers_per_day = 1
show_when_blocked    = true
cooldown_message     = "from ten at night, once a night"

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "22:00"
end_time   = "04:00"

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The wall behind your bed is nine inches of drywall. You have known which side of it to sleep on since you were thirteen. You still sleep on that side." },
    { type = "paragraph", content = "The landing light stays on until your mother is in. You can see the line of it under your door and you wait for it to go out." },
    { type = "paragraph", content = "The plant bus goes past the end of the road at ten past. You are usually awake for it and usually asleep by the next one." },
    { type = "paragraph", content = "Your bag is packed by the door with the reading in it. You did that at sixteen too, for the same reason, so the morning is somebody else's problem." },
  ] },
]

[canvases.nodes.exit_block]
type = "location"
text = "Sleep. (8h)"

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "her_room"
time_progression_minutes = 480
effects = [
  { targetType = "player", trait = "energy", op = "add", value = 75, cap = 100 },
]


