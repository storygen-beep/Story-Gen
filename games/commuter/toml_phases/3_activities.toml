# ═════════════════════════════════════════════════════════════════════════════
# WORK — where the money comes from. Three channels, and the honest weekly max
# is the sum of them: desk 5 x $28 = 140 · lab 4 x $18 = 72 · asking 7 x $20 =
# 140, so $352 against a $180 demand. She never HAS to ask. Energy and the clock
# are what make her, and the sinks are what take it.
#
# ⚠️ NO PAYMENT CANVAS. [settings.rent] takes the money (§26). A shipped game ran
#    that system correctly AND wrote the hand-over scene beside it, and the
#    authored one carried no cost and no money effect — a free, repeatable,
#    unlimited relation faucet, and the free one was the one with the writing in
#    it. The ask BEFORE is authored. The transaction is not.
# ⚠️ R5 · NO FREE UNCAPPED INCOME, gated rungs included. "A gate in front of a
#    printer delays the printer." Every earning choice below carries BOTH a day
#    flag and an energy cost.
# ═════════════════════════════════════════════════════════════════════════════

