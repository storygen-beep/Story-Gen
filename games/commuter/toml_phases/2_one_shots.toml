[[canvases]]
id       = "meet_doyle"
name     = "The eight o'clock"

[canvases.trigger]
priority      = 90
location      = "the_lecture_hall"
is_repeatable = false
requires_npc  = "npc_doyle"

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4]
start_time = "08:00"
end_time   = "09:00"

[[canvases.nodes]]
id = "base"
name = "Base"
blocks = [
  { type = "paragraph", content = "The man who takes the eight o'clock section is at the bottom of the room by the door. He is marking a register he clearly resents. Forty-six, jacket, a stack of paper he keeps squaring. Ninety of you and one of him." },
  { type = "paragraph", content = "He reads the list out. At your name he stops a half second longer than the ones either side. Then he goes on." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_doyle" }, content = "Miss Reed. You're the one who's actually done the reading, going by Friday's sheet." },
  { type = "paragraph", content = "Eighty-nine people hear him say it. He goes straight back to the register and does not look up again for the whole hour." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Find a seat."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_lecture_hall"
time_progression_minutes = 5
flagEffects = [ { targetType = "player", flag = "met_doyle", op = "set" } ]


