# =============================================================================
# Commuter — 1_metadata_and_locations
#
# THE MAP: nested_zones. `main_street` is the ROOT — no entry_from at all — and
# both hubs hang off it, neither containing the other. Gate 28 reads entry_from
# and fails a leaf: a game declared an exterior, priced it at 25 minutes, passed
# every gate, and hung it off the kitchen, so stepping outside meant stepping
# from one interior into a row of shops.
#
#   main_street  (ROOT · exterior · 10 min)
#   ├── the_campus        (15 min)          ├── home              (5 min)
#   │   ├── the_service_desk  ANCHOR        │   ├── her_room
#   │   ├── the_lecture_hall                │   ├── the_bathroom
#   │   ├── doyles_office                   │   ├── the_kitchen
#   │   └── the_lab                         │   ├── coles_room
#   │                                       │   ├── the_garage
#   │                                       │   └── the_back_bedroom
#
# TRAVEL FRICTION SITS ON THE ZONE CROSSINGS AND NOWHERE ELSE (the-map.md R3).
# Bathroom to kitchen is free; house to campus is 25 minutes. That is what makes
# a schedule grid matter — with free instant travel, "who is where at which
# hour" is a lookup table.
#
# THIRTEEN LOCATIONS, DERIVED — needs + work + people, counted, not picked
# (the-board.md §1). Budgets are in v2_state.json board.locations[].fill, in
# round numbers, WRITTEN BEFORE THE PROSE: 34,000 total, anchor 26.47%, heat
# 12/13. Gate 1 refuses to credit a budget that is mostly non-round, because all
# three earlier v2 games back-filled theirs from the delivered word count and so
# matched their own plan 8/8 while proving nothing.
#
# NAMES ARE BUTTONS, READ ON EVERY TURN (R4). Public venue = bare plain noun;
# private or owned interior = possessive. Flavour lives in the description,
# never on the label.
#   ⚠️ AND A CUSTOMIZABLE NPC'S NAME CANNOT REACH A LOCATION LABEL. Ray and Cole
#      carry relationship_options, so the player renames them; a location called
#      "Cole's Room" would contradict whatever they typed. Genericized to "His
#      Room" and "Their Room" — the same fix late_shifts made for the same
#      reason. Doyle is not customizable, so "Doyle's Office" is safe.
#
# DESCRIPTIONS SAY WHAT THE PLACE IS FOR, THEN WHAT IT LOOKS LIKE (F9). It is
# the only surface the player sees on EVERY visit, so "what is this place" is a
# standing question and not a first-entry one. The measured failure described an
# anchor budgeted at 27% of the whole game as "…and under them forty machines" —
# forty machines of what — and it was long, specific and well written.
# =============================================================================

schema_version = "1.0"


# ─────────────────────────────────────────────────────────────────────────────
# THE PLAYER
# ─────────────────────────────────────────────────────────────────────────────

[player]
id   = "player"
name = "Dana"
# ⚠️ ON, and the fields below are READ BACK. W1, measured over 13 corpus games
#    with a creation step: the field reads every created value a median of FOUR
#    times after creation and the median game leaves NONE unread. We read 12
#    times across 14 fields, with 6 read nowhere at all. That is the whole rule.
#    `major` and `hair` are printed on the campus surfaces and in the bathroom;
#    `name` is the @player token everywhere.
customizable = true

[player.core_traits]
# ── the three ascent tiers — the FLOOR (who_climbs = "both") ────────────────
house    = 0
standing = 0
seen     = 0

# ── the throttle. Declared BECAUSE the act loops exist to gate (W2) ─────────
arousal  = 0

# ── the body. Every key here is in board.needs[] with a `shuts`, and every one
#    is read by a condition (gates 29 and 33) ──────────────────────────────
energy   = 100
hunger   = 80
hygiene  = 90
prep     = 55

# ── the currency. clamp = false on EVERY effect that writes it (§21) ────────
money    = 40

# ── arc position, per character. NOT a second meter: the ENGINE reads these —
#    applyAndNotifyTrait matches /^([a-z_]+)_stage$/ and writes
#    game_state.stage_advancement_log on an upward delta (v2.py:5549-5554), so
#    gate 33 exempts a `<npc>_stage` key whose prefix names a declared
#    character. `relation` is what GATES; the stage is what the sidebar and the
#    cast page can read the arc off. It is also R5d's stage counter — the
#    field's commonest gate shape at 53% equality against our 4.5%, and the one
#    our v2 games build least.
ray_stage    = 0
gail_stage   = 0
cole_stage   = 0
doyle_stage  = 0
trevor_stage = 0
vic_stage    = 0

# ── loop state. Hidden numeric traits, never flags — a flag set inside a
#    triggerless canvas has no located setter and HARD-FAILS the build (§16) ──
loop_stage = 0
loop_act   = 0

# ⚠️ POSITIVE MAGNITUDES. The validator rejects a negative (§11). `energy` is
#    deliberately absent: it is the SPENT shape, drained through `costs` on the
#    rungs, not the decay shape (M10). What a need cannot be is neither.
[player.trait_decay]
hunger  = 35
hygiene = 22
prep    = 18

# ─── customization fields ────────────────────────────────────────────────────
# ⚠️ ARRAY-OF-TABLES, AND IT MUST SIT AFTER EVERY [player.*] SUBTABLE — TOML
#    scoping, or the nested tables re-parent themselves.
# W2: the payload is a WORD, not a gate. Only 1.8% of the field's reads of a
# created value are conditions, 82% of its controls are free text and 0% are
# numeric. Do not design branches on what she picked; print it.
# W3: three fields, not thirty. Field median is 3.
[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "Your name"
default = "Dana"

[[player.customization_fields]]
id      = "major"
type    = "text"
label   = "What you're reading"
default = "English"

[[player.customization_fields]]
id      = "hair"
type    = "select"
label   = "Hair"
default = "dark"
options = ["dark", "fair", "red", "black"]


# ─────────────────────────────────────────────────────────────────────────────
# THE WARDROBE
#
# ⚠️ A DECLARED WARDROBE MUST BE READ SOMEWHERE or the `wardrobe is read` gate
#    fails — 102 garments across ten of our games against 47 reads between them,
#    and four of those games read theirs ZERO times. The reader here is
#    `worn_exposure` on the `seen` rungs.
# ⚠️ `worn_exposure` and NOT worn_beauty / worn_corruption. Those two are backed
#    by getWornStatMax, which SKIPS a slot with nothing in it and starts at zero
#    (v2.py:1578-1579), so a naked player and one in a plain bra and cotton
#    briefs return the same number. worn_exposure takes the MAX across the
#    outfit AND treats an empty core slot as bare (v2.py:4188, :7999). It is our
#    equivalent of degrees-of-lewdity's `$exposed`, the most-read variable in
#    that game — 654 tests of `gte 1`, 307 of `gte 2` — against 54 reads of any
#    per-slot detail. The single 0/1/2 scalar is what the field gates on.
# ⚠️ No `type` tags. A type with no matching clothing_rules trips a build
#    warning; add both together or neither.
# ─────────────────────────────────────────────────────────────────────────────

[[clothing]]
id         = "plain_bra"
name       = "Plain bra"
slot       = "bra"
image      = "clothing/plain_bra.jpg"
initial    = true
beauty     = 0
corruption = 0
exposure   = 0

[[clothing]]
id         = "cotton_briefs"
name       = "Cotton briefs"
slot       = "underwear"
image      = "clothing/cotton_briefs.jpg"
initial    = true
beauty     = 0
corruption = 0
exposure   = 0

[[clothing]]
id         = "grey_sweater"
name       = "Grey sweater"
slot       = "top"
image      = "clothing/grey_sweater.jpg"
initial    = true
beauty     = 0
corruption = 0
exposure   = 0

[[clothing]]
id         = "jeans"
name       = "Jeans"
slot       = "bottom"
image      = "clothing/jeans.jpg"
initial    = true
beauty     = 1
corruption = 0
exposure   = 0

[[clothing]]
id         = "trainers"
name       = "Trainers"
slot       = "shoes"
image      = "clothing/trainers.jpg"
initial    = true
beauty     = 0
corruption = 0
exposure   = 0

# ── the two purchases. R1b: what money buys has to STAY bought, and be READ.
#    Across all eight earlier v2 games money bought exactly ONE thing that
#    opened anything; five of the eight sell nothing at all.
[[clothing]]
id         = "thin_top"
name       = "Thin top"
slot       = "top"
image      = "clothing/thin_top.jpg"
initial    = false
price      = 18
beauty     = 2
corruption = 1
exposure   = 1

[[clothing]]
id         = "black_dress"
name       = "Black dress"
slot       = "dress"
image      = "clothing/black_dress.jpg"
initial    = false
price      = 45
beauty     = 3
corruption = 2
exposure   = 1


# =============================================================================
# LOCATIONS
#
# `serves` — needs / work / people — is recorded in v2_state.json, not here. It
# is the room's MENU and its length (the-surfaces.md R2). A room that answers
# none of the three is not a location yet: vesper shipped 12 of 30 thin or dead,
# six of them completely empty.
#
# The field median for things-to-do-at-a-place is THREE, max six. Gate 20's cap
# of 8 is a backstop against the pathological case and is NOT the sizing rule —
# a game built after that cap existed put 19 of its 30 screens at exactly 8 and
# shipped the same 213 choices as the game the cap was written to fail.
# =============================================================================

# ─── THE ROOT. No entry_from. Everything else hangs off this. ────────────────
[[locations]]
id                   = "main_street"
name                 = "Main Street"
description          = "The strip between the campus gate and the houses, and the only ground in this town that belongs to nobody. A row of shops that shut at six, a bakery that does not, a bus shelter with the timetable scratched off. Everyone walks it twice a day and looks at everyone else doing it."
image                = "locations/main_street.jpg"
image_search_queries = ["small american college town main street", "empty main street shops evening"]
navigation_order     = ["the_campus", "home"]
costs                = { time = 10 }

# ─── THE CAMPUS ZONE ────────────────────────────────────────────────────────
[[locations]]
id                   = "the_campus"
name                 = "Dutton State"
description          = "The grounds the buildings sit in — the crossing everybody makes between classes, and the window where the payment plans get paid. Paths cut across grass that is not supposed to be walked on. After nine at night the doors are shut and there is one man with the keys."
image                = "locations/the_campus.jpg"
image_search_queries = ["small college campus quad path", "university grounds at night lit paths"]
entry_from           = "main_street"
navigation_order     = ["the_service_desk", "the_lecture_hall", "doyles_office", "the_lab"]
costs                = { time = 15 }

[[locations]]
id                   = "the_service_desk"
name                 = "Service Desk"
description          = "The counter inside the front doors where students collect things, hand things in and complain — and the job that pays for her share of the plan. Everyone on this campus walks past it, most of them twice, and the person behind it is the one who has to look up."
image                = "locations/the_service_desk.jpg"
image_search_queries = ["university front desk counter student", "campus reception desk interior"]
entry_from           = "the_campus"
navigation_order     = []

[[locations]]
id                   = "the_lecture_hall"
name                 = "Lecture Hall"
description          = "Where the eight o'clock section is taught, to ninety people, by a man who is contracted to be there. Seats going up in rows, one door at the bottom, and nowhere at all to sit that is not visible from the front."
image                = "locations/the_lecture_hall.jpg"
image_search_queries = ["small university lecture theatre tiered seats", "empty lecture hall morning"]
entry_from           = "the_campus"
navigation_order     = []

[[locations]]
id                   = "doyles_office"
