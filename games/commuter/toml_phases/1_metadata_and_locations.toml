image                = "locations/the_back_bedroom.jpg"
image_search_queries = ["double bedroom two bedside tables laundry", "parents bedroom daylight bed made"]
entry_from           = "home"
navigation_order     = []


# =============================================================================
# THE CAST
#
# ONE willingness word for the whole game — `relation`, same scale on all six,
# rungs 5 · 12 · 22 · 35 · 50 · 68. W6, rewritten 2026-08-24: nine of thirteen
# corpus games that run a per-person meter give every person exactly one and it
# is the same word every time. off_season shipped four vocabularies for four
# people under the old reading of this rule; this game deliberately does not.
# DIFFERENTIATION IS THE MODIFIERS, and every one is a TRADE — a meter that only
# opens things is a stat wearing a personality's name.
#
#   npc_ray     raised by being the one who needs something from him
#               COSTS: asking for money drops it. The ask is priced.
#   npc_gail    raised by being in the room when she is not being a mother
#               COSTS: it falls while `house` is low — she reads the house first
#   npc_cole    raised by being caught, by not being careful
#               COSTS: it drops when she covers up
#   npc_doyle   raised by `prep` — arriving having done the reading
#               COSTS: a missed section drops it; the extension spends it
#   npc_trevor  raised by time on the same lab shift
#               COSTS: nothing. He has no power over her, so he has no price.
#   npc_vic     raised by being on campus after nine
#               COSTS: it falls if she uses a door he did not open
#
# ⚠️ R8 — A PERSON OWNS A CORNER OF THE WORLD, AND THE SCHEDULE HAS TO AGREE.
#    Each one below has a place and an hour where he is the ONLY one there:
#      ray    the_garage 19:00-22:00      doyle   doyles_office 14:00-17:00
#      gail   the_kitchen 05:30-07:00     trevor  the_lab 18:00-22:00
#      cole   coles_room 01:00-11:00      vic     the_campus 21:00-01:00
#    the_season passed R8's writing half — four men, four genuinely separate
#    subjects — and collapsed its sixteen schedule rows into two places, all
#    four in the camp every night. He is never the only man in the room, so he
#    never gets to be a particular man. The ONE deliberate shared window here is
#    Ray and Gail overnight in their own bed, which is the point.
#
# ⚠️ ORDERING: [[npcs.schedules]] binds to the [[npcs]] block ABOVE it.
#    Inserting a new character between an existing one and its schedules
#    silently re-parents them.
# ⚠️ AN OVERNIGHT WINDOW IS ONE ROW ONLY IF THE ROW COVERS EVERY WEEKDAY. The
#    wrap and the weekday are two separate checks and the weekday one runs first
#    against TODAY (v2.py:3596-3597). `weekdays = [1]`, 23:00-06:00 puts someone
#    on site Tuesday night and DELETES them at midnight. Every wrapping row
#    below is [0,1,2,3,4,5,6]. Index 0 is MONDAY (DAY_NAMES, v2.py:3591).
# ⚠️ Ray and Cole are CUSTOMIZABLE: the importer hard-fails without both
#    `relationship` and `relationship_options` with the default inside it. That
#    also renders a name textbox (v2.py:9296), so ALL of their prose uses
#    @ray / @cole and the kinship as @ray.rel / @cole.rel — never a typed name,
#    and never in a location label.
# =============================================================================

# ─── RAY — the obligation's face, and the taboo's ───────────────────────────
[[npcs]]
id                   = "npc_ray"
name                 = "Ray"
description          = "Fifty-two. Married her mother six years ago and has made up the difference on the payment plan every Thursday since it started, without once behaving as though that bought him anything — which is the reason she keeps finding out whether it does."
portrait             = "ray.jpg"
core_traits          = { relation = 0 }
flag_keys            = []
arc_stages           = ["The man who pays", "Waits for you out there", "Stops calling it the money", "Nothing to settle"]
customizable         = true
relationship         = "stepfather"
relationship_options = ["stepfather", "mom's husband", "father", "uncle"]

[[npcs.schedules]]
location   = "the_kitchen"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "18:30"
end_time   = "19:00"
activity   = "in off the drive, coat still on the chair"

[[npcs.schedules]]
