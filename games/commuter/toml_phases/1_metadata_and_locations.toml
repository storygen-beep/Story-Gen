image_search_queries = ["cramped academic office books desk", "university faculty office window"]
entry_from           = "the_campus"
navigation_order     = []

[[locations]]
id                   = "the_lab"
name                 = "Lab"
description          = "The teaching lab, open in the evenings for the hours nobody wants, staffed two at a time. Benches, a sink, a bank of lights that takes a second to come on. It is also the quietest place in this town to actually read something."
image                = "locations/the_lab.jpg"
image_search_queries = ["university teaching lab benches evening", "empty science lab fluorescent"]
entry_from           = "the_campus"
navigation_order     = []

# ─── THE HOUSE ZONE ─────────────────────────────────────────────────────────
[[locations]]
id                   = "home"
name                 = "Home"
description          = "The house she grew up in — the front door, the stairs, and the landing everything else opens off. Four people and one bathroom, so the landing is where the whole household accidentally meets, usually at the worst possible hour, usually in whatever they slept in."
image                = "locations/home.jpg"
image_search_queries = ["small house upstairs landing doors", "narrow stair landing family home"]
