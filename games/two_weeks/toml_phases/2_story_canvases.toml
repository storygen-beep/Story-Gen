  { type = "trait", subject = "npc", npc_id = "npc_ethan", trait_key = "trust", operator = "gte", value = 25 },
  { type = "trait", subject = "npc", npc_id = "npc_ethan", trait_key = "love", operator = "gte", value = 25 }
]
