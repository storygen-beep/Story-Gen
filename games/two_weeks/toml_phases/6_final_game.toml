[[canvases]]
id = "scene_first_kiss"
name = "First Kiss"
description = "No more interruptions. No more excuses. It happens like gravity."
[[canvases.nodes]]
id = "inevitable"
name = "Inevitable"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "No more interruptions. No more excuses. It happens like gravity."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "One moment you're talking — something about nothing, filling silence with noise. The next, silence. His eyes on your mouth. Your breath catching."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Then his mouth is on yours."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The kiss starts tentative — a question. Then desperate. Years of suppression breaking like a dam. His hands in your hair, your back against the wall, pulling each other closer and closer and it's still not close enough."

[[canvases.nodes.blocks]]
type = "video"

[canvases.nodes.blocks.props]
file = "activities/passionate_kiss.jpg"
description = "Passionate first kiss, tentative then desperate, years of longing released"
search_queries = [ "first kiss against wall couple", "couple first kiss wall",]
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Everything you've both been fighting falls away in an instant."


[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
targetType = "node"
