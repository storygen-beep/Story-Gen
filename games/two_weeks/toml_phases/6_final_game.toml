[[canvases]]
id = "ending_he_chooses_you"
name = "The Wedding Day"
description = "The ceremony begins. 'I can't do this.'"
[[canvases.nodes]]
id = "ending"
name = "He Chooses You"
[[canvases.nodes.blocks]]
type = "heading"
content = "He Chooses You"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The ceremony begins. Flowers. Music. Madison walks down the aisle in white. Everyone watches. Everyone smiles."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He stands at the altar. The officiant speaks. 'Do you take this woman...'"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "And he looks at you. Sitting in the third row. Hands in your lap. Heart in your throat."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I can't do this."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Chaos. Madison's tears. Her mother's scream. His father's face. Whispers turning to shouts. The destruction of a life carefully built."

[[canvases.nodes.blocks]]
type = "video"

[canvases.nodes.blocks.props]
file = "story/ending_he_chooses_you.jpg"
description = "Wedding interrupted, man walking away from altar, aftermath chaos"
search_queries = [ "wedding interrupted walking away altar", "man leaving altar wedding",]
[[canvases.nodes.blocks]]
type = "paragraph"
content = "When the dust settles — hours, days, a lifetime later — he's beside you. Bags packed. Nowhere to go. Scandal at his back and an uncertain future ahead."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I choose you. I choose us."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "It won't be easy. His family may never forgive him. Madison certainly won't. The whispers will follow you both for years."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "But his hand is in yours. And for the first time in your life, you're not running."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "You did it. You were brave enough to let it happen — bold enough to stand in the fire and not look away. He saw that in you. He chose that."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "It took everything: the late nights, the stolen moments, the courage to push past every safe boundary. Love ran deep between you, trust anchored what you built, and neither of you flinched when it mattered most."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Not every love story ends like this. Yours did."

[canvases.nodes.exit_block]
type = "game_end"
text = "The End"
[canvases.nodes.exit_block.config]
[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag = "ending_seen"


