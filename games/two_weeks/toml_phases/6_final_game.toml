[[canvases]]
id = "scene_confession"
name = "The Confession"
description = "Under the stars, three glasses in, the unsayable thing gets said."
[[canvases.nodes]]
id = "under_the_stars"
name = "Under the Stars"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Third glass of wine on the patio. Stars out. Pool lights shimmer turquoise across the water."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The alcohol makes the truth easier. Or maybe it's not the alcohol at all."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I used to stay awake at night listening for your footsteps. Hoping you'd knock on my door. Terrified you would."

[canvases.nodes.blocks.props]
speaker = "player"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "The silence that follows is the loudest thing you've ever heard."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I thought I was the only one."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "dialog"
content = "You weren't."

[canvases.nodes.blocks.props]
speaker = "player"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Long pause. The pool filter hums. A lifetime passes."

[[canvases.nodes.blocks]]
type = "dialog"
content = "What do we do now?"

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "video"

[canvases.nodes.blocks.props]
