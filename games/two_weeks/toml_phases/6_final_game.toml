content = "He initiates. That's the difference. He comes to you, not the other way around. His resistance broke on its own — desire stronger than duty."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He glances down the hall — empty — and then his mouth is on yours. You stumble backward. Your back hits the wall. Fast, desperate, addicted."

