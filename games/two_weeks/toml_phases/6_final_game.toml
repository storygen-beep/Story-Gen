[[canvases.nodes.blocks]]
type = "paragraph"
content = "Dawn light through the curtains. His arm around you. For a moment — just this. Just warmth and skin and the slow rhythm of his breathing."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Morning intimacy — lazy, half-asleep, tender. A continuation of the night before. He's gentle, present, lost in you."

