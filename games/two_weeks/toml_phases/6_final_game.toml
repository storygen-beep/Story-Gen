[[canvases.nodes]]
id = "the_situation"
name = "The Situation"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "He carries your suitcase inside like it weighs nothing. The house smells like fresh coffee and something baking. He's been preparing."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Madison's away finishing up some work stuff. Won't be here until right before the wedding. So it's just us for the next couple weeks."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Just us. The weight of those two words hangs in the air between you."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He shows you to your old room — the guest room that was once yours. Some of your old things are still here. Posters you left behind, books on the shelf. He didn't change it."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I kept meaning to turn it into an office but... I don't know. Didn't feel right."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Fourteen days. Just the two of you. In the house where everything started."


[canvases.nodes.exit_block]
