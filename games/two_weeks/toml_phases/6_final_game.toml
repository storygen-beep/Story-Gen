[[canvases]]
id = "scene_rainy_day"
name = "Rainy Day"
description = "Thunderstorm. Power out. Candles and conversation."
[[canvases.nodes]]
id = "power_out"
name = "Power Out"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Thunder cracks like a gunshot and the lights die. The house goes dark. No TV, no Wi-Fi, phones at single digits."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He digs candles out of the kitchen drawer. You open wine. The living room in candlelight feels like a different world — smaller, warmer, more honest."

[[canvases.nodes.blocks]]
type = "image"

[canvases.nodes.blocks.props]
file = "story/scene_rainy_day_power_out.jpg"
description = "Candlelit living room during thunderstorm, two people on couch, intimate atmosphere"
search_queries = [ "candlelit living room storm night", "cozy candlelight conversation couch",]
[[canvases.nodes.blocks]]
type = "paragraph"
content = "You sit on the couch — the same couch that will matter later, but tonight it's innocent. Rain hammers the windows. And without screens to hide behind, you just... talk."


[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text = "Tell him the truth about why you left"
targetType = "node"
nodeId = "scene_rainy_day.truth"

[[canvases.nodes]]
id = "truth"
name = "The Truth About Leaving"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "The candlelight makes it easier to say the thing you've never said out loud."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I didn't leave for the program, Ethan. I left because I couldn't keep living in a house with you and pretending I didn't feel what I felt. Running was easier than staying and aching."

[canvases.nodes.blocks.props]
speaker = "player"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "He's quiet for a long time. The rain fills the silence."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I knew. Part of me always knew. I just... I told myself you were just growing up. Leaving the nest. Normal stuff."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Neither topic is explicitly romantic. But both reveal vulnerability that daylight would never allow."


[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
targetType = "node"
text = "Do you wish I hadn't come back?"
nodeId = "scene_rainy_day.his_answer"
[[canvases.nodes.exit_block.choices.effects]]
targetType = "npc"
npcId = "npc_ethan"
trait = "love"
op = "add"
value = 3
clamp = true


[[canvases.nodes]]
id = "his_answer"
name = "His Answer"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Whatever he says, it's more honest than anything either of you has managed in two years. The storm rages outside but inside the candlelight makes everything feel suspended — outside of time, outside of consequence."

[[canvases.nodes.blocks]]
type = "dialog"
content = "You were always... chaos. The best kind."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "The candles burn low. Neither of you moves to replace them. In the growing dark, his hand finds yours. Just that. Just hands. It's enough."


[canvases.nodes.exit_block]
type = "location"
text = "Let the night end"
