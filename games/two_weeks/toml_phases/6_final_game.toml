schema_version = "0.2"
starting_canvas = "scene_arrival"
[project]
id = "two_weeks"
title = "Two Weeks"
description = """You return home after two years for your step-brother Ethan's wedding. The feelings you buried — the ones that made you leave in the first place — never went away. And neither did his. You have exactly 14 days before he says "I do" to someone else. Every moment is a choice between what's right and what you truly want. A single-NPC forbidden romance driven by a ticking clock, dual taboo (step-sibling + engaged), and the question: is love worth the cost of destroying everything else?"""

[player]
id = "player"
name = "Lily"
description = "A young woman in her early 20s, returning home after two years away. Slim build, expressive eyes. Old enough to know better, young enough to not care. She left to escape feelings she wasn't supposed to have. Now she's back for his wedding."
portrait = "player.jpg"
core_traits = { boldness = 0, energy = 100 }
flag_keys = ["game_started", "arrival_complete", "welcome_dinner_complete", "old_photos_complete", "sleepless_night_complete", "madison_calls_complete", "rainy_day_complete", "the_couch_complete", "confession_complete", "almost_kiss_complete", "real_talk_complete", "first_kiss_done", "what_are_we_doing_done", "going_further_complete", "first_night_complete", "morning_after_complete", "cant_stay_away_complete", "madison_arrived", "stolen_moment_complete", "night_before_complete", "wedding_morning_done", "ending_seen", "lingering_touch_unlock", "flirt_unlock", "kiss_unlock", "grind_unlock", "cant_keep_hands_off_complete", "intimacy_unlock", "manual_unlock", "oral_unlock", "sex_unlock", "ethan_comfortable", "ethan_interested", "ethan_vulnerable", "ethan_intimate"]

[[npcs]]
id = "npc_ethan"
name = "Ethan"
description = "Your step-brother. Late 20s, tall, athletic build, warm brown eyes. Protective older brother energy with suppressed desire underneath. Engaged to Madison — wedding in 14 days. He remembers everything about you: your favorite meal, how you take your coffee, that summer you got too close. His loyalty is both his most attractive quality and the obstacle."
portrait = "ethan.jpg"
flag_keys = []

[npcs.core_traits]
love = 0
trust = 0
corruption = 0

[[npcs]]
id = "npc_madison"
name = "Madison"
description = "Ethan's fiancée. Late 20s, polished, put-together, warm. She greets you with genuine friendliness. She's not a caricature — she's a real person who doesn't deserve what's happening. Her presence transforms what you've done from abstract to devastatingly real."
portrait = "madison.jpg"
flag_keys = []

