[[canvases.nodes.blocks]]
type = "paragraph"
content = "Something shifts. Or almost shifts. The movie ends. Credits roll. Neither of you has any idea what happened in it."

[[canvases.nodes.blocks]]
type = "dialog"
content = "It's late. We should..."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "He doesn't finish the sentence. You both know what's happening. You both know you're not going to stop it."


