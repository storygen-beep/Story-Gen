[[canvases]]
id = "ending_the_arrangement"
name = "The Wedding Day"
description = "He marries Madison. But the story doesn't end."
start_node = "the_ceremony"
[[canvases.nodes]]
id = "the_ceremony"
name = "The Ceremony"
[[canvases.nodes.blocks]]
type = "heading"
content = "The Wedding"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The ceremony is perfect. Of course it is. Madison walks the aisle in white, radiant, every inch the bride. The flowers, the music, the soft gasps from the crowd — all of it choreographed, all of it beautiful."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He stands at the altar. Composed. Steady. The vows come — 'to have and to hold, in sickness and in health' — and his voice doesn't break."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "But you see it. The way his jaw tightens. The way his eyes sweep the crowd once — just once — and find you before snapping back to Madison. The way his hands shake when he slides on the ring."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He says 'I do.' Madison says 'I do.' Everyone cheers. You clap with the rest of them, your smile a perfect mask."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "You know something they don't. And that knowledge sits in your chest like a stone."

[canvases.nodes.exit_block]
type = "location"
text = "Watch the reception begin"
[canvases.nodes.exit_block.config]
destinationType = "node"
destinationId = "ending_the_arrangement.ending"

[[canvases.nodes]]
id = "ending"
name = "The Arrangement"
[[canvases.nodes.blocks]]
type = "heading"
content = "The Arrangement"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He marries Madison. Of course he does. The desire was there but something was missing — the trust to believe you could be more than a secret. You watch from the crowd with a smile that could cut glass."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The reception is beautiful. The speeches are warm. Madison glows. He plays the part perfectly."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Three weeks later, your phone buzzes. Unknown number."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I can't leave her. But I can't leave you either."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "It's wrong. You both know it's wrong. You've always known."

[[canvases.nodes.blocks]]
type = "video"

[canvases.nodes.blocks.props]
file = "story/ending_the_arrangement.jpg"
description = "Secret message on phone, hidden relationship continuing, bittersweet"
search_queries = [ "phone text message affair", "hidden relationship phone",]
[[canvases.nodes.blocks]]
type = "paragraph"
content = "But when has that ever stopped you?"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The arrangement begins. Stolen weekends. Burner phones. A love that lives in the shadows because neither of you is strong enough to let it die — or brave enough to bring it into the light."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The love was real. The connection was deep. But without enough trust to believe in a future together, duty held him in place. You pushed him far — but not quite far enough to pull him free before the ring went on."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Next time: balance everything. Build love through emotional choices, earn trust through bonding, and don't shy away from physical escalation. The best ending needs love, trust, and corruption all running high."

[canvases.nodes.exit_block]
type = "game_end"
text = "The End"
[canvases.nodes.exit_block.config]
[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag = "ending_seen"


