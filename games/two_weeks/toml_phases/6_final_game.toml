[[canvases]]
id = "scene_the_couch"
name = "The Couch"
description = "Movie night. The couch is big but you've migrated to the middle."
[[canvases.nodes]]
id = "movie_night"
name = "Movie Night"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Movie night. The couch is big enough for three people but somehow you've both migrated to the middle. A blanket covers both of you."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "On screen, a couple is doing what you're both pretending not to think about."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Under the blanket, bodies touching. His arm settles around your shoulders — starts casual, drifts to pulling you closer. His hand on your thigh. Starts innocent. Drifts higher. Neither of you acknowledges it."

[[canvases.nodes.blocks]]
type = "video"

[canvases.nodes.blocks.props]
file = "story/scene_the_couch_movie_night.jpg"
description = "Two people on couch under blanket, movie night, physical tension and proximity"
search_queries = [ "couple making out couch blanket", "kissing couch movie night blanket",]
[[canvases.nodes.blocks]]
type = "dialog"
content = "This is nice. Just... this."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "His thumb traces small circles on your thigh through the blanket. Deliberate. Not accidental."


