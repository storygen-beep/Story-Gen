[[canvases]]
id = "scene_madison_arrives"
name = "Madison Arrives"
description = "A car in the driveway. She's real. She's here. She's nice."
[[canvases.nodes]]
id = "arrival"
name = "Arrival"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Sound of a car in the driveway. Your heart stops."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Madison."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "She's polished, put-together, excited. She practically bounces through the door with a suitcase and a garment bag."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Surprise! I finished early!"

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_madison"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "You watch Ethan perform. The hug. The smile. The 'I'm so glad you're here.' Over Madison's shoulder, his eyes find yours. Apology. Fear. Longing."

[[canvases.nodes.blocks]]
type = "video"

[canvases.nodes.blocks.props]
