[[canvases]]
id = "scene_almost_kiss"
name = "Almost Kiss"
description = "Faces inches apart. Then — interruption."
[[canvases.nodes]]
id = "the_moment"
name = "The Moment"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Close. Too close. You can feel the heat radiating off his skin."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "His hand comes up to your face. Thumb tracing your cheekbone. His breath mixing with yours. The tilt of heads beginning."

[[canvases.nodes.blocks]]
type = "video"

[canvases.nodes.blocks.props]
file = "story/scene_almost_kiss_the_moment.jpg"
description = "Faces inches apart, almost kissing, intense anticipation then interrupted"
search_queries = [ "couple almost kiss lips close", "couple about to kiss faces apart",]
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Then — his phone. Vibrating on the patio table. The spell shatters. You spring apart like guilty teenagers caught by the porch light."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I should..."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "dialog"
content = "Yeah."

[canvases.nodes.blocks.props]
speaker = "player"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "But you both know. There's no going back from what almost just happened."


[canvases.nodes.exit_block]
