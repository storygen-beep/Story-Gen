[[canvases.nodes.blocks]]
type = "dialog"
content = "You must be the step-sister! I've heard so much about you."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_madison"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "She's warm. Genuine. She hugs you like a friend. She smells like expensive perfume and a clear conscience."


[canvases.nodes.exit_block]
