[[canvases]]
id = "ending_what_could_have_been"
name = "The Wedding Day"
description = "They came close. Neither was brave enough."
start_node = "the_ceremony"
[[canvases.nodes]]
id = "the_ceremony"
name = "The Ceremony"
[[canvases.nodes.blocks]]
type = "heading"
content = "The Wedding"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The wedding is beautiful. Everyone says so. The flowers, the venue, the weather — all of it perfect."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "You sit in the crowd and watch it happen. Madison walks the aisle. He waits at the altar. The officiant speaks. The vows are said."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He doesn't look at you. Not once. Not during the vows. Not during the ring. Not during the kiss."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "You're not sure if that makes it easier or harder."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "When did it happen — or rather, when didn't it? Two weeks in the same house. Every almost. Every not-quite. The distance never closed and now it never will."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The ceremony ends. Everyone applauds. You clap too, because what else is there to do?"

[canvases.nodes.exit_block]
type = "location"
text = "Go to the reception"
[canvases.nodes.exit_block.config]
destinationType = "node"
destinationId = "ending_what_could_have_been.ending"

[[canvases.nodes]]
id = "ending"
name = "What Could Have Been"
[[canvases.nodes.blocks]]
type = "heading"
content = "What Could Have Been"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "They came close. So close. But neither was brave enough to cross the final line."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The wedding happens. It's beautiful. He's distant but committed. She's present but already leaving."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "At the reception, you find a quiet corner. He finds you there."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Maybe in another life."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "dialog"
content = "Maybe."

[canvases.nodes.blocks.props]
speaker = "player"
[[canvases.nodes.blocks]]
type = "video"

[canvases.nodes.blocks.props]
file = "story/ending_what_could_have_been.jpg"
description = "Airport departure, looking back once, melancholy and regret"
search_queries = [ "airport departure woman looking back", "leaving airport looking back man",]
[[canvases.nodes.blocks]]
type = "paragraph"
content = "You leave the next morning. Early flight. No fanfare. He drives you to the airport. Neither of you speaks."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "At the gate, you almost say it. Almost. The words are right there."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "But you board the plane. And the words stay unspoken. And the story ends the way most love stories end — not with a bang, but with a what-if that echoes forever."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The distance won. Two weeks in the same house, and neither of you found the courage to close the gap. The moments were there — but you let them pass."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Next time: don't hold back. Spend more time with Ethan — every meal, every evening, every quiet moment. Balance emotional and physical choices. Build trust through bonding activities. The best ending needs deep love, real trust, and enough corruption that going back to normal is impossible."

[canvases.nodes.exit_block]
type = "game_end"
text = "The End"
