[[canvases.nodes]]
id = "after"
name = "After"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "The night air feels different now. Charged. Whatever walls were left have started to crumble."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The stars don't care about your problems. The pool lights keep shimmering. The world keeps turning. But something between you has changed permanently."


