[[canvases]]
id = "scene_arrival"
name = "Two Weeks"
description = "You return home after two years for your step-brother's wedding."
[[canvases.nodes]]
id = "before_you_begin"
name = "Before You Begin"
[[canvases.nodes.blocks]]
type = "heading"
content = "Before You Begin"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Two Weeks is an interactive story about forbidden feelings, impossible choices, and a clock that won't stop ticking. You have fourteen days before Ethan's wedding. What happens in those days is up to you."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Explore the house, spend time with Ethan through daily activities, and make choices that shape your relationship. New story events unlock as your bond deepens. Check the Guide at the top of the screen anytime to see what's available."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Five stats shape your story:"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Love — how deeply Ethan feels for you. Built through emotional choices and time together. Trust — his belief that what you have is real, not just desire. Built through bonding activities and honest moments. Corruption — how far you've both crossed the line. Built through physical choices and daring actions. Energy — your daily stamina. Sleep restores it, activities spend it."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "This game has multiple endings. For Ethan to choose you over the wedding: Love 90+, Trust 75+, and Corruption 85+. He needs to love you deeply, trust what you have is real, and have crossed enough lines that there's no going back. Balance emotional and physical choices — lean too far either way and you'll miss the best ending."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The wedding is in fourteen days. Time advances with every action. If the clock runs out before you've seen the story through, the wedding happens without you getting a say."


[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text = "Begin"
targetType = "node"
nodeId = "scene_arrival.the_return"

[[canvases.nodes]]
id = "the_return"
name = "The Return"
[[canvases.nodes.blocks]]
type = "heading"
content = "Two Weeks"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The taxi pulls away and you're standing on the sidewalk with your suitcase, staring at a house you haven't seen in two years. Same white shutters. Same oak tree in the front yard, taller now. Same crack in the second porch step that Dad always said he'd fix."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "You left for college across the country. Told everyone it was for the program. Told yourself it was for the adventure. The truth was simpler and uglier: you couldn't keep living in a house with him and pretending you didn't feel what you felt."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Running was easier than staying and aching."

[[canvases.nodes.blocks]]
type = "image"

[canvases.nodes.blocks.props]
file = "locations/home_exterior.jpg"
description = "Suburban house exterior, warm afternoon light, suitcase on sidewalk"
search_queries = [ "family home exterior afternoon light", "suburban house returning home",]
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Two years of careful distance. Two years of short phone calls and shorter visits. And now you're back because your step-brother is getting married in fourteen days and you couldn't think of a good enough excuse not to come."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Your heart is pounding. You tell yourself it's just nerves."


[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text = "Walk to the door"
targetType = "node"
nodeId = "scene_arrival.ethan"

[[canvases.nodes]]
id = "ethan"
name = "Ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "The door opens before you reach it. And there he is."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Taller than you remembered. Or maybe you'd been trying to make him smaller in your memory. Warm brown eyes. That easy, lopsided smile that always made you feel like you were the only person in the room. He's broader now — athletic, filled out. Not the lanky stepbrother you left behind."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Hey, stranger."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "He pulls you into a hug. His arms tighten a moment too long. You breathe him in without meaning to — cedar and coffee and something that's just him. Two years of careful distance collapse in three seconds."

[[canvases.nodes.blocks]]
type = "image"

[canvases.nodes.blocks.props]
file = "story/scene_arrival_ethan.jpg"
description = "Warm reunion embrace at front door, afternoon light"
search_queries = [ "reunion hug front door couple", "embrace coming home doorway",]
[[canvases.nodes.blocks]]
type = "dialog"
content = "God, it's good to see you. I wasn't sure you'd actually come."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Your heart is racing and you are actively trying to ignore the reason why."


[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
targetType = "node"
text = "I missed you."
nodeId = "scene_arrival.the_situation"
[[canvases.nodes.exit_block.choices.effects]]
