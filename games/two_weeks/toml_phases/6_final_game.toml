[[canvases]]
id = "scene_real_talk"
name = "The Real Talk"
description = "He's sitting alone in the dark. The contradictions have peaked."
[[canvases.nodes]]
id = "in_the_dark"
name = "In the Dark"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "You find him sitting on your bed in the dark. He's been waiting. Or maybe he's been trying to leave and couldn't."

[[canvases.nodes.blocks]]
type = "dialog"
content = "We need to talk about this."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "The wedding is in a week. Madison. The family. The impossibility of what he's feeling. Everything he's been pushing down comes flooding up at once."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I'm supposed to be getting married."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "dialog"
content = "I know."

[canvases.nodes.blocks.props]
speaker = "player"
[[canvases.nodes.blocks]]
type = "dialog"
content = "I don't know if I can."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "dialog"
content = "I know."

[canvases.nodes.blocks.props]
speaker = "player"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "His voice breaks."

[[canvases.nodes.blocks]]
type = "dialog"
content = "What do you want?"

[canvases.nodes.blocks.props]
speaker = "player"
[[canvases.nodes.blocks]]
type = "dialog"
content = "I want you. I hate that I want you."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "video"

[canvases.nodes.blocks.props]
file = "story/scene_real_talk_in_the_dark.jpg"
description = "Emotional breakdown, holding someone who is crying, comfort not seduction"
search_queries = [ "couple holding crying comfort bed", "man holding woman crying",]
[[canvases.nodes.blocks]]
type = "paragraph"
content = "He's not performing anymore. The protective older brother, the dutiful fiance, the man who has it all together — all masks, and they've all fallen off at once."


[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
targetType = "node"
text = "We'll figure it out. Together."
nodeId = "scene_real_talk.aftermath"
[[canvases.nodes.exit_block.choices.effects]]
targetType = "npc"
npcId = "npc_ethan"
trait = "love"
op = "add"
value = 3
clamp = true


[[canvases.nodes]]
id = "aftermath"
name = "Aftermath"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "Whatever was said, the air feels different. Raw. Like a wound that's been lanced — it hurts more now, but at least it's honest."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He doesn't stay. But when he leaves, he pauses at the door. His hand on the frame. He doesn't look back."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I'm sorry. For all of this."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "The door clicks shut. You stare at the ceiling until dawn."


[canvases.nodes.exit_block]
type = "location"
text = "Try to sleep"
