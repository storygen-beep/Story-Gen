[[canvases]]
id = "ending_one_last_night"
name = "The Wedding Day"
description = "He goes through with it. They never crossed enough lines."
start_node = "the_ceremony"
[[canvases.nodes]]
id = "the_ceremony"
name = "The Ceremony"
[[canvases.nodes.blocks]]
type = "heading"
content = "The Wedding"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "You take your seat. Third row, aisle side. Your hands won't stop shaking so you sit on them like a child."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The music starts. Madison walks the aisle in white. She's radiant. She deserves this — all of it. The thought makes your throat close."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He's at the altar. The officiant speaks. And then — just for a second — his eyes find yours."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Everything you built over fourteen days is in that look. Every late-night conversation. Every accidental touch that wasn't accidental. Every time one of you almost said the thing that would have changed everything."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Almost. The cruelest word in any language."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I do."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "He doesn't look at you again. Not during the kiss. Not during the applause. Not when they walk back up the aisle together, married, finished."

[canvases.nodes.exit_block]
type = "location"
text = "Stay for the reception"
[canvases.nodes.exit_block.config]
destinationType = "node"
destinationId = "ending_one_last_night.ending"

[[canvases.nodes]]
id = "ending"
name = "One Last Night"
[[canvases.nodes.blocks]]
type = "heading"
content = "One Last Night"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He goes through with it. You never pushed far enough — kept things emotional, kept things safe. But the night before, he came to you one last time."

[[canvases.nodes.blocks]]
type = "dialog"
content = "I love you. I'll always love you. But I can't destroy everything."

[canvases.nodes.blocks.props]
speaker = "npc"
npcId = "npc_ethan"
[[canvases.nodes.blocks]]
type = "paragraph"
content = "You watch from the crowd. Their vows. The ring. The kiss. His eyes find yours once — just once — across the room. A lifetime in a glance."

[[canvases.nodes.blocks]]
type = "video"

[canvases.nodes.blocks.props]
file = "story/ending_one_last_night.jpg"
description = "Watching wedding from crowd with hidden tears, eye contact across room"
search_queries = [ "watching wedding crowd couple", "eye contact across room wedding",]
[[canvases.nodes.blocks]]
type = "paragraph"
content = "You leave before the reception. You don't say goodbye. The taxi comes and you get in and you don't look back because if you look back you will break apart."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "At the airport, your phone buzzes. One message from him: 'I'm sorry. For all of it. Except the parts with you.'"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "You board the plane. You fly away. You don't come back."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Some love stories end with sacrifice."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "He loved you. That was never the question. But love wasn't enough — not without crossing enough lines together, not without the physical truth of what you were to each other making denial impossible."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Next time: don't hold back physically. Build corruption through daring choices and the journal. The best ending needs love, trust, and corruption all running high — emotional depth alone won't free him."

[canvases.nodes.exit_block]
type = "game_end"
text = "The End"
[canvases.nodes.exit_block.config]
[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag = "ending_seen"


