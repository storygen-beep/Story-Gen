# =============================================================================
# The Route — 2_one_shots · THE FIRST HOUR
#
# COLD OPEN (the-first-hour.md F1). Her situation and the pressure, and it names
# NOBODY. The cast arrives through F5 meetings, one at a time, each speaking.
# The defect this avoids is the middle: a cold open carrying a staged open's
# payload names people the player cannot picture. Our own measured failure named
# six, two of whom were not in the game at all.
#
# F2 — BOOT AND CAPSTONE ARE TWO CANVASES. canvas_first_shift is the boot: the
# room, the job, the pressure, 07:00 Monday. canvas_the_sheet is the capstone and
# it spends the prose, because it carries the one thing the player decides.
#
# THE START CHOICE IS A MEMORY, NOT A SLIDER (the-want.md §1). The intake form is
# already asking what she did before she came back, so the scene asks it and sets
# a flag. Read at five sites each in 3_activities.toml. ADDITIVE ONLY: every rung
# those flags touch keeps its original version behind `<flag> is_false`.
#
# ⚠️ THE THREE ANSWERS ARE NOT A [group] BLOCK and must never become adjacent to
#    one. Adjacent [group] blocks merge into ONE if/elseif chain and first match
#    wins (v2.py:14637) — drop a past-ladder beside a surface's existing ladder
#    and that ladder goes dark with no error and no build warning.
#
# F3 — THE FUNNEL LANDS ON AN OPEN DOOR. Boot 07:00 + 10 min on the sheet + 25
# minutes of road = about 07:35 at the agency, and Cheryl is scheduled there
# 07:00-16:00 Monday to Friday. Arithmetic, not hope.
#
# F5 + F8 — ONE FLAG PER CHARACTER. Five meetings, five flags, each opening that
# character's hubs and nobody else's. All six earlier v2 games ship the forbidden
# shape: a repeatable canvas with npc= whose base node IS the introduction.
#
# ⚠️ THE SCHEDULE WINDOW IS WHAT STOPS A MEETING FIRING IN AN EMPTY ROOM — not
#    `requires_npc`. selectAutoFireCanvasForLocation -> isCanvasValid (v2.py:4573)
#    reads schedules, conditions and repeatability and NEVER reads requiresNpc;
#    the field is consumed in exactly two functions, v2.py:5259 and v2.py:5332,
#    and neither is this path. requires_npc is kept anyway: it is free and it
#    documents intent.
#
# ⚠️ NO FIRST-VISIT CANVAS FOR THE ANCHOR. F9 as it now stands: a place says what
#    it is in its own `description`, which the player reads on EVERY visit, and a
#    first-visit canvas is a minority device for something true once. Every
#    location description in 1_metadata_and_locations names the function first.
#
# F7 — ROLE BEFORE NAME. Nothing here says a name before that character's own
# meeting says it out loud.
# =============================================================================


# ── The boot — cold open, names nobody ───────────────────────────────────────
[[canvases]]
id          = "canvas_first_shift"
name        = "Monday"
description = "Opening, Monday 07:00, her apartment over the laundromat. Names nobody. Establishes: the aide job, six houses on a fixed route, two of them family, rent weekly, the truck and the tank. SETS woke_up."

[canvases.trigger]
location      = "her_apartment"
is_repeatable = false
priority      = 20
is_active     = true

[[canvases.nodes]]
id   = "the_alarm"
name = "Seven"
blocks = [
  { type = "image", props = { file = "scenes/first_shift.jpg", description = "A small apartment bedroom at seven in the morning, light through a thin curtain.", search_queries = ["small apartment bedroom morning light curtain", "cheap studio apartment bed window daylight"] } },
  { type = "paragraph", content = "Seven, and the dryers are already running underneath. The floor has been warm since five. You have been back in this county eleven weeks and the room still smells like other people's laundry." },
  { type = "paragraph", content = "The job is six houses off County Road 9. You get people up, you get them washed, you get them through the day, and the county pays you by the hour for it." },
  { type = "paragraph", content = "Two of the six are yours. Your father since the stroke in March. Your brother since the wreck. Nobody has ever had to explain why you are the one in the room." },
  { type = "paragraph", content = "Rent is Monday and it is a hundred and eighty. The truck is at the bottom of the stairs with a little under half a tank in it, and every mile of the route comes out of that." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Get up."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "her_apartment"
time_progression_minutes = 5
flagEffects = [
  { targetType = "player", flag = "woke_up", op = "set" },
]


# ── The capstone — the intake sheet, and the one thing she decides ───────────
# ⚠️ THE THREE CHOICES ARE THE START CHOICE. Each sets ONE flag, and each buys
#    REACH rather than flavour (the-want.md §1): the clinical rungs, the
#    after-hours rungs, or the door codes she already holds. They are exit-block
#    choices, NOT a [group] ladder, and nothing adjacent to them is a group.
[[canvases]]
id          = "canvas_the_sheet"
name        = "The intake form"
description = "F2 capstone. The agency's own paperwork on her table, still unsigned after eleven weeks. Carries the START CHOICE: past_hospital / past_bar / past_home, read at five sites each. SETS intake_done. Exits to the agency at ~07:35 where Cheryl is scheduled."

[canvases.trigger]
location      = "her_apartment"
is_repeatable = false
priority      = 19
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "woke_up",     operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "intake_done", operator = "is_false" },
]}

[[canvases.nodes]]
id   = "the_form"
name = "The form"
blocks = [
  { type = "paragraph", content = "The agency's intake packet has been on the table since your first week, held down by the sugar. Eleven pages. You have signed ten of them and left the last one because of one line near the bottom." },
  { type = "paragraph", content = "PRIOR RELEVANT EXPERIENCE. There is a box four lines deep and no instructions about what counts. Whatever you write there is what they will let you do in somebody's bathroom without a nurse standing behind you." },
  { type = "paragraph", content = "You have been putting it off because all three true answers are true, and the one you write down is the one this county gets to have." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text                     = "Four years on a hospital floor."
targetType               = "location"
locationId               = "agency_office"
time_progression_minutes = 30
traitEffects = [ { targetType = "player", trait = "past_kind", op = "set", value = 1 } ]
flagEffects  = [ { targetType = "player", flag = "past_hospital", op = "set" },
                 { targetType = "player", flag = "intake_done",   op = "set" } ]

[[canvases.nodes.exit_block.choices]]
text                     = "Six years waiting tables and tending bar."
targetType               = "location"
locationId               = "agency_office"
time_progression_minutes = 30
traitEffects = [ { targetType = "player", trait = "past_kind", op = "set", value = 2 } ]
flagEffects  = [ { targetType = "player", flag = "past_bar",    op = "set" },
                 { targetType = "player", flag = "intake_done", op = "set" } ]

[[canvases.nodes.exit_block.choices]]
text                     = "Two years nursing your mother in this county."
targetType               = "location"
locationId               = "agency_office"
time_progression_minutes = 30
traitEffects = [ { targetType = "player", trait = "past_kind", op = "set", value = 3 } ]
