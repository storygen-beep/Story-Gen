                 { targetType = "player", flag = "intake_done", op = "set" } ]


# ── Meeting · the supervisor ─────────────────────────────────────────────────
# She is the standard and the brake, and her `trust` IS the route — which houses,
# which hours, whose keys. There is no player ascent tier in this game because
# this is it, and it belongs to a person.
[[canvases]]
id          = "meet_cheryl"
name        = "The board"
description = "F5/F6. The agency office, Monday morning. She reads the sheet back line by line, which is the bottom rung of her own ladder. She speaks. SETS met_cheryl."

[canvases.trigger]
location      = "agency_office"
is_repeatable = false
priority      = 15
is_active     = true
requires_npc  = "npc_cheryl"
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "met_cheryl", operator = "is_false" },
]}

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4]
start_time = "07:00"
end_time   = "16:00"

[[canvases.nodes]]
id   = "the_sheet"
name = "The sheet"
blocks = [
  { type = "paragraph", content = "The routes go up on a corkboard by the door, one index card a house, and there is a woman in her fifties standing in front of it with a coffee she is not drinking." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cheryl" }, content = "Ashby. You're the one that took the two family houses." },
  { type = "dialog", props = { speaker = "player" }, content = "Somebody was going to." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cheryl" }, content = "Somebody was. I'm Cheryl, I've done this thirty years, and I'm going to tell you the thing I tell everyone once." },
  { type = "paragraph", content = "She takes the cards off the board in order and puts them in your hand in order, and she does not let go of the last one straight away." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cheryl" }, content = "The hours on that card are the hours. You write down what you did and I read it back to you Friday. That's not me not trusting you. That's the job." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Take the cards."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "agency_office"
time_progression_minutes = 15
flagEffects = [
  { targetType = "player", flag = "met_cheryl",       op = "set" },
  { targetType = "player", flag = "first_route_run",  op = "set" },
]


# ── Meeting · her father ─────────────────────────────────────────────────────
# The reversal, in one room, on the first morning. The bathroom is the crudest
# repeatable surface in the game and this is the visit that opens it.
[[canvases]]
id          = "meet_roy"
name        = "First house"
description = "F5/F6. The bathroom at her father's, 07:00-09:00, which is his own scheduled window. The reversal stated once and never explained again: the man who decided everything needs both hands to stand up. He speaks. SETS met_roy."

[canvases.trigger]
location      = "roy_bathroom"
is_repeatable = false
priority      = 15
is_active     = true
requires_npc  = "npc_roy"
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "met_roy", operator = "is_false" },
]}

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "07:00"
end_time   = "09:00"

[[canvases.nodes]]
id   = "the_chair"
name = "The chair"
blocks = [
  { type = "image", props = { file = "scenes/roy_first_morning.jpg", description = "A home bathroom fitted for care: grab bars, a plastic chair where the tub was.", search_queries = ["accessible bathroom grab bars shower chair", "home care bathroom handrails plastic seat"] } },
  { type = "paragraph", content = "The county took the tub out in April and bolted a plastic chair where it was. Three walls have bars on them now. The door was the last thing to go, because a door that locks is what kills people in here." },
  { type = "paragraph", content = "He is sitting on the edge of the bed in the front room with one sock on, which is as far as he got, and he has been sitting like that long enough that he has stopped being annoyed about it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "They send you a card with my name on it." },
  { type = "dialog", props = { speaker = "player" }, content = "They send me six cards. You're the first one." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "Well. That's a hell of a thing to be first at." },
  { type = "paragraph", content = "You get his arm across your shoulders the way they taught you and you take the weight on the way up, and he is heavier than a man who has not stood on his own since March ought to be." },
]

[canvases.nodes.exit_block]
