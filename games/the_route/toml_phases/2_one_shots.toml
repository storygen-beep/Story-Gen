id          = "meet_ward"
name        = "The timesheet"
description = "F5/F6. Her father's house mid-morning, 10:00-11:30, his own scheduled window. He holds the power of attorney and he signs her hours — the mechanism, never the legal phrase. He speaks. SETS met_ward."

[canvases.trigger]
location      = "roy_house"
