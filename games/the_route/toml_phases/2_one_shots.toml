[[canvases.nodes]]
id   = "the_kitchen"
name = "The kitchen"
blocks = [
  { type = "paragraph", content = "Somebody comes in the back without knocking, which in this house means one person. He is your father's younger brother and he has had a key since before you were born." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ward" }, content = "Ward. You won't remember me from anything good." },
  { type = "paragraph", content = "He puts a folder on the counter and opens it to a page that is your hours, printed in a column with a line at the bottom that only he can sign." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ward" }, content = "Since March I'm the one signs for him. Everything he owns, everything he's owed, and what the county pays you for being in there." },
  { type = "dialog", props = { speaker = "player" }, content = "You're signing my check." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_ward" }, content = "I'm signing how long you were alone with him. There's a difference and you'll get used to it." },
]

[canvases.nodes.exit_block]
