text = "Hand him the sheet."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "roy_house"
time_progression_minutes = 10
flagEffects = [
  { targetType = "player", flag = "met_ward", op = "set" },
]


