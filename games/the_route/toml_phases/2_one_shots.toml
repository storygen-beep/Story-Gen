  { type = "dialog", props = { speaker = "npc", npcId = "npc_dane" }, content = "Forty minutes. What am I supposed to do with the rest of it." },
  { type = "paragraph", content = "He says it grinning, at the TV rather than at you, which is how he has said everything he has ever meant since the two of you were kids." },
]

