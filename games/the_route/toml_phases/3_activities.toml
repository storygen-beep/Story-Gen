    { type = "dialog", props = { speaker = "player" }, content = "Then don't say it." },
    { type = "dialog", props = { speaker = "player" }, content = "I'll turn it off." },
    { type = "dialog", props = { speaker = "player" }, content = "Nine hours a day and you never once called in." },
    { type = "dialog", props = { speaker = "player" }, content = "He's not ending up anywhere. He's twenty-nine." },
