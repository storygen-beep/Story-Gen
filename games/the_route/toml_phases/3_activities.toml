      { type = "dialog", props = { speaker = "player" }, content = "The next one can wait." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "That's not what the card says." },
    ] },
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "trait", subject = "npc", npc_id = "npc_roy", trait_key = "want", operator = "gte", value = 12 },
      ] } }, blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "Don't initial it yet." },
      { type = "dialog", props = { speaker = "player" }, content = "Why." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "Because you're not done." },
    ] },
  ] },
  { type = "block_pool", blocks = [
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "flag", subject = "player", flag_key = "past_hospital", operator = "is_true" },
      ] } }, blocks = [
      { type = "paragraph", content = "The orange sticker on the card means you can do the dressing and the injection. Two of the six houses have one and both of them are yours." },
    ] },
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "flag", subject = "player", flag_key = "past_bar", operator = "is_true" },
      ] } }, blocks = [
      { type = "paragraph", content = "There is no line on the card for the twenty minutes where he is not going to do any of it. You have never needed one." },
    ] },
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "flag", subject = "player", flag_key = "past_home", operator = "is_true" },
      ] } }, blocks = [
      { type = "paragraph", content = "Your mother's card said the same five words in the same order. You have done this exact list in this exact house before." },
    ] },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "player" }, content = "Up, washed, dressed, fed, meds." },
    { type = "dialog", props = { speaker = "player" }, content = "Forty-five minutes. Every day since March." },
    { type = "dialog", props = { speaker = "player" }, content = "Sit forward. Both hands on the rail." },
    { type = "dialog", props = { speaker = "player" }, content = "Sock first. Then we argue." },
