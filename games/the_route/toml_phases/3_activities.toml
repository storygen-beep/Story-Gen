name = "The card"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "UP. WASHED. DRESSED. FED. MEDS. Five words, forty-five minutes, and a line for your initials." },
    { type = "paragraph", content = "The card is printed on stock the county buys in bulk. There is a coffee ring on it that is yours." },
    { type = "paragraph", content = "Somebody at a desk in the county seat decided forty-five minutes. They have never met him." },
    { type = "paragraph", content = "You initial it in the truck afterwards, which Cheryl has told you twice not to do." },
  ] },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "UP is four minutes on a good day. It is his arm across your shoulders and your knees taking the weight." },
    { type = "paragraph", content = "DRESSED is the sock. The rest of a man can be managed. The sock is what beats him." },
    { type = "paragraph", content = "FED is a bowl and a spoon in the good hand and you not watching while he uses it." },
    { type = "paragraph", content = "MEDS is four compartments and a glass and standing there until the glass is empty." },
    { type = "paragraph", content = "WASHED is the one the card is most wrong about, and both of you have known that since April." },
  ] },
  { type = "block_pool", blocks = [
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "trait", subject = "npc", npc_id = "npc_roy", trait_key = "want", operator = "lt", value = 12 },
