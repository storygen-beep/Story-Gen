name = "The bath chair"
blocks = [
  { type = "video", props = { pool_dir = "world/bathroom_wash_t1", pool = 4, description = "A caregiver washing an older man seated on a shower chair in a home bathroom.", search_queries = ["home care bathing elderly man shower chair", "caregiver washing patient bathroom"] } },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The water takes a minute to come warm and you run it over the back of your hand until it does. He waits on the chair with the towel over his knees, looking at the door that does not close." },
    { type = "paragraph", content = "You do it in the order the training gave you, which is face first and everything else after, because a man who has been washed properly on the face will let you do the rest." },
    { type = "paragraph", content = "It is a small room and there is nowhere to stand that is not close. You end up half over him for most of it with one knee against the chair, which is how it is done and how it will always be done." },
  ] },
  { type = "paragraph", content = "Twenty minutes with the cloth, and by the end of it your scrub top is wet through at the front where you have been leaning." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "clothing_item", item_id = "scrubs_light", operator = "equipped" },
    ] } }, blocks = [
    { type = "paragraph", content = "The pale set goes see-through when it is wet and it is wet. He has the good hand on the rail and his eyes are level with the front of you, and he does not look away this time." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "clothing_item", item_id = "own_clothes", operator = "equipped" },
    ] } }, blocks = [
    { type = "paragraph", content = "You are not in scrubs today and it changes the room. Without them you are not the county in here. You are his daughter with her sleeves pushed up." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "past_bar", operator = "is_true" },
    ] } }, blocks = [
    { type = "paragraph", content = "He gets his good hand on your hip while you are reaching past him for the cloth and leaves it there. You take it off without hurrying and without any expression, which is a thing you learned on Friday nights and never expected to use here." },
  ] },
]

