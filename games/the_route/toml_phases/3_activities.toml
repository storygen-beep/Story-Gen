    { type = "paragraph", content = "Dressing is the part he cannot do. Socks, mostly. A man can get through most of a day on his own and then be beaten by a sock, and he knows exactly how that sounds." },
    { type = "paragraph", content = "He keeps the TV off, which after your brother's place is loud in a different way. There is a book face down on the arm of the chair nobody sits in." },
  ] },
  { type = "paragraph", content = "The card says thirty minutes, four days a week, and the drive out here is fifty each way." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "clothing_item", item_id = "own_clothes", operator = "equipped" },
    ] } }, blocks = [
    { type = "paragraph", content = "You came out here in your own clothes today and he clocked it from the bed. Out here that is not a uniform question. It is a question about why you drove fifty minutes." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_marlon", trait_key = "want", operator = "lt", value = 12 },
    ] } }, blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_marlon" }, content = "You can put them on the bed and I'll manage. I've been managing." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "npc", npc_id = "npc_marlon", trait_key = "want", operator = "gte", value = 12 },
    ] } }, blocks = [
    { type = "paragraph", content = "He has stopped saying he can manage. He sits on the edge with his hands on his knees and lets you do the whole of it, and he watches the top of your head the entire time you are down there." },
  ] },
  { type = "paragraph", content = "Whatever you decided he was to you, the county's paperwork calls him a client and the paperwork is not what either of you goes by." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "past_home", operator = "is_true" },
    ] } }, blocks = [
    { type = "paragraph", content = "He knew your mother. He does not bring it up and he does not have to; it is in the way he says your name, which is the way people in this county said it for two years while she was dying." },
  ] },
]

