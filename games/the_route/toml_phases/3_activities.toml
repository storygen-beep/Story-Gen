# ── The anchor's evening: the hour the card does not pay for ─────────────────
# roy_house has to carry >=25% of the world's prose and it was reading 18%,
# because the bathroom loop's 1,500 words belong to no location. This is the
# located surface that pays that share, and it is deliberately two-thirds spoken.
[[canvases]]
id          = "house_the_evening"
name        = "Stay past the card"
description = "The anchor's evening surface, behind met_roy. Two-thirds spoken across four pools — the field's talk-screen shape at the place the game is about."

[canvases.trigger]
location      = "roy_house"
is_repeatable = true
priority      = 4
is_active     = true
requires_npc  = "npc_roy"
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "met_roy", operator = "is_true" },
]}

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "16:00"
end_time   = "23:00"

[[canvases.nodes]]
id   = "base"
name = "After the card"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The card was done at four. It is past six." },
    { type = "paragraph", content = "The light goes off the road about seven and the room goes with it." },
    { type = "paragraph", content = "Nobody has put a lamp on. Neither of you is going to be the one who does." },
    { type = "paragraph", content = "The television is on with no sound. It has been like that since your mother." },
  ] },
  { type = "block_pool", blocks = [
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "trait", subject = "npc", npc_id = "npc_roy", trait_key = "want", operator = "lt", value = 12 },
      ] } }, blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "You've got another house." },
      { type = "dialog", props = { speaker = "player" }, content = "I've got two." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "Then go." },
      { type = "dialog", props = { speaker = "player" }, content = "In a minute." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "That's what you said Thursday." },
    ] },
    { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
        { type = "trait", subject = "npc", npc_id = "npc_roy", trait_key = "want", operator = "gte", value = 12 },
      ] } }, blocks = [
      { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "Sit down." },
      { type = "dialog", props = { speaker = "player" }, content = "I'm on the clock." },
      { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "You're not. I can read a clock." },
      { type = "paragraph", content = "You sit down." },
    ] },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "Your mother did this chair in green. I hated it." },
