# =============================================================================
# The Route — 3_activities · THE STANDING SURFACES
#
# A room's list is NEEDS + WORK + PEOPLE and nothing else (the-surfaces.md R2).
# That closed set is what sizes the screen; 8 is a backstop, never a target, and
# the field median for things-to-do-at-a-place is 3.
#
# ⚠️ R7 — EVERY SCREEN KEEPS ONE DOOR. One choice carrying neither conditions
#    nor costs. A failing choice renders NOTHING (v2.py:12806) — not a greyed
#    line — and a cost-bearing choice counts as conditional (v2.py:12827), so a
#    screen whose only affordance costs $6 is empty to a player at $0.
#
# ⚠️ THE PAST LADDER IS SEPARATED FROM EVERY OTHER GROUP LADDER BY A PARAGRAPH.
#    Adjacent [group] blocks merge into ONE if/elseif chain and first match wins
#    (v2.py:14637). Drop a past-ladder next to a want-ladder and the want-ladder
#    goes dark for every player carrying a past — no error, no build warning, the
#    prose simply stops appearing. Both ladders on every work surface here have a
#    plain paragraph between them for exactly that reason.
#
# THE START CHOICE IS READ AT FIVE SITES EACH — the three work surfaces on the
# route, the morning at her father's, and the agency. past_hospital buys the
# clinical rungs, past_bar buys the handling rungs, past_home buys the door codes.
# Each is a REACH, not a flavour (the-want.md §1).
#
# ⚠️ ADDITIVE ONLY. Every rung a past flag touches keeps its original version
#    behind `<flag> is_false`, so no door closes and a save made before the choice
#    shipped reads exactly what it read yesterday.
#
# ⚠️ `block_pool` IS USED HERE, AND THIS IS THE FIRST v2 GAME TO USE IT. It picks
#    a different one of N blocks on EVERY render (v2.py:14798), which is how a
#    surface survives its tenth read. Counted across this repo before today:
#    the_long_summer 46, under_one_roof 14, vesper 6, every v2 game 0 — while
#    three of the four top female-PC games build every repeatable sexual surface
#    this way. A block_pool directly inside a block_pool is silently dropped
#    (template_import.py:6230); group may nest in group, this may not.
#
# ⚠️ money CARRIES clamp = false ON EVERY EFFECT THAT WRITES IT. The clamp
#    defaults to TRUE and is a hard 0-100 on every trait (v2.py:5928-5930). A
#    shipped game paid 30 a shift against 120 rent, hit the ceiling at 100, and
#    could never pay — valid TOML, green build, ten green gates.
#
# ⚠️ A DEDUCTION IS op = "add" WITH A NEGATIVE VALUE. `subtract` is not an engine
#    op; applyTraitEffect runs add and set and returns on anything else
#    (v2.py:5749-5756). Two v2 games shipped 105 effects that did nothing.
# =============================================================================


