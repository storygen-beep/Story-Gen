[[canvases.nodes]]
id   = "base"
name = "The kitchen"
blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The kitchen is the room that changed least. Same table, same four chairs, and nobody has sat in three of them since March." },
    { type = "paragraph", content = "There is a chip out of the counter by the sink from a night in 2009. You remember whose fault it was. So does he." },
    { type = "paragraph", content = "The good pan is still on the hook. He cooked in this room every night of your childhood and now he cannot lift it." },
    { type = "paragraph", content = "Somebody's church casserole is in the fridge with a name taped to the lid. There have been eleven weeks of those and he has eaten none of them." },
    { type = "paragraph", content = "The med box lives by the toaster. Seven days, four compartments each, and Sunday evening is the one that gets missed." },
    { type = "paragraph", content = "Your mother's handwriting is still on the calendar hook. Nobody took it down and nobody is going to be the one who does." },
  ] },
  { type = "block_pool", blocks = [
    { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "There's coffee if you want it. Made it myself." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "Don't throw that casserole out. Somebody'll ask." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "Sunday. Did I do Sunday?" },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_roy" }, content = "Eat something before you get in that truck." },
  ] },
  { type = "dialog", props = { speaker = "player" }, content = "I'll do the box." },
]

