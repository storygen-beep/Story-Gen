# =============================================================================
# The Route — 1_metadata_and_locations
#
# THE MAP: nested_zones, rooted on COUNTY ROAD 9 — the road is the ground and it
# is also the title. Every house and the town hang off it.
#
#     county_road_9 ──┬── rossiter ──┬── her_apartment
#                     │              ├── agency_office
#                     │              ├── the_diner
#                     │              └── gas_station
#                     ├── roy_house ── roy_bathroom      (ANCHOR)
#                     ├── dane_trailer
#                     └── marlon_house
#
# ⚠️ THE EXTERIOR IS THE ROOT, NOT A LEAF. A game shipped an exterior priced at
#    25 minutes that hung off its kitchen — stepping outside meant stepping from
#    one interior into a row of shops. Gate 28 reads entry_from and fails a leaf.
#    the-map.md R3.
#
# ⚠️ THE SHAPE WAS PICKED IN THE WANT, BEFORE THE CAST. Deriving the map from the
#    roster is circular: the premise fixes the cast, the cast fixes the map, and a
#    family returns a house every time. Six of the eight earlier v2 games are a
#    female protagonist and blood family; two of five shipped seven rooms of one
#    building. Giving her a ROUTE for a job is what makes the map a town.
#    the-map.md R0.
#
# ⚠️ navigation_order is FORWARD-ONLY — the children of this location, never the
#    way back. The return link is implicit from entry_from, and the validator
#    hard-fails a nav entry whose entry_from is not this room.
#
# ⚠️ TRAVEL FRICTION SITS ON THE BRIDGES, never on every room. With free instant
#    travel a schedule grid is a lookup table. `time` is minutes on the day clock;
#    any other key deducts that player trait — which is how `fuel` shuts the far
#    end of the road. engine.md §22.
#
# Word budgets (`fill`) live in v2_state.json and were written BEFORE any prose:
# 31,500 across ten, anchor roy_house at 9,000 = 28.6%.
#
# ⚠️ THERE IS NO [[needs]] TABLE IN THIS FILE and that is deliberate. The importer
#    reads 24 top-level tables and `needs` is not one of them — the block in
#    templates/board.toml maps to no engine key. The needs are declared in
#    v2_state.json under board.needs[], and they exist in the game as
#    [player.core_traits] + [player.trait_decay] plus the conditions that read
#    them. A key the engine does not consume fails silently.
# =============================================================================

[player]
id          = "player"
name        = "Nora"
customizable = true

# ⚠️ SECTION form, not an inline table — a multi-line `core_traits = { … }` is a
#    TOML parse error.
[player.core_traits]
# NO PLAYER ASCENT TIER. who_climbs = "cast": the climb is on the cast, and the
# meter that widens the map is npc_cheryl.trust. the-meters.md W1.

# The throttle — act menu only, on Roy's and Dane's node-routed loops.
arousal         = 0

# The body. Four needs, each of which SHUTS something (board.needs[], gate 29).
energy          = 100
hunger          = 100
clean           = 100
fuel            = 60

# ⚠️ money IS A QUANTITY, NOT A 0-100 METER. Every effect that writes it carries
#    clamp = false, or the engine's default clamp caps it at 100 and the $180 rent
#    becomes unpayable — valid TOML, green build, green gates. engine.md §21.
money           = 95

# The start-choice memory, set once at intake and read at five sites each.
# 1 = the hospital floor · 2 = the bar · 3 = nursed her mother at home.
past_kind       = 0

# Loop state (hidden). Numeric, never flags — a triggerless canvas has no located
# setter for a flag and the build hard-fails.
roy_loop_stage  = 0
dane_loop_stage = 0

# Falls on its own. `fuel` is deliberately absent: it drops PER VISIT, on the
# bridges, not on the calendar — which is what makes it the premise's own need
# rather than a fourth copy of energy.
[player.trait_decay]
energy = 15
hunger = 20
clean  = 18

# Three fields, which is the field median. W1: if you ask, print it back — the
# field reads a created value a median of four times and our games left six of
# fourteen unread.
[[player.customization_fields]]
id          = "name"
type        = "text"
label       = "Your name"
default     = "Nora"

[[player.customization_fields]]
id          = "hair"
type        = "select"
label       = "Hair"
options     = ["dark", "fair", "red", "grey coming through"]
default     = "dark"

[[player.customization_fields]]
id          = "build"
type        = "select"
label       = "Build"
options     = ["small", "average", "heavy", "strong"]
default     = "average"


# ─── county road 9 — THE ROOT, and the ground everything sits on ─────────────
[[locations]]
id                   = "county_road_9"
name                 = "County Road 9"
description          = "Two lanes of patched asphalt running out of town past the houses on your route. Mailboxes on posts, a ditch running under the road, a grain bin a mile back off the shoulder. Everything you do today is somewhere off this road, and the truck is how you get to any of it."
image                = "locations/county_road_9.jpg"
image_search_queries = ["rural two lane county road", "farm road mailboxes shoulder"]
navigation_order     = ["rossiter", "roy_house", "dane_trailer", "marlon_house"]

# ─── rossiter — the town zone ────────────────────────────────────────────────
[[locations]]
id                   = "rossiter"
name                 = "Rossiter"
description          = "The county seat: four blocks of storefronts, a courthouse nobody goes into, and the agency that hands out the routes. Everything you need that is not on the road is on these four blocks."
image                = "locations/rossiter.jpg"
image_search_queries = ["small american town main street", "rural county seat storefronts"]
entry_from           = "county_road_9"
navigation_order     = ["her_apartment", "agency_office", "the_diner", "gas_station"]
costs                = { time = 15, fuel = 6 }

# ─── her apartment — home base ───────────────────────────────────────────────
[[locations]]
id                   = "her_apartment"
name                 = "Your Apartment"
description          = "One room and a bathroom over the laundromat, up an outside staircase. The floor is warm all day from the dryers underneath and the whole place smells like other people's detergent. Your bed, your shower, and the only door on the route that locks behind you."
image                = "locations/her_apartment.jpg"
image_search_queries = ["small studio apartment above shop", "cheap one room apartment bed window"]
entry_from           = "rossiter"
navigation_order     = []

# ─── the agency — the sheet, the payday, the standard ────────────────────────
[[locations]]
id                   = "agency_office"
name                 = "The Agency"
description          = "The county home care office: two desks, a wall of client folders, and the board where the day's routes go up. This is where you are told which houses are yours and how many hours you are allowed to write down."
