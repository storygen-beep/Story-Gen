image_search_queries = ["rural gas station two pumps", "small town gas station convenience store"]
entry_from           = "rossiter"
navigation_order     = []

# ─── your father's house — THE ANCHOR ────────────────────────────────────────
[[locations]]
id                   = "roy_house"
name                 = "Your Father's House"
description          = "The house you grew up in, and the first stop on the sheet every morning. Since the stroke it has a rail on the porch steps, a bed moved down into the front room, and a chair by the window he sits in whether or not anyone puts him there. His brother has a key and lets himself in."
image                = "locations/roy_house.jpg"
image_search_queries = ["small rural farmhouse front room", "elderly home care bedroom chair window"]
entry_from           = "county_road_9"
navigation_order     = ["roy_bathroom"]
costs                = { time = 20, fuel = 8 }

# ─── the bathroom — the crudest repeatable surface in the game ───────────────
# ⚠️ THE WALK-IN LIVES HERE (the-surfaces.md R3, gate 30). She works alone in this
#    room and Ward is scheduled in roy_house from ten — that pairing is a JOIN of
#    this board, not a judgement, and the gate computes it.
[[locations]]
id                   = "roy_bathroom"
name                 = "The Bathroom"
description          = "The room the county paid to change: grab bars on three walls, the tub taken out, and a plastic bath chair bolted where it was. The door does not lock any more, because a door that locks is the thing that kills people in here."
image                = "locations/roy_bathroom.jpg"
image_search_queries = ["accessible bathroom grab bars shower chair", "home care bathroom handrails"]
entry_from           = "roy_house"
navigation_order     = []

# ─── your brother's trailer ──────────────────────────────────────────────────
[[locations]]
id                   = "dane_trailer"
name                 = "Your Brother's Trailer"
description          = "A single-wide on a rented lot behind the co-op, where he has been since the knee and since his wife took the truck and went. Front room, a back bedroom, and a TV that is on whether or not he is watching it."
image                = "locations/dane_trailer.jpg"
image_search_queries = ["single wide trailer interior living room", "mobile home bedroom messy"]
entry_from           = "county_road_9"
navigation_order     = []
costs                = { time = 25, fuel = 10 }

# ─── the last house on the sheet ─────────────────────────────────────────────
[[locations]]
id                   = "marlon_house"
name                 = "The Last House"
description          = "The far end of the route, twelve miles past your father's, and the only client on the sheet you were not related to before you started. One floor, no stairs anywhere in it, and a bed set up in what used to be the dining room while his back heals."
image                = "locations/marlon_house.jpg"
image_search_queries = ["rural ranch house interior daytime", "recovery bed set up in living room"]
entry_from           = "county_road_9"
navigation_order     = []
costs                = { time = 30, fuel = 14 }


# ─── THE ROUTE ───────────────────────────────────────────────────────────────
# ⚠️ ORDERING: [[npcs.schedules]] binds to the [[npcs]] block ABOVE it. Inserting
#    a character between an existing one and its schedules silently re-parents
#    them.
#
# ⚠️ WEEKDAYS ARE MONDAY-ZERO — DAY_NAMES.indexOf(current_day), v2.py:3591-3593.
#    An all-days row handles an overnight wrap on its own (isCurrentTimeSlot,
#    v2.py:3784); a DAY-SPECIFIC overnight window needs two rows, because the
#    weekday check runs first against today and today has changed by midnight.
#    Nothing here is both day-specific and overnight.
#
# ⚠️ ONE WILLINGNESS WORD FOR THE WHOLE GAME — `want`, everybody on the same
#    scale, people told apart by what MODIFIES it. Measured over thirteen corpus
#    games: median one meter per person, nine of thirteen use the same word for
#    everyone. The rich second meter goes to the two arcs that carry the game.
#    the-meters.md W6 — which said the OPPOSITE until 2026-08-24, and the old
#    reading is what produced off_season's four characters with four vocabularies.

# ─── Roy — the reversal. Rich arc #1. ────────────────────────────────────────
[[npcs]]
id           = "npc_roy"
name         = "Roy"
relationship = "Your father, 57. Right side gone since March."
description  = "Her father, 57. A stroke in March took his right side and most of what he could do for himself. He ran everything and decided everything, and now the first hour of his day is her hands on him — and the county pays her for that hour."
portrait     = "roy.jpg"
core_traits  = { want = 0, access = 0 }
flag_keys    = ["met_roy"]
arc_stages   = ["Your father", "Letting you", "Asking you", "Not calling it the job"]

[[npcs.schedules]]
location   = "roy_bathroom"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "07:00"
end_time   = "09:00"
activity   = "waiting in the chair to be got up"

[[npcs.schedules]]
location   = "roy_house"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "09:00"
end_time   = "23:00"
activity   = "in the chair by the window"

[[npcs.schedules]]
location   = "roy_house"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "23:00"
end_time   = "07:00"
activity   = "in the bed they moved down to the front room"

# ─── Dane — the fastest ladder, nothing to lose. Rich arc #2. ────────────────
# ⚠️ customizable = true renders a name TEXTBOX as well as the relationship
#    listbox (v2.py:9296), so every line of prose about him uses @dane, never a
#    typed name. The picked relation reads back as @dane.rel (v2.py:14656).
[[npcs]]
id                    = "npc_dane"
name                  = "Dane"
relationship          = "brother"
relationship_options  = ["brother", "half-brother", "stepbrother", "cousin"]
customizable          = true
description           = "29, home on a rebuilt knee since the wreck, wife gone with the truck. Nothing to do all day but wait for the visit, and he has never once pretended otherwise. He never had power over her, so his wanting is not a reversal — it is the only appetite here with nothing to lose."
portrait              = "dane.jpg"
core_traits           = { want = 0, access = 0 }
flag_keys             = ["met_dane"]
arc_stages            = ["Joking about it", "Not joking", "Sitting up for it", "Not waiting for the visit"]

[[npcs.schedules]]
location   = "dane_trailer"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "06:00"
end_time   = "23:59"
activity   = "in the front room with the TV on"

[[npcs.schedules]]
location   = "dane_trailer"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "00:00"
end_time   = "06:00"
activity   = "asleep in the back bedroom"

