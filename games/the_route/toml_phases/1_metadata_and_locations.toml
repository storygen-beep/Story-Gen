# ─── Cheryl — trust IS the route ─────────────────────────────────────────────
# W6's service/workplace row: trust only, willingness does not apply. She is the
# standard and the brake, and her meter is what opens the map — which houses,
# which hours, whose keys. There is no player ascent tier in this game because
# this is it, and it belongs to a person.
# `the_season`'s real defect was Rae carrying no meter at all.
[[npcs]]
id           = "npc_cheryl"
name         = "Cheryl"
relationship = "Your supervisor at the agency."
description  = "Fifties, thirty years of this, and the only person in the county who knows exactly what the job is supposed to be. She assigns the route and she reads the checklist back on Friday. She is the standard, and she is the one who can take the route away."
portrait     = "cheryl.jpg"
core_traits  = { trust = 0 }
flag_keys    = ["met_cheryl"]
arc_stages   = ["Reads it back line by line", "Stops checking", "Gives you the evening houses", "Writes what you tell her"]

[[npcs.schedules]]
location   = "agency_office"
weekdays   = [0, 1, 2, 3, 4]
start_time = "07:00"
end_time   = "16:00"
activity   = "at the board with the day's routes"

[[npcs.schedules]]
location   = "the_diner"
weekdays   = [0, 1, 2, 3, 4]
start_time = "16:30"
end_time   = "18:00"
activity   = "the end booth, not going home yet"


# ─── The wardrobe ────────────────────────────────────────────────────────────
# [settings] declares clothing_enabled = true, and a declared system that does not
# exist in the built game is the defect the-phone.md P1 names. Scrubs and
# not-scrubs is the whole of it: what she has on decides whether she is the
# county in that room or somebody's daughter.
[[clothing]]
id          = "scrubs_dark"
name        = "Dark scrubs"
slot        = "top"
description = "The dark set. They do not show what the job puts on them, which is why you bought them."
worn_beauty = 0

[[clothing]]
id          = "scrubs_light"
name        = "Light scrubs"
slot        = "top"
description = "The pale set the agency issued. They show everything and they go transparent at the front when you lean over a bath chair."
worn_beauty = 2

[[clothing]]
id          = "own_clothes"
name        = "Your own clothes"
slot        = "top"
description = "Jeans and whatever is clean. Nobody on the route has seen you in them and it changes every room you walk into."
worn_beauty = 3
