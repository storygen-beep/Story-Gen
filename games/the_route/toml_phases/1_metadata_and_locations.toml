# ─── the diner ───────────────────────────────────────────────────────────────
[[locations]]
id                   = "the_diner"
name                 = "The Diner"
description          = "Six booths and a counter, open from five for the people who work early. It is where you eat when there is no time to eat properly, and where the woman who assigns your route sits at the end of a shift because she does not want to go home yet either."
image                = "locations/the_diner.jpg"
image_search_queries = ["small town american diner booths", "roadside diner counter interior"]
entry_from           = "rossiter"
navigation_order     = []

# ─── the gas station — where the road costs money ────────────────────────────
[[locations]]
id                   = "gas_station"
name                 = "The Gas Station"
description          = "Two pumps and a store that sells coffee, sandwiches under a lamp, and everything else at twice what it is worth. Every mile of the route comes out of this tank, so every mile of the route comes out of your week."
