    prologue_redesign: "2026-04-23 — (1) Replaced 20-canvas branching Prologue with single canvas `prologue_morning_with_daniel` (9 sequential nodes, ~8,200 words of linear novel-register prose). Kept loc_prologue_daniels_apartment as trigger; exits to loc_front_porch. (2) Revised cast + structure: Sarah (not Emma) is Daniel's secret partner; Emma cut entirely. Discovery is visual (Maya walks in on Daniel + Sarah in an empty college classroom). Two new sex scenes: N2 morning sex between Maya and Daniel (before they get out of bed, video media), N7 revenge sex with Kevin (Sarah's boyfriend, video media at reframing beat). (3) Flag cleanup: deleted emma_read, saw_emma_text, prologue_emma_done, sarah_suspicion_surfaced, sarah_knows_something, confirmed_visual, second_flag_landed, decided_to_look (8 flags). Renamed told_sarah → left_sarah_voicemail, saw_the_thread → saw_daniel_and_sarah. Player flag_keys 117→109. (4) Story_arc chapter_prologue: 20 nodes → 12 nodes (8 deleted, 2 renamed — node_phone_check → node_classroom_discovery, node_sarah_confession → node_sarah_voicemail). (5) N5 three-way choice sets calc_tier_deliberate/moderate/impulsive + calculation trait +5/+3/+1 + revenge_planned on all three. (6) N9 final choice: 'Leave Sarah a voicemail: I saw you.' vs 'Don't call. Just drive.' See design doc §4 in ../../19th_april_UOR_Redesign_Session/Game_Redesign.md."
    back_porch_move_to_home: "2026-04-24c — Moved loc_back_porch from hanging off loc_kitchen to hanging off loc_hallway (renamed 'Home'). Two TOML edits in 1_metadata_and_locations.toml: (1) loc_back_porch.entry_from 'loc_kitchen' → 'loc_hallway'; (2) appended 'loc_back_porch' to loc_hallway.navigation_order (now 8 entries: kitchen, living_room, bathroom, mayas_bedroom, franks_office, ryans_room, jakes_room, back_porch). Motivation: consolidate home-to-outdoors traversal under the single Home hub so players don't need to pass through the kitchen to reach the yard/trail/creek. Consequence: Kitchen becomes a dead-end interior room (exit 'Leave Kitchen' → Home); Home page now surfaces Back Porch card alongside the 7 interior rooms; Back Porch → Yard → Creek and Back Porch → Trail Head chains preserved intact; 'Leave Back Porch' now returns to Home. Spatial trade-off: loses the narrative adjacency where the kitchen window faces the back yard, in exchange for a simpler single-hub home nav. No canvas/activity edits — loc_back_porch, loc_yard, loc_creek, loc_trail_head location_ids all unchanged, all existing triggers/activities continue to fire. Dry-run: ✓ valid, 79/94/38/12 unchanged, 12 overlap warnings unchanged."
    hallway_rename_to_home: "2026-04-24b — Renamed loc_hallway display name from 'Hallway' to 'Home' and rewrote its description to match the broader interior-of-the-house framing. Motivation: the front-porch grid card reading 'Hallway' was a confusing 'go inside' affordance next to 'Driveway,' and the exit link 'Leave Hallway → Front Porch' sounded off to players. TOML-only change — two fields in 1_metadata_and_locations.toml (loc_hallway.name + loc_hallway.description). Location id 'loc_hallway' kept intact so every location='loc_hallway' reference in canvases (2 — 2_story_canvases.toml:558, 925) and activities (2 — 3_activities.toml:1318, 1351) continues to work. Engine reads location.name at render time (v1.py:12973-13082), so all surfaces auto-update: front-porch grid card, page title, 'Leave Home' exit link, passage name Location_Hallway→Location_Home. Canvas sub-node arrival_at_franks.hallway (2_story_canvases.toml:475-476) left alone — separate entity, college Humanities-building hallway in Wednesday prologue. Narrative prose mentions of 'hallway' (8 hits across phases 2/3/4) left alone — contextual flavor, not location references. Dry-run: ✓ valid, 79/94/38/12 unchanged, 12 overlap warnings unchanged. Deferred (not needed): engine-level exit_label override field (not required now that the rename covers the specific pain point)."
    guide_flag_chain_loosen: "2026-04-24 — Fixed Guide page 'everything depends on everything' UX (every NPC row showing 🔒 Progress with X until one actionable row completes). Root cause: content-layer; Chapters 1 + early Ch2 written as a single serial cross-NPC flag chain. Loosened 7 accidental-ordering trigger gates in 2_story_canvases.toml (canvases.trigger.conditions edits only — no engine changes, no flag renames, no new flags): (B4) first_jake_cold_shoulder first_ryan_observation→first_morning_kitchen_done, (B5) town_walk_day_two first_jake_rebuff→first_morning_kitchen_done, (B12) ryan_shop_first_visit group_settled_in→first_ryan_observation, (B13) jake_first_glance_noticed cookie_peer_established→first_jake_rebuff (beauty≥45 preserved), (B14) frank_phase_a_test jake_first_glance_noticed→first_rent_paid, (B15) marge_thursday_key frank_phase_a_test_1→cookie_peer_established, (B16) ryan_partner_first_close first_ambient_tilt→ryan_help_tier_open (corruption≥25 preserved). After first_morning_kitchen_done, Ryan/Jake/town-walk rows unlock in parallel. Each NPC's Ch2 entry gates on their own Ch1 milestone + shared chapter milestones; cross-NPC flag traffic survives only where narratively causal (Cookie vouches→Marge key). Kept: causal gates (arrival, first-morning, interview_scheduled, hired_at_diner, Sunday rent sequence, Cookie regulars, jake_peek, ryan_big_ticket). Engine verification: setup.getNextActivity iterates activities in story-arc declaration order and does NOT consult requires_nodes; requires_nodes left untouched in 4_story_arc.toml. Deferred from this pass (user decision): engine two-pass scan-past-blocker in getNextActivity, surfacing repeatable activities in Guide. Dry-run: ✓ valid, 79/94/38/12 unchanged, overlap warnings unchanged at 12."

    rent_alignment: "2026-04-24d — Aligned rent system to redesign doc narrative intent. Root cause: [settings.rent] had no start_after_flag, so engine rent clock was live from Thursday W1 09:00 (mid-Prologue), contradicting Book 3 §Calendar (Sunday W2 first rent) + Book 2B §Whiteboard #1 (scripted first payment) + canvas first_sunday description ('Sunday Week 2'). Separately, arrival_at_franks staged physical arrival only — rent deal, Diana's refused free-ride offer, and $1,500 college target were never on-page. And Maya was triple-dipping: paying rent ($60/wk) + paying for cooking ($3/use cook_solo, $1/use eat_fridge) + paying for groceries ($8/wk diner_groceries) — contradicting user-locked deal (Frank proposes rent, Maya cooks, Frank/Diana buy groceries). Fixes (TOML-only, no engine edits — all F1–F4 infrastructure already supported this, v1.py:683 wires rent_start_after_flag): (1) 1_metadata_and_locations.toml settings.rent: added start_after_flag='first_sunday_passed' so engine auto-collection is dormant until scripted first_sunday canvas fires; scripted first rent is the diegetic handshake (Sunday W2), engine takes over from W3 onward. (2) 1_metadata_and_locations.toml player.flag_keys: added 'rent_terms_set' near arrived_at_franks. (3) 2_story_canvases.toml first_morning_kitchen.base: inserted rent-proposal beat — Frank folds paper, proposes $60/wk Sundays + Maya-cooks + Frank/Diana-buy-groceries; Maya internal paragraph echoing Prologue N10 line 417 (she'd decided on Kentucky, number landed fair); Maya internal paragraph naming $1,500 community college tuition Diana offered to cover, Maya paying herself; Maya 'Okay.'; Frank 'Coffee's fresh.'; then existing church-choice line. rent_terms_set added to both exit choices' flagEffects. No Prologue rewrite — N9 Diana-call (line 381 'no rent. no food. I'd do your laundry') + N10 Maya-drive-decision (line 417 'her pride would not sit at his dinner table eating food she had not earned. Whatever he asked, she would pay.') already lock the setup. (4) 3_activities.toml activity_cook_solo: removed -$3 money cost, kept energy -10 + hygiene -5. (5) 3_activities.toml activity_eat_fridge: removed -$1 money cost (left costs line absent as it was the only entry). (6) 3_activities.toml activity_diner_groceries: removed -$8 money cost, kept energy -5, reworded narrative — 'Frank had handed her the eight before she left the house — his money, her errand' to anchor household-money framing. (7) 2_story_canvases.toml first_sunday.rent: added internal paragraph 'The deal she'd said okay to on Sunday morning, now on the counter in Diana's handwriting' before existing Diana-note line, anchoring this payment to the arrival-morning agreement. Economic math: T0 diner 6 shifts/wk = $270; rent $60 only; net surplus $210/wk (up from $195); $1,500 target ~7.1 weeks at T0 (down from ~7.9). Still tight enough to force T1/T2 grind for meaningful savings in a 10–12 week summer per game_design_patterns.md Pattern C. Dry-run: ✓ valid, 79/94/38/12 unchanged, 12 overlap warnings unchanged. 6_final_game.toml regenerated 6036→6054 lines (+18: 5 for rent gate comment+field, 1 for new flag, ~10 for first_morning_kitchen rent staging, 1 for first_sunday paragraph, small delta on removed costs)."
    navigation_walk_fix: "2026-04-23b — Property↔town transit converted from zero-cost teleport to paired 30-min walk canvases. (1) Fixed activity_walk_to_town: exit_block destinationType 'trigger'→'specific' (was a no-op: 60 min + 15 energy + 5 hygiene but never left loc_driveway); tuned 60→30 min, costs 15/5→8/3, description + 'fourth mile marker' prose trimmed to match 30-min distance. (2) Added activity_walk_home: triggered at loc_main_street_sidewalk, lands at loc_front_porch, 30 min, energy -8, hygiene -3. (3) Both walk canvases available 24/7, all days (schedule blocks omitted) — crucial for accommodating evening shift exits (diner T0/T1/T2 can close as late as 02:20) and night trips in either direction. (4) Nav-graph gating: removed 'loc_main_street' from loc_driveway.navigation_order and removed loc_main_street.entry_from; walk canvases are now the only path between property and town. (5) Systemic destinationType bug fixed in 9 non-repeatable story canvases whose exits claimed 'Walk home.'/'Home.'/'Bed.'/'Clock out.'/'Back to her room.'/'Clear the table.' but returned Maya to the canvas trigger location: town_walk_day_two, marge_interview, ryan_shop_first_visit, marge_thursday_key, ryan_big_ticket_deal, maya_midpoint_crack→loc_front_porch; frank_catch_living_room, frank_crack→loc_mayas_bedroom; brothers_discover→loc_kitchen. All time_progression_minutes and effect/flagEffects payloads preserved. (6) Removed misleading 4-line comment at 2_story_canvases.toml:612-615 that falsely claimed destinationType='specific' was not engine-accepted. 3 additional canvases found with same bug class but not in approved scope (arrival_at_franks 'Bed.', first_jake_cold_shoulder 'Her own room.', first_diner_shift_t0 3× shift-exit choices with targetType='trigger') — flagged for follow-up, not patched in this pass."
    sibling_overlap_consolidation: "2026-04-26 — Eliminated all 12 sibling-canvas overlap warnings via 4 consolidations (per game_design_rules.md Rule 11 three-approach pattern) + 2 schedule-splits. Root cause was prior diagnosis-error: warnings had been treated as 'design-intentional per PRD,' but engine setup.renderNpcPortraits (v1.py:3355–3446 line 3374) is first-match-wins per NPC and iterates canvases in DB-insertion order with NO priority sort — meaning at corruption=60 the diner silently served activity_diner_t0 instead of T2, breaking the economic engine. Playtest confirmed bug. Fixes (TOML-only, no engine edits — generator already supports sub-nodes/group blocks/condition-gated choices): (1) DINER (Pair 6, highest player-impact) — DELETED activity_diner_t0/_t1/_t2; ADDED activity_marge_diner_shift (single canvas, base node + 3 sub-nodes distance/play_along/work_floor; 5-day block_pool of weekday openings + Cookie peer + church-couple variants preserved at base; all 9 fork choices verbatim per tier; trigger.costs preserved energy 40 + hygiene 15; choice-level conditions gate T1 corruption≥25 + rep_road≥15 + beauty≥45 / T2 corruption≥50 + beauty≥55). (2) RYAN YARD (Pair 2, runtime-broken) — DELETED activity_yard_help/_watch_ryan/_bring_water; ADDED activity_ryan_yard (single canvas, schedule union 08:00–16:00 all days; 3 approach choices help/watch/water route to sub-nodes preserving R1's 4 arc-state variants / R3's 4 corruption-band variants / R4's 4 verbal-register variants verbatim; energy costs moved from trigger.costs to per-choice exit effects to preserve original budgets help-20 / watch-5 / water-5; max_triggers_per_day=1 = player picks one approach per day). (3) RYAN SHOP (Pair 3) — DELETED activity_shop_small/_mid; ADDED activity_ryan_shop (single canvas, schedule 13:00–17:00 Mon–Fri; trigger gates ryan_help_tier_open=true; 2 approach choices small/mid; mid choice gated ryan_partner_open=true; sub-nodes preserve R6's 3-customer block_pool + R7's farmer arrival + 3 corruption-tier fork choices verbatim; per-choice energy costs small-15 / mid-20). (4) JAKE ROOM (Pair 5) — DELETED activity_sketch_jake/_post_caught_jake/_jake_college; ADDED activity_jake_room (single canvas, schedule union 14:00–23:30 all days; trigger gates jake_noticed_open=true; 3 approach choices sketch/visit/college; visit gated jake_hand=true; college gated college_brochure_taken=true AND jake_hand=true; sub-nodes preserve J1's 3 arc-state variants + J5's 4 Keep-route variants + J6's single-flow brochure body verbatim; per-sub-node exits preserve original time-progression and Jake love effects). (5) FRANK PROPERTY (Pair 1, schedule-split) — added weekdays=[0,1,2,3,4] to activity_chore_supervision schedule (was all-days, now weekdays-only Mon–Fri 14:00–18:00); activity_weekend_repairs unchanged (Sat/Sun 13:00–17:00). Eliminates Sat/Sun overlap; supervision is fictionally a weekday-Restrict thing, repairs are weekend collaborative work. (6) JAKE HALLWAY (Pair 4, schedule-split) — tightened activity_knock_jake schedule end_time 23:00→20:00 (now 14:00–20:00 all days); activity_jake_linger unchanged (21:00–23:30 all days). One-hour gap eliminates overlap; knock = direct daytime/evening interaction, linger = late-night ambient pass-by. TOML side-fix during validation: TOML 1.0 disallows newlines between top-level inline-table keys (only allowed inside multi-line array values) — moved 5 `conditions = {...}` blocks onto same line as preceding `nodeId =` so the only newlines inside the choice inline-tables are within the items array. Net: 79→72 canvases (-7), 96→121 nodes (+25 sub-nodes), 0 overlap warnings. All variant prose preserved verbatim (no narrative loss). 6_final_game.toml regenerated 7653 lines via cat 1+0+2+3+4 > 6_final_game.toml. Full package run produced fresh games/the_long_summer/output/index.html (3.1MB, 2026-04-26 12:51); Tweego compile clean. Outstanding: pre-existing 'block_pool has mixed types' warning (unrelated to this work). Plan: ~/.claude/plans/lets-fix-all-of-mutable-kurzweil.md."
    activity_card_label_hygiene: "2026-04-27 — Renamed 8 player-facing activity-card labels in 3_activities.toml to remove three categories of leak: (1) parenthetical location disambiguators (activity_sketch_bedroom 'Sketch (bedroom)' → 'Sketch'; activity_solo_mast 'Solo (bedroom)' → 'Touch herself'; activity_solo_mast_living_room 'Solo (living room)' → 'Touch herself on the couch'); (2) internal corruption-tier code (activity_diner_t3 'Diner — T3 Back booth after close' → 'Back booth after close'); (3) bare place-names without verb (activity_ryan_shop 'Shop counter' → 'Help at the counter'; activity_jake_room \"Jake's room\" → 'See Jake'; activity_college_admin 'College admin office' → 'Visit admissions'; activity_church_attend 'Church front' → 'Attend service'). Top-level canvas.name only — node names left untouched (engine-internal per v1.py:7464-7469 / 3479 / 3485; node names only render in dev_mode at v1.py:8352-8356). 6_final_game.toml regenerated 7648 lines via cat 1+0+2+3+4. Dry-run: ✓ valid, 72 canvases / 121 nodes / 38 locations / 12 NPCs unchanged. Full package: ✓ flag chains valid; index.html rebuilt 2026-04-27. String-disappearance grep: all 8 old leak strings 0 occurrences in compiled HTML; all 8 new strings 3-12 occurrences each (help_data JSON + JS rendering paths). No engine changes. No story-canvas changes. No content_rewrite priority_queue/session_log update — this is hygiene, not prose rewrite. Plan: ~/.claude/plans/lets-resolve-all-of-virtual-sutton.md."
    warnings:
