    - "Southern small town, ~4000 population. Exact name TBD during Phase 1 generation"
    - "3 independent sub-reputation tracks: rep_church, rep_road, rep_college"
    - "Shadow layer (criminal/drug): DEFERRED, NOT in Phase 1"
    - "Phase 1 active hubs (5): Frank's property / Ryan's shop / The diner / Main Street / college admin office"
    - "Phase 1 gated: truck stop bar, fairground, high school stadium, church interior, full college campus"
