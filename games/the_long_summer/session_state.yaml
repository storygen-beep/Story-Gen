# Source: Game_Redesign.md sections cited per block
locked_constraints:
  identity:
    - "Title: The Long Summer"
    - "Genre: rural coming-of-age + economic pressure hybrid"
    - "Register: Southern permissive with Diana's rule-enforcing presence at home"
    - "Architecture: Multi-NPC Parallel Arcs (Pattern A) + Economic Pressure (Pattern C)"
    - "Thesis: 'Take Maya through a long summer in a rural town that doesn't live by the rules she was raised on...'"

  player_traits:
    - "10 traits locked (2026-04-22): energy, hygiene, fitness, beauty, corruption, calculation, money, rep_church, rep_road, rep_college"
