  protagonist:
    - "Maya, 18, artist-inclined, hardened from breakup + friend-group collapse"
    - "Arc sentence: 'From the girl who wouldn't let her ex see her cry to a woman who has learned what her eye-contact is worth.'"
    - "Shame engine: symmetric cheat-for-cheat in Prologue; shame is intent, not act"
    - "Recurring obsession: men's hands (public layer), dicks + dreams of them (private layer)"
    - "Voice axis: early observes; late operates"

  npcs:
    - "Frank two-phase arc: Rules (non-sexual) → Trigger (living-room masturbation) → Sexual arc (Restrict → Tease → Crack → Call-out → Keep)"
