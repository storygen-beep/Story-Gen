    - "At most one Crack per chapter"
    - "brothers_discover milestone fires late Phase 1"
    - "diana_awareness accumulates silently but Diana does not confront"

  chapter_shapes:
    - "Chapter 1 = Establishment. Closes on first_rent_paid. Dramatic question: 'Can she be the girl she told herself she'd be?' NO NPC-arc escalations, NO Frank catch-trigger, NO Jake peek, NO Ryan big-ticket, college brochure only"
    - "Chapter 2 = Accumulation. Closes on first_ambient_tilt (Marge hands Thursday-night key). Dramatic question: 'What does she already know how to do that she hasn't admitted yet?' NO NPC-arc Touch/Crack beats"

  diner_tier_system:
