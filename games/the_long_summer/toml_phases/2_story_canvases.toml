description = "Phase 1 opening (Tier B, tone-setting first impression). Saturday Week 1 at 17:00 — Maya pulls into the gravel carrying the Prologue in her body. First-impression beats for all 4 household NPCs she meets: Diana on the porch (warm, laundry-soap + basil), Frank in the doorway (*'Maya.'* as a full sentence, offers the suitcase), Ryan from the yard (voice without walking in — *'Hey, kid.'*), Jake at the dinner table (headphones around the neck, doesn't look up, nods once at his name). — Rewritten 2026-04-24 (Session 9) from a 25-word 3-node skeleton into 1300-word Option B 3-sub-node establishment sequence per content_rewrite/PRD.md. Closed-band Maya narrator — Prologue-register: long subordinated observational sentences with em-dashes and parenthetical hedges; passive-and-perception verbs ('she was being watched,' 'she registered'); external detail outnumbering internal detail three to one. Sets the Southern register the entire Phase 1 prose-register will echo: cicadas starting their July count, red clay on the drive, screen-door slap, laundry soap and basil from the side garden, Jim Beam NOT on Frank yet (that's the late-summer tell), frying-oil smell from a neighbor's kitchen across the far fence. Rule 17 exception for N1→N2→N3 single-choice forward chain (same convention as prior sessions — this is an establishment scene; Maya's agency at arrival is pre-spent in the Prologue decision to accept Diana's offer, so in-the-moment branching would fake agency). All 5 flag effects preserved exactly from original: arrived_at_franks + met_diana_day_1 + met_frank_day_1 + met_ryan_day_1 + met_jake_day_1 on N3 exit. NPC stat-baselines (Frank.trust=10, Jake.love=-5, Ryan.trust=5) are set in 0_systems_spec.toml initialization, not here. Story-arc node_arrival at 4_story_arc.toml:596 unchanged."

