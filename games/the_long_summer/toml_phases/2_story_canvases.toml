# ── N1 — the_outdoor_dinner ── Week 12 Saturday 18:00. The long table, the geometry, the assembly. Maya carries the okra out. Operating-band opener with per-NPC body-grounding cameos.
[[canvases.nodes]]
id = "the_outdoor_dinner"
name = "String Lights, Long Table"
blocks = [
  { type = "image", props = { file = "story/brothers_discover/n1_long_table_porch.jpg", description = "Southern back porch in late September at dusk. A long outdoor table set for five. String lights already on against the thinning blue. A grill at the far end of the porch with the lid half up. A white platter with a blue band centered between two place settings on one side.", search_queries = ["southern back porch long outdoor dinner table string lights late september dusk five places", "rural back porch family dinner setup white platter blue band grill at side blue hour", "long wooden porch table string lights yard creek trail summer evening southern home"] } },
  { type = "paragraph", content = "A Saturday late in the long summer. Diana had the string lights on before the sun had finished — she had been turning them on by five-forty because the blue stretched into an hour she did not trust the dusk for anymore. The porch had the evening smell of it: charcoal starting, propane under charcoal, the grass cut Thursday, the red clay drying on the drive where Ryan had parked the pickup with the tires wet from the creek. The cicadas were on their late-summer count, which was shorter than August and louder for the same reason." },
  { type = "paragraph", content = "The table was the table Frank had built the summer before Maya was born. The wood had softened at the corners the way porch-furniture wood softened in twelve years of weather. Diana set the good platter at the middle of the table, blue-banded, the one that had been her mother's in Tennessee. She set it precisely at the midpoint between the two place settings on the brothers' side — not closer to Ryan, not closer to Jake — and did not cross the line between them with her arm. She went back through the screen door." },
  { type = "paragraph", content = "Frank was at the grill, tongs in his right hand, lid of the grill up in his left, turning chicken pieces with the unhurry of a man who had done a thing enough times to stop thinking about it. His sleeves were rolled to the elbow the way he rolled them at the office, except on the porch the roll was grill-management, not ledger-management. He had not spoken since the yard, twenty minutes ago, when he had said *Chicken's on* to Diana through the kitchen window. Since the night of the Call-out, Frank's sentences had reduced. They had not disappeared; they had trimmed. He said what the hour asked for and let the rest of the hour carry itself." },
  { type = "paragraph", content = "Ryan was on the porch rail, Coors from the can in his right hand, left hand flat on the rail, not wrapped around the post. The Gatorade bottle from the afternoon's pickup run was empty on the corner of the rail where he had set it down. The tan ran to the inside of his elbow. The scar on the back of his right forearm was visible in the string-light warmth. He was looking at the grill and at the middle distance of the yard in alternation and was not looking at the table yet." },
  { type = "paragraph", content = "Jake was already at the table. He had the water glass in front of him — the green tumbler with the chip at the rim — and he had not drunk from it. His glasses were on because the string lights were bright enough to make the page bright enough, if there had been a page. There was not a page. The sketchbook was not on the table, not under the chair. The sketchbook was, Maya thought without meaning to think it, upstairs on his desk." },
  { type = "paragraph", content = "Diana came back carrying the bowl of okra she had simmered with the tomatoes from the yard, and she handed the bowl to Maya in the kitchen doorway without making a production of it, and Maya carried it to the table. It was the first time Diana had handed her a thing to carry to the table on a Saturday dinner rather than a thing to chop at the counter. The bowl was warm through the cloth. The weight she was carrying it at was the weight she carried bowls at now." },
  { type = "paragraph", content = "She set it next to the platter. She took her chair — across from Ryan, down one from Jake, down-and-across from Frank at the foot, to the right of Diana's chair at the head. The porch planks gave at the angle she knew they gave at." },
  { type = "paragraph", content = "Diana sat. Frank came from the grill with the pieces on the plate, set it at the center between the okra and the platter. He did not look at Ryan. He did not look at Jake." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He said it at the volume of a man confirming she was there, and not a volume past it. Ryan came to the rail, set the beer can on the rail, came to the table, sat — the way a man sat at a table he had sat at for thirty years. Jake did not stand to rearrange; he was already there. The five of them were in the five chairs under Diana's string lights, and the cicadas were the ones keeping the count of the next sixty seconds because no one else at the table was going to." },
]
exit_block = { type = "choices", choices = [
  { text = "Start the plate.", targetType = "node", nodeId = "brothers_discover.the_realization", time_progression_minutes = 15 }
] }

# ── N2 — the_realization ── Mid-dinner. Book B27's four body-tells in sequence: Ryan asks Frank for the salt, Frank's voice, Jake's fork pauses between bites, Diana serves Maya first. Operating-band catalog with one Saturated-band FID pull-in. The realization is distributed — no one speaks it.
[[canvases.nodes]]
id = "the_realization"
name = "Pass the Salt"
blocks = [
  { type = "image", props = { file = "story/brothers_discover/n2_salt_across_table.jpg", description = "Close mid-dinner shot of a salt shaker being passed across a long outdoor table under string lights. Older man's hand receiving from his son. A woman across the table with her fork at rest. Another man at the head of the table not looking at the exchange. The light is the warm low light of a septembe porch at full dusk.", search_queries = ["salt passed across outdoor dinner table string lights father son older man hand close southern", "charged family dinner moment salt shaker crossing table five people quiet late summer porch", "mid-dinner southern back porch five chairs charged silence salt across between two men"] } },
  { type = "paragraph", content = "Dinner began the way Saturday dinners began. Diana served from the platter. She set a piece on each plate going counter-clockwise from her own — Maya first, which was not the order. The order was Frank first, then the brothers, then Maya, then herself. Maya-first was a different order, and it was a thing Diana did without announcing, and she did not look up from the platter to see if anyone had registered it. She set the piece on Maya's plate, moved to Ryan's, moved to Jake's, moved to Frank's, served her own. She sat. She did not ask Frank if he wanted the smaller piece. She did not ask Jake if he wanted the breast. She did not say anything. She unfolded her napkin and put it in her lap and picked up her fork." },
  { type = "paragraph", content = "Ryan cut into his piece. He did not salt it. The cut-glass shaker had been between Ryan and Diana's place setting all summer and was there tonight. Ryan cut, lifted, chewed. He set the fork down, reached for the glass instead of the shaker, drank, cut the second piece. He looked up at Frank at the foot of the table." },
  { type = "dialog", content = "Pass the salt.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "The salt shaker was four inches from Diana's hand. The salt shaker was eighteen inches from Ryan's hand. The salt shaker was three and a half feet from Frank's hand. The distance from Ryan's hand to Frank's hand across the long table Frank had built was the longest distance on the table tonight, and it was the distance Ryan had chosen. He had not asked Diana. He had not asked Maya. He had not reached. He had asked his father, across the length of the table his father had built, for the salt." },
  { type = "paragraph", content = "Frank reached. He reached the way a man at the foot of a long table reached — leaning forward a small degree, arm extended, the sleeve-rolled wrist bringing the shaker up and across. The shaker passed over the middle of the table, over the platter, over the bowl of okra. His hand went past Diana's plate and past the string-light reflection in the wood. He set the shaker at Ryan's right hand. He did not release it right away. He held it a count that was not the count of passing a thing to a person; it was the count of handing a thing to a person across a distance that had a room in it." },
  { type = "dialog", content = "Pass the salt.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He said it back. Not as a question. Not as an echo. As the thing he had to say to release the shaker. The volume was exact — not a decibel past what Diana at the head could hear without straining, not a decibel under. The sentence was four syllables. It was not about salt. The not-being-about-salt was in the count of the hold on the shaker before the hand released it. The hand released. Ryan's hand received. Frank's hand went back to his fork. Neither of them looked at the other." },
  { type = "paragraph", content = "Ryan set the shaker at his right hand. He did not salt his chicken. He did not shake it once over the plate for the form of having asked. The shaker sat where he had set it. He cut another piece. He ate." },
  { type = "paragraph", content = "Jake had been chewing. The fork paused. Not mid-bite — the chicken had been swallowed. The fork paused between bites, halfway to the plate from the napkin-fold at his knee. The pause was not quite half a second long. Jake set the fork down at the edge of the plate, not crossed across it. He picked up the water glass. He drank. He set the glass down. He took his glasses off. He folded them the way a draftsman folded a tool he was not using right now — both hands, one temple against the other, the bridge lined up — and set them at the corner of the plate past the fork. He did not pick the fork back up." },
  { type = "paragraph", content = "His eyes were on the middle of the table. Not on Maya. Not on Ryan. The middle of the table was the part of the table that did not require choosing where to look." },
  { type = "paragraph", content = "Ryan's hand went still on his fork. It was the hand that had received the salt and had cut the piece and had lifted the piece to his mouth, and it stopped at the edge of the next cut and did not make the cut. The knuckles tanned to the knuckle. The scar caught a line of string-light. The hand did not move." },
  { type = "paragraph", content = "Diana serves. The platter was empty of pieces but there was the bowl, and she took the bowl around. Maya first. Ryan next. Jake next. Frank next. Herself. She did not speak. She did not look up from the bowl on its way. The kitchen was going to be quieter on its way to nine tonight and then quieter again in the morning. Maya knew that the way a body knew weather. Diana had returned to not-looking-up, and Diana's not-looking-up at a Saturday table was not the not-looking-up of a mother distracted by the stove; it was the not-looking-up of a woman who had seen, and who had chosen, and who was not going to ask. The kitchen-quieter sentence belonged to the hour after the dinner and Diana was already writing it." },
  { type = "paragraph", content = "*Three men. This table.* The thought arrived at the volume the thought arrived at. Maya did not name it past what the four words had named. Ryan had registered that Jake had set down the fork without needing to have seen him set it down. Jake had registered that Ryan had asked Frank for the salt without having been looking at Ryan when he asked. Frank had registered both of his sons registering. Diana had registered all three men registering, and had registered herself serving Maya first, and had decided — as she had decided already at some earlier hour of some earlier day and was only re-deciding now — not to ask the question she did not want the answer to." },
  { type = "paragraph", content = "Maya catalogued. She did not put down her fork. She finished the piece on her plate in the order she would have finished it if no one at the table had noticed what the room was organized around tonight. She had been the thing the table was organized around for three or four Saturdays in a row without any of them naming it, and the naming had happened tonight without a name, and the not-naming was the name." },
  { type = "paragraph", content = "Frank, at the foot, after a count, said nothing. Ryan, after a count, did not salt. Jake, after a count, put his glasses back on, looked at the middle of the table through them, took them back off. Diana got up for the iced tea she had left on the sideboard. She came back. She refilled Maya's glass first and did not ask if Maya wanted it." },
]
exit_block = { type = "choices", choices = [
  { text = "Finish the plate.", targetType = "node", nodeId = "brothers_discover.the_drift_apart", time_progression_minutes = 45 }
] }

# ── N3 — the_drift_apart ── Dinner ends. The brothers leave separately — Ryan out to the yard, Jake through the kitchen and up the stairs — the not-looking-at-each-other on the way out IS the discovery. Diana clears. Maya carries the pitcher in. Exit to loc_kitchen sets brothers_discover=true and diana_awareness +10.
[[canvases.nodes]]
id = "the_drift_apart"
name = "Two Doors Out"
blocks = [
  { type = "image", props = { file = "story/brothers_discover/n3_empty_porch_table.jpg", description = "A back porch after dinner — empty plates, the last of the string-light glow, an empty beer can on the rail, a chair pushed back at an angle. A woman gathering glasses at the far end of the table. The grill lid down. The yard and the kitchen doorway both visible.", search_queries = ["southern back porch after dinner empty plates string lights woman clearing table dusk", "emptied dinner table outdoor porch late september post-family evening ambient quiet", "mother gathering dishes outdoor table back porch string lights night grill closed yard"] } },
  { type = "paragraph", content = "Ryan finished the beer in the can. He did not finish the plate. He stood. He said *I'm gonna —* and did not finish the sentence, which was the second un-finished sentence at the table tonight, and the un-finishing was a thing Ryan did not do. Ryan finished sentences — the fragments he spoke were the finish. He walked down off the porch to the yard, to the tarps, to the shop. The screen of the shop door closed softly behind him. The grill was still smoking low. He did not turn back to turn it off." },
  { type = "paragraph", content = "Jake stood. He put his glasses in his shirt pocket. He picked up the water glass. He pushed his chair in. He did not push it in the way he usually pushed it in, which was the quiet weight of a chair pushed by a man who lived in the house; he pushed it at a decibel past that, and the decibel was audible in the silence the porch had narrowed down to, and he carried the glass through the screen door into the kitchen and did not come back. Diana did not look up from where she was starting to stack the plates. A minute later the sound of the stairs carried out through the open window above the sink. Fourteen of them. He climbed them at the weight Maya climbed them at the night of the Crack." },
  { type = "paragraph", content = "The two of them had gone out of the dinner by two different doors. Neither had looked at the other on the way. The not-looking was what the brothers did tonight — the sentence they had written to each other without speaking — and they were going to keep writing it at the porch rail and the shop door and the hallway for a few Saturdays now without naming what it was about." },
  { type = "paragraph", content = "Frank stood. He went to the grill, closed the propane valve at the tank, closed the lid. He stood a moment with his hand on the lid, wrist at the angle wrists went at when a man was deciding whether to say a thing and deciding not to. He took his plate inside without saying goodnight." },
  { type = "paragraph", content = "Diana was at the table. She was stacking the plates the way she stacked plates, which was three to a stack and the top plate angled so the fork did not slide off. She picked up Maya's plate last. She did not smile. She did not frown. She did not speak. Her eye moved over the line of Maya's hand on the empty iced-tea glass and did not land on Maya's face. The not-landing was the tell. High-awareness Diana did not look up. The kitchen would be quieter tonight than last Saturday and the quieter would be Diana choosing to be quiet, not Diana being busy with dishes." },
  { type = "paragraph", content = "Maya stood. She took the empty iced-tea pitcher from the sideboard. She took her own glass. The cicadas were on their last quarter-hour of loudness. The string lights were the string lights. The long table Frank had built was a table with four empty plates and a platter and a bowl, and in the morning it would be the table it had been in the morning all summer, and the Saturday dinner would be the Saturday dinner it had always been, and none of that would be true anymore in a way that had a name even though none of them would be saying the name." },
  { type = "paragraph", content = "She walked to the kitchen door. She turned in the doorway, the way Diana turned in doorways, and looked at the porch behind her one count past polite. The porch looked the way it had looked before the dinner, except that it had five empty chairs at it now, and the brothers had gone out of it through two different doors, and Frank had closed the grill, and Diana was stacking plates. She did not say anything. She went in." },
]
exit_block = { type = "location", text = "Clear the table.", config = { destinationType = "specific", locationId = "loc_kitchen", time_progression_minutes = 30, effects = [ { targetType = "npc", npcId = "npc_diana", trait = "awareness", op = "add", value = 10 } ], flagEffects = [ { targetType = "player", flag = "brothers_discover" } ] } }


# ─── B28 — Keep tier fork. PHASE 1 CLOSE milestone. ───

