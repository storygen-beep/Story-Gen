# ── N0 — the_briefing ── Thursday afternoon W7. Ryan tells Maya what's coming, off-hand, at the bay door. Renders the line previously reported off-page at the_approach. (Authored 2026-04-27, off-page reference fix pass A2.)
[[canvases.nodes]]
id = "the_briefing"
name = "The Thursday Before"
blocks = [
  { type = "image", props = { file = "story/ryan_big_ticket_deal/n0_shop_bay_gatorade.jpg", description = "A small rural shop interior, Thursday afternoon. Customer desk with a sale ledger open to a half-filled page; a young woman in a t-shirt and jeans seated at the desk with a pencil in her hand. The bay door open behind her — a young man in a cream t-shirt leaning against the door track with a yellow Gatorade bottle in his right hand and a three-quarter socket in his left, looking out at the gravel lot. Late-summer afternoon light, fan on the desk, the red tractor visible at the far edge of the gravel.", search_queries = ["small rural shop customer desk afternoon young woman ledger pencil young man at bay door gatorade socket wrench tractor visible outside", "southern auto shop interior thursday afternoon mechanic leaning bay door drinking gatorade looking at lot", "rural alabama equipment shop sale ledger desk fan working young woman writing man at bay door socket gatorade"] } },
  { type = "paragraph", content = "Thursday afternoon. The shop in the slow Thursday count — no customers since the morning truck-stop guy who had come in for a starter and left without buying it, and the next walk-in not until tomorrow at the earliest. Maya was at the customer desk with the sale ledger open to the page she had been keeping for Ryan since her second week — the running list of who had walked into the yard, what they had come in asking for, what they had walked out paying. The fan on the corner of the desk pushed warm air across the page and turned the corner of it up at the count the fan turned corners up at." },
  { type = "paragraph", content = "Ryan was at the rolling door of the work bay. He had been leaning on the track for the last ten minutes with a yellow Gatorade in his right hand and a three-quarter socket in his left. He was looking out at the gravel where the red tractor had been parked since the Tuesday before last. The afternoon light off the gravel was the kind of afternoon light that made a man squint at it without putting a hand up. He did not put a hand up. He turned the socket in his left hand once. He turned it again. Maya had been able to read the turning as the thing Ryan did with his hands when he was about to say something he had been thinking about." },
  { type = "dialog", content = "Farmer's coming Saturday. Red tractor. Wife's dead brother's. He'll fold, he won't know it till you tell him.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "He said it without turning his head. The socket kept turning. He took the Gatorade to his mouth at the count he took the Gatorade to his mouth at, which was the count of a man who had been drinking Gatorade out of bottles since he was eight years old, and he tipped the bottle and swallowed and brought it back down and the bottle went to the middle finger and ring finger of his right hand the way he held it when he was not actively drinking it. He did not look back into the office. He did not add anything." },
  { type = "paragraph", content = "She set the pencil down on the ledger page. She did not write the four sentences down — she would not have been able to keep up with them at a writing speed even if she had wanted to, and she had not wanted to. The wife's-dead-brother part was the part that had landed. The tractor was a thing the farmer's wife had inherited from a brother she had buried; the farmer had not bought it for himself; the farmer was going to come on Saturday to sell a thing he had not paid for, and the part of him that had to be talked past was the part of him that wanted to seem to himself like a man who had paid for it. *He'll fold* meant the price the farmer had already decided to take was the price the farmer was going to take. *He won't know it till you tell him* meant Ryan was telling her she was the one who was going to tell him." },
  { type = "paragraph", content = "She did not say anything back to Ryan. He did not look back at her to wait for an answer. He took another swallow off the Gatorade and walked into the bay, and the rolling-door noise of his footsteps on the concrete covered the small click she made closing the sale ledger. She closed the ledger because she did not want him to see, when he came back through the customer area at five, that she had not been writing in it for the last quarter of an hour. He would not have looked. The closing of the ledger was for her." },
  { type = "paragraph", content = "She had been running the arithmetic of it in her head before he had finished the sentence, and she had been running it past the closing of the ledger, and she did not turn the radio on in the Civic on the drive out to the diner that evening, and she did not turn it on for the hour home after." },
]
exit_block = { type = "choices", choices = [
  { text = "Close the ledger. Walk the diner shift. Saturday is two days away.", targetType = "node", nodeId = "ryan_big_ticket_deal.the_approach", time_progression_minutes = 60 }
] }

# ── N1 — the_approach ── Saturday afternoon. The farmer in the yard with the red tractor. The price dance. Ryan giving her the close by walking into the work bay.
[[canvases.nodes]]
id = "the_approach"
name = "The Farmer"
blocks = [
  { type = "image", props = { file = "story/ryan_big_ticket_deal/n1_red_tractor_yard.jpg", description = "A red mid-size tractor parked on gravel at the edge of a rural shop yard, FOR SALE sign taped to the windshield, an older man in a cream straw hat walking around it with his head down, a dented blue Ford pickup parked at the curb, shop building with roll-up door behind.", search_queries = ["red tractor for sale rural shop yard gravel older farmer straw hat inspecting", "southern used tractor lot saturday afternoon farmer in hat kicking tires blue pickup", "rural alabama small shop equipment sale afternoon heat red farm tractor retired buyer"] } },
  { type = "paragraph", content = "Saturday. Two-twenty by the shop clock, which was the clock on the tower over the IGA in town reflected backwards in the window of the office — Ryan had told her about it at the end of her second week and she had never needed to check a clock in the shop since. The red tractor had been on the north edge of the gravel lot since the Tuesday before last, parked at the angle Ryan parked things at to be seen from the road. FOR SALE in marker on a sheet of printer paper, taped to the windshield. Two thousand four hundred. Maya had done the pricing with him herself on a Thursday, sitting on the customer desk with the sale sheets she had typed up and Ryan at the door of the work bay with a Gatorade." },
  { type = "paragraph", content = "The farmer pulled up in a dented blue Ford at two-fifteen and had been out there with the tractor for five minutes by the time the office settled into its afternoon quiet. He was older — seventies, the neck sunburned past the collar at the base, a cream straw hat he did not take off when he stepped down, a gold-band wedding ring on a hand that had been a farming hand forty years ago and was now a retired hand. He had the bearing of a man who knew what this tractor was worth and had decided to pretend otherwise for the next forty minutes because that was the dance." },
  { type = "paragraph", content = "Ryan had said at breakfast it would be the farmer. He had said it in one word — \"Farmer.\" — and Maya had known immediately what he meant, because by Week 7 she could hear his fragments in four layers and the farmer-layer was one of them. The Thursday-bay sentence had been on the drive out to the diner on Thursday and on the hour home and on the Friday morning at the kitchen table and on the Friday afternoon at the creek with the sketchbook open to an undrawn page, and the arithmetic of it was a thing she had run enough times that the closing of it had stopped being arithmetic by the time the farmer's blue Ford pulled up at the gravel." },
  { type = "paragraph", content = "The farmer had his eye on the tag price now. He looked at it the way a man looked at a joke he was not going to laugh at." },
  { type = "paragraph", content = "\"Son. You're askin' blood for this.\"" },
  { type = "paragraph", content = "Ryan was at the rolling door of the work bay, one hand on the door-track and the other holding a three-quarter socket he was not using. He did not step into the yard. He looked up for the count he looked up at customers for, and he did not add anything to it." },
  { type = "dialog", content = "Yeah.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "\"I can pay fifteen cash. Today. Loaded in the truck.\"" },
  { type = "dialog", content = "Yeah. No.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "He did not add a reason. He did not explain what the difference was between fifteen and two-four. He turned the socket in his hand. He turned it again. Maya watched him do it and had, for some weeks now, been able to read the turning as the thing Ryan did with his hands when he was deliberately not filling a silence with his voice." },
  { type = "paragraph", content = "The farmer looked past him. Found her at the customer desk, where she had been for the last hour with the sale ledger open in front of her that she had not been writing in. She had clocked him clocking her twice in the last five minutes without his seeming to." },
  { type = "paragraph", content = "Ryan caught the look. He said, at nobody — at the air between the tractor and the door — " },
  { type = "dialog", content = "Pull the filter on the Cub. Office is open.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "He walked into the work bay. He did not look back. The hand that had been on the door-track lifted off it as he stepped through and came down on the wrench rack without pausing, and he went on through into the bay with the step of a man who had work to do, and the work was now what the work was." },
  { type = "paragraph", content = "The farmer came across the gravel toward the office door. At the threshold he stopped and pulled the straw hat off his head with both hands and held it in front of his waist and looked at her. He did not say anything. He waited." },
  { type = "paragraph", content = "She closed the ledger she had been pretending to keep. She stood up." },
]
exit_block = { type = "choices", choices = [
  { text = "Step into the office. Close the door behind you.", targetType = "node", nodeId = "ryan_big_ticket_deal.the_back_office", time_progression_minutes = 30 },
  { text = "\"Ryan's in the bay. Talk to him.\" Walk out the front.", targetType = "trigger", time_progression_minutes = 60, flagEffects = [ { targetType = "player", flag = "ryan_big_deal_walked" }, { targetType = "player", flag = "customer_farmer_flag" } ] }
] }

# ── N2 — the_back_office ── The office. The blind down. The close. The envelope. Maya silent throughout; one farmer line on the way out.
[[canvases.nodes]]
id = "the_back_office"
name = "The Close"
blocks = [
  { type = "image", props = { file = "story/ryan_big_ticket_deal/n2_shop_office_blind_down.jpg", description = "A small cluttered shop office with a desk and an older computer, a filing cabinet with a motor-oil stain at the top corner, a window with a roller blind pulled fully down to the sill, a cream straw hat sitting on the edge of the desk, fluorescent overhead light on.", search_queries = ["small rural auto shop back office cluttered desk computer filing cabinet motor oil stain", "shop office window blind drawn down fluorescent light desk cream straw hat closed door", "southern mechanic shop back office claustrophobic afternoon daylight blocked straw hat on desk"] } },
  { type = "paragraph", content = "The office was a room about the size of Marge's office and more cluttered. A desk with a computer that was four years out of date. A filing cabinet with a motor-oil stain at the top corner. A window that looked out on the work bay, which was why Ryan had a roller blind on it and the blind had been down since Tuesday. He had pulled it on Tuesday off-hand, as if for the sun, and she had watched him do it and had not asked why." },
  { type = "paragraph", content = "The farmer came in behind her. She closed the door. She turned the little latch she had shown herself how to use on a Tuesday in the third week, when she had come in to put the mail on Ryan's desk and had been alone in the office for a minute and had tested the latch because she was the kind of girl who did that now, which was a thing she had let herself register at the time and had not said out loud to anyone." },
  { type = "paragraph", content = "The farmer stood with the hat in both hands. He turned it once — the straw under his thumb the way a rosary was turned. She watched him not-knowing what the next line was supposed to be. She had not known either, until she had. The knowing came up out of her — not from Ryan having coached her, not from a script she had rehearsed. It came out of the four months of counting and the seventeen Saturdays of small closes and the long quiet that had been sitting between her and Ryan for three weeks now, which was a quiet with weight in it and which the afternoon on the gravel had not resolved and which, she registered, was not going to be resolved in this office either." },
  { type = "paragraph", content = "She took the hat out of his hands. She set it on the corner of the desk, where he could see it, where he could know that she knew it was his. She did not say anything. She did not have to." },
  { type = "paragraph", content = "It took what it took. She did not describe, to herself, the taking of it. She was aware of the blind being down and the clock on the wall going at its clock-speed and the particular weight of a man who had not been young for some years, and she was aware of her own body being the thing he was paying for, which was a thing she had agreed to be and had set the price of with the closing of the door. The price was the thing. She kept the price in her head through the length of time the taking took, the way a cashier at a register in town kept a number in her head between scanning the item and reading the total off the screen. The number did not move." },
  { type = "paragraph", content = "After, he counted the money onto the desk. A stack of twenties. He used the back of his thumb to separate them. He did it slowly because the counting was the thing he had to be able to do slowly, so that he could be a man who had come to buy a tractor again, on the way out. Two thousand even. He did not look at her while he counted. He slid the stack across." },
  { type = "paragraph", content = "She put the money into the manila envelope Ryan kept in the top drawer of the filing cabinet. She had put envelopes in that drawer herself, three Saturdays ago, in a stack, for exactly this. She moved two hundred and fifty dollars — twelve twenties and a ten from the bottom of the stack — into the small front pocket of her jeans before she sealed the envelope, and she was aware, as she did it, that the counting-twelve-twenties and the counting-a-ten was Maya-the-waitress's arithmetic, and that Maya-the-waitress was still the one running the count on a Saturday afternoon in Ryan's shop office with the blind down." },
  { type = "paragraph", content = "The farmer picked the hat up off the desk. He set it back on his head. He said, quieter than he had spoken in the yard, \"Thank you, miss.\" — and she saw the shape of his face as he said it, which was the face of a man who had put the hat back on in order to walk out into the afternoon as a man who had bought a tractor, and she gave him the walk-out." },
  { type = "paragraph", content = "She stepped out of the office first. She turned the latch back off. She held the door for him. He went out into the customer area. At the door to the yard he touched the brim of the hat once at her without looking at her, and he went out onto the gravel, and she heard the Ford start and back up and turn and pull out onto State Route 9." },
]
exit_block = { type = "choices", choices = [
  { text = "Set the envelope on Ryan's desk. Walk through the bay.", targetType = "node", nodeId = "ryan_big_ticket_deal.the_aftermath", time_progression_minutes = 45 }
] }

# ── N3 — the_aftermath ── Walking out past Ryan under the Cub, head down. Silence characterizes him per style sheet. The Civic. The county road home.
[[canvases.nodes]]
id = "the_aftermath"
name = "Past the Work Bay"
blocks = [
  { type = "image", props = { file = "story/ryan_big_ticket_deal/n3_work_bay_head_down.jpg", description = "A lean young man in a cream t-shirt and jeans leaning in over the open hood of an older blue Cub Cadet tractor in a shop work bay, socket in right hand, left hand on the fender, head down — the shop door to the customer area visible past him with a young woman walking through carrying a manila envelope, he does not look up.", search_queries = ["young mechanic leaning into tractor engine bay head down socket wrench shop afternoon", "auto shop mechanic working on cub cadet tractor hood up cream t-shirt not looking up", "rural shop work bay man bent over engine ignoring woman passing through back door envelope"] } },
  { type = "paragraph", content = "She took the sealed envelope to Ryan's desk in the office and set it under the paperweight he kept on the stack of invoices — a piece of black iron the shape of a small anvil, which he had found on a job in Decatur three years ago and which he used for the stack because it weighed what it weighed. The envelope sat flat under it. She closed the office door behind her without locking it this time." },
  { type = "paragraph", content = "She went to the small sink at the back of the customer area, where Ryan washed his hands when he came in off the yard. She washed her hands. The water came cold first and then hot the way the pipes in the shop worked. She did not look up at the small square mirror above the sink, because the thing the mirror had to say was not something she needed to hear this afternoon." },
  { type = "paragraph", content = "She walked back through the customer area. At the door to the work bay she stopped for one count — not the count of deciding whether to go through, because that had been decided between the sink and the door, but the count of knowing that the going-through was going to be the sentence the going-through was." },
  { type = "paragraph", content = "Ryan was under the Cub. The hood was up. He was leaning in over the radiator with a three-quarter socket in his right hand and his left hand flat on the fender. He had the cream t-shirt and the jeans and the scar on the back of the right forearm visible because he had rolled the sleeve past it an hour ago. The shop smelled the way the shop smelled on a Saturday afternoon — engine oil and warm rubber and the back-of-the-yard grass Frank had mowed that morning, that was coming in on the draft through the bay door." },
  { type = "paragraph", content = "He did not look up." },
  { type = "paragraph", content = "She walked past him. She walked slow enough that he would have seen her if he had been going to see her, and he did not. The socket in his hand did not stop. The set of his shoulders did not change. The head-down was the sentence. It was the only sentence he was going to give her for this afternoon." },
  { type = "paragraph", content = "She walked through the bay. She walked out the side door. She crossed the gravel to her Civic — the hundred-and-twenty-dollar Civic she had bought off a kid in Cookie's neighborhood two months ago, the one with the door that stuck on the hinge side — and she opened the door and got in and set her right hand on the wheel. She did not set the hand on the other hand. The twelve twenties and the ten were in the front pocket of her jeans. The ninety-five from the diner the night before was on the dresser under the lamp in her room. The two numbers were in her head at the same time. They made the number she had needed them to make." },
  { type = "paragraph", content = "She sat with her hand on the wheel for a count of three. The heat through the windshield. The cicadas. A crow in the pines at the back of the lot." },
  { type = "paragraph", content = "She had taken money from a man for a thing she had given him. She had set the price of the thing before he had, and she had not moved it. She had walked past Ryan and Ryan had been the one who had not looked, not her. She started the engine. The Civic coughed and caught. She turned the key of the radio off because the radio was on — the country station from the gas station two weeks ago — and she did not need it." },
  { type = "paragraph", content = "She drove the county road home." },
]
exit_block = { type = "location", text = "Clock out. Drive the county road home.", config = { destinationType = "specific", locationId = "loc_front_porch", time_progression_minutes = 45, effects = [ { targetType = "player", trait = "money", op = "add", value = 250 }, { targetType = "player", trait = "corruption", op = "add", value = 8 }, { targetType = "player", trait = "rep_road", op = "add", value = -2 } ], flagEffects = [ { targetType = "player", flag = "ryan_big_deal_closed" }, { targetType = "player", flag = "customer_farmer_flag" }, { targetType = "player", flag = "one_crack_this_chapter" } ] } }


# ─── B19 — Maya midpoint crack. T2 shift. ───

[[canvases]]
id = "maya_midpoint_crack"
name = "Midpoint Crack"
description = "Week 8 Thursday ~19:30. T2 floor. She tilts at the hip on purpose. Feels nothing. — Rewritten 2026-04-24 (Session 12) as single-node Option A prose expansion per content_rewrite/PRD.md. B19 / Maya's midpoint, placed after Ryan Beach and before Frank Crack per design-note in final_book.md:2570-2572 (trigger requires ryan_beach_proposal). Operating-band Maya AT THE HINGE — the narrator sustains Operating-register through the scene and the scene IS the doorway into Saturated; downstream activities' band-gated variants (Saturated subset) unlock from the midpoint_crack flag. Forced-event beat per PRD — no choice set at end; single-exit location transition (Rule 17: Maya has no agency at the hinge itself; the hinge is the narrator recognizing the tilt she already made). All flag/stat effects preserved exactly (midpoint_crack + calculation +3 + money +95 + corruption +2). Time 300 min = shift + hour walk home. Italic cadence: 2 spans / ~1200w — one cat a FID-thought book-specified (*She did it on purpose. She felt nothing doing it.*), one cat a interior-register (*I heard you and now I am going to the next table.*) — under ≤1-per-400 cap. Zero @npc_ tokens; zero banned phrases."

