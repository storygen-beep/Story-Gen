[[canvases.nodes]]
id = "base"
name = "Pitcher"
blocks = [
  { type = "image", props = { file = "story/jake_first_glance_noticed/kitchen_pitcher.jpg", description = "A farmhouse kitchen at five-fifteen in the afternoon: butcher-block counter worn pale at the center with a pound of okra in a colander and green half-inch wheels already sliced on the board, a young woman's hands holding a knife at the counter, window above the sink looking out on a back yard at the hour the oak's shadow reaches a rosemary pot, cast-iron on the stove behind her, the refrigerator door just opened in the background with a young man in a black t-shirt at its open door holding a glass pitcher with a plastic lid, glasses pushed up into his hair.", search_queries = ["farmhouse kitchen butcher block counter cutting okra window above sink afternoon light", "southern kitchen late afternoon okra prep cast-iron stove woman cutting at counter", "young man in black t-shirt at open refrigerator holding glass pitcher kitchen afternoon"] } },
  { type = "paragraph", content = "The kitchen at five-fifteen on a Thursday held the density of the hour before Diana served dinner — bacon fat and cooked-off water in the air, the fan over the stove on low, the refrigerator running in the background at the volume that could still be overheard under a knife-blade on butcher-block. Maya had been at the counter for forty minutes. A pound of okra in a colander at her elbow, half of it already sliced into the green wheels that Diana would fry in cornmeal on the cast-iron, because Thursday in this house was fried-okra night. The five chairs at the four-person table were set for five. Frank had added the fifth chair the day after she moved in." },
  { type = "paragraph", content = "Diana was at the stove with her back to the counter. She did not turn." },
  { type = "dialog", content = "Thin enough, Maya.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Maya sliced the next piece thinner. The blade was tacky where the okra had opened the last piece against it. The window above the sink held the back yard at the hour the shadow of the oak had reached the rosemary pot, and the shadow had been, since the first week, a way for her to read the time without looking at the stove clock." },
  { type = "paragraph", content = "She heard him come in from the hallway before she saw him. She did not turn. Jake crossed the kitchen behind her without a hello — he had not said hello in four weeks, since the Sunday of the headphones and the half-sentence at the bedroom door — and his footfall went from hallway plank to linoleum to the front of the fridge in the cadence she had learned was his: shorter than Frank's, quicker than Ryan's, the weight on the balls of the feet instead of the heels. The fridge door opened. Its cold light was visible in the edge of her peripheral, below her chin at the counter." },
  { type = "paragraph", content = "He took the cold-water pitcher out. The pitcher was the glass one with the plastic lid that did not seat all the way on the rim. He had it in his hand, the lid tilted in the other hand, the glasses pushed up into his hair because he was not drawing, and he was lifting the pitcher toward his mouth when his hands stopped. Half a second. She did not look up from the blade. She knew the half-second because the fridge hum carried it, and because the glass lid did not click against the rim in the count where it would have if his wrist had been moving." },
  { type = "paragraph", content = "She caught, without turning, the edge of what his body did. The hair he had pushed back earlier with the inside of his wrist had fallen forward again, and he did not fix it. His t-shirt was black today. The pitcher stayed at the lip of his mouth half a breath past when it would have tipped. Then it tipped. He drank. He closed the fridge. He left. The hallway plank carried his footfall back toward his door." },
  { type = "paragraph", content = "Maya moved the knife through the next piece. Her hands were steady. The slice was thinner than the one before it, which was the thing Diana had asked for, and which was the only part of the minute before that she let herself register the edge of. She did not name what had happened at the fridge. She knew it had happened. The list she had been keeping since the second week was longer this Thursday by one row she was not going to write down. She had the row all the same." },
  { type = "paragraph", content = "Diana turned the bacon. The cast-iron hissed where a pocket of water had come up under it. The refrigerator resumed the volume it resumed when it was closed." },
]
exit_block = { type = "location", text = "Finish the wheels. Thinner each slice.", config = { destinationType = "trigger", time_progression_minutes = 20, effects = [ { targetType = "npc", npcId = "npc_jake", trait = "love", op = "add", value = 2 } ], flagEffects = [ { targetType = "player", flag = "jake_first_glance_noticed" }, { targetType = "player", flag = "jake_noticed_open" } ] } }


# ─── B14 — Frank Phase A test 1. Porch light. ───

[[canvases]]
id = "frank_phase_a_test"
name = "The Porch Light"
description = "Sunday Week 4 evening, front porch — Frank in the rocker with the paper folded on his knee and a lowball of Jim Beam at the boards where the rocker doesn't reach. Maya comes out at eight-thirty with the dish towel still on her shoulder. Saturday night she came home from the diner at one and left the porch light on by hand. The Frank-jaw works once. The correction lands in two sentences: *Maya.* / *The porch light.* Three Mayas in her mouth at different distances from her teeth. — Rewritten 2026-04-24 (Session 15) as single-node Option A prose expansion per content_rewrite/PRD.md Tier C spec (400-700w). Opening-band Maya (Frank-pause pattern-reading, list-of-Frank-rules extended, *that was the agreement* as cat-d signature-phrase italic — the one he was not saying that she heard the not-saying of). Frank Phase-A-late register executed exactly per frank.md: grammatical, no contractions, discrete units, jaw-works-once-before-sentence, hand-flat-on-paper, whiskey-on-porch-an-hour-longer, eye-contact-broken-deliberately, the Phase-A baseline specimen compressed to its tightest form (two sentences, no verb between them). Strips 2 @npc_frank tokens from prior skeleton (1 from body, 1 from choice label). Three-choice exit preserved with labels rewritten per choice_label_patterns.md: token leak stripped from choice 1, parenthetical stage direction (stand up) removed from choice 2 via body-verb-in-label pattern. All flag/effect values preserved exactly (frank_phase_a_test_1, frank.trust +1/+3/-1 per choice, time 30 min)."

