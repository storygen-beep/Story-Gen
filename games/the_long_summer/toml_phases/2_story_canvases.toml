[[canvases.nodes]]
id = "base"
name = "Door Cracked"
blocks = [
  { type = "image", props = { file = "story/first_jake_cold_shoulder/hallway_crack.jpg", description = "A dim upstairs hallway after dinner — runner carpet, stair-top nightlight throwing yellow, a bedroom door open two fingers wide with a desk-lamp strip of light inside, other doors closed, the hush of a house settling.", search_queries = ["dim upstairs hallway bedroom door cracked open desk lamp light inside evening runner carpet yellow nightlight", "southern home upstairs hall after dinner hush of house doors closed one ajar lamp light", "residential second floor bedroom door ajar strip of light studio headphones quiet house"] } },
  { type = "paragraph", content = "Upstairs after dinner. The fourteen stairs in the bare feet she had not yet gotten used to, because at Frank's the floors were wide pine boards instead of the apartment's thin linoleum and they held the warmth of the afternoon through the evening in a way she had registered but had not yet named. The hall light was off. The stair-top nightlight was yellow on the runner, the same yellow it had been the first night." },
  { type = "paragraph", content = "Jake's door was the second door on the left between the bathroom and the room that was hers now. The door was open a crack — open two fingers wide, the way a door was open when a person had come through it and had not bothered to close it all the way, or when a person had set something against the jamb to keep it from closing. She did not know yet which kind of door-crack Jake's door-crack was." },
  { type = "paragraph", content = "The strip of light inside the crack was the low desk lamp throwing yellow. She could see him through it. He was at the desk in the corner with his back to the door, headphones on — the big studio kind, wrapped around his ears, cord running to a laptop. He was drawing or writing or both; she could not tell from the angle. His shoulders were set the way a shoulder was set when the person inside it was not interested in being interrupted." },
  { type = "paragraph", content = "She had been raised to say hello to people in a house she was going to live in for the summer. She had said hello to Diana twice that day and to Frank once, and the hello to Frank had been the whole exchange because Frank had looked up from the paper and had gone back to it. She had not yet said hello to Jake in a way that counted. The saying of it was still a thing she had to do." },
  { type = "paragraph", content = "She knocked. She did not push the door. The knock landed on the frame at a volume that was the volume of a knock on a door that was already open. He did not turn." },
  { type = "paragraph", content = "She knocked again. She lifted her voice so that a person with headphones on would maybe hear it." },
  { type = "dialog", content = "Hey, I just wanted to say—", props = { speaker = "player" } },
  { type = "paragraph", content = "He raised one hand. He did not turn. The hand came up from the desk like a stop sign at a four-way, and it did not come down, and he spoke at the desk." },
  { type = "dialog", content = "I'm working.", props = { speaker = "npc", npcId = "npc_jake" } },
  { type = "paragraph", content = "It was two words. The hand stayed up through the two words and came down after. The headphones did not come off. He did not turn his head at any point." },
  { type = "paragraph", content = "She backed away from the door. She did it quietly, because she was going to close the door of her own room quietly tonight anyway — which was a thing Diana would not have asked for in so many words and which the whole of Diana's house had begun to teach her by being the kind of house it was. She went down the hall to her own door. She went inside. She closed her own door behind her." },
  { type = "paragraph", content = "She sat on the edge of the bed. She did not turn on the lamp. The yellow from the hall came under her door in a thin line and held." },
]
exit_block = { type = "location", text = "Close her own door. Don't come back to his tonight.", config = { destinationType = "trigger", time_progression_minutes = 10, effects = [ { targetType = "npc", npcId = "npc_jake", trait = "love", op = "add", value = -2 } ], flagEffects = [ { targetType = "player", flag = "first_jake_rebuff" } ] } }


