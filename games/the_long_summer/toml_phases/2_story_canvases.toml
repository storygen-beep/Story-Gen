[[canvases.nodes]]
id = "base"
name = "Cigarette"
blocks = [
  { type = "paragraph", content = "Thursday at eight. The pass was clear for a count of three tables and Cookie unclipped the last ticket, wiped her hands on the apron front, and tipped her chin at Maya on her way to the back door. Maya followed. The back step was two concrete steps down off the kitchen and a strip of gravel to the dumpster and the sodium light at the corner of the back lot and the Route 9 shoulder past the chain-link. The screen door hissed and shut behind them." },
  { type = "paragraph", content = "Cookie sat on the top step, the way she sat the first smoke break of every shift — left elbow on left knee, right hand loose with the Marlboro already lit from the Bic she kept in the apron pocket. The phone came out and went back in; the older kid was asking when she was getting home, and she answered eleven, and she did not look up at Maya when she put the phone away." },
  { type = "image", props = { file = "tier_c/cookie_peer_established/base_back_step.jpg", description = "Thursday 8:00pm behind a small-town diner. Two concrete steps down off the kitchen screen door to a strip of gravel and a green metal dumpster. Cookie, mid-30s, blonde hair in a high ponytail loosened from the shift, sitting on the top step in a white cook's apron over a faded t-shirt, cigarette in her right hand, left elbow on left knee. Maya on the step below her, dark hair pulled back, blue waitress apron, hands on her knees. Sodium light at the corner of the back lot casting orange across the gravel. Chain-link fence beyond, Route 9 shoulder past it. The back of the diner is cinderblock painted white, the DINER sign edge visible at the roofline.", search_queries = [ "small-town diner back step smoke break waitress cook 1980s night", "southern diner kitchen back door cigarette break rural sodium light", "diner staff smoke break outside night gravel dumpster chain-link" ] } },
  { type = "dialog", content = "You gonna make it, new girl?", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "paragraph", content = "Maya sat on the step below her. The gravel under the step was the kind of gravel that looked red under a sodium light and black under the sun." },
  { type = "dialog", content = "I'm gonna.", props = { speaker = "player" } },
  { type = "dialog", content = "Yeah you are. Hang a second, I'll tell you who's gonna tip you.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "paragraph", content = "Cookie drew on the Marlboro. The drag was long and the exhale was away from Maya's face." },
  { type = "dialog", content = "Thursday's trucker night. Dale's the one at the far stool, wedding ring, doesn't matter, tips on the bill not on the table because the wife checks the receipts. Bill lands at twelve. He'll round to twenty if you stand by his shoulder twice and refill the coffee. Don't stand by his shoulder if you don't want to. Marge'd give you the eight-top instead. Just so you know. Roy with the Peterbilt hat — eight to nine, meatloaf, tips in fives folded on the table. He's in love with his ex-wife's sister who lives in Nashville. Don't be anything at him. Coke-trucker's the same Thursday as Tuesday, you got him. Pete's Tuesdays only, he doesn't Thursday. Church couple Saturdays, Mill Street Baptist, they count the ice in the water and she says bless before the meatloaf. Don't clear anything until she's said it. I'm telling you so you don't embarrass Marge.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "paragraph", content = "Maya listened. She did not write the names on the step. She would write them down later at her desk at Frank's with the fan on and the window cracked two inches and the pencil from the drawer under the phone. But she had them now — *Dale. Roy. The church couple. The Coke-trucker.* — and she had them because Cookie had decided to hand them over. The decision was a thing Cookie had made on Cookie's own time, and the handing-over was the sentence Cookie had not said, and the Marlboro burning in Cookie's fingers was the hour they were in." },
  { type = "dialog", content = "Marge'll tell you, but I'll tell you faster.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "paragraph", content = "Cookie ground the cigarette on the edge of the step, dropped the butt in the Maxwell House can filled with sand by the dumpster. She stood. Her back cracked once — goddamn — and she bent to pick up the apron ties she had loosened for the break, and she tied them again at the hip without looking." },
  { type = "dialog", content = "One more. Twenties first when you cash out. Mistakes show up early that way.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "paragraph", content = "Maya stood. The cigarette smoke had gone into her hair and would still be there on the hour home. The smell was not unpleasant. It reminded her of someone she had not thought of since before the Sunday in April." },
  { type = "dialog", content = "Alright. Back inside.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "paragraph", content = "They went back inside. The screen door hissed and shut. The kitchen smelled of fryer grease and the Pine-Sol the floor had not yet been hosed with. Cookie was at the wheel before Maya had the apron re-tied at the counter." },
]
exit_block = { type = "location", text = "Back inside. Carry the names.", config = { destinationType = "trigger", time_progression_minutes = 10, flagEffects = [ { targetType = "player", flag = "cookie_peer_established" } ] } }


