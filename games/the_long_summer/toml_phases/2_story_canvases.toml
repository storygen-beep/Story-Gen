description = "Sunday Week 2 morning. Rent on the table. Diana's note. The first envelope. The choice between the service and the porch. — Rewritten 2026-04-24 (Session 14, Tier C batch #2 single canvas) as single-node Option A prose expansion per content_rewrite/PRD.md Tier C spec. Closed-band Maya. **Strips 3 @npc_ token leaks** from original prose (npc_diana × 2, npc_frank × 1) — Rule 23 token-free authoring. Diana is offstage-but-present (the note replaces the conversation she did not have — Diana style sheet 'does not ask the question she does not want the answer to'); Frank speaks once from the porch through the screen with the canonical name-first / no-contraction / two-discrete-sentences specimen. Blockquote pattern (Rule 26) used for Diana's handwritten note — Maya is *reading* a physical text. Two-choice exit preserved exactly (attend / stay), all flag and stat effects preserved exactly (money -60 + rep_church +3 + attended_church_week_1 + first_sunday_passed on attend; money -60 + first_sunday_passed on stay). Choice labels rewritten action+register per choice_label_patterns.md. Cross-canvas continuities: the okay-she-said-at-this-table-eight-days-ago (first_morning_kitchen B2 callback) + Frank's notepad-by-the-phone *Maya — Wk 1* (the_math B9 callback) + the apron-she-folded-along-the-strings-the-way-Cookie-folded-hers (first_diner_shift_t0 B7 + marge_interview B6 callback) + basil-from-the-side-garden-through-the-cracked-window (arrival_at_franks B1 callback)."

