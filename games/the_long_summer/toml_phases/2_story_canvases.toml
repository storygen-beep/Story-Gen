# ── N1 — the_office ── Thursday 22:20. She comes down the hall. The knock-and-enter ritual. Chair on his left.
[[canvases.nodes]]
id = "the_office"
name = "The Chair on His Left"
blocks = [
  { type = "image", props = { file = "story/frank_crack/n1_office_lamp.jpg", description = "A home office at night — old wooden desk, green-shade banker's lamp, a ledger open, an older working man in a buttoned work shirt at the desk. Light warm, corners dim.", search_queries = ["southern home office night banker green lamp ledger old desk working man", "dim wood-paneled office late night man at desk with papers whiskey glass", "rural small-business ledger bookkeeping scene desk lamp evening interior"] } },
  { type = "paragraph", content = "She came down the hallway at twenty past ten. The house was in its late register — Diana in bed by nine-thirty on a Thursday because Thursday was the early start at the library, the TV off, the hallway light at half-bulb. The strip under Frank's office door was the single lit line in the hall, and the strip was the thing she had been walking toward for the Thursday-nights-running rhythm she had learned to read, across weeks that were, if she was honest, the thing she had been walking toward for longer than that." },
  { type = "paragraph", content = "She knocked once. She did not wait. The knock-and-enter had been hers for three weeks and he had not corrected it, and the not-correcting was one of the things she had stopped noticing him not do." },
  { type = "paragraph", content = "Frank was at the desk with the ledger open. The green-shade banker's lamp was on at the desk and the overhead was off. The office smelled the way it always smelled at this hour — the cold coffee in the mug by his elbow that he had not emptied in three days, paper and pencil shavings, the faint whiskey that was always on him by ten-forty on a weeknight whether the glass was in his hand or not. He looked up. His eyes held her for the count that was his normal count, not yet any other count." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "\"Tuesday's receipts got behind,\" she said." },
  { type = "dialog", content = "I know it. Jack's truck job threw the whole week. Sit.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "She pulled the chair on his left. That was the chair she had been pulling for three weeks. The chair on his right would have meant she was on the ledger's side of the desk with him and would have been the wrong chair. The chair on his left meant she was at his shoulder and he had to turn his shoulders to include her in a sentence, and the turning had been a thing she had started noticing him do and then had started noticing that she counted it." },
  { type = "paragraph", content = "She sat. The Tuesday receipts went on her knee in their stack. The banker's lamp threw the same wheat-colored light the side lamp in the living room threw, which was not a thing she had let herself think about on a Wednesday two weeks ago, so she did not let herself think about it on a Thursday now either." },
  { type = "paragraph", content = "He turned to her." },
  { type = "dialog", content = "Start at Tuesday.", props = { speaker = "npc", npcId = "npc_frank" } },
]
exit_block = { type = "choices", choices = [
  { text = "Read him the first column.", targetType = "node", nodeId = "frank_crack.the_ledger", time_progression_minutes = 5 }
] }

# ── N2 — the_ledger ── The work. Proximity. The grammar tightens — the tell.
[[canvases.nodes]]
id = "the_ledger"
name = "The Handwriting Holds"
blocks = [
  { type = "image", props = { file = "story/frank_crack/n2_ledger_hands.jpg", description = "Two pairs of hands close at an open ledger under a desk lamp — one older and wide, one younger and steady — arm near arm, no touch visible but the distance closed to inches.", search_queries = ["two people working ledger desk night hands close arms near each other", "bookkeeping session older man younger woman at desk lamp shoulder to shoulder", "accounts ledger columns pencil late night warm lamp intimate working proximity"] } },
  { type = "paragraph", content = "They worked. She read Tuesday's receipts to him and he entered them in the column. She read the tractor-blade sale to the farmer from the Friday and he entered that. They did Wednesday. They did the partial Thursday that had to be reconciled against the deposit from Wednesday morning. The pencil scratched. The lamp hummed its low hum. Somewhere in the house the refrigerator cycled on." },
  { type = "paragraph", content = "It was the same session it had been every Thursday night since the first week he had asked her to help him with the books. That was the thing she noticed first. The texture was not different. The pencil was the same pencil. The mug was the same mug. The arithmetic was the same arithmetic. She could tell him the running subtotal in the labor column before he wrote it down because she had been watching him do this for long enough that her own numbers came half a beat ahead of his." },
  { type = "paragraph", content = "She leaned in to check the column total against the deposit slip. Her shoulder was beside his shoulder. Her arm was not touching his arm and then was. She felt the contact. She did not move her arm. She did not apologize. She looked at the column." },
  { type = "paragraph", content = "He did not move either. He did not lean back. He did not clear his throat. He wrote the total in, and his handwriting did not change, and that was also a thing she catalogued — the handwriting was the same handwriting because the handwriting was what Frank did when he was holding the room together." },
  { type = "dialog", content = "Two-thirteen forty.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "\"Two-thirteen forty,\" she said back. \"Plus the Tuesday short. Two-oh-nine eighty total.\"" },
  { type = "dialog", content = "Two-oh-nine eighty.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He wrote it. His hand was flat on the ledger while the pen moved. When the pen stopped the hand did not lift. It stayed where it had been, palm-down, fingers splayed the way they splayed when he was holding still. That was Frank's hand at rest. She had seen it a hundred times at the breakfast table." },
  { type = "paragraph", content = "She read him the next set. He listened. He entered them. His voice was shorter than it had been the week before. She noticed that. His sentences had dropped their conjunctions. *Two-thirteen forty.* Not *and that's two-thirteen forty.* Not *so that puts us at.* Bare number. The grammar was not failing; the grammar was getting tighter. That was the other tell, the one the artist part of her had learned to watch for — Frank was more grammatical, not less, in the last fifteen minutes before a thing went wrong." },
  { type = "paragraph", content = "She read the last set. He entered them. He set the pen down on the spine of the ledger. He did not move his hand off the desk." },
]
exit_block = { type = "choices", choices = [
  { text = "Turn toward him.", targetType = "node", nodeId = "frank_crack.the_pressing_hands", time_progression_minutes = 30 }
] }

# ── N3 — the_pressing_hands ── The Crack-tier signal. Hands press. Eye count past discipline. Grammar cut.
[[canvases.nodes]]
id = "the_pressing_hands"
name = "A Count He Cannot Afford"
blocks = [
  { type = "image", props = { file = "story/frank_crack/n3_hands_press_desk.jpg", description = "A wide working man's hands pressed palm-down on a wooden desk, knuckles and second joints whitened from pressure, a closed ledger nearby under a green banker's lamp.", search_queries = ["man's hands pressed firmly on wooden desk tension close-up desk lamp", "close up working hands knuckles pressing down desk surface restraint", "older man's hand flat on desk pressure tell warm light home office"] } },
  { type = "paragraph", content = "She turned toward him. She did it without planning to. She had been reading the column and then the column was entered and there was nothing to read, and the turning was what was there to do next." },
  { type = "paragraph", content = "He was already looking at her." },
  { type = "paragraph", content = "Frank's eye contact was a thing he held a count longer than polite. That count had a standard shape — she had learned it in the kitchen that first month, in the truck cab on the hardware run, across the dinner table when Diana was not paying attention. The standard count ended in the deliberate break, the look off to the right, the jaw working once. That count had always ended." },
  { type = "paragraph", content = "This count did not end." },
  { type = "paragraph", content = "She held it back because she was the Maya who could hold it back. That was the Maya who had tilted at the hip on the Thursday shift and felt nothing doing it. That was the Maya who was wearing a thing tonight she had picked because it fit at the collarbone in a way she knew it fit, and the knowing was not an accusation she was going to make at herself anymore." },
  { type = "paragraph", content = "His hand changed. She watched the change happen. The palm that had been flat against the ledger pressed. The fingers whitened slightly at the second knuckle. It was not a large change; it was the size of the change a man who had been holding a glass for an hour makes when he sets the glass down a half-inch harder than he meant. It was the change she had been told to watch for without having been told." },
  { type = "paragraph", content = "She did not move. He held the look." },
  { type = "paragraph", content = "The banker's lamp hummed. The house was quiet the way a house was quiet at ten forty-five on a Thursday with the wife upstairs and the Braves long finished and the porch screen settling in the heat. The cicadas outside the office window were the cicadas. The refrigerator cycled off." },
  { type = "dialog", content = "The column totals.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "His voice had its normal weight. The grammar was there." },
  { type = "dialog", content = "The column totals are.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He did not finish. He looked at the ledger. He did not unpress his hands. He did not pick up the pen. His jaw worked once — the gesture he used to gather a sentence before speaking it — and she watched the gathering happen and watched the sentence not arrive on the other side of it." },
  { type = "paragraph", content = "She did not help him. The Maya who would have helped him was not in the room." },
  { type = "paragraph", content = "She sat with her hand on the edge of the desk and her arm still where it had been. The clock on the shelf behind him ticked through the quiet. She counted six of its seconds. She did not know she was counting until she had counted." },
]
exit_block = { type = "choices", choices = [
  { text = "Wait.", targetType = "node", nodeId = "frank_crack.the_break", time_progression_minutes = 2 }
] }

# ── N4 — the_break ── The one incomplete sentence. The silence. Maya sees it fully. Exit sets frank_cracked + one_crack_this_chapter.
[[canvases.nodes]]
id = "the_break"
name = "I Cannot"
blocks = [
  { type = "image", props = { file = "story/frank_crack/n4_ledger_closed.jpg", description = "An older man standing next to a desk with a closed ledger on it, a green banker's lamp still lit, a young woman just visible at the doorway leaving the room. Neither resolved.", search_queries = ["older man standing next to desk closed ledger home office night charged silence", "man at desk after difficult moment lamp on doorway figure receding", "interrupted bookkeeping late night home office charged ambiguous mood"] } },
  { type = "dialog", content = "I cannot —", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He said it quietly. The dash was not a dash; it was the place where the grammar stopped. The two words arrived and stopped. The way a man who had spent sixty-one years knowing how to finish his sentences stopped finishing one was not the way most people stopped. Most people trailed. Most people substituted. Frank stopped. The sentence closed at the word it had stopped at, and what was in the office after that was the silence." },
  { type = "paragraph", content = "She did not speak into it." },
  { type = "paragraph", content = "The artist part of her was drawing him. Not on paper. The artist part of her drew him anyway, the way a sketch rehearsed without a pencil in the hand — the angle of the thumb where it met the ledger, the small pale crescent in the skin where the pressure had pushed the blood out, the way the wrist held one degree tighter than it needed to. She was drawing it the way she had drawn Daniel's hands on her knees in the hallway at Sarah's apartment, which she had not thought about in two months and was, now, not thinking about either. She was drawing Frank. His hand. The desk under his hand." },
  { type = "paragraph", content = "The silence went on. She did not count the seconds this time. The seconds counted themselves." },
  { type = "paragraph", content = "He closed the ledger. He used the hand that had been pressing. He closed it and the blotter moved under the cover and the pen rolled a quarter-turn toward the inkwell and stopped against the lamp base. He did not look at her while he closed it." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He did not follow the name with anything. He had used the opener and had not brought the sentence behind it. He stood up from the desk. He did not leave the room. He stood at the desk's left side, which was her side, and did not move." },
  { type = "paragraph", content = "She saw it fully, then. Not as the set of body tells the house had trained her to watch for, but as the thing the tells were for. The rule enforcer had been watching her for weeks from a distance he had made rules to maintain, and tonight the distance had failed him at the desk in his own office with the ledger shut under his hand, and he did not have the grammar for the failure, and he was also not going to pretend the failure had not happened, and the standing-not-leaving was the admission he was capable of tonight." },
  { type = "paragraph", content = "She gathered the Tuesday receipts. She stacked them. She set them on the corner of the desk he had not pressed. Her fingers were steady." },
  { type = "dialog", content = "Goodnight, Frank.", props = { speaker = "player" } },
  { type = "paragraph", content = "She said it at a normal volume. She did not make it gentle. Making it gentle would have been the wrong gesture. She walked to the door. At the door she did not turn around. She heard him breathe out — one breath, long — as she cleared the frame." },
  { type = "paragraph", content = "The hall light was still at half-bulb. She climbed the stairs. She counted them without meaning to. There were fourteen." },
]
exit_block = { type = "location", text = "Her room.", config = { destinationType = "specific", locationId = "loc_mayas_bedroom", time_progression_minutes = 30, effects = [ { targetType = "npc", npcId = "npc_frank", trait = "love", op = "add", value = 10 } ], flagEffects = [ { targetType = "player", flag = "frank_cracked" }, { targetType = "player", flag = "one_crack_this_chapter" } ] } }


