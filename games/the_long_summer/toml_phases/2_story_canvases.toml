description = "B28 — PHASE 1 CLOSE milestone. Week 14 Sunday dinner at the kitchen table (end-of-summer / early-October). Diana sets Maya's place next to hers on the chair on her right. Diana has made the flat-dumpling chicken — the exact dish Maya's biological father used to request before the Wednesday in her ninth year when he died. Diana's ONE full sentence to Maya of all Phase 1 lands in N1. Maya chooses among FIVE Phase 2 openings: Independence (follow Diana into the kitchen for the second cup of coffee Diana has set out) / Frank Keep / Ryan Keep / Jake Keep / Deferred (her own room, fourteen stairs). — Rewritten 2026-04-24 (Session 8) as Option B 4-sub-node mini-arc per content_rewrite/PRD.md. Saturated-band Maya narrator throughout — possessive of habit ('the weight she closed doors at now'), subject+active-verb cadence, one italic span carrying the father's voice memory intrusion (*The flat kind, not the round.*) in N1 per Rule 26 cat b. Structure: the_dinner → diana_in_the_kitchen → the_choice → the_route_locked (the five-way exit fork lives on N4's exit_block). Rule 17 exception for N1→N2→N3→N4 single-choice forward chain (Maya's agency is in *choosing the route at the fork*, which is N4; the four preceding nodes are the room she is becoming the Maya she is going to choose in). All flag effects preserved exactly from original: all 5 routes set keep_tier_fork_fired + phase_1_final_route; Frank/Ryan/Jake routes are gated by the respective keep_route flag and set phase_1_final_frank/ryan/jake; Independence sets phase_1_final_independence; Deferred (own room) sets only the two shared flags (no phase_1_final_X). Story-arc node_keep_tier_fork at 4_story_arc.toml:540-549 (is_milestone=true, group=group_phase_1_close) unchanged."

