# ── N1 — walking_in ── Friday 23:31. She waited for the Friday. Knocks once, doesn't wait. He freezes mid-line at the desk. Operating-band Maya; power-inversion already legible in how she crosses the threshold.
[[canvases.nodes]]
id = "walking_in"
name = "The Friday She Waited For"
blocks = [
  { type = "image", props = { file = "story/jake_caught_and_hand/n1_door_opens_frozen_artist.jpg", description = "A young woman in a doorway at night, a lean young man at a small wooden desk under a gooseneck lamp, his hand frozen mid-line on a wide-format drawing, drawings of her loose across the blotter. His shoulders drawn up toward his ears.", search_queries = ["young woman entering bedroom doorway night young man frozen at drawing desk caught", "artist caught with sketches of subject visible late night small bedroom dormer desk lamp", "power inversion doorway confrontation calm woman frozen man at desk art studio"] } },
  { type = "paragraph", content = "She waited for the Friday. Diana went up at nine-thirty the way Diana went up at nine-thirty every weekday plus Fridays with an extra layer of tired. Frank went up at ten after the eleven-o'clock news the way Frank went up after the eleven-o'clock news, and Ryan's truck was out of the driveway at seven and had not come back. The only light on the third floor of the house at eleven thirty-one was his. She had been waiting for the Friday for a week." },
  { type = "paragraph", content = "She walked down the hall at the weight she walked at now. She did not map the runner tonight. The map was done. She came to his door." },
  { type = "paragraph", content = "The door was closed. She knocked once. She did not wait." },
  { type = "paragraph", content = "She opened it." },
  { type = "paragraph", content = "He was at the desk. The gooseneck lamp was on. The overhead was off. The drawings were loose on the desk around the page in front of him, three or four of them spread across the blotter, and the page in front of him had a woman on it. The woman was her. She had known it would be." },
  { type = "paragraph", content = "His hand stopped mid-line. The pencil was still on the paper and did not move. He had been hunched the way he had been hunched in September through the cracked door at one a.m., and the hunch got worse in the second she was in the doorway, his shoulders drawing up toward his ears the way a man's shoulders drew up when his body had registered what his mouth was going to need a minute to catch up to. His glasses were on. His wrist-push was still holding. His right hand was frozen at the page." },
  { type = "paragraph", content = "He did not look at her." },
  { type = "paragraph", content = "She closed the door behind her at the weight that closed a door quietly, which was the weight she closed doors at now. The click of the latch was the only sound in the room." },
]
exit_block = { type = "choices", choices = [
  { text = "Cross the room.", targetType = "node", nodeId = "jake_caught_and_hand.the_drawings", time_progression_minutes = 1 }
] }

# ── N2 — the_drawings ── At the desk. Five drawings out, one in work. She picks up the ink one (she at the diner, blue blouse, Thursday tilt). She sets it back at the angle it was sitting at. He is breathing through his nose.
[[canvases.nodes]]
id = "the_drawings"
name = "The Angle of the Tilt"
blocks = [
  { type = "image", props = { file = "story/jake_caught_and_hand/n2_drawings_on_desk.jpg", description = "A desk with four or five pencil and ink drawings of a young woman spread across it — one is of her at a diner counter holding a coffee pot. A fifth drawing is mid-render. The artist is out of frame but present.", search_queries = ["desk with multiple pencil ink drawings of same woman diner waitress coffee pot bedroom artist subject", "loose figure drawings tooth paper scattered across wooden desk lamp late night", "artist's desk multiple sketches of one woman different poses ink graphite realism"] } },
  { type = "paragraph", content = "She crossed the room. The floor under her feet was unfinished pine, the same tooth-rough surface the tooth-paper on his desk was, and it took the weight of her in three steps. He had not moved. His right hand was still on the paper." },
  { type = "paragraph", content = "She did not look at him. She looked at the desk." },
  { type = "paragraph", content = "There were four drawings out besides the one he was working on. Two were graphite on the same tooth-paper as the one under his pencil. One was in a softer pencil on a smaller sheet that had not been torn from a book but had been cut with a razor along one edge. One was ink, which meant he had worked on it more than once. The ink drawing was on the top of the stack, sitting a little proud because he had started a fifth drawing underneath it and the fifth was a quarter-finished pencil." },
  { type = "paragraph", content = "She picked up the ink drawing. She used the index and thumb of her right hand, at the corner, which was the way her mother had taught her to pick up a drawing — at the corner, with dry fingers, not touching the surface of the page. She held it at the weight a page was held at when you were looking at it and not at the person who had drawn it." },
  { type = "paragraph", content = "The ink drawing was her at the diner. She was in the blue blouse. The two regulars at the counter were a blur behind her; he had drawn them in the kind of pencil-then-ink way that made background people blurs by choice. Her hand was on the counter. The coffee pot was in the other hand. The angle of her tilt was the Thursday angle. He had been in the diner on a Thursday and had seen her. She did not remember him coming in. The not-remembering was a piece of the information." },
  { type = "paragraph", content = "She set it back on the stack. She did it at the angle it had been sitting at, which was slightly proud of the pencil under it, because moving it would have been a sentence and the sentence she was speaking in the room tonight was the one she was going to speak in a minute, not this one." },
  { type = "paragraph", content = "She looked at him." },
  { type = "paragraph", content = "He had not moved. His eyes were on the drawing on the page in front of him. His jaw was set in a way she did not have a label for yet. He was breathing through his nose. She could hear it." },
]
exit_block = { type = "choices", choices = [
  { text = "Sit on the edge of his bed.", targetType = "node", nodeId = "jake_caught_and_hand.the_hand_offer", time_progression_minutes = 1 }
] }

# ── N3 — the_hand_offer ── She sits on the bed-edge. 'Show me your hand.' Long silence. He turns in the chair without standing. She offers her palm. He says his one monosyllable — '...okay.' — and puts his hand in hers. Jake style-sheet Hand-phase specimen used exactly.
[[canvases.nodes]]
id = "the_hand_offer"
name = "The Weight Between"
blocks = [
  { type = "image", props = { file = "story/jake_caught_and_hand/n3_bed_edge_offered_palm.jpg", description = "A small bedroom with a twin bed against the wall, a young woman sitting on the edge with her palm offered up between them. A young man in a chair at a desk turned toward her, hands on his thighs, eyes dropped.", search_queries = ["young woman sitting on bed edge palm offered young man at desk chair late night quiet charged scene", "bedroom power dynamic woman seated man seated palm up offered silence dormer window", "intimate quiet moment bedroom desk chair offered hand hesitation late night lamp"] } },
  { type = "paragraph", content = "His bed was a twin, against the wall under the dormer window, with a dark blanket pulled up to the pillow at the head. The pillow was the pillow of a man who slept on one side — pushed to the right, the left side of the mattress flat, unused. A Penguin paperback of something was on the nightstand facedown. A water glass with an inch left in it." },
  { type = "paragraph", content = "She sat on the edge of the bed. She did not sit back. She sat on the edge in the way she had learned to sit on the edge of things, which was the Maya thing, the going-to-decide-before-sitting thing. The mattress gave half an inch under her weight. The bed-frame did not creak." },
  { type = "paragraph", content = "She looked at him. He had turned his head about fifteen degrees toward her. That was as far as he had gotten. His eyes had not met hers. His glasses were on. His wrist-push was still holding." },
  { type = "paragraph", content = "She said it." },
  { type = "dialog", content = "Show me your hand.", props = { speaker = "player" } },
  { type = "paragraph", content = "He did not move for a count. The pencil stayed on the page. The silence in the room was the silence of a house at eleven thirty-three on a Friday night in the second week of September — the cicadas through the cracked dormer, the floor settling, the refrigerator cycling two floors down. She did not repeat herself. She had not needed to repeat Frank. She was not going to repeat Jake." },
  { type = "paragraph", content = "He moved the pencil off the paper. He set it down next to the page. He used the right hand, the drawing hand. He turned his chair toward her." },
  { type = "paragraph", content = "He did not stand. He rotated from the seat at the desk, the chair's four castors ticking once on the pine floor, and when the rotation was done his knees were pointed toward the bed. His hands were on his thighs. His hands were not moving. He was looking at the edge of the blanket next to her hip." },
  { type = "paragraph", content = "She held her own hand out, palm up, at the distance between them — not a pleading distance, not a beckoning distance. The distance at which a hand was offered." },
  { type = "dialog", content = "...okay.", props = { speaker = "npc", npcId = "npc_jake" } },
  { type = "paragraph", content = "He said it at the weight of a thing that had slipped out of him. It was not a sentence. It was the single syllable of a man who had been building the wall of his own not-speaking since the door had opened, and had let one syllable past the wall, and had then put the wall back." },
  { type = "paragraph", content = "He put his hand in hers." },
]
exit_block = { type = "choices", choices = [
  { text = "Turn his hand over in her lap.", targetType = "node", nodeId = "jake_caught_and_hand.the_act", time_progression_minutes = 2 }
] }

# ── N4 — the_act ── The hand beat. She leads. Body does the scene. He makes one sound that is not a word. She does not describe to herself what she is doing — Operating→Saturated register, the verbs of agency without the narration of decisions. When it is done she is still holding his hand; she lets him have a count past.
[[canvases.nodes]]
id = "the_act"
name = "The Hand"
blocks = [
  { type = "image", props = { file = "story/jake_caught_and_hand/n4_hand_in_hand_close.jpg", description = "A close view of two hands in a lap — a woman's hand closed over a man's, fingers laced, in a lit bedroom at night. Both figures unseen above the frame. Implied intimacy without explicit imagery.", search_queries = ["two hands laced together woman's hand over man's close shot lap bedroom lamp", "intimate close hands held together in lap charged silent moment bedroom night", "implied intimacy hands clasped lit bedroom low light quiet private"] } },
  { type = "paragraph", content = "His hand was warm and larger than she had expected. She had expected a draftsman's hand — narrow, precise, a little cold from the paper. She got that, partly. She got the narrowness. The warmth was the new information." },
  { type = "paragraph", content = "She held it in her palm for a count. She did not move it. She let him feel her holding it. The weight of her hand on his was the geometry of the scene now, and the geometry had been hers since she had opened the door, and the geometry was going to stay hers." },
  { type = "paragraph", content = "She turned his hand palm-up in her lap." },
  { type = "paragraph", content = "The fingertips were callused where he held a pencil. The web between his thumb and index was pale from being indoors in September. His knuckles were clean. His nails were short. He had been drawing for hours tonight and the hand had the particular tiredness of a hand that had been making small precise marks for hours. She could feel it, in the way she could feel what a hand had been doing by holding it." },
  { type = "paragraph", content = "She turned it over again. She laced her fingers into his and closed her fingers. She felt him not resist. She felt him not move. She felt his breathing change — the way it came shorter through his nose, the way his chest did one bigger breath without asking for it." },
  { type = "paragraph", content = "She guided." },
  { type = "paragraph", content = "She did not describe, to herself, what she was doing. She was doing it. She had planned the *show-me-your-hand* part of the scene and had not planned this part because the plan had been the line and the line had landed and what was after the line was hers to make from what the room gave her. The room gave her his hand and a Friday at eleven thirty-six and the bed she was sitting on the edge of, and what was happening next was the thing she was choosing to do with those three elements." },
  { type = "paragraph", content = "He made a sound once. Not a word. A breath that caught and continued. His eyes had closed at some point. She had not looked at them closing; she had been looking at his hand. When she looked at his face his eyes were closed and his mouth was slightly open and his head was back one degree against the spine of the chair, and the cords in his neck were doing the thing cords in a neck did when a man had stopped holding himself." },
  { type = "paragraph", content = "She watched him. She did not speak." },
  { type = "paragraph", content = "When it was done she was still holding his hand. She let it stay in hers a count past when she could have let it go. She let him have the count. Then she lifted her hand off his and set his hand back on his thigh where it had been." },
  { type = "paragraph", content = "He did not open his eyes." },
]
exit_block = { type = "choices", choices = [
  { text = "Stand up.", targetType = "node", nodeId = "jake_caught_and_hand.after_routes", time_progression_minutes = 1 }
] }

# ── N5 — after_routes ── She stands. The four body-possibilities appear in the room as four distinct futures (shirt / lie-down / leave / college-question). Same architecture as frank_call_out N3 but with four-Maya-bodied futures, not four-decision-stances. Exit_block is the 4-way Keep fork preserving original flag/stat effects exactly.
[[canvases.nodes]]
id = "after_routes"
name = "Four Futures in a Twin-Bed Room"
blocks = [
  { type = "image", props = { file = "story/jake_caught_and_hand/n5_standing_beside_bed.jpg", description = "A young woman standing beside a twin bed in a small upstairs bedroom at midnight, a young man still seated at the desk with his eyes closed. The room quiet, charged, four futures implicit.", search_queries = ["young woman standing beside bed midnight young man seated at desk eyes closed quiet charged decision", "intimate aftermath small bedroom woman standing man seated late night implied choice", "bedroom decision moment post-intimacy quiet lamp lit loose drawings on desk"] } },
  { type = "paragraph", content = "She stood up from the bed. She did it at a normal speed. The mattress came back at the weight her weight had been pressing it at. She smoothed the blanket where it had wrinkled under her hip. She did it because it was a thing her hand was doing, not because the smoothing mattered." },
  { type = "paragraph", content = "Her right hand was wet where her fingers had been." },
  { type = "paragraph", content = "She looked at him. His eyes were still closed. His mouth was still slightly open. His breathing was still uneven. She had a count before he opened his eyes. The count was enough." },
  { type = "paragraph", content = "She saw the four of them in the room." },
  { type = "paragraph", content = "She could pull his t-shirt off him. She could wipe her hand on the inside of it, and she could fold it, and she could carry it back down the hall. She could come back Friday after Friday after Friday and the coming-back would be the thing the t-shirt meant, and the t-shirt folded on her chair in the corner of her own room would be the sentence the coming-back was spoken in. That was one." },
  { type = "paragraph", content = "She could lie down beside him on the narrow bed. Not on top, not inside the curl of his shoulder — beside him, the long line of her against the long line of his, both of them staring at the ceiling at eleven thirty-nine on a Friday in the second week of September. He would not touch her without being told to. She would not mind that. She would sleep there if she decided to sleep there. That was two." },
  { type = "paragraph", content = "She could walk to the door. Open it at the weight she opened doors at now. Walk the hall back. Close her own door. Not come back to this room. Let him carry the memory of the hand alone, and let the carrying be the whole of what this had been. That was three." },
  { type = "paragraph", content = "She could ask him about the community college. She could ask him about the registration dates and the aid forms and the difference between the .gov site and the .edu site, and he would tell her — he would tell her in one of the only long sentences she had ever heard him speak, because he was an information-source she had access to now and the access was a thing she had opened. That was four." },
  { type = "paragraph", content = "She did not know, yet, which of the four was the one her hand was going to want when she moved. She was going to find out in the moving." },
  { type = "paragraph", content = "The four were hers." },
]
exit_block = { type = "choices", choices = [
  { text = "Pull his t-shirt off him. Fold it into her own room.", targetType = "trigger", time_progression_minutes = 60, effects = [ { targetType = "npc", npcId = "npc_jake", trait = "love", op = "add", value = 10 } ], flagEffects = [ { targetType = "player", flag = "jake_caught" }, { targetType = "player", flag = "jake_hand" }, { targetType = "player", flag = "jake_q3_done" }, { targetType = "player", flag = "jake_arc_complete" }, { targetType = "player", flag = "jake_keep_route" }, { targetType = "player", flag = "jake_keep_owned" } ] },
  { text = "Lie down beside him. Stay the night.", targetType = "trigger", time_progression_minutes = 120, effects = [ { targetType = "npc", npcId = "npc_jake", trait = "love", op = "add", value = 15 } ], flagEffects = [ { targetType = "player", flag = "jake_caught" }, { targetType = "player", flag = "jake_hand" }, { targetType = "player", flag = "jake_q3_done" }, { targetType = "player", flag = "jake_arc_complete" }, { targetType = "player", flag = "jake_keep_route" }, { targetType = "player", flag = "jake_keep_lovers" } ] },
  { text = "Walk to the door. Do not come back.", targetType = "trigger", time_progression_minutes = 30, effects = [ { targetType = "npc", npcId = "npc_jake", trait = "love", op = "add", value = -5 } ], flagEffects = [ { targetType = "player", flag = "jake_caught" }, { targetType = "player", flag = "jake_hand" }, { targetType = "player", flag = "jake_q3_done" }, { targetType = "player", flag = "jake_arc_complete" }, { targetType = "player", flag = "jake_keep_route" }, { targetType = "player", flag = "jake_keep_withdrawn" } ] },
  { text = "\"Tell me what you know about the community college.\"", targetType = "trigger", time_progression_minutes = 60, effects = [ { targetType = "player", trait = "calculation", op = "add", value = 3 } ], flagEffects = [ { targetType = "player", flag = "jake_caught" }, { targetType = "player", flag = "jake_hand" }, { targetType = "player", flag = "jake_q3_done" }, { targetType = "player", flag = "jake_arc_complete" }, { targetType = "player", flag = "jake_keep_route" }, { targetType = "player", flag = "jake_keep_she_uses_him" } ] },
] }


# ─── B26 — Rent shortfall first. ───

[[canvases]]
id = "rent_shortfall_first"
name = "Short This Week"
description = "Sunday Week 9-11, 07:00, Frank's office — the Sunday of the shortfall. Maya has been at the desk in her room since 5:30 counting forty dollars into a brown envelope she wrote *60* on in pencil. She knocks three times the way he likes to be knocked for. She puts the envelope on the desk edge. She says *Short twenty this week.* Frank lets the silence sit. Four sentences on the desk beside the envelope — defer / chore-barter (if frank_tease_under_compliance_open) / T3-Thursday (if first_ambient_tilt) / can't-yet — and she picks the one the week after this week will be built around. — Rewritten 2026-04-24 (Session 16) as single-node Option A prose expansion per content_rewrite/PRD.md Tier C spec (400-700w target 700). Operating-band Maya (Week 9-11, corruption deep-Operating — shorter declarative verbs of agency, possessive surfacing, *she did not apologize* register, the arithmetic-at-the-desk is her register). Frank Phase-B silence discipline per frank.md and B21-B22 continuity (ZERO dialog this scene — *Frank lets the silence sit* is the book-canonical beat; his Phase-B presence carries via the hand-flat-on-the-ledger-page, the east-window-light-on-the-desk, the-mug-not-at-his-mouth-since-she-walked-in body-tells). Four-choice exit preserved with all gate conditions and all labels unchanged (the prior choice labels are already Quoted-dialog-as-label per choice_label_patterns.md ✅ pattern, no cleanup needed beyond token-leak verification — none present in labels). Strips 2 @npc_frank tokens from prior 2-line body skeleton. All flag/effect/time values preserved exactly (rent_shortfall_1 + rent_resolution on choices 1-3; rent_shortfall_1 + rent_evicted on choice 4; frank_tease_under_compliance_open gate on #2; first_ambient_tilt gate on #3; time 30 min; destinationType=trigger)."

