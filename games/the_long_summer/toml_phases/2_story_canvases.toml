# ── N1 — driveway ── The car on the gravel. Saturday 17:00. Maya carrying the Prologue in her body. Closed-band narrator. Heat through windshield, cicadas, red clay, screen-door slap as the opening sensory triad.
[[canvases.nodes]]
id = "driveway"
name = "Gravel"
blocks = [
  { type = "image", props = { file = "story/arrival_at_franks/n1_car_on_gravel.jpg", description = "A young woman's ten-year-old sedan parked on a gravel drive in front of a two-story Southern farmhouse at five in the afternoon in July. Red-clay dust on the rear tire wells. Screen door of the porch starting to open. Cicadas implied by the angle of heat shimmer off the hood.", search_queries = ["rural southern gravel driveway farmhouse Saturday evening late afternoon summer car arrival", "sedan parked on red clay drive in front of two story southern house july heat", "late afternoon arrival at family home gravel drive screen door opening welcome"] } },
  { type = "paragraph", content = "The last mile of Route 9 had been the long one — pines tighter on both sides than she'd remembered from visits before the move, the radio dropped to one station that was a preacher at the end of his voice, the heat built up over four hours of interstate and one hour of county two-lane until the AC had stopped being a thing she could meaningfully adjust. The turn onto the drive came up on the left after the mailbox with the name she had not yet practiced saying in her own mouth. The tires took the gravel with a sound she remembered from somewhere older than this year." },
  { type = "paragraph", content = "She parked. She did not turn the engine off right away. The cicadas in the pines on the far side of the yard were into their five-in-the-afternoon count. Something frying in a neighbor's kitchen — chicken, or okra, or the particular Saturday smell of two of those together — carried across the far fence. The clay in the drive had dried to a red she had remembered wrong since the last visit: it was redder than memory." },
  { type = "paragraph", content = "The house was two stories. The porch had a rail that needed painting along the east half and didn't along the west. The screen door was a dark mesh through which the front hall showed as a stripe of cooler light. She kept her hands on the wheel. She had driven three hundred and twenty miles and was at the end of it, and the at-the-end was a thing she had been putting off recognizing the way she had put off recognizing the turn onto the drive until she was ten feet from missing it." },
  { type = "paragraph", content = "The screen door opened before Maya had turned off the engine — opened at the weight of someone who had been listening for the tires on the gravel since a quarter past four. The woman on the porch was her mother. The woman had been her mother for all of Maya's eighteen years, and she had been Mrs. Frank Hayes for five of them, and the standing-on-a-southern-porch was a new fact about her mother Maya had not sat with yet." },
  { type = "paragraph", content = "She turned off the engine. She put her hand on the door handle. She did not open the door for a count that was the count of a person needing one second more, and then she opened it." },
]
exit_block = { type = "choices", choices = [
  { text = "Get out.", targetType = "node", nodeId = "arrival_at_franks.porch", time_progression_minutes = 2 }
] }

# ── N2 — porch ── Diana on the porch, Frank in the doorway. *"Maya, honey."* then *"Maya."* — two different weights of her name in two minutes. Diana smells of laundry soap + basil (Diana-specific scent load). Frank offers the suitcase. Closed-band Maya registers being *seen* as a surprise.
[[canvases.nodes]]
id = "porch"
name = "The Porch"
blocks = [
  { type = "image", props = { file = "story/arrival_at_franks/n2_porch_hug_frank_doorway.jpg", description = "A mother and teenage daughter hug on the steps of a two-story Southern farmhouse porch at late afternoon. Older man stands in the screen-door frame behind the mother, one hand on the jamb. Red clay drive visible in the foreground, an empty can on the porch rail, pines beyond.", search_queries = ["mother hugs teenage daughter on southern farmhouse porch late afternoon father in doorway", "reunion hug front porch summer evening stepfather behind mother screen door frame", "arrival welcome southern two-story home family greeting porch steps warm golden hour"] } },
  { type = "paragraph", content = "Diana came down the two steps of the porch. She did not wait on the top step; she came all the way to the gravel. She was in a grey t-shirt Maya faintly remembered, jeans she did not, her hair pulled back with a pencil Maya had not remembered until this moment Diana put her hair up with a pencil when she was in the middle of doing something in a kitchen. The apron was gone — hung on the hook inside the door before Diana came to the porch. The basil-smudge at her hip was the tell." },
  { type = "dialog", content = "Maya, honey.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "The hug was on the drive, not the porch, and came with the weight of a hug that had been held back an inch for the length of the county two-lane. Diana smelled of laundry soap — the cheap grocery kind — and of basil from the side garden, and of something warmer than either that was in the skin of her neck behind the ear and had been Maya's mother's smell for as long as Maya had been old enough to register a mother-smell." },
  { type = "paragraph", content = "Maya hugged back at the weight of a daughter who had been three hundred and twenty miles on her own with the Prologue in her body. Diana read the weight — let the hug go another count than she would have otherwise — and did not ask. Diana was not the asking kind at this hour. She held Maya by the shoulders at arm's length, looked at her face, did not say what she saw there." },
  { type = "dialog", content = "Come on in out of the sun.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Frank was in the doorway. He had come out of the kitchen at the sound of Diana's voice and had stopped at the jamb, one hand flat on it at shoulder height, the other in his pocket. He had shaved that afternoon. The face was the same face and was not; the line at the left corner of the mouth had been less deep the last time. He looked at her. He held the look for the count he held looks for." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He said her name at the volume a man said a name at when the name was the full sentence he had to say. The two syllables landed at the weight of a stepfather acknowledging a stepdaughter on the day she crossed the threshold into the house where she was going to live. Not cold. Not warm. The sentence the moment required." },
  { type = "paragraph", content = "He came down the two steps. He offered his hand for the suitcase — offering hand as the sentence. Maya let him take it. The suitcase had been hers for the drive, and the handing-over was a thing she had not practiced and did it anyway. Frank took it at the handle the way a man took a suitcase from a woman who had driven three hundred and twenty miles: centered over his hip, not lifted shoulder-high. He turned toward the door." },
  { type = "paragraph", content = "Diana's hand was at the small of Maya's back, guiding her toward the steps. The hand did not push. The hand was there. The porch planks gave louder under her foot at the second step than the first. Diana reached past her to open the screen. The hinge sang. The inside of the hall was cooler." },
]
exit_block = { type = "choices", choices = [
  { text = "Inside.", targetType = "node", nodeId = "arrival_at_franks.hallway", time_progression_minutes = 3 }
] }

# ── N3 — hallway ── The room, the bathroom-across-the-hall, Frank's dinner-at-six-thirty sentence. Ryan from the yard (voice without walking in). Jake at dinner (headphones, doesn't look up, nods once). All 5 flag effects land on the exit.
[[canvases.nodes]]
id = "hallway"
name = "Hallway"
blocks = [
  { type = "image", props = { file = "story/arrival_at_franks/n3_upstairs_hall_bedroom_door.jpg", description = "Upstairs hallway of a two-story Southern farmhouse with a runner carpet, a bathroom door standing open across from a bedroom door, suitcase being set inside the bedroom, late-afternoon light through a hall window at the end. Warm domestic late-summer interior.", search_queries = ["upstairs hallway southern two-story home bedroom door bathroom door runner carpet afternoon light", "family house interior upstairs landing late afternoon suitcase at bedroom threshold", "summer southern interior hallway wood floor runner rug warm golden light through window"] } },
  { type = "paragraph", content = "The hall ran front to back with the staircase on the right, the living room on the left, and the kitchen through the dining-room arch at the far end. Frank went up the stairs first with the suitcase. Diana stayed at the bottom with her hand on the newel post, looking up, not following. Maya counted the stairs because counting stairs on first climbs was a thing she had done since she was small. They were fourteen." },
  { type = "paragraph", content = "Frank turned left at the top. He set the suitcase inside the door of the second room on the left — the room Diana had told her about over the phone on the Sunday in April. A bed along the far wall with a quilt Maya recognized and a pillow she did not. A desk under the window. A chipped ceramic lamp with a band of blue at its base on the nightstand. An oscillating fan on the dresser, off. The runner in the hall ended at the door frame; past that the floor was bare wood." },
  { type = "dialog", content = "Bathroom's across the hall. Dinner's at six-thirty.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "Both sentences at the minimum length — the first a piece of information she could have found on her own, the second a piece of the ritual she was now inside. He set the suitcase down flat, not on its wheels, and stepped back into the hall. He did not close her door. He left it open at the angle a mother left a grown daughter's door when she was letting the daughter come to closing it on her own time." },
  { type = "paragraph", content = "He went down the stairs. The boards took his weight at a heavier count than they had taken hers coming up. From the window, before Maya had set her hand to any of the things in the room, a voice came up through the screen from the yard — through the two-inch gap the way voices carried on summer afternoons in the South." },
  { type = "dialog", content = "Hey, kid.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "Two syllables from a man who did not come inside to say them. A voice she would place later, on the second day, as Ryan's. Tonight she placed it only as a man's voice from a yard at arm's length through a screen. She did not go to the window. She did not answer. The voice was the sentence; the sentence had been said; the protocol was to let it have been said." },
  { type = "paragraph", content = "Dinner at six-thirty was in the dining room through the arch from the kitchen. The table was set for five. Diana at the head. Frank at the foot. Ryan was at the side of the table facing the kitchen — he had come in from the yard sometime between the suitcase going upstairs and the plates going on the table. She registered first his hands (on the table, knuckled and clean at the knuckle and tanned past it) and then the rest of him in the second pass. He said hey at the volume of a man who had already said it through a screen and was not going to repeat himself." },
  { type = "paragraph", content = "Jake was across from Ryan. Black t-shirt. Headphones around his neck, cord into the pocket of jeans older than Ryan's. Glasses off. He was looking at his plate before food was on it — the looking of a person who had chosen the plate over the room. Diana came to his chair and said his name once." },
  { type = "dialog", content = "Jake.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "He nodded. He did not look up. The nod was the whole meeting — not rudeness exactly but the register of a boy who had decided the telling had been enough preparation. Diana served him. She did not say his name again." },
  { type = "paragraph", content = "Dinner was brief. The food was good. Nobody asked Maya about the drive. Frank asked Ryan about a part for the mower; Ryan answered in a fragment. Diana cleared before the table was empty. Maya was in bed by eight with her door closed. She closed it quietly. She lay on the quilt with her clothes on and listened to a house that was going to be her house — the percolator getting put away, the television at low volume in the living room, a truck down on Route 9 changing gears, the cicadas through her two-inch-cracked window — and the fact, which she did not yet have a name for, that she had crossed a threshold she was not going to cross back across." },
]
