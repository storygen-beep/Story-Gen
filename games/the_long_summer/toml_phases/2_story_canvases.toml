name = "I'm Working"
description = "Sunday Week 1 evening. Jake at his desk, headphones on. The canonical Meet-hostile rebuff. — Rewritten 2026-04-24 (Session 13) as single-node Option A prose expansion per content_rewrite/PRD.md Tier C spec. Closed-band Maya. Rule 17 single-exit exception documented: the scene's design IS the rebuff (per book B4); Maya has no agency moment — she has been raised to say hello in a house she's going to live in, the saying-it is still a thing she has to do, and Jake's *I'm working* is the consequence. Preserves all flag/effect values (first_jake_rebuff flag; npc_jake.love -2). Jake style-sheet: bimodal clipped-under-pressure — two words and a raised hand, no turn, headphones stay on. Maya's half-sentence *Hey, I just wanted to say—* preserved exactly from original."

