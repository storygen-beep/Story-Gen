[[canvases.nodes]]
id = "base"
name = "Desk"
blocks = [
  { type = "image", props = { file = "story/the_math/base_desk_calculator.jpg", description = "A teenage girl's bedroom desk at nine-thirty at night in a southern farmhouse — lit only by a small ceramic nightstand lamp with a blue band at the base. A phone with a calculator app open on the wood desk next to a small stack of bills (ones, fives, one twenty) and a brochure folded to a page. An open notebook with handwritten figures. Window cracked two inches. Quiet late-summer interior.", search_queries = ["young woman at bedroom desk at night with calculator on phone counting cash ceramic lamp", "teenager doing budget math on bed desk small lamp nightstand blue band summer night southern", "quiet bedroom at night calculator phone stack of bills brochure notebook window cracked cicadas"] } },
  { type = "paragraph", content = "The second Sunday she had been at the house was the Sunday she did the math. It was late — nine-twenty-eight by the alarm clock on the nightstand — and the house was at its Sunday-night register, which was Frank already up the stairs for the newspaper crossword and Diana at the sink rinsing the last of the glasses and the television off and the percolator off and the light under Ryan's door not yet on because Ryan had not come back from wherever the pickup had been since seven. The cicadas were already in their nighttime count. The oscillating fan on the dresser was off. She had clicked the ceramic nightstand lamp on, the one with the chipped blue band at the base, and the light it put on the desk was the light of a 40-watt bulb in a lamp with a shade that had been cream-colored once and was now the yellow shades got when they had been in a room that had had a summer in it." },
  { type = "paragraph", content = "She had her apron folded flat on the corner of the desk. She took the money out of the apron pocket. She put it on the desk. She took the money out from under the lamp — the cash she had put there on Friday night because putting it under the lamp had felt like putting it somewhere that meant she was keeping it — and added it to the stack. She counted it twice. She counted it the second time because the first count had been wrong in the direction she had expected it to be wrong, which was lower than her estimate. The second count was the same as the first." },
  { type = "paragraph", content = "A twenty. Three fives. Four ones. Nineteen dollars more in quarters and dimes from two days of tips and one breakfast she had not bought a coffee for. Thirty-eight ones in the stack from Wednesday and Thursday's shifts — which had been four hours Wednesday and five hours Thursday. Marge had her on the schedule for four shifts the next week, which was four more than the four she had done this week. She knew the bill in her pocket from the first paid Sunday was gone already. She had handed the first rent to Frank on the kitchen table this afternoon at three. Frank had taken it without counting in front of her and had written *Maya — Wk 1* on a small notepad from the drawer by the phone and had not said anything else about it." },
  { type = "paragraph", content = "She opened the calculator app on the phone. The phone was the same phone. The thumb already knew the math before the app did." },
  { type = "paragraph", content = "Rent was sixty a week. Summer was the summer — she had twelve Sundays left counting this one as paid. Sixty times twelve was seven-twenty. Personal things — a tube of the toothpaste she used, the kind of tampon the local pharmacy carried, a gallon of gas a week to go into town and back because the car was the car — she had put at ten a week. Ten times twelve was one-twenty. The tuition she had been carrying in her head since the phone call in April was fifteen hundred. Seven-twenty plus one-twenty plus fifteen hundred was twenty-three-forty. The total she needed to get to by the Monday before classes started, which was the third week of August, was twenty-three hundred and forty dollars." },
  { type = "paragraph", content = "She had, at the lamp, ninety-seven dollars and change. She had a schedule for four shifts at T0 next week and Marge had not yet committed to more. A T0 shift was forty-five. Four times forty-five was one-eighty a week gross. One-eighty minus sixty for rent and ten for personal was one-ten net. One-ten times twelve was thirteen-twenty. Plus the ninety-seven in front of her. Thirteen-twenty plus ninety-seven was fourteen-seventeen." },
  { type = "paragraph", content = "Fourteen-seventeen against fifteen hundred was eighty-three short. That was if Marge gave her four shifts every week for twelve weeks and she did not have a single unpaid day off and she did not have one flat tire and she did not have a pair of shoes give out and she did not have a single unplanned expense. Eighty-three short was the math for the version of the summer that did not have anything go wrong." },
  { type = "paragraph", content = "She wrote the numbers in the notebook. She wrote them once because writing them twice was the thing you did to be sure, and she had been sure at the first writing. The notebook was the black composition one she had brought from the apartment. The page was the first page she had opened it to in six weeks. Her handwriting on the page looked like her handwriting." },
  { type = "paragraph", content = "The college brochure was on the nightstand next to the lamp. It had been in the glovebox since Kentucky. She had taken it out yesterday and left it there. She had not opened it. She had seen the community-college sign on Main Street on Wednesday when the walk to the diner had taken her past the turnoff and had registered the sign without going to the building. She was not going to open the brochure tonight. She was going to leave it where she had left it. The brochure was not the part of the math that was in question." },
  { type = "paragraph", content = "She sat at the desk with the ninety-seven in front of her and the thirteen-twenty in the phone and the fourteen-seventeen in the notebook and the fifteen hundred that she had been carrying since April, and she did what she had been doing since she was eight and doing math at a table was a thing she did the way some other children learned to swim: she looked at the numbers and she let the numbers tell her what the numbers were saying." },
  { type = "paragraph", content = "The numbers were saying that the T0 column was eighty-three short in the best case, and that Marge's Tuesday comment — *Thursdays are different. We'll see about those.* — had been a piece of information Maya had heard without yet understanding what she was hearing. The Thursday shift paid more. The why of the paying-more had been in the way Cookie had said *if you can hold an eye* on her second day, off-hand on the floor between the pass and the counter, without explaining what the holding meant. The holding-an-eye had been a sentence Maya had filed at the back of the drawer at the time. The holding-an-eye was going to be a sentence she was going to pick up, tonight, and hold in the hand the twenty and the three fives were on the desk under." },
  { type = "paragraph", content = "*There's more tier available if I want it. I can see where it goes from here.*" },
  { type = "paragraph", content = "She did not open the sketchbook. The sketchbook was on the desk — was under the notebook, actually, where she had put it two nights ago for no particular reason she had named to herself at the time — and the opening of it right now would have been the opening of the register that had drawn the flat-dumpling chicken and her mother's hands and the pine-log on the trail-head half a mile off the porch. The sketchbook was not the register the closing of the math belonged to. She left the sketchbook closed. She put the ninety-seven back in the stack. She put the stack under the lamp. She turned the lamp off. The house at nine-forty-one on a second Sunday in July did what houses did." },
]
exit_block = { type = "location", text = "Close the notebook.", config = { destinationType = "trigger", time_progression_minutes = 60, effects = [ { targetType = "player", trait = "calculation", op = "add", value = 2 } ], flagEffects = [ { targetType = "player", flag = "first_rent_paid" }, { targetType = "player", flag = "group_settled_in" } ] } }


# ─── B10 — Diner rhythm deepens. Regulars named. ───

[[canvases]]
id = "diner_rhythm_deepens"
name = "Regulars"
description = "Tuesday Week 3, 17:00-22:00. Maya's seventh T0 shift. Pete-the-mechanic walks in at 5:18 in dark-blue coveralls and the Hayes Hardware cap and she pulls the coffee from the Bunn without him having to ask — the first regular she has known without asking. The Opening-band narrator lets her register the knowing; the knowing had come across a month of Cookie's asides at the pass and Maya's own watching of what Pete does with the coffee and how he lays the folded paper face-down when he is through with the thinking. The other regulars surface in her mental Rolodex: the yellow-folder-crossword woman on Mondays and Wednesdays, the Saturday family with the baby who wants extra napkins before the plate, the Coke-not-coffee trucker at the last stool at six on Tuesdays. First real tip night — seven dollars on the table by Pete's mug, the first number given on purpose and not rounded out of the pocket the receipt came from. Cash-out at ten-oh-three. Fifty-two into the apron pocket at her hip. Cookie's *You're good* at the line, spatula-hand not looking up (approaching-vouch register, one shift short of the Thursday back-step intel-transfer at B11). Marge at the register with her back to the floor counting the drawer — the end-of-shift not-looking Maya had started to register around the second T0. Apron on the hook by the office door; the hook still Cookie's and still Marge's because Maya has not earned the key yet. — Rewritten 2026-04-24 (Session 14 continued, Tier C batch #2 / canvas 2 of 3-canvas Closed→Opening cluster) as single-node Option A in-place prose expansion per content_rewrite/PRD.md Tier C spec. Opening-band Maya narrator (corruption 25-49 'attending' register — 'she let herself register', 'she had the list of them now', active perception verbs, half-internal detail relationship). Preserves all flag + stat effects exactly (money +52, hygiene -15, rep_road +1, diner_regulars_named, time 300). Rule 17 single-exit exception per book B10 beat spec (final_book.md:2393-2406) — no listed choices; the beat IS the Chekhov-inventory shift + rhythm-recognition, not a decision moment. The choice has already been made, in the six shifts before this one; this shift is the naming of what the choice has been."

