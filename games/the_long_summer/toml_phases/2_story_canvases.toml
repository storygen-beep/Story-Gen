[[canvases.nodes]]
id = "base"
name = "The Porch Step"
blocks = [
  { type = "image", props = { file = "story/ryan_invite_porch/base_porch_headlights.jpg", description = "A Southern front porch at eight-fifteen on a Saturday evening in early September — two wooden rocking chairs, a small table between them with a lowball glass of Jim Beam at the boards, a fifty-year-old man in the chair with a folded paper on his knee, a young woman on the porch swing a few feet to his left with a kitchen towel still over her shoulder, the porch light off, the screen door behind them, the gravel of the driveway lit by the headlights of a pickup truck just turning in from the county road, cicadas in the pines.", search_queries = ["southern front porch saturday evening rocking chair whiskey older man young woman swing pickup truck headlights gravel driveway cicadas", "rural alabama farmhouse porch dusk swing rocker screen door truck headlights through pines summer", "porch light off screen door swing dish towel over shoulder father stepdaughter pickup truck arriving evening cicadas"] } },
  { type = "paragraph", content = "Eight-fifteen on a Saturday in early September. Diana had gone inside half an hour ago — the dishes had been Maya's, and the towel was still over her shoulder because she had not yet thought to take it off. Frank was in the rocker. The lowball was at the boards at the edge of the rocker's reach, where the lowball lived on Saturdays now. The paper on his knee was folded to the section he had finished an hour ago. The porch light was off. The cicadas were in the pines at the volume the cicadas were in the pines at on a Saturday in September." },
  { type = "paragraph", content = "She heard the truck before she saw the headlights. The engine had a particular sound — the second-story-shop truck, the one whose cup-holder had been broken since spring, the one whose idle was a half-step off because Ryan had not gotten around to the carb the way he kept saying he was going to. The headlights came up the gravel and laid two narrow strips across the front of the porch and held there." },
  { type = "paragraph", content = "Frank did not turn his head." },
  { type = "paragraph", content = "Ryan got out of the truck and left the engine running. He walked the gravel at his Saturday-evening pace, which was the pace of a man who had been at the shop until seven and had not gone home to change. He came up to the porch step and stopped at it. He did not climb the step. His hand went to the rail and stayed there. He looked at Frank first. Frank looked at the yard. The look held the count Ryan held looks the count past polite, and Ryan let it." },
  { type = "paragraph", content = "He looked at Maya." },
  { type = "dialog", content = "Sunday — I'll come get you.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "The fragment landed at the volume the porch held. Frank's jaw worked once. He did not turn his head. He took the lowball off the boards with his right hand and brought it to his mouth at the count he had been bringing it to his mouth at for the last forty minutes, and the count was the same count, and the swallow was the same swallow, and the lowball went back to the boards at the place the lowball had been." },
  { type = "paragraph", content = "Maya did not speak. The towel was still over her shoulder. Her hand was on the swing-chain at the place her hand had been when she heard the truck. She did not move the hand." },
  { type = "paragraph", content = "Ryan held the rail one more count. He nodded once at her. He did not nod at Frank. He turned and walked the gravel back to the truck and the headlights swung off the porch as he pulled out and the truck went the way the truck had come and the engine sound dropped past the curve at the road." },
  { type = "paragraph", content = "The porch resumed at the volume the porch had been at before. Frank did not say anything. Maya did not say anything. From inside the kitchen the water came on at the sink — Diana, finishing what Diana was finishing — and the screen door held the sound in. The cicadas had not stopped. They had not noticed." },
  { type = "paragraph", content = "She registered Frank's not-turning the way she had registered other things this summer that she had not yet had words for. The lowball would be empty by ten. Frank would go up the stairs at ten-fifteen. Diana would already be in the bedroom with the door cracked the way Diana cracked it when she was reading and waiting. The sentence Ryan had said would be on the porch in the morning the way the sentence Frank had not said would also be on the porch in the morning, and the morning would be Sunday, and Ryan would come up the gravel in the truck at six-forty-five." },
]
exit_block = { type = "location", text = "Inside. Towel off the shoulder.", config = { destinationType = "trigger", time_progression_minutes = 30, flagEffects = [ { targetType = "player", flag = "ryan_beach_invite_done" } ] } }


