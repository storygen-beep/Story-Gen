[[canvases.nodes]]
id = "base"
name = "Pete"
blocks = [
  { type = "image", props = { file = "story/ryan_partner_first_close/yard_mower_close.jpg", description = "The inventory yard behind a rural small-engine shop on a Tuesday afternoon in July — a 1978 John Deere riding mower with green paint oxidized at the hood and cracked seat vinyl at the left-side weld parked along a chain-link fence, a man in his late fifties in dark-blue coveralls with a faded Hayes Hardware cap standing with one hand on the handlebar and the other tilting the seat up to inspect the belt, a young woman in a t-shirt standing at shoulder-angle beside him with the ledger-pencil in her hand, pines beyond the fence line, afternoon light flat on the hood.", search_queries = ["older John Deere riding mower in rural southern equipment yard chalk price tag afternoon", "older mechanic in coveralls inspecting used riding mower seat up hand on wheel rim", "young woman at small engine shop yard with older customer inspecting green riding mower"] } },
  { type = "paragraph", content = "The Tuesday after the Tuesday Pete had bought the crankshaft was the Tuesday of the riding mower. Maya had been at the counter since two. The stool she sat on had become the stool — three Fridays and four Tuesdays since Ryan had handed her the pencil the ledger had been missing, and the stool had taken the shape it took for her hip and not for his. The box fan turned the air. The column-ruled spiral was open on the counter in front of her. She had filled six pages since the first Wednesday." },
  { type = "paragraph", content = "Pete came in at four-fifteen. He was in the dark-blue coveralls she had first catalogued at Marge's counter in May, and the Hayes Hardware cap had faded another shade in the weeks since, and his hands were clean at the knuckles the way they always were. He did not say hello to Ryan. He did not say hello to her. He said the mower outside, the green one, was Ryan selling it." },
  { type = "paragraph", content = "Ryan had been at the carburetor at the near end of the counter. He set the float bowl down. He stood up at the hip-crack, the way he stood up when something required him to stop what he was doing, and he stepped to the side of the stool she sat on. He did not speak. The Tuesday-nod Maya had learned by the second Friday came. She took the pencil. She took the ledger. She walked past him." },
  { type = "paragraph", content = "She walked with Pete out through the side door to the inventory yard. The riding mower was the John Deere that had been parked at the near-side of the fence line for six weeks — green paint oxidized at the hood, seat vinyl cracked at the left-side weld, chalk tag on the handlebar in Ryan's number-two pencil: 475. Pete walked the long side first. He put his hand on the rim of the wheel and rocked it. He tilted the seat back and looked under. He pulled the belt at the pulley with a finger and let it snap back." },
  { type = "paragraph", content = "He straightened up. He did not look at her. He looked at the hood. He asked the price without the verb." },
  { type = "paragraph", content = "She looked at him. She did not look at the chalk. The chalk was not the number." },
  { type = "dialog", content = "Four ninety-five.", props = { speaker = "player" } },
  { type = "paragraph", content = "She did not add because. Pete had the count she had watched him take at Marge's counter in the second week, the three-seconds-before-the-nod-or-the-not-nod count, and he took it and nodded once. He did not look at the chalk. He took the checkbook out of the inside pocket of the coveralls. He wrote the number. He tore the check. He handed it to her. She took it in her left hand. She did not look at it." },
  { type = "paragraph", content = "They walked back to the counter. She handed him the pencil. He signed the ledger. He handed the pencil back. He walked out under the roll-up door. His pickup door opened and shut. The engine turned over on the second crank. The sound thinned onto the county road." },
  { type = "paragraph", content = "Ryan had not said a word since Pete came in. He was at the stool again, the float bowl back in his left. He did not look up." },
  { type = "dialog", content = "Yeah. You got it.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "He said it at the carburetor. The float bowl went back into the throat. Then he did look up, for the length of the count he held, and he broke it." },
  { type = "dialog", content = "Big one's coming Saturday.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "He counted the thirty-five out of the drawer after the check went in, in fives, and slid them across the counter to her left hand the way he had slid the Gatorade across four Tuesdays ago. *Her cut.* She folded the thirty-five once and put it in the front pocket of her jeans. The asking-price was in the ledger; the over-ask was in her pocket. She wrote Pete's name and the mower and four ninety-five into the column on the next page, in the handwriting Ryan's handwriting had begun to defer to, on a page she had turned to before he did." },
  { type = "paragraph", content = "Saturday was three days away. The big one was not named yet. It would be named when it came. She would be at the counter at two." },
]
exit_block = { type = "location", text = "Fold the thirty-five into the front pocket. Walk home.", config = { destinationType = "trigger", time_progression_minutes = 60, effects = [ { targetType = "player", trait = "money", op = "add", value = 35 }, { targetType = "player", trait = "rep_road", op = "add", value = 3 }, { targetType = "npc", npcId = "npc_ryan", trait = "love", op = "add", value = 3 } ], flagEffects = [ { targetType = "player", flag = "ryan_partner_open" } ] } }


