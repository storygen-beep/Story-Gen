[[canvases.nodes]]
id = "base"
name = "Table Four"
blocks = [
  { type = "image", props = { file = "story/maya_midpoint_crack/n1_diner_floor_tilt.jpg", description = "A small-town southern diner at early evening — warm yellow light over booths and counter, a young waitress in a blue blouse and black pencil skirt carrying two plates along her left hip, passing a booth where three men in work jackets look up at her from their coffees. The motion is mid-walk; the tilt is at the hip.", search_queries = ["small town diner evening waitress blue blouse black skirt carrying plates past booth three men looking", "southern roadside diner warm lamp light thursday evening waitress tilt passing truckers booth", "vintage feel americana diner waitress carrying dishes along hip older men coffee booth subtle tilt"] } },
  { type = "paragraph", content = "Thursday. Seven-thirty-one by the Coca-Cola clock above the pass, which was a minute fast and which Maya had stopped correcting for four shifts ago because the minute-fast had become the way the minute read. The diner on a good Thursday in October was four-top-one through eight-top-six sat with regulars and a half-dozen drop-ins off the highway, the grill on two orders of eggs and one meatloaf, Cookie on the line running the way Cookie ran the line on a good Thursday — which was fast and talking." },
  { type = "paragraph", content = "Maya had the blue blouse on. She had the black pencil skirt Cookie had pointed her at in August at the Belks two towns over — the skirt that ran two more on the tables where it mattered, which she had bought and which had run at least three over by the fourth shift after. She had worked T1 for three weeks and T2 for two, and she had the T2 rhythm by now. The T2 rhythm was the tilt. The lean at the counter. The hand on the back of a chair for the count past polite. The refill that came a second earlier than it needed to. The small things she had added to the service motion she had learned in August, one at a time, each added in a shift where she had decided — in the hall on the way to the walk-in, in the mirror of the employee bathroom between refills — that the next small thing could go in." },
  { type = "paragraph", content = "She had not, until tonight, done any of them on purpose." },
  { type = "paragraph", content = "She had done them in a half-aware way. Felt them happen and let them happen and caught herself watching them happen. The catching had been the thing. The catching had ridden with her on the hour-walk home for the last four Thursdays, and she had let herself think about what the catching was going to mean, and she had not decided, and the not-deciding had been the shape of the last four Thursdays." },
  { type = "paragraph", content = "She picked up two plates at the pass at seven-thirty-one — eight-top-six's T-bone and the mashed for the driver across from him — and she walked them out across the floor. Table four was on the diagonal between the pass and eight-top-six. Three men, late forties, drivers out of Tuscaloosa by the jackets on the bench beside them, on their second coffees, an hour in, had not yet ordered the pie they were going to order. She had registered the three of them the way she had been registering men for six weeks now, which was that she saw how they looked at her and knew approximately what the tab would settle at and knew which of the three would push the tip." },
  { type = "paragraph", content = "She carried the two plates against her left hip because the angle made carrying them against her left hip the easier carry." },
  { type = "paragraph", content = "She passed the table." },
  { type = "paragraph", content = "She tilted at the hip." },
  { type = "paragraph", content = "It was a tilt she had made her body do. It was not a tilt that had happened to her body." },
  { type = "paragraph", content = "She did not look down. She delivered the two plates at eight-top-six and set the T-bone in front of the man on the aisle and the mashed across, and she asked if they needed ketchup and the driver in the aisle said no and she smiled at the count she had learned to smile at on a T2 shift, which was the count that said *I heard you and now I am going to the next table*, and she turned." },
  { type = "paragraph", content = "She walked back past table four." },
  { type = "paragraph", content = "The tilt had worked. The three men had stopped what they had been saying when she went by going the other way, and had not picked back up. One of them was watching the empty space she had just crossed. One was watching her going. One was looking into his coffee at the exact angle a man looked into his coffee when a woman had just done a thing his body had an opinion about." },
  { type = "paragraph", content = "She felt the looking. She had felt it in her skin the way she had been feeling it for six weeks — at the diner for the last four T1 shifts and the last two T2 shifts; at Frank's for the last two deliveries of iced tea to the porch after Diana had gone to bed; at the shop on the Saturday ten days ago that had not, since then, been something she had described to herself in words." },
  { type = "paragraph", content = "This time was not like those times." },
  { type = "paragraph", content = "*She did it on purpose. She felt nothing doing it.*" },
  { type = "paragraph", content = "She did not feel the small flutter she had felt in her second week at table seven when the trucker had held her eye. She did not feel the heat at the sternum she had felt the Thursday after the envelope had gone into the filing-cabinet drawer at the shop. She did not feel the part of her that had been checking, in every Thursday for six weeks, whether she was the kind of woman who would — because the kind of woman she was had been decided a Saturday afternoon ago, and confirmed a Sunday at the lake, and had been operating in the body walking across the diner floor for ten days since." },
  { type = "paragraph", content = "The not-feeling was the thing." },
  { type = "paragraph", content = "The not-feeling was the thing she had not known she could do." },
  { type = "paragraph", content = "She carried the empty tray back to the pass. Cookie was laughing at a joke the grill line had made that Maya had not heard the setup of. Marge was at the till counting out change for a four-top that had just left. Maya racked the tray. She took the coffee pot off the warmer. She went back out onto the floor." },
  { type = "paragraph", content = "The rest of the shift was the rest of the shift. She did the tilt once more at the six-top by the door, because she had decided in the back hall on the way to the walk-in that she would do it once more and would clock the not-feeling again. She clocked it. The not-feeling was the same not-feeling. The tip on the six-top went six dollars over what the tip on a six-top of that composition would have gone without the tilt, and Maya registered the six dollars as the number that the tilt weighed, and she did not register anything else." },
  { type = "paragraph", content = "At ten-forty she cashed out. The tips came to ninety-five dollars on the cash line, plus what was on the credit slips, which Marge would settle on Thursday next. She folded the ninety-five and put it in the small envelope she kept in the apron pocket for the folding. She took the apron off. She hung it on the hook by the office door." },
  { type = "dialog", content = "Apron on the hook. You're good.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "Marge's eye moved over Maya's face and did not land. Marge did not ask if she was good. Marge had not asked if she was good in a number of shifts now, and Maya had registered the not-asking the first Thursday after the farmer and had known what the not-asking meant without needing to have it named." },
  { type = "paragraph", content = "She went out the back. The key turned in the lock on the first try — a brass key in a lock wore smooth to the shape of the lock by the fourth use, which was a thing Maya had learned in the last year about keys — and she pulled the knob and the door was locked." },
  { type = "paragraph", content = "She walked the shoulder of State Route 9. The cicadas were still running their long August count even in October, the calendar turned but the South on its own schedule. The Deavers' mailbox still had the flag up. The Hansens' grass was short because Tuesday had been a Tuesday. The sodium light at the crossroads was on. She passed under it without looking up at it." },
  { type = "paragraph", content = "She did not think about what she was going to say to herself about what she had done on the floor, because the saying-to-herself-about-it was a thing Maya-of-August would have done. She put her hands in the front pockets of her jeans. The ninety-five was in the apron, and the apron was on the hook." },
]
exit_block = { type = "location", text = "Walk the hour home. Don't name it yet.", config = { destinationType = "specific", locationId = "loc_front_porch", time_progression_minutes = 300, effects = [ { targetType = "player", trait = "calculation", op = "add", value = 3 }, { targetType = "player", trait = "money", op = "add", value = 95 }, { targetType = "player", trait = "corruption", op = "add", value = 2 } ], flagEffects = [ { targetType = "player", flag = "midpoint_crack" } ] } }


# ─── B19B — Saturday porch invite. Sets up the Beach. ───

[[canvases]]
id = "ryan_invite_porch"
name = "The Invite"
description = "Saturday Week 7 evening, post-deal-close. Ryan walks up the gravel and onto the porch step. One sentence — *Sunday — I'll come get you* — said in front of Frank. Frank in the rocker, silent witness, does not turn his head. Maya on the swing, does not speak. Sets ryan_beach_invite_done (gates ryan_beach alongside ryan_big_deal_closed). — Authored 2026-04-27 (Session 22, off-page reference fix pass A1) to render the line previously reported off-page at ryan_beach.ride_east. Single-node Tier-A render. Closed-to-Operating-band Maya FID narrator. Ryan style-sheet fragment-only register; em-dash break preserves the fragment-format (NOT a complete sentence — the Beach Crack 'Stay with me.' remains his ONE complete sentence). Frank: zero dialog (silent-witness frame canon per frank.md). Diana: not in scene (in the kitchen running water — implied through the screen-door sound). Maya: zero dialog (Closed-to-Operating-band; the not-saying IS the registering). Rule 17 single-exit (ambient observational beat — Maya has no agency at the invite moment, Ryan delivers and leaves). All three NPCs carried by body-tells. Image block + description + 3 search_queries. Zero @npc_ tokens. Zero banned phrases."

