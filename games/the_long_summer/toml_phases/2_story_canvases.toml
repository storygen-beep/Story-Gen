[[canvases.nodes]]
id = "kitchen_bridge"
name = "The Glass"
blocks = [
  { type = "image", props = { file = "story/first_ryan_encounter/kitchen_glass_icebox.jpg", description = "A Southern farmhouse kitchen Sunday afternoon. A mother in her late forties at the sink with her back to the room, rinsing a stack of dishes that have been left on the counter. A young woman behind her at the open icebox, taking a glass pitcher of water out, an empty everyday glass on the counter beside it. Window over the sink cracked an inch, basil on the sill, percolator off, afternoon light coming in flat across the linoleum floor.", search_queries = ["southern farmhouse kitchen sunday afternoon mother at sink rinsing dishes daughter at icebox water pitcher", "rural alabama kitchen interior daughter taking glass from cabinet pouring water from pitcher mother's back at sink", "1980s southern kitchen icebox open pitcher of water everyday glass window basil sill afternoon flat light"] } },
  { type = "paragraph", content = "Diana was at the sink rinsing the dishes Maya had pushed aside half an hour ago when she had said she would do them in a minute and had then sat at the kitchen table for the half-hour without doing them. The rinsing was Diana doing them anyway, in the count Diana did dishes in, which was without remark. Maya had set the book down on the table — the same paperback she had carried into the kitchen and had not opened past the second page — and had stood up." },
  { type = "paragraph", content = "Diana did not turn around. She had heard Maya put the book down. She had heard the chair-leg on the linoleum at the count chair-legs went on the linoleum when somebody was getting up." },
  { type = "dialog", content = "Ryan's at the truck. Take him a glass.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Maya did not say anything. Diana did not say anything more. Maya took a glass down from the second-shelf cabinet — the everyday glasses, the ones Diana had brought in from the apartment the spring she had married Frank — and went to the icebox. The water from the pitcher came out at the count it came out at when the pitcher was three-quarters full. She filled the glass to the count of two finger-widths short of the rim, because that was the count for carrying a glass across a yard without spilling. She set the pitcher back in the icebox and closed the door." },
  { type = "paragraph", content = "She went out the side door. Diana did not turn around." },
]
exit_block = { type = "choices", choices = [ { text = "Across the yard. Glass in hand.", targetType = "node", nodeId = "first_ryan_encounter.base", time_progression_minutes = 5 } ] }

[[canvases.nodes]]
id = "base"
name = "Hood Up"
blocks = [
  { type = "image", props = { file = "story/first_ryan_encounter/yard_hood_up.jpg", description = "A young man in a grease-stained white t-shirt bent over the open hood of a 1990s pickup truck parked in a gravel turnaround at the edge of a Southern yard, one hand on the engine block, a wrench in the other, afternoon light, pines at the back of the lot, a toolkit open on the grass at his feet.", search_queries = ["young man working on pickup truck engine bay hood up gravel southern yard afternoon grease t-shirt", "auto mechanic home yard 90s chevy pickup hood up wrench pines", "rural alabama home yard truck engine repair afternoon stool toolkit open grass"] } },
  { type = "paragraph", content = "She walked the glass across the yard." },
  { type = "paragraph", content = "The pickup was in the gravel turnaround at the north edge of the yard, hood up, the engine compartment open to the light. Ryan was on a low stool at the driver's-side fender, half bent, a wrench in one hand and the other on the edge of the block. He was in a t-shirt that had been white some time ago, the sleeves hitting him above the elbow. There was a streak of black grease along the ulna of his right forearm like he had wiped the wrench on himself without thinking about it." },
  { type = "paragraph", content = "The yard had the particular heat of a Southern day that had not yet peaked — the air hot but not dangerous, the grass under her sandals holding the warmth of the morning's mowing, the smell of cut grass on the draft that came off the pines at the back of the lot. A bee was working the honeysuckle at the fence rail. Somewhere past the pines a bird she did not know the name of was making a three-note call." },
  { type = "paragraph", content = "She stopped at the passenger-side fender. He did not look up." },
  { type = "dialog", content = "Wrench'd help.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "He said it without looking at her, without looking toward her, at the toolkit open on the grass at his feet. The wrench he needed was on the near side of the toolkit. She saw it and crouched and picked it up, and she handed it to him over the engine. He took it without looking at her hand. He switched the wrench he had been using into his left and he put the new wrench on the bolt he had been trying to get and turned." },
  { type = "dialog", content = "Thanks, kid.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "It came out the way he said things — one beat, no lift, the word *kid* filed flat against the thanks. She set the glass of water on the fender at a distance he could reach without having to look. He nodded at the water without acknowledging it past the nod." },
  { type = "paragraph", content = "She stood. She did not know whether to go or to stay. Staying meant staying on the gravel for however long he had the hood up, without a reason that was legible as a reason, because she had not come out here in the first place with a reason that was legible to herself and was not going to manufacture one now. Going meant going back into the house, where Frank was on the porch with the paper and Jake's door was closed as far as she knew and her own room was where it had been when she left it." },
  { type = "paragraph", content = "She watched his hand work. The wrist turned an eighth and stopped, turned an eighth and stopped; the grip on the handle adjusted between each eighth. He tightened the bolt three rotations without saying anything. She did not ask him what he was doing. She did not ask him anything." },
]
exit_block = { type = "choices", choices = [
  { text = "Stay where she is. Watch him work.", targetType = "trigger", time_progression_minutes = 60, effects = [ { targetType = "npc", npcId = "npc_ryan", trait = "trust", op = "add", value = 2 } ], flagEffects = [ { targetType = "player", flag = "first_ryan_observation" } ] },
  { text = "Walk back to the house. Leave him to it.", targetType = "trigger", time_progression_minutes = 15, flagEffects = [ { targetType = "player", flag = "first_ryan_observation" } ] },
] }


