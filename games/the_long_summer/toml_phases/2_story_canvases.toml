[[canvases.nodes]]
id = "base"
name = "Coffee"
blocks = [
  { type = "image", props = { file = "story/first_morning_kitchen/base_coffee_paper.jpg", description = "Sunday-morning Southern kitchen at seven a.m. — older man at the kitchen table with a folded-open newspaper and a mug, older woman at the counter with her back mostly to the table attending to the percolator or the stove, a third empty chair at the table. Soft early morning light through a window over the sink.", search_queries = ["southern sunday morning kitchen seven am father at table with newspaper mother at counter", "rural farmhouse kitchen percolator sunday breakfast quiet light through window third chair", "family kitchen sunday morning coffee paper stepfather older woman at counter early summer"] } },
  { type = "paragraph", content = "She came down the fourteen stairs in yesterday's clothes. She had slept on top of the quilt with the jeans on and the t-shirt from the drive still on, and she had not opened the suitcase yet. The clock on the nightstand had said six-fifty-two when she had sat up. The house was already awake. The smell of coffee had been coming up the stairwell since somewhere before six-fifty-two, and had been part of what had woken her, and the other part had been the sound of the paper being opened at a table a man had been sitting at for already most of an hour." },
  { type = "paragraph", content = "The kitchen faced east. The light through the window over the sink was the light of a southern Sunday in July at seven in the morning, which was a light that had not yet decided whether the day was going to be the kind of hot that made the porch the cooler place than the kitchen or the kind of hot that made every room equally unusable by three. The percolator on the counter was going. The ticking of it was the ticking that had carried up the stairs." },
  { type = "paragraph", content = "Diana was at the counter. She had a coffee mug in her left hand and a kitchen towel in her right and she was wiping a spot on the counter that did not need to be wiped, which was a thing Maya was going to learn Diana did when the thing Diana was waiting on was a person not a pan. She did not turn around when Maya's foot hit the kitchen floor from the last stair. She had heard the fourteenth stair give before Maya had. She finished the wiping. She turned. She did not smile — the smile was reserved for a second later — and she looked at Maya for the count of a mother looking at a daughter who had slept in yesterday's clothes after a three-hundred-and-twenty-mile drive." },
  { type = "dialog", content = "Sit.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Frank was at the table. He was at the end closer to the window with the paper folded open against the napkin holder, a mug at his right hand, the reading glasses that lived on the sideboard now on his face. He had looked up at Maya when she came in at the doorway and had looked back at the paper. The looking-back-at-the-paper was not rudeness; it was the register of a man giving a woman in his kitchen the count she was going to need to cross from the doorway to a chair without being watched for the crossing." },
  { type = "paragraph", content = "Diana slid a mug in front of the chair Maya had not chosen yet. The mug had *Hayes Hardware* on it in a faded blue block letter and was the mug Frank's lumberyard had given out at an anniversary three counties over that Maya would not learn the story of for another month. The coffee was stronger than what Maya made for herself out of the grocery can of Maxwell House; it was stronger than what Diana had made when Maya was small; the summer had put something into the mornings that the coffee had risen to meet. Maya sat. She held the mug. She did not drink yet." },
  { type = "paragraph", content = "Frank folded the paper. He took a long breath through his nose and let it out, which was a thing he did when he was about to say a sentence whose shape he had already decided on, and he looked up over the top of the reading glasses." },
  { type = "dialog", content = "Maya. Rent's sixty a week, due Sundays.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "dialog", content = "You cook. Diana and I buy the groceries. That's the deal if you're staying.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "Her mother had said no rent on the phone in April. Maya had known Frank would ask anyway, which was something she had known without having been told, the way she had known the shape of the ask before the ask had been made. She had done the math on it for most of Kentucky. Sixty was fair. Sixty was what a room would cost in a worse town and a worse woman for a landlord. The cooking was a thing her hands already knew how to do; Diana had taught them, before the move." },
  { type = "paragraph", content = "The fifteen hundred came into her head without her asking for it. Community college tuition. The number Diana had offered on the phone to cover. Maya was going to cover it herself. She was not sure yet how she was going to explain that to Diana. She was not sure yet whether she was going to." },
  { type = "dialog", content = "Okay.", props = { speaker = "player" } },
  { type = "paragraph", content = "Frank nodded, once, and opened the paper again. Diana at the counter did not turn around. The percolator ticked at the count percolators ticked at when the heat had gone off them and the coffee had settled." },
  { type = "dialog", content = "Coffee's fresh.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "A beat. The paper turned a page. Then the other thing." },
  { type = "dialog", content = "Church is at ten. You can come. You can not.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He did not look up when he said it. The you-can-not was said at exactly the volume of the you-can-come, which was the register of a man who had decided a long time ago how to offer a daughter her own mind on a Sunday morning in a house where he was going to need her to know that he was not going to weigh the answer. The clock over the stove said seven-twelve. The light through the window had shifted a half-degree. Diana had not turned around." },
]
exit_block = { type = "choices", choices = [
  { text = "I'll come.", targetType = "trigger", time_progression_minutes = 30, effects = [ { targetType = "player", trait = "energy", op = "add", value = 10 }, { targetType = "player", trait = "rep_church", op = "add", value = 2 } ], flagEffects = [ { targetType = "player", flag = "first_morning_kitchen_done" }, { targetType = "player", flag = "rent_terms_set" }, { targetType = "player", flag = "attended_church_week_1" } ] },
  { text = "I'll stay.", targetType = "trigger", time_progression_minutes = 30, effects = [ { targetType = "player", trait = "energy", op = "add", value = 10 } ], flagEffects = [ { targetType = "player", flag = "first_morning_kitchen_done" }, { targetType = "player", flag = "rent_terms_set" } ] },
] }


