[[canvases.nodes]]
id = "base"
name = "The Shop"
blocks = [
  { type = "image", props = { file = "story/ryan_shop_first_visit/shop_counter_carb.jpg", description = "Interior of a small rural equipment shop in the afternoon — plywood counter on stacked cinderblocks, a box fan on a folding chair, a small fridge of Gatorade at the end of the counter, a twenty-five-year-old man in a faded blue t-shirt on a stool at the near end of the counter with the pieces of a carburetor (float bowl, needle valve, jet) laid out on a grease-grey shop rag, a spiral-bound column-ruled ledger with a chewed pencil beside it, light angling in from a quarter-raised roll-up door.", search_queries = ["rural small engine shop interior plywood counter carburetor rebuild parts shop rag", "southern used equipment outbuilding box fan Gatorade fridge afternoon light roll-up door", "young mechanic rebuilding carburetor float bowl needle valve work counter faded blue t-shirt"] } },
  { type = "paragraph", content = "The Saturday sun at three in the afternoon was the hottest thing about the day, and it had spread into the gravel between Frank's porch and Ryan's shop in a way that came up through her sandals. She had walked the fifty yards of the drive enough times now to know where the gravel ran deeper and where it thinned to red dirt. She had not walked it with this destination before." },
  { type = "paragraph", content = "She ducked under the quarter-raised door. The shop smelled of metal and grease and concrete gone summer-thick, slightly sweet from the Gatorades in the fridge, sharp at its edges with kerosene he'd been using earlier. A box fan turned the air without cooling it. The counter was a plywood slab on cinderblocks, and Ryan was on a stool at the near end of it with the pieces of a carburetor laid out on a shop rag that had started white and was not, now, white at all." },
  { type = "paragraph", content = "He did not look up. His hands did the work they had been doing when she walked in — the float bowl in his left, the needle valve in his right, his thumb seating the valve at a pressure the wrist had learned somewhere she had not watched him learn it. The scar across the back of his right forearm was visible above the rag. It was the scar from the yard two Sundays ago. Today's t-shirt was faded blue, not the grease-spotted white from the hood of the pickup." },
  { type = "dialog", content = "You lost?", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "She shook her head. She sat on one of the two metal folding chairs on the customer side. The ledger lay on the counter a foot from his elbow — spiral-bound, column-ruled, a pencil chewed at the eraser. She had let her eyes stay on the chewing for a second longer than she would have at Frank's desk." },
  { type = "paragraph", content = "A pickup rolled up in the gravel outside and the engine cut. A door opened and shut. An older man in a mesh-back cap with a feed-store logo worn nearly off at the brim came under the roll-up door and let his eyes adjust. Freshly shaved at the jaw and not at the neck, his work shirt pressed in the sleeve-lines his wife had put there that morning." },
  { type = "dialog", content = "Afternoon. Got a belt for a rear-tine tiller? Troy-Bilt, old one.", props = { speaker = "npc", npcId = "npc_customer_farmer" } },
  { type = "paragraph", content = "Ryan set the float bowl down. He did not stand up. He said the belt was in the inventory yard, eighteen dollars. The farmer said he had been getting it in Anniston for sixteen. Ryan said he could do seventeen. The farmer nodded once and walked past her chair to the side door. Ryan picked the float bowl back up." },
  { type = "paragraph", content = "*The ten-percent dance.* She had heard Cookie name the Thursday trucker who tipped on the bill because his wife checked the receipts. She had heard Marge not ask at the register whether Maya was good at the count. The list she had been keeping since the second week was longer this afternoon by one row: the eighteen Ryan had asked for, the seventeen he had settled on without lifting his head from the carburetor, and the way the farmer would come back next Saturday because the drive to Anniston was an hour and this was down the road." },
  { type = "paragraph", content = "The side door opened and closed. The farmer's pickup started. Ryan did not look up when it pulled onto the county road. He finished the seat, set the needle valve beside the float bowl. He wiped his right hand. The scar on the forearm came out cleaner against the grey-black of the rag." },
  { type = "paragraph", content = "He looked up." },
  { type = "dialog", content = "You any good with numbers?", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "dialog", content = "Yeah.", props = { speaker = "player" } },
  { type = "dialog", content = "Help me with the ledger tomorrow. I'll feed you.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "She said yeah without the ceremony the question would have gotten in April. The ledger was not Frank's notepad in the drawer under the phone; it was a column-ruled spiral under a box fan. The columns ran the same way down the page. The artist part of her had already opened the first page without picking it up. Ryan nodded once at the fridge. She took a Gatorade. The bottle was cold in her palm in the way she was going to remember the shop by first." },
]
exit_block = { type = "location", text = "Back across the gravel. Tomorrow, the ledger.", config = { destinationType = "specific", locationId = "loc_front_porch", time_progression_minutes = 60, flagEffects = [ { targetType = "player", flag = "ryan_shop_first_visit" }, { targetType = "player", flag = "ryan_help_tier_open" } ] } }


