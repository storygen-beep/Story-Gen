[[canvases.nodes]]
id = "base"
name = "Shift"
blocks = [
  { type = "paragraph", content = "The apron-knot was right now. She had tied it at the counter before the clock hit five and she had not looked down to tie it. Cookie had shown her that the second Thursday — string under the string, not over — and it had taken her three shifts to get it and a week past that to do it without her hands needing her eyes for the doing. The Tuesday was her seventh T0 and the first one she had walked in to without checking the chalkboard for the ticket count." },
  { type = "image", props = { file = "tier_c/diner_rhythm_deepens/base_pete_coffee.jpg", description = "Tuesday 5:18pm at the diner counter. Pete the mechanic in dark-blue coveralls and a faded Hayes Hardware cap at the second booth from the end, coffee mug already in front of him at his right elbow without his asking. Maya in apron behind the counter, hand still at the handle of the Bunn coffee pot on the warmer. Soft late-afternoon light through front plate-glass windows, the DINER sign in cursive red above the door visible in reverse through the glass. Six booths and six stools; the booth-numbering-by-floor-slope geometry established in first_diner_shift_t0.", search_queries = [ "small-town diner counter mechanic blue coveralls coffee mug 1980s southern", "1950s-style american diner booth worker coffee natural evening light", "diner waitress apron coffee pot counter mechanic customer regular" ] } },
  { type = "paragraph", content = "Pete walked in at 5:18. Tuesday was Pete's day. The dark-blue coveralls that lived folded in the back of his truck between jobs, the cap with the Hayes Hardware script in faded blue, the hands that were clean at the knuckles and would not be clean at the cuticles. He did not ask for coffee. She did not ask if he wanted it. The mug came down from the shelf above the till. The Bunn's third pot since five filled it. She set it at his right elbow at the second booth from the end. He nodded once. Pete was the nod-once kind." },
  { type = "paragraph", content = "She let herself register that she knew him. The knowing had not arrived all at once. It had come in Cookie's asides at the pass — Pete the mechanic, Tuesdays only, coffee and nothing, don't ask him about the wife — and in Maya's own watching of what he did with the coffee and how he did not add anything to it and how he laid the folded paper on the table face-down when he was through with the thinking he had come in for. *Pete.* She had not asked him his name. She did not need to. The name had come to her across a shift in three-second installments." },
  { type = "paragraph", content = "Others, too, now. The woman with the yellow folder and the crossword magazine, Monday and Wednesday mornings before the bank opened. The family in the booth by the door with the baby who wanted the extra napkins before the plate came, Saturdays at noon. The Coke-not-coffee trucker at the last stool, six o'clock Tuesdays, gone by six-forty because the shop floor opened at seven. She had the list of them now in the part of her head the Tuesday-shift went in. Cookie calling 'Order up' at the pass cleared the space where the name-list ran." },
  { type = "paragraph", content = "Cash-out at ten-oh-three. Forty-five at nine an hour for five, and seven on the table by Pete's mug, and the Coke-trucker's two, and the Saturday-family's three that was already a week old in the envelope Marge had paid out on Monday morning, and change. The seven sat on top of the stack. It was the first tip that had been a tip — a number that had been given on purpose, not rounded out of the pocket the receipt had come from. She counted it once. She slid it under the base. The fifty-two went into the apron pocket at her hip at the seam, the weight a clean small compact thing that had a shape now." },
  { type = "dialog", content = "You're good.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "paragraph", content = "Cookie did not look up from the wheel to say it. The dishwasher made its small steady noise. Marge was at the register with her back to the floor, counting the drawer — the end-of-shift not-looking, the kind she had started doing the first Tuesday after Maya's second T0 and had been doing every shift since. The whole diner at ten smelled of what it smelled of by ten — coffee and bacon grease and the Pine-Sol Cookie had hosed the floor with at eight, the air cooling only slightly at the front where the glass was losing the afternoon heat. Maya hung the apron on the hook by the office door. The apron was starting to be hers. The hook was still Cookie's, and the hook was still Marge's, because the diner was not hers, because she had not earned the key yet." },
]
exit_block = { type = "location", text = "Hang the apron. Walk the hour home. Seven on top of the forty-five.", config = { destinationType = "trigger", time_progression_minutes = 300, effects = [ { targetType = "player", trait = "money", op = "add", value = 52 }, { targetType = "player", trait = "hygiene", op = "add", value = -15 }, { targetType = "player", trait = "rep_road", op = "add", value = 1 } ], flagEffects = [ { targetType = "player", flag = "diner_regulars_named" } ] } }


# ─── B11 — Cookie peer established. ───

[[canvases]]
id = "cookie_peer_established"
name = "Back Step"
description = "Thursday Week 3, 20:00 — the pass is clear for a count of three tables, Cookie unclips the last ticket, wipes her hands on the apron front, and tips her chin at Maya on her way to the back door. The smoke break on the two concrete steps down off the kitchen, the strip of gravel to the dumpster, the sodium light at the corner of the back lot, Route 9 shoulder past the chain-link. Cookie sits on the top step (style-sheet body tell); Maya sits on the step below. Marlboro lit from the Bic in Cookie's apron pocket. The post-vouch intel-transfer: the full Rolodex of Thursday-night regulars handed over in one monologue — Dale (far stool, wedding ring, tips on the bill because the wife checks receipts), Roy (Peterbilt hat, meatloaf, folded fives on the table, in love with his ex-wife's sister), the Coke-trucker (same Thursday as Tuesday, $2 without a word), Pete (Tuesdays only), the Saturday church couple (Mill Street Baptist, count the ice in the water, 'she says bless before the meatloaf — don't clear anything until she's said it'). Cookie's signature positioning-phrase *\"Marge'll tell you, but I'll tell you faster\"* landed for the first time (per cookie.md style-sheet signature phrase list). Opening-band Maya registers the Rolodex as a thing Cookie decided to hand her — the decision Cookie had made on Cookie's own time, the handing-over the sentence Cookie had not said. Maya does not write the names on the step; she will write them later at her desk at Frank's (forward-shadow of the journal-entry beat 'I wrote the names down later' at 4_story_arc.toml:349). The cigarette smoke into Maya's hair on the hour home — a memory of someone she had not thought of since before the Sunday in April (subtle cat-b memory-intrusion held at hedged-Opening-band register — not named). — Rewritten 2026-04-24 (Session 14 continued, Tier C batch #2 / canvas 3 of 3-canvas Closed→Opening cluster) as single-node Option A in-place prose expansion per content_rewrite/PRD.md Tier C spec. Book-canonical 3-line opener preserved exactly ('You gonna make it, new girl?' / 'I'm gonna.' / 'Yeah you are. Hang a second, I'll tell you who's gonna tip you.' — per final_book.md:2419). All flag + time effects preserved exactly (cookie_peer_established, time 10). Rule 17 single-exit exception per book B11 beat spec (final_book.md:2410-2422 — no listed choices; the beat IS the vouch/intel-transfer, not a decision moment). **Naming-collision resolution:** cookie.md style-sheet specimen names the Thursday trucker 'Pete' but book B10/B11 + the Session-14 B10 rewrite establish Pete = Tuesday mechanic exclusively ('Pete's Tuesdays. He doesn't Thursday.' — per book B11:2420 'Pete on Tuesdays'). Following book canon: Thursday truckers named Dale (the wedding-ring one with the receipt-checking wife — the specific regular from cookie.md specimen) and Roy (second Thursday regular, filling out the 'trucker shift peak' plural per book)."

