] }

# ─── N4 ── home — Maya alone, planning ───────────────────────────────────────
[[canvases.nodes]]
id     = "home"
name   = "Item Four"
blocks = [
  { type = "paragraph", content = "The laundromat's dryers vibrated the floor at a frequency she had stopped hearing three weeks into her lease. She could hear it now. It was the sound of the afternoon agreeing with itself that nothing had changed, and the floor continued to hum, and the light came through her curtains the way it had come through last Wednesday's curtains and the Wednesday before that, and she sat on the bed thinking very carefully about how not to cry." },
  { type = "paragraph", content = "She was not going to cry. That part she had decided on the bench." },
  { type = "paragraph", content = "What she did not yet know was what the decision was instead." },
  { type = "paragraph", content = "She made a list, not on paper. On paper would have been an action, and actions meant commitment, and she was not ready to commit. In her head the list had items." },
  { type = "paragraph", content = "Item one: she could call him. She saw the version of herself that called him — the shape of that sentence, the way her voice would sound through the phone, the things he would say — and discarded it." },
  { type = "paragraph", content = "Item two: she could confront them. Go back to the classroom, or to Sarah's apartment, or to Daniel's, and perform the shouting version of this, the slap, the thrown glass. The version of herself that did that was a version she could perform, had performed, at fifteen, at sixteen, a girl with a clean wound and a louder voice. The wound was not clean. She was not fifteen." },
  { type = "paragraph", content = "Item three: she could tell Kevin. Just call him, tell him what she had seen, let him break up with Sarah cleanly. The version of herself that did this was a good person. That self-knowledge was interesting — a good person existed in her, was in fact available on short notice — but she noticed that she did not want to become that person at this particular moment. She put the option down. The good person in her was very quiet." },
  { type = "paragraph", content = "She sat on the bed." },
  { type = "paragraph", content = "The sketchbook was on the desk. It had been open since the weekend to a page of Daniel's hands — she had been drawing his hands on Friday evening while he watched a movie, the way she had drawn his hands a dozen times before, because she liked the particular knuckle of his left ring finger and the vein across the back of his hand that showed when he was cold. She looked at the page from where she sat on the bed. She did not get up and close it." },
  { type = "paragraph", content = "Item four appeared. It appeared whole. It was not a thought she constructed — it was a thought that was already there when she turned her attention to it, the way a word you have been trying to remember for an hour is suddenly the word, and was the word all along." },
  { type = "paragraph", content = "Item four was: do to her what she had done, and do it with someone she loves, and do it so that she has to learn about it the same way." },
  { type = "paragraph", content = "She held it in her head and noticed that she was not shocked by it. She noticed that she was doing the thing she had been doing all afternoon — observing herself from a half-step behind. The thought was the kind of thought a person had and then discarded, if the person was the person she had thought she was. She did not discard it. She turned it over. She tested it against the specific edges of what she knew about Sarah and what she knew about the people who were currently in Sarah's orbit." },
  { type = "paragraph", content = "Kevin was in Sarah's orbit." },
  { type = "paragraph", content = "Kevin and Sarah had been together for three years, one year longer than Maya and Daniel. Kevin was — and this was the symmetry Maya was turning over on the bed — exactly the right weight. Daniel would feel it because Daniel had never looked at Kevin and thought of him as competition. Sarah would feel it in the specific currency she had picked. What Sarah had done to Maya, Maya could do to Sarah, exactly, and with the same man-around-the-edges friend-group logic that had made Sarah and Daniel possible in the first place." },
  { type = "paragraph", content = "She stood up. She took off her coat. She laid it on the chair, folded, the way she folded everything." },
  { type = "paragraph", content = "She got into the shower with the water too hot, because it was too hot that she wanted, and she did not cry there either." },
  { type = "paragraph", content = "When she came out she sat on the edge of the bed in a towel, and she did not open the sketchbook, and she did not close it, and the evening began." }
]
