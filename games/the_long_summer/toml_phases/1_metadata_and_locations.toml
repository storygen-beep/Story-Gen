# ═══════════════════════════════════════════════════════════════════════════════
#  PHASE 1 — METADATA, PLAYER, NPCs, LOCATIONS, SETTINGS
#  Game: The Long Summer
# ═══════════════════════════════════════════════════════════════════════════════
#
# Source: book_phases/1_foundation.md, 2_characters_and_stats.md, 3_world_design.md
# Registry: games/the_long_summer/session_state.yaml (canonical flag / location /
#           beat / activity IDs)
# Engine features wired: F1 trait_words sidebar, F2 entry_conditions, F3
#           player/npc trait_decay, F4 rent eviction_mode, modifier_effects
#           with duration_hours (applied in Phase 2/3 choices; schema config here).
#
# NOTE on starting_canvas: the canonical registry in session_state.yaml names the
# Prologue opening beat `prologue_morning_with_daniel`. Book 1's Engine
# Configuration table had a placeholder `opening_prologue_morning`; the registry
# is the authoritative ID source since Phase 2 canvases will match it.

schema_version = "0.2"
starting_canvas = "prologue_morning_with_daniel"


# ═══════════════════════════════════════════════════════════════════════════════
# PROJECT
# ═══════════════════════════════════════════════════════════════════════════════

[project]
id = "the_long_summer"
title = "The Long Summer"
description = """
Maya, eighteen, arrives at her stepfather Frank's rural property in Millhaven, \
North Alabama, the summer after a revenge beat that collapsed her friend group \
and ended her relationship. Her mother Diana holds the kitchen at 6:30 and the \
house by the old code. Outside the screen door, the town runs on a register \
Diana doesn't enforce. Sixty dollars a week to Frank. Fifteen to groceries. \
Fifteen hundred to walk onto the community-college campus. Base diner wages \
don't get her there. Three men live in the house — Frank the landlord with his \
two-phase arc, Ryan the older stepbrother with a failing shop, and Jake the \
younger stepbrother who draws what he won't say. Maya lives in both registers \
at once. The game is how she decides which rules of her old code still apply \
when the math says otherwise and Diana is still quiet at the table.
"""


[theme]
mode = "dark"


# ═══════════════════════════════════════════════════════════════════════════════
# TIME SYSTEM
# ═══════════════════════════════════════════════════════════════════════════════
# Prologue opens on a weekday morning in Maya's old-life apartment (Daniel's
# bed). Phase 1 arrival (Saturday 17:00 per Book 3 §2) is reached by the
# Prologue's final beat (prologue_diana_call_and_pack) advancing the clock
# via in-canvas time effects. These are the clock's Prologue-opening values.

[time]
enabled = true
starting_hour = 9
starting_day = "Thursday"
starting_week = 1


