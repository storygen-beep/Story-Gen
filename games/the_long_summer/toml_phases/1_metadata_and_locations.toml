# ═══════════════════════════════════════════════════════════════════════════════
# NPCs — PHASE 1 ACTIVE
# ═══════════════════════════════════════════════════════════════════════════════
# Per Book 2. archetype field (from Phase 0) is authored here as the v4-prompt-
# required convention, even though the engine validator does not currently parse
# it. modifier_effects.duration_hours are NOT declared at NPC level — they
# apply per choice in Phase 2/3. Per-NPC arousal cadence per session_state.yaml
# engine_features_available: Frank 2h / Ryan 4h / Jake 8h.

# ─── Frank — authority (landlord, rule-enforcer, Phase B romance-adjacent) ───

[[npcs]]
id = "npc_frank"
archetype = "authority"
name = "Frank"
description = "Forty-eight. Broad through the shoulders and heavy in the arms — a man who still does the work he used to get paid for. Blunt, calloused hands with a web of small framing scars. Salt-and-pepper hair cut short every four weeks at the barber on Main Street. Crow's feet that deepen when he's tired, which is more often than he admits. Flannel shirts rolled to the elbow spring through fall, t-shirts when the heat gets above ninety. Jeans that fit. Work boots by the door. Addresses Maya by name — *Maya* — and the name lands like a door closing."
portrait = "frank.jpg"
customizable = true
relationship = "step-dad"
relationship_options = ["step-dad", "mom's husband", "landlord"]
core_traits = { love = 0, trust = 10, corruption = 0, arousal = 0 }
flag_keys = []

# Trust/love decay slowly if ignored — NPC-appropriate rates (Frank is slow to
# warm, slow to chill; lower decay than a peer-age NPC).
[npcs.trait_decay]
love = 0.5
trust = 0.3

# ─── Ryan — romance (older stepbrother, business-partner arc) ───

[[npcs]]
id = "npc_ryan"
archetype = "romance"
name = "Ryan"
description = "Twenty-five. Lean through the shoulders, strong through the back, tanned to the elbow from yard work. Faint scar across the back of his right forearm from a belt that slipped two years ago. Stretches with his hands laced behind his head after he sets something down — automatic, not performative. Eye contact rare but lands when it does, and holds a count longer than polite when it does. Faded t-shirts washed into softness. Jeans with grease at the knee. Work boots worn soft at the toe. Speaks in fragments. Colloquial. Compliments sideways — *you cleaned up*, not *you look nice*."
portrait = "ryan.jpg"
customizable = true
relationship = "step-brother"
relationship_options = ["step-brother", "housemate", "business partner"]
core_traits = { love = 0, trust = 5, corruption = 0, arousal = 0 }
flag_keys = []

[npcs.trait_decay]
love = 1.0
trust = 0.8

# ─── Jake — romance (younger stepbrother, hostility-to-hand arc) ───

[[npcs]]
id = "npc_jake"
archetype = "romance"
name = "Jake"
description = "Twenty-one. Lean, narrower through the shoulder than Ryan. Wrists that look like they could be broken in one grip. Glasses for drawing and reading, off for everything else — a habit he started in high school. Shaggy brown hair falling in his eyes; he pushes it back with the inside of his wrist. Black t-shirts more often than color. Jeans or cargoes, always with a pen in the pocket. Uses doorframes and porch rails to stand against. Flinches at accidental touch. Long sentences when comfortable, clipped when not — vocabulary shows the education he's still half-finishing. Draws nude women as his working register, secretly draws Maya once her beauty rises past a threshold he can't defend against."
portrait = "jake.jpg"
customizable = true
relationship = "step-brother"
relationship_options = ["step-brother", "housemate", "artist roommate"]
# love starts negative — he is actively hostile at arrival. corruption starts
# slightly above zero — he has his own accumulated register (the nude drawings).
core_traits = { love = -5, trust = 0, corruption = 5, arousal = 0 }
flag_keys = []

[npcs.trait_decay]
love = 1.5
trust = 1.2

# ─── Diana — safe_harbor (household anchor; no Phase 1 arc) ───

[[npcs]]
id = "npc_diana"
archetype = "safe_harbor"
name = "Diana"
description = "Forty-four. Maya's mother, Frank's second wife. Strong through the shoulders — a decade of solo mothering after Maya's father died. Graying at the temples, uncolored. Hair tied back with a cloth strip when she's cooking. Face lived-in and legible: worry shows at the mouth, tiredness at the eyes. Calluses on the heels of her hands from garden work she hasn't stopped doing even in the new yard. Cotton shirts and jeans around the house, a simple dress on Sundays. Glasses for reading, off for cooking. Wedding ring from Frank on her left hand; a thin gold band from Maya's father on a chain around her neck, tucked inside the shirt. Uses Maya's name directly and often. Doesn't ask the question she doesn't want the answer to."
portrait = "diana.jpg"
customizable = false
relationship = "mother"
# awareness: silent-witness accumulator (0–100). Bumped by every NPC-arc tier
# milestone. Never displayed as a number. Consumed by ambient Diana-prose
# variant logic in Phase 2/3. No trust/love axis in Phase 1 — Diana is a
# structural character, not an arc NPC, until Phase 2.
core_traits = { awareness = 0 }
flag_keys = []

# ─── Marge — mentor (diner employer; clean Mentor-lite per Book 1 §NPC 5) ───

[[npcs]]
id = "npc_marge"
archetype = "mentor"
name = "Marge"
description = "Fifty-seven. Owns and runs the diner on Main Street. Short, square through the shoulders, strong hands, hair kept at shoulder length with a streak of silver she's stopped dyeing. Apron tied low. Wears the diner's red shirt Monday through Saturday — owns three shirts and washes them in rotation. Short sentences, no wasted syllables. *Back booth. Behind the till. Key's under.* The voice of a woman who has heard every excuse. Deadpan, with a small warmth for the girls who stick. Rewards steadiness. Owner/appraisal sexual dynamic is Future_Considerations; Phase 1 Marge stays clean."
portrait = "marge.jpg"
customizable = false
relationship = "employer"
# No sexual arc axis. Marge's axis per Book 1 is *steadiness* — modeled here as
# trust only; love omitted so the Phase 4 story_arc emotion_mappings don't
# generate false romance texture.
core_traits = { trust = 0 }
flag_keys = []

# ─── Cookie — wildcard (diner peer; ambient texture) ───

[[npcs]]
id = "npc_cookie"
archetype = "wildcard"
name = "Cookie"
description = "Thirty-eight. Cooks the 5–10 p.m. shifts alongside Maya's waiting shifts. Taller than Marge, heavy through the middle, short hair, a collection of small burn scars on both forearms. Works a cigarette between dinner rushes on the back step. Voice is colorful. Curses functionally. Calls Maya *new girl* the first week, *you* the second, *honey* by the third — a small ceremony. Not sexual. Provides a second female voice in the diner kitchen and the ambient-gossip of Main Street."
portrait = "cookie.jpg"
customizable = false
relationship = "co-worker"
core_traits = { trust = 0 }
flag_keys = []


