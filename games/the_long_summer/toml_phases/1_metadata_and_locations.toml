# LOCATIONS
# ═══════════════════════════════════════════════════════════════════════════════
# 37 locations total (matches session_state.yaml:coverage.locations exactly).
# Split: 15 property, 4 shop, 7 main-street + diner, 5 town, 1 external
# (beach), 5 Phase-1-gated visible nodes.
#
# entry_conditions usage:
#   - Prologue-only locations: none are listed in session_state.yaml coverage
#     (Phase 2 Prologue canvases use synthetic loc IDs internal to the Prologue
#     sub-graph; we do not gate Phase 1 locations on a `phase = "prologue"`
#     flag because Maya IS in Phase 1 after arrival — the Prologue canvases
#     simply advance time into Phase 1 without visiting Phase 1 locations).
#   - Phase-1-gated locations (truck stop bar, fairground, stadium, church
#     interior, college campus): entry_conditions gate on the Phase 2+ flag
#     declared in 0_systems_spec.toml.
#   - Access-gated rooms (Frank's office outside bookkeeping, Ryan's room
#     outside arc): entry_conditions gate on frank_home_and_invited /
#     ryan_invites. Jake's room access is arc-tiered (opens when jake_tease_open
#     fires or the Caught scene triggers) — gated on jake_tease_open here.


# ══════════════════════════════════════════
# HUB 1 — FRANK'S PROPERTY (15 locations)
# ══════════════════════════════════════════

[[locations]]
id = "loc_property"
name = "Frank's Property"
description = "A contractor-built spread at the south edge of Millhaven. Main house, a detached outbuilding (Ryan's shop), a yard that blurs into fields, pines pushing in at the back. Gravel driveway crunches under every arrival and departure. Creek behind the trees; a trail head rising into pine. The heat holds even at night. The smell of creek water and cut pine when the wind's right. Ten minutes' walk to the nearest neighbor, twenty-five to Main Street."
image = "locations/property.jpg"
image_search_queries = ["rural Southern contractor property farmhouse wooden porch gravel driveway fields pine trees summer heat"]
is_container = true
default_entry = "loc_front_porch"
navigation_order = []

[[locations]]
id = "loc_front_porch"
name = "Front Porch"
description = "Two rocking chairs, a small table with @npc_frank's ashtray he stopped using, the porch light @npc_frank asks Maya not to leave on past midnight. Wasps under the eaves some summers; @npc_diana swats at them without standing up. The sound of the screen door is the sound of the house."
image = "locations/front_porch.jpg"
image_search_queries = ["Southern front porch wooden rocking chairs screen door porch light pine boards"]
parent = "loc_property"
navigation_order = ["loc_hallway", "loc_driveway"]

[[locations]]
id = "loc_hallway"
name = "Home"
description = "Inside the house. Worn wood floors and a single overhead bulb. Bedroom doors and the bathroom down the corridor, the living-room arch to one side, the kitchen at the end. Sound carries between rooms — @npc_jake's typing through the wall, @npc_frank's paper rustling, @npc_diana's coffee maker starting before sunrise."
image = "locations/hallway.jpg"
image_search_queries = ["wood-paneled rural hallway bedroom doors single ceiling light night dim"]
parent = "loc_property"
entry_from = "loc_front_porch"
navigation_order = ["loc_kitchen", "loc_living_room", "loc_bathroom", "loc_mayas_bedroom", "loc_franks_office", "loc_ryans_room", "loc_jakes_room", "loc_back_porch"]

[[locations]]
id = "loc_kitchen"
name = "Kitchen"
description = "The social hub. Butcher-block counter worn pale at the center. Five chairs at a four-person table — @npc_frank added one when Maya moved in. The coffee maker starts at 6 a.m. because @npc_diana is standing over it. The refrigerator hums loud enough to narrate pauses in conversation. The window above the sink looks out on the back yard. Dinner is at 6:30 because @npc_diana holds it at 6:30."
image = "locations/kitchen.jpg"
image_search_queries = ["farmhouse kitchen butcher block counter coffee maker window over sink yard morning light"]
parent = "loc_property"
entry_from = "loc_hallway"

[[locations]]
id = "loc_living_room"
name = "Living Room"
description = "Television against the long wall. Couch deep enough to lie down on. Lamp @npc_diana brought from the old house. Coffee table with coasters nobody uses. The porch visible through the front window. @npc_frank reads here some evenings when the office gets stale. This is the room where the catch-trigger fires."
image = "locations/living_room.jpg"
image_search_queries = ["rural living room deep couch old television lamp porch window Southern evening"]
parent = "loc_property"
entry_from = "loc_hallway"

[[locations]]
id = "loc_bathroom"
name = "Bathroom"
description = "Shared. One tub/shower, one toilet, one sink, a small window over the tub that opens onto the side yard. A single hook for a towel — @npc_diana added a second when Maya arrived. Steam hangs after @npc_frank's morning shower for an hour."
image = "locations/bathroom.jpg"
image_search_queries = ["small rural bathroom clawfoot tub side window single towel hook steam"]
parent = "loc_property"
entry_from = "loc_hallway"

[[locations]]
id = "loc_mayas_bedroom"
name = "Maya's Bedroom"
description = "Was a guest room. Twin bed against the far wall. Small desk Maya claimed for sketching. Window looks onto the front yard and the driveway. Shares a wall with @npc_jake's room — thin enough that she can hear his keyboard after midnight."
image = "locations/mayas_bedroom.jpg"
image_search_queries = ["small guest bedroom twin bed desk sketchbook window to driveway summer light"]
parent = "loc_property"
entry_from = "loc_hallway"

[[locations]]
id = "loc_franks_office"
name = "Frank's Office"
description = "The door stays closed when @npc_frank isn't in it. Metal filing cabinets older than the house. A desk facing the window so he can see the yard while working. Paper everywhere — neat piles, but piles. Whiskey and two glasses in the bottom drawer Maya was not supposed to know about."
image = "locations/franks_office.jpg"
image_search_queries = ["rural home office metal filing cabinets wooden desk facing window paper stacks whiskey drawer"]
parent = "loc_property"
entry_from = "loc_hallway"
# Gated: Frank's office is accessible only during a scheduled bookkeeping
# session or when frank_home_and_invited is set (Phase A post-test invitation
# pattern). The flag is set by specific Phase 2/3 canvases.
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "frank_home_and_invited", operator = "is_true" }
] }
blocked_message = "The office door is closed. Frank keeps it that way until he has decided who he is keeping it open for."

[[locations]]
id = "loc_ryans_room"
name = "Ryan's Room"
description = "Door usually closed when he's in the yard. Bed unmade. Posters for bands he hasn't listened to in five years. Truck parts on the dresser. Smells faintly of engine degreaser and clean laundry at the same time. Very limited Phase 1 access — @npc_ryan mostly lives in the yard and the shop."
image = "locations/ryans_room.jpg"
image_search_queries = ["rural young man bedroom unmade bed band posters truck parts dresser"]
parent = "loc_property"
entry_from = "loc_hallway"

[[locations]]
id = "loc_jakes_room"
name = "Jake's Room"
description = "Door cracked at night when he's awake; closed when he's out. Desk under the window — laptop, drawing tablet, sketchbooks stacked crooked. A bed that's usually made, which surprised Maya the first time she saw it. Smells like pencil shavings and the cheap coffee he drinks cold. Shares the wall with Maya's room. The Caught-beat fires here."
image = "locations/jakes_room.jpg"
image_search_queries = ["young man room drawing desk tablet laptop sketchbooks stacked small bed made neatly"]
parent = "loc_property"
entry_from = "loc_hallway"
# Jake's room opens once his Tease tier is live (he leaves the door cracked
# when he thinks Maya might walk by — Book 2B §5 frank.love=40-69 / jake mid
# bands). Before Tease, the room is closed-door unenterable.
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "jake_tease_open", operator = "is_true" }
] }
blocked_message = "Jake's door is shut. He has not given her any sign she is supposed to walk through it."

[[locations]]
id = "loc_back_porch"
name = "Back Porch"
description = "Where Saturday dinners happen. A long outdoor table @npc_frank built one summer. String lights @npc_diana hung two summers back. Faces the yard; the creek trail starts from here."
image = "locations/back_porch.jpg"
image_search_queries = ["Southern back porch long dinner table string lights backyard view evening"]
parent = "loc_property"
entry_from = "loc_hallway"
navigation_order = ["loc_yard", "loc_trail_head"]

[[locations]]
id = "loc_yard"
name = "Back Yard"
description = "Grass that holds up through August because @npc_diana waters it. @npc_ryan's work area is at the far side — tarps, an ongoing project or two, the riding mower. @npc_jake sometimes sketches from the back porch toward the creek. The yard is visible from the kitchen window."
image = "locations/yard.jpg"
image_search_queries = ["rural backyard grass distant work tarp creek treeline summer"]
parent = "loc_property"
entry_from = "loc_back_porch"
navigation_order = ["loc_creek"]

[[locations]]
id = "loc_creek"
name = "The Creek"
description = "Fifteen minutes' walk behind the property. Shallow, cold year-round, sandy bottom in one stretch, smooth stones in another. Maya sketches here when the kitchen is too crowded. @npc_ryan swam here as a kid. @npc_jake knows the sand stretch but doesn't go."
image = "locations/creek.jpg"
image_search_queries = ["Southern creek shallow water smooth stones pine trees reflected summer afternoon"]
parent = "loc_property"
entry_from = "loc_yard"

[[locations]]
id = "loc_trail_head"
name = "Trail Head"
description = "Rises off the back porch, thirty minutes of moderate walk into pine. A rest stop halfway — a fallen log that's been sat on for decades — and beyond that, the isolated stretch of creek where the water gets deeper and the trees close over. Phase 2+ surface mostly; Phase 1 is trail-starting-point only."
image = "locations/trail_head.jpg"
image_search_queries = ["pine forest trail fallen log rest stop dappled summer light"]
parent = "loc_property"
entry_from = "loc_back_porch"

[[locations]]
id = "loc_driveway"
name = "Driveway / Town-Walk Path"
description = "Gravel for fifty yards, then the county road. Half an hour of walking to Main Street at Maya's pace. The first few minutes pass @npc_ryan's shop on the property edge. The rest is county road under pine and kudzu. Ambient encounters land here — a truck slowing, a church woman's car, a sheriff's nod from the window."
image = "locations/driveway.jpg"
image_search_queries = ["rural gravel driveway county road pine kudzu summer heat haze"]
parent = "loc_property"
entry_from = "loc_front_porch"
navigation_order = ["loc_ryans_shop"]


