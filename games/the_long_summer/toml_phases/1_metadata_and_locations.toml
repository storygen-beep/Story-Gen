# SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════
# Per Book 1 §Engine Configuration + Book 3 §5: clothing is narrative texture,
# not a mechanical gate (Engine F2 clothing_enabled removed). No wardrobe
# settings, no clothing_requirements. F4 rent eviction_mode=flag_set.

[settings]
# clothing_enabled intentionally omitted (default false).

[settings.rent]
enabled = true
amount = 60
due_day = "Sunday"
collector_npc = "npc_frank"
grace_periods = 2
# Engine auto-collection is dormant until the scripted first_sunday canvas fires
# and sets first_sunday_passed. Scripted first rent is the diegetic handshake
# (Sunday W2); engine takes over from W3 onward. Aligns with Book 3 §Calendar
# ("rent due Sunday morning") + Book 2B §Whiteboard #1 (first rent = scripted).
start_after_flag = "first_sunday_passed"
# Fail-forward rent per Book 1 §Engine Config. Shortfall does not end the run;
# it sets rent_evicted and fires a Phase 2 canvas (rent_shortfall_first in
# session_state.yaml:coverage.story_beats handles the first incident).
eviction_mode = "flag_set"
eviction_flag = "rent_evicted"


