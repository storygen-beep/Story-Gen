# INCOME CHANNELS
# ═══════════════════════════════════════════════════════════════════════════════
# Source: Book 2B §4. Six primary channels plus one optional post-trigger channel.
# Phase 3 MUST produce a matching activity canvas for each channel (same location,
# same npc, same skill_gate, same payout range, same time cost).
#
# skill_gate_condition uses the MOST RESTRICTIVE single gate per v4 schema. Tiers
# with compound gates (T1, T2, T3) document the full gate stack in tier_description.
# Payout ranges below are per-shift TOTAL — Book 2B §4 expresses tip tiers as
# "on top of base $45"; here we flatten to total-per-shift for Phase 3 matching.

[[income_channels]]
id = "income_diner_t0"
name = "Diner base wage (T0 Distance shift)"
location_id = "loc_diner"
npc_id = "npc_marge"
skill_gate_condition = { type = "flag", flag_key = "hired_at_diner" }
payout_min = 45
payout_max = 45
time_cost_minutes = 300
narrative_tone = "respectable"
tier_description = "Base $45 flat per 5-hour shift. Always available from hired_at_diner. 40 energy. No tier-mechanics."

[[income_channels]]
id = "income_diner_t1"
name = "Diner tips (T1 Play along)"
location_id = "loc_diner"
npc_id = "npc_marge"
skill_gate_condition = { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 25 }
payout_min = 53
payout_max = 65
time_cost_minutes = 300
narrative_tone = "grey"
tier_description = "Base $45 + $8–20 tips. Gate: corruption ≥ 25 AND rep_road ≥ 15 AND beauty ≥ 45. 40 energy; higher hygiene decay per shift."

[[income_channels]]
id = "income_diner_t2"
name = "Diner tips elevated (T2 Work the floor)"
location_id = "loc_diner"
npc_id = "npc_marge"
skill_gate_condition = { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 50 }
payout_min = 70
payout_max = 105
time_cost_minutes = 300
narrative_tone = "grey"
tier_description = "Base $45 + $25–60 tips. Gate: corruption ≥ 50 AND beauty ≥ 55. 50 energy (more active)."

[[income_channels]]
id = "income_diner_t3"
name = "Diner extras (T3 Back booth after close)"
location_id = "loc_diner_back_booth"
npc_id = "npc_marge"
skill_gate_condition = { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 75 }
payout_min = 50
payout_max = 200
time_cost_minutes = 90
narrative_tone = "corrupt"
tier_description = "Scene-by-scene agency, NOT a mode toggle. $50–200 per scene. Gate: corruption ≥ 75 AND specific customer flags AND first_ambient_tilt = true. +25 energy on top of T2 shift."

[[income_channels]]
id = "income_ryan_small"
name = "Ryan shop small-ticket cut"
location_id = "loc_ryans_shop"
npc_id = "npc_ryan"
skill_gate_condition = { type = "flag", flag_key = "ryan_help_tier_open" }
payout_min = 10
payout_max = 25
time_cost_minutes = 60
narrative_tone = "respectable"
tier_description = "$10–25 per close. Gate: ryan_help_tier_open (set when Maya first witnesses a small-ticket close). 15 energy per close."

[[income_channels]]
id = "income_ryan_big"
name = "Ryan shop big-ticket cut"
location_id = "loc_ryans_shop"
npc_id = "npc_ryan"
skill_gate_condition = { type = "flag", flag_key = "ryan_partner_open" }
payout_min = 80
payout_max = 300
time_cost_minutes = 240
narrative_tone = "grey"
tier_description = "$80–300 per close. Gate: ryan_partner_open AND one of {customer_farmer_flag, customer_scrapper_flag, customer_divorcee_flag} AND corruption ≥ 50 for mid-ticket or corruption ≥ 75 for full big-ticket. 30 energy per close; may consume the whole afternoon."

[[income_channels]]
id = "income_frank_chores_optional"
name = "Frank chores (post-Restrict supervision)"
location_id = "loc_property"
npc_id = "npc_frank"
skill_gate_condition = { type = "flag", flag_key = "frank_restrict_declared" }
payout_min = 5
payout_max = 20
time_cost_minutes = 45
narrative_tone = "grey"
tier_description = "Optional. $5–20 per task. Gate: frank_restrict_declared (Phase B trigger fired). Frank uses chores to keep Maya visible — the money is real, the purpose is supervision."


