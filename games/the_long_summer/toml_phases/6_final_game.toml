] }

# PLAY ALONG SUB-NODE — T1's Opening-band beat (Pete-second-cup setup) + state variants + 3 Opening-band fork choices verbatim
[[canvases.nodes]]
id = "play_along"
name = "Play Along"
blocks = [
  { type = "paragraph", content = "The apron at her hip was the second one of the week; Cookie had flagged the one she had been wearing Monday for the Pine-Sol stain at the front-left pocket and had handed her a fresh one at the start of the shift without the sentence that would have been the handing-her-a-fresh-one. The tip jar at the end of the counter had been moved three inches closer to the cash register since her first week — she had noticed that at the beginning of August and had not, to herself, decided whether the moving had been Marge's or Cookie's or her own habit." },

  { type = "paragraph", content = "Pete's second cup had been in front of him long enough that the coffee in it would be past warm by the time he got to the bottom of it. She had waited the count. She had come around with the carafe at the count she had been taught by the Friday three weeks ago when Pete had finally said it out loud — *Maya. I take it when I'm ready.* He had said it once without the stress and once with. She had been watching the clock on it anyway, since. She watched differently now — she watched to time the come-around so it landed the beat Pete had given her the permission to land." },

  # DEFAULT — pre-Ryan-Beach: the Opening-band Maya lets herself linger
  { type = "group", blocks = [
    { type = "paragraph", content = "The joke was the one about the tourist who had asked the farmer for directions to Nashville and the farmer had answered in a sentence that did not contain Nashville. She had heard it from Cookie first, from the crossword-trucker second, from Pete-at-the-counter third, and she had laughed at it the third time too because the third laugh was the one that paid. She let herself laugh. She registered the letting. The letting was the part she had been getting used to." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "ryan_beach_proposal", operator = "is_false" }
  ] } },

  # WARM — rep_road ≥ 30: the arithmetic-of-tips register landing
  { type = "group", blocks = [
    { type = "paragraph", content = "A five-dollar bill under the plate at booth two. The man at booth two had been the man at booth two on three of the last four Fridays and had never left more than the twenty-percent the arithmetic of his check suggested. The five was over the twenty-percent by the count of three dollars and the count of three dollars was the count of the beat Maya had held at his elbow while she had been refilling his wife's decaf. The church couple nodded the way the church couple nodded and did not say anything." }
  ], conditions = { version = "1.0", items = [
    { type = "trait", subject = "player", trait_key = "rep_road", operator = "gte", value = 30 }
  ] } },

  # CONSEQUENCE — rep_church ≤ 10: the church couple has already moved
  { type = "group", blocks = [
    { type = "paragraph", content = "The church couple was not in booth three tonight. They were in booth six, the one by the bathrooms, which she had set for them twice already on earlier Fridays and had both times thought the setting was for customers who had specifically asked. They had not asked tonight. The pastor's wife had walked past booth three and the woman already sitting in booth six had stood up to take her check to the counter, and the pastor's wife had taken booth six without having to request it. The tip was there at the end. The tip was the same it had been." }
  ], conditions = { version = "1.0", items = [
    { type = "trait", subject = "player", trait_key = "rep_church", operator = "lte", value = 10 }
  ] } },

  { type = "paragraph", content = "Pete at the counter did the thing he did when he was ready for the refill but did not want to be the one who asked. His hand at the cup did not quite move. His shoulder shifted an inch toward the carafe she was holding. The jukebox was between songs. She had the count." },
]
exit_block = { type = "choices", choices = [
  { text = "Linger at his shoulder. Refill twice. Laugh at the one he's about to tell.", targetType = "trigger", time_progression_minutes = 300, effects = [
    { targetType = "player", trait = "money", op = "add", value = 65 },
    { targetType = "player", trait = "rep_road", op = "add", value = 3 },
    { targetType = "player", trait = "corruption", op = "add", value = 2 },
    { targetType = "player", trait = "rep_church", op = "add", value = -1 },
  ] },
  { text = "Refill once. Hold the eye a breath longer than needed. Thank-you.", targetType = "trigger", time_progression_minutes = 300, effects = [
    { targetType = "player", trait = "money", op = "add", value = 58 },
    { targetType = "player", trait = "rep_road", op = "add", value = 2 },
    { targetType = "player", trait = "corruption", op = "add", value = 1 },
  ] },
  { text = "Refill. Step back to the pass. Let Cookie's bell do the work.", targetType = "trigger", time_progression_minutes = 300, effects = [
    { targetType = "player", trait = "money", op = "add", value = 53 },
    { targetType = "player", trait = "rep_road", op = "add", value = 2 },
  ] },
] }

# WORK THE FLOOR SUB-NODE — T2's Operating-band beat (blue apron + counter-three-rows-deep) + state variants + 3 Operating-band fork choices verbatim
[[canvases.nodes]]
id = "work_floor"
name = "Work the Floor"
blocks = [
  { type = "paragraph", content = "The apron was the blue apron. She had bought it with the first week's tips she did not count into the rent envelope — the apron Cookie had eyed without saying anything the Wednesday Maya had put it on for the first time, the eying that had been the answer Cookie did not need to put into words. The apron had the front-pocket shape of a pocket that had held bills since June and did not un-shape itself between washes. She wore it now on the T2 shifts. The T2 shifts were hers. The T1 shifts had been the first count; the T2 shifts were the count she had come to take." },

  { type = "paragraph", content = "She worked the counter three rows deep. She read the room at the pass. She had her tables — two, four, six on the odd-rotation nights; one, three, five on the even — the numbering she had worked out with Cookie in the second month when Cookie had stopped handing her the tickets in the order they came up and had started handing her the ones from the tables where she would earn the most for the walk. Cookie did not say Maya was earning more. Cookie said *these are yours*. Maya took them. The taking had become the thing she did without the second-guessing. The second-guessing had been the summer's first register and was not the summer's current register." },

  # DEFAULT — pre-Ryan-Beach: the Operating-band Maya works the counter
  { type = "group", blocks = [
    { type = "paragraph", content = "The trucker at the counter was not Pete tonight — Pete was Tuesdays. The trucker was the younger one with the crew who had come in Tuesday of last week and again tonight, first at the counter this time instead of the long table. He had looked at her once when she set the placemat. She had the count of his look. She would lean on the counter at the count he was at the bottom of the coffee. The tip jar at the end of the counter was audible by eight." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "ryan_beach_proposal", operator = "is_false" }
  ] } },

  # CONSEQUENCE — post-Ryan-Beach: the Ryan-partnered register landing
  { type = "group", blocks = [
    { type = "paragraph", content = "The trucker crowd knew Ryan. She had not expected that. The crew of five at the long table had bought a flatbed off Ryan's lot in April, the scrapper at the counter had been at the shop twice this month, Pete was Pete. Half the counter asked without asking — the eye-contact on her that was a beat longer than the eye-contact on a waitress from a man who did not know the waitress was partnered with the man who had sold him his truck. She had the answer to the question they were not asking. She had not yet picked which answer to give on which night. The not-picking was the register she had not been in before and did not plan to stay in for long." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "ryan_beach_proposal", operator = "is_true" }
  ] } },

  { type = "paragraph", content = "By eight-forty the floor had the shape it had been going to have by eight. The counter was three men deep. Cookie at the pass kept the tickets coming. Maya had her tap — the second carafe on the warmer, the blue apron in the front-pocket shape it took at this weight of tips, the count of the counter she had by now done three times that evening. She knew the eye-count on her from each man at the counter. She knew which of the six was the high-tipper by the hand-on-cup and which was the mid-tipper by the way he did not quite turn his shoulder when she came past. The question was not whether to tilt the room. The question was which Maya she was going to be for the last hour." },
]
exit_block = { type = "choices", choices = [
  { text = "Tilt the room. Walk past him twice before the refill.", targetType = "trigger", time_progression_minutes = 300, effects = [
    { targetType = "player", trait = "money", op = "add", value = 105 },
    { targetType = "player", trait = "rep_road", op = "add", value = 4 },
    { targetType = "player", trait = "corruption", op = "add", value = 3 },
    { targetType = "player", trait = "rep_church", op = "add", value = -1 },
  ] },
  { text = "Pick the moment. Lean on the counter at the count.", targetType = "trigger", time_progression_minutes = 300, effects = [
    { targetType = "player", trait = "money", op = "add", value = 87 },
    { targetType = "player", trait = "rep_road", op = "add", value = 3 },
    { targetType = "player", trait = "corruption", op = "add", value = 2 },
    { targetType = "player", trait = "rep_church", op = "add", value = -1 },
  ] },
  { text = "Work the floor. Let the tip jar do the work.", targetType = "trigger", time_progression_minutes = 300, effects = [
    { targetType = "player", trait = "money", op = "add", value = 70 },
    { targetType = "player", trait = "rep_road", op = "add", value = 2 },
    { targetType = "player", trait = "corruption", op = "add", value = 1 },
  ] },
] }


# ─── D4: T3 Back booth after close ─────────────────────────────────────────

[[canvases]]
id = "activity_diner_t3"
name = "Back booth after close"
description = "Thursdays 22:00+ only. Scene-by-scene agency, not a mode toggle. — Rewritten 2026-04-25 (Session 17, Tier D batch #1 canvas 4 of 4 — TIER D CLOSE) per content_rewrite/PRD.md Tier D spec: 4 customer-archetype rotating openings (scrapper / anniversary-husband / Dale the Nashville-Chattanooga trucker / returning-regular) + 3 universal body paragraphs establishing Saturated-band back-booth register (*She closed the till at eleven-oh-five... The key went into her pocket* — direct transcription of final_book.md:471 Saturated specimen) + 2 state-conditional variant groups keyed to post-frank_cracked + post-frank_keep_route (the two Saturated-band shifts in Maya's relationship to the Thursday-night register) + 3 Saturated-band-enhanced choices at the stand/sit/sit fork per final_book.md:454-459 Saturated choice framing. **Strips 1 @npc_marge token leak** and **the one-entire-sentence italic meta-narration** (Rule 26 violation — prior state's `*Each scene is one decision at a time. She can refuse. She can negotiate the number. She can say yes.*` was game-designer meta-instruction breaking FID, replaced with in-register Saturated-band Maya-narrated prose). **Fixes Marge mis-characterization** from prior state ('The customer @npc_marge has decided to put Maya here with' wrongly positioned Marge as customer-picker / madam register — conflicts with marge.md 'No sexual arc Phase 1. Mentor-lite. Owner/appraisal dynamic deferred to Phase 2+' — book canon is Marge provides SPACE not customers); rewrite corrects: Marge 'had locked the back door from the inside and left the key on the hook where the key went on Thursdays. The diner was hers for the hour' — Marge's role reduced to space-provider, Maya's agency central. **Effects preserved** from current TOML (PRD scope: only change broken values): Refuse 30min/rep_road+1, Negotiate 90min/$120/corr+2/calc+1/rep_road+2/rep_church-2, Close 90min/$180/corr+3/rep_road+2/rep_church-2 — all within book-canon $50-200 range per final_book.md:3381. Saturated-band specimen + maya.md Saturated doctrine: minimal hedging, subject+active verb, past-tense routine + present-tense decision, often drops subject pronoun, inhabited-routine. Cross-canvas continuities: Operating-band specimen landing from D3 activity_diner_t2 Thursday rotation progresses here to Saturated-band direct-specimen landing (*She closed the till at eleven*), Cookie + Marge peer-register foundation held, frank_crack / frank_call_out / keep_tier_fork Tier A cross-canvas flag gates (frank_cracked + frank_keep_route)."

