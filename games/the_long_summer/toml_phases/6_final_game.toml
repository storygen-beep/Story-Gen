# WATCH SUB-NODE — R3's 4 corruption-band variants verbatim
[[canvases.nodes]]
id = "watch"
name = "Watching"
blocks = [
  { type = "paragraph", content = "The porch step was where watching Ryan work happened from. The step was the south step, the one the sun came around to at eleven and left by three. The belt sander or the grinder or the band saw — whichever it was, the sound of it came across the yard flat and constant. The sawdust smell came in on the afternoon breeze. Maya sat with her sketchbook open on her knees and did not always draw." },

  # CLOSED — corruption<25: catalogues-without-deciding register
  { type = "group", blocks = [
    { type = "paragraph", content = "She catalogued what he was doing the way she catalogued rooms — without deciding what the cataloguing was for. The belt sander ran. The wood dust haloed him in the afternoon light, the way wood dust haloed anyone who worked wood in sun. He had not looked over. She was not certain whether she was looking either, or whether what she was doing was a third thing she did not have a word for." }
  ], conditions = { version = "1.0", items = [
    { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 25 }
  ] } },

  # OPENING — 25<=corruption<50: lets-herself-watch register
  { type = "group", blocks = [
    { type = "paragraph", content = "She let herself watch him without pretending the sketchbook was what she was doing. The belt sander ran. The wood dust haloed him. He looked over once, the way he looked over when he checked on a thing — the half second of looking, the half second of checking, the half second of deciding it was fine. Neither of them stopped. The sketchbook had two marks she had put on the page an hour ago." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 25 },
    { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 50 }
  ] } },

  # OPERATING — 50<=corruption<75: watching-on-purpose register
  { type = "group", blocks = [
    { type = "paragraph", content = "She watched him. The watching was on purpose. The porch step at eleven-thirty meant he had seen her there and kept working — the count of acknowledgment he paid her when she sat where she sat. The sketchbook was the cover. The watching was the scene. She drew the line she had been drawing for a week: the angle of his shoulder at the sander, which she had learned three versions of." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 50 },
    { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 75 }
  ] } },

  # SATURATED — corruption>=75: inhabited-routine register
  { type = "group", blocks = [
    { type = "paragraph", content = "Her porch step. Her eleven-thirty. The belt sander running was the belt sander running. Ryan working was Ryan working. The sketchbook was the sketchbook. She did not draw today. She looked. The thirty minutes ended when the thirty minutes ended, and she stood up and went inside, and that was the routine she had the routine of." }
  ], conditions = { version = "1.0", items = [
    { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 75 }
  ] } },
]
