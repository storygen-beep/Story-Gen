[[canvases.nodes]]
id = "base"
name = "Breakfast"
blocks = [
  { type = "image", props = { file = "story/frank_restrict/breakfast_table.jpg", description = "A farmhouse kitchen at six-forty-five on a Friday morning — butcher-block counter at the left, cast-iron on the stove at the back with bacon in it and a woman in her late forties standing at it with a spatula unmoving, five chairs at a four-person table with a man in his fifties in a work shirt at the head with the newspaper folded closed-side-up beside his coffee mug, a young woman in her teens sitting across with her own coffee in her hands, morning light through the window above the sink.", search_queries = ["southern farmhouse kitchen breakfast table morning light folded newspaper coffee mug five chairs", "stepfather at breakfast with paper folded down stepdaughter across the table tense silence", "mother at stove with spatula bacon cast iron morning coffee serious conversation kitchen"] } },
  { type = "paragraph", content = "The morning after had come two days after the night of the living room. The kitchen at the breakfast hour was the kitchen the house had in it on a weekday morning before Frank went out to the truck — bacon on the cast-iron at the stove, coffee at its sixth cup in the Bunn, the window above the sink open two inches to the yard, the cicadas in the pines outside already going. Frank was at the head of the table in the work shirt he had already tucked into his belt. The paper was folded on the table beside his coffee. The paper was folded closed-side-up. He had not opened it." },
  { type = "paragraph", content = "She sat down at the plate Diana had set for her across from him. She did not look at him. Diana did not turn. Diana had the spatula at the bacon, and the spatula was not moving, and Diana was a person who when she was cooking moved the spatula." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He let the name land. His hand was flat on the table next to the coffee mug. He did not lift the mug. The Frank-pause was longer this morning than it had been on the porch four weeks ago. The fridge hum carried it. Diana's spatula stayed at the bacon in the pan." },
  { type = "dialog", content = "Common areas are locked after midnight.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He did not pause for her to answer. He was not asking." },
  { type = "dialog", content = "There will be an extra chore each week. I will assign it on Sunday.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "The grammar was Phase-B grammar. *There will be.* The dropped contraction. The future-passive. The ownership at the I-will-assign-it without the I-will reduced to the I'll. The kind of grammar he used when the explanation was going to have to cover a reason he was not going to name." },
  { type = "dialog", content = "We will talk about shared spaces.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "Shared spaces. That was the phrase. That was the phrase he had picked to point at the Tuesday in the living room without pointing at it. She had been in the shared space. He had been in the doorway. The verb between them had been a verb he was not going to say now, the way he had not said a verb between her name and the object on the porch the night of the porch light. The grammar held. The grammar was how he was able to stay in the room." },
  { type = "paragraph", content = "Diana's spatula had not moved. Diana had not turned. Diana was listening with her back because Diana's back was the part of her that was allowed to be in the room while a man in the house said a sentence like this one. The diana-hearing had banked a count she would not use this year." },
  { type = "paragraph", content = "Maya put her hands on the coffee mug. The mug was hot. She did not drink. She had three sentences at the back of her teeth. The compliance sentence. The eye-held sentence. The sentence that would set the line he would call her out on in a room he had not yet walked into. She knew which one was the Maya who had lived in the Tuesday of the living room. She knew which one was the Maya who was going to live in the Friday that came after." },
]
exit_block = { type = "choices", choices = [
  { text = "\"Fine.\"", targetType = "trigger", time_progression_minutes = 15, flagEffects = [ { targetType = "player", flag = "frank_restrict_declared" }, { targetType = "player", flag = "frank_tease_under_compliance_open" }, { targetType = "player", flag = "frank_q2_done" } ] },
  { text = "\"Okay.\" She holds his eye.", targetType = "trigger", time_progression_minutes = 15, effects = [ { targetType = "player", trait = "calculation", op = "add", value = 1 } ], flagEffects = [ { targetType = "player", flag = "frank_restrict_declared" }, { targetType = "player", flag = "frank_tease_under_compliance_open" }, { targetType = "player", flag = "frank_q2_done" } ] },
  { text = "\"Whatever you need, Frank.\"", targetType = "trigger", time_progression_minutes = 15, effects = [ { targetType = "player", trait = "calculation", op = "add", value = 2 } ], flagEffects = [ { targetType = "player", flag = "frank_restrict_declared" }, { targetType = "player", flag = "frank_tease_under_compliance_open" }, { targetType = "player", flag = "frank_q2_done" } ] },
] }


