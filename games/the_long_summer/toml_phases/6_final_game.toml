[[canvases.nodes]]
id = "base"
name = "The Correction"
blocks = [
  { type = "image", props = { file = "story/frank_phase_a_test/porch_rocker_dusk.jpg", description = "A front porch of a rural Southern contractor-built home at eight-thirty on a Sunday in early July — dusk still holding on the rosemary at the railing and the white of the far fence and the grass at the edge of the gravel, a fifty-year-old man in work clothes seated in a porch rocker with a folded newspaper on his knee and a lowball glass of Jim Beam on the boards at the edge where the rocker does not reach, a young woman sitting on the porch swing a few feet to his left with a dish towel on her shoulder, the porch light above them switched to off and the cicadas loud in the pines.", search_queries = ["southern farmhouse front porch rocking chair dusk man with newspaper whiskey glass boards", "young woman on porch swing summer evening cicadas rural southern home", "front porch Sunday evening screen door rocker paper Jim Beam lowball glass cicadas pines"] } },
  { type = "paragraph", content = "She had come out onto the porch with the dish towel still on her shoulder because she had thought she was going to say she was going upstairs. The hour the light had gone out of the sky without turning the yard black yet — dusk held on the rosemary at the railing and on the white of the far fence and on the grass at the edge of the gravel — and the cicadas had started up in the pines a count ago, and Frank was in the rocker with the paper folded on his knee and a lowball of Jim Beam at the edge of the boards where the rocker did not reach." },
  { type = "paragraph", content = "She sat down on the porch swing. The chains took the weight in the creak they always took it in. He did not turn. He did not lift the paper. The whiskey was at the halfway mark in the glass — he had poured it thirty minutes ago, the way she had learned he poured on Sunday evenings, a finger past where Diana poured for him at dinner — and it had not gone down since she came out." },
  { type = "paragraph", content = "His jaw worked once. She had learned by now that the Frank-jaw-before-a-sentence was the first half of the sentence. The second half was the sentence itself. The sentence tonight was coming from the rocker, and it was going to land in the porch air between them, and it was not going to be long." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He let the name land. He did not look at her. He let the cicadas have the count he needed and the count a second longer than that — the Frank-pause she had started to be able to read at the dinner table over the last two weeks. The pause was the part that was about him deciding whether to say the sentence the way he had decided to say it. The whiskey stayed at the halfway mark. His hand stayed flat on the folded paper on his knee." },
  { type = "dialog", content = "The porch light.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He did not turn after he said it. He did not drink. He did not unfold the paper. The correction was done. The porch was what it had been before the sentence, minus the shape the sentence had made in the air between the rocker and the swing." },
  { type = "paragraph", content = "That was the whole correction. Two sentences. The first was her name; the second was the object. There was no verb between them. He had built the sentence to not need one — the grammar that was the discipline, the discipline that was the position he ran the house from — and she had been in the house long enough now to hear the absence of the verb as the loudest part of the sentence." },
  { type = "paragraph", content = "The light. She knew the switch in the kitchen — the low oak toggle he had put in the week she moved in, the click on the downstroke the kitchen outlets did not have. The porch light he'd asked her not to leave on past midnight had been on, last shift-night home. He had seen it the next morning. He had not said anything at breakfast. He had waited until tonight. *That was the agreement,* he was not saying, and she heard the not-saying." },
  { type = "paragraph", content = "Three sentences were in her mouth at different distances from her teeth. One was the sentence Diana would have said if Diana had been the one to leave the light on. One was the sentence the Maya who had moved here in April would have said. And one was the sentence that was already on its way out of her body before the first two had finished being thought." },
  { type = "paragraph", content = "The cicadas were loud between them. The rocker kept its cadence. She had a beat before the beat would begin to be longer than a beat. The answer she gave was going to be who she was to him in the morning." },
]
exit_block = { type = "choices", choices = [
  { text = "\"I forgot. Sorry, Frank.\"", targetType = "trigger", time_progression_minutes = 30, effects = [ { targetType = "npc", npcId = "npc_frank", trait = "trust", op = "add", value = 1 } ], flagEffects = [ { targetType = "player", flag = "frank_phase_a_test_1" }, { targetType = "player", flag = "frank_home_and_invited" } ] },
  { text = "\"I'll get it.\" She is already standing.", targetType = "trigger", time_progression_minutes = 30, effects = [ { targetType = "npc", npcId = "npc_frank", trait = "trust", op = "add", value = 3 } ], flagEffects = [ { targetType = "player", flag = "frank_phase_a_test_1" }, { targetType = "player", flag = "frank_home_and_invited" } ] },
  { text = "\"It was on a timer I didn't know about.\"", targetType = "trigger", time_progression_minutes = 30, effects = [ { targetType = "npc", npcId = "npc_frank", trait = "trust", op = "add", value = -1 } ], flagEffects = [ { targetType = "player", flag = "frank_phase_a_test_1" }, { targetType = "player", flag = "frank_home_and_invited" } ] },
] }


# ─── B15 — Marge hands the Thursday key. CH 2 CLOSE milestone. ───

[[canvases]]
id = "marge_thursday_key"
name = "The Thursday Key"
description = "Week 5 Thursday ~22:00. Marge: You're steady. Thursdays are slow. Key's under the till. Closes Ch 2 (first_ambient_tilt milestone). — Rewritten 2026-04-24 (Session 11) as single-node Option A prose expansion per content_rewrite/PRD.md. Opening-band Maya. Preserves trigger, single-exit location structure, all flag/effect values (npc_marge.trust +5 + first_ambient_tilt). Opens the Marge voice for the rewrite pipeline (no Marge canvas before this) + carries Cookie-style-sheet cameo (Cookie leaves first, diner-working register). Rule 17 exception for single-exit: Maya has no agency in this beat — she does not decline the key; the scene is the receiving of it, and the only choice-text is the walk-home framing. All body content is token-free; dialog blocks use npcId props. One italic span (cat d — *You're steady,* quoted in Maya's interior during the walk home)."

