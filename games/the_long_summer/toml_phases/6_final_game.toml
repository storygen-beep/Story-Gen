# ─── J3: Knock on Jake's door ──────────────────────────────────────────────

[[canvases]]
id = "activity_knock_jake"
name = "Knock on Jake's door"
description = "Hallway-threshold knock. Answer varies by tier. — Rewritten 2026-04-25 (Session 20, Tier E Jake-cluster batch #1 canvas 3 of 6). Single-node in-place expansion. 408 authored words — universal body (~70w threshold setup + four-inch-door-cracked anchor from J1) + 4 flag-axis variant groups rendering Jake's tier-specific response (DEFAULT pre-Noticed hostile-silence ~95w / NOTICED jake_noticed_open=true door-swings-another-inch ~70w / TEASE jake_tease_open=true Jake's-clipped-Yeah?-through-the-door ~70w / WITHDRAWN jake_keep_withdrawn=true hardened-silence ~85w) + 2 Maya-action-framed choice labels (~18w total) with corruption + tease + non-withdrawn gate on the intrusive option per book spec. Target was 400w (+8w = on target). **THE THRESHOLD CANVAS** — J1 established the four-inch-door-cracked diegetic geometry; J3 IS the threshold canvas where that geometry is architecturally-central. Cross-canvas pairing locked: J1 (inside the room) + J3 (outside the door) + (forward) J4 (just past the door) — Jake-cluster door-geometry trilogy. **Architecture: flag-axis variants per Jake's arc-state** (matches J1 architecture pattern: indoor/threshold canvases use flag-axis since Jake's behavior varies by arc-state). Four variants give full coverage of Jake's arc-state-space at this threshold: DEFAULT (no flags = hostile pre-Noticed); NOTICED (jake_noticed_open=true AND jake_tease_open=false AND jake_keep_withdrawn=false); TEASE (jake_tease_open=true AND jake_keep_withdrawn=false); WITHDRAWN (jake_keep_withdrawn=true). Clean 4-way mutual exclusion. **Jake-vocal-register-budget: TEASE variant lands Jake's first vocal deployment in Jake-cluster — but still clipped 1-word fragment 'Yeah?'.** Per jake.md Tease-tier specimen ('It's just — I read this thing about competent draftsmen...' vocabulary-long-sentence Tease register) the FULL Tease-vocabulary deployment is reserved for J4 jake_linger / J7 post_caught. J3 TEASE renders only the clipped-question through-the-door — the vocabulary-deployment requires open-door geometry that J3 doesn't provide. Beach-Crack/Caught-beat anti-dilution preserved at all four variants (Jake's vocabulary-arrival reserved). **Four-inch-door-cracked anchor from J1 surfaced architecturally** in universal body: *The door to Jake's room was four inches cracked, the way it always was at six in the evening, the way she had described it to herself once and then stopped describing because the description was the door's permanent state.* — direct cross-canvas to J1's universal body geometry; the four-inch-door is now established as Jake-cluster persistent diegetic detail Maya has stopped narrating because it's permanent. **Jake-rendered-via-aural-tells continuation** (extends J1 CONSEQUENCE window-unit-hum-only absence-register to active-listening-from-outside-the-door register): DEFAULT *the window-unit hum + a page turning in a slow count + the small sound of a body shifting position on a mattress*; NOTICED adds *the small sound of a chair shifting*; TEASE Jake's voice through the four-inch gap; WITHDRAWN inverts — *the window-unit hum she could place from outside the door — it was off this evening — not the page turning, not the chair-shift* triple-negative-inventory presence-becomes-absence. Window-unit-hum becomes a presence/absence cross-canvas register-anchor: J1 CONSEQUENCE has it (absence-register-from-outside); J3 DEFAULT/NOTICED/TEASE has it (presence-register); J3 WITHDRAWN removes it (deeper-absence than CONSEQUENCE — pretending-to-be-empty register). **Maya-counting-the-not-acknowledgings DEFAULT signature** (Closed-band cataloguing-without-naming applied to Jake-cluster): *and she had begun to count the not-acknowledgings the way a person counted things she did not want to count* — the counting-she-did-not-want-to-be-doing register-paradox. New Jake-cluster register-signature for hostile pre-Noticed phase. Forward-applicable to other Jake-cluster pre-Noticed canvases (none currently in queue but Tier F potential). **Maya-Opening-band cataloguing-the-inch NOTICED signature**: *The inch was the response. She catalogued the inch and the chair-shift and noted that the inch was new this week.* — Maya-quantifies-Jake's-acknowledgment-in-inches Opening-band register; the inch IS the response, naming-the-inch is naming-the-pattern. **Geometry-held TEASE register**: *She was at the threshold. He was inside. The geometry held.* — short-declarative landing the unchanged-geometry as the register-payload of Tease-tier (Jake-acknowledges-with-voice but-the-door-stays-closed). Cross-canvas to maya.md 'sits on edges before deciding to sit' — Maya at thresholds is canonical Maya-body-language. **Pretending-to-be-empty WITHDRAWN signature**: *the once had landed in a room that had decided to pretend it was empty* — the room-as-agent rather than Jake-as-agent (Jake has so withdrawn that the room itself performs the absence). Withdrawn-route deepest-absence register. **Choice gates fixed per book spec**: original 'Knock and walk in' choice gated only on jake_tease_open=true; book spec final_book.md:3247-3248 specifies *'Knock and walk in. (corruption mid-band) — Tease-scene fires.'* Rewrite gate adds corruption>=50 (Operating mid-band threshold) AND jake_keep_withdrawn=false (Withdrawn-route walk-in shouldn't fire since the relationship is sealed-off). Three-condition AND gate. **Choice labels enhanced** from 'Knock and wait.' / 'Knock and walk in.' (3w/4w generic) to 'Step back. Walk down the hall.' (8w Maya-action-framed default exit) / 'Push the door open. Walk in.' (6w Maya-action-framed intrusive). Two different Mayas (Rule 12 applied to binary): the-Maya-who-respects-the-closed-door / the-Maya-who-pushes-through. **Effects preserved** — both choices retain trigger destinationType + time-progression-minutes (10 / 5). No effects on either choice (per original — the actual scene-resolution happens elsewhere). 0 italic spans across 408w. Zero @npc_ tokens. Zero banned phrases. One Jake dialog block (TEASE variant: 'Yeah?' — 1-word clipped fragment, jake.md Tease-tier through-the-door variant; not the vocabulary-long-sentence reserved for J4/J7). Zero Maya dialog. **Effect-preservation note**: trigger gate is `arrived_at_franks=true` (low gate — fires from Day 1) which means DEFAULT variant fires from very early game; this is intentional per book spec hostile-baseline ('no answer at hostile')."

