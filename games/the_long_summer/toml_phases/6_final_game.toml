[[narrative_gates]]
id = "gate_church_interior"
gated_location_id = "loc_church_interior"
gated_canvas_id = ""
gate_condition = { type = "flag", flag_key = "phase_2_church_interior_unlocked" }
justification_type = "sign"
justification_summary = "Maya attends the front of the church (parking lot, lawn, front steps) for rep_church gains without entering. Interior entry requires a sustained attendance pattern that doesn't land in Phase 1's runtime."
