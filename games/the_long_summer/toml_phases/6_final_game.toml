  { type = "group", blocks = [
    { type = "paragraph", content = "The windows down. The radio tuned to the station his father had listened to, per Ryan explaining this one time ten minutes into the first drive, which was the longest sentence she had heard him speak. He drove the way he worked — steady, without announcement, without commentary on the route. She watched the county go by at forty-five. The county had more barns than she had realized. The water tower at Bushnell had the year painted in red that had been painted over in white and then painted again. She catalogued it. She did not ask about the station." }
