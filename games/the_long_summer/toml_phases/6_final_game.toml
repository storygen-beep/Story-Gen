[[canvases.nodes]]
id = "base"
name = "The Table"
blocks = [
  { type = "image", props = { file = "activities/family_dinner.jpg", description = "Daily 18:30-19:30 family dinner at Frank's house — interior view of the farmhouse kitchen table from a corner angle. Five chairs at a table built for four — a fifth chair carried in from the back porch the night Maya arrived. Diana at the head end nearest the stove, serving plate in front of her with a serving spoon already in the okra. Frank across from Diana, paper folded at his elbow. Ryan on the window side, Jake across from Ryan. Maya in the chair between the axes. Warm overhead lamp, late-evening Southern summer light slanting through the window above the sink. Cornbread in a cast-iron skillet, an iron pan on the trivet. Salt and pepper a hand's distance from Frank's plate. Domestic, ordinary, slightly tight in the seating geometry.", search_queries = ["farmhouse kitchen family dinner table five chairs Southern summer evening warm lamp", "rural Southern home kitchen weeknight dinner serving plate cornbread cast iron skillet stepfamily", "small Southern kitchen table father mother three sons stepdaughter weeknight evening late light"] } },

  { type = "paragraph", content = "Five chairs at the four-person table. Diana had carried the fifth in from the back porch the night Maya arrived and the fifth had not gone back since. Diana at the end, the chair closest to the stove and the silverware drawer. Frank across. Ryan on the window side. Jake across from Ryan. Maya between the axes. The serving spoon in the okra before anyone sat down. The salt and pepper a hand's distance from Frank's plate, the angle Diana set every meal." },

  # Rotating openings — daily-typology block_pool (Rule 19 anti-staleness)
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Plates passed counter-clockwise the way Diana started them. Diana told the okra story the version with the weather detail — the August three years ago, the okra came up twice, forty-eight jars in one weekend. Frank nodded at the parts where Diana paused. Ryan reached for the salt and didn't say anything." },
    { type = "paragraph", content = "Pot roast Wednesday. The folded newspaper on the counter where Frank had set it down at the end of the news hour. Diana cut hers into smaller pieces. Frank ate at the cadence he ate at every meal — even bites, no rushing, no slowing. Jake had done his half-portion already." },
    { type = "paragraph", content = "Friday chicken-fried. Ryan came in past the start of the meal — the truck door at five-after, the kitchen door at six-after, Diana's plate already covered with the dish towel for him. He sat without looking at anyone, drank half his glass of water. Frank had not said anything about him being late and Ryan had not said anything about being late." },
    { type = "paragraph", content = "Sunday-leftover dinner. Diana had stretched the Saturday outdoor: corn off the cob, the last of the potato salad, pulled pork warmed in the oven so it didn't look like leftovers. The Sunday dinner was quieter on purpose — the rest day before the week started. Frank ate slow." },
  ] },

  # AWARENESS_LOW (<25) — Closed-band Maya / Diana doesn't look up by routine
  { type = "group", blocks = [
    { type = "paragraph", content = "Diana did not look up from her plate when Maya took the last seat. The not-looking-up was the kitchen running at the kitchen's pace; six-thirty was the part of the day where the food was the work. Diana's eye stayed on her cornbread. She passed the okra to Ryan without watching her own hand. The plate had been set already; Maya had not had to ask." }
  ], conditions = { version = "1.0", items = [
    { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "lt", value = 25 }
  ] } },

  # AWARENESS_MID_LOW (25-49) — Opening-band Maya / Diana looks up, smiles, doesn't ask
  { type = "group", blocks = [
    { type = "paragraph", content = "Diana looked up when Maya sat. She held the eye one count and smiled — the smile she had given Maya since the second week, the one that did not require an answer." },
    { type = "dialog", content = "Plate's hot. There's extra if you want it.", props = { speaker = "npc", npcId = "npc_diana" } },
    { type = "paragraph", content = "Maya took the smile. She did not look back to check whether Diana was still looking. The not-checking was a thing she had started doing with herself in the bathroom mirror and was now doing here too." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "gte", value = 25 },
    { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "lt", value = 50 }
  ] } },

  # AWARENESS_MID_HIGH (50-74) — Operating-band Maya / Diana looks up, doesn't smile
  { type = "group", blocks = [
    { type = "paragraph", content = "Diana looked up when Maya sat. She did not smile. The look held one count past polite — long enough to be the look she meant, short enough that Maya could pretend it had been an accident if she needed to." },
    { type = "dialog", content = "Plate's there if you want it.", props = { speaker = "npc", npcId = "npc_diana" } },
    { type = "paragraph", content = "The *if you want it* had a small hard edge on it now. The same words she had said in the second week, the edge added since." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "gte", value = 50 },
    { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "lt", value = 75 }
  ] } },

  # AWARENESS_HIGH (75-100) — Saturated-band Maya / Diana doesn't look up at all, kitchen quieter
  { type = "group", blocks = [
    { type = "paragraph", content = "Diana did not look up. The kitchen was quieter. The serving spoon moved the same way and the plates passed counter-clockwise the same way and the cornbread was on the table at the same temperature it was always at, but the kitchen was quieter. Frank ate. Ryan ate. Jake ate. Diana served. Maya took the chair. The plate was there. The not-saying-anything was the kitchen now." }
  ], conditions = { version = "1.0", items = [
    { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "gte", value = 75 }
  ] } },

  # CONSEQUENCE — one_crack_this_chapter (additive overlay)
  { type = "group", blocks = [
    { type = "paragraph", content = "The brother whose week had cracked did not meet Maya's eye. He ate at small bites, deliberate, the kind of careful he was using to keep the rest of his face from telling on him. Diana read the table better than anyone in the room. She did not say so." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "one_crack_this_chapter", operator = "is_true" }
  ] } },

  # CONSEQUENCE — brothers_discover (additive overlay, post-Saturday outdoor)
  { type = "group", blocks = [
    { type = "paragraph", content = "Ryan and Jake did not look at each other. They had not looked at each other across a table since the Saturday. Frank ate without speaking. The forks on plates were the loudest thing for a stretch of minutes. Diana refilled the okra dish she had emptied once already, refilled the cornbread basket no one had touched. The keep-it-moving was the hand she still had to play." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "brothers_discover", operator = "is_true" }
  ] } },
]
