[[canvases.nodes]]
id = "base"
name = "The Key"
blocks = [
  { type = "image", props = { file = "story/marge_thursday_key/office_count_out.jpg", description = "A small cluttered back office in a diner at closing time — gray metal desk pushed against the wall, a gooseneck lamp pulled over an open ledger, a plastic cash drawer on the corner of the desk, a calendar two months behind on the wall, the door open to a dim kitchen pass behind.", search_queries = ["diner back office at night closing cash drawer open ledger gooseneck lamp gray metal desk", "small town diner owner paperwork pantry-sized office calendar wall cramped", "southern roadside diner office midnight ledger till count apron on hook"] } },
  { type = "paragraph", content = "She brought the drawer back through the swinging door at the kitchen end of the pass at nine-fifty-one, which was the time the digital over the microwave had been showing when she turned the corner, and the time she had taken to mean nine-fifty-plus-slippage for most of the month. The drawer was the cash drawer — the plastic one with the slotted inserts for singles, fives, tens, twenties, and the fold-under slot where the checks lived — and she carried it two-handed, the way she had learned to carry it on her second Thursday after she had almost dropped it on her first." },
  { type = "paragraph", content = "Marge's office was a room about the size of a pantry. A gray metal desk pushed against the back wall, a filing cabinet with the second drawer that stuck, a wall calendar two months behind, a phone with a coiled cord that hung to the floor because the coil had given up some years ago. The gooseneck on the desk was on. Marge was under it, ledger open, pencil loose in her hand, not writing — reading the previous page the way she read the previous page every Thursday before she signed off on the current one. It smelled of old paper and cold coffee and the one cigarette Marge had on the back step at eight forty-five, carried in on her apron. Maya set the drawer down on the corner of the desk, on the felt pad where the drawer lived." },
  { type = "dialog", content = "Count it.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "She counted it. The twenties first, by habit now — Cookie had told her on her second week that twenties first meant the mistakes showed up early and you had the rest of the count to find them — then the tens, the fives, the singles. The coin was already rolled; Cookie rolled the coin. The checks were three tonight, paper-clipped at the top because that was Marge's system and Marge did not have another one. Two hundred and fourteen dollars and sixty-two cents. She slid the drawer across. Marge ran her eye down it once, did not count again, and wrote the number in the ledger in the hand she kept for the ledger — block numerals, pencil, no comma." },
  { type = "paragraph", content = "The bell went off over the front door. Cookie came down the hall a second later with her denim jacket on over the t-shirt and her hair down for the first time of the evening, the high ponytail set loose at the office door. She stopped in the doorway with one hand on the jamb." },
  { type = "dialog", content = "I'm out. Fryer's down to one again, so Friday's gonna be a time. Maya — walk careful.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "dialog", content = "Yeah.", props = { speaker = "player" } },
  { type = "dialog", content = "Marge. Night.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "dialog", content = "Night.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "Cookie went. The front door bell went once more. The diner at nine-fifty-nine on a Thursday was the room it had been every Thursday since the hire — the lights on half, the grill ticking past the last heat, the line wiped, the back booths dark — except that tonight Maya had let herself register the fact that she was the one still in it." },
  { type = "paragraph", content = "Marge set the pencil down on the ledger. She did not close the ledger. She looked at Maya across the desk — the looking-without-making-eye-contact that was her version of attention, which Maya had figured out on her third shift and had stopped reading as indifference by her fifth." },
  { type = "dialog", content = "You're steady.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "Maya did not answer right away. She had been in the office for a count of — she did the arithmetic later, walking home, and made it three — three seconds, before Marge said the next part." },
  { type = "dialog", content = "Thursdays are slow. Key's under the till.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "She said it at exactly the volume and the clip of the first sentence. As if the two were one sentence that had a pause inside it that meant something to Marge." },
  { type = "dialog", content = "Lock the back when you leave. You good?", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "dialog", content = "Yeah. I'm good.", props = { speaker = "player" } },
  { type = "paragraph", content = "Marge nodded once. She went back to the ledger. She picked the pencil up again." },
  { type = "paragraph", content = "The till was on the shelf above the desk where the till lived at night, drawer out and the till itself a plastic hollow that was not supposed to have anything in it. Maya lifted the box. The back-door key was underneath — small, brass, attached to nothing, the way Marge's one-key-per-door system ran. It had been sitting under the box, Maya realized, since Marge had put the till up for the count. It was room-temperature. She put it in the small front pocket of her jeans — not the apron pocket, because the apron was coming off in thirty seconds — and she felt the shape of the key settle into the seam at the bottom of the pocket against her thigh." },
  { type = "paragraph", content = "She took the apron off. She hung it on the hook by the office door." },
  { type = "dialog", content = "Night, Marge.", props = { speaker = "player" } },
  { type = "dialog", content = "Apron on the hook. You're good. Go.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "She went out through the kitchen, through the back hall, and out the back door. She closed the door behind her. The key turned in the lock on the second try. It clicked. She pulled the knob. Locked." },
  { type = "image", props = { file = "story/marge_thursday_key/walk_home_route9.jpg", description = "A dark rural two-lane at night — pine trees close at the shoulder, gravel where the paving ends, a single sodium-yellow streetlight in the middle distance at a crossroads, a young woman walking the shoulder alone with her hands in her jeans pockets.", search_queries = ["rural two-lane road at night southern pine trees gravel shoulder sodium streetlight alone walking home", "state route back road midnight woman walking alone small town cicadas dark pine", "empty southern county road night warm humid single streetlight walker denim"] } },
  { type = "paragraph", content = "The diner lot ran up against the gravel at the side of State Route 9, where the shoulder narrowed from paved to gravel for three hundred yards at the edge of town before the paving picked up again past the old post office. She took the shoulder. She had taken the shoulder four Thursdays in a row now, and the walk was a walk she was beginning to know the way she had known the route to her high school — by its small distinguishings. The mailbox at the Deavers' with the flag still up. The cut-grass smell from the Hansens' that had been on them since Tuesday, when Mr. Hansen had been on the mower at six a.m. The single sodium-yellow light at the crossroads where Route 9 met the county road that ran out to Frank's. The cicadas on the last weeks of a long summer count, even with the season turning." },
  { type = "paragraph", content = "*You're steady,* Marge had said. Maya heard it in her head at the clip Marge had said it — the two words at the even cadence, no lift under them, no warmth added and no warmth taken out. The compliment had landed at exactly the weight it had cost Marge to give. Maya had been running the arithmetic of Marge's costs for a month now. She let herself register the fact that she was running it." },
  { type = "paragraph", content = "She did not take the key out of the pocket. She walked with her hand in the pocket for the middle quarter-mile and then with her hand out. She passed the Hansens'. She passed the sodium light. She turned off Route 9 onto the county road where the dark got a degree darker because the lights were farther apart and the pines started. At the top of the drive she saw the porch light Frank had left on." },
  { type = "paragraph", content = "She had not decided yet what she was going to do with the Thursday. That would be a decision for the next Thursday. Tonight was the walking-home-with-it." },
]
exit_block = { type = "location", text = "Walk the hour home. The key in her pocket.", config = { destinationType = "specific", locationId = "loc_front_porch", time_progression_minutes = 60, effects = [ { targetType = "npc", npcId = "npc_marge", trait = "trust", op = "add", value = 5 } ], flagEffects = [ { targetType = "player", flag = "first_ambient_tilt" } ] } }


