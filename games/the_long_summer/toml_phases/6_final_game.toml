r; Maya's own door inherits the geometry but the geometry is not the same geometry. Forward-applicable as Tier F architectural cross-canvas pattern (Maya-solo canvases reference NPC-cluster anchors via differentiation — *what's similar but not the thing*). **Effects preserved exactly**: energy set to 100, 480 min, max_triggers_per_day=1. Trigger preserved (arrived_at_franks=true low gate, fires every night from Day 1). **Exit label enhanced** from 1w 'Sleep.' to 4w 'Lights off. Sleep takes.' — Maya-action + diegetic + tight-Tier-F-density. 0 italic spans across 230w. Zero @npc_ tokens. Zero banned phrases. Zero NPC dialog (Maya-solo canvas, NPCs rendered via aural-tells + Keep-route environmental-detail only). Zero Maya dialog (Maya-FID-narration register)."

