# DISTANCE SUB-NODE — T0's Closed-band beat (Caterpillar-cap setup) + 3 Closed-band fork choices verbatim
[[canvases.nodes]]
id = "distance"
name = "Distance"
blocks = [
  { type = "paragraph", content = "The carafe in her right hand was the second Cookie had brewed since five. Three swings from carafe to cup meant the cup was half — the count Cookie had taught her without saying so on her second night, and in the weeks since she had not found a reason to count differently. The second-cup men at the counter were the men who stayed past seven: the crossword trucker, the retired farmer, the man in the Caterpillar cap who had been at the end of the counter some number of Wednesdays, not all, a number she had not started counting yet. She had registered their hands." },
  { type = "paragraph", content = "Some time after eight-thirty the man in the Caterpillar cap lifted his cup and did not hold it out to be refilled. She came around with the carafe. She stopped at his right elbow. He looked up. The look was a beat longer than the look of a man being refilled by a waitress and half a beat shorter than the look she had counted on the Wednesday of Week 1 — a look she had not counted again and did not yet, she understood, know what to do with." },
]
exit_block = { type = "choices", choices = [
  { text = "Hold the eye a beat. Then back to the pot.", targetType = "trigger", time_progression_minutes = 300, effects = [
    { targetType = "player", trait = "money", op = "add", value = 50 },
    { targetType = "player", trait = "rep_road", op = "add", value = 2 },
    { targetType = "player", trait = "corruption", op = "add", value = 1 },
  ] },
  { text = "Eyes on the carafe. Thank-you and walk.", targetType = "trigger", time_progression_minutes = 300, effects = [
    { targetType = "player", trait = "money", op = "add", value = 43 },
    { targetType = "player", trait = "rep_road", op = "add", value = 1 },
    { targetType = "player", trait = "calculation", op = "add", value = 1 },
  ] },
  { text = "Smile. Turn back to the pass.", targetType = "trigger", time_progression_minutes = 300, effects = [
    { targetType = "player", trait = "money", op = "add", value = 45 },
    { targetType = "player", trait = "rep_road", op = "add", value = 2 },
