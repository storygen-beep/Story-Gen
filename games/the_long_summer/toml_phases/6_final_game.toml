[[canvases.nodes]]
id = "base"
name = "Porch"
blocks = [
  { type = "image", props = { file = "activities/porch_frank.jpg", description = "Front porch at 21:00-22:30. Two wooden rocking chairs facing the yard. Small table between them with an old ashtray (Frank stopped smoking in '83) and a bottle of whiskey with two short glasses. Porch light on above — the light Frank keeps off after midnight. Screen door to the house behind them. Yard dark past the reach of the porch, cicadas in the summer night.", search_queries = ["Southern front porch night whiskey glass older man rocking chair summer cicadas dim amber light", "rural American porch wooden rocking chairs ashtray bottle evening Southern farmhouse", "1980s-style country porch screen door summer night stepfather drink stepdaughter"] } },

  { type = "paragraph", content = "The front porch at nine in the evening had two rocking chairs and a small table between them with Frank's ashtray from before he stopped smoking in eighty-three and the bottle of whiskey he kept out there in the summer because Diana did not keep liquor in the kitchen. The porch light was the light Frank kept off after midnight. The screen door was the sound of the house. The yard was dark past the reach of the porch. Cicadas." },

  { type = "block_pool", blocks = [
    # Rotation 1 — silence: Phase A ambient
    { type = "paragraph", content = "Whiskey and silence. He had poured two fingers into his own glass and a finger into hers because she had not finished the glass he had poured the last time. The cicadas were negotiating something at the end of the yard. He rocked at a slow count. She rocked at a count close to his but not the same. He said nothing. He was not going to. The silence was the sentence." },

    # Rotation 2 — question: Phase A SAFE-quadrant asks-the-weather register
    { type = "group", blocks = [
      { type = "paragraph", content = "Whiskey and a question he asked about her day without looking at her." },
      { type = "dialog", content = "How's Marge treating you?", props = { speaker = "npc", npcId = "npc_frank" } },
      { type = "paragraph", content = "He asked the way he asked the weather. He did not turn his head. The ice in his glass had gotten to the top. He poured the whiskey fresh over it. She told him about the Wednesday the Caterpillar-cap man had tipped her fifteen on a six-dollar check, and he nodded the nod he nodded when the Ford had held air six weeks longer than it had any right to." }
    ] },

    # Rotation 3 — Diana-on-phone-behind: Diana-fills-silences cross-canvas
    { type = "paragraph", content = "Whiskey and Diana on the phone in the kitchen behind them, the screen door holding the sound in the way the screen door held any sound not loud enough to come through it. Diana was talking to her sister in Georgia — the cousin she would not stop apologizing for, the boy the cousin had married, the new roof on the house they should not have bought. Frank listened without listening. She listened without listening. The porch was the porch." },

    # Rotation 4 — light-off-early: screen-door close + Goodnight-Maya dialog
