[[canvases.nodes]]
id = "kitchen"
name = "The Route"
blocks = [
  { type = "image", props = { file = "story/town_walk_day_two/kitchen_diana_route.jpg", description = "A Southern farmhouse kitchen Monday morning around nine. A mother in her late forties standing at the counter with a kitchen towel in her hand, having just wiped a spot that did not need wiping; her stepdaughter at the kitchen table behind her with a chipped Hayes Hardware mug in front of her on a worn oak table. Window over the sink cracked an inch, basil on the sill, percolator off but warm. The young woman is in jeans and a t-shirt with clean white sneakers on the floor by her chair, ready to leave.", search_queries = ["southern farmhouse kitchen monday morning mother at counter towel daughter at table coffee mug percolator window basil", "rural alabama kitchen mid morning older woman wiping counter young woman seated chipped mug oak table", "southern kitchen interior morning light percolator stove towel counter daughter going to town clean white sneakers"] } },
  { type = "paragraph", content = "Monday morning. The clock on the stove said nine-eighteen. Maya was at the kitchen table with the second mug of coffee Diana had poured for her without asking. Diana was at the counter with the kitchen towel in her right hand, wiping a spot she had wiped a count ago that did not need wiping a second time. Maya had been learning, since the Sunday she had come down the fourteen stairs in yesterday's clothes, that the wiping-of-the-spot-that-did-not-need-wiping was the thing Diana did when the thing Diana was waiting on was a person and not a pan." },
  { type = "paragraph", content = "Diana set the towel on the counter the way she set the towel on the counter when she had decided to say the thing she had been working out how to say. She turned. She did not look at Maya straight on; the looking-straight-on was reserved for things that had to be looked at straight on, and the route into town was not one of them." },
  { type = "dialog", content = "Maya. Seven-tenths of a mile of gravel past the Hansens' and the Deavers'. Then the pavement past the old post office. Three blocks of Main Street.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "dialog", content = "An hour at pace.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Naming the count was the kind of naming Diana did when she was telling Maya a thing without telling her a thing — which was that the thing had been taken seriously enough to count. The Hansens' and the Deavers' and the post office were on Diana's count by name because Diana had walked the road herself, with Maya's father, the spring after the wedding had been the first wedding, before Diana had been a woman with two husbands and a girl who had come down the fourteen stairs in yesterday's clothes a Sunday ago." },
  { type = "dialog", content = "Frank can drop you.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "It was an offer at the volume of an offer that did not need to be accepted. Diana had said it the way Diana said the things she had decided would be Maya's call." },
  { type = "dialog", content = "No, thank you.", props = { speaker = "player" } },
  { type = "paragraph", content = "Maya said it without looking up from the mug. The mug was the chipped Hayes Hardware mug she had drunk the Sunday-morning coffee out of, and which had been at her place on the table every morning since. Diana picked the towel up off the counter and turned back to the counter. The wipe she had not finished was the wipe she finished now. The finishing was the closing of the saying." },
]
exit_block = { type = "choices", choices = [ { text = "Pick up the sneakers. Out the side door.", targetType = "node", nodeId = "town_walk_day_two.walk", time_progression_minutes = 15 } ] }

[[canvases.nodes]]
id = "walk"
name = "The Road"
blocks = [
  { type = "image", props = { file = "story/town_walk_day_two/county_road_walk.jpg", description = "A young woman in clean white sneakers walking alone along a narrow rural county road — gravel shoulder, pine trees close at the edge, red clay dust, a pickup truck in the opposite lane slowing as it passes, early-summer Southern morning light.", search_queries = ["young woman walking rural county road alone gravel shoulder southern pine red clay summer morning", "southern backroad walk alone pickup truck slowing opposite lane rural alabama pines", "woman on two-lane rural road white sneakers sun cicadas walk to town first time"] } },
  { type = "paragraph", content = "She left at nine-thirty in the clean white sneakers she had not yet broken in. The road ran the way Diana had said it would — seven-tenths of a mile of gravel past the Hansens' and the Deavers', then the pavement at the old post office, then Main Street. The count had been a count Diana had given her in a tone Maya was going to learn was the tone of a thing Diana had walked herself before she had said it." },
  { type = "paragraph", content = "The gravel was red. Redder than the red she had remembered from the drive-through last August, the way the whole landscape had been redder than the landscape in her head. The pines started a quarter-mile off the drive and held for the next half-mile. It was already eighty-two degrees in the shade. The cicadas were on their morning count, which was louder than their noon count, which was a thing she did not yet know to expect." },
  { type = "paragraph", content = "Half a mile along, a pickup truck came up behind her in the opposite lane, slowed enough to read as slowing, and the driver — older, sixty maybe, brown ball cap, sleeve rolled — lifted one finger off the steering wheel in a flat, incurious hello. She nodded back without meaning to. Then she thought about the nodding. Then the truck was past her and gone in the dust off the gravel." },
  { type = "paragraph", content = "The pavement came up at the old post office, which was a cinderblock building with a padlock on the front door and Kentucky plates on a dead Ford in the side lot. The sidewalk came up after the post office. The three blocks of Main Street appeared past the white clapboard church on the corner." },
]
exit_block = { type = "choices", choices = [ { text = "Walk up Main Street. Three blocks.", targetType = "node", nodeId = "town_walk_day_two.diner", time_progression_minutes = 60 } ] }

[[canvases.nodes]]
id = "diner"
name = "The Diner"
blocks = [
  { type = "image", props = { file = "story/town_walk_day_two/diner_interior_counter.jpg", description = "A small-town Southern diner interior at late morning — six booths along the window, a long counter with stools, two older men in ball caps at the counter drinking coffee, an older woman with short iron-grey hair behind the counter wiping with a rag, a neon DINER sign in cursive red visible through the plate glass unlit because of the sun on it.", search_queries = ["small town southern diner interior counter booths window two men on stools coffee older waitress iron grey hair apron", "rural alabama diner neon sign cursive diner on main street brick buildings morning counter older woman apron", "long low diner plate glass booths formica counter pine-sol coffee smell iron-haired owner rag"] } },
  { type = "paragraph", content = "Main Street was three blocks of brick: a Rite Aid on the first block, a hardware store and a lawyer's office on the second, the diner and a barbershop and an insurance agent on the third. The diner anchored the middle of the third block — a long low building with plate glass and a neon sign that read DINER in cursive red, unlit at ten-fifty in the morning because the sun was already full on it. A bell hung over the door. She went in." },
  { type = "paragraph", content = "It smelled like bacon and coffee and Pine-Sol. Six booths along the window, a counter with six stools, a pass at the back to the kitchen. Two men at the counter with coffees. A family in a booth by the door. Behind the counter a woman in her fifties with iron-grey hair cut short and an apron tied tight — she was wiping the counter with a rag, and she did not look up until Maya was two steps inside." },
  { type = "paragraph", content = "The woman looked up. She did not stop what she was doing." },
  { type = "dialog", content = "Help you?", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "dialog", content = "Are you hiring.", props = { speaker = "player" } },
  { type = "paragraph", content = "The woman finished the wipe. She set the rag down. She looked at Maya for a count Maya did not count but could feel the length of — a count long enough that one of the men at the counter put his coffee down and did not pick it back up for the duration. The woman's look was appraising without softness; it was pricing without preface; it was an experienced look in a tired face." },
  { type = "dialog", content = "Come back tomorrow. Five p.m. Can you stay till ten?", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "dialog", content = "Yes.", props = { speaker = "player" } },
  { type = "dialog", content = "See you then.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "The woman went back to the wipe." },
  { type = "paragraph", content = "Maya went out. The bell sounded again. She stood on the sidewalk a second in the sun, and then she turned and walked back the way she had come." },
]
exit_block = { type = "location", text = "Walk the hour home. Five o'clock tomorrow.", config = { destinationType = "specific", locationId = "loc_front_porch", time_progression_minutes = 120, effects = [ { targetType = "player", trait = "energy", op = "add", value = -15 } ], flagEffects = [ { targetType = "player", flag = "diner_found" }, { targetType = "player", flag = "interview_scheduled" } ] } }


# ─── B6 — Marge interview and hire. ───

[[canvases]]
id = "marge_interview"
name = "Apron"
description = "Tuesday Week 1 17:00. Tie it. Learn as you go. The hire. — Rewritten 2026-04-24 (Session 13) as single-node Option A prose expansion per content_rewrite/PRD.md Tier C spec. Closed-band Maya. First Cookie voice of the rewrite pipeline (pre-vouch register per Cookie style sheet — friendly-but-watching, tests her on the line). Marge style-sheet signature lines landed exact: *'Tie it. Learn as you go.'* + *'Cookie's back here. Do what she says.'* + *'Tomorrow. Five to ten. Nine an hour. Tips are yours. You cash out with me at close. You walk if you don't show. You good?'* Rule 17 single-exit exception (per book B6 'Choices: none' — Maya is being hired, not deciding; shadow-Cookie + watch-tables + end-of-shift pay are sequential not agency moments). Preserves all flag/effect values (hired_at_diner; energy -10; time 120 preserved)."

