[[canvases]]
id = "activity_help_fix"
name = "Help fix something"
description = "Work-bay hands-on-the-same-engine. Trust-building, no pay. — Rewritten 2026-04-25 (Session 19, Tier E Ryan-cluster batch #1 canvas 9 of 9 — FINAL R-CLUSTER CANVAS). Single-node in-place expansion. 351 authored words — universal body (~95w, work-bay geometry + Rule-10 smell + second-stool-unspoken-rule) + 4 pure-corruption-band variant groups (Closed ~65w / Opening ~60w / Operating ~65w / Saturated ~55w — each with 1-word Ryan tool-call dialog block + paragraph rendering the tool-exchange body-moment at that band) + 11w Maya-action-framed exit label with specific-object. Target was 350w (+1w = on target). **INVERSE GEOMETRY to R7+R8**: R7+R8 had Ryan OFF-SCREEN (customer area, work bay beyond swing-doors, Ryan audible-not-visible via socket-wrench + rolling-door + slow-count). **R9 is IN the work bay — Ryan right there, Maya on a second stool, shared-labor register**. This is the ARCHITECTURAL PIVOT of the R-cluster: R1-R8 variously had Ryan at distance (yard-observational / truck-cab-quiet / counter-off-screen); R9 is the canvas where Ryan is present-and-close. Established as Ryan-cluster Help-tier foundation canvas — gates on ryan_help_tier_open=true only; no higher-state gate. **Architecture: pure-corruption-band variant axis** (following R3 activity_watch_ryan pattern + PRD architectural rule: 'Tier E canvases where Maya's register IS the mechanic use corruption-band primary variant axis'). R9 is shared-labor — the work is the same regardless of Maya's state; what differs is HOW MAYA REGISTERS the shared-labor closeness. Closed-band (overlap catalogued-not-attached); Opening-band (hand-brush let-herself-register not-moving); Operating-band (did-not-move-first picks-targets naming-what-she's-doing); Saturated-band (ran-the-bay possessive inhabited-routine). Four different Mayas on the same stool exchanging tools with the same Ryan. **Tool-handoff body-exchange as architectural anchor** per book spec final_book.md:3208 *'Trust-building, no pay. The hands-on-the-same-engine scenes.'* Each variant anchors on the hand-exchange moment: (Closed) fingers-on-handle-where-hers-had-been-catalogued-no-attachment; (Opening) hand-brushed-back-of-his-neither-moved-not-named-let-herself-register; (Operating) did-not-move-first-let-him-move-or-not-move-not-moving-was-a-thing-she-had-come-to-work-out-here-for; (Saturated) hand-over-was-the-hand-over + she-stayed-at-the-bench possessive. **Ryan-cluster tool-vocabulary-transmission canvas**: R7 established Maya deploying 'farmer-fold' (appropriating Ryan's Partner-tier trade-vocabulary in her own interior). R9 is where the TOOL VOCABULARY is physically transmitted — Ryan SAYS the word (*Crescent.* / *Socket.* / *Three-quarter.*) and Maya RESPONDS by handing the named tool. R9 is the transmission-canvas; R7 is the deployment-canvas. Cross-canvas pairing locked. Ryan's dialog kept to 1-word fragments per variant (Crescent / Socket / Three-quarter / Maya) — perfectly ryan.md Help-tier fragment-discipline compliant (*'Hand me the crescent.'* Help-tier specimen shortened to the single tool-word in R9's shared-labor register; dropping the *Hand me the* framing because at close-proximity in a shared-bay the verb is inferred). **Zero complete Ryan sentences — Beach-Crack anti-dilution preserved** even at Saturated variant. **Second-stool-unspoken-rule signature landed at R9 universal body**: *He had set a second stool at the corner of the workbench an hour before without looking at her, because the second stool was where the second person sat if there was a second person. She took the stool. That was the rule. The rule was unspoken.* — Ryan-silent-invitation signature via SPECIFIC-OBJECT-PLACEMENT-WITHOUT-NAMING (the stool is the invitation; the placing-without-looking is the Ryan-fragment-discipline extended to body-action). Forward-seed for Tier F Ryan-solo canvases referencing the stool or the shared-bay. **'Ran the bay the way she ran her counter at the diner' cross-cluster Saturated signature** (P4 Saturated variant): Saturated possessive extends ACROSS clusters — Maya at Saturated owns the bay the way she owns the counter the way she owns her shift. Forward-seed for any Saturated-band Tier F canvas — the possessive signature has now generalized to all Maya's working-spaces. **Rule 10 smell load**: degreaser + cold-metal + cut-pine-smell-of-the-workbench-Ryan-had-built-himself (universal body). Cut-pine is a NEW R-cluster smell anchor (R7 had hot-metal/sour-denim, R8 had cold-grease/metal-rubber-warm-engine; R9 adds cut-pine + degreaser + cold-metal). **Effects preserved exactly**: ryan.trust +2, 90 min, energy cost 15. **Fixes no @npc_ tokens** (original 1-sentence skeleton had no token leak) but dramatically expands the Tier-F-density original (~20w) to Tier-E-density expanded (~351w with 4 band-variants). 0 italic spans across 351w body (Session-18+19 cluster cadence maintained). Zero banned phrases. **RYAN-CLUSTER COMPLETE**: R1-R9 now all rewritten. 9 of 9 Ryan-cluster Tier E canvases done."

