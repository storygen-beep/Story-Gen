[[canvases.nodes]]
id = "base"
name = "The Floor"
blocks = [
  { type = "image", props = { file = "story/first_diner_shift_t0/base_counter_trucker.jpg", description = "Interior of a small-town diner late on a Wednesday evening, ~9pm. Long laminate counter with a row of stools, a Bunn coffee maker on a warmer plate behind the till, a fluorescent strip light over the pass. A young waitress in a white apron stands at the counter holding a glass coffee carafe in her right hand and a wet rag in her left, mid-pour over a man's coffee mug. The man at the end stool is in his forties, sunburned at the neck above a t-shirt collar, beard, Caterpillar cap on the counter beside him; his hand on the cup is calloused and steady. The Coca-Cola wall clock above the pass reads nine-twelve. Booth in the background by the door has a family finishing pie.", search_queries = ["small town American diner late evening waitress refilling trucker coffee at counter Coca-Cola clock fluorescent light", "diner counter at 9pm long-haul trucker on stool sunburned beard Caterpillar cap young waitress with coffee carafe Bunn warmer", "Wednesday night roadside diner interior trucker at counter end coffee refill apron"] } },
  { type = "paragraph", content = "The Coca-Cola clock above the pass said nine-twelve. The shift was five-to-ten and Maya was at the four-hour-and-change mark, which was the mark the dinner rush thinned to the second-coffee men — the count Maya had been watching for since Cookie had passed her at the pass at twenty past eight and tipped her chin at the clock without saying anything. The after-the-game family was finishing pie in the booth by the door. The trucker at the end of the counter had been at the end of the counter since seven, when his rig had been at the gravel turnout across the road." },
  { type = "paragraph", content = "She had figured out the booth numbers by the second hour — three by the window, two through eight running counterclockwise the way the floor sloped toward the kitchen wall and the way the booths had been numbered by someone forty years ago who had counted with the slope. She had learned the coffee pot — the Bunn behind the till was the regular, the second pot on the warmer was for decaf, the carafe in her right hand was the third Cookie had brewed since five — and the count of three swings from carafe to cup that meant the cup was half. She had learned that Marge wiped tables across not along, that booth three's salt-and-pepper pair sat on the inside edge of the table because that was where the man in the Caterpillar cap put it back when he was done, that the door bell rang at a different pitch when a regular came in than when a stranger did." },
  { type = "paragraph", content = "Smell: bacon and coffee and Pine-Sol, fryer grease bleeding through the swinging door from the back, the wet-rag of her own apron tied at the hip. Cookie had opened the kitchen door for the smoke break an hour ago and the smell of cigarettes from the back step had crossed the floor for the count of Maya standing in the middle aisle with two coffees in one hand. She had not registered the cigarette smell as a thing she would remember. She had registered it as a thing the diner had." },
  { type = "paragraph", content = "Cookie crossed the floor at quarter past nine on the way back from the kitchen pass, pulling the apron-strings tight at her hip as she walked. She did not stop. She said it past Maya's shoulder at the count of a woman moving plates from the pass to the counter — at the volume of a thing she had decided to say once and was not going to repeat." },
  { type = "dialog", content = "If you can hold an eye, that's the Thursday shift. Just so you know.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "paragraph", content = "She did not wait for an answer. She did not turn her head. The two plates were down on the counter at booth two before the sentence had finished landing in Maya's head. Maya did not yet have anything to do with the sentence at the moment Cookie had said it, and she filed it the way she had been filing the things she did not yet know what to do with — at the back of the drawer, on the page she would come back to." },
  { type = "paragraph", content = "Marge had looked up once in the last hour to say *Two-egg brown for the counter, no toast,* without looking at Maya, and Maya had carried the plate before the words had finished landing. The carrying-without-thinking had been the small surprise of the night. The Bunn knocked itself on the warmer plate at the count it had knocked itself four times before. The fluorescent over the pass made the small steady noise it made." },
  { type = "paragraph", content = "The trucker at the end stool had been working a second cup of coffee for the count of two refills. He was forties, sunburned past the line of a t-shirt collar, the kind of beard a man kept because shaving on the road was a thing he did not do. His hands on the cup were the hands of a man who held a cup the way a man held a wrench when the wrench was at rest. Maya had registered his hands at the first refill, the way she registered hands. She had not yet, at the second refill, registered the rest of his face." },
  { type = "paragraph", content = "She came around the counter with the carafe in her right hand and the rag in her left. She stopped at his cup. She tipped the carafe. Three swings. She lifted the carafe." },
  { type = "paragraph", content = "He looked up." },
  { type = "paragraph", content = "The look was a beat longer than the look of a man being refilled by a waitress. It was a beat longer than the look she had felt across the dining room from booth four when she had carried the meatloaf past at seven-thirty. It was a beat longer than any beat she had counted yet — she did not have the counting of those beats yet — and she did not yet know what to do with the look." },
  { type = "dialog", content = "Order up.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "paragraph", content = "Cookie had set a plate down on the wheel without inflection. Marge at the till did not look up from the credit slips. The trucker did not break." },
]
exit_block = { type = "choices", choices = [
  { text = "Hold the look. Then break it.", targetType = "trigger", time_progression_minutes = 300, effects = [ { targetType = "player", trait = "money", op = "add", value = 50 }, { targetType = "player", trait = "hygiene", op = "add", value = -15 }, { targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "rep_road", op = "add", value = 3 } ], flagEffects = [ { targetType = "player", flag = "first_t0_shift_done" } ] },
  { text = "Look down at the carafe.", targetType = "trigger", time_progression_minutes = 300, effects = [ { targetType = "player", trait = "money", op = "add", value = 43 }, { targetType = "player", trait = "hygiene", op = "add", value = -15 }, { targetType = "player", trait = "calculation", op = "add", value = 1 } ], flagEffects = [ { targetType = "player", flag = "first_t0_shift_done" } ] },
  { text = "Smile. Turn back to the pass.", targetType = "trigger", time_progression_minutes = 300, effects = [ { targetType = "player", trait = "money", op = "add", value = 45 }, { targetType = "player", trait = "hygiene", op = "add", value = -15 }, { targetType = "player", trait = "corruption", op = "add", value = 1 }, { targetType = "player", trait = "rep_road", op = "add", value = 1 } ], flagEffects = [ { targetType = "player", flag = "first_t0_shift_done" } ] },
] }


