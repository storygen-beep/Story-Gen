  { text = "Back to the table. Meet Frank's eye across it.", targetType = "trigger", time_progression_minutes = 20, conditions = { version = "1.0", items = [ { type = "flag", subject = "player", flag_key = "frank_keep_route", operator = "is_true" } ] }, flagEffects = [ { targetType = "player", flag = "keep_tier_fork_fired" }, { targetType = "player", flag = "phase_1_final_route" }, { targetType = "player", flag = "phase_1_final_frank" } ] },
  { text = "Out the back door to the shop where Ryan is.", targetType = "trigger", time_progression_minutes = 20, conditions = { version = "1.0", items = [ { type = "flag", subject = "player", flag_key = "ryan_keep_route", operator = "is_true" } ] }, flagEffects = [ { targetType = "player", flag = "keep_tier_fork_fired" }, { targetType = "player", flag = "phase_1_final_route" }, { targetType = "player", flag = "phase_1_final_ryan" } ] },
  { text = "Down the hall to Jake's room.", targetType = "trigger", time_progression_minutes = 20, conditions = { version = "1.0", items = [ { type = "flag", subject = "player", flag_key = "jake_keep_route", operator = "is_true" } ] }, flagEffects = [ { targetType = "player", flag = "keep_tier_fork_fired" }, { targetType = "player", flag = "phase_1_final_route" }, { targetType = "player", flag = "phase_1_final_jake" } ] },
  { text = "Up the fourteen stairs. Close her own door at the weight she closed doors at.", targetType = "trigger", time_progression_minutes = 20, flagEffects = [ { targetType = "player", flag = "keep_tier_fork_fired" }, { targetType = "player", flag = "phase_1_final_route" } ] },
] }


