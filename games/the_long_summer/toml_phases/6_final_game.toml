# ── N1 — ride_east ── The drive. Sunday morning, week 7, after the farmer.
[[canvases.nodes]]
id = "ride_east"
name = "The Drive Out"
blocks = [
  { type = "image", props = { file = "story/ryan_beach/n1_truck_cab.jpg", description = "Maya in the passenger seat of Ryan's pickup, early Sunday light through the windshield, county road ahead.", search_queries = ["young woman passenger pickup truck cab early morning light rural", "rural Alabama county road sunday morning pickup interior", "girl in truck looking out window summer south"] } },
  { type = "paragraph", content = "He picked her up at the end of the driveway before the heat had come up. The light was the slow cooling kind that the South gave you for an hour on a summer morning before the heat climbed back up off the road. She had her sketchbook in her lap because she always did and a thermos of Diana's coffee between her thighs because the truck cup-holder had been broken since spring." },
  { type = "paragraph", content = "Ryan put the truck in gear without saying where. She had not asked. The conversation had been one sentence on the porch the night before, and the porch had been the whole conversation, and what was happening this morning was the carrying-out of the sentence." },
  { type = "paragraph", content = "The truck cab smelled like gasoline and the cardboard pine air-freshener that had been hanging off the rearview mirror longer than Ryan had owned the truck. Hot vinyl. The sweet warm smell of the dashboard in early summer light. Maya breathed it in and held the breath a second longer than she needed to." },
  { type = "paragraph", content = "Two miles east of the property he turned off onto the county road. He had one hand on the wheel and the other on the gearshift and he did not move either of them more than the road required. His knuckles were the same shape they had been all summer — wide across the back, pale at the joints from the work, the small pink scar on the second knuckle of his ring finger that she had drawn once from the porch without him noticing. She watched the hand drive. Daniel's hands had been narrower and softer and more articulate, and she put that comparison down without examining it, and she registered the putting-down." },
  { type = "paragraph", content = "The radio was off. Ryan did not turn it on. They had been together every day for six weeks at the shop, in the yard, at the kitchen table where Diana fed them both, and they had been quiet together more than they had been loud, and the quiet in the truck cab on the morning after the farmer was different in a way she did not yet have the word for." },
  { type = "paragraph", content = "She did not ask where they were going. He did not say." },
]
exit_block = { type = "choices", choices = [
  { text = "Watch the road.", targetType = "node", nodeId = "ryan_beach.lake_arrival", time_progression_minutes = 60 }
] }

# ── N2 — lake_arrival ── The lake. The water. Body register opens.
[[canvases.nodes]]
id = "lake_arrival"
name = "The Lake"
blocks = [
  { type = "image", props = { file = "story/ryan_beach/n2_lake_pines.jpg", description = "A small Alabama lake in scrub pine. Dirt verge, parked truck visible at the road bend. Empty.", search_queries = ["small rural Alabama lake scrub pine bend in road empty afternoon", "freshwater lake sandy stretch southern summer rural", "dirt road verge lake pines pickup truck parked"] } },
  { type = "paragraph", content = "The lake was where the county road bent left and dropped. He pulled the truck onto the dirt verge and turned the engine off and the cicadas opened up so loud she felt them in her chest. The water was through a stand of scrub pine. She could smell it — the algae warmth, the wet sand, the specific summer-lake smell of standing water that had been getting hotter since May." },
  { type = "paragraph", content = "He opened her door before she got to the handle. He did not say anything about it. He did it the way he did things at the shop: hand on the latch, weight against the frame, an absence of ceremony. She slid out of the cab and the heat off the dirt road came up the back of her thighs." },
  { type = "paragraph", content = "He carried the cooler to a flat patch of sand under the pines. She carried the sketchbook because it was hers and she always carried it. There was no one else at the lake. There were tire tracks where someone had been the night before but the tracks were old enough to be cooled. The water was the color of weak tea where the silt came up off the bottom." },
  { type = "paragraph", content = "He took his shirt off without looking at her. He pulled it over his head with the inside of his wrist the way Jake pushed his hair back, which was the kind of thing you noticed when you had been watching brothers in the same house all summer. The faded cotton came off and the scar across the back of his right forearm caught the light, and Maya looked at the scar instead of his chest because the scar was easier." },
  { type = "paragraph", content = "She pulled her dress over her head. The two-piece underneath was the navy one she had bought at the general store in week three. He looked at her and held the look the count past polite that Ryan held looks. She held it back. The cicadas were the only sound. Then he turned and walked into the water until it was at his hips and dropped down into it without a splash." },
  { type = "paragraph", content = "She walked in after him. The water was warm at the surface and cooler at her ankles. He surfaced ten feet out and pushed his hair back. He did not say anything. He swam." },
  { type = "paragraph", content = "She swam." },
]
exit_block = { type = "choices", choices = [
  { text = "Out of the water. Toward the towel.", targetType = "node", nodeId = "ryan_beach.line_crossing", time_progression_minutes = 60 }
] }

# ── N3 — line_crossing ── On the sand. The line they have been crossing in increments.
[[canvases.nodes]]
id = "line_crossing"
name = "The Towel"
blocks = [
  { type = "video", props = { file = "story/ryan_beach/n3_intimacy.webm", description = "Couple on a towel under pines at a small lake, afternoon sun through pine canopy. Slow, tender, deliberate.", search_queries = ["young couple lake sand intimate sex pine forest afternoon outdoor", "tender outdoor lakeside lovemaking summer south rural", "intimate scene lake beach pine canopy daylight female pov"] } },
  { type = "paragraph", content = "They swam until the sun was high enough to hurt, and then they came in and lay on the towel he had brought for two without telling her he had brought a towel for two. The sand under the towel was hot. Her skin was cool from the lake. She lay on her back and watched the canopy of pines above them slide pieces of sky in and out of view as the wind moved." },
  { type = "paragraph", content = "He turned on his side. She could feel him not looking at her. He could have been looking. He chose not to and that choice was the loudest thing he had done all morning." },
  { type = "paragraph", content = "She turned her head. His face was eight inches away. His hair was wet against his forehead and his eyes were the color the lake had been when they pulled up — the weak-tea brown that was not really brown when you looked at it close. He was not breathing the way he had been breathing in the water." },
  { type = "paragraph", content = "She kissed him." },
  { type = "paragraph", content = "It was the simplest thing. She had been thinking about it since the truck and probably since Saturday in the back office at the shop with the farmer, and she put the thought down on his mouth and waited. He kissed her back. His hand went to her jaw. He kissed her the way he did things at the shop: weight, attention, no ceremony." },
  { type = "paragraph", content = "Maya was the one who reached for the tie at the back of her top. She knew that she was the one. She felt the knowledge happen — the small clean register of: *I am the one doing this; this is a thing I am choosing to do; the choice is one I have made before in the back office on Saturday and the choosing is becoming a thing I know how to do.* The artist part of her noticed the registering and did not interrupt it." },
  { type = "paragraph", content = "The towel was hot under her shoulder blades. The pines moved slow pieces of light over them. He was careful with her in a way that surprised her — not the deliberate carefulness of a man being good, but the unconscious carefulness of a man who was used to handling things that broke. The same hands that drove the truck. The same scar at the wrist." },
  { type = "paragraph", content = "She closed her eyes once and opened them again because she did not want to be anywhere else. The water-light off the lake was on the underside of his jaw. She watched it move." },
  { type = "paragraph", content = "Afterward he put his forehead against hers for a count and did not speak. She felt his breath at her temple. The cicadas were still going. The pines were still moving the light." },
  { type = "paragraph", content = "She had not cried. She noticed that, too." },
]
exit_block = { type = "choices", choices = [
  { text = "Sit up.", targetType = "node", nodeId = "ryan_beach.the_ask", time_progression_minutes = 90 }
] }

# ── N4 — the_ask ── The proposal. Ryan's one complete sentence (per style sheet).
[[canvases.nodes]]
id = "the_ask"
name = "The Sentence"
blocks = [
  { type = "image", props = { file = "story/ryan_beach/n4_after.jpg", description = "Maya and Ryan sitting up on a towel by the lake, late afternoon, dressed again, looking at the water. The space between them.", search_queries = ["couple sitting on towel by lake after swim afternoon clothed sunlight pines", "young man and woman after intimacy sitting on sand looking at water", "rural lakeside couple sitting in afternoon sun thoughtful"] } },
  { type = "paragraph", content = "They sat up after a long time. He pulled his jeans on without standing. She pulled the navy top back over her head and tied it at the back of her neck and he did not help her tie it because that would have been the wrong gesture, and he knew, which was a thing about Ryan she was still learning. He passed her the thermos. She drank Diana's coffee, which was now lukewarm, and handed it back, and he drank from where she had drunk and capped it and put it on the towel between them." },
  { type = "paragraph", content = "He looked at the lake." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "He had not called her that all summer. He had called her *kid*. He had called her *hey*. He had called her *you* in the second person in the way men in the South called women when they were not yet sure of the name. The first time her name landed in his mouth was on the towel at the lake on the morning after the back office." },
  { type = "paragraph", content = "She waited." },
  { type = "paragraph", content = "He kept looking at the lake. His knees were drawn up. His forearms were on his knees. The scar was visible. He was breathing the way she had heard him breathe at the shop when he was about to say a price he was not sure of." },
  { type = "dialog", content = "Stay with me.", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "It was the first complete sentence she had heard him say in six weeks at the property. It was three words. He did not turn his head when he said it. He did not look at her. He said it to the lake." },
  { type = "paragraph", content = "She felt the sentence land in her chest first and then in her throat. The artist part of her registered the order of the landing. The Maya part of her sat very still on the towel and did not yet say a thing back." },
  { type = "paragraph", content = "The cicadas. The pines. Her skin drying in the sun." },
  { type = "paragraph", content = "He waited." },
]
exit_block = { type = "choices", choices = [
  { text = "Answer.", targetType = "node", nodeId = "ryan_beach.the_answer", time_progression_minutes = 5 }
] }

# ── N5 — the_answer ── Maya's three-route choice. Action-as-label, three different Mayas.
[[canvases.nodes]]
id = "the_answer"
name = "The Answer"
blocks = [
  { type = "paragraph", content = "She had three answers in her, and she could feel the shape of each one before she picked it up. The first one was a yes. The second one was a delay that wasn't a no. The third one was a body shutting the conversation down before her mouth could." },
  { type = "paragraph", content = "Ryan was still looking at the lake. He would look at the lake until she answered. That was a kindness she had not expected and which she would carry afterward whichever answer she gave him." },
  { type = "paragraph", content = "She moved." },
]
exit_block = { type = "choices", choices = [
  { text = "Take his hand. \"Stay.\"", targetType = "trigger", time_progression_minutes = 240, effects = [ { targetType = "npc", npcId = "npc_ryan", trait = "love", op = "add", value = 20 }, { targetType = "player", trait = "corruption", op = "add", value = 1 } ], flagEffects = [ { targetType = "player", flag = "ryan_beach_proposal" }, { targetType = "player", flag = "ryan_keep_route" }, { targetType = "player", flag = "ryan_keep_yes_engaged" }, { targetType = "player", flag = "ryan_q3_done" }, { targetType = "player", flag = "ryan_arc_complete" } ] },
  { text = "Watch the lake. \"Ask me again in August.\"", targetType = "trigger", time_progression_minutes = 240, effects = [ { targetType = "player", trait = "calculation", op = "add", value = 1 } ], flagEffects = [ { targetType = "player", flag = "ryan_beach_proposal" }, { targetType = "player", flag = "ryan_keep_route" }, { targetType = "player", flag = "ryan_keep_not_yet" }, { targetType = "player", flag = "ryan_q3_done" }, { targetType = "player", flag = "ryan_arc_complete" } ] },
  { text = "Pull her shirt back on. Don't say his name.", targetType = "trigger", time_progression_minutes = 240, effects = [ { targetType = "npc", npcId = "npc_ryan", trait = "love", op = "add", value = -10 }, { targetType = "player", trait = "corruption", op = "add", value = 1 } ], flagEffects = [ { targetType = "player", flag = "ryan_beach_proposal" }, { targetType = "player", flag = "ryan_keep_route" }, { targetType = "player", flag = "ryan_keep_no_withdrawn" }, { targetType = "player", flag = "ryan_q3_done" }, { targetType = "player", flag = "ryan_arc_complete" } ] },
] }


