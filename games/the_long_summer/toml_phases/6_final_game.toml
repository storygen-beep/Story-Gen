# ── N1 — picking_the_room ── Wednesday 23:05. She has planned this since Tuesday afternoon.
[[canvases.nodes]]
id = "picking_the_room"
name = "The Room She Picked"
blocks = [
  { type = "image", props = { file = "story/frank_catch_living_room/n1_lamp_off.jpg", description = "A Southern living room at eleven at night — a deep couch against the long wall, a side lamp with a wheat-colored shade throwing low light, a TV on with the sound down, a young woman alone on the middle cushion in a thin faded nightshirt.", search_queries = ["southern rural living room late night low side lamp tv on quiet", "young woman alone deep couch thin nightshirt night interior", "american house 11pm living room empty house wife asleep upstairs dim lamp"] } },
  { type = "paragraph", content = "She had picked the room on Tuesday. That was the part she was clear about. She had been carrying the Hoover past the doorway at three in the afternoon and had stopped with her hand on the jamb and looked at the angle the couch made against the front window and the way the hall lamp threw a shadow of the doorframe across the near cushion after dark, and she had known then that this was where she was going to do it." },
  { type = "paragraph", content = "Tonight was Wednesday. Wednesday was the night Frank walked across the pasture to Bill Hargrove's porch for a glass of Jim Beam and the Braves on the radio, and Wednesday was the night Frank walked back between eleven and eleven-thirty and came in through the front. He had been walking that walk for eleven years. Diana had gone up to bed at ten-fifteen with a paperback and the reading lamp angled away from her pillow. The house was quiet in the specific Wednesday-ten-fifteen way it got quiet." },
  { type = "paragraph", content = "Maya showered. She took the shower she took when she did not want to think in it. She put on the nightshirt that had gone through the wash that morning — the faded one, the thin one, the one whose hem fell at the middle of her thighs and whose neck had lost some of its shape at the left shoulder over the summer. She came down the stairs at five past eleven with her hair still wet at the ends." },
  { type = "paragraph", content = "She turned the ceiling light off. She turned the floor lamp by the door off. She left the side lamp by the couch on at its lowest setting — the lamp Diana had brought from the old house, the one with the wheat-colored shade that threw light like it was filtering through a piece of cheap linen. She turned on the TV. TCM was running a thing she did not know, some black-and-white picture with a woman in a hat on a porch. She let the volume sit at four. A voice would be audible; the words would not." },
  { type = "paragraph", content = "She sat in the middle cushion. The deep couch swallowed her to the backs of her knees. The coffee table in front of her had the four coasters nobody used, in the precise square Diana had set them in that morning. The front window was open a thumb's width to the screen, and the cicadas came through it so loud that for a moment they were the only fact in the room." },
  { type = "paragraph", content = "She put her hand where she put it. She started." },
  { type = "paragraph", content = "The TCM actress said something to a man off-camera. The headlights of Frank's truck came up the gravel at eleven twenty-two." },
]
exit_block = { type = "choices", choices = [
  { text = "Don't stop.", targetType = "node", nodeId = "frank_catch_living_room.the_doorway", time_progression_minutes = 25 }
] }

# ── N2 — the_doorway ── The count. Zero Frank dialog. Zero Maya dialog. Time dilates.
[[canvases.nodes]]
id = "the_doorway"
name = "The Count"
blocks = [
  { type = "image", props = { file = "story/frank_catch_living_room/n2_doorway_silhouette.jpg", description = "View from the couch toward the open doorway of a rural living room at night. A man in work clothes stands in the doorway, backlit by the hall lamp beyond. TV glow on the near side of the frame. Both figures still.", search_queries = ["man silhouette in doorway hallway seen from living room at night backlit", "older man standing still in doorway home interior night rural south", "view from couch of figure in doorway tv glow foreground dim hall"] } },
  { type = "paragraph", content = "She heard the truck door close. She heard the boots on the porch boards and then on the mat inside the front door and then on the hardwood of the hall. The hall light had been on at its overhead when she came down; she had left it on because leaving it off would have been the admission the room could not hold." },
  { type = "paragraph", content = "His shadow came into the living room before his body did. The hall lamp threw it across the cushion the way she had known it would, on Tuesday, only now the shadow had a shape in it." },
  { type = "paragraph", content = "Frank in the doorway." },
  { type = "paragraph", content = "She did not cover. She did not move. The part of her that would have moved was not in the room with her, had not been in the room with her since the Tuesday afternoon with the Hoover. What was in the room with her was the part that had picked the cushion and the lamp and the hour. That part did not move." },
  { type = "paragraph", content = "He did not move either. He stood in the doorway with one hand still on the jamb, the other flat against his hip, and his eyes landed where they landed and stayed. Frank's eye contact was a thing he held a count longer than polite, and this count was longer than that. She watched him hold it. She watched the jaw work once. She watched the hand on the jamb tighten and then not." },
  { type = "paragraph", content = "The TCM actress said *the river was already at the fence by morning* and her voice was the only voice in the house." },
  { type = "paragraph", content = "The side lamp was the only lamp. The cicadas were the only outside. The eight feet between the doorway and the couch did not reduce." },
  { type = "paragraph", content = "He smelled, faintly, of the porch — Jim Beam and the warm tobacco of Bill Hargrove's Winstons that did not belong to him and had lived on his shirt for two hours. Under that: the cooling engine of the truck, the red-clay dirt of the walk back. Under that: Frank. The soap he used." },
  { type = "paragraph", content = "He broke the look. He did not speak. He broke it the way he broke looks when he was deciding to end a thing he did not have the grammar for — deliberately, the way a man who believed in discipline would break a look he had just held a count too long. His jaw tightened and loosened once more. He turned his shoulders without turning his face, and only then did he turn his face, and only then did he walk." },
  { type = "paragraph", content = "He walked toward the kitchen." },
  { type = "paragraph", content = "Maya on the couch. Her hand where it had been. The side lamp steady. The TCM actress still speaking over the river." },
]
exit_block = { type = "choices", choices = [
  { text = "Listen.", targetType = "node", nodeId = "frank_catch_living_room.the_walk_through", time_progression_minutes = 1 }
] }

# ── N3 — the_walk_through ── Kitchen sounds. The walk back past the room. The stair count. The door click.
[[canvases.nodes]]
id = "the_walk_through"
name = "Fourteen Stairs"
blocks = [
  { type = "image", props = { file = "story/frank_catch_living_room/n3_empty_doorway.jpg", description = "The same doorway from the same couch angle, now empty. The hall beyond half-lit. The staircase visible at the far end of the hall.", search_queries = ["empty doorway at night seen from couch in living room hall beyond dim", "view of hallway and staircase from living room after figure has left", "american rural home interior empty doorway night tv glow foreground"] } },
  { type = "paragraph", content = "In the kitchen the overhead fluorescent came on — she heard the click, she did not see the light — and then the tap, and then the tap off, and the glass going down on the counter with the soft wooden sound of the old laminate, and then a pause long enough to be a swallow or a breath, and then the glass being picked up again and going down again, this time in the sink." },
  { type = "paragraph", content = "He walked back through the hall. She heard him clear the doorway she was in without turning his head. She did not see this; she knew it. A man who had looked into a room for a count longer than polite did not look twice into the same room on his way out. That was not the rule. That was Frank." },
  { type = "paragraph", content = "He walked past. The floorboard between the hall and the stairs creaked the way it had creaked since they had arrived in June. He set one boot on the first stair and the other on the second and then he climbed the stairs more slowly than he usually climbed the stairs. She counted them. She had not known, until tonight, that she could count them. There were fourteen. He took them at a pace that was half of his weekday pace and it did not sound tired; it sounded like a man who was carrying a thing he had put down and could not put down again." },
  { type = "paragraph", content = "The landing. The turn. His bedroom — his and Diana's — was the first door on the left. She heard him stop at it. She heard his hand on the knob. The knob turned with the particular soft catch it had, the one Diana had said she was going to oil in May and had not. The door opened. The door closed. The latch clicked the way latches did in old houses — a small metal finality." },
  { type = "paragraph", content = "The house went back into its ten-fifteen quiet. The cicadas had not stopped. The TCM actress had moved on to a different scene, something with a man and a letter; Maya did not see the letter. The side lamp was steady. The coffee table still had the four coasters in Diana's square." },
  { type = "paragraph", content = "Maya on the couch. Her hand had moved at some point, she did not know when. It was now in her lap. She registered that it was in her lap. She did not remember moving it." },
  { type = "paragraph", content = "She was not thinking about Frank upstairs. She was thinking about the door at the top of the stairs and the hand he had used to turn the knob and the count he had held in the doorway and the sound of the glass going into the sink with the little wooden thud of the counter. She held the sequence of those sounds in her chest the way she had held the thermos between her thighs on the truck ride east with Ryan — something warm, something hers, something she had not asked for and had, now, anyway." },
  { type = "paragraph", content = "The TV changed scenes again." },
]
exit_block = { type = "choices", choices = [
  { text = "Stay on the couch.", targetType = "node", nodeId = "frank_catch_living_room.alone_after", time_progression_minutes = 4 }
] }

# ── N4 — alone_after ── The narrator is still. Distributed self-recognition. Exit to loc_mayas_bedroom sets frank_caught. No stat changes — latent weight per book canon.
[[canvases.nodes]]
id = "alone_after"
name = "Stayed"
blocks = [
  { type = "image", props = { file = "story/frank_catch_living_room/n4_still_on_couch.jpg", description = "Same young woman on the same couch, later, TV glow still on her face, legs drawn up. She has not moved. Her expression is not resolved.", search_queries = ["young woman alone on couch late night tv glow still unmoved", "aftermath of a scene solo woman on couch dim light interior", "motionless woman night living room after someone left unresolved"] } },
  { type = "paragraph", content = "She did not move for a long time. She did not make a decision not to. The decision to move was simply not in the room." },
  { type = "paragraph", content = "She catalogued instead. She had not covered. She had not spoken. She had not, in the minute after the walking-past, gone upstairs after him — she could have, and the Maya that had picked the cushion would in a version of this night have gone, and the Maya that had stayed on the cushion was the version who was in the room tonight. She had not cried. She had not drawn anything; the sketchbook was upstairs, and the sketchbook was, tonight, not a room she was going to enter. She had not turned the side lamp off. She had not changed the channel." },
  { type = "paragraph", content = "She sat in what she had done. The TCM film passed from one scene to another to another. She did not follow it." },
  { type = "paragraph", content = "At some hour she could not have named she stood. Her legs were stiff from the deep couch. She walked to the TV and pressed the button on the set instead of using the remote, because using the remote would have been the gesture of a person getting up for the night, and pressing the button on the set was the gesture of a person shutting a thing off because she had finished using it." },
  { type = "paragraph", content = "She climbed the stairs. She climbed them the way she had heard Frank climb them, and she did not think about the likeness until she was at the landing, and then she put it down without examining it." },
  { type = "paragraph", content = "Frank and Diana's door was closed. The hall light Diana had left on at the half-bulb setting was on. Her own door at the end of the hall was as she had left it when she came down, a thumb's width ajar." },
  { type = "paragraph", content = "She went in. She closed the door behind her. She closed it the way she closed doors now, which was quietly, and which was a thing she had been, by now, for some time." },
]
exit_block = { type = "location", text = "Bed.", config = { destinationType = "specific", locationId = "loc_mayas_bedroom", time_progression_minutes = 30, flagEffects = [ { targetType = "player", flag = "frank_caught" } ] } }


# ─── B22 — Frank restrict. The new rules. ───

[[canvases]]
id = "frank_restrict"
name = "The New Rules"
description = "Friday Week 9, 06:45, kitchen — two days after the living-room catch (B21). Frank at the head of the table with the paper folded down beside his coffee. Diana at the stove with the spatula stopped on the bacon. The three new rules delivered in three separate sentences with the Phase-B-Restrict-pause between each: *Common areas are locked after midnight.* / *There will be an extra chore each week. I will assign it on Sunday.* / *We will talk about shared spaces.* The catch is never named; *shared spaces* is the verb-without-object referent. Three-Maya fork at Maya's reply. — Rewritten 2026-04-24 (Session 16) as single-node Option A prose expansion per content_rewrite/PRD.md Tier C spec (400-700w target 600). Operating-band Maya (mid-post-Catch, corruption 50-74 — short declarative, internal-instrumental, possessive, the-calculation-at-the-table-is-her-register). Frank Phase-B-Restrict register executed per frank.md: same grammar, MORE of it (three rules not one, per book B22 node spec), contractions dropped under serious pressure (*You'll* / *I'll* / *We'll* in prior skeleton → *There will be* / *I will assign it* / *We will talk about* per style-sheet Phase-B specimen and the style-sheet DO-NOT rule 'I won't discuss this at the dinner table'), pauses lengthen further (rendered as narration-blocks between each of the three rule-dialog-blocks), no reference to the catch (*shared spaces* is the phrase that points to what he will not name — the verb-without-the-object architecture that echoes the B14 correction-structure). Diana mid-low to mid-high awareness pivot per diana.md — she is at the stove, spatula stopped on the bacon, does not turn, does not speak (Phase-1 discipline held even as her awareness bumps from the exchange). Strips 1 @npc_frank token from body + 1 from choice 3 label. Three-choice exit preserved with Dias-rule rendering: choice 2 parenthetical stage direction removed (*(eye contact held)* → *She holds his eye*), choice 3 token leak stripped (*@npc_frank* → *Frank*). All flag + stat + time effects preserved exactly (frank_restrict_declared + frank_tease_under_compliance_open + frank_q2_done on all; calculation +1 on Okay, +2 on Whatever-you-need; time 15 min)."

