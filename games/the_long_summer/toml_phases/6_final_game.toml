# SKETCH SUB-NODE — J1's 3 arc-state variants verbatim
[[canvases.nodes]]
id = "sketch"
name = "Two pages"
blocks = [
  { type = "paragraph", content = "Jake was on the bed against the wall with the sketchbook on his knees and the glasses on. Maya sat on the rug under the window with her own sketchbook open on her thigh." },

  { type = "group", blocks = [
    { type = "paragraph", content = "Paper. Pencils. He did not show her his page and she did not show him hers, and the not-showing was the room's structure — the thing that made the two of them being in a room together for an hour be the thing it was instead of something else. He sharpened the six-B at the window with a utility knife, and the shavings curled onto the sill. She drew the angle of the blinds above his dresser. He drew — she did not know what he drew, and had taught herself not to ask. The silence was work. Not tension. Work that had a direction if she stayed long enough to see it." },
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "jake_hand", operator = "is_false" },
    { type = "flag", subject = "player", flag_key = "jake_keep_withdrawn", operator = "is_false" }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "She leaned over to see his page. He let her. The drawing was of her — of her hands on the rug with the pencil in them, and one of them pushing hair back behind her ear in the way she did without noticing she was doing it. He did not close the book this time. He did not tilt the page away. He watched her watch the drawing with his glasses on and his hands in his lap. She did not pretend the drawing was not of her. She did not make it easier for him than it had to be." },
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "jake_hand", operator = "is_true" }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "He said he was busy this time, the way he had said it the last five times. The door did not open. She stood in the hallway with her own sketchbook in the crook of her arm. From inside, nothing. Not the scratch of a pencil, not the turn of a page, not the small sound of him shifting his weight on the mattress — only the hum of the window-unit and the sound of the house settling into a late afternoon. She took her sketchbook back down the hall. She drew, that night, something that was not him." },
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "jake_keep_withdrawn", operator = "is_true" }
  ] } },
]
exit_block = { type = "location", text = "Close her sketchbook. Let the page go.", config = { destinationType = "trigger", time_progression_minutes = 60, effects = [
  { targetType = "player", trait = "energy", op = "add", value = -10 },
  { targetType = "npc", npcId = "npc_jake", trait = "love", op = "add", value = 1 },
] } }

# VISIT SUB-NODE — J5's after-ten universal body + 4 Keep-route variants verbatim
[[canvases.nodes]]
id = "visit"
name = "His Room, Her Terms"
blocks = [
  { type = "paragraph", content = "After ten o'clock, after the house had gone to bed and Frank had stopped pretending he was watching the late news and Diana had stopped pretending she was reading, Maya walked the upstairs hall to Jake's door. The strip of light under the door was on. The air still smelled of graphite and the heat the second floor did not lose before midnight in August. The light was always on after ten — Jake worked at night, he always had, he always would. She stopped at the threshold." },

  { type = "group", blocks = [
    { type = "paragraph", content = "The door was open. She did not knock. She walked in and sat on the edge of his bed and looked at him at his desk with the lamp on and the page of pencil-work under his hand. She told him what she wanted him to do. She did not raise her voice. She did not soften it." },
    { type = "dialog", content = "Yeah.", props = { speaker = "npc", npcId = "npc_jake" } },
    { type = "dialog", content = "Yeah, okay.", props = { speaker = "npc", npcId = "npc_jake" } },
    { type = "paragraph", content = "He did the doing. The doing was the answer to the asking, and the asking was the asking she had earned on the night the door had been all the way open and the sketchbook had been closed against his chest and his eyes had been on the floor." },
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "jake_keep_owned", operator = "is_true" }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "The door was open. She walked in. He looked up from his page and pulled the glasses up into his hair and took a beat before he said anything, and the beat was the beat of a person who had been waiting to be seen by the specific person who was now in the room." },
    { type = "dialog", content = "I've been working on the back of your hand from memory and it's the closest I've gotten to drawing a hand without making it about the drawing.", props = { speaker = "npc", npcId = "npc_jake" } },
    { type = "paragraph", content = "He held up the page. She looked at the page. The hand on the page was hers. They drew together until one of them stopped, and the one who stopped first was the one who reached for the other." },
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "jake_keep_lovers", operator = "is_true" }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "The door was closed. The strip of light under the door was on, but the door was closed all the way to the floor — there was no four-inch gap anymore, there had not been one for two months. She had walked to the door anyway, the way a person walked to a door that had once been four inches cracked, and she had stopped at the threshold the way she had always stopped at the threshold, and the door was the door." },
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "jake_keep_withdrawn", operator = "is_true" }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "The door was open. She walked in and sat on the desk chair he had pulled out for her ten minutes before she had arrived. The community college brochure was on the desk between them. He had typed up the timeline already." },
    { type = "dialog", content = "Registration opens the 14th. Deadline's the 28th. Aid forms are a separate site, the .gov one not the .edu. I'll send you the link.", props = { speaker = "npc", npcId = "npc_jake" } },
    { type = "paragraph", content = "He did not look at her face. He looked at the timeline. She looked at the timeline too. The scene was a negotiation dressed as a hangout, and they both knew it, and neither of them named it." },
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "jake_keep_she_uses_him", operator = "is_true" }
  ] } },
]
exit_block = { type = "location", text = "Walk the dark hall back. Close her door quietly behind her.", config = { destinationType = "trigger", time_progression_minutes = 45, effects = [
  { targetType = "player", trait = "energy", op = "add", value = -10 },
] } }

# COLLEGE SUB-NODE — J6's single-flow brochure-on-the-floor body verbatim
[[canvases.nodes]]
id = "college"
name = "The brochure on the floor"
blocks = [
  { type = "paragraph", content = "They were on the floor of his bedroom on a Tuesday in mid-August at quarter to nine in the evening. The room smelled of the graphite-and-pencil-shavings that always smelled of graphite-and-pencil-shavings on the second floor in summer. The brochure was on the carpet between them, open to the art-department section, the section he had bookmarked with the corner of an envelope from the bank. He read the bullet points aloud at the volume of a person who had read brochures aloud before — Drawing I, Drawing II, Anatomy for Artists, Gallery Practicum, the visiting-artist series. He read the page in the order it had been written and stopped exactly where the page-break broke before the tuition table." },

  { type = "paragraph", content = "He did not say tuition. He did not flip the page. He set the brochure where it had been, with the corner of the envelope holding the page open at the curriculum side, and he picked up his sketchbook from the floor next to him and drew for a beat without saying anything else, and the saying-nothing-else was the way he said the part of the page he was not going to read aloud." },

  { type = "paragraph", content = "Maya did not ask him to read the page he was not going to read. The bank envelope had Frank's name printed on the address strip, in the typeface the bank used, and she had seen the envelope on the kitchen counter four days running before it had gone somewhere — to Jake's bookmark, evidently — and she catalogued that and left it where she had catalogued it. The catalogued-and-left was the agreement they had not named. The naming would have been the thing that made it untrue." },

  { type = "paragraph", content = "She had taken the brochure home from the campus visitor center the Wednesday before and had set it on her bed and had not opened it for two days. Jake had opened it. Jake had read it. Jake had put a corner of an envelope at the curriculum-side page break. The doing-of-the-reading was a thing he had been able to do that she had not been able to do, and the doing was a help that did not require her to ask for help." },
]
exit_block = { type = "location", text = "Fold the brochure closed at the page-break.", config = { destinationType = "trigger", time_progression_minutes = 30, effects = [
  { targetType = "player", trait = "energy", op = "add", value = -10 },
  { targetType = "npc", npcId = "npc_jake", trait = "love", op = "add", value = 1 },
] } }


# ─── J2: Watch Jake sketch ─────────────────────────────────────────────────

[[canvases]]
id = "activity_watch_jake"
name = "Watch Jake sketch"
description = "Ambient. Passive jake.arousal at mid corruption. — Rewritten 2026-04-25 (Session 20, Tier E Jake-cluster batch #1 canvas 2 of 6). Single-node in-place expansion. 350 authored words — universal body (~100w back-porch-yard-creek geometry + Rule-10 cut-grass-too-many-days-ago/creek-mud smell + cicadas-before-they-dropped-off + Jake-on-second-step + Maya-on-boards-above-him close-enough-to-read-the-back-of-his-neck) + 4 pure-corruption-band variant groups (Closed <25 ~65w / Opening 25-49 ~55w / Operating 50-74 ~65w / Saturated >=75 ~55w) + 10w Maya-action-framed exit label with specific-body-detail. Target was 350w (on target). **Architecture: pure-corruption-band variant axis** per PRD architectural rule + R3 activity_watch_ryan + R9 activity_help_fix precedent ('Tier E canvases where Maya's register IS the mechanic — observational/sitting/ambient — use corruption-band primary variant axis'). J2 is the OBSERVATIONAL counterpart of J1 — J1 was mutual-drawing in the indoor bedroom (flag-axis variants per Jake's arc-state), J2 is Maya-watching-Jake-draw outdoors (corruption-band variants per Maya's register-state). Same Jake activity (drawing) at two locations (bedroom / yard) with two architectural axes (flag / corruption). **'Structural feature' Jake-artist-register signature preserved + repurposed** from original skeleton ('His pencil works around her like she's a structural feature') — landed in Closed-band variant where Jake's drawing-around-her IS the register that Maya catalogues without naming. Forward-anchor for Jake-as-artist signature. **Pencil-moved-one-count-slower Maya-Operating-reading-Jake-via-craft-cadence signature** (Operating variant): Maya at Operating reads Jake by his pencil-rhythm — the slowing-by-one-count is the diagnostic. Forward-seed for any Jake-cluster canvas where Maya reads Jake via art-craft tells. **Front-porch-vs-back-porch cross-canvas Jake-geometry** (Opening variant): *the same shape as the watching had been the day before yesterday on the front porch* — Jake-cluster outdoor geometry now spans front-porch + back-porch + bedroom + hallway = Jake's four domestic-space register-anchors. Forward-seed for J3 knock_jake (hallway) + future Jake-cluster canvases that might revisit front-porch. **Cicadas-before-they-dropped-off TLS Southern register continuation** (universal body) — cross-canvas to multiple TLS canvases that use cicadas as auditory time-marker. **Cut-grass-too-many-days-ago + creek-mud Rule 10 smell anchor** — new Jake-cluster outdoor smell-register-signature. **Maya-watches-the-back-of-Jake's-neck artist-register parallel-to maya.md hands-as-public-register** — here Maya watches Jake's neck (artist-of-Jake's-body-detail). Forward-seed for Tier F Maya-solo Jake-memory canvases. **Effects preserved exactly**: jake.arousal +10 modifier 8h, 30 min, energy -5. Variant gate 4-way mutually-exclusive partition (lt 25 / gte 25 AND lt 50 / gte 50 AND lt 75 / gte 75). 0 italic spans across 350w. Zero @npc_ tokens. Zero banned phrases. Zero Jake dialog (observational canvas — Jake drawing the landscape, Maya watching him watch it; vocal vocabulary-long-sentences still reserved per Jake-cluster vocal-register-budget). Zero Maya dialog. **Jake-cluster techniques catalog continuation** (cumulative through J2): (1) four-inch-door-cracked diegetic geometry [J1]; (2) art-as-honesty 3-state progression-curve [J1]; (3) zero-Jake-dialog Noticed-tier-clipped-via-body-tells [J1+J2]; (4) Jake-rendered-via-absence Withdrawn-route [J1]; (5) Maya-hair-push cross-canvas anchor [J1]; (6) Maya-drawing-subject specificity-gradient [J1]; (7) sharpens-six-B Jake educated-art-vocabulary [J1]; (8) **structural-feature Jake-pencil-works-around-her artist-register signature [J2]**; (9) **pencil-moved-one-count-slower Maya-Operating-reading-Jake-via-craft-cadence [J2]**; (10) **front-porch + back-porch + bedroom + hallway Jake's-four-domestic-spaces cross-canvas geometry [J2]**; (11) **outdoor-yard-creek smell anchor (cut-grass + creek-mud + cicadas) [J2]*. Eleven techniques established across two canvases."

