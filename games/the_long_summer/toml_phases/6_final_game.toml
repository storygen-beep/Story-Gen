lf think about being in it, the temperature of being in it, the body that would be doing the being-in' Maya-Opening-band let-herself-think-about-the-body-in-the-future register signature**: per maya.md Opening-band specimen 'let herself' / 'registered'; the noun-stack 'being in it / the temperature of being in it / the body that would be doing the being-in' is Maya-Opening-band serial-naming-the-imagined cadence; forward-applicable as Maya-Opening-band serial-imagining-the-body register-marker; the swimming-adjacent register Phase 1 doesn't yet wire as activity but the canvas surfaces it as imagined + **'She had not yet decided whether the decision was a decision' Maya-Closed/Opening-band the-decision-not-yet-named-as-decision register-marker** — distributed self-recognition Closed/Opening-band; Maya names the not-yet-deciding as itself a state); (R3 ~75w late-afternoon Jake-knows-the-sand-stretch-but-doesn't-go she-gave-it-five-more — 'flat rock had been warm under her thighs for an hour before she noticed she had been sitting on it for an hour' Maya-noticing-her-not-noticing register cross-canvas to walk_home R4 cicadas-quieter-or-her-ears-stopped-paying the-or-clause-as-attention-uncertainty pattern + **🎯 'She knew Jake knew the sand stretch and did not come down to it — knew it the way she had come to know things about him in the course of being in the same house' Maya-knows-Jake-by-Jake-not-doing-things register signature**: extends Maya-knows-Ryan-by-his-particulars to Jake; the not-doing as the catalogue-able thing; cross-canvas to jake.md silent-vocabulary-budget register; forward-applicable as Maya-knows-the-household-by-the-not-doings pattern + **🎯 'The walk back up the trail would take twenty minutes. She gave it five more first.' Maya-Closed/Opening-band the-extending-the-staying-as-small-claim register signature**: distributed self-recognition; the choosing-to-stay-past-the-intended-time as Maya-claiming-time-for-herself; cross-canvas to walk_home R3 'd