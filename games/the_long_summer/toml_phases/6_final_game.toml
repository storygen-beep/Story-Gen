# ─── R8: Shop — big-ticket close (single by design) ───────────────────────

[[canvases]]
id = "activity_shop_big"
name = "Shop — big-ticket close"
description = "The Crack-trigger close (Phase 2 B18 companion). One Phase 1 big deal by design. — Rewritten 2026-04-25 (Session 19, Tier E Ryan-cluster batch #1 canvas 8 of 9). Single-node in-place expansion. 505 authored words — 6-paragraph Saturated-band Maya-interior pre-arrival staging canvas + 7w Maya-action-framed exit label. Target was 550w (−45w = ~8% under target, still within Tier E 300-600 range). **Architectural role: pre-scene STAGING canvas that delegates to the Phase-2 story canvas** `ryan_big_ticket_deal` (B18, Session 12 rewrite, priority 10) for full scene beats (farmer-arrival + price-dance + back-office close + aftermath). R8 (priority 3) gates on corruption>=75 + ryan_partner_open + ryan_big_deal_closed=false + is_repeatable=false; once-per-Phase-1 by design. In practice the story canvas preempts R8 at the same trigger window (priority 10 > priority 3), so R8 rarely if ever renders — but rewriting it for completeness per priority queue. **R8 framed as the 1:45-to-2:00 PM pre-arrival meditative moment**: Maya-Saturated-band interior waiting, the Saturday-quiet shop, her body already staged, the customer not yet arrived. Deliberately non-duplicative with the story canvas (which opens at 2:15 PM with the farmer already in the yard with the red tractor for five minutes). R8 ends at 'She stood up' — the moment before the customer scene begins. **Saturated-band Maya-narrator per corruption_band_register.md Saturated 'inhabited-routine' + 'minimal hedging' + 'possessive surfaces'**: P1 'She had been ready for this Saturday for three Saturdays' (Saturated pattern-knowing + count-without-counting signature), P2 '1:30 Saturday-routine' (Turned the sign, Ran the dust-rag, Took the receipts, Set the ledger — Saturated subject+past-tense-verb declarative cadence per register specimen 'She closed the till at eleven. The key went into her pocket'), P3 'She had stopped being surprised by what circulated and what did not' (Saturated noticing-without-naming Rule 21), P4 Ryan-in-work-bay + cold-grease/metal-rubber Rule 10 smell + 'Past her shoulder the office door was the door it was on Saturdays' (Saturated tautological-register), P5 'The mirror had stopped being a thing she consulted some weeks ago. The face she had at thirty would be different from the face she had now and she was going to be ready for both' (**direct Saturated-band Mirror specimen deployed** per corruption_band_register.md:85-86 — canonical Saturated mirror-stopped-being-a-thing specimen cross-canvas from activity_mirror_look Saturated variant), P6 'She closed the ledger at the place she had left it open, laid her palm flat across the cover, lifted it. She stood up.' (Saturated subject+active-verb rhythm-break). **Non-duplicative-with-story-canvas design**: R8 deliberately omits the red-tractor-specific details (FOR SALE on printer paper, two thousand four hundred pricing, the retired-farmer archetype, straw-hat body description) that ryan_big_ticket_deal N1 the_approach has already rendered at full Operating-band weight. R8 references the blind-already-down + the office-latch at minimum-specificity (no 'blind pulled Tuesday as if for the sun' verbatim Session-12 phrasing); these anchor-to-the-story-canvas as atmosphere-continuity without duplicating its specifics. **Fixes @npc_ryan token leak** in original two-paragraph skeleton (prior content: 'The customer has been told about her without being told. He came on a Saturday because she's at the shop Saturdays. @npc_ryan is somewhere he can see the driveway but not the counter. The door closes behind her. *This is where she decides what closes with her in the room.*'). Prior italic line *This is where she decides what closes with her in the room* dropped — italic was on a whole-sentence FID announcement which violates Rule 26 'entire sentences because they feel important — banned' + Rule 21 'never have her announce her own change'; Saturated Maya doesn't narrate her own decision-moments, she moves through them. **Exit preserved exactly**: targetType=trigger, time_progression_minutes=120, no effects/flagEffects (ryan_big_deal_closed stays the story-canvas's to set per prior TOML comment). Label enhanced from 3w 'Resolve the scene.' to 7w 'Cross the floor. Step out to meet him.' — Maya-action-framed + diegetic-forward-motion + doesn't spoil the fork-decision (story canvas's do-it-or-walk-away agency intact). **Ryan-in-the-work-bay-with-rolling-door-halfway-up + socket-turning-in-slow-count** — Ryan-off-screen-via-body-signature (R7 R-cluster inheritance: R7 had Ryan-off-screen-via-sound socket-wrench + silence-that-followed; R8 extends with Ryan's rolling-door-halfway-up + slow-count socket-turning — auditory + spatial Ryan-presence-via-inference signature continues). **Cold-grease + metal-rubber-warm-engine Rule 10 smell anchor** — new R-cluster Saturday-afternoon shop-interior smell-register-signature from the work bay through the half-open rolling door. **Three-Saturdays-ready pattern-counting** (R-cluster counting-signature continuation: R4 kid-vs-Maya address-gradient, R5 seventeen-minutes silent-drive-count, R6 three-customers-this-month pattern-count, R7 thirty/fifty/sixty price-gradient, R8 three-Saturdays-ready-wait-count — counting-specific-numbers is now a canonical R-cluster register technique). **Forward-seed for story canvas handoff**: R8 ends at 2:00 PM 'She stood up.'; story canvas opens at 2:15 PM with 'The farmer pulled up in a dented blue Ford at two-fifteen.' — if both fired, the 15-minute gap between R8's close and story canvas's open is the dead-space, handled by time_progression_minutes=120 exit. In practice story canvas preempts. Effects preserved exactly (none). 0 italic spans (prior whole-sentence FID italic violation corrected by removal). Zero @npc_ tokens in new content. Zero banned phrases. Zero Ryan dialog (off-screen per book spec intent + Beach-Crack anti-dilution preserved). Zero Maya dialog."

