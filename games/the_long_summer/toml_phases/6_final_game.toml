description = "Sunday Week 1 afternoon. Ryan under the hood of the pickup in the yard. First Maya-Ryan exchange. — Rewritten 2026-04-24 (Session 13) as single-node Option A prose expansion per content_rewrite/PRD.md Tier C spec (400-700w, 2-3 char-revealing choices). Closed-band Maya (Prologue-register, long subordinated observational sentences). Ryan style-sheet Meet-tier fragments: 3 Ryan dialog lines all fragments, all with *kid* endearment (style sheet: calls her kid until love earns Maya). Preserves both exit choices + all flag/effect values (first_ryan_observation set on both; npc_ryan.trust +2 on stay)."

