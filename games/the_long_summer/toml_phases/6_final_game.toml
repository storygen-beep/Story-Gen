[[canvases]]
id = "activity_sleep"
name = "Sleep"
description = "Nightly sleep. Advances day, restores energy to 100. — Rewritten 2026-04-25 (Session 21, Tier F batch #1 canvas 1 of 6 — **FIRST TIER F BATCH-CANVAS**). Single-node in-place expansion. 230 authored words — image-with-description + 3-search-queries + block_pool of 4 rotating-opening baseline paragraphs (Rule 19 anti-staleness ~175w total) + 3 Keep-route flag-axis variant groups (Frank-romantic / Ryan-yes-engaged / Jake-owned ~50w total) + 4w Maya-action exit label. Target was 200w (+30w = within Tier F 150-300 range). **🌙 FIRST TIER F BATCH** — beginning Maya-solo + town-daily canvases. Tier F density per PRD: 150-300w (Failbetter dailies density per Rule 1 + rotating openings per Rule 19). Architecture pattern for Tier F daily-rotating solos: image + block_pool of N rotations + optional Keep-route flag-axis variants + tight exit. **Architecture: hybrid block_pool + flag-axis variants** matches existing prior-state structure but expanded from 3 block_pool to 4 per priority_queue spec (rotating_openings: 4). Block_pool baseline rotations fire one-per-fire randomly; Keep-route variants fire when their flag is set (Frank-romantic / Ryan-yes-engaged / Jake-owned mutually exclusive Keep-route flags from Phase 1 close). **Block_pool rotations**: (R1 fan-and-Jake's-keyboard ~40w — through-the-wall slow-tick-of-Jake's-keyboard cross-canvas to Jake-cluster aural-tells; last-thought-about-tomorrow's-shift Closed-Opening register); (R2 crickets-and-refrigerator-and-creak-counting ~45w — Maya-counts-creaks-stopped-naming-whose-foot-the-count-was-matching Opening-band household-by-sound pattern-recognition signature; cross-canvas to J3 Maya-counting-not-acknowledgings + J4 board-creak-as-register-tool); (R3 day-collapse ~35w — *She was asleep before the fan had finished its first rotation. The day collapsed into nothing the way a day collapsed when it had been an honest day. The pillow was cool on the side she had not used.* honest-day register signal); (R4 August-