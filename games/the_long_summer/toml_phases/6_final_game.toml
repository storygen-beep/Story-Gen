  ] } },

  # WARM — SAFE quadrant: trust >= 60, pre-Crack per frank.md SAFE-quadrant signature
  { type = "group", blocks = [
    { type = "paragraph", content = "He showed her how to set the nail-head flush the way he had set nail-heads on cedar for forty years — the angle of the hammer at the last strike, the way the wrist stopped before the head met the wood. She tried. She missed. She tried again. She got it on the third strike. He did not say good this time because this time the hammer had said it. The afternoon ran through the work. She had sawdust in her hair that she did not notice until she was on the porch at the end. Frank noticed it before she did and did not tell her." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "npc", npc_id = "npc_frank", trait_key = "trust", operator = "gte", value = 60 },
