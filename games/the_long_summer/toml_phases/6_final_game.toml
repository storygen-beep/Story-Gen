id = "ryan_shop_first_visit"
name = "The Ledger"
description = "Saturday Week 3 afternoon. Maya crosses the gravel to Ryan's shop for the first time; a walk-in farmer demonstrates the ten-percent dance; Ryan asks if she's any good with numbers and offers to feed her if she comes back tomorrow to help with the ledger. — Rewritten 2026-04-24 (Session 15) as single-node Option A prose expansion per content_rewrite/PRD.md Tier C spec (400-700w). Opening-band Maya (pattern-naming register: 'she had let her eyes stay,' 'the list she had been keeping'). Ryan Help-tier fragments preserved verbatim (*You lost?* / *You any good with numbers?* / *Help me with the ledger tomorrow. I'll feed you.*). Walk-in carried by npc_customer_farmer (first appearance of the named shop-customer archetype). Strips 2 Ryan-token leaks from prior skeleton. Preserves trigger + both exit flags + 60-minute time cost exactly."

