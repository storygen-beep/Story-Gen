# ═══════════════════════════════════════════════════════════════════════════════

[[story_arc.chapters]]
id = "chapter_prologue"
name = "Before the Summer"
mood = "shattered"
description = "Normal life, discovery, revenge, collapse. The moral code is planted through play."
order = 0

[[story_arc.chapters]]
id = "chapter_1_establishment"
name = "Arrival + Establishment"
mood = "hopeful-guarded"
description = "Maya arrives. Household rhythm, diner job, first rent paid. Can she be the girl she told herself she'd be when she got here?"
order = 1

[[story_arc.chapters]]
id = "chapter_2_accumulation"
name = "Accumulation"
mood = "tilt"
description = "World responds in specific small ways. Marge hands her the Thursday key. What does she already know how to do that she hasn't admitted yet?"
order = 2

[[story_arc.chapters]]
id = "chapter_3_opening"
name = "Opening"
mood = "shifting"
description = "NPC arcs activate. Ryan Partner. Jake Noticed. Frank Phase A tests deepen. One Crack queues — Ryan."
order = 3

[[story_arc.chapters]]
id = "chapter_4_operating"
name = "Operating"
mood = "deliberate"
description = "Ryan Beach fires. midpoint_crack lands. Frank catch → Restrict → Cracked → Called-out."
order = 4

[[story_arc.chapters]]
id = "chapter_5_saturated"
name = "Saturated"
mood = "reckoning"
description = "Jake Caught+Hand. Rent shortfall if economic path demanded it. Brothers discover. Keep-Tier Fork closes Phase 1."
order = 5


