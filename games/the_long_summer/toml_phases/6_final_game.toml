  { text = "A drink first. Then the dress.",                                  targetType = "node", nodeId = "prologue_morning_with_daniel.party", time_progression_minutes = 45, effects = [{ targetType = "player", trait = "calculation", op = "add", value = 3 }], flagEffects = [{ targetType = "player", flag = "calculation_tier" }, { targetType = "player", flag = "calc_tier_moderate" }, { targetType = "player", flag = "drinks_at_party" }, { targetType = "player", flag = "revenge_planned" }] },
