[[canvases.nodes]]
id = "base"
name = "Couch"
blocks = [
  { type = "image", props = { file = "activities/tv_living_room.jpg", description = "Daily 20:00-22:30 evening TV in the rural Southern living room — interior view from the doorway. Plaid loveseat against the side wall, brown corduroy three-cushion couch facing the TV, single recliner-armchair (Frank's chair) in the corner under a brass floor lamp. Wood coffee table between couch and TV. Folded brown-and-cream striped throws on the back of the couch. Wood-paneled walls, two framed family photographs on the side table. Older box-style TV on a wood stand. Warm lamplight, evening time. Domestic, lived-in, the room of a household that has watched television together for years.", search_queries = ["rural Southern living room corduroy couch television evening family Southern summer warm lamplight", "1980s Southern home wood-paneled living room recliner armchair brass floor lamp box TV evening", "small farmhouse evening TV viewing room recliner couch loveseat striped throws coffee table"] } },

  { type = "block_pool", blocks = [
    # C1 — Frank alone
    { type = "paragraph", content = "Frank in the chair with the remote. The weather channel on mute — the radar loop, the long pan over the gulf, the same green-and-yellow rotating in. The folded paper on the arm of the chair, the editorial side up, his glasses on the table next to him. The chair Frank sat in had a depression his shape, the back of it shined where his hand had been every evening for a stretch of years. He nodded at her when she sat down on the loveseat. He did not change the channel." },
    # C2 — Frank + Ryan
    { type = "paragraph", content = "Frank in the chair, Ryan on the couch end nearer the door. A baseball game — late innings, two on, two out. Ryan commenting at the screen the way he commented at the truck radio, un-finished sentences, the air going out of the c'mon's before he got to a verb. Frank not commenting. Ryan's beer on the coaster Diana had set out — the coaster the truck-shop hand wouldn't have known to use. Ryan shifted a hand's-width down the couch when Maya sat. The shift was the room he made." },
    # C3 — Frank + Jake
    { type = "paragraph", content = "The TV at half-volume — the news, the half that was sports. Frank in the chair with the back-page section. Jake on the floor against the couch, sketchbook open on his lap, pencil at the cadence Maya had learned to recognize: not the page-of-Maya cadence, the something-from-a-magazine cadence, the ear of a horse he had clipped from a National Geographic on Frank's coffee table. Jake's head did not come up when Maya entered. The pencil paused once, then went on." },
    # C4 — All three men + Diana
    { type = "paragraph", content = "The movie was too long. Diana on the couch end, feet under her. Frank in the chair. Ryan on the floor against the couch — the brothers-on-the-floor inheritance from when the men in this house had been boys in this house. Jake against the doorframe, half-in. Diana fell asleep at the second-hour mark. Frank stood and covered her with the brown-and-cream throw, the one she had made the first winter, the one she kept on the couch and not the bed." },
    # C5 — Nobody
    { type = "paragraph", content = "The remote on the coffee table. The throws folded the way Diana folded them after Sunday breakfast. Frank's chair empty. The TV off and dark. Maya picked what to watch — the part of the evening that had been hers since the second Sunday, when she had walked in and the room had been empty and she had stood in the doorway one count before sitting down because the not-asking-permission had been a thing she had to learn at first." },
  ] },

  # CONSEQUENCE — brothers_discover (additive overlay, post-Saturday outdoor)
  # Written soft-and-additive so it reads compatibly across all 5 configurations
  { type = "group", blocks = [
    { type = "paragraph", content = "There was a tightness in the room that hadn't been there a month ago. Whoever was on the couch was on the couch the way someone was now on the couch — not the way someone had been on the couch before the Saturday. The room was the same room. The not-being-the-same was something the room itself had absorbed." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "brothers_discover", operator = "is_true" }
  ] } },
]
exit_block = { type = "location", text = "Off the couch. Up the stairs.", config = { destinationType = "trigger", time_progression_minutes = 60 } }


