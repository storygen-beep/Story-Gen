adas + tactile sun-on-page-warmth + visual water-over-stones — olfactory not load-bearing because the canvas's diagnostic is craft-attention). Rule 22 art-as-honesty ✓✓ (canvas extends sketch_bedroom Rule-22-doctrine to outdoor register). Rule 21 corruption-noticing ✓ (self-portrait variant face-was-not-the-face-she-had-been-working-with-in-her-head)."

