as to activity_shower R2 'towel folded the way Diana folded towels long-edge-tucked-under' = Diana-the-organizer signature now twice-anchored across activity_shower + activity_walk_property; forward-applicable as Diana-household-organizer cross-canvas register. 0 italic spans across 205w. Zero @npc_ tokens. Zero banned phrases. Zero NPC dialog (Maya-solo back-porch deciding canvas; Diana surfaces via organizing-tells only). Zero Maya dialog (FID register). Rule 10 smell ✓ (R3 cut-grass-smell-was-older-than-yesterday load-bearing + R1 implicit pine-heat). Rule 19 anti-staleness ✓ (3 distinct first-line registers across morning/midday/late-afternoon time-of-day axis). Rule 21 corruption-noticing surfaces in the choice-set (visible-domestic-yard vs further-out-trail = different Mayas making the same decision)."

