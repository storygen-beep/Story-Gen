[[canvases.nodes]]
id = "rent"
name = "Sixty for Frank"
blocks = [
  { type = "image", props = { file = "story/first_sunday/rent_envelope_kitchen_table.jpg", description = "A sunlit Sunday morning kitchen in a southern farmhouse. Three twenty-dollar bills laid side by side on a worn kitchen table, beside a small brown manila envelope with handwritten 'Wk 2' in pencil on the front. A folded white waitress apron with hip stains hangs over the back of a wooden chair. On the counter behind, a Mr. Coffee percolator and a cast-iron pan with bacon grease cooling. A handwritten note on the back of an envelope tucked under a salt shaker. Window cracked behind the sink with morning light coming through and basil leaves visible on the sill outside.", search_queries = ["sunday morning farmhouse kitchen three twenty dollar bills on table brown envelope rent payment apron on chair", "rural southern kitchen rent envelope on table sunday light folded apron salt shaker handwritten note", "kitchen table morning coffee percolator cast iron pan bacon grease envelope cash basil window sill"] } },
  { type = "paragraph", content = "The note was on the counter under the salt shaker. Diana had written it on the back of the gas-bill envelope from Friday with the felt-tip pen she kept in the drawer by the toaster. The handwriting was the hand Maya had grown up reading on lunch-bag notes and refrigerator-door reminders for fourteen years before the apartment in Lexington and the year she had been on her own." },
  { type = "paragraph", content = "<blockquote>Leave sixty for Frank before church. — D.</blockquote>" },
  { type = "paragraph", content = "She read it once. She read it twice. The reading-twice was the small pause her body had taken without asking, the way it had taken the small pause at the calculator app two Sunday-nights from now would also be a small pause it would take. She did not yet know that." },
  { type = "paragraph", content = "She had said *okay* to the rent at this same table eight days ago, in yesterday's clothes, with the coffee Frank had made still in the pot and the paper folded on the chair. She had not yet, then, understood that the saying-okay was the writing-into-the-ledger that the writing-into-the-ledger was. Sixty a week. Due Sundays. *That was the agreement,* Frank had not had to say, because the saying had been done." },
  { type = "paragraph", content = "The apron was on the chair where she had hung it last night when she had come in from the diner at twenty past ten with the cash stack folded once. She took the stack out of the apron pocket. She counted it on the kitchen table. She had not yet learned to count it twice the way she would learn to count it at the desk on the second Sunday two weeks from tonight; she counted it once and the count was correct because the count had been her own four-shift week and the math had not yet been hard." },
  { type = "paragraph", content = "Three twenties. She set the three twenties on the table side by side. The other ones and fives and the change went back into the apron pocket. The apron she folded along the apron-strings the way she had watched Cookie fold hers at the end of Cookie's Wednesday shift, which was the way the apron was meant to be folded if a person had been folding aprons for twelve years on a five-to-ten. Maya had not been folding aprons for twelve years. The fold was nearly right." },
  { type = "paragraph", content = "The brown envelope was in the drawer by the phone next to the small notepad on which Frank had written *Maya — Wk 1* with a number-two pencil last Sunday afternoon at three o'clock. She put the three twenties in the envelope. She wrote *Wk 2* on the front of the envelope in her own handwriting, which on the brown paper looked like her handwriting and not like Diana's. She set the envelope on the kitchen table at the place Frank's coffee cup would be when he came in." },
  { type = "paragraph", content = "Smell: bacon Diana had finished frying at seven-twenty and the cast-iron still smelling of it, coffee from the percolator, the basil from the side garden through the window cracked open behind the sink. Outside the cicadas were not yet at their day-count. From the porch the screen-door creaked once — Frank standing up from the rocker — and then the screen-door eased back to closed." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "Frank from the porch through the screen, at the volume of Frank speaking from the porch through the screen. He had said her name and had paused and had not yet said the rest." },
  { type = "dialog", content = "Diana is going to walk to the service. You can walk with her. You can stay.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "Three complete sentences, no contractions, the *you can stay* at exactly the volume of the *you can walk with her*. He had decided a long time ago how to offer a daughter her own mind. The note on the counter, the envelope on the table, the choice through the screen — Diana through Frank through the porch, the household of three sentences saying themselves at the same time on a second Sunday in July." },
  { type = "paragraph", content = "Maya looked at the envelope. She looked at the door." },
]
exit_block = { type = "choices", choices = [
  { text = "Walk to the service with Diana. The good shoes.", targetType = "trigger", time_progression_minutes = 180, effects = [ { targetType = "player", trait = "money", op = "add", value = -60 }, { targetType = "player", trait = "rep_church", op = "add", value = 3 } ], flagEffects = [ { targetType = "player", flag = "first_sunday_passed" }, { targetType = "player", flag = "attended_church_week_1" } ] },
  { text = "Stay home. Sketchbook on the porch.", targetType = "trigger", time_progression_minutes = 180, effects = [ { targetType = "player", trait = "money", op = "add", value = -60 } ], flagEffects = [ { targetType = "player", flag = "first_sunday_passed" } ] },
] }


