[[canvases.nodes]]
id = "base"
name = "Office Door"
blocks = [
  { type = "image", props = { file = "story/rent_shortfall_first/office_desk_sunday.jpg", description = "A small home office in a contractor-built rural Southern home at seven in the morning on a Sunday — a wooden desk under an east-facing window with morning light through thin curtains, a column-ruled household ledger open on the desk with a pencil beside it, a coffee mug at three o'clock to the ledger, a man in his fifties in a work shirt seated at the desk with his hand flat on the ledger page, a brown envelope placed on the desk edge nearest a young woman standing across the desk from him with the number 60 written on the envelope in pencil.", search_queries = ["small home office desk morning east window light paper ledger coffee mug rural southern", "father at desk with household ledger Sunday morning young woman standing with envelope", "brown envelope with pencil writing on desk edge household accounts morning light office"] } },
  { type = "paragraph", content = "Sunday at seven was the hour Frank did the household books. She had known the hour since the second Sunday in the house. She had known what the books looked like since Thursday at ten-twenty the week of the Crack — the column-ruled ledger, the lamp on the left, the mug of coffee at three o'clock to the ledger, the chair on his left she had not taken since that Thursday. She had been at the desk in her own room since five-thirty this morning. She had counted the forty dollars into the brown envelope Diana kept in the kitchen drawer. She had counted them twice. She had written 60 on the front of the envelope in pencil. The difference was what she had come to say." },
  { type = "paragraph", content = "The office door was cracked an inch. She knocked three times, short. Three short was the knock he had, by her second month, let her know he preferred to two. He did not lift his head from the ledger. The door opened under the second knock because she had pushed it on the third." },
  { type = "paragraph", content = "She went in. The office was what it was on Sunday morning — the ledger open, the mug at three o'clock, the lamp off because the east window was doing the light. Frank was in the work shirt that was the work shirt on weekdays, today without the belt tucked into it yet. She did not take the chair on his left. She stood at the far edge of the desk where the grain of the oak ran crosswise to his sheet of blotter-paper." },
  { type = "paragraph", content = "She put the envelope on the desk edge nearest her. She did not slide it to him. The envelope was a plain brown one Diana kept in the kitchen drawer, the kind Diana used for the lunch money she did not use anymore. The 60 on the front was in her own handwriting now. The 40 inside was in nobody's handwriting because it was cash." },
  { type = "dialog", content = "Short twenty this week.", props = { speaker = "player" } },
  { type = "paragraph", content = "She did not soften it. She did not add because. She had run the word *sorry* three times at the desk in her room at five-forty-five and she had put it down each time. The word on the desk was the number, and the number was the whole sentence." },
  { type = "paragraph", content = "Frank let the silence sit. His hand was flat on the ledger page. The lamp was off. The mug was not at his mouth and had not been since she walked in. She could hear the kitchen through the wall — Diana running water for the oats, the kettle on the low hiss, the cast-iron setting back down on the grate. The Phase-B pause was the Sunday-office scaled version of the pause at the Friday breakfast that was the scaled version of the pause on the porch in July. She counted it because she had learned, by the week after the breakfast, to count them." },
  { type = "paragraph", content = "Four sentences were on the desk beside the envelope. The defer-sentence — the Thursday she had already worked out on the back of the T0/T1/T3 pay-differential she had been keeping in her head since the first week of the diner. The work-it-off sentence — the chore-under-his-watch Restrict had opened the door to, the one she would stand behind if she said it. The extras-tier sentence — the Thursday the key under the till had opened, the shift that paid the twenty she was short at a number that was one shift, not four. The can't-yet sentence — the sentence the April-Maya might have said, the sentence that would hand him the week and the next week without a plan inside them." },
  { type = "paragraph", content = "Her shoulders were square. The envelope was on the desk. The ledger was open on his side of the desk and not on hers. The sentence she was about to say was the sentence the week after this week was going to be built around." },
]
exit_block = { type = "choices", choices = [
  { text = "\"I'll make it up Thursday.\"", targetType = "trigger", time_progression_minutes = 30, flagEffects = [ { targetType = "player", flag = "rent_shortfall_1" }, { targetType = "player", flag = "rent_resolution" } ] },
  { text = "\"Can I work it off?\"", targetType = "trigger", time_progression_minutes = 30, conditions = { version = "1.0", items = [ { type = "flag", subject = "player", flag_key = "frank_tease_under_compliance_open", operator = "is_true" } ] }, flagEffects = [ { targetType = "player", flag = "rent_shortfall_1" }, { targetType = "player", flag = "rent_resolution" } ] },
  { text = "\"I'll take the extras-tier Thursday.\"", targetType = "trigger", time_progression_minutes = 30, conditions = { version = "1.0", items = [ { type = "flag", subject = "player", flag_key = "first_ambient_tilt", operator = "is_true" } ] }, flagEffects = [ { targetType = "player", flag = "rent_shortfall_1" }, { targetType = "player", flag = "rent_resolution" } ] },
  { text = "\"I can't yet.\"", targetType = "trigger", time_progression_minutes = 30, flagEffects = [ { targetType = "player", flag = "rent_shortfall_1" }, { targetType = "player", flag = "rent_evicted" } ] },
] }


