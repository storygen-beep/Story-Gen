  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Saturday morning. Gravel for fifty yards before it took the county road's pavement. Ryan's shop on the property edge, the big roll-up door pulled down — the padlock clipped through the loop the way Ryan clipped a padlock when the shop was shut for the day, not the way he clipped it for the night. The yard around the shop was empty of equipment, which meant whatever had been there yesterday had a buyer. Cicadas not yet at full volume." },
