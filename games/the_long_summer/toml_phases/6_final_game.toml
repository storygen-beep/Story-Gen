# ─── G2: TV with whoever's home ────────────────────────────────────────────

[[canvases]]
id = "activity_tv_living_room"
name = "TV with whoever's home"
description = "Evening TV. Block-pool of household configurations. — Rewritten 2026-04-25 (Session 21, Tier E batch #1 canvas 2 of 3). Pure-block_pool 5-configuration architecture (no universal frame — each configuration establishes its own living-room geometry through its specific household configuration; the configurations themselves do the scene-setting work) + 1 additive arc-state consequence overlay (brothers_discover). Image-UPGRADED with description + 3 search_queries (Rule 24 fix — original had 1 bare query). 5 mutually-exclusive who's-on-the-couch configurations per priority_queue plan ('Configuration block pool: Frank alone / +Ryan / +Jake / everyone / nobody'): C1 Frank-alone (~70w weather-channel-on-mute + radar-loop-over-the-gulf + folded-paper-editorial-side-up + Frank's-chair-shape-depression + nod-doesn't-change-channel + Maya-on-the-loveseat-not-the-couch geometric distance-tell) / C2 Frank-plus-Ryan (~70w baseball-late-innings + Ryan-commenting-at-screen-the-way-he-commented-at-truck-radio + Ryan's-beer-on-the-coaster-Diana-set-out + Ryan-shifted-a-hand's-width-down-the-couch + the-shift-was-the-room-he-made Ryan style-sheet sideways-compliment-via-action) / C3 Frank-plus-Jake (~73w TV-at-half-volume-news-back-page + Jake-on-the-floor-against-the-couch + sketchbook-on-Jake's-lap-pencil-cadence-Maya-had-learned-to-recognize-not-the-page-of-Maya-cadence + ear-of-a-horse-clipped-from-National-Geographic + Jake-pencil-paused-once-then-went-on Jake style-sheet hand-pause-as-noticing) / C4 All-three-men-plus-Diana (~72w movie-too-long + Diana-on-couch-feet-under-her + Frank-in-chair + Ryan-on-the-floor-against-the-couch the-brothers-on-the-floor-inheritance-from-when-the-men-in-this-house-had-been-boys-in-this-house + Jake-against-doorframe-half-in Jake style-sheet doorframe-tell + Diana-fell-asleep-at-second-hour-mark + Frank-stood-and-covered-her-with-the-brown-and-cream-throw-the-one-she-had-made-the-first-winter-the-one-she-kept-on-the-couch-and-not-the-bed Frank Phase-A SAFE-quadrant deep-household-knowledge body-tell) / C5 Nobody (~69w remote-on-coffee-table + throws-folded-the-way-Diana-folded-them-after-Sunday-breakfast + Frank's-chair-empty + TV-off-and-dark + Maya-picked-what-to-watch + the-second-Sunday-memory-anchor-when-the-room-had-been-empty-and-she-had-stood-in-the-doorway-one-count-before-sitting-down + the-not-asking-permission-had-been-a-thing-she-had-to-learn-at-first Maya-Closed-band the-room-as-hers-by-virtue-of-being-empty register cross-canvas to maya.md the-part-of-her-that-asked-permission-had-to-be-unlearned). 1 additive arc-state consequence overlay BROTHERS_DISCOVER (~55w there-was-a-tightness-in-the-room-that-hadn't-been-there-a-month-ago + whoever-was-on-the-couch-was-on-the-couch-the-way-someone-was-now-on-the-couch-not-the-way-someone-had-been-on-the-couch-before-the-Saturday + the-room-was-the-same-room + the-not-being-the-same-was-something-the-room-itself-had-absorbed) — written soft-and-additive so it reads compatibly across all 5 configurations rather than contradicting any (the configs remain random-pool; the overlay surfaces the post-Saturday register-shift via Maya's-naming-without-naming Operating-band the-room-itself-as-the-tell). 6w Maya-action exit upgrade from 1w 'Bed.' to 'Off the couch. Up the stairs.' (Maya-action sequence per Rule 13). Strips 8 @npc_ token leaks (4 npc_frank + 1 npc_ryan + 1 npc_jake + 2 npc_diana). Effects preserved exactly: trigger costs energy 5, schedule daily 20:00-22:30, condition arrived_at_franks=true, exit destinationType=trigger time 60min (no exit effects per original — TV-evening doesn't restore-energy at the level dinner does). 0 italic spans across ~410w (deliberately italic-free — the 5-configuration register-density carries character work without typography). Zero banned phrases. **Architecture (10): pure-block_pool 5-configuration mutually-exclusive who's-home-axis + additive-arc-state-consequence-overlay** — second Tier E group canvas; configurations-as-mini-scenes pattern (vs family_dinner's frame-plus-band-axis pattern). The TV canvas doesn't have an organizing-NPC awareness stat to gate variants on (Frank doesn't have a tracked stat that gates couch behavior; the configurations are random-rotation per evening), so the architecture is pure-pool-not-band-axis — different from family_dinner's pattern (9). Cross-canvas: (a) **🎯 Frank's-chair-shape-depression-on-the-cushion register** first surface (C1) — Frank's deep-household-routine body-tell-rendered-as-furniture; (b) **🎯 Ryan-commenting-at-the-screen-the-way-he-commented-at-the-truck-radio register** (C2) — extends Ryan style-sheet 'Hands always doing something' into Ryan-by-his-cadences across surfaces; (c) **🎯 Ryan-style-sheet hand's-width-as-room-made signature** (C2) — Ryan's wordless-hospitality body-tell first surface; (d) **🎯 Jake-pencil-cadence-Maya-had-learned-to-recognize register** (C3) — Maya-knows-Jake-by-his-cadences extending the Maya-knows-Ryan-by-routine-tells pattern from walk_to_town/walk_creek to Jake; (e) **🎯 the-brothers-on-the-floor-inheritance register** (C4) — establishes house's genealogy of who-sits-where (chair=Frank / floor=boys / couch=Diana) as a structural register-anchor; (f) **🎯 Frank-Phase-A SAFE-quadrant deep-household-knowledge body-tell** (C4 throw-she-knows-is-the-couch-throw-not-the-bed-throw) — first surface of Frank-knows-Diana's-things-by-which-room-they're-for register, Phase A SAFE quadrant per frank.md; (g) **🎯 Maya-the-second-Sunday-memory-anchor register** (C5) — the-not-asking-permission-had-been-a-thing-she-had-to-learn-at-first cross-canvas to maya.md 'the part of her that slammed doors had not been in the room with her, apparently, for some time' (the part of her that asked permission had to be unlearned, paired register); (h) **the-room-itself-as-the-tell register** (brothers_discover overlay) — Maya Operating-band naming-the-room's-absorbed-shift, additive-overlay pattern proven compatible-across-configurations design."

