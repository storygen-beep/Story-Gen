# ─── N3 ── classroom — Wednesday afternoon, the door she opened ──────────────
[[canvases.nodes]]
id     = "classroom"
name   = "The Third Door"
blocks = [
  { type = "paragraph", content = "Wednesday was a Wednesday, and Wednesday was the last day of the semester. That was the thing she would remember afterward, the specific flatness of the day — the morning drawing class that had run five minutes long, the professor who had said *good luck, good summer* and meant it, the coffee she hadn't finished, the hallway echoing in the particular way hallways echoed on the last week when most people had already packed up and gone home. A Wednesday in a life that had been, as of the morning she had spent in Daniel's bed, perfectly shaped." },
  { type = "paragraph", content = "She had forty minutes before her last final, which was the Art History thing she was going to walk into and sit down and write for two hours and walk out of and not think about again until the grade came through in June. She had wanted to sketch." },
  { type = "paragraph", content = "The Fine Arts building was where she would normally have gone, but the studios were locked on finals week, and she did not want the whispered study-group sound from the lobbies. She walked across campus to the Humanities building. The third floor had six lecture classrooms, small ones, the kind they used for senior seminars and grad-student discussions, and on the last Wednesday of the semester most of them would be empty — which was, later, the detail she would keep stopping on, because if classes had still been running, none of this would have happened the way it did." },
  { type = "paragraph", content = "The third floor smelled like the photocopier down the hall that was always warm and the disinfectant they used on the handrails. She tried the first door. Locked. The second door. Locked. The third door opened." },
  { type = "paragraph", content = "The third door opened and she saw them." },
  { type = "video",     props = { file = "prologue/n3_classroom.webm", description = "Fluorescent light. An empty classroom. A desk. Two figures she knows.", search_queries = ["couple fucking empty college classroom lecture hall", "cheating couple sex on professor desk fluorescent light", "college hookup empty classroom clothing disarray"] } },
  { type = "paragraph", content = "She saw them before they saw her. She had that — two seconds of seeing that belonged to her alone, that she would later parse and re-parse and be unable to give up, because the image was specific and complete and she was going to have to carry it: the fluorescent panel above the board flickering at the edge, the rows of empty chairs pushed in at the crooked angles students leave them, Sarah's backpack — the olive-green one Maya had helped her pick out last fall at the thrift on Fifth — slumped against the leg of a student desk, Sarah's sweater crumpled on top of it, Sarah's skirt shoved up around her waist, Sarah on the edge of the professor's desk with her knees apart and her hands braced behind her, Daniel between her knees with his mouth on hers and one hand in her hair in the particular way Maya had felt his hand in her own hair on Sunday morning." },
  { type = "paragraph", content = "Sarah's mouth was doing the thing Sarah's mouth did, which Maya had seen a hundred times in a hundred non-sexual contexts over three years of friendship — the slight left-sided hitch of her lips, the way she pressed her tongue against her teeth before a laugh — and which was now doing it for Daniel." },
  { type = "paragraph", content = "Neither of them looked up." },
  { type = "paragraph", content = "She stood in the doorway for somewhere between two and four seconds. She knew the count because later, in her apartment, she would try to reconstruct exactly how long she had stood there, and she would not be able to decide, and her inability to decide would become one of the things she carried." },
  { type = "paragraph", content = "Long enough to register that she was not misreading. Long enough to be sure she was not going to look back at this in an hour and wonder if maybe she had seen something else. Long enough that if either of them had glanced at the door, they would have seen her." },
  { type = "paragraph", content = "Neither of them glanced at the door." },
  { type = "paragraph", content = "She closed the door." },
  { type = "paragraph", content = "She closed it quietly. She did not slam it. The part of her that slammed doors had not been in the room with her, apparently, for some time — she had left that part of herself somewhere, maybe on Sunday morning, maybe earlier, and what was in her body in the third-floor hallway was the other part, the part that closed doors quietly, the part that would turn out to be most of her from here on out." },
  { type = "paragraph", content = "She walked down the hallway. She walked down the stairs. She walked out of the Humanities building and across the quad and past the coffee cart at the edge of the quad, and she sat on a bench outside the library because her legs had decided to sit before she had decided to sit, and she took her sketchbook out of her bag and put it in her lap." },
  { type = "paragraph", content = "She did not open it." },
  { type = "paragraph", content = "She sat for fifteen minutes on the bench. A boy she did not know walked past with a dog she did not know. A bell rang somewhere. Her phone buzzed twice in her coat pocket and she did not look at it. The sun moved the specific amount the sun moves in fifteen minutes on a Wednesday in October." },
  { type = "paragraph", content = "She stood up. She walked back to the parking lot at the edge of campus. She got in her car. She drove home." },
  { type = "paragraph", content = "In her apartment she locked the door behind her with the specific care of a person handling something breakable. She sat down on her bed with her coat still on." }
]
exit_block = { type = "choices", choices = [
