# ── N1 — the_office ── Thursday 22:20, one week post-Crack. The walk, the chair, the setup. Operating-band Maya narrator.
[[canvases.nodes]]
id = "the_office"
name = "The Seventh Thursday"
blocks = [
  { type = "image", props = { file = "story/frank_call_out/n1_office_postcrack.jpg", description = "A home office at night — same banker's lamp and ledger as the prior week, window cracked two inches to the side yard. Older man at the desk, younger woman in the chair on his left. The room quieter than the week before.", search_queries = ["southern home office night banker green lamp ledger desk window cracked late summer", "dim home office older man bookkeeping younger woman at his shoulder quiet hour", "rural small-business office September evening green lamp ledger cracked window cicadas"] } },
  { type = "paragraph", content = "She came down the hallway at twenty past ten on a Thursday. The strip of light under the office door was there again. She had walked to it on six Thursdays running and this one made seven, and the seven was a thing she had been aware of when she set out from her room and had stopped being aware of two flights of stairs ago. The hall was in its late-register half-bulb. The TV was off. Diana had gone up at nine-thirty because Thursday was the early start at the library. The cicadas in the yard were already halfway through their August run even though the calendar had turned over into September on Sunday. The heat of the day was still in the hallway runner. The smell of cold coffee was already starting to arrive from under the door." },
  { type = "paragraph", content = "She had picked the blouse on Tuesday. She had picked the time ten days ago, which was the first Thursday the Thursday at twenty past ten had started being the time she was going to do this at. She had been building the hour toward the sentence across two weeks of not saying it, and the not-saying had been the work, and the work was almost done." },
  { type = "paragraph", content = "She knocked once. She did not wait." },
  { type = "paragraph", content = "Frank was at the desk. The ledger was open to Tuesday's column because Tuesday was always where a Thursday session started. The green-shade banker's lamp was on and the overhead was off. The window to the side yard was cracked open two inches — he had been leaving it cracked since the week after the Crack because the office ran warmer with the door shut and he had been shutting the door — and the night air coming through the gap was not cool but was moving, which was enough. The mug by his elbow was the same mug. The whiskey was the faint whiskey. The paper and the pencil shavings were the paper and the pencil shavings." },
  { type = "paragraph", content = "He looked up. His eyes held her for the count that was his count and no longer than it." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "She took the chair on his left. She had been taking it for four weeks. The chair was the chair on his left, and the taking of it was no longer a thing she had to decide." },
  { type = "paragraph", content = "\"Tuesday's receipts,\" she said." },
  { type = "dialog", content = "Start at the top.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "She read the first column. He wrote. The pencil scratched. The cicadas in the side yard were the cicadas in the side yard. The clock on the shelf behind him kept its time. Frank had been speaking in shorter sentences for a week. The shortness was not the Crack's shortness; it was the shortness of a man who had been quieter since, who had reduced himself to what the work needed of him and nothing past it. He had not corrected her knock-and-enter. He was not going to." },
  { type = "paragraph", content = "*I came to say it; the saying is the thing I came to do.* The pencil did what the pencil did. The column total did what it did. Her voice read the numbers at the weight numbers were read at, and it was her voice doing the reading, and the voice and the saying she had not yet done were both hers and she knew the difference." },
  { type = "paragraph", content = "They did Tuesday. They did Wednesday. They did the partial Thursday. The last total went into the column and the pen came to rest against the spine of the ledger, and what was next to do in the office on a Thursday at ten forty-five was either another column or the sentence, and there was no other column." },
]
exit_block = { type = "choices", choices = [
  { text = "Set the pencil down.", targetType = "node", nodeId = "frank_call_out.naming_it", time_progression_minutes = 25 }
] }

# ── N2 — naming_it ── The Call-out line. Scene-center utterance. Post-line silence cataloged. Operating-band Maya holds eye contact through all three pieces.
[[canvases.nodes]]
id = "naming_it"
name = "Three Pieces"
blocks = [
  { type = "image", props = { file = "story/frank_call_out/n2_line_lands.jpg", description = "Close interior shot — a woman speaking quietly across a desk to an older man, the ledger between them, the moment of a spoken sentence landing in a quiet room. Warm lamp light. He has not yet looked up.", search_queries = ["young woman speaking quietly across desk older man listening home office lamp night", "intimate close dialog moment desk office two people warm light ledger between", "woman delivers important sentence older man at desk bookkeeping pause charged quiet"] } },
  { type = "paragraph", content = "She had been practicing the sentence for a week. Not in the mirror. The mirror was not where she practiced anymore. She had said it in the cab of the pickup at the red light at the intersection of State Route 9 and Elm, with the radio off, with her hand on the wheel, in three different weights. She had said it into the surface of the creek on Friday afternoon with the sketchbook open on the bank to a page she had not been drawing on, which was the page that kept itself open because that was the page the sketchbook had been on last. She had said it under her breath walking home from the diner on Thursday night with the hour stretched dark around her and the two dollars she had earned past the grey-blouse number in her apron. She had said it six different ways." },
  { type = "paragraph", content = "She had not brought the sketchbook with her tonight. She had known not to. The sketchbook was upstairs on the desk in her room because what was about to happen in the office was not something the sketchbook was going to be in the room for. The sketchbook stayed clean. The sketchbook stayed upstairs." },
  { type = "paragraph", content = "She looked at him. He was looking at the ledger. She was going to make him look at her. That was a thing she knew about herself now." },
  { type = "paragraph", content = "She said it." },
  { type = "dialog", content = "This is normal. Everyone has needs. Even you.", props = { speaker = "player" } },
  { type = "paragraph", content = "The sentence arrived. Its three pieces arrived with it. She had said the first piece at the weight she had practiced, and she had said the second piece at the weight she had practiced, and she had said the third piece at the weight she had practiced, which was the quietest of the three weights because the quiet was the part of the sentence that had to carry past the desk. She did not qualify it. She did not say his name. She had known not to say his name." },
  { type = "paragraph", content = "She did not look away." },
  { type = "paragraph", content = "The refrigerator in the kitchen at the far end of the hall cycled on. The cicadas in the side yard kept their count. The clock on the shelf behind him let a second pass, and then another second, and then another. The house at ten forty-seven on a Thursday in the second week of September did what the house did." },
  { type = "paragraph", content = "She kept her eye on him." },
  { type = "paragraph", content = "The Maya she had been in March would have looked at the ledger while she said the second sentence and would have looked at the doorframe while she said the third. That Maya was not the one in the chair. The one in the chair had held her own eye on his through each of the three pieces and was holding it through the silence after, and the holding of it was not an effort; the holding of it was what she was doing tonight." },
]
exit_block = { type = "choices", choices = [
  { text = "Wait for him.", targetType = "node", nodeId = "frank_call_out.his_response", time_progression_minutes = 1 }
] }

# ── N3 — his_response ── Frank Phase B Call-out: closes ledger, hand flat, looks, \"Maya.\" Then the silence and the four body-possibilities preview. Exit_block is the 4-way Keep-route fork.
[[canvases.nodes]]
id = "his_response"
name = "The Hand Put Down"
blocks = [
  { type = "image", props = { file = "story/frank_call_out/n3_closed_ledger_hand.jpg", description = "An older working man's hand laid flat on a closed ledger under a green banker's lamp. A younger woman's hand visible at the edge of the frame but not touching. The moment before a decision. Warm, charged, quiet.", search_queries = ["man's hand flat closed ledger desk lamp woman's hand near but not touching home office", "charged quiet moment after spoken sentence older man closed ledger warm interior", "hand at rest on closed book desk bookkeeping late night ambiguous pause two people"] } },
  { type = "paragraph", content = "He did not answer right away. He was not a man who answered right away. The difference between this silence and his usual deliberate pause was that this silence was a silence he was inside of and did not know the way out of. The jaw worked once — the gesture he had used since she had known him to gather a sentence before speaking it — and this time the gesture did not produce a sentence. The jaw worked once and stopped." },
  { type = "paragraph", content = "He closed the ledger." },
  { type = "paragraph", content = "He did it with the hand that had been flat on the page. The blotter moved under the cover, the way it had moved in the Crack. The pen rolled a quarter of a turn toward the lamp and stopped against the base of it. He had used the hand to close the book without lifting the hand to any height past what the closing required. The closing itself was the gesture — the conceding of the session, the putting down of the tool, the admission that the column was not what the two of them were doing tonight." },
  { type = "paragraph", content = "He put the hand flat on the desk. Not pressed. Not fingers splayed the way they splayed when he was holding still at a meeting with her or at a dinner table in Diana's presence. Flat. Palm against the wood, fingers long and at rest, the line of the thumb parallel to the grain. A hand a man put down when he was done holding something." },
  { type = "paragraph", content = "The artist part of her drew it. She did not reach for the sketchbook. The sketchbook was upstairs and had been upstairs on purpose. The artist part of her drew the thumb and the wrist and the small flat of the palm without a pencil, the way a rehearsal without a pencil drew things, because the hand on the desk was a gesture that asked to be drawn and the asking was not going to be answered on paper tonight. In the Crack she had drawn the pressure. Tonight she was drawing the release. There was no pale crescent at the second knuckle this time. The blood was in the hand and the hand was at rest, and that was the thing to draw." },
  { type = "paragraph", content = "He looked at her." },
  { type = "paragraph", content = "His eyes had held her for a count longer than polite the first time, in the Crack, and that count had not ended, and the not-ending had been the sentence the broken grammar had sat inside of. This look was different. This look did not hold her past a count. This look landed and stayed. This look was what a man's eyes did after the holding-longer-than-polite had failed him and he had nothing to do with them anymore except let them be on her." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "paragraph", content = "He said it at the weight her name was the sentence." },
  { type = "paragraph", content = "He did not follow it with anything. He had used the opener and he did not bring the sentence behind it. The opener was by itself. That was what he had to offer her after \"This is normal. Everyone has needs. Even you.\"" },
  { type = "paragraph", content = "She did not help him. The Maya who would have helped him was upstairs in March with the sketchbook and the hair-tied-with-a-pencil and the Daniel-voice still running underneath the surface of her days. She had left that Maya at the top of the stairs the night of the Crack and had not been back for her." },
  { type = "paragraph", content = "The silence sat. The cicadas held. The refrigerator cycled off. Somewhere at the back of the house a board settled the way old boards settled at an hour like this on a night like this. The clock on the shelf kept its time. The window-gap to the side yard let through the same moving-not-cool air it had been letting through for a week." },
  { type = "paragraph", content = "She saw the four of them, then. Not as abstractions. Not as options on a ledger. As four things her body could do next, four moves already half-queued in the muscles, four futures presenting themselves as physical possibilities in the room." },
  { type = "paragraph", content = "The hand on the desk she could cover. Her palm over his. The flatness of his hand against the wood becoming the flatness of her hand over his, a simple geometry, the warmth of him under her and the night ahead of them folded into it. That was one." },
  { type = "paragraph", content = "The number she could name. Sixty a week off the rent, Thursdays in the office, the arithmetic of a thing she had been carrying in her head since the first short Sunday in August. The terms of it laid out in her voice at the volume of her voice, each piece of the arrangement a piece, each piece hers to set down. That was two." },
  { type = "paragraph", content = "The door she could walk through. Push back from the desk, say his name in the normal-volume way she had said *Goodnight, Frank* the night of the Crack, walk. Climb fourteen stairs. Close her own door behind her. Leave the office and the ledger and the sentence she had said all three of to the man she had said it to. That was three." },
  { type = "paragraph", content = "The command she could give. *You work for me from now on.* A sentence with his shape in it, a sentence that inverted the room, a sentence that meant he was going to be the one who said yes to a thing from the other side of the desk. That was four." },
  { type = "paragraph", content = "The four were hers. The choosing of one of them was hers. She had known for a week that the Call-out opened to four; she had not known which of the four her hand was going to want when the moment was in front of her. She knew now that she did not know. She knew now that the knowing was at the end of the count she was going to let go now, not before it." },
  { type = "paragraph", content = "She let the silence go another count. She did not look away from him. He did not look away from her. The office at ten forty-eight on a Thursday in the second week of September was the room the four futures were in, and she was the one in it who was going to pick." },
  { type = "paragraph", content = "Outside, a truck on State Route 9 changed gears. The sound lived in the cicadas for a second and left." },
]
exit_block = { type = "choices", choices = [
  { text = "Put her hand over his on the desk.", targetType = "trigger", time_progression_minutes = 30, flagEffects = [ { targetType = "player", flag = "frank_called_out" }, { targetType = "player", flag = "frank_q3_done" }, { targetType = "player", flag = "frank_arc_complete" }, { targetType = "player", flag = "frank_keep_route" }, { targetType = "player", flag = "frank_keep_romantic" } ] },
  { text = "\"Sixty a week off the rent. Thursdays in the office.\"", targetType = "trigger", time_progression_minutes = 30, flagEffects = [ { targetType = "player", flag = "frank_called_out" }, { targetType = "player", flag = "frank_q3_done" }, { targetType = "player", flag = "frank_arc_complete" }, { targetType = "player", flag = "frank_keep_route" }, { targetType = "player", flag = "frank_keep_arrangement" } ] },
  { text = "Push back from the desk. \"Goodnight, Frank.\"", targetType = "trigger", time_progression_minutes = 30, flagEffects = [ { targetType = "player", flag = "frank_called_out" }, { targetType = "player", flag = "frank_q3_done" }, { targetType = "player", flag = "frank_arc_complete" }, { targetType = "player", flag = "frank_keep_route" }, { targetType = "player", flag = "frank_keep_rupture" } ] },
  { text = "\"You work for me from now on.\"", targetType = "trigger", time_progression_minutes = 30, effects = [ { targetType = "player", trait = "calculation", op = "add", value = 2 } ], flagEffects = [ { targetType = "player", flag = "frank_called_out" }, { targetType = "player", flag = "frank_q3_done" }, { targetType = "player", flag = "frank_arc_complete" }, { targetType = "player", flag = "frank_keep_route" }, { targetType = "player", flag = "frank_keep_power_inverted" } ] },
] }


