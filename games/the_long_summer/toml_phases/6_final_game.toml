description = "B9 — CHAPTER 1 CLOSE milestone. Sunday Week 2 late (21:30-ish). Maya at her desk with the calculator app, money in the apron pocket plus the cash under the lamp, the college brochure not-yet-picked-up (she has seen the sign on Main Street). The math — $60/week rent × summer-weeks + personal costs + $1,500 tuition against what she'll earn at T0 — does not close. The chapter-close italic FID-thought (Rule 26 cat a) lands in the final paragraph: *'There's more tier available if I want it. I can see where it goes from here.'* This is the canvas where Maya first *names* that the economic pressure is going to push her into the corruption-gated channels — Closed-band narrator at the Closed→Opening threshold. — Rewritten 2026-04-24 (Session 10) as Option A single-node expanded prose. Structure: solo-scene ~1100-word target, math-as-the-scene discipline (per PRD recommendation), Rule 22 inversion on the sketchbook (she does not open it — the closing-of-the-math is not the register the clean sketchbook belongs to). All flag effects preserved exactly: first_rent_paid (milestone) + group_settled_in + calculation +2 on exit. Story-arc node_the_math at 4_story_arc.toml in Chapter 1 close unchanged."

