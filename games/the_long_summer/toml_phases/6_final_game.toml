[[canvases.nodes]]
id = "base"
name = "The Counter"
blocks = [
  { type = "image", props = { file = "story/marge_interview/counter_apron.jpg", description = "A folded white diner apron sitting on a laminate counter beside a leather-bound bill holder and a till; an older woman with short iron-grey hair behind the counter counting out cash into the till drawer, a pencil behind her ear, a rag at her wrist; background a pass with tickets on the wheel, a young woman in a cook's ponytail flipping a burger on the line.", search_queries = ["folded white diner apron on laminate counter till drawer older waitress iron grey hair counting cash afternoon", "small town diner 5pm afternoon float count apron on counter cook on line burger ticket wheel", "apron on counter diner new hire orientation owner counting cash young cook ponytail grill"] } },
  { type = "paragraph", content = "She came in at four-fifty-nine by the clock on the wall, which she had been told by Diana that morning was the clock she needed to be inside of by five. The bell went over the door. The two men from Monday were at the counter on the same two stools, which Maya was going to learn, by the seventh shift, was how regulars sat. Marge was at the till counting out the morning float for the afternoon shift. She looked up." },
  { type = "dialog", content = "You came. Good.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "The apron was on the counter in a folded square. It was a white apron of the kind a diner had been using since 1960 — faded at the tie from other people's knots, hip-stained, the ties longer than they needed to be. Marge pointed at it with the pencil she had been counting with." },
  { type = "dialog", content = "Tie it. Learn as you go.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "Maya tied the apron. She did not get the knot right on the first try — the ties were longer than she had expected, and she did it twice. Marge did not watch her do it. Marge finished the float and turned toward the pass." },
  { type = "dialog", content = "Cookie's back here. Do what she says.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "Cookie was on the line. She was in her mid-thirties, hair in a high ponytail tied tight off the grill, the sleeves of her t-shirt rolled up to the shoulder. She was flipping a burger with a spatula and working a ticket on the wheel above the pass at the same time." },
  { type = "dialog", content = "Maya. I'm Cookie. You eighteen?", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "dialog", content = "Yeah.", props = { speaker = "player" } },
  { type = "dialog", content = "You ever waited tables?", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "dialog", content = "No.", props = { speaker = "player" } },
  { type = "dialog", content = "Okay. Follow me two hours. You carry a plate when I hand you a plate. You take the coffee pot when I point at a table. You don't pour unless they ask for a refill. You ask me when you don't know.", props = { speaker = "npc", npcId = "npc_cookie" } },
  { type = "paragraph", content = "Cookie handed her a ticket pad and a pen." },
  { type = "paragraph", content = "The next two hours were a pattern Maya had not had a pattern for. Booth one was Route 9 drivers. Booth three was an older couple with a regular order. The counter had the two men and a woman she had not yet seen. The coffee pot lived on the warmer by the pass. The till opened with a button under the lip. The pass was where tickets clipped and where Cookie set the food. The plates were heavier than she had expected. The carry against the hip was the carry Cookie showed her wordlessly, with the platter balanced above the hipbone on the forearm. By the second plate she had figured out the carry." },
  { type = "paragraph", content = "She did not spill anything. She put the right plate in front of the wrong person once, at booth three, and the husband said *This one's mine, honey* without looking at her, and she switched them without apologizing, because Cookie had told her in passing that apologizing was the thing that made the mistake stick. She had not known that. She wrote it down in her head." },
  { type = "paragraph", content = "At seven Marge walked the floor for five minutes and did not speak to her. At seven-ten Marge went back to the office. At seven-oh-eight Cookie had said *You're okay, kid* in a voice that was an evaluation, and had not repeated it. At seven-thirty the last of the dinner rush had broken." },
  { type = "paragraph", content = "Marge came out of the office with an envelope. She did not hand it to Maya. She set it on the counter in the place where the apron had been." },
  { type = "dialog", content = "Tomorrow. Five to ten. Nine an hour. Tips are yours. You cash out with me at close. You walk if you don't show. You good?", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "dialog", content = "Yes.", props = { speaker = "player" } },
  { type = "dialog", content = "Thursdays are different. We'll see about those.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "dialog", content = "See you tomorrow.", props = { speaker = "npc", npcId = "npc_marge" } },
  { type = "paragraph", content = "She untied the apron. She hung it on the hook by the office door, the hook that Cookie had told her between tables was the apron hook. Marge was already back at the till, the count resumed, the pencil in her hand." },
]
exit_block = { type = "location", text = "Walk the hour home. Hired.", config = { destinationType = "specific", locationId = "loc_front_porch", time_progression_minutes = 120, effects = [ { targetType = "player", trait = "energy", op = "add", value = -10 } ], flagEffects = [ { targetType = "player", flag = "hired_at_diner" } ] } }


