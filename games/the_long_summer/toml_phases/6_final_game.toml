Maya's late-Phase-1 escalation acknowledgment) + Cookie went back to the line had not stopped. Maya-action exit ('Cup empty. Off the stool.' 5w) per Rule 13. Strips 2 @npc_ token leaks (npc_marge + npc_cookie). Effects preserved exactly: 20 min, energy cost 5. Zero italic spans across ~268w. Zero banned phrases. Variant gate logic 3-way mutually-exclusive: PRE_VOUCH covers all states before Cookie's vouch; POST_VOUCH covers post-vouch but pre-key window (Weeks 3-5 typically); POST_KEY covers everything after marge_thursday_key (late-Phase-1)."

