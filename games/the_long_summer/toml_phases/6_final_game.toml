description = "Wednesday Week 1, 17:00–22:00. First T0 shift. The floor learning + the trucker at the end of the counter who holds the look a beat past polite. — Rewritten 2026-04-24 (Session 14) as single-node Option A prose expansion per content_rewrite/PRD.md Tier C spec. Closed-band Maya at the four-hour mark of her first five-hour shift. **FIXES the identical-payouts bug flagged in priority_queue.yaml** — three choices now differentiate by money (43/45/50), corruption (0/+1/+2), rep_road (0/+1/+3), and calculation (+1 on look-down). Per book B7: each nudge keeps T0 cap low. Marge clipped one-line cameo (the *Two-egg brown* recall, italic cat d), Cookie pre-vouch present-time *Order up* dialog block. The trucker is unnamed (Closed-band Maya doesn't yet have Cookie's intel-Rolodex; B11 cookie_peer_established is when the truckers get names). Rule 17 honors player agency at the moment-of-look (three different Closed-band Mayas register and break the look three different ways — book confirms 'Maya breaks first' across all three; the choice is *how* she breaks). Preserves all flag values (first_t0_shift_done) and structural envelope (5-hour time, hygiene -15, single-node, targetType=trigger forward to B8 first_sunday via flag-chain)."

