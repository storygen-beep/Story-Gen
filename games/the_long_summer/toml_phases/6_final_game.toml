    { type = "paragraph", content = "Frank had his task and she had hers. The task she had was the one he had assigned on Sunday the week before, at breakfast with Diana at the stove — paint the porch rail on Saturday, tighten the fence where the cow had pushed through on Sunday, the list that was the weekly list since the rule. They worked on the same property not on the same job. He was down at the fence. She was on the porch. The rail was the rail she had painted two coats on by three. He did not come up to check. The work was the work the list had named." }
  ], conditions = { version = "1.0", logic = "AND", items = [
