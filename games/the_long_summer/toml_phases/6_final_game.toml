  ], modifier_effects = [ { targetType = "npc", npcId = "npc_ryan", trait = "arousal", op = "add", value = 15, duration_hours = 4 } ] },
  { text = "Let him look. Ring the number he signs his name under without knowing it was higher than his.", targetType = "trigger", time_progression_minutes = 60, conditions = { version = "1.0", items = [ { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 55 } ] }, effects = [
