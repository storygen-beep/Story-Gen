# ─── N6 ── party — Kevin's humanity beat (Kevin is Sarah's bf) ───────────────
[[canvases.nodes]]
id     = "party"
name   = "The Back Porch"
blocks = [
  { type = "paragraph", content = "Adam's house was the kind of house that had been rented by six roommates and was being lived in by twenty-three, and it always smelled like old beer and the very specific stale warmth of too many bodies in rooms built for fewer. Adam threw the same party every May, the end-of-semester thing, the send-off before everyone scattered — home for the summer, internship in another city, a half-empty apartment waiting for a job — and the party was loud because everyone had a reason to want the night to count. Maya got there at nine-twenty. She was alone. She had ordered the car and paid in cash because she had not wanted the timestamp on her card. She noticed, noticing this, that she was already thinking in the language of aftermath." },
  { type = "paragraph", content = "Adam opened the door with a bottle in his hand and kissed her on the cheek and asked where Daniel was and Maya said *not feeling great, told him I'd come anyway,* and Adam nodded the way boys nodded when girls told them things they had no interest in following up on, and he said *well, good to see you before summer* and waved her in and went back to the kitchen." },
  { type = "paragraph", content = "The music in the living room was loud enough that she had to move her mouth specifically when she spoke. The couch was full. The coffee table was full. There were people she knew and people she didn't. The people she knew did the wave-thing. She did the wave-thing back. She wound through. She was looking." },
  { type = "paragraph", content = "Kevin was on the back porch." },
  { type = "image",     props = { file = "prologue/n6_kevin.jpg", description = "Kevin on the back porch, alone. A specific face, not a template.", search_queries = ["young man alone back porch house party evening beer", "college guy sitting on steps looking at phone night", "quiet man house party back porch t-shirt step"] } },
  { type = "paragraph", content = "She saw him through the kitchen window before he saw her. He was sitting on the step with a beer balanced on his knee, alone, looking at his phone the way you look at a phone when you are pretending to wait for something so you do not have to talk to the person inside the house who is going to ask you a question you don't want to answer. Sarah was not with him. Sarah was somewhere — the bathroom, the kitchen, not here yet, not here at all — and it did not matter where Sarah was." },
  { type = "paragraph", content = "Maya went through the kitchen and opened the sliding door and stepped out onto the porch." },
  { type = "dialog", content = "Hey.", props = { speaker = "player" } },
  { type = "paragraph", content = "He looked up. He smiled at her without calculation. That was the first thing she had to hold off." },
  { type = "dialog", content = "Hey, Maya.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "paragraph", content = "She sat down on the step next to him. Not too close. Close enough that she could feel the warmth of his arm without it touching her. He set the phone face-down on his thigh in a gesture she catalogued." },
  { type = "dialog", content = "I didn't know you were coming.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "I didn't know I was coming either. Just needed the night.", props = { speaker = "player" } },
  { type = "paragraph", content = "He nodded. The house's porch light was behind them and his face was half in shadow and she could see, for the first time really, the shape of his jaw, the place where the stubble came in unevenly on the left side, a small patch of skin above the cheekbone where it didn't grow. He had an old t-shirt on. The t-shirt had a faded logo for a show she had liked in high school and that she hadn't seen him wearing before." },
  { type = "dialog", content = "I liked that band.", props = { speaker = "player" } },
  { type = "dialog", content = "Me too. Long time ago.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "paragraph", content = "They sat. The beer on his knee was doing the condensation thing. Somewhere inside the house somebody played the song they always played at parties, the one everyone knew but nobody could remember the name of, and a chorus of voices came up, and died down, and came up again." },
  { type = "dialog", content = "Hey. I saw the thing you did. On the wall, by the community center. With the birds.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "paragraph", content = "She looked at him." },
  { type = "dialog", content = "Saw it in July, actually. After you told me about it at Adam's thing. I went over.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "You went over.", props = { speaker = "player" } },
  { type = "dialog", content = "Yeah. I had to drive past that area for — whatever, doesn't matter. I pulled over. I stood there for ten minutes.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "Oh.", props = { speaker = "player" } },
  { type = "dialog", content = "The thing with the — the one bird that's not quite like the others. The one that's looking the wrong way.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "Yeah.", props = { speaker = "player" } },
  { type = "dialog", content = "Why.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "paragraph", content = "She had known for four months why. It was not a thing she had told Daniel. Daniel had liked the mural, had taken a picture of himself in front of it, had posted it with a caption that said *my girl.* Daniel had not asked." },
  { type = "dialog", content = "Composition. I liked the break in the pattern.", props = { speaker = "player" } },
  { type = "paragraph", content = "Kevin nodded." },
  { type = "paragraph", content = "The truth was that the bird was her. She had painted it looking the wrong way because she had been painting at a time when she had been feeling looked-at in every direction but the one she wanted to be looked in, and the bird was the bird that was not going to be looked at properly because the bird had decided to stop trying. It was the only real thing in the mural. It was the thing she'd been proud of. Kevin had driven over and stood in front of it for ten minutes on a weekday in July and he had asked her the only question anyone had ever asked her about it that mattered." },
  { type = "paragraph", content = "She said *composition* and she watched his face accept the lie without suspicion, because he was the kind of person who took what you said at the value you said it, and this — this was the thing that she was going to carry for the rest of her life without being able to name, the small courtesy of having been told a lie by the person you admired, without ever knowing it had been a lie." },
  { type = "paragraph", content = "He drank some of his beer." },
  { type = "dialog", content = "Can I get you one?", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "Yeah. Please.", props = { speaker = "player" } },
  { type = "paragraph", content = "He stood up to go inside and she watched the line of his back as he walked through the kitchen, and she noticed that she had already started — the thing she had come here to do had started forty seconds ago and she had not noticed the exact moment it began. That was the part that scared her. Not the doing of it. The not noticing when it began." }
]
exit_block = { type = "choices", choices = [
  { text = "Continue", targetType = "node", nodeId = "prologue_morning_with_daniel.upstairs", time_progression_minutes = 45 }
] }

# ─── N7 ── upstairs — The act. Reveal names Daniel + Sarah. ──────────────────
[[canvases.nodes]]
id     = "upstairs"
name   = "The Guest Bedroom"
blocks = [
  { type = "paragraph", content = "There is a room upstairs in Adam's house that has been a guest bedroom for as long as anyone has been renting the house, a small room with a sloped ceiling that catches the attic heat even in the fall, and which everyone at every party goes up to at some point during the night in pairs or in trios, because the door closes and the lock works and there is a bed and there is a rug and there is one small window that looks out over the neighbor's garage. Maya had been in that room twice before in her life. Once with Sarah, three years ago, who had been crying. Once with Daniel, at a party eleven months ago, which was a thing that she would have to remember later, and was remembering now, as she went up the stairs ahead of Kevin with her hand on the bannister and her left shoe scuffing the second step the way her left shoe always scuffed the second step of old houses." },
  { type = "paragraph", content = "The second beer was in her hand. She had not drunk much of it. She had not intended to drink much of it. She had intended to be steady." },
  { type = "paragraph", content = "He followed. He had not asked why. That was the part that was making this easier and harder at the same time — she had not given him a reason because she had not needed to. She had gone back out onto the porch after a period of time that he had chosen to read as ambiguous, and she had said *come upstairs with me for a minute,* and he had said *okay* the way people say *okay* when they are agreeing to something they are going to pretend they didn't agree to. He had left his beer on the porch step." },
  { type = "paragraph", content = "She opened the door. She closed it behind him. She turned the lock." },
  { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "Yeah.", props = { speaker = "player" } },
  { type = "dialog", content = "I don't — ", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "I know.", props = { speaker = "player" } },
  { type = "paragraph", content = "He looked at her. There was a single lamp on the nightstand and the lamp was on, because the last people who had been in the room had left it on, and the light was yellow and unkind and the wallpaper in the room was the wrong color for skin — a pale green with a repeating pattern of something that might have been ferns and might have been something else. The pattern was off by a quarter-inch every third repeat. A misprint. The kind of thing Daniel would not have noticed. The kind of thing she had been noticing her whole life." },
  { type = "dialog", content = "What do you know.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "Daniel is cheating on me.", props = { speaker = "player" } },
  { type = "paragraph", content = "Nothing moved in his face except his mouth, slightly. He processed. He was about to say something sympathetic — she watched him find the shape of it — and she spoke before he could." },
  { type = "dialog", content = "With Sarah.", props = { speaker = "player" } },
  { type = "paragraph", content = "He stopped. She watched him stop." },
  { type = "paragraph", content = "For a full breath he was not in the room. Then he was back, and something had rearranged in him — not surprise exactly, because some part of him had always half-known something, the way people always half-know, but the specific naming of it. He set his hand on the dresser to steady it, and the muscle in his forearm shifted the way a muscle shifts when it is absorbing a piece of information that is changing the shape of something it had been arranging." },
  { type = "dialog", content = "How long.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "I don't know. Long enough.", props = { speaker = "player" } },
  { type = "dialog", content = "How did you — ", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "I saw them.", props = { speaker = "player" } },
  { type = "paragraph", content = "He did not say anything else for a moment. She watched him arrive at the place she had arrived at on Wednesday afternoon — the place where the facts sat in the center of the room and the old life was on one side of the facts and the new life was on the other and the only way across was through. Kevin was, she understood now, a person who was going to take longer than her to cross. He was going to cross slower. He was also going to cross. She could see the shape of him crossing." },
  { type = "dialog", content = "Come here.", props = { speaker = "player" } },
  { type = "paragraph", content = "He came." },
  { type = "paragraph", content = "She put her hand on his wrist first, which was the gesture she had rehearsed, and she watched herself do it and watched it work. His skin was warmer than she had expected. She had known him for two years and had never touched his wrist." },
  { type = "paragraph", content = "*Daniel's wrist.* The memory arrived before she could keep it out. The way Daniel's wrist had felt on Sunday morning, the slow one, his hand on her jaw. She closed her eyes for a second and opened them. Kevin was still standing there. Kevin's wrist was under her hand. Kevin, not Daniel. *The classroom.* Sarah's mouth. The olive backpack against the leg of the desk. The fluorescent flicker. She blinked it away. Kevin was still there." },
  { type = "paragraph", content = "She stood up on her toes. She kissed him." },
  { type = "paragraph", content = "His mouth was not what Daniel's mouth was. Every mouth in the world was not what Daniel's mouth was, and she realized in that instant that she had been kissing one man for two years and had forgotten that other mouths existed, and Kevin's mouth was a different mouth, softer at the edges, and he kissed her back in a way that was not what she had expected — not hunger, not hesitation, but a kind of careful attentiveness, as if he were trying to read her rather than take something." },
  { type = "paragraph", content = "That was the first thing that she had not accounted for." },
  { type = "paragraph", content = "She pulled back. She put her hand on his chest, flat." },
  { type = "dialog", content = "Are you sure.", props = { speaker = "player" } },
  { type = "dialog", content = "Are you.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "dialog", content = "Yes.", props = { speaker = "player" } },
  { type = "dialog", content = "Then yes.", props = { speaker = "npc", npcId = "npc_kevin" } },
  { type = "paragraph", content = "She took off his shirt. She did it with the quickness that she had decided on. The t-shirt had been soft from being washed too many times and she felt the softness and she felt the smoke smell in it — not the same smoke that had been on Daniel's clothes that Sunday, a different one, wood, a fire somewhere, a Saturday night that did not belong to her. She folded the shirt. She caught herself folding it and she set it down more quickly than she would have, on the arm of the chair, where it slipped off a moment later and she did not pick it up." },
  { type = "video",     props = { file = "prologue/n7_reframing.webm", description = "Reframing beat — the moment the scene stops being about survival and becomes about agency.", search_queries = ["woman on top bed lamplight taking charge intimate", "confident female lover leading sex scene yellow lamp", "young woman in control partner underneath bedroom"] } },
  { type = "paragraph", content = "She kissed him again. This time she did not close her eyes. She watched his face from a distance of two inches. His eyelashes. The small white scar below the eyebrow that she had never looked at this closely. He was not Daniel. She said the sentence in her head the way a person learning a language says a sentence: Kevin, not Daniel. Kevin, not Daniel. The sentence held." },
  { type = "paragraph", content = "Somewhere under the shock of being looked at by the wrong mouth, Kevin's hands started to move. They were not sure hands. They were careful hands. They were hands that were trying to be kind to a woman he had just learned was being betrayed by his own girlfriend, and he was going to give her whatever she needed and try not to fail the moment, and she saw the whole shape of his kindness and she understood that she was going to use it." },
  { type = "paragraph", content = "That was when the part of her that had closed the classroom door quietly stood up." },
  { type = "paragraph", content = "She put her own hand on his belt. She undid it." },
  { type = "paragraph", content = "Her hands were steady. She noticed her hands being steady. The classroom that afternoon, the bench, the coat she had sat on the bed in without taking off — the steadiness had been there all week, had been waiting for her like a piece of clothing that fit better than she had expected it to fit. She had worn it up the stairs without knowing. She was wearing it now." },
  { type = "paragraph", content = "She took him to the bed." },
  { type = "paragraph", content = "She was the one who did it. She was the one who decided when and how and in what order. She had been the one who had locked the door; she was the one who lay down and pulled him down with her; she was the one who reached between them first. Kevin was not in charge. Kevin was in her hands, and his surprise at being in her hands — the small question in his face that kept appearing and being answered — was the thing she had not known she was coming for, the thing she had not admitted she had come for, until she had it." },
  { type = "paragraph", content = "*Sarah's mouth.* The classroom. The specific hitch on the left side that Maya had always read as tenderness. The fluorescent light flickering above the board. Daniel's hand in Sarah's hair. The image arrived from the afternoon and she let it arrive. She let it arrive the way you let a piece of music come into a room — not fighting, not welcoming, just letting it pass through." },
  { type = "paragraph", content = "She got underneath him and she moved the way she had learned to move in two years of being moved under, and the difference was she was the one choosing the shape of it, she was the one setting the pace of it, she was the one who said *slower* and *there* and *like that, yes, like that,* and Kevin followed her voice and she felt him follow her voice and she felt it." },
  { type = "paragraph", content = "It was good. That was the part she had not planned for. That was the part she had assumed she would not have to confront because she had expected the act to be mechanical, to be a thing she executed and got out of. It was not mechanical. Her body was responding. Her body had been, for a year and a half without her admitting it, the kind of body that can respond to something other than Daniel, and a mouth that was not Daniel's mouth and a pair of hands that were not Daniel's hands were telling her body something that her body agreed with, and her body agreed with it loudly, and she let it." },
  { type = "paragraph", content = "She did not cry. She did not think about Daniel, except in the flicker of the classroom image that kept arriving. She thought about her own hands. She thought about the specific pressure of her own hands on the back of Kevin's neck." },
  { type = "paragraph", content = "When it ended she let it end. She did not perform anything. She did not thank him. She did not pretend. She let it end the way it ended." },
  { type = "paragraph", content = "She lay there and she listened to her own breathing come back and she understood, with a clarity that was colder than anything the afternoon had delivered, that she was good at this." },
  { type = "paragraph", content = "That was the sentence. She would go on for years trying to articulate the sentence that arrived in the yellow light of the bedroom over the neighbor's garage, and the sentence, all along, had been the simplest one. She was good at this. She had been good at this from the first hand on the wrist. The planning had been good. The execution had been good. The read of Kevin's kindness had been good. She had done a hard and cruel and deliberate thing, and she had done it competently, and the competence was the thing she was going to have to carry." },
  { type = "paragraph", content = "The yellow lamp was still on." },
  { type = "paragraph", content = "The wallpaper was still misprinted." }
]
exit_block = { type = "choices", choices = [
  { text = "Continue", targetType = "node", nodeId = "prologue_morning_with_daniel.after", time_progression_minutes = 60, flagEffects = [ { targetType = "player", flag = "prologue_crossed_line" } ] }
] }

# ─── N8 ── after — Bathroom, mirror, walk home ───────────────────────────────
[[canvases.nodes]]
id     = "after"
name   = "Cold Feet"
blocks = [
  { type = "paragraph", content = "She got up before he did." },
  { type = "paragraph", content = "She gathered her clothes from the floor where they had ended up and she put them back on in the order she had taken them off, which was not the order Daniel would have put them back on, because Daniel rushed, and she was not rushing. The stockings. The dress. The shoes. She stood in front of the small mirror on the back of the door and she did not look at the woman in the mirror, exactly — she looked at the door itself, at the paint around the hinge where the last occupant had scraped something with the tip of a key, at the long line of chipped wood along the bottom edge, at the way the whole door had been painted over its scrapes so many times that the paint stood up from the wood in a landscape of its own. She looked at the door until she had her breath back." },
  { type = "paragraph", content = "Kevin was on the bed behind her. She did not turn to look at him. She did not say anything to him. She did not know what she would say if she did. She did not know if she wanted to know." },
  { type = "paragraph", content = "She opened the door and she walked out." },
  { type = "paragraph", content = "The hallway was empty. The music from downstairs was still going. The bathroom at the end of the hall had its door open and the light on, and someone — not her, someone earlier — had left a makeup bag on the edge of the sink, pink, with a cartoon strawberry on it, the strawberry's seeds drawn with the particular clumsiness of a designer who had never actually looked at a strawberry, and she stood in the doorway looking at the strawberry for longer than she should have." },
  { type = "paragraph", content = "She went in. She closed the door. She locked it." },
  { type = "image",     props = { file = "prologue/n8_mirror.jpg", description = "A bathroom mirror. The edge of a face. A pink makeup bag with a cartoon strawberry.", search_queries = ["party bathroom mirror young woman face edge reflection", "private bathroom sink pink cartoon strawberry makeup bag", "quiet bathroom mirror woman alone after"] } },
  { type = "paragraph", content = "In the mirror above the sink there was a woman she was not going to look at directly. She washed her hands. The soap in the dispenser was a brand she did not recognize — something floral and too sweet. She used too much of it. She rinsed. She used the towel that was on the rack, which was a towel that had been used by a dozen people already that night, and she did not care." },
  { type = "paragraph", content = "She sat down on the edge of the bathtub." },
  { type = "paragraph", content = "Her feet were cold. She did not know where her feet had gotten cold. She looked at the rug on the bathroom floor, which was a rug with a geometric pattern in faded blue and faded red, and she noticed a small stain in one corner, the color of coffee, too small to care about, placed exactly where she was looking." },
  { type = "paragraph", content = "She was not going to cry here. She was not going to cry at all, she understood now, and the not-crying was going to be a thing she would have to explain to herself later, when she had the energy to pretend to explain things." },
  { type = "paragraph", content = "The tile in the bathroom was the wrong pattern. The grout had been replaced in some places and not in others. There was a hair on the wall by the shower that belonged to someone she was never going to meet." },
  { type = "paragraph", content = "She stood up." },
  { type = "paragraph", content = "She came out of the bathroom and she went down the stairs with the specific dignity of a person who had decided that dignity was a thing she was going to have to perform whether or not she believed in it anymore, and she walked through the living room and she waved once at Adam, who was in the kitchen, who did the wave-thing back without looking up, and she opened the front door and she stepped out onto the street, and the night air hit her, and the night air was colder than she had expected." },
  { type = "paragraph", content = "She started walking. She did not order a car. She walked because walking was a thing her body could do, and her body could do it, and she wanted the long version of the trip home." },
  { type = "paragraph", content = "Somewhere a few blocks from Adam's house there was a dog barking behind a fence. The dog was barking at nothing. The barking rose and fell. She kept walking." },
  { type = "paragraph", content = "The house behind her was a house she was never going to be inside again. She knew this because she decided it as she walked, and because deciding it was the smallest thing she could do." }
]
exit_block = { type = "choices", choices = [
  { text = "Continue", targetType = "node", nodeId = "prologue_morning_with_daniel.diana", time_progression_minutes = 20 }
] }

# ─── N9 ── diana — Collapse, Diana's call, drive, player choice ──────────────
[[canvases.nodes]]
id     = "diana"
name   = "The Driveway"
blocks = [
  { type = "paragraph", content = "Monday, Kevin broke up with Sarah." },
  { type = "paragraph", content = "He did not call Maya. He did not need to. Kevin was, it turned out, the kind of man who cleaned up his own house quietly, and on Monday morning he drove to Sarah's apartment and said the things he needed to say, and then he left, and then on Tuesday Sarah called Maya thirteen times." },
  { type = "paragraph", content = "Maya did not answer." },
  { type = "paragraph", content = "By Tuesday evening Daniel had heard. Daniel called her. She let it go to voicemail. The voicemail was ninety seconds long — not the anger she had expected, just a long arc of confused crumpling about what had happened, and then him saying, in the voice he used when he had run out of anger and was about to say the real thing, *did you know about me and Sarah.* She listened to the voicemail once and then she deleted it." },
  { type = "paragraph", content = "By Wednesday Sarah had stopped calling and started writing. Long paragraphs of text. What Sarah wrote was not what Maya had expected. Sarah did not apologize. Sarah explained — the way Sarah explained things — in careful paragraphs about feelings and about Daniel and about how the three of them had been, in some rare fictional telling, equally complicated. Sarah's version of events placed Sarah in a particular lighting. Maya read the paragraphs once each and did not respond." },
  { type = "paragraph", content = "By Wednesday evening the group chat had gone quiet." },
  { type = "paragraph", content = "By Thursday it was everyone. People Maya had known since freshman year did not respond to the regular flow. A post she made on Instagram in the afternoon got six likes — her mother, her aunt, two bots, a girl from her art class who was always three steps behind on social information, and Kevin. Kevin, who had liked it without saying anything. Kevin, who would probably never say anything to her. Kevin, who was, she understood now, the only other person in the world who knew exactly the shape of the thing." },
  { type = "paragraph", content = "On Thursday Diana called." },
  { type = "paragraph", content = "Her mother was not a person who called without a reason. Diana called when she had a reason, and Maya recognized the weight of the number on the screen the way you recognize the weight of a letter before you open it. She answered." },
  { type = "dialog", content = "Hi, mom.", props = { speaker = "player" } },
  { type = "dialog", content = "Hi, honey.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "The silence between them was a specific silence. Diana had a way of making a silence that let the other person walk into it at whatever pace they needed." },
  { type = "dialog", content = "I heard.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "dialog", content = "Who.", props = { speaker = "player" } },
  { type = "dialog", content = "Your aunt.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "dialog", content = "Who told her.", props = { speaker = "player" } },
  { type = "dialog", content = "I didn't ask.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Maya sat on the couch and held the phone and did not say anything." },
  { type = "dialog", content = "I'm not going to ask you what happened. You don't have to tell me.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "dialog", content = "Okay.", props = { speaker = "player" } },
  { type = "dialog", content = "I called because I thought you might want somewhere to go.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Diana lived with Frank now. Frank was her second husband, whom Maya had met twice, who had a house on a big piece of land in a state Maya had been to once, for an Easter, when she had been fifteen. The house had a porch. The porch had a swing. The summer would be hot there, her mother had said the last time they had talked, in the tired voice Diana used now instead of the one she had used before Maya's father had died." },
  { type = "dialog", content = "The house is big. Frank's two boys are home for the summer but there's a room. You can stay as long as you need.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Maya did not say anything. Diana waited a beat. When Maya did not fill the silence, Diana did the thing Diana did when she was about to say the useful part." },
  { type = "dialog", content = "And there's a community college in Millhaven. Twenty minutes from the house. It's a good one — better than people give it credit for.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Maya closed her eyes." },
  { type = "dialog", content = "I'm not telling you what to do, honey. I'm telling you the math. If you transferred in the fall you'd be paying a fraction of what you're paying now. And you'd be living here, so no rent. No food. I'd do your laundry if you let me. You'd come out the other end of this without the debt you've been building up, and you'd still have the degree.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Maya opened her eyes. Her mother had been counting. Her mother had been doing the numbers for her, quietly, over months probably, waiting for a moment she could say them without it sounding like she was asking. This was the moment. Her mother was not asking." },
  { type = "dialog", content = "Mom.", props = { speaker = "player" } },
  { type = "dialog", content = "It's a place to be, Maya. That's all I'm saying. It's a place to be, and it's a good school, and the summer is long. Think about the school thing when you get here. You don't have to decide on the drive.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "Maya did not cry. She had known she was not going to cry when her mother said the thing she had said, because her mother had said it the correct way, which was as a fact rather than as a rescue, and a fact did not require tears. Nothing about Diana's offer was performance. The numbers were real. The room was real. The college was real. The summer was long. The summer could be longer." },
  { type = "dialog", content = "Okay. Thank you.", props = { speaker = "player" } },
  { type = "dialog", content = "Drive down when you're ready. Whenever that is.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "dialog", content = "Okay.", props = { speaker = "player" } },
  { type = "dialog", content = "Honey.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "dialog", content = "Yeah.", props = { speaker = "player" } },
  { type = "dialog", content = "I love you.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "dialog", content = "I know.", props = { speaker = "player" } },
  { type = "paragraph", content = "Diana ended the call the way Diana ended calls, which was without saying goodbye, because Diana believed in ending calls the way you end a conversation in person, by simply stopping. The phone went dark in Maya's hand." },
  { type = "paragraph", content = "She packed that night. She packed the way she did everything. In order. The clothes she wore to work. The clothes she slept in. Her sketchbook, which she wrapped in a t-shirt because the spine had been coming loose. Her paints. The one photograph of her father she carried from place to place. She did not pack the dress from Adam's house. The dress was in a black trash bag already, had been in the trash bag since Sunday afternoon, tied at the top, set by the door to go out with the garbage on Wednesday. Wednesday had come and gone and the bag was still there. She picked it up now and she took it down to the dumpster in the alley, and she dropped it in, and she watched it settle between a cardboard box and a bag of something wet, and she walked back upstairs." },
  { type = "paragraph", content = "She was in her car by morning." }
]
