  { type = "image", props = { file = "activities/college_admin.jpg", description = "Small community-college administrative satellite office, one room off Main Street in Millhaven, mid-day weekday. Wooden brochure rack three feet wide on the right wall, four shelves of folded tri-folds. Wooden application desk at the back of the room with two chairs in front of it (neither sat in this morning), the clerk on a wooden stool behind the desk reading paperwork. Coffee mug cooling on the corner of the desk. Late-morning Southern small-town light through a single front window. The community college campus visible through the gate at the end of the block beyond the office. Maya in jeans and a t-shirt approaching the brochure rack.", search_queries = ["small community college admin satellite office brochure rack wooden desk Southern small-town", "rural community college storefront one-room admin office brochure rack mid-morning weekday clerk", "1980s American community-college satellite office Main Street wooden brochure shelves application desk clerk"] } },

  { type = "paragraph", content = "The college admin office was one room off Main Street, the kind of room a community-college satellite occupied when the satellite did not need more than one room. A wooden brochure rack on the right wall, three feet wide, four shelves of folded paper that looked as though they had been folded by the same hand at the same hour for some number of years. An application desk at the back, two chairs in front of it, neither chair sat in this morning. The clerk on a wooden stool behind the desk. Her coffee cooling on the corner of the desk. The paper smell of the un-stocked third shelf in the back of the room." },

  { type = "paragraph", content = "Maya stood at the rack and read the headings on the spines. *Welcome / Programs / Tuition and Aid / Apply / Visit the Campus.* The tri-fold for the summer term sat on the third shelf in three rows, the way the brochures sat in three rows of three because the rack had been stocked at the hour the rack always got stocked. She lifted one off the shelf. The paper was the kind that held a fold for years. The cover photograph was a brick building she would later see through the gate at the end of the block." },

  { type = "paragraph", content = "She turned to the desk with the brochure in her hand the way a person turned to a desk to pay for a thing she was not going to pay for. The clerk lifted her eyes once and let them drop again. The clerk said come back when you're ready and did not look up to say it. The voice was the voice of a woman who had said the line to some number of girls at some number of hours of some number of weekday mornings. Maya did not say a thing back. Saying a thing back was not the line the clerk had asked for." },

  { type = "paragraph", content = "Outside the office the sidewalk was the sidewalk it had been ten minutes earlier. The college campus was visible through the gate at the end of the block — brick, a quad, a building with a window that might have been the art building she had read about on shelf one, in the brochure now folded into the back pocket of her jeans. The fold-line went where the fold-line on the rack-shelf brochures had gone. The math she would do later was already a thing the brochure had handed her without saying so." },
