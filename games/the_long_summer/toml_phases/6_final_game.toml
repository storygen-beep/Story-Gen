# ─── N10 ── drive — Southbound. Thinking about the house she's arriving at ───
[[canvases.nodes]]
id     = "drive"
name   = "Southbound"
blocks = [
  { type = "paragraph", content = "The radio died somewhere outside Memphis. She had not been listening to it anyway; it had been on because her hand had reached for the dial out of habit when she got in the car, and she had not bothered to find a station because she had not wanted to hear anything that was going to make her feel a specific thing. When the radio died she did not turn it back on." },
  { type = "paragraph", content = "The highway was the highway. Trees, then more trees, then a rest stop with a chain coffee she did not remember buying. Her hands on the wheel were steady in the same way they had been steady on Kevin's belt, which was a correspondence she did not want to notice and noticed anyway." },
  { type = "paragraph", content = "She thought about the house she was driving to." },
  { type = "paragraph", content = "She had met Frank twice. The first time was at an Easter when she had been fifteen and Diana had been married to him for maybe four months. Frank had been polite and quiet and had made her plate for her without asking how much she wanted, which had been the exact wrong amount, and he had said grace in a way that was not showy but was not negotiable either. The second time had been at a wedding, not his own, and he had worn a suit that fit and shaken Maya's hand like shaking hands mattered. She remembered the texture of his palm — rough in specific places, like he had done things with his hands for a living. She did not remember him speaking more than six sentences to her total." },
  { type = "paragraph", content = "Her mother had said the word *strict* about him exactly once, in a phone call, in a voice that was not complaining. *Frank keeps a house,* she had said. *Dinner's at six-thirty. Chores have owners.* That was the phrase that had stayed: *chores have owners.* Maya understood what it meant and had not, until now, thought about what it would mean to be inside it." },
  { type = "paragraph", content = "There were two sons. She had not met either." },
  { type = "paragraph", content = "Ryan was the older one. She knew that he worked on something mechanical — an engine shop, a salvage thing, something with a roof and a bay and a cash drawer. Diana had said he was *a good kid* in the voice Diana used about people she liked, which was measured and undramatic and you had to have known Diana a long time to hear the warmth in. The younger one was Jake. Jake went to a community college somewhere. Diana had said less about him, which might have meant nothing and might have meant Jake was hard to describe." },
  { type = "paragraph", content = "Three men in a house she had never been in. One of them her mother's husband. Two of them her mother's husband's sons." },
  { type = "paragraph", content = "She tried to picture them at a table." },
  { type = "paragraph", content = "She could not." },
  { type = "paragraph", content = "What she could picture, and kept picturing, was the shape of a hallway she had not yet seen. The sound a strange house made at night. The way bathroom doors locked differently depending on whose house you were in. The negotiations of breakfast. Whether Frank's two sons were the kind of men who looked at a woman in her pajamas, and whether they were the kind of men who looked and looked away, and whether they were the kind of men who made it her problem either way." },
  { type = "paragraph", content = "She thought about the rent. Her mother had said *no rent* in the phone call; Maya had already done the math on that and had decided she would pay Frank something anyway, because her pride would not sit at his dinner table eating food she had not earned. Whatever he asked, she would pay. If he did not ask, she would leave it on the kitchen counter and they would not discuss it. She had been doing the math on that for most of Kentucky." },
  { type = "paragraph", content = "She thought about the thing nobody in Millhaven knew." },
  { type = "paragraph", content = "Nobody in that house had any idea what she had done on Saturday night. Nobody there had any way of finding out unless she told them. That was the one mercy in the whole drive, and she was not sure yet whether it was actually a mercy or just a particular kind of pressure she was going to have to carry differently — the pressure of being, for the first time in her life, in a place where she was entirely herself, unwitnessed. Not the girl who wouldn't let her ex see her cry. Not the best friend who had figured out the shape of her own best friend on a desk. Just a nineteen-year-old with a suitcase and a mother who was waiting on a porch." },
  { type = "paragraph", content = "She did not know yet which would be harder." },
  { type = "paragraph", content = "By the time she was in Frank's county the light was slanting the way it slanted at the end of summer days in places that smelled like pine and heat and the specific rust of dry red earth. She pulled off the highway. She drove the last six miles on a two-lane road. The driveway was not marked. She almost missed it. She turned in." },
  { type = "paragraph", content = "The gravel popped under her tires." },
  { type = "image",     props = { file = "prologue/n9_driveway.jpg", description = "A gravel driveway through pines. The house at the end. The light at the end of a summer day in a place that smells like red earth.", search_queries = ["gravel driveway through pines rural house sunset south", "southern farmhouse end of long gravel drive summer evening", "country home property arrival late afternoon red earth"] } },
  { type = "paragraph", content = "The house stood at the end of the driveway." },
  { type = "paragraph", content = "She had one thing to do before she turned the engine off." },
  { type = "paragraph", content = "Her phone was in the cup holder. Sarah's name was in her contacts, still, which was its own specific kind of fact. She picked up the phone. She held it. She looked at the house through the windshield and she thought about the currency of the friendship she had spent, and about Sarah's careful paragraphs, and about the three words she had been turning over in her head for most of the drive." }
]
exit_block = { type = "choices", choices = [
  { text = "Leave Sarah a voicemail. One sentence. \"I saw you.\"", targetType = "location", locationId = "loc_front_porch", time_progression_minutes = 1440, effects = [{ targetType = "player", trait = "energy", op = "set", value = 70 }], flagEffects = [{ targetType = "player", flag = "met_daniel" }, { targetType = "player", flag = "prologue_cast_met" }, { targetType = "player", flag = "saw_daniel_and_sarah" }, { targetType = "player", flag = "kevin_approach_branch" }, { targetType = "player", flag = "party_scheduled" }, { targetType = "player", flag = "revenge_committed" }, { targetType = "player", flag = "prologue_morning_after_done" }, { targetType = "player", flag = "prologue_daniel_breakup_done" }, { targetType = "player", flag = "accepted_diana_offer" }, { targetType = "player", flag = "prologue_complete" }, { targetType = "player", flag = "left_sarah_voicemail" }] },
  { text = "Don't call. Just drive in.", targetType = "location", locationId = "loc_front_porch", time_progression_minutes = 1440, effects = [{ targetType = "player", trait = "energy", op = "set", value = 70 }], flagEffects = [{ targetType = "player", flag = "met_daniel" }, { targetType = "player", flag = "prologue_cast_met" }, { targetType = "player", flag = "saw_daniel_and_sarah" }, { targetType = "player", flag = "kevin_approach_branch" }, { targetType = "player", flag = "party_scheduled" }, { targetType = "player", flag = "revenge_committed" }, { targetType = "player", flag = "prologue_morning_after_done" }, { targetType = "player", flag = "prologue_daniel_breakup_done" }, { targetType = "player", flag = "accepted_diana_offer" }, { targetType = "player", flag = "prologue_complete" }] }
] }

