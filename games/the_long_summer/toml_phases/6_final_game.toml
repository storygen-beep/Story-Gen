blocks = [
  { type = "image", props = { file = "activities/ride_shotgun.jpg", description = "R5 Saturday pickup-run canvas. Truck-cab interior geometry — bench seat, Maya on the passenger side, Ryan driving. Windows down. Radio tuned to the AM country station Ryan's father listened to. Destination varies per Saturday: livestock auction on first-of-month; farmer up the valley on third-of-month; town scrap yard on odd-callouts; parts-store when parts-store. Maya meets Ryan at the shop at nine with two cups of gas-station-urn coffee. Outside-the-property register — first place in the summer that's not Frank's yard / kitchen / porch / diner. CONSEQUENCE (post-big-deal) = canonical silent-drive register per ryan.md body tell 'Silent drives'; Maya has turned the radio off after the first post-big-deal Saturday when the radio-only-sound-in-the-cab-for-seventeen-minutes landed too hard. POST_BEACH = Saturated-register drive with she-drives-sometimes-now autonomy-shift. Southern summer Saturday rural-driving geometry.", search_queries = ["pickup truck bench seat passenger young woman rural Southern afternoon drive Saturday", "older man driving younger woman passenger country road rural Southern US summer windows down", "1970s-style American pickup truck cab interior drive through farmland auction afternoon summer"] } },

  { type = "paragraph", content = "The pickup runs were whatever the run was that Saturday — the auction on the first-of-the-month Saturdays, the farmer up the valley on the third-of-the-month Saturdays, a scrap yard in town on the odd-callouts, a parts-store run when Ryan did not want to go alone. Maya met him at the shop at nine with two cups of coffee from the gas-station urn. He drove. She rode. The truck-cab was the first place in the summer that was not the property, and the truck-cab moved, and she had begun to count that as its own thing." },

