# MID SUB-NODE — R7's farmer arrival + three-prices interior + 3 corruption-tier fork choices verbatim
[[canvases.nodes]]
id = "mid"
name = "Mid-ticket"
blocks = [
  { type = "paragraph", content = "The afternoon at the counter had its own rhythm now. Ryan was in the work bay past the swing-doors, close enough that the customer heard the socket wrench and far enough that the counter belonged to Maya alone. Partner-tier choreography: Ryan audible, Ryan not-present, Maya visible and uninterrupted. The register at her elbow. The bell above the door. The parts-diagrams tacked to the wall at the corners where Ryan's thumb had pushed them in two summers running." },

  { type = "paragraph", content = "The farmer came in at two-ten. Red John Deere cap, sweat-ring where the band had held, the heat of the parking lot coming in with him — hot-metal and the faint sour of two-day-old sweat on a denim collar. He stopped a half-step into the room the way men stopped who had expected Ryan and found someone else at the counter, and then he read her the way a man read the front of a room he was not yet sure he was paying to stand in. Maya did not help him read. She let him finish. He walked the three steps to the counter with the walk of a man who had decided to stay, and the deciding was the first thing she had won in the afternoon without having said anything yet." },

  { type = "paragraph", content = "\"Battery,\" he said. \"Like the one Ryan sold me last time.\" Ryan had sold him one last time. The shelf had the number on the price tag in black marker on masking tape — thirty. He read the shelf. He read the counter. He read her. He said nothing else, because the price was the price and the reading was the part of the transaction that was different this Tuesday than it had been last Tuesday, and the reading was the part that was hers." },

  { type = "paragraph", content = "Thirty was the asking price. The asking price was the first number on the list of numbers available to a woman who had been at this counter long enough to know what the list was. Fifty was the number Ryan would have called the farmer-fold — the twenty-over a man paid when he had been told a number and had read the telling and had decided that the telling was worth the twenty. Sixty was the number a man signed his name under without knowing that thirty had been on the tag and that the thirty had become something else between his walking in and his walking out." },

  { type = "paragraph", content = "Ryan was in the work bay. She could hear the socket wrench. She could hear the silence that followed the socket wrench. The farmer was waiting on a number. She had three." },
]
exit_block = { type = "choices", choices = [
  { text = "Close at asking. Ring the thirty, slide the pen.", targetType = "trigger", time_progression_minutes = 60, effects = [
    { targetType = "player", trait = "energy", op = "add", value = -20 },
    { targetType = "player", trait = "money", op = "add", value = 30 },
    { targetType = "player", trait = "rep_road", op = "add", value = 1 }
  ] },
  { text = "Hold the look past the count that pays. Ring him at fifty.", targetType = "trigger", time_progression_minutes = 60, conditions = { version = "1.0", items = [ { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 35 } ] }, effects = [
