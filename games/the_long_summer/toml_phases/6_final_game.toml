# ── N1 — the_dinner ── Sunday dinner at the kitchen table. The good plates. The specific dish (memory intrusion). Diana's ONE Phase 1 spoken line. Saturated-band Maya narrator. All five NPCs at the table; four of the five are quiet; Diana's line is the room's only sentence.
[[canvases.nodes]]
id = "the_dinner"
name = "The Good Plates"
blocks = [
  { type = "image", props = { file = "story/keep_tier_fork/n1_good_plates_kitchen.jpg", description = "Southern kitchen table set for five with the good plates — blue willow or similar pattern, not everyday plates. A covered enamel pot on a trivet. A Pyrex bowl of dumplings or similar Sunday-dinner dish. Late-afternoon light through the kitchen window. Mother setting down the last plate. The table reads as Sunday, not everyday.", search_queries = ["southern sunday dinner kitchen table good plates blue willow covered pot enamel late afternoon light", "home-cooked chicken and dumplings flat kind sunday dinner southern kitchen five places", "mother setting sunday table good china family close light through window summer evening"] } },
  { type = "paragraph", content = "The second Sunday in October was the Sunday Diana made the flat-dumpling chicken, which was the Sunday Maya registered the thing she had not let herself register in the five Sundays before it — that Diana had been building toward a dinner since sometime in August, and the building had been slow, and the dinner was tonight, and Maya was the one it was being built toward." },
  { type = "paragraph", content = "The good plates were on the table. They were the blue-willow plates that lived on the top shelf of the left cabinet, the ones Diana had not put on the table since the Easter after the move. The napkins were the cloth ones, ironed flat. The iced tea was in the pitcher Diana brought out at company, not in the plastic jug the weekday tea came in. The overhead light was off and the pendant over the table was on, and the pendant had been on since Maya had come downstairs, which meant Diana had been at the table for longer than the dumplings had needed her. The kitchen smelled of chicken broth reduced down to the color of a low amber, of black pepper cracked that afternoon and not from the shaker, of the biscuit-flour kind of dough the flat dumplings were cut from before they went into the pot. The smell was not the usual Sunday smell. The smell was the Sunday-before-the-move smell, which was the smell of a kitchen Diana had learned to run as a wife, not as a widow remarried." },
  { type = "paragraph", content = "*The flat kind, not the round.* The sentence arrived at the volume of a voice heard a long time ago in a kitchen in Tennessee. Maya's father had said it every Sunday he had been able to say it, which had been the Sundays of her first eight years, and the saying had been part of the requesting and the requesting had been part of the routine, and the routine had ended on a Wednesday in her ninth year and had not been reassembled until this Sunday in this kitchen by this woman at this table. The flat kind, not the round. Diana had made them flat. Diana had cut the dough in strips with a knife and not with a glass. Diana had remembered." },
  { type = "paragraph", content = "Frank was at the foot of the table. Ryan was in the chair he always sat in on the brothers' side, the one closer to Frank. Jake was in the chair closer to where Diana would sit, which was the chair at the head. The fifth chair was the chair across from Jake, which was the chair Maya had sat in every Sunday since the second Sunday of August. It was pulled out. It was not the chair the extra place setting was at." },
  { type = "paragraph", content = "The extra place setting was next to Diana's, on Diana's right, where the empty chair from the extra leaf of the table had been pulled up. The blue-willow plate at that place was face-up. The flatware was aligned. The cloth napkin was folded in thirds. The chair had been pulled out for her." },
  { type = "paragraph", content = "Diana came from the stove with the pot and set it at the trivet at the center of the table. She straightened. She wiped her palms on the apron. She looked at Maya — not at the face, at the hand Maya had on the back of the chair Maya had been standing behind for forty seconds without sitting." },
  { type = "dialog", content = "Maya, honey. Set a place for yourself next to me.", props = { speaker = "npc", npcId = "npc_diana" } },
  { type = "paragraph", content = "The sentence was eleven words. It was the only full sentence Diana had said to Maya about anything that was not the grocery list or the laundry or the porch since the Monday in late May when Maya had carried her suitcase in off the drive. It was the sentence Diana had not said for four and a half months. It was the sentence Diana had been not-saying since the second week of July when the Thursday hour had started, and she had been not-saying it louder with each week, and the not-saying had been a discipline, and the discipline had been what made the saying of it tonight weigh what it weighed." },
  { type = "paragraph", content = "Maya moved to the chair on Diana's right. She pulled it in. She sat. The chair she had been standing behind stayed empty; the chair across from Jake, which had been her summer chair, was not her chair now. Frank registered the move without looking up from the plate. Ryan registered it by putting down the glass. Jake registered it by putting the glasses in his shirt pocket the way he had put them in his shirt pocket the Saturday of the brothers-discover dinner. None of them spoke. The dinner was the dinner. The plates went around. Diana served the dumplings into each bowl with the ladle that belonged to the good serving set, which was the ladle that had not been on the table since Tennessee." },
  { type = "paragraph", content = "Maya ate next to Diana. Diana's arm was warm in the space between them. The food was good. Maya had forgotten that her mother had been a cook before she had been a widow, and she had forgotten that the kitchen Diana had kept in the first house had been a different kitchen with a different arithmetic, and the remembering landed on the flat dumpling on the fork between her plate and her mouth and stayed." },
]
exit_block = { type = "choices", choices = [
  { text = "Finish the plate.", targetType = "node", nodeId = "keep_tier_fork.diana_in_the_kitchen", time_progression_minutes = 35 }
] }

# ── N2 — diana_in_the_kitchen ── Diana gets up for coffee, turns in the doorway, looks at Maya, doesn't speak, goes to make the coffee. Saturated Maya narrator reads Diana reading the signal. The look is the entire Phase 1 silence-discipline of Diana made visible in one turning-in-a-doorway.
[[canvases.nodes]]
id = "diana_in_the_kitchen"
name = "The Doorway, the Coffee"
blocks = [
  { type = "image", props = { file = "story/keep_tier_fork/n2_doorway_coffee.jpg", description = "An older woman turning in a kitchen doorway to look back at the table — soft Sunday-evening light, a table with dinner plates still on it, a younger woman seated at the head end. The look is held, the older woman does not speak, the look is the question.", search_queries = ["mother turning in kitchen doorway looking back at table sunday dinner evening warm light", "older woman at doorway quiet look to daughter across family dinner table fall evening", "charged domestic pause mother in doorway younger woman at table soft pendant light south"] } },
  { type = "paragraph", content = "Diana finished her plate before Maya finished hers. Diana always finished her plate before Maya did; Diana ate at the weight a woman ate at when she had been cooking since the men had come in from church at noon. She pushed back from the chair. She picked up her plate. She picked up Frank's plate because Frank had finished. She picked up Jake's fork because Jake had set it on the napkin. She did not pick up Ryan's plate because Ryan was still eating." },
  { type = "paragraph", content = "She carried the plates through the arch between the table and the kitchen. The kitchen was three steps in. The percolator was on the counter next to the stove. The can of Maxwell House was open on the counter next to the percolator. Diana set the plates in the sink, not on the counter. She ran the tap for a second, not for rinsing — the running-for-a-second was the signal to the table that the dishes had not been started yet, they were going to sit a minute — and she went to the percolator." },
  { type = "paragraph", content = "She turned in the doorway before she went to the percolator. She stood in the kitchen doorway and she looked at Maya. She did not smile. She did not frown. She did not say anything. She held the look for the count of three, which was the count past polite by two counts, which was the count Diana did not hold a look for, which was a count Diana had not held a look for since June." },
  { type = "paragraph", content = "Then she turned back into the kitchen and the percolator came on and the water ran for real this time and the can of Maxwell House got opened the rest of the way and the scoop went into the grounds and the grounds went into the basket and the basket went into the percolator. The sounds were the sounds. The sounds were the sounds of a mother making coffee for two cups, because the Sunday coffee after dinner was Diana and Frank and Frank did not drink coffee after Sunday dinner unless Diana had made it for two cups specifically, which was the Sundays Diana wanted the second cup for herself." },
  { type = "paragraph", content = "The look had been the question Diana had not asked all summer. The question she did not want the answer to had become — at some hour of some day Maya had not been counting — the question Diana had decided she did want the answer to, and the wanting had become a thing Diana had been holding behind her not-asking, and the holding had filled up until the holding could not hold anymore, and the not-asking had come out on a Sunday night through the Maxwell House and the ironed napkin and the chair on her right and a single sentence said in daylight at a volume anyone at the table could hear, and then the not-asking had put itself back on — as the look, which was the form of the question when the woman asking it was Diana." },
  { type = "paragraph", content = "Frank did not stand. Ryan did not stand. Jake did not stand. The three men at the table were waiting to see what Maya did next, and each of them had a stake in what she did next, and each of them was sitting in the chair he was sitting in at the weight his stake put him at. Diana was in the kitchen making coffee. Diana did not have a stake; Diana had already decided to accept whichever Maya Maya was going to be tonight, and the percolator was the shape that acceptance took while it waited." },
  { type = "paragraph", content = "Maya stood." },
]
exit_block = { type = "choices", choices = [
  { text = "To the doorway.", targetType = "node", nodeId = "keep_tier_fork.the_choice", time_progression_minutes = 5 }
] }

# ── N3 — the_choice ── Maya in the kitchen-doorway / dining-room threshold. The five body-possibilities preview. Same architecture as frank_call_out N3 four-possibilities but scaled to five and tightened (the rehearsal is familiar now). Saturated voice — she sees them without effort. No catalog language.
[[canvases.nodes]]
id = "the_choice"
name = "Five Rooms"
blocks = [
  { type = "image", props = { file = "story/keep_tier_fork/n3_five_doors.jpg", description = "A woman at a dining-room-to-kitchen threshold, dinner just finished, five possible destinations around her implied by angles and framing — a kitchen doorway with coffee being made, a dining-table setting behind her, a window showing a yard at dusk, a hallway leading off, and a staircase visible through an opening. Late-Sunday-evening light.", search_queries = ["woman at dining room kitchen threshold choosing where to go sunday dinner ended southern", "charged pause threshold between rooms five destinations possible sunday evening interior", "young woman standing at transition between rooms in family home evening october light"] } },
  { type = "paragraph", content = "She stood at the space between the dining room and the kitchen and saw them. She did not catalog them. The catalog was done. She saw them the way she saw the coat on the hook and the shoes by the door and the truck-keys on the hook — inhabited, arranged, inside the hour they were in." },
  { type = "paragraph", content = "The kitchen. The doorway she had watched Diana turn in. Three steps in, past the arch, the percolator on the counter, Diana at it with her back to the doorway. The second cup was on the counter. Diana had set it out before she had asked the scoop to go into the basket. The second cup was for Maya if Maya came through the arch now. The morning Phase 2 opened on, if this was the choice, would be the morning the two of them had the kitchen and the house, and the house would be the house the mothers had and the men were around the edges of." },
  { type = "paragraph", content = "The table. Frank across it. The length of it between them the way the length of the office desk had been between them on the Thursday of the Call-out. She could sit back down. She could hold his eye across the plates that had not been cleared past his side. The pendant was still on. The pendant would go off when the dishes came off the table, and the going-off would be the seal on whatever look had passed between them in the minutes before. She knew the Thursday ritual she had been walking to for seven Thursdays. She knew what the Monday-Tuesday after would be if tonight was the Frank night." },
  { type = "paragraph", content = "The yard. Ryan had gone out to the shop after his plate, when Diana had been clearing. The porch light was on. The screen to the back porch was closed but not latched. The shop door at the far side of the yard was closed — he was in the shop, at the tarps, at the bench. He had drunk water at dinner and not beer, and the not-beer had been a thing he had done to himself before the dinner started, on the chance of tonight. She had not given him a signal either way. He had made the not-beer choice alone. The Ryan morning was the morning after the shop, which was the morning the pickup cab was a room she was in before the diner shift." },
  { type = "paragraph", content = "The hall. Down past the staircase, the left hallway, Jake's room at the end. The third-floor light had been on when she came down to dinner and it had still been on when she sat. He had not looked at her at the table beyond the glasses-in-the-shirt-pocket gesture. He had been waiting the same way Ryan had been waiting, at a different weight. The Jake morning was the morning the tooth-paper had three new pages and he did not have to hide them, and she did not have to not-have-seen them." },
  { type = "paragraph", content = "Her own room. Up. Fourteen stairs. The door at the top of the landing, closed quietly behind her at the weight she closed doors at now. The room she had mapped with her eyes closed on her first morning and had been mapping with her eyes open for four months since. Her bed, her sketchbook on the desk, the window she had not closed because the October air was the air she had learned this summer. The Deferred morning was the morning nothing had been said to anyone, and the not-having-said would be the thing she carried into Phase 2 as its own kind of weight." },
  { type = "paragraph", content = "Five rooms. The five were hers. The rehearsal was over; the rehearsal had been the summer. Her body had been leaning toward one of them for a count of days now, and the count had ended some earlier hour of this Sunday, and what her body was doing in the doorway was remembering which of the five it had decided on before the dinner had started. She took the first step." },
]
exit_block = { type = "choices", choices = [
  { text = "Commit.", targetType = "node", nodeId = "keep_tier_fork.the_route_locked", time_progression_minutes = 1 }
] }

