# ── N1 — the_doorway ── 1 a.m. hallway. Maya mapping the dark. The cracked door. The pencil sound separates from the house-sounds. She looks.
[[canvases.nodes]]
id = "the_doorway"
name = "A Pencil in the House"
blocks = [
  { type = "image", props = { file = "story/jake_peek_discovery/n1_hallway_door_crack.jpg", description = "A dim upstairs hallway at 1 a.m. — stair-top nightlight throwing yellow against the runner, a bedroom door cracked two fingers wide with a strip of lamp-light inside, everything else dark.", search_queries = ["dark upstairs hallway night runner carpet nightlight bedroom door cracked open strip of light", "1 a.m. house hallway warm lamp light through cracked door quiet charged", "suburban southern house hallway late night yellow nightlight one door ajar"] } },
  { type = "paragraph", content = "She had been awake when the house cycled into its one-a.m. quiet. She had been awake because the window in her room was open and the cicadas were still running their August run even with September turned over on the calendar, and because she had been lying in the dark without trying to sleep, and the not-trying had been its own kind of work." },
  { type = "paragraph", content = "She got up. She did not turn on the lamp. She had been mapping Frank's upstairs hallway with her eyes closed since the second week, and the map was reliable enough by now that she could walk from her door to the bathroom door without the runner under her foot surprising her." },
  { type = "paragraph", content = "The hall was dark the way the hall was dark at one a.m. — the stair-top nightlight throwing yellow against the runner for three feet at the top of the stairs, and nothing past that. Diana was asleep at the far end. Frank was asleep in the master. Ryan's door was closed. The house made the sounds a house made at one a.m.: the refrigerator, the settle of a floor-joist, the cicadas through the window at the end of the hall." },
  { type = "paragraph", content = "Jake's door was cracked." },
  { type = "paragraph", content = "She registered the door before she registered why she was registering it. The door had been closed every other night she had walked this hall. Tonight it was not closed. The gap was two fingers wide. The strip of light inside the gap was the low one — the desk lamp, not the overhead." },
  { type = "paragraph", content = "She slowed." },
  { type = "paragraph", content = "The sound that had been a house-sound a second ago separated itself. A pencil. The small quick scratch of a pencil on paper. She had grown up around a mother who had been a charcoal-drawer before Maya was born, and she knew what a pencil on a tooth-paper sounded like when the hand moving it was working not doodling. She knew the sound of work. She had been hearing it, or she had been hearing it without hearing it, since she had left her room." },
  { type = "paragraph", content = "She came level with the crack. The strip of light threw a thin line across her bare feet and across the runner, and the line landed at the baseboard on the far side of the hall." },
  { type = "paragraph", content = "She did not mean to look." },
]
exit_block = { type = "choices", choices = [
  { text = "Look.", targetType = "node", nodeId = "jake_peek_discovery.the_drawing_revealed", time_progression_minutes = 0 }
] }

# ── N2 — the_drawing_revealed ── One second at the crack. Jake at the desk, glasses on, pencil moving. The page. The woman on the page is her.
[[canvases.nodes]]
id = "the_drawing_revealed"
name = "The Chip at Four O'Clock"
blocks = [
  { type = "image", props = { file = "story/jake_peek_discovery/n2_desk_drawing_page.jpg", description = "A lean young man in glasses and a black t-shirt hunched at a small wooden desk under a gooseneck brass lamp, a large-format tooth-paper sheet in front of him, a pencil drawing of a seated woman mid-render on the page — seen from the hallway side, through a cracked door.", search_queries = ["young man glasses drawing at desk late night gooseneck lamp wide-format paper pencil sketch of woman", "artist working figure drawing bedroom desk black t-shirt pencil on tooth paper seated nude study", "hunched draftsman at desk lamp late night art student bedroom doorway view dim"] } },
  { type = "paragraph", content = "The desk was in the far corner of the room under the one dormer window. The lamp on the desk was the desk lamp, a gooseneck brass one with an old paper shade, and the light from it was the kind of light that pulled the edges of things out of the dark without lighting anything else in the room. Jake was at the desk with his back half to the door." },
  { type = "paragraph", content = "He was in a black t-shirt, the sleeves hitting him above the elbow. His glasses were on. His hair was pushed back off his forehead because he had pushed it back with the inside of his wrist sometime in the last ten minutes and the wrist-push was still holding, the way a wrist-push did on his kind of hair for a while before the hair fell forward again. He was hunched slightly. His right hand was moving." },
  { type = "paragraph", content = "The page on the desk was wide-format, not his sketchbook. It was the heavier paper, the good paper, the tooth-paper she had watched him buy at the general store on a Thursday in August when he had paid cash from a folded bill and had not said hello to her even though she had been two aisles over." },
  { type = "paragraph", content = "The page had a woman on it." },
  { type = "paragraph", content = "The woman was most of the way drawn. The woman was sitting up in a bed with one knee drawn toward her chest and the other leg flat, the weight of her on one hip, her hair in the angle of a thing that had just been let down. The lamp beside the bed in the drawing was the little ceramic lamp from Maya's room — the one Diana had put on the nightstand the day Maya arrived, the one with the small chip on the base at four o'clock. He had drawn the chip. He had drawn the exact angle of the chip." },
  { type = "paragraph", content = "The woman's face was the face Maya had seen in the bathroom mirror on Tuesday morning while she brushed her teeth and thought about Frank's office and how the office smelled, which was a thing she had been thinking about on Tuesday mornings for two weeks. The mouth was her mouth. The angle of the jaw was hers. The shoulders were hers. The faint mole at the collarbone was hers. He had drawn the mole." },
  { type = "paragraph", content = "She did not breathe in for a count." },
  { type = "paragraph", content = "She stepped back. She did it quietly. She did it without letting her weight come down on the runner at the spot where the runner was thin over the floorboard that creaked. She had mapped that board two weeks ago. She stepped around it the way she had learned to." },
  { type = "paragraph", content = "He did not look up. The pencil kept moving." },
  { type = "paragraph", content = "She walked to the bathroom. She did not turn on the overhead; the cord in the ceiling made a click sound and the click was not a sound she was going to make tonight. She pulled the door closed behind her at the weight that door came closed at without a sound." },
]
exit_block = { type = "choices", choices = [
  { text = "Close the door.", targetType = "node", nodeId = "jake_peek_discovery.the_decision", time_progression_minutes = 2 }
] }

# ── N3 — the_decision ── The bathroom. Not looking in the mirror (callback to mirror_look Opening-band — she has been looked at; the mirror is not what needs checking). The two futures. Exit is the 2-way fork preserving original flag effects exactly.
[[canvases.nodes]]
id = "the_decision"
name = "Two Ways Down the Hall"
blocks = [
  { type = "image", props = { file = "story/jake_peek_discovery/n3_bathroom_back_against_door.jpg", description = "A small upstairs bathroom at 1 a.m. — overhead off, a small wall clock above the medicine cabinet, the mirror visible but a young woman standing with her back against the closed door rather than facing it. Window cracked, cicada-night outside.", search_queries = ["small upstairs bathroom night mirror medicine cabinet wall clock woman back against door", "young woman standing with back to bathroom door not facing mirror late night tension", "southern home bathroom late night window cracked cicadas wall clock private moment"] } },
  { type = "paragraph", content = "She did not look at herself in the mirror." },
  { type = "paragraph", content = "She had been the kind of Maya who did not hold her own eye in mirrors and the bathroom at Frank's house had been the bathroom it had been for weeks, and a week ago she had started to be the kind of Maya who held her own eye for one second, then two, then four. Tonight the mirror was a thing she was not going to consult. She had been looked at. The looking had been done for her. The face in the mirror was not the face that needed checking." },
  { type = "paragraph", content = "She stood with her back against the door. The tile under her feet was cold. The hum of the bathroom fan was off; she had not pulled the cord. The window over the bathtub was cracked the same two inches every bathroom window in Frank's house was cracked at the end of summer, and the cicadas came through it the way they came through the window at the end of the hall. The small green tick of the wall clock above the medicine cabinet was the loudest sound in the room." },
  { type = "paragraph", content = "She let herself think about what she had seen." },
  { type = "paragraph", content = "He had been drawing her. He had drawn the chip in the lamp and the mole at her collarbone. He had drawn from memory, or from looking — she did not know which, and the not-knowing was a piece of the information now, and the information was hers. He did not know she had seen. He was on the other side of the hall with his glasses on and his pencil moving, making a woman on a page, making *her* on a page, and the him of tonight on the other side of the wall was not yet the him of tomorrow when he would sit at breakfast and not look at her and not know that she knew." },
  { type = "paragraph", content = "The two ways to do what came next were in the room with her." },
  { type = "paragraph", content = "She could step back from this door. Walk the hall back the way she had come. Close her own door behind her. Carry the knowledge into the part of her days that was hers and nobody else's. He would not know she knew. The not-knowing would be a thing she owned." },
  { type = "paragraph", content = "Or she could go back down the hall. Push his door wide. Stand in his doorway in the strip of his lamp-light and wait for him to look up, and let him see her seeing. The room would be the kind of room a room became when both people in it knew what had just happened, and the knowing would be a geometry she had made and not found." },
  { type = "paragraph", content = "The second way was a Maya who had not been all the way in the bathroom a minute ago." },
  { type = "paragraph", content = "She looked at her feet on the tile. She did not look at the mirror. Outside, a car on Route 9 changed gears for a hill. The cicadas held their count." },
]
exit_block = { type = "choices", choices = [
  { text = "Walk back to her own room. Carry it.", targetType = "trigger", time_progression_minutes = 15, effects = [ { targetType = "player", trait = "calculation", op = "add", value = 1 } ], flagEffects = [ { targetType = "player", flag = "jake_peek_draw_open" }, { targetType = "player", flag = "jake_peek_draw_revealed" }, { targetType = "player", flag = "jake_tease_open" } ] },
  { text = "Go back down the hall. Let him see her seeing.", targetType = "trigger", time_progression_minutes = 15, conditions = { version = "1.0", items = [ { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 70 } ] }, flagEffects = [ { targetType = "player", flag = "jake_peek_draw_revealed" }, { targetType = "player", flag = "jake_caught" }, { targetType = "player", flag = "one_crack_this_chapter" }, { targetType = "player", flag = "jake_tease_open" } ] },
] }


