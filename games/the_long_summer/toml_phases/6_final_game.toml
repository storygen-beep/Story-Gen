  { type = "paragraph", content = "The property at one in the afternoon was the work the property carried on the weekend. Paint on the porch rail some Saturdays. The fence line along the back pasture other Saturdays. The barn-side lights or the gutter or the mower-blade some other Saturdays. Frank wore the belt he had worn when Maya arrived — the one with the hammer loop on the left because he was right-handed and reached across. She wore the t-shirt she did not mind getting drywall dust on. The yard heat. The pine-resin smell. Cicadas." },

