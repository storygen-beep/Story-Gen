blocks = [
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Pete came in the way Pete came in at the diner on Tuesdays — through the door without looking for where he was going, because he had been in this room as many times as he had been in the diner booth second-from-the-end. He did not need the engine. He needed an excuse to stop by. The dark-blue coveralls. The Hayes Hardware cap faded at the brim. The coffee-smell already on him from somewhere else. He set the thirty-dollar bill on the counter and took the carb-rebuild kit off the shelf himself. Pete the Tuesday-mechanic at the diner was Pete the Friday-afternoon-small-engine at the shop. Maya rang it up. She did not ask why he needed the kit." },

    { type = "paragraph", content = "The walk-in was a man she had never seen before and would not see again. A trailer ball on the counter. The price at nine dollars was the price on the shelf at nine dollars. He had brought a ten. He waited for the dollar back in a way that made clear the dollar was the whole thing. She gave him the dollar. She gave him the bag he had not asked for. He took both. He left. The transaction had been the transaction and then the transaction had ended, and the bell on the door was the sound of it ending." },

    { type = "paragraph", content = "The repeat buyer mentioned Ryan's uncle within the first three sentences. He mentioned Lake Wedowee within the first five. The story about the uncle at Lake Wedowee was the story a man told when he was in a shop where the owner's uncle had fished Lake Wedowee, because the shop was the place where the story earned its telling. Maya had heard Ryan's uncle mentioned by three customers this month and Lake Wedowee by two. She had learned to nod at the right count. The purchase was forty-two dollars of gasket and wire, and the man paid in twenties." },
  ] },
]
