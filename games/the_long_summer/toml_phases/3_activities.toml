[[canvases]]
id = "activity_family_dinner"
name = "Family dinner"
description = "Diana's 6:30 line. All three men plus Diana. — Rewritten 2026-04-25 (Session 21, Tier E batch #1 canvas 1 of 3 — first Tier E group canvas, 5 NPCs in scene). Hybrid universal-frame + 4-rotation block_pool + 4 mutually-exclusive Diana-awareness-band variant groups + 2 additive arc-state consequence groups (6 state-keyed variants total per priority_queue plan 'block pool keyed to diana_awareness × arc state'). Image with description + 3 search_queries (NEW — Rule 24 compliance fix; original had 1 bare query, no description). Universal frame paragraph (~70w table-geometry + Diana-carried-the-fifth-chair-in-from-the-back-porch-the-night-Maya-arrived + the-serving-spoon-in-the-okra-before-anyone-sat-down + the-angle-Diana-set-every-meal — Diana's ambient-organizing tell as silent scene-setting). 4 rotating-opening daily-typology pool entries (R1 Monday-okra-story-with-weather-detail / R2 Wednesday-pot-roast + Frank-folded-newspaper-from-news-hour / R3 Friday-chicken-fried + Ryan-came-in-late + Diana's-plate-already-covered-with-the-dish-towel-for-him + the-not-saying-anything-on-both-sides / R4 Sunday-leftover + Diana-stretched-the-Saturday-outdoor + the-rest-day-before-the-week-started) per Rule 19 anti-staleness. 4 mutually-exclusive Diana-awareness band variants matching diana.md band-table exactly: AWARENESS_LOW (<25, ~55w Closed-band Maya, Diana-doesn't-look-up-by-routine the-kitchen-running-at-the-kitchen's-pace, no Diana dialog) / AWARENESS_MID_LOW (25-49, ~60w Opening-band Maya, Diana-looks-up-smiles-doesn't-ask + Diana 8w dialog 'Plate's hot. There's extra if you want it.' canon signature + Maya 'the not-checking she had started doing with herself' distributed-self-recognition) / AWARENESS_MID_HIGH (50-74, ~60w Operating-band Maya, Diana-looks-up-doesn't-smile + Diana 6w dialog 'Plate's there if you want it.' canon mid-high signature + italic FID cat-d *if you want it* small-hard-edge invocation, the-edge-added-since-the-second-week register) / AWARENESS_HIGH (75-100, ~55w Saturated-band Maya, Diana-doesn't-look-up-at-all + the-kitchen-was-quieter canon line per diana.md 'High awareness — Doesn't look up at all. Kitchen quieter.' + Frank-ate. Ryan-ate. Jake-ate. subject-active-verb declarative cadence + the-not-saying-anything-was-the-kitchen-now Saturated possessive-of-the-room). 2 additive arc-state consequence groups: ONE_CRACK_THIS_CHAPTER (~55w the-brother-whose-week-had-cracked register + Diana-reads-the-table-better-than-anyone elevated craft note + she-did-not-say-so silence as Diana's mid-to-high-awareness deliberate-not-naming) / BROTHERS_DISCOVER (~60w post-Saturday Ryan-and-Jake-have-not-looked-at-each-other-since + Diana-refilled-the-okra-dish-she-had-emptied-once-already + the-keep-it-moving-was-the-hand-she-still-had-to-play Diana high-awareness work-of-cover). Maya-action exit upgraded from 3w 'Clear the table.' to 8w 'Stack the plates. Carry them to the sink.' per Rule 13 (Maya-the-quiet-helper body-tell). Strips 12 @npc_ token leaks (8 npc_diana + 2 npc_frank + 1 npc_ryan + 1 npc_jake) — first multi-NPC Tier E canvas, highest token-leak count of batch. Effects preserved exactly: trigger costs energy 5, exit time_progression_minutes 60 + energy +15 (net +10 dinner-restores-energy). 1 italic span (cat-d *if you want it* in MID_HIGH variant) across ~580w — well under ≤1-per-400 cadence cap. Zero banned phrases. Architecture (9): hybrid universal-frame + rotating-opening-pool + mutually-exclusive-Diana-awareness-4-band-variant-axis + additive-arc-state-consequence-overlays — first Tier E canvas establishing the 5-NPC-table-with-band-axis pattern. Cross-canvas: (a) Diana 'Plate's hot.' canon signature first surface (diana.md exact); (b) Diana mid-high 'Plate's there if you want it.' canon signature first surface (diana.md exact); (c) the-fifth-chair-Diana-carried-in-the-night-Maya-arrived register-anchor first surface (cross-canvas to brothers_discover Saturday-table where the longer-table is built outward but the kitchen-table compromise is the fifth-chair-Diana-carried-in); (d) Diana-reads-the-table-better-than-anyone register cross-canvas to brothers_discover N2 Diana-mid-high-awareness-not-asking + retains cross-canvas to diana.md 'voice you don't notice until she's already been heard'; (e) the-kitchen-was-quieter Saturated-band canon line first surface (diana.md exact line elevated to prose); (f) the-keep-it-moving-was-the-hand-she-still-had-to-play register first surface — Diana's high-awareness craft of refilling-things-no-one-has-eaten as cover-for-silence."

