s pre-Prologue art-history surfaces as a craft-instruction memory; forward-applicable to other sketch/art-related canvases. **Diana-Sunday-call cross-canvas anchor** [R1]: 'the things she would not say on the phone to Diana on Sunday' preserves original line's register-substance + relocates to one of the rotation-baselines; forward-applicable to other Diana-Sunday-call register markers (rent_shortfall + Diana-distance-cluster). Effects preserved exactly (energy cost 10, 60 min, no exit-block effects). 0 italic spans across 235w (Rule 22 sketchbook clean register — italic-cadence appropriately zero). Zero @npc_ tokens. Zero banned phrases. Zero NPC dialog (Maya-solo sketchbook canvas). Zero Maya dialog (FID register). Rule 10 smell ✗ (Rule 22 sketchbook canvas — graphite/pencil-shavings-implicit; not load-bearing here because the canvas's diagnostic-register is craft-attention not olfactory). Rule 22 art-as-honesty ✓✓✓ (canvas IS the rule). Rule 21 corruption-noticing surfaces in the flag-axis variants (Frank-variant the-part-she-could-draw-without-flinching is the corruption-noticing — Maya names what she CAN'T draw without flinching by naming what she CAN)."

