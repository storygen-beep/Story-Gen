beer-on-the-rail + Jake-with-a-glass-of-water-at-the-table-already-sketchbook-deliberately-not-in-his-lap Rule 22 inversion Jake-doesn't-bring-the-sketchbook-to-the-family-table). 4 rotating-opening week-typology pool entries: R1 chicken-and-corn (~50w + Frank-turned-the-chicken-by-the-count-he-had-been-turning-chicken-by-since-the-boys-were-small Frank-bodily-discipline-at-grill-mechanics + Ryan-reached-past-Frank-for-the-tongs-once-didn't-take-them-set-his-hand-on-the-rail-beside-the-plate-of-meat Ryan-style-sheet hands-doing-something-but-not-overstepping Phase A baseline) / R2 pulled-pork-and-coleslaw (~55w + Frank-had-been-up-since-six-with-the-smoker-the-slow-pulled-meat-fall-apart-the-way-he-had-taught-himself-the-year-after-the-divorce Frank-historical-anchor-the-year-after-the-divorce + Diana's-coleslaw-vinegar-base-no-mayo-the-way-Frank's-mother-had-made-it-the-way-Diana-had-learned-to-make-it-the-second-year-of-her-marriage Diana-adopting-the-household's-pre-existing-conventions register) / R3 ribs-and-baked-beans (~50w + dry-rub-Frank-had-mixed-in-the-morning-paprika-and-brown-sugar-and-the-cayenne-measure-he-never-wrote-down Frank-craft-knowledge-body-tell + the-cicadas-were-louder-when-ribs-were-on. Nobody knew why the-household's-invented-folklore register) / R4 fish-fry (~50w + catfish-Ryan-had-brought-back-from-the-creek-the-morning-before-cleaned-at-the-back-porch-sink-breaded-in-Diana's-cornmeal-mix-at-four cross-canvas to walk_creek Ryan's-creek-fishing register + Diana-wouldn't-let-Frank-fry-indoors-anymore-the-kitchen-curtain-incident-of-three-years-ago-having-settled-the-question Diana-rule-enforcer-too-not-just-emotional-discipline body-tell first surface). 3 mutually-exclusive Diana-awareness band variants gated on `npc_diana.awareness` numeric trait: AWARENESS_LOW (<25, ~60w Closed-band Maya, Diana-doesn't-look-up-by-routine + Maya-took-the-seat-at-the-long-end-nearer-the-rail-the-seat-she-had-been-taking-since-the-second-Saturday-when-Diana-had-set-a-plate-there-without-asking-and-Maya-had-understood-that-the-seat-had-been-chosen-for-her warm-low-band Diana-mother-knows-where-Maya-belongs register, no Diana dialog) / AWARENESS_MID_LOW (25-49, ~60w Opening-band Maya + Diana 4w dialog 'Sit down. Plate's coming.' porch-version-of-the-kitchen-smile-looser-at-the-corners-because-the-porch-was-the-looser-room + the-kind-of-welcome-that-made-you-have-not-had-to-think-about-whether-it-was Maya-Opening-band claiming-the-seat-as-her-own register) / AWARENESS_MID_HIGH (50-74, ~57w Operating-band Maya + Diana 2w dialog 'Plate's coming.' deliberately-LIGHTER-than-Tier-A — the-porch-absorbed-more-than-the-kitchen + Diana-mid-high body-tell present but softer-than-kitchen-version + the-not-looking-up-was-the-new-part Operating-band naming-the-geometric-acoustic-difference-between-rooms; deliberately stays out of Tier-A realization territory — no per-NPC body-tell cascade, no one-crack-most-recently NPC, no body-tell explosion. Just the mid-high register acknowledged in passing as part of Saturday-outdoor's louder-quieter geometry). 1 additive brothers_discover-already-fired consequence overlay (~55w post-Tier-A-realization Saturday-outdoor: Ryan-and-Jake-not-at-the-table-at-the-same-time + Ryan-ate-at-the-rail-with-his-back-turned-to-the-table-plate-balanced-on-the-post Ryan-style-sheet choosing-the-place-of-not-engaging body-tell + Jake-stayed-inside-the-screen-door-with-his-plate-half-in-the-kitchen-half-on-the-porch Jake-style-sheet doorframe-tell extended + Frank-kept-the-grill-going-past-the-meat-being-done-because-the-grill-was-his-place-to-be-alone-in-the-open-air Frank-staying-at-the-grill-as-not-having-to-sit-down body-tell). 8w Maya-action exit upgrade from 1w 'Inside.' to 'Carry plates in. Leave the platter for Frank.' (Maya-Phase-A-baseline body-tell of adopted-household-routine: Maya-knows-which-things-are-Frank's-territory-and-leaves-them per Rule 13). Strips 4 @npc_ token leaks (1 each: npc_frank + npc_diana + npc_ryan + npc_jake). Effects preserved exactly: trigger costs energy 10, schedule Saturday weekday=5 18:00-19:30, max_triggers_per_day=1, exit destinationType=trigger time 90min + energy +20 (net +10 dinner-restores-energy higher than family_dinner because outdoor-dinner is the relax-evening register). 1 italic span across ~497w (no italics — *Plate's coming* in MID_HIGH variant was originally italic but moved to dialog block per Rule 26 — italics only for FID-thoughts/memory/reading-fragments/verbal-tic-quoted-not-spoken; spoken dialog uses dialog block). Zero banned phrases. **Architecture (11): hybrid universal-frame + rotating-opening-pool + mutually-exclusive-Diana-awareness-3-band-variant-axis (HIGH-band-reserved-for-Tier-A-canon-partition) + additive-arc-state-consequence-overlay** — third Tier E group canvas; combines pattern (9) frame-plus-band-axis with deliberate-band-partition-to-respect-Tier-A-canon-boundary. The 3-band-axis (vs family_dinner's 4-band) is the canon-coexistence design constraint: HIGH-band Saturated register at the Saturday-outdoor location IS the Tier-A canvas's load-bearing register and shouldn't double-fire at lower priority. Cross-canvas: (a) **🎯 the-long-table-conversation-looser register first surface** (frame) — outdoor-table-as-its-own-acoustic-register (parallel to family_dinner kitchen-table-fixed-geometry); (b) **🎯 Frank's-grill-mechanics-bodily-discipline register first surface** (R1 turned-the-chicken-by-the-count-he-had-been-turning-chicken-by-since-the-boys-were-small) — extends Frank's discipline-of-eleven-years-alone body-tell to grill-craft; (c) **🎯 Frank-the-year-after-the-divorce historical-anchor first surface** (R2) — Frank's eleven-years-alone-between-first-wife-and-Diana register surfaces as cooking-self-taught body-tell; (d) **🎯 Diana-adopting-the-household's-pre-existing-conventions register first surface** (R2 second-year-of-her-marriage learned-to-make-Frank's-mother's-coleslaw) — Diana-as-second-wife adapting-to-the-household-she-married-into body-tell; (e) **🎯 Frank-craft-knowledge-no-written-recipe body-tell** (R3 cayenne-measure-he-never-wrote-down) extends discipline-of-eleven-years-alone register; (f) **🎯 the-household's-invented-folklore register first surface** (R3 cicadas-louder-when-ribs-on Nobody-knew-why) — the family's shared-fictions as relationship-architecture; (g) **🎯 Diana-rule-enforcer-too body-tell first surface** (R4 wouldn't-let-Frank-fry-indoors-anymore the-kitchen-curtain-incident-of-three-years-ago-having-settled-the-question) — Diana's quiet-line-holding extends to household-safety not just emotional-discipline (cross-canvas to diana.md 'strict in a father-shaped way: rules, routines, schedules' verified-as-applies-to-fire-safety-too); (h) **🎯 Maya-the-second-Saturday-seat-claimed-without-asking register** (LOW variant) — companion to tv_living_room C5 Maya-the-second-Sunday-memory-anchor; the second-Sunday register-anchor is now twice-anchored (couch C5 + back-porch LOW); (i) **🎯 the-porch-absorbed-more-than-the-kitchen register** (MID_HIGH variant) — Maya-Operating-band naming-the-acoustic-difference-between-rooms; canon-partition register-marker that distinguishes the Tier-E mid-high from the Tier-A loaded-realization version; (j) **🎯 Frank-staying-at-the-grill-as-not-having-to-sit-down body-tell** (brothers_discover overlay) — Frank's choose-the-grill-over-the-table register first surface; (k) **🎯 Ryan-back-turned-to-the-table-plate-balanced-on-the-post body-tell** (brothers_discover overlay) — Ryan-style-sheet choosing-the-place-of-not-engaging extends the easy-brother-who-is-the-hardest-to-hold-together internal-contradiction per ryan.md."

