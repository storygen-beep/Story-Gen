[[canvases.nodes]]
id = "base"
name = "Past the door"
blocks = [
  { type = "image", props = { file = "activities/jake_linger.jpg", description = "J4 post-Tease passive-linger canvas. loc_hallway evening 21:00-23:30. Maya in upstairs hall, second pass past Jake's four-inch-cracked door at quarter to eleven (after first pass at ten-fifteen to bathroom). The boards near Jake's door creak at Maya's deliberate-walking-pace (rate of a person not in a hurry — tactical register-deception). Three flag-axis variants render the second-pass register: DEFAULT canonical Tease-tier (the pace was a lie + page-stopped-and-restarted-two-seconds-after Tease-evidence + the-not-looking-in-was-the-conversation signature); WARM post-Hand (the not-looking-in has different weight + reference to Caught-night door-all-the-way-open + pencil-audible drawing-tell + the-keeping-walking-was-a-chosen-language); WITHDRAWN (corridor-as-agent absence + the-hall-decided-that-for-itself + second-pass-stopped-being-needed). Rule 10 hallway-evening smell: hot-shower-residue + cedar-of-old-banister + dust-the-air-conditioner-moved-without-removing. Southern summer late-evening upstairs-hall passive-seduction register. Jake-cluster door-geometry trilogy completion: just-past-the-door geometry.", search_queries = ["young woman walking past closed bedroom door upstairs hallway evening rural southern interior", "interior hallway second floor old wood boards bedroom doors evening dim light young woman passing", "rural southern home upstairs hallway evening narrow corridor young woman walking past doors quiet"] } },

  { type = "paragraph", content = "At ten-fifteen on a Wednesday in August she walked the upstairs hall to the bathroom. At a quarter to eleven on the same Wednesday she walked it back. The first walk was the bathroom. The second walk was the second walk. The hall smelled of the hot-shower-residue from her own ten-fifteen and the faint cedar-of-the-old-banister and the dust the air conditioner moved without removing. The boards near Jake's door creaked at the rate they creaked when a person walked at the rate of a person not in a hurry." },

  { type = "group", blocks = [
    { type = "paragraph", content = "On the second pass she did not look in. The four-inch gap was the four-inch gap. She walked past it at the pace of a girl who had finished in the bathroom and was walking back to her bedroom and was not particularly thinking about the room she was passing. The pace was a lie. The pace had been the second pass for the third Wednesday running. He knew. He had stopped pretending he didn't know on the second Wednesday, when she had passed and the page-turning inside the room had stopped at the moment of her passing and had started again two seconds after. He knew. She knew he knew. The not-looking-in was the conversation." },
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "jake_hand", operator = "is_false" },
    { type = "flag", subject = "player", flag_key = "jake_keep_withdrawn", operator = "is_false" }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "On the second pass she did not look in, but the not-looking-in had a different weight than it had had before the night the door had not been four inches cracked but all the way open with him sitting on the bed and the sketchbook closed against his chest. She passed. The page-turning inside was now the page-turning of a person drawing — she could hear the pencil in it. He had known her steps for a month. The keeping-walking was a chosen language." },
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "jake_hand", operator = "is_true" }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "The boards creaked. The door was four inches cracked. The room was the room a person was not in. She had been walking past at ten-forty-five for two and a half weeks, and the second-pass had stopped being a thing she had needed to walk for, and the walking had become the walking she did because the bathroom was where it was. The hall was the hall. The hall did not require him in his room. The hall had decided that for itself." },
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "jake_keep_withdrawn", operator = "is_true" }
  ] } },
]
exit_block = { type = "location", text = "Cross to her own door. Close it gently behind her.", config = { destinationType = "trigger", time_progression_minutes = 10, effects = [ { targetType = "player", trait = "calculation", op = "add", value = 1 } ], modifier_effects = [ { targetType = "npc", npcId = "npc_jake", trait = "arousal", op = "add", value = 20, duration_hours = 8 } ] } }


