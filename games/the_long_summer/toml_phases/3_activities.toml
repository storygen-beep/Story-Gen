# BASE NODE — graphite-and-attic-heat scene + four-inch door + three approach choices
[[canvases.nodes]]
id = "room"
name = "His Room"
blocks = [
  { type = "image", props = { file = "activities/sketch_jake.jpg", description = "Jake's bedroom — west-facing, August afternoon sun through blinds in strips across floor + foot of bed + corner of desk. Jake on the bed against the wall with sketchbook on knees, glasses on (drawing-mode per jake.md body-tells), six-B pencil + utility-knife + shavings-on-sill. Door into hallway cracked to about four inches — that's the drawing-position (never fully closed, never fully open). Rule 10 smell: graphite + attic-heat-collected-under-roof + paper-and-eraser-shavings. Southern summer attic-bedroom register.", search_queries = ["young man drawing in bedroom pencils paper summer afternoon Southern attic", "teenage art student bedroom drawing sketchbook paper west-facing window blinds graphite", "young man drawing quiet bedroom six-b pencil utility knife sharpening shavings attic summer"] } },

  { type = "paragraph", content = "Jake's room smelled of graphite and the heat that collected under the roof on an August afternoon and the particular paper-and-eraser-shavings smell of a page that had been worked on for hours. The bedroom faced the west side of the yard — by three in the afternoon the sun came through the blinds in strips that fell across the floor and the foot of the bed and the corner of his desk. The door into the hallway was cracked to about four inches, because that was the door's position when she came up — she had never seen him close it and she had never seen him open it the rest of the way." },
