# ─── J4: Post-Tease linger ─────────────────────────────────────────────────

[[canvases]]
id = "activity_jake_linger"
name = "Linger past Jake's door"
description = "Pass his door a second time. He knows. — Rewritten 2026-04-25 (Session 20, Tier E Jake-cluster batch #1 canvas 4 of 6). Single-node in-place expansion. 400 authored words — universal body (~95w second-pass-as-architectural-anchor + Rule-10 hot-shower-residue/cedar-of-old-banister/dust hallway-evening smell + board-creak-rate-as-register-tool) + 3 flag-axis variant groups (DEFAULT Tease-canonical pre-Hand pre-Withdrawn ~115w / WARM jake_hand=true post-Hand ~95w / WITHDRAWN jake_keep_withdrawn=true ~85w) + 10w Maya-action-framed exit label echoing Prologue close-doors-quietly Maya body-tell. Target 400w (exactly on target). **POST-TEASE PASSIVE-LINGER CANVAS** — the canonical *not-looking-in-was-the-conversation* canvas where Maya's tactical-passive-seduction lives. Jake-cluster door-geometry trilogy completed: J1 (inside the room mutual-drawing flag-axis) + J3 (outside the door knocking flag-axis) + **J4 (just past the door without engaging flag-axis)**. The four-inch-door from J1+J3 surfaces as the canvas's geometric payload — Maya walks PAST it without looking in, and the not-looking-in is the conversation. **Architecture: 3 flag-axis variants** matching J1+J3 indoor/threshold-canvas pattern (Jake-cluster two-axis pattern: indoor/threshold flag-axis / outdoor-observational corruption-band-axis). DEFAULT = jake_hand=false AND jake_keep_withdrawn=false (canonical Tease-tier pre-Hand pre-Withdrawn); WARM = jake_hand=true (post-Hand power-inverted register); WITHDRAWN = jake_keep_withdrawn=true (corridor-as-agent absence-register). Clean 3-way mutual exclusion. **Jake-cluster vocal-register-budget preserved**: J4 stays passive — Jake doesn't deploy vocabulary here because the canvas is about Maya-walks-past-without-stopping; vocabulary-deployment requires open-door + Maya-stops-to-talk geometry, deferred to J5 post_caught_jake (Keep-route variants 4-way) and/or J6 jake_college (information-transfer power-inverted). J4 zero Jake dialog; Jake-presence rendered via aural-tells (page-turning that stops + restarts at moment of passing — Tease evidence; pencil-audible drawing-tell — Hand evidence; complete-silence corridor-as-agent — Withdrawn evidence). **DEFAULT signature techniques**: (a) **Second-pass-as-architectural-anchor**: ten-fifteen first-walk + quarter-to-eleven second-walk; the second-walk-was-the-second-walk Saturated-adjacent tautology landed in DEFAULT to signal Maya's deliberate-tactical register at Tease-tier; (b) **Board-creak-as-register-tool**: Maya has trained her walking-pace to make the boards creak at the rate-of-a-person-not-in-a-hurry — register-deception via cadence-control, Operating-band Maya names-the-deception (*the pace was a lie*); (c) **Page-stopped-and-restarted Tease-evidence Maya-counts-the-Jake-evidence**: *the page-turning inside the room had stopped at the moment of her passing and had started again two seconds after* — Maya-Operating reads Jake's tells with two-second precision; cross-canvas to J2 Operating *pencil-moved-one-count-slower* Maya-reading-Jake-via-craft-cadence signature; (d) **The-not-looking-in-was-the-conversation Tease-tier-anti-engagement-as-engagement signature**: signature-line for Tease-tier passive-seduction. Forward-applicable to any Tease-tier passive-engagement moment. **WARM signature techniques**: (e) **Reference-anchor to Caught-night door-was-all-the-way-open**: *the night the door had not been four inches cracked but all the way open with him sitting on the bed and the sketchbook closed against his chest* — direct cross-canvas to jake.md Caught-beat specimen *'silence; sketchbook closed against his chest; eyes on the floor.'* J4 WARM is the first canvas to surface the Caught-beat-detail in retrospect; the four-inch-door-vs-all-the-way-open contrast is the Hand-beat aftermath register; (f) **Pencil-audible drawing-tell post-Hand evidence**: *the page-turning inside was now the page-turning of a person drawing — she could hear the pencil in it* — Rule 22 art-as-honesty post-Hand surfacing through aural-evidence; Jake-now-drawing-after-Caught is the recovery-tell; (g) **The-keeping-walking-was-a-chosen-language Operating-band post-Hand signature**: Maya at Operating chooses-the-language Maya-self-naming register; the not-looking-in is now consciously-chosen-language not tactical-deception. **WITHDRAWN signature techniques**: (h) **The-hall-decided-that-for-itself corridor-as-agent register**: extends J3 WITHDRAWN's room-as-agent (the-room-pretending-empty) to corridor-as-agent (the-hall-decided-that-for-itself); both are Saturated-adjacent room-or-architecture-as-actor signatures for Withdrawn-route. The hall-doesn't-require-him-in-his-room is the deepest-acceptance register; (i) **Second-pass-stopped-being-needed register-evolution**: *the second-pass had stopped being a thing she had needed to walk for, and the walking had become the walking she did because the bathroom was where it was* — Maya has-moved-past-Tease-tactics; the linger has become non-tactical because the relationship is sealed-off. **Rule 10 smell anchor (new for Jake-cluster hallway-evening)**: hot-shower-residue + cedar-of-the-old-banister + dust-the-air-conditioner-moved-without-removing. Complements Jake-cluster smell-anchors: J1 indoor-bedroom (graphite + attic-heat + paper-eraser-shavings) + J2 outdoor-yard (cut-grass + creek-mud + cicadas) + J4 hallway-evening (hot-shower-residue + cedar + dust). **Exit label enhanced** from 4w 'Back to her room.' to 10w 'Cross to her own door. Close it gently behind her.' — Maya-action-framed + specific-action + cross-canvas to Prologue-specimen 'Closes doors quietly even when she could slam them' Maya body-tell per maya.md style-sheet. **Effects preserved exactly**: player.calculation +1 (Maya-tactical-deception-builds-calculation-stat), jake.arousal +20 modifier 8h, 10 min, energy -5. Trigger preserved (max_triggers_per_day=2 per book). 0 italic spans across 400w. Zero @npc_ tokens. Zero banned phrases. Zero Jake dialog (vocal-register-budget preserved for J5/J6). Zero Maya dialog. Variant gate 3-way mutually-exclusive: jake_hand=true → WARM; jake_keep_withdrawn=true → WITHDRAWN; both false → DEFAULT."

