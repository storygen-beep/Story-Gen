[[canvases.nodes]]
id = "base"
name = "After Close"
blocks = [
  { type = "image", props = { file = "activities/diner_t3.jpg", description = "Late-night after-close at the Millhaven diner — Saturated-band register: front lights off, diner sign unlit, a single warm back-booth lamp glowing over the corner booth by the rear wall; young woman in a white apron and jeans seated at the booth across from a customer (male, mid-forties, work shirt), the door locked from the inside, Coca-Cola clock above the pass reading just past eleven, back-door key visible on a hook on the wall. Private, quiet, the dinner rush long over.", search_queries = ["small-town Southern diner after close late night corner back booth warm lamp private", "1980s American diner late-night scene locked door single lit booth waitress and customer", "roadside diner closed for the night back booth lamp young woman and regular"] } },

  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The Thursday was the scrapper's Thursday. He came in at nine-forty in the white short-sleeve he wore the weeks he had been paid on a Wednesday wire transfer, the one with the snap-pockets; his rig in the gravel turnout since seven, his second cup of coffee since then, the bill he had folded in half and kept under the saltshaker since nine-thirty. Marge at the till had not said anything. Marge at the till did not need to." },
    { type = "paragraph", content = "The Thursday was the anniversary-husband's Thursday. He had been at the anniversary dinner a month back and had tipped with the kind of intention a man tipped with when he was setting the next move up. He had come back alone on the two Thursdays since. Tonight he sat in the corner booth with the hat on the seat beside him. Twenty-one-twenty-five on the Coca-Cola clock." },
    { type = "paragraph", content = "The Thursday was Dale's Thursday. Dale drove the flatbed between Nashville and Chattanooga twice a week and took his Thursday at the diner because the Thursday diner was on his route south. He had eaten a chicken-fried steak and had paid for it twice — once on the bill and once with the twenty he left under the plate on his way to the back booth. Cookie at the pass pretended not to see him leave." },
    { type = "paragraph", content = "The Thursday was the kind of Thursday when the man in the booth was a man who had been in the booth before. The third time, or the fourth. He had his Thursdays the way she had hers. He paid the way he had paid the first time; he came in at the count he came in at and left at the count he left at. She did not have to read him anymore. She had read him already. The hour tonight would be the hour he had shown up to buy, and she had the number that corresponded before she walked to the booth." },
  ] },

  { type = "paragraph", content = "She closed the till at eleven-oh-five. The front lights had been off since eleven; the sign on the door since ten-fifty. The key went into her pocket. The back-booth lamp she turned on the way she had learned to turn it on — twist-and-hold-for-the-count-of-three until the filament caught, then release. Cookie had gone home at ten-forty with the kids. Marge had locked the back door from the inside and left the key on the hook where the key went on Thursdays. The diner was hers for the hour." },

  { type = "paragraph", content = "The man in the booth looked up at the count he looked up at. She had the count. She had learned to read the count off a man's hand before she had learned to read the look off his face. She sat down across from him or she did not, depending on what the man had done in the sixty seconds since she had come around the counter. Each Thursday was one Thursday. Each man was one man. Each scene was one decision at a time, and she was the one making it. The decisions had stopped carrying over from one Thursday into the next. Thursday was one Thursday. Sunday she would buy groceries with the money. That was all the carry-over was." },

  { type = "paragraph", content = "The man tonight had done the thing the men who came to the back booth did or he had done a different thing. He came with a number and waited for her to accept it, or he came without a number and waited for her to set one. The Thursday was his Thursday and the hour was hers. He looked up at her at the count. The look at the count was the look that carried the information she needed. The look told her which of the three sentences she would say at the corner of the booth." },

  # Post-frank_cracked: Frank knows about Thursdays
  { type = "group", blocks = [
    { type = "paragraph", content = "Frank knew on Thursdays. Frank had known since the third Thursday in the month he had first known. He had not said the sentence that would have named the knowing and she did not expect him to. The Friday ten-twenty office ritual held and the Thursday ten-PM back booth sat on the other side of the week from it, and between them was the Friday-morning silence at the breakfast table that Diana filled the way Diana filled silences. The ritual on both sides held because the silence in the middle held." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_true" }
  ] } },

  # Post-frank_keep_route: Maya has picked a route with Frank
  { type = "group", blocks = [
    { type = "paragraph", content = "The route she had taken on the first Sunday of the last week of July was a route she had taken. The taking held. The Thursday back booth sat inside the route in the way the Thursday back booth always had. She was not on the route because of what the Thursday back booth paid; the Thursday back booth was on the route because of what she had already decided about the shape of the route. The arithmetic ran forward now. It ran toward the first Monday of September and the number she had written down for Millhaven Community College in the line on the application she had already filled out." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "frank_keep_route", operator = "is_true" }
  ] } },
]
exit_block = { type = "choices", choices = [
  { text = "Stand. \"Not tonight.\" Walk to the back.", targetType = "trigger", time_progression_minutes = 30, effects = [ { targetType = "player", trait = "rep_road", op = "add", value = 1 } ] },
  { text = "Sit. Pick a number he hadn't put on the table.", targetType = "trigger", time_progression_minutes = 90, effects = [ { targetType = "player", trait = "money", op = "add", value = 120 }, { targetType = "player", trait = "corruption", op = "add", value = 2 }, { targetType = "player", trait = "calculation", op = "add", value = 1 }, { targetType = "player", trait = "rep_road", op = "add", value = 2 }, { targetType = "player", trait = "rep_church", op = "add", value = -2 } ] },
  { text = "Sit. Let him choose the tier. Leave the key for morning.", targetType = "trigger", time_progression_minutes = 90, effects = [ { targetType = "player", trait = "money", op = "add", value = 180 }, { targetType = "player", trait = "corruption", op = "add", value = 3 }, { targetType = "player", trait = "rep_road", op = "add", value = 2 }, { targetType = "player", trait = "rep_church", op = "add", value = -2 } ] },
] }


