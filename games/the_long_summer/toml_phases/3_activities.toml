[[canvases.nodes]]
id = "base"
name = "Back Porch Table"
blocks = [
  { type = "image", props = { file = "activities/outdoor_dinner.jpg", description = "Saturday 18:00-19:30 outdoor dinner on the back porch — wide view from the yard. Long wooden table running parallel to the porch rail under a string of lights along the rafter. Five place settings, the table set for Frank, Diana, Ryan, Jake, and Maya. Frank standing at the grill at the far end of the porch in an apron, tongs in hand. Diana carrying a covered tray out from the screen door. The yard beyond — cut grass, the start of the pine line, the dirt road past the property edge. Late-summer Southern evening light, the cicadas implied by the season. Lived-in domestic-ritual register; the weekly Saturday gathering, distinct from the daily kitchen-table dinner.", search_queries = ["Southern back porch long outdoor dinner table string lights family Saturday summer evening", "rural Southern home back porch wooden long table string lights five place settings grill", "weekly Saturday family outdoor dinner back porch string lights grill cut grass yard pine line"] } },

  { type = "paragraph", content = "String lights along the porch rafter. The long table Frank had built running parallel to the rail — longer than the kitchen table; the conversation on it was looser because of it. Frank at the grill with the tongs in his right hand, paper plate of meat-to-be-flipped in his left. Diana carrying out a tray. Ryan with a beer on the rail, Jake with a glass of water at the table already, sketchbook deliberately not in his lap." },

  # Rotating openings — week-typology block_pool (Rule 19 anti-staleness)
  { type = "block_pool", blocks = [
    # R1 — chicken and corn
    { type = "paragraph", content = "Chicken on the grill, corn on the cob, biscuits Diana had wrapped in foil to keep warm. Frank turned the chicken by the count he had been turning chicken by since the boys were small. Ryan reached past Frank for the tongs once, didn't take them, set his hand on the rail beside the plate of meat. Diana brought out the iced-tea pitcher." },
    # R2 — pulled pork and coleslaw
    { type = "paragraph", content = "Pulled pork day. Frank had been up since six with the smoker, the slow-pulled meat fall-apart the way he had taught himself the year after the divorce. Diana's coleslaw in the green ceramic bowl. Vinegar-base, no mayo — the way Frank's mother had made it, the way Diana had learned to make it the second year of her marriage." },
    # R3 — ribs and baked beans
    { type = "paragraph", content = "Rib night. Three racks on the grill, the dry rub Frank had mixed in the morning — paprika and brown sugar and the cayenne measure he never wrote down. Diana's baked beans in the cast-iron, brown-sugar-smoke-and-bacon. The cicadas were louder when ribs were on. Nobody knew why." },
    # R4 — fish fry
    { type = "paragraph", content = "Fish-fry Saturday. Catfish Ryan had brought back from the creek the morning before, cleaned at the back-porch sink, breaded in Diana's cornmeal mix at four. The propane fryer outside on the bench — Diana wouldn't let Frank fry indoors anymore, the kitchen-curtain incident of three years ago having settled the question." },
  ] },

  # AWARENESS_LOW (<25) — Closed-band Maya / Diana low-awareness mother-knows-where-Maya-belongs
  { type = "group", blocks = [
    { type = "paragraph", content = "Diana didn't look up when Maya stepped onto the porch. The serving platter was on the table already, the iced-tea pitcher beside it. Maya took the seat at the long-end nearer the rail — the seat she had been taking since the second Saturday, when Diana had set a plate there without asking and Maya had understood that the seat had been chosen for her. The grill smoke went up and east on the wind." }
  ], conditions = { version = "1.0", items = [
    { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "lt", value = 25 }
  ] } },

  # AWARENESS_MID_LOW (25-49) — Opening-band Maya / Diana looks up + porch-version warm welcome
  { type = "group", blocks = [
    { type = "paragraph", content = "Diana looked up when Maya stepped onto the porch. She held the eye one count, smiled — the porch-version of the kitchen smile, looser at the corners because the porch was the looser room." },
    { type = "dialog", content = "Sit down. Plate's coming.", props = { speaker = "npc", npcId = "npc_diana" } },
    { type = "paragraph", content = "Maya took the seat at the long-end nearer the rail. Diana's smile had not been a question; it had been the kind of welcome that made you have not had to think about whether it was." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "gte", value = 25 },
    { type = "trait", subject = "npc", npc_id = "npc_diana", trait_key = "awareness", operator = "lt", value = 50 }
