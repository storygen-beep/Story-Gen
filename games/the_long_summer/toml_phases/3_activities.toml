[[canvases.nodes]]
id = "base"
name = "The Road"
blocks = [
  { type = "image", props = { file = "activities/walk_to_town.jpg", description = "Late-spring/early-summer rural North Alabama county road. The gravel-to-pavement transition where Frank's driveway meets State Route 9, pine and kudzu closing over the road on both shoulders, the canopy thinning where it lets in the noon light. Heat-haze on the asphalt distance. Maya — eighteen, dark hair pulled back, jeans and a t-shirt, sneakers — walking the centerline with the property-edge corner of Ryan's roll-up shop just visible through the pines on the property side. Mid-day Southern light, low traffic. The walk-to-town canvas covers the half-hour from loc_driveway out to loc_main_street_sidewalk.", search_queries = ["rural Southern county road pine kudzu summer heat haze woman walking centerline mid-day", "North Alabama rural county road gravel-to-pavement pine canopy weekday afternoon woman jeans walking", "small-town Southern county road afternoon pine kudzu cicadas heat-haze young woman walking errands"] } },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Saturday morning. Gravel for fifty yards before it took the county road's pavement. Ryan's shop on the property edge, the big roll-up door pulled down — the padlock clipped through the loop the way Ryan clipped a padlock when the shop was shut for the day, not the way he clipped it for the night. The yard around the shop was empty of equipment, which meant whatever had been there yesterday had a buyer. Cicadas not yet at full volume." },
    { type = "paragraph", content = "Mid-morning, the kudzu side of the road. A pickup truck slowed coming the other way, then did not stop. The driver — older, ball cap pulled low, a face she had not seen before — gave her the long look, the kind of look that asked a thing without expecting an answer. Maya did not turn her head to follow the truck after it had passed. The not-turning was the answer." },
    { type = "paragraph", content = "Afternoon, second mile marker. Pine and kudzu closed over the road, heat trapped where the canopy thinned. Cicadas at full volume now, and the red clay was ticking under her sneakers — the sound it made in the heat that she had only learned to hear after the third week of walking. She made a list in her head and forgot half of it before the third bend." },
    { type = "paragraph", content = "Sunday morning, late. A car slowed coming the other way — a woman her mother's age, hair set the way her mother had set hers for church, gave the windshield-nod that meant a thing in this part of the county. Maya gave the nod back without thinking. The car kept going. The nod, Maya was learning, was a contract you signed by accident." },
  ] },
]
exit_block = { type = "location", text = "Step up onto the sidewalk.", config = { destinationType = "specific", locationId = "loc_main_street_sidewalk", time_progression_minutes = 30 } }


