id = "base"
name = "Front Steps"
blocks = [
  { type = "image", props = { file = "activities/church_attend.jpg", description = "Tier F church-front Sunday-morning canvas (first Diana-in-scene Tier F canvas). loc_church_front Sunday 09:30-11:30. Small-town Southern Baptist or Methodist church — clean white clapboard, gravel parking lot half-full with pickup trucks and a handful of sedans, mowed front lawn between the lot and stone front steps, congregation gathering on the lawn for the lawn-to-steps social work before the service interior. Diana in her Sunday clothes a step ahead of Maya on the path, not looking back. Pastor at the top of the steps in his clean black suit shaking hands as people file past. Older women by the side door talking among themselves. Block_pool of 3 rotating Sunday-encounter paragraphs covering pastor-handshake (book canon ambient encounter #7) / Pruitts-couple-greeting-Diana / older-women-side-door-windshield-nod. Diana low-awareness-band body-tells throughout (warm + present + ahead + finishing-her-sentence). Late-spring Southern Sunday morning at ten — hot stone, lavender-soap, Sunday-coffee carrying through the front door. Maya in modest jeans-and-blouse Sunday register; Diana in Sunday clothes per book canon. Property: lawn-to-steps lawn ~30 yards.", search_queries = ["small-town Southern Baptist or Methodist church Sunday morning lawn front steps congregation greeting pastor handshake young woman with mother", "rural Southern white clapboard church front steps gravel lot Sunday late spring morning families gathering", "small-town Sunday morning church front lawn pastor in suit older women in Sunday dress greeting woman with daughter approaching"] } },

  { type = "paragraph", content = "Sunday, ten of ten. The gravel lot half-full with trucks and a handful of sedans. The lawn between the lot and the front steps had been mowed on Friday — Maya knew because she had heard the mower from the house Friday afternoon and knew now what mower it had been. Diana on the path half a step ahead, not looking back, confident the way a woman who had walked this path most Sundays of two decades was confident. Stone-warming-already-at-ten and Sunday-coffee carrying through the front door." },

  { type = "block_pool", blocks = [
    { type = "paragraph", content = "The pastor at the top of the steps in his clean black suit, hand out for the hand-shake the way the pastor's hand was out for the hand-shake every Sunday. He said her name first and Diana's name second, which Maya registered. His grip was the grip of a man who shook a hundred hands every Sunday and had calibrated his grip to do no harm. His eyes were on her for the count of one before he was on to the next greeting." },
    { type = "paragraph", content = "The Pruitts — the church-couple from two roads over — found Diana before Diana found them. The woman put her hand on Diana's forearm in the way of women who had been putting their hands on each other's forearms since before Maya was born. The man asked after Frank and Diana said the answer she had said to that question every Sunday. Maya stood half a step behind Diana's shoulder and let herself nod when nodded at." },
    { type = "paragraph", content = "By the side door three older women were not yet inside, talking the talk that did not need to be talked but was being talked anyway. One of them — silver curls, lavender-soap smell carrying across — caught Maya's eye and gave the windshield-nod from the road, the same nod that meant a thing. Maya gave it back. The woman went back to the not-needed talk." },
  ] },

  { type = "dialog", npcId = "npc_diana", content = "Maya. Walk with me." },
]
exit_block = { type = "location", text = "Down the steps. Cross to her.", config = { destinationType = "trigger", time_progression_minutes = 90, effects = [
  { targetType = "player", trait = "rep_church", op = "add", value = 3 },
] } }


