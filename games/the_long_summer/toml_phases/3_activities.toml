# BASE NODE — apron, smell, weekday opening, Cookie peer state, three approach choices
[[canvases.nodes]]
id = "shift"
name = "Shift"
blocks = [
  { type = "image", props = { file = "activities/diner_t0.jpg", description = "Evening shift at the Millhaven diner — interior view of the counter and two booths, Coca-Cola clock above the pass, Bunn coffee-maker on warmer plate, laminate stool-seats along the counter, young woman in a white apron behind the counter holding a glass carafe in her right hand. Fluorescent strip light over the pass; late-day southern-small-town wash.", search_queries = ["small-town Southern diner evening interior counter stools Bunn coffee maker fluorescent light", "1980s-style American diner waitress white apron coffee carafe behind counter booth", "roadside diner late shift warmer plate coffee pot Coca-Cola wall clock"] } },

  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Monday slow. The church couple in booth three splitting a slice of pie and a coffee between them, the trucker at the counter with the crossword folded into quarters, Cookie on the back step between rushes — the back door propped with the brick that had been propping it since Marge bought the building in 1991." },
    { type = "paragraph", content = "Tuesday steady. Pete the mechanic in the booth second-from-the-end, dark-blue coveralls clean at the cuffs, the Hayes Hardware cap on the chair beside him. The retired farmer's wife at the counter. Chicken-fried steak with the gravy on the side, the way she had been ordering it since August." },
    { type = "paragraph", content = "Wednesday pickup. The shift where the dinner rush actually felt like a rush — three booths filled by 5:45, the fryer running through a second basket of potatoes, Cookie's hands steady through all of it. The Bunn knocked itself twice on the warmer plate between the second and the third refill of booth four." },
    { type = "paragraph", content = "Thursday trucker-heavy. Three rigs in the gravel turnout across the road, four men at the counter, the jukebox playing a song older than the year. The Bunn on the second warmer running because the first was running past the cut-off hour the dial-clock behind the till said it should." },
    { type = "paragraph", content = "Friday the full floor. Every booth, every two-top, the fryer running longer than it should. Marge in the back doing a quick inventory between orders — apron tied tight the way she tied it on the nights the count ran long, the till-key on the chain at her wrist." },
  ] },

  { type = "paragraph", content = "The apron went around her hip in the half-bow Cookie had shown her on Wednesday of Week 1 — strings crossed at the small of the back, knotted once at the front, ends tucked. The booth numbers ran counterclockwise the way the floor sloped toward the kitchen wall. The smell was coffee and bacon and Pine-Sol, the fryer grease bleeding through the swinging door from the back. Her t-shirt at the shoulders already held the two-day smell the diner put into the cotton regardless of when the shirt had last been washed." },

  # DEFAULT — pre-Cookie-vouch: Maya is in-the-building, not yet of-the-building
  { type = "group", blocks = [
    { type = "paragraph", content = "Cookie moved through the line fast and did not waste words. Marge at the till kept her eyes on the credit slips unless there was something to keep them on. The back step had the count of Cookie's smoke breaks in a row of short-butt cigarettes along the far corner of the bottom tread, and Cookie had not, yet, offered Maya one of them. That had been the register of the first two weeks. She was inside the building. She was not yet of the building." },
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "cookie_peer_established", operator = "is_false" }
  ] } },

  # WARM — post-vouch: Cookie back-step intel moment
  { type = "group", blocks = [
    { type = "paragraph", content = "Cookie tipped her chin at the back step between the dinner-rush lull and the second wind. The second cigarette of the break was Maya's without Cookie having asked whether she wanted it, which was Cookie's way. Maya took it and did not smoke it and held it between two fingers the way she had watched Cookie hold the tongs." },
    { type = "dialog", content = "Trucker at the end. Caterpillar cap. Rounds to twenty on a twelve-dollar check if you stand by his shoulder once. Your call.", props = { speaker = "npc", npcId = "npc_cookie" } },
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "cookie_peer_established", operator = "is_true" }
  ] } },
]
