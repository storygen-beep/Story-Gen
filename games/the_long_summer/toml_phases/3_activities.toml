[[canvases.nodes]]
id = "base"
name = "Threshold"
blocks = [
  { type = "image", props = { file = "activities/knock_jake.jpg", description = "J3 hallway-threshold knock canvas. loc_hallway, 14:00-23:00. The door to Jake's bedroom four inches cracked (Jake-cluster architectural geometry from J1). Maya at the door, three knuckles on the wood two inches above where the four-inch gap begins. Listening through the gap. Four flag-axis variants render Jake's tier-specific response: DEFAULT pre-Noticed hostile-silence (window-unit hum + page-turning + body-shifting on mattress = Jake-acknowledges-knock-by-not-acknowledging); NOTICED door-swings-another-inch + chair-shift + no-voice (the inch IS the response, Maya catalogues it); TEASE Jake's voice through the four-inch gap saying 'Yeah?' (Jake's first vocal deployment in Jake-cluster but still clipped fragment — the geometry holds, door stays closed); WITHDRAWN pretending-to-be-empty (window-unit-off + triple-negative-inventory + room-decides-to-pretend-empty deepest-absence register). Hallway-threshold geometry: Maya outside, Jake inside, the four-inch gap as the architectural payload of every variant. Southern summer evening hallway-threshold register.", search_queries = ["young woman knocking on closed bedroom door rural southern hallway evening interior threshold", "hand knocking on partially open bedroom door hallway perspective listening waiting", "young woman at four-inch cracked bedroom door hallway listening southern interior evening"] } },

  { type = "paragraph", content = "The door to Jake's room was four inches cracked, the way it always was at six in the evening, the way she had described it to herself once and then stopped describing because the description was the door's permanent state. She knocked three times with her knuckles on the wood, two inches above where the four-inch gap began. She listened." },

  { type = "group", blocks = [
    { type = "paragraph", content = "From inside the room came nothing she could put a name to. The window-unit hum. A page turning in a slow count. The small sound of a body shifting position on a mattress. He had heard the knock. He had heard the knock and decided not to acknowledge it, and the not-acknowledging was the response, and she had had the response from him three times this week and the four times before this week, and she had begun to count the not-acknowledgings the way a person counted things she did not want to count." },
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "jake_noticed_open", operator = "is_false" },
    { type = "flag", subject = "player", flag_key = "jake_keep_withdrawn", operator = "is_false" }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "The door swung the rest of the way open another inch. Just an inch. Not enough for her to see in, not so little she could pretend it had not moved. From inside, the small sound of a chair shifting. No voice. No invitation. The inch was the response. She catalogued the inch and the chair-shift and noted that the inch was new this week." },
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "jake_noticed_open", operator = "is_true" },
    { type = "flag", subject = "player", flag_key = "jake_tease_open", operator = "is_false" },
    { type = "flag", subject = "player", flag_key = "jake_keep_withdrawn", operator = "is_false" }
  ] } },

  { type = "group", blocks = [
    { type = "dialog", content = "Yeah?", props = { speaker = "npc", npcId = "npc_jake" } },
    { type = "paragraph", content = "His voice came through the four inches of door at the volume of a question he was pretending was a casual question. The pretending was the register. He had not opened the door — he had asked from inside the room, and the asking was a different kind of acknowledgment than the not-asking had been, but it was still a door-closed kind of acknowledgment. She was at the threshold. He was inside. The geometry held." },
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "jake_tease_open", operator = "is_true" },
    { type = "flag", subject = "player", flag_key = "jake_keep_withdrawn", operator = "is_false" }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "From inside the room nothing came out. Not the window-unit hum she could place from outside the door — it was off this evening — not the page turning, not the chair-shift. The silence was a different silence than the silence had been before. She had stopped knocking the second knock on the third evening, and on the evenings after that she had been at the door and she had not knocked, and tonight she had knocked once and the once had landed in a room that had decided to pretend it was empty." },
  ], conditions = { version = "1.0", items = [
