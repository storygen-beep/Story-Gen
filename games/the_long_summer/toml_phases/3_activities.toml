description = "Single brochure visit. Sets college_brochure_taken. — Rewritten 2026-04-25 (Session 21, Tier F batch #2 canvas 9 of 6+ — first batch #2 NOT-REPEATABLE single-visit canvas + foundational college-arc canvas). Single-node single-flow architecture (no variants — single-visit canvas, register stays unified Closed-band; Maya is at Week 1-2 with no corruption-arc registering yet). Image-UPGRADED to full description + 3 search_queries (was Rule 24 partial — image present with bare 1-query). Universal frame paragraph (~85w office geometry per book canon `final_book.md:1503-1508` — one-room-off-Main-Street + brochure-rack-three-feet-wide + four-shelves-of-folded-paper + application-desk-at-back-two-chairs-in-front-neither-having-been-sat-in-this-morning + clerk-on-wooden-stool + clerk's-coffee-cooling-on-corner-of-desk + Rule-10-paper-smell-of-un-stocked-third-shelf) + Body 1 paragraph (~95w Maya-at-the-rack: reading-the-headings + Rule 26 cat-c inline-italic 5-word reading-fragment '*Welcome / Programs / Tuition and Aid / Apply / Visit the Campus.*' + tri-fold-on-third-shelf-in-three-rows-of-three + paper-that-held-a-fold-for-years + cover-photograph-brick-building-forward-shadow-to-body-3-campus-through-the-gate Setup-payoff Rule 2) + Body 2 paragraph (~80w turn-to-desk + clerk's-line-via-reported-speech 'The clerk said come back when you're ready and did not look up' — ambient-NPC-voice-via-reported-speech precedent established here since ambient clerk has no npcId in NPC roster; Maya-FID-mediated heard-speech) + Body 3 paragraph (~85w leaving-the-office: sidewalk-the-sidewalk-it-had-been-ten-minutes-earlier + campus-visible-through-the-gate-at-end-of-block brick-quad-art-building cross-canvas to loc_college_campus location-canon + brochure-folded-into-back-pocket-of-jeans cross-canvas to brochure_journal R2 pencilled-totals-on-back-cover + 'The math she would do later was already a thing the brochure had handed her without saying so' Maya-Closed-band distributed-self-recognition the-math-not-yet-named register-marker — corruption-arc starts here without Maya knowing it). Single-action exit upgraded from generic 5w 'Back on Main Street.' to 9w Maya-action 'Brochure in the back pocket. Out the door.' per Rule 13 Maya-action body-tell. **Hygiene fixes**: ZERO @npc_ tokens (none in original; clean). Image-UPGRADED from bare 1-query. **Strips 2 Rule 26 italic violations from original**: (1) original had clerk's dialog rendered as italic '*come back when you're ready.*' — Rule 26 violation (dialog should be dialog block, not italic) — fixed to reported-speech narration without italic since ambient clerk has no npcId; (2) original had entire-sentence italic '*She folds the brochure twice and puts it in her back pocket.*' — Rule 26 violation (italic for entire sentence 'because they feel important' = banned per Rule 26 'What NOT to italicize') — fixed by integrating into Body 3 narration without italic. **🎯 Ambient-NPC-voice-via-reported-speech precedent** — ambient unnamed NPCs (clerk, kid in general_store, ambient_townspeople) use reported speech rendered in Maya-FID narration when they speak in-scene; cat-d italic remains reserved for verbal-tics surfacing when NPC is NOT in-scene; dialog-block remains for named NPCs with npcId. Forward-applicable to other ambient-NPC dialog handling (gas-station-clerk, post-office-clerk, etc.). 1 italic span across ~355w (Body 1 cat-c 5-word reading-fragment '*Welcome / Programs / Tuition and Aid / Apply / Visit the Campus.*') — 1 span / 355w = 1.1 per 400w just over ≤1 per 400 cap; principled deployment for cat-c reading-fragment <10 words inline per maya.md inline-texture specimen-c. **🎯 Foundational college-arc canvas — sets college_brochure_taken which is the gate-flag for**: (a) brochure_journal canvas (Maya re-reads brochure at desk); (b) read R2 (college brochure as one of three book-rotations); (c) jake_college J6 (Jake reads brochure aloud + bookmarks page-break with bank-envelope corner — gate AND-logic college_brochure_taken=true AND jake_hand=true); (d) economic-arc tracking (book canon `final_book.md:946` Tier-5 hint requires college_brochure_taken=true for tracked-savings-hint to fire; book canon `final_book.md:1180` 'College brochure on my nightstand. Tuition sits at fifteen hundred. The diner alone doesn't get me there.' Operating-band sidebar text). The brochure-as-physical-object trajectory: college_admin (this canvas, ACQUIRED) → Maya's-bedroom-nightstand → brochure_journal re-reads at desk → activity_read R2 reading-rotation → jake_college J6 Jake-reads-aloud → economic-engine pressure-source. **Cross-canvas continuities**: (a) campus-through-the-gate brick-quad-art-building cross-canvas to loc_college_campus location-canon `final_book.md:1244` 'Full community college campus — Tuition-gated. Maya has the brochure. She hasn't paid the admission fee.'; (b) art-building-with-window-she-read-about-on-shelf-one Rule 22 art-as-honesty escape valve forward-shadow (Maya-the-artist's-attention surfaces in the brochure-cover-photograph specifics); (c) the-paper-that-held-a-fold-for-years material-physics anchor cross-canvas to brochure_journal R2 'eraser-marks were getting hard to write through' material-reality register; (d) the-math-she-would-do-later distributed-self-recognition cross-canvas to brochure_journal R1 'The numbers stayed the numbers' Maya-naming-the-not-changing register and rent_shortfall_first ledger-canvas + the_math Tier B canvas (the-math-arrives moment). Effects preserved exactly: 30 min, energy cost 10, sets college_brochure_taken flag (the canvas's whole purpose). Trigger preserved exactly (NOT REPEATABLE: arrived_at_franks=true AND college_brochure_taken=false; Mon-Fri 09:00-16:00). Rule 7 per-NPC voice ✓ (ambient clerk + reported speech 'come back when you're ready' + did-not-look-up body-tell — ambient-NPC silence-with-one-line book canon preserved). Rule 10 smell ✓ (paper-smell-of-un-stocked-third-shelf load-bearing in universal-frame; coffee-cooling-on-corner-of-desk preserved from original). Rule 19 anti-staleness ✗ N/A (single-visit NOT-REPEATABLE canvas — no rotating-openings needed). Rule 21 corruption-noticing ✓ (Body 3 'the math she would do later was already a thing the brochure had handed her without saying so' = Closed-band distributed-self-recognition the-math-not-yet-named — the canvas's only corruption-noticing, appropriately understated for Week 1-2 Maya). Rule 22 art-as-honesty ✓ (art-building-with-window forward-shadow). Rule 24 media-block compliance ✓ (image UPGRADED from bare 1-query). **Architectural note**: NOT-REPEATABLE single-visit canvases like college_admin and shop_big do not need rotating-openings (Rule 19) or corruption-band variants — register stays unified to one Maya-state-window appropriate for the one-time-visit context. Single-flow architecture is the right pattern. ~355 authored words (Tier F 150-300 range, target 350 — slightly above standard Tier F upper bound but on-target for the 350w-spec'd one-time NOT-REPEATABLE canvas)."

