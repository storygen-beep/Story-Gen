    { type = "paragraph", content = "She crossed her ankles. She did it the way she crossed her ankles when she wanted a man to look at her ankles. He did not look. He kept drawing the kudzu. The pencil moved one count slower than it had moved when she had not crossed them. She catalogued the slowing and did not name it to him and did not need to." },
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 50 },
    { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 75 }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "She sat where she sat. He drew where he drew. The drawing was the drawing. The yard was the yard. She had stopped tracking which of them was watching whom because the tracking had stopped being separate from the sitting. They both stayed for the cicadas to drop off, and they did, and afterward neither of them stood up." },
  ], conditions = { version = "1.0", items = [
