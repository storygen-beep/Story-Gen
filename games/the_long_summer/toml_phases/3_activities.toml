to town for either' Maya-Closed-band naming-the-not-knowing register-marker (Closed Maya half-recognizes she goes to the post office for the LETTER more than she lets herself know — distributed-self-recognition). **Cross-canvas continuities and forward-seeds**: (a) ambient-NPC-voice-via-reported-speech precedent extended from college_admin to errands R1 clerk-named-price + R3/R4 postmaster-knowing — three ambient-NPC voice-handlings in three canvases; (b) Hayes town-family-name continuity now thrice-anchored; (c) Maya's-father's-death-anniversary register-anchor established at R3 as forward-applicable Maya-Diana-shared-grief register; (d) Ryan-cross-canvas-encounter at R2 establishes Maya-keeps-her-distance Closed/Opening-band Ryan-recognition body-tell pattern (forward-applicable to other Ryan-overlap canvases pre-bring-water-relationship-deepening); (e) Maya-Closed-band naming-the-not-knowing register-marker [R4 'nothing she could have said she had walked the hour to town for either'] — distributed-self-recognition cross-canvas to college_admin Body 3 'the math she would do later was already a thing the brochure had handed her without saying so' + brochure_journal R1 'the numbers stayed the numbers'. Effects preserved exactly: rep_road +1, 20 min, energy cost 5. Exit upgraded from generic 1w 'Done.' to 5w Maya-action 'Cross to Route 9. Walk.' per Rule 13 (Route-9-cross body-tell + Maya-walking-back-to-Frank's anchor). 0 italic spans across 225w. Zero @npc_ tokens (clean). Zero NPC quoted-dialog (ambient clerk + postmaster via reported-speech per college_admin precedent; Ryan present in R2 but does not speak — the not-speaking IS the register). Zero Maya dialog (FID register). Zero banned phrases. Rule 7 per-NPC voice ✓ (ambient clerk + postmaster + Ryan-silent — ambient-NPC-voice-via-reported-speech for two ambient + Ryan body-tell only). Rule 10 smell ✗ load-bearing here (Tier F errand-canvas; environmental-anchor is the cooler-door-seal at R1 + the postmaster's-