21), P4 Ryan-in-work-bay + cold-grease/metal-rubber Rule 10 smell + 'Past her shoulder the office door was the door it was on Saturdays' (Saturated tautological-register), P5 'The mirror had stopped being a thing she consulted some weeks ago. The face she had at thirty would be different from the face she had now and she was going to be ready for both' (**direct Saturated-band Mirror specimen deployed** per corruption_band_register.md:85-86 — canonical Saturated mirror-stopped-being-a-thing specimen cross-canvas from activity_mirror_look Saturated variant), P6 'She closed the ledger at the place she had left it open, laid her palm flat across the cover, lifted it. She stood up.' (Saturated subject+active-verb rhythm-break). **Non-duplicative-with-story-canvas design**: R8 deliberately omits the red-tractor-specific details (FOR SALE on printer paper, two thousand four hundred pricing, the retired-farmer archetype, straw-hat body description) that ryan_big_ticket_deal N1 the_approach has already rendered at full Operating-band weight. R8 references the blind-already-down + the office-latch at minimum-specificity (no 'blind pulled Tuesday as if for the sun' verbatim Session-12 phrasing); these anchor-to-the-story-canvas as atmosphere-continuity without duplicating its specifics. **Fixes @npc_ryan token leak** in original two-paragraph skeleton (prior content: 'The customer has been told about her without being told. He came on a Saturday because she's at the shop Saturdays. @npc_ryan is somewhere he can see the driveway but not the counter. The door closes behind her. *This is where she decides what closes with her in the room.*'). Prior italic line *This is where she decides what closes with her in the room* dropped — italic was on a whole-sentence FID announcement which violates Rule 26 'entire sentences because they feel important — banned' + Rule 21 'never have her announce her own change'; Saturated Maya doesn't narrate her own decision-moments, she moves through