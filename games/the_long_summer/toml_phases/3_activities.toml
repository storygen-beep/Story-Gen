[[canvases.nodes]]
id = "base"
name = "Prep"
blocks = [
  { type = "image", props = { file = "activities/cook_dinner_frank.jpg", description = "Mon-Fri kitchen prep window 17:30-18:30. Maya and Frank working side by side at the butcher-block counter under the window. Onion on the board, knife handed handle-first. Cast-iron skillet on the low burner. Window over the sink cracked an inch; yard-light long across the counter. Diana elsewhere in the house finishing her own pre-dinner work. Southern farmhouse, late afternoon.", search_queries = ["Southern farmhouse kitchen evening prep onion board knife stepfather teaching stepdaughter", "rural American kitchen cast-iron skillet butcher block counter cooking dinner mentor cooking lesson", "1980s-style country kitchen window dusk light cutting onions stepparent teaching cooking"] } },

  { type = "paragraph", content = "The kitchen at five-thirty on a weekday was the kitchen the cooking used. Diana had set the dining-room table by five — plates down, the short glasses, the salt — and had her own work to finish at the sewing machine or the ironing board. The kitchen from five-thirty to six-thirty had been Frank's and Maya's since the second week of June. Five chairs still at the four-person table. The window over the sink cracked an inch. An onion on the board, the board on the counter, the cast-iron on the burner at the lowest setting, the yard-light long across the sink. Frank came in through the side door at five-thirty-two." },

  # DEFAULT — Phase A baseline: pre-Restrict, pre-Crack
  { type = "group", blocks = [
    { type = "paragraph", content = "He washed his hands at the sink and dried them on the cloth folded over the oven handle. He took the knife off the magnetic strip above the counter and handed it to her handle-first. She made the first slice. It was too thick." },
    { type = "dialog", content = "Thin, Maya. Thinner than that.", props = { speaker = "npc", npcId = "npc_frank" } },
    { type = "paragraph", content = "He did not say the word twice. He set a second onion on the board and started his own work a half-step behind hers so that when she looked over she would see the thinner cut. His hands at the board were carpentry hands — blunt, capable, the cut at the base of the left thumb from a July the summer before. The raw-onion smell stung her eyes before the skillet had warmed. She kept looking." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "frank_restrict_declared", operator = "is_false" },
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_false" }
  ] } },

  # WARM — SAFE quadrant: trust >= 60, pre-Crack per frank.md book-canonical
  { type = "group", blocks = [
    { type = "paragraph", content = "He broke down the chicken for her. He laid it breast-up on the board and showed her where the bone wanted to come apart and where it would fight her. He named the joints as his knife found them." },
    { type = "dialog", content = "Wing. Oyster. Thigh. Drumstick.", props = { speaker = "npc", npcId = "npc_frank" } },
    { type = "paragraph", content = "She held the cleaver the way he showed her. She made the cut. The cleaver went through the joint the way he had said. She reached to set it down. His hand came over hers to take it back and stayed one beat longer than the taking would have needed." },
    { type = "dialog", content = "Good.", props = { speaker = "npc", npcId = "npc_frank" } },
    { type = "paragraph", content = "He did not look up. He saved the first onion for her — the one that ran worst in a person's eyes. She had not asked. He had not asked her to take it. The onion was on the near side of the board when she came back from the sink." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "npc", npc_id = "npc_frank", trait_key = "trust", operator = "gte", value = 60 },
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_false" }
  ] } },

  # TEASE_UNDER_COMPLIANCE — Operating-band Maya choosing slowness; rule held + watching the rule did not close
  { type = "group", blocks = [
    { type = "paragraph", content = "She cut slowly. She chose the slowness. The hand at the board was the hand she was letting him see. He watched her wrists. He did not say thinner and he did not hand the knife back and he did not look away. The knife was the knife he had handed her handle-first at the beginning of this week and the beginning of the week before. The rule held. The room was quieter than the rule. The compliance was the room and the watching was the thing inside the room the rule had not closed." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "frank_tease_under_compliance_open", operator = "is_true" },
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_false" }
  ] } },

  # POST_CRACK — Saturated-band register: the ritual held, the Frank-signature-word dropped
  { type = "group", blocks = [
    { type = "paragraph", content = "Frank came in through the side door at five-thirty-two. He washed his hands at the sink. He took the knife from the magnetic strip and handed it to her handle-first. The ritual was the kitchen's. The kitchen was older than what had happened in the office on the Thursday. He did not say *thinner*. He did not need to. She had internalized the cut. He worked a half-step behind her the way he had worked a half-step behind her the first time, and the working was what had continued." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_true" }
  ] } },
]
exit_block = { type = "location", text = "Set the table.", config = { destinationType = "trigger", time_progression_minutes = 60, effects = [
  { targetType = "npc", npcId = "npc_frank", trait = "trust", op = "add", value = 1 },
] } }


