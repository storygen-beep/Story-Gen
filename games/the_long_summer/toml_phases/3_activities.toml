[[canvases.nodes]]
id = "base"
name = "The Creek"
blocks = [
  { type = "image", props = { file = "activities/walk_creek.jpg", description = "Tier F at-creek contemplation canvas (sibling to activity_sketch_creek, deliberately sketchbook-ABSENT — this is the bridges-solo-and-swimming Maya-not-making-the-page-honest mode per priority queue 'Bridges solo and swimming'). loc_creek 09:00-19:00, max_triggers_per_day=1. Shallow Southern creek behind Frank's property — fifteen minutes' trail-walk down from loc_yard per book canon. Sandy bottom in one stretch, smooth stones in another. Pine canopy half-shading the slow-water pool where dragonflies work the surface in afternoon. Maya at the flat rock with hand in the cold water (R1 cool morning) or watching the sand-stretch where Ryan swam as a kid (R2 mid-day) or sitting past her own intended departure time (R3 late afternoon). Block_pool of 3 rotating-opening at-creek registers: (R1) hand-wrist-deep-in-slow-water-pool + creek-mud-smell-as-its-own-olfactory-register load-bearing + dragonflies-not-yet-arrived; (R2) Ryan-swam-here-as-a-kid-told-by-mentioning-once-never-again + Maya-let-herself-think-about-being-in-it Opening-band serial-imagining-the-body; (R3) flat-rock-warm-under-thighs-for-an-hour + Jake-knows-the-sand-stretch-but-doesn't-go + she-gave-it-five-more-first the-extending-the-staying-as-small-claim. Southern shallow creek summer Maya-solo contemplation; flat rock + slow-water-pool + pine canopy + dragonflies + sand-stretch.", search_queries = ["Southern shallow creek pine canopy slow water pool stones young woman flat rock summer", "rural Southern creek summer day young woman sitting flat rock hand in cold water cool morning", "Southern small creek behind property pine trees shallow water sandy bottom young woman contemplation afternoon"] } },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Mid-morning. The creek had not warmed past the night's temperature, the way it did not warm past the night's temperature until the sun cleared the pines. Creek-mud smell — colder than mud, the way water-cooled mud kept its own register apart from the dry kind. She sat on the flat rock and put her hand into the slow-water pool, wrist-deep. The cold went up to the elbow before her body let her notice it. The dragonflies had not arrived yet." },
    { type = "paragraph", content = "Mid-day, the sun finding her between the pines where the canopy let it through. The shallow part of the creek had a sand stretch that Ryan had told her — in his way of telling things by mentioning them once and never again — he had swum in as a kid. Maya watched the water move over the sand-stretch and let herself think about being in it, the temperature of being in it, the body that would be doing the being-in. She had not yet decided whether the decision was a decision." },
    { type = "paragraph", content = "Late afternoon. The flat rock had been warm under her thighs for an hour before she noticed she had been sitting on it for an hour. Cicadas in the pines and the slow-water pool's surface broken into half-light where the leaves moved. She knew Jake knew the sand stretch and did not come down to it — knew it the way she had come to know things about him in the course of being in the same house. The walk back up the trail would take twenty minutes. She gave it five more first." },
  ] },
]
