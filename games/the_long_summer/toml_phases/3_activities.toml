blocks = [
  { type = "image", props = { file = "activities/walk_home.jpg", description = "Late-evening to dusk rural North Alabama county road, looking back toward Frank's property at the road's end. Pavement still warm, the asphalt holding the day's heat. Long sideways shadows on the road from the low sun. Pine and kudzu lining both shoulders, canopy darker than at noon. A distant porch light landing on the gravel ahead. Maya walking the centerline in jeans and a t-shirt, dark hair pulled back, sneakers with a layer of red dust on them. The Hayes place at the bend and the trailer past the post office visible as porch-light outlines along the way. The walk-home canvas covers the half-hour from loc_main_street_sidewalk back to loc_front_porch.", search_queries = ["rural Southern county road dusk woman walking back home long shadows pine kudzu evening", "small-town North Alabama country road sunset evening woman walking centerline pine canopy porch lights distant", "rural county road late evening walking home red-dust sneakers warm pavement Southern small town arriving"] } },
  { type = "block_pool", blocks = [
    { type = "paragraph", content = "Early evening. Pavement cooling under her sneakers, the asphalt giving back the day's heat in a way the morning road never did. Shadows long sideways across the road. Cicadas still at it, the volume that meant the sun was on the way down but had not yet committed. She walked the middle of the lane because she could." },
    { type = "paragraph", content = "Dusk, the kudzu side. A pickup went by the other way and she did not turn her head to look. She had been getting tired of turning to look the way a person got tired of looking up to check that a clock had not changed in the last minute. Her sneakers had a layer of red dust now they had not had a year ago. The truck did not slow." },
    { type = "paragraph", content = "Late evening. By the time the road curved past Ryan's shop the truck was back and the shop's roll-up door was down — Ryan was inside the house already, the second-story light on. Porch light landed in a square on the gravel ahead of her. Diana's silhouette at the kitchen window, the shape of her cleaning a counter she had cleaned three times that day. Maya slowed her pace without meaning to. She had been doing the slow-down by the second week." },
    { type = "paragraph", content = "After two in the morning. The road dark in the way the road only got dark in the hour after the diner closed and before the early shifts started. She walked by the light of other people's porches — the Hayes place at the bend, the trailer past the post office, Frank's at the end. The cicadas were quieter at this hour, or her ears had stopped paying them." },
  ] },
]
exit_block = { type = "location", text = "Up the porch steps. Quiet on the boards.", config = { destinationType = "specific", locationId = "loc_front_porch", time_progression_minutes = 30 } }


