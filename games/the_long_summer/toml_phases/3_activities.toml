[[canvases.nodes]]
id = "base"
name = "The Ledger"
blocks = [
  { type = "image", props = { file = "activities/bookkeeping.jpg", description = "Mon-Fri 20:00-21:00 office hour in Frank's office. Amber desk lamp on a wooden desk facing the window that looks out at the yard. Ledger open to the week's page, pencil with the eraser worn down to the metal ferrule. Envelope of receipts on the corner of the desk. Metal filing cabinets along the wall. Door open (Frank's rule). Maya seated in the chair she pulled up her first week; Frank in his chair behind the desk. Late-evening Southern farmhouse interior, crickets through the cracked porch window.", search_queries = ["rural home office amber desk lamp ledger pencil receipts wooden desk evening", "Southern farmhouse study metal filing cabinets desk facing window paper piles stepfather bookkeeping", "1980s-style country home office dim amber light evening ledger work father daughter figure"] } },

  { type = "paragraph", content = "Frank's office at eight in the evening was a small room with a desk facing the window so he could see the yard while he worked. The amber lamp had been on the desk before Maya moved in. The ledger was open to the week. The pencil had its eraser worn down to the metal ferrule. The envelope of Friday's receipts sat on the corner of the desk where Frank had put it after dinner. The metal filing cabinets along the wall were older than the house. The window to the porch cracked open so the crickets came in. The door was open — the door was always open in the office when she was in it." },

  # DEFAULT — Phase A baseline: pre-Restrict, pre-Crack
  { type = "group", blocks = [
    { type = "paragraph", content = "He slid the ledger halfway across the desk so she could work from her chair. The week's small columns. A figure at the top of the third column she caught before she had set her pencil down — a transposed forty-seven for seventy-four in the feed-store line, the kind of mistake Frank did not make. She made the correction. He watched her make it. He did not say it was a test and he did not thank her for the catch. He turned the page and pointed to the next column with the blunt end of his pen. The discipline was in the error he had left for her and in the saying-nothing about either the error or the catch." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "frank_restrict_declared", operator = "is_false" },
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_false" }
  ] } },

  # WARM — SAFE quadrant: trust >= 60, pre-Crack per frank.md book-canonical
  { type = "group", blocks = [
    { type = "paragraph", content = "He stood to lean past her at the column and his shoulder came against hers and stayed there one beat longer than leaning-over-a-column needed. His other hand went flat on the desk to her right. The amber lamp was warm on both their hands. He did not move the shoulder away. He pointed at the figure and his finger stopped on the paper and stayed. She kept her pencil on the column. He moved back to his chair at the count he had been moving back by since the second week of June." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "npc", npc_id = "npc_frank", trait_key = "trust", operator = "gte", value = 60 },
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_false" }
  ] } },

  # TEASE_UNDER_COMPLIANCE — Operating-band same-geometry-as-WARM inside declared compliance register
  { type = "group", blocks = [
    { type = "paragraph", content = "He stood to lean past her at the column. She did not move away from the lean. The rule was that the door stayed open and the rule was that they worked on the ledger and the rule had not named the space between her chair and his desk. Her chair was the chair she had pulled across the floor on her first week. His hand was flat on the desk to her right. The crickets at the porch came through the window. He turned the page when the page was done. Nothing was said about the lean and nothing needed to be said." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "frank_tease_under_compliance_open", operator = "is_true" },
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_false" }
  ] } },

  # POST_CRACK — Saturated-band book-canonical specimen direct-transcription
  { type = "group", blocks = [
    { type = "paragraph", content = "Neither of them pretended it was about the ledger. The ledger was on the desk. The pencil was in her hand. Frank still spoke in complete sentences. The sentences were shorter. He pointed at a column and named the figure and closed the book at eight-forty-five on the minute, because nothing else in the room was still holding its shape and the clock was. She put the pencil on the desk. He put his hand flat on the desk. The amber lamp stayed on for the minute after she stood up." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_true" }
  ] } },
]
