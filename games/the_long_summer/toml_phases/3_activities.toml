[[canvases.nodes]]
id = "base"
name = "Work Bay"
blocks = [
  { type = "image", props = { file = "activities/help_fix.jpg", description = "R9 weekend + weekday afternoon 13:00-18:00 loc_shop_work_bay Help-tier hands-on-the-same-engine trust-building canvas. Work bay interior: concrete floor, blue Cub Cadet tractor with hood all the way up, Ryan bent over the engine with a socket in hand, pine workbench he built himself the year before Maya came to Millhaven, tool tray with sockets + wrenches + crescent, a second stool Ryan had set at the corner of the workbench an hour before without looking at her. Maya on the second stool. Tool-handoff body-exchange as architectural anchor — Ryan names the tool in 1-word fragments (Crescent / Socket / Three-quarter / Maya — by corruption band), Maya responds by handing the named tool across the bench. Hand-exchange moment: fingers overlapping where hers had been on the handle. INVERSE GEOMETRY to R7+R8 which had Ryan off-screen in the customer area — R9 is the canvas where Ryan is present-and-close, shared-labor register. Smell: degreaser + cold metal + cut-pine workbench. Southern summer afternoon rural-shop work-bay Help-tier shared-labor register.", search_queries = ["rural mechanic shop work bay young woman handing tool stepbrother tractor engine repair Southern", "small-engine repair bay concrete floor workbench young woman and stepbrother shared labor socket wrench", "rural equipment shop work bay hood up Cub Cadet tractor young woman on stool watching mechanic"] } },

  { type = "paragraph", content = "The work bay smelled of degreaser and cold metal and the cut-pine smell of the workbench Ryan had built himself the year before she had come to Millhaven. The concrete floor was cold through the thin soles of her canvas shoes. Ryan was bent over the blue Cub Cadet with a socket in his hand and the hood all the way up. He had set a second stool at the corner of the workbench an hour before without looking at her, because the second stool was where the second person sat if there was a second person. She took the stool. That was the rule. The rule was unspoken." },

  { type = "group", blocks = [
    { type = "paragraph", content = "She watched him work and did not say anything, because saying-anything was not what the second-stool-existed-for. He turned the socket. He set it down. He picked up another." },
    { type = "dialog", content = "Crescent.", props = { speaker = "npc", npcId = "npc_ryan" } },
    { type = "paragraph", content = "She handed him the crescent wrench from the tray, and when he took it his fingers were on the handle where hers had been on the handle, and she registered the overlap and catalogued it and did not let herself attach anything to the cataloguing." },
  ], conditions = { version = "1.0", items = [
    { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 25 }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "She knew which socket he was going to ask for before he asked for it. She had watched him do this twice this week. The fifteen-sixteenths was the one." },
    { type = "dialog", content = "Socket.", props = { speaker = "npc", npcId = "npc_ryan" } },
    { type = "paragraph", content = "She handed him the fifteen-sixteenths, and her hand brushed the back of his and neither of them moved the hand and neither of them named the not-moving, and she let herself register the not-moving as what the not-moving was." },
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 25 },
    { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 50 }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "She had the sockets by size by the end of July. She had the wrenches by width. She handed him what he needed before he had to say the word for it twice." },
    { type = "dialog", content = "Three-quarter.", props = { speaker = "npc", npcId = "npc_ryan" } },
    { type = "paragraph", content = "When her hand brushed the back of his she did not move her hand first. She let him move, or not move, and watched to see which, and he did not move, and the not-moving was a thing she had come to work out here for." },
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 50 },
    { type = "trait", subject = "player", trait_key = "corruption", operator = "lt", value = 75 }
  ] } },

  { type = "group", blocks = [
    { type = "paragraph", content = "She ran the bay the way she ran her counter at the diner. She knew where everything was and she knew what he would need before he knew." },
    { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_ryan" } },
    { type = "paragraph", content = "She did not look up on the first call-out, because the first call-out was the half-meant one. She looked up on the second. The hand-over was the hand-over. The bay was the bay. She stayed at the bench." },
  ], conditions = { version = "1.0", items = [
    { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 75 }
  ] } },
]
