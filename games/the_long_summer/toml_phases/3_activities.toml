  { type = "paragraph", content = "The truck was the one he kept because he kept the things that worked. Bench seat, cracked vinyl at the seam where the driver had worn it through, an old hand towel wadded under the bench for the coffee he spilled some weeks when he was rushing. The AM radio set to the country station out of Columbus. The visor flipped down on her side before she climbed in — he had flipped it the first week because the morning sun came through that side of the windshield on the run into town. State Route 9 into Millhaven. The stoplight at Main Street. Ninety seconds on red." },

