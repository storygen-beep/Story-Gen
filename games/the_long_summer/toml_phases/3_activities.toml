blocks = [
  { type = "image", props = { file = "activities/shop_big.jpg", description = "R8 Saturday afternoon 13:00-17:00 loc_shop_customer_area once-per-Phase-1 Crack-trigger staging canvas. Saturated-band Maya-interior pre-arrival moment from 1:45 PM to 2:00 PM — the ledger open at customer desk, the sale sheets in the stack they went in, the receipts-pad in the drawer with the new roll of paper, the Saturday-quiet particular to a room expecting someone at 2:00. Ryan in the work bay with rolling door halfway up, the socket in his hand turning in the slow count he held when not in a hurry, cold grease and metal-rubber smell drifting on the half-light from the bay. Past Maya's shoulder the office door unlocked, the blind already down. Maya-body: jeans that fit, shirt the color of the inside of a pine board, hair back in a pencil pulled off the counter, mirror-stopped-being-a-thing-she-consulted Saturated specimen. The customer has not arrived yet — the canvas stages the WAITING, not the scene. R8 delegates full scene beats (customer arrival + price-dance + back-office close + aftermath) to the Phase-2 story canvas ryan_big_ticket_deal (B18, Session 12 rewrite). Southern-summer Saturday rural-shop pre-arrival Saturated-band inhabited-routine register.", search_queries = ["rural equipment shop customer area Saturday afternoon empty waiting young woman ledger counter Southern", "small-engine parts shop Saturday quiet afternoon young woman at customer desk pre-arrival Southern summer", "rural shop interior Saturday afternoon young woman at counter with ledger open waiting for customer"] } },

  { type = "paragraph", content = "One-forty-five in the afternoon. The ledger open at the customer desk. The sale sheets in the stack they went in. The receipts-pad in the drawer with the new roll of paper Ryan had loaded on a Wednesday. Nothing left to stage. The shop had its Saturday quiet on it — the particular quiet of a room that expected someone at two o'clock and was spending the time between then and now holding the expectation in the middle of itself without saying anything about the holding." },

  { type = "paragraph", content = "At one-thirty she had done what she did on Saturdays. Turned the sign to OPEN even though the sign did not strictly need turning. Ran the dust-rag along the top of the customer desk. Took the receipts for the week out of the clip and put them in the banded stack they went in. Set the ledger at the specific angle she set it at, so that whoever walked in would see the page without seeing the numbers. She had done these things without deciding to do them, because Saturday-at-one-thirty was not a time she made decisions in." },

  { type = "paragraph", content = "She had been ready for this Saturday for three Saturdays. She had closed smaller rooms on the two before this one — one at forty over asking, one at sixty — and the smaller rooms had been the same room at different scales. She knew the scale of the afternoon the way she knew the count on the tip jar at the end of a trucker shift without counting. The customer had been told about her without being told. Word circulated in the way words circulated in a county the size of this one. She had stopped being surprised by what circulated and what did not." },

  { type = "paragraph", content = "Ryan was in the work bay with the rolling door halfway up, and the smell that came in on the half-light from that direction was the smell of cold grease and the metal-and-rubber smell of an engine that had been run in the morning and was cooling. The socket in his hand was turning in the slow count he held when he was not in a hurry about anything. Past her shoulder the office door was the door it was on Saturdays — unlocked, the blind inside already down." },

  { type = "paragraph", content = "She had worn the jeans that fit and a shirt the color of the inside of a pine board. The hair was back in a pencil she had pulled off the counter. The color in her face was the color that came on from the summer itself. She had not looked in the bathroom mirror at Frank's house before she left, and she had not needed to. The mirror had stopped being a thing she consulted some weeks ago. The face she had at thirty would be different from the face she had now, and she was going to be ready for both." },

  { type = "paragraph", content = "The afternoon held. She let it hold. At two o'clock she closed the ledger at the place she had left it open, laid her palm flat across the cover, lifted it. She stood up." },
]
# This activity does NOT set ryan_big_deal_closed. The Phase 2 story canvas
# (ryan_big_ticket_deal) handles the scene beats and sets the gate flag.
exit_block = { type = "location", text = "Cross the floor. Step out to meet him.", config = { destinationType = "trigger", time_progression_minutes = 120 } }


