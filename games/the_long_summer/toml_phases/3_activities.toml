blocks = [
  { type = "image", props = { file = "activities/watch_jake.jpg", description = "J2 ambient post-Noticed observational canvas. loc_yard back-porch + yard-slope + creek-at-the-bottom-where-kudzu-took-over. Late afternoon 16:00-20:00. Jake on the second step of the porch with sketchbook on his knees + pencils in a chipped mug beside him + drawing the landscape (the line where the yard ends and the kudzu begins). Maya on the porch boards above him — not close enough to read his page, close enough to read the back of his neck. Pure-corruption-band 4-variant register-progression (Closed catalogues working-around-her not-deciding / Opening pattern-shape-of-his-not-watching / Operating crosses-ankles-pencil-slows-one-count / Saturated tautology-tracking-stopped-being-separate-from-sitting). Rule 10 smell: cut-grass-too-many-days-ago + creek-mud + cicadas-before-they-dropped-off Southern-register. Light: cooled-iron-color afternoon. Jake artist-register: pencil works around Maya like she's a structural feature in the field of view. Southern-summer-late-afternoon back-porch yard observational ambient register.", search_queries = ["young man sketching back porch yard creek kudzu southern summer afternoon young woman watching", "rural southern back porch with steps young man drawing sketchbook landscape afternoon kudzu slope", "young woman sitting on porch boards watching young man sketch outdoor afternoon Southern rural yard"] } },

  { type = "paragraph", content = "The back porch faced southwest, and the creek was beyond the yard at the bottom of the slope where the kudzu took over. By four-thirty in the afternoon the smell that came up the slope was cut-grass-too-many-days-ago and the faint creek-mud smell that surfaced when the wind came that direction. The cicadas were at the volume they hit before they dropped off. Jake was on the second step of the porch with the sketchbook on his knees and the pencils in a chipped mug beside him. Maya sat on the boards above him, not close enough to read his page, close enough to read the back of his neck." },

  { type = "group", blocks = [
