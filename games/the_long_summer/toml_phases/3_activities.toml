[[canvases.nodes]]
id = "base"
name = "Table"
blocks = [
  { type = "image", props = { file = "activities/breakfast_frank.jpg", description = "Mon-Fri morning kitchen at Frank's house, 06:30-07:30. Worn oak kitchen table with five chairs around a table sized for four (Frank pulled the fifth in from the porch when Maya arrived). Frank's coffee mug and folded paper at the head of the table, Maya's chipped mug at the side place set for her, Diana at the stove with bacon on. Window over the sink cracked an inch; basil plant on the sill. Southern farmhouse, late spring.", search_queries = ["Southern farmhouse kitchen early morning breakfast coffee newspaper window basil sill", "1980s-style American farmhouse kitchen oak table five chairs stepfather reading paper", "rural American kitchen bacon stove coffee mug stepdaughter seated morning routine"] } },

  { type = "paragraph", content = "The kitchen at six-thirty on a weekday was Diana's kitchen. The bacon on before Maya came down; the coffee in the Bunn on before that; the paper folded to the local section on Frank's plate, the paper folded to the obituaries on Diana's. Five chairs at the four-person table because Frank had pulled a fifth in from the porch the week Maya arrived and it had stayed. The window over the sink cracked an inch. The basil on the sill from Diana's side garden." },

  # DEFAULT — low-mid trust, pre-Restrict, pre-Crack: Phase A baseline register
  { type = "group", blocks = [
    { type = "paragraph", content = "Paper open to the local section. Coffee in his mug, coffee in hers. Small exchanges about the day — the forecast, the tire on the Ford that had been holding air longer than Frank had given it six weeks to. Frank nodded at her when she sat. He read the middle column. He folded the paper in half at seven-fifteen. He rinsed his mug and set it on the drying rack on his way out the side door." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "frank_restrict_declared", operator = "is_false" },
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_false" }
  ] } },

  # WITHDRAWN — post-Restrict, pre-tease: Phase B Restrict silence-as-weight
  { type = "group", blocks = [
    { type = "paragraph", content = "Frank did not look up. Diana talked for both of them — about the preacher's wife's casserole, about the bush at the north corner of the property, about the price of propane Bob at the station had mentioned was going up in September. The toast was the loudest sound in the room. Frank's hand went flat on the paper at the place he had been reading when Maya came in and stayed there. He did not turn the page until Maya had stood up to clear her plate." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "frank_restrict_declared", operator = "is_true" },
    { type = "flag", subject = "player", flag_key = "frank_tease_under_compliance_open", operator = "is_false" }
  ] } },

  # WARM — Frank trust >= 60, pre-Crack: SAFE quadrant per frank.md
  { type = "group", blocks = [
    { type = "paragraph", content = "Frank saved the last of the coffee for her. The mug he set on her side of the table was the chipped one she had claimed in the second week, and she had not told him it was the one she preferred and he had not asked." },
    { type = "dialog", content = "Maya.", props = { speaker = "npc", npcId = "npc_frank" } },
    { type = "paragraph", content = "He did not look up when he said it. The next sentence was about the rain-gauge on the barn and was not only about the rain-gauge on the barn. He turned the page. He waited for her to say what she was going to say before he said anything more." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "trait", subject = "npc", npc_id = "npc_frank", trait_key = "trust", operator = "gte", value = 60 },
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_false" }
  ] } },

  # CONSEQUENCE — post-Crack: the register of what does not work anymore
  { type = "group", blocks = [
    { type = "paragraph", content = "The breakfast did not work anymore. Nobody named that it did not work. Frank read the paper. Frank rinsed his mug. Frank left by the side door at the same time he had been leaving by the side door on the Fridays before the Thursday of the Crack. The only difference was that Frank's *Maya* had gone from the kitchen — he did not say her name at the breakfast table now, and he did not look up when Diana said it. Diana filled the silence with a story about the garden that was about the garden and also about how the silence had always been there at this table and she had not been the one to notice it first." }
  ], conditions = { version = "1.0", items = [
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_true" }
  ] } },
]
exit_block = { type = "location", text = "Leave the dishes.", config = { destinationType = "trigger", time_progression_minutes = 30, effects = [{ targetType = "player", trait = "energy", op = "add", value = 10 }] } }


