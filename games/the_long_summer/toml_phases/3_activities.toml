ckquote>Millhaven Community College. Summer term application priority deadline: June 30. Tuition (in-state): $1,500 per term. FAFSA-based aid available.</blockquote>' — financial-aid page facts + cross-canvas to activity_read R2 ('Pell Grant. Federal Aid. Application priority deadline June 30.') + activity_jake_college (J6) ('Drawing I, Drawing II, Anatomy for Artists, Gallery Practicum') = the brochure-content thrice-anchored across read + brochure_journal + jake_college, three canvases triangulating the same college-document. **Block_pool rotations** (3, ~145w total): (R1 ~45w numbers-stayed-the-numbers — 'The numbers stayed the numbers. Fifteen hundred a term, the deadline four weeks out. She had taken the brochure from the visitor center on a Tuesday two weeks ago and the number had not made itself any smaller in the time since.' — preserved 'numbers stayed the numbers' phrase from activity_read R2 + Tuesday-two-weeks-ago specific-time anchor + 'number had not made itself any smaller in the time since' Maya-naming-the-not-changing register); (R2 ~45w pencilled-totals — 'She had pencilled possible totals on the inside of the back cover — books and fees and one term and two terms and a Pell estimate — and had erased and re-written and erased again. The eraser-marks were getting hard to write through.' — pencilled-totals-on-back-cover specific-craft register + erased-and-re-written-and-erased-again Maya-self-corrects-craft signature cross-canvas to sketch_creek R2 'erased a line that had been wrong about the way the light caught the edge' + 'eraser-marks were getting hard to write through' material-reality register-anchor); (R3 ~55w deciding-which-tonight — 'Some nights she could read the brochure and some nights she couldn't. Some nights the journal was the right register and some nights it was the brochure. The deciding was a thing she had been doing the way a person decided which side of the bed to lie on. The deciding had become its own register.' — **🎯 'the deciding had become its own register' Maya-naming-her-decision-as-register-marker signature**: the meta-frame where the act-of-deciding is itself a Maya-register; forward-applicable as Maya-Opening-band self-aware-of-her-decisions register-marker). **2-choice exit** (Rule 11/13/15 character-revealing): (Re-read brochure 'Re-read the brochure. The numbers haven't changed.' 8w — Maya-action + Maya's-knowledge embedded; preserves 'numbers haven't changed' as the canvas's signature phrase echoed-in-the-button. 20 min); (Journal 'Open the journal. Date the page.' 6w — Maya-action + journaling-discipline body-tell + date-the-page specific-craft register. 30 min). Effects asymmetric per Rule 11 (different time progressions: 20 vs 30 min — preserved exactly from original). Both labels ≤10w per Rule 16. Both Maya-actions per Rule 13. Both reveal-tone-not-consequence per Rule 15. **🎯 'The deciding had become its own register' Maya-Opening-band self-aware-of-her-decisions register-marker** [R3]: forward-applicable as Maya-meta-frame register where the act-of-deciding is itself a Maya-register. Cross-canvas to walk_property R2 'the property's two registers, the cleared and the not-cleared, and the choice was between them' (the choice-as-named-thing) + activity_shower R3 'registered the possibility of being seen before she had decided whether the registering was a thing she minded' (the noticing-of-the-noticing) = Maya-Opening-band recursive-meta-register pattern now thrice-anchored. Effects preserved exactly (energy cost 5, schedule 20:00-23:30, no exit-effects). 0 italic spans across 225w (despite blockquote being a Rule 26 typography deployment, italic is intentionally absent — the blockquote IS the typographic-marker). Zero @npc_ tokens. Zero banned phrases. Zero NPC dialog (Maya-solo desk; pure FID register). Zero Maya dialog. Rule 10 smell ✗ load-bearing here (private-desk register; the canvas's diagnostic is decision-paralysis-via-craft-register not olfactory). Rule 19 anti