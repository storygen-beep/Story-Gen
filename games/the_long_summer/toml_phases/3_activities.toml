name = "Attend service"
description = "Sunday 10 a.m. lawn-to-front-steps. Diana present. — Rewritten 2026-04-25 (Session 21, Tier F batch #2 canvas 14 of 6+ — **🎯 FIRST DIANA-IN-SCENE TIER F CANVAS**). Single-node in-place expansion. Original: image-with-1-bare-search-query (Rule 24 partial — no description) + 1 skeletal universal paragraph (~30w with @npc_diana token leak: 'The gravel lot. The lawn. The front steps. The pastor's hand. The church-couple greeting. @npc_diana a step ahead, not looking back, confident Maya will follow the pace.') + generic 5w 'Walk home with Mom.' exit. Effects: trigger costs energy 10, schedule Sunday 09:30-11:30, max_triggers_per_day=1, exit destinationType=trigger time_progression 90 min + rep_church +3. Total ~30w body sparse-template Phase 1 register. Rewrite: image-UPGRADED-with-description + 3 search_queries (Rule 24 compliance fix) + universal frame paragraph (~80w geography + Diana-ahead body-tell + smell anchor) + block_pool of 3 rotating-opening Sunday-encounter paragraphs (R1 pastor-handshake-book-canon-encounter-#7 / R2 Pruitts-couple-greeting-Diana / R3 older-women-side-door-windshield-nod-extended) + Diana 4w dialog block ('Maya. Walk with me.') + 5w Maya-action exit. ~300 authored words (Tier F target 300, on target — Diana-present canvas earns the higher density). **Hygiene fixes**: ONE @npc_diana token leak fixed (universal-frame @npc_diana → 'Diana'). **Architecture: hybrid universal-frame + block_pool + Diana-dialog-as-leaving-signal + Maya-action-exit** — first Tier F canvas with Diana-in-scene (style sheet diana.md mandatory for Diana-present canvases). Universal frame establishes Sunday-morning lawn-to-steps geography + Diana low-awareness-band body-tells (warm + present + ahead + not-looking-back + confident-routine-walk + the-answer-she-had-said-every-Sunday). Block_pool covers 3 Sunday-types each with its own ambient encounter. Diana dialog at canvas-end uses the Diana name-landing register signature ('Maya. Walk with me.' — Maya-na