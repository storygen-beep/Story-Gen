description = "Nightly sleep. Advances day, restores energy to 100. — Rewritten 2026-04-25 (Session 21, Tier F batch #1 canvas 1 of 6 — **FIRST TIER F BATCH-CANVAS**). Single-node in-place expansion. 230 authored words — image-with-description + 3-search-queries + block_pool of 4 rotating-opening baseline paragraphs (Rule 19 anti-staleness ~175w total) + 3 Keep-route flag-axis variant groups (Frank-romantic / Ryan-yes-engaged / Jake-owned ~50w total) + 4w Maya-action exit label. Target was 200w (+30w = within Tier F 150-300 range). **🌙 FIRST TIER F BATCH** — beginning Maya-solo + town-daily canvases. Tier F density per PRD: 150-300w (Failbetter dailies density per Rule 1 + rotating openings per Rule 19). Architecture pattern for Tier F daily-rotating solos: image + block_pool of N rotations + optional Keep-route flag-axis variants + tight exit. **Architecture: hybrid block_pool + flag-axis variants** matches existing prior-state structure but expanded from 3 block_pool to 4 per priority_queue spec (rotating_openings: 4). Block_pool baseline rotations fire one-per-fire randomly; Keep-route variants fire when their flag is set (Frank-romantic / Ryan-yes-engaged / Jake-owned mutually exclusive Keep-route flags from Phase 1 close). **Block_pool rotations**: (R1 fan-and-Jake's-keyboard ~40w — through-the-wall slow-tick-of-Jake's-keyboard cross-canvas to Jake-cluster aural-tells; last-thought-about-tomorrow's-shift Closed-Opening register); (R2 crickets-and-refrigerator-and-creak-counting ~45w — Maya-counts-creaks-stopped-naming-whose-foot-the-count-was-matching Opening-band household-by-sound pattern-recognition signature; cross-canvas to J3 Maya-counting-not-acknowledgings + J4 board-creak-as-register-tool); (R3 day-collapse ~35w — *She was asleep before the fan had finished its first rotation. The day collapsed into nothing the way a day collapsed when it had been an honest day. The pillow was cool on the side she had not used.* honest-day register signal); (R4 August-night ~55w — heat-and-fan + Rule-10 window-screen-dust + warm-paint-of-sill smell anchor + four-inch-gap-NOT-Jake's differentiation cross-canvas to Jake-cluster door-geometry trilogy: Maya's bedroom door has its own gap that is conspicuously NOT Jake's four-inch-gap, the differentiation IS the cross-canvas register payload). **Keep-route variants**: (V1 frank_keep_romantic=true ~15w — *The porch light was off. Frank had turned it out when she had come home.* — Frank-Keep-romantic domestic care signal); (V2 ryan_keep_yes_engaged=true ~16w — *Ryan's truck was in the driveway. He had been sleeping in her room most nights this month.* — post-Beach Yes-route domestic register); (V3 jake_keep_owned=true ~17w — *Jake's t-shirt was in her drawer, second-from-bottom under the spare jeans. She slept on top of it.* — post-Hand power-inversion artifact, Maya-keeps-Jake's-clothing-as-token register). **Hygiene fixes**: TWO @npc_jake token leaks fixed in original (R1 *@npc_jake's keyboard* → 'Jake's keyboard'; V3 *@npc_jake's shirt* → 'Jake's t-shirt'). **Rule 10 smell anchor** new for Tier F sleep-canvas (window-screen-dust + warm-paint-of-sill — August-night sleep-canvas register). **Rule 19 anti-staleness**: 4 block_pool rotations expanded from prior 3 per priority_queue spec — daily-rotating canvas anti-staleness via 4 distinct first-line registers (Jake-keyboard / crickets-creaks / day-collapse / August-night). **Maya-counts-creaks-stopped-naming-whose-foot Opening-band signature** [R2]: Maya pattern-recognizes-household-by-sound; cross-canvas to J3 not-acknowledgings + J4 board-creak-as-register-tool — household-by-sound register technique three-anchored across Frank/Jake/sleep clusters. **Four-inch-gap-NOT-Jake's signature** [R4]: Maya's bedroom-door's own four-inch-gap is differentiated from Jake's-cluster's famous four-inch-door — *the dark band of the bedroom door at the bottom of the four-inch gap was not Jake's.* The not-Jake's IS the Jake-cluster cross-canvas register; Maya's own door inherits the geometry but the geometry is not the same geometry. Forward-applicable as Tier F architectural cross-canvas pattern (Maya-solo canvases reference NPC-cluster anchors via differentiation — *what's similar but not the thing*). **Effects preserved exactly**: energy set to 100, 480 min, max_triggers_per_day=1. Trigger preserved (arrived_at_franks=true low gate, fires every night from Day 1). **Exit label enhanced** from 1w 'Sleep.' to 4w 'Lights off. Sleep takes.' — Maya-action + diegetic + tight-Tier-F-density. 0 italic spans across 230w. Zero @npc_ tokens. Zero banned phrases. Zero NPC dialog (Maya-solo canvas, NPCs rendered via aural-tells + Keep-route environmental-detail only). Zero Maya dialog (Maya-FID-narration register)."

