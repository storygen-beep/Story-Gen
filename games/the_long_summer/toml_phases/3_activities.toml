description = "Half an hour of county road out to Main Street. — Rewritten 2026-04-25 (Session 21, Tier F batch #2 canvas 11 of 6+). Single-node in-place expansion. Image-UPGRADED to full description + 3 search_queries (Rule 24 compliance fix — original had 1 query, no description) + block_pool of 4 rotating-opening road-typology paragraphs (R1 Saturday-morning Ryan's-shop-closed empty-road / R2 pickup-truck-long-look book-canon ambient-encounter-#1 / R3 afternoon pine-kudzu-cicadas-heat empty-road / R4 Sunday church-woman's-car windshield-nod book-canon ambient-encounter-#2 adapted) + 5w Maya-action exit. ~245 authored words (Tier F 150-300, target 250, on target). **Architecture: pure-block_pool tightest-Tier-F four-rotation mixed-encounter-density** — 50% empty-road (R1+R3) / 50% ambient-encounter (R2+R4) approximating book canon's 40%-ambient-encounter-fires-per-walk per `final_book.md:2908`. **R1 Saturday-morning Ryan's-shop closed** (~65w): geography-establish gravel-for-fifty-yards-then-pavement (`final_book.md:1433`) + Ryan's-shop on-property-edge cross-canvas + 'the padlock clipped through the loop the way Ryan clipped a padlock when the shop was shut for the day, not the way he clipped it for the night' Maya-knows-Ryan-by-his-tells distributed-self-recognition body-tell + yard-around-shop-empty-which-meant-buyer cross-canvas to ryan_big_ticket_deal yard-as-inventory-readout. **R2 pickup truck long-look book-canon encounter #1** (~65w): renders book-canon ambient-encounter #1 (`final_book.md:1750`) 'Pickup truck slows down; driver gives her a long look and moves on' with 'older, ball cap pulled low, a face she had not seen before' specific-noun anchor + 'the kind of look that asked a thing without expecting an answer' Maya-naming-the-social-register + 'Maya did not turn her head to follow the truck after it had passed. The not-turning was the answer.' Maya-Closed/Opening-band measured-response body-tell distributed-self-recognition. **R3 afternoon pine-kudzu heat** (~60w): 'second mile marker' specific-noun + 'pine and kudzu closed over the road, heat trapped where the canopy thinned' environmental-anchor (texture-attention) + 'red clay was ticking under her sneakers — the sound it made in the heat that she had only learned to hear after the third week of walking' Maya-the-artist-of-attention learning-the-place body-tell + 'made a list in her head and forgot half of it before the third bend' lists-she-forgets register preserved from original R1 as register-anchor. **R4 Sunday church-woman's-car windshield-nod book-canon encounter #2 adapted** (~65w): renders book-canon 'a church woman's car' road-encounter (`final_book.md:1433`) with 'a woman her mother's age, hair set the way her mother had set hers for church' Maya-Diana-implicit-grief register-anchor (mother-as-register-marker cross-canvas to diana.md + Maya's-father's-death-anniversary errands R3 — the household-grief surfaces via stranger-resemblance) + 'the windshield-nod that meant a thing in this part of the county' rural-Southern-social-register naming + 'gave the nod back without thinking' Maya-body-already-knows body-tell + **🎯 'The nod, Maya was learning, was a contract you signed by accident' Maya-Closed/Opening-band naming-the-rural-social-economy register signature** distributed-self-recognition (forward-applicable as Maya-naming-the-not-yet-named-rural-rule register-marker). Effects preserved exactly: trigger costs energy 8 + hygiene 3, exit time_progression_minutes 30 to loc_main_street_sidewalk, no exit-effects (book's per-encounter stat-firing corruption +1 / rep_road +1 is a separate engine concern not wired at canvas level). Exit upgraded from 1w 'Main Street.' to 5w Maya-action 'Step up onto the sidewalk.' per Rule 13 (sidewalk-step body-tell + Maya-arriving-at-Main-Street register-anchor). 0 italic spans across 245w. Zero @npc_ tokens (clean). Zero NPC quoted-dialog (ambient pickup-driver + church-woman silent — the body-tells are the encounter;