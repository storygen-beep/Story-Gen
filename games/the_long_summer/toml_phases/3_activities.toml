  { type = "image", props = { file = "activities/chore_supervision.jpg", description = "Phase-B post-Restrict recurring activity. The chore was named on Sunday at breakfast — this week it is split the woodpile by half for the stove, or re-stain the porch step where the wet got into the wood, or sand the barn door in the spots where the paint has begun to lift. Whatever the list named. Frank watches from a place inside the sight line: the porch chair on Wednesdays, the kitchen window on Thursdays, the top of the driveway on Saturdays. The watching does not move. Southern summer late-afternoon geometry. Frank body: hands flat on the rail (Phase-A-late rule-enforcer tell) or hands pressing into the rail (Crack-tier discipline-failing tell, post-tease). Maya body: bent over the work, hair pulled back with whatever's at hand, aware of the sight line and the count at which her awareness of the sight line becomes part of the sight line.", search_queries = ["stepfather watching stepdaughter chore yard supervision Southern tension summer afternoon", "young woman bent over yard work older man watching from porch sight line afternoon heat", "Phase B post-Restrict household discipline watching failing Southern rural domestic late afternoon"] } },

  { type = "paragraph", content = "The chore for the week had been named on Sunday at breakfast, and the chore for the week was the chore Maya did now. Split the woodpile by half for the stove. Or re-stain the porch step where the wet had got into the wood. Or sand the barn door in the spots where the paint had begun to lift. Whatever the list named. Frank watched from a place inside the sight line and not inside the sight line. The place moved. The porch chair on Wednesdays. The kitchen window on Thursdays. The top of the driveway on Saturdays. The watching did not move." },

  # RESTRICT_ONLY — narrow window after restrict_declared, before tease_under_compliance_open fires (~1 day per final_book.md:2651). Pure rule-enforcer supervision register.
  { type = "group", blocks = [
    { type = "paragraph", content = "This was Restrict in its first shape. He watched the way a man watched work he had assigned to make sure the work got done. Hands flat on the porch rail. Eye contact when she looked up — a count polite, a count past polite, broken deliberately on the count after. He did not speak unless speaking was required to correct the work. When he did speak, the correction named the thing and nothing more. The rule was doing the work of the rule, and the work was what it said it was, and that was the agreement." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "frank_tease_under_compliance_open", operator = "is_false" },
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_false" }
  ] } },

  # TEASE — the core canvas register per book. Tease-under-compliance lives here. Frank's discipline audibly failing.
  { type = "group", blocks = [
    { type = "paragraph", content = "The watching was not watching work anymore. The watching was watching her, and the work was the cover the watching took. His hands pressed into the porch rail — the two-knuckle press, the one he had when the discipline was costing him. When he corrected her, the correction ran longer than the correction needed. The kind of length that named the wanting-to-stay as an instruction. He would name the spot on the stain that was still wet, and then he would name it again a different way, and the second naming was not for the stain. She bent over the wood. She did not look up. She knew the count at which not-looking-up stopped being not-looking-up and started being the part of the watching she was doing too. There was sawdust in the crease of her elbow. She did not wipe it off." }
  ], conditions = { version = "1.0", logic = "AND", items = [
    { type = "flag", subject = "player", flag_key = "frank_tease_under_compliance_open", operator = "is_true" },
    { type = "flag", subject = "player", flag_key = "frank_cracked", operator = "is_false" }
  ] } },

  # POST_CRACK — Saturated-band what-the-watching-came-back-from register. Thursday-in-the-office cross-canvas anchor.
  { type = "group", blocks = [
    { type = "paragraph", content = "The chore list on Sunday was still the chore list. The list said split the pile or stain the step. She split the pile. She stained the step. Frank watched from where he watched. The watching was no longer the discipline failing — the discipline had failed, in the office, on the Thursday, and the Thursday was the thing the watching came back from. He did not correct her. She did not need correcting. The work got done the way the work had been getting done on the property all summer, and the property did not know what had changed in the room it could not see." }
  ], conditions = { version = "1.0", items = [
