# ─── N1 ── wake — Sunday morning, same bed as Daniel ─────────────────────────
[[canvases.nodes]]
id     = "wake"
name   = "Sunday Morning"
blocks = [
  { type = "heading",   content = "Prologue" },
  { type = "paragraph", content = "The apartment smelled like Daniel on Sunday mornings — his shampoo from the shower he'd taken before he came to bed, the specific wool of his weekend sweater on the chair, the ghost of coffee he hadn't made yet because it was still too early. Maya kept her eyes closed and took inventory the way she always did when she woke up somewhere that wasn't hers. Light against the eyelids: soft, morning, the blinds half-closed the way they had been closed last night. A car going past, two stories down. The building's heating clicked and settled. Daniel's breath against the back of her neck, not deep enough to be sleep, not awake yet either." },
  { type = "paragraph", content = "She had never told him she did this — lay in bed mapping the room before she opened her eyes. It felt like something she shouldn't describe out loud, the way some private rituals felt more hers the less they were said." },
  { type = "paragraph", content = "When she opened her eyes the ceiling was the same ceiling it had been for two years. A water mark in the shape of a comma by the vent. The paint around the light fixture a slightly different white than the paint on the rest of the ceiling, because the landlord had touched it up once without blending. She had asked Daniel about it during the second month of sleeping over and he had shrugged in the way that meant he had never seen it and did not intend to start. She had drawn the water mark in her sketchbook once — the comma, the faint halo of damp around it — and Daniel had asked her why she'd drawn something ugly. She had said it wasn't ugly. He had said she was weird and kissed her shoulder." },
  { type = "paragraph", content = "She turned slowly. The sheet slid off her hip. Daniel was on his side, face pressed into the pillow, one arm flung over her stomach like he had been reaching for her in sleep and given up halfway. His mouth was open slightly. His hair did the thing it did in the morning. She had watched him sleep hundreds of times and she had not yet figured out how to draw the particular angle of his jaw when the muscles in it let go." },
  { type = "paragraph", content = "She put her hand against his hair. The gesture was so familiar she did not register it as a decision." },
  { type = "paragraph", content = "He made a sound — the not-quite-word he made when he was waking up, which was not a word in any language but which she would have recognized over a phone line in a country she had never been to. He moved his hand where it was on her stomach. He found the hem of her shirt. His thumb went under it." },
  { type = "paragraph", content = "She watched his face come back to her. She loved this part — the specific minute between sleep and awake when the guard hadn't come up yet, when he was only the weight of himself, and she was the first thing his hand was looking for." },
  { type = "paragraph", content = "His eyes opened. He saw her. He did the small smile he did when the first thing he saw was her face, which he had done on every Sunday morning she had ever spent in this bed, and which she had never once watched without something quiet happening in her chest." },
  { type = "dialog", content = "Hey.", props = { speaker = "npc", npcId = "npc_daniel" } },
  { type = "dialog", content = "Hey.", props = { speaker = "player" } },
  { type = "paragraph", content = "Nothing was wrong." },
  { type = "paragraph", content = "The morning was just the morning." }
]
exit_block = { type = "choices", choices = [
  { text = "Continue", targetType = "node", nodeId = "prologue_morning_with_daniel.bed", time_progression_minutes = 5, flagEffects = [ { targetType = "player", flag = "prologue_at_bed" } ] },
  { text = "Skip the prologue. (Go straight to Frank's.)", targetType = "node", nodeId = "prologue_morning_with_daniel.skip_recap", time_progression_minutes = 0 }
] }

# ─── N2 ── bed — Morning sex before getting out of the bed ───────────────────
[[canvases.nodes]]
id     = "bed"
name   = "The Slow One"
blocks = [
  { type = "paragraph", content = "He kissed her. Not fully, not the way he kissed her at night — just a kiss against her mouth that was half a question, and when she answered by not moving away he kissed her again, more of one, the morning taste of him, the faint metal of last night's wine still in the very back of his tongue." },
  { type = "paragraph", content = "Then he pulled back and looked at her again, because they had been together long enough that he asked her even when he wasn't saying he was asking." },
  { type = "dialog", content = "Yeah.", props = { speaker = "player" } },
  { type = "paragraph", content = "His hand was already under her shirt. He pulled the shirt up over her head and threw it in the direction of the chair where it would miss and land on the floor, which was a fact about Daniel and also a fact about their Sunday mornings. She reached for the waist of his boxers. They had done this enough times that neither of them bothered to be clever about it. The clothes came off with the efficiency of people who had stopped performing." },
  { type = "paragraph", content = "His skin was warm from sleep. That was the thing about morning — he was not yet the person he would be at ten, when the coffee was in him and the edges came back. At eight thirty he was only warmth and the specific smell of the crook of his neck, which she had spent two years learning, which was his shampoo and his sweat and the laundry detergent his mother still bought for him and something underneath that was just Daniel, the thing that was him and no one else." },
  { type = "paragraph", content = "She pulled him onto her. He made the sound he made. She made the sound she made. The sheet tangled around their legs the way it always did and neither of them stopped to fix it." },
  { type = "paragraph", content = "He was slow this morning. Some mornings he was fast — woke up wanting and did not negotiate with himself about it — and some mornings he was slow, and this was a slow one. His hand went to her jaw first, his thumb along the edge of it, the way he touched her face only when they were in bed. His mouth at her throat. His other hand finding the shape of her hip under the tangled sheet." },
  { type = "paragraph", content = "She closed her eyes. She did not close them to be anywhere else. She closed them because she wanted to feel it without watching — the familiar weight of him, the familiar way he knew where to put his hand, the familiar quiet of the morning around them that she had been inside every Sunday for two years and would be inside on this Sunday, and next Sunday, and the Sunday after that." },
  { type = "paragraph", content = "That was the last thought she had like that." },
  { type = "paragraph", content = "She did not know yet that it was the last." },
  { type = "video",     props = { file = "prologue/n2_morning_sex.webm", description = "Morning. Two figures moving together under a tangled sheet. The slow one.", search_queries = ["young couple morning sex in bed tangled sheet soft light", "intimate lovemaking morning bedroom natural light", "boyfriend girlfriend slow tender sex tangled sheet"] } },
  { type = "paragraph", content = "When he was inside her he said her name. Not moaning it — just saying it, the way he said it when he wanted to know she was there. She said yeah. She said yeah again. Her hand was on the back of his neck and his hand was still on the edge of her jaw and the sheet was a pale rectangle of kicked-aside fabric at the foot of the bed, and the morning light did the thing it did through the half-closed blinds, striping his back in slow parallel lines." },
  { type = "paragraph", content = "It was not the kind of sex that went anywhere dramatic. It was the sex of people who had learned each other. He came first. He came saying her name again, pressed into her shoulder, and she felt it in her chest as much as her body. He stayed inside her a minute after. He kissed her temple." },
  { type = "dialog", content = "God, I love you.", props = { speaker = "npc", npcId = "npc_daniel" } },
  { type = "dialog", content = "I love you.", props = { speaker = "player" } },
  { type = "paragraph", content = "She meant it. She had meant it that morning and for the whole weekend and for every week of the last two years, and she would go on for the rest of her life not doubting that she had meant it at that moment — and she would go on for the rest of her life knowing that he had, too, even while he was also meaning it, or some version of it, to someone else." },
  { type = "paragraph", content = "He rolled off her. He pulled the sheet back up over them both. He did the hair-smoothing thing he did to her hair afterward, absent, warm, the gesture of someone who was already falling back into the morning, into coffee, into Sunday." },
  { type = "dialog", content = "I gotta get up.", props = { speaker = "npc", npcId = "npc_daniel" } },
  { type = "dialog", content = "In a minute.", props = { speaker = "player" } },
  { type = "dialog", content = "In a minute.", props = { speaker = "npc", npcId = "npc_daniel" } },
  { type = "paragraph", content = "They lay there. The heating clicked. A car went past." }
]
