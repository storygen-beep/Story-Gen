name   = "Recap"
blocks = [
  { type = "heading",   content = "Recap" },
  { type = "paragraph", content = "Sunday morning she was nineteen and in love. By Wednesday afternoon she was neither. The third door on the third floor of the Humanities building opened onto Daniel and Sarah, and neither of them looked up, and she closed the door quietly and walked out of the building and sat on a bench outside the library for fifteen minutes without opening her sketchbook. She did not cry. She did not call. She did not confront. She went home and locked the door behind her with the specific care of a person handling something breakable and sat on her bed with her coat still on and made a list in her head, and the fourth item on the list was the one she picked." },
  { type = "paragraph", content = "On Saturday night she was at a housewarming in a dress she had not worn yet, sitting on the edge of a bed upstairs with Sarah's boyfriend's hand at her waist. She had thought she might not be able to go through with it. It turned out she could. Kevin broke up with Sarah on Monday morning. By Tuesday evening Daniel had called her and she had let it go to voicemail. By Wednesday Sarah had stopped calling and started writing — long careful paragraphs about feelings and about Daniel and about how the three of them had been, in some rare fictional telling, equally complicated. Maya read the paragraphs once each and did not respond. By Thursday the group chat had gone quiet. A post she made on Instagram in the afternoon got six likes — her mother, her aunt, two bots, a girl from her art class who was always three steps behind on social information, and Kevin." },
  { type = "paragraph", content = "On Thursday Diana called. Her mother was not a person who called without a reason. Diana said the house was big and Frank's two sons were home for the summer but there was a room. Diana said the community college in Millhaven was twenty minutes from the house and better than people gave it credit for. Diana said the summer was long. Diana did the math the way Diana did math — as a fact, not as a rescue — and Maya, who had been raised on the same math, heard it. She packed that night. Sketchbook in a t-shirt. Paints. The one photograph of her father. She did not pack the dress. She drove south through Kentucky and through trees and through the radio dying somewhere outside Memphis. By late afternoon she was on a two-lane road in a county she had been to once, for an Easter, when she was fifteen. The driveway was not marked. She almost missed it. She turned in. The gravel popped under her tires." }
]
