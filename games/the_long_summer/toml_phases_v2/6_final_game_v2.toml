id = "maya"
name = "Maya"
description = "Nineteen. Just finished her first year at a four-year college in the town where Daniel lives — where Daniel lived, where Sarah lived, where the life she thought she was building lived. Slim build, average height, body still half between girl and woman. Dark hair pulled back with whatever's in reach — a cheap elastic, a pencil, the hem of a t-shirt. Arrives in a hoodie and jeans and a single suitcase. Artist-inclined: sketchbook as her one reliably honest register. Prologue-inherited: the revenge beat has already fired; the friend group has already collapsed; she arrives at Frank's already having crossed her own line, and carrying her mother's quiet offer of a transfer to the community college twenty minutes from Frank's house — a fraction of the tuition, no rent, no food cost, a way out of the debt she'd been building without noticing. Her pride won't let her ask for help — that's what the math exploits."
