# Per session_state.yaml:placeholders_resolved.ryan_customer_archetypes. Each
# archetype has a session-state flag (customer_farmer_flag / customer_scrapper_flag
# / customer_divorcee_flag). Full [[npcs]] entries so they can own dialog in
# Phase 2 shop canvases without becoming synthetic-ID hacks.

[[npcs]]
id = "npc_customer_farmer"
archetype = "wildcard"
name = "The Retired Farmer"
description = "Mid-sixties. Comes in about every other Saturday looking for small engines, the riding mower that can still do ten more years, a new-to-him tractor. Folds ten percent off asking as a matter of habit. Friendly. Talks about his grandson's 4-H project like Maya asked. Watches her when Ryan's pricing. Harmless in the way older men can be when a young woman is in the yard, which is to say: aware."
portrait = "customer_farmer.jpg"
customizable = false
relationship = "shop customer"
core_traits = { trust = 0 }
flag_keys = []

[[npcs]]
id = "npc_customer_scrapper"
archetype = "wildcard"
name = "The Out-of-Town Scrapper"
description = "Forties. Pulls up in a flatbed from two counties over once or twice a month. Bigger buyer. Knows what he's looking at. Less folksy than the farmer, less patient, more direct. The kind of man who makes a decision in twenty minutes and calls the decision by its price. His looking is flatter, more appraising — the corruption-gated variants of Ryan's shop canvases surface with him first."
portrait = "customer_scrapper.jpg"
customizable = false
relationship = "shop customer"
core_traits = { trust = 0 }
flag_keys = []

[[npcs]]
id = "npc_customer_divorcee"
archetype = "wildcard"
name = "The Recently Divorced Middle-Ager"
description = "Forty-five or so. Court-ordered settlement cash burning, looking for a truck or a toy project. Wedding-band tan line still there on the left hand. Drives a better car than he's ready to admit he drives. Half the purchase is the purchase; half is the excuse to be standing in a place a woman might look at him. The big-ticket Crack-tier variant of Ryan's shop closes runs through him when corruption is at 75+."
portrait = "customer_divorcee.jpg"
customizable = false
relationship = "shop customer"
core_traits = { trust = 0 }
flag_keys = []


