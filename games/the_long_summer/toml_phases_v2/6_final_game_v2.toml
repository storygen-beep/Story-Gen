# ─── SCENE: Frank desk-tease (multi-node, counter-gated reveals) ───
#
# Priority 7 (above hubs). Fires when corruption-gated AND Frank-arc state
# clears. Tests:
#   - Multi-node scene canvas (2 nodes: step1 → step2)
#   - npc_frank.arousal as the per-act counter (RtS pattern from §2.5b)
#   - Group variant inside node body for counter-gated reveal
#     (visit 2+ shows extra prose because frank.arousal accumulated from visit 1)
#   - Player corruption + frank_restrict_declared flag stack on canvas trigger
#
# Uses frank_restrict_declared as a flag that won't be set by any A.0/A.1
# canvas (set by the Frank-catch event in Phase D). Dry-run validates schema
# regardless of flag reachability — actual play needs the flag set first.

[[canvases]]
id = "scene_frank_lean_by_desk"
name = "Lean by the desk"
description = "Scene canvas at loc_franks_office. Priority 7 (pre-empts both hub variants). Conditions: corruption ≥ 50 AND frank_restrict_declared=true (set by Frank-catch event in Phase D). Two-node cascade. Each visit walks step1 → step2. npc_frank.arousal accumulates; visit 2's step2 reveals an extra group-variant paragraph because arousal ≥ 10 from earlier visit. Tests the explicit-tier scene pattern from §2.5b without explicit prose at this stage."

[canvases.trigger]
location = "loc_franks_office"
is_repeatable = true
priority = 7
is_active = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "arrived_at_franks", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "frank_restrict_declared", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 50 }
] }

[[canvases.nodes]]
id = "step1"
name = "Lean by the desk — first beat"
blocks = [
  { type = "image", props = { file = "scenes/frank_lean_by_desk_step1.jpg", description = "A young woman leaning her hip against the corner of a desk in a small home office; an older man at the desk holding a pen on a ledger line, eyes on the page. Late afternoon light through a single window.", search_queries = ["young woman leans hip against desk corner stepfather working at desk pen on ledger line"] } },
  { type = "paragraph", content = "He didn't look up when she came in. He kept looking up the second beat after, when she didn't speak." },
  { type = "paragraph", content = "She leaned her hip against the desk on his left side, slow enough that he saw her stop." }
]
exit_block = { type = "choices", choices = [
  { text = "Wait.", targetType = "node", nodeId = "scene_frank_lean_by_desk.step2", time_progression_minutes = 5 }
] }

[[canvases.nodes]]
id = "step2"
name = "Lean by the desk — second beat"
blocks = [
  { type = "paragraph", content = "He didn't move the pen. His thumb went under the cap and pressed it on. He set the pen down at the angle he set pens down when he was done with them." },
  # Counter-gated reveal — only renders on visit 2+ (frank.arousal accumulated)
  { type = "group", blocks = [
    { type = "paragraph", content = "He'd been doing the count of looking up at her since she'd been doing the count of standing here. The line at his mouth was deeper than it had been on the first day she'd done this." }
  ], conditions = { version = "1.0", items = [
    { type = "trait", subject = "npc", npc_id = "npc_frank", trait_key = "arousal", operator = "gte", value = 10 }
  ] } },
  { type = "dialog", content = "You're in my way.", props = { speaker = "npc", npcId = "npc_frank" } },
  { type = "dialog", content = "I know.", props = { speaker = "player" } }
]
exit_block = { type = "location", text = "Step back.", config = { destinationType = "trigger", time_progression_minutes = 15, effects = [
  { targetType = "npc", npcId = "npc_frank", trait = "arousal", op = "add", value = 5 },
  { targetType = "player", trait = "corruption", op = "add", value = 1 }
] } }
