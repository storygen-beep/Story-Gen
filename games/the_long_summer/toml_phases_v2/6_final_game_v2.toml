# WHITEBOARD GOALS
# ═══════════════════════════════════════════════════════════════════════════════
# Source: Book 2B §1. Five goals — design-deliberate count. Guide-Page content.

[[whiteboard_goals]]
id = "wb_first_rent_paid"
title = "First rent paid"
description = "Maya hands Frank sixty dollars on a Sunday morning for the first time."
completion_condition = { type = "flag", flag_key = "first_rent_paid" }
visible_in_game = true
contributing_systems = ["income_diner_t0", "income_diner_t1", "income_ryan_small"]
# Hint surfaces when: Day 5 and money < 60

[[whiteboard_goals]]
id = "wb_first_ambient_tilt"
title = "First ambient tilt — the Thursday key"
description = "Marge trusts Maya enough to close Thursday alone."
completion_condition = { type = "flag", flag_key = "first_ambient_tilt" }
visible_in_game = true
contributing_systems = ["income_diner_t1", "npc_marge"]
# Hint surfaces when: Week 3 and hired_at_diner = true and rep_road rising

[[whiteboard_goals]]
id = "wb_one_npc_keep_reached"
title = "One NPC arc to Keep tier"
description = "At least one of Frank, Ryan, or Jake reaches its Keep-tier milestone."
# OR-logic: completion fires when any of three routes is set. v4 schema shows
# only single-flag / single-trait examples; extending with `any_flag` is safe
# because the engine does not parse whiteboard_goals.
completion_condition = { type = "any_flag", flag_keys = ["frank_keep_route", "ryan_keep_route", "jake_keep_route"] }
visible_in_game = true
contributing_systems = ["npc_frank", "npc_ryan", "npc_jake"]
# Hint surfaces when: the corresponding Crack has fired

[[whiteboard_goals]]
id = "wb_brothers_discover"
title = "Brothers discover"
description = "The three men in the house register each other's awareness of Maya — Diana silent."
completion_condition = { type = "flag", flag_key = "brothers_discover" }
visible_in_game = true
contributing_systems = ["npc_frank", "npc_ryan", "npc_jake", "npc_diana"]
# Hint surfaces when: Late Phase 1 with ≥2 NPC arcs at or past mid-tier

[[whiteboard_goals]]
id = "wb_college_savings_1500"
title = "College savings threshold approached"
description = "Maya's tracked savings hit $1,500 — the stated tuition number on the brochure she took from the admin office."
# Stretch goal. Depends on college_brochure_taken being set; that dependency is
# documented here but not expressed in completion_condition (schema shows one
# condition structure per goal). Engine does not enforce; Guide Page hint logic
# in Phase 4 surfaces the money milestone only after brochure is taken.
completion_condition = { type = "trait", subject = "player", trait_key = "money", operator = "gte", value = 1500 }
visible_in_game = true
contributing_systems = ["income_diner_t2", "income_diner_t3", "income_ryan_big"]
# Hint surfaces when: savings cross $800 (any point)


