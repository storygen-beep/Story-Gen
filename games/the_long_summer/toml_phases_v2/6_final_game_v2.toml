# ─── N5 ── prep — Player choice sets calculation_tier + calc_tier_* ──────────
[[canvases.nodes]]
id     = "prep"
name   = "Preparation"
blocks = [
  { type = "paragraph", content = "There was a party at Adam's on Saturday night. Kevin and Sarah would be there because Adam and Kevin had been friends since seventh grade and Kevin went to every party Adam had ever thrown, even the ones he didn't want to go to. Maya had checked Kevin's Instagram from the couch on Thursday and confirmed. He had posted a thing at lunchtime. He would be there." },
  { type = "paragraph", content = "She had not seen Kevin in maybe six weeks. She did not dislike him. She had never disliked him. At the July barbecue he had asked her about the mural she'd done on the side of the community center and had listened to her answer in the way some people listen, which is to say completely, without performing interest, without offering his own opinion until she had finished with hers. She had thought at the time that if she had not already been with Daniel she might have noticed him." },
  { type = "paragraph", content = "She was going to use that." },
  { type = "paragraph", content = "The dress was on the bed. It was a dress she had bought in February and had not worn because she had bought it for a specific night that had not happened the way she had planned. It was black. It was not cut low. It did not need to be. It was cut the way dresses are cut when the person wearing them knows what a shoulder blade is and does not feel the need to underline it." },
  { type = "image",     props = { file = "prologue/n5_getting_ready.jpg", description = "Maya in the mirror, half-dressed. The dress on the bed.", search_queries = ["young woman half-dressed mirror bathroom getting ready evening", "woman black dress lipstick preparing for party", "college student mirror reflection putting on dress"] } },
  { type = "paragraph", content = "She stood in the bathroom in her underwear with a tube of lipstick she had forgotten she owned. The lipstick was the wrong color for her mouth in the afternoon and the right color for her mouth at nine in the evening in someone's kitchen, and she knew this because she had tested it once, eight months ago, and had written it down in the notes app on her phone because she was the kind of person who wrote down what shade of lipstick worked at what time of day under what light." },
  { type = "paragraph", content = "The mirror showed her what it usually showed her. Her mouth. The angle of her jaw. The short scar under her chin from when she was seven. She looked at herself. The person in the mirror looked back." },
  { type = "paragraph", content = "She had not asked herself yet what she was willing to do tonight. She had been careful not to ask. The not-asking was the thing she was going to have to stop, in about forty-five minutes, in the backseat of the car she was going to call, because the not-asking was a kind of cowardice that she could not take with her into Adam's house." },
  { type = "paragraph", content = "She had three ways to go about it." },
  { type = "paragraph", content = "She could rehearse. She could pick the dress and the lipstick and the line and the first and second sentence she was going to say to Kevin, and the third, and the moment she was going to put her hand on his wrist, and she could be so prepared that when it happened it would feel like the performance it was." },
  { type = "paragraph", content = "She could take a drink first. Not to lose herself. To blur the specific edges of what she was about to do so that she could do it without watching herself do it." },
  { type = "paragraph", content = "Or she could not decide. She could put on the dress and go. She could trust that her body knew more than her mind did and let her body tell her, in the room, what the next move was." },
  { type = "paragraph", content = "She stood in front of the dress." },
  { type = "paragraph", content = "The bathroom smelled like the shampoo she had used in the too-hot shower — green apple, cheap, her own." },
  { type = "paragraph", content = "She reached for the dress." }
]
exit_block = { type = "choices", choices = [
