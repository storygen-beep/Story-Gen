# NARRATIVE GATES
# ═══════════════════════════════════════════════════════════════════════════════
# Source: Book 2B §7. Five Phase-1-visible, Phase-1-locked locations.
# Every gate has: in-fiction justification, unlock event description, and a
# flag/trait condition that OPENS it. The flags referenced below are Phase 2+
# flags — they are intentionally NOT set in Phase 1, which is why these locations
# stay visible-but-unenterable. delivery_canvas_id = "" on all five because
# Book 2B §7 does not spec a Phase 1 delivery canvas; the justification is
# in-fiction diegetic (signs, seasons, tuition), not delivered by an NPC beat.

[[narrative_gates]]
id = "gate_truck_stop_bar"
gated_location_id = "loc_truck_stop_bar"
gated_canvas_id = ""
gate_condition = { type = "flag", flag_key = "phase_2_bar_unlocked" }
justification_type = "rumor"
justification_summary = "The diner does everything the bar does, legally, with Marge watching. The bar opens when she's chasing something the diner can't give her — or when a regular she knows from T2/T3 tells her come by Friday."
delivery_canvas_id = ""
delivery_npc_id = ""
unlock_event_description = "Phase 2+ — a T3 regular invites Maya by name to the bar, setting phase_2_bar_unlocked. Not authored in Phase 1."

[[narrative_gates]]
id = "gate_fairground"
gated_location_id = "loc_fairground"
gated_canvas_id = ""
gate_condition = { type = "flag", flag_key = "phase_2_fair_week_active" }
justification_type = "sign"
justification_summary = "Seasonal. The fair isn't on. Announcements in the Millhaven paper reference the August week."
delivery_canvas_id = ""
delivery_npc_id = ""
unlock_event_description = "Phase 2+ — August fair-week calendar beat sets phase_2_fair_week_active. Not authored in Phase 1."

[[narrative_gates]]
id = "gate_hs_stadium"
gated_location_id = "loc_hs_stadium"
gated_canvas_id = ""
gate_condition = { type = "flag", flag_key = "phase_2_football_season_started" }
justification_type = "sign"
justification_summary = "Friday night football hasn't started. First game is after Phase 1 closes."
delivery_canvas_id = ""
delivery_npc_id = ""
unlock_event_description = "Phase 2+ — first Friday game of the season sets phase_2_football_season_started. Not authored in Phase 1."

[[narrative_gates]]
id = "gate_church_interior"
gated_location_id = "loc_church_interior"
gated_canvas_id = ""
gate_condition = { type = "flag", flag_key = "phase_2_church_interior_unlocked" }
justification_type = "sign"
justification_summary = "Maya attends the front of the church (parking lot, lawn, front steps) for rep_church gains without entering. Interior entry requires a sustained attendance pattern that doesn't land in Phase 1's runtime."
delivery_canvas_id = ""
delivery_npc_id = ""
unlock_event_description = "Phase 2+ — sustained rep_church ≥ 80 plus an invitation beat sets phase_2_church_interior_unlocked. Not authored in Phase 1."

[[narrative_gates]]
id = "gate_college_campus"
gated_location_id = "loc_college_campus"
gated_canvas_id = ""
# Tuition-gated, not Phase-gated — college_campus opens the moment Maya can pay
# admission. The flag college_paid_admission is set by a Phase 2 canvas that
# consumes $1500 and sets this flag. In Phase 1 Maya can visit loc_college_admin
# (the brochure counter) but not loc_college_campus itself.
gate_condition = { type = "flag", flag_key = "college_paid_admission" }
justification_type = "sign"
justification_summary = "Maya has the brochure. She hasn't paid the admission fee. The admin office lets her in for one brochure visit and then sends her back to Main Street. The campus itself is visible through the gate but she has no student ID."
delivery_canvas_id = ""
delivery_npc_id = ""
unlock_event_description = "Phase 2+ — admission-pay canvas consumes $1500 and sets college_paid_admission. Not authored in Phase 1."


# ═══════════════════════════════════════════════════════════════════════════════
# INCOME CHANNELS
# ═══════════════════════════════════════════════════════════════════════════════
# Source: Book 2B §4. Six primary channels plus one optional post-trigger channel.
# Phase 3 MUST produce a matching activity canvas for each channel (same location,
# same npc, same skill_gate, same payout range, same time cost).
#
# skill_gate_condition uses the MOST RESTRICTIVE single gate per v4 schema. Tiers
# with compound gates (T1, T2, T3) document the full gate stack in tier_description.
# Payout ranges below are per-shift TOTAL — Book 2B §4 expresses tip tiers as
# "on top of base $45"; here we flatten to total-per-shift for Phase 3 matching.

[[income_channels]]
id = "income_diner_t0"
name = "Diner base wage (T0 Distance shift)"
location_id = "loc_diner"
npc_id = "npc_marge"
skill_gate_condition = { type = "flag", flag_key = "hired_at_diner" }
payout_min = 45
payout_max = 45
time_cost_minutes = 300
narrative_tone = "respectable"
tier_description = "Base $45 flat per 5-hour shift. Always available from hired_at_diner. 40 energy. No tier-mechanics."

[[income_channels]]
id = "income_diner_t1"
name = "Diner tips (T1 Play along)"
location_id = "loc_diner"
npc_id = "npc_marge"
skill_gate_condition = { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 25 }
payout_min = 53
payout_max = 65
time_cost_minutes = 300
narrative_tone = "grey"
tier_description = "Base $45 + $8–20 tips. Gate: corruption ≥ 25 AND rep_road ≥ 15 AND beauty ≥ 45. 40 energy; higher hygiene decay per shift."

[[income_channels]]
id = "income_diner_t2"
name = "Diner tips elevated (T2 Work the floor)"
location_id = "loc_diner"
npc_id = "npc_marge"
skill_gate_condition = { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 50 }
payout_min = 70
payout_max = 105
time_cost_minutes = 300
narrative_tone = "grey"
tier_description = "Base $45 + $25–60 tips. Gate: corruption ≥ 50 AND beauty ≥ 55. 50 energy (more active)."

[[income_channels]]
id = "income_diner_t3"
name = "Diner extras (T3 Back booth after close)"
location_id = "loc_diner_back_booth"
npc_id = "npc_marge"
skill_gate_condition = { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 75 }
payout_min = 50
payout_max = 200
time_cost_minutes = 90
narrative_tone = "corrupt"
tier_description = "Scene-by-scene agency, NOT a mode toggle. $50–200 per scene. Gate: corruption ≥ 75 AND specific customer flags AND first_ambient_tilt = true. +25 energy on top of T2 shift."

[[income_channels]]
id = "income_ryan_small"
name = "Ryan shop small-ticket cut"
location_id = "loc_ryans_shop"
npc_id = "npc_ryan"
skill_gate_condition = { type = "flag", flag_key = "ryan_help_tier_open" }
payout_min = 10
payout_max = 25
time_cost_minutes = 60
narrative_tone = "respectable"
tier_description = "$10–25 per close. Gate: ryan_help_tier_open (set when Maya first witnesses a small-ticket close). 15 energy per close."

[[income_channels]]
id = "income_ryan_big"
name = "Ryan shop big-ticket cut"
location_id = "loc_ryans_shop"
npc_id = "npc_ryan"
skill_gate_condition = { type = "flag", flag_key = "ryan_partner_open" }
payout_min = 80
payout_max = 300
time_cost_minutes = 240
narrative_tone = "grey"
tier_description = "$80–300 per close. Gate: ryan_partner_open AND one of {customer_farmer_flag, customer_scrapper_flag, customer_divorcee_flag} AND corruption ≥ 50 for mid-ticket or corruption ≥ 75 for full big-ticket. 30 energy per close; may consume the whole afternoon."

[[income_channels]]
id = "income_frank_chores_optional"
name = "Frank chores (post-Restrict supervision)"
location_id = "loc_property"
npc_id = "npc_frank"
skill_gate_condition = { type = "flag", flag_key = "frank_restrict_declared" }
payout_min = 5
payout_max = 20
time_cost_minutes = 45
narrative_tone = "grey"
tier_description = "Optional. $5–20 per task. Gate: frank_restrict_declared (Phase B trigger fired). Frank uses chores to keep Maya visible — the money is real, the purpose is supervision."


