[[locations]]
id          = "home_kitchen"
name        = "Kitchen"
kind        = "destination"
description = "The kitchen: where this family eats, argues and pays. Laura makes breakfast here before work and pours her wine here at night. Mark cooks on Wednesdays and owns the table on Sundays, when he seals the rent into an envelope with the landlord's name on it. The drawer by the fridge is where the letters go that nobody wants to open."
