[[locations]]
id          = "home_bathroom"
name        = "Bathroom"
kind        = "destination"
description = "The one bathroom, for four people. A shower with a door that doesn't quite shut, a sink, a lock that sticks. Ryan has it first on weekday mornings. A shower keeps you clean, and in this house somebody always needs the room while you're in it."
