[[locations]]
id          = "street"
name        = "Your Street"
kind        = "thoroughfare"
description = "Your street: the way out to everything. Your house is halfway down with Mr. Vance's porch next door. The town starts at the corner: the park, the café, the clothes shop, Zoe's building and the college gates. Every trip out walks this pavement, and every neighbour with a window sees what you wore to do it."
image       = "locations/street.jpg"
image_search_queries = ["your street"]
navigation_order = ["home_hall", "vance_house", "park", "campus", "cafe", "clothes_shop", "zoe_apartment", "party_house"]
costs = { time = 10 }
clothing_rules = [
  { conditions = { version = "1.0", logic = "AND", items = [{ type = "worn_type", operator = "eq", value = "towel" }] }, slots_required = ["legwear"], message = "Not in a towel. Get dressed first." },
  { conditions = { version = "1.0", logic = "AND", items = [{ type = "worn_type", operator = "eq", value = "sleep_shirt" }] }, slots_required = ["legwear"], message = "Not in your sleep shirt. Get dressed first." },
