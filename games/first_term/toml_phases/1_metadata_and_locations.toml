[[locations]]
id          = "street"
name        = "Your Street"
kind        = "thoroughfare"
description = "Your street: the way out to everything. Home is halfway down, with the porch next door, the corner shop on the corner, the gym across from it and the park at the far end. Campus is fifteen minutes on foot. Town is the bus, fifteen. Home is ten, the gym five. Every trip out walks this sidewalk, and every neighbor with a window sees what you wore to do it."
image       = "locations/street.jpg"
image_search_queries = ["your street"]
navigation_order = ["home", "vance_house", "park", "corner_shop", "gym", "campus", "town"]
clothing_rules = [
  { conditions = { version = "1.0", logic = "AND", items = [{ type = "worn_type", operator = "eq", value = "towel" }] }, slots_required = ["legwear"], message = "Not in a towel. Get dressed first." },
  { conditions = { version = "1.0", logic = "AND", items = [{ type = "worn_type", operator = "eq", value = "sleep_shirt" }] }, slots_required = ["legwear"], message = "Not in your sleep shirt. Get dressed first." },
  { conditions = { version = "1.0", logic = "AND", items = [{ type = "worn_type", operator = "eq", value = "short_skirt" }, { type = "trait", subject = "player", trait_key = "exhibitionism", operator = "lt", value = 20 }] }, slots_required = ["legwear"], message = "Not in that skirt. Not yet. (Needs Exhibitionism 20.)" },
  { conditions = { version = "1.0", logic = "AND", items = [{ type = "clothing_item", item_id = "sports_bra", operator = "equipped" }, { type = "clothing_slot", slot = "top", operator = "unequipped" }, { type = "trait", subject = "player", trait_key = "exhibitionism", operator = "lt", value = 20 }] }, slots_required = ["top"], message = "Not in just the sports bra. Not yet. (Needs Exhibitionism 20.)" },
