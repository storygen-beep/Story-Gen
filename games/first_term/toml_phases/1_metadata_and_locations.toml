[[locations]]
id          = "home_hall"
name        = "Hall"
kind        = "thoroughfare"
description = "The hall: the middle of the house, and the stairs. Every door opens off it — the kitchen, the living room, the garage, the one bathroom, the three bedrooms, the front door. There's a mirror by the coats, and the stairs carry every sound up and down. Nothing happens in this house that the hall doesn't hear first."
image       = "locations/home_hall.jpg"
image_search_queries = ["hall"]
entry_from  = "street"
navigation_order = ["home_kitchen", "home_living_room", "home_master_bedroom", "home_ella_room", "home_ryan_room", "home_bathroom", "home_garage", "home_front_door"]

[locations.door]
description = "Your front door, from the street. The house behind it."
no_answer   = "You stand at your own front door with your key out."

[[locations.door.options]]
text = "Go in."
conditions = { version = "1.0", logic = "AND", items = [{ type = "time_of_day", start_time = "06:00", end_time = "22:00" }] }
goes_to = { type = "enter" }

[[locations.door.options]]
text = "Let yourself in."
conditions = { version = "1.0", logic = "AND", items = [{ type = "time_of_day", start_time = "22:00", end_time = "06:00" }] }
goes_to = { type = "canvas", canvas_id = "hall_home_late" }

[[locations]]
id          = "home_kitchen"
name        = "Kitchen"
kind        = "destination"
description = "The kitchen: where this family eats, argues and pays. Laura makes breakfast here before work and pours her wine here at night. Mark cooks on Wednesdays and owns the table on Sundays, when he counts the rent into an envelope with Vance's name on it. The drawer by the fridge is where the letters go that nobody wants to open."
image       = "locations/home_kitchen.jpg"
image_search_queries = ["kitchen"]
entry_from  = "home_hall"
navigation_order = []
description_variants = [
  { conditions = { version = "1.0", logic = "AND", items = [{ type = "weekday", weekdays = [6] }, { type = "time_of_day", start_time = "08:00", end_time = "12:00" }] }, text = "Sunday morning. Mark is already at the table with the envelope and a cold coffee, and the chair across from him is pulled out for you." },
  { conditions = { version = "1.0", logic = "AND", items = [{ type = "weekday", weekdays = [0, 1, 2, 3, 4] }, { type = "time_of_day", start_time = "06:30", end_time = "08:00" }] }, text = "Breakfast. Laura moves between the kettle and the toaster in her work blouse, and the radio is on low." },
]

[[locations]]
id          = "home_living_room"
name        = "Living Room"
kind        = "destination"
description = "The living room: the couch, the big television and the dark after everyone goes up. Mark stays down here late with the sound low, long after Laura is asleep. On Saturday nights Laura waits up here, lights off, where she can see the front door. Lie on the couch and whoever walks through sees exactly what you're wearing."
image       = "locations/home_living_room.jpg"
image_search_queries = ["living room"]
entry_from  = "home_hall"
navigation_order = []

[[locations]]
id          = "home_master_bedroom"
name        = "Master Bedroom"
kind        = "destination"
description = "Laura and Mark's room: their bed, Laura's long mirror and a wardrobe full of dresses she doesn't wear any more. It smells of her perfume. When they're both out, the wardrobe is yours to go through, but when they're home, you knock."
image       = "locations/home_master_bedroom.jpg"
image_search_queries = ["master bedroom"]
entry_from  = "home_hall"
navigation_order = []

[locations.door]
description = "Laura and Mark's door, at the end of the landing."
no_answer   = "You knock. Nobody comes to the door."

[[locations.door.options]]
text = "Knock."
conditions = { version = "1.0", logic = "AND", items = [{ type = "npc_at_location", location_id = "home_master_bedroom", operator = "is_present" }] }
goes_to = { type = "enter" }

[[locations.door.options]]
text = "Go in."
conditions = { version = "1.0", logic = "AND", items = [{ type = "npc_at_location", location_id = "home_master_bedroom", operator = "is_absent" }] }
show_when_locked = true
locked_text = "Somebody's in there. Knock."
goes_to = { type = "enter" }

[[locations]]
id          = "home_ella_room"
name        = "Your Room"
kind        = "destination"
description = "Your room: your bed, your clothes, your mirror and your phone on charge. It's small, but it's the only door in the house that's yours. The wall behind your headboard is the same wall as Ryan's, and it is thin. Here you sleep, change, check your feed and see yourself the way everyone else is going to."
image       = "locations/home_ella_room.jpg"
image_search_queries = ["your room"]
entry_from  = "home_hall"
navigation_order = []

[[locations]]
id          = "home_ryan_room"
name        = "Ryan's Room"
kind        = "destination"
description = "Ryan's room: his bed, his weights in the corner, his phone always face-down. He's home most evenings and every night, and the door is usually shut. You knock to go in. Two knocks means it's you."
image       = "locations/home_ryan_room.jpg"
image_search_queries = ["ryan's room"]
entry_from  = "home_hall"
navigation_order = []

