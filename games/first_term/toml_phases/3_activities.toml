content = "Next door, on his porch, the man who owns your house: Mr. Vance. Mid-fifties, a cardigan, slippers, a newspaper folded on his knee that he isn't reading. He watches you come down the path the way he watches everything on this street, like it's his. Most of it is."

[[canvases.nodes.blocks]]
type = "dialog"
content = "You'll be Mark's girl. The student. He tells me you're paying your way now."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_vance"

