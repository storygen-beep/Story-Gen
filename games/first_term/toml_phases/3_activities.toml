# ─────────────────────────────────────────────────────────────────────────────
# TOWN — the shop's changing room, Zoe's wardrobe, the hot tub
# ─────────────────────────────────────────────────────────────────────────────

[[canvases]]
id   = "shop_try_on"
name = "Try things on"
description = "The changing room: the mirror, and where each thing counts (the shop shows only names and prices, engine.md §17)."

[canvases.trigger]
location      = "clothes_shop"
is_repeatable = true
priority      = 3
is_active     = true

[[canvases.nodes]]
id   = "changing_room"
name = "The changing room"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The changing room is a curtain that doesn't reach the wall on one side. You pull it as far as it goes and strip to your underwear in the gap, and try on what you picked."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The short skirt ($30): you turn round to look over your shoulder. The hem stops just under your ass. Wear it out of the house and people look. Wear it to the Sunday table and Mark does more than look. But you'd need to be Daring to walk out the door in it."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The sheer blouse ($20): white, soft, and you can see a bra through it, or without one, everything. It's a top for the park on a hot day, or for a lecturer who loses his place."

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The sports bra ($25): tight, black, made for running. In the park, at Daring, you could run in just this with leggings. Everybody on the path would get a show."

[[canvases.nodes.blocks]]
type = "dialog"
content = "That one's popular. With the guys, I mean."
[canvases.nodes.blocks.props]
speaker = "unknown"

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Get dressed again."
targetType = "location"
locationId = "clothes_shop"
time_progression_minutes = 20


[[canvases]]
id   = "zoe_borrow_dress"
name = "Borrow Zoe's dress"
description = "In her bedroom while she's home: zoe_party_dress to the wardrobe if she hasn't got it; Zoe watches her change."

[canvases.trigger]
location      = "zoe_bedroom"
requires_npc  = "npc_zoe"
is_repeatable = true
priority      = 3
is_active     = true

[canvases.trigger.conditions]
version = "1.0"
logic   = "AND"
[[canvases.trigger.conditions.items]]
type        = "npc_at_location"
location_id = "zoe_apartment"
npc_id      = "npc_zoe"
operator    = "is_present"

[[canvases.nodes]]
id   = "wardrobe"
name = "Zoe's wardrobe"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Zoe lies on her bed on her stomach with her chin in her hands while you go through her clothes. Half of them still have the tags on."

[[canvases.nodes.blocks]]
type = "block_pool"   # one-item pool: keeps this group out of the chain beside it
blocks = [ { type = "group", conditions = { version = "1.0", logic = "AND", items = [ { type = "clothing_item", item_id = "zoe_party_dress", operator = "not_owned" } ] }, blocks = [
  { type = "paragraph", content = "She points with her foot at a black dress on the back of the door, short and tight, with straps like string." },
  { type = "dialog", content = "That one. Put it on. No, here. I want to see.", props = { speaker = "npc", npcId = "npc_zoe" } },
  { type = "paragraph", content = "You change in front of her. She doesn't look away once. When you've got it on she whistles, low, and says keep it." },
] } ]

[[canvases.nodes.blocks]]
type = "block_pool"   # one-item pool: keeps this group out of the chain beside it
blocks = [ { type = "group", conditions = { version = "1.0", logic = "AND", items = [ { type = "clothing_item", item_id = "zoe_party_dress", operator = "owned" } ] }, blocks = [
  { type = "dialog", content = "You've got my dress. You've got the best one. What else do you want, my underwear?", props = { speaker = "npc", npcId = "npc_zoe" } },
  { type = "paragraph", content = "She laughs. Then she doesn't, and she watches you hold a top up against yourself in her mirror, and she bites her lip." },
] } ]

[canvases.nodes.exit_block]
type = "choices"

