# =============================================================================
# First Term — 3 · what she does alone in each room (the place sheets' "Rows")
#
# Piece 1 of the 0.1 build: the needs (sleep, shower, food, a wash, a soak), the
# rows that read a meter or her clothes (mirrors, the feed, the drawer, grades on
# the doors), the porch, and the way home late. The system pools (shifts, classes,
# the party, the park's pool, touching herself) are piece 4.
# Every row is a located, repeatable canvas; a once-a-day row carries
# max_triggers_per_day on its trigger (engine.md §28: a located canvas needs no flag).
# =============================================================================


# Iteration 002 (2026-10-09, part 2): the house rows moved to iterations/002/build_scripts/home.py
# (emitted into 5_scenes.toml as the HOME section). room_feed and room_selfie are gone (the phone
# owns them, wardrobe.md); hall_home_late is gone (LO, 2026-10-09, DECISIONS 75).

