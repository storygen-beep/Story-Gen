type = "paragraph"
content = "His eyes go down you and come back up without hurrying. He's not hiding it. He doesn't think he has to."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Good. Somebody in that house should. You tell your stepfather I said good evening."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_vance"

