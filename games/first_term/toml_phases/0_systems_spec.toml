# =============================================================================
# First Term — 0 · project, settings, the clock, the sidebar, rent and clothes
#
# Built 2026-10-08 from the signed sheets (sheets/systems/*.md, OPENING.md,
# DECISIONS.md) and the ledger (v2_state.json). Where the build differs from a
# sheet, the line is in iterations/001/BUILD_VS_SHEET.md.
# =============================================================================
schema_version = "1.0"

[project]
id              = "first_term"
title           = "First Term"
description     = "You're 18, in your first term of college and still living at home. From Sunday you pay your step-father rent. Your step-brother looks, your mom watches, the café pays in tips, and every Friday Zoe has a dare for you."
starting_canvas = "ryan_01_hall_first_morning"
quests_engine   = "v2"
version         = "0.1"
release_date    = "2026-10-09"

[time]
starting_hour = 7          # SP1: Monday, 07:00 — her first morning of college
starting_day  = "Monday"
starting_week = 1

[settings]
narration_person           = "second"      # IMMUTABLE once a release ships (ledger, DECISIONS 31)
clothing_enabled           = true
wardrobe_location          = ["home_ella_room", "cafe", "college_womens_toilet", "zoe_bedroom", "campus_gym"]   # the gym's locker room (DECISIONS 198)
wardrobe_anywhere          = false         # the dress rules are real: change in a room that has her clothes
wardrobe_change_on_refusal = true
saved_outfits              = true
shop_location              = "clothes_shop"

# ── the rent (money_pressure sheet · SP4 · engine.md §26) ──
# The engine takes it on her first move after Sunday 00:00. Mark's Sunday-morning
# table (mark_sunday_table, Mark's steps 1, 3, 7) sits beside the payment, never on it.
[settings.rent]
enabled          = true
due_day          = "Sunday"
collector_npc    = "npc_mark"
start_after_flag = "rent_starts"
stages      = [ { amount = 75, after_total_paid = 0 }, { amount = 90, after_total_paid = 300 }, { amount = 100, after_total_paid = 900 } ]
stage_lines = [ "", "Vance put it up. Ninety from now on. Don't look at me, it's his house.", "A hundred. Vance again. He says that's the last of it." ]
on_short         = "carry"
currency_symbol  = "$"

# (pass 3 F72, F10) The engine shows these pages on her first move after Sunday 00:00, wherever she is and whatever
# the hour, while Mark is in bed until 07:00 and in the kitchen only from 08:00. So the pages never put him in the
# room: his text, sent at midnight when he is still up (00:00-01:00, the master bedroom), says it, and she puts the
# money aside for him. This page is the one count: his Sunday table (mark.py) sits beside it and never counts it
# again (LO, 2026-11-04, Q6).
[settings.rent.text]
title        = "Sunday. The rent."
scene         = "Your step-father's text came in at midnight on the dot. It's Sunday, and he wants his money."
greeting      = "Rent. In the envelope. It goes in Vance's at the kitchen table in the morning, with you sitting there."
paid_scene    = "You fold it away for him, every bill of it. It's Mark's money now."
paid_response = "Good."
paid_closing  = "Whatever's left in your purse is yours."
cant_pay      = "\"I don't have it.\""
partial_pay   = "Put aside what you have."
carry_scene   = "You're short, and his midnight text already said what happens then."
carry_response = "Short goes on top of next week's. Vance doesn't wait, so I don't."
carry_closing = "The gap waits for next Sunday, on top of the rent."

# ── the overnight list (SP1) — every per-day cap is a *_today flag cleared here ──
# Exhibitionism phase 1 (LO, 2026-11-08): how far Exhibitionism may rise in a day, scaled from Course of
# Temptation's caps of 30/21/18/15/12/9 out of 100 a level (cot_34_database_skill.js:139). While she's Tipsy it
# can't pass the top of her sober stage: a drink opens the leave rules, it isn't a way up (DECISIONS 78, 197).
# Study 2026-11-09 (playtest_study_20261109/10_pace.md): the top games keep about 3 paying acts a day at every
# stage, and no stage over about 11-18 days. 1 a day from 60 made 20-day stages, so every band pays at least 2:
# 6.7 / 6.7 / 10 / 10 / 10 days per stage at the cap (lint `the climb's pace`).
[engine.daily_caps.exhibitionism]
bands = [ { below = 20, cap = 3 }, { below = 40, cap = 3 }, { below = 60, cap = 2 }, { below = 80, cap = 2 }, { below = 101, cap = 2 } ]
hold_band_while = ["drinks_boost"]
first_gain_message = "Someone looked, and you let them. Exhibitionism goes up when people look and you don't hide."

# Playtest 2026-11-09: repeatable acts now pay across each stage's line (cap at the next stage's
# top, recap.py), so Corruption needs the same brake Exhibitionism has, or an easy act at 0 runs
# her to 39 in an afternoon. Same bands as Exhibitionism (the-meters.md "Pace it with a daily cap").
[engine.daily_caps.corruption]
bands = [ { below = 20, cap = 3 }, { below = 40, cap = 3 }, { below = 60, cap = 2 }, { below = 80, cap = 2 }, { below = 101, cap = 2 } ]
hold_band_while = ["drinks_boost"]

