# ── the story card (Story Goals): the opening's card, then goal 1 (OPENING.md screen 9) ──
[[quest_cards]]
group    = "story_goals"
priority = 20
text     = "Week one. Class, a job, and seventy-five for Mark by Sunday."
tip      = "Psychology is Monday morning in the lecture hall. The café in town is hiring. The rent is taken on Sunday."
when     = [ { flag = "opening_done", op = "is_true" }, { days_since_flag = "opening_done", op = "lt", value = 7 } ]
goals    = [
  { flag = "hale_met", op = "is_true", label = "Go to your first class: Psychology, Monday morning, in the lecture hall" },
  { flag = "cafe_job", op = "is_true", label = "Ask for a job at the café" },
  { type = "trait", subject = "player", trait = "money", op = "gte", value = 75, label = "Have $75 by Sunday" },
]

[[quest_cards]]
group    = "story_goals"
priority = 10
text     = "Pay your own way: the rent paid your way, not Mark's."
tip      = "Mark takes the rent at the kitchen table on Sunday mornings. Four Sundays in a row paid in full from your own money ends it."
when     = [ { flag = "opening_done", op = "is_true" }, { flag = "pays_her_own_way", op = "is_false" } ]
goals    = [
  { type = "trait", subject = "player", trait = "paid_full_streak", op = "gte", value = 4, label = "Pay the rent in full from your own money, four Sundays in a row" },
]

# Goal 2 (want.promise.goals[1]) once goal 1 ends. Its end, Ella hosting the party everyone goes to (Zoe A 6), is a
# later release, so the card says so and carries no goal this release can't reach (alignment pass 2, A1/I38/E63).
[[quest_cards]]
group    = "story_goals"
priority = 10
text     = "Her name on campus: what campus says about you."
tip      = "Zoe's parties, her dares, the quad, the gym: what you do there is what campus talks about. Hosting the party everyone goes to comes in the next release."
when     = [ { flag = "opening_done", op = "is_true" }, { flag = "pays_her_own_way", op = "is_true" } ]
