# =============================================================================
# First Term — 8 · the phone (a channel, not a system: the-phone.md)
#
# One thread per person she is involved with (each person sheet's "Phone thread"
# row): Ryan, Laura, Mark, Tom, Zoe, Dr. Hale (his college email), Jake. Every text
# is caused by a flag a scene sets, with a delay and an hour window (P4). The calls
# (Laura's curfew call, the dean's office) arrive with their scenes in pieces 3-4.
# =============================================================================

[phone]
enabled = true

[[phone.apps]]
id    = "messages"
type  = "chat"
label = "Messages"

[[phone.apps]]
id    = "feed"
type  = "social_feed"
label = "Feed"
post_actions = [
  { label = "Post a selfie", followers_min = 1, followers_max = 3, counter_trait = "followers", daily_cap = 1 },
  { label = "Post one in a towel", followers_min = 3, followers_max = 6, counter_trait = "followers", daily_cap = 1, corruption_min = 20, gate_trait = "exhibitionism" },
  { label = "Post one in your underwear", followers_min = 6, followers_max = 12, counter_trait = "followers", daily_cap = 1, corruption_min = 40, gate_trait = "exhibitionism" },
]

# ── the feed looks back at her (P6): posts that read followers and campus_talk ──
[[phone.posts]]
id          = "feed_party_tag"
app         = "feed"
poster_name = "@campus_nights"
caption     = "friday at zoe's. who's the new girl 👀"
likes       = 212
image       = "phone/feed_party_tag.jpg"
search_queries = ["college house party crowd phone photo"]
[phone.posts.trigger]
conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "campus_talk", operator = "gte", value = 10 } ] }

[[phone.posts]]
id          = "feed_followers_dm"
app         = "feed"
poster_name = "@quad_watch"
caption     = "mirror pic of the week. you know who you are 🔥"
likes       = 340
image       = "phone/feed_followers_dm.jpg"
search_queries = ["girl mirror selfie bedroom phone"]
[phone.posts.trigger]
conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "followers", operator = "gte", value = 20 } ] }

# ── Ryan: caused by knows_about_kayla (his step 2) ──
[[phone.conversations]]
id     = "ryan_kayla"
app    = "messages"
npc    = "npc_ryan"
notify = "📱 Ryan"
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "knows_about_kayla", operator = "is_true" },
  { type = "days_since_flag", subject = "player", flag_key = "knows_about_kayla", operator = "gte", value = 1 },
  { type = "time_of_day", start_time = "21:00", end_time = "23:00" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "about this morning"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "mom doesn't know about her"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "your secret's safe", effects = [ { targetType = "npc", npcId = "npc_ryan", trait = "warmth", op = "add", value = 3 } ] },
  { text = "what's it worth", effects = [ { targetType = "npc", npcId = "npc_ryan", trait = "want", op = "add", value = 2 } ] },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
round = 2
content = "come knock if you're up"

# ── Ryan's repeat invite, after his step 8 (the door this release ends on) ──
