  { type = "days_since_flag", subject = "player", flag_key = "ryan_08_done", operator = "gte", value = 1 },
  { type = "weekday", weekdays = [0, 1, 2, 3, 5, 6] },
  { type = "time_of_day", start_time = "22:00", end_time = "00:00" },
] }
[[phone.conversations.blocks]]
