# ── Jake: caused by jake_number (Zoe's first party). The date is booked here. ──
[[phone.conversations]]
id     = "jake_date"
app    = "messages"
npc    = "npc_jake"
notify = "📱 Jake"
repeat_after_days = 6
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "jake_number", operator = "is_true" },
  { type = "days_since_flag", subject = "player", flag_key = "jake_number", operator = "gte", value = 1 },
  { type = "flag", subject = "player", flag_key = "jake_date_booked", operator = "is_false" },
  { type = "weekday", weekdays = [0, 1, 2, 3, 4] },
  { type = "time_of_day", start_time = "18:00", end_time = "22:00" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "you free saturday night?"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "i'll pick you up"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "saturday. pick me up", flagEffects = [ { targetType = "player", flag = "jake_date_booked", op = "set" } ] },
  { text = "not this week" },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
round = 2
content = "front door. eight. wear something"

# ── calls (the person sheets: Laura's curfew call; the dean's office arrives with college) ──
[[phone.apps]]
id    = "calls"
type  = "calls"
label = "Calls"

[[phone.calls]]
id           = "laura_curfew_call"
app          = "calls"
caller       = "npc_laura"
accept       = "laura_curfew_call"
ring_minutes = 30
notify       = "📞 Mom is calling"
[phone.calls.trigger]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "curfew", operator = "is_true" },
  { type = "hours_since_flag", subject = "player", flag_key = "curfew", operator = "gte", value = 1 },
  { type = "trait", subject = "player", trait_key = "curfew_days", operator = "gt", value = 0 },
  { type = "flag", subject = "player", flag_key = "came_home_late", operator = "is_false" },
  { type = "time_of_day", start_time = "23:00", end_time = "01:00" },
] }
[phone.calls.on_missed]
effects = [ { targetType = "player", trait = "laura_suspicion", op = "add", value = 2 } ]

