props = { speaker = "npc", npcId = "npc_zoe" }

[[canvases.nodes.blocks]]
type = "paragraph"
content = "She talks fast, about everything, Biology and the TA who blushes and a guy on the team with an ass you could bounce coins off. She looks at you a beat too long while she says it, and laughs."

