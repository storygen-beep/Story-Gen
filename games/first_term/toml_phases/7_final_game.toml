# =============================================================================
# First Term — 0 · project, settings, the clock, the sidebar, rent and clothes
#
# Built 2026-10-08 from the signed sheets (sheets/systems/*.md, OPENING.md,
# DECISIONS.md) and the ledger (v2_state.json). Where the build differs from a
# sheet, the line is in iterations/001/BUILD_VS_SHEET.md.
# =============================================================================
schema_version = "1.0"

[project]
id              = "first_term"
title           = "First Term"
description     = "You're 18, in your first term of college and still living at home. From Sunday you pay your step-father rent. Your step-brother looks, your mom watches, the café pays in tips, and every Friday Zoe has a dare for you."
starting_canvas = "ryan_01_hall_first_morning"
quests_engine   = "v2"
version         = "0.1"
release_date    = "2026-10-09"

[time]
starting_hour = 7          # SP1: Monday, 07:00 — her first morning of college
starting_day  = "Monday"
starting_week = 1

[settings]
narration_person           = "second"      # IMMUTABLE once a release ships (ledger, DECISIONS 31)
clothing_enabled           = true
wardrobe_location          = ["home_ella_room", "cafe", "college_womens_toilet", "zoe_bedroom"]
wardrobe_anywhere          = false         # the dress rules are real: change in a room that has her clothes
wardrobe_change_on_refusal = true
saved_outfits              = true
shop_location              = "clothes_shop"

# ── the rent (money_pressure sheet · SP4 · engine.md §26) ──
# The engine takes it on her first move after Sunday 00:00. Mark's Sunday-morning
# table (mark_sunday_table, Mark's steps 1, 3, 7) sits beside the payment, never on it.
[settings.rent]
enabled          = true
due_day          = "Sunday"
collector_npc    = "npc_mark"
start_after_flag = "rent_starts"
stages      = [ { amount = 75, after_total_paid = 0 }, { amount = 90, after_total_paid = 300 }, { amount = 100, after_total_paid = 900 } ]
stage_lines = [ "", "Vance put it up. Ninety from now on. Don't look at me, it's his house.", "A hundred. Vance again. He says that's the last of it." ]
on_short         = "carry"
currency_symbol  = "$"

[settings.rent.text]
title         = "Sunday. The rent."
scene         = "Mark is at the kitchen table with an envelope in front of him and a coffee going cold beside it. Vance's name is on the envelope, in Mark's writing. He doesn't look up when you come in."
greeting      = "Rent. On the table."
paid_scene    = "You count it out onto the table, bill by bill. He counts it again, slower, licking his thumb."
paid_response = "That's the week."
paid_closing  = "He folds the money into the envelope and pushes your chair back in with his foot."
cant_pay      = "You don't have it. He looks at the empty table, then at you, for a long time. \"Then it's owed. Vance doesn't wait, so I don't.\""
partial_pay   = "\"That's short.\" He counts it anyway, and writes what's left on the back of the envelope. \"Next week. On top.\""

