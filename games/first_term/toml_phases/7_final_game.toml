[[canvases.nodes.blocks]]
type = "paragraph"
content = "The lecture hall is half full and loud. The only free seats are in the front row. A girl with big glasses and a cardigan waves you over and moves her bag off the seat beside her."

[[canvases.nodes.blocks]]
