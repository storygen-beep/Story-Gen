# ── screen 7 · breakfast: Laura, Mark, the rent, the start choice ──
[[canvases.nodes]]
id   = "breakfast"
name = "Breakfast"

[[canvases.nodes.blocks]]
type = "image"
[canvases.nodes.blocks.props]
file           = "scenes/opening_breakfast.jpg"
description    = "a family kitchen in the morning, a woman in her forties in a work blouse pouring coffee, a man with car keys at the counter"
search_queries = ["family kitchen morning mom pouring coffee", "suburban kitchen breakfast parents work clothes"]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your mom, Laura, is at the counter in her work blouse, pouring coffee into two mugs. Forty-one, pretty in a way she's stopped noticing, hair still damp. She pushes one mug at you before you've sat down."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Mark, your step-father, stands by the back door with his car keys in his hand. Forty-six, work boots, the face of a man who is already late and has decided it's somebody else's fault. He looks at you over his coffee."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Sunday. Kitchen table. All of it."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_mark"

[[canvases.nodes.blocks]]
type = "dialog"
content = "Mark. It's her first day."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_laura"

[[canvases.nodes.blocks]]
type = "dialog"
content = "And on Sunday it'll be her first rent. Seventy-five. Vance doesn't take excuses, so I don't."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_mark"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Laura sighs and lets it go. She sits down across from you and wraps both hands round her mug, and for a second she looks at you like she's seeing someone she doesn't know yet."

[[canvases.nodes.blocks]]
type = "dialog"
content = "So. What do you want from college, sweetheart?"
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_laura"

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text        = "\"Good grades.\""
targetType  = "node"
nodeId      = "rule"
time_progression_minutes = 10
flagEffects = [ { targetType = "player", flag = "college_for_grades", op = "set" }, { targetType = "player", flag = "rent_starts", op = "set" } ]

[[canvases.nodes.exit_block.choices]]
text        = "\"Fun.\""
targetType  = "node"
nodeId      = "rule"
time_progression_minutes = 10
flagEffects = [ { targetType = "player", flag = "college_for_fun", op = "set" }, { targetType = "player", flag = "rent_starts", op = "set" } ]

[[canvases.nodes.exit_block.choices]]
text        = "\"Freedom.\""
targetType  = "node"
nodeId      = "rule"
time_progression_minutes = 10
flagEffects = [ { targetType = "player", flag = "college_for_freedom", op = "set" }, { targetType = "player", flag = "rent_starts", op = "set" } ]

# ── screen 8 · the reaction, and Laura's rule ──
[[canvases.nodes]]
id   = "rule"
name = "Laura's rule"

[[canvases.nodes.blocks]]
type = "group"
conditions = { version = "1.0", logic = "AND", items = [ { type = "flag", subject = "player", flag_key = "college_for_grades", operator = "is_true" } ] }
blocks = [ { type = "paragraph", content = "Laura beams like you've handed her something. Mark snorts into his coffee." } ]

[[canvases.nodes.blocks]]
type = "group"
conditions = { version = "1.0", logic = "AND", items = [ { type = "flag", subject = "player", flag_key = "college_for_fun", operator = "is_true" } ] }
blocks = [
  { type = "paragraph", content = "Laura laughs, surprised, and covers her mouth. Mark doesn't laugh." },
  { type = "dialog", content = "Fun's not free. Seventy-five.", props = { speaker = "npc", npcId = "npc_mark" } },
]

[[canvases.nodes.blocks]]
type = "group"
conditions = { version = "1.0", logic = "AND", items = [ { type = "flag", subject = "player", flag_key = "college_for_freedom", operator = "is_true" } ] }
blocks = [ { type = "paragraph", content = "Laura goes quiet and looks into her coffee. Mark looks at you a beat too long, over the rim of his mug, like you've said something about him." } ]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The stairs thump and Ryan comes in with his hair wet, in a fresh T-shirt, and reaches past you for the toast. His arm brushes your shoulder. Laura watches it happen. She looks at him, then at you, then at him again."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Ryan, you shower first from now on. Before your sister's up. I'm not having the two of you in that hall in towels."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_laura"

[[canvases.nodes.blocks]]
type = "dialog"
content = "Fine by me."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_ryan"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Mark leaves without saying goodbye. The back door bangs. Ryan takes his toast upstairs, and his door shuts behind him."

