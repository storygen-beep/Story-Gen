[[canvases.nodes]]
id   = "no"
name = "A kiss on the cheek"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "You kiss his cheek, quick, and step back before he can turn it into more. Jake wanted the porch rail. It's all over his face, but he lets it go. \"Okay, @player. Next Saturday, then?\" He's disappointed, and somehow he's grinning harder than before. \"Next Saturday,\" you say, and your stomach flips. Jake walks backwards down the path, still grinning at your door."

