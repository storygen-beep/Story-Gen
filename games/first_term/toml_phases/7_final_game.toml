[[canvases.nodes]]
id   = "shift"
name = "Three hours"

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "paragraph", content = "The lunch rush hits all at once: twelve coffees, a birthday, a baby that screams through all of it. You carry plates until your arms burn. A man at table two tells you you've got a lovely smile and leaves his number on a napkin under the tip." },
  { type = "paragraph", content = "Slow afternoon. You wipe tables that are clean and refill sugar that's full, and the regulars at the counter watch you bend over to do it. One of them pretends to read his phone the whole time, upside down." },
  { type = "paragraph", content = "A table of guys from the team come in and order nothing but coffee for an hour so they can watch you walk back and forth. Tom lets them. They tip like they're trying to impress each other." },
  { type = "paragraph", content = "Two women in gym clothes, a businessman on a call, a pensioner who wants his toast cut into soldiers. Your feet hurt, but you're good at this. You can feel it in the tips." },
]
props = { id = "cafe_shift_lines", memory = "seen" }

