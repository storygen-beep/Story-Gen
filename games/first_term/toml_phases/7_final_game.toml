app    = "messages"
npc    = "npc_hale"
notify = "📧 College email: Dr. Hale"
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "hale_02_done", operator = "is_true" },
  { type = "days_since_flag", subject = "player", flag_key = "hale_02_done", operator = "gte", value = 1 },
  { type = "weekday", weekdays = [0, 1, 2, 3, 4] },
  { type = "time_of_day", start_time = "09:00", end_time = "17:00" },
] }
[[phone.conversations.blocks]]
type = "message"
