effects = [{ targetType = "npc", npcId = "npc_ryan", trait = "warmth", op = "add", value = -10 }, { targetType = "npc", npcId = "npc_ryan", trait = "want", op = "add", value = 5 }]

[[canvases.nodes]]
id   = "after"
name = "Next Saturday"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Jake goes off down the path, whistling. You let yourself in and climb the stairs. Ryan's door is shut, and his light is on under it. You stand outside it a second. You don't knock, but you don't move either. You wanted him to see. You said Jake's name to his face on purpose, and you're not sorry. Not even a little. Jake will want a next Saturday. You already know it. Your phone buzzes in your hand. It's Jake: \"Next Saturday?\" Under Ryan's door, the light goes out."

