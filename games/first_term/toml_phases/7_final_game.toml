targetType = "node"
nodeId = "no"
time_progression_minutes = 2

[[canvases.nodes]]
id   = "rail"
name = "The rail"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "You kiss him first, right there under the porch light. Jake makes a low sound and lifts you onto the rail like you weigh nothing. Your legs lock round his waist. His hands sit on your hips, then slide down to grab your ass. \"God, @player,\" he breathes into your mouth. It gets hungry and loud, all teeth and breath. The rail creaks every time he pulls you closer. Anyone inside could hear it, but you don't care. You want more of his mouth. Then, behind you, the lock turns."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "\"Don't stop.\""
targetType = "node"
nodeId = "ryan"
time_progression_minutes = 3

[[canvases.nodes]]
id   = "ryan"
name = "Ryan"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "The front door opens behind you. Ryan stands in the doorway and stops dead. You're on the porch rail with your legs locked round Jake's waist, kissing him. Jake's hands are full of your ass. You don't climb down. You look straight at Ryan over Jake's shoulder and hold it. \"Ryan, this is Jake. My boyfriend.\" Ryan's jaw goes tight. His eyes drop to Jake's hands on you, then come back to your face. \"Great.\" Jake grins over his shoulder, not getting it. \"Your brother hates me.\" *Good. Look all you want, Ryan.* Ryan steps back inside without another word. The door slams hard."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "\"Goodnight, Jake.\""
targetType = "node"
