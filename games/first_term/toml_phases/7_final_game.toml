[[canvases.nodes]]
id   = "card"
name = "Your first week"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Class at half past eight. A café on your street with a sign in the window. Seventy-five for Mark by Sunday. And Ryan's door, shut, at the top of the stairs."

[[canvases.nodes.blocks]]
type    = "heading"
content = "How this week works"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You need $75 by Sunday: the rent is taken then. The café on your street is hiring. Classes are three a day Monday to Thursday and one on Friday; skipping one costs your grade. People are in different places at different hours: the People and Schedules pages show where. What you wear changes how people look at you. Hygiene is on unless you turn it off now: shower to keep it up."

