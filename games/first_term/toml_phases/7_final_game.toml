# =============================================================================
# First Term — 8 · the phone (a channel, not a system: the-phone.md)
#
# One thread per person she is involved with (each person sheet's "Phone thread"
# row): Ryan, Laura, Mark, Tom, Zoe, Dr. Hale (his college email), Jake. Every text
# is caused by a flag a scene sets, with a delay and an hour window (P4). The calls
# (Laura's curfew call, the dean's office) arrive with their scenes in pieces 3-4.
# =============================================================================

[phone]
enabled = true

[[phone.apps]]
id    = "messages"
type  = "chat"
label = "Messages"

