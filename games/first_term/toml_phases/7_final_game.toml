[[canvases.nodes]]
id   = "knock"
name = "Vance"

[[canvases.nodes.blocks]]
type = "paragraph"
content = "Three knocks, slow and heavy, the way a man knocks on a door he owns. Mr. Vance is on the step in his cardigan, with an envelope in his hand."

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "npc", npc_id = "npc_vance", trait_key = "power", operator = "lt", value = 60 }] }, blocks = [{ type = "dialog", content = "Evening, Miss. Is your stepfather in? Tell him I came by about Sunday. He'll know.", props = { speaker = "npc", npcId = "npc_vance" } }, { type = "paragraph", content = "He hands you the envelope. His fingers stay on it a second after yours close." }] },
]

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "npc", npc_id = "npc_vance", trait_key = "power", operator = "gte", value = 60 }] }, blocks = [{ type = "dialog", content = "I didn't come for Mark. I came for you, Miss. You're the one who pays in that house now, aren't you?", props = { speaker = "npc", npcId = "npc_vance" } }, { type = "paragraph", content = "He looks past you into the hall, then back at you, slow, all the way down and up." }, { type = "dialog", content = "Come and see me one evening. We'll talk about what's owed.", props = { speaker = "npc", npcId = "npc_vance" } }] },
]

[[canvases.nodes.blocks]]
type = "block_pool"
blocks = [
  { type = "group", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "npc", npc_id = "npc_vance", trait_key = "want", operator = "gte", value = 30 }] }, blocks = [{ type = "paragraph", content = "He doesn't look at your face once while he says it." }] },
]

[[canvases.nodes.blocks]]
type = "thought_bubble"
content = "A short week, and it comes to the door."
props = { speaker = "player" }

