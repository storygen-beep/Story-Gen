npc    = "npc_zoe"
notify = "📱 Zoe"
repeat_after_days = 6
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "zoe_met", operator = "is_true" },
  { type = "days_since_flag", subject = "player", flag_key = "zoe_met", operator = "gte", value = 2 },
  { type = "weekday", weekdays = [4] },
  { type = "time_of_day", start_time = "18:00", end_time = "22:00" },
] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "run with me tomorrow?"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "meet me at the park gates"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "see you there" },
  { text = "sleeping in" },
]

# ── Dr. Hale (his college email): caused by hale_02_done ──
