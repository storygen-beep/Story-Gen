[[canvases.nodes.blocks]]
type = "paragraph"
content = "The girl from your Biology class, the one who whispers through the slides, is lying on the grass on her elbows with her sunglasses pushed up in her hair. She sees you and waves both arms over her head like you're a plane she's landing."

