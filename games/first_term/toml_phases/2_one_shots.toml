name = "The hall"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You get the bathroom first, before anyone. When you come out in the towel, Ryan is in the hall. His eyes drop down your bare legs and come back up slow, and stop on the knot at your chest. He doesn't move out of your way."

[[canvases.nodes.blocks]]
type = "dialog"
content = "First day of college, huh. Look at you."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_ryan"

