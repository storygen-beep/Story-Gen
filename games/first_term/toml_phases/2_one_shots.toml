content = "Down the hall the shower is running again: Ryan, in the bathroom now, taking his turn. Laura looks toward the sound, then at your wet hair, then toward the sound again."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Ryan showers first from now on. Before you're up. I'll tell him. I'm not having the two of you in that hall in towels."
