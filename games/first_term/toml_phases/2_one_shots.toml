# ── screen 2 · the boot: who she is ──
[[canvases.nodes]]
id   = "wake"
name = "Monday"

[[canvases.nodes.blocks]]
type = "image"
[canvases.nodes.blocks.props]
file           = "scenes/opening_wake.jpg"
description    = "a girl waking in a small bedroom, morning light, alarm on the phone, posters, clothes on a chair"
search_queries = ["girl waking up bedroom morning phone alarm", "young woman in bed morning light"]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your alarm goes at seven and you're already awake, staring at the ceiling of the room you've slept in since you were twelve. Monday. Your first day of college."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You're eighteen. You still live at home, in this house, with your mom and your step-father and your step-brother and one bathroom between the four of you. You've never had a job. You've never had a lock on anything that was yours. Your account has nothing in it, and you checked twice."

[[canvases.nodes.blocks]]
type = "thought_bubble"
content = "College. New people. Nobody there knows the old you. That has to count for something."
[canvases.nodes.blocks.props]
speaker = "player"

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Get up."
targetType = "node"
nodeId     = "problem"
time_progression_minutes = 3
wardrobeEffects = [ { action = "add", item_id = "sleep_shirt" }, { action = "add", item_id = "towel" } ]

[[canvases.nodes.exit_block.choices]]
text       = "Skip the opening"
targetType = "node"
nodeId     = "card"
time_progression_minutes = 45
wardrobeEffects = [ { action = "add", item_id = "sleep_shirt" }, { action = "add", item_id = "towel" } ]
flagEffects = [
  { targetType = "player", flag = "rent_starts", op = "set" },
  { targetType = "player", flag = "laura_rule_ryan_first", op = "set" },
  { targetType = "player", flag = "ryan_hall_seen", op = "set" },
]
effects = [ { targetType = "player", trait = "ryan_step", op = "set", value = 1 }, { targetType = "npc", npcId = "npc_ryan", trait = "want", op = "add", value = 10 } ]

# ── screen 3 · the problem ──
[[canvases.nodes]]
id   = "problem"
name = "Seventy-five"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Last night Mark put his fork down at dinner and said it like he'd been saving it. You're an adult now. Adults pay their way. Seventy-five a week, from Sunday, at the kitchen table. Laura looked at her plate and said nothing, which is how you knew it was real."

[[canvases.nodes.blocks]]
type = "thought_bubble"
content = "Seventy-five a week. With what? You don't have seventy-five. You don't have seven."
[canvases.nodes.blocks.props]
speaker = "player"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Somewhere in town somebody is hiring a girl with no experience. You have six days to find them. First, you need a shower, before anyone else in this house gets to the bathroom."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Grab a towel."
targetType = "node"
nodeId     = "shower"
time_progression_minutes = 2

# ── screen 4 · the shower ──
[[canvases.nodes]]
id   = "shower"
name = "The one bathroom"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The bathroom is still cold from the night. You lock the door, but the lock sticks halfway like it always has. The walls in this house are paper. You can hear the kettle downstairs, and Mark's radio, and the bed creak next door in Ryan's room as he gets up."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You stand under the water until it runs hot, and you let yourself have one minute. Then the handle rattles."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Some of us have places to be, @player.nickname."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_ryan"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Ryan. Your step-brother, through the door, right outside it. You turn the water off and wrap the towel round yourself and tuck it in over your tits. It covers you. Mostly."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Open the door."
targetType = "node"
nodeId     = "hall"
time_progression_minutes = 10
wardrobeEffects = [ { action = "unequip", item_id = "plain_bra" }, { action = "unequip", item_id = "plain_panties" }, { action = "unequip", item_id = "sneakers" }, { action = "equip", item_id = "towel" } ]

# ── screen 5 · the hall: Ryan, the first look (Ryan step 1) ──
[[canvases.nodes]]
id   = "hall"
name = "The hall"

[[canvases.nodes.blocks]]
type = "image"
[canvases.nodes.blocks.props]
file           = "scenes/ryan_01_hall.jpg"
description    = "a young man in a t-shirt leaning on a hallway wall, looking at a girl stepping out of a bathroom in a towel, morning"
search_queries = ["guy leaning on hallway wall girl in towel bathroom door", "girl in towel hallway morning brother waiting"]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Ryan is leaning on the wall opposite the bathroom door with his arms folded and his towel over his shoulder. Twenty-two, Mark's son, broad from lifting at the yard. He's waiting his turn, and he doesn't move out of your way."

[[canvases.nodes.blocks]]
type = "dialog"
content = "First day of college, huh. Look at you."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_ryan"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "His eyes go down your legs, all the way to your wet feet, and come back up slower. He doesn't hide it. He's never once looked at you like this, and you're standing in a towel in the hall with nothing under it, and your face goes hot all at once."

[[canvases.nodes.blocks]]
type = "thought_bubble"
content = "He's your brother. Step-brother. He's looking at you like you're not."
[canvases.nodes.blocks.props]
speaker = "player"

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text        = "Run to your room."
targetType  = "node"
nodeId      = "run"
time_progression_minutes = 3
flagEffects = [ { targetType = "player", flag = "ryan_hall_seen", op = "set" } ]
effects     = [ { targetType = "npc", npcId = "npc_ryan", trait = "want", op = "add", value = 10 } ]

[[canvases.nodes.exit_block.choices]]
text        = "Knock next time."
targetType  = "node"
nodeId      = "knock"
time_progression_minutes = 3
flagEffects = [ { targetType = "player", flag = "ryan_hall_knock", op = "set" } ]

[[canvases.nodes.exit_block.choices]]
text        = "Stop and talk."
targetType  = "node"
nodeId      = "talk"
time_progression_minutes = 3
flagEffects = [ { targetType = "player", flag = "ryan_hall_talked", op = "set" } ]
effects     = [ { targetType = "npc", npcId = "npc_ryan", trait = "warmth", op = "add", value = 5 } ]

[[canvases.nodes.exit_block.choices]]
text        = "Don't ever look at me like that. (ends his path)"
targetType  = "node"
nodeId      = "final"
time_progression_minutes = 3
flagEffects = [ { targetType = "player", flag = "ryan_01_hall_first_morning_closed", op = "set" } ]

# ── screen 6 · the reaction ──
[[canvases.nodes]]
id   = "run"
name = "Down the hall"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You hold the towel shut with both hands and go, fast, past him, close enough to smell his sleep. Your face is burning. You feel his eyes on the backs of your legs the whole way down the hall, and you don't look round, but you know he's still watching when your door shuts."

[[canvases.nodes.blocks]]
type = "dialog"
content = "@player, you'll be late on your first day!"
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_laura"

[canvases.nodes.exit_block]
type = "choices"

