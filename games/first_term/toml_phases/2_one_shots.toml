# =============================================================================
# First Term — 2 · the opening (sheets/OPENING.md · sheets/scenes/ryan_01_hall_first_morning.md)
#
# A staged open, one canvas: the boot in her room (screens 2-4), Ryan step 1 in
# the hall (5-6), breakfast and Laura's rule (7-8), the card (9). It is the
# starting canvas, so the ladder's `fires_from = "opening"` holds, and it is
# located at the hall (the ledger's `where`). The clock after each screen is the
# sheet's: 07:03 · 07:05 · 07:15 · 07:18 · 07:30 · 07:40 · 07:45 · 07:50, and it hands
# over in the kitchen at 07:50, where Laura is until 08:00.
# =============================================================================

