name = "Don't"

[[canvases.nodes.blocks]]
type = "dialog"
content = "Don't ever look at me like that."
[canvases.nodes.blocks.props]
speaker = "player"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He goes white. He steps back against the wall like you slapped him, and he looks at the carpet."

[[canvases.nodes.blocks]]
type = "dialog"
