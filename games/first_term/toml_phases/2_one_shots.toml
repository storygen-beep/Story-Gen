[canvases.nodes.blocks.props]
speaker = "player"

[[canvases.nodes.blocks]]
type = "dialog"
content = "Yeah. Sorry."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_ryan"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He says sorry, but he doesn't step back, and he doesn't look away until you're past him. Your face is still hot when you shut your door."

[[canvases.nodes.blocks]]
type = "dialog"
content = "@player, you'll be late on your first day!"
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_laura"

