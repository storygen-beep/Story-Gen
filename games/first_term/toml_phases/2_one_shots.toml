[[canvases.nodes]]
id   = "breakfast"
name = "Breakfast"

[[canvases.nodes.blocks]]
type = "image"
[canvases.nodes.blocks.props]
file           = "scenes/opening_breakfast.jpg"
description    = "a family kitchen in the morning, a woman in her forties in a work blouse pouring coffee, an envelope propped against the sugar bowl"
search_queries = ["family kitchen morning mom pouring coffee", "suburban kitchen breakfast parents work clothes"]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Your mom, Laura, is at the counter in her work blouse, pouring coffee into two mugs. Forty-one, pretty in a way she's stopped noticing, hair still damp. She pushes one mug at you before you've sat down."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Mark, your step-father, has already gone to work. Forty-six, work boots, always late and always somebody else's fault. His mug is in the sink, and an empty envelope is propped against the sugar bowl with RENT on it in his capitals and SUNDAY underlined twice."

[[canvases.nodes.blocks]]
type = "dialog"
content = "He knows it's your first day. He left it anyway."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_laura"

[[canvases.nodes.blocks]]
type = "dialog"
content = "Seventy-five, Sunday, at this table. Vance doesn't take excuses, so Mark doesn't either."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_laura"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Laura sighs and turns the envelope face-down. She sits down across from you and wraps both hands round her mug, and for a second she looks at you like she's seeing someone she doesn't know yet."

[[canvases.nodes.blocks]]
type = "dialog"
content = "So. What do you want from college, sweetheart?"
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_laura"

