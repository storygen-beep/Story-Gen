# ── screen 5 · the hall: Ryan, the first look (Ryan step 1) ──
[[canvases.nodes]]
id   = "hall"
name = "The hall"

[[canvases.nodes.blocks]]
type = "image"
[canvases.nodes.blocks.props]
file           = "scenes/ryan_01_hall.jpg"
description    = "a young man in a t-shirt leaning on a hallway wall, looking at a girl stepping out of a bathroom in a towel, morning"
search_queries = ["guy leaning on hallway wall girl in towel bathroom door", "girl in towel hallway morning brother waiting"]

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Ryan is leaning on the wall opposite the bathroom door with his arms folded and his towel over his shoulder. Twenty-two, Mark's son, broad from lifting at the yard. He's waiting his turn, but he doesn't move out of your way."

[[canvases.nodes.blocks]]
type = "dialog"
content = "First day of college, huh. Look at you."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_ryan"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "His eyes go down your legs, all the way to your wet feet, and come back up slower. Then he catches himself. He looks at the ceiling, at the bathroom door, anywhere, and pulls the towel off his shoulder and holds it low in front of his shorts. He's never once looked at you like this, and you're standing in a towel in the hall with nothing under it, and your face goes hot all at once."

[[canvases.nodes.blocks]]
type = "thought_bubble"
content = "He's your brother. Step-brother. He's looking at you like you're not."
[canvases.nodes.blocks.props]
speaker = "player"

[canvases.nodes.exit_block]
type = "choices"

