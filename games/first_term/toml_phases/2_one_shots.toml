# ── screen 3 · the problem ──
[[canvases.nodes]]
id   = "problem"
name = "Seventy-five"

# Q10 (LO, 2026-11-04): Mark has left before breakfast, so his words are last night's, said in his own voice here
[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Last night Mark put his fork down at dinner and said it like he'd been saving it."

[[canvases.nodes.blocks]]
type = "dialog"
content = "You're an adult now. Adults pay their way. Seventy-five a week, from Sunday, at the kitchen table."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_mark"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Laura looked at her plate and said nothing. That was how you knew it was real."

[[canvases.nodes.blocks]]
type = "thought_bubble"
content = "Seventy-five a week. With what? You don't have seventy-five. You don't have seven."
[canvases.nodes.blocks.props]
speaker = "player"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Somewhere in town somebody is hiring a girl with no experience. You have six days to find them. First, you need a shower, before anyone else in this house gets to the bathroom."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Grab a towel."
targetType = "node"
nodeId     = "shower"
time_progression_minutes = 2

# ── screen 4 · the shower ──
[[canvases.nodes]]
id   = "shower"
name = "The one bathroom"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "The bathroom is still cold from the night. You lock the door, but the lock sticks halfway like it always has. The walls in this house are paper. You can hear the kettle in the kitchen, and the radio, and the bed creak next door in Ryan's room as he gets up."

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You stand under the water until it runs hot, and you let yourself have one minute. Then the handle rattles."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Some of us have places to be, @player.nickname."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_ryan"

# pass 4 B3: her answer through the door (her talk beside her thoughts)
[[canvases.nodes.blocks]]
type = "dialog"
content = "Two minutes!"
[canvases.nodes.blocks.props]
speaker = "player"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "Ryan. Your step-brother, through the door, right outside it. You turn the water off and wrap the towel round yourself and tuck it in over your tits. It covers you. Mostly."

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Open the door."
targetType = "node"
nodeId     = "hall"
time_progression_minutes = 10
