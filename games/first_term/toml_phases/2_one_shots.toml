[[canvases.nodes]]
id   = "talk"
name = "In the doorway"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "You stop in the bathroom doorway with one hand on the towel. He blinks, like he didn't expect you to stay."

[[canvases.nodes.blocks]]
type = "dialog"
content = "Nervous? About today?"
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_ryan"

[[canvases.nodes.blocks]]
type = "dialog"
content = "Terrified. I don't know anyone."
[canvases.nodes.blocks.props]
speaker = "player"

[[canvases.nodes.blocks]]
type = "dialog"
content = "You'll be fine. Give it a week and they'll all know you."
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_ryan"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "He's the only one in this house who asked. Then his eyes slip down to where the towel is tucked, and back up, and he grins like he got caught and doesn't mind."

[[canvases.nodes.blocks]]
type = "dialog"
content = "@player, you'll be late on your first day!"
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "npc_laura"

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Get dressed."
targetType = "node"
nodeId     = "breakfast"
time_progression_minutes = 12
effects    = [ { targetType = "player", trait = "ryan_step", op = "set", value = 1 } ]
wardrobeEffects = [ { action = "equip", item_id = "plain_bra" }, { action = "equip", item_id = "plain_panties" }, { action = "equip", item_id = "tshirt" }, { action = "equip", item_id = "jeans" }, { action = "equip", item_id = "sneakers" } ]

[[canvases.nodes]]
