# Phase 3 — 3_activities.toml
# Last Call — Nina-solo activities (no NPC arcs here; those are beats in 5_scenes).
#
# canvas_sleep is the DAY-CYCLE ROUTER (the Day System, doctrine/04 §10). Last Call is
# night-centric: the bar runs 17:00–02:00 and Nina works it (canvas_work_shift advances
# the clock 120–180 min a turn). Past midnight the bar's dead and she crashes upstairs;
# sleep jumps her to mid-morning so the DAYTIME town — and Dee, who only stands the depot
# 10:00–17:00 — becomes reachable. Without this router daytime presence is dead (the Dee-bug).
# Shape mirrors games/late_shifts activity_sleep: solo canvas, schedule-gated window,
# forward jump + energy restore on the EXIT block. No hygiene cost — Last Call has no shower
# activity yet, and hygiene already drains via the daily tick, so sleeping mustn't double-drain it.

# ── canvas_sleep — Nina-solo, the day-advance router ──────────────────────────
[[canvases]]
id          = "canvas_sleep"
name        = "Sleep"
description = "Nina-solo. The apartment over the bar. Day-cycle router: jumps from the dead post-close hours to mid-morning so the daytime town/depot is reachable. Energy restore. No NPC sub."

[canvases.trigger]
location      = "loc_apartment"
is_repeatable = true
priority      = 3
is_active     = true

# Sleep window: after midnight (bar winding down / shut) through early afternoon. Keeps
# her from sleeping through the evening shift, and caps re-sleeping so daytime gets used.
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "00:00"
end_time   = "14:00"

[[canvases.nodes]]
id   = "base"
name = "Sleep"
blocks = [
  { type = "image", props = { file = "activities/sleep.jpg" } },
  { type = "paragraph", content = "The floor's finally quiet, the jukebox dead, the taps wiped. You climb the stairs to the studio that was Sully's and is yours now, kick your shoes off at the bed, and let the dark take the rest. Below, the building ticks as it cools." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Sleep until morning 😴"

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "loc_apartment"
time_progression_minutes = 540
effects = [
  { targetType = "player", trait = "energy", op = "add", value = 75 },
]

