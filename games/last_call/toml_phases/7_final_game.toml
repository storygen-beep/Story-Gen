# ─── Player ───────────────────────────────────────────────────────────────────
[player]
id          = "player"
name        = "Nina"
description  = "Mid-thirties. Came back to town for the funeral and left holding the keys to a bar that loses money and a debt she didn't sign for. Tending bar is the one thing she actually knows how to do."
portrait    = "nina.jpg"
customizable = true

[player.core_traits]
corruption = 0
energy     = 100
hygiene    = 100
money      = 80
# Per-NPC stage traits (player namespace)
sal_stage    = 0
marcus_stage = 0
dee_stage    = 0
rosa_stage   = 0
# Tier 2
exhibitionism = 0
# Phase 2+ (declared; mechanics dormant until enabled)
pregnancy = 0
# Sex-loop state (beat_0022, TLS Shady-clone). Numeric pseudo-enums (NOT flags — the
# loop canvases are triggerless; flags would trip the flag-chain validator). Reset to 0
# on every loop entry (the entering hub choice sets them). Hidden from the sidebar.
#   sex_stage: 0 foreplay·1 blowjob·2 cunnilingus·3 doggy·4 missionary·5 ontop
#   sex_finisher_type: 0 facial·1 pussy·2 ass·3 body   anal_active: 0 vaginal·1 anal
sex_stage           = 0
loop_npc_pleasure   = 0
loop_player_pleasure = 0
sex_finisher_type   = 0
anal_active         = 0
sex_reactions       = 0
sex_entry_origin    = 0

[[player.customization_fields]]
id      = "name"
type    = "text"
label   = "Your name"
default = "Nina"

[[player.customization_fields]]
id      = "body_type"
type    = "select"
label   = "Build"
default = "average"
options = ["petite", "average", "curvy", "athletic", "thick"]

[[player.customization_fields]]
id           = "look"
type         = "image_select"
label        = "Look"
default      = "tired"
sets_portrait = true
options = [
  { id = "tired",   image = "players/nina_tired.jpg",   label = "Worn out" },
  { id = "guarded", image = "players/nina_guarded.jpg", label = "Guarded" },
  { id = "sharp",   image = "players/nina_sharp.jpg",   label = "Sharp" },
]

# ─── NPCs ─────────────────────────────────────────────────────────────────────
# Arc shapes: sal=slow-burn · marcus=peer/dating · collector=antagonist, debt-enforcer sub-type
#             (escalates on player corruption × the bar_seized economic flag — NOT an awareness meter,
#             which is the witness sub-type / Diana model)
#             rosa=service/support · dee=service/leverage

# ── Sal — bartender, slow-burn ────────────────────────────────────────────────
[[npcs]]
id          = "npc_sal"
name        = "Sal"
description = "Late fifties, built like a man who's lifted kegs for thirty years. Grey stubble, forearms like cabling, a bar towel always over one shoulder. He poured for Sully longer than you've been gone and he's still here, which tells you something about loyalty or about having nowhere else to go."
portrait    = "sal.jpg"
core_traits = { arousal = 0, corruption = 0 }
flag_keys   = []
arc_stages  = [
  "Sizing you up",   # 0
  "Warmed up",       # 1 — sal_opened_up
  "Close quarters",  # 2 — sal_first_contact
  "After hours",     # 3 — sal_after_hours_done
  "His",             # 4 — sal_first_done
]

[[npcs.schedules]]
location   = "loc_bar"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "17:00"
end_time   = "22:00"
activity   = "working the taps"

[[npcs.schedules]]
location   = "loc_bar"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "22:00"
end_time   = "02:00"
activity   = "the late crowd"

# Offscreen "away" block — completes Sal's 24h day. He's home/asleep when the bar's
# shut; loc_sal_place is offscreen (you can't follow him home). Schedule page shows it.
[[npcs.schedules]]
location   = "loc_sal_place"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "02:00"
end_time   = "17:00"
activity   = "home, off the clock"

# ── Marcus — moneyed regular, peer/dating ─────────────────────────────────────
[[npcs]]
id          = "npc_marcus"
name        = "Marcus"
description = "Forties, good coat, the kind of watch you notice. He drinks top-shelf alone at the end of the bar and tips like the difference is nothing to him. Polite, attentive, patient — the patience of a man used to getting what he waits for."
portrait    = "marcus.jpg"
core_traits = { relation = 0 }
flag_keys   = []
arc_stages  = [
  "A regular",       # 0
  "Noticed",         # 1 — marcus_noticed
  "Drinks after",    # 2 — marcus_drinks_done
  "First date",      # 3 — marcus_date_done
  "Together",        # 4 — marcus_first_done
]

[[npcs.schedules]]
location   = "loc_bar"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "20:00"
end_time   = "23:00"
activity   = "drinking alone at the end of the bar"

# Offscreen "away" block — completes Marcus's day. He's uptown the rest of the time;
