start_time = "23:00"
end_time   = "20:00"
activity   = "uptown, wherever men like that go"

# ── The Collector — Mr. Boyd's man, antagonist ────────────────────────────────
[[npcs]]
id          = "npc_collector"
name        = "The Collector"
description = "Heavyset, unhurried, a jacket that never quite closes over his shoulders. He calls himself Reggie when he's being friendly, which is never twice. He works for Mr. Boyd, who owns the debt, the block, and the patience you're running out of."
portrait    = "collector.jpg"
# Antagonist: no own meter — his pressure gates on the debt/eviction flags + player corruption (content
# tier), correct for an antagonist/leverage NPC (P5/P11). No dead declarations.
core_traits = {}
flag_keys   = []

[[npcs.schedules]]
location   = "loc_bar"
weekdays   = [0]
start_time = "18:00"
end_time   = "20:00"
activity   = "collection night"

# ── Rosa — cook, service/support ──────────────────────────────────────────────
[[npcs]]
id          = "npc_rosa"
name        = "Rosa"
description = "Runs the kitchen like it's a country she founded. Fifties, apron strings double-wrapped, a wooden spoon she points with. She fed Sully and she'll feed you, but the kitchen is hers and you'll learn that fast."
portrait    = "rosa.jpg"
core_traits = { relation = 0 }
flag_keys   = []
arc_stages  = [
  "The new owner",   # 0
