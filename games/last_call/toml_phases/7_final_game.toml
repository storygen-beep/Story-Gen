id   = "base"
name = "After the rush"
blocks = [
  { type = "image", props = { file = "scenes/rosa_trust.jpg" } },
  { type = "paragraph", content = "The last ticket's down. Rosa kills the flat-top and the kitchen goes quiet except for the cooler's hum and the muffled jukebox bleeding through the wall. She wipes her hands on the apron, slow, and for once she's looking right at you instead of past you at the work." },
  { type = "paragraph", content = "She pulls the second stool over with her foot and sits, knees almost touching yours. Up close she smells like garlic and the cheap rosewater she dabs on every morning, and her eyes are doing the thing Sully's used to do — taking a measure, deciding something." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_rosa" }, content = "I watched your uncle let this place eat him alive. Boyd's man on Mondays, that smooth one at the end of the bar, Dee and his 'flexible terms' — I've buried better judgment than yours, and I'm not burying you too. So hear me. Whatever they offer, it costs more than it says on the label. Always." },
  { type = "paragraph", content = "She reaches over and squeezes your wrist once, hard, the way you'd grip something to keep it from going over the edge — then lets go and stands like none of it happened." },
