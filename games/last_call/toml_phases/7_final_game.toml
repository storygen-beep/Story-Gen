# Phase 0 — 0_systems_spec.toml
# Last Call — system spec: project + time + settings + rent + daily tick + sidebar
# Authored by /author-game (setup mode). Skeleton only — no NPC arc content here.

schema_version = "1.0"

[project]
id              = "last_call"
title           = "Last Call"
description      = "Nina inherits The Last Call, her late uncle's failing dive bar — and the debt he owed to the man who really owns the block. The bartender came with the building and knows where every body is buried. A regular with money keeps tipping like he's buying something. The cook runs the kitchen like it's hers. The supplier sets his own terms. And every week, the collector knocks. Keep the lights on, or lose the only thing she's got left."
quests_engine   = "v2"
starting_canvas = "canvas_first_night"

[time]
starting_hour = 18
starting_day  = "Monday"
starting_week = 1

# ─── Settings (read by template_import via data["settings"]) ──────────────────
# System scoping: clothing → [settings]; rent → [settings.rent]. Never bare keys.
[settings]
clothing_enabled  = true
wardrobe_location = "loc_apartment"
shop_location     = "loc_shop"

[settings.clothing_requirements]
body_coverage   = true
always_required = []

