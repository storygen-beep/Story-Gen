# ── Spine — the debt (Story Goals; mechanic mode) ─────────────────────────────
[[quest_cards]]
priority   = 10
text       = "Uncle Sully left me his bar and his debt. Two hundred to Boyd's man, every Monday. Miss it and I lose the only thing I've got left."
ready_text = "I've got this week's two hundred. Now I just have to keep finding it."
tip        = "The till feeds the fund — deposit at the bank, pay when the Collector comes Monday."
when = [
  { flag = "debt_explained", op = "is_true"  },
  { flag = "bar_seized",      op = "is_false" },
  { flag = "collision_done",  op = "is_false" },
]
goals = [
  { trait = "money", subject = "player", op = "gte", value = 200, label = "This week's payment" },
]

# ── Spine — the reckoning (Story Goals; capstone mode → canvas_reckoning; beat_0012/0013) ─
[[quest_cards]]
priority     = 10
text         = "Boyd's man is done waiting. It ends at Boyd's place now — I either put the whole debt on his desk or I find out what 'other ways of being paid' means."
ready_text   = "It's time. Boyd's office, three blocks off Main."
tip          = "Go to Boyd's Place to settle. Pay in full ($1000), let a patron cover it, or face the terms."
ready_canvas = "canvas_reckoning"
when = [
  { flag = "collision_done", op = "is_true"  },
  { flag = "reckoning_done", op = "is_false" },
]
goals = [
  { trait = "money", subject = "player", op = "gte", value = 1000, label = "Settle in full" },
]

# ── Spine — terminal (the story has ended) ────────────────────────────────────
[[quest_cards]]
priority = 10
text     = "However it ended — bought clean, kept, or owned — it ended. The Last Call is still standing. So am I, more or less."
terminal = true
when = [
  { flag = "reckoning_done", op = "is_true" },
]

