# ─── Locations ────────────────────────────────────────────────────────────────
# The building (loc_bar is the root + the player's start) + the town. All open;
# loc_shark is added later by the beat-9 location_reveal.

[[locations]]
id               = "loc_bar"
name             = "The Last Call"
description      = "The floor. A scarred mahogany bar, a dozen stools, booths with cracked vinyl along the wall, a jukebox that only plays what Sully loaded into it. It smells like spilled beer and pine cleaner losing the fight. It's yours now."
navigation_order = [
  "loc_kitchen",
  "loc_office",
  "loc_cellar",
  "loc_apartment",
  "loc_street",
]

[[locations]]
id          = "loc_kitchen"
name        = "The Kitchen"
description = "Cramped, stainless, hot. A flat-top, a fryer, a pass-through to the floor. Rosa's domain — her knives, her order, her rules. Smells like onions and old grease in a way that isn't unpleasant once you stop noticing."
image       = "locations/kitchen.jpg"
entry_from  = "loc_bar"

[[locations]]
id          = "loc_office"
name        = "The Back Office"
description = "A windowless room behind the bar. A desk buried in Sully's paperwork, a safe you don't have the combination to yet, a calendar still on the wrong month. This is where the numbers live, and the numbers are bad."
image       = "locations/office.jpg"
entry_from  = "loc_bar"

[[locations]]
id          = "loc_cellar"
name        = "The Cellar"
description = "Down a half-flight behind the bar. Kegs, cases, a walk-in cooler that hums. The delivery hatch opens to the alley. Cold enough that you can see your breath near the cooler."
image       = "locations/cellar.jpg"
entry_from  = "loc_bar"

[[locations]]
id          = "loc_apartment"
name        = "The Apartment"
description = "The studio over the bar, where Sully lived and where you live now. A bed, a hotplate, a closet, a bathroom the size of a phone booth. The floor thrums when the jukebox is on downstairs."
image       = "locations/apartment.jpg"
entry_from  = "loc_bar"

[[locations]]
id               = "loc_street"
name             = "Main Street"
description      = "The block out front. Half the storefronts are papered over. The good half — a bank, a wholesaler, a shop — is the half Mr. Boyd hasn't bought yet."
image            = "locations/street.jpg"
entry_from       = "loc_bar"
navigation_order = [
  "loc_bank",
  "loc_shop",
  "loc_wholesaler",
  "loc_shark",
]

[[locations]]
id          = "loc_bank"
name        = "The Bank"
description = "A branch that's seen better decades. One teller, a velvet rope nobody needs, a deposit slip you fill out with a pen chained to the counter. Where the night's takings go, and where the payment money comes from."
image       = "locations/bank.jpg"
entry_from  = "loc_street"

[[locations]]
id          = "loc_shop"
name        = "Reece's"
description = "A clothing shop that survives on the foot traffic the bank still brings. Racks of everything from work clothes to the kind of thing you'd wear if you wanted a room to look. The owner doesn't judge; she rings it up."
