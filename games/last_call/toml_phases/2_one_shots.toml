# Phase 2 — 2_one_shots.toml
# Last Call — the opening one-shot only (setup bootstrap).
# canvas_first_night drops the player into the bar she's inherited, establishes the
# debt, and sets first_night_done + debt_explained (the latter arms [settings.rent]).
# NPC arcs / hubs / capstones are authored later as continuation beats — NOT here.

[[canvases]]
id          = "canvas_first_night"
name        = "First night"
description = "Day 1 opener. The player walks into the bar she's inherited. Establishes the place, Sal, and the debt. Sets first_night_done + debt_explained."

[canvases.trigger]
location      = "loc_bar"
is_repeatable = false
priority      = 12
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "first_night_done", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "intro"
name = "First night"
blocks = [
  { type = "image", props = { file = "scenes/canvas_first_night.jpg" } },
  { type = "paragraph", content = "Sully's keyring: a worn bottle opener and a tag that says NOT THE GOOD WHISKEY in his hand. The lock sticks, like he always said. You let yourself in." },
  { type = "paragraph", content = "The lights are behind the register. The Last Call comes up around you — cracked booths, the dead letter in the beer sign, a jukebox in the corner. It's yours now." },
  { type = "cascade", props = { beats = [
    { advance_text = "Look behind the bar.", blocks = [
        { type = "paragraph", content = "A man is wiping down the taps like he never stopped. Big, grey, a towel on his shoulder. He doesn't startle when the lights come on. He just looks at you the way you'd look at weather you'd been expecting." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_sal" }, content = "You'd be Sully's niece. He talked about you. I'm Sal — I pour, I lock up, I been doing both since before you could see over the bar." },
    ] },
    { advance_text = "Ask about the envelope ✉️", blocks = [
        { type = "paragraph", content = "There's an envelope tucked under the till, no stamp, your uncle's name crossed out and yours written under it in a blockier hand. Inside: a single sheet. A number with a lot of zeros, a name — BOYD — and one line. Mondays. Sal watches you read it." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_sal" }, content = "Sully borrowed against the place when the roof went. Boyd's man comes Mondays. Two hundred. I'd start thinking now about where it comes from, because it comes whether you've got it or not." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "So I inherited a bar and a leash. Wonderful." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Pour one, take stock 🥃"
targetType = "location"
locationId = "loc_bar"
time_progression_minutes = 30
flagEffects = [
  { targetType = "player", flag = "first_night_done", op = "set" },
  { targetType = "player", flag = "debt_explained",   op = "set" },
]

[[canvases.nodes.exit_block.choices]]
text       = "Lock up, head to bed 🛏️"
targetType = "location"
locationId = "loc_apartment"
time_progression_minutes = 20
flagEffects = [
  { targetType = "player", flag = "first_night_done", op = "set" },
  { targetType = "player", flag = "debt_explained",   op = "set" },
]
effects = [
  { targetType = "player", trait = "energy", op = "add", value = 5 },
]

# ══════════════════════════════════════════════════════════════════════════════
# beat_0014 — Endgame (story_turn). Three terminal resolutions, auto-fire at loc_bar
#   after the reckoning. Each gated on its ending flag + endgame_seen is_false, and
#   sets endgame_seen so exactly ONE fires. A higher-priority Sal-grace variant of the
#   clean ending lands the "not alone" beat. Tier-3 resolution prose.
# ══════════════════════════════════════════════════════════════════════════════

# ── ending: CLEAN + SAL (priority 12 — wins over the base clean if sal_cracked) ──
[[canvases]]
id          = "canvas_ending_clean_sal"
name        = "Last Call — paid in full, not alone"
description = "beat_0014. Clean ending with Sal beside her. Gate ending_clean + sal_cracked + endgame_seen is_false."

[canvases.trigger]
location      = "loc_bar"
is_repeatable = false
priority      = 12
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "ending_clean",  operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "sal_cracked",   operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "endgame_seen",  operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "The bar, debt-free"
blocks = [
  { type = "image", props = { file = "scenes/ending_clean_sal.jpg" } },
  { type = "paragraph", content = "Boyd's number is zero now, in his own careful hand, and the card with his address has gone in the trash where it belongs. The Last Call is yours — actually yours, no asterisk, no Monday hanging over it. You came back for a funeral and you're staying for a life." },
  { type = "paragraph", content = "Sal's behind the bar where he's always been, except now he sleeps upstairs and the place is half his in every way that isn't paper. He pours two, slides one to your side, and doesn't make a speech about it because he never would. The neon buzzes. The jukebox plays what Sully loaded. You made it, and you didn't make it alone." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Sully left me a debt and a dive bar. I'm leaving myself a home." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Last call 🥃"
targetType = "location"
locationId = "loc_bar"
time_progression_minutes = 0
flagEffects = [
  { targetType = "player", flag = "endgame_seen", op = "set" },
]

# ── ending: CLEAN (base, priority 11 — she did it herself) ────────────────────
[[canvases]]
id          = "canvas_ending_clean"
name        = "Last Call — paid in full"
description = "beat_0014. Clean ending (alone). Gate ending_clean + endgame_seen is_false."

[canvases.trigger]
location      = "loc_bar"
is_repeatable = false
priority      = 11
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "ending_clean", operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "endgame_seen", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "Yours, free and clear"
blocks = [
  { type = "image", props = { file = "scenes/ending_clean.jpg" } },
  { type = "paragraph", content = "Boyd's number is zero, written in his own careful hand, and you walked out of that cigar-stinking office owing nobody anything. The Last Call is yours — every scarred inch of the bar, every cracked booth, the jukebox that only plays what Sully loaded. No Monday hanging over it anymore. Just the work, which you know how to do." },
  { type = "paragraph", content = "You earned it the hard way, a shift and a sleepless week at a time, and if the place is quiet tonight it's a quiet you own outright. Rosa leaves a plate warming whether you ask or not. You pour yourself one and drink it on the right side of the bar, for once." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Came back for a funeral. Stayed because it turned out I could carry it. By myself, if I had to." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Last call 🥃"
targetType = "location"
locationId = "loc_bar"
time_progression_minutes = 0
flagEffects = [
  { targetType = "player", flag = "endgame_seen", op = "set" },
]

# ── ending: KEPT (Marcus's money saved it) ────────────────────────────────────
[[canvases]]
id          = "canvas_ending_kept"
name        = "Last Call — kept"
description = "beat_0014. Kept ending (Marcus covered the debt). Gate ending_kept + endgame_seen is_false."

[canvases.trigger]
location      = "loc_bar"
is_repeatable = false
priority      = 11
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "ending_kept",  operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "endgame_seen", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "The lights stay on"
blocks = [
  { type = "image", props = { file = "scenes/ending_kept.jpg" } },
  { type = "paragraph", content = "Marcus made a call and Boyd's number went to zero the way everything resolves for Marcus — quietly, completely, with a courtesy that costs more than it admits. The Last Call keeps its lights on. The taps still pour. From the street nothing's changed at all." },
  { type = "paragraph", content = "But the car comes for you on the nights he wants it to, and the bar runs on an allowance now, and when people ask whose place it is you've started saying 'mine' with a half-second pause that says otherwise. You kept the bar. He kept you. You did the math a long time ago and decided it was the better deal, and most nights you still believe it." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Sully lost it to a loan shark. I saved it the only way I had left — by belonging to someone with deeper pockets. I could still walk. The car's very comfortable." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Last call 🥃"
targetType = "location"
locationId = "loc_bar"
time_progression_minutes = 0
flagEffects = [
  { targetType = "player", flag = "endgame_seen", op = "set" },
]

# ── ending: OWNED (nothing left to pay but herself) ───────────────────────────
[[canvases]]
id          = "canvas_ending_owned"
name        = "Last Call — Boyd's now"
description = "beat_0014. Dark ending (submitted to Boyd's leverage). Gate ending_owned + endgame_seen is_false."

[canvases.trigger]
location      = "loc_bar"
is_repeatable = false
priority      = 11
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "ending_owned", operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "endgame_seen", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "Other ways of being paid"
blocks = [
  { type = "image", props = { file = "scenes/ending_owned.jpg" } },
  { type = "paragraph", content = "There was nothing on the desk to put down but yourself, and Boyd is an accountant — he takes payment in whatever form clears the balance. The Last Call still has your name over the door. That was part of the arrangement; a front runs better with a friendly face the regulars trust." },
  { type = "paragraph", content = "You pour and you smile and you do the other things the ledger now requires, and the money that moves through the till on quiet afternoons isn't bar money and you've learned not to ask. Sully drank himself out from under this place. You did something slower and worse to stay on top of it. The neon still buzzes. It just isn't yours, and neither, most days, are you." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "I kept the lights on. I told myself that was the whole job. I didn't read the part of the contract where the lights were the only thing left that was mine." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Last call 🥃"
targetType = "location"
locationId = "loc_bar"
time_progression_minutes = 0
