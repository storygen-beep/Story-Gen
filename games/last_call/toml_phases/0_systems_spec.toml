# ─── NPC panel — Sal (RTS House-card) ─────────────────────────────────────────
# Shows Sal's wanting (npc_sal.arousal, the live axis that gates the sex-loop acts) + where he is
# (from his [[npcs.schedules]], same source as the Schedule page). Always visible — Sal is the
# bartender who comes with the bar (present from night one), so the card is shown from the start
# like RTS's House panel. Corruption row omitted — Sal doesn't track a corruption axis. Default
# arousal bands (0 ❄️ / 1 🔥 / 2 🔥🔥 / 3 🔥🔥🔥).
[[sidebar_items]]
type      = "npc_panel"
npc_id    = "npc_sal"
label     = "Sal"
rows      = ["arousal", "location", "next"]

