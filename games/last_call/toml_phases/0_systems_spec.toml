conditions = { version = "1.0", items = [
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 35 },
] }

# ─── Debt (economic spine) ────────────────────────────────────────────────────
# The loan-shark's weekly payment, modelled on the rent system. Due Monday.
# Armed only after the debt is explained on the first night (start_after_flag),
# so night one is pressure-free onboarding. eviction_mode = flag_set: missing the
# payment past grace doesn't end the game — it sets bar_seized and opens a leverage path.
[settings.rent]
enabled          = true
amount           = 200
due_day          = "Monday"
collector_npc    = "npc_collector"
grace_periods    = 1
start_after_flag = "debt_explained"
eviction_mode    = "flag_set"
eviction_flag    = "bar_seized"

[settings.rent.text]
title                  = "Monday Night"
scene                  = "The bell over the door goes while you're still wiping down the taps. You don't have to look up to know — nobody else pushes the door open that slow, like the hinges work for him too."
greeting               = "Two hundred. Sully's number, not mine — I just collect it. You got it, or you got a story?"
cant_pay               = "Tell him the till came up short"
paid_scene             = "You count it onto the bar top. He doesn't touch it right away — lets it sit there between you, then sweeps it into his jacket in one motion."
paid_response          = "Good girl. Mr. Boyd likes it when it's easy. Next Monday."
paid_closing           = "The door swings shut behind him. The taps still need wiping. The week, at least, is yours."
warning_scene          = "You tell him the till came up short. The collector doesn't argue. He just looks around the room slow, pricing it, the way you'd look at a car you're thinking of taking apart."
warning_response       = "One week. Mr. Boyd's patient exactly once. After that the patience is mine to hand out, and mine costs more."
warning_closing        = "He's gone before you can say anything else. Seven days, and a new kind of quiet left in the room."
eviction_scene_soft    = "The collector stops asking about the money. He leans on the bar like he's off the clock, like the place is already half his, and watches you work."
eviction_response_soft = "Money's one way to square it with Mr. Boyd. There's others. You and me can work out what counts."
eviction_closing_soft  = "He doesn't take the keys. That's the part that sits wrong — the terms just moved somewhere you can't see them anymore."

# ─── Engine daily tick ────────────────────────────────────────────────────────
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "talked_to_sal_today",     op = "unset" },
  { targetType = "player", flag = "flirted_with_sal_today",  op = "unset" },
  { targetType = "player", flag = "talked_to_marcus_today",  op = "unset" },
  { targetType = "player", flag = "talked_to_rosa_today",    op = "unset" },
  { targetType = "player", flag = "talked_to_dee_today",     op = "unset" },
  { targetType = "player", flag = "bar_open_today",          op = "unset" },
]
traitEffects = [
  { targetType = "player", trait = "hygiene", op = "add", value = -10 },
  { targetType = "player", trait = "energy",  op = "add", value = -5  },
  # Player arousal cut (LC arousal pass): it was a dead sidebar bar (climbed +1/day, gated
  # nothing) — LC has no solo self-content for it to fuel, so the trait is removed entirely.
  # npc_sal.arousal (his wanting) is the live arousal axis — earned from Sal beats, gates the
  # sex-loop acts; it never climbed passively here.
]

