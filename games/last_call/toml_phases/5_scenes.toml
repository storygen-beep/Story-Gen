text       = "Talk to Sal 💬"
targetType = "location"
locationId = "loc_bar"
time_progression_minutes = 15
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "talked_to_sal_today", operator = "is_false" },
] }
flagEffects = [
  { targetType = "player", flag = "talked_to_sal_today", op = "set" },
]
# Sal re-spine: the daily Sal beat raises HIS WANTING (npc_sal.arousal), capped at
# +1/day by talked_to_sal_today (shared with the after-close stay below). This is the
# earned slow-burn climb that drives the private ladder. Relation dropped from Sal.
effects = [
  { targetType = "npc", npcId = "npc_sal", trait = "arousal", op = "add", value = 1, cap = 3 },
]

# Lane 1 — the directed lewd beat (daily-capped → HIDES when done/below floor; the "Make a move"
# rung below carries the locked-visible ladder telegraph). This is Sal's corruption driver.
[[canvases.nodes.exit_block.choices]]
text       = "Flirt with him 😏"
conditions = { version = "1.0", items = [
  { type = "trait", subject = "player", trait_key = "corruption", operator = "gte", value = 5 },
  { type = "flag",  subject = "player", flag_key = "flirted_with_sal_today", operator = "is_false" },
] }
targetType = "location"
locationId = "loc_bar"
time_progression_minutes = 15
flagEffects = [
  { targetType = "player", flag = "flirted_with_sal_today", op = "set" },
]
# RTS model: the lewd act corrupts HIM. Flirt raises her brazenness (player corruption) AND draws Sal
# across the line (npc_sal.corruption — his per-NPC ODOMETER, never resets), daily-capped like RTS's
# once-per-day lewd scenes. His corruption gates the kiss + first night; arousal (throttle) stays on
# the repeatable sex loop, never the capstones.
effects = [
  { targetType = "player", trait = "corruption", op = "add", value = 1 },
  { targetType = "npc", npcId = "npc_sal", trait = "corruption", op = "add", value = 1 },
]

[[canvases.nodes.exit_block.choices]]
text       = "Back to the floor ↩️"
targetType = "location"
locationId = "loc_bar"
time_progression_minutes = 5

