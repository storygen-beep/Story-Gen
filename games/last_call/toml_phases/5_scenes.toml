  { type = "paragraph", content = "He's wiping down the well when he stops, both hands flat on the bar, and looks at you across it the way he's been not-looking at you for weeks. The register light buzzes. Somewhere a cooler kicks on. He doesn't say the thing — Sal never says the thing — he just comes around to your side of the bar, slow enough that you could step back if you wanted to, and you don't." },
  { type = "paragraph", content = "His hand finds the side of your jaw, rough from thirty years of work, careful like he's handling something he can't afford to drop. He smells like beer and bar soap and the cold off the cellar stairs. When he kisses you it's nothing like you braced for — not hungry, not taking, just sure, the way he does everything behind this bar he's run longer than you've been alive." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Every man in my life has wanted something from me since I got off that bus. He's the first one who waited until I wanted it too." },
