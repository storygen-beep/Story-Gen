# ── beat_0010 / Sal — AFTER-CLOSE hub (private tier, 22:00–02:00) ─────────────
[[canvases]]
id          = "canvas_sal_afterhours_hub"
name        = "Sal — after the lock turns"
description = "beat_0010. Lane 1 hub for the after-close window (22:00–02:00, PRIVATE tier). Counting the till, just the two of them. Talk (daily-gated; builds his arousal — the in-scene throttle on the sex loop, NOT the kiss) + locked-visible telegraph + leave. One constant opener (D56-R1). The kiss capstone (canvas_sal_after_hours) auto-fires once HIS corruption (npc_sal.corruption, built by Flirt) reaches 3."

[canvases.trigger]
location      = "loc_bar"
requires_npc  = "npc_sal"
npc           = "npc_sal"
is_repeatable = true
priority      = 4
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "sal_opened_up", operator = "is_true" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "22:00"
end_time   = "02:00"

[[canvases.nodes]]
id   = "base"
name = "After close"
# The opening reflects HIS HEAT TONIGHT (npc_sal.arousal 0-3 = the in-scene throttle), NOT the
# relationship's progress — arousal resets at climax, so the prose stays transient "how worked up is
# he tonight" (RTS keys only heat-framed text to arousal; the courtship lives in the flag chain).
blocks = [
  { type = "image", props = { file = "scenes/sal_afterhours.jpg" } },
  { type = "group", props = { conditions = { version = "1.0", items = [ { type = "trait", subject = "npc", npc_id = "npc_sal", trait_key = "arousal", operator = "eq", value = 0 } ] }, blocks = [ { type = "paragraph", content = "Last customer gone, bolt thrown, neon off. Sal counts the till by the register light, slow and heavy, shoulders still wearing the shift. He's wrung out tonight — doesn't tell you to go home, doesn't look up either. The quiet's just quiet, and the cooler hum is the only thing awake." } ] } },
  { type = "group", props = { conditions = { version = "1.0", items = [ { type = "trait", subject = "npc", npc_id = "npc_sal", trait_key = "arousal", operator = "eq", value = 1 } ] }, blocks = [ { type = "paragraph", content = "Bolt thrown, neon off. He counts the till one-handed, and the count keeps losing its place whenever you move behind him. He doesn't tell you to go home. There's something under the quiet tonight that wasn't there an hour ago." } ] } },
  { type = "group", props = { conditions = { version = "1.0", items = [ { type = "trait", subject = "npc", npc_id = "npc_sal", trait_key = "arousal", operator = "eq", value = 2 } ] }, blocks = [ { type = "paragraph", content = "He's half given up on the count. Sleeves shoved past the elbow, bolt thrown, he watches you over the register the way he watched you work the room all night — and tonight he's not bothering to look away." } ] } },
  { type = "group", props = { conditions = { version = "1.0", items = [ { type = "trait", subject = "npc", npc_id = "npc_sal", trait_key = "arousal", operator = "gte", value = 3 } ] }, blocks = [ { type = "paragraph", content = "He's quit counting. The till sits open and forgotten and he just looks at you across the dark bar, both hands flat on the mahogany, like the door's already bolted and the rest of the night is yours to spend however you want it." } ] } },
]

[canvases.nodes.exit_block]
type = "choices"

