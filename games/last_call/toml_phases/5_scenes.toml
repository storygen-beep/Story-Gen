# Phase 5 — 5_scenes.toml
# Last Call — NPC arc canvases (authored beat-by-beat by /author-game continue mode).
#
# beat_0002 — Sal on-ramp (npc_intro): Lane 1 = first-contact one-shot + repeatable hub
#   (interactions WITH Sal only). The WORK is a separate solo activity (Lane 3 host) below —
#   §8.2 hub-vs-solo-work separation. The bar's earning loop lives in canvas_work_shift.

# ── beat_0002 / Sal — first contact (auto-fire one-shot) ──────────────────────
# Auto-fires on bar entry once first night is done (no `npc`/`requires_npc` — those
# make it a repeatable PORTRAIT, and renderNpcPortraits skips non-repeatable canvases,
# so a one-shot first-contact must be an auto-fire like the boot canvas). Sets
# sal_opened_up → the repeatable Sal hub (portrait) takes over from then on.
[[canvases]]
id          = "canvas_sal_ropes_first"
name        = "The Last Call — Sal"
description = "beat_0002. First meeting with Sal. Auto-fires on bar entry post-first-night. Sets sal_opened_up + sal_stage=1."

[canvases.trigger]
location      = "loc_bar"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "first_night_done", operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "sal_opened_up",   operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "Working the bar"
blocks = [
  { type = "image", props = { file = "scenes/sal_bar_hub.jpg" } },
  { type = "paragraph", content = "Sal slides down to make room and starts talking — which tap runs foam, which regular runs a tab, where Sully kept the good stuff. You keep up. You've poured in worse rooms than this." },
  { type = "paragraph", content = "By the second rush he stops narrating and just works beside you." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_sal" }, content = "Huh. You've done this. Sully said you tended in the city. I figured he was bragging." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "First thing today that felt like solid ground." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Learn the bar 🍺"
targetType = "location"
locationId = "loc_bar"
time_progression_minutes = 30
flagEffects = [
  { targetType = "player", flag = "sal_opened_up",      op = "set" },
  { targetType = "player", flag = "talked_to_sal_today", op = "set" },
]
effects = [
  { targetType = "player", trait = "sal_stage", op = "set", value = 1 },
]

# ── beat_0002 / Sal — Lane 1 HUB (SERVICE hours, public tier) ─────────────────
# beat_0010 split (audit F3): this hub now covers ONLY service hours 17:00–22:00
# (public exposure — talk + flirt). The after-close window 22:00–02:00 (private) is a
# SEPARATE hub (canvas_sal_afterhours_hub) carrying the private ladder + the kiss capstone.
