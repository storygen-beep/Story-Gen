id          = "canvas_sal_hub"
name        = "Sal — behind the bar"
description = "beat_0002 (split in beat_0010). Lane 1 SERVICE hub, 17:00–22:00, PUBLIC tier: talk + locked-visible flirt rung. NPC-object verbs only; WORK is canvas_work_shift. One constant opener (D56-R1). After-close private content is canvas_sal_afterhours_hub."

[canvases.trigger]
location      = "loc_bar"
requires_npc  = "npc_sal"
npc           = "npc_sal"
is_repeatable = true
priority      = 4
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "sal_opened_up", operator = "is_true" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "17:00"
end_time   = "22:00"

[[canvases.nodes]]
id   = "base"
name = "Sal at the taps"
blocks = [
  { type = "image", props = { file = "scenes/sal_bar_hub.jpg" } },
  { type = "paragraph", content = "Sal's at the taps, towel over his shoulder, half a story going about a customer from 1998. He tips his head at the empty side of the bar." },
]

[canvases.nodes.exit_block]
type = "choices"

# Lane 1 — relational (always open once he's warmed up; daily-gated)
