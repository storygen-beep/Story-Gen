  { type = "dialog", props = { speaker = "npc", npcId = "npc_rosa" }, content = "I watched your uncle let this place eat him alive. Boyd's man on Mondays, that smooth one at the end of the bar, Dee and his 'flexible terms' — I've buried better judgment than yours, and I'm not burying you too. So hear me. Whatever they offer, it costs more than it says on the label. Always." },
  { type = "paragraph", content = "She reaches over and squeezes your wrist once, hard, the way you'd grip something to keep it from going over the edge — then lets go and stands like none of it happened." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_rosa" }, content = "That's all. You're mine now, same as the kitchen. Eat before you leave. There's a plate warming." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Everyone in this town wants a piece of me or the bar. She's the only one who just wants me to make it out. I won't forget which is which." },
]

