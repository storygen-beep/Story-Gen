# Phase 4 — 4_story_arc.toml
# Last Call — the reckoning (beat_0013). The debt's final accounting at Boyd's place.
# Pattern B branching capstone: pay in full / a patron covers it / nothing left to pay.
# Sets reckoning_done + exactly one ending_* flag, which beat_0014 (2_one_shots.toml) reads.
#
# Reachable on both paths: clean players arrive via the collision (money>=1000 opened loc_shark);
# leverage players arrived earlier via the bar_seized summons. Gated on shark_met so the first
# Boyd meeting (canvas_shark_place, 5_scenes) always plays before the reckoning.

[[canvases]]
id          = "canvas_reckoning"
name        = "Boyd's Place — the accounting"
description = "beat_0013. Lane 4 capstone (Pattern B). loc_shark, gate shark_met + collision_done. Three debt outcomes -> ending_clean / ending_kept / ending_owned (+ reckoning_done). Tier-3, Boyd = cold accountant."

[canvases.trigger]
location      = "loc_shark"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "shark_met",      operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "collision_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "The column that won't balance"
blocks = [
  { type = "image", props = { file = "scenes/reckoning.jpg" } },
  { type = "paragraph", content = "Boyd has the ledger open when the man at the door lets you in, reading glasses down, cigar unlit. He doesn't offer you the chair. He turns the book so you can see your uncle's name crossed out and yours written under it in the same careful hand, and taps the figure at the bottom — the whole of it, every missed Monday and every favor Sully ever called in, totaled and waiting." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_boyd" }, content = "I don't enjoy this part, contrary to what people think. I'm an accountant at heart. So. The number's the number. Tell me how it gets paid, and tell me true, because I've heard every kind of lie in this room and I stopped finding them interesting years ago." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Everything I did this year — every shift, every man, every line I told myself I wouldn't cross — it all comes down to which sentence I say next in this cigar-smelling room." },
]

[canvases.nodes.exit_block]
type = "choices"

# Outcome 1 — PAY IN FULL (clean): requires the lump sum.
[[canvases.nodes.exit_block.choices]]
text             = "Pay in full 💰"
show_when_locked = true
conditions = { version = "1.0", items = [
  { type = "trait", subject = "player", trait_key = "money", operator = "gte", value = 1000 },
] }
targetType = "location"
locationId = "loc_street"
time_progression_minutes = 30
flagEffects = [
  { targetType = "player", flag = "reckoning_done", op = "set" },
  { targetType = "player", flag = "ending_clean",   op = "set" },
]
effects = [
  { targetType = "player", trait = "money", op = "add", value = -1000 },
]

# Outcome 2 — A PATRON COVERS IT (kept): Marcus has the cash and the motive.
[[canvases.nodes.exit_block.choices]]
text             = "Let Marcus cover it 💵"
show_when_locked = false
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "marcus_first_done", operator = "is_true" },
] }
targetType = "location"
locationId = "loc_street"
time_progression_minutes = 30
flagEffects = [
  { targetType = "player", flag = "reckoning_done", op = "set" },
  { targetType = "player", flag = "ending_kept",    op = "set" },
]

# Outcome 3 — NOTHING LEFT TO PAY WITH (owned): the fallback.
[[canvases.nodes.exit_block.choices]]
text       = "Pay another way 😏"
targetType = "location"
locationId = "loc_street"
time_progression_minutes = 30
flagEffects = [
  { targetType = "player", flag = "reckoning_done", op = "set" },
  { targetType = "player", flag = "ending_owned",   op = "set" },
]
effects = [
  { targetType = "player", trait = "corruption", op = "add", value = 5 },
]
