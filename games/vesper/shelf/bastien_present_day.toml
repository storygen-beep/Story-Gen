# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
# beat_0082 (rev 127) — THE BACK-ROOM LOOP, THE DRAIN, AND WHAT HE WAS BUYING HER FOR. Blueprint scene 19
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
# The shipped three-canvas chain, verbatim in shape: loop_bastien_backroom (poses, pleasure climbs,
# climax-elect at >=50) -> loop_bastien_finisher ([group] by sex_finisher_type) -> bastien_drain_canvas
# (payload nodes). Nothing structural is invented here; loop_colm_backroom is the template.
#
# ⚠️ TWO CONTRADICTIONS IN THE LOCKED DESIGN WERE RESOLVED AT THIS BEAT, both put to LO and both settled:
#
# (a) THE PAYLOAD vs §15. design_the_leash §11 says the payload is "he was buying it for CAIN"; §15 says Cain
#     is "not on page, not named by Bastien beyond 'a man who wanted to know what they did to you'". §15 WINS.
#     Bastien does not know the name either — he is a middleman: the money came through three hands, and the
#     man who came through his far door a year ago never turned round. What the drain takes is the thing he
#     has never said aloud and works out WHILE SHE HAS HIM OPEN: THEY WERE THE SAME MAN. That is §11's content
#     in full with only the label withheld, it keeps Cain's entrance whole for the chapter that opens it, and
#     it hands the NAME to scene 20 where her page opens.
# (b) THE GATE vs §11. Blueprint row 19 said "search passed + npc_bastien.relation band". §11 says his lever
#     is CURIOSITY, NOT DESIRE and that "a standard seduction ladder bounces off him; he'd enjoy it and give
#     nothing". So there is NO RELATION GATE. He already invited her; there is nothing to earn. The gate is
#     the door (beat_0081's search) and the key. relation still ticks on the hub's talk rung — nothing reads it.
#
# ⚠️ THE CEILING (design_book.md, Content register — Bastien, outside the cell; SIGNED rev 126). The ordinary
# owned-slave floor with his crude, degrading diction on top (slut / hole / bought-and-paid-for; full
# anatomical words; the anal finish IS the drain). NO pack, NO restraint, NO sustained non-con — the crew are
# voices through a wall and never hands. And the two clauses added at signature:
#   (i)  HE NEVER LEARNS WHAT SHE IS. The drain runs one way. He gets closer here than anyone in the game has
#        been — he is the only man who has looked at her properly — and he ends the chapter not knowing.
#   (ii) SHE IS NEVER SHOWN ENJOYING IT. The back room is WORK. The prose stays on what she is carrying and
#        what she is waiting for, never on her body answering. He says the quiet part himself in the intro.
#
# ⚠️ §13'S CONTROLLER LOADOUT — THE SWITCH IS BUILT, THE CHARGE ECONOMY IS CUT (and the cut is recorded up in
# design_book + design_the_leash §13, not silently dropped). §13 specified carry / bring-it-up / power cost
# with a bench reload / blocked-targets-only. The switch is real and lives here: controller_state 0 idle, 1
# running, set on a CHOICE at the anal pose, because bringing it up is something she does MID-ACT. The charge
# meter is an economy with exactly ONE customer — the chapter has one blocked target and the switch dies at
# the extraction — so it would buy one more errand in a cycle that already runs bar -> door -> room, against
# §8's own rule that the loop must not read as errands. The fiction of the power cost survives in the reset:
# the entering rung zeroes controller_state, so she does not leave it running between visits.
#
# ⚠️ THE TWO-CONDITION CONTRACT, AND THE LOOP TEACHES IT. The shipped pattern already teaches "only the anal
# finish opens the drain" (facial/inside say so in prose — the contract, taught by playing it). Bastien adds
# the second half: AND ONLY WITH THE KEY RUNNING. Anal + controller_state 0 routes to .dead — not a fail
# screen, the same cold-socket nothing try 1 taught, on a man whose name is on the set. NOT also gated on
# drain_charge: shipped practice is split (Marsh checks it, Colm does not), and one extra thing to get right
# is a lesson while two is a chore.
#
# MEDIA: SEVEN new pooled slots, the same seven the Colm loop carries — intro, three poses, three finishes.
# The drain canvas takes NONE (Colm's takes none either; the payload is a conversation). Debt 14 -> 21.

