# ══════════════════════════════════════════════════════════════════════════════════════════════════
# SHELVED CONTENT — present-day Bastien. NOT BUILT. NOT MERGED.
# ══════════════════════════════════════════════════════════════════════════════════════════════════
#
# Lifted out of games/vesper/toml_phases/5_scenes.toml at beat_0091 (rev 141), 2026-08-13, on LO's
# call. This is the whole of Bastien's present-day thread — the release 0.1.8 content that was going
# to put him on screen for the first time, as opposed to the Act 1 captivity flashbacks (which are
# untouched and still ship).
#
# WHY IT CAME OUT: these surfaces were authored at rev 126-127 and never received the heat pass that
# revs 138-140 gave the Mercer surfaces (1.8% -> 10.3% explicit). Shipping them as they stand would
# spend the next chapter's antagonist at a quality the rest of the release no longer sits at. He
# comes back at 0.1.9, polished, as that release's spine.
#
# WHY THIS FILE IS NEVER BUILT: scripts/merge_toml_phases.py:44 merges a hardcoded whitelist,
# PHASE_FILES, and skips anything absent from it (:74-78). This file lives OUTSIDE toml_phases/
# entirely so that no future glob, --repair pass, or added phase number can pick it up by accident.
#
# ── TO RESTORE AT 0.1.9 ───────────────────────────────────────────────────────────────────────────
# Paste the block below back into 5_scenes.toml immediately before cap_extraction's section header,
# then reverse the three edits that were made to accommodate its absence:
#
#   1. cap_extraction's trigger gate — put back
#          { trait = "bastien_drains_done", subject = "player", operator = "gte", value = 1 }
#      in place of the leash_answered clause, and restore the canvas description's gate list.
#
#   2. hub_kess_berth.base — put back the "Have him seat the key." choice (targets
#      kess_seat_controller.base, gated bastien_hub_open is_true + leash_cut is_false +
#      controller_seated lt 1 + feed_line_days gte 1) and its comment header.
#
#   3. The Quests page — restore cards K and L, restore Bastien's three-card npc_bastien section,
#      put card J's closer back to `bastien_hub_open is_false` with its original Bastien tip, and
#      put the back-room sentence back into card M's tip.
#
# Also restore, in 1_metadata_and_locations.toml: the bastien_backroom location block and
# npc_bastien's schedule row. Both are preserved at the foot of this file.
#
# The four traits this content uses — controller_seated, controller_through, controller_state and
# bastien_drains_done — were deliberately LEFT DECLARED in 0_systems_spec.toml and
# 1_metadata_and_locations.toml. All four are hidden = true, so an unused declaration renders
# nothing, and leaving them keeps the restore to the edits listed above.
#
# The live regression suites live_beat_0080 / 0081 / 0082 were kept and guarded rather than deleted:
# each self-skips while cap_bastien_walks_in is absent from the build, and lights back up on its own
# the moment this block is restored.
