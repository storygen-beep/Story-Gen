        { type = "dialog", props = { speaker = "player" }, content = "Why." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Didn't say. Asked one thing twice, though, and men only do that when it's the whole question: was she made, or was she taken." },
    ] },
    { advance_text = "Ask about the night.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "The man at your door." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Furious. In a hurry. Wanted to know what had been done to you, and wouldn't say why he cared." },
        { type = "paragraph", content = "He stops. There is nothing left in him to stop for, and he stops anyway." },
    ] },
    # THE REALISATION. He works it out WHILE SHE HAS HIM OPEN, and it is the first time he has known it.
    { advance_text = "Let him get there.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Same man." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Christ. Same man. He bought the paper and then he came and took the girl, and I stood in my own doorway and let him." },
        { type = "paragraph", content = "It is the first time he has known it, and he will not have it in an hour." },
    ] },
    { advance_text = "Take the rest.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "Describe him." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Couldn't. Bad light, and he never once turned round. Big through the shoulders, old smoke on him, and a voice I'd know in a crowd." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "I've replayed it four hundred times and it's always the back of a head." },
    ] },
    # The chain's ONE interior beat (§14), and it keeps captivity_cain's line true: she cannot hold the name.
    { advance_text = "Reach for it.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Old smoke. She has that already, off a floor she was lying on. Four words came through that wall and one of them was a name, and she reaches for it the way she has every week since, and it is a shape where a word should be." },
    ] },
    { advance_text = "Let him surface.", blocks = [
        { type = "paragraph", content = "He comes back propped against the desk, agreeable and empty and none the wiser." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "I've lost the thread. Where were we. Sit down — no, don't. You never do." },
    ] },
    # Terminal beat — no advance_text.
    { blocks = [
        { type = "paragraph", content = "She takes her coat off the chair and goes out through the bar carrying a year of his and none of her own." },
        { type = "paragraph", content = "Behind her the room is quiet, and the man in it is going to wake up pleased." },
    ] },
  ] } },
]
