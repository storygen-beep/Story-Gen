# ═══ cap_bastien_walks_in — beat_0080, BASTIEN WALKS BACK INTO PLAY. Blueprint scene 17, §11 ══════════
# The chapter turns from her owner to the man who bought her file. Kess read three more names off the key and
# could place exactly one of them, and this is him: the man who kept her in a room, had her used, and took
# notes. §11 is explicit that he is NOT optional side content — his name came off her own leash.
#
# ⚠️ THE REUNION IS NOT "SHE CAME BACK." Read captivity_cain (beat_0042) before touching this canvas: Bastien
# did not release her, he LOST her. Someone came through his far door, argued him down to a stop, put the
# drain back in her socket and carried her out, and Bastien has never found out who. So he is looking at a
# thing that was taken off him, walking and repaired — and he has a question of his own he has been carrying
# for a year. That is what makes him sit down, and it is why the scene needs no threat to be frightening.
# ⚠️ CAIN STAYS RESERVED (§15): not on the set this chunk, not on page, and Bastien never names him — the man
# who came is a man who wanted to know what had been done to her, and no further. Do not let this canvas
# spend him.
#
# ⚠️ THE CEILING — AND WHY THIS CANVAS CAN SHIP WHILE THE BASTIEN ROW IS STILL UNSIGNED. The drafted row
# ("The Leash — Bastien, outside the cell") governs TWO things and only two: the SEARCH at the door, and the
# BACK ROOM. Blueprint row 18 says so in as many words — "the door-search is the gate, played on-screen" —
# and row 19 owns the back room. This canvas is the REVEAL and reaches neither: no nudity, no touch, no
# sexual act, and the search is PROMISED IN HIS OWN MOUTH rather than played. That is the shipped
# rung_mercer_hands_on precedent one notch earlier — that canvas was built at beat_0073 while Mercer's row
# was unsigned and its header records the same reasoning ("It stops at the touch: nothing explicit, so the
# unsigned Mercer ceiling stays unspent"). This one stops at the INVITATION.
# His crude, proprietary diction here ("my property", "you of all things") is his SHIPPED Act-1 ownership
# register and is not what the unsigned row governs. ⚠️ THE ROW STILL COMES DUE AT beat_0081, which cannot
# ship without it.
#
# ⚠️ NO SCHEDULE, AND DELIBERATELY SO — the beat_0080 plan entry in the ledger listed one and it must not be
# built. Two reasons. (1) It is not needed: cap_mercer_resurfaces is the shipped scheduleless-speaker
# precedent at THIS EXACT LOCATION — auto-fire one-shot @underworld_bar, no requires_npc, no npc, no presence
# predicate, because Mercer had no schedule at the bar either. Adding an npc_at_location clause for an NPC the
# resolver can never place would gate this scene shut forever. (2) A schedule row at a PUBLIC location LEAKS
# HIS FACE ONTO THE NAV GRID: the in-room portrait card is canvas-gated (v2.py:4998-5008) but the nav-card
# badge is NOT (getNpcsPresentAtLocation, v2.py:4773). underworld_bar has been reachable since Act 1 and is
# not locked, so a row there would park Bastien's badge on the Undertow card for every player — including one
# mid-Act-1 who is currently being kidnapped by him. Scene 6c hit this exact wall with Mercer and solved it
# with a LOCKED room (a locked card renders no indicators at all, v2.py:19270-19281). Bastien gets the same
# shape at beat_0081, and the door-search becomes that location's ENTRY GATE.
#
# ⚠️ THE GATE'S SECOND CLAUSE IS THE beat_0078 OFF-BY-ONE FIX, APPLIED AT BIRTH. The blueprint gated this row
# on mercer_attempts gte 3 alone, annotated "the set is known" — and that is off by one install. The counter
# hits 3 the instant try 3's routing choice is clicked, but the set is not KNOWN until Kess speaks band 3 of
# kess_install_part, which needs her to buy a FOURTH part and go back to the bench. A [group] sets nothing, so
# there is no "finding 3 heard" flag and none can be added there. part_installed gte 1 means exactly "she has
# been back to Kess since try 3", it needs no new state, and it is the same shape cap_first_fire uses. It
# works ONLY because beat_0079 does not burn the fourth part.
#
# MEDIA: one new slot, scenes/bastien_undertow.jpg — the cap_mercer_resurfaces precedent, which carries
# exactly one scene image for the same job at the same bar. No video: nothing happens here that a clip shows.
[[canvases]]
id          = "cap_bastien_walks_in"
name        = "The man at the other end"
description = "beat_0080 (rev 125). Blueprint scene 17 — Bastien walks back into play @underworld_bar. Auto-fire Tier-3 capstone, pri 11, one-shot, gated mercer_attempts gte 3 + part_installed gte 1 (the beat_0078 off-by-one fix, applied at birth: 'she has been back to Kess since try 3', which is where band 3 names him) + bastien_hub_open is_false. SCHEDULELESS SPEAKER — no requires_npc, no npc, no presence clause, exactly like cap_mercer_resurfaces at this same location; a schedule row here would leak his portrait badge onto the Undertow nav card (v2.py:4773). He did not release her, he LOST her, and he has spent the time since not finding out who came through his door. He wants to know who put her back together; she wants the name that is sitting on her leash. 15 beats. SETS bastien_hub_open. Nothing explicit — the search is promised in his own mouth and played at beat_0081, so the unsigned Bastien ceiling stays unspent (the rung_mercer_hands_on precedent)."
[canvases.trigger]
location      = "underworld_bar"
is_repeatable = false
priority      = 11
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "mercer_attempts",  operator = "gte", value = 3 },
  # ⚠️ THE beat_0078 OFF-BY-ONE FIX — see the header. Without it this fires the instant try 3's routing
  # choice is clicked, a full install before Kess has said the name Bastien.
  { type = "trait", subject = "player", trait_key = "part_installed",   operator = "gte", value = 1 },
  { type = "flag",  subject = "player", flag_key  = "bastien_hub_open", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "The man at the other end"
blocks = [
  { type = "image", props = { file = "scenes/bastien_undertow.jpg", description = "A composed, unhurried man in a good coat sitting alone at the end of a dim underground bar, an untouched glass in front of him, the rest of the room keeping its distance.", search_queries = ["well dressed man alone at dim bar untouched drink noir", "quiet powerful man seated end of underground bar low light"] } },
  { type = "paragraph", content = "Sol has the taps and the room has the shape it always has at this hour." },
  { type = "cascade", props = { beats = [
    # beat 0 — no advance_text; merges into the node lead.
    { blocks = [
        { type = "paragraph", content = "Then it doesn't. Nobody is told anything: two men finish their drinks standing up, and a third stops talking mid-sentence and stays stopped." },
    ] },
    { advance_text = "Don't turn round.", blocks = [
        { type = "paragraph", content = "He takes the stool beside her without hurrying and does not announce himself. Sol finds something to do at the other end of his own bar." },
        # His shipped Act-1 opener, deliberately reused — the player has heard this line in the cell.
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Wren. That's the file Mercer keeps you under, so it's still the one I'll use." },
    ] },
    { advance_text = "Wait.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "You've been up at the paper stall four nights running. Old man, new name, sells manifests to people who can't read them. I hear things before they're said." },
        { type = "paragraph", content = "It is not a threat. He says it the way another man would mention the weather." },
    ] },
    { advance_text = "Let him get to it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "But that's not the interesting part. The interesting part is the walking." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Last I had you, you were finished. Empty as a robbed till, on a frame, and the man who checked said there was nothing left in there to check." },
    ] },
    { advance_text = "Say nothing.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "And here you are with your coat done up and something ticking in you again. Somebody has had their hands inside my property and made it work." },
        { type = "paragraph", content = "She keeps her hands flat on the bar. He has not once looked at them." },
    ] },
    # §11: his lever is CURIOSITY, not desire. The cell was a lab and he took numbers.
    # ⚠️ SPLIT at measure time — the dialog and the notebook line together came to 51 w against §7 check 2's
    # hard 50, and the rule is SPLIT, never compress. The halves are 27 w and 44 w.
    { advance_text = "Let him finish.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "I want to know who. Not to settle anything with them — I've no quarrel with a good mechanic." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "I want to know what a good mechanic saw." },
    ] },
    { advance_text = "It was never punishment.", blocks = [
        { type = "paragraph", content = "The cell was never punishment. It was a room with a notebook in it, and she is the only page he never finished." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "There's paper all over this city about things like you. None of it written by anyone who's had one in a room." },
    ] },
    # ⚠️ CAIN STAYS OFF-PAGE (§15). Bastien gets the man who came and no more — no name, no guess, no history.
    { advance_text = "The night it ended.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "And there's a second question you'll not answer tonight. A man came through my far door for you — furious, in a hurry, wanting to know what had been done to you." },
        { type = "paragraph", content = "She has four words out of that night and one of them is a name." },
    ] },
    { advance_text = "Let it sit.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "I've spent the time since not finding out who he was. It's the only thing I've ever wanted and not got, and I've wanted very little." },
        { type = "paragraph", content = "He turns his glass a quarter turn and leaves it. He has not touched it since he sat down." },
    ] },
    { advance_text = "Give him nothing.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "I'm not here about that." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "No. You're here about something. People are always here about something, and the honest ones come to me last." },
        { type = "paragraph", content = "He is pleased with that. It is the closest he comes to warmth and it costs him nothing." },
    ] },
    # The canvas's ONE interior beat, and it observes — §14, she never narrates a plan.
    { advance_text = "Keep it off your face.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "The one name Kess could place off the key is sitting on the next stool being agreeable about a robbed till, and he has no idea he is on a list she is carrying." },
    ] },
    { advance_text = "Hear the offer.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Come round the back some night. Not tonight. There's a room behind this one and I keep better company in it than out here." },
        { type = "paragraph", content = "It is not a summons, and that is the part that works. He asks, and there is no version of this where she says no." },
    ] },
    # ⚠️ THE SEARCH IS PROMISED, NOT PLAYED — his rule in his own mouth. Playing it is beat_0081's job and it
    # is the beat the unsigned ceiling row governs. Nothing here touches her.
    { advance_text = "There's a condition.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "One rule, and it's an old one. Nobody comes into my room carrying. I check, I don't apologise for it, and I don't make exceptions." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "You of all things should know I'm thorough." },
    ] },
    { advance_text = "Count the problem.", blocks = [
        { type = "paragraph", content = "She has a drain seated in her socket and a switch in her coat pocket, and both of them have to get through that door." },
        { type = "paragraph", content = "He stands before she does. He always has. It is the whole of the man." },
    ] },
    # Terminal beat — no advance_text.
    { blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Any night this week. Ask Sol — he'll pretend he doesn't know, and then he'll tell you." },
        { type = "paragraph", content = "She came down here to find him. He thinks she has come back." },
    ] },
  ] } },
]
# ⚠️ IT EXITS INTO ITS OWN LOCATION, WHICH IS SAFE HERE AND IS THE SHIPPED PRECEDENT. An auto-fire that lands
# back where it fired re-runs auto-fire selection, but bastien_hub_open is set on this very exit block (exit
# effects fire on RENDER), so the canvas's own guard is already closed by the time selection runs again — and
# nothing else at underworld_bar is eligible (cap_mercer_resurfaces is a spent one-shot needing mercer_found
# is_false; the rest are a link and two portrait hubs). cap_mercer_resurfaces does exactly this, same
# location, same flag-on-exit shape. She stays at the bar because that is where the scene leaves her.
[canvases.nodes.exit_block]
type = "location"
text = "Finish your drink."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "underworld_bar"
time_progression_minutes = 45
flagEffects = [
  { targetType = "player", flag = "bastien_hub_open", op = "set" },
]

# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
# beat_0081 (rev 126) — THE BACK ROOM AND THE SEARCH AT THE DOOR. Blueprint scene 18, design_the_leash §11
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
# §11's arc is NOT seduction, it is SMUGGLING, and her body is the bag. She needs the drain AND the controller
# in that room, because on a name that is on the set the drain alone does nothing — and Bastien searches
# everyone who comes through, which he said in his own mouth at beat_0080.
#
# ⚠️ THE CEILING IS SIGNED AT REV 126 (LO's call at this beat) — "The Leash — Bastien, outside the cell", with
# two clauses added at signature: (i) HE NEVER LEARNS WHAT SHE IS — the drain takes his answers and nothing
# goes the other way; he can be closer than anyone has been and still end the chapter not knowing, because if
# he works it out there is no Bastien left for the next chapter. (ii) SHE IS NEVER SHOWN ENJOYING IT — the
# back room is WORK, the charge is what she is carrying, and there is no arousal-as-consent anywhere in it.
# The row itself: the captivity re-spec is NOT widened and stays scoped to captive_room; his crude, degrading
# diction runs on top of the ordinary owned-slave floor; NO pack, NO restraint, NO sustained non-con. The
# charge is THE SEARCH — unhurried, public, and she has to stand for it.
#
# ⚠️ THERE IS NO FAIL BRANCH, AND THAT IS A DESIGN CALL. §11: he is "establishing in public that he still
# may". This is not a challenge she can lose, it is a humiliation she has to stand for — a fail state would
# make it a lock-picking minigame and would turn the beat into pain-as-spectacle, which the rev-122 governor
# row already named as the failure mode. SHE ALWAYS GETS IN. What varies is whether what she needs got in
# with her, and that is the honest cost.

# ── kess_seat_controller — ROUTE A past the door, and the route the chapter is about ────────────────────
# The thing that will free her goes back inside the seam Bastien's own men cut open to disarm her.
# TRIGGERLESS, reached from hub_kess_berth's new "Have him seat the key" rung. Sets controller_seated = 1.
# ⚠️ KESS'S CEILING (signed rev 120, clause iii) governs this canvas exactly as it governs kess_install_part:
# explicit and NOT sexual, anatomical and surgical rather than erotic, no arousal on either side, no pain and
# no comfort. She is bare from the hip because that is where the seam is and the scene never treats that as
# nakedness. He does not ask what the room costs her; he has never once asked.
[[canvases]]
id          = "kess_seat_controller"
name        = "In, then"
description = "beat_0081 (rev 126). ROUTE A past Bastien's door @kess_berth. TRIGGERLESS, reached from hub_kess_berth's 'Have him seat the key' rung, gated bastien_hub_open is_true + controller_seated lt 1 + feed_line_days gte 1. Kess seats the controller in the seam at the base of her spine — the same bench, the same seam, the thing that will free her going back inside the opening Bastien's men made. 7 beats / 6 clicks, no media (reuses nothing; the bench's own art is on hub_kess_berth). SETS controller_seated = 1 on the exit. Kess ceiling, clause (iii): explicit and not sexual."

[[canvases.nodes]]
id   = "base"
name = "In, then"
blocks = [
  { type = "paragraph", content = "The lamp is down low over a clear bench." },
  { type = "cascade", props = { beats = [
    # beat 0 — no advance_text; merges into the node lead.
    { blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "It has to go where the part goes." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Does it. Somebody's checking pockets, then." },
        { type = "paragraph", content = "He does not ask whose. He has never once asked." },
    ] },
    { advance_text = "Put it on the steel.", blocks = [
        { type = "paragraph", content = "She sets the controller on the bench — a plain grey thing with a thumb-switch, in her coat since the night it was handed to her." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Smaller than the part. Worse shape. Whoever built this never meant it to go inside anything." },
    ] },
    { advance_text = "Ask if it can.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "Can it go in." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "In, yes. Comfortably, no. It'll sit against the housing and you'll know it's there every time you sit down." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Trousers. Face in the coat. Same as the part." },
    ] },
    { advance_text = "Get on the bench.", blocks = [
        { type = "paragraph", content = "She lies face-down on the steel, bare from the hip, because that is where the seam is. It gives the way it always gives — patient, a quarter turn, then all at once." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Arms flat. This one's wider than what I've been putting in you." },
    ] },
    { advance_text = "Hold still.", blocks = [
        { type = "paragraph", content = "It goes in slowly and it does not want to. There is pressure where she has no word for pressure, and a wrongness she was never built to be given a name for." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Breathe out. There. That's it home." },
    ] },
    { advance_text = "Sit up.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "You'll feel it when you stand. Don't let that put anything on your face." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "And it comes out the way it went in. Not by you. Come back and I'll do it." },
    ] },
    # Terminal beat — no advance_text.
    { blocks = [
        { type = "paragraph", content = "She does up her trousers. The thing that decides who she may put her teeth on is inside her now, an inch from the thing that decides she may not." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Whatever door that's for — I'd want the key on the inside of it too." },
    ] },
  ] } },
]
[canvases.nodes.exit_block]
type = "location"
text = "Stand up carefully."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "kess_berth"
time_progression_minutes = 60
effects = [
  { targetType = "player", trait = "controller_seated", op = "set", value = 1, clamp = true },
]

# ── bastien_door_search — THE GATE, played on-screen, every single visit ────────────────────────────────
# ⚠️ IT IS A FLAT SOLO LINK AT THE BAR, NOT A HUB — neither `npc` nor `requires_npc`, the shipped
# mercer_end_table shape, so check_render_buckets stays clean (it flags requires_npc-WITHOUT-npc, and this
# canvas carries neither). It is repeatable because it is TRIGGERLESS-shaped with is_repeatable = true; an
# auto-fire cannot be repeatable at all (v2.py:4454), and a search that plays once is a search that stopped
# mattering.
# ⚠️ ITS EXIT IS THE ONLY THING THAT EVER PUTS HER IN THE BACK ROOM. bastien_backroom has no entry_from and
# therefore no nav card, so there is no route in that skips this canvas — see that location's header.
# ⚠️ PRESENCE IS THE CLOCK. The npc_at_location clause reads his 20:00-23:59 row at bastien_backroom, so the
# card is simply absent outside his hours and she can never arrive at a dead room. No off-hours guard needed.
# ⚠️ THE THREE ROUTES ARE THE OUTCOME BANDS, exclusive by construction on (controller_seated, stealth), and
# the SAME predicates repeat on three exclusive exit choices so the outcome rides the CLICK (choice effects
# fire on click; exit-block effects fire on render). Threshold 30 is the shipped top guard band from the
# burned yard, so route B is a real investment and not a rounding error.
#   A  controller_seated gte 1                  -> it is in the seam his own men opened. He finds nothing.
#   B  controller_seated lt 1 + stealth gte 30  -> in her coat, and it very nearly does not work.
#   C  controller_seated lt 1 + stealth lt 30   -> he finds it. It goes on the desk. She goes in empty.
# Route C is NOT a punishment branch and NOT a fail: she still gets in, and the cost is that the evening is
# wasted, because the drain alone does nothing on a name that is on the set. He hands it back on her way out.
# MEDIA: reuses locations/underworld_bar.jpg. It happens at his bar's door, and establishing shots are the
# one asset this game reuses on purpose (underworld_market_shop and activity_buy_part already do).
[[canvases]]
