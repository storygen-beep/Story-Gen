# ══════════════════════════════════════════════════════════════════════════════════════════════════
# APPENDIX — THE ACCOMMODATION EDITS (rev 141, beat_0091)
# ══════════════════════════════════════════════════════════════════════════════════════════════════
#
# Everything above is the block that was lifted whole. Everything below was removed from surfaces that
# STAY in the build, because each one pointed at something in that block. Restoring the thread means
# putting these back too. They are verbatim; nothing here was rewritten on the way out.
#
# ── (1) 5_scenes.toml — hub_kess_berth.base, the seat-the-key rung ────────────────────────────────
# Goes back between the "Give him the part." choice and "Leave him to it.". It had to come out rather
# than be gated shut: it targets kess_seat_controller.base, and a choice pointing at an absent node
# hard-fails the unresolved-exit build gate.
#
#   # beat_0081 — ROUTE A PAST BASTIEN'S DOOR. Hidden until there is a door to get past: bastien_hub_open is what
#   # makes the controller a smuggling problem, and before that this rung would be an answer to a question the
#   # player has not been asked. controller_seated lt 1 retires it once it is in — Kess says on the way out that
#   # it comes back out by him, not by her, so there is nothing to toggle. feed_line_days gte 1 for the same
#   # reason the install rung carries it: he does not work a bench he is not paid for.
#   # ⚠️ rev 130 — RESIDUAL, KNOWN AND LEFT. When this rung vanishes on a lapsed line she is carrying a
#   # controller, not a part, so part_held is 0 and band C fires: "you've been sleeping rough — that buys you a
#   # floor, not me." That names the payable fix, which is what the parts stall was missing, but it does not name
#   # the KEY. Closing that properly means crossing a third axis into the band chain and the 2x2 stops being
#   # exclusive by construction. Not done here because the measured stall was the parts loop; if the seat-key
#   # step ever strands a playtester the fix is a fifth band, not a greyed rung (see the show_when_locked note).
#   [[canvases.nodes.exit_block.choices]]
#   text       = "Have him seat the key."
#   targetType = "node"
#   nodeId     = "kess_seat_controller.base"
#   conditions = { version = "1.0", logic = "AND", items = [
#     { type = "flag",  subject = "player", flag_key  = "bastien_hub_open",   operator = "is_true" },
#     # ⚠️ RETIRED AT beat_0083 — after the cut there is no key to seat, and offering it would be a rung that
#     # answers a question the game has closed.
#     { type = "flag",  subject = "player", flag_key  = "leash_cut",          operator = "is_false" },
#     { type = "trait", subject = "player", trait_key = "controller_seated",  operator = "lt",  value = 1 },
#     { type = "trait", subject = "player", trait_key = "feed_line_days",     operator = "gte", value = 1 },
#   ] }
#
# ── (2) 5_scenes.toml — cap_extraction's trigger gate ─────────────────────────────────────────────
# One clause, removed from the conditions list. It sequenced the chapter; it was never the scene's
# cause (mercer_leash_state gte 2 already carries that, and Kess says so on the bench). Put it back
# above the leash_cut clause:
#
#   { type = "trait", subject = "player", trait_key = "bastien_drains_done", operator = "gte", value = 1 },
#
# ── (3) 5_scenes.toml — quest card J, its original tip and closer ─────────────────────────────────
# J's TEXT never changed. Its tip and its closing clause did, because K and L are shelved and J had to
# become the last frontier. Original:
#
#   tip        = "Kess read the rest off the key: three more names, two he can't place, and one of them is Bastien — the man who kept you in a room. He's down in the Undertow and he doesn't take much finding. Keep the cot paid; you'll want Kess's bench again before this is finished. If you want the next chapter sooner, Support Us in the sidebar."
#   when = [
#     { flag = "leash_answered",   op = "is_true"  },
#     { flag = "bastien_hub_open", op = "is_false" },
#   ]
#
# ⚠️ ON RESTORE, J'S CURRENT TIP IS CARD L'S AND MUST GO BACK TO L. Do not leave the same tip on both.
#
# ── (4) 5_scenes.toml — quest cards K and L ───────────────────────────────────────────────────────
# Both go back between card J and card M, in this order, with their headers.

# K — the BASTIEN card (rev 125, beat_0080): bastien_hub_open is_true + bastien_drains_done lt 1.
# ⚠️ MANDATORY, AND FOR THE FIFTH TIME IN THIS CHAPTER. cap_bastien_walks_in's exit sets bastien_hub_open,
# which CLOSES card J — and J is the last Story-Goal card in the game, so without K the Quests page goes
# blank the instant Bastien sits down. Same D/E/F/G/H/I/J shape, with the TRAIT form of the closer that card
# B2 already ships ({ trait = ..., subject = "player", op = "lt", value = 1 }): bastien_drains_done is not
# bumped until beat_0082, and the forward reference builds green because quest `when` has no validation site.
# No `goals` array — frontier shape.
# ⚠️ CARD J KEEPS ITS COPY OF THE SUPPORT-US ASK and only the build-boundary CLAIM moved here — the rev-113
# precedent set on card D, re-learned the hard way at beat_0079 when the first cut of card I's re-cut took
# the ask off the live card and the regression suite caught it. J's TEXT is untouched and stays true where it
# stands: a player still holding J has not met him yet.
[[quest_cards]]
priority   = 10
text       = "He found you first, which was always how it was going to go. He took the next stool, called you by the file Mercer keeps you under, and asked who put you back together — and never once mentioned that his own name is sitting on the thing in your spine. There's a room behind his bar and an open invitation to it."
tip        = "Go down to the Undertow and take him up on it. One problem: nobody comes into that room carrying, he checks, and he is thorough — so the drain in your socket and the switch in your coat both have to get past him, and on a name that's on the set neither one works without the other. Keep the cot paid; Kess's bench is where that problem gets solved. If you want the next chapter sooner, Support Us in the sidebar."
when = [
  { flag  = "bastien_hub_open",    op = "is_true" },
  { trait = "bastien_drains_done", subject = "player", op = "lt", value = 1 },
]

# L — the LAST card of the chapter's authored ladder (rev 127, beat_0082): bastien_drains_done gte 1 +
# leash_cut is_false.
# ⚠️ MANDATORY, AND FOR THE SIXTH TIME IN THIS CHAPTER. The d0 choice bumps bastien_drains_done, which CLOSES
# card K — and K is the last Story-Goal card in the game, so without L the Quests page goes blank the instant
# the second drain lands. Same D/E/F/G/H/I/J/K shape. leash_cut is not set until beat_0083; the forward
# reference builds green because quest `when` has no validation site. No `goals` array — frontier shape.
# ⚠️ CARD K KEEPS ITS SUPPORT-US ASK and only the build-boundary CLAIM moved here — the rev-113 precedent set
# on card D, applied first time since beat_0079 learned it the hard way.
# ⚠️ IT DOES NOT NAME CAIN (§15). She does not have the name — captivity_cain says the four words are a thing
# she "cannot hold" — so the card speaks in exactly what she does have: a buyer with no name, who is the same
# man who took her out of that room, and who wanted to know what was done to her rather than what she can do.
[[quest_cards]]
priority   = 10
text       = "You took it out of him with his own key running: whoever bought your build file never gave a name, wanted what was done to you rather than what you can do — and is the same man who came through Bastien's door a year ago and carried you out. Bastien worked that out while you had him open, and by morning he won't have it. You still can't hold the name."
tip        = "There's one thing left in you that isn't yours. Take it back down to Kess and have him cut the chip out — he can do it now, because a live key holds the governor quiet while he works, and he couldn't before. Keep the cot paid; he doesn't work a bench he isn't paid for. If you want the next chapter sooner, Support Us in the sidebar."
when = [
  { trait = "bastien_drains_done", subject = "player", op = "gte", value = 1 },
  { flag  = "leash_cut",           op = "is_false" },
]

# ── (5) 5_scenes.toml — quest card M's tip ────────────────────────────────────────────────────────
# One sentence removed and one door renamed. Original:
#
#   tip        = "Nothing in you answers to anybody now — no leash, no key, no owner with a switch. Mercer still pours for you and still doesn't know. Bastien still keeps the back room and still can't work out what you are. That's where this build ends. There's a man who came through Bastien's far door a year ago, in a hurry, and wouldn't say why he cared, and he doesn't have a name yet — he's the next chapter. If you want it sooner, Support Us in the sidebar."
#
# In the shipped 0.1.8 tip the back-room sentence is gone and "Bastien's far door" reads "the far door
# of that cell" — the same door, established in Act 1 captivity, so the hook survives him.
#
# ── (6) 5_scenes.toml — Bastien's three-card npc_bastien section ───────────────────────────────────
# Goes back after Mercer's section and before Calloway's, header included.

# ══════════════════════════════════════════════════════════════════════════════════════════════════════════
# Quests page — BASTIEN's section (Tier 2, npc_id). NEW at beat_0084 (rev 129). Three cards, exclusive.
# ⚠️ HE GETS NO CARD DURING CAPTIVITY. The cell already has a Story-Goal status card (captivity_entered +
# captivity_done is_false) that says the honest thing — nothing she does in there is escape — and a parallel
# Bastien section would be a second surface saying it worse. His section starts when he becomes somebody she
# can act on, which is bastien_hub_open.
# ⚠️ THE THIRD CARD IS THE TERMINAL-FLAG SWEEP APPLIED TO THE QUESTS PAGE — the rule beat_0083 folded into
# lanes.md for canvases, which turns out to bind here too. The middle card's whole subject is getting a switch
# past his search; after cap_extraction there is no switch, so left alone it would sit on the page as a live
# instruction about an object that no longer exists. Same defect class as the drain exits that beat_0083
# caught requiring controller_state after the cut; different surface.
[[quest_cards]]
priority   = 11
npc_id     = "npc_bastien"
text       = "He knew what you were before he sat down, asked who had been inside you since, and let the answer sit there unfinished. Not one word about being one of the names Kess read off that key, which he has known the whole time. What he left you with is a door behind the bar, an invitation that doesn't expire, and one rule."
tip        = "Bastien holds the Undertow's back room from eight. Nobody comes in carrying and he checks, thoroughly — and you are carrying two things, one of them welded into your back. On a name that sits on the set, neither is any use without the other. That's a problem for Kess and the breaking-dock, not for the door."
when = [
  { flag  = "bastien_hub_open",    op = "is_true" },
  { trait = "bastien_drains_done", subject = "player", op = "lt", value = 1 },
]

[[quest_cards]]
priority   = 12
npc_id     = "npc_bastien"
text       = "You had him open with his own key running, and what came up was a buyer with no name — interested in the work, not the weapon — and, in the same breath, whoever it was that came through the far door of that cell twelve months back and took you out of it. Bastien put those two together himself, out loud, with your hand still on him. By morning he hasn't got it either."
tip        = "He's yours now and it changes nothing at his door: the search happens every visit, and the switch still has to get past him. That's the price of admission until the chip comes out of you."
when = [
  { trait = "bastien_drains_done", subject = "player", op = "gte", value = 1 },
  { flag  = "leash_cut",           op = "is_false" },
]

[[quest_cards]]
priority   = 13
npc_id     = "npc_bastien"
text       = "He still puts you against the wall at the door and goes through the coat and the seam, and there is genuinely nothing on you now — no switch, nothing seated, nothing wired to anybody's name. He can't work out what changed and he's too careful a man to ask. The room is just a room, and you're the reason he keeps it."
tip        = "Nothing left to smuggle past him. The Undertow's back room, from eight, whenever you want it."
when = [
  { flag = "leash_cut", op = "is_true" },
]

# ── (7) 1_metadata_and_locations.toml — npc_bastien's schedule row ────────────────────────────────
# Goes back immediately under the [[npcs]] block for npc_bastien. ⚠️ It must sit there and nowhere
# else: inserting another [[npcs]] between the NPC and this row silently re-attaches the row to the
# wrong NPC.

# beat_0081 (The Leash) — HIS FIRST SCHEDULE ROW IN THE GAME. He has carried the largest prose block in the
# corpus (the captivity chunk) with no hub, no schedule and no way to be met.
# ⚠️ IT IS AT bastien_backroom AND IT COULD NOT BE ANYWHERE ELSE. A schedule row is unconditional and the
# nav-card badge is not canvas-gated (getNpcsPresentAtLocation, v2.py:4773), so a row at underworld_bar —
# unlocked and reachable since Act 1 — would park his face on the Undertow card in every save, including one
# where he is still a saved reveal. bastien_backroom has NO nav card at all (no entry_from), so this row can
# never surface anywhere. See that location's header.
# ⚠️ ONE ROW, ENDING AT 23:59 — a single window cannot wrap the day boundary (that needs two entries), and
# there is nothing here that needs the small hours. 20:00-23:59 also overlaps Kess's 10:00-22:00 by two
# hours, so one night can hold a bench trip and a visit to the door.
[[npcs.schedules]]
location   = "bastien_backroom"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "20:00"
end_time   = "23:59"
activity   = "keeping the back room"

# ── (8) 1_metadata_and_locations.toml — the bastien_backroom location ─────────────────────────────
# Goes back immediately before the crew_den location block.

# ── bastien_backroom — beat_0081 (The Leash). The room behind the Undertow, and blueprint scene 18's home.
# ⚠️ NO `entry_from`, DELIBERATELY — the captive_room shape. A location with no entry_from is on NO nav grid,
# which is what this room needs for two separate reasons:
#   (1) THE BADGE. npc_bastien gets his first schedule row in the game here, and a schedule row is
#       unconditional. The in-room portrait card is canvas-gated (v2.py:4998-5008) but the NAV-CARD BADGE IS
#       NOT (getNpcsPresentAtLocation, v2.py:4773), so a row at any location with a card would park his face
#       on that card in every save — including an Act-1 save where he is still a saved reveal and is at that
#       moment holding her in a cell. Scene 6c hit this with Mercer and answered it with a LOCKED card; no
#       card at all is strictly better, because a locked card still advertises the room before she is invited.
#   (2) THE SEARCH MUST BE UNSKIPPABLE. The only thing that ever puts her in here is bastien_door_search's
#       exit. With a nav card — locked or not — she could walk in the moment the flag flips and never stand
#       for the search, which is the one beat this room exists to make unavoidable (design_the_leash §11:
#       "he strips her at the door… in front of his own bar, because he is establishing that he still may").
# So: no entry_from, no entry_conditions, no blocked_message. There is no door to block because there is no
# card. She leaves by hub_bastien's exit, back out to underworld_bar.
[[locations]]
id          = "bastien_backroom"
name        = "The Back Room"
description = "Behind the Undertow, past a door that has no handle on the bar side. Better furniture than the room deserves, a desk with nothing on it, and a chair set where a man can see both the door and whoever he has put in front of it. It smells of the bar and of nothing else."
image       = "locations/bastien_backroom.jpg"
image_search_queries = ["private back room behind bar desk armchair dim", "noir speakeasy office low light leather chair"]
# ⚠️ auto_exit = false, AND IT IS LOAD-BEARING — caught live at beat_0081 before the first assertion about
# the room even ran. Dropping entry_from is only half the job: _ordered_navigation builds a location's nav
# grid from its CHILDREN (locations whose entry_from points at it), so this room has an empty grid AND no
# auto "Leave" link — and an empty navigation_html trips the list-every-location FALLBACK
# (v2.py:19386, `if not navigation_html and auto_exit`). The built passage came out carrying
# "All locations:" and the entire world, so from Bastien's back room she could walk to the Spire.
# auto_exit = false is the engine's own word for this shape — a TRANSIT STOP, arrived at and left by CANVAS
# (in by bastien_door_search's exit, out by hub_bastien's "Back out to the bar"), whose empty nav list is
# intentional rather than a stranding to be rescued. underworld_gate is the shipped precedent and its header
# in this same file spells the whole trap out; captive_room dodges it a different way, by having captive_door
# as a child. A nav-invisible interior needs BOTH halves: no entry_from, and auto_exit = false.
auto_exit   = false
