# (present Sunday 20:00-23:59), gated rue_met is_true (crew_known NOT on the trigger -> stays a repeatable
# Sunday regular after the drain). Poses oral/vaginal/anal (loop_npc_pleasure climbs, finish at >=50).
# The ANAL finish IS the drain — the game's one drain rule (equipped_weapon=1 + drain_charge>=1): crew_known
# is_false + geared -> the extraction (SETS crew_known + watcher seed); already-drained / under-geared ->
# a normal paid finish. mouth/inside finishes just pay + end. All four anal-finish choices partition the
# {crew_known × gear × charge} space -> exactly one shows per state (no gap, no overlap).
[[canvases]]
id          = "hunt_marsh_sunday"
name        = "Marsh"
description = "Rue's Sunday-night exclusive, served as a real loop. requires_npc npc_marsh + rue_met. Poses oral/vaginal/anal -> elected finish. The ANAL finish fires the drain the normal way (equipped_weapon=1 + drain_charge>=1, crew_known is_false) -> SETS crew_known + watcher seed. Repeatable after (drain once, gated crew_known). Under-geared/already-drained anal = a paid finish. Every conditions block version=1.0."
[canvases.trigger]
location      = "underworld_brothel"
requires_npc  = "npc_marsh"
npc           = "npc_marsh"
is_repeatable = true
priority      = 6
is_active     = true
# (rev 61) OR-gate: PRE-drain you must have schemed Rue THIS Sunday (rue_met — wiped nightly by the daily
# tick); POST-drain (crew_known) he's simply your Sunday regular and needs NO re-scheme. Both flags are
# transitively behind brothel_hired (rue_met only set by the scheme, which requires hired; crew_known only
# set by the drain, which requires rue_met) — so "she works here first" still holds without nested AND/OR.
conditions = { version = "1.0", logic = "OR", items = [
  { type = "flag", subject = "player", flag_key = "rue_met",    operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "crew_known", operator = "is_true" },
