[[canvases.nodes]]
id   = "base"
name = "The madam"
blocks = [
  { type = "image", props = { file = "scenes/rue_madam.jpg", description = "A composed older woman in a dim red-lit brothel parlor, watching the room from a worn velvet chair, a ledger and a cash box at her elbow.", search_queries = ["brothel madam red light parlor seated", "older woman bordello velvet chair dim"] } },
  { type = "paragraph", content = "The woman by the rooms takes her measure before she's three steps in — the flat, unhurried read of someone who's priced a thousand bodies and is rarely wrong by much. She doesn't get up." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_rue" }, content = "Rue. I run this house. Not the muscle, not the owner — the floor. Which means I decide who works my rooms and who serves the few names worth keeping. You've got the look of someone who's been used for it before and stopped feeling it. Down here that's not a mark against you. That's the job." },
  { type = "paragraph", content = "She tips her head at the rooms behind her — the offer plain, no contract, no company, nobody signing the girl out at the end of it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_rue" }, content = "Coin's yours when you're done, and nobody up top hears a word of it from me. You want in, you ask me. Simple as that." },
