[[canvases.nodes]]
id   = "base"
name = "The far door"
blocks = [
  { type = "paragraph", content = "She comes back a little at a time, into a room that has changed. The men are gone. The near door stands open on an empty corridor. The frame she was strapped to is on its side where somebody knocked it going out fast. She is on the floor by the grate they meant to hose her over, and her left leg will not answer, and the light under her skin is out — properly out, not flickering, dark the way a cooled coal is dark." },
  { type = "paragraph", content = "Through the wall, two men are arguing." },
  { type = "paragraph", content = "One of them is Bastien. She would know that voice anywhere now, and it has not changed — flat, unhurried, reasonable, a man explaining a position he sees no reason to raise his voice about. The other voice she has never heard in her life, and it goes through her wrong, because it is furious, and the fury has something under it she has no file for. It takes her a long muddled moment to find the word for the thing under it, and the word she finds is grief, and that makes no sense at all, because nobody has ever once been angry on her account, let alone torn up about it." },
  { type = "paragraph", content = "She is too far gone to hold any of it. The words come apart before they reach her. Four get through the whole of it and no more. One is Bastien's, and it is a word she knows the shape of because it is a word men use about her: an ownership word, said the way you'd say the price of a thing. And three come across in the other voice, and one of those three is a name — she is nearly certain it is a name — and it goes into her somewhere below the amputation and fits, the way a key fits the one lock in a house that was left, a lock she did not know she had, and she cannot for her life say what the name was or why a stranger saying it should make the empty places in her ache like frostbite coming warm. And the last word, in that same broken voice, is one that has no business anywhere near a room like this, a word you say over a grave and not over a thing you are haggling for. She reaches for all four of them and they slide out of her hands." },
  { type = "paragraph", content = "The arguing stops. Not trails off — stops, the way it stops when one man has said the thing there is no answer to." },
  { type = "paragraph", content = "Then the door — the far one, off its hinges already — and he comes in, and she cannot make him hold still. He is a shape against the bad light and a smell of old smoke, and he crosses the room fast and goes down on one knee beside her, and she flinches, because everyone who has knelt beside her in this room has done it to use her. He doesn't. He turns her, careful of the dead leg, the way you'd turn something you already knew the weight of, and he finds the seam at the base of her spine without looking for it — without searching, his hand going straight to it in the dark like a hand going to its own pocket — and he puts the weight back." },
  { type = "paragraph", content = "The drain seats home. She feels it take, feels the terrible backed-up pressure behind her sternum find, at last, the door it has been beating on, and begin — slowly, agonisingly — to bleed off down a channel that is hers again. It is not relief. It is too late for relief. But it is the difference between a thing that is failing and a thing that is going to fail, and her leg, somewhere very far away, twitches once and remembers most of itself." },
  { type = "paragraph", content = "He is already up. Whatever he came to do, it was not to talk to her; or he cannot; or there is no time. He puts two fingers against the side of her face for exactly as long as it takes to be sure she has come back, and even that is not a stranger's touch, and then he is a shape in the doorway and then he is gone, and she is alone in a broken room with her weapon back in her spine and no idea on God's earth why any of it just happened." },
  { type = "paragraph", content = "She wakes on the waterfront at dawn. Sore, and not whole — the fault sits in her core where it stopped and does not move, and she already knows, the way you know a scar before you've seen it, that it is not going to move again. But the drain is in its socket. Her leg carries her. The city is exactly where she left it, indifferent, the gulls going and the tide out, Mercer's work waiting and Renner's depot waiting and Sunday coming around again the way Sunday does." },
  { type = "paragraph", content = "And four words she cannot hold, and cannot stop reaching for, and one of them a name that fit a lock she didn't know was hers." },
]

