  { type = "dialog", props = { speaker = "player" }, content = "No sell, no ask. Just the only man in here who looks like he'd still be alive this time next year — and I'm tired of drinking alone." },
  { type = "paragraph", content = "That earns her a look, a real one, held a beat longer than he means to give it — two careful people clocking the same wariness in each other. He says nothing else worth keeping. But he lets a whole minute pass without checking the door, and for a man like Colm that's most of a confession." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "One drink in and he's still all edges. Fine — she's got nowhere to be and he's here every night. Somewhere under the careful there's a courier who moves things between the worlds for a buyer who pays on time. That's the thread. She just has to be patient enough to pull it, a round at a time." },
]
