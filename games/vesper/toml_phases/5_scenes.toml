  { type = "dialog", props = { speaker = "npc", npcId = "npc_sol" }, content = "Short list down here, and a shorter one that's any good. The one you want's called Colm. Runs sealed packets for a buyer who pays too well to name, and hasn't let a thing show up in a ledger in all the years I've watched him drink. Careful to a fault." },
  { type = "dialog", props = { speaker = "player" }, content = "Where do I find him." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_sol" }, content = "Right here, most nights — corner stool, back to the wall, drinking slow so he stays sharp. In around seven, nurses it till close. Buy the man a drink. He warms slower than he'll ever admit, but he warms." },
  { type = "paragraph", content = "A name, a stool, a habit — the whole of it. She looks down the bar and finds him without trying: a wary regular three stools down, a bag with a boot hooked through the strap, eyes on the door out of pure reflex. Her thread up out of Calloway's file room and straight to whoever's buying." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Colm, then."
