# ═══ beat_0064 (v2 rework, rev 96) — the 1a close: she names the bargain, takes the controller ═════════
# Auto-fire capstone @penthouse, gated docs_retrieved is_true + archive_1a_done is_false. She brings Mercer the
# file to hand over — but he's already unraveling (the deep-vault flag climbed, the Chairman's eye has turned, the
# trail lands on HIM, the man who ran an unauthorized asset into the archive). He doesn't want the docs; he wants
# OUT. rev 96 — THE PIVOT: instead of narrating that she'll take the key "on the way," WREN NAMES THE PRICE. She
# offers the one thing a company man can't buy in a panic — passage to the one place the Chairman can't follow, the
# underworld, her turf — in trade for the leash CONTROLLER. He pays: desperate, and sure it's keyed to him and
# useless to her (he's never heard of a breaker like Kess). She KEEPS the file too (hers — the subject-reveal is
# deferred to 1b; here she can't crack it). They descend together, Spire sealing behind; at the bottom the deal is
# done and they're quits — Mercer peels off his own way, she turns for Kess. SETS archive_1a_done (1a-complete) +
# controller_held (the key is in her pocket now, locked). Exits DOWN to underworld_strip (rev 96 — was the_waterfront;
# the split happens in the underworld, one nav step from Kess's berth). The 1b drive shifts from "chase Mercer for
# the key" to "get Kess to crack it + survive the Chairman." Dialog-carried.
[[canvases]]
id          = "cap_1a_close"
name        = "The price of the ride"
description = "beat_0064 (v2, rev 96). The 1a close @penthouse. Auto-fire capstone, pri 9, one-shot, gated docs_retrieved is_true + archive_1a_done is_false. Mercer's PANICKING (the heat reached him, the Chairman turned) and wants to run. rev 96 — Wren NAMES THE BARGAIN: safe passage to the underworld (where the Chairman can't follow) in trade for the leash CONTROLLER. He pays (desperate; thinks it's keyed to him, useless to her). She keeps the file too (still locked; reveal = 1b). They descend together, Spire sealing behind; at the underworld they split — Mercer his own way, she to Kess. SETS archive_1a_done + controller_held. Exits DOWN to underworld_strip (was the_waterfront). Dialog-carried."
[canvases.trigger]
