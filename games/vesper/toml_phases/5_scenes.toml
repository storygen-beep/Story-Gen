  { type = "paragraph", content = "Marsh comes in on the hour, exact. A small neat man who checks the room's exits before he checks the girl, and takes the one the madam pointed him to without a word — her, tonight, in Rue's place. He doesn't notice the swap, or doesn't care; he wants the hour he paid for. Whatever a careful man keeps behind his face, she'll have to work him loose for it — and she knows the one act that opens him." },
