# ═══════════════════════════════════════════════════════════════════════════════
# CAPTIVITY — the shelf, scenes 1-8 (beat_0039/0040, RE-SCRIPTED rev 64). Nominal/Hot/Faulting/Failing x2.
#
# MECHANISM (verified, v2.py): trigger_mode="random" + is_repeatable=FALSE is legal and SELF-RETIRING.
#   • selectAutoFireCanvasForLocation SKIPS triggerMode=="random" (v2.py:4293) -> auto-fire can't hijack them.
#   • the random path runs isCanvasValid -> canTriggerCanvas, which returns false once total>=1.
# So each scene fires exactly ONCE and needs NO per-scene "seen" flag. Two one-shots share each band;
# the Fisher-Yates shuffle (v2.py:5090) reorders the pair between playthroughs.
#
# THE LADDER: +12 strain per use. Bands are the same edges the sleep night-use reads:
#   lt 24 -> Nominal (scenes 1,2)   24-47 -> Hot (3,4)   48-71 -> Faulting (5,6)   72-95 -> Failing (7,8)
# Strain is only ever a multiple of 12, so each band holds exactly two uses. NOTHING REPEATS.
#
# PACING: cooldowns[locKey]=3 is HARDCODED (v2.py:5105) and decremented one per room entry — after any
# scene fires the next 3 entries roll nothing. random_cooldowns is NOT an author knob. The only lever is
# chance (0.5 here) + the per-day cap, which one-shots don't need.
#
# VOICE (rev 64 — HOT & DEGRADING, LO's call): Bastien in `dialog` blocks (his portrait renders). He gets
# off on her and says so — slut, hole, bought-and-paid-for, filthy machine; full crude; his cold
# ownership-curiosity (still writing numbers) runs as subtext UNDER the meanness, never a brake. The crew are
# FACELESS BUT LOUD — a jeering pack, decoupled from his register — speaking in quoted lines inside
# `paragraph` blocks, never named speakers (a speaker="unknown" dialog renders a hardcoded "Stranger:" label,
# v2.py:14020-14026). Her interior: ONE clipped thought_bubble per scene.
#
# STRUCTURE (rev 64): each scene is a scripted MULTI-BEAT PURE-WITNESS CHAIN (approach -> strip -> inspection
# -> the acts -> finish -> read-out), advanced on one forward choice per node; the terminal read-out node
# carries the +12 strain / -energy exit ONCE. Media = one clip per beat (many NEW -> find-media harvest; the 8
# original clips are reused on each scene's core act). NOT the flat one-clip captions of the rev-63 draft.
#
# NO npc=/requires_npc — npc_bastien has no schedule row, and a requires_npc canvas would never fire.
# ═══════════════════════════════════════════════════════════════════════════════

# ── SCENE 1 — Nominal. "The inventory" (rev64 witness chain). ──────────────────
[[canvases]]
