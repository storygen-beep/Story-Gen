id   = "base"
name = "Colm"
blocks = [
  { type = "image", props = { file = "scenes/colm_undertow.jpg", description = "A wary man drinking careful at a dim underworld bar, back to the wall.", search_queries = ["man alone dim bar back to wall night", "wary drinker underground bar corner"] } },
  # THE MEET (colm_met is_false) — they meet for the first time. He's careful, gives nothing. The only action is to buy him a drink.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "colm_met", operator = "is_false" },
    ] } }, blocks = [
    { type = "paragraph", content = "Three stools down: the man Sol pointed her to. Corner seat, back to the wall, a bag with a boot hooked through the strap so it never leaves his ankle. He's nursing one drink like it has to last till dawn, and his eyes go to the door on a clock she can't hear — every ninety seconds, reflex, the tic of a man who's counted the exits in every room he's ever sat in. She takes the stool beside him. He clocks her, weighs her, and gives her exactly nothing — polite, careful, a man having a quiet one and meaning to keep it that way." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_colm" }, content = "If you're selling, I'm not buying. If you're asking, I'm that even less. Nothing personal — just how I've stayed a man who gets to keep having quiet ones." },
    { type = "paragraph", content = "But he doesn't move stools, and he doesn't tell her to leave. He just goes back to watching the door, letting her sit inside the arm's length he gives nobody — which is its own kind of answer. Careful men notice careful people. She hasn't asked him for a single thing; that's the only reason she's still got the seat." },
    { type = "thought_bubble", props = { speaker = "player" }, content = "Careful to a fault, exactly like Sol said — and lonely with it, under all that guard. You don't crack a man like this with a question. You crack him with time. The first hour starts with a drink he didn't have to pay for." },
  ] },
  # THE STANDING HUB (colm_met is_true) — banded on relation. cold < 12 / warming 12-23 / hers >= 24.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag",  subject = "player", flag_key  = "colm_met", operator = "is_true" },
      { type = "trait", subject = "npc", npc_id = "npc_colm", trait_key = "relation", operator = "lt", value = 12 },
    ] } }, blocks = [
    { type = "paragraph", content = "He's still all business, but he lets her take the stool now without the once-over. A careful man testing the shape of her — what she wants, why a woman like her keeps spending her evenings on a courier three seats from the door." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_colm" }, content = "Nobody buys a man this many rounds for the conversation. So what is it — you want something moved, or you want me?" },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag",  subject = "player", flag_key  = "colm_met", operator = "is_true" },
      { type = "trait", subject = "npc", npc_id = "npc_colm", trait_key = "relation", operator = "gte", value = 12 },
      { type = "trait", subject = "npc", npc_id = "npc_colm", trait_key = "relation", operator = "lt", value = 24 },
    ] } }, blocks = [
    { type = "paragraph", content = "He saves her the stool now. The guard's not gone — a careful man's never fully goes — but he's loose, warm, leaning in to hear her over the room. He watches the door out of habit and her out of want." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_colm" }, content = "You're the best part of my week, you know that. Whatever it is you actually came for, I'm starting not to care." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag",  subject = "player", flag_key  = "colm_met", operator = "is_true" },
      { type = "trait", subject = "npc", npc_id = "npc_colm", trait_key = "relation", operator = "gte", value = 24 },
    ] } }, blocks = [
    { type = "paragraph", content = "The careful's all the way off him now. He's up off the stool before she's fully in the door, hand at the small of her back, steering her to the dark end of the bar like the room's already theirs. He'll follow her anywhere she points him — and she knows exactly where that is." },
  ] },
]
