# canvas as a Lane-3 solo-link (live-verified: it lands in the solo bucket), so it renders as the one thing she
# can do on the floor out of cover — click it to back out. Gated archive_started is_false + cover UNEQUIPPED
# (mutually exclusive with cap_archive_cover's cover-EQUIPPED gate, so IN cover the cover beat fires instead).
