[[quest_cards]]
priority   = 11
npc_id     = "npc_calloway"
text       = "He trusts you now. Get under the guard — a hand, your mouth — until the disbelieved man's terror surfaces and he tries to bolt. Talk him back down."
tip        = "Run the rungs — Get close to him, take him in your mouth. Each pushes his corruption. At the catch, re-anchor his belief; the suspicion stops winning."
when = [
  { flag = "calloway_believes",       op = "is_true"  },
  { flag = "calloway_flinch_resolved", op = "is_false" },
]
goals = [
  { trait = "corruption", subject = "npc", npc_id = "npc_calloway", op = "gte", value = 12, label = "Get under his guard" },
]
[[quest_cards]]
priority   = 11
npc_id     = "npc_calloway"
text       = "The catch is past. Take him all the way — the one place your power still works, on a man who isn't the one who owns you."
tip        = "The loop's open: Take him — all the way. The anal finish is the drain — and the drain is how you get him to give up where your file's kept."
when = [
  { flag = "calloway_flinch_resolved", op = "is_true"  },
  { flag = "calloway_fucked_once",     op = "is_false" },
]
goals = [
  { trait = "corruption", subject = "npc", npc_id = "npc_calloway", op = "gte", value = 18, label = "Break him all the way open" },
]
[[quest_cards]]
priority   = 11
npc_id     = "npc_calloway"
text       = "He's yours — the last true believer in a dying division, and he'll never know the woman he trusts handed you the way to your own file. Keep him blind, keep him close, and open the drain whenever it's hungry."
tip        = "The loop's open — take him whenever you want. The first drain already gave you the where (the deep vault in docs); every one after is pure power — your warm tap, and your hold on him while you work everyone else."
when = [
  { flag = "calloway_fucked_once", op = "is_true" },
]

# ── Quests page — Colm's section (Tier 2, npc_id). rev 98: stepped by npc_colm.RELATION, not drink/kiss counts —
# earning the careful courier, not counting rounds. One card at a time (exclusive by relation bands). Starts once
# Sol names him (colm_found); before that the Story-Goal B card carries the "ask Sol" step. Kiss unlocks at
# relation>=12, the back room at relation>=24 (the hub gates). ──
[[quest_cards]]
priority   = 11
npc_id     = "npc_colm"
text       = "The careful courier. He carries the leak down to the buyer — and he's the one man who's seen the inside contact's face. He won't be rushed and won't be bought; he has to be earned, an evening at a time."
tip        = "At the Undertow, buy Colm a drink and pass the time with him — both wear the careful down (he's in from seven). It takes a few evenings on him; when he trusts you enough, you can get your hands on him."
when = [
  { flag  = "colm_found", op = "is_true" },
  { trait = "relation", subject = "npc", npc_id = "npc_colm", op = "lt", value = 12 },
]
goals = [
  { trait = "relation", subject = "npc", npc_id = "npc_colm", op = "gte", value = 12, label = "Earn the courier's trust" },
]
[[quest_cards]]
priority   = 11
npc_id     = "npc_colm"
text       = "The careful man leans into your hand now. Get past the last of the guard — kiss him, in the middle of his own bar, and keep at him until he'll follow you anywhere."
tip        = "In Colm's hub: Kiss him — he stiffens at first, then warms, then stops flinching. Keep buying his trust up (drink, talk, kiss) and the back room opens."
when = [
  { trait = "relation", subject = "npc", npc_id = "npc_colm", op = "gte", value = 12 },
  { trait = "relation", subject = "npc", npc_id = "npc_colm", op = "lt",  value = 24 },
]
goals = [
  { trait = "relation", subject = "npc", npc_id = "npc_colm", op = "gte", value = 24, label = "Get under his guard" },
]
[[quest_cards]]
priority   = 11
npc_id     = "npc_colm"
text       = "He'll follow you anywhere now. Take him in the back — the drain's the point, and his drained memory of the hand-offs is the one thing he carries that you actually came for: the inside man's face."
tip        = "In Colm's hub: Take him in the back, then work him until he's ready. The drain only opens one way — let him finish in your ass. Any other finish and you get the night and nothing else."
when = [
  { trait = "relation",         subject = "npc", npc_id = "npc_colm", op = "gte", value = 24 },
  { trait = "colm_drains_done", subject = "player", op = "lt",  value = 1 },
]
goals = [
  { trait = "colm_drains_done", subject = "player", op = "gte", value = 1, label = "Take him in the back (the drain)" },
]
[[quest_cards]]
priority   = 11
npc_id     = "npc_colm"
text       = "You have the rogue's face, and a courier who'll never know he gave it to you. Colm's a warm tap now — come back and open the drain whenever it's hungry. Your business is with Vane."
tip        = "Colm's done as a lead — the back room's yours whenever you want it, pure power now. Take what you learned to Vane at Vance Securities."
when = [
  { trait = "colm_drains_done", subject = "player", op = "gte", value = 1 },
]
