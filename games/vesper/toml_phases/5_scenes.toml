blocks = [
  { type = "paragraph", content = "She flags Sol for two and slides one in front of him before he can wave it off. Colm looks at the glass, looks at her, and does the arithmetic of a man who trusts nothing free — what it costs him to drink it against what it costs him to refuse. Refusing is the louder tell. He drinks." },
