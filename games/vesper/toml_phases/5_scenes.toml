# ── Quests page — Story-Goals spine (Tier 1, no npc_id). A = the retargeted Salvage card (above). B1/B2/C/D here.
# Flag-milestone chain, one card live at a time (exclusive by flags). ──
# B1/B2 — the leak leg, SPLIT at pipe_known (the work-case -> underworld hinge). Before this was ONE card spanning
# calloway_believes -> the Colm drain with a compound "work the case THEN the Undertow THEN Colm" tip that never
# stepped — live-render bug: byte-identical text whether she should stay at the desk or leave for the underworld.
# Now B1 = still work the case (find the HOW), B2 = go to the underworld (find the WHO). pipe_known is set by
# case-reveal #3 (beat_0058) that points her at the Undertow, and is the exact gate that opens the Sol->Colm leg,
# so the split IS the skill's stepped ladder, not a special case. C (get the file) + D (the 1a end) below.
# B1 — still work the case: calloway_believes is_true + pipe_known is_false.
[[quest_cards]]
priority   = 10
text       = "You're all the way into his hunt now. Two years he's chased a leak with nothing to show — no theft, no gap, just secrets bleeding out of a company that never loses a page. First, find the how."
tip        = "Work the case with Calloway in the file room. Keep at it until the bleeding finally has a shape — an inside man, and an off-book pipe carrying it out."
when = [
  { flag = "calloway_believes", op = "is_true"  },
  { flag = "pipe_known",        op = "is_false" },
]
# B2 — go to the underworld: pipe_known is_true + colm_drains_done lt 1. (pipe_known implies calloway_believes
# by construction — its reveal beat gates on calloway_believes — so no A/B2 overlap.)
[[quest_cards]]
priority   = 10
text       = "You've got the shape now — an off-book courier, running the leak down to the Reach where a company man can't follow. But you can. Now find the who."
tip        = "Leave the desk to Calloway. Take it to your own turf — the Undertow — and ask Sol who runs the carry between the worlds. He'll name Colm. Earn the careful courier's trust over a few evenings (buy him drinks, talk him warm), then take him in the back; his drained memory hands you the rogue's face."
when = [
  { flag = "pipe_known",     op = "is_true"  },
  { trait = "colm_drains_done", subject = "player", op = "lt", value = 1 },
]
# C — get the file + get it out (v2): after Vane's confirmed, until the 1a close. Gated colm_drains_done gte 1 +
# archive_1a_done is_false (spans the retrieval AND the run to Mercer, so no blank sidebar-next between them).
[[quest_cards]]
priority   = 10
text       = "You have the rogue: Vane, at Calloway's elbow the whole time, cleared for the deep vault where your file's kept. Make him pull it — then get it out of the building and up to Mercer before the Chairman's people ask who signed out the vault."
tip        = "At Vance Securities, corner Vane — you've got him cold (the courier, the dock, the dates), and he's cleared for the vault you can't enter. Trade his silence for your file, then take it to Mercer at the penthouse. (Need the vault first? Take Calloway all the way — the drain is where he gives up where your file's kept — then go stand at that vault yourself.)"
when = [
  { trait = "colm_drains_done", subject = "player", op = "gte", value = 1 },
  { flag = "archive_1a_done", op = "is_false" },
]
# D — the 1a END card (rev 97): TERMINAL frontier, gated archive_1a_done is_true. This release ends at the close —
# 1b (the Kess handoff + rest-bed + the crack) is DEFERRED, so D is the build boundary again, not a "go to Kess"
# step. She holds the locked key + file; the crack is next release. Carries the Patreon ask. (rev 96's active
# "go to Kess" version + the E frontier card are shelved with the rest of 1b — see the commented E block below.)
[[quest_cards]]
priority   = 10
text       = "You made the trade: Mercer's key for Mercer's ride down. The controller for your leash is in your pocket now — dead in your hand, keyed to a man who just vanished into the dark. The file's yours too, and just as locked. You're blown topside, alone in the underworld with the whole of yourself sealed in two objects you can't open."
tip        = "That's where this build ends. Cracking the key — cutting your leash, opening the file, and finally reading what you are — plus what becomes of Mercer loose in the Reach, is the next release. If you want it sooner, Support Us in the sidebar."
when = [
  { flag = "archive_1a_done", op = "is_true" },
]
