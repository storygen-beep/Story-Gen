# The ordering is load-bearing here (unlike the 1a close, which is fixed with a state guard) and it is SAFE
# because the two other penthouse capstones are state-exclusive with this one: mid-repair means salvage_done
# is_false, while cap_1a_close needs docs_retrieved is_true, which can't precede salvage_relaunched (which
