# ═══ beat_0034 — THE GRAB (kidnap capstone — CHUNK END) ════════════════════════
# BARE auto-fire at crew_den (priority 9, is_repeatable=false, NO npc=/requires_npc — an npc= one-shot
# renders nowhere). Also reached DIRECTLY from the search's find. Gated bastien_found. His people take
# her; face-to-face with Bastien (he knows she's Mercer's via his CONNECTIONS, NOT Cain; the Cain
# alliance stays OFF — a saved reveal). SETS bastien_revealed. Single exit -> the_waterfront (dumped,
# released). Ends on his question hanging. NO fail-state (scripted plot beat).
[[canvases]]
id          = "hunt_the_grab"
name        = "The grab"
description = "Kidnap capstone. Auto-fire at crew_den on bastien_found (+ reached directly from the search). Bare, single-exit. Face-to-face with Bastien -> SETS bastien_revealed -> dumped at the_waterfront, chunk ends. Cain-alliance stays OFF (saved reveal)."
[canvases.trigger]
location      = "crew_den"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "bastien_found",    operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "bastien_revealed", operator = "is_false" },
] }
[[canvases.nodes]]
id   = "base"
name = "The grab"
blocks = [
  { type = "paragraph", content = "She doesn't hear the door. One second she's got the ledger under her arm and the stair in front of her; the next there's a bag over her head, a knee in her back, and hands that know exactly how much pressure a body takes before it stops fighting. Nobody says a word — professionals. The last thing she registers before the dark is a man at the foot of the stair folding his newspaper, the same patient watcher from The House, stepping aside to let them carry her past." },
  { type = "paragraph", content = "She comes to upright in a chair that isn't restraining her, which is its own kind of message. A back room, warm light, a door that's shut and not locked. Across a plain table a man watches her with the patience of someone who owns the building and everything in it — unhurried, certain, a voice that will never have to be raised because the room is already his." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Wren. That's the file Mercer keeps you under, so it's the one I'll use. You've been busy. Doss. Rourke. My man Marsh, who woke up Monday poorer and stupider and can't tell me why. A great deal of digging, for one of Mercer's assets — into people who are mine." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Don't reach for whatever cover you had ready. I knew you were Mercer's before you finished your first drink down here; I hear things before they're said. That isn't what interests me." },
  { type = "paragraph", content = "He leans in, unhurried, and doesn't threaten her — doesn't reach for anything. He looks at her the way you'd look at the first genuinely interesting thing to cross your desk in years." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "What interests me is that when my man watched you leave The House, he swore the girl who walked out wasn't quite a girl. And my people are very rarely wrong about the things that unsettle them. So before I decide what you're worth — to me, and to the people I answer to, who'd pay a great deal for the honest answer — I'll ask you plainly. What are you, really?" },
  { type = "paragraph", content = "The question hangs. She has covers for men who want her body and men who want her obedience, and none at all for a man who wants the one thing under the chip she can't reach herself. Somewhere below the amputation, something turns over at being seen. She doesn't answer. He reads the not-answering, nods as though it told him plenty, and lifts two fingers — and the bag comes down again." },
  { type = "paragraph", content = "She wakes on the waterfront at dawn, sore and whole and released, the ledger gone from under her arm. He has her name, her face, and a question she can't answer; she has his. Bastien. The hunt has a person at the end of it now — and the person has her." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Get up off the dock."
targetType = "location"
locationId = "the_waterfront"
flagEffects = [
  { targetType = "player", flag = "bastien_revealed", op = "set" },
]

