tip        = "Go back to Renner and get him to the drain once more — this time make him name the two he buried."
when = [
  { flag  = "renner_leads_extracted", op = "is_true" },
  { trait = "names_known", subject = "player", op = "lt", value = 1 },
]

# ── The Trail — TWO rungs (milestone chain, quests.md §5A). Rev 67: was ONE card that never retired.
# WHY THE SPLIT: the old single card carried a ready_text payoff naming "Doss and Rourke" — written when the
# yard WAS the finale (pre-rev-54). Rev 54 moved the names behind the Renner drain (names_known, set on the
# loop finisher's first-drain choice -> renner_control_canvas.intro, where he SPEAKS them). The card was never
# revisited, so it (a) printed the names before Renner could — and the yard opens at renner_hired while the
# drain sits at the END of his arc (corruption 50 + fucked + weapon + charge + anal finish), so it scooped his
# confession for nearly every player; (b) CONTRADICTED its own payoff scene (yard_find_3 deliberately withholds
# them: "the same name twice"); (c) never retired — `when` was renner_hired ALONE, and found_dead_men (set by
# its own find, 3_activities) was read by ZERO gates, so it survived past bastien_revealed still saying
# "sneak in". A tip CANNOT flip on its own — renderQuestsCard swaps text->ready_text on allMet (v2.py:14526)
# but prints `tip` unconditionally and there is no `ready_tip`. Splitting is the ONLY way to get a true tip
# per state. Rung 1 retires at the find; rung 2 carries the handoff and stops where the SCENE stops (no names).
# Exclusive on found_dead_men; rung 2 also gated renner_leads_extracted is_false so it can't double up with the
# returning-player re-drain nudge (priority 9) which owns the already-drained-but-no-names case.

