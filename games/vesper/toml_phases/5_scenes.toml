# ═══ work_the_case — Lane-3 solo host @vance_securities (the analyst cover-work; SEPARATE from the Calloway hub) ═══
# Wren-solo task activity (mirrors Renner's work_depot_haul): she does the actual analyst job -> +3 relation (the
# belief/access feeder) + case_progress +1 (drives the staged case-reveals) + 60 min. SEPARATE from
# hub_calloway_fileroom (which holds only the NPC-object verbs: Talk to him + the seduction rungs). "Work the case"
# = work, not an NPC interaction (skill: hub = NPC verbs; solo work = its own host). Repeatable, pri 3, gated
# calloway_met + the file-room window (08:00-20:00, so Calloway's in the room to comment). Solo-link (no
# requires_npc), Calloway present in the fiction (his file room) as a dialog speaker.
# rev 95: the base node carries a SECOND ladder — a 6-band case-state read-out (see the STATUS LADDER comment
# inside the node). The activity is deliberately NOT retired when the case-work is spent (it's her cover, and the
# post-drain body variant is authored); it tells the truth about being spent instead.
[[canvases]]
id          = "work_the_case"
name        = "Work the case"
description = "Wren-solo Lane-3 host @vance_securities. The analyst cover-work (dig the boxes, cross-reference the pulls) -> +3 relation (the belief/access feeder) + case_progress +1 (drives the staged case-reveals) + 60 min. SEPARATE from the Calloway portrait hub (Talk to him + the rungs stay there). Repeatable, gated calloway_met + schedule 08:00-20:00. Calloway present in the fiction, but mechanically a task, not the hub (like Renner's work_depot_haul). rev 95: TWO one-axis ladders on the base node — body by calloway_drains_done (pre/post drain) + a 6-band STATUS read-out by the case chain (insider -> curated -> belief -> pipe -> rogue), so the desk says where the case stands, names the real blocker when it's his trust rather than more boxes, and says plainly when the paper is spent. Exit text neutral ('Log the hour.')."
[canvases.trigger]
location      = "vance_securities"
