# ═══ beat_0034 — THE GRAB (kidnap capstone) ════════════════════════════════════
# REWRITTEN at beat_0037. It used to end "She wakes on the waterfront at dawn, sore and whole and
# released" and dump her at the_waterfront. That release was wrongly authored: Bastien takes her and
# she STAYS TAKEN. The tail now goes dark and the single exit PORTS her into captive_room.
#
# SAVE-SAFETY: the canvas keeps its `id` and keeps SETTING bastien_revealed. Only the tail prose and the
# exit target changed — so a returning player's save still reads the same flag. What it CANNOT do is
# carry them into the chunk: every shipped player already holds bastien_revealed and is standing on the
# waterfront, so `captivity_recovery` below is their door in. Two doors, one room.
#
# BARE auto-fire at crew_den (priority 9, is_repeatable=false, NO npc=/requires_npc — an npc= one-shot
# renders nowhere). Also reached DIRECTLY from the search's find. Gated bastien_found. Face-to-face with
# Bastien (he knows she's Mercer's via his CONNECTIONS, NOT Cain; the Cain alliance stays OFF — a saved
# reveal). NO fail-state (scripted plot beat).
[[canvases]]
id          = "hunt_the_grab"
name        = "The grab"
description = "Kidnap capstone. Auto-fire at crew_den on bastien_found (+ reached directly from the search). Bare, single-exit. Face-to-face with Bastien -> SETS bastien_revealed + captivity_entered, strips the drain (equipped_weapon=0), resets the shared sex-loop traits -> PORTS her into captive_room. Cain-alliance stays OFF (saved reveal)."
[canvases.trigger]
location      = "crew_den"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "bastien_found",    operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "bastien_revealed", operator = "is_false" },
] }
[[canvases.nodes]]
id   = "base"
name = "The grab"
blocks = [
  { type = "paragraph", content = "She doesn't hear the door. One second she's got the ledger under her arm and the stair in front of her; the next there's a bag over her head, a knee in her back, and hands that know exactly how much pressure a body takes before it stops fighting. Nobody says a word — professionals. The last thing she registers before the dark is a man at the foot of the stair folding his newspaper, the same patient watcher from The House, stepping aside to let them carry her past." },
  { type = "paragraph", content = "She comes to upright in a chair that isn't restraining her, which is its own kind of message. A back room, warm light, a door that's shut and not locked. Across a plain table a man watches her with the patience of someone who owns the building and everything in it — unhurried, certain, a voice that will never have to be raised because the room is already his." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Wren. That's the file Mercer keeps you under, so it's the one I'll use. You've been busy. Doss. Rourke. My man Marsh, who woke up Monday poorer and stupider and can't tell me why. A great deal of digging, for one of Mercer's assets — into people who are mine." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Don't reach for whatever cover you had ready. I knew you were Mercer's before you finished your first drink down here; I hear things before they're said. That isn't what interests me." },
  { type = "paragraph", content = "He leans in, unhurried, and doesn't threaten her — doesn't reach for anything. He looks at her the way you'd look at the first genuinely interesting thing to cross your desk in years." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "What interests me is that when my man watched you leave The House, he swore the girl who walked out wasn't quite a girl. And my people are very rarely wrong about the things that unsettle them. So before I decide what you're worth — to me, and to the people I answer to, who'd pay a great deal for the honest answer — I'll ask you plainly. What are you, really?" },
  { type = "paragraph", content = "The question hangs. She has covers for men who want her body and men who want her obedience, and none at all for a man who wants the one thing under the chip she can't reach herself. Somewhere below the amputation, something turns over at being seen. She doesn't answer. He reads the not-answering, nods as though it told him plenty, and lifts two fingers — and the bag comes down again." },
  { type = "paragraph", content = "Hands under her arms. A stair, and then further down than a stair should go. The salt smell of the docks thins out and stops. Somewhere in the dark someone finds the seam at the base of her spine, working it the way a man works a jar lid, patient, until it gives — and the weight of the drain comes off her and does not come back. She goes under before she can count the turns." },
]
# The exit PORTS her into the cell. equipped_weapon=0 is the disarm — the injury, not a detail: the drain
# fires on an anal finish, so being disarmed is what turns a gangbang from a meal into an overload.
# ⚠️ equipped_weapon=0 is an unrecoverable dead state (the swap activity gates both choices on eq 1 / eq 2,
# 3_activities.toml) — the Cain release (beat_0042) MUST restore it to 1.
# The 5 shared sex-loop traits reset here or captivity state bleeds into Marsh's Sunday.
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Go under."
targetType = "location"
locationId = "captive_room"
flagEffects = [
  { targetType = "player", flag = "bastien_revealed",  op = "set" },
  { targetType = "player", flag = "captivity_entered", op = "set" },
]
effects = [
  { targetType = "player", trait = "equipped_weapon",   op = "set", value = 0 },
  { targetType = "player", trait = "sex_stage",         op = "set", value = 0 },
  { targetType = "player", trait = "loop_npc_pleasure", op = "set", value = 0 },
  { targetType = "player", trait = "sex_finisher_type", op = "set", value = 0 },
  { targetType = "player", trait = "anal_active",       op = "set", value = 0 },
  { targetType = "player", trait = "sex_entry_origin",  op = "set", value = 0 },
]

# ── Hunt END card (Story-Goals, priority 9) — the OLD end-of-content, shown in the WINDOW between the
# grab revealing Bastien and captivity starting. beat_0043 upper-gated it with `captivity_entered is_false`:
# the grab now sets bastien_revealed on the way INTO the cell, so without this gate the tip "you've reached
# the end of the current build" would fire DURING captivity — telling the player the game is over while
# they stand in the newest content in it. For a NEW player bastien_revealed + captivity_entered are set in
# the same exit, so this never shows for them; it survives only for the SHIPPED cohort, between loading
# their old save and stepping onto the waterfront where the recovery pulls them in. Retires permanently
# once captivity_entered is set (never unset). The tip is de-dev-speaked (no "current build").
[[quest_cards]]
priority   = 9
text       = "There's a name at the end of the trail now — Bastien, the man the underworld answers to — and he has yours. He let you walk, this once, with a question you couldn't answer. Whatever comes next comes from him."
tip        = "Bastien knows your face and your file now. Whatever he wants, it comes to find you — you won't have to go looking."
when = [
  { flag = "bastien_revealed",  op = "is_true"  },
  { flag = "captivity_entered", op = "is_false" },
]

# ── Captivity card (Story-Goals, priority 10) — live WHILE she is held (captivity_entered is_true +
# captivity_done is_false). She has no agency here and no goal to pursue, so this is a STATUS card, not a
# goal: text + tip, NO `goals` and NO `ready_canvas` (a story-goal card renders its text unconditionally,
# v2.py:14451; the goal block is optional, so no blank-row). It replaces the hunt END card during the
# cell (that card is now gated off), so exactly one of the two shows at any time. Honest, not a walkthrough:
# the tip names the two verbs without pretending either is a way out.
[[quest_cards]]
priority   = 10
text       = "You are somewhere under the Reach, in a room with a drain in the floor and a door that does not open for you. Bastien is unhurried and Bastien is patient and Bastien wants to know what you are, and he has decided to find out by running you until you come apart. There is no plan in here. There is only the machine, keeping count."
tip        = "Nothing you do in the cell is escape. Lie down to weather it, or pay attention to what's on the other side of the wall — either way the core climbs, and either way it ends the same. Someone else decides when."
when = [
  { flag = "captivity_entered", op = "is_true"  },
  { flag = "captivity_done",    op = "is_false" },
]

# ── Captivity frontier card (Story-Goals, priority 10) — the WINDOW between release and finding Kess.
# beat_0043 made this the post-release end-of-content; beat_0054 UPPER-GATES it with `salvage_entered
# is_false` so it retires the instant the Salvage cold-open (beat_0048) fires. (In practice beat_0048
# auto-fires on the first post-captivity waterfront render, so this shows only in that instant — but the
# gate keeps it from claiming the page once the repair is underway.)
[[quest_cards]]
priority   = 10
text       = "You walked out of the Reach on a machine that will not run right again. The core sits faulted where it stopped — you can read it in the sidebar, Failing, and it does not move. You still don't know who came through that door, or why a stranger would tear a place apart to pull you out of it. You went back to work. There was nothing else to do."
tip        = "The fault won't heal on its own. You can't take it to the company — a refit is a wipe. Find someone who works hardware off the books. And whoever came through that door is a question for later."
when = [
  { flag = "captivity_done",  op = "is_true"  },
  { flag = "salvage_entered", op = "is_false" },
]

# ── Salvage STATUS card (Story-Goals, priority 10) — live DURING the repair grind (salvage_entered is_true +
# salvage_done is_false). beat_0054 (v2). A status card (text + tip, no goals — the session hub + band scenes
# drive it). Names the place + the grind loop; coin UP FRONT (no debt, v2 §10). Mutually exclusive with the
# captivity frontier (salvage_entered) and the post-salvage frontier (salvage_done), so exactly one shows.
# ⚠️ The tip names the PLACE verbatim (author-game beat-authoring.md:374 — mandatory), so it is COUPLED to the
# map: it said "off the waterfront" until the berth was re-parented to underworld_strip and nothing re-grepped
# the tips. Re-parent kess_berth again => rewrite this tip. It also teaches the ONE-ZONE shape (earn at
# House/Pit + spend at Kess, both past the gate) — the whole point of that move. Deliberately NUMBERLESS on the
# session cost: the choice label carries "(10 coin)", so the price lives in one place and can't drift here.
[[quest_cards]]
priority   = 10
text       = "The company can't fix you — a refit means a wipe, and you're not walking into that. So you've gone off the books, down to a ship-breaker in the Reach who works on hardware nobody's supposed to afford. He puts you back together a session at a time, and your drain comes back with the work — dead at first, then a flicker, then teeth. He reads something off your guts, too, that you didn't know was written there."
tip        = "The Berth's down the gate, off the underworld strip — the coin and the cradle in one trip. Earn at the House or the Pit, then pay the box up front, every session. Keep at it until the core reads clean; there's no other road back to operational."
when = [
  { flag = "salvage_entered", op = "is_true"  },
  { flag = "salvage_done",    op = "is_false" },
]

# ── Post-Salvage FRONTIER card (Story-Goals, priority 10) — the NEW end-of-content after the verdict
# (salvage_done is_true). beat_0054 (v2). Narrates the current peak honestly (the LEASH — a control governor,
# why she can't touch Mercer; the sidebar reads Leash: Uncut) and telegraphs the twin drives: Mercer's plain
# Calloway job (next chapter's frontier) + the real want, find the controller and cut the leash. No build-file
# (reserved). Never blank, never dev-speak (frontier + quests.md).
# rev 68 — THE TIP NAMES THE BUILD BOUNDARY OUT LOUD. It used to end "...that's the next chapter, the way in
# not open yet", which reads as an IN-GAME lock she hasn't found: the player goes hunting for a door that was
# never built, and that manufactured hunt IS the "grind not content" complaint. quests.md §7 sanctions the
# meta ("...picks up from here in a future update") — the game just never said it anywhere, in any card. The
# boundary + the Patreon ask live in the TIP only (system voice); the `text` stays in-world. One ask, at the
# one moment it's earned — the player just finished and wants more; the sidebar Support Us button is passive
# and has been ignorable all playthrough. Patreon URL is hardcoded engine-side (one campaign, every game — LO
# confirmed that's intended), so there's nothing to configure here.
# Archive Story-Goal A (was the Salvage frontier end card, rev 68). RE-TARGETED beat_0064: keeps the leash reveal
# (standing context); points at the active Calloway mission (get into the file room, take the file); RETIRES at
# calloway_believes (earned at the access capstone -> Story-Goal B takes over). NOTE (v2 rework): the "build ends /
# next release" boundary + Patreon ask REBUILD with the 1a end card at the ending increment (beat_0064 rework) —
# the old Story-Goal D was removed in the demolition pass.
[[quest_cards]]
priority   = 10
text       = "Your body runs again — but the fixer found the real thing wrong with you, and it isn't damage. It's a governor built into you: the reason you can never turn your power on the man who owns you. It doesn't come out without its controller, and you don't have to guess who's held that key the whole time. The sidebar calls it what it is now — Leash: Uncut."
tip        = "Two drives ride together. The company's job: get into Calloway's file room at Vance Securities and take what he's guarding. Your own reason rides under it — the truth of what you are, and, somewhere up the chain, the controller that cuts your leash. But first you need the man who keeps the room. Wear the junior-analyst kit from your room before you set foot on the Vance floor — out of cover you're a stranger who doesn't belong, and an audited division remembers a turned head. Then get to the Spire, and get to Calloway."
when = [
  { flag = "salvage_done",      op = "is_true"  },
  { flag = "calloway_believes", op = "is_false" },
]

