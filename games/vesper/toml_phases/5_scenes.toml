# ═══ calloway_drain_canvas — the drain payloads (triggerless; prose only, effects live on the finisher choice) ══
[[canvases]]
id          = "calloway_drain_canvas"
name        = "What he knows"
description = "Triggerless drain payloads, reached from loop_calloway_finisher's anal-finish choices (counter bump + resets live on the choice). d0 = THE drain (first anal finish) = her power + THE WHERE (drained + open, he gives up where her file's kept: the deep vault in docs); done = the repeatable pure-power use after. calloway_drains_done gte 1 GATES cap_docs_first_look (rev 84 — the drain is the road to the where). The WALL (can't get in) she still sees herself at docs. Second drain REMOVED rev 83."
[[canvases.nodes]]
id   = "d0"
name = "The drain"
blocks = [
  { type = "paragraph", content = "The drain opens all the way and she takes him properly — not a skim, the whole live current of him coming loose through the contact. His Charge, his week, the last hour, going soft and white while she holds the pull steady and drinks it down." },
  { type = "paragraph", content = "And while he's this open, this undefended, she asks him the one thing she came for: where a company that never loses a page keeps what it can't afford to lose. He gives it up without knowing he's giving it — the deep vault, down in the docs department, the sealed archive nobody at her level ever badges into. Whatever Mercer planted her to fetch is sitting behind that door." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "So now she has the where — and a leash on the man who gave it to her. She can open him whenever the drain's hungry and he'll thank her for it; he'll never remember telling her a thing. Easier to keep him than to open that vault — and that part she'll have to solve herself." },
  { type = "paragraph", content = "He blinks, the minutes wiped, disoriented in his own chair. 'Sorry — lost the thread. Where were we.' She tells him it's nothing. Drink some water." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Straighten up."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "vance_securities"
[[canvases.nodes]]
id   = "done"
name = "The warm tap"
blocks = [
  { type = "paragraph", content = "The drain fires the way it always does now — no drama, no discovery, just his Charge coming loose into her and the minutes going with it. He surfaces grateful and none the wiser, his hand finding hers like it's the only true thing in the room. She lets him think it is." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Leave him to it."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "vance_securities"

