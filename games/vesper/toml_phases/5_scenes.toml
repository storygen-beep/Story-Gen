        { type = "dialog", props = { speaker = "npc", npcId = "npc_renner" }, content = "Nothing. He freed it. Whatever they were holding in there, he let it out before he burned the place. The manifests after didn't add up — they were short bodies that weren't bodies. He wasn't robbing them. He was emptying a cage." },
