# a broken asset doesn't get sent out. Lands against the verdict (HE holds her leash). Sets nothing (one-shot
# guard). Dialogue-forward. NB "leash" is reserved for the chip — Mercer never says it.
#
# rev 93 — TWO changes, same bug as the 1a-close collision seen from the other side:
#   (a) the mercer_hub_open is_true clause is GONE. It was always wrong — "Mercer won't use a broken asset" has
#       nothing to do with whether she's served him before, and requiring it meant a player who'd never visited
#       the penthouse got cap_first_penthouse_service (pri 11) instead: Mercer USING her, mid-repair, while she
#       is exactly the broken asset this beat exists to have him refuse.
