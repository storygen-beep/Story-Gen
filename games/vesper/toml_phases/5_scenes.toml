[[canvases.nodes]]
id   = "base"
name = "Collect on the rogue"
blocks = [
  { type = "paragraph", content = "She catches Vane on the back stairs, where the cameras don't reach and Calloway never goes, and doesn't waste the opening on hello." },
  # ONE cascade, exit LAST (rev 86): the two old cascades + the wedged paragraph + the trailing thought are folded into a
  # single drip so nothing renders below the "Get to Mercer" link (and the exit splices ONCE, not twice). beat[0] = no
  # advance (renders as lead); the closing thought = the terminal beat (no advance). See toml-gotchas "cascade must be last".
  { type = "cascade", props = { beats = [
    { blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "A courier at the Undertow gave you up. Not your name — he never had it — your face. Handing him sealed pulls at the loading dock, month after month. Two years Calloway's chased his ghost, and it's been at the next desk the whole time." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_vane" }, content = "You don't— that's nothing. That's a drunk in a bar, you've got a face and a feeling and no—" },
    ] },
    { advance_text = "Show him the drop.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "I've got the courier, the dock, the dates, and a very tired auditor upstairs who'd love a name that isn't Calloway's. I don't want you, Vane. I want one thing out of that vault, and you're cleared for it and I'm not." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_vane" }, content = "...Christ. The deep archive? Do you know what they do to— no. I move paper. I don't touch the vault, that's a different—" },
    ] },
    { advance_text = "Make it the only door left.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "You pull my file, or the auditor gets your face by morning and it climbs to the Chairman by noon. You know what he does with a leak. My way, you're a man who did a quiet favour. The other way, you're an example." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_vane" }, content = "...One file. One. And then I have never met you." },
    ] },
    { advance_text = "Wait for the file.", blocks = [
        { type = "paragraph", content = "It takes him two days and a clearance that isn't his to use. He brings it to the same dead stairwell — a thin sealed folder — and his hands aren't steady." },
    ] },
    { advance_text = "Take the file.", blocks = [
        { type = "paragraph", content = "She has it: the thing Mercer sent her for, and the thing she's wanted in her own hands since she learned it was in this building. A Vance humanoid-program file — about her kind, maybe about her. Light enough to be nothing. She doesn't open it. Not here." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_vane" }, content = "Don't read it here. And listen — pulling that tripped something. There's a flag on the deep-vault log I can't clear, and somebody's already asking who signed it out." },
    ] },
    { advance_text = "Ask who's watching.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "Calloway's watcher. He never trusted me either." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_vane" }, content = "Whoever it is, it climbs — and it climbs to the man who ends people for less than this. I'm gone tonight. The Reach, then further. You should be too. What you just did isn't the kind of thing you get to stay for." },
    ] },
    { blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "So it's blown. Fine. She has the file and a night's head start, and a man who ends betrayers is now aimed at everyone who touched this — Vane, and the fool up the chain who sent her in. She'd better reach Mercer before the news does." },
    ] },
  ] } },
]
