  { type = "paragraph", content = "She comes onto the Vance floor in her own face — the sharp company line, not the plain kit — and it lands wrong the second the light finds her. A junior analyst doesn't dress like she's worth more than the floor she's standing on. A head comes up. On a division being audited, a turned head is how a question starts." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Wrong skin for this floor. Nothing gets done looking like this. The kit's on the rack up in her quarters — where it does her no good." },
]

