] }
[[canvases.nodes]]
id   = "base"
name = "The price of the ride"
blocks = [
  { type = "image", props = { file = "scenes/mercer_panic.jpg", description = "A sweating man in an expensive apartment stuffing papers into a bag, city lights behind him.", search_queries = ["man packing bag panic luxury apartment night", "nervous man shredding papers penthouse city lights"] } },
  { type = "paragraph", content = "She comes up to the penthouse with the file to close the job — and finds Mercer on the wrong side of his own desk, a bag open on the glass, feeding paper into a shredder that can't keep up." },
  # ONE cascade, exit LAST (rev 86): the trailing thought + closing paragraph are folded in as a final beat so nothing
  # renders below the exit link. beat[0] = no advance (renders as lead). See toml-gotchas "cascade must be last".
  { type = "cascade", props = { beats = [
    { blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "It's done. Deep vault, clean pull. Everything you sent me in there for." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "Get it away from me. God — do you have any idea what you kicked over? A deep-vault flag with my asset's fingerprints on it, and it is climbing, and it does not stop until it reaches Vance himself." },
    ] },
    { advance_text = "Watch him unravel.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "You wanted this file for a year. Now you won't touch it." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "I wanted it when it was a clever little edge. It's a noose now. The Chairman doesn't discipline, he disappears people — I've watched him do it. I will not be standing here when he comes asking who ran an asset into his archive. Keep the file, burn it, I don't care. I need to be gone, and every road out of this tower has his people on it by now." },
    ] },
    # THE BARGAIN — she names the price. She has the one thing he can't get: a way under the city.
    { advance_text = "Offer him the one road he hasn't got.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "Not every road. There's one place his people can't follow, because they don't know it's there. Under the docks. Under the Reach. I can walk you into it tonight and nobody topside ever sees where you went." },
        { type = "paragraph", content = "That stops his hands. He looks at her the way a drowning man looks at a rope he doesn't trust — because he knows her, knows nothing she offers is free." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "...And what does that cost me." },
    ] },
    { advance_text = "Name it.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "The controller. The one for the governor you had sealed into my core — the little key that decides who I can't turn my teeth on. You've carried it since the day you signed for me. Give it to me and I take you down alive. That's the fare." },
        { type = "paragraph", content = "For a second the fear thins and something like a smile moves under it — the reflex of a man who's spent his life sure he holds the only card that matters." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "That's it? Take it. It's keyed to me, girl — my hand, my print, it's a dead lump of metal to anyone else alive. You can wear it on a chain. It won't cut a thing." },
    ] },
    { advance_text = "Take the key. Take him down.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "He's wrong, and he'll die never knowing how wrong. Keyed to him, sure — until a man who takes machines apart for a living gets it under a light. She closes her hand around it and it's the first thing in two years that's hers and about her at once. The file in her coat, the key in her fist. Both locked. Both hers." },
        # rev 97 — TERMINAL for this release (1b deferred): the tail no longer tees up the Kess handoff (that scene +
        # the rest-bed are commented below). She lands in the underworld holding the locked key + file; the frontier
        # card (D) says the crack is next release. The "man who takes machines apart" hint above stays as the cliffhanger.
        { type = "paragraph", content = "She gets him into the car and gives the driver an address that isn't on any manifest. The tower falls away, the city goes lower and wetter, and the Spire seals itself shut behind them — sweeps on every floor now, her face on every camera at the curb. No ride back up. At the bottom, where the last light gives out, Mercer goes his own way into the dark to find whatever hole a running man finds, and doesn't look back to thank her. The deal's paid; they're quits. She's alone in the underworld now with a locked key in her fist and a locked file in her coat — the whole of herself sealed in two objects she can't open. That's where her road runs out, for now." },
    ] },
  ] } },
]
