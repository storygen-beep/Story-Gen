  { type = "paragraph", content = "Sunday, and the House keeps its one clock. Rue's at her chair with the ledger open to tonight's page, the far room already blocked out in her own hand. A few hours yet before the careful little man walks in expecting her." },
  { type = "dialog", props = { speaker = "player" }, content = "Your Sunday standing. The careful little man, same hour every week. I want tonight." },
  { type = "paragraph", content = "A slow look up from the ledger, reassessing. She knows exactly who the girl means, and she doesn't ask why." },
