[[canvases.nodes]]
id   = "base"
name = "Work the case"
# POST-DRAIN SWAP (Phase 1) — [group] by calloway_drains_done: pre-drain = the belief/courtship cover-work; post-drain
# = same desk, cover not courtship (she owns him). Solo-work base node (not a hub opener), so [group] is allowed.
blocks = [
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "calloway_drains_done", operator = "lt", value = 1 },
    ] } }, blocks = [
    { type = "paragraph", content = "She pulls a box he hasn't reached and starts cross-referencing the dates against the pulls he's flagged — the actual work, the part every other minder skipped straight past on the way to the close order." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_calloway" }, content = "You're... actually reading them. Huh. Left column's the ones that went missing clean. Right's the ones somebody dressed up after. Don't mix them or I lose a week." },
    { type = "dialog", props = { speaker = "player" }, content = "Then I won't mix them." },
    { type = "paragraph", content = "He goes quiet and works beside her — not warming to her, exactly. Warming to not being alone in it." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "calloway_drains_done", operator = "gte", value = 1 },
    ] } }, blocks = [
    { type = "paragraph", content = "She works the boxes beside him the same as before — except it's cover now, not courtship. He believes every inch of her; she's the one who decides what the case turns up, and when." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_calloway" }, content = "Left column clean, right column dressed. You know the drill by now. Don't know what I did before you." },
    { type = "thought_bubble", props = { speaker = "player" }, content = "Nothing. He did nothing before her and he'll remember nothing after. She logs another hour at the desk of a man who's already hers." },
  ] },
  # ⚠️ CHAIN BREAKER — DO NOT DELETE. The generator collapses CONSECUTIVE group blocks into ONE
  # <<if>>/<<elseif>>/<</if>> chain (v2.py:13649-13662 collects the run; _render_group_chain builds it), so two
  # adjacent ladders become one exclusive chain and everything after the first matching branch is dead code.
  # A non-group block between them starts a NEW chain. This line is real content AND the separator: remove it and
  # the six status bands below silently stop rendering.
  { type = "paragraph", content = "She squares the pulled boxes back into the row and marks the hour on his sheet." },
  # ── STATUS LADDER (rev 95) — the SECOND one-axis ladder on this node: body above bands on calloway_drains_done,
  # status here bands on the CASE chain. One block renders from each, so it's two ladders, NOT a 2xN matrix.
  # WHY: case_progress has exactly three consumers (cap_case_insider >=2, cap_case_curated >=4, cap_case_pipe >=6)
  # and nothing reads it above 6, so past pipe_known every session paid NOTHING while the exit still said "Keep at
  # it." The desk now states where the case stands, names the real blocker when it isn't more filing (band 3 = his
  # trust, not boxes), and says plainly when the paper is spent (bands 5/6 point OUT of the room). Same shape as
  # activity_yard_crawl's yard_depth ladder (3_activities.toml), exhausted line included.
  # EXCLUSIVITY: each flag has exactly ONE setter and every setter requires the previous one — insider -> curated
  # -> pipe_known (+ calloway_believes) -> colm_found -> colm_drains_done — so these six are mutually exclusive by
  # construction, and no dev-jump sets any of them (6_dev_shortcuts stops at the Archive start).
  # 1 — nothing read yet.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "case_insider_seen", operator = "is_false" },
    ] } }, blocks = [
    { type = "paragraph", content = "Dates, pull-slips, signatures. The boxes stay boxes. Whatever's in here is in the pattern and not the pages — and the pattern needs more of them open than she's got open." },
  ] },
  # 2 — has the HOW, needs the hand.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "case_insider_seen", operator = "is_true"  },
      { type = "flag", subject = "player", flag_key = "case_curated_seen", operator = "is_false" },
    ] } }, blocks = [
    { type = "paragraph", content = "She has the how now: nobody broke in. What she doesn't have is whose hand. That's in his two years of dead ends, not in the thefts — and there are a lot of dead ends left to read." },
  ] },
  # 3 — THE WRONG-VERB RESCUE: reveal #3 double-locks on case_progress >= 6 AND calloway_believes. Here the missing
  # input is his TRUST, not more boxes, and nothing else in the room would ever tell her that.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "case_curated_seen", operator = "is_true"  },
      { type = "flag", subject = "player", flag_key = "calloway_believes", operator = "is_false" },
    ] } }, blocks = [
    { type = "paragraph", content = "The trail runs into the part of the hunt he keeps sealed, and no box on this floor opens that. He does — when he decides she's worth handing it to." },
  ] },
  # 4 — sealed side open, the far end close (the last stretch of real case-work).
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "case_curated_seen", operator = "is_true"  },
      { type = "flag", subject = "player", flag_key = "calloway_believes", operator = "is_true"  },
      { type = "flag", subject = "player", flag_key = "pipe_known",        operator = "is_false" },
    ] } }, blocks = [
    { type = "paragraph", content = "The sealed side is hers now and the far end is close. A pass or two more through the logistics — the contracts, the manifests that don't match — and she'll have where it goes." },
  ] },
  # 5 — EXHAUSTED. The counter is dead here; point her at the Reach (the courier isn't on paper).
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag",  subject = "player", flag_key  = "pipe_known",       operator = "is_true" },
      { type = "trait", subject = "player", trait_key = "colm_drains_done", operator = "lt", value = 1 },
    ] } }, blocks = [
    { type = "paragraph", content = "The paper's finished. It gave up the how and it gave up where, and it will never give up a name — the man carrying it was never written down. That answer's down in the underworld, at the Undertow, not in this room." },
  ] },
  # 6 — she already has the rogue (Colm's drain named Vane). The desk can't confirm it and never could.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "colm_drains_done", operator = "gte", value = 1 },
    ] } }, blocks = [
    { type = "paragraph", content = "She has the rogue, and he's two desks away. Nothing in these boxes confirmed it and nothing in them ever will. What's left isn't filing. It's Vane." },
  ] },
]
