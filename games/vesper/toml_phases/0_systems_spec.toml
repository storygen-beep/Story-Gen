# ─── THE FACE (beat_0094, rev 145) — three new internal traits, all hidden ─────────────────────────
# None of them draws a sidebar row and none appears in the <<playerTraits>> dump. The player reads all
# three off the fiction: the refusals off the doors that shut, the rung off what Sol has her doing, and
# the taser off her own coat. Declared in 1_metadata's [player.core_traits], which is what puts them in
# the cross-release save backfill — a trait that only exists here is undefined on an old save.
#
# wall_refusals 0-4 — how many doors have shut on her as Wren. A COUNTER and not four flags, because
#   the only thing that reads it is cap_the_wall's "gte 3" gate, and four flags there would be four
#   clauses that have to be kept in sync with four one-shots.
#
# bar_rung 0-4 — where Sol has her working: 0 not hired · 1 the floor · 2 the counter · 3 the floor in
#   less · 4 the back room. ⚠️ THE LADDER IS A TRAIT AND NOT FOUR FLAGS FOR THE SAME REASON THE PARTS
#   LOOP IS: activity_bar_work bands on it, four exclusive [group]s in one chain, and a chain wants one
#   axis to compare. It is also what every downstream gate reads (the door search needs "gte 4"), so a
#   promotion is one write in one place.
#
# taser_held 0/1 — she is carrying the thing she bought at the market. ⚠️ DELIBERATELY NOT A THIRD
#   equipped_weapon VALUE. equipped_weapon is the one-core-one-weapon axis (1 = drain, 2 = emitter) and
#   the whole design point of the taser is that it runs off NOTHING and therefore does not compete with
#   the drain — she can carry it to Bastien's with the drain live, which is exactly the choice the raid
#   scene turns on. Putting it on that axis would make it mutually exclusive with the drain and destroy
#   the beat. Shape copied from part_held: a carried-object bit, read with "gte 1".
[[traits.labels]]
key    = "wall_refusals"
hidden = true
[[traits.labels]]
key    = "bar_rung"
hidden = true
[[traits.labels]]
key    = "taser_held"
hidden = true
# taser_through 0/1 — beat_0101 (rev 152). Did the taser get PAST THE DOOR SEARCH tonight, as opposed to
# taser_held, which is only "she owns one". Bastien pats her down every single visit, so the two are
# genuinely different facts and the raid reads the second one. ⚠️ IT IS NEVER A BLOCKER: a failed search puts
# the taser on his desk and she gets it back on the way out, and cap_the_raid bands on this rather than
# gating on it, so a player who cannot reach stealth 30 still finishes the release — they just get one extra
# beat of her going for the desk first. A stealth roll that can strand a save is not a difficulty setting.
[[traits.labels]]
key    = "taser_through"
hidden = true
# ruin_depth 0-4 — beat_0110 (rev 160). How many times she has been through the burned back room.
# ⚠️ THIS EXISTS BECAUSE THE FIRST CUT BORROWED yard_depth AND THAT WAS A REAL BUG, not a tidiness issue.
# yard_depth is not a generic crawl counter: it is the BURNED YARD's own odometer (1_metadata, "how deep
# she's pushed, odometer 0->3"), and it is already sitting at 3 by the time The Face starts, because that
# crawl is mandatory Act-1 content — it produces crew_known, which gates the Underworld Hunt, which reaches
# Marsh, the grab, captivity, the salvage, the Archive and the Leash. So the ruin's first band (lt 2) could
# never render, and the very first sift took 3 -> 4 and landed on the TERMINAL band, handing over all nine
# sheets in one click. The release's only post-credits content collapsed to a single screen.
# The original header defended the reuse as "the same shape of thing". A counter is not a shape; it has a
# live value, and this one was full.
[[traits.labels]]
key    = "ruin_depth"
hidden = true

# ══════════════════════════════════════════════════════════════════
# THE LEDGER — the player cheat page ([ui.cheat_page])
# ══════════════════════════════════════════════════════════════════
# Sidebar page, free and never gated by a code. Which VARIANT ships is a BUILD
# argument, never a value in here — two builds come from this one commit:
#   free:  package_from_toml … --output games/vesper/output            (the default)
#   paid:  package_from_toml … --build paid --output games/vesper/output-paid
# The free build emits these rows as padlocked LABELS with no working effects and
# no hint text in the file; the paid build emits live rows with the hints.
#
# Register: flat and mechanical. The container carries the fiction ("The Ledger" —
# numbers she keeps for herself); the rows stay legible, because this page is read
# as a list of levers, not as prose.
#
# The five rows are DERIVED from Vesper's own gates (design_cheat_page.md §2), not
# chosen: each step is small enough that it cannot skip a band of authored content.
[ui.cheat_page]
title        = "The Ledger"
intro        = "She keeps her own numbers."
button_label = "Cheat"
button_icon  = "🔓"
locked_note  = "Supporters unlock these."

# COIN — the only near-essential row. Starts at 0, the underworld toll is 5 and is
# charged on EVERY entry, and all three coin faucets (brothel, pit, Marsh) sit behind
# that door. The salvage repair then wants 120 (12 sessions × 10). No gate reads coin,
# so there are no bands to break; clamp = false because a wallet is unbounded (the
# engine's 0-100 clamp would silently cap it at 100).
[[ui.cheat_page.grants]]
label       = "Coin"
trait       = "coin"
op          = "add"
value       = 25
clamp       = false
hint        = "five trips through the gate, or two salvage sessions"
button_text = "Coin +25"

# FIGHTING — the widest-reaching key in the game: 15 forces the underworld door, 30
# opens the hard pit bouts (+20 coin instead of +8), 40 clears yard guard 3. Step 5 =
# the smallest gap between its gates, so it can never jump one. Cap 40 = the last gate.
[[ui.cheat_page.grants]]
label       = "Fighting"
trait       = "fighting"
op          = "add"
value       = 5
cap         = 40
clamp       = true
hint        = "the door at 15 · hard bouts at 30 · the yard at 40"
at_cap_text = "As sharp as this will make her."

# STEALTH — capped at 9 ON PURPOSE, below guard 1's threshold of 10. The burned yard
# gates every NON-stealth route on `stealth lt N`, so raising stealth DELETES "take him
# down", "break and run", and the Tier-5 emitter scene at that guard. Only three guard
# encounters exist per save, so a stealth-40 player could never see the emitter scene.
# The yard teaches the rest; this row only opens the door to it.
[[ui.cheat_page.grants]]
label       = "Stealth"
trait       = "stealth"
op          = "add"
value       = 5
cap         = 9
clamp       = true
hint        = "enough to start the yard — the yard itself teaches the rest"
at_cap_text = "Any sharper and she stops needing the quiet routes."

# RENNER — the 8-day wall, and it is mandatory: his drain sets names_known, which gates
# the whole Underworld Hunt. Rungs give +2 each and cost 180 in-game minutes against a
# 540-minute window, so 3/day and ~24 clicks. His corruption gates sit at 0/10/20/30/
# 40/50, evenly spaced, so +10 lands exactly on each band and skips nothing.
# The hint says what 50 ACTUALLY buys — corruption alone opens nothing.
[[ui.cheat_page.grants]]
label       = "Renner"
targetType  = "npc"
npcId       = "npc_renner"
trait       = "corruption"
op          = "add"
value       = 10
cap         = 50
clamp       = true
hint        = "opens the anal pose in the office loop — in cover, carrying the charged drain. The rungs still have to be run."
button_text = "Renner +10"
at_cap_text = "He is as far gone as the rungs will take him."

# BASTIEN — THE FACE's one wall, added at beat_0109 (rev 159), same shape as the Renner row above.
# The ladder gates sit at relation 6 / 12 / 18, earned at +2 a shift on the floor and +3 on the counter and
# in the dress, so roughly seven shifts at 180 in-game minutes each — three or four evenings of clicking the
# same card. That is the chapter's only real grind and it is exactly what this page exists for.
# +6 lands ON each band rather than between them, so no rung is skipped and none is overshot into.
# CAP 18, because 18 is the last thing relation buys: the door search and the room are gated on bar_rung,
# which the promotion capstones set, and nothing in the game reads npc_bastien.relation above 18.
# ⚠️ THE HINT SAYS WHAT IT ACTUALLY BUYS. Relation alone opens nothing — the three promotions are auto-fires
# that still have to be met on the floor, in the bought face, and the hint says so rather than implying that
# a full meter walks her through the door.
[[ui.cheat_page.grants]]
label       = "Bastien"
targetType  = "npc"
npcId       = "npc_bastien"
trait       = "relation"
op          = "add"
value       = 6
cap         = 18
clamp       = true
hint        = "moves him one promotion nearer — the counter, then the dress, then the back room. You still have to be on the floor in the bought face for each one to land."
button_text = "Bastien +6"
at_cap_text = "He has decided everything about you that he is going to decide from a chair."

# CHARGE — a pool, so it is SET to full rather than incremented (the way the cradle
# does it). Free in normal play; this row exists because after the Archive beat every
# charge point seals, which is the one place the game can strand a player.
[[ui.cheat_page.grants]]
label       = "Charge"
trait       = "energy"
op          = "set"
value       = 100
cap         = 100
clamp       = true
hint        = "back to full — the cradle does this for free while the Spire is still open"
button_text = "Charge → full"
at_cap_text = "Already full."

# Build labels for the sidebar footer badge. TEXT ONLY — nothing here selects which
# build is active; that is `--build free|paid`.
[builds.free]
label = "Free Build"
[builds.paid]
label = "🎯 Beta Nut Build"
