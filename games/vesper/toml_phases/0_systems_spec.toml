# Phase 0/7 — 0_systems_spec.toml
# Vesper — system spec: project + time + sidebar HUD + dormant-trait hides + daily tick.
#
# Step 7 authoring, beat_0001 (the scaffold). Built from the blueprint (design_book.md
# '## Blueprint (Step 5)'). Systems per the World blueprint §5F:
#   HUD = Charge ONLY (Credits tracked internally, not surfaced) · Phone = Mission-1 briefing (minimal)
#   Clothing = WORN-STATE cover system (beat_0015 — the boss-issued Renner cover; see
#     design_book '## The cover / disguise system') · Customization = OFF.
# starting_canvas is the placeholder canvas_boot for the scaffold; beat_0002 repoints it
# to canvas_opening_office (the real cold open).

schema_version = "1.0"

[project]
id          = "vesper"
title       = "Vesper"
description = "An owned half-human weapon who feels nothing but the sex she's used for. Inside Vance Dynamics she's the company's slave; outside, under a false face, she slips into powerful men's lives and drains them while they think they're using her — sent to hunt a rogue called Cain."
quests_engine   = "v2"
starting_canvas = "canvas_opening_office"   # the cold open (Beat 1 — the office)

[time]
starting_hour = 20        # the opening opens in the evening (Beat 1 — Mercer's office)
starting_day  = "Monday"
starting_week = 1

# ─── Engine daily tick — reset the daily-cap cooldown flags ───────────────────
# Fires once at the start of each new game-day (the cradle recharge rolls the day).
# The corruption daily cap was REMOVED (LO's call) — the charged rungs are freely repeatable
# now, so renner_charged_today is no longer cleared here. renner_relation_today is left as a
# harmless no-op (it's blueprinted but never set anywhere — dead flag).
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "renner_relation_today", op = "unset" },
]

# ─── Clothing / wardrobe — the worn-state COVER system (beat_0015) ─────────────
# The disguise is a real garment now. The boss ISSUES the Mission-1 cover (granted un-worn at
# the morning briefing — see 2_one_shots) and she equips it at the rack (the wardrobe page the
# engine injects at wren_room). NO shop_location = no buying, no shop UI (the cover is provided;
# the disguise shop is a frontier sink). Customization stays OFF (independent of clothing).
[settings]
clothing_enabled  = true
wardrobe_location = "wren_room"

# ─── Sidebar items — the live HUD (Charge ONLY) ───────────────────────────────
# Credits is tracked internally (the depot economy uses `money`) but NOT surfaced in the
# sidebar — LO's call. To re-show it, add back a `money` trait_status_text block here.
[[sidebar_items]]
type  = "trait_status_text"
trait = "energy"
bands = [
  { min = 0,  max = 24,  text = "Charge: Critical", icon = "🪫" },
  { min = 25, max = 49,  text = "Charge: Low",      icon = "🔅" },
  { min = 50, max = 74,  text = "Charge: Steady",   icon = "🔆" },
  { min = 75, max = 100, text = "Charge: Full",     icon = "🔋" },
]

# ─── NPC panel — Renner's seduction progress (the per-target axis, made visible) ──
# The seduction CLIMB is npc_renner.corruption; surface it so the player can gauge how far
# the cold boss has cracked (toward the drain at 20) + where he is. Renner only — Mercer
# doesn't climb (no corruption, no panel). The 'next' row mirrors the Quests-page goal block.
[[sidebar_items]]
type   = "npc_panel"
npc_id = "npc_renner"
label  = "Renner"
rows   = ["corruption", "location", "next"]
corruption_max_value = 20
corruption_max_label = "Broken"

# ─── Trait labels ─────────────────────────────────────────────────────────────
# Rename energy -> "Charge"; hide every dormant/internal trait from player-facing dumps.
[[traits.labels]]
key   = "energy"
label = "Charge"

# Dormant engine always-ons. corruption is NOT hidden — it's the NPCs' LIVE seduction axis
# (Renner's corruption, shown in his npc_panel); the PLAYER's corruption stays dead at 0 (the
# inversion — visibly stuck at zero while his climbs). arousal/hygiene unused + hidden.
[[traits.labels]]
key    = "arousal"
hidden = true
[[traits.labels]]
key    = "hygiene"
hidden = true

# Sex-loop state — internal numeric machine, never shown (5 traits, blueprint Renner loop).
[[traits.labels]]
key    = "sex_stage"
hidden = true
[[traits.labels]]
key    = "loop_npc_pleasure"
hidden = true
[[traits.labels]]
key    = "sex_finisher_type"
hidden = true
[[traits.labels]]
key    = "anal_active"
hidden = true
[[traits.labels]]
key    = "sex_entry_origin"
hidden = true
