# Phase 0/7 — 0_systems_spec.toml
# Vesper — system spec: project + time + sidebar HUD + dormant-trait hides + daily tick.
#
# Step 7 authoring, beat_0001 (the scaffold). Built from the blueprint (design_book.md
# '## Blueprint (Step 5)'). Systems per the World blueprint §5F:
#   HUD = Charge ONLY (Credits tracked internally, not surfaced) · Phone = Mission-1 briefing (minimal)
#   Clothing = WORN-STATE cover system (beat_0015 — the boss-issued Renner cover; see
#     design_book '## The cover / disguise system') · Customization = OFF.
# starting_canvas is the placeholder canvas_boot for the scaffold; beat_0002 repoints it
# to canvas_opening_office (the real cold open).

schema_version = "1.0"

[project]
id          = "vesper"
title       = "Vesper"
description = "An owned half-human weapon who feels nothing but the sex she's used for. Inside Vance Dynamics she's the company's slave; outside, under a false face, she slips into powerful men's lives and drains them while they think they're using her — sent to hunt a rogue called Cain."
quests_engine   = "v2"
starting_canvas = "canvas_opening_office"   # the cold open (Beat 1 — the office)

[time]
starting_hour = 20        # the opening opens in the evening (Beat 1 — Mercer's office)
starting_day  = "Monday"
starting_week = 1

# ─── Theme — dark (Vesper's default look) + custom CSS ────────────────────────
# `mode = "dark"` is REQUIRED here: adding a [theme] block routes through the importer, whose
# mode default is "light" — without this the sidebar would flip light. Every other field is left
# at its default (identical to the no-block look). custom_css hides the "Vesper" story title +
# its separator from the sidebar top (the name is already on the age-gate page + browser tab; the
# sidebar now starts at the clock).
[theme]
mode       = "dark"
# Hide the WHOLE title header wrapper (#ui-bar #title = the story name + subtitle/author + separator):
# hiding only #story-title left the <header> wrapper occupying ~32px of blank space. Removing the
# wrapper reclaims it, so the sidebar content (clock → portrait → HUD) rides right up under the nav row.
custom_css = "#ui-bar #title { display: none !important; } #story-caption { margin-top: 0 !important; }"

# ─── Engine daily tick — reset the daily-cap cooldown flags ───────────────────
# Fires once at the start of each new game-day (the cradle recharge rolls the day).
# The corruption daily cap was REMOVED (LO's call) — the charged rungs are freely repeatable
# now, so renner_charged_today is no longer cleared here. renner_relation_today is left as a
# harmless no-op (it's blueprinted but never set anywhere — dead flag).
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "renner_relation_today", op = "unset" },
  # rev 61 — the Marsh scheme is WEEKLY. rue_met is set by hunt_marsh_scheme (Sunday daytime) and wiped on
  # every day-rollover, so it only survives the Sunday it was struck. Scheme + serve must happen the SAME
  # Sunday (sleeping in between lapses it); an undrained week means re-scheming Rue next Sunday. Once Marsh
  # is drained, crew_known (permanent) carries hunt_marsh_sunday instead, so this wipe is harmless after.
  { targetType = "player", flag = "rue_met", op = "unset" },
]

# ─── Clothing / wardrobe — the worn-state COVER system (beat_0015) ─────────────
# The disguise is a real garment now. The boss ISSUES the Mission-1 cover (granted un-worn at
# the morning briefing — see 2_one_shots) and she equips it at the rack (the wardrobe page the
# engine injects at wren_room). NO shop_location = no buying, no shop UI (the cover is provided;
# the disguise shop is a frontier sink). Customization stays OFF (independent of clothing).
[settings]
# Vesper is narrated in THIRD person — Wren is watched, not inhabited (the still-point /
# owned-weapon PC). Declared so the engine labels her own dialogue with her name instead of
# the default "You:", which read as a contradiction over prose that says "she".
# Register doctrine: .claude/skills/author-game/references/rts-flat-prose.md Rule 1.
narration_person  = "third"
clothing_enabled  = true
wardrobe_location = "wren_room"

# ─── Player portrait — the state-reactive sidebar face (opt-in engine feature) ─
# Wren's face, in the sidebar just below the time display (above the Charge/Condition HUD) — the reactive
# extension of the static $player.portrait (which only shows on the Stats page). Paths relative
# to videos/. Corruption is DEAD here (player frozen at 0 — the inversion) and there's no
# pregnancy trait, so those two resolver axes don't apply. What's live:
#   • THE TWO FACES — default = her asset-self (company grays); the dock-work COVER swaps it via
#     the worn_type outfit rule below (the two dress items carry type tags, 1_metadata). SFW, Gemini.
#   • UNDRESS (equipped-based, the wardrobe rack — the ONLY undress trigger) — the overrides fire the
#     instant she's actually stripped: unequip at the rack and getUndressLevel() (v2.py:1454) returns the
#     state -> the matching image. An area is bare only when NOTHING covers it (bra covers the top, briefs
#     the bottom): dress off + bra&briefs on = `underwear`; take the BRA off too = `topless`; take the
#     BRIEFS off instead = `bottomless`; everything off = `naked`. All four reachable from her
#     dress+bra+briefs wardrobe — no split top/bottom garments needed.
# The portrait is CLOTHING-ONLY (LO's call): the sex loops do NOT undress it — during a scene she reads
# as whatever she's wearing (the cover on a mission, grays inside). There is no pp_naked flag anymore.
[player_portrait]
enabled          = true
default_image    = "portraits/wren_grays.jpg"      # asset-self face (company grays)
# equipped-based undress overrides — fire when a slot is actually cleared (the wardrobe rack)
naked_image      = "portraits/wren_naked.jpg"
topless_image    = "portraits/wren_topless.jpg"
bottomless_image = "portraits/wren_bottomless.jpg"
underwear_image  = "portraits/wren_underwear.jpg"

# THE TWO FACES — in the dock-work cover, show the cover face (dominant dress type = "cover");
# otherwise she falls through to default_image (the company-grays asset-self face).
[[player_portrait.outfits]]
image = "portraits/wren_cover.jpg"
when  = { worn_type = "cover" }

# ─── Sidebar items — the live HUD (Charge ONLY) ───────────────────────────────
# Credits is tracked internally (the depot economy uses `money`) but NOT surfaced in the
# sidebar — LO's call. To re-show it, add back a `money` trait_status_text block here.
[[sidebar_items]]
type  = "trait_status_text"
trait = "energy"
bands = [
  { min = 0,  max = 24,  text = "Charge: Critical", icon = "🪫" },
  { min = 25, max = 49,  text = "Charge: Low",      icon = "🔅" },
  { min = 50, max = 74,  text = "Charge: Steady",   icon = "🔆" },
  { min = 75, max = 100, text = "Charge: Full",     icon = "🔋" },
]

# ─── Condition (hygiene) — cleanup after sex. Drops with sex, restored by a Wash. Below 40 = Filthy,
# which blocks going out in cover (gate on activity_travel_to_reach). Revived from the dormant trait. ───
[[sidebar_items]]
type  = "trait_status_text"
trait = "hygiene"
bands = [
  { min = 0,  max = 39,  text = "Condition: Filthy", icon = "🩸" },
  { min = 40, max = 74,  text = "Condition: Used",   icon = "💧" },
  { min = 75, max = 100, text = "Condition: Clean",  icon = "✨" },
]

# ─── Core strain (captivity) — the overload read-out. beat_0035. ──────────────
# Sex CHARGES her; in the cell Bastien has stripped the drain, so the input has nowhere to go and the
# core cooks. She has NO agency to spend against this meter — what she has is a dial she can watch go
# wrong, and that dial is the horror of the room. So it is VISIBLE, not hidden.
#
# TWO band rules, both load-bearing (v2.py:15500-15520):
#   1. Bands start at min=1. The renderer emits NOTHING when no band matches, so at core_strain=0 the row
#      is ABSENT — invisible for the entire game before captivity, appearing the instant she is first used
#      (and it would vanish again if the fault were ever cured). Zero engine work.
#   2. The TOP band carries NO `max`. An unset max defaults to 1e9 (v2.py:15508), so the frozen end-state
#      (96) still matches. A closed 72-95 band would make "Core: Failing" VANISH at exactly the moment the
#      design promises it becomes permanent — the row IS the promise the repair chunk pays.
#
# Edges are set so each band names the shelf that comes NEXT (+12 per use): at "Core: Nominal" (12) the
# next scene is still Nominal; at "Core: Hot" (24) the crew comes in. The read-out is a countdown.
[[sidebar_items]]
type  = "trait_status_text"
trait = "core_strain"
bands = [
  { min = 1,  max = 23, text = "Core: Nominal",  icon = "○" },
  { min = 24, max = 47, text = "Core: Hot",      icon = "◔" },
  { min = 48, max = 71, text = "Core: Faulting", icon = "◑" },
  { min = 72,           text = "Core: Failing",  icon = "◕" },   # NO max — survives the frozen 96
]

# ─── Core: Locked (SALVAGE) — the sealed-partition fault, post-repair. beat_0046. ─────────────
# At the verdict Kess relieves the acute overload (core_strain -> 0), so the "Core: Failing" row above
# VANISHES (the renderer emits nothing when no band matches), and THIS row lights in its place: the permanent
# fault she cannot open — the standing promise only the Site pays. Driven by core_sealed (0 until the verdict
# sets it 1); band from min=1 so the row is ABSENT the whole game until repair lights it. Honors
# "no cure shipped": function restored, the true fault Locked. Additive — core_strain's bands are untouched.
[[sidebar_items]]
type  = "trait_status_text"
trait = "core_sealed"
bands = [
  { min = 1, text = "Core: Locked", icon = "🔒" },
]

# ─── NPC panel — REMOVED per LO (2026-07-01) ──────────────────────────────────
# The Renner sidebar npc_panel (corruption / location / quest-goal rows) was removed — early
# game it read as uninformative clutter ("Corruption 0 / Location Away"). Renner's seduction
# progress now lives on the Quests page only (fed by the quest_cards in 5_scenes.toml). To
# restore it, re-add an npc_panel sidebar_item with npc_id = "npc_renner".

# ─── Fighting / Stealth / Coin — surfaced in the auto Traits list, NOT as HUD bars (LO's call) ───
# These three are declared player core_traits (1_metadata) and stay UN-hidden below, so the
# <<playerTraits>> "Traits" dump lists them as raw key + number (fighting/stealth/coin). No bars, no
# word-bands — the trait_bar blocks were removed. The Burned-Yard crawl / Pit / gate toll still read them.

# ─── Trait labels ─────────────────────────────────────────────────────────────
# Rename energy -> "Charge"; hide every dormant/internal trait from player-facing dumps.
[[traits.labels]]
key   = "energy"
label = "Charge"

# Dormant engine always-ons. corruption is NOT hidden — it's the NPCs' LIVE seduction axis
# (Renner's corruption, surfaced on the Quests page); the PLAYER's corruption stays dead at 0 (the
# inversion — visibly stuck at zero while his climbs). arousal/hygiene unused + hidden.
[[traits.labels]]
key    = "arousal"
hidden = true
[[traits.labels]]
key    = "hygiene"
label  = "Condition"

# Sex-loop state — internal numeric machine, never shown (5 traits, blueprint Renner loop).
[[traits.labels]]
key    = "sex_stage"
hidden = true
[[traits.labels]]
key    = "loop_npc_pleasure"
hidden = true
[[traits.labels]]
key    = "sex_finisher_type"
hidden = true
[[traits.labels]]
key    = "anal_active"
hidden = true
[[traits.labels]]
key    = "sex_entry_origin"
hidden = true

# fighting/stealth/coin are NO LONGER hidden — they now surface in the auto Traits list (bars removed).
# yard_depth/weapon_repair stay hidden — internal crawl state, never player-facing.
[[traits.labels]]
key    = "yard_depth"
hidden = true
[[traits.labels]]
key    = "weapon_repair"
hidden = true
# Weapon charges — internal; the fire choices' locked_text / hide-when-empty communicate the state.
[[traits.labels]]
key    = "drain_charge"
hidden = true
[[traits.labels]]
key    = "arousal_charge"
hidden = true
# Weapon loadout — internal. equipped_weapon = which weapon she's carrying (1 = drain, 2 = emitter).
# One at a time (one core feeds one weapon); the swap activity + the fire gates communicate the state.
[[traits.labels]]
key    = "equipped_weapon"
hidden = true
# Drain counter — internal. +1 on each Renner drain (first + repeats). Gates the post-drain awakening
# (glitch_recurrence_ii) as a TRAIT so the validator doesn't demand a located flag-setter (the drain now
# fires inside the triggerless hub loop).
[[traits.labels]]
key    = "drains_done"
hidden = true
# Underworld Hunt gate marker — internal. Set=1 at the drain (both branches); gates the hunt. Never player-facing.
[[traits.labels]]
key    = "names_known"
hidden = true
# CAPTIVITY (beat_0035). Both hidden from the <<playerTraits>> dump. `hidden` is consulted ONLY by the
# dump widgets (v2.py:14870/14896/14917) — the trait_status_text renderer reads $player.core_traits
# directly and never checks it, so core_strain still draws its sidebar row. Verified, not assumed.
# core_strain: the overload meter — the player reads it as the banded row above, never as a raw number.
[[traits.labels]]
key    = "core_strain"
hidden = true
# cell_door: the sealed door's gate. Never set by anything. Pure internal machinery.
[[traits.labels]]
key    = "cell_door"
hidden = true
# SALVAGE (beat_0046) — both hidden from the <<playerTraits>> dump. Like core_strain, core_sealed still
# draws its sidebar row (the trait_status_text renderer ignores `hidden`). kess_debt is the owed-coin
# accumulator — named in the verdict prose, read by no gate this chunk (a deferred Act-2 seed).
[[traits.labels]]
key    = "core_sealed"
hidden = true
[[traits.labels]]
key    = "kess_debt"
hidden = true
