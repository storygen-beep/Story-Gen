# ── mercer_room — beat_0072 (rev 117). The room behind his own stall: Mercer's underworld address, and the
# ONLY place he is ever scheduled down here (see his second [[npcs.schedules]] row and its note).
# LOCKED-VISIBLE on mercer_found — the house pattern (docs_vault, crew_den). ⚠️ version = "1.0" or the lock
# FAILS OPEN: the evaluator returns true for any conditions{} missing it, and there is no build error.
# ⚠️ THE NAME AND THE BLOCKED MESSAGE MUST BE TRUE IN BOTH ERAS. The greyed card is on the market's nav grid
# from the moment the underworld opens in Act 1b — long before Mercer is blown, long before she finds him —
# and a location's display name can't change later without breaking the fiction twice. So it is "The Lockup":
# ordinary rented storage behind the stalls, scenery before the reveal, his after it. Nothing here names him,
# hints at him, or reads as a held door. (It also keeps clear of Colm's back room and Bastien's, beat_0082.)
# The badge leak the lock closes: locked_card renders image + name + reason and NO indicators block
# (v2.py:19270-19281) — so no NPC portrait badge can appear on this card while it is shut.
# An image is DECLARED because a location without one drops the whole nav grid to text mode (the docs_vault
# note). The file itself is unharvested until the beat_0085 media pass; the engine silent-skips it.
[[locations]]
id          = "mercer_room"
name        = "The Lockup"
description = "A rented room behind the market stalls — concrete, one bulb, a bed that came with the rent and a door that bolts from the inside. The kind of address a man takes when he has money and no name to put on a lease. Whatever he sells out front, he sleeps back here."
image       = "locations/mercer_room.jpg"
image_search_queries = ["bare concrete room single bulb empty wide", "windowless rented room mattress bare bulb"]
entry_from  = "underworld_market"
