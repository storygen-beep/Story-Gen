# ─── Locations — THE SPIRE (root: spire_plaza) ────────────────────────────────

[[locations]]
id               = "spire_plaza"
name             = "Spire Plaza"
description      = "The chrome public level at the foot of Vance Tower. Suits cross it without looking up. Cameras on every column. THE SPIRE — the corporate core, clean and lit and watched. The company car waits at the curb to run her down to the Reach."
image            = "locations/spire_plaza.jpg"
navigation_order = ["atrium"]
# Top-level street hub (NO entry_from) — the Spire's living surface + the travel anchor.

[[locations]]
id               = "atrium"
name             = "The Atrium"
description      = "The Tower's inner lobby. Polished stone, a security desk that knows her face, elevators that only stop where her clearance says they can. The threshold between the cage and the street."
image            = "locations/atrium.jpg"
entry_from       = "spire_plaza"
navigation_order = ["penthouse", "wren_floor"]

[[locations]]
id          = "penthouse"
name        = "Mercer's Penthouse"
description = "The top floor. Glass on three sides, the city laid out below like something he owns. This is where she's summoned, and where she serves."
image       = "locations/penthouse.jpg"
entry_from  = "atrium"

[[locations]]
id               = "wren_floor"
name             = "Wren's Floor"
description      = "The asset level — narrow corridors, numbered doors, no windows. Quiet the way a kept place is quiet."
image            = "locations/wren_floor.jpg"
entry_from       = "atrium"
navigation_order = ["wren_room"]

[[locations]]
id               = "wren_room"
name             = "Wren's Room"
description      = "Hers, in the way a tool's drawer is the tool's. A bed she rarely uses, a charging cradle in the corner, nothing on the walls. Clean, bare, company-issue."
image            = "locations/wren_room.jpg"
entry_from       = "wren_floor"
navigation_order = ["cradle"]

[[locations]]
id          = "cradle"
name        = "The Cradle"
description = "The charging cradle. She powers down here and wakes here — the reset, the start of every day. When something leaks through the quiet, it leaks here."
image       = "locations/cradle.jpg"
entry_from  = "wren_room"

# ─── Locations — THE REACH (root: the_waterfront) ─────────────────────────────

[[locations]]
id               = "the_waterfront"
name             = "The Waterfront"
description      = "The docks strip — wet concrete, sodium lights, smuggler traffic that nobody logs. THE REACH — the city's underside, grit and salt and the parts the Spire pretends it doesn't use. The car back up to the Spire waits at the curb."
image            = "locations/the_waterfront.jpg"
navigation_order = ["the_anchor", "renner_depot", "facility_ruins", "renner_burned_yard", "underworld_gate"]
# Top-level street hub (NO entry_from) — the Reach's living surface + the travel anchor.

[[locations]]
id          = "the_anchor"
name        = "The Anchor"
description = "A dive bar two streets off the water. Dark wood, dead neon, a bartender who's seen everyone's worst night. Renner drowns his here, evenings, every evening."
image       = "locations/the_anchor.jpg"
entry_from  = "the_waterfront"

[[locations]]
id          = "renner_depot"
name        = "Renner's Depot"
description = "A gutted equipment yard — half-empty racks, crates Cain's people didn't bother to take, a forklift nobody's fixed. He's trying to rebuild it on cheap hands and credit he doesn't have. The work floor's out front; his office is the glassed-in box in back, and you don't go in there until he wants you to."
image       = "locations/renner_depot.jpg"
entry_from  = "the_waterfront"
# Office FOLDED here (Fork A) — a register-shift on the depot hub gated renner_office_open,
# NOT a separate navigable room.

[[locations]]
id          = "facility_ruins"
name        = "The Facility"
description = "What's left of the Vance asset-facility Cain burned to the ground — scorched frame, melted server racks, the smell of old smoke that never washed out. The first dread-place. Something in the wreckage is going to look like it belongs to her."
image       = "locations/facility_ruins.jpg"
entry_from  = "the_waterfront"

# ── the_site — LOCKED frontier card (the chip / Phase-1 end) ──────────────────
# Telegraphed locked-visible (renders greyed with blocked_message inline). Gated on a flag
# that is NEVER set in this chunk (it needs all three missions' leads). version="1.0" or
# the lock fails OPEN.
[[locations]]
id          = "the_site"
name        = "The Site"
description = "Somewhere out past the container stacks — the place Cain just walked away from. She doesn't have it yet."
image       = "locations/the_site.jpg"
# RE-PARENTED: the deep end of the underworld now (where Cain is), not a Waterfront card. Still locked
# on the_site_open (never set this chunk) — the frontier far end, reached THROUGH the underworld strip.
entry_from  = "underworld_strip"
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "the_site_open", operator = "is_true" },
] }
blocked_message = "Past the strip the city goes dark and deep, and that's where he is. The way down isn't open to her yet."

# ── renner_burned_yard — the Trail crawl site (Cain's REVENGE burning, NOT the Facility) ──────
# A second burned site: Renner's own yard, torched by Cain in revenge for the families Renner killed.
# His MEN guard the wreck (he's salvaging gear / burying evidence) — so she sneaks past Renner's guards
# (narrative, NOT declared NPCs; the encounter resolves on her fighting/stealth). Locked until she has
# reason to be there (renner_hired = she's in his orbit; cap_renner_hired sets it). version="1.0" or the
# lock fails open. The depth-crawl + finds + the broken arousal weapon live here (3_activities).
[[locations]]
id          = "renner_burned_yard"
name        = "The Burned Yard"
description = "Renner's old yard, three streets past the depot — what Cain left of it. Torched to the slab, fence down, but his men still walk it with lights, turning back anyone who comes to pick the bones. Whatever he's keeping out here, he keeps it watched."
image       = "locations/renner_burned_yard.jpg"
image_search_queries = ["burned yard night flashlight guard", "torched warehouse lot dark security"]
entry_from  = "the_waterfront"
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "renner_hired", operator = "is_true" },
] }
blocked_message = "You've no reason to be out at his burned yard — not yet. Get inside his world first."

# ── THE UNDERWORLD — the dark city the hunt points to (her second life) ────────────────────────
# Always available (gated only opening_done). The gate is cleared EVERY visit (pay coin / fight / weapon —
# NO stealth); the strip is reached ONLY via the gate canvas (so the guard can't be bypassed). Inside: a
# coin economy (brothel + pit earn; gate toll + black market spend). Deep end = the_site (re-parented above,
# locked). Guards/bartender/don = narrative or deferred; NO NPCs declared here.
[[locations]]
id          = "underworld_gate"
name        = "The Underworld Gate"
description = "A freight door under the docks that isn't on any manifest, and a man in front of it who is. Past him the city goes down instead of up — the part of the Reach the Spire pretends doesn't exist. He doesn't move for free."
image       = "locations/underworld_gate.jpg"
image_search_queries = ["bouncer unmarked door night", "guard freight door dark dockside"]
entry_from  = "the_waterfront"
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

# The strip — the underworld hub. ROOT location (no entry_from): reached ONLY via the gate canvas's exit,
# so the guard is unavoidable. Its own children are the brothel/pit/market + the locked deep end (the_site).
[[locations]]
id               = "underworld_strip"
name             = "The Underground"
description      = "Down past the gate the city turns inside out — wet brick, red light, stalls selling what the Spire outlaws and bodies selling what it pretends to. Nobody here knows what she is, and nobody here owns her. For the length of a visit she's just another face with coin to make. The way back up is the gate."
image            = "locations/underworld_strip.jpg"
image_search_queries = ["underground night market red light crowd", "cyberpunk black market alley neon"]
navigation_order = ["underworld_brothel", "underworld_pit", "underworld_market", "the_site"]

[[locations]]
id          = "underworld_brothel"
name        = "The House"
description = "A working house off the strip — rooms by the hour, a madam who counts heads and coin. They'll take her on a shift; down here the thing the company uses her for is just a trade, and the coin is hers."
image       = "locations/underworld_brothel.jpg"
image_search_queries = ["brothel interior red light hallway", "old bordello parlor dim velvet"]
entry_from  = "underworld_strip"

[[locations]]
id          = "underworld_pit"
name        = "The Pit"
description = "A sunken ring under a warehouse, a crowd around it laying bets. They'll match her against whoever's standing. Win and the purse is coin; lose and you crawl out. Down here her fists earn the same as her body."
image       = "locations/underworld_pit.jpg"
image_search_queries = ["underground fight pit crowd betting", "sunken fighting ring warehouse spectators"]
entry_from  = "underworld_strip"

[[locations]]
id          = "underworld_market"
name        = "The Black Market"
description = "Stalls and back-rooms where coin buys what's off every shelf above — weapons, gear, and people, penned at the far end like the rest of the stock. She knows the look of the merchandise better than she'd like."
image       = "locations/underworld_market.jpg"
image_search_queries = ["black market weapons stall dim", "underground arms bazaar cages back"]
entry_from  = "underworld_strip"
