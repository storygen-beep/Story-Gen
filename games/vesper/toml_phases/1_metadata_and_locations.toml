[[locations]]
id          = "underworld_bar_bathroom"
name        = "The Bathroom"
description = "One cubicle, one cracked basin and a bolt that turns. It smells of the bar and of the cheap pink soap somebody refills without being asked. There is a hook on the back of the door, which is the whole of what the Undertow provides its staff."
image       = "locations/underworld_bar_bathroom.jpg"
