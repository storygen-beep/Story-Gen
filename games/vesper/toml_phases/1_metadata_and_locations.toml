name        = "Kess"
description = "An off-books ship-breaker in the Reach — cuts decommissioned machines down for parts and does quiet illegal repair on the side. Reads a body the way he reads a hull: what it's made of, what's failing, what it costs to hold. Won't touch company work (company work touches back) — until a frame he can't put a book to walks in and he can't help himself. Wants coin, and the problem nobody else can solve."
portrait    = "kess.jpg"
core_traits = { relation = 0 }
flag_keys   = []
arc_stages  = ["The fixer"]

