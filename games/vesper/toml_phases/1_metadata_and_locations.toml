# ── Kess — the off-books fixer (Salvage v2) — beat_0049. MALE. ────────────────────
# The dockside synth-mechanic / ship-breaker who repairs Wren's core. Reads bodies as HARDWARE, not people.
# NOT a conquest (no relation/corruption climb, no meters).
# SCHEDULE (rev 67 — REVERSES the old "NO [[npcs.schedules]]" call): he now keeps yard hours, 10:00-22:00.
# The old call left him schedule-less to keep him off the Schedule page — but it cost him his PORTRAIT: the
# engine hard-refuses a clickable portrait to any NPC without a declared schedule (v2.py "Schedule-only
# presence gate", `if (!npcSched || npcSched.length === 0) return false;` — no canvas-derived fallback), so he
# rendered as a bare text link while every other NPC got a card. The fiction always said the yard had hours —
# his FIRST line is "Yard's shut. Turn around." — so hours are characterisation, not a workaround for a picture.
# ⚠️ The Schedule-page leak the old comment feared is REAL — and it is PRE-EXISTING AND UNIVERSAL, which is
# why we accept it. getNpcsWithSchedules runs a canvas scan gated on _isCanvasAvailable, but then a SECOND
# loop adds every NPC in the declared setup.npcSchedules registry "regardless of whether any of its canvases
# are unlocked yet" — the canvas scan is only a back-compat fallback for games declaring no schedules. So on a
# FRESH Vesper the page already lists Mercer/Renner/Sol/Rue/Marsh — including Sol/Rue/Marsh, who live past a
# gate she cannot open yet. Kess was the ONLY cast member exempted, and the exemption cost him his portrait.
# He is now consistent with his peers. The reveal that MUST stay hidden (Bastien) still is — he has no
# schedule, which is the actual mechanism Vesper uses to hide a reveal, and it is untouched.
# One entry, no midnight wrap (Rue needs two). Kess is the LAST [[npcs]] declared, so this schedule cannot
# orphan onto another NPC. Off-hours -> berth_offhours guards the dead room (5_scenes).
# Dialog speaker (npcId=npc_kess) renders "Kess:"; he's "Stranger:" (speaker=unknown) in his intro until he
# names himself (Step-6 G10). Recurs as the leash-reader (Act-2 seed; kess_debt retired, v2 §10). Like npc_bastien.
