# she comes back here after the 1a close for the on-ramp, and this room is her home for the whole of 1b).
# NO seal; Kess DOES carry a schedule (kess_berth 10:00-22:00, added rev 67 so his portrait renders). Name is BARE
# ("The Berth") so the nav card doesn't spoil Kess before she names herself. version="1.0" or the lock fails OPEN.
[[locations]]
id          = "kess_berth"
name        = "The Berth"
description = "A flooded breaking-dock cut in under the docks, off the strip — a stripped hull up on the blocks in black water, cutting-gear and parts bins and a work-cradle rigged for something bigger than a person. Whoever works down here takes machines apart for a living — and, for the right coin, puts them back."
image       = "locations/kess_berth.jpg"
image_search_queries = ["flooded ship breaking dock underground night", "gutted hull workshop cutting torch dark"]
entry_from  = "underworld_strip"
# rev 113 (beat_0068) — DROPPED the `salvage_done is_false` clause again (as rev 96 had it, before rev 97 shelved
# 1b). It made the berth a one-time salvage window that locked the instant the verdict fired; post-1a-close she
# comes BACK to Kess (the on-ramp: hand off docs + controller, rent the cot), so the berth must reopen. Gating on
# salvage_entered alone keeps it open across the salvage grind AND after. The salvage auto-fires keep their own
# salvage_done/repair_session guards so nothing re-fires; the only delta is post-verdict reachability, which is
# the point. ⚠️ THIS IS THE LOAD-BEARING HALF OF RETURNING-PLAYER RECOVERY: every post-1a save has salvage_done
# set (salvage_verdict exit), so without this the handoff is unreachable for exactly the cohort it rescues.
# It OPENS a shut door — it cannot strand anyone. ⚠️ entry_conditions are at ZERO validation sites: the build
# will not check this. Verify live. version="1.0" or the lock fails OPEN.
entry_conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "salvage_entered", operator = "is_true" },
] }
blocked_message = "A breaking-dock off the strip, chained and dark. Whoever strips ships down here doesn't take walk-ins."

# ── THE UNDERWORLD — the dark city the hunt points to (her second life) ────────────────────────
# Always available (gated only opening_done). The gate is cleared EVERY visit (pay coin / fight / weapon —
# NO stealth); the strip is reached ONLY via the gate canvas (so the guard can't be bypassed). Inside: a
# coin economy (brothel + pit earn; gate toll + black market spend). Deep end = the_site (re-parented above,
# locked). Guards/bartender/don = narrative or deferred; NO NPCs declared here.
[[locations]]
id          = "underworld_gate"
name        = "The Underworld Gate"
description = "A freight door under the docks that isn't on any manifest, and a man in front of it who is. Past him the city goes down instead of up — the part of the Reach the Spire pretends doesn't exist. He doesn't move for free."
image       = "locations/underworld_gate.jpg"
image_search_queries = ["bouncer unmarked door night", "guard freight door dark dockside"]
# rev 60: reached via the travel car (activity_travel_to_reach / activity_travel_to_spire drop you here).
# rev 67 — THE GATE IS A TRANSIT STOP (auto_exit=false). She arrives by CANVAS (the car) and leaves by CANVAS
# (the car up / the guard down); the gate sits in no location tree, and it is the ONLY location in the game
# with ZERO children (spire<-1, waterfront<-5, strip<-7, gate<-0). The engine assumes every location is a
# root-with-children or a child-with-a-parent, so a nav-less gate used to trip the list-every-location
# fallback — which is the ONLY reason entry_from was ever bolted on here, and "Leave The Underworld Gate" was
# its exhaust. auto_exit=false is the engine finally having a word for this shape: no auto Leave link, and an
# empty nav list understood as intentional. Result: the man at the door (down) + Take the car (up). Nothing else.
# rev 67b — parent + entry_from BOTH REMOVED. The earlier rev-67 note here said to KEEP parent because the
# gate INHERITED the waterfront's "Take the car" — that was wrong on inspection: inheritance copies an
# ancestor's canvas VERBATIM (v2.py walks the parent chain), so the gate got the waterfront's MENU, which
# offered "Down under the docks — the Underworld" while she stands IN the underworld and could not offer the
# Reach. There is no per-canvas opt-out and no player-location condition (only npc_at_location), so a shared
# menu cannot adapt. The gate now owns activity_travel_from_gate (3_activities) — Spire or the Reach — so
# parent buys nothing and costs three leaks: captivity_recovery / salvage_body_wont_hold / salvage_relaunch
# are one-shots scoped "@the_waterfront" and were inheriting down here too. entry_from goes with it (already
# inert under auto_exit, and the gate has no entry_conditions for the passage guard to need a go-back target).
# She still CANNOT walk in: with no entry_from the gate is nobody's child, so it never lands on the
# waterfront's nav grid. auto_exit=false is what keeps the now-genuinely-nav-less gate from tripping the
# list-every-location fallback — it is doing the whole job now, not half of it.
auto_exit   = false

# The strip — the underworld hub. ROOT location (no entry_from): reached ONLY via the gate canvas's exit,
# so the guard is unavoidable. Its own children are the brothel/pit/market + the locked deep end (the_site).
[[locations]]
id               = "underworld_strip"
name             = "The Underground"
description      = "Down past the gate the city turns inside out — wet brick, red light, stalls selling what the Spire outlaws and bodies selling what it pretends to. Nobody here knows what she is, and nobody here owns her. For the length of a visit she's just another face with coin to make. The way back up is the gate."
image            = "locations/underworld_strip.jpg"
image_search_queries = ["underground night market red light crowd", "cyberpunk black market alley neon"]
navigation_order = ["underworld_bar", "underworld_brothel", "underworld_pit", "underworld_market", "kess_berth", "crew_den", "the_site"]

