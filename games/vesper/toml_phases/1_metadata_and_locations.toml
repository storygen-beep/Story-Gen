# Phase 1/7 — 1_metadata_and_locations.toml
# Vesper — player (Wren) + Mercer & Renner (schedules) + the chunk map.
#
# IMPORTANT: All [[npcs]] + schedules + core_traits live in THIS one file (TOML scoping).
#
# MAP = the late_shifts NON-CONTAINER pattern (the shipped, proven shape): two parallel
# top-level street hubs (spire_plaza / the_waterfront, NO entry_from), each nesting its
# venues via entry_from + navigation_order. NO is_container wrappers — they cause the nav
# double-print the audit caught AND swallow attached canvases. The two hubs are bridged by
# the travel activities (3_activities). This SUPERSEDES the World-blueprint 'default_entry
# on containers' note (engine-forced refinement — see ledger turn 22).
#
# CHUNK locations (11): SPIRE (spire_plaza · atrium · penthouse · wren_floor · wren_room ·
# cradle) + REACH (the_waterfront · the_anchor · renner_depot[+folded office register] ·
# facility_ruins · the_site[LOCKED frontier card]). Office is FOLDED into renner_depot
# (Fork A) — NO separate renner_office node.

# ─── Player ───────────────────────────────────────────────────────────────────

[player]
id          = "player"
name        = "Wren"
description = "A Vance Dynamics asset. She serves the company and the man who owns her, and she's good at it. The only thing she feels is the sex she's used for — everything else is quiet. She believes that's all she's ever been."
portrait    = "wren.jpg"
customizable = false   # fixed identity — protects the Wren / buried-Vesper reveal

[player.core_traits]
# LIVE meters (surfaced): energy = Charge, money = Credits.
energy     = 100      # "Charge" — spent on actions/travel, restored at the cradle
money      = 50       # "Credits" — deliberately light (a kept asset is provided for)
# CAPABILITY (Tier-3 custom) — she drills these in secret (activity_train, 3_activities). The want:
# stop being helpless / get where she can't yet. NOT yet surfaced as sidebar bars: held until the
# Facility guard READS them (the dead-meter rule — bars + reader land together, next piece).
# fighting = win a guard fight; stealth = slip past / go deeper.
fighting   = 0
stealth    = 0
# BURNED-YARD crawl state (internal, hidden): yard_depth = how deep she's pushed (odometer 0->3,
# gates the finds); weapon_repair = sessions spent fixing the found arousal weapon (0->3 -> ready).
yard_depth    = 0
weapon_repair = 0
# UNDERWORLD currency — her own money, the company can't see. Earned (brothel/pit), spent (gate toll +
# black market). Surfaced as a counter (0_systems). The "second life" — no leash on what's hers.
coin          = 0
# WEAPON LOADOUT + CHARGES (internal, hidden). equipped_weapon = which weapon she's carrying: 1 = drain,
# 2 = emitter — ONE at a time (one core feeds one weapon; swap at the bench in wren_room). Starts on the
# drain (her only weapon until the emitter is found in the burned yard + repaired). Each weapon holds shots;
# firing spends; reloaded at the cradle via the two dedicated Recharge actions (NOT Power down / Charge up).
# drain_charge = the truth-drain (1 shot). arousal_charge = the emitter (3 shots; starts 0, set to 3 when
# the weapon is repaired). Separate from hygiene (the body) — these are the gear.
equipped_weapon = 1
drain_charge   = 1
arousal_charge = 0
# DORMANT engine always-ons (hidden via 0_systems). corruption left DEAD (her axis = the
# awakening, not a meter). arousal/hygiene unused.
corruption = 0
arousal    = 0
hygiene    = 100
# Sex-loop state (NUMERIC, hidden) — shared machine; reset to 0 on loop entry + finisher exit.
# sex_finisher_type: 0=facial · 1=inside(vaginal) · 2=ass(anal=the drain) · 3=body.
sex_stage         = 0
loop_npc_pleasure = 0
sex_finisher_type = 0
anal_active       = 0
sex_entry_origin  = 0
# Renner drain counter (hidden). +1 each drain (first + repeats); gates the post-drain awakening.
drains_done       = 0
# UNDERWORLD HUNT gate marker (hidden). Set=1 at the Renner drain (BOTH branches); gates the whole hunt
# (the Sol lead reads names_known>=1). A TRAIT not a flag: the drain setter (loop_renner_finisher) is
# triggerless, so a triggerless is_true FLAG would hard-fail the flag-chain validator; a gte trait is exempt.
names_known       = 0
# CAPTIVITY — the overload meter (beat_0035). Sex CHARGES her; Bastien strips the drain, so the input has
# nowhere to go and the core cooks. +12 per use (clamp=true bounds it 0-100), 8 uses -> 96 -> the break,
# where it FREEZES. Hidden from the traits dump; surfaced ONLY as the banded sidebar row (0_systems_spec).
# The bands select which shelf of use-scenes may fire, so escalation stays monotonic however the dice fall.
core_strain       = 0
# CAPTIVITY — the sealed door's gate (beat_0035). NOTHING EVER SETS THIS. captive_door's entry_conditions
# require `cell_door gte 1`, so the door is permanently locked: it exists to be looked at, and to keep the
# room's nav non-empty (an empty nav makes the generator render the WHOLE MAP as clickable cards).
# A TRAIT not a flag — a flag `is_true` gate demands a located setter or the flag-chain validator hard-fails.
cell_door         = 0
# SALVAGE — the sealed-partition fault (beat_0046). 0 until the repair verdict flips it to 1. Drives the
# "Core: Locked" sidebar row (0_systems_spec): it appears the instant repair lights it — the standing promise
# only the Site can pay. A TRAIT (not a flag) — the verdict setter needs no located flag-chain, same reason
# as core_strain. Hidden from the dump.
core_sealed       = 0
# SALVAGE — the coin Kess is owed (beat_0046). Accrues per repair stage (untraceable coin, NEVER company
# Credits); she walks out OWING the balance — the broke->rich seed. Read by NO gate this chunk (a deferred
# Act-2 seed with a named address: Kess collects when the berth re-opens). Named in the verdict prose.
kess_debt         = 0
# SALVAGE v2 (rework) — the repeatable repair-grind (design_salvage_v2.md). repair_armed: 0/1, set 1 by the
# "Start a repair session" hub (which costs 10 coin), consumed (set 0) by the band scene's exit. repair_session:
# the session counter, +1 per scene = master progress — 12 sessions carry core_strain 96->0 (-8 each); the
# verdict fires at repair_session gte 12. Both hidden. (kess_debt above is RETIRED as a mechanic in v2 — key
# kept for save-safety, but nothing feeds it; the repair is coin-cost-per-session, not debt-accrual.)
repair_armed      = 0
repair_session    = 0
# THE ARCHIVE 1a (beat_0056) — the Calloway drain counter (hidden). +1 on the FIRST anal-finish drain (0->1); ONE
# drain (the second was removed rev 83). A TRAIT (gte-read), NOT a flag — the drain setter is triggerless, so a
# flag would hard-fail the flag-chain validator; a gte trait is exempt. The first drain = her power + THE WHERE
# (he gives up the deep vault in docs). calloway_drains_done gte 1 GATES cap_docs_first_look (rev 84) — the drain
# is the ONLY road to the where (Wren still sees the WALL herself at docs). Also picks the drain branch (d0/done).
calloway_drains_done = 0
# THE ARCHIVE 1a (beat_0066) — the Colm drain counter (hidden). rev 98: Colm's on-ramp now gates on
# npc_colm.RELATION (drinks/talks/kisses bump it in hub_colm_undertow; kiss unlocks at relation>=12, the back room
# at relation>=24), so the old colm_drinks/colm_kisses ladder counters are RETIRED. colm_drains_done: +1 on the
# FIRST ASS-FINISH drain, bumped on loop_colm_finisher's ass-finish choice (0->1; picks the drain branch d0/done).
# A TRAIT not a flag (gte-read, validator-exempt) — the drain setter is on the triggerless finisher, where an
# is_true flag would hard-fail the flag-chain validator (same reason as names_known above). rev 92: colm_drains_done
# gte 1 REPLACED the retired vane_confirmed flag at all 5 of its gates.
colm_drains_done  = 0
# THE ARCHIVE 1a (beat_0058, v2) — the case-work counter (hidden). +1 per "Work the case" session (the .work hub
# feeder only, NOT "Talk to him"); its bands fire the staged case-reveals (cap_case_insider >=2, cap_case_curated
# >=4, cap_case_pipe >=6). A TRAIT (gte-read) — the detective legwork that surfaces the leak's shape, distinct
# from relation (trust/access).
case_progress = 0
# THE ARCHIVE 1a (division build-out) — the docs vault gate (hidden, NEVER SET). docs_vault's entry_conditions
# require vault_cleared gte 1; nothing sets it, so the vault is permanently locked-visible — she sees it, never
# enters (Vane retrieves). A TRAIT not a flag (a flag is_true gate needs a located setter).
vault_cleared = 0
# SALVAGE emitter recovery — emitter_broken: 0=works (default; pre-captivity yard/gate use), set 1 at the
# captivity release (core dead -> the emitter draws off the SAME core, so it's dead too), set 0 at repair
# session 12 (core restored). The 4 emitter fire gates AND `emitter_broken lt 1`. Default 0 = save-safe
# (missing/0 both read "not broken", so shipped saves keep a working emitter — no regression).
emitter_broken    = 0
# THE LEASH (beat_0069) — the feed-line upkeep. She pays Kess PER NIGHT (his own terms, 5_scenes kess_1b_open:
# "You pay per night, in coin... Coin dries up, so does the arrangement"), and a paid night buys not just the
# bed but THREE DAYS of his time on the key. Set to a literal 3 by activity_kess_cot's paid tier; decremented
# 1 per day rollover by [player.trait_decay] below; read by hub_kess_berth's two bands (gte 1 = he's working,
# lt 1 = the torch is cold on it). Crash rough sets NOTHING — the free bed keeps her alive, it doesn't buy him.
# ⚠️ WHY A COUNTDOWN AND NOT A "PAID THROUGH DAY N" INDEX: an effect value is a LITERAL — _resolve_effect_value
# (v2.py:13519-13578) takes a number or a random dict and raises on anything else, and the runtime path turns a
# string expression into NaN -> 0, a SILENT no-op with no build error. And no condition type reads the clock:
# of the 16 in triggerConditionsSatisfied (v2.py:3816+) only days_since_flag touches time_state.day. So
# "day + 7" is unwritable in both directions. Bounced up to design_book + design_the_leash §16 (rev 114).
feed_line_days    = 0
# THE LEASH (beat_0075) — the parts loop's three counters. Kess cannot crack the key clean, so he BUILDS, and
# a build has to be bought, seated and burned (design_the_leash.md §8). One cycle is: buy a part at the market
# (part_held 0 -> 1) -> he seats it at the bench (part_held -> 0, part_installed -> 1) -> she fires it inside
# Mercer's room and it fails (part_installed -> 0, mercer_attempts +1) -> go earn. Three failures, then the
# fourth holds.
#   • part_held      — bought, in her pocket, not yet in her. The ARM, and the exact shape repair_armed already
#                      ships in: set on a navigating choice, read by a gate. Gates the install rung.
#   • part_installed — seated in her and live. Burned back to 0 by every attempt, which is what makes "no free
#                      retries" a rule instead of a promise.
#   • mercer_attempts — 0..4. Bands BOTH the install talk (what Kess learned last time) and the attempt canvas
#                      itself, so the two can never disagree about which generation she is on.
# ⚠️ TRAITS, NOT FLAGS, for the same reason repair_armed/repair_session are: the setters ride navigating choices
# and triggerless exits, and the flag-chain validator hard-fails a flag required by a trigger whose only setter
# is triggerless. A trait is exempt from that check by design.
# ⚠️ THE BACKFILL IS LOAD-BEARING. Declared here they land in setup.stateDefaults, and
# setup.backfillStateDefaults (v2.py:15332) fills them into a carried 0.1.7 save on the next passage. Without
# that they would be ABSENT rather than 0, and coerceNumber(undefined) returns null so EVERY lt/gte gate
# returns false (v2.py:3834-3849) — the whole loop would read "she has no part" and also "she cannot buy one".
# ⚠️ NONE of them decays. They are spent by actions, never by the calendar — see [player.trait_decay] below.
part_held         = 0
part_installed    = 0
mercer_attempts   = 0
# THE DEBRIEF (beat_0093) — part_spec 0-3 selects which part the market is selling; spec_pending 0/1 is the
# gate, raised by every failed attempt and cleared when she reports it to Kess. Declared HERE and not only in
# 0_systems_spec for the reason the header above gives: this block is what lands them in setup.stateDefaults,
# and an absent trait reads undefined, which makes every lt/gte gate on it return false — spec_pending would
# read "already reported" forever and the debrief rung would never appear at all.
part_spec         = 0
spec_pending      = 0
# THE LEASH (rev 133, renamed rev 134) — the CAPTURE device: a bonded courier case. Same shape as part_held:
# bought at the market (0 -> 1), spent when Mercer's palm opens it (1 -> 0). The key cannot go to him — it is
# in pieces on Kess's bench, and he carried it two years and would know it by the weight — so the hand has to
# be brought back on something else, and this is it.
# ⚠️ WAS flask_held AT rev 133, AND THE RENAME IS A FIX, NOT COSMETICS. A flask is a thing he KEEPS, so the
# print left the room in his pocket and never reached the bench — the device recorded the hand and then
# walked off with the mark. A case is opened and DISCARDED: what he keeps (the bottle) and what she carries
# away (the box, with his hand logged in it) are different objects, and that difference is the mechanism.
# A TRAIT for the same reason part_held is — its setter rides a navigating choice, and the flag-chain
# validator hard-fails a flag whose only setter is triggerless.
# ⚠️ ONE-WAY. Unlike part_held there is no re-buy: activity_buy_case closes on owner_print_taken, so once the
# print is taken the stall is gone for good. The print is not a consumable — Kess needs the hand ONCE.
case_held         = 0
# THE LEASH (beat_0079, rewired beat_0087) — the Mercer drain counter, the twin of calloway_drains_done and
# colm_drains_done. Bumped by every draining exit of loop_mercer_finisher: the first drain (the key dead), the
# answered fire, and every warm-tap repeat after it. A TRAIT for the same reason as the three above: its
# setters ride triggerless choices, and the flag-chain validator hard-fails a flag whose only setter is
# triggerless.
# ⚠️ NOTE THE ASYMMETRY WITH mercer_attempts: the fourth part is NOT burned. The build finally holds, so
# part_installed stays at 1 from the first fire onward, which is what closes the parts economy (activity_buy_part
# and the install rung both read part_installed lt 1 / part_held gte 1 and go dark) and what cap_bastien_walks_in
# reads at beat_0080 to know she has been back to Kess since try 3.
mercer_drains_done = 0
# THE LEASH (beat_0087) — HOW FAR THE LEASH ITSELF HAS BEEN BEATEN. The fork axis of loop_mercer_finisher.
#   0 = leashed. Her drain has never once caught on this man.
#   1 = drained with the key DEAD. Kess killed Mercer's controller off the bonded case's log, the reach landed,
#       and nothing came down to shut it. One man off her; the rest of the list exactly where it was.
#   2 = ANSWERED against a LIVE key. The controller is running again — they turned it back on themselves so
#       Kess could study it — the challenge came down as it always has, and the thing in her spoke for her.
# ⚠️ WHY A TRAIT AND NOT THE TWO FLAGS. owner_drained and leash_answered still exist, are still set on the same
# two choices, and still drive all eight Mercer quest cards and every prose band — but their ONLY setters are
# now triggerless (loop_mercer_finisher), and the flag-chain validator hard-fails a flag REQUIRED BY A GATE
# whose only setter is triggerless. It is right to: a triggerless setter gives the help page no "go here" hint.
# So every GATE reads this counter and every CARD reads the flags. That is the shipped discipline, stated in
# loop_colm_finisher's own header and the reason vane_confirmed was retired at rev 92.
# ⚠️ THE ORDER IS STRUCTURALLY FORCED, so gte 1 / gte 2 can never be reached out of sequence: state 1 needs
# controller_off (Kess, at his bench) and state 2 needs mercer_attempts 3 + a fourth part seated, which cannot
# happen until parts_loop_open, which kess_the_chip_not_the_key does not set until state 1 has been reached.
mercer_leash_state = 0
# THE LEASH (beat_0081) — where the controller is carried. 0 = in her coat pocket, where it has been since the
# 1a close; 1 = seated in the seam at the base of her spine, put there by Kess on his bench.
# It exists because of ONE door: Bastien searches everyone who comes into his back room, and design_the_leash
# §11 makes her body the bag — she needs the drain AND the controller in that room, because on a name that is
# on the set the drain alone does nothing. Seating it is route A past the search, and it is the route the
# chapter is about: the thing that will free her goes back inside the seam Bastien's own men cut open to
# disarm her. (Route B is stealth with it in her coat; route C is leaving it behind and wasting the evening.)
# ⚠️ A TRAIT, NOT A FLAG, for the shipped reason: its setter is a TRIGGERLESS bench rung, and the flag-chain
# validator hard-fails a flag required by a gate whose only setter is triggerless. Same call as part_held /
# part_installed / mercer_attempts above.
# ⚠️ NOT the same thing as §13's run-state. Whether the controller is RUNNING (on/off, charge, bench reload)
# is a separate axis that belongs to beat_0082, where she switches it on mid-act. This trait is only WHERE it
# is being carried.
controller_seated = 0
# THE LEASH (beat_0081) — what the door decided, last time she stood at it. 0 = the controller is not on her
# in that room (either it never left the berth, or it is sitting on his desk); 1 = it got through.
# ⚠️ A SECOND TRAIT AND NOT A DERIVED READ, on purpose. The outcome IS computable from controller_seated +
# stealth at the instant of the search — but it is not STABLE, because she can buy stealth or have Kess seat
# it between visits, and because route C leaves the thing on his desk rather than on her. So downstream gates
# that recomputed it would be answering "what could happen at the door" when the question is "what happened
# at the door", and the two drift apart the moment she changes anything. One counter for one fact; the parts
# loop dropped part_gen for exactly this reason. Set on bastien_door_search's exit CHOICE, re-set every visit.
controller_through = 0
# THE LEASH (beat_0082) — §13's controller RUN-STATE, and the only part of that loadout that got built.
# 0 = idle, 1 = running = the leash suppressed. Set on a CHOICE at the anal pose inside loop_bastien_backroom,
# because "she brings it up" is something she does MID-ACT, and zeroed again by every loop entry and every
# finisher exit so she never leaves it running between visits.
# ⚠️ §13 ALSO SPECIFIED A CHARGE METER + A BENCH RELOAD, AND THAT WAS CUT AT rev 127 — recorded up in
# design_book and design_the_leash §13, not silently dropped. It is an economy with exactly ONE customer: the
# chapter has one blocked target and the switch dies at the extraction, so a charge meter buys one more errand
# in a cycle that already runs bar -> door -> room, against §8's own rule that the loop must not read as
# errands. The fiction of the power cost survives in the reset.
# ⚠️ TWO CONDITIONS, NOT ONE, AND THE LOOP TEACHES THE SECOND. The shipped pattern already teaches "only the
# anal finish opens the drain"; Bastien adds "and only with the key running". Anal + controller_state 0 routes
# to bastien_drain_canvas.dead — the cold-socket nothing, no bump, no fail screen.
controller_state = 0
# THE LEASH (beat_0082) — the Bastien drain counter, the twin of colm_drains_done / mercer_drains_done.
# Bumped on loop_bastien_finisher's d0 choice only. A TRAIT because that setter is triggerless.
bastien_drains_done = 0

# ─── THE FACE (beat_0094, rev 145) — the chapter's three internal traits ──────────────────────────
# Labels + the full trait-not-flag reasoning live in 0_systems_spec.toml. Declared HERE because
# [player.core_traits] is what puts a trait into the cross-release save backfill: a 0.1.8 save loaded
# into 0.1.9 gets these initialised to 0, where a trait declared only in the labels block would be
# undefined and every "gte" against it would read as a comparison on undefined.
# wall_refusals 0-4 — doors that have shut on her as Wren; read once, by cap_the_wall's gte 3.
# bar_rung 0-4 — 0 not hired / 1 floor / 2 counter / 3 the floor in less / 4 the back room.
# taser_held 0/1 — carrying the market taser. NOT on the equipped_weapon axis, on purpose: that axis is
#   one-core-one-weapon and the taser's whole job is to be the thing she can carry WITH the drain live.
wall_refusals = 0
bar_rung      = 0
taser_held    = 0
# taser_through 0/1 — set at the door search every visit. "She owns one" and "it is on her right now" are
# different facts, because he searches her every time. Read by cap_the_raid as a BAND, never as a gate.
taser_through = 0
# ruin_depth 0-4 — beat_0110 (rev 160). The burned-back-room crawl's OWN odometer. It exists because the
# first cut banded that crawl on yard_depth, which belongs to the Burned Yard and is already maxed by this
# point in the game, so the ruin's first stage was dead and its first click jumped to the last stage.
# Declared here and not only in the labels block, because core_traits is what puts a trait into the
# cross-release backfill — a trait declared only in labels is undefined on a 0.1.8 save.
ruin_depth    = 0

# ─── Daily decay (engine-applied at every day rollover) ───────────────────────
# advanceDay subtracts each value from its trait and floors at 0 (v2.py:5532-5544); parsed at
# template_import.py:1657-1666. Unconditional — there is no skip logic, which is exactly what an upkeep wants.
# ⚠️ ONLY feed_line_days decays. Charge/Condition/coin/the weapon charges are all spent by ACTIONS, never by
# the calendar, and putting any of them here would silently tax an idle day.
[player.trait_decay]
feed_line_days = 1

# ─── NPCs ─────────────────────────────────────────────────────────────────────

# ── Mercer — her owner (inside) — UNCHANGING, no lock ─────────────────────────
[[npcs]]
id          = "npc_mercer"
name        = "Mercer"
description = "Her direct owner and handler. He runs her missions and uses her as he pleases — sex and chores, however he orders it — and he knows every one of her secrets. Cold the way ownership is cold: she's an investment he maintains, not a person he sees."
portrait    = "mercer.jpg"
core_traits = { relation = 0 }
flag_keys   = []
arc_stages  = ["Owner"]

[[npcs.schedules]]
location   = "penthouse"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "08:00"
end_time   = "23:00"
activity   = "in his penthouse — running the assets"

# ── beat_0072 (rev 117) — Mercer's SECOND schedule row: his night hours down in the underworld. ──────────
# ⚠️ PLACEMENT IS LOAD-BEARING. This block must stay directly under Mercer's penthouse row, ABOVE the next
# [[npcs]]. A [[npcs.schedules]] block that drifts below the next [[npcs]] header silently re-attaches to
# THAT NPC — no error, no warning, just Renner keeping Mercer's hours.
#
# ⚠️ AND THE PENTHOUSE ROW ABOVE IS NOT TOUCHED. Act 1 needs it: cap_first_penthouse_service and
# mercer_penthouse_hub both carry requires_npc = "npc_mercer" (5_scenes.toml:23, :73). Dropping it would kill
# live content and orphan any returning player still inside Act 1.
#
# WHY 23:00-08:00 AND NOT A WIDER WINDOW. A schedule row carries NO conditions — the resolver reads exactly
# five keys (location / weekdays / start_time / end_time / activity; v2.py:979-985) and drops anything else,
# so there is no way to say "only after he's blown". getNpcLocation then walks the rows in DECLARATION ORDER,
# first match wins (v2.py:3439-3454). The penthouse row is first and owns 08:00-23:00, so this row's real
# window is the complement no matter what hours are written here. Written honestly rather than hopefully.
# (isCurrentTimeSlot handles the overnight wrap itself, v2.py:3800-3802 — ONE row spans 23:00 -> 08:00. The
# two-row split is only needed when weekdays is restricted, as with Marsh's Sunday booking.)
#
# WHY HIS ROOM AND NOT THE UNDERTOW. There are two presence surfaces and only one is canvas-gated. The
# portrait card inside a room is (v2.py:4998-5008) — safe. The nav-card BADGE is not: getNpcsPresentAtLocation
# is pure schedule occupancy, no canvas gate, no hidden_from_ui filter (v2.py:4773). A row at the public
# underworld_bar would therefore park Mercer's face on the Undertow's nav card every night from Act 1b
# onward — before he is blown, before she has found him, spoiling the one beat this whole chapter turns on.
# A LOCKED location has no such surface: the indicators block lives only in the open_card branch, and
# locked_card renders image + name + reason and nothing else (v2.py:19270-19281, verified in the shipped
# output/index.html). mercer_room is locked on mercer_found, so the leak is exactly zero.
# THE PRICE, PAID ON PURPOSE: no schedule at the bar means no PORTRAIT hub at the bar — the engine hard-
# refuses a clickable portrait to an NPC it can't place there. Mercer's Undertow content is plain location
# canvases; his portrait hub lives at his room, where the escalation actually happens.
#
# THE CONSEQUENCE, ALSO ON PURPOSE: Mercer is a NIGHT NPC. Kess's yard is 10:00-22:00, so the chapter splits
# clean — day is the bench, night is the man. The whole loop (beats 0074, 0076-0079) is night work.
[[npcs.schedules]]
location   = "mercer_room"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "23:00"
end_time   = "08:00"
activity   = "keeping night hours behind his own stall"

# ── Renner — Mission 1 target (the cold boss she seduces from the bottom) ─────
[[npcs]]
id          = "npc_renner"
name        = "Renner"
description = "The equipment supplier whose gear outfitted the facility Cain burned down — though he never knew what it was for. Cain gutted his business; now he's a husk of a man clawing at the wreck of it, broke and blacklisted and drinking. He hired cheap hands to help rebuild. He's mean to the help and he doesn't look twice at her. Yet."
portrait    = "renner.jpg"
core_traits = { relation = 0, corruption = 0, arousal = 0 }
flag_keys   = []
arc_stages  = [
  "Beneath notice",   # 0 — hired menial; cold, ignores her
  "Useful",           # 1 — good work earns notice (relation)
