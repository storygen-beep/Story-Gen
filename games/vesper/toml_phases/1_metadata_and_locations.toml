# ── the_cot — beat_0115 (rev 166). THE FIRST ROOM IN THE GAME THAT IS HERS. ───────────────────────────
# LO's call, and it repairs a framing mistake I made at beat_0094. The cot has been a solo-activity CARD on
# the berth's page since rev 96, and when the wardrobe moved to the Reach I hung it off kess_berth — so
# "Change Clothes" rendered on a ship-breaker's dock floor, two lines under Kess's portrait, as if it were a
# facility of his yard. It is not. It is her bunk.
# ⚠️ AND CARD P ALREADY SAID SO. Its tip reads "Get to the cot at the Berth and change" — written when the
# cot was assumed to be a place, then contradicted by the build. This makes the tip literally true rather
# than nearly true, which is the difference between a player finding a link and hunting for one.
# ⚠️ WHY A LOCATION AND NOT A BIGGER CARD. wren_room was the company's. The Spire is sealed. This is the only
# space in the game that belongs to her, and a space that belongs to somebody needs a door, an image and a
# description — the wardrobe, the four equipped-based undress portraits and the feed line all actually belong
# to a room, and none of them belongs on a menu item.
# ⚠️ IT ALSO SHEDS A CARD FROM THE BUSIEST SCREEN IN THE GAME. kess_berth carries 22 one-shot auto-fires and
# (before this) 5 repeatable surfaces, with a standing validator warning about two of them colliding.
# ⚠️ THE COST, RECORDED HONESTLY: +1 click on the most-repeated action in the game. She sleeps every in-game
# night, and a location cannot carry choices directly while a repeatable surface cannot be an auto-fire, so
# berth -> cot -> sleep is one step longer than berth -> cot-card -> sleep. Taken deliberately: the click is
# cheap and a player home that is a menu item taxes every scene that ever wants to happen there.
# ⚠️ entry_conditions ARE MANDATORY, not decoration. kess_berth opens at salvage_entered, which is a whole
# chapter before she rents the cot at beat_0068 — without the gate this card would advertise a bed she has
# not been offered, from the middle of the salvage. version = "1.0" or the condition FAILS OPEN.
# ⚠️ NOT nav-invisible, deliberately, unlike bastien_backroom and cain_lab: entry_from gives it a nav card
# and the engine's own "Leave" link, so it can never become the dead end beat_0114 had to fix twice.
[[locations]]
id          = "the_cot"
name        = "The Cot"
description = "A stripped bench along the wall past the hull, a pad on it, and a tap spliced off the same feed line Kess uses to wake dead machines. Her bag is under it and her coat is on a nail. It is not the cradle and it is not a room, and it is the first place in her life that nobody signed for."
image       = "locations/the_cot.jpg"
image_search_queries = ["industrial workshop corner bunk pad cables dim", "makeshift bed in a machine shop low light"]
entry_from  = "kess_berth"
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "berth_home", operator = "is_true" },
] }
blocked_message = "A bench along the wall with a pad on it, and no reason yet for it to be hers."

# ── bastien_backroom — RESTORED at beat_0101 (rev 152), THE FACE. Shelved at rev 141, back unchanged.
# ⚠️ NO `entry_from`, DELIBERATELY — the captive_room shape. A location with no entry_from is on NO nav grid,
# which this room needs for two separate reasons, both still true in 0.1.9:
#   (1) THE BADGE. npc_bastien's only schedule row in the game points here, and a schedule row is
#       unconditional. The in-room portrait card is canvas-gated (v2.py:4998-5008) but the NAV-CARD BADGE IS
#       NOT (getNpcsPresentAtLocation, v2.py:4773), so a row at any location carrying a card would park his
#       face on that card in every save — including an Act-1 save where he is a saved reveal at that moment
#       holding her in a cell. A locked card is not good enough: it still advertises the room before she is
#       invited.
#   (2) THE SEARCH MUST BE UNSKIPPABLE. The only thing that ever puts her in here is bastien_door_search's
#       exit. With a nav card — locked or not — she could walk in the moment bar_rung hits 4 and never stand
#       for the search, which is the one beat this room exists to make unavoidable.
# So: no entry_from, no entry_conditions, no blocked_message. There is no door to block because there is no
# card. She leaves by hub_bastien's exit, back out to underworld_bar.
# ⚠️ THIS BLOCK CHANGES AT beat_0107, when the raid burns the room and it gains a nav card for the first time.
[[locations]]
id          = "bastien_backroom"
name        = "The Back Room"
description = "Behind the Undertow, past a door that has no handle on the bar side. Better furniture than the room deserves, a desk with nothing on it, and a chair set where a man can see both the door and whoever he has put in front of it. It smells of the bar and of nothing else."
image       = "locations/bastien_backroom.jpg"
image_search_queries = ["private back room behind bar desk armchair dim", "noir speakeasy office low light leather chair"]
# ⚠️ auto_exit = false, AND IT IS LOAD-BEARING — caught live at beat_0081 before the first assertion about
# the room even ran. Dropping entry_from is only half the job: _ordered_navigation builds a location's nav
# grid from its CHILDREN (locations whose entry_from points at it), so this room has an empty grid AND no
# auto "Leave" link — and an empty navigation_html trips the list-every-location FALLBACK
# (v2.py:19386, `if not navigation_html and auto_exit`). The built passage came out carrying
# "All locations:" and the entire world, so from Bastien's back room she could walk to the Spire.
# A nav-invisible interior needs BOTH halves: no entry_from, and auto_exit = false. cain_lab copies it.
auto_exit   = false

[[locations]]
id          = "crew_den"
name        = "The Crew's Rooms"
description = "A dead man's rooms down past the market, off a stair nobody's cleared — where Doss and Rourke and the rest holed up before Renner put them in the ground. The door still answers to a key under the third stair, and nobody's been back. Nobody but her."
image       = "locations/crew_den.jpg"
image_search_queries = ["abandoned tenement room ransacked dim", "cleared-out dead man rooms dark dockside"]
entry_from  = "underworld_strip"
entry_conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "crew_known", operator = "is_true" },
] }
blocked_message = "There's a crew that holed up down past the market — but she doesn't have the address yet. Marsh has it."

# ═══════════════════════════════════════════════════════════════════════════════
# CAPTIVITY — the sealed room (beat_0036). Bastien's cell.
#
# She is PORTED here (the rewritten grab, beat_0037) and ported out (Cain's release, beat_0042).
# She never walks in and never walks out. Two locations enforce that between them:
#
#   captive_room  — NO entry_from, NO parent. A fourth ROOT. Vesper's other three roots
#                   (spire_plaza / the_waterfront / underworld_strip) never list each other —
#                   they're bridged by the travel activities — and _ordered_navigation lists
#                   children BY entry_from. So nothing points here: it appears in no nav, anywhere.
#                   No entry_from also means NO "Leave The Room" link (v2.py:18570 emits that raw,
#                   UNGATED exit link only `if location.entry_from`).
#
#   captive_door  — the child that makes the seal hold. Its ONLY job is to keep the room's nav
#                   NON-EMPTY: when nav comes out empty, _generate_hierarchical_navigation
#                   (v2.py:18606) FAILS OPEN and renders EVERY location as a clickable card.
#                   The door is permanently locked, so the room has exactly one destination and
#                   it can never be taken.
#
# ⚠️ THREE TRAPS, all of which build GREEN:
#   1. NEVER give captive_door a `parent` — _ordered_navigation (v2.py:11651) excludes children
#      whose parent_location == the location, the nav empties, and the whole-map fallback unseals
#      the room. Attach it with entry_from ONLY.
#   2. The gate is a TRAIT (cell_door), not a flag. A flag `is_true` gate requires a LOCATED setter
#      or the flag-chain validator hard-fails — and nothing may ever set this one.
#   3. version = "1.0" or triggerConditionsSatisfied returns TRUE for the whole block (v2.py:3658)
#      and the door stands open.
#
# Both carry an `image`: with no image on any destination the nav drops to TEXT mode and prints the
# header "Available destinations:" above a locked door (v2.py:18560-18564) — a lie in a sealed room.
# With one, it renders a single greyed, non-clickable card with the blocked_message inline. The door
# exists to be looked at.
#
# STILL OPEN: SugarCube's undo arrow (#history-backward) walks her straight out. See beat_0045 —
# LO parked the scoping call. The room is NOT sealed until that lands.
# ═══════════════════════════════════════════════════════════════════════════════

[[locations]]
id          = "captive_room"
name        = "The Room"
description = "Concrete, painted once, a long time ago. A bed bolted to the floor and a chair that isn't. A table with nothing on it. A drain in the middle of the floor, because whoever built this expected to hose it out. The light stays on. There is a door."
image       = "locations/captive_room.jpg"
image_search_queries = ["bare concrete basement room single bed harsh light", "windowless holding cell mattress drain floor"]

# The Door. cell_door is declared 0 (beat_0035) and NOTHING SETS IT — the gate can never pass.
# A deliberate exception to the locked-location unlock contract: there is no unlock beat, by design.
# Cain walks her out; she does not walk herself out.
[[locations]]
id          = "captive_door"
name        = "The Door"
description = "Steel, and newer than the room. It opens when they want it to."
image       = "locations/captive_door.jpg"
image_search_queries = ["heavy steel door dim concrete corridor", "riveted metal cell door locked interior"]
entry_from  = "captive_room"
entry_conditions = { version = "1.0", items = [
  { type = "trait", subject = "player", trait_key = "cell_door", operator = "gte", value = 1 },
] }
blocked_message = "The door does not open for her."

# ═══════════════════════════════════════════════════════════════════════════════
# THE FACE (beat_0094, rev 145) — CAIN'S LAB. The chapter's last room, and the release's last passage.
# ═══════════════════════════════════════════════════════════════════════════════
# ⚠️ NAV-INVISIBLE, AND IT NEEDS BOTH HALVES — the bastien_backroom shape, copied deliberately rather
# than re-derived. No `entry_from`, so it appears on no nav grid and nothing in the world points at it;
# and `auto_exit = false`, because _ordered_navigation builds a location's grid from its CHILDREN and this
# room has none, so an empty navigation_html would trip the list-every-location FALLBACK
# (v2.py:19386, `if not navigation_html and auto_exit`) and emit "All locations:" plus the entire world —
# which from here would let the player walk out of Cain's lab straight into the sealed Spire.
# Arrived at by canvas (cap_the_lab, chained off cap_the_raid's exit) and left by canvas.
#
# ⚠️ SHE DOES NOT KNOW WHERE THIS IS, AND THE DESCRIPTION MUST NOT TELL HER. Bastien's drain establishes
# that nobody knows where Cain lives, so the room cannot carry a district, a street, a view, or a
# direction — she was moved here at speed, out of a burning building, and the prose has to be as blind as
# she is. What it can say is what is IN it, and what is in it is the point: this is where the stolen Vance
# paperwork has been going for years, and it is a workshop for rebuilding a body.
#
# ⚠️ NO SCHEDULE ROW FOR CAIN, EVER — the badge trap. getNpcsPresentAtLocation is not canvas-gated
# (v2.py:4773), and Cain is the reserved reveal of the whole game. He is a scheduleless speaker inside
# cap_the_lab, the cap_mercer_resurfaces precedent.
[[locations]]
id          = "cain_lab"
name        = "The Lab"
description = "Somewhere she was carried to with her head down. Long benches under work-lamps, a body-frame standing empty at the far end, and paper everywhere — filed, stacked, annotated, years of it, in a hand that presses hard. Nothing in the room was bought new. Everything in it has been taken from somewhere that could afford it."
image       = "locations/cain_lab.jpg"
image_search_queries = ["cluttered underground workshop long benches work lamps night", "improvised laboratory salvaged equipment dim industrial interior"]
auto_exit   = false
