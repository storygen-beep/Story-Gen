# ═══ beat_0014 — the Quests page: two tiers (Story Goals + Renner's chain) ══════
# Tier 1 = Story Goals (no npc_id): the MISSION. Spine (below) + the Burned Yard + the
# end-of-content card. Tier 2 = Renner's own section (npc_id="npc_renner"): his seduction
# as a one-card-at-a-time chain on his own meters/flags. The Renner sidebar npc_panel
# 'next' row mirrors whichever Renner card is live (pickQuestsCard, v2.py:15138).

# Tier 1 spine — Mission 1 orientation. No goals/ready_text: the granular relation/corruption
# steps live under Renner now. Shows while mission_1_active && !renner_drained.
[[quest_cards]]
priority   = 10
text       = "Mission 1: Renner. The quartermaster who outfitted the facility Cain burned — get inside his life and drain him for what he knows: what the gear built, where the trail goes. The company wants the rogue dead. She wants the way in. (His seduction tracks under Renner, below.)"
tip        = "Wear the dock-work coveralls from your room before you go near him — out of cover he just sees a stranger and won't deal with her. Then find him at the Anchor."
when = [
  { flag = "mission_1_active", op = "is_true"  },
  { flag = "renner_drained",   op = "is_false" },
]

# Tier 2 — Renner's chain (one card live at a time, gated on his own flags; no new flags).
# Stage A: from hire until the office opens (relation 21 auto-sets renner_office_open via cap_renner_noticed).
[[quest_cards]]
priority   = 11
npc_id     = "npc_renner"
text       = "Beneath his notice. Earn the cold boss's trust from the bottom — good hands get noticed."
tip        = "Coveralls on. Work the depot haul to push his relation. At 21 he waves you into the back office — that's where the seduction opens."
when = [
  { flag = "renner_hired",       op = "is_true"  },
  { flag = "renner_office_open", op = "is_false" },
]
goals = [
  { trait = "relation", subject = "npc", npc_id = "npc_renner", op = "gte", value = 21, label = "Earn the office (relation)" },
]

# Stage B: from the office until the drain — a STEPPED corruption ladder, one banded rung live at a time
# (the picker swaps cards as npc_renner.corruption crosses each band; ranges are exclusive so exactly one
# matches — no priority race). The current lever lives in each rung's goal LABEL, because the Renner sidebar
# 'next' row renders only the goal block (v2.py:15142), not text/tip — those carry the fuller Quests-page
# coaching. Each goal value = the next threshold, so the number reads N / 10, N / 20 ... (LO: keep the number).
# The real content unlocks mirror these bands: tease 0 / flash 10 / grope 20 / first-oral 30 / loop 40 / anal-drain 50.

# Rung 1 — tease (corruption 0–9)
[[quest_cards]]
priority   = 12
npc_id     = "npc_renner"
text       = "Get his eyes on you. He won't look up from the manifest — so make him. Tease him across the desk."
tip        = "In cover, in his office: run the tease rung. Every rung pushes his corruption toward breaking."
when = [
  { flag = "renner_office_open", op = "is_true"  },
  { flag = "renner_drained",     op = "is_false" },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "lt", value = 10 },
]
goals = [
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 10, label = "Get his eyes on you — tease him" },
]

# Rung 2 — flash (corruption 10–19)
[[quest_cards]]
priority   = 12
npc_id     = "npc_renner"
text       = "He looked. Now make it worse — flash him while you work, let him see there's nothing under the coveralls."
tip        = "The flash rung's open now. Keep pushing his corruption."
when = [
  { flag = "renner_office_open", op = "is_true"  },
  { flag = "renner_drained",     op = "is_false" },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 10 },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "lt",  value = 20 },
]
goals = [
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 20, label = "Make him look — flash him" },
]

# Rung 3 — grope (corruption 20–29)
[[quest_cards]]
priority   = 12
npc_id     = "npc_renner"
text       = "He's watching for it now. Get your hands on him — a grip, a stroke — make him feel it before he can decide to stop you."
tip        = "The grope rung's open. Every rung climbs his corruption toward the break."
when = [
  { flag = "renner_office_open", op = "is_true"  },
  { flag = "renner_drained",     op = "is_false" },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 20 },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "lt",  value = 30 },
]
goals = [
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 30, label = "Get your hands on him" },
]

# Rung 4 — he cracks / first oral, push to the loop (corruption 30–39; the loop opens at 40)
[[quest_cards]]
priority   = 12
npc_id     = "npc_renner"
text       = "He broke enough to take your mouth. He's not all the way yours yet — keep at him until he'll do anything."
tip        = "Keep running the rungs. At his limit he'll pull you into the office and fuck you."
when = [
  { flag = "renner_office_open", op = "is_true"  },
  { flag = "renner_drained",     op = "is_false" },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 30 },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "lt",  value = 40 },
]
goals = [
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 40, label = "He's cracking — keep working him" },
]

# Rung 5 — the loop is open; break him the rest of the way to 50 (corruption 40–49).
[[quest_cards]]
priority   = 12
npc_id     = "npc_renner"
text       = "He'll fuck you in the office now. Break him the rest of the way — then finish him in the ass and take the drain."
tip        = "Take him in the office (repeatable). At corruption 50, in cover, the anal pose opens — finish there with the drain worn and charged, and the weapon fires."
when = [
  { flag = "renner_office_open", op = "is_true"  },
  { flag = "renner_drained",     op = "is_false" },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 40 },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "lt",  value = 50 },
]
goals = [
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 50, label = "Break him to the drain (corruption)" },
]

# Rung 6 — he's broken (corruption 50+) but not yet bedded. The corruption number is maxed, so the live step
# is the action, not a meter: bed him (the loop sets renner_fucked_once), after which the priority-13 READY pair
# takes over. Priority 13 to outrank Rung 5; mutually exclusive with READY on renner_fucked_once. Without this
# card the 'next' row would go BLANK here — Frame 3 only renders while a goal is unmet (v2.py:13988) and Rung 5's
# corruption goal is already met at 50. This is the only rung with no number (fucked_once is binary, not a meter).
[[quest_cards]]
priority   = 13
npc_id     = "npc_renner"
text       = "He's broken — all the way down. Now bed him and take the drain."
tip        = "Take him in the office, in cover, carrying the drain — finish in his ass and the weapon fires."
when = [
  { flag = "renner_office_open", op = "is_true"  },
  { flag = "renner_drained",     op = "is_false" },
  { flag = "renner_fucked_once", op = "is_false" },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 50 },
]
goals = [
  { flag = "renner_fucked_once", op = "is_true", label = "Take him to bed" },
]

# Stage B — READY (loadout-aware; LO's ask: the quest page directs her to the drain weapon). Once he's
# broken (corruption>=50) AND she's bedded him (renner_fucked_once), priority 13 overrides the climb card
# (12) with a directive keyed to what she's carrying. Two cards, mutually exclusive on equipped_weapon.
[[quest_cards]]
priority   = 13
npc_id     = "npc_renner"
text       = "He's broken and ready. Take him in the office and finish in his ass — the drain fires and he gives up everything."
tip        = "You're carrying the drain weapon. Get him to the desk, in cover."
when = [
  { flag = "renner_office_open", op = "is_true"  },
  { flag = "renner_drained",     op = "is_false" },
  { flag = "renner_fucked_once", op = "is_true"  },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 50 },
  { trait = "equipped_weapon", subject = "player", op = "eq", value = 1 },
]
[[quest_cards]]
priority   = 13
npc_id     = "npc_renner"
text       = "He's broken and ready to drain — but you're carrying the emitter, not the drain."
tip        = "Switch back to the drain weapon at your bench in your room, then take him in the office and finish in his ass."
when = [
  { flag = "renner_office_open", op = "is_true"  },
  { flag = "renner_drained",     op = "is_false" },
  { flag = "renner_fucked_once", op = "is_true"  },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 50 },
  { trait = "equipped_weapon", subject = "player", op = "eq", value = 2 },
]

# RETURNING-PLAYER re-drain nudge (was the "end of the build" card — retired at the Underworld
# Hunt, rev 54). A returning player who drained pre-update has renner_leads_extracted but
# names_known=0 (backfilled) -> this points them back to re-drain for the names. A NEW player
# gets names_known=1 on the same drain, so this never shows for them. Retires at names_known>=1,
# where hunt rung 1 (beat_0031) takes over. Both priority 9, mutually exclusive on names_known.
[[quest_cards]]
priority   = 9
text       = "Renner gave up the shape of it — two of his own people dead, and a trail down into the underworld. But you never got their names, and without them the trail's cold. Take him again and press him for it."
tip        = "Go back to Renner and get him to the drain once more — this time make him name the two he buried."
when = [
  { flag  = "renner_leads_extracted", op = "is_true" },
  { trait = "names_known", subject = "player", op = "lt", value = 1 },
]

# The Trail — the burned-yard crawl (a parallel goal to the seduction). Active once she's in Renner's
# orbit (renner_hired); the goal tracks yard_depth (0->3). Flips to its payoff (ready_text) at depth 3,
# where the deep find sets found_dead_men (the thread to the Underworld, which is reachable off the Waterfront).
[[quest_cards]]
priority   = 8
text       = "Renner's old yard — the one Cain torched — is still watched by his men. Guarded means there's something out there worth finding. Get in past the guards and work deeper."
ready_text = "The yard gave up its heart: two of Renner's own people, killed with their families, and the thread that ties them to the underworld. Doss and Rourke — that's where the trail runs now, down past the gate."
tip        = "Sneak into the Burned Yard, off the Waterfront. Slip past the guards (Stealth) or beat them (Fighting) — drill at your room if you can't get past. Each push gets you deeper; the arousal weapon's down there too."
when = [
  { flag = "renner_hired", op = "is_true" },
]
goals = [
  { trait = "yard_depth", subject = "player", op = "gte", value = 3, label = "Search the burned yard" },
]

