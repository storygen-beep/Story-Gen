id   = "base"
name = "Marsh"
blocks = [
  { type = "image", props = { file = "scenes/marsh_booking.jpg", description = "A small, neat, careful man stepping into a dim red-lit brothel room, checking the exits before he looks at the woman waiting.", search_queries = ["small neat man entering brothel room dim", "careful client doorway red light room"] } },
