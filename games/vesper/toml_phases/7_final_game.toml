# Every Renner-facing canvas above now requires the dock-work cover equipped. These are what
# she gets out of cover: the pre-hire threat-read (solo-link) + the post-hire squint (the
# substitution target of each Renner hub). All set NOTHING — a stall + a wrong look, never a
# fail-state (the leash is Act-2). See design_book '## The cover / disguise system'.

# react_renner_threat — PRE-HIRE, out of cover. Solo-link at the Anchor (repeatable, no auto-
# loop). The hire (cap_renner_hired) requires the cover; this is the cold shoulder instead.
[[canvases]]
id          = "react_renner_threat"
name        = "Try him cold"
description = "Pre-hire out-of-cover reaction at the Anchor. Solo-link. Gated opening_done + renner_hired is_false + cover UNEQUIPPED (mutually exclusive with cap_renner_hired's cover-EQUIPPED gate). A clean, expensive-looking woman quizzing a blacklisted wreck reads as a threat. Sets nothing."

[canvases.trigger]
location      = "the_anchor"
requires_npc  = "npc_renner"
is_repeatable = true
priority      = 6
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "renner_hired", operator = "is_false" },
  { type = "clothing_item", item_id = "cover_dockhand", operator = "unequipped" },
] }

[[canvases.nodes]]
id   = "base"
name = "Try him cold"
blocks = [
  { type = "image", props = { file = "scenes/renner_anchor.jpg", description = "A dim run-down bar at night, a heavyset tired man at the end of the counter turning a wary shoulder to a well-dressed woman.", search_queries = ["dim bar man drinking night", "man bar turning away woman"] } },
  { type = "paragraph", content = "Renner's at the end of the bar. She takes the stool and starts in — heard he's rebuilding, looking for work — and watches it land wrong. She's too clean. Too put-together for a woman who'd want a dock-rat's wages. He looks at her the way a man with enemies looks at a stranger who knows his business." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_renner" }, content = "Whatever you are — cop, fed, one of theirs — I've got nothing to say to it. Off my stool." },
  { type = "paragraph", content = "He turns his shoulder and that's the end of it. Dressed like this she's not cheap hands; she's a question, and a man this far down doesn't answer questions. She'd have to come at him as something that doesn't get a second look — the cover's in her quarters, and it does her no good on the rack." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Leave it."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "the_anchor"

# react_renner_nocover_depot — POST-HIRE squint at the depot (substitution target of the depot
# hub when out of cover). He hired "the help"; this isn't her.
[[canvases]]
id          = "react_renner_nocover_depot"
name        = "Wrong skin for the yard"
description = "Substitution-only. Reached from hub_depot_floor when cover_dockhand is NOT equipped. The hired help doesn't look like this — Renner squints, the day stalls. Sets nothing. Exit -> renner_depot."

[canvases.trigger]
location          = "renner_depot"
requires_npc      = "npc_renner"
substitution_only = true
is_repeatable     = true
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "Wrong skin for the yard"
blocks = [
  { type = "paragraph", content = "She comes onto the floor and Renner's head comes up wrong. The coveralls aren't on her — she's in her own clothes, the clean expensive line of them all out of place against the racks — and for a second he doesn't place her at all. Then the wariness: not recognition. Suspicion." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_renner" }, content = "...the hell are you dressed like that for. Do I know you?" },
  { type = "paragraph", content = "Wrong skin for this yard. Whatever she'd get done here today, she won't get it done looking like this. The cover's back in her quarters; it does her no good on the rack." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Get out before he looks harder."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "renner_depot"

# react_renner_nocover_anchor — POST-HIRE squint at the Anchor (substitution target of the
# evening hub when out of cover).
[[canvases]]
id          = "react_renner_nocover_anchor"
name        = "Wrong face tonight"
description = "Substitution-only. Reached from hub_anchor_renner when cover_dockhand is NOT equipped. Sets nothing. Exit -> the_anchor."

[canvases.trigger]
location          = "the_anchor"
requires_npc      = "npc_renner"
substitution_only = true
is_repeatable     = true
is_active         = true

[[canvases.nodes]]
id   = "base"
name = "Wrong face tonight"
blocks = [
  { type = "paragraph", content = "She slides onto the stool beside him and it's wrong before she's said a word. Out of the coveralls, in her own clean clothes, she's not the dock-rat who hauls his crates — she's a stranger sitting too close, and his bleary eyes narrow on her with the old wariness coming up through the drink." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_renner" }, content = "...do I know you? You don't look like you tonight." },
  { type = "paragraph", content = "Even three drinks down he knows the shape of her is off. Nothing she wants from him happens while she's wearing the wrong face. The cover's back in her quarters, where it does her no good." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Leave before he sobers on it."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "the_anchor"

# ═══ beat_0014 — the Mission-1 quest card + the frontier-seed card ═════════════

# Spine — Mission 1 (Renner). Story Goals on Renner's own meters (relation = the office,
# corruption = the drain). Shows while mission_1_active && !renner_drained.
[[quest_cards]]
priority   = 10
text       = "Wear the dock-work coveralls from your room before you go near him — out of cover he just sees a stranger and won't deal with her. Mission 1: Renner. The quartermaster who outfitted the facility Cain burned. Get inside his life and drain him for what he knows — what the gear built, where the trail goes. The company wants the rogue dead. She wants the way in."
ready_text = "Renner's drained. The trail points onward — and the briefing is starting not to fit what she's finding."
tip        = "First, put the coveralls on at the rack in your room. Work his depot to earn the office (his trust). Break the cold boss until he beds you (his want). Take it in the ass when he finishes — that's when the weapon fires and he gives up everything."
when = [
  { flag = "mission_1_active", op = "is_true"  },
  { flag = "renner_drained",   op = "is_false" },
]
goals = [
  { trait = "relation",   subject = "npc", npc_id = "npc_renner", op = "gte", value = 15, label = "Earn the office (relation)" },
  { trait = "corruption", subject = "npc", npc_id = "npc_renner", op = "gte", value = 20, label = "Break him to the drain (corruption)" },
]

# Frontier seed — the leads (telegraphed locked-visible). Shows after the drain; the goal is
# the_site, which never unlocks in this chunk (needs all three missions' leads).
[[quest_cards]]
priority   = 9
text       = "Renner gave up two names before he forgot he'd said them: Bastien, a dealer on the docks, and Calloway, the company man running the hunt. The trail forks from here — but neither door is open to her yet, and the Site where Cain went stays dark until the leads run all the way down."
ready_text = "The way to the Site is open."
tip        = "Bastien and Calloway are Act-2 work. For now, the leads are logged and the Site stays locked."
when = [
  { flag = "renner_leads_extracted", op = "is_true" },
  { flag = "the_site_open",          op = "is_false" },
]
goals = [
  { flag = "the_site_open", subject = "player", op = "is_true", label = "Find where Cain went (locked — the trail isn't complete)" },
]

