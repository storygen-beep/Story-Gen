# Phase 1/7 — 1_metadata_and_locations.toml
# Vesper — player (Wren) + Mercer & Renner (schedules) + the chunk map.
#
# IMPORTANT: All [[npcs]] + schedules + core_traits live in THIS one file (TOML scoping).
#
# MAP = the late_shifts NON-CONTAINER pattern (the shipped, proven shape): two parallel
# top-level street hubs (spire_plaza / the_waterfront, NO entry_from), each nesting its
# venues via entry_from + navigation_order. NO is_container wrappers — they cause the nav
# double-print the audit caught AND swallow attached canvases. The two hubs are bridged by
# the travel activities (3_activities). This SUPERSEDES the World-blueprint 'default_entry
# on containers' note (engine-forced refinement — see ledger turn 22).
#
# CHUNK locations (11): SPIRE (spire_plaza · atrium · penthouse · wren_floor · wren_room ·
# cradle) + REACH (the_waterfront · the_anchor · renner_depot[+folded office register] ·
# facility_ruins · the_site[LOCKED frontier card]). Office is FOLDED into renner_depot
# (Fork A) — NO separate renner_office node.

# ─── Player ───────────────────────────────────────────────────────────────────

[player]
id          = "player"
name        = "Wren"
description = "A Vance Dynamics asset. She serves the company and the man who owns her, and she's good at it. The only thing she feels is the sex she's used for — everything else is quiet. She believes that's all she's ever been."
portrait    = "wren.jpg"
customizable = false   # fixed identity — protects the Wren / buried-Vesper reveal

[player.core_traits]
# LIVE meters (surfaced): energy = Charge, money = Credits.
energy     = 100      # "Charge" — spent on actions/travel, restored at the cradle
money      = 50       # "Credits" — deliberately light (a kept asset is provided for)
# CAPABILITY (Tier-3 custom) — she drills these in secret (activity_train, 3_activities). The want:
# stop being helpless / get where she can't yet. NOT yet surfaced as sidebar bars: held until the
# Facility guard READS them (the dead-meter rule — bars + reader land together, next piece).
# fighting = win a guard fight; stealth = slip past / go deeper.
fighting   = 0
stealth    = 0
# BURNED-YARD crawl state (internal, hidden): yard_depth = how deep she's pushed (odometer 0->3,
# gates the finds); weapon_repair = sessions spent fixing the found arousal weapon (0->3 -> ready).
yard_depth    = 0
weapon_repair = 0
# UNDERWORLD currency — her own money, the company can't see. Earned (brothel/pit), spent (gate toll +
# black market). Surfaced as a counter (0_systems). The "second life" — no leash on what's hers.
coin          = 0
# WEAPON LOADOUT + CHARGES (internal, hidden). equipped_weapon = which weapon she's carrying: 1 = drain,
# 2 = emitter — ONE at a time (one core feeds one weapon; swap at the bench in wren_room). Starts on the
# drain (her only weapon until the emitter is found in the burned yard + repaired). Each weapon holds shots;
# firing spends; reloaded at the cradle via the two dedicated Recharge actions (NOT Power down / Charge up).
# drain_charge = the truth-drain (1 shot). arousal_charge = the emitter (3 shots; starts 0, set to 3 when
# the weapon is repaired). Separate from hygiene (the body) — these are the gear.
equipped_weapon = 1
drain_charge   = 1
arousal_charge = 0
# DORMANT engine always-ons (hidden via 0_systems). corruption left DEAD (her axis = the
# awakening, not a meter). arousal/hygiene unused.
corruption = 0
arousal    = 0
hygiene    = 100
# Sex-loop state (NUMERIC, hidden) — shared machine; reset to 0 on loop entry + finisher exit.
# sex_finisher_type: 0=facial · 1=inside(vaginal) · 2=ass(anal=the drain) · 3=body.
sex_stage         = 0
loop_npc_pleasure = 0
sex_finisher_type = 0
anal_active       = 0
sex_entry_origin  = 0
# Renner drain counter (hidden). +1 each drain (first + repeats); gates the post-drain awakening.
drains_done       = 0
# UNDERWORLD HUNT gate marker (hidden). Set=1 at the Renner drain (BOTH branches); gates the whole hunt
# (the Sol lead reads names_known>=1). A TRAIT not a flag: the drain setter (loop_renner_finisher) is
# triggerless, so a triggerless is_true FLAG would hard-fail the flag-chain validator; a gte trait is exempt.
names_known       = 0

