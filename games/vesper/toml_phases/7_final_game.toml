[[canvases.nodes]]
id   = "base"
name = "The bartender"
blocks = [
  { type = "image", props = { file = "scenes/underworld_bar_bartender.jpg", description = "A dim underground bar, red light, an old bartender working the taps at the quiet end, unhurried.", search_queries = ["dim underground speakeasy bartender red light", "noir back-alley bar bartender low light"] } },
  { type = "paragraph", content = "Sol works the taps at the dim end of the bar, wiping a glass that's already clean. He's outlasted every owner this place has had — and it's had a few, though the one it answers to now never shows his face. He looks at her the way he looks at regulars, not an owner, not a mark. He hears everything said over his counter down here and repeats none of it, unless you're the kind he's decided he likes." },
]
