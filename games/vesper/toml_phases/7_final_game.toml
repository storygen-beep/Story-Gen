id   = "ask"
name = "The bartender"
blocks = [
  { type = "dialog", props = { speaker = "player" }, content = "Two men. Doss and Rourke. They came up out of the underworld before they ever ran for Renner. You'd have known them." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_sol" }, content = "Doss I knew. Ran cargo for the company back when it still pretended it didn't. Renner made an example of him — him and Rourke both, and it took. But Doss ran with a third. A fixer, name of Marsh. Careful little man, and still breathing." },
  { type = "dialog", props = { speaker = "player" }, content = "Where." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_sol" }, content = "He keeps one habit. The House, every Sunday — same girl, like clockwork. That's the only place Marsh surfaces. A man with one habit's got one weakness." },
  { type = "paragraph", content = "He sets the clean glass down. A name, a day, a door — the whole of it. Then, not looking up: \"Whatever you carry that does your quiet work — carry it Sunday. Marsh doesn't talk twice.\"" },
]
