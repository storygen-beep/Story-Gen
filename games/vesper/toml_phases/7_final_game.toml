# ── Hunt breadcrumb — Rung 2 (Story-Goals, priority 9). Points to Rue + the Sunday drain. Mutually
# exclusive with rung 1 via hunt_lead; retires at crew_known (rung 3 lands with beat_0033).
[[quest_cards]]
priority   = 9
text       = "The fixer Marsh keeps one habit — The House, every Sunday night, Rue's standing booking. Get the madam to take you on, and each Sunday she'll hand you that night's booking if you ask. Serve him and drain him — finish in his ass, the drain worn and charged — for where the crew went to ground."
tip        = "One Sunday, start to finish. FIRST recharge the drain at your cradle — the Renner drain emptied it. Then, at The House (down in the underworld): meet Rue, ask her for work, and on a SUNDAY BEFORE 20:00 ask her for that night's booking — she only gives you the one night, so ask again any week you miss. Marsh arrives 20:00 to close: take him, finish in his ass, the drain fires. Don't power down between arranging it and serving him — sleeping rolls the day and the arrangement lapses."
when = [
  { flag = "hunt_lead",  op = "is_true"  },
  { flag = "crew_known", op = "is_false" },
]

# ═══ beat_0033 — THE CREW'S ROOMS (find Bastien) ═══════════════════════════════
# Solo canvas at crew_den (unlocked by crew_known). The search IS the scene (content floor). Finds
# the name Bastien -> SETS bastien_found -> routes DIRECTLY to the grab (beat_0034) — deterministic,
# no reliance on auto-fire timing (the grab is ALSO an auto-fire on bastien_found, as a fallback).
# Gated crew_known is_true + bastien_found is_false.
[[canvases]]
id          = "hunt_crew_den_search"
name        = "The crew's rooms"
description = "Search the dead crew's rooms -> the name Bastien surfaces. SETS bastien_found + routes to the grab. Gated crew_known + bastien_found is_false."
[canvases.trigger]
location      = "crew_den"
is_repeatable = true
priority      = 6
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "crew_known",    operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "bastien_found", operator = "is_false" },
] }
[[canvases.nodes]]
id   = "base"
name = "The crew's rooms"
blocks = [
  { type = "image", props = { file = "scenes/crew_den_interior.jpg", description = "A ransacked dead-still tenement room, dust and abandoned belongings, dim light through a boarded window.", search_queries = ["abandoned ransacked room dim dust", "cleared out tenement dark boarded window"] } },
  { type = "paragraph", content = "The key's under the third stair, like Marsh said. Inside, the rooms have the stillness of a place people left fast and never came back to — a card game abandoned mid-hand, a coat that fits no one now, a fridge that gave out weeks ago and was never opened since. Doss and Rourke lived here, and died somewhere else. She takes the place apart the way she takes everything apart: cold, thorough, patient." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Take the place apart."
targetType = "node"
nodeId     = "hunt_crew_den_search.find"
[[canvases.nodes.exit_block.choices]]
text       = "Not yet."
targetType = "location"
locationId = "underworld_strip"

[[canvases.nodes]]
id   = "find"
name = "A name"
blocks = [
  { type = "paragraph", content = "It's in a strongbox behind the water heater — the one thing in the place worth locking. A run of ledgers, tallies of cargo that never touched a legal dock, and a name at the top of every page: the man the crew answered to, whose coin moved through Doss's hands and out into the company's blind spots. Not Cain. Someone she's never heard of. Bastien." },
  { type = "paragraph", content = "She has it now — a person at the end of the trail, a place to put the hunt. She pockets the ledger and turns for the stair." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Bastien. Take the ledger and go."
targetType = "node"
nodeId     = "hunt_the_grab.base"
flagEffects = [
  { targetType = "player", flag = "bastien_found", op = "set" },
]

# ── Hunt breadcrumb — Rung 3 (Story-Goals, priority 9). Points to the crew's rooms. Retires at
