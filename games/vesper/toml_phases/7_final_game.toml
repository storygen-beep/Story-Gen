# (version=1.0). Fires the render after the verdict teleports her here. Mercer over COMM (dialog speaker, not
# physically present). He's WARY FIRST — she went dark, came back with someone else's hands on her (lands
# against the chip reveal: HE holds her leash, now he's eyeing her like she's contaminated) — then grudgingly
# dispatches Calloway as a PLAIN company job (NO build-file fusion; the room is Mercer's target, not her cure).
# Her private reason rides under it now: the LEASH — every order sits on the floor that he owns her off-switch,
# and getting the controller is her real drive. Calloway's ARC stays the frontier (next chunk); this drops the
# lead only. Dialogue-forward. SETS salvage_relaunched.
