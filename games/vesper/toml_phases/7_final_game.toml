] }

[[canvases.nodes]]
id   = "base"
name = "New target"
blocks = [
  { type = "image", props = { file = "scenes/salvage_relaunch.jpg", description = "A woman standing upright on a grey waterfront at morning, the stacked towers of a corporate city behind her across the water.", search_queries = ["woman standing dock city skyline grey morning", "figure waterfront corporate skyline overcast"] } },
  { type = "paragraph", content = "She comes up the ramp into the grey morning, and the comm in her jaw clicks live before she's ten steps clear — Mercer, who always knows the minute she's operational again." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "You went dark. Days. I don't like dark, and I like even less what walks back out of it. Who put hands on you." },
  { type = "cascade", props = { beats = [
    { advance_text = "Answer him.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "A mechanic. Off the books. I'm operational." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "A mechanic. You let some dockside butcher open you up and go rooting around in company property. You have any idea what you're worth. What's in you." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "More than you'll ever say out loud. I've met the part you keep the key to." },
    ] },
    { advance_text = "Take the order.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "New target. Calloway — Vance Securities, internal division. He runs the hunt for the rogue from the inside, and he keeps a file room nobody audits. Get in. Bring me what's in it." },
    ] },
    { advance_text = "Say yes.", blocks = [
        { type = "paragraph", content = "She says yes the way she says yes to everything. But it sits on a new floor now. Every order he gives her, he gives holding the one key that can cut the thing at the root of her — and he's never once had to say so, because until three days ago she didn't know it was there. Now she does. It doesn't change the yes. It changes what she's saying yes for." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "You still in one piece?" },
        { type = "dialog", props = { speaker = "player" }, content = "Operational." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "Then move. And Wren — next time you break, you break to me. Not to some yard rat. What's mine gets fixed by mine. Understand." },
    ] },
  ] } },
]

