# ═══ salvage_mercer_shocked — beat_0053b (v2), Mercer won't use a broken asset (mid-repair) ═══
# Auto-fire @penthouse, pri 8, ONE-SHOT (is_repeatable=false — the engine renders auto-fire events as
# one-shots; this is the dramatic first encounter), gated salvage_entered is_true + salvage_done is_false +
# mercer_hub_open is_true (so it only fires post-captivity, mid-repair, and out-priorities the standing
# mercer_penthouse_hub, pri 5). If she goes UP to Mercer while still broken, he's SHOCKED + refuses to send
# her out and EJECTS her -> the_waterfront (exit to a DIFFERENT location so it can't re-fire). The in-fiction
# reason the grind exists: a broken asset doesn't get sent out. Lands against the verdict (HE holds her leash).
# Sets nothing (one-shot guard). Dialogue-forward. NB "leash" is reserved for the chip — Mercer never says it.
[[canvases]]
id          = "salvage_mercer_shocked"
name        = "Not like this"
description = "beat_0053b (v2). Mercer won't use a broken asset. Auto-fire @penthouse, pri 8, one-shot, gated salvage_entered is_true + salvage_done is_false + mercer_hub_open is_true. If she visits Mercer mid-repair he's shocked at her state, refuses to send her out ('get yourself right'), and ejects her to the_waterfront. The in-fiction reason she must grind the repair before she can work. Sets nothing."

[canvases.trigger]
location      = "penthouse"
is_repeatable = false
priority      = 8
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "salvage_entered", operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "salvage_done",    operator = "is_false" },
  { type = "flag", subject = "player", flag_key = "mercer_hub_open", operator = "is_true"  },
] }

[[canvases.nodes]]
id   = "base"
name = "Not like this"
blocks = [
  { type = "paragraph", content = "The lift opens on the penthouse and Mercer looks up from the glass wall — and stops. Whatever he keeps her for goes out of his face and something colder comes in. He crosses the floor and takes her jaw in one hand, turning her face to the light like a man checking a coin for a file-mark." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "What did they do to you." },
  { type = "cascade", props = { beats = [
    { advance_text = "Say nothing.", blocks = [
        { type = "paragraph", content = "She doesn't answer. There isn't an answer that helps her. He turns her head the other way, reading the wrongness off her the way she reads it off a man — except he had the building of her, and he knows the manual." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "You go dark for days, you come back moving like that, the core reading wrong through your skin. No. An asset that limps is a liability, and I don't hand the Chairman a liability." },
    ] },
    { advance_text = "Hear the refusal.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "You get nothing from me like this. No target, no work, nothing — I'm not spending you broken. Go get yourself right, then come back and work. Not before." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_mercer" }, content = "Now get out of my sight." },
    ] },
    { advance_text = "Go.", blocks = [
        { type = "paragraph", content = "The lift takes her back down. She has her answer, and it's the one the dock already gave her: there's no working her way back in until she can fire. Which means the berth. Which means coin. Which means down the gate, where coin gets made." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "location"
text = "Back down."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "the_waterfront"

