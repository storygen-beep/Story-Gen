[[canvases.nodes]]
id   = "base"
name = "The body won't hold"
blocks = [
  { type = "image", props = { file = "scenes/salvage_waterfront_dawn.jpg", description = "A woman down on one knee on wet dock boards at dawn, one leg not answering under her, grey water and container cranes behind.", search_queries = ["woman kneeling dock dawn grey", "figure collapsed pier morning industrial"] } },
  { type = "paragraph", content = "The phone in her hip buzzes before the light's full up. Mercer's summons — the pattern she answers on reflex, before she's decided anything. She gets her feet under her to go in and report. The bad leg folds and puts her down on one knee." },
  { type = "cascade", props = { beats = [
    { advance_text = "Try the other road.", blocks = [
        { type = "paragraph", content = "The other road, then. Renner's depot, cheap hands, the cover she can still wear. She reaches back for the drain to check it's seated, and it answers cold — a dead click where the charge should catch. Nothing takes." },
    ] },
    { advance_text = "Take stock.", blocks = [
        { type = "paragraph", content = "Both roads want a body that works. Hers doesn't. The leg holds if she never asks it to turn; the drain seats but won't fire; the core sits wrong behind her sternum, a low fault she can feel the edge of and can't reach." },
    ] },
    { advance_text = "Consider the company.", blocks = [
        { type = "paragraph", content = "The company fixes assets. She knows exactly what fixing is: the techs open her up on the bench, find the fault, and take her back to spec." },
    ] },
    { advance_text = "Count what that costs.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "Back to spec is back to nothing. The four words go. The name that fit a lock she didn't know she had — filed, overwritten, gone." },
        { type = "paragraph", content = "And she finds she does not want that. She does not look at why." },
    ] },
    { advance_text = "Let it ring.", blocks = [
        { type = "paragraph", content = "So she doesn't call it in. The summons rings out unanswered — the first order in her life she's let go dark. No one's watching. No one will know until it's already done." },
    ] },
    { advance_text = "Go off the books.", blocks = [
        { type = "paragraph", content = "There's underworld talk of hardware worked off the books: a ship-breaker down past the gate, in the underground, who takes machines the company can't see and asks the wrong questions for the right coin. The berth's down there, off the strip. She goes to find it." },
    ] },
  ] } },
]

