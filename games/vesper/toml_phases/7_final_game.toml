# Dormant engine always-ons. corruption is NOT hidden — it's the NPCs' LIVE seduction axis
# (Renner's corruption, surfaced on the Quests page); the PLAYER's corruption stays dead at 0 (the
# inversion — visibly stuck at zero while his climbs). arousal/hygiene unused + hidden.
[[traits.labels]]
key    = "arousal"
hidden = true
[[traits.labels]]
key    = "hygiene"
label  = "Condition"

# Sex-loop state — internal numeric machine, never shown (5 traits, blueprint Renner loop).
[[traits.labels]]
key    = "sex_stage"
hidden = true
[[traits.labels]]
key    = "loop_npc_pleasure"
hidden = true
[[traits.labels]]
key    = "sex_finisher_type"
hidden = true
[[traits.labels]]
key    = "anal_active"
hidden = true
[[traits.labels]]
key    = "sex_entry_origin"
hidden = true

# fighting/stealth/coin are NO LONGER hidden — they now surface in the auto Traits list (bars removed).
# yard_depth/weapon_repair stay hidden — internal crawl state, never player-facing.
[[traits.labels]]
key    = "yard_depth"
hidden = true
[[traits.labels]]
key    = "weapon_repair"
hidden = true
# Weapon charges — internal; the fire choices' locked_text / hide-when-empty communicate the state.
[[traits.labels]]
key    = "drain_charge"
hidden = true
[[traits.labels]]
key    = "arousal_charge"
hidden = true
# Weapon loadout — internal. equipped_weapon = which weapon she's carrying (1 = drain, 2 = emitter).
# One at a time (one core feeds one weapon); the swap activity + the fire gates communicate the state.
[[traits.labels]]
key    = "equipped_weapon"
hidden = true
# Drain counter — internal. +1 on each Renner drain (first + repeats). Gates the post-drain awakening
# (glitch_recurrence_ii) as a TRAIT so the validator doesn't demand a located flag-setter (the drain now
# fires inside the triggerless hub loop).
[[traits.labels]]
key    = "drains_done"
hidden = true
# Underworld Hunt gate marker — internal. Set=1 at the drain (both branches); gates the hunt. Never player-facing.
[[traits.labels]]
key    = "names_known"
hidden = true

