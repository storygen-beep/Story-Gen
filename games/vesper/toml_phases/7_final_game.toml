  { type = "dialog", props = { speaker = "npc", npcId = "npc_renner" }, content = "Whatever you are — cop, fed, one of theirs — I've got nothing to say to it. Off my stool." },
  { type = "paragraph", content = "He turns his shoulder and that's the end of it. Dressed like this she's not cheap hands; she's a question, and a man this far down doesn't answer questions. She'd have to come at him as something that doesn't get a second look — the cover's in her quarters, and it does her no good on the rack." },
]

