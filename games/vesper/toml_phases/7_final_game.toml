  { type = "paragraph", content = "She comes to upright in a chair that isn't restraining her, which is its own kind of message. A back room, warm light, a door that's shut and not locked. Across a plain table a man watches her with the patience of someone who owns the building and everything in it — unhurried, certain, a voice that will never have to be raised because the room is already his." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Wren. That's the file Mercer keeps you under, so it's the one I'll use. You've been busy. Doss. Rourke. My man Marsh, who woke up Monday poorer and stupider and can't tell me why. A great deal of digging, for one of Mercer's assets — into people who are mine." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "Don't reach for whatever cover you had ready. I knew you were Mercer's before you finished your first drink down here; I hear things before they're said. That isn't what interests me." },
  { type = "paragraph", content = "He leans in, unhurried, and doesn't threaten her — doesn't reach for anything. He looks at her the way you'd look at the first genuinely interesting thing to cross your desk in years." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_bastien" }, content = "What interests me is that when my man watched you leave The House, he swore the girl who walked out wasn't quite a girl. And my people are very rarely wrong about the things that unsettle them. So before I decide what you're worth — to me, and to the people I answer to, who'd pay a great deal for the honest answer — I'll ask you plainly. What are you, really?" },
  { type = "paragraph", content = "The question hangs. She has covers for men who want her body and men who want her obedience, and none at all for a man who wants the one thing under the chip she can't reach herself. Somewhere below the amputation, something turns over at being seen. She doesn't answer. He reads the not-answering, nods as though it told him plenty, and lifts two fingers — and the bag comes down again." },
  { type = "paragraph", content = "Hands under her arms. A stair, and then further down than a stair should go. The salt smell of the docks thins out and stops. Somewhere in the dark someone finds the seam at the base of her spine, working it the way a man works a jar lid, patient, until it gives — and the weight of the drain comes off her and does not come back. She goes under before she can count the turns." },
