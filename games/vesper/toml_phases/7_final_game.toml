        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "But I told you there was something down there I didn't like. I had my proper look while I had you open. And here's the thing — it's not damage. Everything else they broke or wore out. This they built." },
        { type = "dialog", props = { speaker = "player" }, content = "Built what." },
    ] },
    { advance_text = "Hear it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "A governor. A bad-tempered little piece of hardware seated under your core, older than the rest of you, wired so deep it's part of the frame. It's not there to run you. It's there to stop you — one specific thing you're built so you cannot do." },
    ] },
    { advance_text = "What thing.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "There's a man you can't point your teeth at. You read every other body I put on this cradle by the end — but the one who owns you, you couldn't drain him if he was open on this table in front of you. That's not you being loyal. That's not you being scared. That's this." },
    ] },
    { advance_text = "Take it out, then.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "Then take it out." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Can't. It's keyed — pull it blind and it takes you with it, and I don't do wakes. There's a controller for it somewhere. A key. Whoever holds it cuts it clean in a minute. I don't have it. You don't. Not my business whose it is." },
    ] },
    { advance_text = "You already know whose.", blocks = [
        { type = "thought_bubble", props = { speaker = "player" }, content = "He signs for me. He's held the key the whole time." },
        { type = "paragraph", content = "She doesn't ask him whose. She already has the shape of the answer, and it's the shape of the man whose name is on her papers — the one who's spent every order she ever took knowing she could never turn and make him stop." },
    ] },
    { advance_text = "Feel it settle.", blocks = [
        { type = "paragraph", content = "Something settles into place at the root of her that isn't comfort. She can feel exactly where it sits now — a locked thing, one door, and no key on her side of it. She'll carry it. A thing she can see is a thing she can carry." },
    ] },
    { advance_text = "Settle up.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "We're square — you paid as you went, most don't. Go on. You've got a key to find." },
    ] },
    { advance_text = "Stand up.", blocks = [
        { type = "paragraph", content = "She stands off the cradle. The leg holds, the drain sits true. For the first time she knows the exact shape of the thing that's owned her — not a feeling, a component, with a key, and the key is somewhere she can walk to and take. That isn't despair. It's a map." },
    ] },
    { advance_text = "And under that.", blocks = [
        { type = "paragraph", content = "And under that, further down, the name from the leak — the one syllable that fit her like a socket and then slipped. She still can't hold it. She's just stopped being able to stop reaching for it." },
    ] },
  ] } },
]

