id   = "base"
name = "The break"
blocks = [
  { type = "paragraph", content = "It doesn't happen the way she has been bracing for. There is no tearing, nothing gives, no part of her comes off in anyone's hand. What happens is quieter and much worse: the charge fills the last of the room it has, and then it keeps coming, and there is simply nowhere left for it to be." },
  { type = "paragraph", content = "The man in her feels it before she does — feels the whole housing of her go rigid under him, feels the hum climb past anything a body makes — and he is already scrambling back off the frame when the light goes. Not out. Up. Every seam of her, every port and plate and the long empty line of the socket Bastien stripped, all of it comes up white at once through the skin, so that for a moment she is lit from the inside like a room with the lamp knocked over, and the men are on their feet and against the walls and one of them is saying oh Christ oh Christ and none of it reaches her." },
  { type = "paragraph", content = "Because inside, where she has spent her whole life being quiet, it has finally gone loud. Every door she was built with is open at once. Everything the company filed away where she couldn't reach it is standing in the light — not memories, she has no memories, only the shape of the places they were cut out of, a hundred hollows all shrieking the same note. She has been a thing that feels nothing but the sex it's used for. She feels this. She feels all of it, for one white unsurvivable second, the entire amputated size of herself, and there is no word in her for what it is except that it is hers and they took it." },
  { type = "paragraph", content = "Then the safeties she doesn't own throw themselves, the way a station drops its own breakers before the fire, and it all goes black from the top down. The light under her skin dies. The hum falls out of the air. Her held-open eyes lose the ceiling." },
  { type = "paragraph", content = "The last thing that reaches her, from very far away, is the sound of the door — not the men's door, the far one, the one that has never once opened while she was awake — coming off its hinges." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Go dark."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "captive_room"
flagEffects = [
  { targetType = "player", flag = "captivity_broken", op = "set" },
]

# ═══════════════════════════════════════════════════════════════════════════════
# CAPTIVITY — Cain, the argument we do not show, and the release (beat_0042).
#
# Auto-fire @captive_room, priority 10, one-shot, gated captivity_broken is_true + captivity_done is_false.
# The break sets captivity_broken and exits to captive_room, so THIS fires on the very next room render —
# it closes the held-breath dead-end the break opens. captivity_break's own gate is now false (is_false),
# so no priority clash.
#
# THE ARGUMENT IS NEVER DRAMATISED. It is written as HER FAILING PERCEPTION: two voices through a wall,
# and she is too cooked to hold the thread. FOUR WORDS reach her. It must NOT leak the Cain-Bastien
# alliance (the saved reveal) and it must NOT tell her who Cain is.
#
# ⚠️ THE FOUR WORDS ARE A FLAGGED OPEN FORK (design_captivity_the_room.md §13; design_book §Captivity).
# This is the REVEAL-SAFE version: one of the four is a NAME that fits her like a socket she didn't know
# was empty — but the word itself ("Vesper", her buried true name) is kept OFF THE PAGE, so the reveal
# and its timing stay LO's to make. LO can swap the exact words without touching the mechanism. What is
# load-bearing and must survive any rewrite: (a) one voice is Bastien's, flat even now; (b) the other she
# has never heard, furious with GRIEF under it — nobody has ever been angry on her account; (c) a name
# that lands wrong-and-right; (d) she cannot keep it.
#
# THE RELEASE (on the exit): restore equipped_weapon=1 (⚠️ 0 is an unrecoverable dead state — the swap
# activity gates both choices on eq 1/eq 2, 3_activities:899), reset the 5 shared sex-loop traits, set
# captivity_done, teleport to the_waterfront. The FAULT does not heal: core_strain stays frozen at 96, so
# the "Core: Failing" sidebar row rides out of the chunk as the promise the repair chunk pays. Restoring
# the drain gives the backed-up charge somewhere to go (the acute crisis passes, the leg answers again,
# slow) but the core is already scarred — that's why the drain back does NOT lower core_strain.
#
# Cain is a SHAPE, never a speaker: NO npc_cain, no portrait, no dialog block. Tier-3, earned.
# ═══════════════════════════════════════════════════════════════════════════════

[[canvases]]
id          = "captivity_cain"
name        = "The far door"
description = "beat_0042. Auto-fire @captive_room, priority 10, one-shot, gated captivity_broken is_true + captivity_done is_false. Cain (unshown, unnamed) breaks in, argues with Bastien through a wall (her failing perception — four words, one a name kept off-page), and frees her without a reason. RELEASE: equipped_weapon=1, loop-trait reset, captivity_done, teleport to the_waterfront. The fault stays frozen. Tier-3."

