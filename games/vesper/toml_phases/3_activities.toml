# Phase 3/7 — 3_activities.toml
# Vesper — solo activities / structural movement. beat_0001 (scaffold): the two travel
# activities that bridge the parallel street-hub roots (Spire Plaza <-> The Waterfront) so
# the map is connected and the build proves green. The day-router (cradle), Renner's depot
# work, and the rest land at their plan beats (0006 / 0007).

# ─── Travel: Spire -> Reach ───────────────────────────────────────────────────
[[canvases]]
id          = "activity_travel_to_reach"
name        = "Take the car to the Reach"
description = "Wren-solo. Spire Plaza -> The Waterfront. Costs time + charge (the leash bites — schedules matter)."

[canvases.trigger]
location      = "spire_plaza"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Take the car to the Reach"
blocks = [
  { type = "paragraph", content = "A company car waits at the curb, engine idling. She gives the docks address and it pulls out without a word. The Spire's glass falls away behind her; the city gets lower, wetter, dirtier the whole way down." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Ride down to the Waterfront."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_waterfront"
time_progression_minutes = 30
effects = [
  { targetType = "player", trait = "energy", op = "add", value = -10 },
]

# ─── Travel: Reach -> Spire ───────────────────────────────────────────────────
[[canvases]]
id          = "activity_travel_to_spire"
name        = "Take the car to the Spire"
description = "Wren-solo. The Waterfront -> Spire Plaza. Costs time + charge."

[canvases.trigger]
location      = "the_waterfront"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Take the car to the Spire"
blocks = [
  { type = "paragraph", content = "She calls the car. The docks recede behind her; the towers climb back up until the glass swallows the sky again. Home, if that's the word for the place that owns you." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Ride up to the Plaza."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "spire_plaza"
time_progression_minutes = 30
effects = [
  { targetType = "player", trait = "energy", op = "add", value = -10 },
]

# ─── beat_0006 — Home base: the cradle ────────────────────────────────────────
# The day-router (the ongoing free reset — power down, advance ~9h, wake charged) + the
# chip/memories view (seeded-empty, the greyed FRAGMENT 01 slot = the visible next rung).
# Both gated opening_done (after the on-rails opening hands the city over).

# The day-router — power down at the cradle, wake charged. The reset that makes the daytime
# (Renner's depot 09:00-18:00) reachable from an evening start.
[[canvases]]
id          = "activity_recharge"
name        = "Power down"
description = "Wren-solo. The cradle. The day-cycle reset — powers down, advances ~9h, wakes her at full Charge. Gated opening_done; the opening's night/morning one-shots run first."

[canvases.trigger]
location      = "cradle"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "05:00"

[[canvases.nodes]]
id   = "base"
name = "Power down"
blocks = [
  { type = "paragraph", content = "She settles back into the cradle. The contacts find their points along her spine, cold and familiar. The room dims as the charge takes her down, and the quiet closes over the top of her like water." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Power up."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "cradle"
time_progression_minutes = 540
effects = [
  { targetType = "player", trait = "energy", op = "add", value = 100 },
]

# The chip / memories view — seeded-empty, the greyed FRAGMENT 01 slot (the visible next
# rung; fills at the_site, frontier). The unconscious self-labelling = the awakening seed.
[[canvases]]
id          = "canvas_chip_view"
name        = "The memory store"
description = "Wren-solo at the cradle. The memories UI — EMPTY in chunk, one greyed locked slot (FRAGMENT 01). The chip fills at the_site (frontier). Repeatable; gated opening_done."

[canvases.trigger]
location      = "cradle"
is_repeatable = true
priority      = 2
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "The memory store"
blocks = [
  { type = "paragraph", content = "She opens the store the company gave her for what it calls recovered assets — the place a restored memory would go, if she ever recovered one. It's empty. It has always been empty." },
  { type = "paragraph", content = "There is one slot in it, greyed out, labelled in a hand that isn't the company's: FRAGMENT 01 — LOCKED. She doesn't remember making the label. She closes the store — and notices she's opened it more often than the task log would ever justify, and files that under nothing, the way she files everything she can't afford to have." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Close it."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "cradle"

# ─── beat_0013 — the facility investigation host (Lane-3 solo) ─────────────────
# The Mission-1 location leg. Repeatable explore; the one-time 'that's mine' match beat
# (inv_facility_match, 2_one_shots) auto-fires on entry once renner_hired.
[[canvases]]
id          = "inv_facility_explore"
name        = "Walk the wreckage"
description = "Wren-solo Lane-3 investigation at facility_ruins. The dread-place. Gated opening_done. The 'that's mine' match beat fires separately (auto-fire, once renner_hired)."

[canvases.trigger]
location      = "facility_ruins"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "Walk the wreckage"
blocks = [
  { type = "image", props = { file = "locations/facility_ruins.jpg" } },
  { type = "paragraph", content = "The facility is a black skeleton against the dock lights — scorched frame, melted racks, the smell of old smoke that never washed out. She walks it the way she walks everything, cataloguing: where the containment was, where the fire started, what the dead machines used to do. None of it matches the briefing. All of it was built to hold things that could feel — and someone came through and let them out before he burned it down. The dread-place. The first one." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Done here."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "facility_ruins"
