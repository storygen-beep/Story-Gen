# ═══ activity_buy_taser — beat_0104 (rev 154). The cheapest thing on the table. ══════════════════════════
# Wren-solo @underworld_market. Repeatable trigger, pri 3, gated bastien_drains_done gte 1 + taser_held lt 1.
#
# ⚠️ SHE ALREADY HAS A WEAPON AND CANNOT USE IT, AND THE CARD SAYS WHY IN THE FICTION RATHER THAN IN A GATE.
# Two shipped facts do the work. (1) ONE CORE, ONE WEAPON — the game states it in its own prose at the
# loadout bench: "it feeds the drain inside her or the thing in her hand, never both at once". She needs the
# drain live for Bastien, so the emitter is switched off and at home every night she works. (2) The emitter
# is company hardware and Bastien goes through her coat lining, cuffs and the seam under the arm EVERY visit
# — a Vance field emitter found on a barmaid ends the cover in one beat. So the answer is a thing that runs
# off nothing and looks like what every woman working a floor down here carries.
# ⚠️ AND THE EMITTER WOULD NOT HELP ANYWAY. It is an AROUSAL FIELD, not a gun: "whoever's in reach goes
# stupid with it inside a breath". It buys her a way past one man by fucking him. It does not put anybody on
# the floor, which is the only thing she is going to need.
# ⚠️ 30 COIN — cheap on purpose, against the 40-coin edged weapon on the same row and the 120 she paid for
# the face. This is not an investment, it is a thing she picks up because it is there.
# ⚠️ taser_held IS NOT ON THE equipped_weapon AXIS. That axis is the one-core-one-weapon loadout; the whole
# design point is that this competes with nothing. See 0_systems_spec.
# MEDIA: reuses locations/underworld_market.jpg.
[[canvases]]
id          = "activity_buy_taser"
name        = "Something that runs off nothing"
description = "beat_0104 (rev 154). Wren-solo @underworld_market. Repeatable trigger, pri 3, gated bastien_drains_done gte 1 + taser_held lt 1. Buy = 30 coin -> taser_held = 1, +30 min. She has a weapon and cannot use it: one core one weapon means the emitter is off whenever the drain is live, and a Vance field emitter would not survive a pat-down that goes through the lining, the cuffs and the seam under the arm. It would not help anyway — the emitter is an arousal field that buys her past one man by fucking him, and does not put anybody on the floor. 30 coin against the 40-coin edged weapon on the same row: not an investment, a thing she picks up because it is there."
[canvases.trigger]
location      = "underworld_market"
is_repeatable = true
priority      = 3
is_active     = true
# ⚠️ beat_0117 (rev 168) — GATED ON plan_made, NOT ON THE DRAIN, AND THAT IS THE WHOLE POINT.
# It used to open on bastien_drains_done gte 1, which meant the card could be found and paid for before
# anything in the game had made her want it — the player read the reasoning in this canvas's own prose AFTER
# already walking to the market. That is exactly the rev-143 defect ("she just goes on to buy the second part
# out of the sudden"), where diagnosis landed after purchase for four cycles running. cap_the_wait @the_cot
# is where she works out she cannot be empty-handed, and it sets plan_made; the reason now always precedes
# the purchase, and this card cannot exist before the decision that motivates it.
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key  = "plan_made",  operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "taser_held", operator = "lt", value = 1 },
] }

[[canvases.nodes]]
id   = "base"
name = "Something that runs off nothing"
blocks = [
  { type = "image", props = { file = "locations/underworld_market.jpg", description = "Dim black-market stalls under a low ceiling, weapons and gear laid on cloth, cages further back.", search_queries = ["black market weapons stall dim", "underground arms bazaar cages back"] } },
  { type = "paragraph", content = "The blade tables want forty and she has stood at them twice and walked off twice, because a knife in that room is a thing she would have to be willing to use on a man she needs conscious." },
  { type = "paragraph", content = "What she is actually short of is the emitter, and the emitter is not an option. One core feeds one weapon and the drain has to be the one that is live, every night she goes in — and a Vance field unit in her coat would come out of it at the door, in front of the room, in a man's hand." },
  { type = "paragraph", content = "So: the box at the end of the row with the cheap gear in it, where a hand-taser is thirty coin and every woman working a floor down here has one." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
