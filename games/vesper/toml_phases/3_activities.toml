# ═══ activity_sift_the_ruin — beat_0107 (rev 157). The one thing left to do. ════════════════════════════
# Wren-solo @underworld_bar. Repeatable, pri 3, gated raid_done is_true.
#
# ⚠️ THIS CANVAS EXISTS BECAUSE 0.1.8 ENDED AND OPENED NOTHING. cap_extraction set two flags and its chain
# reached no standing content, so the player finished the story and had nothing to do — the v2 gate says it
# in structural terms and it is the single defect this whole release was scoped against. The Face must not
# repeat it, and this is the surface that stops it: after the last scene there is still a room to go back to.
#
# ⚠️ IT IS A CARD AT underworld_bar, NOT A NAV CARD ON THE ROOM, and that is deliberate. Giving
# bastien_backroom an entry_from would put a card for it on the Undertow's nav grid from the START OF THE
# GAME — locked, but visible — which leaks a saved reveal to an Act-1 player who is at that moment being
# held in a cell by the man who keeps it. Reaching it by an explicit canvas is the same shape
# bastien_door_search used, for the same reason, and it costs nothing.
# ⚠️ THE GOOD PAPER IS GONE — LO's call. The units took what was worth taking, so what is left is the junk
# Bastien sold for cash. That is why this is a crawl and not a library: she is going through a burned floor
# looking for the few sheets that matter among thousands that do not.
# ⚠️ AND WHAT SHE FINDS IS THE NEXT RELEASE, NOT THIS ONE. Names off her own index — the second date column,
# the ones they stopped. No answers, no addresses, no Cain. Three exclusive bands on ruin_depth, the crawl's
# OWN counter — see the node header for why borrowing yard_depth was a bug and not a shortcut.
# ⚠️ SOL IS ALIVE AND THAT IS ALREADY IN THE RAID: the bar emptied before the units reached it — "a room
# deciding all at once to be somewhere else" — so nobody who worked that floor was in it. He lets her back
# in because she is the only one who came back at all.
# MEDIA: reuses scenes/backroom_burning.jpg — the raid's own slot, the one asset this game reuses on purpose.
[[canvases]]
id          = "activity_sift_the_ruin"
name        = "Go back through the door"
description = "beat_0107 (rev 157). Wren-solo @underworld_bar. Repeatable, pri 3, gated raid_done is_true. THE ONE THING LEFT TO DO AFTER THE RELEASE ENDS, and the reason it exists is that 0.1.8's ending opened no standing content at all. A card at the bar rather than a nav card on the room, because an entry_from would show a locked 'The Back Room' on the Undertow grid from Act 1 onward and leak a saved reveal. The good paper is gone — the units took it — so this is a crawl through the junk Bastien sold for cash, and what turns up is names off her own index: the second date column, the ones they stopped. No answers, no addresses, no Cain. Bands on ruin_depth, the crawl's OWN counter — the first cut borrowed yard_depth, which is the Burned Yard's odometer and is already maxed by this chapter, so the first stage was dead and the first click jumped to the last. Sol is alive and lets her in, which the raid already established by emptying the bar before the units reached it."
[canvases.trigger]
location      = "underworld_bar"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "raid_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "Go back through the door"
blocks = [
  { type = "image", props = { file = "scenes/backroom_ruin.jpg", description = "A burned-out back room days after a fire, soaked ash and charred paper inches deep on the floor, an empty scorched wall where shelving stood, daylight through a broken door.", search_queries = ["burned out room ash charred paper floor aftermath", "fire damaged office soaked debris daylight through door"] } },
  { type = "paragraph", content = "The Undertow does not open in the evenings any more. Sol is in it most days with a shovel and a bucket and no particular plan, and he lets her past the tape because she is the only one of the staff who came back at all." },
  { type = "paragraph", content = "The back door is off its frame. What is behind it is a burned floor two inches deep in other people's paperwork, and most of it is worth exactly what it looks like." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Sift it. (An hour on your knees.)"
targetType = "node"
nodeId     = "activity_sift_the_ruin.sift"
costs      = [{ trait = "energy", value = 10 }]
effects = [
  { targetType = "player", trait = "ruin_depth", op = "add", value = 1, clamp = true },
]
[[canvases.nodes.exit_block.choices]]
