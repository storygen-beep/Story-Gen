description = "beat_0107 (rev 157). Wren-solo @underworld_bar. Repeatable, pri 3, gated raid_done is_true. THE ONE THING LEFT TO DO AFTER THE RELEASE ENDS, and the reason it exists is that 0.1.8's ending opened no standing content at all. A card at the bar rather than a nav card on the room, because an entry_from would show a locked 'The Back Room' on the Undertow grid from Act 1 onward and leak a saved reveal. The good paper is gone — the units took it — so this is a crawl through the junk Bastien sold for cash, and what turns up is names off her own index: the second date column, the ones they stopped. No answers, no addresses, no Cain. Bands on ruin_depth, the crawl's OWN counter — the first cut borrowed yard_depth, which is the Burned Yard's odometer and is already maxed by this chapter, so the first stage was dead and the first click jumped to the last. Sol is alive and lets her in, which the raid already established by emptying the bar before the units reached it."
