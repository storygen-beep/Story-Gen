targetType = "node"
nodeId     = "activity_buy_taser.buy"
costs      = [{ trait = "coin", value = 30 }]
effects = [
  { targetType = "player", trait = "taser_held", op = "set", value = 1, clamp = true },
]
[[canvases.nodes.exit_block.choices]]
text       = "Leave it."
targetType = "location"
locationId = "underworld_market"

[[canvases.nodes]]
id   = "buy"
name = "The taser"
blocks = [
  { type = "paragraph", content = "It is a grey plastic thing the size of her palm with a thumb-switch and a charge light that does not work. The man selling it does not ask what it is for, because down here nobody has ever had to explain that one." },
  { type = "paragraph", content = "It goes in the coat, in the lining, where he is going to look." },
