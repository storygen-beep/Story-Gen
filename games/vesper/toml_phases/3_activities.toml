# ── activity_travel_from_gate — the ride OUT of the underworld (rev 67b) ─────────────────────────
# The THIRD picker, and the gate's OWN. It used to INHERIT the waterfront's car via parent, which handed it
# that canvas VERBATIM — so the menu was wrong in two directions: it offered "Down under the docks — the
# Underworld" while she is STANDING in the underworld, and could not offer the Reach (pointless from the
# waterfront, which is where that canvas lives). Canvas inheritance walks the parent chain and copies every
# ancestor canvas as-is (v2.py), there is no per-canvas opt-out, and the engine has NO player-location
# condition — only npc_at_location — so a shared menu cannot adapt to where it's rendered. The gate owns its
# own picker instead, and underworld_gate drops parent + entry_from (see 1_metadata).
[[canvases]]
id          = "activity_travel_from_gate"
name        = "Take the car"
description = "Wren-solo travel picker @ underworld_gate (rev 67b). The ride OUT: up to the Spire (spire_plaza) or up to the Reach (the_waterfront). Replaces the waterfront's car, which the gate used to inherit with the WRONG menu (offered the Underworld she was standing in; couldn't offer the Reach). Time only, no Charge."

[canvases.trigger]
location      = "underworld_gate"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Take the car"
blocks = [
  { type = "paragraph", content = "She gives the address of a door that isn't on any manifest and waits. The car comes down for her the way it came down before — no questions, no record of the fare. Up to the towers, or only as far as the docks." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Ride up to the Spire."
targetType = "node"
nodeId     = "activity_travel_from_gate.riding_up"
# THE ARCHIVE 1a seal (Phase 2): blown = no way back up to the Spire. Greyed-visible; the Reach ride below stays open.
show_when_locked = true
locked_text = "Not up there. The Spire's locked down over her — the towers are the one place she can't go now."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "archive_1a_done", operator = "is_false" },
] }
[[canvases.nodes.exit_block.choices]]
text       = "Up to the Reach."
targetType = "node"
nodeId     = "activity_travel_from_gate.riding_reach"

[[canvases.nodes]]
id   = "riding_up"
name = "Ride up"
blocks = [
  { type = "paragraph", content = "The freight door shuts behind her and the red light goes with it. The car climbs out of the dark, past the docks, up until the glass takes the sky again and she's the company's problem to look at." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Ride up to the Plaza."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "spire_plaza"
time_progression_minutes = 30

[[canvases.nodes]]
id   = "riding_reach"
name = "Up to the docks"
blocks = [
  { type = "paragraph", content = "The car takes her the short way — out from under the boards and back onto the waterfront, where the Reach keeps its daylight face and nobody down there knows her by it." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Out onto the docks."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_waterfront"
time_progression_minutes = 10

# ─── beat_0006 — Home base: the cradle ────────────────────────────────────────
# The day-router (the ongoing free reset — power down, advance ~9h, wake charged) + the
# chip/memories view (seeded-empty, the greyed FRAGMENT 01 slot = the visible next rung).
# Both gated opening_done (after the on-rails opening hands the city over).

# The day-router — power down at the cradle, wake charged. The reset that makes the daytime
# (Renner's depot 09:00-18:00) reachable from an evening start.
[[canvases]]
id          = "activity_recharge"
name        = "Power down"
description = "Wren-solo. The cradle. The day-cycle reset — powers down, advances ~9h, wakes her at full Charge. Does NOT reload weapons (use the dedicated Recharge actions). Gated opening_done; the opening's night/morning one-shots run first."

[canvases.trigger]
location      = "cradle"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "05:00"

[[canvases.nodes]]
id   = "base"
name = "Power down"
blocks = [
  { type = "paragraph", content = "She settles back into the cradle. The contacts find their points along her spine, cold and familiar. The room dims as the charge takes her down, and the quiet closes over the top of her like water. When it lets her go it's morning again — a new day, the charge full, the hours she spent out there walked back into her." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Power up."

[canvases.nodes.exit_block.config]
