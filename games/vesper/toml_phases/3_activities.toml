# ─── beat_0016 — Training (Lane-3 self-feeder): Fighting + Stealth ─────────────
# Wren-solo in her room. She drills the body the company built, sharpening it past her file — the one
# thing here that's only hers (the WANT: stop being helpless / get where she can't yet). Two drills:
# Combat (+fighting) / Stealth (+stealth). Cost = 15 Charge via `costs` (gates+deducts; the choice hides
# when she's too drained) + 120 min on the result exit. Soft cap: +3 while <30, +1 while 30-50 (drill
# plateaus; field-mastery comes from real use). Result prose tiers by the trait = feedback. Stealth drill
# unlocks after the first Burned-Yard catch (yard_caught_once). The bars are LIVE now (0_systems) and the
# READER is the Burned-Yard crawl (beat_0017) — the dead-meter loop is closed.
[[canvases]]
id          = "activity_train"
name        = "Drill"
description = "Wren-solo at wren_room. Combat/Stealth drills -> +fighting/+stealth. costs 15 Charge (per-choice, gates+deducts) + 120 min. Soft cap +3<30 / +1 30-50. Gated opening_done; stealth drill gated yard_caught_once. Bars live (0_systems); read by the Burned-Yard crawl (beat_0017)."

[canvases.trigger]
location      = "wren_room"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "Drill"
blocks = [
  { type = "paragraph", content = "The floor's empty, the door shut. No one watches an asset in its own quarters. She uses the hour the way the company never told her to — drilling the body they built, sharpening it past the spec on her file. It's the one thing here that's only hers." },
]
[canvases.nodes.exit_block]
type = "choices"

