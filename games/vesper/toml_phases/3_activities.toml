name = "The far end of the row"
blocks = [
  { type = "image", props = { file = "locations/underworld_market.jpg", description = "Dim black-market stalls under a low ceiling, weapons and gear laid on cloth, cages further back.", search_queries = ["black market weapons stall dim", "underground arms bazaar cages back"] } },
  { type = "paragraph", content = "Past the blades, past the drawers of dead components, past the pens. The last three tables are curtained on three sides and the woman behind them does not sell anything you can hold up to the light." },
  { type = "paragraph", content = "She deals in the paperwork of being somebody — a face, a history thin enough not to check and thick enough not to ask about, and the clothes that make a stranger believe both without being told." },
  { type = "paragraph", content = "The price is the price. She does not haggle and she does not explain what any of it costs her to arrange." },
]
