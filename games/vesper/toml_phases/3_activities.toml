  { type = "flag", subject = "player", flag_key = "bar_hired", operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "raid_done", operator = "is_false" },
  # ⚠️ beat_0116 (rev 167) — THE FACE IS A FLAG NOW, not a garment. This used to read
  # `clothing_item cover_stranger equipped`, which conflated who she looks like with what she is wearing and
  # made the bar dress unbuildable (same `dress` slot, so equipping it would have deleted her job).
  { type = "flag", subject = "player", flag_key = "face_worn", operator = "is_true" },
] }

