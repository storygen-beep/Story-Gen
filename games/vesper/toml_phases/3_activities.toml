# in the game. THE CAP HAS TO BE ON THE TRIGGER: the model reads max_triggers_per_day and costs off the
# trigger, and the engine enforces it at setup.canTriggerActivity keyed on the canvas NAME, reset on the
# calendar-day rollover. A Charge cost is not a cap at all — activity_kess_cot refills the whole pool for 10
# coin, so 15 Charge a client just means 6 clients per 10-coin night.
# ⚠️ WHY FOUR. The arithmetic that made the number: a full Charge pool is ~6 clients (15 each), each 120 min,
# so uncapped 30/head is +180 a night against a 10-coin refill and the 120-coin face falls inside one day —
# which would delete the chapter's whole save-up beat. Four holds it at +120 a night: the face is still one
# solid night's work, and the bar's 15-a-shift is still visibly the worse wage, which is the point of it.
# The same reasoning as activity_bar_work's cap at rev 161; that card carries the canonical version.
