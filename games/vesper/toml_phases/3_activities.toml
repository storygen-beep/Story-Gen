# ═══ activity_buy_face — beat_0097 (rev 148). THE FACE's one big purchase. ═══════════════════════════════
# Wren-solo @underworld_market. Repeatable trigger (so the card survives an unaffordable visit), pri 3,
# gated wall_understood is_true + face_bought is_false. The BUY is a choice at 120 coin.
#
# ⚠️ 120 COIN, AND THE NUMBER IS THE POINT. The chapter's economy before this is 10-coin nights and 25-coin
# parts against 30-a-head at The House and a pit win; 120 is four heads or six wins, which is three or four
# in-game days of deliberate earning. That is the largest single ask the game has ever made and it should be:
# this is the beat where she stops living hand-to-mouth on someone else's errands and saves up for something
# she chose. A cheap face would make the decision free, and a free decision is not a decision.
# ⚠️ THE CARD IS GATED ON THE TRIGGER BY STATE, AND THE PRICE IS ON THE CHOICE. She can stand at the row
# with 40 coin and read what it costs — the choice simply cannot be afforded, which is the engine's own
# behaviour for a `costs` block (it gates AND deducts). No show_when_locked needed: an unaffordable choice
# already renders with its price in the label, and gate 21's rule is that a price lives on its label.
# ⚠️ WHAT SHE IS BUYING IS NOT CLOTHES. The row at the far end of this market is where the stock has faces —
# the location's own shipped description says so — so the thing on sale here is an identity: a face, the
# papers under it, and the kit that makes the story hold. The garment carries all of it because the portrait
# resolver has exactly one axis (0_systems_spec's cover_stranger note spells the compression out).
# ⚠️ NO NAME IS CHOSEN ON SCREEN and none is ever spoken by the game. She works under it for a whole chapter
# and the player never learns what she calls herself, which is the correct amount of nothing: the release
# ends on somebody using her REAL name, and every invented one before that would be a rehearsal for it.
# MEDIA: reuses locations/underworld_market.jpg, as activity_buy_part and underworld_market_shop already do.
[[canvases]]
