# ─── beat_0068 (RESTORED rev 113; built rev 96) — THE REACH REST-BED: the cradle-substitute ───────
# Restored verbatim from 08ec2e1, reach_safehouse -> berth_home. THIS IS THE FIX FOR THE SHIPPED 0.1.7
# DEAD-END. (beat_0069, rev 114: the work-stall did NOT become a second bill. The plan had a weekly
# activity_pay_rent on top of this; the fiction had already said "per night" in Kess's own mouth, so the
# PAID NIGHT BELOW *IS* THE UPKEEP — it sets feed_line_days = 3. activity_pay_rent was dropped.)
# The post-1a-close problem: the cradle (the ONLY Charge restore + the ONLY bed) is Spire-side, and the close
# seals the Spire. Dropped in the Reach with a live sandbox that costs Charge, the player had no way to refill it
# -> a silent dead-end (Charge -> 0, everything greys, no death screen). This bed fixes it. Gated berth_home
# (set by kess_1b_open, 5_scenes) so it only exists once Kess has taken her in. TWO tiers, deliberately:
#   • "Crash rough" — FREE, always available, +40 Charge, 120 min, no day-advance. The survivability FLOOR: it kills
#     the coin soft-lock (a coin-only bed would strand her — no Charge -> can't earn coin at the brothel/pit ->
#     can't pay to sleep). 40 > the 15-Charge action floor, so she can always scrape back to functional.
#   • "A night on the feed line" — the RENT: costs 10 coin, +100 Charge (full), 540 min day-advance, AND reloads the
#     drain (Kess's feed line is the natural home for it; the cradle's weapon-reload is Spire-side + now sealed off).
# Rougher than the cradle by design (LO's lean): comfort costs Reach coin every night; the free option is a genuinely
# rough half-charge. Also gives the coin economy (brothel/pit earn) a real sink. Emitter reload left for a later 1b
# beat. Choices carry costs+effects (market pattern, underworld_market_shop); the result nodes carry the time.
[[canvases]]
id          = "activity_kess_cot"
name        = "The cot"
description = "Wren-solo @the_cot (rev 96; MOVED to its own location at beat_0115, rev 166 — it was a card on the berth page, and the room it describes is the only space in the game that is hers). The Reach rest-bed — the cradle-substitute after the Spire seals. Gated berth_home is_true. TWO tiers: 'Crash rough' (FREE, +40 Charge, 120 min, no day-advance — the soft-lock floor) and 'A night on the feed line' (10 coin, +100 Charge, 540 min day-advance, reload the drain AND the emitter, AND feed_line_days -> 3). rev 131 added arousal_charge -> 3 to the paid tier: the emitter's only reload was activity_recharge_emitter @cradle, which is route-cut at the 1a close, so the emitter had no reload at all for the whole of 1b. Kept on the PAID tier so the berth still has exactly one bill. Repeatable, pri 3. Fixes the post-close dead-end (no Charge restore in the Reach); rougher than the cradle by design. rev 114 (beat_0069): the paid tier IS the upkeep — the same coin buys three days of Kess's time on the key, so crash-rough-forever means he never touches it. Coin gates PROGRESS, never action."
# ⚠️ beat_0115 (rev 166) — LOCATION MOVED kess_berth -> the_cot. The berth_home gate is KEPT even though
# the_cot's own entry_conditions now carry it: the location gate stops her reaching the room, and this one
# stops the surface existing, and a card whose room is unreachable is not the same as a card that is absent.
# Belt and braces on the one surface the whole upkeep economy runs through.
[canvases.trigger]
location      = "the_cot"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "berth_home", operator = "is_true" },
] }
[[canvases.nodes]]
id   = "base"
name = "The cot"
blocks = [
  { type = "paragraph", content = "The pad, the tap spliced off Kess's feed line, the bag underneath and the coat on the nail. Not the cradle. But it holds a charge, and down here that's the whole of what she needs a bed to do." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Crash rough — a couple hours, no coin. (Half a charge.)"
targetType = "node"
nodeId     = "activity_kess_cot.rough"
effects    = [{ targetType = "player", trait = "energy", op = "add", value = 40, clamp = true }]
[[canvases.nodes.exit_block.choices]]
text       = "A night on the feed line. (10 coin — full charge, weapons reloaded.)"
targetType = "node"
nodeId     = "activity_kess_cot.night"
costs      = [{ trait = "coin", value = 10 }]
effects    = [
  { targetType = "player", trait = "energy",       op = "add", value = 100, clamp = true },
  { targetType = "player", trait = "drain_charge",  op = "set", value = 1 },
  # ⚠️ rev 131 — THE EMITTER RELOADS HERE TOO. It reloaded ONLY at activity_recharge_emitter @cradle, which
  # is Spire-side and route-cut the moment archive_1a_done fires, so from the 1a close onward the emitter had
  # no reload anywhere in the game. The berth is the cradle-substitute (beat_0068) and this line completes
  # that substitution — the drain was carried over at rev 114 and the emitter was simply missed.
  # ON THE PAID TIER, NOT AS A SECOND BILL: the berth's rule is one bill and it is the bed (see below), so
  # the emitter rides the night that is already bought rather than arriving as its own charge. `set` to 3
  # matches the cradle's own reload exactly — a full cell is three, not a top-up.
  { targetType = "player", trait = "arousal_charge", op = "set", value = 3 },
  # beat_0069 — THE PAID NIGHT IS THE UPKEEP. The same 10 coin that buys the bed buys THREE DAYS of Kess's
  # time on the key (feed_line_days, decayed 1/day by [player.trait_decay]). There is no second bill: his
  # terms in kess_1b_open are "you pay per night, in coin... coin dries up, so does the arrangement", and
  # this is that sentence as a number. `set` not `add` — a night tops it back up to full, it doesn't stack.
  { targetType = "player", trait = "feed_line_days", op = "set", value = 3, clamp = true },
]
[[canvases.nodes.exit_block.choices]]
text       = "Leave it."
targetType = "location"
locationId = "the_cot"

[[canvases.nodes]]
id   = "rough"
name = "Crash rough"
blocks = [
  { type = "paragraph", content = "She doesn't pay for the line — just drops onto the pad and lets the cot's trickle-tap do what it can. A couple hours of half-sleep, one eye on the water, and her cells claw back partway. Not full. Enough to move. She's up before she's rested, the way the Reach teaches you to be." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Up."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_cot"
time_progression_minutes = 120
[[canvases.nodes]]
id   = "night"
name = "A night on the feed line"
