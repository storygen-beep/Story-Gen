# ── activity_say_yes — beat_0135 (rev 185). HOW SHE SAYS YES, AND IT IS BY STOPPING. ─────────────────
# ⚠️ §21 OPEN ITEM 1's OTHER HALF. cap_the_price deliberately ended without her answering — he asked her no
# question and told her he would not — so this beat has to build the answer, and the answer cannot be a
# message, because she has no way to reach him and both of them know it. THE RELEASE HAS SAID "HE FINDS YOU"
# FOUR TIMES ON FOUR CARDS. So the only thing she can actually do is the one thing he told her she could not
# decide to do — and she does the nearest available version of it: she stops. No shifts, no tower, no lane,
# no bench. She stays in. He reads it, because reading her is the only thing he has ever done.
# ⚠️ THAT IS ALSO THE THEME ARRIVING AS A MECHANIC. The price is being somewhere that stopping is all there
# is left, and the way she buys it is by stopping. It costs her two days and the card says so.
# ⚠️ REPEATABLE, NOT A ONE-SHOT. A one-shot that costs two days is a scene a player can lose to a mistimed
# click. Gated capstone_failed is_false for now — the SECOND trip is beat_0136's, and it is a different act
# and gets its own band there rather than a silent reuse of this one.
# MEDIA: none. It reuses the room she is standing in, and the point of it is that nothing happens.
[[canvases]]
id          = "activity_say_yes"
name        = "Stop for two days"
description = "beat_0135 (rev 185), WHOSE HAND. Wren-solo @the_cot. Repeatable, pri 4, gated price_named is_true + capstone_failed is_false. HOW SHE ANSWERS A MAN WHO ASKED HER NOTHING: she has no way to reach Cain, so she does the only thing available and stops — no shifts, no tower, no lane — and he reads it. The theme arriving as a mechanic. Costs two days of clock. Exits type=location into room_no_name, which is nav-invisible and reachable by no other route."
[canvases.trigger]
location      = "the_cot"
is_repeatable = true
priority      = 4
is_active     = true
# ⚠️ TRIGGER WIDENED AT beat_0136 (rev 186) AND THE NODE BANDED. It was gated capstone_failed is_false
# because the second trip did not exist yet; it does now, and it is A DIFFERENT ACT rather than a silent
# reuse of the first. Band A is her ANSWERING a man who asked her nothing. Band B is her ASKING, which she
# has never done in this game for anything, and it costs her one night instead of two because he told her
# there would be an again and he does not say things twice.
# ⚠️ IT NOW CLOSES ON vesper_named, not on capstone_failed. She never goes back to that room after the fire.
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "price_named",  operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "vesper_named", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "base"
name = "Stop for two days"
blocks = [
  # BAND A — the first trip. She is answering a question he did not ask.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "capstone_failed", operator = "is_false" },
    ] } }, blocks = [
    { type = "paragraph", content = "There is no way to reach him. There has never been a way to reach him, in two acts and eleven years, and she sits on the bunk for a while working the problem the way she works every problem and gets nowhere at all with it." },
    { type = "paragraph", content = "So she does the only thing she has. She does not take a shift. She does not take the road to the Reach or the lift up the tower or the lane down to the lockup. She stays in, and the second day is worse than the first, and on the second night he is standing at the feed line with his coat on." },
    { type = "dialog", props = { speaker = "npc", npcId = "npc_cain" }, content = "Two days. I gave it three before I came and looked." },
    { type = "thought_bubble", props = { speaker = "player" }, content = "He has never once had to be told a thing about her. She has spent this whole chapter learning to read men and he has been doing it to her the entire time for free." },
  ] },
  # BAND B — the second trip. She is asking, which she has never done for anything.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "flag", subject = "player", flag_key = "capstone_failed", operator = "is_true" },
    ] } }, blocks = [
    { type = "paragraph", content = "She does not have to stop this time. He said again, and he is not a man who says a thing twice, so all she has to do is be in the room on a night he is likely to look — and she is in the room on the first one." },
    { type = "paragraph", content = "He comes in and does not sit down and does not take his coat off, and he waits, because this time there is a question on the floor between them and it is hers and not his." },
    { type = "dialog", props = { speaker = "player" }, content = "Take me back." },
    { type = "thought_bubble", props = { speaker = "player" }, content = "Three words. She has spent nine years getting things out of men without ever once asking for anything, and it turns out asking takes about a second and a half." },
  ] },
]
[canvases.nodes.exit_block]
type = "location"
text = "Go with him."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "room_no_name"
time_progression_minutes = 90

