# that lane once in nine years, not even to see whether the man was still breathing. Getting him there is
# the whole ask, and he does it because she asked and for no other reason he is willing to give.
# ⚠️ REPEATABLE, gated third_located + two_men_done is_false. Nothing costs coin here, but a one-shot on the
# release's final on-ramp is a scene a mistimed click can lose, and activity_say_yes set the precedent.
