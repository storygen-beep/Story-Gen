# ═══ activity_bar_work — beat_0098 (rev 149). The shift, and the ladder it climbs. ══════════════════════
# Wren-solo @underworld_bar. Repeatable, pri 3, gated bar_hired is_true + cover_stranger EQUIPPED.
#
# ⚠️ THE COVER CLAUSE IS ON THE TRIGGER, NOT A CHOICE. Out of the bought face she is Wren, and Wren does not
# have this job — Sol hired a stranger. So the whole card is absent when she is not wearing it, which is the
# same shape the Renner depot used (5_scenes.toml:534, "no working the floor out of cover"). It is also a
# quiet teaching surface: a player who takes the kit off and wonders where her job went learns the rule.
#
# ⚠️ THE PAY IS FLAT AND THE ATTENTION IS NOT. Fifteen a shift at every rung, forever, against Rue's thirty
# a head. That is deliberate and it is the chapter's economic argument in one number: she is not here for
# money, and a wage that climbed with the ladder would quietly turn the promotions into a payline and make
# the last rung read as a raise. What climbs is npc_bastien.relation — 2 / 3 / 3 / 1 per shift — which is
# the axis every promotion capstone reads.
# ⚠️ RELATION ON A MAN SHE HAS NOT MET IS CORRECT HERE and is not a fudge. He is in a room with the door
# open, in a chair placed to see the floor, four hours a night. Relation in this game has always meant "what
# he thinks of her", and what he thinks of her is being formed across every one of these shifts without a
# word passing between them. It is the first time the meter has ever run one-way.
# ⚠️ FOUR BANDS, EXCLUSIVE BY CONSTRUCTION — adjacent [group]s merge into ONE if/elseif chain and the first
# match wins, so the gte/lt pairs below cannot both match. Same discipline as activity_buy_part's part_spec.
# ⚠️ THE SHIFT CHOICES CARRY THE EFFECTS, NOT THE EXIT. Choice effects fire on CLICK and exit effects fire on
# RENDER, and per-rung pay/relation cannot live on a single shared exit at all — so each rung gets its own
# gated choice, all four targeting the same `shift` node, whose bands render what the night was actually like.
#
# ⚠️ CEILING ROW (b) — THE BAR FLOOR — IS FIRST SPENT AT RUNG 3 AND ONLY THERE. Rungs 1 and 2 are un-crude:
# work, noise, tired feet. Rung 3 is public, semi-sexual and repeatable, and the declared row is EXPOSURE AND
# HANDLING, NOT SEX — she is looked at, and occasionally touched by men who have decided the room permits it,
# and the prose is crude only at the point where a hand actually lands. No act, no finish, no drain: this is
# a working floor and not a sex loop, and the sex in this chapter belongs to the back room.
# MEDIA: reuses locations/underworld_bar.jpg on the base; the shift node's rung-3 band carries the one new
# slot, sex/bar_floor_handled_t4 — a pool, because it is re-entered every shift for the rest of the chapter.
[[canvases]]
id          = "activity_bar_work"
name        = "Take a shift at the Undertow"
description = "beat_0098 (rev 149). Wren-solo @underworld_bar. Repeatable, pri 3, gated bar_hired is_true + clothing_item cover_stranger equipped (out of the face she is Wren, and Wren does not have this job — the shipped Renner-depot shape). FOUR exclusive [group] bands on bar_rung: 1 the floor / 2 the counter / 3 the floor in less / 4 the room is open to her. Pay is FLAT at 15 coin every rung against Rue's 30 a head — the chapter's economic argument in one number, and a wage that climbed would turn the promotions into a payline. What climbs is npc_bastien.relation (+2/+3/+3/+1), the axis every promotion capstone reads; relation on a man she has not met is correct, because he is in a chair placed to see the floor four hours a night and the meter has never run one-way before. Costs 15 Charge and 240 min (a whole evening), CAPPED at 2 shifts a day on the trigger — without the cap this was a money printer, since Charge refills for 10 coin and 15-coin shifts were unlimited. First spend of ceiling row (b) at rung 3: exposure and handling, not sex."
[canvases.trigger]
location      = "underworld_bar"
is_repeatable = true
priority      = 3
is_active     = true
# ⚠️ max_triggers_per_day = 2 — beat_0111 (rev 161), AND IT IS A REAL FIX, NOT DRESSING. Without it this card
# was a money printer: 15 coin a shift, unlimited shifts, against a 10-coin cot night that restores the whole
# Charge pool — roughly six shifts per night for a net +80 coin, repeatable forever. The audit gate names the
# shape ("standing surfaces print money without limit") and vesper went from two of them to three when this
# card shipped. The other two (the pit, the Sunday hunt) are pre-existing; this one was mine.
# ⚠️ THE CAP HAS TO BE ON THE TRIGGER. A `costs` block on the CHOICE does not satisfy it and does not stop it:
# the model reads max_triggers_per_day and costs off the TRIGGER (gates.py:419-420), and more to the point a
# Charge cost is not a cap at all when Charge refills for 10 coin. Only a per-day limit bounds it.
# ⚠️ TWO AND NOT ONE. Two evenings' work a night is the most the fiction supports, and it keeps the ladder at
# roughly four in-game days (relation 6/12/18 at +2/+3/+3). One would double that for no gain.
# The engine enforces it at setup.canTriggerActivity (v2.py:4495, :4526), keyed on the canvas NAME and reset
# on the calendar-day rollover — so a name collision would share the limit. This name is unique.
# ⚠️ IT CANNOT STALL HER. The 120-coin face is bought BEFORE the job exists, out of The House and the pit, and
# the only thing bar money has to cover afterwards is the 30-coin taser. Capping at 30 a day blocks nothing.
max_triggers_per_day = 2
# ⚠️ beat_0107 (rev 157) — raid_done is_false. Three machines came through the wall between this room and
# the bar and set eleven years of paper alight; the Undertow does not open the next evening, and a shift card
# that survived the fire would be the surface contradicting the scene. Her income falls back to The House and
# the pit, both of which still stand, and the ruin crawl takes over as the standing content at this location.
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "bar_hired", operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "raid_done", operator = "is_false" },
  # ⚠️ beat_0116 (rev 167) — THE FACE IS A FLAG NOW, not a garment. This used to read
  # `clothing_item cover_stranger equipped`, which conflated who she looks like with what she is wearing and
  # made the bar dress unbuildable (same `dress` slot, so equipping it would have deleted her job).
  { type = "flag", subject = "player", flag_key = "face_worn", operator = "is_true" },
] }

