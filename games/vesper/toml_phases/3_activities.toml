# Phase 3/7 — 3_activities.toml
# Vesper — solo activities / structural movement. beat_0001 (scaffold): the two travel
# activities that bridge the parallel street-hub roots (Spire Plaza <-> The Waterfront) so
# the map is connected and the build proves green. The day-router (cradle), Renner's depot
# work, and the rest land at their plan beats (0006 / 0007).

# ─── Travel: Spire -> Reach ───────────────────────────────────────────────────
[[canvases]]
id          = "activity_travel_to_reach"
name        = "Take the car"
description = "Wren-solo travel picker @ spire_plaza (rev 60). Down to the Reach (the_waterfront) OR down to the Underworld (underworld_gate -> the toll -> the strip). Costs time + charge; Reach hygiene-gated (cover), Underworld gated opening_done (no cover needed down there)."

[canvases.trigger]
location      = "spire_plaza"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Take the car"
blocks = [
  { type = "paragraph", content = "A company car idles at the curb. Down to the Reach and the docks, or further down still — under them, to the half of the city that never comes up in daylight." },
]
[canvases.nodes.exit_block]
type = "choices"
# To the Reach — hygiene gate (public/cover only): filthy -> the cover won't hold; wash first. Locked-visible.
[[canvases.nodes.exit_block.choices]]
text       = "Ride down to the Reach."
targetType = "node"
nodeId     = "activity_travel_to_reach.riding"
show_when_locked = true
locked_text = "Not like this — you're filthy, and the cover won't hold with the docks able to smell it on you. Wash up first."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "hygiene", operator = "gte", value = 40 },
] }
# To the Underworld — no cover needed down there (she's nobody down there); gated opening_done.
[[canvases.nodes.exit_block.choices]]
text       = "Ride down to the Underworld."
targetType = "node"
nodeId     = "activity_travel_to_reach.riding_underworld"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "riding"
name = "Ride down"
blocks = [
  { type = "paragraph", content = "She gives the docks address and the car pulls out without a word. The Spire's glass falls away behind her; the city gets lower, wetter, dirtier the whole way down." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Down to the Waterfront."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_waterfront"
# rev 67: the car costs TIME, not Charge. The 30 min is the real friction — it rolls the clock, which is what
# makes NPC schedules bite. The old energy -10 was a tax the author already distrusted (it carried
# "never block (locomotion mustn't soft-lock)" and, on the ride up, "the ONLY way back to the cradle") and
# clamped around; dropping it retires the soft-lock worry instead of papering over it.
time_progression_minutes = 30

[[canvases.nodes]]
id   = "riding_underworld"
name = "Ride down"
blocks = [
  { type = "paragraph", content = "She gives an address that isn't on any manifest. The car takes her down past the docks and lets her out at a freight door under everything, where the city goes down instead of up. The driver doesn't wait to see her through it." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Out at the gate."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "underworld_gate"
time_progression_minutes = 30   # rev 67: time only — no Charge cost on the car (see the ride-to-Reach note)

# ─── Travel: Reach -> Spire ───────────────────────────────────────────────────
[[canvases]]
id          = "activity_travel_to_spire"
name        = "Take the car"
description = "Wren-solo travel picker @ the_waterfront (rev 60). Up to the Spire (spire_plaza) OR down under the docks to the Underworld (underworld_gate -> the toll -> the strip). Spire = car (time+charge); Underworld = a short local descent (opening_done)."

[canvases.trigger]
location      = "the_waterfront"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Take the car"
blocks = [
  { type = "paragraph", content = "The car idles at the curb where the docks meet the road. Up to the towers — or down under the boards, into the other half of the Reach, the part that doesn't come up in daylight." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Ride up to the Spire."
targetType = "node"
nodeId     = "activity_travel_to_spire.riding_spire"
# THE ARCHIVE 1a seal (Phase 2): once she's blown (archive_1a_done), the ride up is dead — greyed-visible with the
# security line so the block reads on the try. locked_text is written FOR the locked (post-blowup) state, so it's
# never stale (cf. toml-gotchas show_when_locked trap — that trap is a consumed is_false clause showing a PRE-state).
show_when_locked = true
locked_text = "The Spire's sealed to her now — sweeps on every floor, her face on every camera at the curb. Going up is walking into the net. There's no ride back."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "archive_1a_done", operator = "is_false" },
] }
# Down under the docks to the underworld gate — local descent, no car; gated opening_done.
[[canvases.nodes.exit_block.choices]]
text       = "Down under the docks — the Underworld."
targetType = "node"
nodeId     = "activity_travel_to_spire.riding_under"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }
# ── THE RISE — beat_0129 (rev 179), WHOSE HAND. The way in, and it is a CHOICE and not a nav card.
# ⚠️ GATED ON rise_named AND NOTHING ELSE, DELIBERATELY. She can walk up to that building the moment Grier
# names it, in her own face, with no papers — and she MUST be able to, because save-safety §5's heal lives
# on the point-of-need reaction up there and a heal the stranded player cannot reach is not a heal. The
# tokens gate the HIRING, not the road.
# ⚠️ NO show_when_locked. The trap that flag walks into is a consumed is_false clause showing a PRE-state
# (toml-gotchas), and there is a worse problem here: before Grier names the place she does not know the
# building exists, so a greyed "Up to the Rise" on the travel menu would tell her about it two beats early.
# The frontier telegraph for this one is a man saying its name out loud, which is better than a card.
[[canvases.nodes.exit_block.choices]]
text       = "Up to the Rise."
targetType = "node"
nodeId     = "activity_travel_to_spire.riding_rise"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "rise_named", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "riding_spire"
name = "Ride up"
blocks = [
  { type = "paragraph", content = "She calls the car. The docks recede behind her; the towers climb back up until the glass swallows the sky again. Home, if that's the word for the place that owns you." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Ride up to the Plaza."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "spire_plaza"
time_progression_minutes = 30
# rev 67: no Charge cost — this is the ONLY way back to the cradle, so a tax here was always a soft-lock
# risk the clamp merely hid. Time still rolls (see the ride-to-Reach note).

# ⚠️ ON FOOT, NOT IN THE CAR. The Rise is on the edge of this district (§6) — siting it here is what turns
# the CAIN -> GRIER -> SABIN chain into a walk instead of a commute, and putting her in a car for ten
# minutes would quietly undo that. Ten minutes, no Charge, same as the descent to the gate.
[[canvases.nodes]]
id   = "riding_rise"
name = "Up to the Rise"
blocks = [
  { type = "paragraph", content = "It is a walk and not a ride. Twenty floors of it stand up out of the low end of the Reach with eight of them lit and the rest open concrete, and a crane on the top that has not moved in the time it takes her to get there." },
  { type = "paragraph", content = "The lobby is a desk, a man reading, and a lift that works. Nothing in the building is finished, and that includes whatever is supposed to stop her walking into it." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Go up."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_rise_floor"
time_progression_minutes = 10

[[canvases.nodes]]
id   = "riding_under"
name = "Down under"
blocks = [
  { type = "paragraph", content = "She leaves the car and goes down on foot — off the lit strip, past the boards, to the freight door under the docks where the man already has his hand out." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Down to the gate."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "underworld_gate"
time_progression_minutes = 10

# ── activity_travel_from_gate — the ride OUT of the underworld (rev 67b) ─────────────────────────
# The THIRD picker, and the gate's OWN. It used to INHERIT the waterfront's car via parent, which handed it
# that canvas VERBATIM — so the menu was wrong in two directions: it offered "Down under the docks — the
# Underworld" while she is STANDING in the underworld, and could not offer the Reach (pointless from the
# waterfront, which is where that canvas lives). Canvas inheritance walks the parent chain and copies every
# ancestor canvas as-is (v2.py), there is no per-canvas opt-out, and the engine has NO player-location
# condition — only npc_at_location — so a shared menu cannot adapt to where it's rendered. The gate owns its
# own picker instead, and underworld_gate drops parent + entry_from (see 1_metadata).
[[canvases]]
id          = "activity_travel_from_gate"
name        = "Take the car"
description = "Wren-solo travel picker @ underworld_gate (rev 67b). The ride OUT: up to the Spire (spire_plaza) or up to the Reach (the_waterfront). Replaces the waterfront's car, which the gate used to inherit with the WRONG menu (offered the Underworld she was standing in; couldn't offer the Reach). Time only, no Charge."

[canvases.trigger]
location      = "underworld_gate"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Take the car"
blocks = [
  { type = "paragraph", content = "She gives the address of a door that isn't on any manifest and waits. The car comes down for her the way it came down before — no questions, no record of the fare. Up to the towers, or only as far as the docks." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Ride up to the Spire."
targetType = "node"
nodeId     = "activity_travel_from_gate.riding_up"
# THE ARCHIVE 1a seal (Phase 2): blown = no way back up to the Spire. Greyed-visible; the Reach ride below stays open.
show_when_locked = true
locked_text = "Not up there. The Spire's locked down over her — the towers are the one place she can't go now."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "archive_1a_done", operator = "is_false" },
] }
[[canvases.nodes.exit_block.choices]]
text       = "Up to the Reach."
targetType = "node"
nodeId     = "activity_travel_from_gate.riding_reach"

[[canvases.nodes]]
id   = "riding_up"
name = "Ride up"
blocks = [
  { type = "paragraph", content = "The freight door shuts behind her and the red light goes with it. The car climbs out of the dark, past the docks, up until the glass takes the sky again and she's the company's problem to look at." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Ride up to the Plaza."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "spire_plaza"
time_progression_minutes = 30

[[canvases.nodes]]
id   = "riding_reach"
name = "Up to the docks"
blocks = [
  { type = "paragraph", content = "The car takes her the short way — out from under the boards and back onto the waterfront, where the Reach keeps its daylight face and nobody down there knows her by it." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Out onto the docks."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_waterfront"
time_progression_minutes = 10

# ─── beat_0006 — Home base: the cradle ────────────────────────────────────────
# The day-router (the ongoing free reset — power down, advance ~9h, wake charged) + the
# chip/memories view (seeded-empty, the greyed FRAGMENT 01 slot = the visible next rung).
# Both gated opening_done (after the on-rails opening hands the city over).

# The day-router — power down at the cradle, wake charged. The reset that makes the daytime
# (Renner's depot 09:00-18:00) reachable from an evening start.
[[canvases]]
id          = "activity_recharge"
name        = "Power down"
description = "Wren-solo. The cradle. The day-cycle reset — powers down, advances ~9h, wakes her at full Charge. Does NOT reload weapons (use the dedicated Recharge actions). Gated opening_done; the opening's night/morning one-shots run first."

[canvases.trigger]
location      = "cradle"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "05:00"

[[canvases.nodes]]
id   = "base"
name = "Power down"
blocks = [
  { type = "paragraph", content = "She settles back into the cradle. The contacts find their points along her spine, cold and familiar. The room dims as the charge takes her down, and the quiet closes over the top of her like water. When it lets her go it's morning again — a new day, the charge full, the hours she spent out there walked back into her." },
]

[canvases.nodes.exit_block]
