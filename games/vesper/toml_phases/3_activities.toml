id   = "made"
name = "It will hold until somebody reads it"
blocks = [
  { type = "paragraph", content = "It takes him two hours and most of that is the label. The case comes off a hull he stripped in the spring, cut down, resealed, and cold-rated on a bench with a hose and a gauge until it holds the number she gave him with eleven degrees in hand." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Eleven characters. Count them yourself, twice, before you walk it in there. I've done nine and thought it was eleven before now and so has every man who ever made one of these." },
  { type = "paragraph", content = "Then he wipes it down, wraps it, and holds onto it for a second longer than he needs to when he hands it over." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_kess" }, content = "Understand what you're buying. That'll hold a dial forever. It holds a man exactly until the day one of them opens it up and reads it, and then it holds nothing at all and everybody who was in that log is in it." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "He wants the method, not the contents. Nobody opens a thing they already know how to copy. She is buying months, and she does not get to know how many." },
]
