      { type = "trait", subject = "player", trait_key = "bar_rung", operator = "lt",  value = 3 },
    ] } }, blocks = [
      { type = "paragraph", content = "The taps, the till, and the whole room's talk arriving at her elbow in pieces. Most of it is nothing. She keeps the pieces that are about the back door and there are more of them than she expected." },
      { type = "paragraph", content = "Men go in with envelopes and come out without them. Nobody carries anything out. Whatever that room is, it takes paper in one direction only, and it has been doing it for years." },
