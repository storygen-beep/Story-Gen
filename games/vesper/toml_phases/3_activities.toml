# Phase 3/7 — 3_activities.toml
# Vesper — solo activities / structural movement. beat_0001 (scaffold): the two travel
# activities that bridge the parallel street-hub roots (Spire Plaza <-> The Waterfront) so
# the map is connected and the build proves green. The day-router (cradle), Renner's depot
# work, and the rest land at their plan beats (0006 / 0007).

# ─── Travel: Spire -> Reach ───────────────────────────────────────────────────
[[canvases]]
id          = "activity_travel_to_reach"
name        = "Take the car to the Reach"
description = "Wren-solo. Spire Plaza -> The Waterfront. Costs time + charge (the leash bites — schedules matter)."

[canvases.trigger]
location      = "spire_plaza"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Take the car to the Reach"
blocks = [
  { type = "paragraph", content = "A company car idles at the curb, waiting to run her down to the docks." },
]
[canvases.nodes.exit_block]
type = "choices"
# Hygiene gate (public/cover only): filthy -> the cover won't hold; wash up before going out. Locked-visible.
[[canvases.nodes.exit_block.choices]]
text       = "Ride down to the Waterfront."
targetType = "node"
nodeId     = "activity_travel_to_reach.riding"
show_when_locked = true
locked_text = "Not like this — you're filthy, and the cover won't hold with the docks able to smell it on you. Wash up first."
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "hygiene", operator = "gte", value = 40 },
] }

[[canvases.nodes]]
id   = "riding"
name = "Ride down"
blocks = [
  { type = "paragraph", content = "She gives the docks address and the car pulls out without a word. The Spire's glass falls away behind her; the city gets lower, wetter, dirtier the whole way down." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Down to the Waterfront."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_waterfront"
time_progression_minutes = 30
effects = [
  { targetType = "player", trait = "energy", op = "add", value = -10, clamp = true },   # travel: floor at 0, never block (locomotion mustn't soft-lock)
]

# ─── Travel: Reach -> Spire ───────────────────────────────────────────────────
[[canvases]]
id          = "activity_travel_to_spire"
name        = "Take the car to the Spire"
description = "Wren-solo. The Waterfront -> Spire Plaza. Costs time + charge."

[canvases.trigger]
location      = "the_waterfront"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Take the car to the Spire"
blocks = [
  { type = "paragraph", content = "She calls the car. The docks recede behind her; the towers climb back up until the glass swallows the sky again. Home, if that's the word for the place that owns you." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Ride up to the Plaza."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "spire_plaza"
time_progression_minutes = 30
effects = [
  { targetType = "player", trait = "energy", op = "add", value = -10, clamp = true },   # travel: floor at 0, never block — the ONLY way back to the cradle
]

# ─── beat_0006 — Home base: the cradle ────────────────────────────────────────
# The day-router (the ongoing free reset — power down, advance ~9h, wake charged) + the
# chip/memories view (seeded-empty, the greyed FRAGMENT 01 slot = the visible next rung).
# Both gated opening_done (after the on-rails opening hands the city over).

# The day-router — power down at the cradle, wake charged. The reset that makes the daytime
# (Renner's depot 09:00-18:00) reachable from an evening start.
[[canvases]]
id          = "activity_recharge"
name        = "Power down"
description = "Wren-solo. The cradle. The day-cycle reset — powers down, advances ~9h, wakes her at full Charge. Does NOT reload weapons (use the dedicated Recharge actions). Gated opening_done; the opening's night/morning one-shots run first."

[canvases.trigger]
location      = "cradle"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "05:00"

[[canvases.nodes]]
id   = "base"
name = "Power down"
blocks = [
  { type = "paragraph", content = "She settles back into the cradle. The contacts find their points along her spine, cold and familiar. The room dims as the charge takes her down, and the quiet closes over the top of her like water. When it lets her go it's morning again — a new day, the charge full, the hours she spent out there walked back into her." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Power up."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "cradle"
time_progression_minutes = 540
effects = [
  { targetType = "player", trait = "energy", op = "add", value = 100, clamp = true },   # cap at 100 (no over-cap -> Charge card never vanishes on the high end)
]

# Charge up — top up Charge WITHOUT sleeping the day forward. Anytime at the cradle (no schedule). Costs ~2h
# (time stays the throttle). Charge-only — weapons reload at the two dedicated Recharge actions below, NOT here.
[[canvases]]
id          = "activity_charge_up"
name        = "Charge up"
description = "Wren-solo at the cradle. Top up Charge (energy), 120 min, NO day advance. Does NOT reload weapons (use the dedicated Recharge actions). Separate from Power down (sleep). Gated opening_done."
[canvases.trigger]
location      = "cradle"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }
[[canvases.nodes]]
id   = "base"
name = "Charge up"
blocks = [
  { type = "paragraph", content = "Not a full night — just a couple hours hooked to the cradle's feed line, eyes open. Her cells pull back to full. Then she unhooks, the day still going." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Unhook. Back to it."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "cradle"
time_progression_minutes = 120
effects = [
  { targetType = "player", trait = "energy", op = "add", value = 100, clamp = true },   # cap at 100
]

# ─── Weapon reload — split per-weapon (LO's call: weapons reload ONLY here, not at Power down / Charge up).
# Each is a cheap cradle action off the feed line. drain = 1 shot; emitter = 3 (gated arousal_weapon_ready).
[[canvases]]
id          = "activity_recharge_drain"
name        = "Recharge the drain"
description = "Wren-solo at the cradle. Reload the drain weapon (drain_charge -> 1). 60 min, NO day advance. Gated opening_done."
[canvases.trigger]
location      = "cradle"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }
[[canvases.nodes]]
id   = "base"
name = "Recharge the drain"
blocks = [
  { type = "paragraph", content = "A few minutes on the feed line and the drain rebuilds its one shot. Loaded. She unhooks." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Done."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "cradle"
time_progression_minutes = 60
effects = [
  { targetType = "player", trait = "drain_charge", op = "set", value = 1 },
]

[[canvases]]
id          = "activity_recharge_emitter"
name        = "Recharge the emitter"
description = "Wren-solo at the cradle. Reload the emitter (arousal_charge -> 3). 60 min, NO day advance. Gated opening_done + arousal_weapon_ready (only once she has it)."
[canvases.trigger]
location      = "cradle"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done",         operator = "is_true" },
  { type = "flag", subject = "player", flag_key = "arousal_weapon_ready", operator = "is_true" },
] }
[[canvases.nodes]]
id   = "base"
name = "Recharge the emitter"
blocks = [
  { type = "paragraph", content = "She bleeds the cradle's charge into the emitter's cell until it reads full — three. Then she pockets it and goes." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Done."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "cradle"
time_progression_minutes = 60
effects = [
  { targetType = "player", trait = "arousal_charge", op = "set", value = 3 },
]

# The chip / memories view — seeded-empty, the greyed FRAGMENT 01 slot (the visible next
# rung; fills at the_site, frontier). The unconscious self-labelling = the awakening seed.
[[canvases]]
id          = "canvas_chip_view"
name        = "The memory store"
description = "Wren-solo at the cradle. The memories UI — EMPTY in chunk, one greyed locked slot (FRAGMENT 01). The chip fills at the_site (frontier). Repeatable; gated opening_done."

[canvases.trigger]
location      = "cradle"
is_repeatable = true
priority      = 2
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "The memory store"
blocks = [
  { type = "image", props = { file = "activities/chip_view.jpg", description = "A dark holographic memory-archive interface, an empty grid of storage slots glowing faintly, one greyed-out slot ringed and labelled at the center.", search_queries = ["dark holographic interface empty grid", "sci-fi data archive screen glowing"] } },
  { type = "paragraph", content = "She opens the store the company gave her for what it calls recovered assets — the place a restored memory would go, if she ever recovered one. It's empty. It has always been empty." },
  { type = "paragraph", content = "There is one slot in it, greyed out, labelled in a hand that isn't the company's: FRAGMENT 01 — LOCKED. She doesn't remember making the label. She closes the store — and notices she's opened it more often than the task log would ever justify. She closes that thought too." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Close it."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "cradle"

# ─── beat_0016 — Training (Lane-3 self-feeder): Fighting + Stealth ─────────────
# Wren-solo in her room. She drills the body the company built, sharpening it past her file — the one
# thing here that's only hers (the WANT: stop being helpless / get where she can't yet). Two drills:
# Combat (+fighting) / Stealth (+stealth). Cost = 15 Charge via `costs` (gates+deducts; the choice hides
# when she's too drained) + 120 min on the result exit. Soft cap: +3 while <30, +1 while 30-50 (drill
# plateaus; field-mastery comes from real use). Result prose tiers by the trait = feedback. Stealth drill
# unlocks after the first Burned-Yard catch (yard_caught_once). The bars are LIVE now (0_systems) and the
# READER is the Burned-Yard crawl (beat_0017) — the dead-meter loop is closed.
[[canvases]]
id          = "activity_train"
name        = "Drill"
description = "Wren-solo at wren_room. Combat/Stealth drills -> +fighting/+stealth. costs 15 Charge (per-choice, gates+deducts) + 120 min. Soft cap +3<30 / +1 30-50. Gated opening_done; stealth drill gated yard_caught_once. Bars live (0_systems); read by the Burned-Yard crawl (beat_0017)."

[canvases.trigger]
location      = "wren_room"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "Drill"
blocks = [
  { type = "paragraph", content = "The floor's empty, the door shut. No one watches an asset in its own quarters. She uses the hour the way the company never told her to — drilling the body they built, sharpening it past the spec on her file. It's the one thing here that's only hers." },
]
[canvases.nodes.exit_block]
type = "choices"

# Combat drill — early band (+3 while < 30)
[[canvases.nodes.exit_block.choices]]
text       = "Combat drill."
targetType = "node"
nodeId     = "activity_train.combat"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "fighting", operator = "lt", value = 30 },
] }
costs   = [{ trait = "energy", value = 15 }]
effects = [{ targetType = "player", trait = "fighting", op = "add", value = 3 }]

# Combat drill — plateau band (+1 while 30–50)
[[canvases.nodes.exit_block.choices]]
text       = "Combat drill."
targetType = "node"
nodeId     = "activity_train.combat"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "trait", subject = "player", trait_key = "fighting", operator = "gte", value = 30 },
  { type = "trait", subject = "player", trait_key = "fighting", operator = "lt",  value = 50 },
] }
costs   = [{ trait = "energy", value = 15 }]
effects = [{ targetType = "player", trait = "fighting", op = "add", value = 1 }]

# Stealth drill — early band (+3 while < 30)
[[canvases.nodes.exit_block.choices]]
text       = "Stealth drill."
targetType = "node"
nodeId     = "activity_train.stealth"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key = "yard_caught_once", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "stealth", operator = "lt", value = 30 },
] }
costs   = [{ trait = "energy", value = 15 }]
effects = [{ targetType = "player", trait = "stealth", op = "add", value = 3 }]

# Stealth drill — plateau band (+1 while 30–50)
[[canvases.nodes.exit_block.choices]]
text       = "Stealth drill."
targetType = "node"
nodeId     = "activity_train.stealth"
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag",  subject = "player", flag_key = "yard_caught_once", operator = "is_true" },
  { type = "trait", subject = "player", trait_key = "stealth", operator = "gte", value = 30 },
  { type = "trait", subject = "player", trait_key = "stealth", operator = "lt",  value = 50 },
] }
costs   = [{ trait = "energy", value = 15 }]
effects = [{ targetType = "player", trait = "stealth", op = "add", value = 1 }]

[[canvases.nodes.exit_block.choices]]
text       = "Enough for now."
targetType = "location"
locationId = "wren_room"

# Combat result — prose tiers by fighting (clumsy -> sharp). Exit burns the 120 min.
[[canvases.nodes]]
id   = "combat"
name = "Combat drill"
blocks = [
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "fighting", operator = "lt", value = 25 },
    ] } }, blocks = [
    { type = "paragraph", content = "She runs the forms against the empty air — strikes, breaks, the throw that ends a man. Her body obeys a half-beat slow, the way a tool obeys before it's been worked hard. Clumsy still. But the half-beat is shorter than it was yesterday." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "fighting", operator = "gte", value = 25 },
    ] } }, blocks = [
    { type = "paragraph", content = "No hesitation now. The forms come fast and flat and final — strike, break, the throw — each one landing where a throat or a knee would be. Whatever they built her for, this wasn't on the spec. She's better than the file says. She keeps that to herself." },
  ] },
]
[canvases.nodes.exit_block]
type = "location"
text = "Rack it. Catch your breath."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "wren_room"
time_progression_minutes = 120

# Stealth result — prose tiers by stealth (fumbling -> ghost). Exit burns the 120 min.
[[canvases.nodes]]
id   = "stealth"
name = "Stealth drill"
blocks = [
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "stealth", operator = "lt", value = 25 },
    ] } }, blocks = [
    { type = "paragraph", content = "She practices the small things — weight rolled onto the outside of the foot, breath dropped low, the timing of a turned back. Her own joints betray her with a tick of sound she'd never have caught a week ago. She catches it now. That's the start of it." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "stealth", operator = "gte", value = 25 },
    ] } }, blocks = [
    { type = "paragraph", content = "She moves through her own quarters and the room doesn't register her — no sound, no shift of air, nothing for a camera to hold. A thing that can't be seen can go where it isn't allowed. She doesn't let the thought finish." },
  ] },
]
[canvases.nodes.exit_block]
type = "location"
text = "Ease off. Settle."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "wren_room"
time_progression_minutes = 120

# ─── beat_0013 — the facility investigation host (Lane-3 solo) ─────────────────
# The Mission-1 location leg. Repeatable explore; the one-time 'that's mine' match beat
# (inv_facility_match, 2_one_shots) auto-fires on entry once renner_hired.
[[canvases]]
id          = "inv_facility_explore"
name        = "Walk the wreckage"
description = "Wren-solo Lane-3 investigation at facility_ruins. The dread-place. Gated opening_done. The 'that's mine' match beat fires separately (auto-fire, once renner_hired)."

[canvases.trigger]
location      = "facility_ruins"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "opening_done", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "base"
name = "Walk the wreckage"
blocks = [
  { type = "image", props = { file = "locations/facility_ruins.jpg", description = "A burned-out industrial facility at night, scorched frame and melted racks against dock lights.", search_queries = ["burned warehouse ruins night", "abandoned factory fire damage dark"] } },
  { type = "paragraph", content = "The facility is a black skeleton against the dock lights — scorched frame, melted racks, the smell of old smoke that never washed out. She walks it slowly, cataloguing: where the containment was, where the fire started, what the dead machines used to do. None of it matches the briefing. All of it was built to hold things that could feel — and someone came through and let them out before he burned it down. The dread-place. The first one." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Done here."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "facility_ruins"

# ═══ beat_0017 — The Burned Yard: the Trail crawl (stealth/fight depth) + the arousal weapon ═══
# Renner's torched yard (Cain's revenge). She sneaks past his GUARDS (narrative, NOT declared NPCs —
# the encounter resolves on HER stealth/fighting) and pushes DEEPER (yard_depth odometer 0->3). Each push
# costs Charge; resolution costs time. Slip (stealth>=S) or beat the guard (fighting>=F), else the weapon
# (once ready) or run (flee). First time caught -> yard_caught_once (unlocks the Stealth drill). Finds
# auto-fire on return (yard_find_*). This is where Fighting/Stealth finally READ (bars live, 0_systems).
[[canvases]]
id          = "yard_crawl"
name        = "Work the burned yard"
description = "Wren-solo crawl at renner_burned_yard. Push deeper (yard_depth) past a guard: Slip (stealth>=S) / Take him (fighting>=F) / weapon (ready) / run (flee). costs Charge per push + time on resolution. Guard S/F rise with depth (10/25/40). Finds auto-fire on return. The location lock (renner_hired) gates access."

[canvases.trigger]
location      = "renner_burned_yard"
is_repeatable = true
priority      = 3
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Work the burned yard"
blocks = [
  { type = "image", props = { file = "locations/renner_burned_yard.jpg", description = "A torched industrial yard at night, scorched slab and downed fencing, a guard's flashlight sweeping the dark.", search_queries = ["burned yard night flashlight guard", "torched warehouse lot dark security"] } },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "yard_depth", operator = "lt", value = 1 } ] } }, blocks = [
    { type = "paragraph", content = "The fence is down on the water side. Past it the yard is black glass and bent steel — and a guard with a torch, walking the line where the gate used to be. Getting in means getting past him." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "yard_depth", operator = "gte", value = 1 }, { type = "trait", subject = "player", trait_key = "yard_depth", operator = "lt", value = 3 } ] } }, blocks = [
    { type = "paragraph", content = "She's inside the outer line now. Deeper in there are more lights and more men — Renner doesn't watch a dead yard this hard for nothing. Whatever's worth guarding is further back." },
  ] },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "yard_depth", operator = "gte", value = 3 } ] } }, blocks = [
    { type = "paragraph", content = "She's been all the way to the back of it. There's nothing left in the yard she hasn't already put her hands on." },
  ] },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Push in past the gate."
targetType = "node"
nodeId     = "yard_crawl.guard1"
conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "yard_depth", operator = "lt", value = 1 } ] }
costs      = [{ trait = "energy", value = 15 }]
[[canvases.nodes.exit_block.choices]]
text       = "Work deeper in."
targetType = "node"
nodeId     = "yard_crawl.guard2"
conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "yard_depth", operator = "gte", value = 1 }, { type = "trait", subject = "player", trait_key = "yard_depth", operator = "lt", value = 2 } ] }
costs      = [{ trait = "energy", value = 15 }]
[[canvases.nodes.exit_block.choices]]
text       = "Push to the back of it."
targetType = "node"
nodeId     = "yard_crawl.guard3"
conditions = { version = "1.0", logic = "AND", items = [ { type = "trait", subject = "player", trait_key = "yard_depth", operator = "gte", value = 2 }, { type = "trait", subject = "player", trait_key = "yard_depth", operator = "lt", value = 3 } ] }
costs      = [{ trait = "energy", value = 15 }]
[[canvases.nodes.exit_block.choices]]
text       = "Slip back out."
targetType = "location"
locationId = "the_waterfront"

