# ═══ beat_0132 (rev 182) — WHOSE HAND beat 11. PIECE TWO: THE SWAP. ═══════════════════════════════════
# §19 row 11, and §9's "it is a swap or a con, not a robbery — the one place in this release where her mind,
# not her body, does the work a second time." Three surfaces here plus cap_the_swap in 5_scenes:
#   kess_makes_the_blank    @kess_berth      the decoy gets made. SETS decoy_made
#   activity_into_the_store @the_rise_floor  the door, gated on the decoy
#   activity_leave_the_store @the_dry_store  the unconditional way back
#
# ⚠️ §21 OPEN ITEM 3, ANSWERED — AND beat_0131 ALREADY ANSWERED IT. The drain established every constraint
# the forgery has to survive, in his own mouth: the door LOGS, the item is SIGNED FOR, and he checks a
# TEMPERATURE RANGE and nothing else ("Nothing else about it interests me"). So the con is a blank of the
# same physical type, carrying the same eleven characters, held in range. Nothing new had to be invented.
# ⚠️ AND THE LOG IS WHY IT MUST BE A SWAP. A theft makes the log a confession — a reader who went in the
# morning something vanished. A swap makes the same log harmless: she went in, she came out, nothing is
# missing. THE SWAP IS WHAT MAKES SIGNING IN SAFE, which is the whole shape of the con and it is hers.
# ⚠️ IT HOLDS UNTIL SOMEBODY READS IT. Sabin needs the METHOD, which is in how the capture was taken and not
# in what it says, so he may not open it for months. That is the release's last standing door and Kess is
# the one who names it, because he is the only person in this game who tells her the whole price.
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════

# ── kess_makes_the_blank — the decoy. Repeatable shop screen @kess_berth, pri 4. ──────────────────────
# ⚠️ REPEATABLE AND OWNERSHIP-SHAPED, the activity_buy_papers pattern (:3085). A one-shot that costs coin is
# a trap: a player who cannot afford it when it fires has burned the scene. Repeatable + a `decoy_made
# is_false` gate means she can come back, and it closes itself the moment it has done its job.
# ⚠️ PRESENCE IS A CONDITION, NOT requires_npc. The render-bucket guard flags requires_npc WITHOUT npc= as a
# silent drop to a flat solo link, and this IS a solo activity that happens to need him at the bench. The
# npc_at_location clause does the gating and the guard stays clean. (It is also the clause beat_0130 proved
# an auto-fire needs anyway — requires_npc is not read on that path at all.)
# ⚠️ FORTY-FIVE COIN, against the credential's sixty. The day job pays fifteen, so it is three shifts or one
# night of something else — deliberately affordable without the floor, because the floor is optional.
# ⚠️ SHE TELLS HIM THE TRUTH. Kess is the one person in this game who has never been handled, and the beat
# where he asks what it has to survive and she answers plainly is what earns his warning at the end of it.
