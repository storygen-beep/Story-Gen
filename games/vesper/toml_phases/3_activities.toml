# ── off — THE BEAT. ⚠️ The one moment she chooses to be Wren, and the only place she can. ────────
# ⚠️ IT NAMES WHAT IT COSTS, MECHANICALLY, IN HER VOICE. Six surfaces stop existing and nothing else in the
# game would ever tell her. It is written as a thing she knows, not as a warning.
# ⚠️ AND IT DOES NOT EXPLAIN WHY SHE WANTED TO. She has no reason that would survive being said out loud,
# which is the point of the beat — the chapter's whole argument is that she is a person now, and a person
# does not need a mission to want her own face back for an hour.
[[canvases.nodes]]
id   = "off"
name = "Take it off"
blocks = [
  { type = "paragraph", content = "It comes off faster than it goes on. A minute at the basin, the water going grey, and the woman who has been carrying trays for a man who owned her stops existing over a cracked sink in a ship-breaker's yard." },
  { type = "thought_bubble", props = { speaker = "player" }, content = "Nothing out there is hers while this is off. Sol does not know her. The floor is not her floor and the rota does not have her on it, and the room behind the door is a room she has never been invited into. All of that belongs to a woman with no name who does not exist until she puts it back on." },
  { type = "paragraph", content = "She does it anyway, most nights, for an hour, and could not give a reason that would survive being said out loud." },
  { type = "paragraph", content = "The face in the glass is four years older than the paperwork says and has a designation on a page in a file under the cot, and it is the only thing in this city that nobody sold her." },
]
