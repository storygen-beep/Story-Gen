# ── beat_0075 (rev 120) — THE PARTS STALL: the supply side of The Leash's loop ───────────────────
# design_the_leash.md §8: the part burns on failure, so there are no free retries and she has to go
# earn between attempts — which is what makes the House and the Pit spine instead of side-earning.
# ITS OWN CARD, not a fourth choice on underworld_market_shop, and that is the whole point: the loop's
# next step is a VISIBLE card that appears exactly when it is wanted and disappears the moment she is
# carrying one. Buried in a menu it would be a thing the player has to remember; as a card it is a
# thing the market tells her.
# THE TWO `lt 1` CLAUSES ARE THE NO-STOCKPILING RULE. One part at a time, so the burn actually bites:
# she cannot buy four on a good night and walk the loop without ever going back to work.
# PRICE — 25 coin, against a 10-coin night on the feed line, a +20 pit win, a +10 brothel finisher and
# +15 off Marsh. One cycle runs ~35 coin all in, four cycles ~140. Two or three earning actions a
# cycle: enough that the coin economy is load-bearing, short of the grind the mopoga review found.
# ⚠️ Coin NEVER blocks the mainline (design_book): the free crash-rough bed keeps her upright whatever
# her purse says, and a short purse GREYS this choice rather than taking her negative — costs are
# checked by checkCostsAffordable before they deduct.
# ═══ activity_buy_case — rev 134. THE BONDED CASE: the capture device Kess sends her for ═══════════════
# WHY IT EXISTS: kess_needs_print can't have Mercer in the yard, and the key can't go to him either — it is
# in pieces on the bench, and Mercer carried it two years and would know it by the weight. So the hand has to
# be brought to Kess ON something. This is that something, and it is the chapter's first player-PERFORMED
# step: buy an object, carry it in, use it, bring it back. The print used to just happen inside the prose.
# ⚠️ A CASE AND NOT A FLASK — rev 134, and the correction matters. A palm-locked flask is a thing he KEEPS,
# so the print walked out of the room in Mercer's pocket and never reached the bench. A bonded courier case
# is the opposite: he opens it, takes what is inside, and the empty box is rubbish. What he keeps and what
# she carries away are DIFFERENT OBJECTS, which is the whole mechanism.
# ⚠️ AND THE RECORDING IS NOT A HACK — it is the product's actual purpose. A bonded case logs the hand that
# opened it because the log IS the proof of delivery. She is not smuggling a scanner into his room; she is
# handing him a parcel that works exactly as advertised, in front of him, and the receipt is the theft.
# THE BOTTLE INSIDE is the gift and is deliberate: he is a man defined by pouring, so a bonded bottle is
# both the most natural present she could bring him and the one he will open on the spot.
# GATES mirror activity_buy_part exactly (print_needed opens it, held/taken fence it), so the market teaches
# one shopping pattern met twice. Same 25 coin, same +30 min.
# Reuses locations/underworld_market.jpg — establishing shots are the one asset this game reuses.
[[canvases]]
id          = "activity_buy_case"
name        = "The bonded stall"
description = "rev 134 (was activity_buy_case at rev 133; a flask is KEPT, so the print never came home — a case is opened and discarded, which is the mechanism). Wren-solo @underworld_market. Repeatable, pri 3, gated print_needed is_true + case_held lt 1 + owner_print_taken is_false, so it shows from Kess's dispatch until the print is taken and never again. One buy: 25 coin -> case_held = 1, +30 min. Same shape and price as activity_buy_part, deliberately."
[canvases.trigger]
location      = "underworld_market"
