# ═══ activity_buy_papers — beat_0128 (rev 178), WHOSE HAND. THE WAY IN. ═════════════════════════════════
# Wren-solo @underworld_market. Repeatable, pri 3, gated rise_named is_true + cover_research NOT OWNED.
#
# ⚠️ THE TRIGGER GATES ON OWNERSHIP, NOT ON A BOUGHT-FLAG, AND THAT IS THE WHOLE SAVE-SAFETY POINT.
# save-safety §5: the backfill has no wardrobe branch, so a clothing item added in a later release than the
# beat that grants it never reaches a save that already passed that beat — and cover_research GATES
# PROGRESSION, which is the 0.1.5.1 soft-lock class exactly (cover_analyst, granted on a one-shot dispatch,
# stranded every 0.1.4 -> 0.1.5 carry-over on the floor forever). A `clothing_item ... not_owned` trigger
# cannot burn: if the kit is ever missing for any reason, this card is simply back at the stall.
# ⚠️ activity_buy_face's shape was ALMOST this and is not quite. It gates on face_bought is_false, so the
# card does vanish once the flag is set. That was survivable because the face shipped in the same release as
# its gate. This one does not get to rely on that, and there was no reason to copy the weaker half.
# ⚠️ THE FLAG papers_bought EXISTS FOR THE QUEST CARDS AND FOR NOTHING ELSE. setup.checkQuestsCondition
# handles `flag` and `trait` ONLY — there is no clothing clause in a card's `when` — so the Quests page
# cannot read ownership and would go on telling her to buy papers she is already carrying. NEVER GATE THE
# GRANT ON IT. If a later beat wants to know whether she has the kit, it asks the wardrobe.
#
# ⚠️ 60 COIN, HALF THE FACE. The face was 120 and the header there is right that the number was the point —
# it was the largest ask in the game and the first thing she ever saved up for. This is bolted onto an
# identity she already owns, so it must not read as a second identical purchase. Post-raid her income is the
# pit (8 / 20 a bout) and The House (30 a head); activity_bar_work is correctly shut by raid_done, so 60 is
# two heads or three hard bouts, and the price sits on the choice label the way gate 21 requires.
#
# ⚠️ SHE IS NOT BUYING A FACE. She already has one and beat_0116 split it out of the clothing system — the
# face is the flag face_worn, toggled at the_cot. What is missing is the paper under it: somewhere that
# trained her, somewhere that employed her, in a format a hiring floor will not read twice.
#
# ⚠️ AND VANE'S HAND IS NAMED ONCE, IN SOMEBODY ELSE'S MOUTH, AND NEVER UNDERLINED. §6 says "Vane makes it",
# and the shipped game has him fleeing at the end of the Leash with "I'm gone tonight. The Reach, then
# further." He is not staged here — restaging him is an NPC amendment and this beat is budgeted as a Lane-3
# solo — but the woman at the row says whose hand is on the work, and Wren does not ask. Same discipline
# §18.4 sets for the Bastien line: said once, in passing, never returned to in this release.
#
# MEDIA: reuses locations/underworld_market.jpg. That file is already shared by activity_buy_face,
# activity_buy_part and underworld_market_shop — this is the fourth card at the same stall, and a fourth
# near-identical market shot would be media debt bought to satisfy a rule whose purpose (one review verdict
# per beat) is already conceded at this location by three shipped cards.
[[canvases]]
id          = "activity_buy_papers"
name        = "Paper for the tower"
description = "beat_0128 (rev 178), WHOSE HAND. Wren-solo @underworld_market. Repeatable, pri 3, gated rise_named is_true + clothing_item cover_research NOT_OWNED. Buy = 60 coin -> grants cover_research un-worn + sets papers_bought, +90 min. THE TRIGGER GATES ON OWNERSHIP AND NOT ON THE FLAG (save-safety §5 — this is the 0.1.5.1 gate-item class and a not_owned trigger cannot burn); papers_bought exists only because a quest card's `when` can read flags and traits and nothing else. She is buying a working history, not a face — she already owns the face, and beat_0116 made it a flag. The forger's hand is Vane's and the game says so once, in the seller's mouth, without staging him."
[canvases.trigger]
location      = "underworld_market"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "rise_named", operator = "is_true" },
  { type = "clothing_item", item_id = "cover_research", operator = "not_owned" },
] }

[[canvases.nodes]]
