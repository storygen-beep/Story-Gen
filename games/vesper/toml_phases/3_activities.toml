# ── Node: sift. Three exclusive bands on ruin_depth — what the floor gives up, in order. ────────────────
# ⚠️ ruin_depth AND NOT yard_depth. The first cut used the Burned Yard's odometer on the reasoning that it
# was "the same shape of thing" — but it is already at 3 when this chapter starts (that crawl is mandatory
# Act-1 content), so band 1 was dead and the first sift jumped straight to the terminal band. From a fresh 0
# the thresholds below give band 1 twice, band 2 twice, then the terminal band: a four-click crawl.
[[canvases.nodes]]
id   = "sift"
name = "What the floor gives up"
blocks = [
  # BAND 1 — the shape of the loss. Mostly nothing, and one thing that is not nothing.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "ruin_depth", operator = "lt", value = 2 },
    ] } }, blocks = [
    { type = "paragraph", content = "An hour on her knees in wet ash. Manifests, bills of lading, a decade of somebody moving cargo that was never cargo. All of it worthless and all of it his, and none of it what he was actually keeping." },
    { type = "paragraph", content = "The spines with the dates on them are gone. Not burned — gone. Somebody lifted whole years off that wall before the fire and the fire was for the rest." },
  ] },
  # BAND 2 — the first name off her own index.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "ruin_depth", operator = "gte", value = 2 },
      { type = "trait", subject = "player", trait_key = "ruin_depth", operator = "lt",  value = 4 },
    ] } }, blocks = [
    { type = "paragraph", content = "Under the desk, where the desk protected it, half a folder with the top third burned off. Vance paper. A transfer of custody, eleven years old, and a designation in the same format as her own." },
    { type = "paragraph", content = "It is not hers. She checks it four times against a number she has read exactly once and will never need to read again. The second date column on that sheet is filled in." },
  ] },
  # BAND 3 — the terminal band. What she now has, and what it is not.
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [
      { type = "trait", subject = "player", trait_key = "ruin_depth", operator = "gte", value = 4 },
    ] } }, blocks = [
    { type = "paragraph", content = "She goes back through it in daylight, and then again, and what she has at the end of it is nine sheets that mean anything and a coat that smells of burned paper for a fortnight." },
    { type = "paragraph", content = "Nine designations in her own format. Six of them have a date in the second column. Two do not. One of them is a line she has read before, on a bench, at a breaking dock, with a man standing over there pretending not to look." },
    { type = "paragraph", content = "There is nothing in any of it about where a man might live, and nothing in any of it about who came back eight months after the programme closed and sealed one page. That is not in this room. That was never going to be in this room." },
  ] },
]
[canvases.nodes.exit_block]
type = "location"
text = "Take what there is."
[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "underworld_bar"
time_progression_minutes = 120

# ═══ activity_the_face — beat_0116 (rev 167). The face goes on and comes off HERE, and nowhere else. ════
# Wren-solo @the_cot. Repeatable, pri 4, gated face_bought is_true. Two exclusive bands on face_worn.
#
# ⚠️ WHY THIS IS A CANVAS AND NOT A WARDROBE ROW. Until this beat the face WAS a garment, and putting it on
# was a line item on a clothes rack between a bra and a pair of flats. That was an engine-shaped decision I
# made on a wrong assumption (that the portrait resolver only keys on worn_type — it takes `flag` too,
# v2.py:1664), and it flattened the single most consequential act in the chapter into a costume change.
# Six surfaces in this game exist only while she is wearing it. That is not clothing. That is who she is.
#
# ⚠️ THE TWO DIRECTIONS ARE NOT SYMMETRICAL AND MUST NOT BE WRITTEN AS IF THEY WERE.
# PUTTING IT ON is routine after the first time — she has a job and a room to be in and this is the cost of
# both, and the prose treats it as the small competent act it has become.
# TAKING IT OFF IS THE BEAT. It is the one moment in the chapter where she chooses to be Wren again, and she
# does it at her own bunk because that is the only room where nobody is watching. It costs her everything the
# chapter has built, and she does it anyway, and the game does not tell her why she wanted to.
#
# ⚠️ AND IT STATES THE MECHANICAL COST IN HER OWN VOICE. Six surfaces vanish with the face — the shift card,
# the two promotions, Bastien noticing her, the door, the room — and a player who takes it off and finds the
# Undertow empty has no way at all to connect the two. So the take-it-off band says plainly what stops
# existing, as a thing she knows rather than as a warning label.
# ⚠️ NO TIME COST ON THE TOGGLE ITSELF. It is minutes at a mirror, and charging the clock for it would make
# the honest act (taking it off, sitting with it, putting it back) more expensive than never taking it off.
# ── canvas_chip_view_cot — beat_0122 (rev 174), WHOSE HAND. THE MEMORY STORE, SECOND HOME. ────────────
# ⚠️ THIS IS A PAIR, NOT A MOVE, AND THE DESIGN SAID MOVE. design_whose_hand.md §16.2 asked for
# canvas_chip_view to be re-pointed from `cradle` to `the_cot`, because the cradle sits behind the Spire seal
# and the UI this release fills is otherwise unreachable. It cannot be re-pointed: `the_cot` is gated
# `berth_home is_true` (1_metadata_and_locations.toml:1160), an Act-2 flag, while `cradle` is reachable in the
# game's first hour. Re-pointing would have deleted the memory store from the whole of Act 1 — the four leaks
# (the opening night, both cradle glitches, Glitch III) would still fire and the surface they point at would
# not exist yet. So the Act-1 canvas STAYS WHERE IT IS and this one is added beside it. The finding is written
# back into §16.2 rather than patched quietly here.
# ⚠️ AND THE PAIR IS WHY THE FIRST BAND WORKS AT ALL. Band A0's beat is "they sealed the building and never
# took this" — which only lands if there was an earlier place she used to open it in. A move would have
# deleted the very thing that makes the line true.
# ⚠️ BANDS RUN ON ONE COUNTER, pieces_seated (0_systems_spec), not a flag per piece. Three surfaces read it.
# ⚠️ A0 IS ONE-SHOT VIA store_carried_seen. It is a realisation, and a realisation on a repeatable surface
# rots by the third read (design_whose_hand.md §3 test 2). The exit choice is the located setter.
# ⚠️ NO THIRD SLOT IS SHOWN. She learns a third piece exists at beat 17, from Grier. A store that displays an
# empty third slot at install two spoils the ending two beats early.
# MEDIA: its OWN asset, not canvas_chip_view's. One asset, one block — a shared file collapses to one review
# verdict for two different beats.
[[canvases]]
id          = "canvas_chip_view_cot"
name        = "The memory store"
