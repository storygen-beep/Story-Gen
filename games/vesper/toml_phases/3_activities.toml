location      = "underworld_bar"
is_repeatable = true
priority      = 3
is_active     = true
# ⚠️ max_triggers_per_day = 2 — beat_0111 (rev 161), AND IT IS A REAL FIX, NOT DRESSING. Without it this card
# was a money printer: 15 coin a shift, unlimited shifts, against a 10-coin cot night that restores the whole
# Charge pool — roughly six shifts per night for a net +80 coin, repeatable forever. The audit gate names the
# shape ("standing surfaces print money without limit") and vesper went from two of them to three when this
# card shipped. The other two (the pit, the Sunday hunt) are pre-existing; this one was mine.
# ⚠️ THE CAP HAS TO BE ON THE TRIGGER. A `costs` block on the CHOICE does not satisfy it and does not stop it:
# the model reads max_triggers_per_day and costs off the TRIGGER (gates.py:419-420), and more to the point a
# Charge cost is not a cap at all when Charge refills for 10 coin. Only a per-day limit bounds it.
# ⚠️ TWO AND NOT ONE. Two evenings' work a night is the most the fiction supports, and it keeps the ladder at
# roughly four in-game days (relation 6/12/18 at +2/+3/+3). One would double that for no gain.
# The engine enforces it at setup.canTriggerActivity (v2.py:4495, :4526), keyed on the canvas NAME and reset
# on the calendar-day rollover — so a name collision would share the limit. This name is unique.
# ⚠️ IT CANNOT STALL HER. The 120-coin face is bought BEFORE the job exists, out of The House and the pit, and
# the only thing bar money has to cover afterwards is the 30-coin taser. Capping at 30 a day blocks nothing.
max_triggers_per_day = 2
# ⚠️ beat_0107 (rev 157) — raid_done is_false. Three machines came through the wall between this room and
# the bar and set eleven years of paper alight; the Undertow does not open the next evening, and a shift card
# that survived the fire would be the surface contradicting the scene. Her income falls back to The House and
# the pit, both of which still stand, and the ruin crawl takes over as the standing content at this location.
