# ═══ activity_the_face — beat_0116 (rev 167). The face goes on and comes off HERE, and nowhere else. ════
# Wren-solo @the_cot. Repeatable, pri 4, gated face_bought is_true. Two exclusive bands on face_worn.
#
# ⚠️ WHY THIS IS A CANVAS AND NOT A WARDROBE ROW. Until this beat the face WAS a garment, and putting it on
# was a line item on a clothes rack between a bra and a pair of flats. That was an engine-shaped decision I
# made on a wrong assumption (that the portrait resolver only keys on worn_type — it takes `flag` too,
# v2.py:1664), and it flattened the single most consequential act in the chapter into a costume change.
# Six surfaces in this game exist only while she is wearing it. That is not clothing. That is who she is.
#
# ⚠️ THE TWO DIRECTIONS ARE NOT SYMMETRICAL AND MUST NOT BE WRITTEN AS IF THEY WERE.
# PUTTING IT ON is routine after the first time — she has a job and a room to be in and this is the cost of
# both, and the prose treats it as the small competent act it has become.
# TAKING IT OFF IS THE BEAT. It is the one moment in the chapter where she chooses to be Wren again, and she
# does it at her own bunk because that is the only room where nobody is watching. It costs her everything the
# chapter has built, and she does it anyway, and the game does not tell her why she wanted to.
#
# ⚠️ AND IT STATES THE MECHANICAL COST IN HER OWN VOICE. Six surfaces vanish with the face — the shift card,
# the two promotions, Bastien noticing her, the door, the room — and a player who takes it off and finds the
# Undertow empty has no way at all to connect the two. So the take-it-off band says plainly what stops
# existing, as a thing she knows rather than as a warning label.
# ⚠️ NO TIME COST ON THE TOGGLE ITSELF. It is minutes at a mirror, and charging the clock for it would make
# the honest act (taking it off, sitting with it, putting it back) more expensive than never taking it off.
# MEDIA: none. It reuses the room she is standing in.
[[canvases]]
id          = "activity_the_face"
name        = "The face"
description = "beat_0116 (rev 167). Wren-solo @the_cot. Repeatable, pri 4, gated face_bought is_true. THE FACE IS NO LONGER A GARMENT — it is the flag face_worn, and this is the only surface that moves it. Two exclusive bands: off (put it on, routine) and on (take it off, the beat). Taking it off is deliberate and carries weight: it is the one moment in the chapter where she chooses to be Wren again, done at her own bunk because it is the only room where nobody is watching. The on-band states the mechanical cost in her own voice — six surfaces exist only while she wears it, and a player who takes it off and finds the bar empty could not otherwise connect the two. No time cost: charging the clock would make the honest act more expensive than never doing it."
