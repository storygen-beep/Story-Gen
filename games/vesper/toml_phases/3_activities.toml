[[canvases.nodes]]
id   = "base"
name = "Ask him to come with you"
blocks = [
  { type = "paragraph", content = "He comes, because he always comes. She has stopped pretending to herself that she works out when and started simply waiting for it, which takes a day and a half this time." },
  { type = "dialog", props = { speaker = "player" }, content = "It went up. A man came down for it in a case with a lock on it and took it up the tower, and the man who watched that happen is forty minutes' walk from here and will not talk to you." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_cain" }, content = "No." },
  { type = "paragraph", content = "That is all of it. Not an argument, not a reason — a door closing, and she has watched enough men close enough doors to know she is not getting this one open by pushing on it." },
  { type = "dialog", props = { speaker = "player" }, content = "I am not asking you to talk to him. I am asking you to stand in his room while he talks to me, because he has the half you have not got and you have the half he will never get, and I am the only thing either of you will let through a door." },
  { type = "paragraph", content = "He looks at the floor for a while, the way he looked at it on the end of her bunk, and then he picks his coat up off the bench and holds the door open, which is his entire answer." },
]
