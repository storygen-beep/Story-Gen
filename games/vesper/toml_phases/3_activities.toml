# Glitch III — Tier-3, once-only. The group is gated glitch_iii_seen is_false and the EXIT sets the flag,
# so the spend fires exactly once on a repeatable verb. Matches the shipped glitch_i_seen / glitch_ii_seen
# convention. It must NOT leak the Cain–Bastien alliance: what surfaces is warmth without a face.
[[canvases.nodes]]
id   = "hold_still"
name = "Hold still and feel the fault"
blocks = [
  { type = "paragraph", content = "She lies on her back and stops doing anything at all, and listens to herself the way she listened to the door. The charge sits under her sternum with nowhere to be. It has a sound. It has, she realises, started to have a smell — hot dust, the inside of a machine that has been run too long." },

  { type = "group", props = { conditions = { version = "1.0", items = [
      { type = "flag", subject = "player", flag_key = "glitch_iii_seen", operator = "is_false" },
    ] } }, blocks = [
    { type = "paragraph", content = "And then the fault opens, the way a badly-set bone opens, and something comes up through it that was never filed anywhere she can reach." },
    { type = "paragraph", content = "A hand at the back of her neck. Not holding her — resting there, the thumb moving once, slowly, along the seam. Somebody standing behind her while she looks at something she cannot see, and in the whole of her body, in the whole of the record, no fear at all. Not permitted absence of fear. The other kind. The kind that is simply not there because there is nothing in the room that could hurt her." },
    { type = "thought_bubble", props = { speaker = "player" }, content = "Whose hand." },
    { type = "paragraph", content = "It closes. It goes back down wherever it lives. She lies in a room she cannot leave with men on the other side of the door and she finds that she is holding the back of her own neck, and that her eyes have gone wet, and that she has no idea, none, whose hand that was." },
  ] },

  { type = "group", props = { conditions = { version = "1.0", items = [
      { type = "flag", subject = "player", flag_key = "glitch_iii_seen", operator = "is_true" },
    ] } }, blocks = [
    { type = "paragraph", content = "She reaches for it again — the hand, the seam, the quiet — and it isn't there. The fault doesn't open twice for the same thing. What's left is the pressure, and the hot-dust smell, and the certainty that it is worse than it was." },
  ] },
]
[canvases.nodes.exit_block]
type = "location"
text = "Let it go."
