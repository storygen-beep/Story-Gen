# ═══ activity_sift_the_ruin — beat_0107 (rev 157). The one thing left to do. ════════════════════════════
# Wren-solo @underworld_bar. Repeatable, pri 3, gated raid_done is_true.
#
# ⚠️ THIS CANVAS EXISTS BECAUSE 0.1.8 ENDED AND OPENED NOTHING. cap_extraction set two flags and its chain
# reached no standing content, so the player finished the story and had nothing to do — the v2 gate says it
# in structural terms and it is the single defect this whole release was scoped against. The Face must not
# repeat it, and this is the surface that stops it: after the last scene there is still a room to go back to.
#
# ⚠️ IT IS A CARD AT underworld_bar, NOT A NAV CARD ON THE ROOM, and that is deliberate. Giving
# bastien_backroom an entry_from would put a card for it on the Undertow's nav grid from the START OF THE
# GAME — locked, but visible — which leaks a saved reveal to an Act-1 player who is at that moment being
# held in a cell by the man who keeps it. Reaching it by an explicit canvas is the same shape
# bastien_door_search used, for the same reason, and it costs nothing.
# ⚠️ THE GOOD PAPER IS GONE — LO's call. The units took what was worth taking, so what is left is the junk
# Bastien sold for cash. That is why this is a crawl and not a library: she is going through a burned floor
# looking for the few sheets that matter among thousands that do not.
# ⚠️ AND WHAT SHE FINDS IS THE NEXT RELEASE, NOT THIS ONE. Names off her own index — the second date column,
# the ones they stopped. No answers, no addresses, no Cain. Three exclusive bands on ruin_depth, the crawl's
# OWN counter — see the node header for why borrowing yard_depth was a bug and not a shortcut.
# ⚠️ SOL IS ALIVE AND THAT IS ALREADY IN THE RAID: the bar emptied before the units reached it — "a room
# deciding all at once to be somewhere else" — so nobody who worked that floor was in it. He lets her back
# in because she is the only one who came back at all.
# MEDIA: reuses scenes/backroom_burning.jpg — the raid's own slot, the one asset this game reuses on purpose.
