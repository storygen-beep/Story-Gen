  { type = "flag",  subject = "player", flag_key  = "print_needed",      operator = "is_true"  },
  { type = "flag",  subject = "player", flag_key  = "owner_print_taken", operator = "is_false" },
  { type = "trait", subject = "player", trait_key = "case_held",         operator = "lt", value = 1 },
] }
[[canvases.nodes]]
id   = "base"
name = "The bonded stall"
blocks = [
  { type = "image", props = { file = "locations/underworld_market.jpg", description = "Dim black-market stalls under a low ceiling, weapons and gear laid on cloth, cages further back.", search_queries = ["black market weapons stall dim", "underground arms bazaar cages back"] } },
