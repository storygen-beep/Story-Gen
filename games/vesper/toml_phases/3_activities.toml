# Phase 3/7 — 3_activities.toml
# Vesper scaffold — the day-router (cradle recharge) + inter-district travel (Spire ⇄ Reach).
# These are the structural movement/time spine. Content activities (Renner's depot work,
# Mercer's chores, the §2 glitch beats) are authored onto these hosts in the beat tasks.

# ─── The day-router: power down at the cradle, wake charged ───────────────────
# The day-cycle ROUTER. Without it, daytime windows (Renner's depot 09:00–18:00) are
# unreachable from the evening start. Powers her down, advances the clock, restores charge.
# Schedule window 19:00–05:00 = she can power down through the night. The cradle = the free
# reset (design_book). The §2 glitch-intrusion beats attach to this host later.

[[canvases]]
id          = "activity_recharge"
name        = "Power down"
description = "Wren-solo. The cradle. The day-cycle router — powers down, advances ~9h, wakes her charged. Charge restored to full."

[canvases.trigger]
location      = "cradle"
is_repeatable = true
priority      = 3
is_active     = true

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "19:00"
end_time   = "05:00"

[[canvases.nodes]]
id   = "base"
name = "Power down"
blocks = [
  { type = "paragraph", content = "She settles back into the cradle. The contacts find their points along her spine. The room dims as the charge takes her down, and the quiet closes over the top of her like water." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Power up."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "cradle"
time_progression_minutes = 540
effects = [
  { targetType = "player", trait = "energy", op = "add", value = 100 },
]

# ─── Travel: Spire → Reach ────────────────────────────────────────────────────
[[canvases]]
id          = "activity_travel_to_reach"
name        = "Take the car to the Reach"
description = "Wren-solo. Spire Plaza → The Waterfront. Costs time + charge (the leash bites — schedules matter). Ungated in the slice (no hard charge-block — refine later)."

[canvases.trigger]
location      = "spire_plaza"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Take the car to the Reach"
blocks = [
  { type = "paragraph", content = "A company car waits at the curb, engine idling. She gives the docks address and it pulls out without a word. The Spire's glass falls away behind her; the city gets lower, wetter, dirtier the whole way down." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Ride down to the Waterfront."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_waterfront"
time_progression_minutes = 30
effects = [
  { targetType = "player", trait = "energy", op = "add", value = -10 },
]

# ─── Travel: Reach → Spire ────────────────────────────────────────────────────
[[canvases]]
id          = "activity_travel_to_spire"
name        = "Take the car to the Spire"
description = "Wren-solo. The Waterfront → Spire Plaza. Costs time + charge. Ungated in the slice."

[canvases.trigger]
location      = "the_waterfront"
is_repeatable = true
priority      = 2
is_active     = true

[[canvases.nodes]]
id   = "base"
name = "Take the car to the Spire"
blocks = [
  { type = "paragraph", content = "She calls the car. The docks recede behind her; the towers climb back up until the glass swallows the sky again. Home, if that's the word for the place that owns you." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Ride up to the Plaza."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "spire_plaza"
time_progression_minutes = 30
effects = [
  { targetType = "player", trait = "energy", op = "add", value = -10 },
]

# ─── Renner — the menial work (Lane 3 host): the trust grind + light credits ──
# Gated renner_hired. Raises Renner's relation (the way in — relation gates the
# office) + a thin credit payout (the early income loop). The rising Renner
# walk-ins (the escalating chore-hijack) attach to THIS host in the next increment.
[[canvases]]
id          = "activity_renner_menial"
name        = "Work the floor"
description = "Wren-solo (Lane 3 host). Depot, 09:00–18:00, gated renner_hired. Haul/sort/log — earns Renner relation (the trust grind) + light credits. Energy cost. Host for the rising Renner walk-ins (added next increment)."

[canvases.trigger]
location      = "renner_depot"
is_repeatable = true
priority      = 3
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "renner_hired", operator = "is_true" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "09:00"
end_time   = "18:00"

[[canvases.nodes]]
id   = "base"
name = "Work the floor"
blocks = [
  { type = "image", props = { file = "activities/renner_menial.jpg" } },
  { type = "paragraph", content = "She works the floor — hauling, sorting, logging crates against a manifest that hasn't matched reality since Cain came through. It's menial and dull, and her body doesn't tire the way a real one would, so she's better at it than the last three hands he ran off. The pay is thin, a handful of credits counted out grudging at the end of the day. But she does it well, and well is a language even a man this far gone still reads." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Knock off for now."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "renner_depot"
time_progression_minutes = 120
effects = [
  { targetType = "npc",    npcId = "npc_renner", trait = "relation", op = "add", value = 2  },
  { targetType = "player", trait = "money",  op = "add", value = 8   },
  { targetType = "player", trait = "energy", op = "add", value = -15 },
]
