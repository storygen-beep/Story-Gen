# ── Change — the ACT-1 change surface. THIS IS A BLOCKER FIX, not a convenience. ────────────────
# ⚠️ THE BUG IT REPAIRS. wardrobe_location is a scalar (v2.py:9601, :9649 compare slugs with ==), so the
# engine injects "[[Change Clothes->WardrobePage]]" into exactly ONE location. That location left wren_room
# at rev 145 and is now the_cot, which is entry-gated berth_home. Every cover in this game is granted with
# wardrobeEffects `add` and none carries `initial` — so between the opening and berth_home there was NO way
# to equip anything at all. Renner's whole hub is gated `clothing_item cover_dockhand equipped` (5_scenes:347,
# 534, 667, 809, 859, 976, 1307, 1361), which means MISSION 1 COULD NOT BE COMPLETED FROM A COLD START. It
# stayed invisible because every dev jump equips a cover directly (6_dev_shortcuts:269) and nobody replays
# Act 1. Found by the quests-page audit: card A's tip says "wear the dock-work coveralls from your room" and
# the player had no way to do it.
#
# ⚠️ WHY NOT JUST MOVE THE RACK BACK. Because unequip exists ONLY on the WardrobePage (the
# .wardrobe-unequip-btn handler), and the four equipped-based undress portraits fire off getUndressLevel().
# The rack has to live where those portraits belong, and rev 166 put that in the one room that is hers. So the
# rack stays at the_cot and Act 1 gets a TARGETED change surface instead — the activity_bar_change pattern
# (rev 167), which is the shipped precedent for exactly this: equip-only, no browsing, no second wardrobe.
#
# ⚠️ CHOICES GATE ON `owned`, NOT ON A PROXY FLAG. clothing_item supports owned/not_owned as well as
# equipped/unequipped (v2.py:4026), so each choice asks the real question — does she have this garment — and
# never drifts out of sync with whichever canvas granted it. show_when_locked + locked_text on both covers:
# a choice that silently vanishes from a room she walked to on purpose is the lostness failure.
#
# ⚠️ WINDOW. Gated opening_done, the same gate the room's other three cards use. wren_room has no
# entry_conditions and is reachable until the Spire zone-seal at archive_1a_done — which is exactly the span
# where cover_dockhand (Mission 1) and cover_analyst (The Archive) are both needed. After the seal the rack
# at the_cot takes over; see cap_1a_close, which puts her back in grays on the way out.
# MEDIA: reuses locations/wren_room.jpg. No new slot.
