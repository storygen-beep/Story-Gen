id          = "activity_wren_change"
name        = "Change"
description = "beat_0118 (rev 169). Wren-solo @wren_room. Repeatable, pri 3, gated opening_done is_true. THE ACT-1 CHANGE SURFACE — the fix for a cold-start blocker in which no cover could be equipped between the opening and berth_home, because wardrobe_location is a scalar and had moved to the_cot. Three choices, all wardrobeEffects `equip`, each gated `clothing_item <id> owned` with show_when_locked: the dock-work coveralls, the junior-analyst kit, her own company grays. NOT a second wardrobe — the rack stays at the_cot, because unequip and the undress portraits only exist there. equipItem replaces whatever holds the dress slot, so every choice is a straight swap and no unequip is needed; `unequipped` gates elsewhere read satisfied the moment a different garment holds the slot."
