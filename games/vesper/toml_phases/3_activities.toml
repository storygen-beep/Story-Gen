name = "Paper for the tower"
blocks = [
  { type = "image", props = { file = "locations/underworld_market.jpg", description = "Dim black-market stalls under a low ceiling, weapons and gear laid on cloth, cages further back.", search_queries = ["black market weapons stall dim", "underground arms bazaar cages back"] } },
  { type = "paragraph", content = "The same three curtained tables at the end of the row, and the same woman behind them, and not one sign anywhere on her that she recognises a face she cut herself." },
  { type = "dialog", props = { speaker = "player" }, content = "Not a face this time. A history. Somewhere that trained me, somewhere that had me for two years, and a card that gets looked at once by a floor that is hiring in a hurry." },
  { type = "paragraph", content = "The woman pulls a drawer out from under the table and sets three blanks on the cloth without answering, which is how she says yes." },
  { type = "paragraph", content = "\"Readers,\" she says. \"You want the Rise. Everybody who has asked me for this in a month wants the Rise, and none of you can read half as fast as you all think you can.\"" },
