[[canvases.nodes]]
id   = "night"
name = "The cradle"
blocks = [
  { type = "image", props = { file = "scenes/opening_cradle.jpg", description = "A bare private room at night, a woman stepping back into a charging pod in the corner.", search_queries = ["dark bedroom woman alone night", "empty room woman standing night"] } },
  { type = "paragraph", content = "The asset level is quiet the way a kept place is quiet. She comes down through the Tower to her own floor, her own door, her own room with nothing on the walls. The cradle waits in the corner." },
  { type = "cascade", props = { beats = [
    { advance_text = "Power down.", blocks = [
        { type = "paragraph", content = "She steps back into it. The contacts find the points along her spine, cold and familiar. The room dims as the charge takes hold, and the day's log begins to write itself down into the quiet. Every street walked, every shift worked: the cradle gives it back by morning. Let the charge run too low out there and the body starts to fail in ways a man's hands would notice." },
    ] },
    { advance_text = "...", blocks = [
        { type = "paragraph", content = "Then her face is wet. She registers it the way she'd register a leak in a seal. Water on her cheeks. No source she can name, no order that called for it. She holds perfectly still and runs every diagnostic she has, and every one comes back clean. She files the water under malfunction and resolves to have it looked at, and does not have it looked at, because some part of her already knows they'd take it out." },
    ] },
    { advance_text = "...", blocks = [
        { type = "image", props = { file = "scenes/cradle_fragment.jpg", description = "A woman's face in near-darkness inside a charging pod, eyes wet, a faint warm glow on one cheek as if from a memory.", search_queries = ["dark face woman pod light", "woman crying dark room glow"] } },
        { type = "paragraph", content = "And under the water, for less than a second, something else. Warmth on the side of her face. A low voice with her name in it. Someone looking at her, glad to be looking." },
    ] },
    { advance_text = "...", blocks = [
        { type = "paragraph", content = "Then the charge swallows it and it's gone. Where it was, something hurts. It hurts badly, and she has no word for it." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "Corrupted memory sector. Purge it. There was nothing there." },
    ] },
    { advance_text = "Recite it.", blocks = [
        { type = "paragraph", content = "She does what she does when the quiet gets loud. She recites." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "I was nothing. The company found me and made me of use. The Chairman keeps me running. I owe them the body and the work and the obedience. I exist to serve. That is all I have ever been." },
        { type = "paragraph", content = "The words settle her. They always do. She does not notice that the water is still on her face while she tells herself she is a thing that cannot weep." },
    ] },
    { advance_text = "The gift.", blocks = [
        { type = "paragraph", content = "There is one thing she has that the company gave her and the units don't. A man takes her ass and spends himself in it. For a few minutes after, he belongs to her. He'll answer anything, do anything, wake remembering none of it. It's how she works the men she's sent to work. It's the one thing that is, in any sense, hers." },
        { type = "paragraph", content = "It has never once worked on Mercer. He's had her every way there is, that one included. Nothing passes; the controls never come to her; he stays the hand on the leash. She has never asked why. The not-asking is so complete she doesn't notice it has a shape. A hole exactly the size of a question she isn't allowed to hold." },
    ] },
    { advance_text = "Power down.", blocks = [
        { type = "paragraph", content = "She lets the catechism be the last thing. She promises the quiet she'll do better. Fire next time, feel less, want nothing. The charge pulls her down past where the water and the fragment and the question all live, into the dark that is supposed to be empty and, lately, isn't quite." },
    ] },
  ] } },
]

