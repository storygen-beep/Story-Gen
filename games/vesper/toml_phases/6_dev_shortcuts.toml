# ─── ▶ The Archive: start — post-Salvage / pre-Archive (the sandbox threshold) ───
# Sets the game exactly where the LAST RELEASE (Salvage 0.1.4) left off and the NEW chapter (The Archive 1a)
# begins: the full through-Salvage state (salvage_done + mission_3_active + salvage_relaunched + core_sealed=1 =
# "Leash: Uncut"), the Calloway job dispatched, vance_securities unlocked, Charge full for the seduction, coin in
# hand. ZERO Archive progress (every Archive flag unset, npc_calloway.corruption 0, calloway_drains_done 0).
# Drops at spire_plaza — one click into Vance Securities, where cap_archive_cover (the first Archive beat) fires.
# Gated dev_mode_enabled; inert in shipped builds.
[[canvases]]
id          = "dev_jump_archive_start"
name        = "▶ The Archive: start"
description = "DEV JUMP. Post-Salvage / pre-Archive: seeds the full through-Salvage state (salvage_done, mission_3_active, salvage_relaunched, core_sealed=1) + full Charge + coin, drops at spire_plaza one click from Vance Securities where the Archive 1a opens (cap_archive_cover). Zero Archive progress. Gated dev_mode_enabled; inert in shipped builds."

[canvases.trigger]
location      = "spire_plaza"
is_repeatable = true
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "dev_mode_enabled", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "seed"
name = "The Archive start (dev)"
blocks = [
  { type = "paragraph", content = "Dev jump: seeding the post-Salvage state (Leash: Uncut, Calloway dispatched) and dropping at the Spire. Step into Vance Securities to open the Archive." },
]
[canvases.nodes.exit_block]
type = "location"
text = "To the Spire."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "spire_plaza"
effects = [
  { targetType = "player", trait = "equipped_weapon",      op = "set", value = 1 },
  { targetType = "player", trait = "core_strain",          op = "set", value = 0 },
  { targetType = "player", trait = "core_sealed",          op = "set", value = 1 },
  { targetType = "player", trait = "repair_session",       op = "set", value = 12 },
  { targetType = "player", trait = "calloway_drains_done", op = "set", value = 0 },
  { targetType = "player", trait = "coin",                 op = "set", value = 100 },
  { targetType = "player", trait = "energy",               op = "set", value = 100 },
  { targetType = "player", trait = "names_known",          op = "set", value = 1 },
]
flagEffects = [
  { targetType = "player", flag = "opening_done",       op = "set" },
  { targetType = "player", flag = "renner_drained",     op = "set" },
  { targetType = "player", flag = "hunt_lead",          op = "set" },
  { targetType = "player", flag = "crew_known",         op = "set" },
  { targetType = "player", flag = "bastien_found",      op = "set" },
  { targetType = "player", flag = "bastien_revealed",   op = "set" },
  { targetType = "player", flag = "captivity_entered",  op = "set" },
  { targetType = "player", flag = "captivity_broken",   op = "set" },
  { targetType = "player", flag = "captivity_done",     op = "set" },
  { targetType = "player", flag = "salvage_entered",    op = "set" },
  { targetType = "player", flag = "kess_met",           op = "set" },
  { targetType = "player", flag = "salvage_done",       op = "set" },
  { targetType = "player", flag = "mission_3_active",   op = "set" },
  { targetType = "player", flag = "salvage_relaunched", op = "set" },
  # rev 93 — by Archive-start Wren has been serving Mercer the whole game, so his hub must be OPEN. Leaving it
  # shut made every dev-jump run hit the penthouse capstone collision: cap_first_penthouse_service (pri 11, gated
  # mercer_hub_open is_false) out-ranked cap_1a_close, so testers got the "world without end" arrangement beat
  # immediately before Mercer panics and runs. The real fix is the docs_retrieved guard on that capstone; this
  # line makes the jump stop lying about the state it claims to land you in.
  { targetType = "player", flag = "mercer_hub_open",    op = "set" },
]
# Cover port — land testers IN cover so "one click into Vance -> cap_archive_cover" (the jump's promise) holds.
wardrobeEffects = [
  { action = "equip", item_id = "cover_analyst" },
]

