# ═══ dev_jump_loop_armed — beat_0076 (rev 121): arm one cycle of the parts loop ════════════════════════════
# COMPOSES with dev_jump_parts_loop above rather than duplicating its sixty lines of seed: take that jump
# first (or play forward to it), then take this one at the market to skip the buy and the install and stand
# one click away from the attempt. Repeatable, so a tester can re-arm after each failure without walking the
# whole cycle again.
# ⚠️ It lands back at underworld_market rather than at mercer_room on purpose: no effect can set the clock
# (there is no clock-writing effect op, and no condition type reads the clock either), and Mercer is only in
# his room 23:00-08:00, so dropping the tester at a locked door would be worse than dropping them a walk away
# from an open one.
# Gated dev_mode_enabled, inert in every shipped build.
[[canvases]]
id          = "dev_jump_loop_armed"
name        = "▶ 1b: arm a parts-loop cycle (part seated)"
description = "DEV JUMP. Opens the parts loop and seats a part (parts_loop_open, part_installed = 1, part_held = 0) without walking the buy and the install, and tops up coin and the feed line so the next cycle is affordable. Repeatable — re-arm after each failure. Lands back at underworld_market; the clock is not settable, so the walk to Mercer's 23:00-08:00 window is the tester's to make."

[canvases.trigger]
location      = "underworld_market"
is_repeatable = true
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "dev_mode_enabled", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "seed"
name = "Arm a cycle (dev)"
blocks = [
  { type = "paragraph", content = "Dev jump: the parts loop opened and a part seated at the seam, skipping the buy and the bench. Coin and the feed line topped up so the next cycle is affordable. Mercer keeps 23:00-08:00 — walk it." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Into the market."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "underworld_market"
effects = [
  { targetType = "player", trait = "part_held",      op = "set", value = 0 },
  { targetType = "player", trait = "part_installed", op = "set", value = 1 },
  { targetType = "player", trait = "coin",           op = "set", value = 120 },
  { targetType = "player", trait = "energy",         op = "set", value = 100 },
  { targetType = "player", trait = "feed_line_days", op = "set", value = 3 },
]
flagEffects = [
  { targetType = "player", flag = "parts_loop_open", op = "set" },
]

# ═══ dev_jump_0_1_9_start — beat_0112 (rev 162): the 0.1.8 END-STATE, ready for THE FACE ═══════════════════
# The jump a tester wants for 0.1.9: everything 0.1.8 shipped, run all the way to its last beat, and stopped
# exactly one step before the new chapter opens.
#
# ⚠️ IT LANDS AT kess_berth WITH chip_read UNSET, which is the whole point — cap_chip_read is an auto-fire
# gated leash_cut is_true + chip_read is_false + npc_kess present, so walking in during his 10:00-22:00
# window OPENS THE CHAPTER. Take the jump, be at the berth in daylight, and the first beat plays.
# ⚠️ THE CLOCK IS NOT SETTABLE. There is no clock-writing effect op and no condition type reads the clock, so
# if the jump lands outside 10:00-22:00 the berth is dark and berth_offhours renders instead. Sleep at the cot
# and come back — the same caveat every other late jump in this file carries.
#
# ⚠️ THE STATE IS THE REAL 0.1.8 END-STATE, NOT AN APPROXIMATION. It extends dev_jump_parts_loop's seed (which
# stops at the print) through the rest of The Leash: the loop run to three attempts, the fire landed, and the
# extraction done. The load-bearing values are:
#   mercer_leash_state = 2  — the fire has been answered. This is what cap_extraction gated on, and what every
#                             post-chapter surface reads. Setting owner_drained alone is NOT enough.
#   leash_cut + file_read   — the chip is out and her page is open. leash_cut is what re-bands hub_kess_berth
#                             and what retires the whole parts-loop conversation.
#   part_installed = 1      — canon: cap_first_fire does NOT burn the fourth part, and cap_extraction's own
#                             prose says "the fourth part is still in her and the key is still beside it".
#   part_spec = 3, spec_pending = 0, mercer_attempts = 3 — the loop finished and was debriefed, so no stall.
#   yard_depth = 3          — she HAS done the Burned Yard (it is mandatory Act-1 content). Kept deliberately
#                             at its real value, because it is also the regression test for beat_0110: the
#                             ruin crawl must now band on ruin_depth and be completely unaffected by this.
#   stealth = 30            — a coherent late-game value, and the threshold bastien_door_search bands on, so
#                             the taser gets through by default. Drop it below 30 to test the other route.
#   brothel_hired + rue_introduced — The House is her income, and she needs 120 coin for the face plus 30 for
#                             the taser. 150 is seeded so the first purchase is immediate, but the earners
#                             are live either way.
# ⚠️ THE CHAPTER'S OWN COUNTERS ARE SET TO 0 EXPLICITLY rather than left to default, so the jump is idempotent
# — a tester can take it twice mid-run and get a clean chapter start instead of a half-climbed ladder.
# Gated dev_mode_enabled; inert in every shipped build.
[[canvases]]
id          = "dev_jump_0_1_9_start"
name        = "▶ 0.1.9: the 0.1.8 end-state (THE FACE opens)"
description = "DEV JUMP. Seeds the complete 0.1.8 end-state — Renner drained, the hunt run, captivity survived, the salvage done, the Archive closed, and The Leash played to its last beat (mercer_leash_state 2, owner_drained, leash_cut, file_read) — and drops at kess_berth with chip_read UNSET so cap_chip_read fires on entry and THE FACE opens. Coin 150 (the face is 120, the taser 30), stealth 30 (the door-search band), yard_depth 3 (its real post-Burned-Yard value, which is also the regression test that the ruin crawl no longer touches it). Every chapter counter zeroed so the jump is idempotent. Kess keeps 10:00-22:00 and the clock is not settable — sleep at the cot if it lands dark. Gated dev_mode_enabled; inert in shipped builds."

[canvases.trigger]
location      = "underworld_strip"
is_repeatable = true
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "dev_mode_enabled", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "seed"
name = "0.1.9 start (dev)"
blocks = [
  { type = "paragraph", content = "Dev jump: the whole of 0.1.8, run to its last beat. Renner drained, the hunt walked, the cell survived, the core sealed, the Archive closed, Mercer found under his new name, the leash answered and the chip cut out on Kess's bench. Her page is open and there is nothing in her that answers to anybody." },
  { type = "paragraph", content = "Dropping at the breaking-dock with the chip still on the bench and the chapter's first beat unplayed. Kess keeps 10:00-22:00 — if the dock is dark, take the cot and come back." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Into the berth."
