# ─── ▶ Captivity: the break — lands INSIDE the cell one use short of the threshold ───
# beat_0044 (per §16.3). Seeds everything Jump A does, plus bastien_revealed + captivity_entered +
# disarmed (equipped_weapon=0) + core_strain=95 + low energy. Exits to captive_room so the cell renders
# normally. From 95, one 'Lie down' (the guaranteed +12 night use) tips it to 100 -> the break auto-fires
# -> Cain follows. (First render will show captivity_intro once; dismiss it.)
[[canvases]]
id          = "dev_jump_captivity_break"
name        = "▶ Captivity: the break"
description = "DEV JUMP. Drops into the sealed cell at core_strain=95, disarmed, one use short of the break — so one Lie-down tips it to the break + Cain. Gated dev_mode_enabled; inert in shipped builds."

[canvases.trigger]
location      = "captive_room"      # anchor + the real destination
is_repeatable = true
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "dev_mode_enabled", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "seed"
name = "Captivity break (dev)"
blocks = [
  { type = "paragraph", content = "Dev jump: seeding a near-broken captivity state and dropping into the cell. Lie down once to tip the break." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Into the cell."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "captive_room"
effects = [
  { targetType = "player", trait = "equipped_weapon", op = "set", value = 0 },
  { targetType = "player", trait = "core_strain",     op = "set", value = 95 },
  { targetType = "player", trait = "energy",          op = "set", value = 30 },
  { targetType = "player", trait = "names_known",     op = "set", value = 1 },
]
flagEffects = [
  { targetType = "player", flag = "opening_done",      op = "set" },
  { targetType = "player", flag = "renner_drained",    op = "set" },
  { targetType = "player", flag = "hunt_lead",         op = "set" },
  { targetType = "player", flag = "crew_known",        op = "set" },
  { targetType = "player", flag = "bastien_found",     op = "set" },
  { targetType = "player", flag = "bastien_revealed",  op = "set" },
  { targetType = "player", flag = "captivity_entered", op = "set" },
]

