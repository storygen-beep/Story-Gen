# ═══ dev_jump_loop_armed — beat_0076 (rev 121): arm one cycle of the parts loop ════════════════════════════
# COMPOSES with dev_jump_parts_loop above rather than duplicating its sixty lines of seed: take that jump
# first (or play forward to it), then take this one at the market to skip the buy and the install and stand
# one click away from the attempt. Repeatable, so a tester can re-arm after each failure without walking the
# whole cycle again.
# ⚠️ It lands back at underworld_market rather than at mercer_room on purpose: no effect can set the clock
# (there is no clock-writing effect op, and no condition type reads the clock either), and Mercer is only in
# his room 23:00-08:00, so dropping the tester at a locked door would be worse than dropping them a walk away
# from an open one.
# Gated dev_mode_enabled, inert in every shipped build.
[[canvases]]
id          = "dev_jump_loop_armed"
name        = "▶ 1b: arm a parts-loop cycle (part seated)"
description = "DEV JUMP. Opens the parts loop and seats a part (parts_loop_open, part_installed = 1, part_held = 0) without walking the buy and the install, and tops up coin and the feed line so the next cycle is affordable. Repeatable — re-arm after each failure. Lands back at underworld_market; the clock is not settable, so the walk to Mercer's 23:00-08:00 window is the tester's to make."

[canvases.trigger]
location      = "underworld_market"
is_repeatable = true
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "dev_mode_enabled", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "seed"
name = "Arm a cycle (dev)"
blocks = [
  { type = "paragraph", content = "Dev jump: the parts loop opened and a part seated at the seam, skipping the buy and the bench. Coin and the feed line topped up so the next cycle is affordable. Mercer keeps 23:00-08:00 — walk it." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Into the market."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "underworld_market"
effects = [
  { targetType = "player", trait = "part_held",      op = "set", value = 0 },
  { targetType = "player", trait = "part_installed", op = "set", value = 1 },
  { targetType = "player", trait = "coin",           op = "set", value = 120 },
  { targetType = "player", trait = "energy",         op = "set", value = 100 },
  { targetType = "player", trait = "feed_line_days", op = "set", value = 3 },
]
flagEffects = [
  { targetType = "player", flag = "parts_loop_open", op = "set" },
]
