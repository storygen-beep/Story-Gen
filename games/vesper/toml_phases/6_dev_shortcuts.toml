locationId      = "the_waterfront"
effects = [
  { targetType = "player", trait = "equipped_weapon", op = "set", value = 1 },
  { targetType = "player", trait = "core_strain",     op = "set", value = 96 },
  { targetType = "player", trait = "energy",          op = "set", value = 80 },
  { targetType = "player", trait = "names_known",     op = "set", value = 1 },
