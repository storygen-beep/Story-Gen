# ════════════════════════════════════════════════════════════════════════════
# 6_dev_shortcuts.toml — DEV JUMPS (testing only)
#
# Every canvas here is gated on flag `dev_mode_enabled is_true`. That flag is set
# at StoryInit ONLY in `--dev` builds (package_from_toml --dev), so these canvases
# are completely inert in a shipped game. The v2 engine treats a canvas with that
# trigger flag as a "dev shortcut": the flag-chain validator, hint index, and
# flag-setter index all SKIP it, and the sidebar `<<devJumps>>` widget renders a
# link to its entry node (reached by direct Engine.play — the trigger is a marker,
# not a real gate). See memory: dev_jumps_engine.
#
# To add a jump: copy a block, point the exit at the node/location you want, and
# list the flag/trait sets that make that spot coherent. Rebuild with --dev.
# ════════════════════════════════════════════════════════════════════════════

# ─── ▶ Renner drain — seeds a first-drain state and lands on the drain payload ───
[[canvases]]
id          = "dev_jump_renner_drain"
name        = "▶ Renner drain"
description = "DEV JUMP. Seeds a coherent first-drain state (drain worn + spent, names delivered, Renner corruption 60, drain flags set) and jumps straight to renner_control_canvas.intro. Gated dev_mode_enabled; inert in shipped builds."

# Anchored to a real location so the canvas emits its passages (an unanchored canvas
# is pruned as unreachable and the sidebar link would 404). It renders as a card on the
# depot page in --dev, does NOT auto-hijack the room (verified), and the primary path is
# always the sidebar <<devJumps>> link (direct Engine.play, ignores this trigger). The
# dev_mode_enabled condition is the MARKER the engine keys on to tag this a dev shortcut.
[canvases.trigger]
location      = "renner_depot"
is_repeatable = true
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "dev_mode_enabled", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "seed"
name = "Renner drain (dev)"
blocks = [
  { type = "paragraph", content = "Dev jump: seeding the drain state and dropping into the payload." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Jump to the drain"
targetType = "node"
nodeId     = "renner_control_canvas.intro"
effects = [
  { targetType = "player", trait = "equipped_weapon", op = "set", value = 1 },
  { targetType = "player", trait = "drain_charge",     op = "set", value = 0 },
  { targetType = "player", trait = "drains_done",      op = "set", value = 1 },
  { targetType = "player", trait = "names_known",      op = "set", value = 1 },
  { targetType = "npc", npcId = "npc_renner", trait = "corruption", op = "set", value = 60 },
]
flagEffects = [
  { targetType = "player", flag = "opening_done",           op = "set" },
  { targetType = "player", flag = "renner_fucked_once",     op = "set" },
  { targetType = "player", flag = "renner_anal_once",       op = "set" },
  { targetType = "player", flag = "renner_drained",         op = "set" },
  { targetType = "player", flag = "renner_leads_extracted", op = "set" },
]

# ─── ▶ Bastien grab — seeds the whole hunt chain and lands on the kidnap capstone ───
# beat_0044 (per design_captivity_the_room.md §16.2). hunt_the_grab.base now ports into the cell
# (beat_0037). Seeds equipped_weapon=1 so Bastien has something to strip. Stops SHORT of
# bastien_revealed — the capstone sets that itself.
[[canvases]]
id          = "dev_jump_bastien_grab"
name        = "▶ Bastien grab"
description = "DEV JUMP. Seeds the full Underworld Hunt chain and jumps to the kidnap capstone (hunt_the_grab.base), which ports her into the cell. Gated dev_mode_enabled; inert in shipped builds."

[canvases.trigger]
location      = "crew_den"          # anchor only — the sidebar link bypasses the trigger
is_repeatable = true                # never auto-fires (selectAutoFireCanvasForLocation skips repeatable)
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "dev_mode_enabled", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "seed"
name = "Bastien grab (dev)"
blocks = [
  { type = "paragraph", content = "Dev jump: seeding the hunt chain and dropping into the grab." },
]
[canvases.nodes.exit_block]
type = "choices"
[[canvases.nodes.exit_block.choices]]
text       = "Jump to the grab"
targetType = "node"
nodeId     = "hunt_the_grab.base"
effects = [
  { targetType = "player", trait = "equipped_weapon", op = "set", value = 1 },
  { targetType = "player", trait = "drain_charge",     op = "set", value = 1 },
  { targetType = "player", trait = "drains_done",      op = "set", value = 1 },
  { targetType = "player", trait = "names_known",      op = "set", value = 1 },
  { targetType = "npc", npcId = "npc_renner", trait = "corruption", op = "set", value = 60 },
]
flagEffects = [
  { targetType = "player", flag = "opening_done",           op = "set" },
  { targetType = "player", flag = "renner_fucked_once",     op = "set" },
  { targetType = "player", flag = "renner_anal_once",       op = "set" },
  { targetType = "player", flag = "renner_drained",         op = "set" },
  { targetType = "player", flag = "renner_leads_extracted", op = "set" },
  { targetType = "player", flag = "hunt_lead",              op = "set" },
  { targetType = "player", flag = "brothel_hired",          op = "set" },
  { targetType = "player", flag = "crew_known",             op = "set" },
  { targetType = "player", flag = "bastien_found",          op = "set" },
]

# ─── ▶ Captivity: the break — lands INSIDE the cell one use short of the threshold ───
# beat_0044 (per §16.3). Seeds everything Jump A does, plus bastien_revealed + captivity_entered +
# disarmed (equipped_weapon=0) + core_strain=95 + low energy. Exits to captive_room so the cell renders
# normally. From 95, one 'Lie down' (the guaranteed +12 night use) tips it to 100 -> the break auto-fires
# -> Cain follows. (First render will show captivity_intro once; dismiss it.)
[[canvases]]
id          = "dev_jump_captivity_break"
name        = "▶ Captivity: the break"
description = "DEV JUMP. Drops into the sealed cell at core_strain=95, disarmed, one use short of the break — so one Lie-down tips it to the break + Cain. Gated dev_mode_enabled; inert in shipped builds."

[canvases.trigger]
location      = "captive_room"      # anchor + the real destination
is_repeatable = true
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "dev_mode_enabled", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "seed"
name = "Captivity break (dev)"
blocks = [
  { type = "paragraph", content = "Dev jump: seeding a near-broken captivity state and dropping into the cell. Lie down once to tip the break." },
]
[canvases.nodes.exit_block]
type = "location"
text = "Into the cell."
[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "captive_room"
effects = [
  { targetType = "player", trait = "equipped_weapon", op = "set", value = 0 },
  { targetType = "player", trait = "core_strain",     op = "set", value = 95 },
  { targetType = "player", trait = "energy",          op = "set", value = 30 },
  { targetType = "player", trait = "names_known",     op = "set", value = 1 },
]
flagEffects = [
  { targetType = "player", flag = "opening_done",      op = "set" },
  { targetType = "player", flag = "renner_drained",    op = "set" },
  { targetType = "player", flag = "hunt_lead",         op = "set" },
  { targetType = "player", flag = "crew_known",        op = "set" },
  { targetType = "player", flag = "bastien_found",     op = "set" },
  { targetType = "player", flag = "bastien_revealed",  op = "set" },
  { targetType = "player", flag = "captivity_entered", op = "set" },
]

# ─── ▶ Salvage: the waterfront — starts the repair chunk fresh (skips captivity) ───
