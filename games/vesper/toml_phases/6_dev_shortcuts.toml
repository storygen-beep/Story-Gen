# core_strain frozen at 96, the hunt + captivity flags through captivity_done) and drops at the_waterfront,
# so beat_0048 (the SALVAGE cold-open) auto-fires. Does NOT set salvage_entered — that's beat_0048's job.
# Gated dev_mode_enabled; inert in shipped builds.
[[canvases]]
id          = "dev_jump_salvage_start"
name        = "▶ Salvage: the waterfront"
description = "DEV JUMP. Seeds the captivity-complete state (equipped_weapon=1, core_strain=96, hunt+captivity flags through captivity_done) and drops at the_waterfront so the SALVAGE cold-open (beat_0048) auto-fires. Gated dev_mode_enabled; inert in shipped builds."

[canvases.trigger]
location      = "the_waterfront"
is_repeatable = true
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "dev_mode_enabled", operator = "is_true" },
] }

[[canvases.nodes]]
id   = "seed"
name = "Salvage start (dev)"
blocks = [
  { type = "paragraph", content = "Dev jump: seeding a post-captivity state and dropping on the waterfront. The Salvage cold-open fires next." },
]
[canvases.nodes.exit_block]
