# ─── DEV JUMP: the parts loop — post-print, pre-read (beat_0075, rev 120) ────────────────────────
# The 1b jump above lands PRE-Kess and stops there, so beats 0075-0079 (the whole parts economy and the
# three failures) had no hand-testable entry point. This one seeds the chapter forward through the print
# and stops one step short of kess_print_read, which is the loop's opening canvas: walk into the berth in
# his yard hours and it fires.
# Same caveat as the jump above: canvases gated dev_mode_enabled are INVISIBLE to the flag-chain validator,
# the hint index and the setter index, so this seed list is verified by hand and by live play only.
# ⚠️ NOTHING HERE SETS THE CLOCK — no effect type reaches time_state. Kess keeps 10:00-22:00 and Mercer
#   keeps 23:00-08:00, so a tester who lands at the wrong hour gets berth_offhours or the padlock, exactly
#   as a player would. Sleep on the cot to move the clock.
# ⚠️ parts_loop_open is EXPLICITLY UNSET so the jump always lands pre-read regardless of prior session
#   state, and part_held / part_installed / mercer_attempts are zeroed for the same reason.
