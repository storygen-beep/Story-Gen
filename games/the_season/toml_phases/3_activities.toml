# =============================================================================
# The Season — 3_activities · THE STANDING SURFACES
#
# A room's list is NEEDS + WORK + PEOPLE and nothing else (the-surfaces.md R2).
# That closed set is what sizes the screen; 8 is a backstop, never a target, and
# the field median for things-to-do-at-a-place is 3.
#
# ⚠️ R7 — EVERY SCREEN KEEPS ONE DOOR. One choice carrying neither conditions
#    nor costs. A failing choice renders NOTHING (v2.py:12806) — not a greyed
#    line — and a cost-bearing choice counts as conditional (v2.py:12827), so a
#    screen whose only affordance costs $3 is empty to a player at $0.
#
# ⚠️ WALK-INS ARE PATTERN B (exclusive_group). ONE partitioned roll, so the odds
#    written are the odds that run. With Pattern A the rate compounds to
#    1 - ∏(1-p) and the room's own work gets pushed off its own screen.
#    A claimed-but-ineligible slot falls to the HOST, never to the next bucket.
#
# ⚠️ EVERY SUBSTITUTION TARGET DECLARES trigger.location. getCanvasById builds
#    its lookup only from canvases carrying one (v2.py:3177-3191, :10986-11138).
#    Point a substitution at a triggerless canvas and it SILENTLY never fires.
#
# DISPATCH DEPTH: three targets per host, not one. Measured 2026-08-23 — every
# host in three of seven dispatching games could produce exactly ONE outcome, so
# the roll only decided whether the branch or the host rendered.
#
# The branches are THIN. DoL's are 458-473 bytes; vesper's is 2.3 KB. A band is
# one or two paragraphs plus a media pool, not a scene.
# =============================================================================


