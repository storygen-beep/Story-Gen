  { type = "cascade", props = { beats = [
    { advance_text = "Get under it.", blocks = [
        { type = "paragraph", content = "The water comes hot for as long as it takes one person and you have about four minutes of it. Dust off your shoulders first, then your arms, then the grit that has worked down under your waistband all day and sits in the crease of your ass." },
    ] },
    { advance_text = "Take the four minutes.", blocks = [
        { type = "paragraph", content = "You get your hand between your legs and wash properly because nobody out there can see and this is the only four minutes of the day that is yours. Your cunt is sore from the ladder and the heat and the wet cotton. The cold water on it makes you put a hand flat on the concrete." },
        { type = "paragraph", content = "Water off your tits, down your stomach, off the front of your thighs. Your nipples are up hard in the cold and you stand there with your eyes shut and let it run." },
    ] },
    { advance_text = "Listen.", blocks = [
        { type = "paragraph", content = "Boots on the gravel, going past, not slowing. Then a second pair that does slow, for about as long as it takes to read the clothes hanging over the gate, and then goes on." },
