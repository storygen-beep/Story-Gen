blocks = [
  { type = "paragraph", content = "Your brother is on the belt with his back to the wall and his face to the door. It is where Emmett has put himself every day since March. Twenty years old and he has stopped growing into anything." },
  { type = "dialog", props = { speaker = "player" }, content = "Emmett." },
  { type = "paragraph", content = "He nods at the belt, not at you, and keeps his hands moving." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_emmett" }, content = "You're on the rows or you're on the belt. Not both." },
  { type = "dialog", props = { speaker = "player" }, content = "That is the most you have said to me since March." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_emmett" }, content = "Rows or belt. That is all I said." },
  { type = "paragraph", content = "You wait to see if there is more of it. There is not." },
  { type = "paragraph", content = "When you go back out into the yard you can feel him not looking at the door." },
]

