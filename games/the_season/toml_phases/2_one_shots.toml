[[canvases.nodes]]
id   = "the_chair"
name = "The chair"
blocks = [
  { type = "paragraph", content = "Your uncle has a folding chair outside the third van and he is in it with the door open behind him and the light off inside. He has been out here since the crew ate and he will be out here when they stop talking." },
  { type = "paragraph", content = "He is your father's brother and he is nothing like him. Boyd fills a space. Prine waits at the edge of one." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_prine" }, content = "You had water today? Not coffee. Water." },
  { type = "dialog", props = { speaker = "player" }, content = "I had water." },
  { type = "paragraph", content = "He looks at you for slightly longer than the answer needed, then nods, and goes back to the dark past the vans." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_prine" }, content = "Nine weeks is a long time to do badly. Come get water off me if you run out." },
]

