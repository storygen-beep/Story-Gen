] }

# ⚠️ THE WINDOW IS WHAT STOPS THIS FIRING IN AN EMPTY ROOM — not `requires_npc`.
#    selectAutoFireCanvasForLocation -> isCanvasValid (v2.py:4559) reads schedules,
#    conditions and repeatability and NEVER reads requiresNpc; the field is consumed
#    in exactly two functions, checkRandomEncounters (v2.py:5245) and
#    checkAndSubstituteCanvas (v2.py:5318), and neither is this path. Shipped without
#    one: this fired at the camp at 06:10 on a Saturday with Prine out in the rows.
#    Keep requires_npc anyway — it is free and it documents intent. the-first-hour.md F5.
# Rae's two yard rows. The first covers the 05:05 handover out of the opening.
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "05:00"
end_time   = "08:00"

[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "18:00"
end_time   = "20:00"

[[canvases.nodes]]
id   = "coffee"
name = "Coffee"
blocks = [
  { type = "paragraph", content = "The window on the side of the yard is already open and there is already a line of two. The woman working it is somewhere in her fifties and she has the eggs going before anyone has asked for eggs." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "You're the Renfro girl. Coffee's a dollar, eggs are three, and I'm Rae." },
  { type = "dialog", props = { speaker = "player" }, content = "I know who you are." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Everyone knows who I am by Wednesday. Saves time to do it Monday." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Twenty crews I've fed out this window. You'll be the only girl on yours. That's not a question." },
  { type = "paragraph", content = "She hands the coffee across without waiting for the dollar and looks past you at the men coming out of the vans, the way you look at weather." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_rae" }, content = "Eat something before the heat gets up. I mean it. I have carried two of them out of those rows." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Take the coffee."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_yard"
time_progression_minutes = 10
flagEffects = [
  { targetType = "player", flag = "met_rae", op = "set" },
]


