# =============================================================================
# The Season — 2_one_shots · THE FIRST HOUR
#
# COLD OPEN (the-first-hour.md F1). ~150 words, her situation and the pressure,
# and it names NOBODY. Ten of twenty field openings name nobody at all; the
# measured defect is the middle — a cold open carrying a staged open's payload,
# at 46 words per named character against a field rate of ~229.
#
# F3 — THE FUNNEL LANDS ON AN OPEN DOOR. first_light exits to the_yard with
# time_progression_minutes = 5, so the clock reads about 05:05. Rae's window is
# scheduled 05:00-08:00 and is live at that minute. Arithmetic, not hope: a
# random ambient is a coin flip and a walk-in has no door of its own, and both
# fail F3 by construction.
#
# F5 + F8 — ONE FLAG PER CHARACTER. Five meetings, five flags, each opening that
# character's hubs and nobody else's. All six earlier v2 games ship the
# forbidden shape: a repeatable canvas with npc= whose base node IS the
# introduction.
#
# ⚠️ BOYD IS MET AT THE SCALE, NOT AT THE SETTLE. The rent system renders its
#    own three pages from [settings.rent.text] and takes the money itself
#    (engine.md §26) — there is no hook in it to set met_boyd, and nothing here
#    charges the $60.
#
# FIRST CHARGED BEAT ON NIGHT ONE (the-release.md §). The strongest-retained
# game in the comparison set is explicit on night one, two clicks from free
# roam. first_wash is on the NERVE axis and nobody touches anybody.
#
# npc_halbrook deferred to 0.2 with the_porch — see 1_metadata_and_locations.
# =============================================================================


# ── The cold open ────────────────────────────────────────────────────────────
[[canvases]]
id          = "canvas_first_light"
name        = "First light"
description = "Opening. Monday 05:00, the trailer. Names nobody. Establishes: nine weeks, paid by the bin, the contract is in her father's name, the back bunk, nine miles of road. Exits to the_yard at ~05:05, where Rae's window is open. SETS first_week_started."

[canvases.trigger]
location      = "the_camp"
is_repeatable = false
priority      = 20
is_active     = true

[[canvases.nodes]]
id   = "bunk"
name = "The back bunk"
blocks = [
  { type = "image", props = { file = "scenes/first_light.jpg", description = "The inside of a small camp trailer before dawn, a narrow bunk behind a curtain.", search_queries = ["camp trailer bunk interior dawn", "small travel trailer bed curtain morning"] } },
  { type = "paragraph", content = "Five in the morning and the light through the trailer window is the colour of dishwater. Nine weeks here, then the next place. You have done six seasons of this and you know the shape of the day before your feet are on the floor." },
  { type = "paragraph", content = "You get the back bunk because you are the only woman on the crew. You get it because your father says you get it. Behind the wall your brothers are still out. You can hear which one is snoring." },
  { type = "paragraph", content = "Paid by the bin, and the money goes through the man whose name is on the contract, which has never once been yours. Nine miles of dirt between the gate and the highway. No car." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Get up before the others do."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_yard"
time_progression_minutes = 5
flagEffects = [
  { targetType = "player", flag = "first_week_started", op = "set" },
]


# ── The anchor introduces itself — F9 ────────────────────────────────────────
# The room the ledger budgeted largest (6,500 of 24,000) says what kind of place
# it is, ONCE, on the first visit. Fires ahead of the meetings that live here.
[[canvases]]
id          = "intro_packing_shed"
name        = "The shed"
description = "F9. First visit to the anchor. What the shed IS: the belt, the scale, the book, the one good light, and the cooler door nobody opens. SETS shed_seen."

[canvases.trigger]
location      = "the_packing_shed"
is_repeatable = false
priority      = 16
is_active     = true
conditions    = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "shed_seen", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "the_belt"
name = "The belt"
blocks = [
  { type = "paragraph", content = "The shed is open at both ends and it does not help. The belt runs the length of it, loud enough that people talk in the gaps. The heat sits under the roof and stays there all day whether anyone is working or not." },
  { type = "paragraph", content = "Everything on this farm ends up here. The bins come down off the trucks, go over the belt, get sorted, get weighed. Whatever the scale says at the far end is what the week was worth." },
  { type = "paragraph", content = "The scale is under the only good light on the property. The book sits open next to it. At the back there is a door with a lock on it, which is the only lock on this farm, and it stays shut." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Get to work."

[canvases.nodes.exit_block.config]
destinationType          = "specific"
locationId               = "the_packing_shed"
time_progression_minutes = 5
flagEffects = [
  { targetType = "player", flag = "shed_seen", op = "set" },
]


# ── Meeting · Rae ────────────────────────────────────────────────────────────
[[canvases]]
id          = "meet_rae"
name        = "The window"
description = "F5/F6. Rae's canteen window on the yard, first light. She is the standard and she does not soften anything. Small, and she speaks. SETS met_rae — opens her hubs and nobody else's."

