blocks = [
  { type = "paragraph", content = "Your brother has the ladder two trees down and he has an audience, which is the only condition under which Wade does anything. Two of the men who are not family are working the same block." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_wade" }, content = "Here she is. Watch the top of the tree, boys, she'll be up it all day and you'll get nothing done." },
  { type = "paragraph", content = "The men laugh the amount they have to. You have been listening to this since you were nineteen and nobody has ever told him to stop, including you." },
  { type = "dialog", props = { speaker = "player" }, content = "You are two trees behind me and you have been since six." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_wade" }, content = "What. I'm being nice. Six seasons, she's better at this than all of you." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_wade" }, content = "Hear that? She counts. She has counted me every season since she was seventeen." },
  { type = "paragraph", content = "He says it to them and not to you, which is the whole arrangement, and he goes up his ladder grinning." },
]

