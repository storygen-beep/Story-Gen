[[canvases.nodes]]
id   = "the_scale"
name = "The scale"
blocks = [
  { type = "paragraph", content = "Your father is at the scale with the book open and a pencil behind his ear that he never uses. That is because he writes with the one in his hand and keeps the other in case. He has run this crew for eleven years." },
  { type = "paragraph", content = "He weighs your first bin without saying anything, then writes the number, then says the number out loud so you have heard it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_boyd" }, content = "Forty-one. That's low for you and it's Monday, so I'm not going to say anything about it." },
  { type = "dialog", props = { speaker = "player" }, content = "You just said it out loud." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_boyd" }, content = "I said the number. The number is not an opinion." },
  { type = "paragraph", content = "The number goes in the book and the book comes out on Saturday, and between now and then everything you do is a line in it." },
  { type = "dialog", props = { speaker = "npc", npcId = "npc_boyd" }, content = "Van, board and water comes off the top same as everyone. You know that." },
  { type = "dialog", props = { speaker = "player" }, content = "I have known it six seasons." },
  { type = "paragraph", content = "And it has never once come out of a hand that was yours first." },
]

[canvases.nodes.exit_block]
type = "location"
text = "Go get the next bin."

[canvases.nodes.exit_block.config]
