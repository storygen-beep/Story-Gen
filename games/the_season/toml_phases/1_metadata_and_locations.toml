# ⚠️ navigation_order is FORWARD-ONLY — the children of this location, never the
#    way back. The return link is implicit from entry_from, and the validator
#    hard-fails a nav entry whose entry_from is not this room:
#      "navigation_order for 'the_camp' includes 'the_yard' which is not a
#       destination (entry_from != 'the_camp')"
#    Caught on the first build of this board.
# =============================================================================
# The Season — 1_metadata_and_locations
#
# THE MAP: nested_zones, rooted OUTDOORS on the packing yard.
#
#     the_yard  ──┬── the_camp ── the_showers
#                 ├── the_packing_shed ── the_cooler   (locked at 0.1)
#                 ├── the_rows
#                 ├── the_barn_loft
#                 └── the_store        (nine miles, needs the truck)
#
# ⚠️ THE EXTERIOR IS THE ROOT, NOT A LEAF. A game shipped an exterior priced at 25
#    minutes that hung off its kitchen — you stepped out of a room into a row of
#    shops. Here the world contains the camp, never the other way round.
#    the-map.md R3.
#
# ⚠️ THE SHAPE WAS PICKED BEFORE THE CAST. Deriving the map from the roster is
#    circular: the premise fixes the cast, the cast fixes the map, and a family
#    returns a house every time. Four of the six earlier v2 games are a female
#    protagonist and incest inside one building. the-map.md R0.
#
# Word budgets (`fill`) live in v2_state.json and were written BEFORE any prose:
# 15,500 across eight, anchor the_packing_shed at 4,200 = 27%.
#
# ⚠️ npc_halbrook and the_porch are DEFERRED TO 0.2 — a whole unit, declared
#    before the prose, never a thinning of everything. It also settles a
#    contradiction this board shipped with: intro_packing_shed calls the cooler
#    "the only lock on this farm" and the porch said its door locked too.
# =============================================================================

[player]
id   = "player"
name = "Cass"

# ⚠️ SECTION form, not an inline table — a multi-line `core_traits = { … }` is a
#    TOML parse error.
[player.core_traits]
# The player floor. Rungs at 4/8/12/18/25/33/42/55/70/85 and 5/10/16/24/34/46/62/80.
nerve   = 0
known   = 0
# The throttle — act menu only, on Wade's and Prine's node-routed loops.
arousal = 0
# The body.
energy  = 100
hygiene = 100
thirst  = 100
# She has never held her own money. This is not flavour: it is the reason the
# first Saturday lands.
money   = 0
# Loop state (hidden). Numeric, never flags — a triggerless canvas has no located
# setter for a flag and the build hard-fails.
wade_loop_stage  = 0
prine_loop_stage = 0

# Falls on its own. thirst is deliberately absent: it drops on the ROW WORK, not
# on the calendar, which is what makes it the premise's own need rather than a
# third copy of hygiene.
[player.trait_decay]
energy  = 15
hygiene = 20


# ─── the yard — the root, and the ground everything else sits on ─────────────
[[locations]]
id                   = "the_yard"
name                 = "The Yard"
description          = "Flat dirt between the vans and the shed, wide enough to turn a truck around in. The canteen window on the near side is open from first light, and the whole crew crosses this to get anywhere."
image                = "locations/the_yard.jpg"
image_search_queries = ["farm packing yard dirt", "farm truck yard morning"]
navigation_order     = ["the_camp", "the_packing_shed", "the_rows", "the_barn_loft", "the_store"]

# ─── the camp ────────────────────────────────────────────────────────────────
[[locations]]
id                   = "the_camp"
name                 = "The Camp"
description          = "Two vans and a trailer parked in a row with their doors facing in. Yours is the back bunk in the trailer, behind a curtain, with your brothers on the other side of a wall you can hear through."
image                = "locations/the_camp.jpg"
image_search_queries = ["work camp trailer vans farm", "farm worker trailer night"]
entry_from           = "the_yard"
navigation_order     = ["the_showers"]

# ─── the showers — the crudest repeatable surface in the game ────────────────
[[locations]]
id                   = "the_showers"
name                 = "The Showers"
description          = "A block of four with a gate instead of a door and a faucet on the outside wall. The water is hot for about as long as it takes one person, and everybody knows whose turn it is."
image                = "locations/the_showers.jpg"
image_search_queries = ["outdoor shower block farm", "concrete shower stall rural"]
entry_from           = "the_camp"
navigation_order     = []

# ─── the packing shed — THE ANCHOR ───────────────────────────────────────────
[[locations]]
id                   = "the_packing_shed"
name                 = "The Packing Shed"
description          = "Open at both ends, hot all day, loud with the belt. The scale is at the far end under the only good light on the property, and the book sits next to it."
image                = "locations/the_packing_shed.jpg"
image_search_queries = ["fruit packing shed interior", "farm packing line sorting belt"]
entry_from           = "the_yard"
navigation_order     = ["the_cooler"]

# ─── the cooler — LOCKED at 0.1, the door the release ends on ────────────────
[[locations]]
id                   = "the_cooler"
name                 = "The Cooler"
description          = "Cold, dark, and the only room on this farm with a lock on it. There is one key and it lives in a pocket that is not yours."
image                = "locations/the_cooler.jpg"
image_search_queries = ["cold storage room crates", "walk in cooler farm produce"]
entry_from           = "the_packing_shed"
navigation_order     = []
entry_conditions     = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "cooler_key", operator = "is_true" } ] }

# ─── the rows — the work, and the money ──────────────────────────────────────
[[locations]]
id                   = "the_rows"
name                 = "The Rows"
description          = "Peaches, uphill, in the heat. The near end is in sight of the shed. The far end is not in sight of anything, which is the only reason anyone volunteers for it."
image                = "locations/the_rows.jpg"
image_search_queries = ["peach orchard rows summer", "fruit picking ladder trees"]
entry_from           = "the_yard"
navigation_order     = []
costs                = { time = 15 }

# ─── the barn loft ───────────────────────────────────────────────────────────
[[locations]]
id                   = "the_barn_loft"
name                 = "The Barn Loft"
description          = "Empty crates stacked to the roof and a ladder nobody has fixed. It is the one place inside on this farm that has a reason to be walked into and no reason to be walked past."
image                = "locations/the_barn_loft.jpg"
image_search_queries = ["barn loft wooden crates", "hayloft interior light"]
entry_from           = "the_yard"
navigation_order     = []

# ─── the store — the nine miles out ──────────────────────────────────────────
[[locations]]
id                   = "the_store"
name                 = "The Store"
description          = "Nine miles of dirt then asphalt, and it sells boots, phone cards, cold water and about forty other things at a price that assumes you are not going anywhere else."
image                = "locations/the_store.jpg"
image_search_queries = ["rural general store interior", "country gas station store shelves"]
entry_from           = "the_yard"
navigation_order     = []
costs                = { time = 40 }


# =============================================================================
# THE CAST — six characters, FIVE DIFFERENT METER SHAPES
#
# who_climbs = "both". Each meter is picked from what the relationship IS
# (the-meters.md W6), not from one template pair. All five earlier v2 games
# shipped ONE meter shape across the whole cast.
#
#   owed          npc_boyd       leverage — money and the book, not affection
#   ease + want   npc_wade       slow burn, warmed by the throttle   (rich arc 1)
#   ease + want   npc_prine      slow burn, warmed by the throttle   (rich arc 2)
#   seen          npc_emmett     a hidden accumulator, never surfaced
#   (none)        npc_rae        presence plus one opened flag
#
# FOUR shapes across five people: Wade and Prine SHARE the rich pair on purpose,
# because they are the two arcs that carry the game (W6 — reserve it for one or
# two). Trait keys are unprefixed: the engine namespaces them by npc_id, as in
#   { type = "trait", subject = "npc", npc_id = "npc_wade", trait_key = "want", … }
#
# ⚠️ ORDERING: [[npcs.schedules]] binds to the [[npcs]] block ABOVE it. Inserting
#    a character between an existing one and its schedules silently re-parents.
#
# ⚠️ ALL ROWS ARE ALL-WEEK. A day-specific window crossing midnight puts someone
#    on site Tuesday night and DELETES them at 00:00, because the weekday check
#    runs first against today (v2.py:3446) while the wrap is handled separately
#    (v2.py:3784). Prine's 19:30-00:30 is one row only because it runs every day.
#    Harvest does not take weekends.
# =============================================================================

# ─── Boyd — LEVERAGE. Money and the book, not affection. ─────────────────────
[[npcs]]
id          = "npc_boyd"
name        = "Boyd"
description = "Her father, 47. His name is on the contract, so every dollar she has ever earned went through his hand before it reached hers. He runs the scale, the book and the Saturday settle. Being wanted by the man who holds the book is the only way the book stops being the whole of what is between them."
portrait    = "boyd.jpg"
core_traits = { owed = 0 }
flag_keys   = ["met_boyd", "into_the_advance"]
arc_stages  = ["Her father", "Owed", "Leaning on it", "Collecting"]

[[npcs.schedules]]
location   = "the_rows"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "06:00"
end_time   = "12:00"
activity   = "walking the rows, counting bins"

[[npcs.schedules]]
location   = "the_packing_shed"
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "12:00"
