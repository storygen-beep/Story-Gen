id          = "npc_wade"
name        = "Wade"
description = "Her brother, 26. The loud one. He has been crude about her to the crew, where she can hear, since she was nineteen, and nobody has ever told him to stop. He is already saying it; the climb is him saying it to her."
portrait    = "wade.jpg"
core_traits = { ease = 0, want = 0 }
flag_keys   = ["met_wade"]
arc_stages  = ["Her brother", "Saying it to her", "Finding the far end", "Waiting for her"]

[[npcs.schedules]]
