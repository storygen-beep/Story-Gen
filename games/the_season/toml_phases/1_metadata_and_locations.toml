# ─── Emmett — ANTAGONIST / WITNESS. A hidden accumulator, never surfaced. ────
[[npcs]]
id          = "npc_emmett"
name        = "Emmett"
description = "Her brother, 20. They were close, and then in March he stopped talking to her and will not say why. He works the shed instead of the rows, which means he is at the scale when everyone comes in, which means he sees things. Being wanted by him means finding out what he already knows."
