# =============================================================================
# The Season — 0_systems_spec
# Built with author-game-v2. Spec: games/the_season/WANT.md
#
# who_climbs = "both" (the-meters.md W1) — declared in v2_state.json.
#   PLAYER FLOOR   nerve · known      the floor on WHERE and on WHO KNOWS
#   THROTTLE       arousal            gates the act menu on the node-routed loops
#   NEEDS          energy · hygiene · thirst
#   CAST SPINE     five meter shapes across six people, on [[npcs]] (file 1)
#
# ⚠️ RUNGS ARE NOT 15/35/55/75. The field runs 8-17 rungs with the lowest at a
#    median of 5; all sixteen tiers across the five earlier v2 games put the
#    lowest at exactly 15, which is fifteen clicks of nothing at the opening of
#    a game. nerve starts at 4, known at 5. the-meters.md W4.
#
# ⚠️ BANDS BELOW ARE THE SIDEBAR'S BUSINESS, NOT THE RUNG LADDER. They are how the
#    player READS the meter; the gates go where the content goes. Do not derive
#    one from the other.
# =============================================================================

schema_version = "1.0"

[project]
id              = "the_season"
title           = "The Season"
description     = "Nine weeks picking peaches on a farm nine miles off the highway, with a crew that is mostly her own family and two vans and a trailer to sleep in. Her father's name is the one on the contract, so every dollar she has ever earned went through his hand first. There is nowhere on this property to be alone with anyone for two minutes, and that is the whole problem."
starting_canvas = "canvas_first_light"
quests_engine   = "v2"

[time]
starting_hour = 5          # first light; the crew is already up. C1 — the opening's
starting_day  = "Monday"   #   first node may state this hour and nothing after it
starting_week = 1

[settings]
narration_person = "second"     # IMMUTABLE once 0.1 ships
clothing_enabled = false        # deferred past 0.1 — see decisions[] in v2_state.json

# ─── The Saturday settle — the recurring obligation, with a face ──────────────
# She is paid by the bin and the crew's take goes through Boyd, because his name is
# on the contract. Every Saturday he settles up in front of everyone and the camp
# charge — van, board, water — comes back out of it. A take runs $90-140 a week
# against a $30 charge, so a slow week is a real week, not a scripted one.
#
# ⚠️ VERIFIED IN THE ENGINE BEFORE BEING WIRED, not assumed. On the due weekday
#    advanceDay sets rent_state.is_due (v2.py:5442-5446); the next Location_* or
#    Navigation passage force-routes to RentDay (v2.py:15480-15485), which is an
#    INTERRUPT SCENE with a named collector, not a room she visits. That is exactly
#    the shape the settle needs — Boyd finds her, wherever she is.
#
# ⚠️ eviction_mode = "flag_set", NOT the default "game_end". A product that never
#    ends must not carry a lose-state that stops play. Coming up short past the one
#    warning sets `into_the_advance` and the terms change: she is now borrowing
#    against bins not yet picked, which IS Boyd's gating meter. the-economy.md R3.
[settings.rent]
enabled          = true
amount           = 30
due_day          = "Saturday"
collector_npc    = "npc_boyd"
grace_periods    = 1
start_after_flag = "first_week_started"
eviction_mode    = "flag_set"
eviction_flag    = "into_the_advance"
currency_symbol  = "$"          # ONE notation, everywhere. the-economy.md R7

[settings.rent.text]
title            = "Saturday"
scene            = "He does it on the tailgate with the light going, one crew at a time, and everybody stands close enough to hear the numbers. He has your bins written down in the book before you get there."
greeting         = "Six days. Here's what that came to."
paid_scene       = "He counts your week out onto the tailgate, then takes the thirty back off the top of it without looking up, and slides what is left across to you. The men behind you are counting it too."
paid_response    = "Van, board, water. Same as everyone."
paid_closing     = "He is already writing the next name down. Nobody says anything about it and nobody ever has."
cant_pay         = "Tell him it isn't there."
warning_scene    = "You tell him it isn't there. He stops writing, which is worse than if he had said something, and he takes his time putting the pencil down on the tailgate."
warning_response = "Then it comes off next week. I'm not going to make a thing out of it once."
warning_closing  = "He says once like a number, and he writes something next to your name that you cannot read upside down."
eviction_scene_soft    = "The second Saturday he does not open the book at all. He waits until the others have taken theirs and gone back to the vans, and then he sits down on the tailgate and looks at you the way he looks at a bin that has come in light."
eviction_response_soft = "You're into me now. That's a different arrangement and you know it is."
eviction_closing_soft  = "He does not say what the arrangement is. He puts the book in his shirt pocket and goes to check the water, and you stand there in the dark with the tailgate still warm."

[theme]
mode = "dark"


# ─── The player floor — nerve and known ──────────────────────────────────────
# Both are banded here AND hidden in [[traits.labels]] below, or the sidebar
# prints the band text and the raw number side by side. the-meters.md M7.

[[sidebar_items]]
type  = "trait_status_text"
trait = "nerve"
bands = [
  { min = 0,  max = 11, text = "Only where nobody could walk in" },
  { min = 12, max = 24, text = "Not moving away as fast" },
  { min = 25, max = 41, text = "Letting it happen where it could go wrong" },
  { min = 42, max = 69, text = "Picking the spot herself" },
  { min = 70, text = "Does not check who is in the yard" },
]

# ⚠️ known RISES AND WIDENS. The crew acting on what it knows is content, not
#    punishment — a player meter that quietly closes doors fails the ascent gate.
[[sidebar_items]]
type  = "trait_status_text"
trait = "known"
bands = [
  { min = 0,  max = 9,  text = "Nobody knows anything" },
  { min = 10, max = 23, text = "One of them knows" },
  { min = 24, max = 45, text = "It gets mentioned" },
  { min = 46, text = "The crew works around it" },
  # 0.1 tops out here. "It is just how this crew runs" was a band at 80 with no
  # content behind it, and the top band's max is a promise (gate 8). It comes back
  # in 0.2 with the rungs that earn it.
]

# ─── The needs ───────────────────────────────────────────────────────────────
[[sidebar_items]]
type  = "trait_status_text"
trait = "energy"
bands = [
  { min = 0,  max = 24, text = "Done in" },
  { min = 25, max = 59, text = "Sore" },
  { min = 60, text = "Good for the day" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "hygiene"
bands = [
  { min = 0,  max = 34, text = "Filthy" },
  { min = 35, max = 69, text = "Dusty" },
  { min = 70, text = "Clean" },
]

[[sidebar_items]]
type  = "trait_status_text"
trait = "thirst"
bands = [
  { min = 0,  max = 19, text = "Cannot stay out there" },
  { min = 20, max = 59, text = "Dry" },
  { min = 60, text = "Watered" },
]

# The throttle. Banded and value-hidden — the player sees the band, never the
# volatile figure. Its ONLY job is the act menu on Wade's and Prine's loops
# (the-meters.md W2); five earlier games raised arousal 232 times and read it 4.
[[sidebar_items]]
type       = "trait_bar"
trait      = "arousal"
hide_value = true
bands = [
  { min = 0,  max = 29,  text = "—" },
  { min = 30, max = 64,  text = "Aware of it" },
  { min = 65, max = 100, text = "Not going to be able to leave it" },
]

# Countable resource: the exact figure, no bands. You do not band a number the
# player is counting against Saturday.
# ⚠️ `label` AND `max` are both required. A trait_bar takes its label from the
#    SIDEBAR ITEM, never [[traits.labels]], and _traitMax defaults to 100 — an
#    uncapped counter renders as a percentage of a ceiling that does not exist.
[[sidebar_items]]
type       = "trait_bar"
trait      = "money"
label      = "Cash"
max        = 100


# ─── Trait labels ────────────────────────────────────────────────────────────
# Everything banded above is hidden here: a banded meter is not also a number.
[[traits.labels]]
key    = "nerve"
hidden = true

[[traits.labels]]
key    = "known"
hidden = true

[[traits.labels]]
key    = "energy"
hidden = true

[[traits.labels]]
key    = "hygiene"
hidden = true

[[traits.labels]]
key    = "thirst"
hidden = true

[[traits.labels]]
key    = "arousal"
hidden = true

# Loop state. Hidden numeric traits, never flags — a flag set inside a triggerless
# canvas has no located setter and HARD-FAILS the build. the-surfaces.md R3b.
[[traits.labels]]
key    = "wade_loop_stage"
hidden = true

[[traits.labels]]
key    = "prine_loop_stage"
hidden = true


# ─── Day rollover — [engine.daily_tick] ──────────────────────────────────────
# ⚠️ THE ONLY CLEAN WAY TO DAY-CAP A TRIGGERLESS RUNG, and nearly every rung in a
#    v2 game is triggerless: max_triggers_per_day is read off the TRIGGER
#    (v2.py:11017) and a hub choice has none. the-meters.md M5.
#
# ⚠️ A FLAG, NEVER A COUNTER TRAIT. A hidden counter read with `lt` puts a player
#    trait in the game whose only conditions CLOSE content, which reads to gate 10
#    as a descent wearing an ascent's clothes.
#
# ⚠️ EVERY FLAG HERE IS SET BY CONTENT THAT SHIPS IN 0.1. A cap with two of its
#    three parts validates and throttles nothing — the clear and the read exist,
#    the setter is what makes it a cap. Until 0.1 lands these have no setters and
#    the day-cap gate will say so. That is correct; an absence is not a pass.
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "wade_rung_today",   op = "unset" },
  { targetType = "player", flag = "prine_rung_today",  op = "unset" },
  { targetType = "player", flag = "emmett_rung_today", op = "unset" },
  { targetType = "player", flag = "rae_talk_today",    op = "unset" },
  { targetType = "player", flag = "shed_hours_today",  op = "unset" },
  { targetType = "player", flag = "store_run_today",   op = "unset" },
  { targetType = "player", flag = "washed_today",      op = "unset" },
  { targetType = "player", flag = "rows_near_today",   op = "unset" },
  { targetType = "player", flag = "rows_far_today",    op = "unset" },
  { targetType = "player", flag = "boyd_rung_today",   op = "unset" },
  { targetType = "player", flag = "crossed_today",     op = "unset" },
  { targetType = "player", flag = "wade_talk_today",   op = "unset" },
  { targetType = "player", flag = "prine_talk_today",  op = "unset" },
  { targetType = "player", flag = "rae_fed_today",     op = "unset" },
  { targetType = "player", flag = "bins_run_today",   op = "unset" },
  { targetType = "player", flag = "dried_off_today",  op = "unset" },
]


# ─── GUIDANCE — [[quest_cards]] ──────────────────────────────────────────────
# ⚠️ quests_engine = "v2" turns the sidebar entry and the page ON. Authoring no
#    cards leaves a nav link to a heading with nothing under it — which is
#    exactly what shipped once. Switching the engine on is not authoring
#    guidance. (engine.md §23)
#
# ⚠️ NO `version = "1.0"` ON A QUEST CARD. Quest conditions use a separate
#    evaluator with no fail-open.
#
# ⚠️ `terminal = true` ON THE LAST CARD OF EVERY ARC, or a finished arc renders
#    as an objective with nothing ticked. EXACTLY ONE card game-wide may set
#    `terminal_text` — it is the badge form of the build-boundary rule.
#
# Every goal names a PLACE, a PERSON and a VERB, with the window when the rung
# is schedule-gated (the-voice.md R3). "Prove yourself to Prine" fails: no
# place, no clickable action.

# ── nerve ────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 90
text     = "There is nowhere on this property to be alone with anybody for two minutes, and you have started counting which places come closest."
tip      = "The far end of the rows is out of sight of the road — take it when you have the water for it. The shower gate starts at your knees."
when     = [ { trait = "nerve", subject = "player", op = "lt", value = 12 } ]

[[quest_cards]]
priority = 89
text     = "You have stopped moving away as fast. Nobody has said anything about it, which is its own kind of answer."
tip      = "Leave the gate hanging open at the showers. Cross the yard afterwards without hurrying."
when     = [ { trait = "nerve", subject = "player", op = "gte", value = 12 },
             { trait = "nerve", subject = "player", op = "lt",  value = 42 } ]

[[quest_cards]]
priority = 88
text     = "You pick the spot yourself now. That is the part that would be hard to explain to anyone who has not done a season."
tip      = "Wash out at the faucet where the whole yard can see. The cooler key hangs by the scale while your father is counting — that needs more nerve than you have."
when     = [ { trait = "nerve", subject = "player", op = "gte", value = 42 } ]
terminal = true
terminal_text = "As far in as 0.1 goes"

# ── known ────────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 80
text     = "Nobody knows anything. Six days a week that feels like safety and on the seventh it feels like being the only person on the crew nothing happens to."
tip      = "Stand at Rae's window on the yard and let her talk — first light, or when the crew comes off the rows."
when     = [ { trait = "known", subject = "player", op = "lt", value = 24 } ]

[[quest_cards]]
priority = 79
text     = "It gets mentioned now. Not to your face, and not by Rae, who says it to your face instead."
tip      = "Ask Rae at the window what the crew is saying. Emmett works the belt facing the door and he has been counting."
when     = [ { trait = "known", subject = "player", op = "gte", value = 24 } ]
terminal = true

# ── the cast ─────────────────────────────────────────────────────────────────
[[quest_cards]]
priority = 70
npc_id   = "npc_wade"
text     = "Your brother has been saying it about you to the crew since you were nineteen, where you could hear, and nobody has ever told him to stop. He has started not saying it in front of them."
tip      = "Work the same block as him in the rows. He is on the step of the second van from seven at night — the curtain in the trailer does not close."
when     = [ { trait = "want", subject = "npc", npc_id = "npc_wade", op = "lt", value = 40 } ]

[[quest_cards]]
priority = 69
npc_id   = "npc_wade"
text     = "Four feet of plywood and neither of you pretends about it any more."
tip      = "He is at the second van after the crew turns in."
when     = [ { trait = "want", subject = "npc", npc_id = "npc_wade", op = "gte", value = 40 } ]
terminal = true

[[quest_cards]]
priority = 68
npc_id   = "npc_prine"
text     = "Your uncle takes no days off and asks whether you have had water, and you keep going up the loft ladder at one o'clock as if that were about the crates."
tip      = "Stack with him in the barn loft between one and two. He is outside the third van from half past seven at night."
when     = [ { trait = "want", subject = "npc", npc_id = "npc_prine", op = "lt", value = 40 } ]

[[quest_cards]]
priority = 67
npc_id   = "npc_prine"
text     = "There is no hurry in it and there never has been, and that is the thing about him you cannot put down."
tip      = "The loft, between one and two, while the rest of the crew is out of the sun."
when     = [ { trait = "want", subject = "npc", npc_id = "npc_prine", op = "gte", value = 40 } ]
terminal = true

[[quest_cards]]
priority = 66
npc_id   = "npc_boyd"
text     = "Every dollar you have earned went through your father's hand before it reached yours, and now the book has more in your column than your bins do."
tip      = "He is at the scale in the packing shed from noon. Ask him for an advance against next week — it comes off the Saturday settle."
when     = [ { trait = "owed", subject = "npc", npc_id = "npc_boyd", op = "lt", value = 40 } ]
terminal = true

[[quest_cards]]
priority = 65
npc_id   = "npc_emmett"
text     = "He stopped talking to you in March and will not say why. He works the belt with his face to the door, which means he sees everyone who comes in and everyone who does not."
tip      = "Work the belt beside him in the packing shed. He is at the second van at night and he does not talk there either."
when     = [ { trait = "seen", subject = "npc", npc_id = "npc_emmett", op = "lt", value = 40 } ]
terminal = true

[[quest_cards]]
priority = 64
npc_id   = "npc_rae"
text     = "Twenty crews out that window. She names what the men are doing before you have words for it and she does not soften any of it."
tip      = "The canteen window on the yard — first light, and again when the crew comes off the rows."
when     = [ { flag = "rae_straight_with_you", subject = "player", op = "is_false" } ]

[[quest_cards]]
priority = 63
npc_id   = "npc_rae"
text     = "She gives you the whole opinion now instead of a third of it, and she does not lower her voice for any of it."
tip      = "The window on the yard. She is the only read on this worth having."
when     = [ { flag = "rae_straight_with_you", subject = "player", op = "is_true" } ]
terminal = true
