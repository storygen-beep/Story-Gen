# First Term (first_term_lean) — player, locations, people. Piece P01: the player's traits only.

[player]
id = "player"
name = "Ella"
# money is not a 0-100 meter: every money effect must set clamp = false (v2.py:7361-7364).
core_traits = { energy = 100, money = 0, corruption = 0, exhibitionism = 0, sundays_paid = 0, rent_paid_total = 0, meals_today = 0, grades = 50, study_today = 0 }
# Every player flag is declared here. P05: zoe_place_known (set by P20) reveals Zoe's Apartment.
flag_keys = [
  "zoe_place_known",
  # P03 re-check: the house next door opens once she has met him (P24 sets it)
  "met_vance",
  # P04 re-check: the faculty corridor opens once her advisor asks to see her (P16 sets it)
  "met_walsh",
  # P13 — the opening
  "start_grades", "start_fun", "start_freedom",
  "met_laura", "met_mark",
  # P42 — Mom's Talk, once a day; the day turn clears it
  "talked_mom_today",
  # P21 — the café job
  "met_tom", "met_chris", "cafe_first_shift_done", "cafe_ask_parked",
  "met_ryan", "ryan_hall_seen", "ryan_hall_past", "ryan_hall_spoke", "ryan_hall_waited", "goal1_shown",
  # Goal 1's card reads these; P21 sets cafe_hired, P11 sets rent_paid_once.
  "cafe_hired", "rent_paid_once",
  # P11 — Sunday rent
  "rent_handled_this_week", "pays_her_own_way",
  # P34 — Mark's and Ryan's Talk, once a day each; the day turn clears them
  "talked_mark_today", "talked_ryan_today",
  # P34 — Eat with her, once a day; the day turn clears it
  "ate_with_mom_today",
  # P33 — the run, first time
  "ran_once",
  # P32 — met flags for the people P32 schedules (their meetings set them)
  "met_hale", "met_pratt", "met_cross", "met_nadia", "met_holt", "met_rosa", "met_frank", "met_danny", "met_marco",
  # P15 — memory flags from her answers
  "nadia_sat_with", "nadia_front_row", "nadia_asked", "pratt_silent",
  # P16 — memory flags from her answers
  "walsh_maam", "walsh_no_advisor", "walsh_silent", "walsh_stayed",
  # P17 — memory flags from her answers
  "cross_said_it", "cross_asked", "cross_shouted",
  # P18 — memory flags from her answer
  "holt_got_it", "holt_noise", "holt_silent",
  # P19 — memory flags from her answer
  "rosa_thanks", "rosa_no", "rosa_silent",
  # P20 — Zoe
  "met_zoe", "zoe_coffee_yes", "zoe_coffee_no", "zoe_coffee_asked",
  # P22F — memory flags from her answer
  "frank_say_hi", "frank_small_world", "frank_silent",
  # P22D — memory flags from her answer
  "danny_snack", "danny_everyone", "danny_silent",
  # P23 — memory flags from her answer
  "marco_looking", "marco_tips", "marco_silent",
  # P24 — her answer to Vance
  "vance_went_over", "vance_waved", "vance_silent",
  # P35 — the clothes shop
  "met_nina",
]
# P13 — the name screen (template_import.py:2332-2357). "name" writes $player.name; any other id
# becomes $player.<id> (v2.py:1569-1573). Printed with @player / @player.nickname (v2.py:18598-18629).
customizable = true

[[player.customization_fields]]
id = "name"
type = "text"
label = "Your name"
default = "Ella"

[[player.customization_fields]]
id = "nickname"
type = "text"
label = "What Ryan calls you"
default = "El"

# ── P02 · Home: one area, the hall its hub, every room off the hall ──
# Nav: a place lists the places whose entry_from is it (v2.py _ordered_navigation); each room
# gets "Leave <room>" back to its entry_from (v2.py:24797-24802).

