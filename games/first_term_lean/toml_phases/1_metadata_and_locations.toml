# ── P03 · Neighbourhood: one area, her street its hub ──

[[locations]]
id = "neighbourhood"
name = "Neighbourhood"
description = "Your street and the streets around it."
is_container = true
default_entry = "hood_street"

[[locations]]
id = "hood_street"
name = "Neighbourhood"
description = "The neighbourhood: your street, the same row of houses, the corner shop at the end, the park across the road, the gym over the laundromat, the clothes shop, and a bus stop with its morning queue. Neighbours, dog walkers, kids on bikes."
# P07 — the leave rule: a top and a bottom, or a dress (a dress counts for both, v2.py:2219).
clothing_rules = [
  { slots_required = ["top", "bottom"], message = "You're not going out like this. Go back up to your room and put on a top and a bottom, or a dress." },
]
# P07 — the street notices skin, in daylight hours (worn_exposure, v2.py:5264-5272).
description_variants = [
  { conditions = { version = "1.0", logic = "AND", items = [
      { type = "clothing_item", item_id = "mom_lowcut_top", operator = "equipped" },
      { type = "time_of_day", start_time = "07:00", end_time = "21:00" },
    ] }, text = "The neighbourhood: your street, the same row of houses, the corner shop at the end, the park across the road, the gym over the laundromat, the clothes shop, and a bus stop with its morning queue. Neighbours, dog walkers, kids on bikes. Across the road, a neighbour's eyes drop to your chest in Mom's top and stay there. Your face goes hot. You walk faster, and you can feel him still watching." },
  { conditions = { version = "1.0", logic = "AND", items = [
      { type = "worn_exposure", operator = "gte", value = 1 },
      { type = "clothing_slot", slot = "legwear", operator = "unequipped" },
      { type = "time_of_day", start_time = "07:00", end_time = "21:00" },
    ] }, text = "The neighbourhood: your street, the same row of houses, the corner shop at the end, the park across the road, the gym over the laundromat, the clothes shop, and a bus stop with its morning queue. Neighbours, dog walkers, kids on bikes. Across the road, a neighbour's eyes drop to your bare legs and stay there. Your face goes hot. You walk faster, and you can feel him still watching." },
  # P29 — the bus stop notices the leggings (PLAN 123, 288; after P07's two, which win).
  { conditions = { version = "1.0", logic = "AND", items = [{ type = "clothing_item", item_id = "leggings", operator = "equipped" }, { type = "time_of_day", start_time = "07:00", end_time = "21:00" }] }, text = "The neighbourhood: your street, the same row of houses, the corner shop at the end, the park across the road, the gym over the laundromat, the clothes shop, and a bus stop with its morning queue. Neighbours, dog walkers, kids on bikes. The guys at the bus stop go quiet as you pass in your leggings. Your face goes hot, and you walk a little faster." },
]
