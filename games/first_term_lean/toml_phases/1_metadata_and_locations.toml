# ── P03 · Neighbourhood: one area, her street its hub ──

[[locations]]
id = "neighbourhood"
name = "Neighbourhood"
description = "Your street and what's on it."
is_container = true
default_entry = "hood_street"

[[locations]]
id = "hood_street"
name = "Your Street"
description = "Your street. The same row of houses, the corner shop at the end, the park across the road, the gym over the laundromat, the clothes shop, and a bus stop with its morning queue. Neighbours, dog walkers, kids on bikes."
# P07 — the leave rule: a top and a bottom, or a dress (a dress counts for both, v2.py:2219).
clothing_rules = [
  { slots_required = ["top", "bottom"], message = "You're not going out like this. Go back up to your room and put on a top and a bottom, or a dress." },
]
# P07 — the street notices skin, in daylight hours (worn_exposure, v2.py:5264-5272).
description_variants = [
  { conditions = { version = "1.0", logic = "AND", items = [
      { type = "clothing_item", item_id = "mom_lowcut_top", operator = "equipped" },
      { type = "time_of_day", start_time = "07:00", end_time = "21:00" },
    ] }, text = "Your street. The same row of houses, the corner shop at the end, the park across the road, the gym over the laundromat, the clothes shop, and a bus stop with its morning queue. Neighbours, dog walkers, kids on bikes. Across the road, a neighbour's eyes drop to your chest in Mom's top and stay there. Your face goes hot. You walk faster, and you can feel him still watching." },
  { conditions = { version = "1.0", logic = "AND", items = [
      { type = "worn_exposure", operator = "gte", value = 1 },
      { type = "clothing_slot", slot = "legwear", operator = "unequipped" },
      { type = "time_of_day", start_time = "07:00", end_time = "21:00" },
    ] }, text = "Your street. The same row of houses, the corner shop at the end, the park across the road, the gym over the laundromat, the clothes shop, and a bus stop with its morning queue. Neighbours, dog walkers, kids on bikes. Across the road, a neighbour's eyes drop to your bare legs and stay there. Your face goes hot. You walk faster, and you can feel him still watching." },
]
parent = "neighbourhood"
kind = "thoroughfare"
