  { type = "paragraph", content = "Steam rolls out into the hall. Ryan's leaning on the wall opposite, shirtless, half asleep, a towel over his shoulder." },
  { type = "paragraph", content = "His eyes drop to the towel, to where it ends on your wet thighs. One second." },
  { type = "image", props = { description = "Seen from across a narrow upstairs hall: a woman of 18 in a small white towel in a bathroom doorway, steam rolling out around her, legs wet. No man in frame.", search_queries = ["woman 18 small towel steamy bathroom doorway gif", "steam rolling out bathroom door towel gif"], pool_dir = "look/hall_towel_t3", pool = 1 } },
  { type = "paragraph", content = "Then he catches it. He looks at the ceiling, the wall, anywhere but you, and his ears go red." },
  { type = "dialog", content = "Shit. Sorry. First day, huh?", props = { speaker = "npc", npcId = "npc_ryan" } },
  { type = "paragraph", content = "The knot at your chest is slipping." },
  { type = "paragraph", content = "*Did he just... no. Ryan doesn't look at me like that. Does he?*" },
]

