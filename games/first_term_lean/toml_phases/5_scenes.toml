# ── P13 · Talk to Mom: in the Kitchen while her rows put her there (requires_npc obeys the rows on
# the manual lane, template_import.py:882-911), once a day. P34 grows it. ──

[[canvases]]
id = "talk_mom"
name = "Talk to Mom (5 min)"

[canvases.trigger]
location = "home_kitchen"
trigger_mode = "manual"
is_repeatable = true
max_triggers_per_day = 1
requires_npc = "npc_laura"

# Her line asks about Mark, so it shows only while his rows keep him out of the Kitchen (v2.py:5384-5401).
[canvases.trigger.conditions]
version = "1.0"
logic = "AND"
items = [{ type = "npc_at_location", npc_id = "npc_mark", location_id = "home_kitchen", operator = "is_absent" }]

[[canvases.nodes]]
id = "talk"
name = "Talk to Mom"
blocks = [
  { type = "image", props = { description = "A woman of 41 in a cardigan over a blouse, at a kitchen counter with a mug, watching, seen from across the kitchen.", search_queries = ["woman 40s kitchen counter holding mug watching", "mother at kitchen counter coffee mug worried"], pool_dir = "everyday/talk_mom_t0", pool = 1 } },
  { type = "dialog", content = "Did Mark say anything else? About the rent?", props = { speaker = "npc", npcId = "npc_laura" } },
  { type = "paragraph", content = "She watches your face while you shake your head." },
  { type = "paragraph", content = "*What does she think he's going to say to me?*" },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Done"
targetType = "location"
locationId = "home_kitchen"
time_progression_minutes = 5

