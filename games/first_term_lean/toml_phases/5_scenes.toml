# ── P06 · the daily loop. The clock only moves forward by minutes (C926, v2.py:7004), so sleep is
# "8 hours", not "until 7am". A canvas shut only by the clock shows greyed with show_when_blocked
# (v2.py:6684-6690). ──

[[canvases]]
id = "loop_sleep"
name = "Sleep (8 hours)"

[canvases.trigger]
location = "home_her_room"
trigger_mode = "manual"
is_repeatable = true
show_when_blocked = true
cooldown_message = "you're not tired enough yet. From 9pm."
conditions = { version = "1.0", logic = "AND", items = [{ type = "time_of_day", start_time = "21:00", end_time = "03:00" }] }

[[canvases.nodes]]
id = "do"
name = "Sleep (8 hours)"
blocks = [
  { type = "image", props = { file = "loop/sleep.jpg" } },
  { type = "paragraph", content = "You crawl into the single bed, and you're gone before you've finished thinking about tomorrow." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Wake up"
targetType = "location"
locationId = "home_her_room"
time_progression_minutes = 480
effects = [{ trait = "energy", op = "set", value = 100 }]

[[canvases]]
id = "loop_eat"
name = "Eat something (20 min)"

[canvases.trigger]
