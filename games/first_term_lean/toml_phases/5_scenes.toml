[[canvases.nodes]]
id = "kitchen_rent"
name = "Screen 2: the kitchen, the rent"
blocks = [
  { type = "paragraph", content = "Mark's at the table with his coffee, like he's been waiting for you. Mom's at the stove." },
  { type = "dialog", content = "Morning. Seventy-five a week, starting Sunday. Your share of the rent. You're an adult now.", props = { speaker = "npc", npcId = "npc_mark" } },
  { type = "paragraph", content = "He takes a sip." },
  { type = "dialog", content = "One way or another.", props = { speaker = "npc", npcId = "npc_mark" } },
  { type = "paragraph", content = "Mom keeps her back to you. The pan hisses. She doesn't turn round." },
  { type = "paragraph", content = "*Seventy-five. I have nothing. And she already knew.*" },
]

