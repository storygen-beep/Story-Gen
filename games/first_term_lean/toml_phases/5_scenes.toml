# First Term (first_term_lean) — scenes.

# ── P13 · the opening, and Ryan step 1. The starting canvas: it runs after the age gate and the
# name screen (C1641), straight through with no map, and hands over to the Kitchen. Monday 7:00.
# Screen 2 and Talk have one node per first answer, so the answer is read without conditions.
# Screen 4's line closes each screen-3 node (one button, as the card names it). ──

[[canvases]]
id = "opening"
name = "First Day"

[[canvases.nodes]]
id = "wake"
name = "Screen 1"
blocks = [
  { type = "image", props = { file = "opening/bedroom_morning.jpg" } },
  { type = "paragraph", content = "Monday, seven in the morning. Today you start college." },
  { type = "paragraph", content = "You're eighteen. You still sleep in the single bed you had at twelve, and you've never had a dollar that wasn't your mom's. Down the hall: your mom, your step-father, your step-brother. One bathroom between the four of you." },
  { type = "paragraph", content = "Your old key is still in your bedroom door. It's the one thing in this house that's yours." },
  { type = "paragraph", content = "*College. Finally, something that's mine.*" },
  { type = "paragraph", content = "So what do you actually want out of it?" },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
