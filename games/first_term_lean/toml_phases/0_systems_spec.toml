[[walkthroughs]]
id = "paying_wt"
title = "Paying Your Way"
overview = "Mark wants your share every Sunday morning: $75 to start."
guard = { when = [{ flag = "met_mark", op = "is_true" }], text = "You haven't met them yet." }
steps = [
  { when = [{ flag = "met_mark", op = "is_true" }], done_text = "Mark told you the rent.", todo_text = "Hear Mark out in the kitchen." },
  { when = [{ flag = "cafe_hired", op = "is_true" }], done_text = "You got the café job.", todo_text = "Ask about the Help Wanted sign at the Café in town, Monday to Saturday from 10am." },
  { kind = "idea", text = "An hour at the café pays $5; a four-hour shift pays $22. Either way it's counted into your hand when you finish." },
  { when = [{ flag = "rent_paid_once", op = "is_true" }], done_text = "You paid Mark once.", todo_text = "Pay Mark at the kitchen table on Sunday morning." },
  { kind = "stop", text = "The rent storyline stops here for now. Mark still collects every Sunday; paying your own way, four Sundays in a row, comes in release 2." },
]

