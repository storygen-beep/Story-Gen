[[phone.conversations]]
id = "text_nina"
app = "messages"
npc = "npc_nina"
notify = "📱 New message"
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [{ type = "hours_since_flag", subject = "player", flag_key = "met_nina", operator = "gte", value = 4 }] }
[[phone.conversations.blocks]]
