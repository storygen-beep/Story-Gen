[engine.people.traits.Watcher]
kind = "personality"
threshold = 0
description = "Their eyes are on her whenever she passes, and they don't hide it."

[engine.people.traits."Show-off"]
kind = "personality"
threshold = 0
description = "Wants to be looked at: the party, the dress, the open door."

[engine.people.traits.Gamer]
kind = "personality"
threshold = 0
description = "Into games: the controller is where you find them and what they talk about."

[engine.people.traits.Cook]
kind = "personality"
