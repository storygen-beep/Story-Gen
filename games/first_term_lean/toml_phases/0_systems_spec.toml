# First Term (first_term_lean) — systems spec. Piece P01: the frame.

[project]
id = "first_term_lean"
# LO 2026-11-20: a title of its own, because browser save slots key off the title (games-data.js, vesper_two note).
title = "First Term (Lean)"
description = "Ella's first term of college, living at home with the family that starts looking at her differently."
quests_engine = "v2"
starting_canvas = "opening"

# P02 — second person, declared once for the whole game (C503, C548; validated at template_import.py:4108).
[settings]
narration_person = "second"
# P07 — clothes on; the full wardrobe only in her bedroom (v2.py:1190-1198).
clothing_enabled = true
wardrobe_location = "home_her_room"
wardrobe_anywhere = false
# P35 — the clothes shop: "Browse Clothes" on its screen (template_import.py:3158, v2.py:11386).
shop_location = "hood_clothes"

# The game starts on her first day of college: Monday, week 1, 07:00 (template_import.py:2319-2325).
[time]
enabled = true
starting_hour = 7
starting_day = "Monday"
starting_week = 1

[[traits.labels]]
key = "energy"
label = "Energy"

[[traits.labels]]
key = "money"
label = "Money"

[[traits.labels]]
key = "corruption"
label = "Corruption"

[[traits.labels]]
key = "exhibitionism"
label = "Exhibitionism"

# Sidebar, top to bottom under the engine's clock line (v2.py:20828).
[[sidebar_items]]
type = "trait_bar"
trait = "energy"
label = "Energy"
max = 100

[[sidebar_items]]
type = "trait_words"
trait = "money"
label = "Money"
show_value = true
# One band with no word, so the line reads "Money: N" (v2.py:21416-21418).
bands = [{ min = 0, max = 1000000, text = "" }]

# Her two meters, 20 points a stage (C285). Release 1 moves neither.
[[sidebar_items]]
type = "trait_words"
trait = "corruption"
label = "Corruption"
show_value = true
bands = [
  { min = 0, max = 19, text = "Good Girl" },
  { min = 20, max = 39, text = "Curious" },
  { min = 40, max = 59, text = "Bold" },
  { min = 60, max = 79, text = "Wild" },
  { min = 80, max = 100, text = "Shameless" },
]

[[sidebar_items]]
type = "trait_words"
trait = "exhibitionism"
label = "Exhibitionism"
show_value = true
bands = [
  { min = 0, max = 19, text = "Covered" },
  { min = 20, max = 39, text = "Noticed" },
  { min = 40, max = 59, text = "Showing Off" },
  { min = 60, max = 79, text = "Exposed" },
  { min = 80, max = 100, text = "On Display" },
]


# P11 — goal 1's count and the rent total, internal (not on the sidebar).
[[traits.labels]]
key = "sundays_paid"
label = "Sundays paid"
hidden = true
toast = false

[[traits.labels]]
key = "rent_paid_total"
label = "Rent paid"
hidden = true
toast = false

[[traits.labels]]
key = "meals_today"
label = "Meals today"
hidden = true
toast = false


[[traits.labels]]
key = "want"
label = "Want"

[[traits.labels]]
key = "warmth"
label = "Warmth"

[[traits.labels]]
key = "power"
label = "Power"

# P13 — the people page. Who is listed is the quest cards' decision (template_import.py:684-708):
# a person shows once a card's `when` holds, so each person's card gates on their met flag.
[ui.cast_page]
title = "People"
show_traits = ["want", "warmth", "power"]

[ui.cast_page.trait_bands]
want = [
  { min = 0, max = 24, text = "Hides it" },
  { min = 25, max = 49, text = "Looks" },
  { min = 50, max = 74, text = "Doesn't hide it" },
  { min = 75, max = 100, text = "Wants you" },
]
power = [
  { min = 0, max = 24, text = "Backs off" },
  { min = 25, max = 49, text = "Pushes" },
  { min = 50, max = 74, text = "In charge" },
  { min = 75, max = 100, text = "Owns the house" },
]
warmth = [
  { min = 0, max = 24, text = "Distant" },
  { min = 25, max = 49, text = "Friendly" },
  { min = 50, max = 74, text = "On your side" },
  { min = 75, max = 100, text = "Close" },
]

[[quest_cards]]
npc_id = "npc_ryan"
when = [{ flag = "met_ryan", op = "is_true" }]
text = "Your step-brother, 22. He shares the hall and the bathroom with you."
tip = "He's in the shower around half past seven on weekday mornings, and on the couch most evenings from seven."

# P13 — Laura and Mark on the People page once met.
[[quest_cards]]
npc_id = "npc_laura"
when = [{ flag = "met_laura", op = "is_true" }]
text = "Your mom, 41. She married Mark three years ago."
tip = "She's in the kitchen in the mornings and from five, and on the couch in the evenings."

[[quest_cards]]
npc_id = "npc_mark"
when = [{ flag = "met_mark", op = "is_true" }]
text = "Your step-father, 46. He collects the rent."
tip = "He's at the kitchen table on Sunday mornings. That's when he collects."

# P13 — goal 1's card, armed by the opening (C1604). P11 adds the Sundays count.
[[quest_cards]]
group = "story_goals"
when = [{ flag = "goal1_shown", op = "is_true" }]
text = "Pay your own way. Pay Mark your share every Sunday."
ready_text = "Done. You pay your own way. Next: your name on campus, in a later release."
tip = "You need money. Take shifts, or find another way. People are in different places at different hours. What you say changes how they treat you."
goals = [
  { flag = "met_mark", op = "is_true", label = "Mark told you the rent" },
  { flag = "cafe_hired", op = "is_true", label = "Ask about the Help Wanted sign at the café across from campus. The manager's in Monday to Saturday, from 10am." },
  { flag = "rent_paid_once", op = "is_true", label = "Pay Mark on Sunday morning, at the kitchen table." },
  { trait = "sundays_paid", subject = "player", op = "gte", value = 4, label = "Pay Mark in full four Sundays in a row" },
]

# P21 — Tom and Chris on the People page once met, with where and when.
[[quest_cards]]
npc_id = "npc_tom"
when = [{ flag = "met_tom", op = "is_true" }]
text = "Tom, 31. He runs the café across from campus, and now he's your boss."
tip = "He's behind the counter Monday to Saturday, from 10am to 9pm."

[[quest_cards]]
npc_id = "npc_chris"
when = [{ flag = "met_chris", op = "is_true" }]
text = "Chris, 24. The café's barista. Tom gave you his afternoons."
tip = "He has the counter weekday mornings until 3pm, and weekends until 8pm."

[[quest_cards]]
npc_id = "npc_nina"
when = [{ flag = "met_nina", op = "is_true" }]
text = "Nina, 26. She runs the clothes shop on your street."
tip = "Behind the till Monday to Saturday, 10am to 7pm."

# P42 — the day turn clears the once-a-day talk flags (v2.py:1269-1277, v2.py:7158).
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "talked_mom_today", op = "unset" },
  { targetType = "player", flag = "talked_mark_today", op = "unset" },
  { targetType = "player", flag = "talked_ryan_today", op = "unset" },
  { targetType = "player", flag = "ate_with_mom_today", op = "unset" },
  # P21 — "Not today." at the café parks the ask until the next day
  { targetType = "player", flag = "cafe_ask_parked", op = "unset" },
  # P11 — the rent week: cleared on Tuesday, after Monday's check has read it
  { targetType = "player", flag = "rent_handled_this_week", op = "unset", conditions = { version = "1.0", logic = "AND", items = [{ type = "weekday", weekdays = [1] }] } },
  # P11 — four Sundays in a row: goal 1 done (PLAN §2, §8i)
  { targetType = "player", flag = "pays_her_own_way", op = "set", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "player", trait_key = "sundays_paid", operator = "gte", value = 4 }] } },
]
# P11 — on Monday, a Sunday with no payment breaks the run
traitEffects = [
  { targetType = "player", trait = "sundays_paid", op = "set", value = 0, conditions = { version = "1.0", logic = "AND", items = [{ type = "weekday", weekdays = [0] }, { type = "flag", subject = "player", flag_key = "rent_handled_this_week", operator = "is_false" }, { type = "flag", subject = "player", flag_key = "pays_her_own_way", operator = "is_false" }] } },
  # P34 — meals: one count a day
  { targetType = "player", trait = "meals_today", op = "set", value = 0 },
]

# P35 — the room layout, since the table layout's tiers read corruption only (PLAN §8d).
[ui]
clothes_layout = "room"

# ── P08 · the phone: Messages only (PLAN §8e). One text from each person some hours after she meets
# them, one reply round, a line back. No reply moves a meter or sets a flag. Each trigger's
# conditions sit one level down (trigger.conditions), or the thread fires unconditionally. ──
[phone]
enabled = true

[[phone.apps]]
id = "messages"
type = "chat"
label = "Messages"

[[phone.conversations]]
id = "text_laura"
app = "messages"
npc = "npc_laura"
notify = "📱 New message"
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [{ type = "hours_since_flag", subject = "player", flag_key = "met_laura", operator = "gte", value = 4 }] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "How's the first day, baby? Did you eat?"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "It's fine, Mom. I ate." },
  { text = "It's a lot." },
  { text = "Stop worrying." },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 0
content = "Good. Proud of you. ❤️"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 1
content = "It gets easier. Tell me everything tonight."
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 2
content = "Never. That's my job."

[[phone.conversations]]
id = "text_ryan"
app = "messages"
npc = "npc_ryan"
notify = "📱 New message"
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [{ type = "hours_since_flag", subject = "player", flag_key = "met_ryan", operator = "gte", value = 6 }] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "mark's in a mood. stay out of the living room tonight"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "Thanks for the warning" },
  { text = "Why are you telling me?" },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 0
content = "np"
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 1
content = "dunno. figured you'd want to know"

[[phone.conversations]]
id = "text_mark"
app = "messages"
npc = "npc_mark"
notify = "📱 New message"
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [{ type = "hours_since_flag", subject = "player", flag_key = "met_mark", operator = "gte", value = 10 }] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "Sunday. Seventy-five. Don't make me ask twice."
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "I know." },
  { text = "I'm working on it." },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 0
content = "Good."
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 1
content = "Work faster, kid."

[[phone.conversations]]
id = "text_tom"
app = "messages"
npc = "npc_tom"
notify = "📱 New message"
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [{ type = "hours_since_flag", subject = "player", flag_key = "met_tom", operator = "gte", value = 3 }] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "Tom from the café. Come in when you want, as long as one of us is here till you're done."
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "I won't." },
  { text = "Yes, boss." },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 0
content = "We'll see."
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 1
content = "I like the sound of that."

[[phone.conversations]]
id = "text_chris"
app = "messages"
npc = "npc_chris"
notify = "📱 New message"
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [{ type = "hours_since_flag", subject = "player", flag_key = "cafe_first_shift_done", operator = "gte", value = 3 }] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "it's chris. you still owe me for showing you the machine, new girl"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "I owe you nothing." },
  { text = "What do you want?" },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 0
