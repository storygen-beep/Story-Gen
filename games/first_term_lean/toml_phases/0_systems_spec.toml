  { targetType = "player", flag = "talked_zoe_today", op = "unset" },
  { targetType = "player", flag = "talked_jake_today", op = "unset" },
  { targetType = "player", flag = "talked_brooke_today", op = "unset" },
  { targetType = "player", flag = "ate_with_mom_today", op = "unset" },
  # P84 — Cross watches her practise once a day, then the stage is his until two
  { targetType = "player", flag = "cross_seats_today", op = "unset" },
  # P21 — "Not today." at the café parks the ask until the next day
  { targetType = "player", flag = "cafe_ask_parked", op = "unset" },
  # P11 — the rent week: cleared on Tuesday, after Monday's check has read it
  { targetType = "player", flag = "rent_handled_this_week", op = "unset", conditions = { version = "1.0", logic = "AND", items = [{ type = "weekday", weekdays = [1] }] } },
  { targetType = "player", flag = "partied_this_week", op = "unset", conditions = { version = "1.0", logic = "AND", items = [{ type = "weekday", weekdays = [0] }] } },
  { targetType = "player", flag = "zoe_dare_done", op = "unset", conditions = { version = "1.0", logic = "AND", items = [{ type = "weekday", weekdays = [0] }] } },
]
traitEffects = [
  # P66 — a Sunday she never brought to Mark is a short one too: on Monday, an unhandled week adds a week owed
  # (LO 2026-11-27: "yes to all 4"; reader pass: staying away must not be cheaper than saying no).
  { targetType = "player", trait = "rent_weeks_owed", op = "add", value = 1, cap = 3, conditions = { version = "1.0", logic = "AND", items = [{ type = "weekday", weekdays = [0] }, { type = "flag", subject = "player", flag_key = "rent_handled_this_week", operator = "is_false" }] } },
  # P34 — meals: one count a day
  { targetType = "player", trait = "meals_today", op = "set", value = 0 },
  { targetType = "player", trait = "study_today", op = "set", value = 0 },
]

# P35 — the room layout, since the table layout's tiers read one fixed meter only (PLAN §8d).
