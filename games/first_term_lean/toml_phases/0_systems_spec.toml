  { when = [{ flag = "met_nadia", op = "is_true" }], text = "You know someone in psychology now. Statistics is Monday and Wednesday at 11am, English Tuesday and Thursday at 9am, both in the Lecture Hall." },
  { when = [{ flag = "met_hale", op = "is_true" }, { flag = "met_pratt", op = "is_true" }, { flag = "met_walsh", op = "is_true" }], text = "end" },
