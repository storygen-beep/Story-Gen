# P13 — the people page. Who is listed is the quest cards' decision (template_import.py:684-708):
# a person shows once a card's `when` holds, so each person's card gates on their met flag.
[ui.cast_page]
title = "People"
show_traits = ["want", "warmth", "power"]

[ui.cast_page.trait_bands]
want = [
  { min = 0, max = 24, text = "Hides it" },
  { min = 25, max = 49, text = "Looks" },
  { min = 50, max = 74, text = "Doesn't hide it" },
  { min = 75, max = 100, text = "Wants you" },
]
power = [
  { min = 0, max = 24, text = "Backs off" },
  { min = 25, max = 49, text = "Pushes" },
  { min = 50, max = 74, text = "In charge" },
  { min = 75, max = 100, text = "Owns the house" },
]
warmth = [
  { min = 0, max = 24, text = "Distant" },
  { min = 25, max = 49, text = "Friendly" },
  { min = 50, max = 74, text = "On your side" },
  { min = 75, max = 100, text = "Close" },
]

[[quest_cards]]
npc_id = "npc_ryan"
when = [{ flag = "met_ryan", op = "is_true" }]
text = "Your step-brother, 22. He shares the hall and the bathroom with you."
tip = "He's in the shower around half past seven on weekday mornings, and on the couch most evenings from seven."

# P13 — Laura and Mark on the People page once met.
[[quest_cards]]
npc_id = "npc_laura"
when = [{ flag = "met_laura", op = "is_true" }]
text = "Your mom, 41. She married Mark three years ago."
tip = "She's in the kitchen in the mornings and from five, and on the couch in the evenings."

[[quest_cards]]
npc_id = "npc_mark"
when = [{ flag = "met_mark", op = "is_true" }]
text = "Your step-father, 46. He collects the rent."
tip = "He's at the kitchen table on Sunday mornings. That's when he collects."

# P13 — goal 1's card, armed by the opening (C1604). P11 adds the Sundays count.
[[quest_cards]]
group = "story_goals"
when = [{ flag = "goal1_shown", op = "is_true" }]
text = "Pay your own way. Pay Mark your share every Sunday."
ready_text = "Done. You pay your own way. Next: your name on campus, in a later release."
tip = "You need money. Take shifts, or find another way. People are in different places at different hours. What you say changes how they treat you."
goals = [
  { flag = "met_mark", op = "is_true", label = "Mark told you the rent" },
  { flag = "cafe_hired", op = "is_true", label = "Ask about the Help Wanted sign at the café across from campus. The manager's in Monday to Saturday, from 10am." },
  { flag = "rent_paid_once", op = "is_true", label = "Pay Mark on Sunday morning, at the kitchen table." },
  { trait = "sundays_paid", subject = "player", op = "gte", value = 4, label = "Pay Mark in full four Sundays in a row" },
]

# P21 — Tom and Chris on the People page once met, with where and when.
[[quest_cards]]
npc_id = "npc_tom"
when = [{ flag = "met_tom", op = "is_true" }]
text = "Tom, 31. He runs the café across from campus, and now he's your boss."
tip = "He's behind the counter Monday to Saturday, from 10am to 9pm."

[[quest_cards]]
npc_id = "npc_chris"
when = [{ flag = "met_chris", op = "is_true" }]
text = "Chris, 24. The café's barista. He keeps the machine to himself."
tip = "He has the counter weekday mornings until 3pm, and weekends until 8pm."

# P32 — a card per person, gated on meeting them, so the Schedules and People pages name no stranger.
[[quest_cards]]
npc_id = "npc_hale"
when = [{ flag = "met_hale", op = "is_true" }]
text = "Dr. Hale, 39. Your psychology professor."
tip = "He lectures Monday and Wednesday, 9 to 11am, in the lecture hall. His office hours are Monday and Wednesday, 2 to 5pm."

[[quest_cards]]
npc_id = "npc_pratt"
when = [{ flag = "met_pratt", op = "is_true" }]
text = "Mr. Pratt, 44. Your statistics teacher."
tip = "Monday and Wednesday, 11am to 1pm, in the lecture hall. His office, Monday and Wednesday, 1 to 3pm."

[[quest_cards]]
npc_id = "npc_walsh"
when = [{ flag = "met_walsh", op = "is_true" }]
text = "Prof. Walsh, 48. Your English professor, and your advisor."
tip = "Tuesday and Thursday, 9 to 11am, in the lecture hall. Advisor hours, Tuesday and Thursday, 2 to 4pm."

[[quest_cards]]
npc_id = "npc_cross"
when = [{ flag = "met_cross", op = "is_true" }]
text = "Mr. Cross, 38. He teaches drama."
tip = "Class Tuesday and Thursday, 11am to 1pm, in the theatre. Rehearsals Tuesday, Thursday and Friday, 2 to 6pm."

[[quest_cards]]
npc_id = "npc_nadia"
when = [{ flag = "met_nadia", op = "is_true" }]
text = "Nadia, 20. A second-year, retaking Dr. Hale's course."
tip = "Psychology on Monday and Wednesday mornings, the cafeteria Monday and Wednesday at 1pm, and the library weekday afternoons, 2 to 6pm."

[[quest_cards]]
npc_id = "npc_holt"
when = [{ flag = "met_holt", op = "is_true" }]
text = "Ms. Holt, 31. The librarian."
tip = "At the library desk weekdays 8am to 4pm, and Saturday 10am to 4pm."

[[quest_cards]]
npc_id = "npc_rosa"
when = [{ flag = "met_rosa", op = "is_true" }]
text = "Rosa, 45. She runs the cafeteria counter."
tip = "Weekdays, 8am to 4pm."

[[quest_cards]]
npc_id = "npc_vance"
when = [{ flag = "met_vance", op = "is_true" }]
text = "Mr. Vance, 54. He owns your house, and lives next door."
tip = "On his porch weekdays 5 to 8pm, and weekends 9am to noon and 5 to 8pm."

[[quest_cards]]
npc_id = "npc_frank"
when = [{ flag = "met_frank", op = "is_true" }]
text = "Frank, 52. He owns the corner shop, and he knows Mark."
tip = "Behind the till Monday to Saturday, 7am to 3pm."

[[quest_cards]]
npc_id = "npc_danny"
when = [{ flag = "met_danny", op = "is_true" }]
text = "Danny, 23. The corner shop's night clerk."
tip = "Every day from 3 to 11pm, and all day Sunday."

[[quest_cards]]
npc_id = "npc_marco"
when = [{ flag = "met_marco", op = "is_true" }]
text = "Marco, 29. A trainer at the gym."
tip = "Weekdays 6 to 10am and 5 to 9pm, and Saturday 8am to 2pm."

[[quest_cards]]
npc_id = "npc_zoe"
when = [{ flag = "met_zoe", op = "is_true" }]
text = "Zoe, 19. She found you on the quad."
tip = "On the quad weekday afternoons, 1 to 3 (2 to 3 on Tuesday and Thursday, after lunch in the cafeteria); at home every evening, 6 to 11, two streets from campus."

[[quest_cards]]
npc_id = "npc_nina"
when = [{ flag = "met_nina", op = "is_true" }]
text = "Nina, 26. She runs the clothes shop on your street."
tip = "Behind the till Monday to Saturday, 10am to 7pm."

# P42 — the day turn clears the once-a-day talk flags (v2.py:1269-1277, v2.py:7158).
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "talked_mom_today", op = "unset" },
  { targetType = "player", flag = "talked_mark_today", op = "unset" },
  { targetType = "player", flag = "talked_ryan_today", op = "unset" },
  { targetType = "player", flag = "ate_with_mom_today", op = "unset" },
  # P21 — "Not today." at the café parks the ask until the next day
  { targetType = "player", flag = "cafe_ask_parked", op = "unset" },
  # P11 — the rent week: cleared on Tuesday, after Monday's check has read it
  { targetType = "player", flag = "rent_handled_this_week", op = "unset", conditions = { version = "1.0", logic = "AND", items = [{ type = "weekday", weekdays = [1] }] } },
  # P11 — four Sundays in a row: goal 1 done (PLAN §2, §8i)
  { targetType = "player", flag = "pays_her_own_way", op = "set", conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "player", trait_key = "sundays_paid", operator = "gte", value = 4 }] } },
]
# P11 — on Monday, a Sunday with no payment breaks the run
traitEffects = [
  { targetType = "player", trait = "sundays_paid", op = "set", value = 0, conditions = { version = "1.0", logic = "AND", items = [{ type = "weekday", weekdays = [0] }, { type = "flag", subject = "player", flag_key = "rent_handled_this_week", operator = "is_false" }, { type = "flag", subject = "player", flag_key = "pays_her_own_way", operator = "is_false" }] } },
  # P34 — meals: one count a day
  { targetType = "player", trait = "meals_today", op = "set", value = 0 },
  { targetType = "player", trait = "study_today", op = "set", value = 0 },
]

