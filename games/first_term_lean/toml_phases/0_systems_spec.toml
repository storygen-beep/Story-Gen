# P48 — the people page. Who is listed is the quest cards' decision (template_import.py:684-708):
# a person shows once a card's `when` holds. Their meters are the people system's (friendship, lust, control).
[ui.cast_page]
title = "People"

[[quest_cards]]
npc_id = "npc_ryan"
when = [{ flag = "met_ryan", op = "is_true" }]
text = "Your step-brother, 22. He shares the hall and the bathroom with you."
tip = "He's in the shower around half past seven on weekday mornings, and on the couch most evenings from seven."

# P13 — Laura and Mark on the People page once met.
[[quest_cards]]
npc_id = "npc_laura"
when = [{ flag = "met_laura", op = "is_true" }]
text = "Your mom, 41. She married Mark three years ago."
tip = "She's in the kitchen in the mornings and from five, and on the couch in the evenings."

[[quest_cards]]
npc_id = "npc_mark"
when = [{ flag = "met_mark", op = "is_true" }]
text = "Your step-father, 46. He collects the rent."
tip = "He's at the kitchen table on Sunday mornings. That's when he collects."

# P46 — the story goal card becomes CoT's Hints page entries, one per release-1 storyline (ENI for LO 2026-11-24).
[[story_hints]]
title = "Paying Your Way"
category = "Storyline 📖"
description = "Mark wants your share every Sunday."
when = [{ flag = "goal1_shown", op = "is_true" }]
walkthrough = "paying_wt"
hints = [
  { when = [], text = "Mark collects the rent at the kitchen table on Sunday mornings, 8am to noon. Find the money before then." },
  # P66 — release 1 ends this storyline at the first payment (LO 2026-11-27: "just one pay and then it says more in the further releases").
  { when = [{ flag = "rent_paid_once", op = "is_true" }], text = "end" },
]

[[story_hints]]
title = "The Café Job"
category = "Employment 💼"
description = "The café in town is hiring."
hints = [
  { when = [], text = "Ask about the Help Wanted sign at the Café in town. The manager's in Monday to Saturday, from 10am." },
  { when = [{ flag = "met_tom", op = "is_true" }], text = "Work your first shift at the Café: a weekday between 10am and 3pm, while Tom and the barista are both in." },
  { when = [{ flag = "met_chris", op = "is_true" }], text = "end" },
]

[[story_hints]]
title = "Classes"
