# ── P08 · the phone: Messages only (PLAN §8e). One text from each person some hours after she meets
# them, one reply round, a line back. No reply moves a meter or sets a flag. Each trigger's
# conditions sit one level down (trigger.conditions), or the thread fires unconditionally. ──
[phone]
enabled = true

[[phone.apps]]
id = "messages"
type = "chat"
label = "Messages"

[[phone.conversations]]
id = "text_laura"
app = "messages"
npc = "npc_laura"
notify = "📱 New message"
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [{ type = "hours_since_flag", subject = "player", flag_key = "met_laura", operator = "gte", value = 4 }] }
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
content = "How's the first day, baby? Did you eat?"
[[phone.conversations.blocks]]
type = "reply"
round = 1
choices = [
  { text = "It's fine, Mom. I ate." },
  { text = "It's a lot." },
  { text = "Stop worrying." },
]
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 0
content = "Good. Proud of you. ❤️ Tell me all of it tonight."
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 1
content = "It gets easier. Tell me everything tonight."
[[phone.conversations.blocks]]
type = "message"
sender = "npc"
after_round = 1
after_choice = 2
content = "Never. That's my job. Tonight you're telling me everything."
[[phone.conversations]]
id = "text_ryan"
app = "messages"
npc = "npc_ryan"
notify = "📱 New message"
[phone.conversations.trigger]
conditions = { version = "1.0", logic = "AND", items = [{ type = "hours_since_flag", subject = "player", flag_key = "met_ryan", operator = "gte", value = 6 }] }
