# First Term (first_term_lean) — systems spec. Piece P01: the frame.

[project]
id = "first_term_lean"
# LO 2026-11-20: a title of its own, because browser save slots key off the title (games-data.js, vesper_two note).
title = "First Term (Lean)"
description = "Ella's first term of college, living at home with the family that starts looking at her differently."
quests_engine = "v2"
starting_canvas = "opening"

# P02 — second person, declared once for the whole game (C503, C548; validated at template_import.py:4108).
[settings]
narration_person = "second"
# P07 — clothes on; the full wardrobe only in her bedroom (v2.py:1190-1198).
clothing_enabled = true
wardrobe_location = "home_her_room"
wardrobe_anywhere = false

# The game starts on her first day of college: Monday, week 1, 07:00 (template_import.py:2319-2325).
[time]
enabled = true
starting_hour = 7
starting_day = "Monday"
starting_week = 1

[[traits.labels]]
key = "energy"
label = "Energy"

[[traits.labels]]
key = "money"
label = "Money"

[[traits.labels]]
key = "corruption"
label = "Corruption"

[[traits.labels]]
key = "exhibitionism"
label = "Exhibitionism"

# Sidebar, top to bottom under the engine's clock line (v2.py:20828).
[[sidebar_items]]
type = "trait_bar"
trait = "energy"
label = "Energy"
max = 100

[[sidebar_items]]
type = "trait_words"
trait = "money"
label = "Money"
show_value = true
# One band with no word, so the line reads "Money: N" (v2.py:21416-21418).
bands = [{ min = 0, max = 1000000, text = "" }]

# Her two meters, 20 points a stage (C285). Release 1 moves neither.
[[sidebar_items]]
type = "trait_words"
trait = "corruption"
label = "Corruption"
show_value = true
bands = [
  { min = 0, max = 19, text = "Good Girl" },
  { min = 20, max = 39, text = "Curious" },
  { min = 40, max = 59, text = "Bold" },
  { min = 60, max = 79, text = "Wild" },
  { min = 80, max = 100, text = "Shameless" },
]

[[sidebar_items]]
type = "trait_words"
trait = "exhibitionism"
label = "Exhibitionism"
show_value = true
bands = [
  { min = 0, max = 19, text = "Covered" },
  { min = 20, max = 39, text = "Noticed" },
  { min = 40, max = 59, text = "Showing Off" },
  { min = 60, max = 79, text = "Exposed" },
  { min = 80, max = 100, text = "On Display" },
]

[[traits.labels]]
key = "want"
label = "Want"

[[traits.labels]]
key = "warmth"
label = "Warmth"

[[traits.labels]]
key = "power"
label = "Power"

# P13 — the people page. Who is listed is the quest cards' decision (template_import.py:684-708):
# a person shows once a card's `when` holds, so each person's card gates on their met flag.
[ui.cast_page]
title = "People"
show_traits = ["want", "warmth", "power"]

[ui.cast_page.trait_bands]
want = [
  { min = 0, max = 24, text = "Hides it" },
  { min = 25, max = 49, text = "Looks" },
  { min = 50, max = 74, text = "Doesn't hide it" },
  { min = 75, max = 100, text = "Wants you" },
]
power = [
  { min = 0, max = 24, text = "Backs off" },
  { min = 25, max = 49, text = "Pushes" },
  { min = 50, max = 74, text = "In charge" },
  { min = 75, max = 100, text = "Owns the house" },
]
warmth = [
  { min = 0, max = 24, text = "Distant" },
  { min = 25, max = 49, text = "Friendly" },
  { min = 50, max = 74, text = "On your side" },
  { min = 75, max = 100, text = "Close" },
]

[[quest_cards]]
npc_id = "npc_ryan"
when = [{ flag = "met_ryan", op = "is_true" }]
text = "Your step-brother, 22. He shares the hall and the bathroom with you."

# P13 — Laura and Mark on the People page once met.
[[quest_cards]]
npc_id = "npc_laura"
when = [{ flag = "met_laura", op = "is_true" }]
text = "Your mom, 41. She married Mark three years ago."

[[quest_cards]]
npc_id = "npc_mark"
when = [{ flag = "met_mark", op = "is_true" }]
text = "Your step-father, 46. He collects the rent."

# P13 — goal 1's card, armed by the opening (C1604). P11 adds the Sundays count.
[[quest_cards]]
group = "story_goals"
when = [{ flag = "goal1_shown", op = "is_true" }]
text = "Pay your own way. Pay Mark your share every Sunday. This week: seventy-five."
tip = "You need money. Take shifts, or find another way. People are in different places at different hours. What you say changes how they treat you."
goals = [
  { flag = "cafe_hired", op = "is_true", label = "Ask about work at the café across from campus" },
  { flag = "rent_paid_once", op = "is_true", label = "Pay Mark on Sunday" },
]

# P42 — the day turn clears the once-a-day talk flags (v2.py:1269-1277, v2.py:7158).
[engine.daily_tick]
flagEffects = [
  { targetType = "player", flag = "talked_mom_today", op = "unset" },
]

