[[canvases.nodes]]
id = "bath"
name = "Screen 4b: the bathroom"
blocks = [
  { type = "paragraph", content = "Upstairs, you get the bathroom a second before Ryan, your step-brother, opens his door. The bolt hasn't held in years, and the water takes forever to run hot." },
  { type = "paragraph", content = "You strip and step in before it's warm. It hits your nipples cold, and they go hard. Then the heat comes. You stand under it with your eyes shut and let it run down your neck, over your tits, down your stomach and between your thighs. Your shoulders drop for the first time all morning." },
  { type = "image", props = { description = "A woman of 18 in a small family bathroom shower, water running down her bare body, eyes shut, head tipped back. No one else in frame.", search_queries = ["woman 18 shower water running down body gif", "girl in a small bathroom shower eyes closed gif"], pool_dir = "body/opening_shower_t4", pool = 1 } },
