# First Term (first_term_lean) — player, locations, people. Piece P01: the player's traits only.

[player]
id = "player"
name = "Ella"
# money is not a 0-100 meter: every money effect must set clamp = false (v2.py:7361-7364).
core_traits = { energy = 100, money = 0, corruption = 0, exhibitionism = 0, sundays_paid = 0, rent_paid_total = 0, meals_today = 0, grades = 50, study_today = 0 }
# Every player flag is declared here. P05: zoe_place_known (set by P20) reveals Zoe's Apartment.
flag_keys = [
  "zoe_place_known",
  # P03 re-check: the house next door opens once she has met him (P24 sets it)
  "met_vance",
  # P04 re-check: the faculty corridor opens once her advisor asks to see her (P16 sets it)
  "met_walsh",
  # P13 — the opening
  "start_grades", "start_fun", "start_freedom",
  "met_laura", "met_mark",
  # P42 — Mom's Talk, once a day; the day turn clears it
  "talked_mom_today",
  # P21 — the café job
  "met_tom", "met_chris", "cafe_first_shift_done", "cafe_ask_parked",
  "met_ryan", "ryan_hall_seen", "ryan_hall_past", "ryan_hall_spoke", "ryan_hall_waited", "goal1_shown",
  # Goal 1's card reads these; P21 sets cafe_hired, P11 sets rent_paid_once.
  "cafe_hired", "rent_paid_once",
  # P11 — Sunday rent
  "rent_handled_this_week", "pays_her_own_way",
  # P34 — Mark's and Ryan's Talk, once a day each; the day turn clears them
  "talked_mark_today", "talked_ryan_today",
  # P34 — Eat with her, once a day; the day turn clears it
  "ate_with_mom_today",
  # P33 — the run, first time
  "ran_once",
  # P32 — met flags for the people P32 schedules (their meetings set them)
  "met_hale", "met_pratt", "met_cross", "met_nadia", "met_holt", "met_rosa", "met_frank", "met_danny", "met_marco",
  # P15 — memory flags from her answers
