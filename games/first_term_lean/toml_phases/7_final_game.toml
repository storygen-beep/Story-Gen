  { type = "paragraph", content = "When you open the door, steam rolls out into the hall, and your step-brother is leaning on the wall opposite, arms folded, waiting his turn." },
  { type = "paragraph", content = "Ryan. Twenty-two, shirtless, sleep still in his eyes. He doesn't move out of the way." },
  { type = "paragraph", content = "His eyes drop. Down the towel, to where it stops at the top of your thighs, down your wet legs. Then slowly back up, and they stop on your chest, where your nipples are hard against the damp cotton." },
