# First Term (first_term_lean) — scenes.

# ── P13 · the opening, re-carded 2026-11-21 from craft/opening.md (approved sha e0930193eb21).
# The starting canvas: after the age gate and the name screen, straight through with no map:
# setup, the problem (Mark), the start choice (Laura), the build-up, the temptation (Ryan, LO's
# "yes B": he catches himself and covers), the goal card, the hand-over to Laura in the Kitchen.
# Screen 4 and screen 6 have one node per answer, so each answer is read without conditions. ──

[[canvases]]
id = "opening"
name = "First Day"

[[canvases.nodes]]
id = "wake"
name = "Screen 1: your bedroom"
blocks = [
  { type = "paragraph", content = "Your saves live in this browser. Use Saves, then Save to Disk…, to keep one." },
  { type = "paragraph", content = "Monday morning. Today you start college." },
  { type = "paragraph", content = "You kick off the sheet. Your pyjama top has ridden up in the night, and the cold air on your stomach makes your nipples go tight under it." },
  { type = "image", props = { description = "A woman of 18 in a single bed in her small bedroom, the sheet kicked off, a thin pyjama top ridden up over her stomach, morning light. Alone.", search_queries = ["woman 18 single bed sheet kicked off pyjama top ridden up morning", "girl waking up in a narrow bed, morning light"], pool_dir = "body/opening_wake_t3", pool = 1 } },
  { type = "paragraph", content = "You're eighteen, in the single bed you had at twelve, and you've never had money that wasn't your mom's. Four people, one bathroom. The only thing in this house that's yours is the old key in your bedroom door." },
  { type = "paragraph", content = "College. Finally, something that's yours." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Go down to the kitchen (5 min)"
targetType = "node"
nodeId = "kitchen_rent"
time_progression_minutes = 5
flagEffects = [{ flag = "met_laura", op = "set" }]

[[canvases.nodes]]
id = "kitchen_rent"
name = "Screen 2: the kitchen, the rent"
blocks = [
  { type = "paragraph", content = "Mark, your step-father, is at the table with his coffee, like he's been waiting for you. Mom's at the stove." },
  { type = "dialog", content = "Morning, kid. Seventy-five a week, starting Sunday. Your share of the rent. You're an adult now.", props = { speaker = "npc", npcId = "npc_mark" } },
  { type = "paragraph", content = "He takes a sip." },
  { type = "dialog", content = "One way or another. Your mother thinks I'm joking. I'm not.", props = { speaker = "npc", npcId = "npc_mark" } },
  { type = "paragraph", content = "Mom keeps her back to you. The pan hisses. She doesn't turn round." },
  { type = "paragraph", content = "Your stomach drops. Seventy-five, and you have nothing. And she already knew." },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text = "Look at Mom (2 min)"
targetType = "node"
nodeId = "kitchen_ask"
time_progression_minutes = 2
# P13 (reader v6, C217): the rent step's flag, on its way out.
flagEffects = [{ flag = "met_mark", op = "set" }]

[[canvases.nodes]]
id = "kitchen_ask"
name = "Screen 3: the kitchen, Mom asks"
blocks = [
  { type = "paragraph", content = "Mom turns round with the spatula, too bright." },
  { type = "dialog", content = "Anyway! First day, baby.", props = { speaker = "npc", npcId = "npc_laura" } },
  { type = "paragraph", content = "She points the spatula at you." },
  { type = "dialog", content = "Just... promise me you'll still be the girl you were in high school.", props = { speaker = "npc", npcId = "npc_laura" } },
  { type = "paragraph", content = "Mark turns a page. He's listening." },
]

[canvases.nodes.exit_block]
