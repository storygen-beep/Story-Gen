schema_version = "0.2"

[project]
id = "saturday_passion"
title = "Saturday Passion"
description = """
Marcus wakes up late on a Saturday morning to find Elena, his partner, getting ready for the day.
What starts as a lazy weekend morning becomes a journey of rediscovery as the couple reconnects
through small moments that build into passionate intensity.
"""

[time]
enabled = true
starting_hour = 8
starting_day = "Saturday"
starting_week = 1

# ===== PLAYER =====

[player]
id = "player"
name = "Marcus"
description = "Early 30s, been stressed with work lately. Today feels different - the weekend stretches ahead with possibility."
core_traits = { energy = 50, confidence = 40, desire = 30, intimacy_level = 0 }
flag_keys = ["had_morning_kiss", "surprised_her_kitchen", "breakfast_intimacy", "living_room_heat", "table_encounter", "passionate_connection", "full_intimacy"]

