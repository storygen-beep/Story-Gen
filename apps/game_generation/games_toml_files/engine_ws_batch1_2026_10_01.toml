# ═══════════════════════════════════════════════════════════════════════════════
#  ENGINE FIXTURE — World and Systems PRD, Phase 7 batch 1 (E2, E3, E4)
#  Date: 2026-10-01
#
#  Media-free. Each engine item adds only what its own tests need.
#
#  E2 — "event pools that remember":
#    pool_room    a repeatable canvas at loc_home with two block_pools: `remembered`
#                 (memory = "seen", id = "home_pool", three entries) and a plain
#                 pool beside it (the control, still random(0, 2)).
#    pool_hashed  a remembering pool with no id: its key is a hash of its entries.
#    random_seen  a random canvas at loc_bar with chance = 1.0 and seen_weight = 0.5:
#                 1.0 until it has fired, 0.5 after.
#    random_plain the control: chance = 1.0 and no seen_weight, 1.0 for ever.
#
#  E3 — "repeatable chats":
#    dan_invite   repeat_after_days = 2, max_repeats = 2, one reply round (+1 Dan trust):
#                 comes back two days after she answers, at most twice.
#    dan_note     repeat_after_days = 1 and no reply block: "answered" means read.
#    sal_hello    a one-time chat with a reply: the control, unchanged.
#
#  E4 — "weekday and hours-since-flag":
#    sat_only     a bar canvas gated on weekday = [5] (Saturday); the game starts Monday.
#    meet_dan     a home canvas whose exit sets met_dan.
#    after_dan    a home canvas gated on hours_since_flag met_dan >= 3.
#    card_wait    a quest card whose goals are the same two gates in quest-card shape.
# ═══════════════════════════════════════════════════════════════════════════════

schema_version  = "0.2"
starting_canvas = "scene_start"

[project]
id          = "engine_ws_batch1"
title       = "Engine World and Systems Batch 1"
description = "Engine fixture for the World and Systems PRD, Phase 7 batch 1."
quests_engine = "v2"

[time]
enabled       = true
starting_hour = 18
starting_day  = "Monday"
starting_week = 1

[player]
id          = "player"
name        = "Mara"
description = "Fixture protagonist."
core_traits = { energy = 100, money = 40 }
flag_keys   = ["started", "met_dan"]

[[npcs]]
id          = "npc_dan"
name        = "Dan"
description = "Fixture texter."
core_traits = { trust = 0 }
flag_keys   = []

[[npcs]]
id          = "npc_sal"
name        = "Sal"
description = "Fixture friend."
core_traits = { trust = 0 }
flag_keys   = []

[phone]
enabled = true

[[phone.apps]]
id    = "messages"
type  = "chat"
label = "Messages"

[[phone.conversations]]
id                = "dan_invite"
app               = "messages"
npc               = "npc_dan"
notify            = "Dan texted you."
repeat_after_days = 2
max_repeats       = 2
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "started", operator = "is_true" } ] }
[[phone.conversations.blocks]]
type    = "message"
sender  = "npc"
content = "Free tonight?"
[[phone.conversations.blocks]]
type    = "reply"
round   = 1
choices = [
  { text = "Yes.", effects = [ { targetType = "npc", npcId = "npc_dan", trait = "trust", op = "add", value = 1 } ] },
  { text = "Not tonight." } ]
[[phone.conversations.blocks]]
type        = "message"
sender      = "npc"
content     = "Noted."
after_round = 1

[[phone.conversations]]
id                = "dan_note"
app               = "messages"
npc               = "npc_dan"
repeat_after_days = 1
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "started", operator = "is_true" } ] }
[[phone.conversations.blocks]]
type    = "message"
sender  = "npc"
content = "Thinking of you."

[[phone.conversations]]
id  = "sal_hello"
app = "messages"
npc = "npc_sal"
[phone.conversations.trigger]
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "started", operator = "is_true" } ] }
[[phone.conversations.blocks]]
type    = "message"
sender  = "npc"
content = "Hey you."
[[phone.conversations.blocks]]
type    = "reply"
choices = [ { text = "Hey." } ]

[[locations]]
id               = "loc_home"
name             = "Home"
description      = "Her room."
navigation_order = ["loc_bar"]

[[locations]]
id          = "loc_bar"
name        = "Bar"
description = "The bar."
entry_from  = "loc_home"

# ── start ────────────────────────────────────────────────────────────────────

[[canvases]]
id   = "scene_start"
name = "Start"

[[canvases.nodes]]
id     = "intro"
name   = "Intro"
blocks = [ { type = "paragraph", content = "Fixture start." } ]
exit_block = { type = "location", text = "Go home", config = { destinationType = "specific", locationId = "loc_home", time_progression_minutes = 0, flagEffects = [ { targetType = "player", flag = "started" } ] } }

# ── E2: pools that remember ──────────────────────────────────────────────────

[[canvases]]
id   = "pool_room"
name = "Pool room"

[canvases.trigger]
location      = "loc_home"
is_repeatable = true
is_active     = true

[[canvases.nodes]]
id   = "look"
name = "Look"
blocks = [
  { type = "block_pool", props = { id = "home_pool", memory = "seen", blocks = [
      { type = "paragraph", content = "REMEMBERED_A" },
      { type = "paragraph", content = "REMEMBERED_B" },
      { type = "paragraph", content = "REMEMBERED_C" } ] } },
  { type = "block_pool", props = { blocks = [
      { type = "paragraph", content = "PLAIN_A" },
      { type = "paragraph", content = "PLAIN_B" },
      { type = "paragraph", content = "PLAIN_C" } ] } },
]
exit_block = { type = "location", text = "Back", config = { destinationType = "specific", locationId = "loc_home", time_progression_minutes = 0 } }

[[canvases]]
id   = "pool_hashed"
name = "Hashed pool"

[canvases.trigger]
location      = "loc_home"
is_repeatable = true
is_active     = true

[[canvases.nodes]]
id   = "look"
name = "Look"
blocks = [
  { type = "block_pool", props = { memory = "seen", seen_weight = 0.25, blocks = [
      { type = "paragraph", content = "HASHED_A" },
      { type = "paragraph", content = "HASHED_B" } ] } },
]
exit_block = { type = "location", text = "Back", config = { destinationType = "specific", locationId = "loc_home", time_progression_minutes = 0 } }

[[canvases]]
id   = "random_seen"
name = "A face at the bar"

[canvases.trigger]
location      = "loc_bar"
is_repeatable = true
is_active     = true
trigger_mode  = "random"
chance        = 1.0
seen_weight   = 0.5

[[canvases.nodes]]
id     = "meet"
name   = "Meet"
blocks = [ { type = "paragraph", content = "Someone you know." } ]
exit_block = { type = "location", text = "Back", config = { destinationType = "specific", locationId = "loc_bar", time_progression_minutes = 0 } }

[[canvases]]
id   = "random_plain"
name = "A stranger at the bar"

[canvases.trigger]
location      = "loc_bar"
is_repeatable = true
is_active     = true
trigger_mode  = "random"
chance        = 1.0

[[canvases.nodes]]
id     = "meet"
name   = "Meet"
blocks = [ { type = "paragraph", content = "Someone new." } ]
exit_block = { type = "location", text = "Back", config = { destinationType = "specific", locationId = "loc_bar", time_progression_minutes = 0 } }

# ── E4: weekday and hours since a flag ───────────────────────────────────────

[[canvases]]
id   = "sat_only"
name = "Saturday crowd"

[canvases.trigger]
location      = "loc_bar"
is_repeatable = true
is_active     = true
conditions    = { version = "1.0", items = [ { type = "weekday", weekdays = [5] } ] }

[[canvases.nodes]]
id     = "crowd"
name   = "Crowd"
blocks = [ { type = "paragraph", content = "The Saturday crowd." } ]
exit_block = { type = "location", text = "Back", config = { destinationType = "specific", locationId = "loc_bar", time_progression_minutes = 0 } }

[[canvases]]
id   = "meet_dan"
name = "Meet Dan"

[canvases.trigger]
location      = "loc_home"
is_repeatable = true
is_active     = true

[[canvases.nodes]]
id     = "hello"
name   = "Hello"
blocks = [ { type = "paragraph", content = "Dan at the door." } ]
exit_block = { type = "location", text = "Back", config = { destinationType = "specific", locationId = "loc_home", time_progression_minutes = 0, flagEffects = [ { targetType = "player", flag = "met_dan" } ] } }

[[canvases]]
id   = "after_dan"
name = "After Dan"

[canvases.trigger]
location      = "loc_home"
is_repeatable = true
is_active     = true
conditions    = { version = "1.0", items = [
  { type = "hours_since_flag", subject = "player", flag_key = "met_dan", operator = "gte", value = 3 } ] }

[[canvases.nodes]]
id     = "later"
name   = "Later"
blocks = [ { type = "paragraph", content = "Three hours on." } ]
exit_block = { type = "location", text = "Back", config = { destinationType = "specific", locationId = "loc_home", time_progression_minutes = 0 } }

[[quest_cards]]
id       = "card_wait"
text     = "Dan said he would call."
priority = 1
when     = [ { flag = "started", op = "is_true" } ]
goals    = [
  { hours_since_flag = "met_dan", op = "gte", value = 3, label = "Let three hours pass" },
  { weekday = [5], label = "Wait for Saturday" } ]
