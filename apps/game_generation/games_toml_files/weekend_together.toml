schema_version = "0.2"

# ===== STORY ARC - Narrative Journal System =====

[story_arc]
version = "1.0"

# Chapters - narrative framing for the journal
[[story_arc.chapters]]
id = "chapter_1"
name = "Saturday Morning"
mood = "hopeful"
description = "A lazy Saturday unfolds with possibilities..."
order = 1

[[story_arc.chapters]]
id = "chapter_2"
name = "Growing Closer"
mood = "romantic"
description = "Something beautiful is building between you..."
order = 2

[[story_arc.chapters]]
id = "chapter_3"
name = "Passion Ignites"
mood = "passionate"
description = "The spark has caught fire..."
order = 3

[[story_arc.chapters]]
id = "chapter_4"
name = "Rekindled"
mood = "romantic"
description = "Your love story begins anew..."
order = 4

# Story Nodes - key moments in the narrative
[[story_arc.nodes]]
id = "awakening"
name = "A New Beginning"
chapter = "chapter_1"
journal_entry = "I woke up this Saturday with a quiet determination. No more distractions. Today, Elena comes first."
linked_canvas = "intro"
npc = "elena"
is_milestone = true

[[story_arc.nodes]]
id = "morning_bedroom"
name = "Lazy Morning"
chapter = "chapter_1"
journal_entry = "We lingered in the bedroom, rediscovering the simple pleasure of each other's company."
linked_canvas = "bedroom_morning"
npc = "elena"
group = "morning_together"

[[story_arc.nodes]]
id = "morning_coffee"
name = "Coffee and Connection"
chapter = "chapter_1"
journal_entry = "The kitchen filled with the aroma of coffee and the warmth of her smile."
linked_canvas = "kitchen_coffee"
npc = "elena"
group = "morning_together"

[[story_arc.nodes]]
id = "tender_awakening"
name = "A Tender Awakening"
chapter = "chapter_2"
journal_entry = "Something shifted between us today. A door opened that I didn't realize was closed. Her kiss held a promise."
linked_canvas = "morning_connection_event"
npc = "elena"
requires_group = "morning_together"
is_milestone = true

[[story_arc.nodes]]
id = "cooking_together"
name = "Cooking Together"
chapter = "chapter_2"
journal_entry = "We moved around the kitchen like we used to, our bodies remembering their familiar dance."
linked_canvas = "kitchen_afternoon"
npc = "elena"
group = "afternoon_moments"

[[story_arc.nodes]]
id = "heat_in_kitchen"
name = "Heat in the Kitchen"
chapter = "chapter_3"
journal_entry = "The wooden table will never look the same. Neither will she. We've rediscovered something primal and beautiful."
linked_canvas = "kitchen_escalation_event"
linked_flag = "first_escalation"
npc = "elena"
requires_nodes = ["tender_awakening"]
is_milestone = true

[[story_arc.nodes]]
id = "evening_together"
name = "Evening Relaxation"
chapter = "chapter_3"
journal_entry = "Curled up together on the couch, the day's passion still humming between us."
linked_canvas = "living_room_relax"
npc = "elena"
group = "evening_moments"

[[story_arc.nodes]]
id = "evening_heat"
name = "Evening Heat"
chapter = "chapter_3"
journal_entry = "She stood by the window, bathed in sunset. What followed was everything I'd been longing for."
linked_canvas = "living_room_heated"
linked_flag = "living_tension"
npc = "elena"
requires_nodes = ["heat_in_kitchen"]
is_milestone = true

[[story_arc.nodes]]
id = "rekindled"
name = "Together Again"
chapter = "chapter_4"
journal_entry = "In our bedroom, wrapped in her arms, I finally understood. This weekend wasn't about one day—it was about finding our way back to each other. I promised her more weekends like this. I intend to keep that promise."
linked_canvas = "bedroom_finale"
linked_flag = "passion_rekindled"
npc = "elena"
requires_nodes = ["evening_heat"]
is_milestone = true

# Groups - parallel activities that can be done in any order
[[story_arc.groups]]
id = "morning_together"
name = "Morning Together"
description = "Spend quality time together in the morning"
required_count = 1

[[story_arc.groups]]
id = "afternoon_moments"
name = "Afternoon Moments"
description = "Share the afternoon together"
required_count = 1

[[story_arc.groups]]
id = "evening_moments"
name = "Evening Together"
description = "Wind down together"
required_count = 1

# Emotion mappings - how Elena's traits display in the journal
[story_arc.emotion_mappings.affection]
trait_owner = "npc"
default_npc = "elena"
ranges = [
  { min = 0, max = 30, label = "reserved", description = "Elena seems a bit distant, waiting for you to reach out" },
  { min = 31, max = 50, label = "warming", description = "Elena's eyes hold a hopeful warmth when she looks at you" },
  { min = 51, max = 70, label = "connected", description = "Elena stays close to you, her touch lingering" },
  { min = 71, max = 90, label = "devoted", description = "Elena's love for you shines in every glance" },
  { min = 91, max = 100, label = "complete", description = "Elena is utterly, blissfully yours" }
]

[story_arc.emotion_mappings.arousal]
trait_owner = "npc"
default_npc = "elena"
ranges = [
  { min = 0, max = 15, label = "calm", description = "Elena is relaxed and at ease" },
  { min = 16, max = 35, label = "stirring", description = "There's a hint of desire in the way she looks at you" },
  { min = 36, max = 60, label = "wanting", description = "Elena's breath quickens when you're near" },
  { min = 61, max = 85, label = "burning", description = "Elena can barely contain her desire for you" },
  { min = 86, max = 100, label = "consumed", description = "Elena's passion has completely taken over" }
]

[story_arc.emotion_mappings.appreciation]
trait_owner = "npc"
default_npc = "elena"
ranges = [
  { min = 0, max = 25, label = "uncertain", description = "Elena isn't sure what to expect from you" },
  { min = 26, max = 50, label = "noticed", description = "Elena appreciates your attention today" },
  { min = 51, max = 75, label = "treasured", description = "Elena feels valued and cared for" },
  { min = 76, max = 100, label = "cherished", description = "Elena knows she's the center of your world" }
]

# Narrative hints for the journal
[story_arc.hints]
group_incomplete = "There might be more moments to discover this {group_name}..."
progress_needed = "Perhaps spending more time together would reveal new possibilities..."
story_complete = "Your weekend together has rekindled everything. This is just the beginning of your renewed journey."

[project]
id = "weekend_together"
title = "Weekend Together"
description = """
A lazy Saturday unfolds as you and Elena reconnect after weeks of busy schedules.
What starts as a quiet morning together gradually builds into something more...
Rediscover the spark that brought you together in this intimate domestic romance.
"""

[time]
enabled = true
starting_hour = 8
starting_day = "Saturday"
starting_week = 1

[player]
id = "player"
name = "Michael"
description = "A dedicated professional who's been working long hours. This weekend, you're committed to being fully present with Elena."
core_traits = { energy = 30, attentiveness = 40, boldness = 25, intimacy_level = 20 }
flag_keys = ["game_started", "morning_connection", "helped_kitchen", "romantic_gesture", "first_escalation", "kitchen_passion", "living_tension", "passion_rekindled"]

[[npcs]]
id = "elena"
name = "Elena"
description = "Your loving partner. She's been feeling a bit neglected lately but is eager to reconnect. Her warm smile and knowing glances hint at desires unspoken."
core_traits = { affection = 40, arousal = 10, appreciation = 30 }
flag_keys = ["comfortable", "interested", "vulnerable", "fully_aroused"]

# ===== LOCATIONS =====

[[locations]]
id = "living_room"
name = "Living Room"
description = "The heart of your home. Soft morning light filters through sheer curtains, illuminating the comfortable couch and the large wall clock that marks the passing hours."
is_container = false
parent = ""
entry_from = ""
default_entry = ""
navigation_order = ["bedroom", "kitchen"]

[[locations]]
id = "bedroom"
name = "Master Bedroom"
description = "Your private sanctuary. Soft sheets, warm lighting from the bedside lamp, and the faint scent of Elena's perfume lingering in the air."
is_container = false
parent = ""
entry_from = "living_room"
default_entry = ""
navigation_order = []

[[locations]]
id = "kitchen"
name = "Kitchen"
description = "A modern, sunlit space with blue cabinets, a sturdy wooden table, and the aroma of fresh coffee. The heart of domestic life."
is_container = false
parent = ""
entry_from = "living_room"
default_entry = ""
navigation_order = []

# ===== CANVASES =====

starting_canvas = "intro"

# ========================================
# INTRO - Game Start
# ========================================

[[canvases]]
id = "intro"
name = "Saturday Morning"
description = "A new day begins with possibilities"

  [[canvases.nodes]]
  id = "n1"
  name = "Awakening"
  blocks = [
    { type = "heading", content = "Saturday Morning" },
    { type = "paragraph", content = "Sunlight filters through the bedroom curtains, warm against your face. It's Saturday—finally. No alarms, no meetings, no deadlines. Just you and Elena." },
    { type = "paragraph", content = "You stretch slowly, becoming aware of the empty space beside you. The sheets are still warm. From somewhere in the apartment, you hear the soft sounds of movement." },
    { type = "paragraph", content = "It's been weeks since you've had a real weekend together. Work has consumed everything. But today... today is different." }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Get up and find her", targetType = "node", nodeId = "intro.n2", time_progression_minutes = 5, effects = [{ targetType = "player", trait = "energy", op = "add", value = 5 }], flagEffects = [{ targetType = "player", flag = "game_started" }] }
  ] }

  [[canvases.nodes]]
  id = "n2"
  name = "First Glimpse"
  blocks = [
    { type = "paragraph", content = "You pad quietly through the living room, following the sounds. Through the kitchen doorway, you catch sight of her." },
    { type = "paragraph", content = "Elena stands at the counter in that soft pink dress you love, her hair still slightly tousled from sleep. She's reaching for something in the cabinet, unaware of your presence." },
    { type = "paragraph", content = "Something stirs in your chest. When did you last really look at her? When did you last just... be present?" },
    { type = "dialog", content = "Morning, sleepyhead.", props = { speaker = "npc", npcName = "Elena" } },
    { type = "paragraph", content = "She's spotted you. Her smile is warm, but there's something in her eyes—a question, perhaps. A hope." }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Cross the room and kiss her good morning", targetType = "node", nodeId = "intro.n3", time_progression_minutes = 2, effects = [{ targetType = "npc", npcId = "elena", trait = "affection", op = "add", value = 8 }, { targetType = "npc", npcId = "elena", trait = "appreciation", op = "add", value = 5 }] },
    { text = "Smile warmly and ask about her plans", targetType = "node", nodeId = "intro.n3", time_progression_minutes = 2, effects = [{ targetType = "npc", npcId = "elena", trait = "appreciation", op = "add", value = 6 }] }
  ] }

  [[canvases.nodes]]
  id = "n3"
  name = "A New Beginning"
  blocks = [
    { type = "paragraph", content = "Her eyes light up at your attention. It's such a simple thing, but you can see how much it means to her." },
    { type = "dialog", content = "I was thinking... maybe we could actually spend today together? Like we used to?", props = { speaker = "npc", npcName = "Elena" } },
    { type = "paragraph", content = "There's vulnerability in her voice. She's asking for something you should have offered weeks ago." },
    { type = "dialog", content = "I'd like that. I'd like that a lot.", props = { speaker = "player" } },
    { type = "paragraph", content = "Her smile widens, genuine now. The day stretches ahead of you, full of possibility." }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Explore the apartment together", targetType = "location", locationId = "living_room", time_progression_minutes = 5, effects = [{ targetType = "npc", npcId = "elena", trait = "affection", op = "add", value = 5 }] }
  ] }

# ========================================
# BEDROOM - Morning Activities
# ========================================

[[canvases]]
id = "bedroom_morning"
name = "Morning in the Bedroom"
description = "The bedroom holds memories and possibilities"

  [canvases.trigger]
  location = "bedroom"
  is_active = true
  is_repeatable = true
  max_triggers_per_day = 5
  [[canvases.trigger.schedules]]
  start_time = "08:00"
  end_time = "12:00"

  [[canvases.nodes]]
  id = "b1"
  name = "Bedroom Scene"
  blocks = [
    { type = "paragraph", content = "The bedroom is bathed in soft morning light. The rumpled sheets still hold the warmth of sleep, and Elena's makeup brushes are scattered on the vanity." },
    { type = "paragraph", content = "She followed you in, perhaps sensing your mood. She sits on the edge of the bed, watching you with curious eyes." },
    { type = "dialog", content = "Remember when we used to spend whole mornings in here?", props = { speaker = "npc", npcName = "Elena" } }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Sit beside her and take her hand", targetType = "node", nodeId = "bedroom_morning.b2", time_progression_minutes = 10, effects = [{ targetType = "npc", npcId = "elena", trait = "affection", op = "add", value = 6 }, { targetType = "npc", npcId = "elena", trait = "appreciation", op = "add", value = 4 }] },
    { text = "Lie back on the bed and invite her to join you", targetType = "node", nodeId = "bedroom_morning.b3", time_progression_minutes = 15, effects = [{ targetType = "npc", npcId = "elena", trait = "affection", op = "add", value = 5 }, { targetType = "npc", npcId = "elena", trait = "arousal", op = "add", value = 3 }], conditions = { version = "1.0", logic = "AND", items = [{ type = "trait", subject = "npc", npc_id = "elena", trait_key = "affection", operator = "gte", value = 45 }] } },
    { text = "Just enjoy the peaceful moment", targetType = "location", locationId = "bedroom", time_progression_minutes = 5, effects = [{ targetType = "player", trait = "energy", op = "add", value = 3 }] }
  ] }

  [[canvases.nodes]]
  id = "b2"
  name = "Hand in Hand"
  blocks = [
    { type = "paragraph", content = "You settle beside her, your fingers intertwining with hers. It's such a simple gesture, but she squeezes back like she's been waiting for this." },
    { type = "dialog", content = "I've missed this. Just... being with you.", props = { speaker = "npc", npcName = "Elena" } },
    { type = "paragraph", content = "She leans her head against your shoulder, and for a moment, everything else fades away. There's just her warmth, her presence, the steady rhythm of her breathing." }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Stay a while longer", targetType = "location", locationId = "bedroom", time_progression_minutes = 15, effects = [{ targetType = "npc", npcId = "elena", trait = "appreciation", op = "add", value = 5 }] }
  ] }

  [[canvases.nodes]]
  id = "b3"
  name = "Lazy Morning"
  blocks = [
    { type = "paragraph", content = "You stretch out on the familiar sheets, patting the space beside you. Elena's eyes sparkle with something between amusement and longing." },
    { type = "dialog", content = "Are you trying to tempt me back to bed?", props = { speaker = "npc", npcName = "Elena" } },
    { type = "paragraph", content = "She kicks off her shoes and crawls across the mattress toward you, her dress riding up slightly. The morning light catches the curve of her smile." },
    { type = "clip", props = { clipId = "fcc54507-771a-42e4-a5a2-453ce924328c" } },
    { type = "paragraph", content = "Time seems to slow as she settles against you, her body warm and inviting. Your hands find their familiar paths, relearning territory you'd almost forgotten." }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Continue exploring this connection", targetType = "location", locationId = "bedroom", time_progression_minutes = 20, effects = [{ targetType = "npc", npcId = "elena", trait = "arousal", op = "add", value = 8 }, { targetType = "npc", npcId = "elena", trait = "affection", op = "add", value = 5 }] }
  ] }

# ========================================
# MORNING CONNECTION - Story Milestone
# ========================================

[[canvases]]
id = "morning_connection_event"
name = "A Tender Awakening"
description = "The moment everything begins to change"

  [canvases.trigger]
  location = "bedroom"
  is_active = true
  is_repeatable = false
  [canvases.trigger.conditions]
  version = "1.0"
  logic = "AND"
  items = [
    { type = "trait", subject = "npc", npc_id = "elena", trait_key = "affection", operator = "gte", value = 50 },
    { type = "flag", subject = "player", flag_key = "game_started", operator = "is_true" }
  ]
  [[canvases.trigger.schedules]]
  start_time = "08:00"
  end_time = "11:00"

  [[canvases.nodes]]
  id = "mc1"
  name = "Something Different"
  blocks = [
    { type = "heading", content = "A Tender Awakening" },
    { type = "paragraph", content = "You find her at the vanity, brush in hand, applying her makeup with practiced strokes. Morning light halos her silhouette." },
    { type = "paragraph", content = "She catches your reflection in the mirror and pauses, brush hovering near her cheek. There's something different in her eyes today—a warmth, a wanting." },
    { type = "clip", props = { clipId = "42c1f739-89df-4196-874a-d57850d72817" } },
    { type = "paragraph", content = "Without words, you cross to the bed, still warm from sleep. She sets down her brush and turns to you, her expression softening." },
    { type = "dialog", content = "I was hoping you'd wake up...", props = { speaker = "npc", npcName = "Elena" } }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Pull her into your arms", targetType = "node", nodeId = "morning_connection_event.mc2", time_progression_minutes = 5, effects = [{ targetType = "npc", npcId = "elena", trait = "affection", op = "add", value = 10 }, { targetType = "npc", npcId = "elena", trait = "arousal", op = "add", value = 8 }], flagEffects = [{ targetType = "player", flag = "morning_connection" }] },
    { text = "Reach for her hand gently", targetType = "node", nodeId = "morning_connection_event.mc2", time_progression_minutes = 5, effects = [{ targetType = "npc", npcId = "elena", trait = "appreciation", op = "add", value = 12 }], flagEffects = [{ targetType = "player", flag = "morning_connection" }] }
  ] }

  [[canvases.nodes]]
  id = "mc2"
  name = "Connection Deepens"
  blocks = [
    { type = "paragraph", content = "She melts into your embrace, her body remembering yours. The makeup can wait. Everything can wait." },
    { type = "dialog", content = "I've been missing you. Even when you're here, sometimes... you're not really here.", props = { speaker = "npc", npcName = "Elena" } },
    { type = "dialog", content = "I know. I'm sorry. I want to change that.", props = { speaker = "player" } },
    { type = "paragraph", content = "Her eyes glisten. She kisses you softly—a promise, a beginning." },
    { type = "paragraph", content = "Something has shifted between you. A door has opened that you didn't realize was closed." }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Continue your day together, closer than before", targetType = "location", locationId = "living_room", time_progression_minutes = 10, effects = [{ targetType = "npc", npcId = "elena", trait = "affection", op = "add", value = 5 }] }
  ] }

# ========================================
# KITCHEN - Base Activities
