  [[canvases.nodes]]
  id = "ka1"
  name = "Afternoon Kitchen"
  blocks = [
    { type = "paragraph", content = "The afternoon sun fills the kitchen with golden light. Elena is prepping ingredients at the counter, her movements graceful and practiced." },
    { type = "dialog", content = "I thought I'd make something special for dinner. Want to help?", props = { speaker = "npc", npcName = "Elena" } }
  ]
  exit_block = { type = "choices", choices = [
