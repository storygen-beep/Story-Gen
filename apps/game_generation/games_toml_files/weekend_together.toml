  start_time = "08:00"
  end_time = "14:00"

  [[canvases.nodes]]
  id = "k1"
  name = "Kitchen Morning"
  blocks = [
    { type = "paragraph", content = "The kitchen smells of fresh coffee. Sunlight streams through the windows, illuminating the wooden table where you've shared countless meals." },
    { type = "paragraph", content = "Elena is at her laptop, perhaps checking emails or browsing something. She looks up as you enter, a small smile playing at her lips." },
    { type = "clip", props = { clipId = "c81c0814-1337-4aad-8143-3bb1316b8907" } }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Pour coffee for both of you", targetType = "node", nodeId = "kitchen_coffee.k2", time_progression_minutes = 10, effects = [{ targetType = "npc", npcId = "elena", trait = "appreciation", op = "add", value = 5 }, { targetType = "player", trait = "energy", op = "add", value = 5 }] },
    { text = "Come up behind her and kiss her neck", targetType = "node", nodeId = "kitchen_coffee.k3", time_progression_minutes = 5, effects = [{ targetType = "npc", npcId = "elena", trait = "affection", op = "add", value = 6 }, { targetType = "npc", npcId = "elena", trait = "arousal", op = "add", value = 4 }], conditions = { version = "1.0", logic = "AND", items = [{ type = "flag", subject = "player", flag_key = "morning_connection", operator = "is_true" }] } },
    { text = "Just grab a snack", targetType = "location", locationId = "kitchen", time_progression_minutes = 5, effects = [{ targetType = "player", trait = "energy", op = "add", value = 2 }] }
  ] }

  [[canvases.nodes]]
  id = "k2"
  name = "Coffee Together"
  blocks = [
    { type = "paragraph", content = "You set a steaming mug beside her laptop. She wraps her hands around it, inhaling the aroma with closed eyes." },
    { type = "dialog", content = "You remembered how I like it.", props = { speaker = "npc", npcName = "Elena" } },
    { type = "paragraph", content = "Of course you did. Some things you never forget." },
    { type = "dialog", content = "Thank you. It's nice to be... taken care of.", props = { speaker = "npc", npcName = "Elena" } }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Sit with her and chat", targetType = "location", locationId = "kitchen", time_progression_minutes = 15, effects = [{ targetType = "npc", npcId = "elena", trait = "affection", op = "add", value = 4 }] }
  ] }

  [[canvases.nodes]]
  id = "k3"
  name = "Surprise Kiss"
  blocks = [
    { type = "paragraph", content = "You slip behind her, your hands finding her shoulders. She tenses for just a moment—surprise—then melts back against you." },
    { type = "paragraph", content = "Your lips brush the curve of her neck, and you feel her shiver." },
    { type = "clip", props = { clipId = "30d853f9-8ef8-4c16-85e3-cac133a19337" } },
    { type = "dialog", content = "Mmm... what's gotten into you this morning?", props = { speaker = "npc", npcName = "Elena" } },
    { type = "paragraph", content = "She turns in your arms, her eyes dancing with pleasant surprise and growing warmth." }
  ]
  exit_block = { type = "choices", choices = [
    { text = "Tell her you've missed being close", targetType = "location", locationId = "kitchen", time_progression_minutes = 10, effects = [{ targetType = "npc", npcId = "elena", trait = "affection", op = "add", value = 8 }], flagEffects = [{ targetType = "player", flag = "helped_kitchen" }] }
  ] }

# ========================================
# KITCHEN - Afternoon Cooking (Layers)
# ========================================

[[canvases]]
id = "kitchen_afternoon"
