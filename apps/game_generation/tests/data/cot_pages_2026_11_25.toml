# ═══════════════════════════════════════════════════════════════════════════════
#  ENGINE FIXTURE — the Quests page as CoT's Hints page, the People page as CoT's
#  People dialog (2026-11-25). Media-free. Read by test_cot_hints.py and
#  test_cot_people.py.
#
#  Hints ([ui] quests_layout = "hints"):
#    "The Job"     three steps: nothing set, the middle step (job_got), "end" (job_done);
#                  links the walkthrough job_wt.
#    "Free Time"   a single step that always passes: stays In Progress (CoT's rule).
#    "The Quad"    shown once `started`; its only step needs quad_seen: "Keep exploring!".
#    "Hidden"      shown only behind never_set: never listed.
#  Walkthrough job_wt: a guard on `started`, a day count, a done/to-do step, an idea.
#
#  People ([ui] people_page = "cot"):
#    tom    friends tab, met by met_tom, at the bar all day, with a Talk row (tom_chat).
#    zed    friends tab, met by met_zed, at home all day: a stranger until then.
#    mom    special tab, met once `started`, at home all day.
#    x01-x17 acquaintances, no quest card (so known), at home all day: 19 people at home (Zed, Mom, 17),
#           two pages of 16.
# ═══════════════════════════════════════════════════════════════════════════════

schema_version  = "0.2"
starting_canvas = "scene_start"

[project]
id            = "engine_cot_pages"
title         = "Engine CoT Pages"
description   = "Engine fixture for the CoT Hints and People pages."
quests_engine = "v2"

[time]
enabled       = true
starting_hour = 18
starting_day  = "Monday"
starting_week = 1

[player]
id          = "player"
name        = "Mara"
description = "Fixture protagonist."
core_traits = { energy = 100, money = 40 }
flag_keys   = ["started", "met_tom", "met_zed", "job_got", "job_done", "quad_seen", "never_set"]

[ui]
quests_layout = "hints"
people_page   = "cot"

[ui.cast_page]
title       = "People"
show_traits = ["want", "warmth"]

# ── hints ────────────────────────────────────────────────────────────────────

[[story_hints]]
title       = "The Job"
category    = "Employment 💼"
description = "The bar is hiring."
walkthrough = "job_wt"
hints = [
  { when = [], text = "Go to the bar and ask for work." },
  { when = [ { flag = "job_got", op = "is_true" } ], text = "Work the shifts." },
  { when = [ { flag = "job_done", op = "is_true" } ], text = "end" },
]

[[story_hints]]
title       = "Free Time"
category    = "Campus Life 🏫"
description = "Something to do."
hints       = [ { when = [], text = "Visit the park." } ]

[[story_hints]]
title       = "The Quad"
category    = "Storyline 📖"
description = "A party on Fridays."
when        = [ { flag = "started", op = "is_true" } ]
hints       = [ { when = [ { flag = "quad_seen", op = "is_true" } ], text = "Go to the quad." } ]

[[story_hints]]
title       = "Hidden"
category    = "Storyline 📖"
description = "Never listed."
when        = [ { flag = "never_set", op = "is_true" } ]
hints       = [ { when = [], text = "Unseen." } ]

[[walkthroughs]]
id       = "job_wt"
title    = "The Job"
overview = "The bar needs a hand. It will take at least {days_until:5}."
guard    = { when = [ { flag = "started", op = "is_true" } ], text = "You haven't met them yet." }
steps = [
  { when = [ { flag = "job_got", op = "is_true" } ], done_text = "You got the job.", todo_text = "Ask at the bar." },
  { kind = "idea", text = "Wear something nice." },
  { when = [ { flag = "job_done", op = "is_true" } ], done_text = "Three shifts worked.", todo_text = "Work three shifts." },
]

