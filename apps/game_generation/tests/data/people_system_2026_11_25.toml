# ═══════════════════════════════════════════════════════════════════════════════
#  ENGINE FIXTURE — CoT's people system, [engine.people] system = "cot" (2026-11-25).
#  Media-free. Read by test_people_system.py.
#
#  People (all at home all day, each a different fixed make-up):
#    ben   male, attracted, Shy + Nerd (personality) + Groper (sex): reveal, "date".
#    cal   male, attracted, Forward (active, casual sex): "fuckbuddy", "hatefuck".
#    dee   female, attracted, Chaste: tipping point 300 + 100 + 800.
#    eve   female, attracted, Slut: tipping point 300 + 100 - 200.
#    fay   female, attracted, Dominant.
#    gus   male, NOT attracted: a lust gain is dropped.
#    holt  male professor (Faculty tab), attracted: intimacy 0 / 1 / 2.
#    ian   male, attracted, Sadist, hand-set want = "rival".
#    old   male, attracted, 50: friendly and lusting, a "friend", never a "date".
#    liz   female, attracted, Gossip (the game's own trait); starts 300 / -250 / -150.
#  Her skills: exhibitionism (0) and charm (250, level 2).
#  ben_chat: a Talk row whose choices carry the effects, gates and conditions.
# ═══════════════════════════════════════════════════════════════════════════════

schema_version  = "0.2"
starting_canvas = "scene_start"

[project]
id            = "engine_people_system"
title         = "Engine People System"
description   = "Engine fixture for CoT's people system."
quests_engine = "v2"

[time]
enabled       = true
starting_hour = 10
starting_day  = "Monday"
starting_week = 1

[player]
id          = "player"
name        = "Mara"
description = "Fixture protagonist."
core_traits = { energy = 100, exhibitionism = 0, charm = 250 }
flag_keys   = ["started", "sex_partner_ben", "sex_partner_holt", "sex_partner_dee"]

[engine.people]
system = "cot"

[engine.people.traits.Gossip]
kind        = "personality"
threshold   = 150
emoji       = "🗣️"
description = "Nothing she hears stays with her."

[[traits.labels]]
key   = "exhibitionism"
label = "Exhibitionism"
skill = true

[[traits.labels]]
key   = "charm"
label = "Charm"
skill = true

[ui]
people_page = "cot"

[ui.cast_page]
title = "People"

