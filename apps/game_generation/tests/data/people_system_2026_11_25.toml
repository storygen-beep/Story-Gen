# ── canvases ─────────────────────────────────────────────────────────────────

[[canvases]]
id   = "scene_start"
name = "Start"

[[canvases.nodes]]
id     = "intro"
name   = "Intro"
blocks = [ { type = "paragraph", content = "Fixture start." } ]
exit_block = { type = "location", text = "Go home", config = { destinationType = "specific", locationId = "loc_home", time_progression_minutes = 0, flagEffects = [ { targetType = "player", flag = "started" } ] } }

[[canvases]]
id   = "ben_chat"
name = "A word with Ben"

[canvases.trigger]
location      = "loc_home"
npc           = "ben"
is_repeatable = true
is_active     = true

[[canvases.nodes]]
id   = "talk"
name = "Talk"
blocks = [
  { type = "paragraph", content = "Ben looks up." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [ { type = "npc_wants", npc_id = "ben", any_of = ["fuckbuddy", "date"] } ] } }, blocks = [
    { type = "paragraph", content = "He wants you in his bed." },
  ] },
  { type = "paragraph", content = "He waits." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [ { type = "npc_has_trait", npc_id = "ben", trait = "Shy" } ] } }, blocks = [
    { type = "paragraph", content = "He goes red." },
  ] },
  { type = "paragraph", content = "He shifts." },
  { type = "group", props = { conditions = { version = "1.0", logic = "AND", items = [ { type = "npc_has_trait", npc_id = "ben", set = "active" } ] } }, blocks = [
    { type = "paragraph", content = "He takes charge." },
  ] },
]

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "Flirt."
targetType = "location"
locationId = "loc_home"
effects    = [
  { targetType = "npc", npcId = "ben", trait = "lust", op = "add", value = 50 },
  { targetType = "npc", npcId = "gus", trait = "lust", op = "add", value = 50 },
  { targetType = "npc", npcId = "gus", trait = "friendship", op = "add", value = 25 },
]

[[canvases.nodes.exit_block.choices]]
text       = "Insult him."
targetType = "location"
locationId = "loc_home"
effects    = [ { targetType = "npc", npcId = "ben", trait = "friendship", op = "add", value = -2500 } ]

[[canvases.nodes.exit_block.choices]]
text       = "Say nothing."
targetType = "location"
locationId = "loc_home"

[[canvases.nodes.exit_block.choices]]
text       = "Stay after class."
targetType = "location"
locationId = "loc_home"
effects    = [ { targetType = "npc", npcId = "holt", trait = "intimacy", op = "add", value = 5 } ]

[[canvases.nodes.exit_block.choices]]
text       = "Undo a button."
targetType = "location"
locationId = "loc_home"
skill_gate = { skill = "exhibitionism", level = 1 }

[[canvases.nodes.exit_block.choices]]
text       = "Lift your top."
targetType = "location"
locationId = "loc_home"
skill_gate = { skill = "exhibitionism", level = 2 }

[[canvases.nodes.exit_block.choices]]
text             = "Strip."
targetType       = "location"
locationId       = "loc_home"
show_when_locked = true
skill_gate       = { skill = "exhibitionism", level = 3 }

[[canvases.nodes.exit_block.choices]]
text       = "Talk him round."
targetType = "location"
locationId = "loc_home"
skill_gate = { skill = "charm", level = 2 }

[[canvases.nodes.exit_block.choices]]
text       = "Ask what he wants."
targetType = "location"
locationId = "loc_home"
conditions = { version = "1.0", logic = "AND", items = [ { type = "npc_wants", npc_id = "ben", value = "indifferent", operator = "is_false" } ] }
