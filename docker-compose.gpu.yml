version: '3.8'

services:
  # vLLM server for JoyCaption - keeps model loaded in GPU memory
  joycaption:
    # vLLM v0.6.2 - has SigLIP support for JoyCaption
    # A10G (24GB) - full model fits in VRAM, no CPU offload needed
    image: vllm/vllm-openai:v0.6.2
    # Use host network for reliable HuggingFace connectivity
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "--model"
      - "fancyfeast/llama-joycaption-alpha-two-hf-llava"
      - "--max-model-len"
      - "4096"
      - "--trust-remote-code"
      - "--dtype"
      - "half"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--port"
      - "8001"
    shm_size: '4gb'
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - /opt/dlami/nvme/hf_cache:/root/.cache/huggingface
    # ports not needed with network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  web:
    # Request all GPUs with Compose v2
    gpus: all
    # Use host network to communicate with joycaption on localhost:8001
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
      - VLLM_CAPTIONING_ENABLED=true
      - VLLM_BASE_URL=http://127.0.0.1:8001/v1
    volumes:
      # Persist HuggingFace cache to avoid repeated downloads (using ephemeral NVMe disk)
      - /opt/dlami/nvme/hf_cache:/root/.cache/huggingface
      # Persist models directory used by JoyCaption2 (mounted from backend folder)
      - ./models:/app/models
    depends_on:
      joycaption:
        condition: service_healthy
