<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Find Media — Story-Gen</title>
  <link rel="stylesheet" href="portal.css">
  <style>
    .find-head { margin-bottom: 4px; }
    .find-head h1 { font-size: 1.5rem; }
    .find-sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
    .find-sub .mono { font-family: ui-monospace, Menlo, monospace; color: var(--accent); }

    .toolbar {
      display: flex; flex-direction: column; gap: 12px;
      padding: 14px; margin-bottom: 18px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    }
    .searchrow { display: flex; gap: 8px; }
    .searchrow input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 9px; padding: 11px 14px; color: var(--text); font-size: 0.95rem; outline: none;
    }
    .searchrow input:focus { border-color: var(--accent); }
    .go-btn {
      font-weight: 700; font-size: 0.9rem; border: none; border-radius: 9px;
      padding: 0 20px; cursor: pointer; background: var(--accent); color: var(--accent-text); white-space: nowrap;
    }
    .hint { color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
    .hint b { color: var(--text); }

    .opt-head {
      display: flex; align-items: center; gap: 10px; margin: 6px 0 12px;
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--accent); font-weight: 700;
    }
    .opt-count { color: var(--muted); font-weight: 600; letter-spacing: 0; text-transform: none; }
    .refresh-btn {
      margin-left: auto; font-size: 0.72rem; color: var(--muted); background: var(--surface);
      border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer;
      text-transform: none; letter-spacing: 0;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--accent); }

    .find-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px; margin-top: 4px;
    }
    .tile {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
    }
    .tile-media {
      width: 100%; aspect-ratio: 4 / 3; background: #0b0c10; object-fit: cover;
      display: block; cursor: zoom-in;
    }
    .tile-media.broken { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.72rem; }
    .tile-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
    .tile-meta { font-size: 0.68rem; color: var(--muted); line-height: 1.4; word-break: break-all; }
    .type-badge {
      display: inline-block; font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
      color: var(--accent-text); background: var(--accent); border-radius: 4px; padding: 1px 6px;
    }
    .type-badge.vid { background: #7a9ec8; }
    .tile-actions { display: flex; gap: 6px; }
    .use-btn, .rm-btn {
      font-size: 0.78rem; font-weight: 700; border: 1px solid var(--border);
      border-radius: 7px; padding: 7px; cursor: pointer; background: var(--surface-hover); color: var(--text);
    }
    .use-btn { flex: 1; }
    .use-btn:hover { border-color: var(--accent); color: var(--accent); }
    .rm-btn { color: var(--muted); }
    .rm-btn:hover { border-color: #c2554e; color: #c2554e; }
    /* Unselect is the only action on a selected tile, so it takes the full row. */
    .rm-btn.wide { flex: 1; }
    /* Selected tiles are IN the game — mark them so the two zones never blur. */
    .sel-tile { border-color: #4ade8055; }
    .sel-tile .tile-media { border-bottom-color: #4ade8033; }
    .use-btn:disabled { opacity: 0.6; cursor: default; }
    .tile-status { font-size: 0.7rem; }
    .tile-status.ok { color: #5fae6e; }
    .tile-status.err { color: #c2554e; }

    .empty { color: var(--muted); font-size: 0.9rem; padding: 28px 4px; line-height: 1.6; }

    .more-row { display: flex; justify-content: center; padding: 18px 0 4px; }
    .more-btn {
      font-size: 0.82rem; font-weight: 600; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; padding: 9px 22px; cursor: pointer;
    }
    .more-btn:hover { border-color: var(--accent); color: var(--accent); }

    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 1000;
      display: flex; align-items: center; justify-content: center; cursor: zoom-out; padding: 24px;
    }
    .overlay img, .overlay video { max-width: 92vw; max-height: 92vh; border-radius: 8px; }

    .toast {
      position: fixed; bottom: 22px; right: 22px; z-index: 2000;
      padding: 11px 18px; border-radius: 9px; font-size: 0.85rem; font-weight: 600;
    }
    .toast.ok { background: #2f5d39; color: #d7f0dd; }
    .toast.err { background: #5d2f2f; color: #f0d7d7; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" id="back" href="index.html">← Back to review</a>
    <div class="find-head"><h1>Find media</h1></div>
    <div class="find-sub" id="sub"></div>

    <!-- SELECTED — pool slots only. These are the clips currently IN the folder,
         i.e. the ones the game cycles. Sits above the search box because it is the
         answer, not the search. Clicking one moves it back down into Options. -->
    <div id="selected-zone" hidden>
      <div class="opt-head">
        <span>Selected — plays in-game</span><span class="opt-count" id="sel-count"></span>
      </div>
      <div id="selected"></div>
    </div>

    <div class="toolbar">
      <div class="searchrow">
        <input id="q" type="text" placeholder="Search query…" autocomplete="off">
        <button class="go-btn" id="go">🔎 Search Google Images ↗</button>
      </div>
      <div class="hint">
        Opens Google Images in a new tab (the slot is passed along). Hover any result, click the
        blue capture button, pick a <b>type</b> — it lands in <b>Options</b> below. Then <b>Use this</b>
        downloads it into the game, replacing the current media.
      </div>
    </div>

    <div class="opt-head">
      <span>Options</span><span class="opt-count" id="count"></span>
      <button class="refresh-btn" id="refresh">↻ Refresh</button>
    </div>
    <div id="options"></div>
  </div>

  <script>
  (function () {
    var API = "http://localhost:8000";
    var P = new URLSearchParams(location.search);
    var GAME = P.get("id") || "";
    var FILE = P.get("file") || "";
    var QUERIES = (P.get("q") || "").split(" | ").map(function (s) { return s.trim(); }).filter(Boolean);
    // A POOL slot is a folder: every clip inside it plays, cycling one per visit.
    // `pool` carries the folder (same string as FILE, and the same key the options
    // store and the review ledger use — so nothing forks). Absent = single slot,
    // and this whole page behaves exactly as it always did.
    // The slot's stable identity — the key for its shelf and verdict. Defaults to
    // FILE, which is the declared path. They differ once a block authors an `id`:
    // FILE still says WHERE THE BYTES GO, KEY says WHICH SHELF this is.
    var KEY = P.get("slot_key") || FILE;
    var POOL = P.get("pool") || "";
    var POOL_TARGET = parseInt(P.get("target") || "0", 10) || 0;

    var backEl = document.getElementById("back");
    var subEl = document.getElementById("sub");
    var qEl = document.getElementById("q");
    var countEl = document.getElementById("count");
    var optionsEl = document.getElementById("options");
    var selZoneEl = document.getElementById("selected-zone");
    var selEl = document.getElementById("selected");
    var selCountEl = document.getElementById("sel-count");

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    backEl.href = "media.html?id=" + encodeURIComponent(GAME);
    document.title = (FILE || GAME) + " — Find media";
    qEl.value = QUERIES[0] || "";

    if (FILE) {
      subEl.appendChild(document.createTextNode("Filling slot "));
      subEl.appendChild(el("span", "mono", FILE));
      subEl.appendChild(document.createTextNode(" in " + (GAME || "—")));
    } else {
      subEl.textContent = "No target slot — open this from a review card.";
    }

    // ---- proxy preview (browser never hits the source domain directly) ----
    // A local option (a previously-installed pick, url "/games/…") is same-origin and
    // must NOT go through the proxy — the proxy's SSRF guard blocks loopback hosts.
    function proxied(u) {
      if (!u) return u;
      if (u.charAt(0) === "/") return API + u;
      var src = /redgifs\.com/i.test(u) ? "redgifs" : "";
      return API + "/api/v1/dev/media-finder/proxy?url=" + encodeURIComponent(u) + "&source=" + src;
    }

    // ---- Google Images launcher (hands the slot to the capture extension) ----
    document.getElementById("go").addEventListener("click", function () {
      var q = (qEl.value || "").trim();
      if (!q) { toast("Type a search query first", "err"); return; }
      var url = "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(q) +
        "&_tmc_game=" + encodeURIComponent(GAME) + "&_tmc_scene=" + encodeURIComponent(FILE);
      window.open(url, "_blank");
    });
    qEl.addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("go").click(); });
    document.getElementById("refresh").addEventListener("click", loadOptions);

    // ---- options list (polled; only rebuilds when the set changes) ----
    //
    // The grid is CAPPED. Every remote tile is a full download through the proxy,
    // which has no server-side cache — measured 0.81-1.96 s and 724 KB-2.16 MB per
    // tile, all queued behind the browser's six-connections-per-origin limit. The
    // deepest shelf here holds 430 options; rendering them all is ~300 MB and a page
    // that never settles.
    var PAGE = 60;
    // Never reset. KEY is fixed from the query string at load, so the slot cannot
    // change under us, and every forced re-render (`lastSig = null` after a Select or
    // Unselect) must keep whatever the user has already expanded to.
    var shown = PAGE;
    var lastOpts = [];
    var tileByUrl = {};          // url -> live tile, reused across re-renders
    var optionsGrid = el("div", "find-grid");
    var moreRow = null;

    // <video> has no `loading="lazy"`, so without this every video option fetches a
    // full remote file through the proxy the moment the page opens — ahead of the
    // image tiles the user can actually see. One-shot: once metadata is in, the
    // element is left alone.
    var videoPreloader = ("IntersectionObserver" in window) && new IntersectionObserver(
      function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.preload = "metadata";
          e.target.load();
          videoPreloader.unobserve(e.target);
        });
      }, { rootMargin: "200px" });

    var lastSig = null;
    function loadOptions() {
      fetch(API + "/api/v1/dev/media-finder/options/list?game=" +
        encodeURIComponent(GAME) + "&file=" + encodeURIComponent(KEY))
        .then(function (r) { return r.json(); })
        .then(function (j) { renderOptions(j.options || []); })
        .catch(function () {
          if (lastSig !== "__offline__") {
            lastSig = "__offline__";
            optionsEl.innerHTML = "";
            optionsEl.appendChild(el("p", "empty", "Server unreachable — is the dev server running?"));
          }
        });
    }

    function renderOptions(opts) {
      // `shown` belongs in the signature: without it "Show more" is a dead button
      // until the option set happens to change on its own — up to 3 s of nothing.
      var sig = shown + "|" + opts.map(function (o) { return o.url; }).join("|");
      if (sig === lastSig) return;  // unchanged — don't rebuild (avoids preview flicker)
      lastSig = sig;
      lastOpts = opts;

      if (!opts.length) {
        tileByUrl = {};
        optionsGrid.innerHTML = "";
        if (moreRow) { moreRow.remove(); moreRow = null; }
        countEl.textContent = "";
        optionsEl.innerHTML = "";
        optionsEl.appendChild(el("p", "empty",
          "No options yet. Click “Search Google Images”, then capture results with the extension — they appear here."));
        return;
      }

      var want = opts.slice(0, shown);
      countEl.textContent = want.length < opts.length
        ? "(showing " + want.length + " of " + opts.length + ")"
        : "(" + opts.length + ")";

      // Reconcile, don't rebuild. Re-parenting a live <img>/<video> with appendChild
      // MOVES the node without re-fetching it; wiping the grid would re-download
      // every visible tile through the uncached proxy on every single Select — at
      // shown=240 that is minutes of pointless traffic.
      var keep = {};
      want.forEach(function (opt) {
        keep[opt.url] = true;
        var tile = tileByUrl[opt.url];
        if (!tile) { tile = buildTile(opt); tileByUrl[opt.url] = tile; }
        optionsGrid.appendChild(tile);
      });
      Object.keys(tileByUrl).forEach(function (url) {
        if (keep[url]) return;
        tileByUrl[url].remove();
        delete tileByUrl[url];
      });

      // The offline branch empties optionsEl, which DETACHES the grid while tileByUrl
      // still holds every node. Without this re-attach the next successful poll would
      // render into a detached tree and the zone would stay blank forever — looking
      // exactly like "the server is still down".
      if (optionsGrid.parentNode !== optionsEl) {
        optionsEl.innerHTML = "";
        optionsEl.appendChild(optionsGrid);
      }
      renderMore(opts);
    }

    // Deliberately no "Show all": on the deepest shelf that is one click for ~300 MB
    // of proxied downloads and a hung tab.
    function renderMore(opts) {
      if (moreRow) { moreRow.remove(); moreRow = null; }
      var left = opts.length - shown;
      if (left <= 0) return;
      moreRow = el("div", "more-row");
      var btn = el("button", "more-btn",
        "Show " + Math.min(PAGE, left) + " more  ·  " + left + " remaining");
      btn.addEventListener("click", function () {
        shown += PAGE;
        renderOptions(lastOpts);
      });
      moreRow.appendChild(btn);
      optionsEl.appendChild(moreRow);
    }

    function buildTile(opt) {
      var isVideo = opt.media_kind === "video";
      var tile = el("div", "tile");

      var thumb = el(isVideo ? "video" : "img", "tile-media");
      thumb.src = proxied(opt.url);
      if (isVideo) {
        thumb.muted = true; thumb.loop = true; thumb.playsInline = true;
        // "none" until the tile is near the viewport — see videoPreloader. The <img>
        // tiles get that for free from loading="lazy"; <video> has no equivalent.
        thumb.preload = "none";
        if (videoPreloader) videoPreloader.observe(thumb);
        else thumb.preload = "metadata";
      }
      else { thumb.loading = "lazy"; thumb.referrerPolicy = "no-referrer"; }
      thumb.addEventListener("click", function () { preview(opt); });
      thumb.addEventListener("error", function () {
        var ph = el("div", "tile-media broken", isVideo ? "▶ video" : "no preview");
        ph.addEventListener("click", function () { preview(opt); });
        tile.replaceChild(ph, thumb);
      });
      tile.appendChild(thumb);

      var body = el("div", "tile-body");
      var meta = el("div", "tile-meta");
      meta.appendChild(el("span", "type-badge" + (isVideo ? " vid" : ""), opt.type || "image"));
      // A demoted former pick has no source domain — label it so it reads as an undo.
      meta.appendChild(document.createTextNode(
        " " + (opt.origin === "previous" ? "previous pick" : domainOf(opt.url))));
      body.appendChild(meta);

      var status = el("div", "tile-status");
      var row = el("div", "tile-actions");
      // A pool ADDS; a single slot REPLACES. Say which, so nobody clicks
      // "Use this" on a pool expecting the previous clip to be swapped out.
      var use = el("button", "use-btn", POOL ? "Select" : "Use this");
      if (!FILE) { use.disabled = true; use.title = "No target slot"; }
      use.addEventListener("click", function () { useOption(opt, use, status); });
      var rm = el("button", "rm-btn", "✕");
      rm.title = "Remove from options";
      rm.addEventListener("click", function () { removeOption(opt); });
      row.append(use, rm);
      body.append(row, status);
      tile.appendChild(body);
      return tile;
    }

    function domainOf(u) {
      try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
    }

    function useOption(opt, btn, statusEl) {
      btn.disabled = true;
      statusEl.className = "tile-status";
      statusEl.textContent = "saving…";
      var source = /redgifs\.com/i.test(opt.url) ? "redgifs" : "";
      fetch(API + "/api/v1/dev/media-finder/grab", {
        method: "POST",
        body: JSON.stringify({
          game: GAME, file: FILE, slot_key: KEY, url: opt.url,
          // Present => grab ADDS to the folder instead of replacing the slot,
          // and skips the same-stem delete that would eat a sibling clip.
          pool_dir: POOL,
          local_path: opt.local_path || "", source: source
        })
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok || !res.j.success) {
            statusEl.className = "tile-status err";
            statusEl.textContent = (res.j && res.j.error) ? res.j.error : "grab failed";
            btn.disabled = false;
            toast("Grab failed", "err");
            return;
          }
          statusEl.className = "tile-status ok";
          statusEl.textContent = "saved → " + res.j.file_path;
          btn.textContent = POOL ? "Selected ✓" : "Saved ✓";
          toast("Saved to " + res.j.file_path, "ok");
          // grab now clears the verdict and shelves the replaced file server-side;
          // reload so the demoted pick shows up as an option straight away.
          // For a pool, also refresh the SELECTED strip — the clip just moved up.
          lastSig = null;
          loadOptions();
          if (POOL) { lastSelSig = null; loadSelected(); }
        })
        .catch(function () {
          statusEl.className = "tile-status err";
          statusEl.textContent = "server unreachable";
          btn.disabled = false;
          toast("Server unreachable", "err");
        });
    }

    // ---- SELECTED zone (pool slots only) ----
    //
    // "Selected" is not a flag anywhere — it is literally "the file is in the
    // folder". So selecting is a grab INTO the folder and unselecting is a move
    // OUT of it, and there is no second source of truth to drift from the build.
    var lastSelSig = null;

    function loadSelected() {
      if (!POOL) return;
      fetch(API + "/api/v1/dev/media-finder/pool/list?game=" + encodeURIComponent(GAME)
            + "&dir=" + encodeURIComponent(POOL))
        .then(function (r) { return r.json(); })
        .then(function (j) { renderSelected(j.items || []); })
        .catch(function () { /* non-fatal: the options zone still works */ });
    }

    function renderSelected(items) {
      var sig = items.map(function (i) { return i.filename; }).join("|");
      if (sig === lastSelSig) return;   // unchanged — don't rebuild (avoids flicker)
      lastSelSig = sig;

      selZoneEl.hidden = false;
      selCountEl.textContent = POOL_TARGET ? "(" + items.length + " of " + POOL_TARGET + ")"
                                           : "(" + items.length + ")";
      selEl.innerHTML = "";
      if (!items.length) {
        selEl.appendChild(el("p", "empty",
          "Nothing selected yet. Pick from Options below — it downloads into the pool folder and starts playing."));
        return;
      }
      var grid = el("div", "find-grid");
      items.forEach(function (m, i) { grid.appendChild(buildSelectedTile(m, i)); });
      selEl.appendChild(grid);
    }

    function buildSelectedTile(m, idx) {
      var isVideo = m.media_kind === "video";
      var tile = el("div", "tile sel-tile");

      var thumb = el(isVideo ? "video" : "img", "tile-media");
      thumb.src = API + m.url;   // already installed — same-origin, no proxy needed
      if (isVideo) { thumb.muted = true; thumb.loop = true; thumb.playsInline = true; thumb.preload = "metadata"; }
      else { thumb.loading = "lazy"; }
      thumb.addEventListener("click", function () {
        preview({ media_kind: m.media_kind, url: API + m.url, local_path: "x" });
      });
      tile.appendChild(thumb);

      var body = el("div", "tile-body");
      body.appendChild(el("div", "tile-meta", "#" + (idx + 1) + " · " + m.filename));
      var status = el("div", "tile-status");
      var row = el("div", "tile-actions");
      var out = el("button", "rm-btn wide", "Unselect");
      out.title = "Move out of the pool — it stops playing and returns to Options";
      out.addEventListener("click", function () { unselect(m, out, status); });
      row.appendChild(out);
      body.append(row, status);
      tile.appendChild(body);
      return tile;
    }

    function unselect(m, btn, statusEl) {
      btn.disabled = true;
      statusEl.className = "tile-status";
      statusEl.textContent = "removing…";
      fetch(API + "/api/v1/dev/media-finder/pool/unselect", {
        method: "POST",
        body: JSON.stringify({ game: GAME, dir: POOL, filename: m.filename })
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok || !res.j.success) {
            statusEl.className = "tile-status err";
            statusEl.textContent = (res.j && res.j.error) ? res.j.error : "failed";
            btn.disabled = false;
            return;
          }
          toast("Unselected — back in Options", "ok");
          // It reappears below as an `origin: "previous"` option, so the decision
          // is one click away from being undone.
          lastSelSig = null; lastSig = null;
          loadSelected(); loadOptions();
        })
        .catch(function () {
          statusEl.className = "tile-status err";
          statusEl.textContent = "server unreachable";
          btn.disabled = false;
        });
    }

    function removeOption(opt) {
      fetch(API + "/api/v1/dev/media-finder/options/remove", {
        method: "POST",
        body: JSON.stringify({ game: GAME, file: FILE, slot_key: KEY, url: opt.url })
      }).then(function () { lastSig = null; loadOptions(); })
        .catch(function () { toast("Remove failed", "err"); });
    }

    // Reset the slot's review decision so the replacement shows as "needs review".
    function clearReviewStatus() {
      if (!FILE) return;
      var note = "replaced via finder " + new Date().toISOString().slice(0, 10);
      fetch(API + "/api/v1/dev/media-review/reviews?game=" + encodeURIComponent(GAME), {
        method: "POST",
        body: JSON.stringify({ file: FILE, slot_key: KEY, status: null, note: note })
      }).catch(function () { /* non-fatal: the grab already landed */ });
    }

    function preview(opt) {
      var overlay = el("div", "overlay");
      overlay.addEventListener("click", function () { overlay.remove(); });
      var media;
      if (opt.media_kind === "video") {
        media = el("video");
        media.src = proxied(opt.url);
        media.controls = true; media.autoplay = true; media.loop = true; media.muted = true; media.playsInline = true;
      } else {
        media = el("img");
        media.src = proxied(opt.url);
        media.referrerPolicy = "no-referrer";
      }
      overlay.appendChild(media);
      document.body.appendChild(overlay);
    }

    function toast(msg, kind) {
      var t = el("div", "toast " + (kind || "ok"), msg);
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 2600);
    }

    // ---- init ----
    if (!GAME) {
      subEl.textContent = "No game id. Open this from a review card.";
      return;
    }
    if (POOL) {
      // A pool block names a folder; every clip inside it plays, cycling one per
      // visit. Say so, because "Select" adds a clip here rather than replacing one.
      subEl.textContent = "Pool: " + POOL + "/ — every clip inside plays, one per visit"
                        + (POOL_TARGET ? " (aiming for " + POOL_TARGET + ")" : "");
      loadSelected();
    }
    loadOptions();
    // One timer for both zones: captures from the Google tab appear within a few
    // seconds, and the pool folder can also change from outside this page. Skipped
    // while the tab is hidden — a backgrounded picker polled forever for a list
    // nobody was looking at, and those requests share the same six connections the
    // Google tab's captures need.
    setInterval(function () {
      if (document.hidden) return;
      loadOptions();
      if (POOL) loadSelected();
    }, 3000);
  })();
  </script>
</body>
</html>
