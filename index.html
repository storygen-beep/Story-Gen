<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Story-Gen — Games</title>
  <link rel="stylesheet" href="portal.css">
  <script src="games-data.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Story-Gen — Games</h1>
      <p class="tagline">Interactive sandbox fiction, built on the Story-Gen engine. Newest first.</p>
    </header>

    <main class="grid" id="games-grid"></main>

    <h2>Dev / test builds</h2>
    <section class="grid dev" id="dev-grid"></section>

    <footer>
      Built with the Story-Gen engine.
    </footer>
  </div>

  <script>
    (function () {
      var mainGrid = document.getElementById("games-grid");
      var devGrid = document.getElementById("dev-grid");

      (window.GAMES || []).forEach(function (game) {
        // Click a card → the details page, not straight into the game.
        var card = document.createElement("a");
        card.className = "card";
        card.href = "game.html?id=" + encodeURIComponent(game.slug);

        var title = document.createElement("h3");
        title.textContent = game.title;
        if (game.badge) {
          var badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = game.badge;
          title.appendChild(document.createTextNode(" "));
          title.appendChild(badge);
        }

        var summary = document.createElement("p");
        summary.textContent = game.summary;

        var affordance = document.createElement("span");
        affordance.className = "play";
        affordance.textContent = game.dev ? "Open →" : "View →";

        card.append(title, summary, affordance);
        (game.dev ? devGrid : mainGrid).appendChild(card);
      });
    })();
  </script>
</body>
</html>
