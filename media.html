<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Media Review — Story-Gen</title>
  <link rel="stylesheet" href="portal.css">
  <script src="games-data.js"></script>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← All games</a>
    <div class="review-head"><h1 id="title">Media Review</h1></div>
    <p class="review-sub" id="sub"></p>
    <div id="filters" class="filters" hidden></div>
    <div id="content"></div>
  </div>

  <script>
  (function () {
    // Local authoring tool — talks to the Django dev server.
    var API = "http://localhost:8000";
    var GAME = new URLSearchParams(location.search).get("id") || "";
    var game = (window.GAMES || []).find(function (g) { return g.slug === GAME; });
    var titleEl = document.getElementById("title");
    var subEl = document.getElementById("sub");
    var filtersEl = document.getElementById("filters");
    var contentEl = document.getElementById("content");

    // Every key in LANE_ORDER (api/v1/media_review.py) needs an entry — a missing one
    // falls through to the raw lane id, which is how "portrait" shipped lowercase and
    // unlabelled since the portrait lane was added.
    var LANE_LABEL = {
      location: "Locations", npc: "NPC", solo: "Solo", story: "Story",
      clothing: "Clothing", phone: "Phone", portrait: "Portraits", other: "Other"
    };
    // ---- filters: three INDEPENDENT axes, ANDed ----
    // These used to be one radio list. Appending nsfw/pool to it would have made
    // "NSFW pools that still need review" — the question actually worth asking —
    // unaskable, because picking a content filter would clear the status filter.
    // Each axis keeps its own selection and every axis has an "all" that opts out.
    var NSFW_BANDS = { explicit: 1, nudity: 1, borderline: 1 };
    function isNsfw(i) { return !!NSFW_BANDS[i.band]; }

    var AXES = [
      { id: "status", label: "Status", options: [
        { key: "all", label: "All", test: function () { return true; } },
        { key: "approved", label: "Approved", test: function (i) { return i.status === "approved"; } },
        { key: "disapproved", label: "Disapproved", test: function (i) { return i.status === "disapproved"; } },
        { key: "needs", label: "Needs review", test: function (i) { return i.found && !i.status; } },
        { key: "missing", label: "Missing", test: function (i) { return !i.found; } }
      ]},
      { id: "band", label: "Content", options: [
        { key: "all", label: "All", test: function () { return true; } },
        { key: "sfw", label: "SFW", test: function (i) { return !isNsfw(i); } },
        { key: "nsfw", label: "NSFW", test: isNsfw }
      ]},
      { id: "shape", label: "Shape", options: [
        { key: "all", label: "All", test: function () { return true; } },
        { key: "pool", label: "Pool", test: function (i) { return !!i.pool_dir; } },
        { key: "single", label: "Single", test: function (i) { return !i.pool_dir; } }
      ]}
    ];

    // The band a card shows. Only `clean` is SFW; the other three are all NSFW but
    // say different things, so the chip is finer-grained than the filter is.
    var BAND_LABEL = {
      explicit: "explicit", nudity: "nudity", borderline: "suggestive", clean: "sfw"
    };

    var state = {
      items: [], laneOrder: [], toml: "", expanded: new Set(),
      filters: { status: "all", band: "all", shape: "all" }
    };

    function axisById(id) {
      return AXES.find(function (a) { return a.id === id; });
    }

    // An item passes when EVERY axis passes. `except` skips one axis, which is how a
    // button count reports "what would I get if I clicked this" rather than a global
    // total that promises results the other axes will filter away.
    function passes(item, except) {
      return AXES.every(function (a) {
        if (a.id === except) return true;
        var sel = state.filters[a.id];
        var opt = a.options.find(function (o) { return o.key === sel; });
        return opt ? opt.test(item) : true;
      });
    }

    function anyFilterActive() {
      return AXES.some(function (a) { return state.filters[a.id] !== "all"; });
    }

    document.title = (game ? game.title : GAME) + " — Media Review";
    titleEl.textContent = (game ? game.title : GAME);

    if (!GAME) {
      subEl.textContent = "";
      contentEl.innerHTML = '<p class="notfound">No game id. Go back and pick a game.</p>';
      return;
    }

    // ---- UI state that survives a reload ----
    // A reload drops `expanded` (a Set) and the scroll offset, which restarts a long
    // review at the top with every lane shut. Anything watching the workspace can
    // cause one — Live Server reloads this page on any file write under its root —
    // so park the three things that cost time to rebuild. Keyed per game, so two
    // games can't inherit each other's scroll position.
    var UI_KEY = "mediaReview:" + GAME;

    function loadUi() {
      try { return JSON.parse(sessionStorage.getItem(UI_KEY) || "{}") || {}; }
      catch (e) { return {}; }
    }

    function saveUi() {
      try {
        sessionStorage.setItem(UI_KEY, JSON.stringify({
          filters: state.filters,
          expanded: Array.from(state.expanded),
          scrollY: window.scrollY
        }));
      } catch (e) { /* private mode / quota — the page still works, it just forgets */ }
    }

    // Read ONCE, before anything renders: later saves overwrite the stored blob, so
    // the restore has to hold its own copy of what was there on arrival.
    var savedUi = loadUi();
    // Validate every restored key against the axis that owns it. An unknown key makes
    // options.find() return undefined, and the old single-axis code then threw on
    // `f.test`; here it would silently disable the axis instead, which is worse —
    // the button bar would show "All" while the list stayed filtered.
    if (savedUi.filters && typeof savedUi.filters === "object") {
      AXES.forEach(function (a) {
        var k = savedUi.filters[a.id];
        if (a.options.some(function (o) { return o.key === k; })) state.filters[a.id] = k;
      });
    } else if (savedUi.filter) {
      // Blob written before the axis split, when `filter` was one status string.
      var statusAxis = axisById("status");
      if (statusAxis.options.some(function (o) { return o.key === savedUi.filter; })) {
        state.filters.status = savedUi.filter;
      }
    }
    if (Array.isArray(savedUi.expanded)) state.expanded = new Set(savedUi.expanded);

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function mediaUrl(item) { return API + item.media_url; }

    // ---- three states, three visuals ----
    // A near-black tile answers three different questions identically: "not started",
    // "still coming", and "will never arrive". Only the last one should be flat.
    // Listeners go on BEFORE .src is assigned: a cached image can fire `load` in the
    // same task, and a listener added afterwards never runs — which would leave a
    // skeleton sitting over a perfectly good image, the same bug inverted.
    function markLoadState(node, label, onBroken) {
      node.classList.add("loading");
      node.title = label;
      function settle() { node.classList.remove("loading"); }
      node.addEventListener("load", settle);        // <img>
      // loadeddata, NOT loadedmetadata: metadata arrives before anything paints, so
      // clearing on it would relabel a still-black box as "loaded".
      node.addEventListener("loadeddata", settle);  // <video>: a frame exists
      node.addEventListener("error", function () { settle(); onBroken(); });
      // Belt and braces for an <img> already complete from the memory cache.
      return function recheck() {
        if (node.complete && node.naturalWidth) settle();
      };
    }

    // ---- the pool's video tile ----
    // Every pool's last tile is its only <video>; tiles 1..n-1 are GIF <img> that
    // animate by themselves, so a paused video beside them reads as broken rather
    // than as a video. Play it when it is actually on screen — muted + playsInline
    // satisfies Chrome's autoplay policy — and pause it when it leaves, so a long
    // review never holds more than a screenful of live decoders.
    // Every <video> this page builds, pool or not — see releaseVideos().
    var liveVideos = [];
    var videoWatcher = ("IntersectionObserver" in window) && new IntersectionObserver(
      function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) { e.target.pause(); return; }
          e.target.preload = "metadata";
          // play() rejects with AbortError whenever a scroll crosses the threshold
          // twice in quick succession. Without the catch that is one unhandled
          // rejection per tile per scroll.
          var started = e.target.play();
          if (started && started.catch) started.catch(function () {});
        });
      }, { threshold: 0.25 });

    function observeVideo(node) {
      if (!videoWatcher) { node.preload = "metadata"; return; }  // no IO: load eagerly
      videoWatcher.observe(node);
    }

    // Detaching a <video> does NOT free its WebMediaPlayer, and Chrome caps how many
    // can exist at once. render() rebuilds every card on every filter click and lane
    // toggle, so without this each toggle stranded another ~100 players; past the cap
    // Chrome refuses to create new ones ("too many WebMediaPlayers already in
    // existence") and those elements fire `error` — which this page would then label
    // "won't load", turning resource exhaustion into a permanent-looking dead file.
    // Measured: 16 lane toggles produced 94 falsely-broken tiles before this existed.
    // Clearing src and calling load() is what actually releases the player.
    function releaseVideos() {
      liveVideos.forEach(function (v) {
        try {
          v.pause();
          v.removeAttribute("src");
          v.load();
        } catch (e) { /* already torn down — nothing to release */ }
      });
      liveVideos = [];
      if (videoWatcher) videoWatcher.disconnect();
    }

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) return;
      liveVideos.forEach(function (v) { v.pause(); });
    });

    // A pool card's preview: one small tile per clip currently in the folder, in
    // the order the game will cycle them, under an "n of target" badge. The
    // shortfall is a SOFT signal — a 2-of-4 pool plays fine, it is just thinner
    // than intended — so it is stated, not flagged as broken.
    function poolBox(item) {
      var items = item.pool_items || [];
      var target = item.pool_target || 0;
      var box = el("div", "pool-box");

      var head = el("div", "pool-head");
      var cls = "pool-count" + (items.length === 0 ? " empty"
                              : (target && items.length < target ? " short" : ""));
      head.appendChild(el("span", cls, items.length + " of " + target));
      head.appendChild(el("span", "pool-dir", item.pool_dir + "/"));
      box.appendChild(head);

      if (!items.length) {
        box.appendChild(el("div", "pool-none", "empty — nothing installed yet"));
        return box;
      }

      var grid = el("div", "pool-grid");
      items.forEach(function (m, i) {
        var wrap = el("div", "pool-cell");
        var url = API + "/games/" + GAME + "/" + m.serve_path;
        var node, recheck;

        // A tile whose bytes are gone used to render as a featureless black
        // rectangle with no signal at all — indistinguishable from one still loading.
        function onBroken() {
          if (videoWatcher) videoWatcher.unobserve(node);
          var gone = el("div", "pool-thumb broken", "⚠ won't load");
          gone.addEventListener("click", function () { window.open(url); });
          if (node.parentNode) node.parentNode.replaceChild(gone, node);
          wrap.classList.add("dead");   // turns the caption, which names the file, red
        }

        if (m.actual_type === "video") {
          node = el("video", "pool-thumb");
          wrap.classList.add("is-video");
          node.muted = true; node.loop = true; node.playsInline = true;
          // "none", not "metadata": this tile used to join the initial stampede of
          // ~275 requests and lose it. Alone it paints in well under a second; under
          // load it was systematically last, which is why it read as broken. The
          // observer loads and plays it once it is actually on screen. #t=0.1 still
          // governs the first painted frame if play() is ever blocked.
          node.preload = "none";
          recheck = markLoadState(node, m.actual_file, onBroken);
          node.src = url + "#t=0.1";
          liveVideos.push(node);
          observeVideo(node);
        } else {
          node = el("img", "pool-thumb");
          node.alt = m.actual_file;   // so even a default broken-image glyph names it
          recheck = markLoadState(node, m.actual_file, onBroken);
          node.src = url; node.loading = "lazy";
        }
        recheck();
        node.addEventListener("click", function () { window.open(url); });
        wrap.appendChild(node);
        wrap.appendChild(el("div", "pool-cap", (i + 1) + ". " + m.actual_file));
        grid.appendChild(wrap);
      });
      box.appendChild(grid);
      return box;
    }

    // ---- save a review (simple request: no custom headers -> no CORS preflight) ----
    // Optimistic, but rolls back item state on failure and only fires onOk (the UI
    // flip) when the server actually persisted — so the card never lies about what's saved.
    function saveReview(item, status, note, tickEl, onOk) {
      var prevStatus = item.status, prevNote = item.note;
      item.status = status;
      item.note = note;
      if (tickEl) tickEl.textContent = "saving…";
      return fetch(API + "/api/v1/dev/media-review/reviews?game=" + encodeURIComponent(GAME), {
        method: "POST",
        body: JSON.stringify({ file: item.file, slot_key: item.slot_key || item.file,
                               status: status, note: note })
      }).then(function (r) {
        if (!r.ok) throw new Error("save failed");
        if (tickEl) { tickEl.textContent = "saved ✓"; setTimeout(function () { tickEl.textContent = ""; }, 1400); }
        if (onOk) onOk();
      }).catch(function () {
        item.status = prevStatus;   // roll back — nothing was persisted
        item.note = prevNote;
        if (tickEl) tickEl.textContent = "save failed — is the server up?";
      });
    }

    function buildCard(item) {
      var card = el("div", "media-card");
      function reflectStatus() {
        card.classList.toggle("approved", item.status === "approved");
        card.classList.toggle("disapproved", item.status === "disapproved");
      }

      // media / placeholder
      //
      // A POOL is a folder of clips the game cycles one per visit, so the question
      // to answer here is "does this SET work" — which one big preview cannot show.
      // Render every member as a small tile instead, in cycle order, so a
      // near-duplicate or an off-tone clip is visible at a glance.
      if (item.pool_dir) {
        card.appendChild(poolBox(item));
      } else if (item.found && item.media_url) {
        // Same three states as a pool tile. These are left eager and keep their
        // controls — this is the asset being judged, and `controls` is already an
        // always-visible "this is a video" marker that no image has.
        var swapInDead = function (elm) {
          return function () {
            var gone = el("div", "media-thumb broken", "⚠ won't load — " + item.file);
            if (elm.parentNode) elm.parentNode.replaceChild(gone, elm);
          };
        };
        if (item.media_type === "video") {
          var v = el("video", "media-thumb");
          v.controls = true; v.loop = true; v.muted = true; v.playsInline = true; v.preload = "metadata";
          var recheckV = markLoadState(v, item.file, swapInDead(v));
          v.src = mediaUrl(item);
          recheckV();
          liveVideos.push(v);
          card.appendChild(v);
        } else {
          var img = el("img", "media-thumb");
          img.alt = item.description || item.file;
          var recheckI = markLoadState(img, item.file, swapInDead(img));
          img.src = mediaUrl(item); img.loading = "lazy";
          recheckI();
          card.appendChild(img);
        }
      } else {
        card.appendChild(el("div", "media-thumb missing", "no media yet"));
      }

      var body = el("div", "media-body");

      var queries = (item.search_queries && item.search_queries.length)
        ? item.search_queries.join("  ·  ")
        : "(no search query)";
      body.appendChild(el("div", "media-query", queries));

      // meta lines
      var meta = el("div", "media-meta");
      function metaLine(k, v) {
        if (!v) return;
        var line = el("div");
        line.appendChild(el("span", "k", k + ": "));
        line.appendChild(document.createTextNode(v));
        meta.appendChild(line);
      }
      if (item.canvas_name && item.lane !== "location") metaLine("canvas", item.canvas_name);
      metaLine("location", item.location_name);
      if (item.lane === "npc") metaLine("npc", item.npc_name + (item.ambient ? " (ambient)" : ""));
      if (item.reused_in && item.reused_in.length) metaLine("also in", item.reused_in.join(", "));
      if (item.description) metaLine("desc", item.description);

      var fileLine = el("div");
      fileLine.appendChild(el("span", "k", "file: "));
      fileLine.appendChild(document.createTextNode(item.file + " "));
      var badge = el("span", "type-badge" + (item.media_type === "video" ? " vid" : ""), item.media_type);
      fileLine.appendChild(badge);

      // Band chip. The band is DERIVED, never authored (nothing in the corpus carries
      // a tier), so the tooltip names the evidence and a caption-derived band is
      // marked `weak`. Without that the filter would present a guess as a fact.
      var band = item.band || "clean";
      var chip = el("span", "band-badge " + band +
                    (item.band_source === "description" ? " weak" : ""),
                    BAND_LABEL[band] || band);
      chip.title = "content band: " + band + " — from " + (item.band_source || "default") +
                   (item.band_source === "description" ? " (inferred from the caption)" : "");
      fileLine.appendChild(document.createTextNode(" "));
      fileLine.appendChild(chip);
      meta.appendChild(fileLine);
      body.appendChild(meta);

      // review controls (found items only)
      if (item.found) {
        var tick = el("div", "saved-tick", "");
        var row = el("div", "review-row");
        var approve = el("button", "rev-btn approve", "Approve");
        var disapprove = el("button", "rev-btn disapprove", "Disapprove");
        function reflectButtons() {
          approve.classList.toggle("on", item.status === "approved");
          disapprove.classList.toggle("on", item.status === "disapproved");
        }
        var note = el("textarea", "media-note");
        note.placeholder = "note…";
        note.value = item.note || "";

        approve.addEventListener("click", function () {
          var next = item.status === "approved" ? null : "approved";
          saveReview(item, next, note.value, tick, function () { reflectButtons(); reflectStatus(); });
        });
        disapprove.addEventListener("click", function () {
          var next = item.status === "disapproved" ? null : "disapproved";
          saveReview(item, next, note.value, tick, function () { reflectButtons(); reflectStatus(); });
        });
        note.addEventListener("blur", function () {
          if (note.value !== (item.note || "")) saveReview(item, item.status || null, note.value, tick);
        });

        row.append(approve, disapprove);
        body.append(row, note, tick);
        reflectButtons();
      }

      // Find media — on every card (fill a missing slot, or replace this one).
      var findRow = el("div", "review-row");
      var findLink = el("a", "rev-btn find", "🔎 Find media");
      findLink.style.textAlign = "center";
      findLink.style.textDecoration = "none";
      var fparams = new URLSearchParams({
        id: GAME,
        file: item.file || "",
        // The slot's stable identity — what its shelf and verdict file under.
        // Equals `file` unless the block authored an `id`, in which case `file`
        // still says where the bytes go and this says which shelf it is.
        slot_key: item.slot_key || item.file || "",
        q: (item.search_queries || []).join(" | ")
      });
      // A POOL slot is a folder of clips the game cycles, so the picker opens in
      // two-zone mode: selected on top, options below. `pool` is the same string
      // as `file` (the folder), which is also the options-store and review key —
      // one identity, so the shelf and the verdicts can never fork.
      if (item.pool_dir) {
        fparams.set("pool", item.pool_dir);
        if (item.pool_target) fparams.set("target", String(item.pool_target));
      }
      findLink.href = "find.html?" + fparams.toString();
      findRow.appendChild(findLink);
      body.appendChild(findRow);

      reflectStatus();
      card.appendChild(body);
      return card;
    }

    function render() {
      // Every card is about to be replaced, so free the media players first — see
      // releaseVideos(). Dropping the elements alone leaks them.
      releaseVideos();
      contentEl.innerHTML = "";
      var visible = state.items.filter(function (i) { return passes(i); });

      // filter bar: one row per axis, live counts
      filtersEl.innerHTML = "";
      filtersEl.hidden = false;
      AXES.forEach(function (axis) {
        var row = el("div", "filter-row");
        row.appendChild(el("span", "filter-legend", axis.label));
        axis.options.forEach(function (opt) {
          // Counted with the OTHER axes applied, so the number on a button is what
          // clicking it actually yields. A global count here would advertise 129
          // NSFW while the active status filter leaves three.
          var n = state.items.filter(function (i) {
            return passes(i, axis.id) && opt.test(i);
          }).length;
          var b = el("button", "filter-btn" + (state.filters[axis.id] === opt.key ? " active" : ""));
          b.appendChild(document.createTextNode(opt.label));
          b.appendChild(el("span", "count", String(n)));
          // saveUi AFTER render, so it records the offset the new content settled at.
          b.addEventListener("click", function () {
            state.filters[axis.id] = opt.key;
            render();
            saveUi();
          });
          row.appendChild(b);
        });
        filtersEl.appendChild(row);
      });

      if (!visible.length) {
        contentEl.appendChild(el("p", "empty", "Nothing matches these filters."));
        return;
      }

      state.laneOrder.forEach(function (lane) {
        var laneItems = visible.filter(function (i) { return i.lane === lane; });
        if (!laneItems.length) return;

        // Collapsed by default; ANY axis off "All" force-expands so results show.
        var expanded = anyFilterActive() || state.expanded.has(lane);

        var section = el("div", "lane-section");
        var header = el("button", "lane-title" + (expanded ? " open" : ""));
        header.appendChild(el("span", "chev", expanded ? "▼" : "▶"));
        header.appendChild(el("span", "lane-name", LANE_LABEL[lane] || lane));
        header.appendChild(el("span", "lane-count", String(laneItems.length)));
        header.addEventListener("click", function () {
          if (state.expanded.has(lane)) state.expanded.delete(lane);
          else state.expanded.add(lane);
          render();
          saveUi();
        });
        section.appendChild(header);

        // Lazy: only build the media DOM (and trigger loads) when expanded.
        if (expanded) {
          var body = el("div", "lane-body");
          if (lane === "npc") {
            // sub-group per character, preserving first-seen order
            var order = [], byNpc = {};
            laneItems.forEach(function (i) {
              var key = i.npc_name || "—";
              if (!byNpc[key]) { byNpc[key] = []; order.push(key); }
              byNpc[key].push(i);
            });
            order.forEach(function (key) {
              body.appendChild(el("div", "npc-subhead", key));
              var grid = el("div", "media-grid");
              byNpc[key].forEach(function (i) { grid.appendChild(buildCard(i)); });
              body.appendChild(grid);
            });
          } else {
            var grid2 = el("div", "media-grid");
            laneItems.forEach(function (i) { grid2.appendChild(buildCard(i)); });
            body.appendChild(grid2);
          }
          section.appendChild(body);
        }
        contentEl.appendChild(section);
      });
    }

    function showOffline() {
      filtersEl.hidden = true;
      subEl.textContent = "";
      var box = el("div", "offline");
      box.innerHTML =
        "This is a <strong>local authoring tool</strong>. It reads your games and media from " +
        "the Django dev server, which isn't reachable.<br><br>Start it with " +
        "<code>python manage.py runserver</code> (from <code>story_gen_django/</code>), then reload.";
      contentEl.innerHTML = "";
      contentEl.appendChild(box);
    }

    // The server answered but with an error (e.g. unknown game / no TOML) — show
    // the real reason rather than the misleading "server is down" panel.
    function showError(msg) {
      filtersEl.hidden = true;
      subEl.textContent = "";
      var box = el("div", "offline");
      box.appendChild(el("strong", null, "Couldn't load this game. "));
      box.appendChild(document.createTextNode(msg || "Unknown error."));
      contentEl.innerHTML = "";
      contentEl.appendChild(box);
    }

    // Throttled: scrolling a long lane fires constantly and the blob is tiny, but
    // there's no reason to write it 60 times a second. `pagehide` catches the final
    // offset on the way out — it fires on reload AND on ordinary navigation, so
    // clicking "🔎 Find media" and coming back lands you where you left.
    var scrollTimer = null;
    window.addEventListener("scroll", function () {
      if (scrollTimer) return;
      scrollTimer = setTimeout(function () { scrollTimer = null; saveUi(); }, 250);
    }, { passive: true });
    window.addEventListener("pagehide", saveUi);

    // ---- load ----
    fetch(API + "/api/v1/dev/media-review/list?game=" + encodeURIComponent(GAME))
      .then(function (r) {
        if (!r.ok) {
          return r.json().catch(function () { return {}; }).then(function (j) {
            var e = new Error(j.error || ("HTTP " + r.status));
            e.http = true;  // the server answered — not a connectivity problem
            throw e;
          });
        }
        return r.json();
      })
      .then(function (data) {
        state.items = (data.items || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
        state.laneOrder = data.lane_order || ["location", "npc", "solo", "story", "clothing", "phone", "other"];
        state.toml = data.toml || "";
        var c = data.counts || {};
        subEl.textContent = (c.found || 0) + " media · " + (c.missing || 0) + " missing · " +
          (c.approved || 0) + " approved · " + (c.disapproved || 0) + " disapproved · " +
          (c.nsfw || 0) + " nsfw / " + (c.sfw || 0) + " sfw · " +
          (c.pool || 0) + " pools / " + (c.single || 0) + " single" +
          (state.toml ? "  ·  " + state.toml : "");
        render();
        // After render, not before: the page is empty until this fetch resolves, so
        // the browser's own scroll restoration has nothing to scroll to. Tiles
        // reserve their height via `aspect-ratio` (portal.css .pool-thumb /
        // .media-thumb), so the layout is already full size before any media loads
        // and a plain scrollTo lands in the right place.
        if (savedUi.scrollY) window.scrollTo(0, savedUi.scrollY);
      })
      .catch(function (err) {
        if (err && err.http) showError(err.message); else showOffline();
      });
  })();
  </script>
</body>
</html>
