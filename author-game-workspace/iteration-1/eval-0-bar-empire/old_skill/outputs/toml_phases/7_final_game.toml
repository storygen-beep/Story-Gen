# Phase 5 — 5_scenes.toml
# Bar Empire (baseline) — setup scaffold: the spine quest card ONLY.
# Story canvases (hubs / ambients / capstones) are BEATS, appended here later.

# ─── Spine quest card (no npc_id → top "Story Goals") ─────────────────────────
# The central pressure from the premise/economy: get back on the floor, then take
# the bar. Slice-setup ships the first rung (get hired); the chain extends per beat.

[[quest_cards]]
text       = "Twenty dollars and a month's rent due. The Velvet Spur is hiring its floor back — and the man who runs it is the one I have to get through."
ready_text = "Marco's at the end of the bar."
tip        = "Walk into the Spur. Ask for the floor back."
when = [
  { flag = "hired_at_spur", op = "is_false" },
]


