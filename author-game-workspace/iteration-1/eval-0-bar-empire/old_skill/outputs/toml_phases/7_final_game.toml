description = "Hire capstone. Type A linear, auto-fire. Marco puts Dahlia back on the floor and makes sure she knows what it costs her. Sets hired_at_spur + marco_noticed. Opens the Marco floor hub + the work shift."

[canvases.trigger]
location      = "loc_spur_floor"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", items = [
  { type = "flag", subject = "player", flag_key = "hired_at_spur", operator = "is_false" },
] }

[[canvases.nodes]]
id   = "intro"
name = "The Velvet Spur — walking back in"
blocks = [
  { type = "paragraph", content = "The pink light hasn't changed and neither has the smell — spilled well-liquor and the fryer they never clean right. Marco's at the end of the bar where he always is, and he watches her cross the whole floor before he lets his face do anything at all. He sets down the glass he's been not-drinking from and looks at her the way a man looks at a number he's deciding whether to round up." },
  { type = "paragraph", content = "\"Dahlia.\" He says it like he's confirming inventory. \"You came back. They always come back to me, eventually — the rent does it, or the boyfriend does it, or the city does it.\" The bottom half of his face smiles. The top half keeps counting. \"Floor's open. Same as before, except now you know exactly what kind of man you're working for, and you walked in anyway. I like knowing that about a girl on day one.\"" },
  { type = "cascade", props = { beats = [
    { advance_text = "Ask what the split is.", blocks = [
        { type = "paragraph", content = "\"Tips are yours. The rest is mine. And there's a tab you're carrying from before — don't look surprised, I keep every number in this place.\" He taps the bar once with the gold ring. \"You'll work it off. One way's the till. There's others. We'll see which kind of girl you turn out to be.\"" },
        { type = "thought_bubble", props = { speaker = "player" }, content = "He thinks the leash runs one direction. Let him." },
    ] },
  ] } },
]

