# Fingerprint: trigger_mode=manual, is_repeatable=true, location+npc set, schedules
# covering Marco's floor window. Base = one constant paragraph (D56-R1, not tiered).
# Choices = the escalation ladder; tease/contact rungs locked-visible (greyed span,
