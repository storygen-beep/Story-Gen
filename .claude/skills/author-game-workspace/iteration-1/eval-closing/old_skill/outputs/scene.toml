# wren_confront_renner — one-shot story turn. Wren stops being cheap invisible hands and has
# it out with Renner in the office: she names what she found in the yard and turns it into
# leverage. Charged exchange advanced one line at a time (cascade). Ends on her private thought
# about the trade she just made — being SEEN — before she leaves. Third person, RTS-flat,
# dialogue-dominant. Gated renner_office_open (office access) + cover + a self-guard; SETS
# renner_confronted on exit.
[[canvases]]
id          = "wren_confront_renner"
name        = "Have it out with him"
description = "One-shot confrontation @renner_depot (the office). Wren names the yard and turns it to leverage. Cascade — one line per click. Closes on her single rationed thought_bubble, then she leaves. Gated renner_office_open + cover_dockhand; SETS renner_confronted."

[canvases.trigger]
location      = "renner_depot"
requires_npc  = "npc_renner"
is_repeatable = false
priority      = 9
is_active     = true
conditions = { version = "1.0", logic = "AND", items = [
  { type = "flag", subject = "player", flag_key = "renner_hired",      operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "renner_office_open", operator = "is_true"  },
  { type = "flag", subject = "player", flag_key = "renner_confronted",  operator = "is_false" },
  { type = "clothing_item", item_id = "cover_dockhand", operator = "equipped" },
] }
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "09:00"
end_time   = "18:00"

[[canvases.nodes]]
id   = "base"
name = "Have it out with him"
blocks = [
  { type = "image", props = { file = "scenes/renner_office.jpg", description = "A cramped glassed-in warehouse back office, a heavyset man at the desk with a ledger and a bottle, a woman standing across from him not sitting.", search_queries = ["warehouse office desk man ledger", "man desk bottle office woman standing"] } },
  { type = "paragraph", content = "She doesn't sit. She shuts the door and stays on her feet, on the wrong side of his desk." },
  { type = "cascade", props = { beats = [
    { advance_text = "Open on it.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_renner" }, content = "Invoices won't do themselves. Sit down." },
        { type = "dialog", props = { speaker = "player" }, content = "I've seen the yard. Past the fence, where your men turn people back." },
    ] },
    { advance_text = "Let it land.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_renner" }, content = "Nothing out there but slag and a fence I keep up so nobody gets hurt. You went past it, you're already fired. Get your coat." },
        { type = "paragraph", content = "She doesn't move. Her hands stay open at her sides." },
    ] },
    { advance_text = "Name it.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "There are families under that slab. You didn't torch the yard — Cain did, to pay you back for it, and you've been out there since, burying it deeper." },
        { type = "paragraph", content = "The bottle stops halfway to his mouth." },
    ] },
    { advance_text = "Wait him out.", blocks = [
        { type = "dialog", props = { speaker = "npc", npcId = "npc_renner" }, content = "...You don't know what you're standing in. Whatever you think you've got, girl, men have gone in the water for less. You included." },
        { type = "paragraph", content = "His voice has gone quiet. Quiet is worse." },
    ] },
    { advance_text = "Don't flinch.", blocks = [
        { type = "dialog", props = { speaker = "player" }, content = "Then someone already knows where to look if I stop coming in. So you don't touch me. You keep me on. And you start telling me who Cain answers to." },
        { type = "paragraph", content = "Her chest stays even. She's surprised how even." },
    ] },
    { advance_text = "Make him answer.", blocks = [
        { type = "paragraph", content = "He sets the bottle down. Looks at her — really looks, the first time he ever has." },
        { type = "dialog", props = { speaker = "npc", npcId = "npc_renner" }, content = "...Who are you. You're not cheap hands. Cheap hands don't walk in like they've already won." },
    ] },
    { advance_text = "Leave it there.", blocks = [
        { type = "paragraph", content = "She doesn't answer that. She lifts her coat off the chair and turns for the door." },
        { type = "thought_bubble", props = { speaker = "player" }, content = "She walked in as a thing he never watched. She's walking out as one he'll never stop watching now. That was hers to spend, and she spent it — on purpose." },
    ] },
  ] } },
]

[canvases.nodes.exit_block]
type = "location"
text = "Back to the floor."

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "renner_depot"
time_progression_minutes = 30
flagEffects = [
  { targetType = "player", flag = "renner_confronted", op = "set" },
]
