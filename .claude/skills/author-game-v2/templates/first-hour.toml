# =============================================================================
# The First Hour — <game title>
#
# Copy into games/<slug>/toml_phases/2_one_shots.toml.
# Doctrine and the evidence behind every rule: references/the-first-hour.md
#
# THE ONE RULE: the game does not use a name until it has earned it.
#               People, places, things.
#
# ⚠️ THIS FILE IS A MENU. Section A offers TWO opening shapes and you DELETE ONE.
#    Keeping both, or blending them, is the measured defect (F1) — a cold open
#    carrying a staged open's cast, which is where every v2 game landed.
#
# ⚠️ EVERY WORD IN A TEMPLATE IS BEING TAUGHT. Nothing below is real prose; all
#    of it is <placeholder>. The last time this skill shipped a filled-in example
#    five games copied its dialect. references/register.md, "The words the player
#    has to already own".
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# A · THE OPENING — pick ONE of A1 / A2, delete the other
# ─────────────────────────────────────────────────────────────────────────────
#
#   A1  COLD OPEN    names NOBODY · her situation and the pressure · the cast
#                    arrives via section B.   corpo-life · the-company · DoL
#
#   A2  STAGED OPEN  one person at a time, on screen and SPEAKING, each stating
#                    what they want.   friends-of-mine · patriarch · destroyer
#
#   The two shapes are separated by WHO IS NAMED, not by length. This block
#   carried word counts (60-300 / 700+) until 2026-08-24; they came from a walk
#   that could not read setter links or <a data-passage> anchors, and no rebuilt
#   walker reproduces them. See the-first-hour.md F1.
#
#   There is no third option. The middle — a short opening carrying a long
#   opening's cast — is what this file exists to stop.


# ── A1 · COLD OPEN ───────────────────────────────────────────────────────────
# The boot. It names the situation and the pressure. It names NO ONE.
[[canvases]]
id   = "canvas_opening"
name = "<Opening>"
description = "<Boot. Where she is, what is squeezing her, what she has to do today. NO NAMES. Sets opening_done.>"

[canvases.trigger]
location      = "<start_location>"
is_repeatable = false
priority      = 12
is_active     = true

[[canvases.nodes]]
id   = "<first_node>"
name = "<Screen title>"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "<Who she is and where. One or two sentences.>"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "<The pressure. What is owed, to whom, by when — no character names.>"

[canvases.nodes.exit_block]
type = "location"
text = "<Named next action — a verb, not a mood. the-voice.md R1.>"

[canvases.nodes.exit_block.config]
destinationType = "specific"
locationId      = "<landing_location>"
# ⚠️ F3 — THE HANDOVER TIME IS COMPUTED, NOT FELT.
#    starting_hour + 3 min per undeclared node exit + this number = the clock the
#    player lands on. Check that something at <landing_location> is OPEN at that
#    minute. A `trigger_mode = "random"` ambient does not count; neither does a
#    `substitution_only` walk-in. A game shipped landing at 07:36 in a room whose
#    only content opened at 08:00.
time_progression_minutes = 30

[[canvases.nodes.exit_block.config.flagEffects]]
targetType = "player"
flag       = "opening_done"
op         = "set"


# ── A2 · STAGED OPEN ─────────────────────────────────────────────────────────
# Delete A1 if you use this. Same boot canvas, but the chain continues and each
# character ENTERS: described, named after their role, and SPEAKING. F6 + F7.
#
# [[canvases.nodes]]
# id   = "<second_node>"
# name = "<Screen title>"
#
# [[canvases.nodes.blocks]]
# type    = "paragraph"
# content = "<Their entrance. Give the ROLE first — 'your closest friend', 'one of your father's girls'. The name comes after it, in the same sentence.>"
#
# [[canvases.nodes.blocks]]
# type  = "dialog"
# content = "<Their first line states what they WANT. Not a greeting, not a bio.>"
# [canvases.nodes.blocks.props]
# speaker = "npc"
# npcId   = "<npc_id>"
#
# ⚠️ Where the player cannot yet know the name, use speaker = "unknown" and the
#    engine prints "Stranger:" (v2.py:14600-14606).


# ─────────────────────────────────────────────────────────────────────────────
# B · THE MEETING — one per character, and the hub sits behind it
# ─────────────────────────────────────────────────────────────────────────────
#
#   F5. A repeatable `npc =` hub with no gate IS the introduction, and that is
#   the forbidden shape. All six v2 games shipped it for their whole cast.
#
#   Field size: median 101 words, 66% under 150, 64% with somebody speaking.
#   Ours, already correct: the_inheritance/canvas_meet_audrey — 125 w, 4 dialog.

[[canvases]]
id   = "<canvas_meet_npcid>"
name = "<Meeting NAME — must differ from the hub's name>"
description = "<First contact. Why here, why now. Sets <npc>_met.>"

[canvases.trigger]
location      = "<where they actually are>"
requires_npc  = "<npc_id>"
is_repeatable = false
priority      = 10
is_active     = true

# ⚠️ F5 — `requires_npc` DOES NOT GATE AUTO-FIRE. Verified:
#    getStoryCanvasRedirect (v2.py:4921) -> selectAutoFireCanvasForLocation
#    (v2.py:4453) -> isCanvasValid (v2.py:4573), which reads schedules,
#    conditions and repeatability and NEVER reads requiresNpc. The field is only
#    consumed at v2.py:5259 (random encounters) and v2.py:5332 (substitutions).
#    Keep it — it is free and it documents intent — but the SCHEDULE below is
#    what actually stops this firing in an empty room.
[[canvases.trigger.schedules]]
weekdays   = [0, 1, 2, 3, 4, 5, 6]
start_time = "<matches this character's own schedule row>"
end_time   = "<matches this character's own schedule row>"

[canvases.trigger.conditions]
version = "1.0"
logic   = "AND"
# ⚠️ A conditions block without version = "1.0" FAILS OPEN — the engine returns
#    true and the meeting cold-spawns at game start (v2.py:3534).
[[canvases.trigger.conditions.items]]
type      = "flag"
subject   = "player"
flag_key  = "opening_done"
operator  = "is_true"
[[canvases.trigger.conditions.items]]
type      = "flag"
subject   = "player"
flag_key  = "<npc>_met"
operator  = "is_false"

[[canvases.nodes]]
id   = "<meet_node>"
name = "<Screen title>"

[[canvases.nodes.blocks]]
type    = "paragraph"
content = "<The pretext — why this meeting happens here, now. Then the ROLE, then the name, then one line of character read.>"

[[canvases.nodes.blocks]]
type    = "dialog"
content = "<Their first line. It states a want or a role. A person, not a meter waiting to be raised.>"
[canvases.nodes.blocks.props]
speaker = "npc"
npcId   = "<npc_id>"

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "<Named next action.>"
targetType = "location"
locationId = "<where they are>"
[[canvases.nodes.exit_block.choices.flagEffects]]
targetType = "player"
flag       = "<npc>_met"
op         = "set"

# ── the hub — separate canvas, gated on the flag above ───────────────────────
#
# ⚠️ F8 — ONE FLAG PER CHARACTER. A single `doors_open` / `arrival_done` that
#    opens four people's hubs is the cold-spawn hub wearing a coat, and three v2
#    games shipped exactly that. One flag may open the same character's talk hub
#    AND their sex hub; it may never open a second character's door.
#
# ⚠️ F5b — `npc` GOES INSIDE `[canvases.trigger]`, AND IT IS NOT `requires_npc`.
#    This block used to be COMMENTED OUT, which made `requires_npc` — live in the
#    two blocks above — the only NPC key an author could copy. A game was then
#    authored with `npc` on `[[canvases]]` instead, one level too high, on all
#    thirteen of its character surfaces. `TemplateCanvas` has no `npc` field
#    (template_import.py:906-913): the key was dropped with no error and no warning,
#    the game shipped with ZERO portraits, and every character surface rendered as a
#    text link labelled with the canvas's own title. See references/the-first-hour.md F5b.

[[canvases]]
id   = "<hub_npcid_place>"
name = "<A DIFFERENT name from the meeting canvas>"

[canvases.trigger]
location      = "<where they are>"
npc           = "<npc_id>"     # THE PORTRAIT. Also the presence gate: the renderer
                               # checks this character's own [[npcs.schedules]] against
                               # where the player is standing (v2.py:5194-5199). Without
                               # it there is no face, no presence check, and the link
                               # label becomes `name` above — tokens and all.
requires_npc  = "<npc_id>"     # NOT a substitute for `npc` — it draws no face. It DOES
                               # gate: read on three paths since 2026-09-03 — random
                               # ambients, substitution targets, and the solo lane
                               # (_npcPresentForCanvas). On a canvas with `npc` set the
                               # portrait's own check is stricter, so this is belt and
                               # braces here; on a solo-lane row it is the only gate.
is_repeatable = true
priority      = 6
is_active     = true           # the author's off switch, and it works since 2026-09-03.
                               # false = never surfaces on its own (no auto-fire, no lane
                               # row, no random roll, no schedules-page entry) — but STILL
                               # reachable as a substitution target. `substitution_only`
                               # is the field for "dispatcher only"; this one is "off".

[canvases.trigger.conditions]
version = "1.0"
logic   = "AND"
[[canvases.trigger.conditions.items]]
type     = "flag"
subject  = "player"
flag_key = "<npc>_met"
operator = "is_true"


# ─────────────────────────────────────────────────────────────────────────────
# C · THE PLACE SAYS WHAT IT IS — and that is the description, not a scene
# ─────────────────────────────────────────────────────────────────────────────
#
#   F9. A location's own `description` says what kind of place this is and what
#   happens here. It is the only surface the player sees on EVERY visit — the
#   twentieth included — so "what is this place" is a standing question, not a
#   first-entry one. That field lives in templates/board.toml, NOT here. This
#   section is only about whether you ALSO owe a one-time scene, and usually you
#   do not.
#
#   ⚠️ THE FIRST-VISIT CANVAS IS A MINORITY DEVICE. DO NOT REACH FOR IT FIRST.
#      Across the 26-game corpus it is ONE game (degrees-of-lewdity: 258 branches,
#      117 flags); EIGHTEEN games have none at all. A gate here used to require
#      one and was DELETED 2026-08-26, after it sent an author to write nine
#      arrivals that were reverted the next day. What checks F9 now is
#      `lint · the place says what it is`, which reads descriptions and never
#      asks for a canvas.
#
#   ⚠️ THE MEASURED FAILURE WAS A DESCRIPTION, NOT AN ABSENT SCENE. A game
#      declared its anchor at 27% of the whole word budget and described it as
#      "…and under them forty machines" — forty machines of WHAT. Long, specific,
#      well written, and it never named the business. Adding an arrival scene
#      would not have fixed it; naming the function in the description does.
#
#   TAKE ONE ONLY when a place has a genuinely ONE-TIME thing to say: a door that
#   was locked and now is not, an arrival that changes her standing. Then a
#   non-repeatable canvas bound to the location auto-fires on entry
#   (setup.selectAutoFireCanvasForLocation, v2.py:4459) — no new primitive.
#   Otherwise DELETE the block below. references/the-first-hour.md F9.

[[canvases]]
id   = "<canvas_first_visit_place>"
name = "<First time in NAME>"
description = "<The ONE-TIME thing this place has to say. Fires once. Delete if there isn't one.>"

[canvases.trigger]
location      = "<location_id>"
is_repeatable = false
priority      = 11
is_active     = true

[[canvases.nodes]]
id   = "<first_visit_node>"
name = "<Screen title>"

[[canvases.nodes.blocks]]
type    = "paragraph"
# NOT "what kind of place this is" — that is the location's description, on every
# visit. This is the thing that is true ONCE: what changed, what she is seeing
# that she will not see again.
content = "<The one-time thing.>"

[canvases.nodes.exit_block]
type = "choices"

[[canvases.nodes.exit_block.choices]]
text       = "<Named next action.>"
targetType = "location"
locationId = "<location_id>"
